schema_version: 1
campaign_id: campaign_lucan
object_type: growth_ledger
status: active
rule_ref: system/companion-growth.md
source_refs: [retcon_000103, retcon_000105, retcon_000109, retcon_000110, retcon_000114, retcon_000115]
as_of_event_id: event_turn_interlude_276
note: >-
  Rejestr growth_bank trzymany OSOBNO od instancji. Obejmuje TAKZE pc_lucan (retcon_000112), bo runtime przepisuje pliki
  state/instances/*.yaml przy kazdym commicie tury i nieznane klucze moglyby zostac zgubione.
  To jest miejsce prawdy dla nadwyzki i dojrzalosci; instancje trzymaja zbiornik i integralnosc.
  NIE dodawac tego pliku do active_refs - budzet aktywnego kontekstu to 40 KB. Od 2026-09-04
  jest natomiast OSIAGALNY WARUNKOWO: gm.ps1 context plan --tag companion_growth_matters.
  Wczesniej nie prowadzila do niego zadna droga i wlasnie dlatego tura 178 wymyslila stawki
  od nowa (retcon_000114).
  UWAGA DLA NARRATORA (retcon_000114): ten plik NIE JEST w `load` z briefu i wlasnie dlatego
  w turze 178 zostal pominiety, a stawki wymyslone od nowa w instancjach. Przed kazda tura
  dotyczaca rozwoju, nadwyzki, dojrzewania albo karmienia sieci - przeczytaj go.
ladder:
  source_refs: [retcon_000105, retcon_000180]
  scale_note: >-
    JEDNA DRABINA DLA WSZYSTKICH OKAZOW, x10 DLA LUCANA (retcon_000180). Klas posrednich nie ma -
    gracz rozstrzygnal wprost, ze Spidey "nie jest specjalny, tylko jest juz powyzej 30".
    Progi sa narastajace w growth_bank, nie za szczebel.
  thresholds_adjustable: true
  lucan_multiplier: 10
  rungs:
  - {rank: 0, id: fresh, threshold: 0, lucan_threshold: 0, mind: 'Wykonuje rozkaz doslownie i gubi go, gdy warunki sie zmienia.'}
  - {rank: 1, id: settled, threshold: 10, lucan_threshold: 100, mind: 'Trzyma rozkaz staly. Wlasny gest i wlasny timing.'}
  - {rank: 2, id: judging, threshold: 30, lucan_threshold: 300, mind: 'Wybiera SPOSOB wykonania.'}
  - {rank: 3, id: seasoned, threshold: 60, lucan_threshold: 600, mind: 'Ocenia sytuacje. Odstepuje od litery rozkazu, gdy litera szkodzi celowi.'}
  - {rank: 4, id: autonomous, threshold: 110, lucan_threshold: 1100, mind: 'Stawia sobie podcele i dziala bez rozkazu w swojej dziedzinie.'}
  - {rank: 5, id: thinking, threshold: 180, lucan_threshold: 1800, mind: 'Wnioskuje o tym, czego nie widzial. Laczy meldunki. Dzieli sie pamiecia.'}
  - {rank: 6, id: distinct, threshold: 280, lucan_threshold: 2800, mind: 'Ma wlasne zdanie i je WYRAZA - glos, preferencje, niechec, odmowa.'}
  - {rank: 7, id: companion, threshold: 420, lucan_threshold: 4200, mind: 'Wlasna wola. Wejscie do companion_class (retcon_000179): sluzy z przywiazania, a Lucanowi zostaje weto, ktorego uzycie NISZCZY RELACJE.'}
  grants_per_step:
    reservoir_and_integrity: '+1 pojemnosci zbiornika, +2 integralnosci'
    body: >-
      JEDNO DOSTOSOWANIE CIALA DO FUNKCJI. Kierunku NIE wybiera gracz ani narrator - czyta sie go
      z tego, co okaz FAKTYCZNIE ROBI: posterunek, staly rozkaz, historia uzycia. Zuk kopiacy
      dostaje latwiejsze kopanie, zuk magazynujacy pojemnosc i mniejszy uplyw, wij mapujacy pamiec
      trasy, Spidey od spec-ops cisze i wybor drogi, zawisak pokrycie i cichy lot. TEST: jesli nie
      umiesz powiedziec, co ten okaz robil przez ostatnie dni, nie umiesz przyznac mu szczebla.
      Wypowiedziana intencja Lucana NIE jest zrodlem kierunku.
    mind: 'Posuniecie na osi umyslu - tresc w rungs[].mind. Dla Lucana kolumna umyslu nie obowiazuje.'
    lucan_instead_of_mind: >-
      Lucan placi szczeble z listy retcon_000112: pokrycie braku snu, szybsze uczenie sie, przyrost
      miesni, lepsza pamiec, +1 pojemnosci rezerwy. Efekty nie sa oczywiste z zewnatrz - w zasiegu
      jest dzis jedna osoba, ktora moglaby zauwazyc: npc_mara.
experience_credit:
  source: retcon_000180
  rate: '+1 do banku za SCENE, w ktorej okaz faktycznie wykonal swoja funkcje i cos z tego wyniklo'
  why: >-
    retcon_000105 dawal posterunkowi z zadaniem i zerem 0,0 na dobe, czyli okaz UZYWANY do pracy
    nie dojrzewal, a dojrzewal wylacznie ten, kto lazil luzem. Gracz to odwrocil slowami
    "urosl przy tym przejsciu" o Spideyu w t_276. Staly rozkaz przestaje byc kara za rozwoj.
  bookkeeping: >-
    SKLADNIK OSOBNY, ksiegowany ZA ZDARZENIE, nie za dobe - stawki w daily-balance.yaml zostaja
    bez zmian. tools/growth_settle.py tego NIE liczy, bo nie wie, ktora scena byla robota; wpis
    robi narrator recznie w turze, w ktorej praca sie wydarzyla.
drain_yield:
  source: retcon_000180
  rule: >-
    Bezposrednie wyssanie ZYWEGO wpada do banku W CALOSCI, z pominieciem sufitu przyjecia.
    To jest cala tresc zdania gracza "bedzie musial w koncu wyssac cos duzego".
  living_targets: {maly_szczur_ptak_kot: 2, sredni_pies_owca_cielak: 10, doroslty_czlowiek: 30, duze_zwierze_kon_wol: 60}
  undead_targets: >-
    NIE DAJA ROZWOJU. Wyssany nieumarly oddaje swoj zbiornik do REZERWY i tyle - retcon_000018,
    pajak dal 3 jednostki. Ta czesc retcon_000151 zostaje w mocy.
surplus_economy:
  source: retcon_000115
  declared_by: player_declaration_2026_08_31_bracket
  daily_network_surplus: >-
    Parenascie jednostek na dobe. Suma stawek z tego pliku daje 14,5 na dobe generowane
    przez siec (bez wlasnej regeneracji Lucana, ktora wynosi osobno 6,0 na dobe).
    SPROSTOWANIE 2026-09-04, LICZBA WYZEJ JEST NIEAKTUALNA: suma stawek w tym pliku wynosi dzis
    20,0 na dobe, a nadwyzka GENEROWANA PRZEZ SIEC to 16,5 - roznica 3,5 to stawka
    spy_beetle_01, ktorego od t_179 Lucan laduje z WLASNEJ rezerwy (retcon_000141), wiec
    wliczanie jej do sumy sieci liczy te sama energie dwa razy. Wpis zuka nosi od teraz pole
    funded_by: lucan_reserve, zeby to bylo widac bez czytania basis. 16,5 zgadza sie z basis
    spy_cellar_spider_04 ('generowana nadwyzka sieci 17,5 -> 16,5' na t_183). Dawne 14,5 to po
    retcon_000141 stawka LUCANA, nie sieci - nota powstala przed tym retconem. Liczba jest teraz
    TAKZE POLEM (daily_network_surplus_units) i pilnuje jej kontrola tools/reconcile_growth.py
    --check, wiec nie rozjedzie sie po cichu.
  daily_network_surplus_units: 22.3
  daily_network_surplus_units_basis: >-
    Suma rate_per_day wezlow AKTYWNYCH z pominieciem wpisow z funded_by: lucan_reserve. Stan na
    event_turn_interlude_260. Pilnowane przez tools/reconcile_growth.py --check.
    ZMIANA 2026-09-12 (retcon_000175): 19,8 -> 22,3 - szczury na zerze obfitym (2,0 + 2,0 + 1,0
    zamiast 1,0 + 1,0 + 0,5). Wczesniej tego dnia (t_274, retcon_000172): 21,8 -> 19,8. Zawisak zszedl z kosza jedwabnikow na wlasny nektar
    (3,0 -> 0,0, minus 3,0: zbiera 2,0 i tyle samo zjadaja jego symbionty), a z blatu wyszly dwa
    biegaczowate jako spy_beetle_09 i spy_beetle_10 (plus 1,0). Wczesniej, ZMIANA 2026-09-11 (retcon_000167): 16,5 -> 18,3. Roznica 1,8 to NOWY, ZEWNETRZNY doplyw -
    trzy kanaly w niszy pod polnocnym fundamentem kaplicy, odbierane przez spy_beetle_01.
    Nie jest to energia Lucana zawrocona drugi raz, wiec wchodzi do sumy sieci; dawne 3,5
    z jego rezerwy wypadlo, bo ladowanie z reki przestalo byc potrzebne.
  growth_intake_cap: >-
    Wezel wchlania w ROZWOJ najwyzej POLOWE WLASNEJ POJEMNOSCI ZBIORNIKA na dobe.
    Zbiornik 3 daje wiec sufit 1,5 na dobe, zbiornik 6 sufit 3,0, zbiornik 12 sufit 6,0,
    a Lucan przy 15 sufit 7,5. Odczyt narratora: "1/2 calej baterii" = polowa pojemnosci
    ODBIORCY. Gdyby gracz mial na mysli polowe LACZNEJ nadwyzki sieci, wystarczy jedno
    slowo i przeliczam - roznica dotyczy dzis tylko Zawisaka, wijow i zuka 01.
  overflow_rule: >-
    Nadmiar ponad sufit rozwoju NIE PRZEPADA (retcon_000109) - jest rozdzielany pomiedzy
    pozostale obiekty sieci, ze zwyklymi stratami propagacji
    (companions/webber-network.yaml#network_cost_model).
  lucan_is_a_node: >-
    LUCAN JEST OBIEKTEM W SIECI JAK POZOSTALE WEZLY - odbiera rozdzielana nadwyzke bez
    osobnego rozkazu i bez czekania na wlasny sufit. To zamyka dzwignie, ktora t_178
    zostawil otwarta jako "rozkaz niewydany": deklaracja gracza JEST tym rozkazem.
    DOPRECYZOWANE retconem 000141 - nie jest wezlem ROWNORZEDNYM, jest wezlem
    PIERWSZYM. Patrz distribution_priority.
  varkhen_excepted: >-
    Varkhen zostaje poza rozdzialem - cztery lacza podtrzymujace to racjonowana struga
    ustawiona przez Lucana (retcon_000113). Nie liczyc mu tego jako zmarnowanej okazji.
distribution_priority:
  source: retcon_000141
  declared_by: player_declaration_2026_09_03
  rule: >-
    "Lucan ma prio nad wszystkim innym - to jego siec, nieumarli z kolei najpierw
    rozwijaja anchory a dopiero pozniej plebs." Kolejnosc jest TWARDA, nie proporcjonalna:
    nizszy szczebel dostaje dopiero to, czego wyzszy nie przyjmuje.
  order:
  - {rank: 1, who: pc_lucan, takes: 'rezerwa do sufitu 15, potem wlasny growth_bank (sufit 7,5 na dobe)'}
  - {rank: 2, who: 'okazy ZAKOTWICZONE - companion_spidey, spy_beetle_01, spy_hawk_moth_01, webber_anchored', takes: 'zbiornik, potem growth_bank do polowy wlasnej pojemnosci na dobe', ref: campaigns/lucan/planning/anchored-companions.yaml#anchored}
  - {rank: 3, who: 'pozostale okazy (zuki 02-08, wije, cma, osa, pajaki piwniczne, webber_home/tannery/dump)', takes: reszta}
  outside_the_ladder: >-
    Varkhen - racjonowana struga 1,0 na wejsciu / 0,8 na wyjsciu, ustawiona decyzja
    Lucana (retcon_000113). Nie podlega drabinie i nie liczy sie jako zmarnowana okazja.
    OD t_263 (korekta retcon_000168) NIE DOSTARCZA JEJ NIKT Z SIECI: Varkhen lezy na cmentarzu
    i zywi go TLO, ktore daje tyle samo, co dawaly cztery lacza (0,8 na dobe plus 0,8
    integralnosci, rejestr reczny). Miedzy nim a Lucanem zostala tylko linia alarmowa
    o zerowym przeplywie. Racja z retcon_000113 jest wiec utrzymana, ale za darmo.
  engine_note: >-
    Szczebel 1 jest od retcon_000141 naliczany PRZEZ SILNIK, w
    state/instances/pc-lucan.yaml#resources.lucan_necrotic_energy.regeneration
    (0,75 na godzine = 0,25 wlasnej regeneracji + 0,50 dowozu z sieci). Szczeble 2 i 3
    pozostaja rejestrem RECZNYM w tym pliku - runtime nie symuluje foragingu wezlow.
    Przy naliczaniu banks pamietac, ze dopoki rezerwa Lucana nie stoi przy 15,
    szczeble 2 i 3 nie dostaja nic.

network_balance:
  generated_per_day: 16.5   # 14.5 + 3.0 od t_180 (trzy pajaki piwniczne wypuszczone) - 1.0 od t_183 (spider_04 zawrocony na posterunek)
  lucan_own_regeneration_per_day: 6.0
  overflow_above_growth_caps_per_day: 2.5
  overflow_sources: [spy_hawk_moth_01 1.5, spy_centipede_01 0.5, spy_centipede_02 0.5]
  overflow_delivered_after_propagation_loss: ~2.0
  rationed_to_varkhen_per_day: 1.0 na wejsciu, 0.8 na wyjsciu - bez zmian
settlement_log:
  - as_of_event_id: event_turn_interlude_276
    settled_from_event_id: event_turn_interlude_235
    window_campaign_days: 0.562
    tool: tools/growth_settle.py
    own_growth_credited_total: 11.25
    overflow_above_caps: 1.29
    overflow_disposition: >-
      WYPAROWALA. Szczebel 1 drabiny to pc_lucan, a jego rezerwa stala przy sufcie 15/15
      przez cale okno, wiec nadmiar nie mial gdzie wejsc: retcon_000151 mowi wprost, ze bank
      Lucana rosnie WYLACZNIE z wysysania zywych, a nadmiar przy pelnej rezerwie nie bankuje
      sie nigdzie. To rozstrzyga napiecie z overflow_rule (retcon_000109, "nadmiar nie
      przepada") na korzysc wpisu z WYZSZYM NUMEREM, zgodnie z AGENTS.md#priorytet-zrodel.
    not_included: >-
      Straty propagacji, progi drabiny dojrzalosci i runtime.overflow_pending - tak jak
      wypisuje sam skrypt. Zaden wezel nie przekroczyl progu 10, wiec zadnego szczebla
      nie trzeba przyznawac; najwyzej stoi spy_hawk_moth_01 z 3,75, ktory od t_274 ma
      rate_per_day 0,0 i nie rosnie.
backlog_basis: >-
  Zaleglosc naliczona za ~1,25 doby kampanii - od wypuszczenia serii pierwszej w noc drugiego
  dnia (event_turn_interlude_077 dla wijow i zukow, event_turn_interlude_091 dla cmy i Zawisaka)
  do switu dnia czwartego (event_turn_interlude_177, 05:00). Stawki wg retcon_000105 i 000110.
  Okno tur 178-179 to 35 minut, czyli mniej niz 0,1 jednostki na najszybszym wezle - ponizej
  precyzji tego pliku, doliczane przy nastepnym istotnym tyknieciu.
banks:
  - {id: spy_beetle_01, funded_by: north_foundation_channels, rate_per_day: 1.8, growth_cap_per_day: 1.5, overflow_per_day: 0.3, basis: 'OD t_258 SIEDZI W NISZY POD POLNOCNYM FUNDAMENTEM KAPLICY, w zbiegu trzech kanalow, ktore dowoza lacznie ok. 1,8 na dobe (discovery podziemi, pomiar 2026-09-11). ZUKI NIE MAJA DOBOWEGO UBYTKU (retcon_000167), wiec nic nie schodzi na utrzymanie: 1,5 idzie w rozwoj, czyli DOKLADNIE TYLE, ILE SZLO z reki Lucana, a 0,3 wchodzi w siec. Dawna stawka 3,5 funded_by lucan_reserve jest tym samym zdjeta - ladowanie z reki stalo sie zbedne, nie niemozliwe: okaz zakotwiczony mozna karmic zdalnie (retcon_000167). Sufit podnosi enlarge_reservoir_to_tank (3 -> 12), wtedy 6,0 na dobe.', bank: 0.84, maturity: fresh}
  - {id: spy_hawk_moth_01, balance_row: bez_rozkazu_zer_obfity, upkeep_ref: 'campaigns/lucan/planning/specimen-upgrades.yaml#builds.build_moth_glutton.energy_model.symbiont_upkeep.units_per_day', name: Zawisak, rate_per_day: 0.0, growth_cap_per_day: 1.5, overflow_per_day: 0.0, basis: 'OD t_274 ZEROWANIE WLASNE - nektar na lakach przed baszta, bez rozkazu, wiec zer normalny +1,0 wg daily_balance_model. Do t_273 karmiona jedwabnikami z kosza bez ograniczenia (retcon_000110) i stala na 3,0 z przelewem 1,5. BILANS, PO KOREKCIE Z RETCON_000172: nektar na lakach w szczycie sezonu to zer OBFITY (+2,0 wg daily_balance_model), nie normalny - koniec sierpnia, laki za murem, okaz nocny o szybkim locie i zawisie. Symbionty z t_271 (sordina + porost slepy) jedza 2,0 na dobe z wlasnego zbiornika (planning/specimen-upgrades.yaml#builds.build_moth_glutton.energy_model.symbiont_upkeep, pojemnosc bez zmian 3). 2,0 minus 2,0 = NETTO 0,0 - zawisak utrzymuje sie sam i nie dokłada juz nadwyzki do sieci, dokladnie jak posterunek z zadaniem i zerem (retcon_000105). ZADNEGO DEFICYTU NIE MA i kosz jedwabnikow nie jest do tego potrzebny; wczesniejszy zapis -1,0 bral nektar jako zer normalny i byl klasyfikacja narratora, nie ustaleniem pliku.', bank: 3.75, maturity: fresh}
  - {id: spy_centipede_01, balance_row: rozkaz_ruchomy_nad_zerem, rate_per_day: 2.0, growth_cap_per_day: 1.5, overflow_per_day: 0.5, basis: 'kanaly, zer obfity, STALY ROZKAZ MAPOWANIA od t_186 - stawka zostaje 2,0, bo rozkaz ruchomy nad zerem nie zeruje jej (rozstrzygniecie gracza, retcon_000174, wiersz rozkaz_ruchomy_nad_zerem). Dawny zapis "bez rozkazu" byl stanem sprzed t_186', bank: 3.34, maturity: fresh}
  - {id: spy_centipede_02, balance_row: rozkaz_ruchomy_nad_zerem, rate_per_day: 2.0, growth_cap_per_day: 1.5, overflow_per_day: 0.5, basis: 'kanaly, zer obfity, STALY ROZKAZ MAPOWANIA od t_186 - stawka zostaje 2,0, bo rozkaz ruchomy nad zerem nie zeruje jej (rozstrzygniecie gracza, retcon_000174, wiersz rozkaz_ruchomy_nad_zerem). Dawny zapis "bez rozkazu" byl stanem sprzed t_186', bank: 3.34, maturity: fresh}
  - {id: spy_rat_01, balance_row: bez_rozkazu_zer_obfity, rate_per_day: 2.0, growth_cap_per_day: 1.5, overflow_per_day: 0.5, basis: 'KANALY POD GARBARNIA (retcon_000171), zer obfity, bez rozkazu poza domyslnym polowaniem; posterunek od t_273. STAWKA PODNIESIONA 1,0 -> 2,0 retconem 000175: zer obfity to zer obfity, a ROZMIAR CIALA NIE WPLYWA NA ZBIERANIE - t_273 obnizyl ja blednie "bo to mniejsze cialo"', bank: 0.84, maturity: fresh}
  - {id: spy_rat_02, balance_row: bez_rozkazu_zer_obfity, rate_per_day: 2.0, growth_cap_per_day: 1.5, overflow_per_day: 0.5, basis: 'KANALY POD GARBARNIA (retcon_000171), zer obfity, bez rozkazu poza domyslnym polowaniem; posterunek od t_273. STAWKA PODNIESIONA 1,0 -> 2,0 retconem 000175: zer obfity to zer obfity, a ROZMIAR CIALA NIE WPLYWA NA ZBIERANIE - t_273 obnizyl ja blednie "bo to mniejsze cialo"', bank: 0.84, maturity: fresh}
  - {id: spy_rat_03, balance_row: bez_rozkazu_zer_obfity, mobility_modifier: ograniczona_ruchliwosc, rate_per_day: 1.0, growth_cap_per_day: 1.5, basis: 'trzynogi w KANALACH POD GARBARNIA (retcon_000171). Zer obfity (2,0) razy modyfikator ograniczonej ruchliwosci (polowa) = 1,0. Dawne 0,5 bralo obnizke DWA RAZY: raz za rozmiar ciala, ktory zbierania nie dotyczy, raz za trzy lapy. Zostaje druga - t_273 mowi wprost "zbiera mniej niz dwa sprawne"', bank: 0.56, maturity: fresh}
