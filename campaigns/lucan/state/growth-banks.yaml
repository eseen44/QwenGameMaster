  - {id: spy_beetle_10, balance_row: padlinozerca_bez_rozkazu, rate_per_day: 0.5, growth_cap_per_day: 1.5, basis: 'padlinozerca, ulice i smietniki wokol baszty, bez rozkazu - wypuszczony z blatu w t_274', bank: 0.28, maturity: fresh}
