schema_version: 1
campaign_id: campaign_lucan
status: active
cover_stories:
  - id: cover_lucan_never_tried_on_the_living
    source_event_id: event_turn_interlude_184
    ratified_by: retcon_000120
    claim_planted: Lucan nigdy nie probowal kierowac sily zyciowej na zywym czlowieku.
    truth_status: false_by_player_declaration
    planted_with: npc_mara_teln
    intent: >-
      Zasiane po to, zeby Mara powtarzala to dalej. Ma humanizowac Lucana i odsunac
      alternatywna lekture jego osoby. Kazdy NPC, ktory uslyszy to od Mary, dostaje
      falszywe przekonanie, nie fakt.
    softening_bundle: >-
      Reszta wyjasnienia z t_184 (kierowanie sila zyciowa, sila luzna u nie-martwych,
      wymuszanie gojenia wiedza anatomiczna) idzie w tym samym pakiecie i jest
      zmiekczona w te sama strone. NIE jest kanonem mechaniki - patrz
      player/abilities.yaml#cover_account_given_to_others.
    fragile_if: Ktos zobaczy albo zezna, ze Lucan uzyl tego na zywym czlowieku.
  - id: cover_lucan_is_a_hobbyist_scholar_of_curse_history
    source_event_id: event_turn_interlude_196
    claim_planted: >-
      Lucan jest naukowcem hobbysta i interesuje go odtworzenie DZIEJOW rzadkiej sztuki -
      dlatego szuka specjalistow od klatw i lokalnych wiedzm.
    truth_status: functional_cover_the_interest_is_real_the_framing_is_not
    planted_with: npc_syndicate_weigher
    intent: >-
      Podane pryncypalowi syndykatu przy skladaniu zamowienia na informacje. Rama
      historyczno-badawcza tlumaczy, po co komu spis ludzi od klatw, i nie wymaga
      przyznania sie do praktyki. Wagowy jej nie kwestionuje - nie kupuje powodu,
      tylko zamowienie.
    fragile_if: >-
      Ktos zestawi to z tym, ze Lucan klatwy RZUCA. Wagowy nie ma na karcie ani jednego
      faktu o klatwach Lucana; npc_seraphine_vale ma dwa (fact_seraphine_watched_lucan_
      curse_a_guild_employee, fact_seraphine_knows_lucan_cursed_three_on_the_wagon).
secrets:
  - id: secret_lucan_practices_necromancy
    truth: Lucan aktywnie praktykuje nekromancję.
    public_status: not_public
    known_by: [pc_lucan, companion_varkhen, npc_seraphine_vale, npc_lucan_father]
    suspected_by: [npc_mara_teln]
    disclosure_nuance:
      npc_lucan_father:
        source_event_id: event_turn_interlude_019_vitae_disclosure_to_father
        holds_facts: Lucan powiedział mu wprost, że Spideya porusza czyste vitae -
          energia życia - w martwym ciele, i że kapłan nazwałby to śmiercią.
        does_not_hold: Ramy prawnej ani religijnej. Nie użył słowa nekromancja, nie
          przyszło mu do głowy i nie interesuje go, że cokolwiek tu jest przestępstwem.
        risk_profile: Nie zdradzi z wyliczenia - nie myśli w kategoriach dyskrecji.
          Może wygadać wszystko z entuzjazmu, bo uważa, że dobra praca ma być widziana.
    institutional_knowledge: {guild: compartmentalized_to_seraphine, church: none_confirmed, watch: none_confirmed, academy_or_magic_body: none_confirmed}
    exposure_consequence: criminal_and_religious_case
  - id: secret_varkhen_formal_control_link
    truth: Varkhen pozostaje w formalnej, nieegzekwowanej więzi kontroli Lucana.
    public_status: not_public
    known_by: [pc_lucan, companion_varkhen]
    suspected_by: [npc_mara_teln, npc_seraphine_vale]
    institutional_knowledge: {guild: none_confirmed, church: none_confirmed, watch: none_confirmed, academy_or_magic_body: none_confirmed}
    exposure_consequence: cover_story_collapse_and_major_necromancy_crisis
  - id: secret_necromantic_spider_network
    truth: Lucan utrzymuje nekromantycznie zmodyfikowaną sieć pająków.
    public_status: not_public
    known_by: [pc_lucan, companion_varkhen, npc_seraphine_vale, npc_lucan_father]
    suspected_by: [npc_mara_teln]
    institutional_knowledge: {guild: compartmentalized_to_seraphine, church: none_confirmed, watch: none_confirmed, academy_or_magic_body: one_academic_privately_saw_spidey_no_institutional_record}
    exposure_consequence: ambiguous_necromantic_evidence_triggering_classification_dispute_and_investigation_not_automatic_conviction
    academy_exposure_note: Ojciec Lucana widział Spideya z bliska pod lampą w laboratorium
      Akademii (event_turn_interlude_018/019). Wejście było niezarejestrowane, więc nie ma
      śladu na papierze - ale sam chce pracę POKAZAĆ komuś, kto walczy o szeroką definicję
      ożywionych konstruktów, co byłoby pierwszym instytucjonalnym kontaktem Akademii z okazem.
    legal_nuance: Spidey i sieciarze są małymi, pierwotnie żywymi pająkami poddanymi nekromantycznej modyfikacji. Akademia może bronić klasyfikacji żywego chowańca lub bio-konstruktu, świecka władza patrzeć na zagrożenie i przywileje, a Kościół odrzucać zmianę nazwy jako maskowanie nekromancji.
  - id: secret_four_corpses_bearing_lucans_trace
    truth: Dwie ofiary w kaplicy i dwie na wysypisku nosiły ślad działań Lucana. Ciała z kaplicy zostały wysuszone, zmasakrowane i ukryte w starym sarkofagu krypty. Ciała z wysypiska to stróż (znaleziony już dawno) oraz szperacz - oba należą do wątku z Aktu 1 prowadzonego jako "choroba kanałów" i zostały tam rozliczone.
    public_status: not_public
    known_by: [pc_lucan, companion_varkhen, npc_seraphine_vale]
    dump_bodies_identified: [dump_body_watchman_found_long_ago, dump_body_scout]
    dump_bodies_thread: act_01_sewer_disease_job
    resolution_ref: retcon_000003
    material_availability:
      status: Żadne z czterech ciał nie jest dziś dostępnym materiałem dowodowym.
      chapel_two: Zmiażdżone i częściowo zamknięte w pustym sarkofagu krypty tak, by nie
        wyglądały jak dwa świeże ciała - nierozpoznawalne. Lokalizację znają wyłącznie
        Lucan i jego słudzy. Lucan zadbał też o to, żeby nie dały się namierzyć żadnym
        wyczuwaniem energii śmierci.
      dump_two: Zmarli około miesiąca temu. Dawno pochowani, a najprawdopodobniej
        SPALENI - dowody wskazywały na chorobę ("choroba kanałów" z Aktu 1), a takie
        zwłoki miasto pali.
      source: Doprecyzowane przez gracza przy event_turn_interlude_028_lucan_dismantles_the_charges;
        spójne z secret_chapel_body_disposal i z retcon_000003, nie wymaga retconu.
    what_seraphine_actually_knows: Wie, że dwie ofiary w kaplicy i dwie na wysypisku nosiły
      ślad Lucana, bo sam jej to przyznał (fact_seraphine_knows_four_marked_corpses). NIE wie,
      gdzie te ciała są ani w jakim są stanie - nie ma jej w known_by dla
      secret_chapel_body_disposal. Nie może więc oprzeć na nich żadnego zarzutu.
    exposure_consequence: material_evidence_and_possible_trigger_for_inquisition_attention
    residual_risk: Kaplicowe szczątki w sarkofagu pozostają jedynym niezamkniętym elementem tego sekretu.
  - id: secret_cemetery_office_proxy_and_sacrificial_tomb
    truth: Nienazwany pracownik kancelarii był hipnotyzowany lub poddany podobnemu wpływowi i pośredniczył w kontakcie z nieznanym aktorem związanym z trefną działalnością w tunelach. Aktor wskazał na mapie nienazwany grobowiec, który można poświęcić jako pozorne źródło problemów.
    public_status: not_public
    known_by: [pc_lucan]
    suspected_by: []
    unresolved: [identity_of_proxy_controller, actual_function_of_marked_tomb, responsibility_for_office_webber_death]
    exposure_consequence: may_reveal_remaining_cemetery_network_or_become_false_official_resolution
  - id: secret_chapel_body_disposal
    truth: Lucan z pomocą Spideya i czterech sieciarzy przeniósł Teren i Marael do pustego sarkofagu krypty, odebrał pajęczyny, a następnie zmiażdżył i częściowo zamknął ich szczątki tak, by nie wyglądały jak dwa świeże ciała.
    public_status: not_public
    known_by: [pc_lucan, companion_spidey, webber_anchored, webber_home, webber_tannery, webber_dump]
    suspected_by: []
    institutional_knowledge: {guild: none_confirmed, church: none_confirmed, watch: none_confirmed}
    anti_forensic_measures: Szczątki są nierozpoznawalne jako dwa ciała, a Lucan zadbał o to,
      żeby nie dały się namierzyć wyczuwaniem energii śmierci - ani jego własnym Geo, ani
      cudzym. Doprecyzowane przez gracza przy event_turn_interlude_028_lucan_dismantles_the_charges.
    exposure_consequence: concealed_evidence_may_become_material_only_if_someone_learns_the_location_from_a_person
    exposure_note: Sarkofag nie jest ryzykiem wyszukiwalnym. Ryzykiem jest wyłącznie
      przeciek od kogoś, kto zna miejsce - czyli od Lucana albo od jego sług.
