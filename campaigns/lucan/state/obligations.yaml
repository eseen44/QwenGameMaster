      relacji rozgrywajacym i swiadomie uzywa jej wlasnej doktryny wiedzy z t_188 - sama
      odmowila przyjmowania pozostalych piecu dzwigni przed spotkaniem ze Straza, wiec dzis
      nie wie.'
  - id: obligation_name_advance_warning_channel_for_syndicate
