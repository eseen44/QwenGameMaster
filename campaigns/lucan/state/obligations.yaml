    source_event_id: retcon_000059
    updated_by_event_id: event_turn_interlude_174
    sequence: 'USTALONA W t_174: (1) targ jutro rano - znalezc kogos, kto przepisze i oprawi,
      oraz ustalic NA KIEDY; (2) introligatornia; (3) Neris dostaje oryginal do przeczytania;
      (4) rozmowa o tym, czy i jak balwierz wchodzi do jej tekstu; (5) oprawiona kopia idzie do
      biblioteki przez bibliotekarza, ktorego umawia Neris. Zaden z tych krokow nie ma terminu
      narzuconego przez swiat - tempo wyznaczyl sam Lucan.'
    declared_plan: 'Lucan zapowiedzial Neris (t_172), ze sprobuje zmajstrowac OPRAWIONA KOPIE
      tresci licencjonowanej, ktora biblioteka przyjmie zamiast oryginalu - dzieki czemu
      marginalia zostaja u niego. To ZAMIAR, nie rzecz zrobiona: brak introligatora, materialu
      i czasu przy stole. Zadanie interludium.'
    disclosed_to_neris: 'Marginalia, ich charakter i ich ciezar dla dysputy - ujawnione przez
      Lucana z wlasnej inicjatywy w t_172. Pochodzenie tomu (kradziez, martwy balwierz) NIE.'
  - id: obligation_conditional_risk_disclosure_to_seraphine
    status: active_if_new_material_risk_appears
    commitment: Ujawnić Seraphine nowe ryzyko materialne, którego potrzebuje do zapewniania osłony.
    source_event_id: milestone_047_seraphine_risk_disclosure
    what_the_risk_actually_is: 'NIE jest to ryzyko dla Lucana - to warunek układu. Seraphine
      jest JEDYNĄ osobą w Gildii, która wie o nekromancji (secrets.yaml#institutional_knowledge.guild:
      compartmentalized_to_seraphine) i deklaruje osłonę przed Gildią oraz możliwą Inkwizycją
      pod warunkiem szczerego ujawnienia ryzyka (fact_seraphine_offers_conditional_cover). Warunek
      znaczy: nie daj się jej zaskoczyć na sali. Jeśli ktoś wyłoży przy niej konkret, o którym nie
      wiedziała, to ONA jest tą, która ręczyła w ciemno - i nie może z tego wyjść tak, jak Lucan
      może wyjść z Gildii.'
    not_triggered_by:
      - 'event_turn_interlude_184 (rozstrzygnięte w t_185, argument gracza): Mara ORAZ Boros widzieli
        w sarkofagu, że Lucan coś robił z nieumarłym i że przewodził energię z nekromantycznej maszyny.
        Z tych dwóch zeznań każdy wyciągnie, że operuje energią śmierci/życia. secrets.yaml ma
        npc_mara_teln w suspected_by dla secret_lucan_practices_necromancy już od milestone_045.
        Wyjaśnienie mechanizmu NIE dostarczyło Seraphine żadnej nowej informacji o Lucanie.'
    note_open_but_no_deadline: 'To, co realnie powstało w t_184, jest innej natury: Mara nosi teraz
      WERSJĘ wybraną przez Lucana (secrets.yaml#cover_stories.cover_lucan_never_tried_on_the_living).
      Ryzyko brzmi nie "świadek wie za dużo", tylko "świadek powtarza historię, którą da się obalić".
      Żaden plik nie stawia temu terminu.'
