notes:
  - Lucan tu studiował; edukacja została przerwana po sprzeciwie wobec zaaranżowanego
    małżeństwa (background_family_retaliation_and_education_sabotaged). Ostatnio był
    tu około dwóch lat temu - ustalone przez gracza przy
    event_turn_interlude_016_walk_to_academy.
  - Akademia jako frakcja jest już zmobilizowana na osi konstrukt/golem/chowaniec
    kontra nieumarły; to dokładnie ta granica, na której Lucan chce oprzeć obronę
    Spideya.
