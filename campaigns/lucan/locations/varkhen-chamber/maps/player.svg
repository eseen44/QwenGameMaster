<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Mapa gracza — komora Varkhena</title>
  <desc id="desc">Znane zapadlisko, wyważone drzwi, komora i sarkofag.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8d1c5"/></pattern></defs>
  <rect width="800" height="500" fill="#f4efe5"/>
  <text x="50" y="30" font-family="sans-serif" font-size="18" font-weight="700">Komora Varkhena — wiedza Lucana</text>
  <rect x="70" y="50" width="320" height="240" fill="url(#grid)" stroke="#332f2a" stroke-width="8"/>
  <rect x="190" y="130" width="100" height="48" fill="#8d857a" stroke="#332f2a" stroke-width="4"/>
  <path d="M200 140l70 28M270 140l-70 28" stroke="#5a2d2d" stroke-width="3"/>
  <text x="193" y="120" font-family="sans-serif" font-size="13">pęknięty sarkofag</text>
  <rect x="190" y="290" width="80" height="12" fill="#6f6253" stroke="#332f2a" stroke-width="2"/>
  <text x="182" y="320" font-family="sans-serif" font-size="13">wyważone drzwi</text>
  <path d="M110 390C110 350 130 330 150 302M150 390C150 350 160 330 170 302" fill="none" stroke="#8b6b3f" stroke-width="4"/>
  <rect x="70" y="370" width="200" height="70" fill="#c7b9a2" stroke="#5b5752" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="88" y="465" font-family="sans-serif" font-size="13">dno osuwiska / liny do nagrobków</text>
  <circle cx="100" cy="90" r="5" fill="#777"/><circle cx="130" cy="105" r="5" fill="#777"/><circle cx="345" cy="95" r="5" fill="#777"/>
  <text x="430" y="90" font-family="sans-serif" font-size="14">Dużo starego metalu;</text>
  <text x="430" y="110" font-family="sans-serif" font-size="14">wartość i przeznaczenie nieznane.</text>
  <text x="430" y="155" font-family="sans-serif" font-size="14" font-weight="700">Varkhen ujawnił drugi dostęp:</text>
  <text x="430" y="177" font-family="sans-serif" font-size="14">korytarz trzech prób prowadzący</text>
  <text x="430" y="199" font-family="sans-serif" font-size="14">od właściwej strony. Wejście i geometria</text>
  <text x="430" y="221" font-family="sans-serif" font-size="14">nie zostały jeszcze odnalezione.</text>
  <line x1="430" y1="420" x2="510" y2="420" stroke="#222" stroke-width="5"/>
  <text x="452" y="410" font-family="sans-serif" font-size="13">2 m</text>
  <path d="M730 80V40m0 0l-8 14m8-14l8 14" stroke="#222" stroke-width="3" fill="none"/><text x="723" y="100" font-family="sans-serif">N?</text>
</svg>
