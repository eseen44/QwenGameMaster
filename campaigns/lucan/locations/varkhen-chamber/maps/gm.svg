<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Mapa MG — komora Varkhena</title>
  <desc id="desc">Znana komora oraz niekartowana stara zabudowa, bez kanonizowania skarbca.</desc>
  <defs><pattern id="gridgm" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8d1c5"/></pattern></defs>
  <rect width="800" height="500" fill="#f4efe5"/>
  <text x="50" y="30" font-family="sans-serif" font-size="18" font-weight="700">Komora Varkhena — widok MG</text>
  <rect x="70" y="50" width="320" height="240" fill="url(#gridgm)" stroke="#332f2a" stroke-width="8"/>
  <rect x="190" y="130" width="100" height="48" fill="#8d857a" stroke="#332f2a" stroke-width="4"/>
  <text x="190" y="120" font-family="sans-serif" font-size="13">sarkofag / Varkhen</text>
  <rect x="190" y="290" width="80" height="12" fill="#6f6253" stroke="#332f2a" stroke-width="2"/>
  <rect x="390" y="70" width="100" height="200" fill="#d9bdd8" stroke="#7c2f75" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="505" y="100" font-family="sans-serif" font-size="13" fill="#7c2f75">niekartowana stara zabudowa</text>
  <text x="505" y="120" font-family="sans-serif" font-size="12" fill="#7c2f75">geometria nie jest znana; istnieje frontowy</text>
  <text x="505" y="140" font-family="sans-serif" font-size="12" fill="#7c2f75">korytarz trzech prób i właściwe wejście</text>
  <path d="M110 390C110 350 130 330 150 302M150 390C150 350 160 330 170 302" fill="none" stroke="#8b6b3f" stroke-width="4"/>
  <rect x="70" y="370" width="200" height="70" fill="#c7b9a2" stroke="#5b5752" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="80" y="465" font-family="sans-serif" font-size="13">osuwisko — dalsza stabilność nieznana</text>
  <line x1="430" y1="420" x2="510" y2="420" stroke="#222" stroke-width="5"/><text x="452" y="410" font-family="sans-serif" font-size="13">2 m</text>
  <path d="M730 80V40m0 0l-8 14m8-14l8 14" stroke="#222" stroke-width="3" fill="none"/><text x="723" y="100" font-family="sans-serif">N?</text>
</svg>
