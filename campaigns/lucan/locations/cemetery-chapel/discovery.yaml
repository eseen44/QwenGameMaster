discovery_notes:
  - 'northern_foundation_route (retcon_000163) JEST ADRESEM: zone_sacristy -> zone_stairs -> stara czesc krypt kaplicy -> nizej, poziom fundamentu budynku (zone_relay_chamber w loc_cemetery_underworks). Z poziomu krypt odchodzi osobno tunel przy murze do rampy (zone_wagon_hall).'
  - 'Na poziomie fundamentu stal feature_relay - nieumarly-przekaznik energii Orena (milestone_043c). Ekipa zostala z tego miejsca wyprowadzona przez Orena na powierzchnie, wiec samo pomieszczenie potraktowano w Akcie 2 pobieznie.'
  - 'ZGLOSZONO GILDII, ZE COS TAM EMITUJE; Seraphine przyjela, ze zrodlem byl przekaznik. O DODATKOWEJ emisji smierci z tego miejsca wiedzieli tylko Lucan i Oren, a Oren nie zyje.'
  - 'event_turn_interlude_255: Varkhen wyjal trzy kamienie fundamentu. Za nimi nisza, a w niej feature_ritual_channels - stare kanaly wyrobione w kamieniu, zbiegajace sie z trzech stron na JEDNYM OBROBIONYM PRZEDMIOCIE wielkosci piesci, zimnym i nasyconym na tyle, ze zaklóca grave sense. Nie jest i nigdy nie byl cialem. NIEUSTALONE: co robi, czyj jest, czy kanaly sa czynne i czy da sie go wyjac bez konsekwencji. Zwiazek z przekaznikiem Orena to WNIOSEK LUCANA z ukladu miejsca, nie fakt swiata.'
  - 'event_turn_interlude_256: sonda nekromantyczna, bez dotknięcia przedmiotu. TRZY KANALY SA CZYNNE, slabe i JEDNOKIERUNKOWE - wnosza do wnetrza. Rzecz jest ZBIORNIKIEM, nie zrodlem: brak obiegu, brak rozkladu, samo gromadzenie od dawna. SYGNATURA NIE ZGADZA SIE z probka ducha cmentarza pobrana w milestone_044b - to smierc BEZ WLASCICIELA, rowna i bez warstw, i wlasnie dlatego grave_sense nigdy tego nie sklasyfikowalo. CZYM JEST RYTUAL - sonda tego nie powie (effect#limitations: not_ritual_identification). NIEUSTALONE: skad kanaly to biora, czy przedmiot da sie wyjac bez ich zerwania i czy kontakt byl obustronny (reciprocal_contact_possible).'
  - 'event_turn_interlude_254: przekaznika tam nie ma, a sygnal jest - jeden gesty, nieruchomy punkt bez cech ciala, za przesunietymi kamieniami fundamentu, pyl nieswiezy. CZYM JEST - NIEROZSTRZYGNIETE. Zeby wiedziec wiecej, trzeba ruszyc kamienie.'
