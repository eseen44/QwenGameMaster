    W niszy zbiegaja sie z trzech stron TORY wyrobione w kamieniu fundamentu, stare,
    konczace sie w jednym punkcie.'
  - 'PRZEDMIOT ZABRANY PRZEZ LUCANA (event_turn_interlude_257) - item_north_foundation_vessel
    w player/inventory.yaml. Wyszedl bez oporu. TRZY KANALY PRACUJA DALEJ, tak samo ledwo
    jak przedtem, i koncza sie teraz na golym kamieniu w miejscu, w ktorym stala rzecz.
    Nic sie po zabraniu odbiornika nie wylalo ani nie zmienilo gwaltownie.'
  - 'NIEUSTALONE: skad kanaly biora smierc bez wlasciciela, czym jest rytual, ktory to
    zbudowal, i co sie stanie z tym, co do niszy nadal dochodzi. Przekaznik Orena stal
    w tym samym pomieszczeniu (feature_relay) i prawdopodobnie stal tam z tego powodu -
    to hipoteza z t_255, nie ustalenie.'
  - 'KTO WIE: tylko Lucan. Seraphine przyjela w Akcie 2, ze zrodlem emisji z tego miejsca
    byl przekaznik Orena, i nikt tego nie podwazyl (retcon_000163). Varkhen widzial
    wyjecie rzeczy, ale nie wie, czym ona jest.'
  - 'TRZY ZAKOTWICZONE OKAZY ZOSTAWIONE W NISZY (event_turn_interlude_258): companion_spidey,
    webber_anchored i spy_beetle_01, po jednym na kanal, z rozkazem zeby nie przejadaly sie
    non stop i kierowaly nadmiar do Lucana, a potem w siec. Doplyw jest CIENKI - nitka, nie
