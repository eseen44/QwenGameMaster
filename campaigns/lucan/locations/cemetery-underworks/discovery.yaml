    (growth-banks#growth_intake_cap: Spidey 6,0, Tkacz 3,0, zuk 1,5 na dobe).'
  - 'TO, CO KANALY DOWOZA, NIE MA WLASCICIELA ANI SYGNATURY (t_256, potwierdzone kontaktem
    okazow w t_258) - karmienie tym nie niesie niczyjego sladu. Zaden plik nie stawia za to
    skazenia, kary ani zegara i narrator ich nie dodal.'
  - 'TEMPO DOPLYWU ZMIERZONE I USTALONE JAKO KANON (odpowiedz na pytanie gracza
    2026-09-11): KAZDY Z TRZECH KANALOW DOWOZI OKOLO 0,6 JEDNOSTKI NA DOBE, czyli okolo
