discovery_notes:
  - 'PION RAMPY - UKLAD OSOBNY OD PIONU KAPLICY (retcon_000200, deklaracja gracza 14.09.2026,
    po tym jak narrator pomylil jedno z drugim). WSPOLRZEDNE Z layout.yaml ROZSTRZYGAJA:
    zone_wagon_hall x=320, zone_handler_station x=232, zone_lower_crypt x=240 y=128,
    a zone_chapel_link x=16 - czyli okolo 300 m w linii prostej. KAZDY PION MA WLASNA KRYPTE
    i nie wolno ich ze soba mieszac; kaplica ma do tego STARA krypte i FUNDAMENT.
    CO STOI W PIONIE RAMPY, W KOLEJNOSCI: przy pierwszym dojsciu byl tam JEDEN SLABY
    NEKROMANTA; POMIESZCZENIE TECHNICZNE, z ktorego pochodzi WIEKSZOSC PIERWSZYCH LUPOW;
    przejscie do KRYPTY OBOK, w ktorej trzymano ZWIAZANEGO CZELADNIKA ORENA podczas ataku
    na woz; z tej krypty SCHODY W DOL i kolejne poziomy krypt.
    NA POZIOMIE PONIZEJ RAMPY ALBO DWA POZIOMY NIZEJ WYCZUTO DWOCH POTEZNYCH NIEUMARLYCH.
    NIKT DO NICH NIE ZSZEDL i nikt ich nie sklasyfikowal. To NIE SA dwie sygnatury
    z cemetery/discovery.yaml (zombie pod kaplica i nieumarly przy zachodnim murze) -
    narrator zestawil je blednie w t_314 i zostalo to uchylone.'
  - 'ZAMKNIETA KOMORA PRZY RAMPIE ZOSTALA OTWARTA, PRZY SERAPHINE (retcon_000200). Nastapil
    WYBUCH PRZETWORNIKA ENERGII; Lucan uratowal cala ekipe, przekierowujac energie, i przy
    okazji CZASOWO ZAMROZIL DROGE DO KRYPT POD RAMPA. Jest to ta sama scena, ktora
    milestone_043a opisuje od strony przeplywu (przeciazenie kolektora) i ktora trwale
    podniosla rezerwe Lucana z 12 na 15. Streszczenie milestonu nie mowilo o ludziach ani
    o zamrozonej drodze - mowi to ta notatka. STAN DROGI DZIS: NIEUSTALONY, zamrozenie
    bylo czasowe.'
  - 'CZTERY OSOBNE DOJSCIA POD CMENTARZ - PELNY UKLAD, doprecyzowany przez gracza 14.09.2026
    po dwoch bledach narratora. Wspolrzedne z layout.yaml potwierdzaja kazde z nich.
    (1) RAMPA POLNOCNA: zone_wagon_hall x=320 -> zone_handler_station x=232 (pomieszczenie
    techniczne) -> zone_lower_crypt x=240 y=128 -> schody w dol i kolejne poziomy krypt.
    (2) KAPLICA: zone_chapel_link x=16, wlasna krypta, STARA krypta i fundament.
    (3) TUNEL TECHNICZNY W MURZE OKALAJACYM CMENTARZ - wchodzi sie do niego Z KANCELARII
    CMENTARZA. Lucan przebil jej sciane w Akcie 2 (milestone_038), a samo przejscie odkryl
    wczesniej za zahipnotyzowanym pracownikiem. Jest to zone_service_tunnel (x=88, y=216,
    dlugosc 30 m) i lezy DOKLADNIE MIEDZY pionem kaplicy a pionem rampy, czyli jest ich
    kregoslupem. W TYM TUNELU STOI BRAMA, A OD NIEJ ODCHODZA TRZY DROGI: ta, ktora przyszli
    z kancelarii, jedna DO PIONU RAMPY i jedna DO KAPLICY.
    (4) ZAWAL VARKHENA, NA SRODKU CMENTARZA - dojscie NIEZALEZNE od trzech powyzszych.
    ZAWAL ZROBIL SAM LUCAN - przy ataku na Varkhena, zaraz po domknieciu Aktu 2 (deklaracja
    gracza 15.09.2026). Nie jest to ani osuwisko naturalne, ani stare. Od tamtej chwili do
    21.08.2026 NIKT NIE MOGL TAMTEDY PRZEJSC w zadna strone; przejscie otworzylo sie dopiero
    wtedy, gdy Boros przekopal zawal rano 21.08. Pod nim lezy komora Varkhena,
    a za przekopanym zawalem komora grobowa, czterdziesci stopni i zone_deep_hall z dolna
    brama na koncu.'
  - 'SPROSTOWANIE SPROSTOWANIA (14.09.2026). retcon_000200 zapisal, ze zdanie Varkhena z t_314
    - dolna hala ma dwa konce, schody i brame - jest sprzeczne z trzema drogami od bramy.
    NIE JEST: tamte trzy drogi dotycza BRAMY W TUNELU TECHNICZNYM, a nie dolnej bramy na koncu
    zone_deep_hall. Sprzecznosci nie ma, bo caly pion Varkhena byl az do 21.08 odciety od
    reszty podziemi. CO ZOSTAJE W MOCY MIMO TO: narrator podal tamto zdanie BEZ ZRODLA i sam
    nazwal je w summary "czystym negatywem podanym tanio". Od teraz czytac je jako PAMIEC
    VARKHENA o wlasnej drodze, a nie jako zmierzony fakt o geometrii hali.'
  - 'NISZA W POLNOCNYM FUNDAMENCIE, zone_relay_chamber (t_254-257). Za przesunietymi
    kamieniami (pyl na szczelinie stary, nikt ich nie ruszal od dawna) byla mala pustka
    na wyciagniecie reki, nie korytarz. Varkhen wyjal trzy kamienie recznie w t_255.
    W niszy zbiegaja sie z trzech stron TORY wyrobione w kamieniu fundamentu, stare,
    konczace sie w jednym punkcie.'
  - 'PRZEDMIOT ZABRANY PRZEZ LUCANA (event_turn_interlude_257) - item_north_foundation_vessel
    w player/inventory.yaml. Wyszedl bez oporu. TRZY KANALY PRACUJA DALEJ, tak samo ledwo
    jak przedtem, i koncza sie teraz na golym kamieniu w miejscu, w ktorym stala rzecz.
    Nic sie po zabraniu odbiornika nie wylalo ani nie zmienilo gwaltownie.'
  - 'NIEUSTALONE: skad kanaly biora smierc bez wlasciciela, czym jest rytual, ktory to
    zbudowal, i co sie stanie z tym, co do niszy nadal dochodzi. Przekaznik Orena stal
    w tym samym pomieszczeniu (feature_relay) i prawdopodobnie stal tam z tego powodu -
    to hipoteza z t_255, nie ustalenie.'
  - 'KTO WIE: tylko Lucan. Seraphine przyjela w Akcie 2, ze zrodlem emisji z tego miejsca
    byl przekaznik Orena, i nikt tego nie podwazyl (retcon_000163). Varkhen widzial
    wyjecie rzeczy, ale nie wie, czym ona jest.'
  - 'TRZY ZAKOTWICZONE OKAZY ZOSTAWIONE W NISZY (event_turn_interlude_258): companion_spidey,
    webber_anchored i spy_beetle_01, po jednym na kanal, z rozkazem zeby nie przejadaly sie
    non stop i kierowaly nadmiar do Lucana, a potem w siec. Doplyw jest CIENKI - nitka, nie
    posilek - wiec tempa nie da sie zmierzyc w jednej turze i do state/growth-banks.yaml nie
    wpisano zadnej liczby. Pomiarem bedzie powrot. Sufity wchlaniania bez zmian
    (growth-banks#growth_intake_cap: Spidey 6,0, Tkacz 3,0, zuk 1,5 na dobe).'
  - 'TO, CO KANALY DOWOZA, NIE MA WLASCICIELA ANI SYGNATURY (t_256, potwierdzone kontaktem
    okazow w t_258) - karmienie tym nie niesie niczyjego sladu. Zaden plik nie stawia za to
    skazenia, kary ani zegara i narrator ich nie dodal.'
  - 'TEMPO DOPLYWU ZMIERZONE I USTALONE JAKO KANON (odpowiedz na pytanie gracza
    2026-09-11): KAZDY Z TRZECH KANALOW DOWOZI OKOLO 0,6 JEDNOSTKI NA DOBE, czyli okolo
    0,025 na godzine. Tory zbiegaja sie w JEDNYM punkcie, wiec okaz posadzony w zbiegu
    bierze sume trzech, czyli OKOLO 1,8 NA DOBE - o ile miesci sie w growth_intake_cap.
    Dla porownania: nadwyzka calej sieci to 16,5 na dobe, wlasna regeneracja Lucana 6,0,
    a jeden sieciarz oddaje Varkhenowi 0,25. To nie jest zrodlo rozwoju, tylko staly,
    drobny ciek - i wlasnie dlatego przedmiot w niszy zbieral sie tak dlugo.'
  - 'CO Z TEGO WYNIKA DLA OBSADY NISZY: spy_beetle_01 ma sufit 1,5 na dobe, wiec sam
    jeden przyjmuje niemal caly doplyw, a reszta (ok. 0,3) idzie dalej wg rozkazu z t_258
    i drabiny distribution_priority. Sufity Spideya (6,0) i Tkacza (3,0) sa przy tym
    ciekiem bezczynne. DO state/growth-banks.yaml NIE WPISANO jeszcze zadnej stawki -
    wejdzie tam dopiero, gdy obsada niszy bedzie ustalona na stale.'
