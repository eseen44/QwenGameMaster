zones:
  - {id: zone_lower_burial_chamber, note: 'KOMORA GROBOWA ZA ZAWALEM na starej nizszej trasie.
      Zadeklarowana 2026-09-14 (t_290), bo scena jej wymagala, a plik lokacji nie mial zadnej
      listy zon. Rozpoznana WYLACZNIE zmyslami Spideya przez szpare pod stropem: szeroka,
      wysoka, zamknieta, echo odbija sie od rownych scian; nisze grobowe w rzedach na kamiennych
      polkach, sucho i staro. ZADNEGO ZYWEGO CIALA w zasiegu (heat_and_life), a Geo z t_289
      mowi, ze umarli leza plasko i nic nie drgnelo. UWAGA: okaz serii NIE WIDZI NIEUMARLEGO
      (blind_to_undead), wiec brak odczytu u Spideya nie jest dowodem na brak martwych.
      PRZECIAG MA ZRODLO GDZIES DALEJ - powietrze wchodzi do komory poza zasiegiem Spideya,
      czyli istnieje DRUGIE WEJSCIE. Czym jest: NIEUSTALONE. Geometrii i miar brak; lokacja
      pozostaje bez layoutu dla tej zony.
      ROZPOZNANA W t_294 NA CALEJ DLUGOSCI: okolo piecuset krokow. Wszystkie nisze ZAMKNIETE -
      jedyna otwarta to ta zdjeta w t_293 przy wejsciu. GRADIENT: im glebiej, tym nisze wyzsze,
      plyty lepiej ciete, a kamien ciemniejszy i PRZYWIEZIONY, bo w scianach takiego nie ma.
      Na lepszych plytach RYTY ZNAK, ten sam na kazdej, wielkosci dloni - NIKT Z EKIPY NIE UMIE
      GO PRZECZYTAC i nie wolno mu przypisywac znaczenia ani rodu (retcon_000058). Uklad rak
      z t_293 - wyprostowane, dlonmi do gory - powtarza sie w kazdej widocznej niszy.
      W calej komorze ZERO pajeczyn i zero owadow, zywych i martwych (obserwacja Spideya,
      t_294; hipotezy brak).'}
  - {id: zone_deep_hall, note: 'DOLNA HALA - poziom pod komora grobowa, na ktory schodzi
      czterdziesci stopni z zone_lower_stair_head. Zadeklarowana 2026-09-14 (t_302), pierwsze
      wejscie ekipy. NIE JEST POMIESZCZENIEM, TYLKO HALA: lampa nie siega ani sufitu, ani
      przeciwleglej sciany. Podloga z plyt, WYTARTYCH POSRODKU w pas szerokosci dwoch ludzi,
      biegnacy od stopni w ciemnosc. Nisze grobowe sa i tu, ale GLEBSZE w murze, wieksze
      i rzadsze - miedzy dwiema miesci sie tyle, ile w komorze cztery.
      KAMIEN JESZCZE STARSZY NIZ W KOMORZE: bloki wieksze, obrobka inna (szersze slady, mniej
      ich), spoin prawie nie ma, bo kamienie sa dopasowane. Trzecia warstwa wieku po cmentarzu
      i po komorze - odczyt Lucana z practical_masonry, NIE data.
      PRZECIAG IDZIE OD LEWEJ, rowno, i w te sama strone biegnie wytarty pas. Zgadza sie to
      z kierunkiem, ktory podal Varkhen w t_296: nizej, potem brama, a przy bramie TRZECIA
      PIECZEC.
      JAK ZAMKNIETE SA TUTEJSZE NISZE (t_304, Geo przy pierwszej od schodow): kazda ma JEDNA
      plyte na cala wysokosc, wpuszczona w mur rowno z licem i BEZ ZAPRAWY - docieta tak samo
      jak bloki sciany. Plyte sie WYJMUJE, a nie rozbija; nazwal to Boros jednym slowem.
      ZA PLYTA JEST KOMORA, NIE SZPARA: pustka wieksza, niz cialo potrzebuje - w komorze grobowej
      wyzej nisza byla szczelina dokladnie na cialo.
      CO LEZY W PIERWSZEJ Z NICH: jedno cialo, cale, wyciagniete prosto, plaskie i ciche.
      Obok niego, NIE NA NIM, kilka rzeczy twardych i gestych - kilka malych w linii wzdluz boku,
      jedno wieksze przy glowie, wszystkie POLOZONE w porzadku, nie zsuniete przez czas.
      CZYM SA - NIEUSTALONE: poor_material_identification, dlon podaje twardosc i nieciaglosc,
      nie nazwe materialu. ODEZWALY SIE WYLACZNIE NA KANALE KAMIENIA - kanal sygnatury podal
      jedno cialo, plaskie i ciche, i nic poza nim. Wedle retcon_000197 ("rzecz nasycona oglasza
      sie sama") znaczy to, ze nic w tej komorze nie jest naladowane tak jak naczynie
      z polnocnego fundamentu kaplicy. Wniosek z mechaniki, NIE obietnica bezpieczenstwa. Roznica wobec gory (t_295: metal byl NA ludziach - okucia, obraczki)
      jest ROZNICA OBYCZAJU i nic poza nia z tego nie wynika bez nowego zrodla.
      PIERWSZA NISZA OTWARTA (t_305), plyta zdjeta bez rozbijania i stoi oparta o sciane obok.
      ZAWARTOSC NIETKNIETA: cialo na wznak, wyciagniete prosto, kosci i ciemny pyl po tkaninie;
      wzdluz lewego boku RZAD OSMIU malych przedmiotow ulozonych od najwiekszego do najmniejszego,
      rekojesciami w jedna strone, pod ciemnym nalotem; przy glowie SKRZYNKA wielkosci dwoch
      piesci, wieko dopasowane bez zawiasu i bez zamka, ta sama reka co sciana. Skrzynka
      ZAMKNIETA - nikt jej nie dotknal i narrator jej nie otwiera.
      SKALA: wiecej metalu niz trzy lepsze groby z komory wyzej razem (tamte okolo 2,5 kg, t_295).
      Grob lepszej warstwy, nie skarb. Klopot jest handlowy i nazwal go Boros: komplet sprzedaje
      sie gorzej niz luzny kruszec, bo osiem sztuk w rzedzie zapamietuje sie lepiej niz osiem
      osobno (trzecia kategoria towaru z t_295).
      PIERWSZA NISZA OPROZNIONA (t_306): rzad i skrzynka poszly do worka, kazda sztuka
      przelozona szmata, skrzynka NADAL ZAMKNIETA na wierzchu. Okolo trzech kilogramow
      z jednej niszy.
      CIALO NIE NIOSLO NIC - rece puste, przy szyi nic, w szczece nic, pod zebrami i pod cialem
      nic. Druga, niezalezna droga do tego samego wniosku: tutaj rzeczy kladziono OBOK, nie na
      zmarlym. W pozostalych niszach przeszukiwanie cial jest strata czasu.
      POD BARKAMI I BIODRAMI cienka ciemna linia - ostatek deski albo mar. Cialo ULOZONO,
      a nie wsunieto.
      ODCZYT BOROSA (zwykly, niemagiczny - retcon_000197 wiaze Stone Sense, nie dlon fachowca):
      rzad to METAL i NIE ZELAZO. Wiecej nie powie bez PRZETARCIA jednej sztuki, a przetarta
      wyglada na ruszana. Skrzynka ciezsza, niz wyglada - gestsza od rzedu; materialu nie nazwal.
      ZERO REAKCJI na otwarcie i na dotkniecie ciala, cztery razy z rzedu po t_293 i t_295.
      LICZBA NISZ: Mara naliczyla PIEC takich plyt w zasiegu lampy od schodow. Dalej ciemno.
      NIEUSTALONE: zasieg hali, PELNA liczba nisz, miejsce, w ktorym wchodzi powietrze,
      i co jest za brama.'}
  - {id: zone_lower_stair_head, note: 'PROG I SCHODY na dalekim koncu komory grobowej,
      zadeklarowane 2026-09-14 (t_294). Stopnie WYCIETE W SKALE, waskie, strome, bez porecze,
      WYTARTE POSRODKU do plytkiego zaglebienia w ksztalcie stopy - ktos chodzil tedy bardzo
      wiele razy i bardzo dawno. Schodza w ciemnosc; konca nie widac. PRZECIAG IDZIE OD DOLU,
      wiec drugie wejscie z t_290 jest NIZEJ. Spidey (t_294): nizej przestrzen brzmi dluzej
      i glebiej niz komora, a przeciag jest tam mocniejszy. Co jest na dole: NIEUSTALONE,
      nikt tam nie schodzil.'}
