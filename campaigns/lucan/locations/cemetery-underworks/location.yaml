zones:
  - {id: zone_lower_burial_chamber, note: 'KOMORA GROBOWA ZA ZAWALEM na starej nizszej trasie.
      Zadeklarowana 2026-09-14 (t_290), bo scena jej wymagala, a plik lokacji nie mial zadnej
      listy zon. Rozpoznana WYLACZNIE zmyslami Spideya przez szpare pod stropem: szeroka,
      wysoka, zamknieta, echo odbija sie od rownych scian; nisze grobowe w rzedach na kamiennych
      polkach, sucho i staro. ZADNEGO ZYWEGO CIALA w zasiegu (heat_and_life), a Geo z t_289
      mowi, ze umarli leza plasko i nic nie drgnelo. UWAGA: okaz serii NIE WIDZI NIEUMARLEGO
      (blind_to_undead), wiec brak odczytu u Spideya nie jest dowodem na brak martwych.
      PRZECIAG MA ZRODLO GDZIES DALEJ - powietrze wchodzi do komory poza zasiegiem Spideya,
      czyli istnieje DRUGIE WEJSCIE. Czym jest: NIEUSTALONE. Geometrii i miar brak; lokacja
      pozostaje bez layoutu dla tej zony.
      ROZPOZNANA W t_294 NA CALEJ DLUGOSCI: okolo piecuset krokow. Wszystkie nisze ZAMKNIETE -
      jedyna otwarta to ta zdjeta w t_293 przy wejsciu. GRADIENT: im glebiej, tym nisze wyzsze,
      plyty lepiej ciete, a kamien ciemniejszy i PRZYWIEZIONY, bo w scianach takiego nie ma.
      Na lepszych plytach RYTY ZNAK, ten sam na kazdej, wielkosci dloni - NIKT Z EKIPY NIE UMIE
      GO PRZECZYTAC i nie wolno mu przypisywac znaczenia ani rodu (retcon_000058). Uklad rak
      z t_293 - wyprostowane, dlonmi do gory - powtarza sie w kazdej widocznej niszy.
      W calej komorze ZERO pajeczyn i zero owadow, zywych i martwych (obserwacja Spideya,
      t_294; hipotezy brak).'}
  - {id: zone_deep_hall, note: 'DOLNA HALA - poziom pod komora grobowa, na ktory schodzi
      czterdziesci stopni z zone_lower_stair_head. Zadeklarowana 2026-09-14 (t_302), pierwsze
      wejscie ekipy. NIE JEST POMIESZCZENIEM, TYLKO HALA: lampa nie siega ani sufitu, ani
      przeciwleglej sciany. Podloga z plyt, WYTARTYCH POSRODKU w pas szerokosci dwoch ludzi,
      biegnacy od stopni w ciemnosc. Nisze grobowe sa i tu, ale GLEBSZE w murze, wieksze
      i rzadsze - miedzy dwiema miesci sie tyle, ile w komorze cztery.
      KAMIEN JESZCZE STARSZY NIZ W KOMORZE: bloki wieksze, obrobka inna (szersze slady, mniej
      ich), spoin prawie nie ma, bo kamienie sa dopasowane. Trzecia warstwa wieku po cmentarzu
      i po komorze - odczyt Lucana z practical_masonry, NIE data.
      PRZECIAG IDZIE OD LEWEJ, rowno, i w te sama strone biegnie wytarty pas. Zgadza sie to
      z kierunkiem, ktory podal Varkhen w t_296: nizej, potem brama, a przy bramie TRZECIA
      PIECZEC. NIEUSTALONE: zasieg hali, miejsce, w ktorym wchodzi powietrze, i co jest za brama.'}
  - {id: zone_lower_stair_head, note: 'PROG I SCHODY na dalekim koncu komory grobowej,
      zadeklarowane 2026-09-14 (t_294). Stopnie WYCIETE W SKALE, waskie, strome, bez porecze,
      WYTARTE POSRODKU do plytkiego zaglebienia w ksztalcie stopy - ktos chodzil tedy bardzo
      wiele razy i bardzo dawno. Schodza w ciemnosc; konca nie widac. PRZECIAG IDZIE OD DOLU,
      wiec drugie wejscie z t_290 jest NIZEJ. Spidey (t_294): nizej przestrzen brzmi dluzej
      i glebiej niz komora, a przeciag jest tam mocniejszy. Co jest na dole: NIEUSTALONE,
      nikt tam nie schodzil.'}
