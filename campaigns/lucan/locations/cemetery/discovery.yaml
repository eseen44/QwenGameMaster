discovery_notes:
  - Geo ujawniło sieć wielu pustek, tuneli technicznych i zawałów, lecz nie ustaliło pełnej geometrii ani drożności wszystkich odnóg.
  - Zombie w piwnicy kaplicy było wyczuwane przez ścianę; było odrębne od nieumarłego wykrytego przy zachodnim murze i od niesklasyfikowanego sygnału pod północnym fundamentem.
  - Położenie grobowca zostało wskazane Lucanowi na mapie; nazwa nie padła, a dokładnych współrzędnych nie odzyskano ze źródła tekstowego.
  - 'Skan geo z terenu przy poludniowej bramie (event_turn_interlude_253) NIE DODAL zadnej struktury: to samo sito pustek, tuneli i zawalow, co poprzednio, bez swiezego przekopu, nowego szybu i osypanej sciany. Wynik negatywny jest tu informacja - od poprzedniego skanu nikt nie ruszal tu ziemi. Sygnal pod polnocnym fundamentem odczytany ponownie, nadal niesklasyfikowany.'
  - 'POPRAWKA retcon_000163: polnocny fundament NIE JEST punktem na powierzchni tego terenu. Jest poziomem POD kryptami kaplicy, dojscie: locations/cemetery-chapel/discovery.yaml#northern_foundation_route. Wpis strange_signal_beneath_north_foundation nalezy czytac razem z tamta droga, nie jako cecha zone_grounds.'
  - 'GEO Z DOLU, SIEDEM SKANOW WZDLUZ TRASY (event_turn_interlude_259). Skan z powierzchni
    w t_253 dawal "plame"; skany robione z wnetrza, co kilkadziesiat krokow, daja PAS wzdluz
    drogi - nie mape calosci (limit repeated_detailed_scans_consume_time_and_attention).
    Co z tego wyszlo: (1) pustki nie leza przypadkiem, ida liniami rownoleglymi do tunelu
    przy murze i schodza tym glebiej, im dalej na wschod; (2) POD POZIOMEM PODZIEMI JEST
    DRUGI POZIOM - starszy kamien, ciety inaczej, bez sladu kol i rynien, czyli nie techniczny;
    (3) zageszczenie smierci lezy POMIEDZY grobami i pod nimi, warstwami, i schodzi glebiej,
    niz siega skan. Spojne z discovered_secrets#old_lower_structure, layout#zone_old_lower_route
    i #zone_unresolved_sealed_depths oraz ze skala z retcon_000166. NIEUSTALONE: co jest na
    drugim poziomie i jak daleko siega.'
  - 'VARKHEN O STANIE MIEJSCA (t_259, jego pamiec sprzed uszkodzenia, NIE pomiar): cmentarz
    polozono na wierzchu czegos starszego, dolna brama jest starsza od niego, a do dolnej
    bramy zna jedna droge - osuwisko, ktorym go stad wyniesiono.'
  - 'DWIE SYGNATURY Z AKTU 2 WROCILY DO ROZMOWY (event_turn_interlude_314) i nic o nich nie
    zostalo ustalone poza tym, co juz stalo w tym pliku. Gracz zapytal, czy wyczuwal kiedys
    dwie analogiczne sily zyciowe - pamiec okazala sie prawdziwa: one_zombie_beneath_chapel
    (wyczuty PRZEZ SCIANE) oraz nieumarly przy ZACHODNIM MURZE, obie osobne od sygnalu spod
    polnocnego fundamentu. UWAGA NA SLOWO: "zombie" bylo ETYKIETA NARRATORA z Aktu 2, a nie
    odczytem - ability_grave_sense ma no_identity_reading i detects_patterns_not_complete_
    explanations, wiec CZYM TE DWIE RZECZY SA, nigdy nie zostalo zmierzone. Nie awansowac ich
    do straznikow bez zdarzenia i nie degradowac do padliny.
    VARKHEN ZLOZYL JEDNO Z DRUGIM, bo oba czlony sa z jego warty: druga pieczec lezy pod
    kaplica i jedna z tych sygnatur lezy pod kaplica, wiec "to jest to samo miejsce" -
    po czym sam dodal, ze co to znaczy, nie wie. Narrator tego nie domyka.'
