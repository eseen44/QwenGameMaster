lucan_now_knows:
  - Sala narad ma ok. 7 na 5 metrow, trzy metry do sufitu, jedne drzwi na zapadke ze szpara pod skrzydlem.
  - Pod deskami podlogi jest pustka miedzy legarami na ok. 20 cm, a pod nia sufit glownej sali.
  - Komnata ma male, letnie zimne ognisko, a jego szyb idzie prosto na dach - tam, gdzie od tury 007 stoi Tkacz.
  - Dwa okna od strony ulicy, okiennice zamykane od wewnatrz, otwierane na posiedzenia.
  - Stol na kobylicach, 3,5 metra; szpara pod blatem jest na wysokosci glow i miotla tam nie dochodzi.
  - Skrzynia na akta, okuta i zamknieta. Zawartosci nie zna.
  - Dzban i miednica - czyli ktos wchodzi tu przed posiedzeniem i przynosi wode.
  - PRZEWODOW WENTYLACYJNYCH I INSTALACJI WODNEJ NIE MA. To nie ta epoka i nie ten budynek.
  - Nikt tej sali nie pilnuje i zaden plik nie stawia tu zamka na klucz.
lucan_does_not_know:
