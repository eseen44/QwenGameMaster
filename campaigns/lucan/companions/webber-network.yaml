    Poprawka wskazana przez pomiar z tury 090: ucho cmy slyszy pasmo nietoperza, nie
    ludzki glos. Sluchacz na SLOWA potrzebuje ucha swierszcza albo pasikonika - a
    posterunek Tkacza stoi w lace, ktora o tej porze roku gra calymi nocami.
additional_order_3:
  id: order_collect_meadow_orthopterans
  issued_event_id: event_turn_interlude_091
  supersedes: order_collect_moths_and_butterflies
  intended_instruction: Przyniesc koniki polne i szarancze z lak za garbarnia.
  actually_transmitted: >-
    Lapac duze, skaczace rzeczy z trawy, nosic do baszty. Gatunek nie przechodzi, tak jak
    nie przeszedl w 015 ani 078 - ale KSZTALT rozkazu przechodzi czysto, a w lace pod
    koniec sierpnia wszystko, co duze i skacze, jest prostoskrzydle. Rozkaz zdegradowany
    trafia w cel przez przypadek materialu.
  why_webbers_are_right_this_time: >-
    Odwrocenie lekcji z tury 088. Do ciem sieciarze byli zlym narzedziem - lampa bila
    czterech lowcow, bo cma sama leci do swiatla, a skrzydla niszczy pierwsze ugryzienie.
    Konik polny do lampy nie leci, trzeba go zlapac w trawie, a jego cialo zniesie
    szczekoczuly. Ucho prostoskrzydlego siedzi w przedniej nodze albo na pierwszym
    segmencie odwloka, NIGDY w skrzydle, wiec poszarpany okaz nadal jest dawca.
  purpose: Material dawcy narzadu sluchu nastrojonego na PASMO LUDZKIEGO GLOSU - poprawka
    do pomiaru z event_turn_interlude_090 (ucho cmy slyszy nietoperza, nie slowa).
  assigned: [webber_home, webber_tannery, webber_dump]
  excluded: webber_anchored (Tkacz) - zostaje w baszcie na polecenie Lucana.
  fidelity_by_member:
    webber_tannery: clean - laka jest tuz obok jego posterunku
    webber_home: clean - przeszedl z baszty
    webber_dump: degraded_by_distance - smietnik nie ma laki, musi ja przejsc
  tkacz_note: >-
    Tkacz wraca do baszty i tam zostaje, ale Lucan odwrocil sie plecami do stolu i poszedl
    do gildii. Ucho, drugi gruczol przedni i trzecia porcja tlumiaca rozklad leza rozlozone
    i nic sie na Tkaczu nie wydarzy, dopoki Lucan nie wroci do baszty.
