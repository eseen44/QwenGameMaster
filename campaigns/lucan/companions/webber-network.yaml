schema_version: 1
id: companion_webber_network
name: Sieć czterech sieciarzy
status: accepted_by_user_pending_package_activation
entity_kind: companion
representation:
  mode: group_with_named_primary
  count: 4
  body_scale: small_spiders
  member_ids: [webber_anchored, webber_home, webber_tannery, webber_dump]
  can_split: true
  split_rule: Zakotwiczony lub trwale zmodyfikowany sieciarz otrzymuje własny stan; pozostałe zachowują stabilne identyfikatory posterunków.
controller:
  entity_id: pc_lucan
  control_type: simple_necromantic_command
  strength: stable_for_simple_orders
  autonomy: autonomous_hunting_local_pathfinding_and_emerging_individual_preferences
  can_refuse: false
  can_break: true
  break_conditions: [reservoir_depletion, body_destruction, control_link_severed]
link:
  active: true
  range: remote_with_distance_loss
  maintenance_cost: 0
  communication: [thread_break_signal, minimal_status]
maturation:
  canon_ref: event_turn_interlude_070_varkhen_walks_up_and_the_alarm_spider
  source: out_of_game_canon_clarification_2026-08-24
  text: 'Czworka powstala PRZED Aktem 2, wiec wedlug kanonu dojrzewania gatunku jest juz
    wyrazniej madrzejsza i ma zarysowane osobowosci - nie na poziomie Spideya, bo nigdy nie
    byla nadzorowana recznie. Wiek daje SAD i TEMPERAMENT darmowo. Wiek NIE poszerza lacza:
    communication zostaje thread_break_signal + minimal_status, dopoki nie zostanie kupiony
    trwaly krok wzrostu. Madrzejszy sieciarz lepiej rozumie, co widzial, i nadal przekaze
    tylko tyle, ile miesci rura. Skutek praktyczny: rozkazy zlozone przechodza lepiej niz w
    015, ale raport strukturalny nadal nie przechodzi.'
survival_model:
  self_sufficient: true
  food_source: autonomous_small_prey_hunting
  routine_upkeep_cost: 0
  limitation: self_sufficiency_maintains_small_bodies_and_separate_reservoirs_not_unlimited_power
growth:
  model_ref: system/companion-growth.md
  permanent_growth_steps: 0
  historical_life_force_total: unknown_not_reconstructed
  current_investment: 0
  rule: Future trapper functions must be purchased through explicit growth steps rather than assumed from autonomous hunting. Cost is about an hour of handwork per modification, no escalation (retcon_000024).
state:
  location_ref: dispersed_to_named_posts_and_guild_rooftop
  condition: redeployed_after_overnight_recharge_at_wall_hideout
  post_assignment:
    webber_home: loc_city_wall_hideout  # posterunek, już nie "przy Spideyu"
    webber_tannery: loc_tannery
    webber_dump: loc_dump
    webber_anchored: loc_tannery#zone_upper_meadow
  post_assignment_event_id: event_turn_interlude_007_redeploy_and_guild_walk
  standing_order: Od event_turn_interlude_055_distributed_varkhen_upkeep Lucan poleca
    polować dyskretnie na każde osiągalne źródło życia, w tym szczury, koty i inne
    małe lub średnie zwierzęta. Priorytetem jest energia dla sieci i Varkhena;
    ograniczeniem jest widoczny hałas, świadkowie i ryzyko natychmiastowego ujawnienia,
    nie status zwierzęcia jako domowego.
  additional_order:
    id: order_collect_live_specimens_from_posts
    issued_event_id: event_turn_interlude_015_silkworms_and_specimen_order
    intended_instruction: Przynieść do baszty próbki tego, co każdy sieciarz potrafi
      znaleźć w swoim biomie - inne pająki, osy, muchy, karaluchy, ćmy, stonogi;
      po jednej z każdego gatunku, żywe.
    actually_transmitted: Łapać małe rzeczy, nie zjadać, nosić do baszty. Rozkaz
      przekroczył pasmo łącza (control_type simple_necromantic_command,
      strength stable_for_simple_orders, communication thread_break_signal +
      minimal_status), więc kategoryzowanie po gatunku i utrzymywanie okazów żywymi
      nie przeszło.
    fidelity_by_member:
      webber_home: clean
      webber_anchored: clean
      webber_tannery: degraded_by_distance
      webber_dump: degraded_by_distance
    sorting_delegated_to: companion_spidey
    sorting_timing: Spidey jest przy Lucanie (retcon_000005), więc urobek leży w
      baszcie do ich powrotu; nikt nie sortuje go w trakcie nocy.
    expected_delivery: Nocny zbiór; wynik czeka w baszcie nad ranem, prawdopodobnie
      częściowo połamany, zdechły lub uciekły.
    compatible_with_standing_order: true
  additional_order_2:
    id: order_collect_moths_and_butterflies
    issued_event_id: event_turn_interlude_078
    supersedes: order_collect_live_specimens_from_posts
    intended_instruction: Nastepnym razem przynosic motyle i cmy zamiast os i reszty
      drobiazgu.
    actually_transmitted: 'Lapac miekkie latajace rzeczy, te co przychodza do lampy,
      nosic do baszty. Rozkaz przechodzi CZYSCIEJ niz 015 - czworka jest starsza i
      madrzejsza (patrz maturation) - ale nadal bez kategoryzacji po gatunku, wiec w
      urobku beda tez cmy nocne, muchy i cokolwiek miekkiego i skrzydlatego.'
    player_rationale: 'Osy sa zbyt widoczne. Cma to skrzydla BEZ brzeczenia, a do tego
      leci do swiatla, czyli do zamieszkanych pokoi noca - lepszy szpieg od osy na
      kazdej osi poza dniem.'
    narrator_note: 'Motyl jest gorszy od cmy: lata dniem, jest kolorowy i rzucajacy sie
      w oczy, nie wchodzi do budynkow. Cmy sa tu wlasciwym celem.'
    fidelity_by_member:
      webber_home: clean
      webber_anchored: clean
      webber_tannery: mostly_clean_improved_since_015
      webber_dump: mostly_clean_improved_since_015
    expected_delivery: Nocny zbior, wynik czeka w baszcie nad ranem.
    compatible_with_standing_order: true
  casualties: 1
  casualty_notes: [Piąty dodatkowy sieciarz kancelaryjny został odnaleziony zgnieciony i wyrzucony; sprawca oraz intencjonalność pozostają nieznane; nie należał do podstawowej czwórki.]
  modifications: [undead_animation, sparse_area_web]
network_cost_model:
  source: out_of_game_canon_clarification_2026-08-24
  premise_by_player: 'Cena sieci to nie utrzymanie wezlow, a straty propagacji miedzy nimi -
    jak straty przesylowe w linii energetycznej.'
  text: 'Siec nie ma ceny UTRZYMANIA: routine_upkeep_cost 0, kazdy wezel odrabia wlasny
    ubytek polowaniem. Cena sieci to STRATY PROPAGACJI miedzy wezlami i liczby sa juz w
    plikach: sieciarz -> Varkhen 80 procent sprawnosci (state/sustained-links.yaml, 0,25 na
    wejsciu daje 0,2 na wyjsciu), Lucan <-> Spidey 70 procent na krotkim dystansie z
    narastajaca strata na odleglosc (companions/spidey.yaml efficiency_percent_at_short_range,
    distance_increases_loss). Straty MNOZA sie na kazdym przeskoku, wiec lancuch szpieg ->
    sieciarz -> Spidey -> Lucan to ok. 0,8 x 0,7 = 56 procent. Wniosek projektowy: topologie
    plaskie sa tanie, gleboka hierarchia jest droga. Dla informacji ten sam mechanizm dziala
    jako spadek WIERNOSCI, nie energii - patrz fidelity_by_member degraded_by_distance w
    rozkazie order_collect_live_specimens_from_posts.'
  attention_is_serial:
    source_event_id: event_turn_interlude_086
    text: 'ZMIERZONE W GRZE, NIE OSZACOWANE. Lacze przenosi tyle, ile przenosi, ale
      ODBIORNIK jest jeden - Lucan skupia sie na jednym wezle naraz. Przeglad dwudziestu
      jednu wezlow zajal mu trzy kwadranse marszu. Przy stu okazach ten sam przeglad jest
      niewykonalny w ciagu dnia. Pierwsza realna granica skalowania sieci nie jest ani
      energia, ani czas przy stole - jest UWAGA. Wnioski projektowe: (1) agregacja
      (jeden wezel zbiera od kilku) oplaca sie bardziej niz kolejne cialo, (2) alarm
      czytany OKIEM albo kurier fizyczny nie zuzywa uwagi w ogole, (3) roj bez
      hierarchii jest tani w utrzymaniu i nieczytelny w odbiorze.'
  animation_cost_calibration: 'Ozywienie ciala owadziej skali to koszt formalny - material i
    czas, nie rezerwa Lucana. Setki malych okazow sa osiagalne. Trzy rozne rzeczy nie mieszac:
    (1) utrzymanie = 0, (2) propagacja = 20-30 procent straty na przeskok, mnozne,
    (3) kupno funkcji (wezel, nowa zdolnosc) = OKOLO GODZINY pracy recznej za modyfikacje,
    do dwoch przy wyzszej trudnosci, BEZ eskalacji - CZAS, nie energia (retcon_000017,
    retcon_000024). Pierwszy krok na wszystkich czterech sieciarzach to ok. 4 godziny lacznie.
    (4) UWAGA = seryjna, jeden wezel naraz - jedyne ograniczenie, ktorego nie da sie kupic
    godzinami (event_turn_interlude_086).'
abilities:
  - {id: ability_sparse_web_alarm, capability_ref: capability_sparse_web_alarm, current: true, role: current_monitoring_function}
  - {id: ability_autonomous_small_prey_hunting, current: true}
  - {id: ability_poison_delivery_through_threads, current: false, status: future_aspiration}
  - {id: ability_eavesdropping_through_threads, current: false, status: future_aspiration}
  - {id: ability_magic_detection_through_threads, current: false, status: future_aspiration}
development_path:
  intended_role: trapper
  current_stage: weak_sparse_monitoring_only
  future_capabilities: [movement_recording, prepared_snares, voice_recording, magic_detection, poison_delivery_through_threads]
  rule: Żadna z przyszłych funkcji nie jest dostępna bez osobnego ulepszenia, kosztu i wpisu zdarzenia.
last_updated_event_id: event_turn_interlude_055_distributed_varkhen_upkeep
