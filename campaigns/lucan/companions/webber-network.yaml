network_cost_model:
  source: out_of_game_canon_clarification_2026-08-24
  premise_by_player: 'Cena sieci to nie utrzymanie wezlow, a straty propagacji miedzy nimi -
    jak straty przesylowe w linii energetycznej.'
  text: 'Siec nie ma ceny UTRZYMANIA: routine_upkeep_cost 0, kazdy wezel odrabia wlasny
    ubytek polowaniem. Cena sieci to STRATY PROPAGACJI miedzy wezlami i liczby sa juz w
    plikach: sieciarz -> Varkhen 80 procent sprawnosci (state/sustained-links.yaml, 0,25 na
    wejsciu daje 0,2 na wyjsciu), Lucan <-> Spidey 70 procent na krotkim dystansie z
    narastajaca strata na odleglosc (companions/spidey.yaml efficiency_percent_at_short_range,
    distance_increases_loss). Straty MNOZA sie na kazdym przeskoku, wiec lancuch szpieg ->
    sieciarz -> Spidey -> Lucan to ok. 0,8 x 0,7 = 56 procent. Wniosek projektowy: topologie
    plaskie sa tanie, gleboka hierarchia jest droga. Dla informacji ten sam mechanizm dziala
    jako spadek WIERNOSCI, nie energii - patrz fidelity_by_member degraded_by_distance w
    rozkazie order_collect_live_specimens_from_posts.'
  attention_is_serial:
    source_event_id: event_turn_interlude_086
    text: 'ZMIERZONE W GRZE, NIE OSZACOWANE. Lacze przenosi tyle, ile przenosi, ale
      ODBIORNIK jest jeden - Lucan skupia sie na jednym wezle naraz. Przeglad dwudziestu
      jednu wezlow zajal mu trzy kwadranse marszu. Przy stu okazach ten sam przeglad jest
      niewykonalny w ciagu dnia. Pierwsza realna granica skalowania sieci nie jest ani
      energia, ani czas przy stole - jest UWAGA. Wnioski projektowe: (1) agregacja
      (jeden wezel zbiera od kilku) oplaca sie bardziej niz kolejne cialo, (2) alarm
      czytany OKIEM albo kurier fizyczny nie zuzywa uwagi w ogole, (3) roj bez
      hierarchii jest tani w utrzymaniu i nieczytelny w odbiorze.'
  animation_cost_calibration: 'Ozywienie ciala owadziej skali to koszt formalny - material i
    czas, nie rezerwa Lucana. Setki malych okazow sa osiagalne. Trzy rozne rzeczy nie mieszac:
    (1) utrzymanie = 0, (2) propagacja = 20-30 procent straty na przeskok, mnozne,
    (3) kupno funkcji (wezel, nowa zdolnosc) = OKOLO GODZINY pracy recznej za modyfikacje,
    do dwoch przy wyzszej trudnosci, BEZ eskalacji - CZAS, nie energia (retcon_000017,
    retcon_000024). Pierwszy krok na wszystkich czterech sieciarzach to ok. 4 godziny lacznie.
    (4) UWAGA = seryjna, jeden wezel naraz - jedyne ograniczenie, ktorego nie da sie kupic
    godzinami (event_turn_interlude_086).'
