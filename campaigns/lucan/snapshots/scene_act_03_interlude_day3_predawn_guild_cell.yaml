summary: 'Noc dnia trzeciego w pokoju na gorze: Lucan przeczytal Uprzejmosci do konca
  i przyswoil jedenascie procedur klatw poziomu 1-2 TEORETYCZNIE - potrafi je nazwac,
  rozlozyc na kroki i opisac przeplyw, ale zadna nie ma jeszcze udanego przebiegu.
  Bramka praktyki to CEL, nie energia: fizyczne i biologiczne da sie cwiczyc na szczurach,
  ale zapadnia pamieci, rozwiazanie jezyka i usypianie nie maja wersji szczurzej i
  pierwsza proba bedzie na czlowieku. Skala poziomow i metamagia potwierdzone jako
  istniejacy kanon (system/metamagic.md); dotyk to os range na zerze warta okolo jednego
  poziomu; klatwy w swiecie uchodza za slabe i nikt sie przed nimi nie broni, a przewaga
  Lucana to celowanie kupione anatomia. Potem cztery godziny snu w prawdziwym lozku,
  co przy okazji daje przykrywce realne slady zamieszkania. Rano dnia trzeciego: spotkanie
  z Borosem i Mara o pieniadze i prawnika, dwa pajaki nadal nie postawione, Tkacz
  i zawisak czekaja w baszcie z nieskonczona robota.'
