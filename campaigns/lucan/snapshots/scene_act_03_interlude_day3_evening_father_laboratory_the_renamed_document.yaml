summary: 'Wieczor w laboratorium profesora Veyra zamkniety. Lucan przestal bronic
  sie przed granica prawna i zaczal ja pisac: warunek nadrzedny przeciw trywializowaniu
  nekromancji na ludziach i bezczeszczeniu zwlok, wyzsi nieumarli niewymienieni, nigdy
  tlum, jeden okaz za zgoda antemortem. Slowo vitae padlo przy Neris i weszlo do naglowka.
  Rod narzeczonej nazwany herbem (mniszek, handel bronia, blisko korony) i jest najwiekszym
  beneficjentem klauzuli o tlumie. Ojciec kupil zmyslony wymog dziekana, przez co
  limit jeden przestal byc miekki. Trzecia substancja - porost slepy - nazwana, build
  zawisaka domkniety na papierze. Neris zapytala wreszcie, dostala operacyjny cel
  calej sprawy i stracila przez to swiadoma niewiedze o cmentarzu; pisze. Sygnatura
  kradzionego podrecznika nieudzielona dziesiaty raz. Lucan opuszcza laboratorium.'
