summary: Lucan wrocil z zaplecza targu do gildii po rozmowie z npc_rovan_keszem. Kesz
  prowadzi teraz dla niego druga sprawe - przejecie garbarni - i od rana idzie do
  miasta z wnioskiem wierzyciela o zajecie majatku. Dostal nazwisko Halveka i wie,
  ze swiadek rozpozna go w jednym pokoju; wie tez, ze jeden taki pokoj sam obiecal.
  W gildii czeka Varkhen w plaszczu, wyjscie pod trzecia pieczec zaplanowane na te
  noc.
