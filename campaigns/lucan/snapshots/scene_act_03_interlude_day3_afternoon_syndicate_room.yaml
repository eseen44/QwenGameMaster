summary: 'Pokoj syndykatu, dzien trzeci, 14:15-16:20. Lucan wszedl jako sprzedajacy,
  wyszedl jako klient aparatu i dostawca wiedzy wyprzedzajacej. Caly lup sprzedany
  za 52 000 srebra (ryta trzecia i robota konsekracyjna wlacznie), pierwsza rata 12
  000 w zlocie w kieszeni, 40 000 do odebrania w dwoch ratach; udzialy Borosa i Mary
  osobno i w pelni, dodatkowy procent z Lucana. Hierarchia pokoju odczytana poprawnie
  dopiero za drugim podejsciem: pryncypalem jest milczacy wagowy, Ilva Rennat jest
  frontem i egzekucja, a Rovan Kesz - prawnik pakietu - okazal sie czlowiekiem spoza
  zalogi, po spotkaniach z ktorym Oren zmienial trasy. Lucan rozbroil fork dwoch sprzecznych
  obron jedna doktryna (golem z ciala, brak kategorii prawnych dla zwierzat, zero
  ludzkich zwlok), sprzedal syndykatowi termin akademickiej dysputy jako zmiane kwalifikacji
  calej kategorii towaru, odmowil przejecia pustej linii po Orenie, zadeklarowal wojne
  z Kosciolem w ciagu dwoch tygodni i uzyskal przestrzen oraz waskie wsparcie dla
  gildii przy cmentarzu. Klatwa pecha na obu odzwiernych rozlozyla pokoj naraz i zbudowala
  pierwsza cegle reputacji czlowieka, przy ktorym rzeczy sie psuja. DLUGI I OTWARTE
  DECYZJE: kanal ostrzegawczy dla syndykatu (nazwisko i sposob sygnalu), wybor drogi
  po zakon mieczowy (gildia z papierem albo komandor Veyr ze smycza), nieprzyjeta
  oferta Kesza na spotkanie z kaplanem, oraz rozmowa z Mara, ktora wyszla na ulice
  po dwoch godzinach milczenia.'
