summary: 'Konsultacja u profesora Veyra, tury 151-158. Ojciec wydal dwie z trzech
  substancji ukrywajacych (Concha surda jako plyta-oporzadzenie i Sordina jako trwala
  modyfikacja skrzydla), obie jako skargi; porost slepy nadal nie padl. Lucan sam
  odpalil zapalnik z t_147: przedstawil Neris Aldhen z nazwiskiem jako autorke tekstu
  o szerokiej definicji, czym NADPISAL, a nie zdemaskowal, przykrywke doktorantki
  - ojciec nie zarejestrowal sprzecznosci i natychmiast zaczal ryc w czesci trzeciej
  jej tekstu. Lucan odpowiedzial za nia: symetria sceptycyzmu przyznana, ale rzeczywistym
  zarzutem byla niespojnosc autorki, a problem Neris okazal sie cytacyjny, nie prawdziwosciowy.
  Padla asymetria - kryterium Kolma ma przyrzad, jej nie ma - i zostala odwrocona,
  gdy Lucan rozebral pomiar energii smierci (grabarze, sepy, czary leczace, radar
  cmentarny i samo pudelko w tej samej przestrzeni energetycznej) oraz zrownal karmienie
  z golemem ladujacym baterie korba, czym unieszkodliwil kryterium po obu stronach.
  Ojciec przeszedl od kryterium do PROCEDURY uzgadnianej z gory, punkt pierwszy przepisal
  na test zasilania zewnetrznego, a granice postawil ksiegowo w trzech przypadkach
  bez odwolania do duszy - przypadek trzeci nazwal niemierzalnym i w nim, o czym nie
  wie, stoi Varkhen. Ustalone plany: obiekt bedzie, ale CZTERY NOWE zamiast pajaka
  z kikutem, procedura na jednym z czterech, Spidey wypada ze sprawy; okazy pokazowe
  i operacyjne to dwie rozne budowy, bo Sordina i porost sa trwale; kupujemy stopien
  drugi, ale nie na potrzebe pokazu; grabarz jako proba kontrolna, rozszerzony przez
  ojca do calego rzadu kontrolnego; przedmiot dokumentu przemianowany z energii smierci
  na pozostalosci i metabolizm energii zyciowej, co czyni z niego prace biologiczna
  poza jurysdykcja Kosciola; Lucan publicznie uznal okazy za wlasnosc Akademii i zadeklarowal
  podpis, przerzucajac ekspozycje na instytucje. Brak opoznien w dostawie - swiezy
  material za okolo cztery dni. Otwarte i niezalatwione: pioro Neris nie rusza sie
  z miejsca i jej pytanie ''mam to zapisac'' wisi drugi raz; ojciec szuka na glos
  slowa vitae, ktore zna z t_019, a Neris ma pojecie bez terminu; Neris postawila
  zarzut, ze definicja bez duszy nie odpowiada na zarzut, ktory faktycznie padnie;
  sygnatura kradzionego podrecznika nieudzielona; wpis jednostki badawczej do rejestru
  zaopatrzenia niezlozony; nikt nie zapytal, po co Lucanowi okazy, ktorych nie pokazuje
  - czwarte potwierdzenie bez pytania; odbitka z nazwiskiem Neris i szkielko z Sordina
  u Lucana.'
