summary: 'Scena obejmowala: przeglad lupu z interludium (sygnet nierozpoznany, materialy
  konserwujace), retcon gotowki (retcon_000001, +60 srebra), przeglad wielkiej listy
  priorytetow gracza na najblizsze tygodnie (prawnik, status prawny Spideya, badania,
  targ, Rusk, kontrsrodek na ducha cmentarza, magia autorytetu, technika walki, klatwy),
  ujawnienie tla rodzinnego Lucana (rod Veyr, rodzice, domniemana narzeczona, glowna
  linia rodu jako sprawca sabotazu edukacji), nocny patrol i redeployment czterech
  sieciarzy (tannery/dump/dach gildii), trzy klatwy pecha na drzwi Ruska (czekaja
  niewykryte), otwarcie trzech workow lupu - 60 kg zlota/srebra niejasnego pochodzenia
  (retcon_000002) plus konsekrowany relikwiarz koscielny (potwierdzony Geo, roll 98
  vs 45), decyzja by zatrzymac relikwiarz i milczec o nim (wzrost discretion_trust
  u Mary i Borosa), wizyta w recepcji gildii - 15 srebra stypendium, pelna nagroda
  za Akt 2 odlozona do przegladu kierownictwa/przesluchania instytucjonalnego. Lucan
  konczy scene w glownej sali gildii z Mara i Borosem, z otwartym notatnikiem priorytetow
  i bez podjetej decyzji co dalej.'
