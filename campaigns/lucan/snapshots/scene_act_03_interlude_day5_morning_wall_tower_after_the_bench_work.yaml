  zostal pusty - kot i kos wygaszeni i wyrzuceni na kupe za murem (t_276), reszta
  okazow na posterunkach, szczury zawezone rozkazem do kanalow pod garbarnia. Tkacz
  na dachu gildii, Spidey w zaulkach, oboje na stalym rozkazie oslony w dystansie
  ok. 50 m (order_standoff_escort_fifty_metres). Odczyt sieci: rezerwa 15/15 przy
  sufcie, nadwyzka 22,3 na dobe, zadnych aktywnych lacz podtrzymujacych, wszystkie
  okazy fresh i daleko od progu 10; rejestr wzrostu rozliczony do t_276. OTWARTE:
  po co Lucan przyszedl do gildii.'
