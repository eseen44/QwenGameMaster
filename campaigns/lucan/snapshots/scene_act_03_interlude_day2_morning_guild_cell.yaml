summary: 'Dzien drugi interludium. Lucan wyszedl z celi w piwnicy gildii z 64 srebrami
  (zabral reszte z targu po Akcie 1, zostawil 50 pod cegla) i przeszedl caly poranek
  na targu. Ustalil, ze targ nie ma ksiegarni, a trzy kanaly: skrybow przepisujacych
  na zamowienie z zapisem, stragan ze starzyzna na wage i zaplecze bez katalogu. Kupil
  Uprzejmosci (klatwy praktyka pod przebraniem dworskiej etykiety, 12), odpis brulionu
  formul prawnych (4) i odbitki OBU stron nadchodzacej dysputy - Ivara Kolma i Neris
  Aldhen (po 3). Zagadal handlarza starzyzna npc_hesk_dorn o spis ksiag, o ktore pytano
  i ktorych nie mial - i dostal mape amatorow w miescie: powtarzajace sie pytania
  o ''cos, zeby mieso sie nie psulo'' (nie rzeznicy - handel zwlokami), jedno ciche
  pytanie o ''znaki, ktore trzyma sie pod kamieniem'' (pieczecie i konsekracja) oraz
  chlopca w liverii kupujacego dla kogos, kto sam nie przychodzi, tego samego dnia
  kazdego miesiaca. Kupil na wage w ciemno cala skrzynie ksiag po zmarlym BALWIERZU-CHIRURGU
  (15) i postawil Heskowi obiad (3), przedstawiajac sie jako czlonek grupy badajacej
  wydarzenia na cmentarzu - legenda prawdziwa. Hesk przyjal uklad, notuje dalej opisy
  I TWARZE, nie chce pieniedzy, dorzucil ze pytania o mieso URWALY SIE miesiac temu
  (popyt wygaszony, nie przeniesiony - byli JEDNA grupa) i podal termin chlopca: za
  osiem dni. Lucan ostrzegl go, ze sprawa moze byc powiazana z nekromancja; strach
  zamknal Heskowi usta na targu, ale slowo jest teraz w jego ustach i zapytany wprost
  przez urzad wysypie wszystko. W skrzyni: atlasy anatomiczne z sekcji (uderzaja w
  zapisane ograniczenie Corpse_Stitch na skali ludzkiej), wlasny brulion balwierza
  (lata cichego latania ludzi z nazwiskami, datami i kwotami) oraz tom z wypalona
  sygnatura biblioteki AKADEMII - akademicki podrecznik o przywracaniu ruchu i oddechu
  cialu, ktore przestalo. Ten ostatni zastapil upadly argument o odzywianiu: instytucja
  sadzaca ma na wlasnej polce licencjonowana procedure przywracania zatrzymanego ciala,
  czyli granica zywe/martwe jest w JEJ jezyku ciagloscia. Decyzja: oddac po przyswojeniu
  wiedzy, nie przed. Makulatura ze skrzyni zostala w celi i za darmo domknela przykrywke
  pokoju badacza. W drodze do baszty Lucan przeskanowal cala siec - 21 zywych wezlow
  plus Varkhen, zero ubytkow - i zmierzyl trzy rzeczy: uwaga jest SERYJNA (przeglad
  zajal trzy kwadranse; przy stu okazach niewykonalny), lacze serii mowi tylko zyje/glodny
  (dwie stonogi to dwa punkty bez wspolrzednych), a krzywa straty propagacji jest
  odczuwalna - klaster przy baszcie wyostrza sie, sygnaly od gildii matowieja. Spidey
  nie jest wezlem, jest drugim obserwatorem. Varkhen 17/72 i 8/65, kroplowka z czterech
  sieciarzy liczy sie w miesiacach. Przeglad surowcow w baszcie: jedna fiolka srodka
  przewodzacego (jedyna rzecz uderzajaca w strate propagacji, podnosi JEDNEGO sluge),
  preparat konserwujacy plus dwie fiolki tlumiace rozklad (trzy porcje przeciw trzydniowej
  smyczy), sol i proszek osuszajacy (material OBUDOWY wabika, nie przeszczepu), komplet
  narzedzi, pelny koszyk jedwabnikow, nierozpoznana srebrzysta esencja, sygnet z nierozpoznanym
  herbem, Pierscien Grobowego Szeptu niewykorzystywany. Na koniec przeglad nocnego
  urobku: rozkaz przeszedl, kategoryzacja nie; sieciarz gryzie, a u cmy skrzydla sa
  cala wartoscia, wiec z kilkunastu cm cale skrzydla ma 4-5. Rozwiazanie darmowe:
  lampa i sloik zbieraja wiecej calych okazow niz czterech lowcow. W urobku ZAWISAK
  - bezszelestny, nocny, zawisa w miejscu, gruby tulow z miejscem na modyfikacje,
  lepszy kurier od osy na kazdej osi poza tym, ze jest okazem wylacznie nocnym. Nieozywiony.
  Piec retconow tej sesji (000020-000024): lup przewyceniony z 4000 na 100000 srebra
  brutto, czas wabika na ok. 4 h za sztuke, interludium zapisane w pacing.md jako
  przygotowanie bez mozliwosci porazki z balansem po stronie gracza, regula posluszenstwa
  i argument o odzywianiu zdegradowane do opinii NPC (structural_flaw usuniety jako
  niezrodlowy), a formula 8 x 1.5^n SKASOWANA w calosci - modyfikacja to ok. godziny,
  piec modyfikacji klasy Spideya ponizej osmiu godzin, bez eskalacji.'
