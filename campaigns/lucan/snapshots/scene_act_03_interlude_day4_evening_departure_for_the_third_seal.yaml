summary: 'Koniec rozmowy w gabinecie Seraphine, czwarty dzien interludium, 17:54-18:01.
  Lucan zapytal o magow bojowych w gildii i dostal odpowiedz, ze gildia najmuje ekipy,
  a nie trzyma kadry - za to Seraphine zaoferowala wlasne rzemioslo: odczyt tego,
  co zarejestrowala w t_038, gdy rzucil wzmocnionego znika cztery kroki od niej. Cene
  nazwala sama, raz: antymagiczka pokazujaca nekromancie, co widzi, oddaje mu sposob
  ukrycia sie przed soba. Ruska odlozyl jako nie swoj problem; ona nie wycenila tego
  drugi raz, podala natomiast fakt operacyjny - pioro jest wygaszone jej reka, wiec
  Rusk pisze dalej, a to, co napisze, i pisma urzednika magistratu maja jeden przedmiot:
  obsade operacji w garbarni z nazwiskiem Lucana. W sprawie urzednika ma NEGATYW:
  sprawdzila i nie znalazla niczego, kanal magistratu jest calkowicie niezalezny od
  niej, nazwiska nie ma, bo odmowila jego przyjecia w t_122 - i zapytala raz, czy
  chce, zeby je teraz miala. Varkhen wstal na pytanie idziemy i odpowiedzial ze slownika
  przysiegi. NIKT NIE WYSZEDL: wlasny plan Lucana z t_230 mowi NOCA, a jest 18:01.
  Otwarte i nieodebrane: nazwisko urzednika oraz lekcja z drugiej strony pieczeci.'
