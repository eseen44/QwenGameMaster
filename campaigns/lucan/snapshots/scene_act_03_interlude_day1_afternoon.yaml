summary: 'Noc dnia 1 interludium w gildii domknieta. Varkhen wszedl o wlasnych silach
  do gabinetu Seraphine i stoi tam jako nieruchoma zbroja-straznik z protokolem sygnalu
  przez wiez. Lucan podpisal datowana dzis rejestracje wlasnej jednostki badawczej
  bez wymieniania zadnego okazu, przyznal Seraphine czesciowo, ze cos od pajakow odbiera
  (zrodla ciepla, nie tresc pism), i uzgodnil pajaka alarmowego do jej gabinetu, ktorego
  jeszcze nie zrobil. Nocleg rozwiazany dwoma pokojami: pokoj dyzurny na gorze zostaje
  zarejestrowana przykrywka utrzymywana przez Seraphine, a Lucan mieszka w celi po
  Varkhenie w piwnicy - dwoje drzwi od czworki wspolpracujacych swiadkow. Cela urzadzona
  z odzysku, alchemiczny blat stoi pusty do spotkania z Borosem za dwa dni. Eksperymenty
  zostaja poza budynkiem gildii. Lucan przechodzi do baszty przy murze.'
