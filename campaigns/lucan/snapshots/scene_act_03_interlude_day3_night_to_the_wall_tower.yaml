summary: 'Noc dnia trzeciego na czwarty. Marsz z Akademii do baszty i przeglad calej
  sieci w drodze; cztery godziny przy stole - Tkacz dostaje oba pasma sluchu i drugi
  gruczol przedni, Spidey ucho konika polnego i jako jedyny wezel zaczyna dostarczac
  tresc rozmowy. Potem porcja tlumiaca dla Tkacza, pozwolenie na polowanie dla calej
  sieci, trzy ksiazki ze schowka w murze i noc czytania w pokoju dyzurnym na gorze
  w gildii: atlasy balwierza pierwsze przejscie, jego brulion przeczytany w calosci,
  tom z sygnatura przekartkowany - czyli warunek zwrotu odhaczony. Lucan nie spal.
  Swita dzien czwarty, w planach targ po introligatora i pierwszy trening z Mara.'
