summary: 'Dzien 4 interludium, 11:39-13:00. Scena targowa zamknieta w progu pokoju
  syndykatu. Lucan wyszedl z gildii z trzema ksiazkami i pajakiem piwnicznym spy_cellar_spider_06
  w pudelku, przeszedl targ i domknal cztery sprawy. (1) Hesk Dorn wskazal introligatora
  - npc_ilmar_sedd, zaplecze rzedu ksiazkowego, bez ksiegi zamowien; warunki podane,
  zamowienie NIEZLOZONE, tom nadal u Lucana: 12 dni na jedna reke albo 8 na dwie,
  40 srebra odpis plus 18 oprawa, a Sedd chce z gory wiedziec, czy ma zrobic ksiazke,
  czy ksiazke udajaca cudza. (2) Warsztat alchemiczny kupiony za 70 srebra, skrzynka
  oplacona i czeka pod straganem; kurs zlota do srebra celowo nieustanowiony. (3)
  Czesci do slug: duze pajeczaki nie sa na targu, ale zamowienie u syndykatu jest
  w tempie na dzien 6-7; jad i szczypce skorpionie do wziecia u handlarza zywego towaru
  na zamowienie z zapisem; narzadow iluzji i kontroli umyslu nie ma nigdzie w kanonie.
  Kamien szlachetny jako bateria to dodanie do kanonu, nie odczyt - otwarte, czeka
  na deklaracje gracza; kamienie sa na zapleczu i w bizuterii grobowej, ktora Lucan
  sam sprzedal syndykatowi trzy dni temu. (4) Rovan Kesz dostal odpowiedz na pytanie
  z t_113 po 80 turach: u kaplana Lucan siada jako WSZYSTKIE TRZY naraz - Akademia
  na urlopie dziekanskim, gildia i Veyr. Wiadomosc do kaplana idzie dzis z rama TO
  CO JEST POD CMENTARZEM, ktorej Kesz nie rozumie i uznaje to za zalete. Dostal do
  uzytku oslone, ze Lucan go szantazuje. Przyjal role GWARANTA PROCEDURALNEGO wobec
  gildii i Strazy - nie obroncy - z wlasna poprawka, ze zadanie brzmi ''niech brak
  przepisu wejdzie do protokolu''. Zgodzil sie byc linia do pryncypala. Zadnej umowy,
  zadnego honorarium. DWIE KOREKTY KANONU W TEJ SCENIE: retcon_000123 skrocil ture
  targowa z 90 na 45 minut i przeniosl skrzynke szkla z piwnicy gildii pod stragan;
  retcon_000124 uniewaznil granie Kesza jako bramki pokoju (moved_seats z t_105b bije
  declaration z t_104) i przekwalifikowal ostrzezenie Seraphine z obietnicy Lucana
  na JEJ warunek, na ktory sie nigdy nie zgodzil. OTWARTE PRZY WEJSCIU DO POKOJU:
  nazwisko do kanalu ostrzegawczego (pajak jest sposobem), co Lucan oferuje poza zlotem,
  czy pryncypal uzna nowa role Kesza za aktyw, i czy Lucan bierze kamienie. Ilva Rennat
  prawdopodobnie w pokoju, ale obecnosc niepotwierdzona.'
