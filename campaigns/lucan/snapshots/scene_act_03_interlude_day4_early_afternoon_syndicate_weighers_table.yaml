summary: 'Dzien 4, 13:00-14:08. Lucan dochodzi do stolu wagowego z Keszem, a potem
  schodzi z pryncypalem do pokoju na zapleczu targu. WYNIKI: (1) Kesz zostaje prawnikiem
  Lucana - is_lucans_lawyer false->true, waski zakres gwaranta proceduralnego wobec
  gildii i Strazy, honorarium zero, warunek pokoju: syndykat widoczny, pryncypal nienazwany.
  (2) Kanal ostrzegawczy z t_113 DOSTARCZONY - spy_cellar_spider_06 Toby oddany, stoi
  w skrzynce na dolnej polce, protokol czterech talerzykow, obecnie na pierwszym;
  czwarty znaczy wejscie i termin wyjazdu z miasta (retcon_000127). (3) Trzy zamowienia
  w kanale: soczewki mineralne z odpadu jubilerskiego 15 srebra, namiary do kogos
  od klatw 10 srebra, analog metaliczny bez ceny bo bez nazwy materialu; 25 srebra
  sciagane z drugiej raty, gotowka nie zmienila wlasciciela. (4) Pierwsza odpowiedz
  na pytanie z t_103 co poza zlotem - staly popyt na odpad jubilerski, umowy nie ma.
  (5) Lucan podal pryncypalowi SKALE zagrozenia i tym samym zabral mu niewiedze, ktora
  ten kupil w t_109; przyczyna nie padla, Varkhen i pieczecie nienaruszone. Zamowienie
  u Sedda zlozone osobno (retcon_000126). NIEDOKONCZONE NA TARGU: opłacona skrzynka
  szkla alchemicznego nadal stoi pod straganem.'
