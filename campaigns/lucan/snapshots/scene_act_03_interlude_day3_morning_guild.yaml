summary: 'Dzien trzeci, rano i przedpoludnie w gildii. Lucan pokazal sie w holu, zeby
  czlonkowie gildii pamietali, ze go widzieli - dziura, ktorej Seraphine nie umiala
  zalatac - i rozsial przy tym pechy, po ktorych ludzie zapamietali czlowieka, ktory
  nuci. Potem gabinet Ruska: pierwsze uzycie Uprzejmosci spudlowane i rozladowane
  chlodem w dlon jedynego czlowieka, ktory zna te sygnature, potem dwa udane przebiegi
  - rozwiazanie jezyka na kondolencjach za degradacje, ktorej nie bylo, i usypianie
  w podarowanym piorze, ktore odbiera Ruskowi jedyna dzwignie, jaka mial. Z rozwiazanego
  jezyka wyszly dwie rzeczy: wlasny odpis kanalow i piwnic Ruska lezacy w jego gabinecie,
  oraz Malen Corth, urzednik akt magistratu uzgadniajacy teraz obsade garbarni z nazwiskiem
  Lucana - kanal, w ktorym Seraphine nie ma jurysdykcji. Na koniec Lucan pierwszy
  raz poprosil Seraphine o zgode PRZED czynem: dwa niezakotwiczone pajaki, jej szuflada
  i jego wlasny pokoj, oba postawione. Pokoj narad nie padl. Wyszedl na spotkanie
  z Borosem i Mara z energia 8 z 15.'
