summary: 'Noc czwartego dnia interludium, wyprawa na cmentarz zamknieta. Lucan wyjal
  z niszy pod polnocnym fundamentem kaplicy obrobiony, zimny przedmiot bedacy ZBIORNIKIEM
  smierci bez wlasciciela (trzy kanaly po ok. 0,6 na dobe kazdy) i niesie go w dloni
  izolowanej rozciagnietym Mroznym Dotykiem. W niszy zostal spy_beetle_01. Geo z dolu
  pokazalo, ze pod podziemiami jest drugi, starszy poziom, a smierc jest gestsza miedzy
  grobami niz pod nimi. Zejscie zawalem do komory Varkhena: korytarz do dolnej bramy
  istnieje i biegnie w dol na wschod, ale jego wlot jest gdzie indziej, a pierwsze
  kilkanascie krokow za stara brama jest zasypane - zostaja przekop albo wejscie frontowe,
  ktore znal kaplan. Varkhen czuje druga pieczec jako brudna, trzecia jako trzymajaca
  inaczej niz kiedys i odmawia podania miary, bo nie wie, czy zmienila sie pieczec,
  czy on. Zostal w swoim sarkofagu z prosba, zeby udawal, ze spi; odpiety od sieci,
  zywi go tlo cmentarza, a z Lucanem laczy go juz tylko zrywalna linia alarmowa. Lucan
  wrocil do gildii o 22:59 po pelnym przegladzie sieci, ktory nie pokazal nigdzie
  niczego - pod drzwiami gabinetu Seraphiny swieci sie swiatlo.'
