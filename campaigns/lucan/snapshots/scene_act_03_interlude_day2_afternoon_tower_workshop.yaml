summary: Dzien drugi konczy sie siedmiogodzinna sesja przy stole w baszcie i marszem
  do gildii. Doktryna kotwicy przyjeta - cztery zakotwiczone slugi i tylko cztery
  (retcon_000025). Spidey i spy_beetle_01 dostaja przeszczep narzadu sluchu z cmy;
  pomiar pokazuje, ze ucho cmy slyszy pasmo nietoperza, nie ludzkie slowa - i przez
  to jest wykrywaczem nietoperzy i szczurow, a poprawka na slowa to ucho prostoskrzydlego.
  Zawisak zakotwiczony, z jedyna fiolka przewodzaca i porcja tlumiaca rozklad, wypuszczony
  z czterema cmami na laki za garbarnia bez rozkazu. Trzej sieciarze wyslani na laki
  po prostoskrzydle; Tkacz zostaje w baszcie z nieskonczona robota. Podejrzane ksiazki
  zostaja w schowku w murze, Uprzejmosci i papiery ida z Lucanem. Dwa niezakotwiczone
  pajaki piwniczne dojechaly do gildii w pudelku i czekaja na postawienie w pokoju
  narad i gabinecie Seraphine. Wij spy_centipede_01 zlokalizowany krzywa straty gdzies
  pod dzielnica gildii, w cudzej piwnicy, nie w kanale. Lucan konczy po trzeciej nad
  ranem dnia trzeciego nad zbiorem klatw udajacym podrecznik dworskich grzecznosci.
