summary: 'Pokoje Neris Aldhen, skrzydlo pod rusztowaniem, dzien 3 interludium, 16:20-16:57.
  Lucan wszedl bez wpisu do ksiegi, pokazal Spideya i zamiast sprzedawac okaz rozbroil
  cala dysupte. USTALONE W TEJ SCENIE: (1) Spidey byl przy niej jawnie, ona widziala
  przeplyw energii wchodzacy w martwe cialo i sama nazwala to - nie konstrukt, bo
  konstrukt sie nie karmi; (2) Grave Sense potwierdzil, ze w promieniu 30 m nie ma
  zadnej obcej sygnatury smierci, a obserwator jej skrzydla jest ZYWY, czyli wpada
  w profil, ktory posterunek Spideya lapie przez sciane; Stone Sense w tym skrzydle
  nie dziala i nie zadziala, remont rozcial kamien (trwaly fakt o zone_academy_scaffolded_wing);
  (3) Lucan przedstawil kanonicznie prawdziwy lancuch: szeroka definicja wpycha hybrydy
  do kategorii konstruktu, szara strefa nie legalizuje sie proklamacja tylko zanikiem
  rozpatrywania skarg, a zanik sciezki formalnej zmienia srodek zaradczy z papieru
  na ludzi; (4) NOWY KANON: otwarta dysputa Aldhen kontra Kolm jest rozstrzygnieta
  poza uczestnikami - ustawili ja przelozeni Kolma, czyli Kosciol, ktory chce PRZEGRAC
  spor, zeby zlikwidowac forum; Neris jest w tym ukladzie PODPISEM, nie zwyciezczynia;
  (5) Neris zaproponowala, ze przegra dysputa celowo, i porzucila ten plan jako niewykonalny
  - publicznosc naprawi zle wygloszona mowe, a obie strony chca moc powiedziec, ze
  dialog zawiodl; (6) Lucan PODAL NAZWISKO: Lucan Veyr, i ona natychmiast polaczyla
  je z profesorem Veyrem ze skrzydla laboratoryjnego trzydziesci krokow stad; tozsamosc
  ujawniona swiadomie, sprawa przestaje byc dyscyplinarna i staje sie sporem o jurysdykcje,
  w ktorym Lucan jest STAWKA; (7) grozba o ojcu jest sprawdzalna bez wiary na slowo
  - dwa potepienia Inkwizycji go nie zatrzymaly, a czaszka niedoszlego napastnika
  stoi w obiegu dydaktycznym na warsztatach z optyki; (8) prawdziwa stawka nazwana
  wprost: obie strony chca PRETEKSTU, dysputa jest zapalnikiem, a motyw Lucana to
  rachunek, nie skrucha - nie chce magicznej wojny domowej w Lumarii. CZEGO NERIS
  NADAL NIE WIE: sieci sieciarzy, Varkhena, slowa vitae, ojcowskiego planu pokazu,
  celi w piwnicy gildii, syndykatu, 4 000 srebra i przepustki pod plaszczem. OTWARTE
  NA WEJSCIE W NOWA SCENE: ona oddala plan przegrania, ale nie przeszla na jego strone
  - zadala pytanie jako WARUNEK, nie jako zgode: co konkretnie znaczy posprzatac i
  czego Lucan od niej chce; postawila tez zarzut, na ktory on nie ma gotowej odpowiedzi
  - odradza wojne jako syn jednej z dwoch stron zapalnika. Mowe na dzis odlozyla.
  Do dysputy szesnascie dni.'
