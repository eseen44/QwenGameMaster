summary: 'Scena warunkow u Neris Aldhen zamknieta. Neris przyjela zadanie moderowanej
  wygranej i cene nazwala sama; zna teraz nazwisko Lucan Veyr, cene Kolma (rektorat),
  interes strazy miejskiej w zamieszkach i kontakt Lucana z syndykatem (ujawniony
  dobrowolnie). Wspolnie spisali kartke szesciu problemow: cztery przynety (jedna
  od niej - dziura definicyjna z jej wlasnej mowy) i dwa realne zamowienia R&D (chityna,
  cmy, nietoperze), ktorych zmiane rejestru zauwazyla i odlozyla. Poinstruowana (nie
  przedstawiac sie, nie dyskutowac), wyszla z Lucanem po zmroku - widzialnie dla zywego
  obserwatora skrzydla - i stoja teraz pod drzwiami laboratorium profesora Veyra,
  ktory trzeci dzien szuka w stosach odbitki z JEJ nazwiskiem i o niczym nie wie.
  Spidey zostal na posterunku w jej pokojach.'
