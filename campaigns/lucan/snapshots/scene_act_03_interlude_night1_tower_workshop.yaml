summary: 'Noc pierwsza interludium w baszcie: Lucan przebral nocny urobek sieciarzy
  i zamienil go w siec siedemnastu malych slug. Ozywil po jednym z kazdego gatunku
  i ustalil ich funkcje - pajak piwniczny jako staly obserwator, osa jako kurier zamykajacy
  odleglosc, stonoga do infiltracji, zuk jako najtrwalszy posterunek, bo je rozklad
  i nie musi polowac. Dwie stonogi poszly do kanalow, gdzie odkryl, ze siec kanalow
  siega pod piwnice gildii kratka dwoje drzwi od jego celi. Osy odpuscil jako zbyt
  widoczne i przestawil sieciarzy na cmy. Siedem zukow rozproszyl po dzielnicy bez
  rozkazu, zeby dojrzewaly. Piec pajakow przypisal sieciarzom i Spideyowi, ostatniemu
  przeszczepil gruczol jedwabnika na gesta, widoczna siec alarmowa i wystawil go w
  gabinecie Seraphine bez uzgodnienia i bez karmienia. Trzy retcony: zapasy rytualne
  nie sa warunkiem ozywienia, anchor jest wzmacniaczem a nie warunkiem pozyczenia
  zmyslu, trwale ulepszenie kosztuje godziny pracy a nie energie - co zniosло limit
  jednego wabika. Poszedl spac do celi w gildii.'
