summary: 'Koniec rozmowy w gabinecie Seraphine, czwarty dzien interludium, 16:52-17:54.
  Padly trzy z siedmiu dzwigni (prawnik jako rejestrator, dysputa jako forum do wysadzenia,
  odczyt Kolma), zadanie z t_122 zamkniete. Seraphine wybrala uklad ze Straza i postanowila
  ogloszyc kryzys nekromantyczny wiedzac, ze placi Kolmowi rektoratem. Przyjela kanal
  ustny dla Varkhena wobec kierownictwa. W t_234 COFNELA WLASNA REGULE Z t_227 po
  reklamacji Lucana: Varkhen JEST cytowalny jako pradawny straznik nekropolii skladajacy
  dobrowolne zeznanie w wewnetrznej dokumentacji gildii - niecytowalne jest tylko
  zdanie o kontroli Lucana. Pomiar trzeciej pieczeci przestal byc warunkiem ogloszenia
  i jest teraz potrzebny do pol ZAKRES i DATA na karcie kontraktowej na zbrojny zakon.
  Watek Aktu 1 przeramowany na odpowiedzialnosc POLITYCZNA - nielegalna hodowla okazow,
  ewakuacja garbarni, ekipa A-rank, zamrozony majatek, o wlos uratowany inspektor;
  teczka jest formalnie otwarta i nikt jej nie prowadzi, a dokumenty ma Seraphine.
  Sygnet z jeleniem zdjety z palca i zostawiony na jej biurku do porownania z papierami
  garbarnika - rodu nikt nie odczytal. Varkhen w plaszczu narzuconym na zbroje. Wyjscie
  pod trzecia pieczec zadeklarowane na te noc.'
