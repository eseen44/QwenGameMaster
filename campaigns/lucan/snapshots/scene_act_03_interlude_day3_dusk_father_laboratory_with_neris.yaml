summary: 'Zmierzch dnia trzeciego, laboratorium profesora Veyra. Lucan wszedl bez
  pukania z krzykiem o konsultacje i haczyk zadzialal natychmiast - ojciec porzucil
  stosy. Kartka z szescioma problemami przebila jego wlasna agende; odbitki Neris
  przeszly mu przez rece NIEPRZECZYTANE i leza na rogu stolu naglowkiem w dol, jedna
  z narysowana na odwrocie krzywa kosztu. Pytanie o to, dla kogo okazy maja byc niewykrywalne,
  zostalo skonsumowane przeramowaniem na funkcje kosztu i juz nie wrocilo. Lucan podal
  przy swiadku specyfikacje: male i zbywalne obiekty, optimum materialowe przy produkcji
  na masowa skale. Neris przedstawiona jako jego doktorantka i przyjeta bez weryfikacji
  - siedzi w rozmowie jako para rak z notatnikiem, czyli referentka szerokiej definicji
  publicznie przypieta do Lucana szesnascie dni przed dysputa. Ojciec planuje serie
  porownawcza z materialu Akademii. Scena zamknieta w momencie, w ktorym ojciec pyta
  Neris wprost, kto pisze rozsadnie o granicy konstruktu - czyli prosi ja o jej wlasne
  nazwisko, nie wiedzac o tym. Zapalnik uzbrojony i nierozbrojony.'
