summary: 'Zamknieta scena bramy i portierni Akademii (tury 127-132). Lucan wszedl
  na teren Akademii bez zadnego wpisu: rozwiazal jezyk ciecowi (curse_loosened_tongue,
  127), wykorzystal jego niezatrzymujacy sie mozg do wyciagniecia wiedzy z bramy o
  dyspucie i o Neris Aldhen (128), a potem rozdzielil dwie procedury na dwa kontakty
  - kondolencje z usypianiem i pozegnanie z zapadnia pamieci (129, rzut 54 minus 10
  przy progu 20, trzecia procedura z Uprzejmosci opanowana). Portier spi na stanowisku,
  nie potrafi Lucana opisac, a jego wlasna konfabulacja - ze ktos przychodzi wieczorami
  do Aldhen - krazy po Akademii BEZ RYSOPISU. Lucan przeszedl obok pustej ksiegi do
  skrzydla pod rusztowaniem, ktore nie ma zadnej kontroli dostepu, i przed jej drzwiami
  znalazl dwa niedomkniete tropy: slady, ktore przychodza i wracaja bez pukania, oraz
  naruszony pyl na poziomie rusztowania z widokiem na jej okna (130). Zniknal dwoch
  robotnikow i zapukal (131). Neris Aldhen wziela go za czlowieka od remontu i sama
  sie poprawila. Nowa scena zaczyna sie W SRODKU jej pokoi, drzwi na zasuwie, po ujawnieniu:
  Spidey jawnie na ramieniu, widoczne rozproszenie energii przez lacze, jej pierwszy
  odczyt fachowy ''to nie jest konstrukt, konstrukt sie nie karmi'', i jej jedno pytanie,
  na ktore czeka - KTO JESZCZE TO WIDZIAL. 16:30 dnia trzeciego, energia 10.8 z 15,
  integralnosc 19 z 19. Retcony tej sesji: 000045 regeneracja rezerwy Lucana, 000046
  koszt i rejestr klatw z Uprzejmosci, 000047 i 000048 tryby polowania slug, 000049
  Death Anchor jako antena a nie warunek sterowania, 000050 dopisana odpowiedz portiera
  o Aldhen.'
