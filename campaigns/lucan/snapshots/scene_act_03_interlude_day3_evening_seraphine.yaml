summary: 'Wieczor w gornych biurach gildii. Lucan przyszedl z kwiatami, Seraphine
  rzucila kubkiem w drzwi, zeby nikt nie wszedl, i wieczor zamienil sie w pelne rozliczenie.
  Ujawnione: linie wywozu cial prowadzi Straz Miejska (zrodlo niecytowalne), Lucan
  ma uklad z syndykatem o pustke wokol cmentarza, ma siedem dzwigni i ani jednej obrony.
  Seraphine posortowala liste - otwarla pioro nad Ruskiem, kaplana, kategorie prawnika,
  fakt kopania pod garbarnia, dysputa i nude Varkhena; odmowila rejestru, nazwisk
  i relikwii. Przyjela doktryne prawna Lucana i uchylila wlasna teze o dwoch sprzecznych
  obronach. Bierze na siebie rozproszenie piora. Wynik dysputy okazal sie poza kontrola
  Lucana, wiec przygotowanie przenosi sie na dzien po niej, a kontrakt z zakonem staje
  sie konieczny. Varkhen, ktory stal w tym samym pokoju przez cala rozmowe, zgodzil
  sie byc pokazany komandorowi PRZED kontraktem i pierwszy raz poprosil o cos dla
  siebie: o naprawe, bo w obecnym stanie nie doniesie wlasnego ciala do trzech pieczeci.'
