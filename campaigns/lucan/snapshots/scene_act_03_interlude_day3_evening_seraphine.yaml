summary: 'Popoludnie u Seraphine zamkniete. Triaz listy nitek pod jutrzejszy poranek:
  przed switem istnieja tylko urzednik magistratu, garbarnia i pioro; reszta odlozona.
  Seraphine sprawdzila rejestr korespondencji i NIE MA ani jednej kopii pism Cortha
  - relacja z garbarni jest skladana bez gildii, z ludzi gildii, imiennie. Bierze
  pioro na siebie i gasi je ta noca; kradziez pajakiem odrzucona, bo zgloszenie kazaloby
  Ruskowi podejrzewac przedmiot. Prawdziwe daty u Mary i Borosa przyjete bez sporu.
  Wlasciciela garbarni nie potwierdza i nie zgaduje - nazywa cene sprawdzenia. Jutro
  reklamuje rozdzielnik, nie akta. Kanal ostrzegawczy dla syndykatu: autoryzacji nie
  ma i nie bedzie, bo nie ma czego podpisac; linia podzialu to liczba osob, ktore
  mogly miec informacje, nie jej tajnosc; kalendarz instytucji wolno oddawac, wiedza
  wylacznie gildijna wskazuje na nia; nie chce wiedziec, kiedy Lucan tego uzyje. Skutek
  uboczny: pioro gasnie w nocy, wiec Rusk pisze od rana i pierwsze pismo idzie do
  Cortha. Lucan wychodzi z gildii i idzie do Akademii - okolo dwudziestu minut piechota.'
