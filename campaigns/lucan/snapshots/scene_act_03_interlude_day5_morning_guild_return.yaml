  immediate_questions:
  - 'Przed gildia w Lumarii, 05:31, dzien szosty, juz szaro. Rezerwa 15/15 - marsz
    i komendy w siec nic nie kosztuja, a godzina regeneracji odrobila wczorajsze 0,1.
    VARKHEN WROCIL DO WLASNEJ KOMORY i polozyl sie. Kiwnal raz i poszedl; ZADNEJ skargi
    o nieobejrzana ostatnia pieczec i narrator nie dopisal mu ani zawodu, ani ulgi
    (wzor z t_237: "kilka godzin nie jest dla niego terminem"). MELDUNEK SIECIARZA
    GARBARNIA - posterunek na lace za garbarnia, PRZY SAMYM WEJSCIU DO PIWNICY: woz
    stanal na lace; DWOJE LUDZI; SZESC PRZEJSC W DOL I SZESC Z POWROTEM; CIEZAR SZEDL
    W DOL I NIE WROCIL; potem woz odjechal. Zadnych twarzy i zadnych slow - low_bandwidth
    plus odleglosc daja liczby, nie obraz. NEGATYW TEJ SAMEJ WAGI: PRZEZ JEGO REWIR
    NIE PRZESZEDL NIKT WIECEJ PRZEZ CALA NOC. Milczenie posterunku jest informacja.
    Narrator nie dolozyl ani obserwatora, ani sladu. POTWIERDZONE WIEC NIEZALEZNIE:
    25 kg srebra i cztery zamkniete skrzynki SA w piwnicy za garbarnia (loc_tannery_cellar_hideout),
    razem z 55 kg z komory grobowej z t_300. KTO IDZIE Z LUCANEM: Spidey na ramieniu,
    Tkacz zeszla z rampy i idzie z nim. Na cmentarzu nie zostal zaden okaz zakotwiczony;
    General nadal siedzi w niszy pod kaplica. CZAS, ARYTMETYKA JAWNA: 900 s wyjscia
    na powierzchnie plus 2700 s marszu (durations# marsz_pod_mur, jedyna zmierzona
    trasa tej dlugosci) = 3600 s, 04:31 -> 05:31. SWIT JEST FAKTEM KALENDARZOWYM,
    NIE ZEGAREM. Koniec sierpnia, o 05:31 juz szaro. Nikt na Lucana nie czeka i zaden
    plik nikogo przed gildia nie stawia. LUCAN STOI PRZED WEJSCIEM i porzadkuje sobie,
    co z tej nocy Seraphine w ogole uslyszy - nic jeszcze nie postanowil. OTWARTE:
    co mowi Seraphine i czy w ogole ja budzi, czy idzie spac, czy idzie do celi i
    do warsztatu, czy odklada raport o tle cmentarza, ktory zapowiedzial Borosowi
    i Marze.'
