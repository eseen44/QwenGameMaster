summary: Doba na cmentarzu zamknieta. Od rana dnia piatego przez zejscie do komory
  grobowej, dolna hala, trzynascie oproznionych nisz i okolo 25 kg srebra, po brame
  i trzecia pieczec, druga pieczec pod kaplica i powrot o switie do gildii. Boros
  i Mara odjechali z lupem do piwnicy za garbarnia, Varkhen wrocil sie polozyc, Spidey
  i Tkacz sa przy Lucanie.
