summary: 'Scena na dziedzincu Akademii zamknieta. Lucan powiedzial Neris, ze tom jest
  wlasnoscia biblioteki i nie jest jego wypozyczeniem, a jego dewastacja to odreczne
  notatki poprzedniego wlasciciela, wiec zwrot pojdzie jawnie przez bibliotekarza
  - ktorego Neris sama umowi. Ujawnil jej z wlasnej inicjatywy marginalia i ich ciezar
  dla dysputy, a potem przestawil ramke: balwierz byl czarnorynkowym rzemieslnikiem
  probujacym przywracac topielcow bez magii, z sukcesami, i cala roznica miedzy rzemieslnikiem
  a liszem lezy w tym, kto pierwszy oprawi te notatki w zdanie. Neris odwrocila material
  z obciazenia w zrodlo i przyjela koszt cytowania go pod wlasnym nazwiskiem. Ustalona
  kolejnosc: targ jutro rano, introligatornia, potem ona. Rozmowa o tym, czy balwierz
  wchodzi do jej tekstu, odlozona do czasu, az przeczyta. Lucan wyszedl brama o 19:42;
  Neris wrocila poprawiac czesc trzecia przed pierwszym swiatlem.'
