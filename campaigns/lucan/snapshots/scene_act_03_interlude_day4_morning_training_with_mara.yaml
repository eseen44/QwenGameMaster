summary: 'Dzien czwarty interludium, 06:30-11:41. Trening z Mara Teln (3,5 h): pierwsza
  kalibracja wzmocnienia miesni - nogi daja sus, rece nagly przyrost sily, sciegno
  nie dostaje nic, 3 rzuty + 2 samoleczenia = 5 jednostek. Mara podyktowala godzine
  obserwacji czterech ran przez dziewiec dni - kolejnosc i czas, czego nie ma w atlasach
  balwierza. Lucan odpowiedzial jej na pytanie o Varkhena wersja czesciowo prawdziwa,
  z celowo zasianym klamstwem o nieprobowaniu na zywych. Papiery z baszty zostaly
  w pokoju dyzurnym, pajak-czujnik wrocil na posterunek, oba wije dostaly staly rozkaz
  mapowania podziemia gildii. Potem gabinet Seraphine: odebrala oba zlecenia z t_052
  - lancuch autoryzacji zapory konczy sie w gorze Strazy Miejskiej i nie da sie tego
  napisac, gospodarstwo straznika celowo nietkniete, a jedynym otwartym koncem jest
  czlowiek z plama atramentu na lewym kciuku, ktory spotykal sie z Orenem przed wyjazdami.
  Lucan nazwal na glos, do czego sluzy mapa nacisku, i pierwszy raz komukolwiek powiedzial
  swoja linie: zadnej obrony, bo nie ma paragrafu, zadnego milczenia, ratowanie miasta
  niezaleznie od jego woli, metoda szantaz i wkurwianie wszystkich grup interesow.
  Oddal Seraphine brulion balwierza - terminarz, faktury i klientow czlowieka obslugujacego
  syndykat i Straz naraz przez dziesiec lat - dwadziescia minut przed jej spotkaniem
  ze Straza. Przyjela, papieru do pokoju nie bierze, zastrzegla dwie rzeczy: pokoj
  balwierza sprzedawano NA WAGE, wiec moze istniec drugi egzemplarz, a jedno wspomnienie
  balwierza na zawsze ujawnia, ze papier istnieje. Nadal nie dostala odpowiedzi o
  kolejnosc trzech dzwigni. Seraphine wyszla na spotkanie ze Straza; Lucan zostal
  sam z atlasami i tomem bibliotecznym, targ po introligatora przed nim.'
