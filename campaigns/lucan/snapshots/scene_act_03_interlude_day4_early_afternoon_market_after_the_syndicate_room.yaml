summary: 'Czwarty dzien interludium, popoludnie. Lucan odebral oplacona skrzynke szkla
  alchemicznego spod straganu i poszedl na komende strazy miejskiej - lokacja zalozona
  przy pierwszym wejsciu, po tym jak gracz zadeklarowal, ze ludzie z udzialem w sprawie
  cmentarza nie siedza z przodu. Pod falszywym imieniem MARC, wziety przez dyzurnego
  za rzemieslnika ze skrzynka, wyciagnal z Vereka Dasta trzy rzeczy: nazwisko czlowieka
  od podnoszenia bramy wozom (Ossek Marn) wraz z jego posterunkiem, zmiana i szynkiem
  oddzialow bramnych; skarge, ze oddzialy bramne przepuszczaja na papiery, ktorych
  kontuar nigdy nie oglada - czyli blankiet z t_035/t_036 opisany od dolu przez czlowieka,
  ktory nie wie, co opisuje; oraz potwierdzenie pomiaru z t_034, ze zadanie do gildii
  nie jest ponawianym odpisem, tylko za kazdym razem NOWYM pismem z nowa data i pieczecia,
  i ze normalnie takie cos umiera na biurku, a to nie umiera. Na pozegnanie dostarczyl
  dotykiem curse_memory_trap - Dast straci rysopis, zachowa cala tresc rozmowy. W
  trakcie uscisku zerknal na przybity arkusz: podpisu nie odczytal z czterech krokow,
  ale rozpoznal PIECZEC URZEDU jako te sama, ktora nosi w kieszeni na kradzionym glejcie
  przejazdowym. Polowa weryfikacji, ktora Seraphine wzięla na siebie w t_036, zostala
  wykonana poza jej aktami i pod cudzym imieniem. W ksiedze komendy nie ma ani jednego
  wpisu. Scena konczy sie na ulicy przed szynkiem Pod Obrecza w cieniu polnocno-zachodniej
  zapory, o 15:14, ze skrzynka szkla w rekach.'
