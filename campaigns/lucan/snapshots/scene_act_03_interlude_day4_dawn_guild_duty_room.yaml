summary: 'Swit dnia czwartego w gildii. Lucan nie spal i nie zamierza - retcon_000112
  pokrywa brak snu z nadwyzki, a zaden plik nie stawia mu warunku zmeczenia. Zmierzyl
  trzy wezly przy sobie, po czym okazalo sie, ze rejestr bankow wzrostu istnial od
  dawna i narrator go pominal (retcon_000114) - stawki poprawione. Gracz zamknal ekonomie
  nadwyzki jako regule stala (retcon_000115): parenascie jednostek na dobe, sufit
  rozwoju rowny polowie pojemnosci zbiornika, rozdzial miedzy wezly, Varkhen racjonowany,
  Lucan wezlem jak pozostale. Zuk dostal reczne ladowanie 3,5 na dobe i tym samym
  najwyzsza stawke w sieci - ograniczona wlasnym sufitem 1,5 do czasu enlarge_reservoir_to_tank.
  Trzy pajaki piwnicze zeszly z posterunkow na swobodny zer; pajak w szufladzie Seraphine
  zostal w zasiegu, bo jest JEJ kanalem alarmowym, a nie pulapka (retcon_000116).
  Lucan wszedl do sali narad - stoi otwarta, bez zamka i bez warty - i obejrzal ja
  pod katem zdalnej infiltracji. Przewodow wentylacyjnych i instalacji wodnej w tym
  budynku nie ma; sa trzy drogi: pustka miedzy legarami pod podloga, szyb ogniska
  idacy prosto na dach z posterunkiem Tkacza, i szpara pod blatem na wysokosci glow.
  Nie postawil tam niczego. Wrocil na gore i do przyjscia Mary cwiczyl pozyczony zmysl
  przez Spideya i Tkacza, zdobywajac wzorzec tego, jak ludzka mowa brzmi przez pozyczone
  ucho. Sciana nie jest juz czujnikiem ani droga, jest ZAPISEM. Na schodach krok Mary,
  o umowionym switie dnia czwartego.'
