summary: 'Podworzec Pod Obrecza, t_211-221. Rekonesans dwoma okazami, czterdziesci
  minut czekania z ksiazka, i Ossek Marn wyciagniety z osmioosobowej grupy trzema
  stackami numb rzuconymi z pozycji Spideya. Dwa razy podniesiony z ziemi: pierwszy
  dotyk niosl rozwiazanie jezyka, drugi zapadnie pamieci. Zdobyte: czwarte niezalezne
  potwierdzenie, ze glejt stalej trasy schodzi Z GORY, tym razem od czlowieka przy
  dragu, plus opis mechanizmu od dolu - woz stalej trasy NIE STAJE. Zmierzona tez
  pierwsza konfabulacja kampanii: przechwalka o zalatwieniu papieru, za ktora nie
  stoi nic. Niezdobyte: nazwisko, urzad, szczebel, zawartosc, trasa - i nie padlo
  pytanie, czy Marn wiedzial, co wozi. Zaplacone 7,38 energii z 15, w tym 3 za confusion,
  ktory skonczyl sie w chwili odejscia. Marn zostal na podworcu, partially_immobilized,
  z cala trescia rozmowy i bez twarzy Lucana. Cztery retcony: 128 i 129 rozdzielily
  rekwizytowa skrzynke od warsztatu alchemicznego, 130 przywrocilo Spideya i Tkacza
  do orbity Lucana, 131 wprowadzilo rzucanie z pozycji slugi, 132 rozerwalo klatwe
  od kanalu dostarczenia. Lucan konczy przy okienku recepcji gildii z niezadanym pytaniem
  o dostep do nauczycieli.'
