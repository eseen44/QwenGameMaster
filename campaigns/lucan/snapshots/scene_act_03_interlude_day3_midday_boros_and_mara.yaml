summary: 'Zaplecze targu, poludnie dnia trzeciego. Boros przedstawil lup rozdzielony
  na anonimowe dwie trzecie i ryta, identyfikowalna trzecia; Lucan odrzucil przetop
  i oddal CALOSC drodze Mary - syndykatowi. Marze kazal napisac urzednikowi akt prawdziwe
  daty i dopisac Halvena Ruska jako obecnego w garbarni. Uzgodnil z Mara godzine treningu
  dziennie od rana dnia czwartego. Syndykat odpowiedzial w ciagu godziny: dzis, towar
  i czlowiek w jednym pokoju, kwota nienazwana, i wiedza czyj to towar. W drodze Lucan
  uprzedzil Mare, ze idzie po wspolprace - dostep do ich rynku i prawnikow - czym
  przestawil jej poreczenie z transakcji na czlowieka. Wyrywkowy przeglad sieci pokazal
  dwoch sieciarzy na lace po narzad prostoskrzydlego, trzeciego w drodze, czwartego
  przy stole w baszcie, milczace czujniki w gildii, Varkhena na kroplowce - oraz trzy
  slugi chodzace bez rozkazu i bez nadzoru. Scena konczy sie pod drzwiami syndykatu:
  szescdziesiat kilo na progu, Boros odchodzi.'
