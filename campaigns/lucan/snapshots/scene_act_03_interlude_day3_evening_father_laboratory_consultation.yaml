summary: 'Konsultacja u ojca w laboratorium, zmierzch dnia trzeciego, 17:28-17:41.
  Haczyk ''konsultacja'' otworzyl profesora Veyra od progu; kartka z szescioma problemami
  przebila jego wlasna agende. Neris weszla jako cicha towarzyszka, potem zostala
  podana jako doktorantka Lucana - przykrywka przyjeta bez weryfikacji, jej imie padlo
  i nic nie uruchomilo, bo ojciec gubi nazwiska i pamieta papier. Jej dwie odbitki
  przeszly przez jego rece NIEPRZECZYTANE i skonczyly w dloni Lucana, krzywa do gory,
  naglowkiem w dol. Pytanie ''niewykrywalny dla kogo'' padlo z ust ojca i zostalo
  przeramowane na wykrywalnosc jako funkcje kosztu; cena przeramowania to specyfikacja
  produkcji masowej wypowiedziana przy Neris. Lucan zdjal z niej pytanie o literature,
  wetkajac ojcu pod nos kartke z krzywa i nowy problem o srebrze - srebro odrzucone
  wlasna krzywa ojca, ''twoj profesor nie liczyl''. Przypisy zlecone Neris; atrybucja
  rozwiazana bez zadnego nazwiska - odeslanie do tabel zaopatrzenia Akademii. Dokument,
  ktory Neris pisze wlasna reka, zmienil gatunek z zapisu o niewykrywalnosci na POROWNANIE
  CEN MATERIALU, czyli produkt zarejestrowanej jednostki badawczej gildii. Cena: cena
  za sztuke swiezego towaru padla przy niej na glos, wraz z nazwa rejestru. Na koniec
  os poprawiona z materialu na wykrywalnosc: nie jedna krzywa, a SCHODY - trzy klasy
  obserwatora, punkt odciecia na stopniu drugim, antymagia odrzucona jako samooskarzajaca,
  stopien trzeci nie do kupienia, tylko do unikania. Rejestr zaopatrzenia zostal w
  szafie. Neris porzucila przypisy, zeby powiedziec przy profesorze Veyrze, ze granica
  moze nie byc cecha przedmiotu, tylko cecha patrzacego. Scena zamknieta na pytaniu
  ojca: do ktorego stopnia kupujemy - czyli na pytaniu ''dla kogo'' wrocanym przez
  drzwi wejsciowe i wywolanym przez samego Lucana.'
