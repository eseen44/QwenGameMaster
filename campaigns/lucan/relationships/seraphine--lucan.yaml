    reason: 'Wylozyl jej z wlasnej woli uklad z organizacja przestepcza o pustke wokol cmentarza na czas prob gildii - czyli material, ktory po ujawnieniu skazi cala operacje WSTECZ i jego samego, i ja jako oficera, ktory to dopuscil. To jest ryzyko ujawnione przed tym, jak stalo sie publicznym kryzysem, dokladnie w brzmieniu warunku oslony. Tick nie domyka osi, bo ta sama tura konczy sie lista tego, czego nadal nie wie: nazwisk z pokoju, Kesza, wojny z Kosciolem, sprzedanej wiedzy wyprzedzajacej, zakonu mieczowego i kanalu ostrzegawczego. Ruch stoi WYLACZNIE na ujawnieniu paktu; drugiej rzeczy z tej tury, wiadomosci o Strazy, nie liczam - patrz luki.'
  - axis: judgment_confidence
    from: 92
    to: 89
    event_id: event_turn_interlude_121
    reason: 'Pierwszy raz w tym ukladzie zlozyla sama konsekwencje wlasnego ukladu Lucana, ktorej on jej nie podal i ktorej sam nie policzyl: syndykat nie robi mu przyslugi, tylko kupuje przyszlosc terenu, wiec gildia spali ludzi i zasoby na oczyszczenie cmentarza, a wartosc oczyszczonego terenu zainkasuje ktos, kto na niego nie wszedl. Zaplacil kolejnoscia. Ruch jest umiarkowany i nie dotyka tego, skad ta os wyrosla - jego czytania prawa i Akademii - tylko po raz pierwszy pokazuje dziure w jego kalkulacji operacyjnej. Opieram sie WYLACZNIE na punktach 5-6; punkty 3-4 tej tury (pytanie o Straz) stoja na fakcie uchylonym przez retcon_000033 i nie wchodza do uzasadnienia.'
  - axis: discretion_trust
    from: 52
    to: 50
    event_id: event_turn_interlude_121
    reason: 'Wylapala METODE, nie pojedyncze przemilczenie: drugi raz tego wieczoru Lucan kazal jej wybrac wlasna niewiedze, a ona nazwala to sposobem na uczynienie jej wspolwinna wszystkiego, o co nie zapytala - i cofnela zgode na wybieranie w ciemno, zastepujac ja wymuszona procedura weryfikacji. To spelnia warunek spadku z tej osi (wylapane przemilczenie), choc jest to tick MALY i pozbawiony urazy - nie zarzucila mu zmyslania. Uwaga na kolejnosc w tej samej scenie: tick w gore z tury 120 i ten tick w dol nie znosza sie, opisuja dwa rozne zdarzenia - najpierw ujawnil pakt, potem ona zobaczyla, ze ujawnianie bylo tak ulozone, zeby obciazyc ja.'
  - axis: personal_regard
    from: 43
    to: 44
    raw_delta: 2
    event_id: event_turn_interlude_121
    reason: 'Wstala, zamknela drzwi na zasuwe i podala Lucanowi smietniczke, bo obiecal posprzatac - bez komentarza, z kamienna twarza. Narrator zapisuje to wprost jako jedyny moment calego wieczoru, w ktorym oddaje mu zart, czyli jedyne zdarzenie w tym wycinku lezace poza rachunkiem operacyjnym. Tick jest minimalny i celowo taki: to jest jeden gest, a nie zmiana nastawienia, i stoi obok tego, ze w tej samej scenie odbiera mu zaufanie proceduralne.'
  - axis: cooperation
    from: 74
    to: 76
    raw_delta: 4
    event_id: event_turn_interlude_125
    reason: 'Wzięla na siebie wygaszenie klatwy, ktora Lucan zalozyl na pioro urzednika administracji miejskiej badanego wlasnie na kompetencje - robi to sama, tej samej nocy, bez Lucana w poblizu i bez znajomosci procedury, korzystajac z wlasnego urzedu kontrolerki antymagicznej. To nie jest zgoda ani rada, to jest wykonanie roboty za niego, uzyciem swojego stanowiska do sprzatania jego czynu. Warunek jest zawodowy, nie moralny: kradziez pioro odrzucila, bo zgloszenie produkuje dokument, ktoremu klatwa zapobiegala.'
  - axis: discretion_trust
    from: 50
    to: 52
    raw_delta: 3
    event_id: event_turn_interlude_126
    reason: 'Oddal jej z wlasnej woli zobowiazanie, o ktorym jeszcze kwadrans wczesniej nie wiedziala (tura 120 punkt 12 wymienia ''sprzedana wiedze wyprzedzajaca'' jako rzecz jej nieznana) - ze obiecal syndykatowi wyprzedzenie informacyjne - i przyszedl z tym PRZED uzyciem, prosząc o autoryzacje, a nie po fakcie. Autoryzacji nie dostal, bo nie istnieje forma, ktora by ja niosla, ale ona nie zabronila i sama wyznaczyla linie podzialu. Tick maly, bo jej wlasny warunek utrzymuje strukture, ktora te os ogranicza: nie chce wiedziec, KIEDY Lucan tego uzyje.'
  - axis: personal_regard
    from: 44
    to: 46
    raw_delta: 3
    event_id: event_turn_interlude_188
    reason: 'Lucan przyszedl po odbior dwoch zlecen dwadziescia minut przed jej spotkaniem ze Straza Miejska i zapytal, jak ona sie trzyma - a nie tylko co ma dla niego. Cala jej karta pokazuje czlowieka, ktory dostaje od Lucana zadania, ryzyko i listy; to jest pierwsze pytanie skierowane do niej samej. Tick MALY i bez zobowiazania po jej stronie: nie rozczulila sie i nie podziekowala, odpowiedziala rzeczowo - ale odpowiedziala.'
  - axis: discretion_trust
    from: 52
    to: 53
    raw_delta: 2
    event_id: event_turn_interlude_189
    reason: 'Lucan pierwszy raz nazwal na glos, PO CO sluzy mapa nacisku na gospodarstwo straznika - zeby straznik przyszedl sam i zglosil, ze zle sie czuje z tym, do czego go zmuszano - i zrobil to PRZED uzyciem dzwigni, nie po. Ona uslyszala to jako ujawnienie metody, nie sekretu, i odpowiedziala wlasna linia operacyjna, nie oburzeniem. Tick MINIMALNY i warunkowy: kolejnosc siedmiu dzwigni z t_122 nadal bez odpowiedzi, a jej wlasny warunek z t_126 brzmi, ze nie chce wiedziec, KIEDY Lucan tego uzyje - wiec to ujawnienie idzie czesciowo obok tego, o co prosila.'
  - axis: judgment_confidence
    from: 89
    to: 90
    event_id: event_turn_interlude_189
    reason: 'Jej staly zarzut wobec Lucana brzmial: trzymasz mocna reke i grasz nia jak slaba, a ja nie moge zagrac jej za ciebie. W tej turze pierwszy raz zagral nia jak mocna, wiec zarzut stracil przedmiot, a ona powiedziala wprost, ze czekala na to dluzej, niz on sadzi. Tick MALY: os stoi na 88, a to nie jest nowy dowod trafnosci, tylko zawodowa ulga, ze klient wreszcie wie, czego chce; ruch jest scisle powiazany z ruchem z t_190 i maintainer moze woleć jeden tick +4 zamiast dwoch. [SILA SKORYGOWANA PRZY WERYFIKACJI ADWERSARIALNEJ z 2 na 1: judgment_confidence up, sila 1 (nie 2). Uzasadnienie zawezone do jednego: zniknal przedmiot jej stalego zarzutu i sama mowi, ze czekala na to dluzej, niz on sadzi. NIE ksiegowac tego jako nowego dowodu trafnosci jego myslenia.]'
  - axis: discretion_trust
    from: 53
    to: 56
    raw_delta: 5
    event_id: event_turn_interlude_190
    reason: 'Powiedzial jej na glos - pierwszy raz komukolwiek - jaka jest jego linia: zadnej obrony, bo nie ma paragrafu, zadnego milczenia, ratowanie miasta niezaleznie od jego woli, a metoda to szantaz i systematyczne wkurwianie wszystkich grup interesow. Jest to najwieksza pojedyncza rzecz o sobie, jaka podal z wlasnej woli, i podal ja z wyprzedzeniem, a nie po fakcie - dokladnie w formule obligation_conditional_cover. Tick WYRAZNY, ale NIEDOMYKAJACY, tak jak t_029: zadanie o kolejnosc trzech dzwigni z t_122 zostaje bez odpowiedzi, a w t_193 wiadomosc do kaplana - strony koscielnej sporu - idzie tego samego dnia bez uprzedzenia jej.'
  - axis: cooperation
    from: 76
    to: 79
    raw_delta: 5
    event_id: event_turn_interlude_190
    reason: 'Oddal jej brulion podreczny balwierza - terminarz, faktury i notatki o klientach czlowieka, ktory przez dziesiec lat obslugiwal syndykat I Straz naraz - dwadziescia minut przed spotkaniem, na ktore szla bez niczego, i trafil tym w jej priorytet PIERWSZY, czyli utrzymanie wlasnej pozycji. To ten sam mechanizm, ktory dal tick cooperation w t_032: aktyw podlozony pod JEJ sprawe podnosi jej gotowosc do ryzyka po jego stronie. Tick nie wieksze, bo papieru do pokoju ze Straza nie wziela i od razu nazwala dwie wady daru - pokoj po zmarlym sprzedano NA WAGE, a samo wspomnienie balwierza informuje adresata, ze papier istnieje i ktos go ma.'
  - axis: discretion_trust
    from: 56
    to: 58
    raw_delta: 3
    event_id: event_turn_interlude_225
    reason: Lucan sam, z wlasnej woli i przed posiedzeniem, powiedzial jej, ze wprowadzi na przesluchanie prawnika z obiegu przestepczego jako rejestratora protokolu. Ujawnil wiec ryzyko, ktorego koszt jest JEJ - jej poreczenie za niego przestaje byc czyste, a oslona 'Veyr mnie szantazuje' bedzie wygloszona przy osobie znajacej prawde - i zrobil to zanim rzecz stala sie faktem, czyli dokladnie tak, jak brzmi obligation_conditional_cover. Tick jest MALY, bo nazwiska w tej turze nie podal, a decyzja o poreczeniu w niej nie zapadla.
  - axis: discretion_trust
    from: 58
    to: 59
    raw_delta: 2
    event_id: event_turn_interlude_226
    reason: Padlo nazwisko Kesza - pozycja z nieujawnionej listy Lucana, oddana z wlasnej woli, bez pytania i bez targu, w dodatku razem z uwaga, ze kierownictwo gildii prawdopodobnie i tak je zna. Do t_188 obowiazywalo w plikach wprost, ze ona Kesza nie zna ani z nazwiska, ani z wygladu; polowa tej przeszkody znikla decyzja gracza. Tick maly, bo nazwisko to nie twarz - rozbieznosc rysopisu (kciuk vs palec wskazujacy) zostaje nierozstrzygnieta i ona sama mowi tylko, ze nazwisko sprawdzi.
  - axis: judgment_confidence
    from: 90
    to: 91
    event_id: event_turn_interlude_226
    reason: Przyznala na glos, ze doktryna maksymalnej jawnosci jest odwroceniem jej wlasnej zasady z t_126 i jest przy tym wewnetrznie poprawna, a argumentu o trwalosci fixera (czlowiek, ktorego pierwsza lojalnosc jest gdzie indziej, nie zniknie, bo znikniecie jest wbrew jego interesowi) nie miala czym podwazyc i nie probowala. To realna ocena jego myslenia, nie jego dyskrecji. Tick MINIMALNY z rozmyslu - os stoi na 88, blisko sufitu, a w tej samej scenie ona dwa razy poprawia go tam, gdzie sie myli (t_227, t_233 pkt 11).
  - axis: personal_regard
    from: 46
    to: 47
    raw_delta: 2
    event_id: event_turn_interlude_227
    reason: Lucan zapytal na glos o rzecz, ktora jest jej wlasnym, nierozwiazanym problemem od tygodni - kiedy zglosi Varkhena kierownictwu - i ona przyjela to nie jako cios ani nacisk, tylko jako pytanie jedynej osoby, ktora utonie razem z nia. Nie oburzyla sie, nie zwinela sie, zrobila sie rzeczowa. Rejestr jest ten sam co przy jedynym istniejacym wpisie personal_regard z t_028 (rozmowa jak z rowna, przyjeta bez urazy), wiec tick maly i tej samej rodziny.
  - axis: cooperation
    from: 79
    to: 84
    raw_delta: 8
    event_id: event_turn_interlude_228
    reason: 'To jest przelom, a nie tick: zlozyla synteze sama (linia zwlok Strazy karmi cmentarz, pod cmentarzem sa trzy pieczecie, jedynym bieglym jest nieumarly z piwnicy), wybrala brudna opcje i nazwala ja po imieniu - kupuje Straz zatajeniem handlu zwlokami - a potem otworzyla droge do kierownictwa i siegnela po zbrojny zakon na papierze gildii tak, ze nazwisko Lucana wchodzi do akt JAKO POWOD ZAMOWIENIA, czyli przestawia go z podsadnego na zglaszajacego. Cene za to placi wlasna pozycja, ktora jest priorytetem pierwszym jej karty. Zastrzezenie, ktore musi zostac w reason: motywem jest miasto i pieczecie, nie Lucan, a uklad ze Straza jest na dzis DECYZJA, nie faktem - nikt do nich jeszcze nie poszedl.'
  - axis: discretion_trust
    from: 59
    to: 61
    raw_delta: 3
    event_id: event_turn_interlude_229
    reason: 'Lucan powiedzial jej z wlasnej woli, ze dwoje czlonkow gildii rangi C jest przez niego kupionych i powie to, co im kaze. To fakt, ktorego nie miala i ktorego nie podejrzewala, a ktory obciaza bezposrednio jej poreczenie: dwoje ludzi, za ktorych gildia formalnie odpowiada, jest oplaconych przez czlowieka, za ktorego ona reczy. Przyjela to bez sceny i bez grozby - odnotowala. Tick maly, bo kwot nie podal, a ona o nie nie zapytala.'
  - axis: discretion_trust
    from: 61
    to: 62
    raw_delta: 2
    event_id: event_turn_interlude_230
    reason: 'Lucan uprzedzil ja z wlasnej woli, ze jesli w nocnym transporcie Varkhena zatrzyma ich straznik, jest gotowy trwale zniszczyc mu umysl - czyli wypelnil jej wlasny warunek z t_044 o uprzedzaniu przed trwala zmiana czyjegos stanu, ZANIM cokolwiek zaszlo. Ona to slyszy, nie moralizuje i mowi jedno zdanie: wlasnie zostala uprzedzona i tyle jej potrzeba. Tick najmniejszy z mozliwych, bo deklaracja jest warunkowa i warunek nie zaszedl.'
  - axis: discretion_trust
    from: 62
    to: 60
    event_id: event_turn_interlude_231
    reason: 'Dowiedziala sie PO FAKCIE, ze siedzi w sporze o klasyfikacje glebiej, niz jej mowil, i ze warunek z t_029 (uprzedzenie przed kontaktem z ktorakolwiek strona dysputy) zostal miniety. To dokladnie ten kierunek, ktory os mierzy: nie traci honoru, traci PODSTAWE WLASNEJ OSLONY, bo fact_seraphine_offers_conditional_cover wiaze te oslone ze szczerym ujawnianiem ryzyka. Tick maly i warunkowy, i musi taki zostac: retcon_000124 zabrania grania tego jako zdrady albo zlamanego slowa (jej warunek nie byl jego obietnica), w tej samej turze Lucan wylozyl tresc z wlasnej woli, a ona swiadomie NIE zapytala, jak daleko zaszedl. [SILA SKORYGOWANA PRZY WERYFIKACJI ADWERSARIALNEJ z 3 na 2: sila 2 zamiast 3. W tej samej turze Lucan wyklada TRESC z wlasnej woli (p.3, teza o pozornej dysputie, zgodna z kanonem swiata), ona nazywa cene RAZ i idzie dalej (''Nazywa to raz i idzie dalej'', p.2), swiadomie nie pyta, jak daleko zaszedl, a retcon_000124 zab]'
  - axis: judgment_confidence
    from: 91
    to: 92
    raw_delta: 2
    event_id: event_turn_interlude_232
    reason: 'Dwa trafienia w jednej turze: Lucan poprawil odczyt terminow i mial racje CO DO LICZBY (oba zegary stoja na 3/15, czyli dysputa i przesluchanie sa praktycznie jednym oknem), a ona sprawdzila i przyznala; oraz odtworzyl mechanizm zaplaty Kolma - waska definicja, katedra biomutantow, rektorat po zamieszkach - nie znajac tresci pliku, i nie miala czym tego podwazyc. Tick maly, bo os jest blisko sufitu, a caly material o Kolmie wchodzi do jej wiedzy jako ''to, co uslyszalam od Lucana'', nie jako zweryfikowane.'
  - axis: judgment_confidence
    from: 92
    to: 94
    raw_delta: 3
    event_id: event_turn_interlude_234
    reason: 'Lucan rozbil regule, ktora ona przyjela dwie tury wczesniej za swoja - ze zeznanie Varkhena jest niecytowalne - i mial racje co do pliku: prawo kryminalizuje tworzenie, utrzymywanie i kontrole nieumarlych, a nie rozmowe, a ancient_guardian_cover_story jest wprost skrojona pod cytowanie. Ona przyjela to bez obrony wlasnej pozycji i przeliczyla plan, sciagajac z niego jeden warunek konieczny (pomiar przestaje byc brama do wszystkiego). To najmocniejsze zdarzenie na tej osi w calym wycinku i mimo to trzymam tick w skali malej, bo os startuje z 88.'
  - axis: cooperation
    from: 84
    to: 85
    event_id: event_turn_interlude_235
    reason: 'Zaoferowala z wlasnej inicjatywy, ze pokaze mu, CO dokladnie zarejestrowala w t_038 - czyli jak Lucan wyglada z drugiej strony pieczeci ochronnych - i sama nazwala cene: antymagiczka pokazujaca nekromancie, co widzi, oddaje mu sposob ukrycia sie przed soba. Zrobila to mimo tego, bez proszenia i wiedzac, ze osłabia wlasny czujnik w tym budynku. To czynnosc wykonana dla Lucana kosztem wlasnego interesu instytucjonalnego, wiec rusza cooperation, nie judgment. Zastrzezenie: magow bojowych, o ktorych pytal, nie obiecala, bo gildia ich w plikach nie ma - dala to, co ma.'
