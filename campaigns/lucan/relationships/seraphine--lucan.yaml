structural_weakness_note: 'event_turn_interlude_033_veyr_is_not_a_family - jej oslona jest
  strukturalnie slabsza, niz zakladala. Jesli Veyrowie siedza w fotelach po wszystkich
  stronach, gildia jest jedna z wielu instancji, a ona najslabsza strona przy stole.
  Powiedziala to na glos i bez ironii - jest prawdopodobnie jedyna strona, ktorej oslona nad
  Lucanem nie jest transakcja.'
axis_change_log:
  - axis: discretion_trust
    from: 15
    to: 22
    event_id: event_turn_interlude_025_spidey_on_seraphines_desk
    reason: 'Lucan przyszedł do niej sam, w nocy, nieproszony, i na pytanie o nieujawnione
      ryzyka postawił Spideya na jej biurku, zamiast zaprzeczyć. To realny gest dobrej
      woli w ramach obligation_conditional_cover. Tick jest MAŁY i warunkowy - to była
      odpowiedź częściowa, podana żartem, a ona sama powiedziała na głos, że wnioskuje z
      niej istnienie gorszych pozycji na liście. Pełne zaufanie zależy od tego, czy Lucan
      wyłoży resztę (relikwiarz, złoto, dysputa, ojciec).'
  - axis: discretion_trust
    from: 22
    to: 25
    event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
    reason: 'Wyłożył jej z własnej woli ostrzeżenie polityczne, którego nie musiał podawać -
      że przez jego nazwisko sprawa szybko wyjdzie do Akademii i rodów. To jest dokładnie ten
      rodzaj wczesnego ujawnienia ryzyka, o który prosiła. Tick pozostaje mały, bo w tej samej
      rozmowie pominął pokaz i dysputę, a ona zauważyła dziurę i zapytała, skąd ma tę wiedzę.'
  - axis: judgment_confidence
    from: 70
    to: 75
    event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
    reason: 'Kontrargument Lucana - że z zewnątrz nie da się odróżnić wyuczonej sztuczki od
      posłuszeństwa - był trafny i ona to przyznała. To realna zmiana jej oceny jego myślenia
      strategicznego, nie jego dyskrecji.'
  - axis: cooperation
    from: 45
    to: 55
    event_id: event_turn_interlude_028_lucan_dismantles_the_charges
    reason: 'Lucan wprost jej wypomniał, że zachowanie Varkhena w stanie użytecznym dla
      pieczęci jest JEJ interesem, i że nie ma prawa przedstawiać tego jako wyłącznie jego
      problemu. Przyjęła to bez wykrętu - ona go wyprowadziła z osuwiska i ona trzyma go w
      piwnicy tego budynku. Wspólna ekspozycja została nazwana na głos i przestała być
      asymetryczna.'
  - axis: judgment_confidence
    from: 75
    to: 82
    event_id: event_turn_interlude_028_lucan_dismantles_the_charges
    reason: 'Rozebrał jej argumentację punkt po punkcie - brak definicji praktyki, brak ciał,
      narzędzia mordu u najemnika, a przede wszystkim pułapka "jeśli bezmyślny konstrukt, to
      nie raportuje; jeśli raportuje, to nie bezmyślny". Ostatnie zamknęła się na niej, nie
      na nim.'
  - axis: personal_regard
    from: 35
    to: 42
    event_id: event_turn_interlude_028_lucan_dismantles_the_charges
    reason: Rozmawiał z nią jak z równą i wygrał uczciwie; przyjęła to bez urazy.
  - axis: discretion_trust
    from: 25
    to: 34
    event_id: event_turn_interlude_029_academy_as_civic_risk
    reason: 'Wylozyl wreszcie cala sprawe Akademii z wlasnej woli, i to w formie ostrzezenia
      o ryzyku dla miasta, czyli dokladnie tak, jak brzmi jej warunek oslony. Nadal nie
      wszystko - zatail, ze ojciec zna metode i ze okazy maja isc pod nazwiskiem Veyr - wiec
      tick jest duzy, ale nie domykajacy.'
  - axis: judgment_confidence
    from: 82
    to: 88
    event_id: event_turn_interlude_030_the_seminar_problem
    reason: 'Trzy razy z rzedu wyprzedzil ja na wlasnym terenie - ukrywani nekromanci z
      plaszczem instytucji, akademicy grozniejsi od Orena, a przede wszystkim seminarium
      zamiast przesluchania. Przyznala, ze sama by na to nie wpadla, bo nie zna tego swiata.'
  - axis: discretion_trust
    from: 34
    to: 38
    event_id: event_turn_interlude_031_the_dormant_sinecure
    reason: 'Oddal fakt, ktory unieważnil polowe jej rady i ktorego mogl nie oddawac -
      formalne umocowanie przy Akademii. Tick niewielki, bo podal to dopiero po tym, jak jej
      rada zdazyla sie na tym bledzie oprzec, i nadal nie powiedzial, ze ojciec zna metode.'
  - axis: cooperation
    from: 55
    to: 62
    event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    reason: 'Sam lead o strazy w transporcie zwlok dal jej klucz do rzeczy, ktora niepokoila
      ja od tygodnia - drugiego czytania zadania sluzb miejskich o przekazanie cial i akt.
      Zwiekszylo to jej gotowosc do ryzyka po jego stronie. discretion_trust NIE rosnie:
      zauwazyla, ze wymienil oba aktywa i nie powiedzial, ze je oddaje.'
