axes_topdown_note: >-
  USTAWIONE ODGORNIE 2026-09-05, slowami gracza, po tym jak liczby 25 i 10 dawaly sie czytac
  jako PODEJRZLIWOSC, a karta opisuje cos zupelnie innego. Gracz doprecyzowal portret:
  PERSONAL_REGARD 55 -> 90, blisko maksimum - to jego syn i on go po prostu lubi; to, ze go nie
  zauwaza, jest osobna sprawa i nie odejmuje uczucia. JUDGMENT_CONFIDENCE 25 -> 15, bardzo nisko
  - uwaza Lucana za DZIECIAKA i jest przekonany, ze sam wie lepiej. To nie jest brak zaufania
  ani dystans, tylko hierarchia, ktorej nigdy nie zweryfikowal; zgadza sie z zapisem karty, ze
  jedyna ocena, jaka kiedykolwiek o synu wypowiedzial, dotyczyla cierpliwosci w warsztacie.
  DISCRETION_TRUST 10 -> 5, bardzo nisko, ale Z INNEGO POWODU NIZ PODEJRZENIE: w jego swiecie
  nie ma sensu niczego ukrywac, bo to ON ustala, co wolno. Kategoria dotrzymywania ukladu i
  ujawniania ryzyka po prostu u niego nie istnieje - i dlatego, jak mowi jego wlasna nota, moze
  wygadac wszystko z entuzjazmu. NARRATORZE: te dwie niskie wartosci NIE ZNACZA, ze ojciec jest
  ostrozny, badawczy albo nieufny. Znacza, ze kocha syna, ma go za dziecko i nie widzi gry, w
  ktorej wszyscy inni siedza. Reasons karty mowia to wprost:
  never_registered_that_his_son_said_he_is_in_trouble.
