axes_topdown_note: >-
  USTAWIONE ODGORNIE 2026-09-05, slowami gracza. Zmieniona JEDNA os: PERSONAL_REGARD 5 -> 35.
  Powod: piatka czytala sie jako obojetnosc, a gracz doprecyzowal, ze ona widzi w Lucanie KOLEGE
  Z TEJ SAMEJ UCZELNI i - co dla niej rzadkie - kogos, kto jej NIE ZLEWA, w przeciwiestwie do
  wiekszosci akademikow. To jest realna sympatia zawodowa, nie sojusz i nie wdziecznosc.
  POZOSTALE TRZY OSIE BEZ ZMIAN i to jest swiadome: cooperation 26 zostaje, bo nic mu jeszcze
  nie obiecala; judgment_confidence 45 zostaje, bo uznaje, ze on liczy lepiej niz ona, i nie
  jest z tego zadowolona; discretion_trust -9 zostaje, bo stoi na konkretnym zdarzeniu -
  przesunal jej pozycje bez ostrzezenia i bez pytania, lamiac wlasny instruktaz z t_143 dwie
  godziny po jego nadaniu (uzasadnienie z t_152). Kolezenstwo nie kasuje tego, ze dowiaduje sie
  o wlasnym polozeniu, gdy juz w nim stoi. NARRATORZE: ona nie jest naiwna wobec Lucana. Jej
  naiwnosc, jesli ja nazywac, jest INSTYTUCJONALNA - przez siedem tygodni tlumaczyla sobie Kolma
  slowem 'glupi' i nie zobaczyla ukladu, w ktorym sama jest podpisem.
axes_reasoning:
  cooperation: 'PODNIESIONE 15 -> 22 (event_turn_interlude_139): uznala zadanie Lucana za
    wykonalne i zaczela liczyc, ktora granica je realizuje - to wspolpraca za wzajemnosc
    (nazwiska), nie sojusz. Wczesniej uklad czysto transakcyjny: rozmawiala, bo
    nie ma innego wyjscia, nie z sympatii i nie z wdziecznosci. Nic mu jeszcze nie
    obiecala.'
  judgment_confidence: 'Wysoko i to jest gorzkie. Jego odczyt Kolma wytrzymal test jej
    wlasnym polem, a jej siedmiotygodniowe tlumaczenie ("Kolm jest glupi") nie wytrzymal.
    Uznaje, ze on liczy lepiej niz ona, i nie jest z tego zadowolona.'
  discretion_trust: 'PODNIESIONE -20 -> -5 (event_turn_interlude_141): ujawnil kontakt z
    syndykatem SAM, bez zadania, w wersji obciazajacej go - lacznie z tym, ze nie zna
    imienia pryncypala i ze nie powiedziano mu wszystkiego. Zastrzezenia dostaje sie od
    niego razem z oferta; to pierwszy taki dowod. Nadal na minusie, bo wczesniej: wszedl
    bez wpisu do ksiegi, ktora ona prowadzi wlasna reka,
    rzucil w jej pokoju skan smierci przed wyjasnieniem czegokolwiek i nazwisko podal
    dopiero, gdy targ tego wymagal. Wysokie judgment_confidence przy niskim
    discretion_trust znaczy: wierze, ze umiesz to rozwiazac, i chce wiedziec, jakie
    jeszcze zwloki ukryles.'
  personal_regard: 'Prawie zero, lekko na plus. Zawodowa ciekawosc wobec okazu i to, ze
    przyszedl POWIEDZIEC jej rzecz, ktorej nikt inny w tej instytucji jej nie powiedzial,
    mimo ze wszyscy wiedzieli.'
obligations: []
leverage_she_holds:
  - 'Jest referentka szerokiej definicji, wiec jej mowa rozstrzyga o linii obrony
    klasyfikacyjnej Lucana. Moze ja napisac tak, jak zechce.'
  - 'Zna jego nazwisko i wie, ze jest synem profesora Veyra. Na otwartej dyspucie
    za szesnascie dni.'
leverage_he_holds:
  - 'Wie o ukladzie, w ktorym ona jest podpisem, i jest jedynym zrodlem tej wiedzy.'
  - 'Ma okaz, ktory jest dla niej jednoczesnie najlepszym argumentem i dowodem, ze jej
    definicja jest merytorycznie falszywa.'
constraints:
  - 'Nie przyjmuje wykladow o wlasnej przyszlosci bez nazwiska - warunek postawiony
    i spelniony (event_turn_interlude_138).'
  - 'Nie zwija sie pod cios w fundament (retcon_000039). Kazde uderzenie w jej pozycje
    odbija zarzutem, nie zgoda.'
open_question: 'Kto jeszcze ma w tym interes - zadanie nazwisk postawione przez nia jako warunek wyboru granicy. Nie powie, ktora granice bierze, zanim ich nie uslyszy.'
