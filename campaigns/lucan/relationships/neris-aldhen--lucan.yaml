axes_reasoning:
  cooperation: 'PODNIESIONE 15 -> 22 (event_turn_interlude_139): uznala zadanie Lucana za
    wykonalne i zaczela liczyc, ktora granica je realizuje - to wspolpraca za wzajemnosc
    (nazwiska), nie sojusz. Wczesniej uklad czysto transakcyjny: rozmawiala, bo
    nie ma innego wyjscia, nie z sympatii i nie z wdziecznosci. Nic mu jeszcze nie
    obiecala.'
  judgment_confidence: 'Wysoko i to jest gorzkie. Jego odczyt Kolma wytrzymal test jej
    wlasnym polem, a jej siedmiotygodniowe tlumaczenie ("Kolm jest glupi") nie wytrzymal.
    Uznaje, ze on liczy lepiej niz ona, i nie jest z tego zadowolona.'
  discretion_trust: 'PODNIESIONE -20 -> -5 (event_turn_interlude_141): ujawnil kontakt z
    syndykatem SAM, bez zadania, w wersji obciazajacej go - lacznie z tym, ze nie zna
    imienia pryncypala i ze nie powiedziano mu wszystkiego. Zastrzezenia dostaje sie od
    niego razem z oferta; to pierwszy taki dowod. Nadal na minusie, bo wczesniej: wszedl
    bez wpisu do ksiegi, ktora ona prowadzi wlasna reka,
    rzucil w jej pokoju skan smierci przed wyjasnieniem czegokolwiek i nazwisko podal
    dopiero, gdy targ tego wymagal. Wysokie judgment_confidence przy niskim
    discretion_trust znaczy: wierze, ze umiesz to rozwiazac, i chce wiedziec, jakie
    jeszcze zwloki ukryles.'
  personal_regard: 'Prawie zero, lekko na plus. Zawodowa ciekawosc wobec okazu i to, ze
    przyszedl POWIEDZIEC jej rzecz, ktorej nikt inny w tej instytucji jej nie powiedzial,
    mimo ze wszyscy wiedzieli.'
