    reason: Przyjal role nieruchomej zbroi w gabinecie obcej urzedniczki bez urazonego honoru, pod warunkiem, ze to pozycja straznika, a nie publiczne upokorzenie. To pierwsze w tym wycinku uzycie go jako narzedzia w cudzym budynku i zgodzil sie dobrowolnie. Tick maly, bo warunek honorowy zostaje aktywny i jego zlamanie moze te zgode odwrocic.
