  - axis: cooperation
    from: 54
    to: 56
    raw_delta: 4
    event_id: event_turn_interlude_070_varkhen_walks_up_and_the_alarm_spider
    reason: 'Wykonal rozkaz fizycznie kosztowny: przy 8/65 integralnosci wszedl tylnymi schodami o wlasnych silach, przystajac i rozkladajac ciezar, zeby kamien nie zabrzmial, i zaplacil 1 punkt rezerwy (18 -> 17), czyli okolo pieciu dni rozproszonego zasilania. Przyjal to bez sprzeciwu, mimo ze jego wlasny wariant transportowy ze skrzynia z t_053 zostal odrzucony. To jedyny ruch w tym wycinku, w ktorym jego wspolpraca jest zaplacona ZASOBEM, nie deklaracja.'
  - axis: personal_regard
    from: 25
    to: 23
    event_id: event_turn_interlude_122r
    reason: 'Jedyne kanoniczne zdarzenie relacyjne z Varkhenem w calym wycinku. Stojac w gornych biurach uslyszal, jak Lucan tlumaczy Seraphine klatwe na piorze Ruska, i wtracil sie raz, krotko, wlasnym rejestrem: nazwal to rzecza zrobiona czlowiekowi za plecami i nazwal to bez ogrodek. Rusza personal_regard, a nie cooperation ani judgment_confidence, bo zarzut jest honorowy, a nie kompetencyjny - constraints jego karty to oath_and_honor - i bo nie doradzil, nie zagrozil i nie wycofal niczego z paktu. Tick minimalny i warunkowy: to jedno zdanie sprzeciwu, nie zmiana postawy.'
  - axis: cooperation
    from: 56
    to: 58
    raw_delta: 3
    event_id: event_turn_interlude_230
    reason: 'Zapytany wreszcie bezposrednio - przez Seraphine, nie przez Lucana - powiedzial, czego chce (domknac trzy pieczecie i dolna brame, przysiega jest niedokonczona), a z WLASNEJ INICJATYWY dolozyl zdanie, ktorego nikt od niego nie wymagal: uklad przyjal dobrowolnie, bo byl uczciwy, i mierzy ludzi czynami. Powiedzial to w obecnosci kontrolerki gildii rangi A, czyli w miejscu, w ktorym to zdanie realnie podtrzymuje cover story Lucana (ancient_guardian_cover_story trzyma sie, dopoki wspolpraca jest DOBROWOLNA). Tick maly i warunkowy: ''co potem'' zostawil puste i narrator ma zakaz dopisywania mu tesknoty, planu ani zadania wobec Lucana.'
  - axis: cooperation
    from: 58
    to: 61
    raw_delta: 5
    event_id: event_turn_interlude_234
    reason: 'Zapytany o cytowalnosc siebie samego zadeklarowal, ze ZLOZY ZEZNANIE - jako pradawny straznik nekropolii, dobrowolnie, do wewnetrznej dokumentacji gildii - i uzasadnil to jednym zdaniem: tak brzmi uklad, ktory przyjal dobrowolnie. To najwyrazniejszy ruch na jego karcie w tym wycinku, bo z prywatnego paktu przechodzi na zgode na wlasna instytucjonalna ekspozycje, i to on jest tym, kto ta zgode wypowiada. W tej samej scenie potwierdzil czynem plan transportu (plaszcz na zbroi od t_234, wstal i wyszedl przy drzwiach w t_235). Zastrzezenie: ''co potem'' nadal puste, a granica jest brzmienie, nie zrodlo - niecytowalne pozostaje jedno zdanie, ''nieumarly, ktorego Lucan kontroluje''.'
