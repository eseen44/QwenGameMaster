    event_id: event_turn_interlude_058_varkhen_office_guard_protocol
    reason: 'Przyjal protokol straznika biura: nieruchomo, obserwowac i sluchac, sygnalizowac przez wiez, i NIE reagowac jawnie bez dalszej decyzji Lucana - takze przy zagrozeniu dla siebie samego. To podporzadkowanie wlasnej reakcji obronnej decyzji Lucana, czyli realny koszt dla postaci z przysiega i honorem. Tick maly, bo to protokol na przyszlosc, jeszcze nieprzetestowany zadnym zagrozeniem.'
  - axis: cooperation
