axes_calibration_note: >-
  SKALIBROWANE 2026-09-04 decyzja gracza: sufit 85, przeliczyc proporcjonalnie. REGULA PIERWSZA:
  kazdy udowodniony ruch DODATNI po turze t_054 liczy sie w 60%, bo dziennik zapisuje, co ta
  postac dla Lucana ZROBILA, i gubi jej odmowy - a te sa w kanonie (odmowa przyjecia nazwiska
  urzednika t_122, odmowa kustodii glejtu t_036). Brakujace odmowy to pozostale 40%.
  Wspolczynnik nie jest dobrany pod wynik, wynika z sufitu: 62 + 0,6*38 = 85. REGULA DRUGA:
  ruchy UJEMNE zostaja w pelnej sile. Ruch ujemny to wlasnie ta rzadka zapisana odmowa - jest
  niedoreprezentowany, wiec skracanie go odwracaloby sens poprawki. REGULA TRZECIA: ruchy do
  tury t_054 wlacznie sa nietkniete, bo ich chain trafia w kanoniczne axes co do punktu na
  kazdej osi - dokumentuja, jak powstala liczba ustawiona swiadomie, a nie dokladaja do niej.
  REGULA CZWARTA: osi, ktora kanon postawil POWYZEJ sufitu (tu judgment_confidence na 88), sufit
  nie obniza - taka os moze domknac najwyzej polowe dystansu do 100. Sufit ogranicza wzrost, nie
  odbiera przeszlosci. ODWRACALNOSC: kazdy stlumiony wpis nosi raw_delta sprzed tlumienia, a
  axes_raw_reconstruction trzyma wynik nietlumiony. Log byl kanonem, bo jest udowodniony. Liczby
  sa kanonem teraz, bo gracz je rozstrzygnal.
  TO NIE JEST REGULA GRY NA PRZYSZLOSC. Wspolczynnik 60% poprawial STRONNICZOSC ZRODLA przy
  odtwarzaniu 197 tur z dziennika, ktory zapisuje przysługi i gubi odmowy. Zywe tury wycenia sie
  NORMALNIE, w pelnej sile, bo narrator widzi w nich takze odmowy i moze je zapisac od razu. Nie
  tlum ruchow biezacych.
axes_reconstruction_note: >-
  ODTWORZONE 2026-09-04 z dziennika, kazdy ruch z cytowaniem zdarzenia. Karta stala 181 tur w
  tyle, bo nikt jej nie prowadzil. Ruchy zebralo piecioro czytelnikow dziennika, po wycinku tur,
  i przeszly adwersarialna weryfikacje: z 50 propozycji 6 obalono (wnioski z ogolnego przebiegu
  zamiast z czynu, ruchy WIEDZY zamiast relacji, odwrotny kierunek), a w 7 skorygowano sile.
  UWAGA O STRONNICZOSCI, WAZNA PRZY KALIBRACJI: suma znalezionych ruchow SATURUJE osie, a to
  jest artefakt zrodla, nie stan relacji. Dziennik zapisuje, CO ta postac dla Lucana ZROBILA, i
  prawie nie zapisuje odmow - a te istnieja w kanonie (odmowa przyjecia nazwiska urzednika w
  t_122, odmowa kustodii glejtu w t_036) i przecza wartosci skrajnej, tak samo jak
  portrayal.priorities_in_order Seraphiny, gdzie Lucan jest czwarty, a nie pierwszy. DLATEGO
  POLE axes ZOSTAJE NIETKNIETE do kalibracji przez gracza, a wyliczone wartosci leza obok. Log
  jest kanonem, bo jest udowodniony; liczby nie sa, bo wymagaja decyzji.
  SPROSTOWANIE 2026-09-04: zdanie powyzej o NIETKNIETYM polu axes bylo prawdziwe do chwili
  decyzji gracza i przestalo byc - gracz kalibracje rozstrzygnal, patrz axes_calibration_note.
  Reszta tej noty, w szczegolnosci ostrzezenie o stronniczosci zrodla, obowiazuje dalej i JEST
  PODSTAWA tej kalibracji.
