search_terms:
- 'Dolna hala, pierwsza wielka nisza od schodow OTWARTA, 23:25, dzien piaty. Rezerwa
  bez zmian, zadnej ceny za podniesienie kamienia zaden plik nie stawia. NIC SIE NIE
  STALO - trzeci raz z rzedu i z tego samego powodu co w t_293 i t_295. PLYTA STOI
  OPARTA O SCIANE OBOK, cala. Wyszla bez rozbijania, bo jest dopasowana, nie zamurowana.
  CO JEST W SRODKU, NIETKNIETE: cialo na wznak, wyciagniete prosto, kosci i ciemny
  pyl po tkaninie. Wzdluz lewego boku RZAD OSMIU MALYCH PRZEDMIOTOW ulozonych od najwiekszego
  do najmniejszego, rekojesciami w jedna strone, pokrytych ciemnym nalotem. Przy glowie
  SKRZYNKA wielkosci dwoch piesci, wieko dopasowane bez zawiasu i bez zamka, robota
  tej samej reki co sciana. SKRZYNKA JEST ZAMKNIETA I NIKT JEJ NIE DOTKNAL. WYCENA
  BOROSA: wiecej metalu niz trzy lepsze groby z gory razem (tamte dawaly okolo 2,5
  kg, t_295). NIE jest to zyla zlota - to grob lepszej warstwy. KLOPOT, KTORY BOROS
  NAZWAL SAM: komplet sprzedaje sie gorzej niz luzny kruszec. Trzecia kategoria z
  t_295 - tak stare, ze bez nazwiska, ale kazda sztuka jedyna i zapamietywalna, a
  osiem sztuk w komplecie tym bardziej. Fakt handlowy, ZADNEGO zegara ani sledztwa.
  CO MOWI MECHANIKA (retcon_000197): zawartosc odezwala sie wylacznie na kanale kamienia,
  kanal sygnatury milczy poza jednym plaskim cialem. Nic tu nie jest naladowane jak
  naczynie z polnocnego fundamentu kaplicy. To wniosek, nie gwarancja. MARA POLICZYLA,
  ILE WIDZI: PIEC takich plyt stad. Dalej ciemno - laczna liczba nisz w hali NIEUSTALONA.
  SPIDEY nadal zwiedza hale i nie wrocil. OTWARTE: czy otwieraja skrzynke, czy biora
  rzad, czy zostawiaja wszystko i wyceniaja kolejne nisze dlonia, czy ida wzdluz wytartego
  pasa ku linii z t_303. Nikt niczego jeszcze nie wyjal z tej komory.'
