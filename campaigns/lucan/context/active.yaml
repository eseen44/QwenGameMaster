search_terms:
- 'Dolna hala, u podnoza schodow, 02:56, dzien szosty. Rezerwa 15/15 - marsz nic nie
  kosztuje, zaden skan nie zostal zadeklarowany. EKIPA ODJECHALA. Boros wiezie lup
  DO PIWNICY ZA GARBARNIA (loc_tannery_cellar_hideout) - zna to miejsce od Aktu 1
  i sam je nazwal. Nikt nie dopytywal, po co Lucan zostaje. MARA PODALA JEDNA RZECZ
  I NIE BYLA TO TROSKA WPROST: lampa starczy na TRZY GODZINY, licz od teraz. To jest
  fakt o lampie, NIE zegar i NIE zagrozenie - zaden plik nie stawia za tym terminu;
  narrator go nie postawi, dopoki olej sam sie nie skonczy w fikcji. VARKHEN WSTAL.
  Pytanie z t_310 ("Idziesz tam?") dostalo odpowiedz, ktora nie byla slowem - Lucan
  przyszedl po niego osobiscie. Varkhen kiwnal raz i wstal. Pozor snu z t_263 wygasl
  sam, bez ceremonii: proszono o udawanie przed ludzmi, a ludzie odjechali. JEGO STAN:
  integrity 11,7/65, condition_severely_depleted. Chodzi, ale to wrak, ktory chodzi.
  Osuwisko przeszedl bez wysilku, bo Boros je rano przekopal. W komorze grobowej ZATRZYMAL
  SIE przy jedenastu zdjetych plytach i patrzyl - bez slowa; Lucan go o nic nie zapytal.
  GDZIE SA: obaj u podnoza czterdziestu stopni w zone_deep_hall. Varkhen stoi na wytartym
  pasie, ktory nazwal wczoraj swoja droga. Pod tym sufitem musi trzymac glowe pochylona.
  Spidey na ramieniu Lucana, Tkacz na rampie z pelnym czuciem obszaru. CO LEZY PRZED
  NIMI: hala biegnaca w strone przeciagu, TRZYNASCIE NISZ OPROZNIONYCH przy schodach,
  reszta zamknieta, a na koncu BRAMA i przy niej TRZECIA PIECZEC - na lewo od bramy,
  w scianie, krag wielkosci dloni, na wysokosci piersi Varkhena. OTWARTE: czy ida
  wzdluz pasa do bramy, czy Lucan najpierw cos mierzy, czy pyta Varkhena o cokolwiek
  po drodze. Gracz nie zadeklarowal jeszcze ani marszu do bramy, ani skanu.'
