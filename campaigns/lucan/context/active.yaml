search_terms:
- 'Cmentarz, przy rampie, 21:52, dzien piaty. Ciemno. LUP SCHOWANY: osiem workow,
  okolo 55 kg, w piwnicy za garbarnia (nowa zone_cellar w loc_tannery), za beczkami,
  pod plachta. Klodka byla na skoblu w starej desce i Boros otworzyl ja dragiem w
  dwa ruchy. Garbarnia stala ciemna; CZY KTOKOLWIEK TAM MIESZKA albo pracuje - NIEUSTALONE,
  Boros pamieta ja z maja i sam powiedzial, ze nie wie. WORKI: dwadziescia, zalatwione
  przez Borosa po drodze. MELDUNKI SIECI - CO KANAL UNIOSL: wszystkie wezly odpowiadaja,
  nikogo nie brakuje. NIC WIECEJ. Z tej odleglosci seria niesie obecnosc, a nie tresc
  (spy-series#link: pozyczenie zmyslu zalezy od pasma i odleglosci, "slabo i tylko
  z bliska"). To, co Toby slyszal na zapleczu syndykatu, czeka, az Lucan stanie przy
  nim. JEDYNY PELNY MELDUNK: Tkacz, bo zostala przy rampie. Przez caly dzien do zjazdu
  nie podszedl nikt poza grabarzem w poludnie. Nikt nie krazyl, nikt nie stanal, nikt
  nie wszedl za nimi. RACHUNEK, KTORY LUCAN SAM ZROBIL W DRODZE: sieciarz przypisany
  do GARBARNI siedzi od t_091 na lace przy zbieraniu prostoskrzydlych, a jego parcela
  stoi pusta - czyli lup lezy wlasnie tam, gdzie zmysl obszarowy JEST przypisany,
  ale go nie ma. Zdjecie rozkazu to jedno slowo i narrator go za gracza nie wypowiedzial.
  NIKT ICH NIE ZACZEPIL po drodze. Rezerwa 14,6/15. OTWARTE: czy schodza nizej dzis
  po ciemku, czy Lucan odsyla sieciarza na parcele garbarni, czy ktos w koncu spi.'
