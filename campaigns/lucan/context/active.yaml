search_terms:
- 'Dolna hala, pierwsza nisza oprozniona, 23:35, dzien piaty. Rezerwa 14,9/15 bez
  zmian - gracz nie zadeklarowal ani skanu, ani sondy, wiec nic nie kosztowalo. CIALO
  NIE NIOSLO NIC. Rece puste, przy szyi nic, w szczece nic, pod zebrami i pod cialem
  nic. POTWIERDZA TO ROZNICE OBYCZAJU z t_304: tutaj wszystko kladziono OBOK, nie
  na zmarlym. WNIOSEK OPERACYJNY: w pozostalych niszach przeszukiwanie cial jest strata
  czasu. CO ZNALAZLA DLON, A NIE OKO: pod barkami i biodrami cienka ciemna linia -
  ostatek deski albo mar. Pogrzeb byl urzadzany, nie odbywany napredce. ZERO REAKCJI
  na dotkniecie ciala, czwarty raz (t_293: otwarty grob czyta sie tak samo jak zamkniety).
  "PAKUJ" WYKONANE BLANKIETOWO: rzad osmiu sztuk ORAZ skrzynka sa w worku. Kazda sztuka
  przelozona szmata. Skrzynka lezy na wierzchu, NADAL ZAMKNIETA - nikt jej nie otwieral.
  ODCZYT BOROSA, ZWYKLY I NIEMAGICZNY (retcon_000197 zabrania tego Stone Sense, nie
  dloni fachowca sortujacego kruszec zawodowo od t_101): rzad to METAL i NIE ZELAZO.
  Wiecej nie powie, bo trzeba by PRZETRZEC jedna sztuke - a przetarta wyglada na ruszana.
  To jest wybor gracza, postawiony jako fakt rzemieslniczy. SKRZYNKA CIEZSZA, NIZ
  WYGLADA - gestsza od rzedu. Materialu Boros takze nie nazywa. MASA: okolo trzech
  kilogramow z tej jednej niszy - wiecej niz trzy lepsze groby z gory razem (2,5 kg,
  t_295). Mara nazwala konsekwencje: to trzeba bedzie wniesc po czterdziestu stopniach.
  Fakt logistyczny, zaden zegar. MARA WIDZI STAD PIEC TAKICH PLYT. Dalej ciemno; pelna
  liczba nisz NIEUSTALONA. SPIDEY nadal zwiedza hale i nie wrocil. OTWARTE: czy przecieraja
  jedna sztuke, czy otwieraja skrzynke, czy biora sie za nastepne plyty (wycena dlonia
  po 180 s i 0,1 za plyte albo od razu podnoszenie), czy ida wzdluz wytartego pasa
  ku linii z t_303.'
