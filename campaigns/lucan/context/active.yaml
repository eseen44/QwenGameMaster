  tego czasu ruszala. ODPOWIEDZ 3, NOWY FAKT: NIE BYL JEDYNYM STRAZNIKIEM. "Postawiono
  nas. Mnie przy bramie." ILU - nie liczyl i nie zgaduje. CO SIE Z NIMI STALO - nie
  wie; po tym, jak go postawiono, zadnego juz nie widzial, bo straznik nie chodzi
  po cudzych posterunkach. Narrator NIE dopisal ani liczby, ani stanu, ani tego, czy
  cokolwiek z nich zostalo. ODPOWIEDZ 4: PAMIEC LUCANA JEST PRAWDZIWA. cemetery/discovery.yaml
  trzyma od Aktu 2 DWIE odrebne sygnatury - jedna POD KAPLICA (wyczuta przez sciane),
  druga przy ZACHODNIM MURZE - obie osobne od sygnalu spod polnocnego fundamentu.
  SLOWO "zombie" przy tej pierwszej BYLO ETYKIETA NARRATORA, nie odczytem: grave_sense
  ma no_identity_reading. Czym one sa - NADAL NIEUSTALONE i ta tura tego nie ustala.
  POLACZENIE ZROBIL VARKHEN, NIE NARRATOR: druga pieczec lezy pod kaplica i jedna
  z tych dwoch sygnatur lezy pod kaplica, wiec "to jest to samo miejsce" - i natychmiast
  dodal, ze co to znaczy, nie wie. Nikt tego nie domyka. GDZIE SA: w zone_relay_chamber,
  na poziomie fundamentu kaplicy. W polnocnej scianie stoi nisza z odsunietymi kamieniami,
  a w niej siedzi SAM SPY_BEETLE_01 (General) - w zbiegu trzech czynnych, jednokierunkowych
  kanalow. Uklad z t_258 (trzy okazy, po jednym na kanal) JUZ NIE OBOWIAZUJE: Spidey
  jest na ramieniu Lucana, Tkacz przy rampie, a General zostal sam i bierze sume trzech,
  czyli okolo 1,8 na dobe (growth-banks#energy_model - jedyne zrodlo SPOZA sieci).
  NADAL NIESKLEJONE: ze te kanaly i te pieczecie maja ze soba cokolwiek wspolnego.
  t_256 mowi wprost, ze zaden plik ich nie laczy. NIC SIE PO DRODZE NIE STALO - szosta
  scena z rzedu bez reakcji swiata. OTWARTE: gdzie dokladnie jest druga pieczec na
  tym poziomie (Varkhen wie i jeszcze nie poprowadzil), czy Lucan robi tu Geo albo
  sonde, czy pyta o sygnature pod kaplica, czy rusza okazy z niszy. Lampa pali sie
