- 'Dolna hala, u podnoza schodow, 23:07, dzien piaty. Rezerwa 14,5/15. CO PODAL KAMIEN:
  hala jest DLUGA i biegnie dokladnie w strone przeciagu i wytartego pasa. Sufit rowny
  na calej dlugosci - wybrany i wykonany, nie wydrazony gdzie sie dalo. Zasieg wiekszy
  niz w komorze, bo bloki sa DOPASOWANE i cala sciana przewodzi jak jedna rzecz (connected_stone_and_focus
  spelnione lepiej niz gdziekolwiek dzis). DALEKO, w tym kierunku, KAMIEN SIE KONCZY
  - nie pustka i nie rog, tylko LINIA, na ktorej zmienia sie material. Czym jest ten
  material: dlon nie powie. Odleglosci brak - geometry_is_approximate. CO PODALY SYGNATURY:
  umarli sa w niszach hali, mniej niz wyzej i kazdy czyta sie "grubiej", bo nisze
  sa wieksze i kazde cialo lezy samo. Plasko, staro, nic nie drgnelo. ORAZ: sygnatury
  KONCZA SIE PRZED ta linia - miedzy ostatnia nisza a zmiana materialu jest odcinek
  pusty. Ktos przestal tam kłasc ciala dlugo przed koncem hali. CZEGO NARRATOR NIE
  SKLEIL ZA GRACZA: Varkhen podal w t_296, ze nizej jest brama i przy niej trzecia
  pieczec. Kamien podaje wylacznie zmiane materialu. To sa dwie rozne rzeczy i lezą
  obok siebie niedomkniete. SPIDEY POSZEDL ZWIEDZAC i jeszcze nie wrocil - jego raport
  bedzie pelny, bo jest blisko. OTWARTE: czy ida wzdluz wytartego pasa ku tej linii,
  czy czekaja na Spideya, czy ogladaja nisze tutaj.'
