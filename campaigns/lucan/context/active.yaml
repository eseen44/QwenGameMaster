search_terms:
- 'Rampa polnocna przy wozie, 02:36, dzien szosty. Rezerwa 15/15. Rozmowa i pytanie
  przez linie nic nie kosztuja. OBRAZU LUCAN NIE MA I NIE MOGL PRZESLAC. Bramy nie
  widzial - widzial ja Spidey, a meldunek Spideya jest KSZTALTEM, nie obrazem (low_bandwidth,
  spy-series#link). Przeszlo to, co Lucan dostal: szerokosc, pion, martwe echo, cienka
  linia powietrza u dolu. ZEBY MIEC OBRAZ, TRZEBA TAM STANAC. VARKHEN OBRAZU NIE POTRZEBOWAL:
  stal przy tej bramie. GDZIE JEST TRZECIA PIECZEC - ODPOWIEDZ KONKRETNA I NOWA: NIE
  NA BRAMIE. Na LEWO od niej, patrzac na brame, wpuszczona w SCIANE, nie w skrzydlo.
  KRAG WIELKOSCI ROZLOZONEJ DLONI. NA WYSOKOSCI PIERSI VARKHENA, czyli - przy jego
  2,20 m - NAD GLOWA LUCANA. JAK JA SPRAWDZAL: dlonia. Kiedy trzymala, KAMIEN DOOKOLA
  BYL ZIMNY, zimniejszy, niz kamien ma prawo byc. To jest kontrola, ktora umie wykonac
  straznik bez magii. CZEGO VARKHEN NIE WIE: co pieczec robi i jak dziala. Pilnowal
  z rozkazu, nie z wiedzy (powtorzenie t_259 i t_296). VARKHEN ZAPYTAL: "Idziesz tam?".
  Pytanie, nie warunek i nie prosba - trzecia pieczec jest cala jego agenda (fact_varkhen_stated_what_he_wants).
  ODPOWIEDZI NIE DOSTAL. RYNEK, ODCZYT BOROSA: DWA KILOGRAMY SREBRA TYGODNIOWO, trzy
  przy rozbiciu na czterech ludzi. Wiecej i ktos zapyta, skad. Przy tej stawce 25
  kg to KWARTAL sadzenia przez cztery rece. DRUGIE DRZWI, KTORE NAZWAL SAM: wywiezc
  z miasta - dalej placa mniej, ale od razu. Opcja, nie przymus. Liczby generowane
  2026-09-14; kotwice skali to 30 srebra tygodniowo od Orena (t_282) i 4000 srebra
  honorarium syndykatu. MARA: jak wracaja, to NIE CO NOC - woz jezdzacy na cmentarz
  co noc ludzie zapamietaja. Obserwacja logistyczna, ZADNEGO terminu ani ostrzezenia.
  CZEGO NARRATOR NIE ROZSTRZYGNAL: czy Seraphine naprawde nie zejdzie tu przez kilka
  dni. To odczyt Lucana; zaden plik nie podaje jej planu na te dni. OTWARTE: czy odpowiada
  Varkhenowi, czy jada z lupem do skrytki, czy wracaja jeszcze tej nocy po nastepne
  nisze, czy ida do bramy - a jesli ida, to pieczec wisi nad glowa Lucana i ktos bedzie
  musial go podsadzic albo przyniesc na czym stanac.'
