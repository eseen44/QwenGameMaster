- 'Rampa polnocna przy wozie, 02:36, dzien szosty. Rezerwa 15/15. Rozmowa i pytanie
  przez linie nic nie kosztuja. OBRAZU LUCAN NIE MA I NIE MOGL PRZESLAC. Bramy nie
