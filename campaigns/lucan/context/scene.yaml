immediate_questions:
- 'Komora grobowa, 17:52, dzien piaty. TRZY LEPSZE GROBY OTWARTE, znowu bez zadnej
  reakcji. LUP: obrecz ramienna z ciemnego metalu, okucie pasa, noz z rekojescia z
  kosci (ostrze przepadlo), sznur paciorkow z kamienia i szkla, dwie szpile, naczynie
  z polewa, oraz czara ze srebra z patyna, wyklepana recznie. Razem okolo dwoch i
  pol kilograma metalu - realne pieniadze, zaden skarb. PROBLEM HANDLOWY NAZWANY PRZEZ
  BOROSA, nie przez narratora: to nie jest ani rzecz ryta, ani anonimowy kruszec,
  tylko TRZECIA KATEGORIA - rzeczy tak stare, ze nikt zywy ich nie rozpozna, wiec
  sprzedaja sie bez nazwiska, ale zaden zlotnik ich nie przetopi. Kazda sztuka jest
  jedyna i zapamietywalna. W lupie z Aktu 2 polowe ratowala MONETA; tu nie ma ani
  jednej. TERMIN Z ICH WLASNEGO PLANU, nie z mojego: przykrywka jest DZIENNA. Woz
  murarzy o piatej to woz z gruzem, ten sam o dziewiatej to historia, ktora grabarz
  opowie zonie. Do zmierzchu okolo dwoch i pol godziny. Mara powiedziala wprost, ze
  nie odradza schodzenia - podaje stan. Zadnej kary za zlamanie tego zaden plik nie
  stawia. UKLAD RAK ten sam we wszystkich trzech. Czwarte i piate potwierdzenie, dalej
  bez wyjasnienia. OTWARTE: schodzic teraz czy zbierac dalej na gorze; ile jeszcze
  plyt otwierac; co zrobic z tym, ze kazda sztuka jest rozpoznawalna. Rezerwa 14,6/15.'
