  SZTUKA JEST GLADKA - bez rytu, bez znaku wytworcy, bez ornamentu. To PIERWSZA kategoria
  Borosa: anonimowy kruszec, idzie do tygla i przestaje istniec. Obawa z t_305 o trzecia
  kategorie sie NIE potwierdzila. DYLEMAT, KTORY ZOSTAJE: osiem gladkich sztuk osobno
  to waga srebra; osiem sztuk W KOMPLECIE warte jest wielokrotnie wiecej i wlasnie
  dlatego zapamietywalne. Decyzja gracza, zadnego terminu. CO TO JEST: smukly pret,
  jeden koniec splaszczony i lekko wygiety, na trzonku plytki rowek po owinieciu (skora
  albo nic, dawno zeszla). NARZEDZIE, nie ozdoba i nie bron. DO CZEGO - NIEUSTALONE;
  Lucan nie rozpoznaje. Varkhen lezy w loc_varkhen_chamber na pojedynczej linii od
  Lucana i jest JEDYNYM zrodlem z tamtej epoki w zasiegu. MELDUNEK SPIDEYA (ksztalty,
  low_bandwidth, bez slow): NISZE PO OBU SCIANACH, regularne, tej samej wielkosci,
  w tych samych odstepach, WSZYSTKIE ZAMKNIETE az do konca jego drogi. HALA MA KONIEC:
  cos pionowego w poprzek, na cala szerokosc, i to NIE JEST KAMIEN - echo wraca martwe
  zamiast dzwonic. POWIETRZE IDZIE Z CIENKIEJ LINII przy dolnej krawedzi tej rzeczy;
  Spidey przeszedl wzdluz niej calej i linia jest dla niego ZA WASKA. Stamtad wrocil.
  NIGDZIE NIC ZYWEGO - trzecie potwierdzenie obserwacji z t_294 (brak pajeczyn i owadow),
  ktorej nadal NIKT NIE TLUMACZY i narrator tez nie. CZEGO NARRATOR NIE SKLEIL: ze
