immediate_questions:
- 'Przy bramie na koncu dolnej hali, 03:11, dzien szosty. Rezerwa 15/15 - marsz nic
  nie kosztuje, Lucan NICZEGO NIE DOTKNAL I NIE SKANOWAL, bo tego nie zadeklarowal.
  DROGA POTWIERDZILA OKIEM MELDUNEK SPIDEYA: nisze po obu scianach, regularne, wszystkie
  zamkniete. Nisze koncza sie W POLOWIE HALI - dalej gladki mur po obu stronach, a
  wytarty pas biegnie przez ten odcinek tak samo. Ludzie chodzili tedy takze wtedy,
  gdy przestali tu klasc zmarlych. NIKT TEGO NIE TLUMACZY. BRAMA: DWA SKRZYDLA Z CIEMNEGO,
  SUCHEGO DREWNA w kamiennej oscieznicy bez zaprawy, na cala szerokosc hali i na wysokosc,
  ktorej lampa ledwo siega. Drewno tlumaczy martwe echo z t_308. PRZY PROGU, NA CALEJ
  SZEROKOSCI, SZPARA NA GRUBOSC PAZNOKCIA - stamtad idzie powietrze; to ta sama linia,
  ktora dla Spideya byla za waska. PO TEJ STRONIE BRAK KLAMKI, DZIURKI I ZAWIASOW.
  Otwiera sie w tamta strone albo wcale. ZADNYCH ZNAKOW NA NIEJ NIE MA. PIECZEC JEST
  TAM, GDZIE VARKHEN POWIEDZIAL - krag wielkosci rozlozonej dloni, wpuszczony w sciane
  NA LEWO od bramy, okolo 175-180 cm nad podloga. SPROSTOWANIE: t_310 mowil "nad glowa
  Lucana" i bylo to zle policzone - piers czlowieka o wzroscie 2,20 m wypada na wysokosci
  OCZU Lucana, wiec siega tam wyciagnieta reka, bez podsadzania. Varkhen sprawdzil
  ja sam, bez rozkazu. JEGO ODCZYT, Z JEGO WLASNYM OGRANICZENIEM: kamien dookola JEST
  zimny, ale BYL ZIMNIEJSZY. Czy oslabla pieczec, czy on - NIE UMIE ROZDZIELIC i powiedzial
  to wprost, bo wtedy byl caly (powtorzenie t_262). Zadnego procentu, zadnej miary,
  zadnego zegara. ZDANIE, KTORE POLOZYL NA STOLE SAM: "Moj rozkaz brzmial: trzymac
  ja zamknieta". Podane jako fakt, NIE jako odmowa, warunek ani grozba. Co zrobi,
  jesli Lucan zechce otworzyc - POLE PUSTE; narrator go nie wypelnia. ZERO REAKCJI,
  piata scena z rzedu. OTWARTE: czy Lucan robi Geo przy bramie albo przy pieczeci,
  czy siega do kregu sam, czy pyta Varkhena o rozkaz wprost, czy probuje otworzyc,
  czy wraca na gore. Lampa pali sie od okolo pol godziny z trzech, ktore dala jej
  Mara.'
