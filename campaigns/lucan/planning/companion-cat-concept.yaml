schema_version: 1
id: companion_cat_concept
object_type: design_brief
status: not_yet_created
decided_on: '2026-09-12'
decided_by: player
source_refs:
- retcon_000179
- campaigns/lucan/planning/lucan-leads.yaml#direction_cat_as_created_companion
what_this_is: PROJEKT, NIE BYT. Nic takiego nie chodzi po baszcie i nie wolno go wprowadzic do sceny ani
  do state/instances/ bez deklaracji gracza. Plik istnieje, zeby kompletna postac - natura, karmienie,
  glos, motywy, granice - nie zyla wylacznie w rozmowie. Ta sama awaria, ktora przez 274 tury trzymala
  dwie cechy definiujace Lucana poza plikami aktywnymi (retcon_000177).
relation_to_the_dead_cat: 'ZWLOKI KOTA Z t_271 SA ODDZIELNA SPRAWA I ZLYM ZRODLEM. Decyzja gracza 2026-09-12:
  to nieudany eksperyment, po ktorym widac, ze jest zombie - zostaje jako to, czym jest. Nie przestaje
  to byc uzyteczne: prototyp nauczyl Lucana, czego naprawde chce.'
nature:
  body: Fizyczny, cieply w dotyku, namacalnie koci. Zaczyna jako KOCIAK, przez cala kampanie rosnie najwyzej
    do wielkosci duzego psa. Nie jest nieumarly i nie jest bezmozgi.
  other_sphere: 'Przy okazji okazuje sie czyms jeszcze - ale nie objawieniem, tylko SZCZEGOLEM, KTORY
    NIE PASUJE: cien pada nie w te strone, odbicie spoznione o pol sekundy, przeszedl przez drzwi, ktore
    byly zamkniete. Urok i niepokoj to TEN SAM mechanizm, nie dwa osobne.'
  mix: 'Skrzyzowanie dwoch typow: substancja cienia wlana w kocia forme + istota zywiaca sie koszmarami.'
  long_horizon: 'Za kilkaset lat moze wyrosnac na katastrofe w rejestrze eldritch. KAMPANIA TEGO NIE ZOBACZY
    i narrator nie ma prawa grac tego jako zegara. Sam kot NIE WIE, czym sie stanie (decyzja gracza) -
    i wlasnie dlatego jest niepokojacy: to proroctwo w koszyku, nie potwor w pokoju. Widzi to ktos, kto
    umie patrzec, a nie ten, kto stoi obok.'
feeding:
  sources:
  - koszmary
  - energia z sieci
  - bezposrednio od Lucana
  none_is_mandatory: Trzy zrodla, zadne obowiazkowe - to zdejmuje z niego status pasozyta i robi zwierze,
    ktore je to, co dostanie. Moze zerowac na ludziach i moze POGLEBIAC sny, ale NIE MUSI.
  not_an_apocalypse: Nie jest pozeraczem dusz i nie wolno go w takiego przerobic.
  lucans_nightmares: 'LUCANOWI KOSZMARY USMIERZA. To jest emocjonalny rdzen calej postaci: pierwsza od
    lat rzecz, ktora sie nim opiekuje - i robi to cos, co nie szanuje nikogo. Lucan nie planowal tej zaleznosci
    i nie ma jej jak nazwac.'
temperament:
  core: OKRUCIENSTWO BEZ ZLOSLIWOSCI. Kot bawi sie mysza i nikt nie mowi, ze jest zly - nie ma pojecia,
    ze po drugiej stronie cos jest. To zabawa bez empatii, nie czerpanie radosci z cudzego bolu. Pogodny,
    bo naprawde swietnie sie bawi. Niepokojacy z tego samego powodu.
  list:
  - mlody
  - psotny
  - beztroski
  - sadystyczny_ale_pogodny
  - nieludzko_inteligentny
  toys: Wszystkich poza Lucanem traktuje jak zabawki - bo nikt mu jeszcze nie wytlumaczyl inaczej.
  literalism: 'Lapie za slowa DOSLOWNIE i DZIECINNIE, nie zlosliwie. Nie sabotuje: wykonuje dokladnie
    to, co powiedziano, i jest z siebie dumny. Problem jest w tym, ze ktos powiedzial zle.'
learning:
  like_a_child: Uczy sie jak dziecko - przez powtarzanie, nasladowanie i sprawdzanie granic.
  inherits_lucans_flaws: 'NIEOCENZUROWANE LUSTRO LUCANA. Dziecko powtarza przy gosciach to, co slyszy
    w domu: moralnosc komara i transakcyjnosc odbite przez cos, co nie nauczylo sie jeszcze tego ukrywac
    - i mowione WESOLO, NA GLOS, PRZY LUDZIACH. Zestawione z wada Lucana (player/character.yaml#defining_traits.flaw:
    pekniecia pokazuja sie dopiero po czasie) daje to konkretny koszt: KOT POKAZUJE JE NATYCHMIAST I CUDZYM
    USZOM. Bez zlej woli, z zachwytem, ze powiedzial cos, co mowi Lucan.'
  first_thing_learned: PROZNOSC, nie okrucienstwo. Narcystyczne efekciarstwo i popisywanie sie dla poklasku
    to pierwsza rzecz, jaka przejmuje po Lucanie (decyzja gracza).
  what_lucan_has_to_teach: 'NAJLEPSZY GENERATOR SCEN W CALYM PROJEKCIE. Lucan musi tlumaczyc zasady, w
    ktore sam nie wierzy - nie powie "nie rob tego, bo to zle", bo tego nie umie. Powie "nie bawimy sie
    nia, jest nam potrzebna". I kot nauczy sie POWODU, nie zasady: ze ludzie sa uzyteczni, a nie ze sa
    wazni. Cala groza tej postaci podana lagodnie - nie to, ze kiedys bedzie katastrofa, tylko ze LUCAN
    GO TERAZ WYCHOWUJE, szczerze i najlepiej jak umie, a ono uwaznie slucha.'
voice:
  to_lucan: W glowe. Domyslny tryb.
  to_others: Rzadko i zawsze jako DECYZJA, nie odruch - przez co jedno zdanie przy obcym wazy dziesiec
    razy wiecej.
  the_temptation: 'KOT WIE, ZE GADAJACY KOT ROBI WRAZENIE - to nietrudne do zauwazenia. I nauczyl sie
    od Lucana, ze robienie wrazenia jest przyjemne. Mowa do glowy nie jest wiec zasada do pilnowania,
    tylko trybem, KTORY GO KUSI ZLAMAC. Kazda scena z obcymi ma w srodku zywy drut: czy tym razem sie
    popisze.'
chaos_signature:
  how_it_pairs_with_the_curse: 'Klatwa pecha sprawia, ze RZECZY SIE PSUJA. Kot sprawia, ze POLECENIA SIE
    PSUJA. Razem daja wokol Lucana atmosfere, w ktorej nic nie idzie gladko i NIC NIE DA SIE NIKOMU UDOWODNIC:
    pech jest niewidzialny, kot jest uroczy.'
  the_vase: 'Impulsywnosc dziala tak, ze gdy ktos powie cos niemilego o Lucanie, w pomieszczeniu spada
    z regalu wazon. To nie jest atak i nie da sie tego przypisac - dla wszystkich wyglada jak pech, czyli
    jak cos, co Lucanowi juz towarzyszy. LOJALNOSC WYRAZONA JAKO DUCH DOMOWY: kot nie broni Lucana, kot
    sie dasa, a pokoj to rejestruje.'
  teleportation: Cieniokot przemieszcza sie krotkim skokiem - stad wazon spada tam, gdzie kota nie bylo.
boundaries_now:
  not_truly_harmful_yet: NA TYM ETAPIE NIE JEST NAPRAWDE SZKODLIWY (decyzja gracza). Ma GENEROWAC SYTUACJE,
    ktore pozwalaja go uczyc i tlumaczyc mu takie rzeczy - a nie produkowac straty.
  does_not_understand_ours_yet: Nie rozumie jeszcze "ci sa nasi, z nimi sie nie bawimy". Dziecko sie tego
    uczy, ale MUSI SIE NAUCZYC - czyli raz czy drugi nie zdazy. Mara, Boros i Seraphine sa w zasiegu.
  size_ceiling: Przez cala kampanie nie wiekszy niz duzy pies.
origin:
  status: decided
  decided_on: '2026-09-12'
  id: origin_lower_gate_anticlimax
  sequence:
  - Pieczecie padaja, ZANIM ekspedycja zdazy do nich dotrzec.
  - Alarm, napiecie, pogon - i NIC SIE NIE DZIEJE.
  - Dziura zostaje zalatana. Kilku pokonanych straznikow, aktywnosc cmentarza wygaszona.
  - Ekspedycja konczy sie sukcesem i nuda. Wszyscy odhaczaja sprawe jako zamknieta.
  - DOPIERO POTEM zaczyna pojawiac sie kot.
  knowledge_boundary: WIEMY, ZE TO SLAD PO BRAMIE. NIE, ZE TO HEROLD KONCA. Nikt - lacznie z narratorem,
    Varkhenem i samym kotem - nie ma prawa nazwac go zapowiedzia czegokolwiek. Dlugi horyzont z sekcji
    nature.long_horizon NIE JEST wiedza zadnej postaci i nie wolno robic z niego zegara.
  why_varkhen_stays:
    the_problem: 'Ryzyko nazwane przez gracza: jesli przysiega zostanie uznana za spelniona - pieczecie
      odbudowane, wrota zamkniete - Varkhen moze uznac rachunek za zamkniety I PRZESTAC. Ma do tego prawo
      i nie wolno mu tego prawa odbierac.'
    the_answer_is_already_in_canon: 'NIE TRZEBA MU DOPISYWAC NIEPOKOJU - on ma niedomkniety rachunek,
      zmierzony i zapisany. (1) t_256: zapytany, co lezy w niszy polnocnego fundamentu, odpowiedzial,
      ze nie wie, i dodal z wlasnego rejestru: NIE POSTAWIONO GO TUTAJ, to pomieszczenie nie bylo czescia
      jego warty. Czyli przez czterysta lat obok jego posterunku dzialalo cos, czego mu nie powierzono.
      (2) t_261: trzecia pieczec czuje, ze jest i trzyma, ale NIE TAK, JAK TRZYMALA. (3) t_262: zapytany
      o miare pogorszenia, ODMOWIL i nazwal powod. Przysiega zamyka sie, kiedy rachunek sie zgadza. Jego
      nie zgadzal sie juz przed ekspedycja. Kot jest dowodem, ze luka byla prawdziwa.'
    the_binding: Rzecz z tej niszy NOSI LUCAN. Varkhen zaoferowal, ze ja poniesie (t_257), Lucan odmowil,
      Varkhen opuscil reke i poszedl przodem bez urazy (t_258). Jego jedyna niedomknieta sprawa chodzi
      wiec po miescie w cudzej kieszeni. Zostaje nie z sentymentu i nie z przymusu, tylko dlatego, ze
      rachunek jest otwarty, a dowod nalezy do kogos innego.
    the_exit_stays_open: NIE ZAMYKAC MU WYJSCIA. Varkhen, ktory MOGLBY uznac przysiege za spelniona i
      przestac, ale tego nie robi, jest mocniejszy niz taki, ktory nie ma wyboru. Smierc zostaje realna
      opcja - to jest wlasciwy ksztalt voluntary_oath_compact.
    upkeep_consequence: 'WYGASZENIE AKTYWNOSCI CMENTARZA UDERZA W JEGO UTRZYMANIE. Od retcon_000168 podtrzymuje
      go TLO CMENTARZA (condition cemetery_ambient_upkeep, magnitude 80): 0,8 energii i 0,8 integralnosci
      na dobe - dokladnie tyle, ile dawaly cztery lacza sieciarzy przed odpieciem. Ekspedycja odcina go
      od tego zrodla przy integralnosci 9,4 z 65. Wiazanie robi sie wiec dobrowolne I KONIECZNE naraz.'
  narrator_rule: 'EKSPEDYCJA MA BYC PRAWDZIWYM NICZYM. Zadnej zlowieszczej nuty, zadnego ''cos jest nie
    tak'', zadnego zdania za duzo na koniec. Pokusa bedzie duza, bo narrator zawsze chce, zeby scena miala
    pointe - i wlasnie dlatego to stoi tutaj jako regula, a nie jako nadzieja. Jedyny swiadek, ktory moglby
    to zepsuc, z zasady tego nie zrobi: kontrakt glosu Varkhena zabrania mu zgadywania, wiec powie najwyzej,
    ze trzecia trzyma, ale nie tak, jak trzymala - i odmowi rozwiniecia.'
  placement: interludium po Akcie 4 - patrz planning/campaign-roadmap.yaml
