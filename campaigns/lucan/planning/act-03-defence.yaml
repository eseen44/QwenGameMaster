schema_version: 1
id: act_03_defence_rationale
name: Uzasadnienia obrony instytucjonalnej Lucana — pełny zapis
status: living_reasoning_store
purpose: |
  Magazyn PEŁNYCH uzasadnień dla celów z state/objectives.yaml. Powstał 19 sierpnia 2026 r.
  przez wyprowadzenie prozy z objectives.yaml, który spuchł do 22,8 KB i zjadał 57% budżetu
  aktywnego kontekstu (40 KB) na każdym otwarciu sceny.

  NIC TU NIE JEST NOWE - to ten sam tekst, przeniesiony. W objectives.yaml został przy każdym
  celu jednolinijkowy `key_constraint` oraz `rationale_ref` wskazujący tutaj.

  ZASADA ŁADOWANIA: ten plik NIE wchodzi do kontekstu automatycznie (planning/** nigdy nie
  wchodzi). Jest wpisany w context/active.yaml pod `load_when_choosing_a_plan` - narrator ma
  go wczytać w KAŻDEJ turze, w której gracz planuje, wybiera linię obrony, rozmawia z
  instytucją albo pyta "co dalej". W turach ruchu, walki i zwykłej rozmowy nie jest potrzebny.

decoy_construct:
  objective_ref: objective_build_decoy_construct_for_academy
  constraints:
    - id: energy_budget
      text: 'ENERGIA - każdy trwały krok obudowania nowego służącego kosztuje 8
        (permanent_growth_steps 0, reguła 8 x 1.5^n z system/companion-growth.md), a Lucan ma
        13,5/15. Wychodzi JEDEN porządnie obudowany wabik, nie kilka. "Kilka" jest osiągalne
        tylko jako proste, nieprzekonujące pająki.'
    - id: doctrine_refined
      source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
      text: 'Lucan podniósł trafny kontrargument i Seraphine go przyznała: z zewnątrz NIE DA
        SIĘ odróżnić wyuczonej sztuczki od świeżego posłuszeństwa. Wniosek praktyczny -
        argument "konstrukt" jest argumentem PRAWNYM i PUBLICZNYM, trzyma się przed
        magistratem, urzędnikiem i publicznością, a NIE trzyma się przed nikim, kto potrafi
        czytać więź. Tellem nie jest sam gest, a NOWOŚĆ i terminowość reakcji: sztuczka
        powtarza się identycznie, posłuszeństwo dostosowuje się do prośby. Kto poprosi o INNY
        gest i dostanie inny gest, ma dowód. Operacyjnie - na dyspucie okaz może wykonywać
        tylko repertuar powtarzalny i nie wolno pozwolić nikomu z widowni zamówić gestu.'
    - id: visibility_trap
      source_event_id: event_turn_interlude_029_academy_as_civic_risk
      text: 'PUŁAPKA WIDOCZNOŚCI - najważniejsza korekta planu. Z zewnątrz nekromanta
        dołączający do strony SZEROKIEJ definicji jest najlepszym prezentem dla strony
        WĄSKIEJ; argument npc_ivar_kolm pisze się sam: patrzcie, kto przyszedł ich poprzeć.
        Widoczny Lucan nie wzmacnia npc_neris_aldhen, jest jej kontrprzykładem i żywym
        dowodem, że szeroka definicja produkuje dokładnie takich ludzi. WNIOSEK - wartość
        Lucana dla tej frakcji jest realna, ale musi być NIEWIDZIALNA: źródło, nie sojusznik;
        karmi argument, nie występuje w nim. To jest nie do pogodzenia z planem ojca, który
        chce wystawić okazy pod nazwiskiem syna. UWAGA - Seraphine wycofała tę radę w
        event_turn_interlude_031, gdy dowiedziała się o katedrze Lucana: członek MOŻE być
        widoczny, byle jako badacz. Pułapka dotyczy więc wystąpienia BEZ płaszcza.'
    - id: seraphine_obedience_rule
      source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk
      text: 'REGUŁA SERAPHINE - okaz NIE MOŻE przy nikim reagować na polecenie. Konstrukt
        wykonuje, sługa słucha; mechanizm nie odpowiada na prośbę. Demonstracja posłuszeństwa
        jest różnicą między "posiada dziwactwo" i "kontroluje nieumarłych". Zderza się to
        frontalnie z planem wystawienia okazu na publicznej dyspucie, gdzie npc_ivar_kolm ma
        zadanie nazwać go nieumarłym - jedno posłuszne drgnięcie kończy spór w jednym zdaniu.
        Seraphine NIE wie o dyspucie.'
    - id: structural_flaw
      text: 'WADA STRUKTURALNA planu, wyłożona przez ojca bez cienia niepokoju - im mniej
        biologiczny okaz, tym słabszy argument o odżywianiu, bo to metabolizm miał dowodzić
        procesu ciągłego. A jeśli okaz zostanie biologiczny dość, żeby argument działał,
        sekcja pokaże dokładnie to samo co u Spideya - vitae w martwej tkance. Wabik chroni
        Spideya, nie chroni metody.'
  material_timetable:
    source_event_id: event_turn_interlude_021_timetable_and_offprint
    academy_collections: 'Dostępne od zaraz, ale okazy są UTRWALONE (spirytus, suszenie). Do
      przeszczepu bezużyteczne - utrwalona tkanka nie przewodzi. Wartościowe jako referencja i
      jako części "mechaniczne" do obudowy wabika.'
    fresh_supply: Stała dostawa żywego towaru Akademii - najbliższa za około 7 dni. To samo
      okno co konferencja, więc odnóże dla Spideya i wabik łapią się w jeden termin.
    webber_night_haul: Już zdobyte, czeka w baszcie. Pająki piwniczne, osy, chrząszcze,
      stonogi - za małe na odnóże dla Spideya, wystarczające jako ciała małych okazów serii.
  schedule_and_alignment:
    source_event_id: event_turn_interlude_022_notice_board_identification
    text: 'ZBIEŻNOŚĆ OSIĄGNIĘTA. Wcześniejszy caveat o niesterowalnym terminie postępowania
      jest nieaktualny - termin ustalono jawnie na 15 dni (clock_guild_leadership_hearing), a
      dysputa wypada za 16. Trzy rzeczy siadają w jednym tygodniu: materiał (7 dni), gotowe
      okazy i pokaz (15), przesłuchanie (15), dysputa (16). To jest dokładnie układ, o który
      gracz prosił - akademicy będą mieli własny interes w tym, żeby Lucan nie siedział w
      areszcie w dniu swojej dysputy. Cena: pokaz przestał być prywatny, a po drugiej stronie
      stoi wyznaczony oponent (npc_ivar_kolm), którego zadaniem jest wykazać, że taki okaz to
      nieumarły.'
  cost_already_incurred:
    text: 'Lucan powiedział "kilka" i "konferencja" na głos człowiekowi, który uważa, że dobra
      praca ma być widziana. Ojciec przyjął to jako zgodę i zaczął organizować pokaz we
      własnym tempie. Sprawa przestała być prywatna. CZĘŚCIOWO ODZYSKANE
      (event_turn_interlude_021) - Lucan przestawił clock_father_arranges_academy_showing z
      trzech dni na osiem, potem na piętnaście, używając własnego argumentu ojca: jeden okaz
      to anekdota, seria to materiał, a serii nie zrobi się w trzy dni.'

institutional_defence:
  objective_ref: objective_prepare_institutional_defense
  lawyer_choice:
    step_ref: seek_representative_or_lawyer
    text: 'Gracz wprost poprosił o obrońcę równolegle ze spieniężaniem łupu. Doprecyzowane -
      ma to być prawnik z obiegu przestępczego ("mafijny"), nie zwykły pisarz pozwów, i idzie
      tym samym spotkaniem co pieniądze (objective_liquidate_cemetery_loot.appointment - Boros
      i Mara, za dwa dni). Rząd skrybów na targu (zone_market_scribes_and_notices) pozostaje
      wariantem publicznym i tanim, ale nie tym, o który gracz prosił.'
  two_contradictory_defences:
    source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer
    text: 'Uwaga Seraphine. Prawnik z ulicy zna urzędników magistratu, nie Akademię. Obrona
      KLASYFIKACYJNA mówi "to nie była nekromancja, to konstrukt" i potrzebuje akademika.
      Obrona KARNA mówi "nawet jeśli, to nie ma przepisu i nie ma dowodu" i potrzebuje kogoś,
      kto zna forum i urzędników. Te dwie linie sobie przeczą - wybór jednej osłabia drugą, bo
      pierwsza przyznaje, że klasyfikacja ma znaczenie, a druga, że czyn miał miejsce. Wybrać
      PRZED przesłuchaniem, nie na nim.'
  classification_strategy:
    step_ref: determine_spidey_and_webbers_legal_classification
    player_declared:
      source_event_id: event_turn_interlude_015_silkworms_and_specimen_order
      text: 'Gracz rozstrzygnął kierunek: NIE próbuje ukryć istnienia Spideya. Wychodzi z
        założenia, że raport o odciążeniu transmitera na cmentarzu jest już w oficjalnych
        aktach i że inne frakcje w końcu do nich dojdą, a nikt nie wie, gdzie mieszka - więc
        ukrywanie pająków nie jest priorytetem. Linia obrony ma brzmieć: Spidey to KONSTRUKT,
        nie nieumarły. Do tej argumentacji potrzebny jest ekspert z Akademii
        (faction_lumaria_magical_academy broni granicy konstrukt/golem/chowaniec właśnie
        dlatego, że chroni własne przywileje). Najprostsza droga według gracza - ojciec Lucana
        (npc_lucan_father), bo pierwszy raz w życiu Lucan ma coś, co może go zainteresować.'
    argument_sharpened_by_father:
      source_event_id: event_turn_interlude_019_vitae_disclosure_to_father
      text: 'Najmocniejszy argument to NIE "vitae", a ODŻYWIANIE. Spidey utrzymuje się sam,
        poluje na drobną zdobycz i się z niej żywi; utrzymanie znaczy przemianę materii, a
        przemiana materii znaczy proces ciągły. Ożywienie nie je. Słowa "vitae" nie używać
        przy nikim w stule - kapłan usłyszy w nim dokładnie to, co chce usłyszeć.'
    risk_note: 'Akademia strukturalnie chce DOSTĘPU do okazów - w jej pliku frakcji stoi
      fears loss_of_access_to_specimens_or_evidence oraz incentives
      inspect_or_claim_access_to_spidey. Spidey jest okazem. Ochrona przez instytucję jest
      układem politycznym i źródłem długu, nie uniewinnieniem.'
    open_question: 'Jaki jest prawny status Spideya i sieciarzy - pupil, konstrukt, czy
      wystarczający dowód nekromancji przeciw Lucanowi? Wiąże się z conflict_axis
      secular_classification_of_spidey_and_the_webber_network w
      planning/act-03-city-power-dynamics.yaml.'
  legal_doctrine_stress_test:
    step_ref: legal_doctrine_stress_tested_by_seraphine
    source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer
    confirmed: 'POTWIERDZONE w wersji Lucana - prawo Solmary jest antropocentryczne i nie
      tworzy praw zwierząt, dusz ani godności; modyfikacja drobnych bezkręgowców to realna
      szara strefa; mały żywy pająk zmodyfikowany magią śmierci jest trudny do
      zaklasyfikowania i dowiedzenia; Akademia klasyfikuje przez mechanizm i wiązanie duszy;
      kontrolowany nieumarły rozumny (Varkhen) to zupełnie inna, ciężka kategoria. Definicji
      "praktyki" nikt nie skodyfikował.'
    four_holes:
      - 'Nielegalna jest PRAKTYKA nekromancji, a pająk nie jest oskarżonym, jest dowodem -
        brak prawa o godności zwierząt nie dotyczy zarzutu.'
      - 'Szara strefa NIE daje immunitetu - użycie pająka do zabijania, szpiegowania lub
        przenoszenia zakazanej energii to osobne czyny. ALE Lucan rozebrał to w
        event_turn_interlude_028: nie ma ciał (kaplicowe nierozpoznawalne i nienamierzalne,
        wysypiskowe pochowane albo spalone miesiąc temu), najemnik może nosić narzędzia mordu,
        a zarzut siatki zamyka się na oskarżeniu ("jeśli bezmyślny konstrukt, to nie
        raportuje"). Seraphine oddała wszystkie trzy. Zostaje jej tylko fizyczny osad -
        pajęczyny w trzech miejscach - i sama nazwała to cienkim.'
      - 'Brak przepisu nie jest bezpieczeństwem - zostaje zagrożenie publiczne,
        świętokradztwo, bezprawna magia, zniszczenie własności, zakłócenie porządku. Brak
        definicji jest osłoną TEGO, KTO TRZYMA FORUM, nie oskarżonego.'
      - 'Varkhen jest problemem TERAZ - więź formalnej kontroli już istnieje, a przykrywka
        starożytnego strażnika trzyma się tylko dopóki kontrola pozostaje niedowiedziona.
        Seraphine przyznała jednak, że to także JEJ projekt - ona go wyprowadziła i ona go
        trzyma w piwnicy gildii - i że wyzerowanie Varkhena niszczy razem z dowodem jedyną
        broń Lucana przeciw Kościołowi (świadka na kapłana od pieczęci).'
    conclusion: 'Pozycja prawna Lucana jest mocniejsza, niż Seraphine zakładała, co nie usuwa
      zagrożenia, a je PRZENOSI. Człowieka, którego nie da się skazać, rozwiązuje się bez
      sądu: cichym zamknięciem sprawy przez własny rod, żądaniem stłumienia po stronie
      Kościoła albo wymianą odstąpienia od zarzutów na służbę, dostęp i milczenie.'
  noble_name_disclosure:
    step_ref: disclose_noble_name_angle_to_allies
    source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
    text: 'Powiedziane Seraphine - przez nazwisko rodowe sprawa szybko wyjdzie do Akademii i
      rodów. Jej ocena: nekromanta bez nazwiska to sprawa dyscyplinarna i karna, nekromanta z
      nazwiskiem to spór o jurysdykcję, w którym Lucan przestaje być oskarżonym i staje się
      STAWKĄ. Skutek dwustronny - jej warunkowa osłona słabnie, bo nie osłoni go w
      jurysdykcji, w której nie siedzi; ale nazwisko jest powodem, dla którego ktoś wysoko
      może CHCIEĆ korzystnej klasyfikacji.'
  academy_post:
    step_ref: reactivate_the_dormant_academy_post
    correction:
      source_event_id: event_turn_interlude_031_the_dormant_sinecure
      text: 'POPRAWKA - poprzedni krok (acquire_institutional_coat_at_the_academy) założył, że
        Lucan nie ma afiliacji. To było błędne i zapisane, zanim gracz to ujawnił. Lucan MA
        katedrę i umocowanie przy Akademii; jest członkiem na wymuszonym urlopie dziekańskim
        od ponad dwóch lat. Płaszcza nie trzeba zdobywać, trzeba zdecydować, czy go użyć.'
    player_correction:
      source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
      text: 'Reaktywacja jest ZBĘDNA. Afiliacja w tym środowisku nie jest procedurą, jest
        ROZPOZNANIEM: wystarczy, że wiedzą, kim jest. To ludzie, którzy mogą kogoś nie widzieć
        trzydziestu lat i zaczynają rozmowę w punkcie, w którym ją skończyli. Żaden podpis nie
        jest potrzebny, bo nie ma czego włączać. Synekura jest przy tym nietykalna - Lucan
        mógłby być woźnym i nikt nie ruszyłby jego pokoju. Lucan nie jest zainteresowany
        powrotem na uczelnię.'
    gain: 'Jako członek przestaje być okazem, którego nikt nie chroni; ma trzy płaszcze
      (cechowy, rodowy, akademicki), czyli jest STAWKĄ w sporze o jurysdykcję, nie oskarżonym.
      Plan ojca przestaje być "nikt wystawia trupa" i staje się "członek prezentuje badanie
      członka" - Seraphine odwołała z tego powodu swoją radę o niewidzialności.'
    costs:
      - 'Akademia ma wobec członka WŁASNĄ procedurę dyscyplinarną, więc wezwanie na seminarium
        staje się WYKONALNE. Ten sam płaszcz, który chroni przed Kościołem, daje Akademii
        tytuł do wezwania.'
      - 'Niepłatna synekura jest niewidzialna tylko dopóki właściciel jest nudny - z chwilą,
        gdy Lucan staje się interesujący, ktoś sięga po akta, a tam jest urlop dziekański, jego
        przyczyna i podcięcie edukacji przez rodzinę.'
    why_the_coat_matters:
      source_event_id: event_turn_interlude_030_the_seminar_problem
      text: 'Kościół ma rację, że Akademia jest pełna ludzi, których nazwałby nekromantami -
        ale oni mają PŁASZCZ. Nikt tam nie jest nekromantą, każdy jest licencjonowanym
        badaczem, i ta zbiorowa fikcja działa dopóki nie da się wskazać nazwiska BEZ
        afiliacji. Ochrona w tym porządku bierze się ze statusu, afiliacji i patrona.'
  seminar_problem:
    step_refs: [prepare_one_canonical_account_before_anyone_asks, seminar_tactic_do_not_refuse]
    source_event_id: event_turn_interlude_030_the_seminar_problem
    mechanism: 'Akademia nie wezwie Lucana na przesłuchanie, wezwie go na SEMINARIUM, i
      odmowy nie uzna za odpowiedź, bo dla niej niewiedza jest stanem do usunięcia, nie
      granicą do respektowania. Seraphine uznała to za gorsze niż wszystko inne tego wieczoru:
      umie bronić przed trybunałem, nie umie bronić przed ludźmi, którzy ZAPISZĄ. Recenzowany
      opis metody jest dokładnie tym dowodem, którego Kościół nie ma, wykonanym w dobrej
      wierze przez własną stronę Lucana, z przypisami. Gildia nie ma nad seminarium żadnej
      jurysdykcji.'
    tactic_do_not_refuse: 'Akademik nie przyjmuje "nie", ale przyjmuje "nie umiem tego jeszcze
      sformalizować" - i będzie się o to kłócił miesiącami, zamiast próbować to z Lucana
      wyciągnąć. Opis na poziomie mechanizmu, bez procedury odtwarzalnej. Nigdy nie mówić "nie".'
    tactic_one_version: 'Przygotować JEDNĄ wersję opowieści o tym, jak to działa, i trzymać ją
      identyczną na seminarium, na przesłuchaniu przed kierownictwem i u prawnika. Rozjazd
      między forami zabija szybciej niż sama treść. Do zrobienia w ciągu dwutygodniowego
      interludium.'
  unmanaged_asset:
    step_ref: decide_what_to_do_about_being_an_unmanaged_asset
    source_event_id: event_turn_interlude_033_veyr_is_not_a_family
    text: 'NAJWAŻNIEJSZA ZMIANA RAMY. Rod Veyr nie jest rodziną, jest systemem obsadzonych
      foteli i rodem WIELKIM - patrz faction_house_veyr_main_line#structure. Wnioski
      Seraphine: (1) spór o jurysdykcję może być wewnętrzną realokacją, w której nikt nie musi
      wygrać, ktoś musi tylko zdecydować; (2) taki system nie skazuje i nie broni -
      PRZYDZIELA, więc najbardziej prawdopodobnym końcem sprawy nie jest kara, a posada ze
      smyczą; (3) system nie prowadzi rejestru sympatii, tylko rejestr POZYCJI - dwa lata
      uciekania nie wypisały Lucana z niczego, zrobiły z niego AKTYW NIEZARZĄDZANY, a takie
      zostają zarządzone w chwili widoczności. Widoczność przychodzi za dwa tygodnie trzy razy
      z rzędu: przesłuchanie, seminarium, dysputa. ZADANIE - rozstrzygnąć, czy Lucan chce
      negocjować warunki własnego przydziału, czy próbować pozostać niezarządzany, i jakim
      kosztem. Seraphine przy tym przyznała, że jest prawdopodobnie jedyną stroną, której
      osłona nad Lucanem nie jest transakcją, i jednocześnie najsłabszą stroną przy stole.'
  safe_house:
    step_ref: find_a_searchable_but_empty_place_to_sleep
    source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    text: 'Lokal do spania - naprawdę do spania - ale przede wszystkim taki, który ktoś może
      przeszukać i nic nie znaleźć. KANDYDAT ODRZUCONY: dom właściciela garbarni, do którego
      Lucan ma klucz. Seraphine rozebrała pomysł - sprawa garbarnika jest formalnie OTWARTA,
      więc jest to jedno z niewielu miejsc w mieście, które da się legalnie przeszukać Z
      NAKAZEM, a wszystko, co tam znajdą, przyklei się do Lucana. Właściwe kryterium, które
      ona sformułowała: nie pusty pokój, a pokój z NUDNYM właścicielem i bez żadnego związku z
      jakimkolwiek otwartym postępowaniem.'

legalisation_horizon:
  objective_ref: objective_prepare_institutional_defense
  source: 'Prognoza gracza. Tura 039 cofnieta (rollback A) - w fikcji Lucan NIE powiedzial
    tego jeszcze Seraphine, wiec nie przypisywac jej tej wiedzy ani jej wnioskow.'
  player_forecast: 'PROGNOZA GRACZA, podana Seraphine wprost: z duzym prawdopodobienstwem w
    ciagu MIESIACA nekromancja moze byc w Lumarii de facto legalna - i to dopiero bedzie
    problem. Podane razem z wlasnym motywem Lucana: nie chce kariery w gildii, wrecz ucieka
    przed jakakolwiek kariera, rozterki moralne go nie interesuja (tak jak przy Orenie), a
    jedyny powod, dla ktorego wciaz jest w gildii, to utrzymanie Varkhena na chodzie, bo
    miasto siedzi na bombie cmentarnej.'
  why_it_is_worse_than_illegality:
    - 'KOSCIOL NIE PRZYJMIE SZAREJ STREFY. Inkwizycji brakowalo nie zamieszek, a PRETEKSTU
      (patrz lucan-leads#lead_contact_pro_corpse_faction). Dopoki spor toczy sie w forach,
      Seraphine ma w nim glos; zanik sciezki formalnej wypycha spor z forow, a poza forami
      jej oslona nie dziala. Precedens gracza to potwierdza - ojca potepiono dwa razy, a
      potem ktos przyszedl do laboratorium osobiscie.'
    - 'USUNIETE JAKO HALUCYNACJA NARRATORA (rollback A, 2026-08-20): lancuch legalne ->
      licencja -> rejestr -> Akademia wystawia licencje. Nie mial zrodla w zadnym pliku.
      Wlasciwy mechanizm stoi w worlds/solmara/lore/necromancy-law.yaml -
      de_facto_liberalisation_mechanism: nikt niczego nie oglasza, po prostu przestaje sie
      rozpatrywac skargi.'
  common_ground: 'Varkhen jest jedynym punktem, w ktorym interesy Lucana i Seraphine sa
    identyczne bez zastrzezen - ona go wyprowadzila i ona trzyma go w piwnicy gildii.
    Zastrzezenie z jej strony: utrzymanie Varkhena wymaga, zeby Lucan byl za dwa tygodnie
    osiagalny, a nie zamkniety albo przydzielony.'

cemetery_loot:
  objective_ref: objective_liquidate_cemetery_loot
  text: 'Gracz zadeklarował kierunek na jutro/pojutrze, nie na dziś. Wymaga dyskretnego kupca
    - łup jest zbyt duży i zbyt oczywistego pochodzenia dla rzeczoznawcy gildii. Utrudnione
    przez kontrolę na wjazdach na targ i świeże obwieszczenie o zezwoleniach na transport
    szczątków (event_turn_interlude_013_market_food_run): 60 kg to dokładnie "cięższy
    ładunek", a każda formalna trasa zostawia wpis w rejestrze.'
  appointment_source: 'Gracz doprecyzował w nawiasie, że ustawił spotkanie z Borosem i Marą
    podczas rozmowy w gildii (turn_interlude_011/012); narrator nie podał wcześniej żadnego
    terminu, więc to uzupełnienie niesprecyzowanego szczegółu, nie retcon.'

act_02_rewards:
  objective_ref: objective_claim_act_02_rewards
  hearing_date_knowledge:
    source_event_id: event_turn_interlude_024_seraphine_date_and_payments
    text: 'Lucan ZNA horyzont od Seraphine: około dwóch tygodni, dzień w tę czy w tę, jeszcze
      nie ogłoszone oficjalnie. Zna więc horyzont, nie zna sztywnej daty. Wcześniej daty nie
      podała recepcjonistka (event_turn_interlude_012) ani nocny urzędnik
      (event_turn_interlude_023).'
  reward_is_hostage: 'Seraphine dopilnowała, żeby w rejestrze stało "oczekuje przeglądu", a nie
    "zamknięte" - to jej robota i realna przysługa. Cena: rozliczenie idzie TĄ SAMĄ sesją co
    przesłuchanie, więc nagroda Lucana zależy od tego, jak on na tym przesłuchaniu wypadnie.'
  why_no_date_announced: 'Służby miejskie żądają przekazania ciał, akt i dowodów z operacji
    cmentarnej, gildia się opiera, a dopóki nie jest jasne, kto trzyma materiał, nikt nie
    wyznacza terminu - bo termin oznacza przyznanie, kto prowadzi sprawę.'
  standing_stipend: 'Standardowe stypendium polowe (15 srebra) wypłacone przy recepcji
    (event_turn_interlude_012_reception_desk). Pełna nagroda za rozwiązanie kryzysu
    cmentarnego oznaczona jako oczekująca na przegląd kierownictwa i zleje się z
    przesłuchaniem instytucjonalnym, nie zostanie załatwiona osobno.'

clocks_rationale:
  father_arranges_academy_showing:
    clock_ref: clock_father_arranges_academy_showing
    origin: 'Zegar powstał z wyboru gracza, nie z nacisku świata. Lucan świadomie nie wytrącił
      ojca z równowagi i powiedział na głos, że zrobi kilka okazów na konferencję - człowiek,
      który uważa, że dobra praca ma być widziana, potraktował to jako zgodę i zaczął działać
      we własnym tempie.'
    reschedules: 'Przestawiony 3 -> 8 (event_turn_interlude_021), potem 8 -> 15
      (event_turn_interlude_022). Lucan użył własnego argumentu ojca: jeden okaz to anekdota,
      seria to materiał, a serii nie zrobi się w trzy dni. Materiał dochodzi za 7 dni, a praca
      zaczyna się PO nim, więc piętnaście jest spójne z fikcją, nie uznaniowe.'
    reclassified_as_seminar:
      source_event_id: event_turn_interlude_030_the_seminar_problem
      text: 'To, co nadchodzi, nie jest życzliwym pokazem. Ojciec nie organizuje osobnego
        pokazu - wepchnie okazy syna do JUŻ WYZNACZONEJ otwartej dysputy (za ok. 16 dni,
        referuje npc_neris_aldhen, oponuje npc_ivar_kolm). A Lucan, który był częścią tego
        świata, wskazał, w co takie mówienie się zamienia: wezwanie na SEMINARIUM, nie na
        przesłuchanie. Nie uznają odmowy. Efekt jest gorszy niż trybunał, bo seminarium
        ZAPISUJE. Gildia nie ma nad tym jurysdykcji.'
  guild_leadership_hearing:
    clock_ref: clock_guild_leadership_hearing
    origin: 'Termin ustalony wspólnie z graczem - recepcjonistka nie podała daty
      (event_turn_interlude_012), a gracz potrzebuje około dwóch tygodni interludium na
      trening i pozostałe sprawy. Piętnaście dni domyka to jawnie, zamiast trzymać wezwanie
      jako nieokreśloną grozę. Zbieżność z clock_father_arranges_academy_showing (15) i z
      dysputą (16) jest zamierzona przez gracza: jeśli postępowanie i dysputa wypadną w jednym
      tygodniu, akademicy mają własny interes w tym, żeby Lucan nie siedział w areszcie.'

