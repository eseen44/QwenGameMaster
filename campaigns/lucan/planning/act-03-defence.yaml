schema_version: 1
id: act_03_defence_rationale
name: Uzasadnienia obrony instytucjonalnej Lucana — pełny zapis
status: living_reasoning_store
purpose: |
  Magazyn PEŁNYCH uzasadnień dla celów z state/objectives.yaml. Powstał 19 sierpnia 2026 r.
  przez wyprowadzenie prozy z objectives.yaml, który spuchł do 22,8 KB i zjadał 57% budżetu
  aktywnego kontekstu (40 KB) na każdym otwarciu sceny.

  NIC TU NIE JEST NOWE - to ten sam tekst, przeniesiony. W objectives.yaml został przy każdym
  celu jednolinijkowy `key_constraint` oraz `rationale_ref` wskazujący tutaj.

  ZASADA ŁADOWANIA: ten plik NIE wchodzi do kontekstu automatycznie (planning/** nigdy nie
  wchodzi). Jest wpisany w context/active.yaml pod `load_when_choosing_a_plan` - narrator ma
  go wczytać w KAŻDEJ turze, w której gracz planuje, wybiera linię obrony, rozmawia z
  instytucją albo pyta "co dalej". W turach ruchu, walki i zwykłej rozmowy nie jest potrzebny.

decoy_construct:
  species_maturation_canon:
    source_event_id: event_turn_interlude_070_varkhen_walks_up_and_the_alarm_spider
    source: 'Kanon podany przez gracza 2026-08-24.'
    text: 'Pajaki Lucana MADRZEJA i robia sie bardziej temperamentne, im dluzej zyja.
      Swiezo utworzony okaz nie tylko WYGLADA bardziej mechanicznie - realnie jest
      blizszy konstruktowi, bo nie zdazyl sie wyrobic. To wzmacnia caly plan wabika:
      roznica miedzy Spideyem a wabikiem nie jest tylko kosmetyczna. Skutek uboczny -
      papier o autorstwie nie moze wymieniac Spideya, wiec nie da sie go wystawic,
      zanim wabik powstanie. Obejscie Seraphine: zarejestrowac sama JEDNOSTKE badawcza
      (datowana dzis), a okaz przypisac do niej pozniej.'
  objective_ref: objective_prepare_companions_and_specimens
  constraints:
    - id: time_budget
      supersedes: energy_budget
      retcon_ref: [retcon_000017, retcon_000021]
      retcon_ref_2: retcon_000024
      text: 'OKAZ POKAZOWY - okolo 4 GODZIN pracy recznej za sztuke, czyli kilka modyfikacji
        po ok. godzinie każda (retcon_000021 + retcon_000024). Osiem godzin to budzet dla
        pracy klasy Spideya, czyli okazu dopracowanego i bojowego. Jednostki pokazowe maja
        byc przeszyte i LEKKO opancerzone: wolniejsze, sztywniejsze i ciezsze od Spideya.
        Twarde zobowiazanie wynosi jeden okaz; zapas dodatkowych jest nieprecyzyjny i ma
        uwzgledniac mozliwosc zniszczenia okazu przez demonstracje albo sekcje. Energii nie
        kosztuje to wcale. Nie przedstawiac liczby jako wyboru kosztem prawnika lub innych
        przygotowan (retcon_000022, retcon_000063).'
    - id: doctrine_refined
      source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
      text: 'Lucan podniósł trafny kontrargument i Seraphine go przyznała: z zewnątrz NIE DA
        SIĘ odróżnić wyuczonej sztuczki od świeżego posłuszeństwa. Wniosek praktyczny -
        argument "konstrukt" jest argumentem PRAWNYM i PUBLICZNYM, trzyma się przed
        magistratem, urzędnikiem i publicznością, a NIE trzyma się przed nikim, kto potrafi
        czytać więź. Tellem nie jest sam gest, a NOWOŚĆ i terminowość reakcji: sztuczka
        powtarza się identycznie, posłuszeństwo dostosowuje się do prośby. Kto poprosi o INNY
        gest i dostanie inny gest, ma dowód. Operacyjnie - na dyspucie okaz może wykonywać
        tylko repertuar powtarzalny i nie wolno pozwolić nikomu z widowni zamówić gestu.'
    - id: visibility_trap
      source_event_id: event_turn_interlude_029_academy_as_civic_risk
      text: 'PUŁAPKA WIDOCZNOŚCI - najważniejsza korekta planu. Z zewnątrz nekromanta
        dołączający do strony SZEROKIEJ definicji jest najlepszym prezentem dla strony
        WĄSKIEJ; argument npc_ivar_kolm pisze się sam: patrzcie, kto przyszedł ich poprzeć.
        Widoczny Lucan nie wzmacnia npc_neris_aldhen, jest jej kontrprzykładem i żywym
        dowodem, że szeroka definicja produkuje dokładnie takich ludzi. WNIOSEK - wartość
        Lucana dla tej frakcji jest realna, ale musi być NIEWIDZIALNA: źródło, nie sojusznik;
        karmi argument, nie występuje w nim. To jest nie do pogodzenia z planem ojca, który
        chce wystawić okazy pod nazwiskiem syna. UWAGA - Seraphine wycofała tę radę w
        event_turn_interlude_031, gdy dowiedziała się o doktoracie, publikacjach oraz
        formalnie zachowanym stanowisku i pokoju Lucana: może być widoczny jako badacz,
        choć nie ma własnej katedry. Pułapka dotyczy więc wystąpienia bez wiarygodnej
        ramy badawczej.'
    - id: seraphine_obedience_rule
      demoted_to: npc_opinion
      retcon_ref: retcon_000023
      source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk
      text: 'NIE JEST OGRANICZENIEM PLANU (retcon_000023). Seraphine uwaza, ze okaz nie
        powinien przy nikim reagowac na polecenie, bo demonstracja posluszenstwa jest roznica
        miedzy "posiada dziwactwo" i "kontroluje nieumarlych". Kanon sam to podwazyl w
        event_turn_interlude_026b: z zewnatrz nie da sie odroznic wyuczonej sztuczki od
        swiezego posluszenstwa, ani mozgu pacynki od dzialania pupeteera - i Seraphine to
        Lucanowi przyznala. Zostaje jako mozliwy argument oponenta na dyspucie, nie jako
        zakaz nalozony na plan. Zakaz zamawiania gestu przez widownie SKASOWANY.'
    - id: structural_flaw
      status: removed_unsourced
      retcon_ref: retcon_000023
      text: 'USUNIETE. Byl to jedyny wpis w tej sekcji bez source_event_id - narratorska
        konstrukcja podana jako wada wylozona przez ojca. Stopien biologicznosci wabika NIE
        jest czynnikiem obrony; to wylacznie decyzja estetyczna gracza.'
  material_timetable:
    source_event_id: event_turn_interlude_021_timetable_and_offprint
    academy_collections: 'Dostępne od zaraz, ale okazy są UTRWALONE (spirytus, suszenie). Do
      przeszczepu bezużyteczne - utrwalona tkanka nie przewodzi. Wartościowe jako referencja i
      jako części "mechaniczne" do obudowy wabika.'
    fresh_supply: Duże żywe pajęczaki przychodzą w 6.-7. dniu interludium. Posłużą jako
      dawcy dla Spideya i materiał na jednostki pokazowe. Drugi tydzień interludium jest
      przeznaczony na pracę nad nimi.
    webber_night_haul: Już zdobyte, czeka w baszcie. Pająki piwniczne, osy, chrząszcze,
      stonogi - za małe na odnóże dla Spideya, wystarczające jako ciała małych okazów serii.
  schedule_and_alignment:
    source_event_id: event_turn_interlude_022_notice_board_identification
    text: 'ZBIEŻNOŚĆ OSIĄGNIĘTA. Wcześniejszy caveat o niesterowalnym terminie postępowania
      jest nieaktualny - termin ustalono jawnie na 15 dni (clock_guild_leadership_hearing), a
      dysputa wypada za 16. Trzy rzeczy siadają w jednym tygodniu: materiał (7 dni), gotowe
      okazy i pokaz (15), przesłuchanie (15), dysputa (16). To jest dokładnie układ, o który
      gracz prosił - akademicy będą mieli własny interes w tym, żeby Lucan nie siedział w
      areszcie w dniu swojej dysputy. Cena: pokaz przestał być prywatny, a po drugiej stronie
      stoi wyznaczony oponent (npc_ivar_kolm), którego zadaniem jest wykazać, że taki okaz to
      nieumarły.'
  cost_already_incurred:
    text: 'Lucan zobowiązał się wobec ojca do dostarczenia PRZYNAJMNIEJ JEDNEGO okazu na
      dyskusję. Dodatkowe jednostki na demonstracje i sekcje są planem roboczym bez ustalonej
      liczby, nie odrębnym zobowiązaniem. Ojciec zaczął organizować pokaz we własnym tempie,
      więc sprawa przestała być prywatna. CZĘŚCIOWO ODZYSKANE
      (event_turn_interlude_021) - Lucan przestawił clock_father_arranges_academy_showing z
      trzech dni na osiem, potem na piętnaście, używając własnego argumentu ojca: jeden okaz
      to anekdota, seria to materiał, a serii nie zrobi się w trzy dni.'

institutional_defence:
  objective_refs:
    - objective_prepare_guild_hearing_and_watch
    - objective_prepare_academy_church_dispute
  lawyer_choice:
    step_ref: seek_representative_or_lawyer
    text: 'Gracz wprost poprosił o obrońcę równolegle ze spieniężaniem łupu. Doprecyzowane -
      ma to być prawnik z obiegu przestępczego ("mafijny"), nie zwykły pisarz pozwów, i idzie
      tym samym spotkaniem co pieniądze (state/resources.yaml#receivable_cemetery_loot_sale - Boros
      i Mara, za dwa dni). Rząd skrybów na targu (zone_market_scribes_and_notices) pozostaje
      wariantem publicznym i tanim, ale nie tym, o który gracz prosił.'
  two_contradictory_defences:
    status: UCHYLONE - patrz #lucans_legal_doctrine_and_the_syndicate_pitch
    superseded_by_event_ids: [event_turn_interlude_108, event_turn_interlude_123]
    superseded_note: "Obie linie mowia to samo zdanie: przedmiotu sprawy nie ma - akademik buduje golemy z ciala, a kategorii prawnych dotyczacych zwierzat nie ma. Trzy niezalezne przejscia: Kesz (prawnik, t_108), Seraphine (t_123) i wlasna doktryna Lucana. Zostaje JEDEN szew - Kosciol nie uznaje szarej strefy zwierzecej doktrynalnie - i zostaje Varkhen. To nie jest wybor miedzy dwiema obronami; to jest jedna obrona z dwoma znanymi dziurami."
    source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer
    text: 'Uwaga Seraphine. Prawnik z ulicy zna urzędników magistratu, nie Akademię. Obrona
      KLASYFIKACYJNA mówi "to nie była nekromancja, to konstrukt" i potrzebuje akademika.
      Obrona KARNA mówi "nawet jeśli, to nie ma przepisu i nie ma dowodu" i potrzebuje kogoś,
      kto zna forum i urzędników. Te dwie linie sobie przeczą - wybór jednej osłabia drugą, bo
      pierwsza przyznaje, że klasyfikacja ma znaczenie, a druga, że czyn miał miejsce. Wybrać
      PRZED przesłuchaniem, nie na nim.'
  classification_strategy:
    step_ref: determine_spidey_and_webbers_legal_classification
    player_declared:
      source_event_id: event_turn_interlude_015_silkworms_and_specimen_order
      text: 'Gracz rozstrzygnął kierunek: NIE próbuje ukryć istnienia Spideya. Wychodzi z
        założenia, że raport o odciążeniu transmitera na cmentarzu jest już w oficjalnych
        aktach i że inne frakcje w końcu do nich dojdą, a nikt nie wie, gdzie mieszka - więc
        ukrywanie pająków nie jest priorytetem. Linia obrony ma brzmieć: Spidey to KONSTRUKT,
        nie nieumarły. Do tej argumentacji potrzebny jest ekspert z Akademii
        (faction_lumaria_magical_academy broni granicy konstrukt/golem/chowaniec właśnie
        dlatego, że chroni własne przywileje). Najprostsza droga według gracza - ojciec Lucana
        (npc_lucan_father), bo pierwszy raz w życiu Lucan ma coś, co może go zainteresować.'
    argument_sharpened_by_father:
      demoted_to: npc_rhetoric_with_known_hole
      retcon_ref: retcon_000023
      source_event_id: event_turn_interlude_019_vitae_disclosure_to_father
      text: 'Ojciec uwaza, ze mocniejszym argumentem od "vitae" jest ODZYWIANIE - Spidey
        poluje i zywi sie sam, utrzymanie znaczy przemiane materii, a przemiana materii
        znaczy proces ciagly. DZIURA WSKAZANA PRZEZ GRACZA (retcon_000023): ozywieniec tez
        sie odzywia, wiec odzywianie samo z siebie niczego nie rozstrzyga. To jedna z linii
        retorycznych ojca, nie najmocniejszy argument obrony. ZOSTAJE bez zmian jedna rzecz:
        nie mowic "vitae" przy nikim w stule - to ostroznosc operacyjna, nie teza prawna.'
    risk_note: 'Akademia strukturalnie chce DOSTĘPU do okazów - w jej pliku frakcji stoi
      fears loss_of_access_to_specimens_or_evidence oraz incentives
      inspect_or_claim_access_to_spidey. Spidey jest okazem. Ochrona przez instytucję jest
      układem politycznym i źródłem długu, nie uniewinnieniem.'
    open_question: 'Jaki jest prawny status Spideya i sieciarzy - pupil, konstrukt, czy
      wystarczający dowód nekromancji przeciw Lucanowi? Wiąże się z conflict_axis
      secular_classification_of_spidey_and_the_webber_network w
      planning/act-03-city-power-dynamics.yaml.'
  academy_revival_manual_as_precedent:
    source_event_id: event_turn_interlude_085
    step_ref: determine_spidey_and_webbers_legal_classification
    text: 'NOWY, MOCNIEJSZY FUNDAMENT OBRONY KLASYFIKACYJNEJ. Argument o odzywianiu upadl
      (retcon_000023 - ozywieniec tez sie odzywia). Zastapienie: Akademia trzyma we wlasnej
      bibliotece licencjonowany, recenzowany podrecznik o przywracaniu ruchu i oddechu cialu,
      ktore przestalo - utopionym, porazonym, pozornie zmarlym. Jesli instytucja sadzaca ma na
      polce procedure przywracania zatrzymanego ciala, to granica zywe/martwe jest w JEJ
      wlasnym jezyku ciagloscia z procedura, nie przepascia. Lucan ma egzemplarz fizycznie
      (item_library_marked_volume), z ich sygnatura wypalona w okladce. To nie jest
      uniewinnienie - to jezyk i precedens z ich wlasnej polki, po ktory nie trzeba niczego
      zmyslac, i pasuje do taktyki "nie umiem tego jeszcze sformalizowac".'
  legal_doctrine_stress_test:
    step_ref: legal_doctrine_stress_tested_by_seraphine
    source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer
    confirmed: 'POTWIERDZONE w wersji Lucana - prawo Solmary jest antropocentryczne i nie
      tworzy praw zwierząt, dusz ani godności; modyfikacja drobnych bezkręgowców to realna
      szara strefa; mały żywy pająk zmodyfikowany magią śmierci jest trudny do
      zaklasyfikowania i dowiedzenia; Akademia klasyfikuje przez mechanizm i wiązanie duszy;
      kontrolowany nieumarły rozumny (Varkhen) to zupełnie inna, ciężka kategoria. Definicji
      "praktyki" nikt nie skodyfikował.'
    four_holes:
      - 'Nielegalna jest PRAKTYKA nekromancji, a pająk nie jest oskarżonym, jest dowodem -
        brak prawa o godności zwierząt nie dotyczy zarzutu.'
      - 'Szara strefa NIE daje immunitetu - użycie pająka do zabijania, szpiegowania lub
        przenoszenia zakazanej energii to osobne czyny. ALE Lucan rozebrał to w
        event_turn_interlude_028: nie ma ciał (kaplicowe nierozpoznawalne i nienamierzalne,
        wysypiskowe pochowane albo spalone miesiąc temu), najemnik może nosić narzędzia mordu,
        a zarzut siatki zamyka się na oskarżeniu ("jeśli bezmyślny konstrukt, to nie
        raportuje"). Seraphine oddała wszystkie trzy. Zostaje jej tylko fizyczny osad -
        pajęczyny w trzech miejscach - i sama nazwała to cienkim. KOREKTA GRACZA
        25.08.2026: to nie jest cienkie, to jest ŻADNE. Pajęczyny są wszędzie i w każdym
        budynku; sama sieć nie odróżnia się od innych i nie wskazuje niczego ani nikogo.
        Osad staje się dowodem WYŁĄCZNIE wtedy, gdy ktoś odzyska OKAZ i stwierdzi, że pająk
        jest martwy i chodzi. Nie prowadzić pajęczyny jako tropu, poszlaki ani obciążenia -
        ani przeciw Lucanowi, ani przeciw komukolwiek, u kogo leży. Czwarta dziura jest więc
        zamknięta razem z trzema pozostałymi; z tej osi zostaje wyłącznie fizyczne
        ZNALEZIENIE sługi.'
      - 'ZAWEZENIE (retcon_000031, 25.08.2026): samo fizyczne ZNALEZIENIE slugi tez nie jest dowodem. Niezakotwiczony okaz to martwy owad; do stwierdzenia "martwy i chodzi" potrzebna jest SEKCJA, a Lucan konczy sluge decyzja, wiec sekcja idzie na zwyklej zwloce. Death_Anchor nie jest wiedza powszechna - ujawnia sie tylko sekcja wykonana przez kogos pismiennego nekromantycznie albo akademicko. Realna ekspozycja to wiec okaz ZAKOTWICZONY plus kompetentny czytelnik, jednoczesnie.'
      - 'Brak przepisu nie jest bezpieczeństwem - zostaje zagrożenie publiczne,
        świętokradztwo, bezprawna magia, zniszczenie własności, zakłócenie porządku. Brak
        definicji jest osłoną TEGO, KTO TRZYMA FORUM, nie oskarżonego.'
      - 'Varkhen jest problemem TERAZ - więź formalnej kontroli już istnieje, a przykrywka
        starożytnego strażnika trzyma się tylko dopóki kontrola pozostaje niedowiedziona.
        Seraphine przyznała jednak, że to także JEJ projekt - ona go wyprowadziła i ona go
        trzyma w piwnicy gildii - i że wyzerowanie Varkhena niszczy razem z dowodem jedyną
        broń Lucana przeciw Kościołowi (świadka na kapłana od pieczęci).'
    conclusion: 'Pozycja prawna Lucana jest mocniejsza, niż Seraphine zakładała, co nie usuwa
      zagrożenia, a je PRZENOSI. Człowieka, którego nie da się skazać, rozwiązuje się bez
      sądu: cichym zamknięciem sprawy przez własny rod, żądaniem stłumienia po stronie
      Kościoła albo wymianą odstąpienia od zarzutów na służbę, dostęp i milczenie.'
  noble_name_disclosure:
    step_ref: disclose_noble_name_angle_to_allies
    source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question
    text: 'Powiedziane Seraphine - przez nazwisko rodowe sprawa szybko wyjdzie do Akademii i
      rodów. Jej ocena: nekromanta bez nazwiska to sprawa dyscyplinarna i karna, nekromanta z
      nazwiskiem to spór o jurysdykcję, w którym Lucan przestaje być oskarżonym i staje się
      STAWKĄ. Skutek dwustronny - jej warunkowa osłona słabnie, bo nie osłoni go w
      jurysdykcji, w której nie siedzi; ale nazwisko jest powodem, dla którego ktoś wysoko
      może CHCIEĆ korzystnej klasyfikacji.'
  academy_post:
    step_ref: clarify_or_reactivate_the_frozen_academy_post_if_needed
    correction:
      source_event_id: retcon_000068
      text: 'POPRAWKA - Lucan uzyskal doktorat w wieku 21 lat dzieki mocnemu dorobkowi
        wspolautora prac ojca. Ma formalne stanowisko mlodego badacza w jego zespole i pokoj
        obok laboratorium; stanowisko obejmowalo okazjonalne obowiazkowe prowadzenie zajec.
        Rodzina jako duzy darczynca od prawie dwoch lat blokuje wykonywanie pracy, granty
        i wyjazdy. Nie ma wlasnej katedry ani kanonicznego urlopu dziekanskiego.'
    player_correction:
      source_event_id: retcon_000068
      text: 'Pokoj nadal nalezy do Lucana, mimo blokady pracy. Z perspektywy Seraphine wyglada
        to jak synekura i "cos tu smierdzi": instytucja przez dwa lata nie pozwala komus
        pracowac, ale nadal trzyma dla niego stanowisko i pokoj. Synekura jest jej etykieta
        politycznego paradoksu, nie formalnym tytulem. Lucan nie jest zainteresowany prostym
        powrotem na uczelnie.'
    gain: 'Doktorat, publikacje, zachowane stanowisko i pokoj pozwalaja przedstawic Lucana jako
      badacza z historia instytucjonalna, a nie anonimowego nekromante. Daje to Akademii powod,
      by walczyc o autorstwo i klasyfikacje jego pracy, lecz nie gwarantuje ochrony.'
    costs:
      - 'Seraphine zaklada, ze formalnie zachowane stanowisko moze dac Akademii proceduralny
        pretekst do wezwania Lucana. Dokladny zakres tej jurysdykcji nie zostal ustalony;
        nie traktowac go jako automatycznie wykonalnego nakazu bez zrodla.'
      - 'Z chwila, gdy Lucan staje sie interesujacy, ktos moze siegnac po akta i znalezc
        podejrzany uklad: doktorat w wieku 21 lat, dorobek ojca, zachowane stanowisko i pokoj,
        a obok rodzinna blokada pracy, grantow i wyjazdow.'
    why_the_coat_matters:
      source_event_id: event_turn_interlude_030_the_seminar_problem
      text: 'Kościół ma rację, że Akademia jest pełna ludzi, których nazwałby nekromantami -
        ale oni mają PŁASZCZ. Nikt tam nie jest nekromantą, każdy jest licencjonowanym
        badaczem, i ta zbiorowa fikcja działa dopóki nie da się wskazać nazwiska BEZ
        afiliacji. Ochrona w tym porządku bierze się ze statusu, afiliacji i patrona.'
  seminar_problem:
    step_refs: [prepare_one_canonical_account_before_anyone_asks, seminar_tactic_do_not_refuse]
    source_event_id: event_turn_interlude_030_the_seminar_problem
    mechanism: 'Akademia nie wezwie Lucana na przesłuchanie, wezwie go na SEMINARIUM, i
      odmowy nie uzna za odpowiedź, bo dla niej niewiedza jest stanem do usunięcia, nie
      granicą do respektowania. Seraphine uznała to za gorsze niż wszystko inne tego wieczoru:
      umie bronić przed trybunałem, nie umie bronić przed ludźmi, którzy ZAPISZĄ. Recenzowany
      opis metody jest dokładnie tym dowodem, którego Kościół nie ma, wykonanym w dobrej
      wierze przez własną stronę Lucana, z przypisami. Gildia nie ma nad seminarium żadnej
      jurysdykcji.'
    tactic_do_not_refuse: 'Akademik nie przyjmuje "nie", ale przyjmuje "nie umiem tego jeszcze
      sformalizować" - i będzie się o to kłócił miesiącami, zamiast próbować to z Lucana
      wyciągnąć. Opis na poziomie mechanizmu, bez procedury odtwarzalnej. Nigdy nie mówić "nie".'
    tactic_one_version: 'Przygotować JEDNĄ wersję opowieści o tym, jak to działa, i trzymać ją
      identyczną na seminarium, na przesłuchaniu przed kierownictwem i u prawnika. Rozjazd
      między forami zabija szybciej niż sama treść. Do zrobienia w ciągu dwutygodniowego
      interludium.'
  family_expectations_if_house_veyr_takes_notice:
    step_ref: decide_how_to_handle_family_expectations_if_house_veyr_takes_notice
    source_event_id: event_turn_interlude_033_veyr_is_not_a_family
    text: 'Rod Veyr działa jak arystokratyczna korporacja i nieformalny kartel patronacki.
      Zakłada, że udział jest tak korzystny, iż każdy członek rodu sam uzna posłuszeństwo
      starszyźnie za oczywiste - nawet gdy starszyzna przez większość życia nie pamiętała,
      że istnieje. Nie ma aktywnej procedury zarządzania Lucanem ani pewności, że obecne fora
      uruchomią zainteresowanie rodu. Jeżeli ród go zauważy, możliwa będzie oferta ochrony,
      pozycji albo obowiązku; wtedy dopiero Lucan zdecyduje, czy korzysta z patronatu,
      negocjuje jego warunki, czy odrzuca oczekiwania (retcon_000064).'
  safe_house:
    step_ref: find_a_searchable_but_empty_place_to_sleep
    source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    text: 'Lokal do spania - naprawdę do spania - ale przede wszystkim taki, który ktoś może
      przeszukać i nic nie znaleźć. KANDYDAT ODRZUCONY: dom właściciela garbarni, do którego
      Lucan ma klucz. Seraphine rozebrała pomysł - sprawa garbarnika jest formalnie OTWARTA,
      więc jest to jedno z niewielu miejsc w mieście, które da się legalnie przeszukać Z
      NAKAZEM, a wszystko, co tam znajdą, przyklei się do Lucana. Właściwe kryterium, które
      ona sformułowała: nie pusty pokój, a pokój z NUDNYM właścicielem i bez żadnego związku z
      jakimkolwiek otwartym postępowaniem.'

the_boundary_lucan_designed:
  objective_ref: objective_prepare_academy_church_dispute
  source_event_id: event_turn_interlude_160
  status: 'PROJEKT GRACZA, podany Neris Aldhen na glos w laboratorium profesora Veyra.
    Nie jest jeszcze prawem ani nawet tekstem - jest specyfikacja zdania, ktore ma stanac
    w publikacji wspolautorowanej przez profesora Veyra i w wystapieniu Neris na otwartej
    dyspucie za ok. 16 dni.'
  the_shift: 'NAJWIEKSZA ZMIANA RAMY W AKCIE 3. Do t_159 wlacznie Lucan BRONIL SIE przed
    granica, ktora ktos inny narysuje. Od t_160 JA RYSUJE. Przestaje byc przedmiotem
    klasyfikacji i staje sie jej autorem - przy cudzych nazwiskach na stopce.'
  specification:
    hard_prohibitions:
      - 'Ozywianie ludzi - zakaz ostry, bez szarej strefy.'
      - 'Kontrola nad WIEKSZYMI nieumarlymi - zakaz ostry.'
      - 'Kontrola TLUMU - nigdy, bez wyjatkow i bez klauzuli zgody.'
    permitted_exception: 'JEDEN okaz w klatce laboratoryjnej, pod warunkiem ze okaz
      PODPISAL ZA ZYCIA odpowiednie dokumenty. Instrument zgody antemortem - nienazwany,
      brak wiedzy, czy w Lumarii w ogole istnieje.'
    church_facing_clause: 'Do tekstu wchodzi cos, co strona koscielna moze odczytac po
      swojej stronie jako OCHRONE DUSZY. Nie musi byc naukowe. Ma byc cytowalne przez nich
      jako wygrana.'
    penalty_design: 'Wnioski pracy sie nie zmieniaja - zmieniaja sie IMPLIKACJE PRAWNE
      naruszenia tabu. Dobrane tak, zeby zlamanie zakazu zagrazalo takze innym grupom
      interesow w miescie (rody, gildie, magistrat, kupcy), nie tylko Kosciolowi.'
    audience_split: 'Uzasadnienie taktyczne podane wprost: profesor Veyr nie doczyta pracy
      do konca; fanatycy religijni tak. Dokument jest wiec pisany dla dwoch czytelnikow,
      ktorzy dostaja z tych samych akapitow dwie rozne rzeczy.'
  why_it_holds:
    academy: 'necromancy-law#construct_boundary.institutional_interest - Akademia boi sie,
      ze szeroka definicja zabije golemy, homunkulusy, protezy, biokonstrukty i chowance.
      Ten projekt tnie po CZLOWIEKU i po SKALI, nie po materiale ani po energii, wiec
      zdejmuje z nich zagrozenie w calosci.'
    church: 'church_position.tendency klasyfikuje przez profanacje i skazenie duchowe;
      animal_gray_zone_recognized_doctrinally: false. Klauzula zgody daje Kosciolowi
      przedmiot ochrony nazwany JEGO jezykiem - pierwsza rzecz w tym sporze, ktora moze
      przeczytac jako wygrana, zamiast jako odebranie legitymacji.'
    secular: 'secular_authority_position.tendency patrzy na public_danger. "Nigdy tlum"
      jest napisane wprost pod nia.'
    neris: 'Jej stanowisko (szeroka definicja ozywionego konstruktu) zostaje szerokie.
      Twardnieje wylacznie daleka sciana, ktorej jej tekst i tak nie bronil.'
    liberalisation_control: 'Odwrocenie mechanizmu z necromancy-law#de_facto_liberalisation_
      mechanism. Tam prawo umiera, bo przestaje sie rozpatrywac skargi, i srodek zaradczy
      przechodzi z papieru na ludzi. Tutaj: skoro zlamanie tabu zagraza czterem grupom
      naraz, kazda z nich ma wlasny powod skarge wniesc - wiec sciezka formalna NIE zanika.
      Kosciol dostaje doktryne i traci monopol na jej pilnowanie. To jest realizacja
      #legalisation_horizon: zatrzymac sie przed pelna legalizacja, bo pelna legalizacja
      wypycha spor poza fora, gdzie oslona Seraphine nie dziala.'
  varkhen_consequence:
    visibility: 'WIDZI TO WYLACZNIE LUCAN. Ani ojciec, ani Neris nie wiedza o istnieniu
      Varkhena - nie wkladac tej uwagi w usta zadnego NPC.'
    the_knife: 'Zakaz kontroli nad wiekszymi nieumarlymi jest wymierzony wprost w to, co
      Lucan trzyma w piwnicy gildii.'
    the_shield: 'Ratuje go dokladnie ta klauzula, ktora wpisano dla Kosciola - ZGODA.
      necromancy-law#varkhen_exposure.ancient_guardian_cover_story: przykrywka trzyma sie,
      dopoki Varkhen wspolpracuje DOBROWOLNIE, a milestone_046_varkhen_oath_compact jest
      paktem, nie wiezami. Klauzula podnosi przykrywke z poziomu dowodowego ("czego nie
      udowodnia") na poziom ustawowy ("co jest legalne").'
    the_price: 'Symetryczna. Od chwili wejscia tego zdania w zycie udowodniona KONTROLA
      Varkhena nie jest juz szara strefa - jest zlamaniem przepisu, ktory Lucan sam
      napisal, i to przepisu z sankcja skalibrowana na cztery frakcje naraz.'
  revision_t168:
    source_event_id: event_turn_interlude_168
    supersedes_within_this_section: specification.hard_prohibitions
    text: |
      ZAPIS ZMIENIL KSZTALT - Z WYLICZENIA NA WARUNEK NADRZEDNY. Obowiazuje ta wersja.
      Od gory stoi warunek zakazujacy TRYWIALIZOWANIA NEKROMANCJI NA LUDZIACH oraz
      BEZCZESZCZENIA ZWLOK. WYZSI NIEUMARLI NIE SA WYSZCZEGOLNIENI. "Nigdy tlum"
      zostaje - gracz go nie uchylil. Jeden okaz w klatce za zgoda antemortem zostaje.
      DLACZEGO TO DZIALA: to nie jest przemilczenie, tylko WEZSZY ZAKRES. Tekst, ktory
      czegos nie wymienia, ma zakres; dziure ma dopiero tekst, ktory cos wymienia i
      zaraz wyjmuje z tego wyjatek. Zarzut Neris o cytowalnosc (t_167) upada.
      CO TO ZAMYKA: (a) dziure sprzatajacych z t_166 - tekst nie siega tam, gdzie nie
      wymienia; (b) Kosciol dostaje kryterium wypowiedziane JEGO wlasnym jezykiem
      (necromancy-law#church_position: profanacja, martwa tkanka), wiec czyta to jako
      wygrana; (c) Varkhen znika z przepisu - poprzedni ksztalt celowal wprost w
      kontrole nad wiekszymi nieumarlymi, nowy go nie wymienia. To nie jest legalizacja,
      to brak przedmiotu - ta sama figura, na ktorej stoi cala obrona Lucana.
      CENA NIEZDJETA: warunek obejmuje CIALO LUDZKIE i PROFANACJE, a robota na
      cmentarzu jest robota na ludzkich zwlokach. Slowa "trywializowanie" i
      "bezczeszczenie" sa nieostre, a nieostrosc jest oslona TEGO, KTO TRZYMA FORUM.
      STATUS: brzmienie ODLOZONE do przyjscia prawnika (t_102) i kaplana (t_113).
      Dokument pozostaje wersja robocza.
  doctrine_of_levels:
    source_event_id: event_turn_interlude_167
    text: |
      Prawo obowiazuje na poziomie, dla ktorego jest pisane - jak prawo zwykle wobec
      wojennego. Ten tekst dotyczy spokoju w badaniach, Kosciola i tego miasta; nie
      dotyczy tych, ktorzy decyduja na poziomie panstwa, i nie dotyczy kogos, kto
      ratuje swiat. CEL POZYTYWNY, pierwszy raz nazwany w Akcie 3: UMOWA SPOLECZNA,
      w ktorej wszyscy sa TROCHE niezadowoleni. To zmienia kryterium oceny dysputy -
      waska wygrana Neris (t_139) przestaje byc kompromisem z koniecznosci i staje sie
      postacia docelowa.
      DRUGA POLOWA: w nauce sie nie klamie, w polityce na tej samej zasadzie nigdy nie
      mowi sie calej prawdy; niespojnosc jest WARUNKIEM stabilnosci ukladu, bo na
      roznych poziomach reguly dzialaja inaczej. Pokrycie w kanonie:
      necromancy-law#information_rule (ten sam czlowiek jest przestepca, ekspertem albo
      zakladnikiem zaleznie od strony; zwycieska interpretacja zalezy od sily i
      koalicji). Przyklad roboczy podany Neris: katedra Kolma to BIOMUTANTY, wiec jego
      wlasna linia torpeduje jego wlasna prace - i to jest brakujaca polowa zagadki
      z t_137b, ktorej cena (rektorat) byla znana od t_140.

  open_problems:
    - 'BRAK KLAUZULI DLA SPRZATAJACYCH - znaleziona przez Neris w t_166, po tym jak Lucan
      ujawnil jej operacyjny cel calej sprawy. Ostry zakaz kontroli nad WIEKSZYMI
      nieumarlymi i bezwarunkowe "nigdy tlum" kryminalizuja dokladnie te robote na
      cmentarzu, ktora jest powodem istnienia tego tekstu: naprawa po amatorskich
      nekromantach wysysajacych ducha pradawnej nekropolii wymaga pracy przy wiekszych
      nieumarlych i przy ich liczbie. Autor zakazu bylby jego pierwszym naruszycielem.
      Kazda klauzula ratunkowa jest przy tym FURTKA, ktorej ktos uzyje - a wyjatek
      "dla uprawnionych" oddaje rozstrzyganie temu, kto rozdaje uprawnienia. Nierozwiazane.'
    - 'ARBITRALNA LICZBA - ROZWIAZANA w t_161. Limit "jeden" przeszedl jako wymog narzucony
      z gory, czyli rzecz CYTOWANA, nie mierzona. Zarzut ojca upadl.'
    - 'INSTRUMENT ZGODY - ROZWIAZANY PROCEDURALNIE w t_161. Napisza go sciagnieci prawnik
      i kaplan; dokument jest wersja robocza. Nazwa instrumentu nadal nieznana.'
    - 'ARBITRALNA LICZBA (historycznie). Ojciec zaatakowal limit "jeden" od razu i ma racje warsztatowo:
      liczba bez pomiaru zaklada wniosek w przeslance (ten sam gatunek pretensji co
      "tendencyjna nazwa", t_158). To najmiekszy punkt tekstu, ktory wrog przeczyta na glos.
      Kolm nie musi go obalac - wystarczy, ze zapyta, kto mierzyl.'
    - 'INSTRUMENT ZGODY NIENAZWANY. Neris nie umie tego napisac - zero slownika prawniczego
      (portrayal.voice.diction), uczy sie go dopiero od Lucana. Nie wiadomo, czy dokument
      zgody antemortem w Lumarii w ogole istnieje, ani jak sie nazywa.'
    - 'RACHUNEK KOLMA NIEROZSTRZYGNIETY. t_140: Kolm potrzebuje przegranej GLOSNEJ, zeby
      dostac rektorat. Ten projekt nie daje mu przegranej, daje mu USTAWE. Nie rozstrzygac
      z gory, w ktora strone to go pchnie.'
  signature_question:
    status: 'ODDANA NERIS, NIEROZSTRZYGNIETA.'
    lucans_position: 'Podpisze sie z radoscia, jesli chodzi o rozproszenie uwagi z niej na
      niego. Nie zalezy mu - wykonywanie jego pracy, granty i wyjazdy sa zamrozone, dopoki
      odmawia ozenku z bogata i wplywowa kobieta; formalnie jest dzis bardziej najemnikiem
      Gildii niz czynnym akademikiem. Spojne z #academy_post.player_correction.'
    disclosure_cost: 'Ujawnil przy tym Neris przyczyne zamrozenia kariery oraz przynaleznosc
      do Gildii. #academy_post.costs przewidywalo, ze ktos siegnie po akta i to znajdzie -
      Lucan podal to sam, dobrowolnie, oszczedzajac jej szukania.'

legalisation_horizon:
  objective_ref: objective_prepare_academy_church_dispute
  source: 'Prognoza gracza. Tura 039 cofnieta (rollback A) - w fikcji Lucan NIE powiedzial
    tego jeszcze Seraphine, wiec nie przypisywac jej tej wiedzy ani jej wnioskow.'
  player_forecast: 'PROGNOZA GRACZA, podana Seraphine wprost: z duzym prawdopodobienstwem w
    ciagu MIESIACA nekromancja moze byc w Lumarii de facto legalna - i to dopiero bedzie
    problem. Podane razem z wlasnym motywem Lucana: nie chce kariery w gildii, wrecz ucieka
    przed jakakolwiek kariera, rozterki moralne go nie interesuja (tak jak przy Orenie), a
    jedyny powod, dla ktorego wciaz jest w gildii, to utrzymanie Varkhena na chodzie, bo
    miasto siedzi na bombie cmentarnej.'
  why_it_is_worse_than_illegality:
    - 'KOSCIOL NIE PRZYJMIE SZAREJ STREFY. Inkwizycji brakowalo nie zamieszek, a PRETEKSTU
      (patrz lucan-leads#lead_contact_pro_corpse_faction). Dopoki spor toczy sie w forach,
      Seraphine ma w nim glos; zanik sciezki formalnej wypycha spor z forow, a poza forami
      jej oslona nie dziala. Precedens gracza to potwierdza - ojca potepiono dwa razy, a
      potem ktos przyszedl do laboratorium osobiscie.'
    - 'USUNIETE JAKO HALUCYNACJA NARRATORA (rollback A, 2026-08-20): lancuch legalne ->
      licencja -> rejestr -> Akademia wystawia licencje. Nie mial zrodla w zadnym pliku.
      Wlasciwy mechanizm stoi w worlds/solmara/lore/necromancy-law.yaml -
      de_facto_liberalisation_mechanism: nikt niczego nie oglasza, po prostu przestaje sie
      rozpatrywac skargi.'
  common_ground: 'Varkhen jest jedynym punktem, w ktorym interesy Lucana i Seraphine sa
    identyczne bez zastrzezen - ona go wyprowadzila i ona trzyma go w piwnicy gildii.
    Zastrzezenie z jej strony: utrzymanie Varkhena wymaga, zeby Lucan byl za dwa tygodnie
    osiagalny, a nie zamkniety albo przydzielony.'

cemetery_loot:
  state_ref: state/resources.yaml#receivable_cemetery_loot_sale
  text: 'Gracz zadeklarował kierunek na jutro/pojutrze, nie na dziś. Wymaga dyskretnego kupca
    - łup jest zbyt duży i zbyt oczywistego pochodzenia dla rzeczoznawcy gildii. Utrudnione
    przez kontrolę na wjazdach na targ i świeże obwieszczenie o zezwoleniach na transport
    szczątków (event_turn_interlude_013_market_food_run): 60 kg to dokładnie "cięższy
    ładunek", a każda formalna trasa zostawia wpis w rejestrze.'
  appointment_source: 'Gracz doprecyzował w nawiasie, że ustawił spotkanie z Borosem i Marą
    podczas rozmowy w gildii (turn_interlude_011/012); narrator nie podał wcześniej żadnego
    terminu, więc to uzupełnienie niesprecyzowanego szczegółu, nie retcon.'

act_02_rewards:
  objective_ref: objective_prepare_guild_hearing_and_watch
  step_ref: resolve_act_02_reward
  hearing_date_knowledge:
    source_event_id: event_turn_interlude_024_seraphine_date_and_payments
    text: 'Lucan ZNA horyzont od Seraphine: około dwóch tygodni, dzień w tę czy w tę, jeszcze
      nie ogłoszone oficjalnie. Zna więc horyzont, nie zna sztywnej daty. Wcześniej daty nie
      podała recepcjonistka (event_turn_interlude_012) ani nocny urzędnik
      (event_turn_interlude_023).'
  reward_is_hostage: 'Seraphine dopilnowała, żeby w rejestrze stało "oczekuje przeglądu", a nie
    "zamknięte". Nagroda została wstrzymana do ZAKOŃCZENIA wewnętrznego śledztwa gildii i
    działa jednocześnie jako kij i marchewka. Nie ma ustalenia, że musi zostać rozliczona
    podczas jednej konkretnej sesji ani że zależy wyłącznie od występu Lucana na przesłuchaniu
    (retcon_000062).'
  why_no_date_announced: 'Służby miejskie żądają przekazania ciał, akt i dowodów z operacji
    cmentarnej, gildia się opiera, a dopóki nie jest jasne, kto trzyma materiał, nikt nie
    wyznacza terminu - bo termin oznacza przyznanie, kto prowadzi sprawę.'
  standing_stipend: 'Standardowe stypendium polowe (15 srebra) wypłacone przy recepcji
    (event_turn_interlude_012_reception_desk). Pełna nagroda za rozwiązanie kryzysu
    cmentarnego oznaczona jako oczekująca na przegląd kierownictwa. Zostanie odblokowana
    albo inaczej rozliczona dopiero po zamknięciu śledztwa wewnętrznego.'

clocks_rationale:
  father_arranges_academy_showing:
    clock_ref: clock_father_arranges_academy_showing
    origin: 'Zegar powstał z wyboru gracza, nie z nacisku świata. Lucan zobowiązał się wobec
      ojca do dostarczenia przynajmniej jednego okazu na dyskusję. Dodatkowy zapas do
      demonstracji i sekcji jest planem, którego liczby nie ustalono. Ojciec zaczął działać
      we własnym tempie, ponieważ uważa, że dobra praca ma być widziana.'
    reschedules: 'Przestawiony 3 -> 8 (event_turn_interlude_021), potem 8 -> 15
      (event_turn_interlude_022). Lucan użył własnego argumentu ojca: jeden okaz to anekdota,
      seria to materiał, a serii nie zrobi się w trzy dni. Materiał dochodzi za 7 dni, a praca
      zaczyna się PO nim, więc piętnaście jest spójne z fikcją, nie uznaniowe.'
    reclassified_as_seminar:
      source_event_id: event_turn_interlude_030_the_seminar_problem
      text: 'To, co nadchodzi, nie jest życzliwym pokazem. Ojciec nie organizuje osobnego
        pokazu - wepchnie okazy syna do JUŻ WYZNACZONEJ otwartej dysputy (za ok. 16 dni,
        referuje npc_neris_aldhen, oponuje npc_ivar_kolm). A Lucan, który był częścią tego
        świata, wskazał, w co takie mówienie się zamienia: wezwanie na SEMINARIUM, nie na
        przesłuchanie. Nie uznają odmowy. Efekt jest gorszy niż trybunał, bo seminarium
        ZAPISUJE. Gildia nie ma nad tym jurysdykcji.'
  guild_leadership_hearing:
    clock_ref: clock_guild_leadership_hearing
    origin: 'Termin ustalony wspólnie z graczem - recepcjonistka nie podała daty
      (event_turn_interlude_012), a gracz potrzebuje około dwóch tygodni interludium na
      trening i pozostałe sprawy. Piętnaście dni domyka to jawnie, zamiast trzymać wezwanie
      jako nieokreśloną grozę. Zbieżność z clock_father_arranges_academy_showing (15) i z
      dysputą (16) jest zamierzona przez gracza: jeśli postępowanie i dysputa wypadną w jednym
      tygodniu, akademicy mają własny interes w tym, żeby Lucan nie siedział w areszcie.'

cemetery_loot_routes:
  state_ref: state/resources.yaml#receivable_cemetery_loot_sale
  source_event_id: event_turn_interlude_101
  two_categories: |
    Boros przeliczyl i posortowal 60 kg. DWIE TRZECIE SA ANONIMOWE - kruszec luzem, moneta,
    wylamane oprawy, drut, blacha trumienna; nie ma na tym niczego, co cokolwiek mowi.
    JEDNA TRZECIA JEST DOKUMENTEM - pierscienie zaloby z nazwiskiem i data rytymi po
    wewnetrznej stronie, medaliony mortualne ze znakami rodow, kilka sztuk z robota
    konsekracyjna. Duplikaty takich zapisow leza po stronie parafii i rodu. Wartosc rytej
    trzeciej jest wielokrotnie wyzsza WLASNIE dlatego, ze jest robota - i dokladnie dlatego
    nie da sie jej sprzedac nikomu, kto nie wywiezie jej z miasta.
  route_a_boros_melt: |
    Zlotnik z piecem w zapleczu targu, uzywany przez Borosa wczesniej. Bierze anonimowe dwie
    trzecie NA WAGE i przetapia tej samej nocy. Bez rejestru, bez wjazdu, bez trasy, bez
    nowego czlowieka, ktory zapamietuje nazwiska. CENA: okolo jednej trzeciej wartosci
    obrobkowej, ryta trzecia zostaje w worku na nieokreslony czas, i ZADEN prawnik z tego
    nie wychodzi.
  route_b_mara_circuit: |
    Operacja, ktora wchlonie calosc (ryta trzecia wlacznie) i wyprowadzi ja z Lumarii
    kanalami nietykajacymi zapory. Placi realna liczbe. CENA POTROJNA, wylozona przez Mare
    bez owijania: (a) beda WIEDZIELI, co przyszlo i skad, bo inaczej tego nie kupuja;
    (b) prowadza zapis, bo zapis jest ich ubezpieczeniem, nie zaniedbaniem; (c) wejscie idzie
    przez ICH prawnika - tego samego, o ktorego Lucan prosil.
  decision_taken: 'CALY LUP DO SYNDYKATU (event_turn_interlude_102) - droga B, ryta trzecia wlacznie. Przetop odrzucony jako trzy tygodnie nocy przy piecu, jedna trzecia ceny i worek identyfikowalnej roboty lezacy dalej pod czyjas podloga. Uzasadnienie gracza: zorganizowana przestepczosc jest bezpieczniejsza od przypadkowej slamazarnosci.'
  boros_custody_pressure: |
    Boros trzyma grobowy towar pod podloga jako czlonek gildii rangi C w tygodniu, w ktorym
    magistrat porzadkuje akta. Nie odmawia i nie podnosi ceny - prosi o TERMIN, nie o
    zapewnienie. Relikwiarz pozostaje wylaczony ze sprzedazy i jest u Lucana.

criminal_circuit_lawyer:
  objective_ref: objective_prepare_guild_hearing_and_watch
  step_ref: meet_criminal_circuit_lawyer
  decision_taken: "PRZYJETY W PAKIECIE (event_turn_interlude_102) - Lucan wybral cala droge syndykatu, wiec prawnik staje sie dostepny od wejscia do pokoju. Konflikt lojalnosci pozostaje nierozwiazany, a wybor miedzy obrona karna i klasyfikacyjna nadal niepodjety."
  source_event_id: event_turn_interlude_101
  text: |
    Prawnik NIE jest dostepny osobno - jest czescia drogi Mary, bo operacja, ktora moze
    wchlonac 60 kg grobowego towaru, ma czlowieka trzymajacego ja poza sadem. Jeden czlowiek,
    dwa problemy, jedna transakcja. HACZYK, ktory nie jest haczykiem Mary: ten prawnik ma
    stalego klienta i to nie jest Lucan. Lucan wchodzi jako klient przyprowadzony przez
    strone, ktora go sprawdzila, do czlowieka, ktorego pierwsza lojalnosc jest gdzie indziej.
    Zgodne z uwaga Seraphine (two_contradictory_defences): prawnik z ulicy zna urzednikow
    magistratu, a nie Akademie, wiec obsluguje obrone KARNA - a Lucan nie wybral jeszcze,
    ktora linia jest glowna.

physical_training_with_mara:
  objective_ref: objective_develop_lucan
  step_ref: daily_training_with_mara
  source_event_id: event_turn_interlude_101
  what_two_weeks_give: |
    Mara nie obiecuje sily i mowi wprost, ze dwa tygodnie nie robia nikogo silnym. Daja trzy
    rzeczy: oddech (zeby nie byc skonczonym po dziesieciu sekundach), upadanie bez lamania
    sie, oraz wychodzenie z linii - nieobecnosc tam, gdzie pada pierwszy cios. Jej wlasna
    obserwacja z garbarni i z komory Varkhena: Lucana nikt nie przegral w walce, jego problem
    jest ten, ze wszystko, co robi, wymaga stania w miejscu i uwagi. Trening kupuje SEKUNDY,
    nie wygrywa wymiany.
  cost: |
    Godzina dziennie, rano, przez wiekszosc dni - inaczej to dekoracja. Trzynascie dni jest
    juz obsadzone (wabiki, jedna kanoniczna wersja opowiesci, prawnik, zbyt zlota, trzy
    pieczecie). CENA NIEWYMIENIONA PRZEZ MARE: godzina dziennie z bliska przez dwa tygodnie
    z osoba, ktora widziala Varkhena slabnacego pod dotykiem Lucana i trzyma dwa podejrzenia
    o sredniej pewnosci. Zobaczy, ile Lucan spi, jak oddycha po wysilku i co nosi pod
    plaszczem.

magistrate_records_channel:
  objective_ref: objective_interlude_investigations
  step_ref: investigate_rusk_and_magistracy_channel
  source_event_id: event_turn_interlude_101
  text: |
    Lucan zdecydowal, ze Corth nie jest sprawa Borosa i Mary, i wykonal to czysto - nie padlo
    ani nazwisko Cortha, ani odpis kanalow Ruska. Corth zdecydowal inaczej dwa dni wczesniej:
    rozeslal do nazwisk z obsady garbarni pisma o potwierdzenie dat i skladu grupy. Mara ma
    jedno takie pismo, nie zna nazwiska urzednika, uwaza je za nudne i ZAMIERZA ODPOWIEDZIEC,
    bo nieodpowiedzenie urzednikowi akt jest sposobem na stanie sie interesujacym. Zapytala
    Lucana lagodnie, czy jest wersja tych dat, ktora by mu bardziej pasowala.
  consequence: |
    Decyzja o zatrzymaniu Cortha dla siebie ma termin waznosci liczony w DNIACH, nie
    tygodniach. Lucan ma proponowana wspolprace swiadka, o ktora nie prosil: przyjecie daje
    spojnosc zeznan i wymaga wtajemniczenia Mary, odrzucenie zostawia ja przy prawdzie,
    ktorej Lucan nie zna w jej wersji. Zasada nadrzedna: JEDNA wersja opowiesci na wszystkie
    fora - rozjazd zabija szybciej niz tresc.

  decision_taken: |
    PRAWDA, BEZ UZGADNIANIA (event_turn_interlude_102). Lucan kazal Marze napisac dokladne
    daty i nie pytac go o wersje, bo nikt nic na niego nie ma, oraz dolozyl fakt, ktorego
    Mara nie miala: Halven Rusk byl w garbarni, to jego odciagano od szczuroogra
    (milestone_021_rusk_rescued). Mechanizm, ktory Mara nazwala: urzednik akt nie porownuje
    zeznania z rzeczywistoscia, bo nie ma do niej dostepu - porownuje zeznania ZE SOBA, wiec
    uzgodniona wersja jest ryzykiem rosnacym z liczba osob na obsadzie, a prawda nie ma tego
    problemu w ogole.
  rusk_as_witness: |
    KORZYSC: dopisanie Ruska zmienia kategorie wpisu z "czterech czlonkow gildii w cudzej
    garbarni" na "wypadek inspektora zagrozen podziemnych z asysta gildii" - kategoria z
    wlasnym formularzem i precedensem. Rubryka, ktora sie zgadza, nie generuje pytania.
    CENA: Rusk jest swiadkiem niezyczliwym - suspicion_lucan_sabotaged_escape (srednia
    pewnosc), agenda avoid_being_used_as_lucan_cover. Wpisanie go kladzie go celowo na tej
    samej stronie co Lucana.
    GRANICA KLATWY - NIE PRZESADZAC: effect_rusk_cursed_pen_usypianie uruchamia sie, gdy Rusk
    PISZE TYM PIOREM. Wezwany moze zeznac ustnie i ktos to spisze. Klatwa odjela Ruskowi
    zdolnosc dosypywania papieru z WLASNEJ INICJATYWY (jego jedyna dzwignia: wolumen raportow
    i sprzeciwow), a wroga wersja potrzebuje wlasnie inicjatywy. Druga strona medalu: urzednik
    miejski, ktory nie oddaje zeznania na pismie, generuje u Cortha OTWARTA RUBRYKE przy
    nazwisku Lucana na trzynascie dni, a urzednik, ktory przestaje produkowac raporty, w koncu
    zostaje zastapiony - a nastepca zaczyna od zera, bez zmeczenia Corthem i bez piora.

syndicate_access:
  obligation_ref: obligation_define_syndicate_exchange_beyond_gold
  source_event_id: event_turn_interlude_103
  what_changed: |
    Lucan sam, przed wejsciem, powiedzial Marze, ze nie idzie po jednorazowa transakcje, a po
    WSPOLPRACE: dostep do ich rynku i do ich prawnikow. To honoruje jej prosbe o uprzedzenie i
    jednoczesnie przestawia cala stawke. Poreczenie za sprzedawce zlota konczy sie razem z
    workiem; poreczenie za przyszlego klienta aparatu nie ma daty konca, a w pokoju wyceniany
    bedzie CZLOWIEK, nie towar.
  the_question: |
    Dostepu sie nie dostaje - dostep sie WYMIENIA. Pytanie "co masz poza zlotem" padnie
    pierwsze, przed jakakolwiek kwota. Mara nie odpowiada za Lucana i nie zgaduje na glos na
    targu; mowi tylko, ze ludzie zyjacy z kupowania i sprzedawania placa za MOZLIWOSCI, a ona
    widziala go przy robocie, ktorej nikt inny w grupie nie umial zrobic. Kandydaci na stole
    (nierozstrzygniete): okazy, wiedza, Varkhen, nazwisko Veyr. Kazdy z nich ma inna cene
    ujawnienia przy Marze, ktora za niego reczy.
  route_note: |
    Transport rozwiazal sie sam - zawodowcy wyznaczaja pokoje osiagalne bez punktu
    kontrolnego, wiec kontrola na wjazdach i obwieszczenie o szczatkach nie dotykaja trasy.
    Cena: ostatni odcinek biegnie po ICH terenie. Boros donosi towar do progu i konczy - nie
    wchodzi, nie widzi placacego, udzial bierze z reki Lucana.

    martwy i chodzi. Trzy takie okazy sa poza kontrola.

syndicate_room:
  obligation_ref: obligation_define_syndicate_exchange_beyond_gold
  source_event_id: event_turn_interlude_104
  who_is_in_the_room: |
    npc_ilva_rennat prowadzi pokoj i wycenia CZLOWIEKA - liczbe za towar zostawia na koniec,
    bo obie strony znaja ja z grubsza. npc_rovan_kesz to prawnik z pakietu; przy pierwszym
    kontakcie sam powiedzial, ze jest prawnikiem POKOJU, nie Lucana, i to pokoj decyduje,
    czego moze sie o Lucanie dowiedziec. Wagowy przy stole jest rzemieslnikiem bez karty i
    nie odzywa sie ani razu. Mara siedzi obok, rozbrojona przy wejsciu, i reczy.
  what_the_entry_cost: |
    Towar przeszedl w ich rece NA PROGU, przed jakakolwiek liczba - to byla zapowiedziana
    cena ostatniego odcinka i jest nie do cofniecia. Rewizja Lucana byla o jedno slowo:
    odzwierny siegnal do plaszcza, Kesz zatrzymal go zdaniem "Gosc Teln". Spidey i
    spy_beetle_01 sa nietkniete WYLACZNIE dzieki poreczeniu Mary.
  what_they_already_know: |
    Wiedza, czyj to towar i z jakiej operacji (event_turn_interlude_102). Ilva pokazala tez,
    ze wie o pismach urzednika akt do obsady garbarni - maja ludzi w kancelarii magistratu od
    zawsze. Sledza wiec te sama nitke co Corth, z drugiej strony i z wieksza wiedza niz Lucan.
    Nie uzywa tego jako grozby, tylko jako cennika: klient z otwarta rubryka przy nazwisku
    jest drozszy w obsludze.
  the_question_as_asked: |
    "Dostep kosztuje. Nie srebrem - srebro macie wy, my mamy go wiecej. Co pan ma, czego my
    nie mamy i czego nie kupimy gdzie indziej?" Warunek: odpowiedz W TYM POKOJU, dzis, nie
    obietnica namyslu - bo kto potrzebuje tygodnia na wymyslenie, co ma do zaoferowania, nie
    ma nic. Kandydaci nierozstrzygniete: okazy, wiedza, Varkhen, nazwisko Veyr. Nowy czynnik
    przy wycenie kazdego z nich: Kesz slucha jako prawnik pokoju, wiec nie ma tajemnicy
    zawodowej, a Mara slyszy wszystko i za to reczy.


lucans_legal_doctrine_and_the_syndicate_pitch:
  objective_ref: objective_prepare_academy_church_dispute
  source_event_id: event_turn_interlude_108
  the_doctrine: |
    Nie ma sprawy, bo nie ma nekromanty - jest akademik budujacy golemy z ciala. Gdyby ktos
    jednak uznal to za sily nieczyste, NIE ISTNIEJA KATEGORIE PRAWNE DOTYCZACE ZWIERZAT.
    Konsekwencja przyjeta przez Lucana jako wlasne ograniczenie: NIE TYKA LUDZKICH ZWLOK -
    i to jest tez powod, dla ktorego odmowil dostaw cial od syndykatu.
    Pokrycie: necromancy-law.yaml#animal_and_vermin_modification, #construct_boundary.
    Skutek: obrona karna i klasyfikacyjna przestaja sobie przeczyc.
  the_one_seam: |
    Kosciol nie uznaje szarej strefy zwierzecej doktrynalnie
    (church_position.animal_gray_zone_recognized_doctrinally: false). Doktryna jest szczelna
    wobec forum swieckiego i bezwartosciowa wobec kaplana. Drugie ostrzezenie Kesza, identyczne
    z uwaga Seraphine, tylko z drugiej strony barykady: gdy sciezka formalna cichnie, srodek
    zaradczy zmienia rece z papieru na LUDZI - a jego klienci sa tymi rekami.
  the_pitch_to_the_principal: |
    Lucan nie sprzedal syndykatowi towaru ani uslugi, tylko WIEDZE WYPRZEDZAJACA: rownolegle do
    sledztwa gildii ta sama kwestia lezy u akademikow (otwarta dysputa za ok. 16 dni,
    npc_neris_aldhen kontra npc_ivar_kolm), a okazy, na ktorych dysputa bedzie orzekac,
    dostarcza Lucan. Mechanizm zmiany prawa jest w plikach i Lucan go zna: nikt nie oglasza
    legalnosci, tylko przestaje sie rozpatrywac skargi
    (necromancy-law.yaml#de_facto_liberalisation_mechanism, precedens: ludzka transmutacja).
    Kto wie o tym wczesniej, kupuje tanio to, co przestanie byc kontrabanda.
  what_it_bought: |
    Pryncypal (npc_syndicate_weigher) nie zazadal dowodu - zapytal o DATE i o INWENTARZ: co ma
    zaczac kupowac teraz, zeby wtedy juz to miec. To jest dostep, po ktory Lucan przyszedl, ale
    POWIERZONY, nie udzielony - czyli zobowiazanie w druga strone.
  what_the_room_still_does_not_know: |
    Spidey, Varkhen, nazwisko Veyr. Utrzymywanie bardzo starego nieumarlego jest jedynym
    faktem, ktory rozbija cala doktryne o zwierzetach w jedno popoludnie.

unassigned_servants_housekeeping:
  objective_ref: objective_prepare_companions_and_specimens
  step_ref: recall_or_assign_unassigned_servants
  source_event_id: retcon_000031
  supersedes: unassigned_servants_risk (event_turn_interlude_103, uchylone)
  inventory: |
    Wyrywkowy przeglad sieci w turze 103 (piec wezlow, uwaga seryjna, ok. 2 min na wezel wg
    event_turn_interlude_086) pokazal trzy slugi bez rozkazu: spy_centipede_02 (kanaly,
    released_unsupervised_no_standing_order), spy_beetle_05 (ulice i odpadki wokol baszty,
    dispersed_solo_no_order), spy_moth_01 (laka, released_no_orders_maturing).
  correction: |
    TO NIE JEST RYZYKO DOWODOWE (retcon_000031) - narrator to zawyzyl. Niezakotwiczony okaz
    odzyskany przez kogokolwiek jest martwym owadem; do stwierdzenia "martwy i chodzi"
    potrzebna byla sekcja, a na sekcji nie ma czego znalezc, bo Lucan konczy sluge decyzja i
    odzyskanie nastepuje na zwykej zwloce. Death_Anchor nie jest wiedza powszechna - sekcja
    ujawnia go wylacznie komus pismiennemu nekromantycznie albo akademicko, a znalazca,
    sprzataczka, straznik czy urzednik nie rozpozna nazwanej techniki i nie ma powodu jej
    szukac.
  real_costs: |
    (a) Marnuja material i uwage - nie robia nic pozytecznego.
    (b) Okaz W RUCHU obserwowany przez uwazna osobe ok. pol minuty daje PODEJRZENIE, nie
    dowod (event_turn_interlude_099), a przeciwdzialaniem jest stala mozliwosc zakonczenia go
    na odleglosc.
    (c) Realna ekspozycja dotyczy wylacznie okazow ZAKOTWICZONYCH i wylacznie w rekach kogos
    pismiennego magicznie - i wymaga JEDNOCZESNIE odzyskania okazu ORAZ sekcji wykonanej przez
    kompetentnego czytelnika.


cemetery_syndicate_arrangement:
  obligation_refs:
    - obligation_name_advance_warning_channel_for_syndicate
    - obligation_define_syndicate_exchange_beyond_gold
  source_event_ids: [event_turn_interlude_109, event_turn_interlude_110, event_turn_interlude_120, event_turn_interlude_121]
  what_lucan_bought: |
    Sygnal zamiast terminu - Lucan mowi, kiedy bedzie dym. Pustka wokol cmentarza na czas
    prob gildii wobec wszystkich, ktorych syndykat zna (a zna wiekszosc): zbieraczy,
    ciekawskich, cudzych ludzi i komorek probujacych przejac pusta linie. Wsparcie rzeczowe:
    ludzie do noszenia i pilnowania, wozy, kwatera poza murami, materialy poza kolejnoscia.
    Nie wchodza na teren, nie chca wiedziec, co tam jest, nie biora odpowiedzialnosci za
    wynik. Pryncypal kupuje CZAS I PUSTKE, nie wspolne przedsiewziecie.
  the_price_named: |
    Ostrzezenie z WYPRZEDZENIEM - nazwisko i sposob, w jaki syndykat dostanie sygnal, ze ma
    zamykac. Sygnal wart mniej niz doba jest wart zero. Nadal nienazwany.
  the_open_seam_on_the_watch: |
    NIEROZSTRZYGNIETE I ISTOTNE. Lucan relacjonuje uklad tak, jakby obejmowal odsuniecie
    STRAZY z okolic terenu. W zapisie pokoju to nie pada: pustka byla zadeklarowana wobec
    polswiatka, a o strazy ta sama organizacja powiedziala w tej samej rozmowie, ze z
    klientem w mundurze SIE NIE KONKURUJE (event_turn_interlude_100). Do rozstrzygniecia
    przez gracza: czy padlo z ich ust, czy jest domyslem Lucana. Obie odpowiedzi sa duze -
    brak obietnicy oznacza dziure w obwodnicy dokladnie tam, gdzie syndykat nie pomoze;
    obietnica oznacza, ze syndykat deklaruje ruch przeciw instytucji prowadzacej linie,
    czyli zapowiedz przejecia.
  seraphines_reading_of_the_motive: |
    Syndykat nie robi uprzejmosci - kupuje PRZYSZLOSC terenu. Pryncypal sam powiedzial, ze
    pusta linia sciagnie kogos w ciagu tygodni, ze ktokolwiek ja wezmie, bedzie potrzebowal
    cmentarza, i ze on tego dlugo nie zatrzyma. Wiec chce, zeby w dniu otwarcia niszy
    cmentarz byl juz oczyszczony CUDZYMI ludzmi, bezpieczny i otoczony osobami z dlugiem u
    niego. "Na razie nie sa zainteresowani handlem" czytac jako DATE, nie usposobienie.
    Koszt dla gildii: pali ludzi i zasoby na oczyszczenie terenu, ktorego wartosc zainkasuje
    ten, kto na niego nie wszedl.
  contamination_risk: |
    Proby gildii odbeda sie w pustce kupionej od organizacji przestepczej. Dopoki nikt tego
    nie wie, jest to przewaga. Z chwila ujawnienia operacja zostaje skazona WSTECZ: kazdy
    czlonek gildii, ktory tam pracowal, staje sie czlowiekiem pracujacym pod oslona
    syndykatu, a Seraphine oficerem, ktory to dopuscil. Zbiega sie to z warunkiem Borosa -
    jedna wspolna wersja przed pierwszym butem na cmentarzu (event_turn_interlude_116).
  seraphines_two_conditions: |
    (1) Chce KSZTALTU, nie nazwisk: musi znac, czego spodziewac sie w terenie (obcy ludzie,
    wozy, kwatera, materialy), bo odpowiada za obwodnice operacji; nie chce nazwisk, adresu
    pokoju, twarzy ani tresci umowy, bo rano staje przed sluzbami miejskimi. Powtorzenie
    doktryny z glejtu: wiedza jest droga, posiadanie dyskwalifikujace
    (event_turn_interlude_036).
    (2) Zanim padnie data prob, chce ustalic WLASNA wersje na protokol - nie wersje Lucana,
    tylko zdanie prawdziwe i niepelne, bo tylko takie wytrzymuje urzednika.
  method_for_further_disclosure: |
    Seraphine odmawia dalszego wybierania w ciemno (Lucan dwa razy kazal jej wybrac wlasna
    niewiedze, co czyni ja wspolwinna wszystkiego, o co nie zapytala). Nowa metoda: Lucan
    wymienia nitki po JEDNEJ LINII kazda - czym to jest i co sciaga na nia, jesli ona to wie
    - a ona wskazuje, ktore otwiera. Nazwiska dopiero po wskazaniu.
source_refs:
  - campaigns/lucan/state/objectives.yaml
  - campaigns/lucan/state/clocks.yaml
  - campaigns/lucan/journal/imports/luka-e-act-03-interlude-day1-night.md

lucans_declared_line_2026_09_01:
  source: player_declaration_bracket_2026_09_01
  status: SAID_ALOUD_TO_NPC_SERAPHINE_VALE_IN_EVENT_TURN_INTERLUDE_190
  the_line: >-
    LUCAN NIE ZAMIERZA SIE BRONIC. Jego wlasny odczyt: nie ma za co go skazac w pierwszej
    kolejnosci - cial nie ma, dowodow nie ma, reszta jest prawnie nijaka, a on ma plecy
    (zgodne z seraphine-vale.yaml#portrayal.lucans_own_reading_to_respect). Jest
    praworzadnym obywatelem i tak sie ustawia. Zamiast obrony zamierza WYGRAC:
    szantazem, wymuszeniem i otwarta grozba anihilacji miasta.
  what_this_resolves: >-
    To jest odpowiedz na two_contradictory_defences - Lucan ODMAWIA OBU. Ani obrona karna
    (prawnik z obiegu przestepczego), ani klasyfikacyjna (Akademia, szeroka definicja) nie
    jest wybierana jako linia; obie zostaja jako narzedzia. Domyka to takze obserwacje
    Seraphine z t_122, ze na liscie siedmiu pozycji ANI JEDNA nie jest obrona - to nie byl
    brak, to byl caly plan.
  what_it_does_not_yet_resolve: >-
    Zadanie Seraphine o KOLEJNOSC (ktore trzy z siedmiu ruszasz najpierw) NADAL nie ma
    odpowiedzi. Sama linia zostala jej powiedziana w t_190 i nie musi juz zgadywac, ze
    Lucan nie szuka obrony - ale kolejnosci nie dostala.
  narrator_note: >-
    NIE grac tego jako szalenstwa ani jako blefu do ukarania. Nie dopisywac swiatu reakcji,
    ktorej zaden plik nie stawia. Prawdziwe ograniczenia tej kampanii sa instytucjonalne
    i informacyjne (retcon_000015) - grozba jest dzwignia jak kazda inna i mierzy sie ja
    tym, komu i jak zostanie podana.

syndicate_warning_channel:
  source_event_ids: [event_turn_interlude_113, event_turn_interlude_200, event_turn_interlude_201]
  obligation_ref: campaigns/lucan/state/obligations.yaml#obligation_name_advance_warning_channel_for_syndicate
  what_was_ordered: >-
    t_113, slowami pryncypala: ostrzezenie przychodzace tego samego dnia co klopot nie jest
    ostrzezeniem, tylko wiadomoscia. Kupuje WYPRZEDZENIE warte co najmniej dobe, typu
    "zamykajcie". Terminu nie zazadal i o nazwisko sie nie targowal.
  what_was_delivered: >-
    t_200. spy_cellar_spider_06, przedstawiony jako "Toby", oddany na stale i postawiony
    w skrzynce na dolnej polce w pokoju syndykatu (loc_lumaria_market#zone_market_back_alleys).
    Sterowany zdalnie przez Lucana. Sygnalem jest przejscie na kolejny talerzyk.
    DLACZEGO TO DZIALA, Z PLIKOW SIECI: alarm czytany OKIEM nie zuzywa uwagi w ogole
    (companions/webber-network.yaml#network_cost_model.attention_is_serial, wniosek nr 2);
    uwaga Lucana jest seryjna i kosztuje ~15 s na wezel, ale Toby nie jest przegladany -
    tylko wyzwalany. Sygnal jednobitowy nie odczuwa straty wiernosci, a Toby jest
    not_anchored_by_choice, wiec ma strate na odleglosc, nie brak sterowania
    (retcon_000049 - kotwica to antena, nie warunek kontroli). Utrzymanie 0, autonomous_hunting.
    Terrarium/wlasny kat przyznane, bo okaz ma flagi destroyed_by_a_broom oraz
    silhouette_ignored_by_everyone.
    NIE JEST PODSLUCHEM: near_blind_vibration_and_air_sensing_only, a
    ability_eavesdropping_through_threads ma current: false.
  phases:
    source_event_id: event_turn_interlude_202
    supersedes: event_turn_interlude_201
    source: player_declaration
    note: >-
      PRZEDEFINIOWANE SZESC MINUT PO PIERWSZEJ WERSJI, przy tym samym stole. Nie jest to
      retcon - Lucan poprawil wlasna oferte na biezaco. Kluczowa roznica: talerzyk 3
      przestal znaczyc "kordon" i znaczy "powolano grupe"; kordon zszedl do przedzialu
      MIEDZY 3 a 4. Caly harmonogram przesunal sie o krok wczesniej.
    "1": TERAZ, stan sprzed wszystkiego. Bez doklejonej instrukcji (retcon_000127).
    "2": >-
      Odbylo sie JEDNO I DRUGIE: przesluchanie Lucana oraz konferencja akademikow o prawnej
      naturze nekromancji. Wszyscy wiedza, co sie dzieje, ale sa zbyt zajeci polityka, zeby
      sie tym przejac.
    "3": Koniec burzy politycznej i oficjalne utworzenie grupy, ktora ma sie zajac problemem.
    "4": >-
      WEJSCIE - i jednoczesnie TERMIN, nie ostrzezenie (retcon_000127). Moment wejscia jest
      momentem, do ktorego pryncypala ma juz nie byc w miescie. Czwarty talerzyk nie ostrzega;
      konczy odliczanie.
    lucans_estimates: >-
      Faza 2 trwa NAJWYZEJ PARE DNI. Od fazy 3 do kordonu MAKSYMALNIE DZIEN, DWA.
      TO SA SZACUNKI LUCANA PODANE KONTRAHENTOWI, NIE ZEGARY. Zadnego wpisu w
      state/clocks.yaml z nich nie ma i fazy wyzwala RECZNIE Lucan, nie uplyw czasu.
    anchored_to_existing_clocks: >-
      Faza 2 wisi na dwoch zegarach, ktore juz istnialy i ktorych ta tura NIE RUSZA:
      clock_guild_leadership_hearing 3/15 oraz clock_father_arranges_academy_showing 3/15
      (effect: ok. 16 dni, npc_neris_aldhen kontra npc_ivar_kolm). Do tego
      current_scope#entry_rule - pierwsze z dwoch przesluchan rozpoczyna Akt 3. Uwaga Lucana,
      ze "dziwnym trafem obie w podobnym czasie", jest zgodna z plikami: obie na tym samym
      oczku. Zbiega sie to z jego zapowiedzia z t_105b (wojna domowa w dwa tygodnie).
    naming_caveat: >-
      "Konferencja akademikow o prawnej naturze nekromancji" to SFORMULOWANIE LUCANA podane
      paserowi, nie tytul wydarzenia. W plikach jest otwarta dysputa Akademia-Kosciol
      w formie seminarium. Nie ustanawiac tematu dysputy z tego zdania (retcon_000120).
  which_saucer_is_the_product:
    source_event_ids: [event_turn_interlude_201, event_turn_interlude_202]
    first_reading_by_the_principal: >-
      t_201: fazy 3 i 4 sa jako ostrzezenia bezuzyteczne, bo przy kordonie nie ma juz czego
      wywozic. Doba, o ktora prosil w t_113, mieszkala wedlug niego w FAZIE 2.
    lucans_correction: >-
      t_202, w brzmieniu poprawionym przez retcon_000127: pryncypal chce wiedziec o
      PIERWSZYM wlasnie dlatego, ze koncem drabinki nie jest "przewiez towar", tylko
      "ciebie ma tu nie byc" - a na to potrzeba calego biegu 1-2-3, nie ostatniego sygnalu.
      Wczesniejsze talerzyki sa pasem startowym do czwartego. Pryncypal to przyjmuje i nie
      jest to dla niego nowa mysl, tylko pierwszy raz powiedziana przy nim na glos: w t_109
      sam stwierdzil, ze jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan
      (fact_weigher_has_a_stake_in_lucan_surviving).
      JEGO UWAGA Z t_201 CZYTA SIE TERAZ INACZEJ I CELNIEJ: powiedzial, ze czwarty talerzyk
      to "wiadomosc, ze mialem racje tydzien temu". Czwarty nie jest zla wiadomoscia - jest
      ostatnia.
    what_he_can_and_cannot_move: >-
      Polowe ewakuacji ma zrobiona projektowo od t_109 - zapas NIE lezy w miescie, stoi poza
      Lumaria i wchodzi na zamowienie. Wywiezc nie da sie dwoch rzeczy: pokoju za straganami
      oraz tego, ze nikt go nie zna. Czlowiek, ktory wyjezdza i wraca, jest zapamietywany
      dwa razy, a cala jego metoda to nie zostac zapamietanym ani raz (agenda#stay_unnamed).
    open_question: >-
      NIEODPOWIEDZIANE, i po retcon_000127 jeszcze bardziej na miejscu, bo dotyczy wprost
      tego, co znaczy czwarty talerzyk. Pryncypal nie zapytal, CZYM jest rzecz pod cmentarzem -
      zapytal, JAK DALEKO ma sie usunac. Pytanie logistyczne, wiec nie lamie jego wlasnej
      zasady "powodu nie kupuje". Lucan nie odpowiedzial i narrator odpowiedzi nie zmysla.
  what_is_not_revealed: >-
    Wszystkie cztery fazy opisuja REAKCJE INSTYTUCJI, nie przyczyne. Lucan nie powiedzial,
    co jest pod cmentarzem, po co mialby tam wejsc oddzial ani czego szuka - ta sama
    dyscyplina co w t_110 i t_194. forbidden_without_source obu obecnych nienaruszone:
    varkhen_existence, seals_and_lower_gate (pryncypal), spidey_existence, lucan_necromancy.
    Dla pryncypala to nie jest nowa kategoria, tylko harmonogram do
    fact_weigher_knows_a_bigger_cemetery_problem_exists (t_110).

oral_only_disclosure_channel:
  objective_ref: objective_prepare_guild_hearing_and_watch
  source_event_id: event_turn_interlude_233
  status: PRZYJETY_PRZEZ_SERAPHINE_WARUNKOWO_NA_KOLEJNOSCI
  the_players_argument: |
    Varkhena nie da sie ani stracic, ani wpisac. Stracic - bo jest jedynym bieglym od
    pieczeci, czyli od jedynej rzeczy mogacej rozerwac miasto. Wpisac - bo publiczny
    zapis o kontrolowanym nieumarlym w piwnicy gildii czyni gildie zapalnikiem.
    Zostaje kategoria trzecia: rzecz przekazywana WYLACZNIE USTNIE wyzszemu dowodztwu,
    o ktorej potem obie strony zgodnie nie pamietaja. Rama, w ktorej to przechodzi bez
    wyrzutow: stan wyzszej gotowosci i grozba buntu magow zwiazanego wprost z nieumarlymi.
  why_it_holds_in_canon:
    clock: 'clock_inquisition_attention.trigger wymienia guild_or_church_formally_escalates_lucans_case_or_necromantic_evidence_becomes_public.
      Papier i jawnosc sa triggerem; rozmowa nie jest. Kanal ustny jest wiec dokladnie
      tym kanalem, ktory nie rusza tego zegara.'
    her_agenda: 'find_viable_way_to_protect_lucan_and_city_without_formal_escalation -
      droga pozaproceduralna nie jest dla niej nowa propozycja, tylko jej wlasna linia.'
    duty_over_rules: 'retcon_000135 punkt c. Wyciagnela Varkhena i nie zglosila tego przez
      tygodnie; pytanie "czy wolno" jest u niej martwe. Zostaje "jak to zrobic, zeby dalo
      sie przy tym zostac".'
    the_mage_riot_is_hers_from_lucan: 'fact_seraphine_knows_no_academy_faction_is_safe
      (t_065) i fact_seraphine_knows_public_necromancy_charge_is_a_fuse (t_064) - oba
      dostala od Lucana dwa tygodnie temu. Narrator nie dorabia nowego zagrozenia.'
  where_it_does_not_hold_yet:
    the_frame_does_not_exist: |
      STANU WYZSZEJ GOTOWOSCI NIE MA. Decyzja z t_232 o ogloszeniu kryzysu jest decyzja,
      nie czynem; clocks.yaml nie ma zegara pieczeci, a clock_inquisition_attention stoi
      na 0 jako dormant_event_trigger_only. Do tego t_229: material cmentarny nigdy nie
      zostal podany kierownictwu JAKO ALARM i ustawila to tak ona sama. Bez ogloszenia
      kanal ustny nie brzmi wiec jak "biegly, ktorego nie mozna stracic", a jak
      "nieumarly, ktorego trzymalas trzy tygodnie" - czyli wprost jak jej problem z t_227.
    the_sequence_she_set:
      revised_by: retcon_000138
      revision_note: |
        ZREWIDOWANE W t_234. Pomiar PRZESTAL byc warunkiem koniecznym - Varkhen jest
        cytowalny jako pradawny straznik nekropolii skladajacy dobrowolne zeznanie
        (necromancy-law#varkhen_exposure.ancient_guardian_cover_story), a wewnetrzna
        dokumentacja gildii nie jest ani formalna eskalacja, ani jawnoscia, czyli nie
        rusza clock_inquisition_attention. Pomiar zostaje potrzebny do pol ZAKRES i DATA
        na karcie kontraktowej, nie do prawa mowienia o Varkhenie.
      original_text: |
        POMIAR TRZECIEJ PIECZECI -> CYTOWALNY MATERIAL -> OGLOSZENIE -> RAMA -> KANAL USTNY.
        Ogniwo drugie to jej zdanie z t_227: ktos musi znac WNIOSEK, nie ZRODLO, a wiedza
        od Varkhena wymaga drugiego, cytowalnego pochodzenia, zanim wejdzie na papier.
        Zeznanie nieumarlego z piwnicy cytowalne nie jest. Skutek: nocne wyjscie pod trzecia
        pieczec przestaje byc jedna z prac interludium i staje sie warunkiem wstepnym.
    paper_hold:
      revised_by: retcon_000138
      current_text: 'Zawezone w t_234. Na papier nie idzie ZDANIE o kontroli Lucana nad
        Varkhenem - samo zeznanie pradawnego straznika idzie. Karta kontraktowa nadal lezy
        niewypelniona, ale z innego powodu: ZAKRES i DATA wymagaja pomiaru, bo zbrojnego
        zakonu nie zamawia sie na "cos jest pod cmentarzem".'
      original_text: 'Do czasu pomiaru nic o Varkhenie i o pieczeciach nie idzie na papier.
        Karta kontraktowa na zbrojny zakon wraca do szuflady niewypelniona (ZAKRES i DATA),
        bo zamowienie na papierze gildii JEST papierem.'
  price_named_once: 'Kanal bez zapisu znaczy takze brak zapisu, ktory JA oslania. Jesli
    kiedys wyjdzie, beda dwie osoby twierdzace rozne rzeczy o rozmowie, ktorej wedle obu
    nie bylo. Drugiej ceny nie doklada sie (retcon_000135 punkt a).'
  what_the_narrator_must_not_do:
  - 'Nie inscenizowac nikogo z kierownictwa gildii ani nie ustanawiac ich reakcji.'
  - 'Nie nadawac Seraphine wladzy przestawiania terminu przesluchania.'
  - 'Nie tworzyc zegara pieczeci ani daty (retcon_000055).'

heraldry_check_route:
  objective_ref: objective_interlude_investigations
  step_ref: investigate_stag_signet_and_tannery_owners
  source_event_id: event_turn_interlude_233
  what_landed: |
    Lucan podal Seraphine teze: przedmiot zabrany z ukrytego skarbca garbarni laczy
    garbarnie z Kolmem. Podal ja jako hipoteze i sam nazwal ja "do sprawdzenia", wiec
    tak zostala zapisana (retcon_000120). Kierunek jest ZATWIERDZONY PRZEZ GRACZA
    od 2026-08-27 - ivar-kolm.yaml#the_act_01_thread.
  what_did_not_land:
    superseded_by: retcon_000137
    old_text: |
      GEST. item_three_arrow_deer_signet ma location container_interlude_loot_pile
      (loc_city_wall_hideout), a inventory#if_it_surfaces.do_not_fire_automatically mowi
      wprost, ze sygnet lezy w stosie lupu w baszcie. Przy Lucanie go nie ma, wiec nie
      mogl go polozyc na blacie. Padl sam opis herbu - jelen przebity trzema strzalami.
  what_landed_after_retcon_000137: |
    GEST ZOSTAL WYKONANY. Gracz nadpisal lokalizacje 2026-09-03: sygnet byl noszony na
    palcu, zostal zdjety i lezy na biurku Seraphine przy niedokonczonej karcie
    kontraktowej. NIE ZOSTAL ODDANY - decyzja o zabraniu go z powrotem nalezy do Lucana.
    CO SIE NIE ZMIENIA: heraldry_recognition nadal attempted_and_failed, wiec nikt w tym
    pokoju nie umie nazwac rodu, a ivar-kolm.yaml#do_not_invent nadal zabrania
    wyprodukowania nazwy bez researchu. Trasa sprawdzenia zostaje ta sama - papiery
    garbarnika u niej, nie rejestr gildii - tylko porownuje sie OBIEKT, nie opis.
    item_tannery_owner_cache TA KOREKTA NIE OBEJMUJE: rejestr rachunkowy, tabliczka
    KOMORA III, umowy dostaw i pieczec poprzednika nadal leza w zone_wall_void baszty,
    trzy kwadranse marszu (t_086). To jest druga polowa dowodow i nadal jest poza miastem.
  the_route_she_chose: |
    NIE przez rejestr gildii i NIE przez trzecia osobe. Podstawa: jej doktryna z t_126
    ("nie liczy sie, czy informacja jest tajna, tylko ILE OSOB MOGLO JA MIEC") oraz
    inventory#if_it_surfaces.the_shield - trop wskazuje na PARE "gildia albo Lucan", wiec
    zapytanie heraldyczne przez gildie obciaza takze ja. Sprawdzi herb w papierach
    garbarnika, ktore dostala w milestone_022 i ktore ma u siebie.
  unresolved: 'Czy herb w tych papierach w ogole jest. Narrator tego nie domyka i nie
    zapowiada wyniku (retcon_000058). Nazwy rodu nie wolno wyprodukowac bez researchu
    heraldycznego - ivar-kolm.yaml#do_not_invent.'
  the_gap_this_opens_in_the_boundary_text: |
    OBOWIAZKOWE ZESTAWIENIE (retcon_000135 punkt d), wprost z
    ivar-kolm.yaml#co_to_zmienia_w_dyspucie: "kazda linia, ktora Lucan wspolpisze i ktora
    wypycha hybrydy do szarej strefy, pracuje takze dla Kolma. Warunek nadrzedny z t_168
    tego NIE dotyka - hodowla okazow nie jest nekromancja na ludziach."
    Brzmienie proponowane w t_233 tnie po CZLOWIEKU i po SKALI. Hodowla okazow pod
    garbarnia nie jest nekromancja na ludziach, wiec jesli teza o Kolmie jest prawdziwa,
    ten sam tekst, ktory ma dac obu stronom sukces, wyprowadza sprawe spod garbarni
    z zakresu scigania - mechanizmem, ktory Lucan sam wylozyl Seraphine w t_231
    (hybrydy w szarej strefie, przestaje sie rozpatrywac skargi).
    NIE ROZSTRZYGAC, w ktora strone to pchnie Kolma - #open_problems mowi wprost:
    RACHUNEK KOLMA NIEROZSTRZYGNIETY.
  priest_warning: |
    Uprzedzenie o zamiarze wciagniecia KAPLANA Z CMENTARZA do brzmienia padlo PRZED
    kontaktem, czyli spelnia warunek z t_122 (fact_seraphine_knows_lucans_seven_levers)
    i NIE jest zlamaniem niczego - retcon_000124 nie ma tu zastosowania.
    Ona ma do tego wlasny material: fact_seraphine_knows_priest_visited_varkhen_with_oren
    oraz swoje pytanie z t_029, czy to ten sam interes co kaplan od wejscia.
    NARRATOR NIE UTOZSAMIA tego kaplana z meet_local_priest (state: accepted_kesz_arranges,
    t_113) - zaden plik ich nie skleja.

two_dates_order_reading:
  source_event_id: event_turn_interlude_233
  status: ODCZYT_Z_ZEGAROW_NIE_USTALENIE_FABULARNE
  text: |
    Lucan obawial sie, ze przesluchanie wypada zaraz PRZED dysputa. Odczyt jest odwrotny,
    ale roznica jest w godzinach: clock_father_arranges_academy_showing elapsed_seconds
    44860, clock_guild_leadership_hearing elapsed_seconds 40060, oba progress 3/15,
    seconds_per_step 86400. Rozstep 4800 s = 1 h 20 min na korzysc dysputy; do progu
    ok. 11,5 dnia w obu przypadkach. t_232 mowilo "ruchome wzgledem siebie o dzien" -
    to bylo zaokraglenie, faktyczny rozstep jest mniejszy.
    WAZNIEJSZA ASYMETRIA: dysputa JEST WYZNACZONA (clock.effect: "JUZ WYZNACZONEJ otwartej
    dysputy"), a przesluchanie ma lucan_knows_the_date: horizon_only i knowledge_note
    "jeszcze nie ogloszone oficjalnie". Kolejnosc nie jest wiec ustalona, a jedynym
    ruchomym terminem jest termin GILDII. Seraphine nie obiecala go przestawic i narrator
    nie nadaje jej takiej wladzy.

act_01_death_toll_political_register:
  objective_ref: objective_interlude_investigations
  source_event_id: retcon_000139
  status: USTALONE_PRZEZ_GRACZA_2026_09_03
  the_official_toll: |
    CZTERY POTWIERDZONE SMIERCI, wszystkie z reki Lucana albo Spideya, zaksiegowane
    publicznie jako ofiary garbarni i jej podziemi:
    - straznik wysypiska (milestone_008_dump_guard_killed, zabity przez Spideya),
    - szperacz z wysypiska (milestone_009_dump_scavenger_killed, Spidey zabija,
      Lucan pobiera energie na odleglosc),
    - dwoch pracownikow garbarni (milestone_013_mutated_rat_and_workers uzyci jako zywa
      oslona, milestone_014_workers_betrayed_and_consumed zdradzeni i POZARCI przez Spideya).
    PIATA POZYCJA NIEROZSTRZYGNIETA: stary pracownik pilnujacy wlazu, otruty w
    milestone_012_old_worker_poisoned - zapis nie mowi, czy zmarl. Nie rozstrzygac za gracza.
  why_the_cover_holds_without_effort: |
    Cial dwoch pracownikow NIE MA WCALE - Spidey ich pozarl. "Ofiary podziemi" nie sa wiec
    wygodna wersja, sa JEDYNA dostepna wersja, bo nie ma czego badac.
    Do tego milestone_015_tannery_hero_reputation: po pokonaniu zmutowanego szczura Lucan
    zostal uznany BOHATEREM INCYDENTU i zapamietany przez gildie jako Lucan Veyr. Oficjalna
    rama byla ustawiona wtedy, przez instytucje, i nikt jej nie kwestionowal.
  the_uncounted:
    text: |
      OFIAR WALKI ZE SZCZUROOGREM NIKT NIE SPISAL. Zaklad byl ewakuowany, a podziemia
      musiala zamykac ekipa A-rank gildii - wiec teza, ze ktos przy tym ucierpial, jest
      wiarygodna. SPISU JEDNAK NIE MA I NIE WOLNO GO WYPRODUKOWAC (retcon_000058).
    dziala_w_obie_strony: |
      To nie jest luka, to jest wlasciwosc. Skoro nikt nie policzyl, nikt nie postawi liczby
      ANI ZA, ANI PRZECIW Lucanowi. Ambiwalencja jest domyslna, tak samo jak przy sygnecie.
  the_register: |
    To jest odpowiedzialnosc POLITYCZNA, nie prawna, i gracz nazwal to poprawnie.
    necromancy-law#information_rule: podejrzenie, wiedza prywatna, dowod instytucjonalny
    i fakt publiczny sa ODREBNYMI STANAMI. Cztery trupy zaksiegowane na garbarnie sa faktem
    publicznym i mozna je wnosic do kazdej rozmowy o odpowiedzialnosci za nielegalna hodowle;
    kto je faktycznie zabil, jest wiedza prywatna jednej osoby.
    POLACZENIE Z WATKIEM KOLMA: jesli hipoteza o garbarni jest prawdziwa, to nie jest to spor
    o klasyfikacje konstruktow. To sprawa o nielegalne, niezabezpieczone badania z bilansem
    czterech trupow, ewakuacja zakladu, zamrozonym majatkiem, ekipa A-rank i inspektorem
    gildii o wlos wyciagnietym spod szczuroogra. Rejestr definicyjny jest dla akademika
    bezpieczny; rejestr wydatkow i trumien nie jest.
  narrator_flags:
  - 'MOZLIWE NAKLADANIE SIE, NIEROZSTRZYGNIETE: fact_seraphine_knows_four_marked_corpses
    (milestone_047) mowi, ze Lucan przyznal Seraphine, iz dwie ofiary w kaplicy i DWIE NA
    WYSYPISKU nosza jego slad. Jesli te dwie z wysypiska to milestone_008 i 009, Seraphine
    jest osoba, ktora wie, ze oficjalny bilans garbarni klamie co do sprawcy. Jej karta nie
    ma z tym problemu, ale rachunek trzeba znac. Zaden plik tych par nie utozsamia.'
  - '"POL BUDYNKU WYBUCHLO" NIE MA POKRYCIA. Sabotaz z milestone_018 byl STYMULANTEM -
    przyneta podrzucona przed oficjalnym oczyszczaniem - nie wybuchem. W plikach sa natomiast:
    zawalona piwnica za garbarnia (kryjowka Lucana), zawalona sciana z gniazdem gryzoni,
    ewakuacja i podziemia zamkniete przez ekipe A-rank. Dla tezy o nieustalonych ofiarach to
    wystarcza; slowo "wybuch" wymagaloby osobnej deklaracji gracza.'
  - 'DRUGA STRONA MEDALU, do swiadomej decyzji gracza: ucieczka szczuroogra nastapila po
    sabotazu stymulantem (milestone_018), a na karcie npc_halven_rusk siedzi suspicion
    o sredniej pewnosci, ze Lucan sabotowal. Seraphine tego NIE MA. Kto otwiera teczke
    garbarni, otwiera ja razem z tym.'
