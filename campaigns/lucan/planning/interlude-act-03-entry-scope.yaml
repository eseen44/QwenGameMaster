schema_version: 1
id: interlude_act_03_entry_scope
status: approved_current_scope
source_ref: retcon_000099
phase: interlude_before_act_03
purpose: >-
  Ogranicza bieżącą grę do spraw, które Lucan może podjąć przed dwoma przesłuchaniami.
  Nie jest warunkiem ukończenia: instytucje nie czekają, aż Lucan odhaczy całą listę.
roll_policy:
  mode: disabled_during_interlude
  resolution: capability_method_time_resources_and_existing_consequences
  hard_limits_remain: [impossible, possible_only_with_new_leverage]
  ends_when: first_of_the_two_act_03_hearings_begins
act_03_entry:
  hearings:
    - guild_leadership_hearing
    - academy_church_showing_and_dispute_involving_kolm
  rule: >-
    Rozpoczęcie pierwszego przesłuchania kończy interludium i przywraca rzuty. Niewykonane
    prace pozostają niewykonane i przechodzą do Aktu 3; nie opóźniają terminu.
workstreams:
  - id: objective_prepare_guild_hearing_and_watch
    scope: Gildia, Straż, prawnik, spójna wersja wydarzeń i nagroda za Akt 2.
  - id: objective_prepare_academy_church_dispute
    scope: Kościół, Kolm, kapłan, klasyfikacja okazów, granica prawna i dziekan.
  - id: objective_interlude_investigations
    scope: Sygnet, garbarnia, Rusk, magistrat i wysoko urodzeni zainteresowani nekromancją.
  - id: objective_develop_lucan
    scope: Trening z Marą, aktywne zdolności, książki i wiedza używana w testach.
  - id: objective_prepare_companions_and_specimens
    scope: Naprawy sług, wybrane modyfikacje i co najmniej jeden okaz po dostawie 6.-7. dnia.
not_currently_scheduled:
  - Dom Brandt i Klara nie wchodzą obowiązkowo przed ani na początku Aktu 3.
  - Dopuszczalna jest wyłącznie krótka migawka lub informacja od Seraphine, jeśli naturalnie wyniknie ze śledztwa.
  - Beatrix nie ma zaplanowanego wejścia; jej karta określa zachowanie tylko na wypadek naturalnego spotkania.
  - Nie planować dalszych faz, fizycznej eskalacji, świadków z przeszłości ani zakończenia Aktu 3 przed rozegraniem dwóch przesłuchań.
