schema_version: 1
campaign_id: campaign_lucan
status: player_expectation_not_binding
declared_by: player
source_event_id: player_declaration_2026_08_27_out_of_scene
purpose: |
  Zarys tego, jak GRACZ spodziewa sie ksztaltu Aktu 3. Zapisany, zeby narrator wiedzial,
  w ktora strone przygotowywac swiat i czego NIE psuc. Nie jest to harmonogram fabuly.

# ---------------------------------------------------------------------------
gdzie_jestesmy:
  correction_source: 'Poprawka gracza 2026-08-27: "nadal jestesmy PRZED aktem 3".'
  text: |
    INTERLUDIUM NIE JEST AKTEM 3 - jest przygotowaniem do niego. Nazwy plikow
    (planning/act-03-*.yaml, scene_act_03_interlude_*) sa MYLACE i zostaja wylacznie
    dla stabilnosci referencji; nie renowac. Czytac je jako "materialy do Aktu 3",
    nie "Akt 3 w toku".
  akt_3_zaczyna_sie_od: |
    Trzy zdarzenia instytucjonalne, ktore juz maja zegary i daty:
      1. przesluchanie przed kierownictwem gildii (clock_guild_leadership_hearing),
         na tej samej sesji rozstrzyga sie nagroda za Akt 2;
      2. otwarta dysputa npc_neris_aldhen kontra npc_ivar_kolm;
      3. seminarium, ktorego nie da sie odrzucic i ktore ZAPISUJE
         (clock_father_arranges_academy_showing).
    To jest "rozprawa, dyskusja i ten trzeci" ze slow gracza.

# ---------------------------------------------------------------------------
przewidywany_luk:
  faza_1_instytucjonalna: 'Trzy zdarzenia wyzej. Papier, forum, swiadkowie.'
  faza_2_burza_polityczna: |
    Rozstrzygniecia z fazy 1 przestaja byc sprawa Lucana i staja sie sprawa miasta.
    Kanon juz to zapowiada: otwarta dysputa jest ETAPEM OBSADZANIA WLADZY Akademii
    (factions/lumaria-magical-academy.yaml#leadership), a zysk z zamieszek maja
    konkretne frakcje Kosciola i magow.
  faza_3_fizyczna: |
    Dopiero tu wraca przemoc. Gracz wymienia trzy strony i dwa warianty eskalacji.
    Nie sa to przeciwnicy do wystawienia po kolei - sa to strony, ktore moga sie
    ZLOZYC, i wlasnie dlatego jest to burza, a nie seria walk.

# ---------------------------------------------------------------------------
# Rozdzial jest istotny: czesc tej listy stoi juz w plikach, czesc jest nowa.
# Narrator NIE MOZE traktowac calosci jako ustalonej ani jako zabronionej.
strony_fazy_fizycznej:
  - id: religijni_fanatycy
    canon_status: MA_POKRYCIE
    where: |
      Kosciol "fanatycznie zwalcza praktyke" (migration 04-npcs-factions, rewizja 10);
      necromancy-law#church_position. Co wiecej, fanatyzm jest JUZ wpisany w projekt
      granicy jako narzedzie: Lucan liczy, ze "profesor Veyr nie doczyta do konca,
      fanatycy religijni tak" (t_168 / neris-aldhen knowledge).
    note: 'Czyli zapis, ktory Lucan wlasnie wspolpisze, sam sciaga te strone na siebie.'
  - id: straz_miejska_zacierajaca_slady
    canon_status: MA_POKRYCIE
    where: |
      Straz miejska ma wlasny zysk w zamieszkach, bo ZAKRYWA afere z handlem zwlokami
      na cmentarzu - ustalone t_140, powtorzone w planning/lucan-leads.yaml#711 oraz
      w wiedzy Neris. Osobno wisi nierozwiazany lancuch autoryzacji polnocno-zachodniej
      zapory (objectives#trace_northwest_gate_authorisation_chain, zlecone Seraphine).
    note: |
      Ta strona NIE atakuje Lucana za nekromancje - atakuje za to, ze patrzy na
      cmentarz. Motyw jest zatarcie, nie doktryna.
  - id: watek_garbarni_dwaj_wlasciciele
    canon_status: MA_MOCNE_POKRYCIE_W_AKCIE_1
    correction: |
      POPRAWKA 2026-08-27. Narrator zapisal wczesniej "NOWE_OD_GRACZA - poprzedni wlasciciel
      nie istnieje w kanonie". BYLO TO BLEDNE: sprawdzil tylko pliki stanu, nie zrodlo Aktu 1.
      Watek jest jednym z najlepiej udokumentowanych w calej kampanii i ma DWIE osoby.
    obecny_wlasciciel:
      status: ZYJE, przezyl katastrofe szczuroogra
      relacja_z_lucanem: |
        Zna go z nazwiska i z twarzy - "Veyr. Znowu ty." - podal mu reke, zatrudnil go przez
        gildie, dal mu pek kluczy i wlasny szkic podziemi, i obiecal mu pieniadze osobno,
        poza premia gildii.
      jego_zlecenie: |
        "Jesli znajdziesz tam stare ksiegi, skrzynie albo dokumenty z nazwiskiem poprzedniego
        wlasciciela... przynosisz je NAJPIERW MNIE." Wprost: zanim zobaczy je miasto.
      co_lucan_zrobil: |
        Nie dostarczyl. Wzial papiery, swiadomie postanowil NIE WRACAC i nie spotykac
        pracodawcy, a przy okazji zabral z jego biurka SREBRNA PIECZEC - ktora sam nazwal
        dowodem zbrodni. Garbarnia zostala potem ewakuowana, a gildia wyslala ekipe A-rank
        do zamkniecia podziemi.
      dlaczego_to_zywe: |
        Jest to jedyny znany czlowiek w miescie, ktory ma wobec Lucana konkretny, imienny
        i uzasadniony zal - i to nie o nekromancje, a o niedostarczone papiery i kradziez.
        Nie potrzebuje zadnej doktryny, zeby go szukac.
    poprzedni_wlasciciel:
      status: nigdy nienazwany, los NIEUSTALONY
      co_robil: |
        Prowadzil pod garbarnia NIELEGALNA HODOWLE OKAZOW: Komora III z dostepem technicznym,
        sluza, harmonogram karmienia ("Okazy niestabilne. Karmic wylacznie po zamknieciu
        sluzy."), nocne transporty i "dolny sklad" bez ksiegowania miejskiego.
      gdzie_sa_dowody: 'U LUCANA, w zone_wall_void baszty - item_tannery_owner_cache.'
    dlaczego_to_dotyka_aktu_3: |
      Nie jest to poboczny watek zbirow. Nielegalna hodowla okazow jest DOKLADNIE ta
      kategoria prawna, o ktora toczy sie otwarta dysputa (necromancy-law#construct_boundary),
      a katedra npc_ivar_kolm to BIOMUTANTY. Lucan trzyma wiec precedens z wlasnego miasta:
      ktos to robil, miasto tego nie zobaczylo, zaklad dzialal dalej. Papiery moga byc
      argumentem, dzwignia albo obciazeniem - zaleznie od tego, kto pokaze je pierwszy.
    do_not_invent_yet: |
      Imiona obu, motyw poprzednika, jego los, liczebnosc czyichkolwiek ludzi oraz to, czy
      te dwie strony sie znaja - NIEUSTALONE. Nie dopisywac przed decyzja gracza. Nie
      przydzielac tez zadnej z nich wiedzy o dzisiejszej nekromancji Lucana: obecny
      wlasciciel widzial robotnika E-rank z pajakiem, nie nekromante z siecia.
    geografia_gotowa: |
      loc_tannery ma zone_office ("Dawny kantor wlasciciela"), a podziemia loc_rat_mound
      lacza sie z loc_tannery_cellar_hideout i loc_ronada_canals. Lucan trzyma tam
      webber_tannery i posterunek na lakach nad garbarnia (zone_upper_meadow), wiec ma
      w tym miejscu co stracic i ma tam oczy.
  - id: warianty_eskalacji
    canon_status: MA_POKRYCIE_CZESCIOWE
    variants:
      - 'Sam npc_ivar_kolm - gra o rektorat, cena znana (ivar-kolm#the_price_of_kolm).'
      - 'Skorumpowany przedstawiciel magistratu - frakcja istnieje
         (factions/lumaria-magistracy.yaml), kanal do akt tez (npc_malen_corth),
         ale KONKRETNA skorumpowana osoba nie jest nazwana.'
      - '"Gory strazy" - skala, nie strona. Znaczy: moment, w ktorym sprawa przestaje
         byc rozgrywana pojedynczymi ludzmi.'

# ---------------------------------------------------------------------------
zasady_dla_narratora:
  non_binding: |
    TO NIE JEST HARMONOGRAM. Gracz powiedzial "prawdopodobnie", "moze" i "kto wie".
    Nie prowadzic do tych scen na sile, nie zapowiadac ich w fikcji i nie traktowac
    ich jako zapowiedzianych. Jesli gra pojdzie indziej, ten plik po prostu sie nie
    zrealizuje i to jest w porzadku.
  nie_budowac_przeszkod_z_tej_listy: |
    Szczegolne ostrzezenie, bo to swiezy tryb awarii (retcon_000015/23/29/31/33/54/55):
    swiadomosc, ze w Akcie 3 ma byc walka, NIE jest licencja na dokladanie kosztow,
    terminow i oporu w interludium "zeby przygotowac grunt". Interludium buduje GRACZ.
  co_wolno_robic_z_tym_plikiem: |
    (a) Trzymac przygotowane karty i geografie stron, ktore MAJA pokrycie w kanonie,
        zeby nie improwizowac ich w scenie (retcon_000040 - kazdy NPC jest kims innym).
    (b) Pozwalac tym stronam dzialac WLASNYMI celami w tle, jesli zegar to uzasadnia.
    (c) NIE nadawac im wiedzy o Lucanie, ktorej nie zdobyly zdarzeniem.

