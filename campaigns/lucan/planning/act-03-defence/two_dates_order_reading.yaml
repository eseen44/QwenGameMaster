  text: |
    Lucan obawial sie, ze przesluchanie wypada zaraz PRZED dysputa. Odczyt jest odwrotny,
    ale roznica jest w godzinach: clock_father_arranges_academy_showing elapsed_seconds
    44860, clock_guild_leadership_hearing elapsed_seconds 40060, oba progress 3/15,
    seconds_per_step 86400. Rozstep 4800 s = 1 h 20 min na korzysc dysputy; do progu
    ok. 11,5 dnia w obu przypadkach. t_232 mowilo "ruchome wzgledem siebie o dzien" -
    to bylo zaokraglenie, faktyczny rozstep jest mniejszy.
    WAZNIEJSZA ASYMETRIA: dysputa JEST WYZNACZONA (clock.effect: "JUZ WYZNACZONEJ otwartej
    dysputy"), a przesluchanie ma lucan_knows_the_date: horizon_only i knowledge_note
    "jeszcze nie ogloszone oficjalnie". Kolejnosc nie jest wiec ustalona, a jedynym
    ruchomym terminem jest termin GILDII. Seraphine nie obiecala go przestawic i narrator
    nie nadaje jej takiej wladzy.
