syndicate_access:
  obligation_ref: obligation_define_syndicate_exchange_beyond_gold
  source_event_id: event_turn_interlude_103
  what_changed: |
    Lucan sam, przed wejsciem, powiedzial Marze, ze nie idzie po jednorazowa transakcje, a po
    WSPOLPRACE: dostep do ich rynku i do ich prawnikow. To honoruje jej prosbe o uprzedzenie i
    jednoczesnie przestawia cala stawke. Poreczenie za sprzedawce zlota konczy sie razem z
    workiem; poreczenie za przyszlego klienta aparatu nie ma daty konca, a w pokoju wyceniany
    bedzie CZLOWIEK, nie towar.
  the_question: |
    Dostepu sie nie dostaje - dostep sie WYMIENIA. Pytanie "co masz poza zlotem" padnie
    pierwsze, przed jakakolwiek kwota. Mara nie odpowiada za Lucana i nie zgaduje na glos na
    targu; mowi tylko, ze ludzie zyjacy z kupowania i sprzedawania placa za MOZLIWOSCI, a ona
    widziala go przy robocie, ktorej nikt inny w grupie nie umial zrobic. Kandydaci na stole
    (nierozstrzygniete): okazy, wiedza, Varkhen, nazwisko Veyr. Kazdy z nich ma inna cene
    ujawnienia przy Marze, ktora za niego reczy.
  route_note: |
    Transport rozwiazal sie sam - zawodowcy wyznaczaja pokoje osiagalne bez punktu
    kontrolnego, wiec kontrola na wjazdach i obwieszczenie o szczatkach nie dotykaja trasy.
    Cena: ostatni odcinek biegnie po ICH terenie. Boros donosi towar do progu i konczy - nie
    wchodzi, nie widzi placacego, udzial bierze z reki Lucana.

    martwy i chodzi. Trzy takie okazy sa poza kontrola.
