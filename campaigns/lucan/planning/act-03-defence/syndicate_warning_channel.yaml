schema_version: 1
id: act_03_defence_rationale__syndicate_warning_channel
section: syndicate_warning_channel
part_of: campaigns/lucan/planning/act-03-defence.yaml
split_note: >-
  Wyodrebnione 2026-09-04 z planning/act-03-defence.yaml (etap 8). Tresc
  przeniesiona 1:1, surowymi liniami, bez ponownej serializacji - formatowanie
  i lamanie linii oryginalu zachowane.
syndicate_warning_channel:
  source_event_ids: [event_turn_interlude_113, event_turn_interlude_200, event_turn_interlude_201]
  obligation_ref: campaigns/lucan/state/obligations.yaml#obligation_name_advance_warning_channel_for_syndicate
  what_was_ordered: >-
    t_113, slowami pryncypala: ostrzezenie przychodzace tego samego dnia co klopot nie jest
    ostrzezeniem, tylko wiadomoscia. Kupuje WYPRZEDZENIE warte co najmniej dobe, typu
    "zamykajcie". Terminu nie zazadal i o nazwisko sie nie targowal.
  what_was_delivered: >-
    t_200. spy_cellar_spider_06, przedstawiony jako "Toby", oddany na stale i postawiony
    w skrzynce na dolnej polce w pokoju syndykatu (loc_lumaria_market#zone_market_back_alleys).
    Sterowany zdalnie przez Lucana. Sygnalem jest przejscie na kolejny talerzyk.
    DLACZEGO TO DZIALA, Z PLIKOW SIECI: alarm czytany OKIEM nie zuzywa uwagi w ogole
    (companions/webber-network.yaml#network_cost_model.attention_is_serial, wniosek nr 2);
    uwaga Lucana jest seryjna i kosztuje ~15 s na wezel, ale Toby nie jest przegladany -
    tylko wyzwalany. Sygnal jednobitowy nie odczuwa straty wiernosci, a Toby jest
    not_anchored_by_choice, wiec ma strate na odleglosc, nie brak sterowania
    (retcon_000049 - kotwica to antena, nie warunek kontroli). Utrzymanie 0, autonomous_hunting.
    Terrarium/wlasny kat przyznane, bo okaz ma flagi destroyed_by_a_broom oraz
    silhouette_ignored_by_everyone.
    NIE JEST PODSLUCHEM: near_blind_vibration_and_air_sensing_only, a
    ability_eavesdropping_through_threads ma current: false.
  phases:
    source_event_id: event_turn_interlude_202
    supersedes: event_turn_interlude_201
    source: player_declaration
    note: >-
      PRZEDEFINIOWANE SZESC MINUT PO PIERWSZEJ WERSJI, przy tym samym stole. Nie jest to
      retcon - Lucan poprawil wlasna oferte na biezaco. Kluczowa roznica: talerzyk 3
      przestal znaczyc "kordon" i znaczy "powolano grupe"; kordon zszedl do przedzialu
      MIEDZY 3 a 4. Caly harmonogram przesunal sie o krok wczesniej.
    "1": TERAZ, stan sprzed wszystkiego. Bez doklejonej instrukcji (retcon_000127).
    "2": >-
      Odbylo sie JEDNO I DRUGIE: przesluchanie Lucana oraz konferencja akademikow o prawnej
      naturze nekromancji. Wszyscy wiedza, co sie dzieje, ale sa zbyt zajeci polityka, zeby
      sie tym przejac.
    "3": Koniec burzy politycznej i oficjalne utworzenie grupy, ktora ma sie zajac problemem.
    "4": >-
      WEJSCIE - i jednoczesnie TERMIN, nie ostrzezenie (retcon_000127). Moment wejscia jest
      momentem, do ktorego pryncypala ma juz nie byc w miescie. Czwarty talerzyk nie ostrzega;
      konczy odliczanie.
    lucans_estimates: >-
      Faza 2 trwa NAJWYZEJ PARE DNI. Od fazy 3 do kordonu MAKSYMALNIE DZIEN, DWA.
      TO SA SZACUNKI LUCANA PODANE KONTRAHENTOWI, NIE ZEGARY. Zadnego wpisu w
      state/clocks.yaml z nich nie ma i fazy wyzwala RECZNIE Lucan, nie uplyw czasu.
    anchored_to_existing_clocks: >-
      Faza 2 wisi na dwoch zegarach, ktore juz istnialy i ktorych ta tura NIE RUSZA:
      clock_guild_leadership_hearing 3/15 oraz clock_father_arranges_academy_showing 3/15
      (effect: ok. 16 dni, npc_neris_aldhen kontra npc_ivar_kolm). Do tego
      current_scope#entry_rule - pierwsze z dwoch przesluchan rozpoczyna Akt 3. Uwaga Lucana,
      ze "dziwnym trafem obie w podobnym czasie", jest zgodna z plikami: obie na tym samym
      oczku. Zbiega sie to z jego zapowiedzia z t_105b (wojna domowa w dwa tygodnie).
    naming_caveat: >-
      "Konferencja akademikow o prawnej naturze nekromancji" to SFORMULOWANIE LUCANA podane
      paserowi, nie tytul wydarzenia. W plikach jest otwarta dysputa Akademia-Kosciol
      w formie seminarium. Nie ustanawiac tematu dysputy z tego zdania (retcon_000120).
  which_saucer_is_the_product:
    source_event_ids: [event_turn_interlude_201, event_turn_interlude_202]
    first_reading_by_the_principal: >-
      t_201: fazy 3 i 4 sa jako ostrzezenia bezuzyteczne, bo przy kordonie nie ma juz czego
      wywozic. Doba, o ktora prosil w t_113, mieszkala wedlug niego w FAZIE 2.
    lucans_correction: >-
      t_202, w brzmieniu poprawionym przez retcon_000127: pryncypal chce wiedziec o
      PIERWSZYM wlasnie dlatego, ze koncem drabinki nie jest "przewiez towar", tylko
      "ciebie ma tu nie byc" - a na to potrzeba calego biegu 1-2-3, nie ostatniego sygnalu.
      Wczesniejsze talerzyki sa pasem startowym do czwartego. Pryncypal to przyjmuje i nie
      jest to dla niego nowa mysl, tylko pierwszy raz powiedziana przy nim na glos: w t_109
      sam stwierdzil, ze jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan
      (fact_weigher_has_a_stake_in_lucan_surviving).
      JEGO UWAGA Z t_201 CZYTA SIE TERAZ INACZEJ I CELNIEJ: powiedzial, ze czwarty talerzyk
      to "wiadomosc, ze mialem racje tydzien temu". Czwarty nie jest zla wiadomoscia - jest
      ostatnia.
    what_he_can_and_cannot_move: >-
      Polowe ewakuacji ma zrobiona projektowo od t_109 - zapas NIE lezy w miescie, stoi poza
      Lumaria i wchodzi na zamowienie. Wywiezc nie da sie dwoch rzeczy: pokoju za straganami
      oraz tego, ze nikt go nie zna. Czlowiek, ktory wyjezdza i wraca, jest zapamietywany
      dwa razy, a cala jego metoda to nie zostac zapamietanym ani raz (agenda#stay_unnamed).
    open_question: >-
      NIEODPOWIEDZIANE, i po retcon_000127 jeszcze bardziej na miejscu, bo dotyczy wprost
      tego, co znaczy czwarty talerzyk. Pryncypal nie zapytal, CZYM jest rzecz pod cmentarzem -
      zapytal, JAK DALEKO ma sie usunac. Pytanie logistyczne, wiec nie lamie jego wlasnej
      zasady "powodu nie kupuje". Lucan nie odpowiedzial i narrator odpowiedzi nie zmysla.
  what_is_not_revealed: >-
    Wszystkie cztery fazy opisuja REAKCJE INSTYTUCJI, nie przyczyne. Lucan nie powiedzial,
    co jest pod cmentarzem, po co mialby tam wejsc oddzial ani czego szuka - ta sama
    dyscyplina co w t_110 i t_194. forbidden_without_source obu obecnych nienaruszone:
    varkhen_existence, seals_and_lower_gate (pryncypal), spidey_existence, lucan_necromancy.
    Dla pryncypala to nie jest nowa kategoria, tylko harmonogram do
    fact_weigher_knows_a_bigger_cemetery_problem_exists (t_110).
