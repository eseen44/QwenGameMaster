  the_official_toll: |
    CZTERY POTWIERDZONE SMIERCI, wszystkie z reki Lucana albo Spideya, zaksiegowane
    publicznie jako ofiary garbarni i jej podziemi:
    - straznik wysypiska (milestone_008_dump_guard_killed, zabity przez Spideya),
    - szperacz z wysypiska (milestone_009_dump_scavenger_killed, Spidey zabija,
      Lucan pobiera energie na odleglosc),
    - dwoch pracownikow garbarni (milestone_013_mutated_rat_and_workers uzyci jako zywa
      oslona, milestone_014_workers_betrayed_and_consumed zdradzeni i POZARCI przez Spideya).
    PIATA POZYCJA NIEROZSTRZYGNIETA: stary pracownik pilnujacy wlazu, otruty w
    milestone_012_old_worker_poisoned - zapis nie mowi, czy zmarl. Nie rozstrzygac za gracza.
  why_the_cover_holds_without_effort: |
    Cial dwoch pracownikow NIE MA WCALE - Spidey ich pozarl. "Ofiary podziemi" nie sa wiec
    wygodna wersja, sa JEDYNA dostepna wersja, bo nie ma czego badac.
    Do tego milestone_015_tannery_hero_reputation: po pokonaniu zmutowanego szczura Lucan
    zostal uznany BOHATEREM INCYDENTU i zapamietany przez gildie jako Lucan Veyr. Oficjalna
    rama byla ustawiona wtedy, przez instytucje, i nikt jej nie kwestionowal.
  the_uncounted:
    text: |
      OFIAR WALKI ZE SZCZUROOGREM NIKT NIE SPISAL. Zaklad byl ewakuowany, a podziemia
      musiala zamykac ekipa A-rank gildii - wiec teza, ze ktos przy tym ucierpial, jest
      wiarygodna. SPISU JEDNAK NIE MA I NIE WOLNO GO WYPRODUKOWAC (retcon_000058).
    dziala_w_obie_strony: |
      To nie jest luka, to jest wlasciwosc. Skoro nikt nie policzyl, nikt nie postawi liczby
      ANI ZA, ANI PRZECIW Lucanowi. Ambiwalencja jest domyslna, tak samo jak przy sygnecie.
  the_register: |
    To jest odpowiedzialnosc POLITYCZNA, nie prawna, i gracz nazwal to poprawnie.
    necromancy-law#information_rule: podejrzenie, wiedza prywatna, dowod instytucjonalny
    i fakt publiczny sa ODREBNYMI STANAMI. Cztery trupy zaksiegowane na garbarnie sa faktem
    publicznym i mozna je wnosic do kazdej rozmowy o odpowiedzialnosci za nielegalna hodowle;
    kto je faktycznie zabil, jest wiedza prywatna jednej osoby.
    POLACZENIE Z WATKIEM KOLMA: jesli hipoteza o garbarni jest prawdziwa, to nie jest to spor
    o klasyfikacje konstruktow. To sprawa o nielegalne, niezabezpieczone badania z bilansem
    czterech trupow, ewakuacja zakladu, zamrozonym majatkiem, ekipa A-rank i inspektorem
    gildii o wlos wyciagnietym spod szczuroogra. Rejestr definicyjny jest dla akademika
    bezpieczny; rejestr wydatkow i trumien nie jest.
  narrator_flags:
  - 'MOZLIWE NAKLADANIE SIE, NIEROZSTRZYGNIETE: fact_seraphine_knows_four_marked_corpses
    (milestone_047) mowi, ze Lucan przyznal Seraphine, iz dwie ofiary w kaplicy i DWIE NA
    WYSYPISKU nosza jego slad. Jesli te dwie z wysypiska to milestone_008 i 009, Seraphine
    jest osoba, ktora wie, ze oficjalny bilans garbarni klamie co do sprawcy. Jej karta nie
    ma z tym problemu, ale rachunek trzeba znac. Zaden plik tych par nie utozsamia.'
  - 'KSZTALT KATASTROFY - DOPRECYZOWANY PRZEZ GRACZA (retcon_000140). Szczuroogr WYDOSTAJE
    SIE Z PODZIEMI NA POWIERZCHNIE i demoluje zaklad. To nie byla eksplozja - sabotaz
    z milestone_018 byl stymulantem - ale pliki i tak nazywaja zdarzenie KATASTROFA
    SZCZUROOGRA (act-03-anticipated-shape#watek_garbarni_dwaj_wlasciciele: obecny wlasciciel
    JA PRZEZYL), a nastepstwem sa ewakuacja garbarni i ekipa A-rank wyslana ZAMKNAC podziemia,
    czyli opis wylomu, nie incydentu zakonczonego pod ziemia. Doprecyzowanie nie dodaje bytu,
    nadaje ksztalt. SPISU OFIAR NADAL NIE MA i nie wolno go produkowac; czy w hali byli
    wtedy robotnicy - nierozstrzygniete i nie do rozstrzygania za gracza.'
  - 'DRUGA STRONA MEDALU, do swiadomej decyzji gracza: ucieczka szczuroogra nastapila po
    sabotazu stymulantem (milestone_018), a na karcie npc_halven_rusk siedzi suspicion
    o sredniej pewnosci, ze Lucan sabotowal. Seraphine tego NIE MA. Kto otwiera teczke
    garbarni, otwiera ja razem z tym.'
