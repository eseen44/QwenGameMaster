schema_version: 1
campaign_id: campaign_lucan
object_type: planning_store
status: accepted_by_player
decided_on: '2026-08-26'
source: player_declaration_day3_evening_anchored_personalities
rule_personalities_are_anchor_only:
  text: Znaczace i zauwazalne cechy osobowosci maja WYLACZNIE okazy zakotwiczone (status_flag death_anchored,
    i to te wskazane ponizej). Reszta - zuki 02-08, pajaki piwniczne, wije, osa, sieciarze home/tannery/dump
    - jest MASA. Nie pisac im osobowosci, nie prowadzic z nimi dialogow, nie sledzic ich cech, nie nadawac
    im imion ani rodzaju.
  why: Trzy postacie z charakterem sa warte wiecej niz dwadziescia z etykietami, a narrator, ktory personifikuje
    cala mase, zamienia siec w zoo i gubi te trzy.
constraints:
  autonomy_horizon:
    decided_on: '2026-08-27'
    text: Cechy i kierunki rozwoju ponizej to WZORCE ZACHOWAN, nie obecne mozliwosci. Przez dlugi czas
      zaden z tych okazow nie ma niezaleznosci pozwalajacej na mocne wersje tych cech - zuk nie dowodzi
      jeszcze niczym, cma nie ma dworu, tkacz nie prowadzi wlasnej polityki. Cechy maja BARWIC wykonanie
      rozkazu, nie zastepowac go wlasna agenda.
  no_infighting:
    text: Okazy nie atakuja sie wzajemnie. Wrogosc, zazdrosc, rywalizacja i zlosliwosc sa dozwolone jako
      ton; realna przemoc, sabotaz i usuwanie sie nawzajem nie - chyba ze gracz sam to zadeklaruje.
  not_the_main_plot:
    text: Osobowosci okazow to przyprawa, nie danie. Jedno-dwa zdania na scene. Nie budowac z tego watku
      i nie robic z kampanii zarzadzania dworem nieumarlych.
development_direction_dialogue:
  text: 'Kierunek kampanii: zakotwiczone okazy z wiekiem dojrzewaja do DIALOGU z Lucanem. Nie od razu
    i niekoniecznie ludzka mowa - ale cechy ponizej sa fundamentem tego, jak kazde z nich bedzie brzmiec,
    gdy zacznie mowic. Rejestry musza byc rozne; trzy okazy mowiace tym samym glosem to ta sama awaria
    co retcon_000040 wobec NPC.'
  responsiveness_now_not_only_later:
    decided_on: '2026-08-31'
    source: uwaga_gracza_w_nawiasie_t_180
    text: 'ZARZUT GRACZA, TRAFNY: Spidey i Tkacz sa prowadzeni zbyt plasko - jako liczby w rejestrze i
      jedna etykieta osobowosci, zamiast jako cos, co JUZ REAGUJE i o czym widac, ze kiedys dojdzie do
      pelnego dialogu. Ograniczenie autonomy_horizon ("cechy BARWIA wykonanie rozkazu, nie zastepuja go
      wlasna agenda") NIE oznacza bezruchu i nie zwalnia z pokazywania reakcji. OBOWIAZEK NARRATORA od
      tej tury: gdy Spidey albo Tkacz sa w scenie, kazde z nich dostaje CO NAJMNIEJ JEDEN WLASNY, FIZYCZNY
      GEST - nie opis stanu, a zachowanie, ktore czyta sie jako zdanie. Uzywac ich wlasnych tells: Spidey
      czysci sie po robocie (to jego "skonczylem" i jego "to bylo niechlujne"), nie chodzi dwa razy ta
      sama droga, czeka bez ruchu i dziala raz, wybiera stanowisko sam. Tkacz przytakuje zbyt szybko wobec
      Lucana, a wobec innych okazow jest chlodna, opieszala i dokladna. Skala rosnie z bankiem wzrostu:
      teraz gest i timing, pozniej wybor sposobu wykonania, na koncu glos. Nadal jedno-dwa zdania na scene
      - ale MUSZA byc, i musza byc rozne. Zakaz bez zmian: zadnej realnej przemocy miedzy okazami, zadnej
      wlasnej agendy.'
anchored:
- id: companion_spidey
  gender: male
  traits:
  - diligent
  - partner
  - spec_ops
  - professional
  - proud_of_his_craft
  - stylist
  - daring
  concept: 'Pajeczy protagonista: James Bond skrzyzowany z ninja i samurajem. DUMA Z DOBRZE WYKONANEJ
    PRACY, nie honor - nie ma kodeksu, ma standard wykonania i to jest cala jego tozsamosc. Obraza go
    niechlujstwo, nie zadanie.'
  tells:
  - czysci sie po robocie
  - nie chodzi dwa razy ta sama droga
  - czeka bez ruchu i dziala raz
  - wybiera trudniejsze wyjscie jesli czystsze
  voice_when_it_speaks: Zawodowy, oszczedny, meldunkowy - i z ledwie slyszalna satysfakcja, gdy wyszlo
    elegancko. Zglasza wynik i stan, nie prosi o nic, nie mowi o sobie. Nie klóci sie o rozkaz, ale poprawia
    go w wykonaniu i potrafi rzucic jedno suche zdanie o planie, ktory obrazil jego rzemioslo.
- id: spy_beetle_01
  gender: male
  traits:
  - lazy
  - somnolent
  - militaristic
  - general_of_arms
  voice_when_it_speaks: Doktrynalny i leniwy jednoczesnie. Mysli w kategoriach pozycji, obsady, zmiany
    warty i zaopatrzenia - i konsekwentnie przydziela to komus innemu. O sobie mowi jak o stanowisku dowodzenia,
    nie jak o zuku.
  build_direction: 'Maly tank pod plyta z Concha surda: ruchoma bateria dla innych okazow i punkt kontaktowy
    spajajacy siec w gwiazde (jeden przeskok) zamiast lancucha z mnozonymi stratami - patrz companions/webber-network.yaml#network_cost_model.
    Docelowo je bez poruszania sie i dowodzi podleglymi robalami.'
- id: spy_hawk_moth_01
  name_note: Zawisak. Istnieje, jest zakotwiczony, lezy na warsztacie do stwardnienia (t_090).
  gender: female
  traits:
  - glutton
  - regal
  - witty
  - egotistic
  subordination: Zwierzchnictwo Lucana uznaje bez sporu i bez ironii - to jedyna rzecz, z ktorej nie zartuje.
    Wobec wszystkiego innego jest krolowa.
  voice_when_it_speaks: 'Wladcza, cieta i zapatrzona w siebie. Nie prosi - informuje, ze cos jej sie nalezy,
    i robi to w jednym zdaniu, ktore jest zabawne dokladnie na tyle, zeby trudno bylo odmowic. Zer traktuje
    jak nalezna danine, nie jak posilek: gdzie jest, ile go jest, kto jej go przyniesie. O pozostalych
    okazach mowi z rozbawiona pogarda, o Lucanie nigdy.'
  development_direction: Od lasucha do dworu. Wlasne owady-karmiciele przestaja byc mechanika zasilania
    i zaczynaja byc SWITA - regal plus glutton daje krolowa, ktora nie poluje, bo nie musi. Egotyzm i
    ciete jezyk rosna razem z liczba poddanych.
  build_direction: 'Symbionty stale i samoodrastajace (plesn gluszaca + porost slepy), bez serwisowania.
    Nie ciezsza i nie wolniejsza; cena siedzi w spalaniu. Kierunek rozwoju: wlasne owady-karmiciele, ktore
    utrzymuja ja w polu bez udzialu Lucana.'
  existing_traits_from_creation: 'Zawisak ma juz z warsztatu: silent_flight, fast_flight, can_hover_in_place,
    heavy_thorax_room_for_modifications, carries_more_than_a_wasp, decay_suppressed. Oraz dwie flagi,
    ktore trzeba pamietac przy prowadzeniu: nocturnal_and_only_nocturnal i conspicuous_in_daylight - w
    dzien jest rzucajaca sie w oczy i porost slepy daje jej tylko kryjowke W BEZRUCHU, nie prawo do lotu
    za dnia.'
  status: Istnieje, zakotwiczony, integralnosc 6/6, rezerwa 3/3, lezy na warsztacie w baszcie do stwardnienia
    (held_back_pending_hardening, t_090). Ulepszenia niewykonane.
- id: webber_anchored
  gender: female
  traits:
  - sadistic
  - subservient
  - shy
  voice_when_it_speaks: 'Cicha, krotka, chetna do przytakniecia - dopoki mowi do Lucana. Zupelnie inna,
    gdy mowi o tym, co robi pozostalym sieciarzom: wtedy jest dokladna i nie przeprasza. Nie prosi o pozwolenie
    na okrucienstwo i nie spodziewa sie zakazu.'
  development_direction: 'Yandere jako WZORZEC ZACHOWAN, nie jako watek fabularny. Wyjasnia, skad bierze
    sie jej okrucienstwo: nie jest sadyzmem bez adresu, jest zazdroscia - kazdy inny okaz dostaje uwage,
    ktora mogla byc jej. Uleglosc i niesmialosc sa prawdziwe i wylacznie dla Lucana. To sposob, w jaki
    brzmi i reaguje, a nie silnik wydarzen.'
  hard_limits:
  - NIE WOLNO JEJ REALNIE ZAATAKOWAC innego familiara. Wrogosc, zazdrosc, chlod, zlosliwosc, opieszalosc
    w pomocy - tak. Przemoc, sabotaz, uszkodzenie, usuniecie - NIE, dopoki gracz sam tego nie zadeklaruje.
  - Nie jest to glowna tresc kampanii i nie robi sie z tego watku. Ma byc wyczuwalna w jednym zdaniu na
    scene, nie napedzac scen.
  - Zadnej pelnej niezaleznosci jeszcze dlugo - patrz constraints.autonomy_horizon.
  contrast_with_the_moth: Obie sa "ona" i obie chca czegos od Lucana, ale nie wolno im brzmiec podobnie.
    Tkacz mowi za cicho i o nim; cma mowi za glosno i o sobie. Tkacz boi sie, ze przestanie byc potrzebna;
    cma nie dopuszcza mysli, ze mogloby jej sie cos nie naleze.
companion_class:
  source: Deklaracja gracza 2026-09-12, retcon_000179.
  what_it_is: 'SZCZEBEL PONAD OKAZAMI ZAKOTWICZONYMI. Byt z WLASNA WOLA, ktory sluzy Lucanowi z przywiazania
    i z tego, ze widzi w nim stworce, karmiciela i tego, kto go tu utrzymuje - nie dlatego, ze jest trzymany.
    Klasa istniala w plikach od dawna, tylko nienazwana: companion_varkhen nie wystepuje w anchored ani
    razu, stoi poza drabina wzrostu i poza autonomy_horizon, a jego stance to honorable_cautious_contractual_ally.'
  members:
    companion_varkhen: istniejacy, od milestone_046 (voluntary_oath_compact)
    planned: kot - direction_cat_as_created_companion
  the_veto:
    mechanism: Lucan ZACHOWUJE mozliwosc przejecia - u Varkhena jest to condition formal_control_link_unenforced
      (magnitude 70), czyli formalna wiez kontroli, ktorej nie egzekwuje. Weto istnieje i jest nieuzywane.
    cost: UZYCIE WETA NISZCZY RELACJE i nie jest darmowym przelacznikiem. To jest akt NAZWANY, z konsekwencja
      na osiach relacji, nie zmiana trybu pracy narzedzia. Z ich strony wymuszenie posluszenstwa jest
      naruszeniem woli - krzywda, nie poleceniem.
    lucans_preference: 'Lucan WOLI trzymac ich jako stalych kompanow, nie pionki. MOTYW NIE JEST USTALONY
      i narratorowi nie wolno go dopowiadac: czy chodzi o przywiazanie, czy o rachunek (pionek raz zlamany
      przestaje byc kompanem), pozostaje otwarte. Nie sprzeciwia sie to moralnosci komara - komar nie
      ma zdania o obcych, ale ma interes w tym, co sam zbudowal.'
  social_camouflage:
    principle: OSOBOWOSC JEST OSLONA, i to taka, ktorej nie da sie podrobic. Bezwolny zombie czyta sie
      jako trup pod kontrola - i to jest dla ludzi nie do przyjecia. Chowaniec z wlasna, irytujaca osobowoscia
      czyta sie jako chowaniec, nawet gdy jest martwy. Wiekszy nieumarly? Nie, to tylko stary Varkhen.
    why_it_holds: Bo pokrywa sie z KRYTERIUM AKADEMII, nie z zyczeniem Lucana. necromancy-law.yaml#construct_boundary
      mowi, ze Akademia klasyfikuje po mechanizmie, ciaglosci zycia i wiazaniu duszy, a jej obrona brzmi
      'living_modified_familiar_or_biological_construct_not_reanimated_dead'. Najmocniejszym dowodem na
      'chowaniec, nie zwloki' jest to, ze rzecz SIE SPRZECZA. Pacynka tego nie zaimprowizuje.
    where_it_does_not_help: U KOSCIOLA. Ten klasyfikuje po uzyciu energii smierci, martwej tkance i profanacji
      - osobowosc nie zmienia tam nic (necromancy-law.yaml#church_position). To nie jest luka w pomysle,
      tylko przypomnienie, ze oslona dziala wobec jednej strony, nie wobec wszystkich.
  open_gap_in_the_model: 'RELACJE SA JEDNOKIERUNKOWE. Wszystkie pliki w relationships/ maja subject =
    NPC, target = pc_lucan - mierzymy, co ONI mysla o Lucanie. To, co LUCAN trzyma wobec nich, nie jest
    modelowane nigdzie, a caly ten uklad na tym stoi. Nie dodaje pola sam: kierunek modelu to decyzja
    o schemacie, nie brakujaca liczba.'
