tannery_owner_papers_thread:
  source_event_id: player_query_2026_08_27_act_01_review
  status: dormant_never_closed
  summary: |
    Watek garbarni z Aktu 1 nigdy nie zostal domkniety. Lucan ma w baszcie papiery
    dokumentujace nielegalna hodowle okazow poprzedniego wlasciciela (Komora III, sluza,
    nocne transporty) ORAZ srebrna pieczec obecnego wlasciciela, ktory kazal mu te papiery
    przyniesc najpierw sobie i nigdy ich nie dostal. Obecny wlasciciel zyje i zna Lucana
    z nazwiska.
  why_it_reopens_now: |
    Nielegalna hodowla okazow to przedmiot otwartej disputy, a katedra Kolma to biomutanty.
    Papiery sa precedensem z Lumarii, ktory dotad nikt nie widzial.
  otwarte_pytania:
    - 'Do czego pasuje maly, zbyt porzadny kluczyk z plaszcza wlasciciela? Nierozwiazane
       od Aktu 1.'
    - 'ROZSTRZYGNIETE 2026-08-27 (retcon_000057): sygnet jelenia jest sladem po POPRZEDNIM
       wlascicielu I jednoczesnie lupem ze SKARBCA obecnego. Herb jest lacznikiem miedzy nimi.
       Gdy wyplynie, wlasciciel wie, ze okradla go gildia albo Lucan. Ponizszy zapis o
       rozbieznosci zostaje jako historia pytania.'
    - 'HISTORIA PYTANIA: zrodlo Aktu 1 notuje przy
       garbarzu TRZY DO CZTERECH sygnetow (zapasowy w mieszkaniu, dwa w wylamanej kasetce)
       plus dokument herbowy, akty wlasnosci, weksle, klejnoty i zloty lancuszek. W dzisiejszym
       inventory.yaml jest JEDEN sygnet - item_three_arrow_deer_signet (jelen przebity trzema
       strzalami, herb nierozpoznany, research otwarty) - i jest on przypisany do lupu AKTU 2
       (luka-c-act-02-closeout + event_turn_interlude_004). Nie wiadomo, czy sygnety garbarza
       zostaly cicho skonsolidowane w container_interlude_loot_pile, czy zginely w migracji.
       NIE zlepiac tych dwoch rzeczy samemu - jesli jelen jest sygnetem garbarza, to herb ma
       nazwisko i caly watek dwoch wlascicieli otwiera sie jednym rzutem na heraldyke.'
    - 'Druga kasetka ze skrytki zostala WYLAMANA lomem, nie otwarta kluczem - wiec jeden z
       kluczy, ktore Lucan nadal ma, do niczego u niego nie pasowal.'
    - 'Czy poprzedni wlasciciel zyje i czy ktos poza Lucanem wie o Komorze III?'
    - 'Czy podziemia zamkniete przez ekipe A-rank gildii zostaly zamkniete NA STALE.'
  ref: campaigns/lucan/planning/act-03-anticipated-shape.yaml#strony_fazy_fizycznej
