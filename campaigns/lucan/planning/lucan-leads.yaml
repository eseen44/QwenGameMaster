schema_version: 1
id: lucan_player_leads
name: Notatnik Lucana — tropy i pomysły do sprawdzenia
status: living_list
purpose: Luzna lista rzeczy, o ktorych Lucan chce pamietac, zeby wrocic do nich
  pozniej. To nie sa aktywne cele (patrz state/objectives.yaml) - dopoki gracz nie
  zadeklaruje konkretnego dzialania poza nawiasem, nic tu nie przesuwa czasu ani
  nie zmienia swiata. Wpisy dopisuje/zamyka narrator na jawna prosbe gracza.
leads:
  - id: lead_signet_heraldry_research
    logged_event_id: event_turn_interlude_004_loot_pile_review
    topic: Ustalic, do jakiego rodu nalezy stary sygnet (jelen przebity trzema strzalami)
    note: Rozpoznanie herbu nie powiodlo sie (roll_turn_interlude_004_signet_recognition,
      28 vs 55) - Lucan wie ze to autentyczny stary rod szlachecki, ale nie moze
      przypomniec sobie ktory. Potrzebny research (archiwum, ktos kto zna heraldyke)
      zanim podejmie decyzje o falszowaniu nim pieczeci.
    ref: campaigns/lucan/player/inventory.yaml#item_three_arrow_deer_signet
    status: open
  - id: lead_arachnid_donor_parts
    logged_after_event_id: event_turn_interlude_004_loot_pile_review
    topic: Znalezc czesci ciala duzych pajeczakow jako dawce do naprawy/regeneracji
      kikuta odnoza Spideya
    note: Przygotowanie leczenia zajmie chwile i potrzebny bedzie dawca odpowiedniej
      wielkosci - trudno o to szybko. Lucan wola pajecze zrodlo niz ludzki albo
      potworny palec ("bardzo ble").
    update: 'ZRODLO WSKAZANE (event_turn_interlude_018_father_construct_pitch): ojciec
      obejrzal kikut i postawil diagnoze - zaslepic sie nie da, potrzebny material dawcy
      o zblizonej skali i budowie, inaczej staw nie utrzyma obciazenia. Wskazal zbiory
      okazow Akademii i jej stale dostawy zywego towaru jako droge do odnoza wielkiego
      pajeczaka, bez targowania sie na targu. NIE podal warunkow i nie zapytal, czy
      Lucan ma prawo o cokolwiek z tych zbiorow prosic - to jest dokladnie ten dostep,
      za ktory Akademia normalnie chce czegos w zamian.'
    status: open
  - id: lead_webber_passive_listening
    logged_after_event_id: event_turn_interlude_004_loot_pile_review
    topic: Nauczyc siec zbierac dzwiek z drgan zostawionej pajeczyny, zeby podsluchiwac
      rozmowy stron bez obecnosci Lucana w pokoju
    note: Zostawianie nieumarlego sieciarza w pokoju z kaplanem podczas przesluchan
      to przesada. Cel to podsluch przez sama, pozostawiona pajeczyne - przydatne
      przy zblizajacych sie przesluchaniach instytucjonalnych. Gracz sygnalizuje
      tez wlasny, osobisty brak techniki podsluchu (nie tylko przez siec) -
      ability_borrowed_sense dziala tylko przez linked servant, wiec to osobna luka.
    related_ref: system/companion-growth.md
    status: open
  - id: lead_countermeasure_vs_cemetery_ghost
    topic: Znalezc/opanowac cos co realnie dziala przeciw duchowi/genius loci cmentarza
    note: 'Podczas incydentu z Orenem (milestone_045-okolice, "glodny duch/genius
      loci cmentarza") zaden ze znanych srodkow Lucana nie mial na niego bezposredniego
      zastosowania - Numb posluzyl tylko do spacyfikowania Orena, nie samego ducha.
      Powiazane z juz istniejacym discovering: research_cemetery_heart_signature
      w player/abilities.yaml oraz z collector_heart_and_three_seals (dlugoterminowe
      zobowiazanie wobec Varkhena). AKTUALIZACJA (event_turn_interlude_010_reliquary_geo_scan):
      item_church_reliquary w player/inventory.yaml to potwierdzona, dzialajaca
      konsekrowana warda przeciw nieumarlym - realny, gotowy kandydat na to
      narzedzie, jesli Lucan zdecyduje sie go zatrzymac zamiast spieniezyc.'
    related_ref: campaigns/lucan/player/abilities.yaml#research_cemetery_heart_signature
    status: open
  - id: lead_noble_seeming_magic
    topic: Opanowac podstawy magii/techniki, ktora przekonuje innych ze Lucan jest
      "glaboko szlachetny" - swietoszkowata aura/glamour do przesluchan i polityki
    note: Lucan byl kiepskim studentem magii, ale ocenia ze cos na tym poziomie powinno
      byc w zasiegu. Zaden z obecnych ability_* w player/abilities.yaml nie robi
      nic w tym kierunku (najblizsze to misnotice/confusion - to inna kategoria,
      spoleczna manipulacja percepcji, nie autorytet/pobozny wizerunek).
    related_ref: campaigns/lucan/state/objectives.yaml#objective_prepare_institutional_defense
    status: open
  - id: lead_physical_technique_or_buff
    topic: Nauczyc sie realnej techniki walki wrecz/z bronia albo lepszego wzmocnienia
      fizycznego, zamiast polegac tylko na szabli jako przewodniku Bone Chill
    note: 'Gracz zauwaza ze uzywal szabli wylacznie jako przewodnika zimna ("rownie
      dobrze moglbym pacac ludzi pretem"). Istnieje juz ability_vital_overdrive
      (dorywcze wzmocnienie sily/szybkosci, jeden wybuch, first-level) - to
      naturalny punkt startowy do rozwiniecia w cos trwalszego lub w faktyczna
      technike walki, nie tylko emergentny efekt uboczny.'
    related_ref: campaigns/lucan/player/abilities.yaml#ability_vital_overdrive
    status: open
  - id: lead_more_curses
    topic: Nauczyc sie wiecej klatw - dotychczasowe (Numb, Minor Hex, Confusion,
      Misnotice, Minor Bad Luck) pokonaly zaskakujaco silnych przeciwnikow tylko
      dlatego, ze nikt sie przed klatwami nie broni
    note: Gracz wprost formuluje to jako strategie do dalszego eksploatowania -
      progression_curses_and_misdirection jest obecnie w zakresie E_to_low_D.
    related_ref: campaigns/lucan/player/progression.yaml#progression_curses_and_misdirection
    status: open
  - id: lead_webber_silk_upgrade_human_scale
    logged_after_event_id: event_turn_interlude_004_loot_pile_review
    topic: Ulepszyc nic sieciarzy tak, zeby dalo sie nia oznaczac, usypiac/znieczulac
      albo zabijac ludzi (nie tylko drobne owady), pod pulapki
    note: Obecna niedostatecznosc - nic wystarcza na muchy, czlowiek jej nawet nie
      zauwaza. Rozwiniecie tego otworzyloby granie w pulapki.
    related_ref: system/companion-growth.md
    status: open
  - id: lead_market_run_spidey_parts_and_exotic_creatures
    topic: Wyprawa na targ po nowe czesci dla Spideya i bardziej egzotyczne zwierzatka
      do ozywienia
    note: 'SPRAWDZONE (event_turn_interlude_014_market_beast_row_search): zwykle
      stragany nie maja i nie miewaja zywych duzych pajeczakow. Zwierzecy rzad to
      ssaki, ptactwo i drobnica na przynete. Zostaly trzy konkretne drogi -
      (a) handlarz zywego towaru dla alchemikow na koncu rzedu: skorpiony, duze
      chrzaszcze, czasem pajaki z karawan poludniowych, tylko na zamowienie, z
      zaliczka, zapisem i pytaniem po co; (b) darmowe nocne lowy w piwnicach,
      spichlerzu i na zapleczu rzeznickim wokol rynku, gdzie duzych pajakow
      piwnicznych i chrzaszczy padlinozernych jest w nadmiarze; (c) jedwabniki na
      wage u kupca jedwabniczego - masowo, legalnie, nudno.'
    status: open
  - id: lead_expand_creature_pool_insects_only
    logged_event_id: event_turn_interlude_014_market_beast_row_search
    topic: Rozszerzyc pule wlasnych stworzonek, ale trzymac sie owadow i pajeczakow -
      nie ssakow
    note: 'Doktryna gracza, wypowiedziana wprost: czlowiek nie odroznia martwego
      chodzacego owada od zywego, natomiast przy ssaku odroznia od razu. Owad jest
      wiec jedyna forma, ktora moze chodzic po miescie w bialy dzien bez zdradzania
      nekromancji - co przy zblizajacych sie przesluchaniach instytucjonalnych ma
      wartosc operacyjna, nie tylko estetyczna. Kierunek rozwoju: wiekszy rozmiar i
      wiekszy sklad, nie inna klasa zwierzat.'
    related_ref: campaigns/lucan/state/secrets.yaml#secret_necromantic_spider_network
    status: open
  - id: lead_new_practice_creature
    topic: Zdobyc nowe stworzenie do cwiczen - krolik jest juz zniszczony (zezarl
      sobie zeby o preciy klatki od nadmiaru konfuzji)
    status: open
  - id: lead_geo_extension_beyond_graveyard_and_dead
    topic: Rozszerzyc Geo (Grave Sense / czucie drgan i pustek) poza ziemie i zmarlych
      - obecnie dziala tylko na cmentarzu
    status: open
  - id: lead_tannery_owner_followup
    topic: Sprawdzic co sie dzieje z wlascicielem garbarni (milestone_022_owner_exposed_and_detained)
      - Lucan probowal kiedys wyludzic od niego dodatkowe wynagrodzenie (napisana
      skarga) i nadal ma klucz do jego prywatnego mieszkania w garbarni
    note: 'Gracz sygnalizuje mozliwy dlugoterminowy cel: gdyby wlasciciel zniknal
      permanentnie, gildia moglaby przejac teren, a Lucan uzyskac pretekst do "izolacji
      nieumarlego" (tzn. zamieszkania tam) - podziemia bez zmutowanych szczurow
      brzmia kuszaco. Zaden dedykowany plik NPC dla wlasciciela jeszcze nie istnieje;
      ostatni znany stan to "exposed_and_detained" z milestone_022 - biezacy status/miejsce
      pobytu nie ustalone.'
    rumour_unconfirmed: 'PLOTKA, NIE AKTA (event_turn_interlude_023_night_return_to_guild).
      Weteran przy piwie w glownej sali gildii mowi, ze sprawa stanela i ze wlasciciel
      NIE siedzi - wyszedl, a nikt nie umie powiedziec, czy z braku dowodow, czy za
      pieniadze; w miescie, ktore w jednym miesiacu dostalo mutanty, trupy i cmentarz,
      mniejsze sprawy przestaja miec kto sie nimi zajac. JESLI to prawda - teren garbarni
      nadal jest jego, klucz do jego prywatnego mieszkania nadal jest u Lucana, a Lucan
      nadal jest tym, kto napisal na niego skarge. Do potwierdzenia w aktach, ktore ida
      przez dzien.'
    status: open
  - id: lead_read_seraphines_official_report
    logged_event_id: event_turn_interlude_015_silkworms_and_specimen_order
    topic: Zobaczyc, co Seraphine faktycznie napisala w oficjalnym raporcie z
      operacji cmentarnej
    note: 'Lucan zaklada, ze fakt odciazenia transmitera na cmentarzu jest w
      oficjalnych aktach gildii i ze inne frakcje w koncu je przeczytaja. Tresc
      raportu Seraphine wyznacza wiec punkt startowy kazdej pozniejszej linii
      obrony - warto wiedziec, co tam stoi, zanim to przeczyta ktos z Akademii,
      Kosciola albo magistratu. Relacja daje na to szanse
      (obligation_conditional_cover, discretion_trust 15 - niskie), ale prosba o
      wglad sama jest sygnalem, ze Lucan sie tym przejmuje.'
    related_ref: campaigns/lucan/relationships/seraphine--lucan.yaml
    status: open
  - id: lead_find_father_and_academy_expert
    logged_event_id: event_turn_interlude_015_silkworms_and_specimen_order
    topic: Odnalezc ojca (akademika) i przez niego lub obok niego zdobyc eksperta
      Akademii do obrony klasyfikacji "Spidey = konstrukt"
    note: 'PROBLEM WEJSCIOWY - Lucan nie wie, gdzie ojciec teraz jest.
      npc_lucan_father ma current_location_id:unknown i importance
      background_only_not_yet_appeared_in_play, a background.yaml trzyma
      current_status_and_location_of_father_mother oraz names_of_father_mother
      na liscie unknown_not_to_invent_silently - wiec ustalenie tego jest osobnym
      dzialaniem w grze, nie zalozeniem. Realne drogi to stare listy/adres z czasow
      edukacji, rejestry akademickie albo glowna linia rodu Veyr
      (faction house-veyr-main-line - ta droga jest trujaca, to oni podcieli mu
      edukacje). DRUGI KANAL, niezalezny od ojca
      (event_turn_interlude_015): handlarz zywego towaru dla alchemikow na targu
      mowi, ze Akademia jest jego najwiekszym i stalym odbiorca okazow - czyli da sie
      dojsc do akademika przez dostawce, bez rodziny.'
    update: 'POSTEP (event_turn_interlude_016_walk_to_academy): ustalone, ze Akademia
      Magii Lumarii to ta sama instytucja, w ktorej Lucan studiowal, i ze byl tam
      ostatnio dwa lata temu. Dotarl pod brame po ciemku. Zmiany - jest portiernia z
      ksiega odwiedzin (kiedys wchodzilo sie z ulicy), stary portier prawie go
      rozpoznaje, przybudowka studencka przebudowana, jedno okno swieci w skrzydle
      laboratoryjnym dokladnie tam, gdzie pracowal ojciec (wniosek z nawyku, nie
      potwierdzenie obecnosci). Na tablicy wisi zapowiedz otwartej dysputy o
      klasyfikacji ozywionych konstruktow - Akademia zajmuje pozycje na tej granicy
      publicznie i zawczasu. Koszt wejscia - Lucan nie jest studentem, wiec wpis do
      ksiegi oznacza nazwisko Veyr z data, trzy dni przed spodziewanym wezwaniem gildii.'
    offprint: 'ZNALEZIONA (event_turn_interlude_021_timetable_and_offprint) - lezala pod
      czyms zielonym, dokladnie tam gdzie ojciec mowil. Tekst caly, OKLADKI NIE MA -
      zostala kiedys wydarta i uzyta jako zakladka, wiec nazwiska autora nie ma nigdzie
      na tym egzemplarzu, a ojcu tez nie wraca z glowy. Wie natomiast, gdzie ta osoba
      pracuje, i wie, ze dzis jej tu nie ma (caly budynek wygaszony poza jednym oknem).
      Spotkanie najwczesniej jutro. Dwie drogi - ojciec zaprowadza albo pisze slowo
      (szybko, ale sprawa od razu staje sie oficjalna i akademicka), albo Lucan podchodzi
      sam, na wlasnych warunkach, bez sladu, tak jak wszedl.'
    identified: 'NAZWISKO USTALONE (event_turn_interlude_022_notice_board_identification) -
      npc_neris_aldhen, referentka szerokiej definicji, dysputa za ok. 16 dni; oponentem
      jest npc_ivar_kolm ze stanowiskiem waskim. Gracz zdecydowal, ze nie wraca po nic do
      ojca ("ten czlowiek nie wie jak sam sie nazywa") i szuka Aldhen jutro, samodzielnie.'
    related_ref: campaigns/lucan/entities/factions/lumaria-magical-academy.yaml
    status: open
  - id: lead_two_contradictory_defences
    logged_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer
    topic: Rozstrzygnac, ktora obrona jest glowna - klasyfikacyjna czy karna - bo one
      sobie przecza
    note: 'Uwaga Seraphine. Prawnik z ulicy (ten "mafijny", spotkanie z Borosem i Mara)
      zna urzednikow magistratu, nie Akademie. Obrona KLASYFIKACYJNA mowi "to nie byla
      nekromancja, to konstrukt" i potrzebuje akademika. Obrona KARNA mowi "nawet jesli,
      to nie ma przepisu i nie ma dowodu" i potrzebuje kogos, kto zna forum i urzednikow.
      Te dwie linie sobie przecza - wybor jednej oslabia druga, bo pierwsza przyznaje, ze
      klasyfikacja ma znaczenie, a druga, ze czyn mial miejsce. Do rozstrzygniecia PRZED
      przesluchaniem (za ok. dwa tygodnie) i przed dysputa (za ok. 16 dni).'
    status: open
  - id: lead_varkhen_as_witness_against_the_priest
    logged_event_id: event_turn_interlude_028_lucan_dismantles_the_charges
    topic: Uzyc zeznania Varkhena o kaplanie jako broni przeciw Kosciolowi
    note: 'Wskazane przez Seraphine jako koszt, ktorego Lucan nie policzyl. Varkhen jest
      JEDYNYM swiadkiem tego, ze kaplan znal wlasciwe wejscie, kontrolowal pieczecie i przy
      ostatniej wizycie przyszedl z Orenem (fact_seraphine_knows_priest_visited_varkhen_with_oren,
      milestone_047). Wniosek strategiczny - wyzerowanie Varkhena rzeczywiscie usuwa wiez i
      dowod przeciw Lucanowi, ale rownoczesnie niszczy jedyna bron Lucana przeciw Kosciolowi.
      Haczyk do rozwiazania: zeznanie nieumarlego jest samo w sobie dowodem, ze Lucan obcuje z
      nieumarlym, a doktrynalnie Kosciol i tak go nie uzna - wiec trzeba znalezc sposob
      przelozenia tej wiedzy na dowod, ktory nie ma Varkhena jako zrodla.'
    related_ref: campaigns/lucan/entities/factions/lumaria-church.yaml
    status: open
  - id: lead_who_in_the_family_wants_a_quiet_settlement
    logged_event_id: event_turn_interlude_028_lucan_dismantles_the_charges
    topic: Ustalic, kto konkretnie w glownej linii rodu Veyr mialby interes w cichym
      zamknieciu sprawy Lucana
    note: 'Seraphine: rod nie bedzie bronil Lucana, bedzie bronil NAZWISKA, a najtansza
      metoda jest ciche zamkniecie na ich warunkach, w ktorym cena to on. To ci sami ludzie,
      ktorzy nie interesowali sie nim, dopoki nie dalo sie na nim zarobic
      (background_main_family_line_opportunistic). Powiazane z
      faction house-veyr-main-line oraz z lead_signet_heraldry_research.'
    related_ref: campaigns/lucan/entities/factions/house-veyr-main-line.yaml
    status: open
  - id: lead_church_linked_academics_and_the_seal_priest
    logged_event_id: event_turn_interlude_029_academy_as_civic_risk
    topic: Ustalic nazwiska ludzi zwiazanych z Kosciolem na Akademii i sprawdzic, czy to ten
      sam interes co kaplan od pieczeci
    note: 'Zamowione przez Seraphine. Osoby zwiazane z Kosciolem na uczelni daza do
      ograniczenia badan nad ozywionymi konstruktami - to jest strona npc_ivar_kolm. Pytanie
      Seraphine, ktorego nie stawia jako tezy - czy to ten sam interes co kaplan, ktory znal
      wlasciwe wejscie do komory Varkhena, kontrolowal pieczecie i przy ostatniej wizycie
      przyszedl z Orenem (fact_seraphine_knows_priest_visited_varkhen_with_oren). Jesli tak,
      spor o klasyfikacje i sprawa cmentarza to jedna operacja, nie dwie.'
    related_ref: campaigns/lucan/entities/factions/lumaria-church.yaml
    status: open
  - id: lead_contact_the_broad_definition_faction_invisibly
    logged_event_id: event_turn_interlude_029_academy_as_civic_risk
    topic: Dotrzec do frakcji szerokiej definicji jako niewidzialne zrodlo, nie jako widoczny
      sojusznik
    note: 'Gracz zapowiedzial kontakt z frakcja pro-trupia (npc_neris_aldhen i jej strona),
      motywowany strachem przed realna eskalacja - Akademia pozbawiana dorobku to grupa
      pojedynczo groznych ludzi. Seraphine skorygowala prognoze: magowie nie sa blokiem, nie
      podpala miasta, wygrywaja proceduralnie - ale dwa czy trzy pojedyncze incydenty daja
      panike, a panika nie jest zamieszkami, panika jest PRETEKSTEM, i pretekstu potrzebuje
      Inkwizycja, nie Akademia. Warunek Seraphine - chce wiedziec ZANIM Lucan skontaktuje sie
      z ktorakolwiek strona (obligation_advance_warning_before_contacting_either_side).'
    related_ref: campaigns/lucan/entities/npcs/neris-aldhen.yaml
    status: open
  - id: lead_watch_side_corpse_transport
    logged_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    topic: Rozwinac lead o osobach zwiazanych z transportem zwlok po stronie STRAZY
    note: 'Gracz zglosil istnienie leadu, ale swiadomie NIE oddal go Seraphine - zamierza
      szantazowac obie strony i jej tego nie powiedzial. Seraphine i tak wyciagnela z samego
      istnienia leadu wniosek, ktorego Lucan nie szukal: jesli ludzie ze strazy siedza w
      transporcie zwlok, to zadanie sluzb miejskich, zeby przekazano im ciala, akta i dowody
      z operacji cmentarnej, ma drugie czytanie - moga chciec materialu nie po to, zeby
      prowadzic sprawe, a po to, zeby go pochowac. Gildia, opierajac sie od tygodnia, przez
      caly czas chronila dowody przed ludzmi, ktorych te dowody dotycza, nie wiedzac o tym.'
    critical_open_question: 'Pytanie Seraphine bez odpowiedzi
      (event_turn_interlude_033_veyr_is_not_a_family) - jesli fotele w instytucjach sa
      obsadzone tak, jak opisuje Lucan, to czy ta siec jest w ogole scigana, czy TOLEROWANA
      przez kogos wystarczajaco wysoko? W drugim wypadku lead celuje w jego wlasny system, a
      szantaz oparty na tym nie jest dzwignia - jest zgloszeniem sie do kolejki. Sprawdzic
      PRZED jakimkolwiek uzyciem leadu.'
    seraphine_probe_offered:
      source_event_id: event_turn_interlude_034_the_watch_is_an_unknown
      text: 'Lucan przyznal, ze nie wie nic o tej strazy - jeden zepsuty glina czy caly
        komisariat - i ze musialby sie tam przejsc. Seraphine zdjela z niego ten spacer:
        pomiar juz trwa. Zadanie sluzb miejskich o ciala, akta i dowody wraca od TYGODNIA,
        a prosba jednego czlowieka umarlaby na biurku po dwoch dniach - wiec za zadaniem
        stoi fotel, nie czlowiek. Nie nazywa tego dowodem; nazywa, na co patrzec: kto
        podpisze nastepne zadanie, na jakim szczeblu i jak szybko wroci, kiedy ona
        przewlecze je jeszcze raz. Probe idzie z wnetrza JEJ sprawy, bez ekspozycji Lucana.
        Cena, ktorej bedzie chciala: wiedziec ZANIM lead zostanie uzyty (analogicznie do
        obligation_advance_warning_before_contacting_either_side). Osobno ostrzegla, ze
        wejscie na komende JEST zdarzeniem widocznosci dla aktywu niezarzadzanego, a w
        tylnym pokoju komendy ona nie ma zadnej pozycji. NASTEPNA TURA (035): Lucan probe
        skwitowal - nie wydaje mu sie, zeby ugrala nia cokolwiek na wyzszym poziomie, a
        Seraphine mu to PRZYZNALA. Probe nie jest dzwignia, jest odczytem klasy rzeczy,
        ktora Lucan trzyma.'
    witness_becomes_a_party:
      source_event_id: event_turn_interlude_034_the_watch_is_an_unknown
      text: 'Lucan powiedzial na glos, ze nie boi sie aresztu, tylko spodziewa sie
        transakcji za milczenie. Seraphine wylozyla koszt prawny, ktory nalezy do niej:
        swiadek negocjujacy milczenie przestaje byc swiadkiem i staje sie STRONA. Rzecz
        sprzedana staje sie rzecza do postawienia w zarzucie, a kazde pozniejsze slowo
        Lucana o tych ludziach jest zeznaniem czlowieka, ktory raz sprzedal milczenie -
        co niszczy jego jedyna darmowa oslone, czyli to, ze jego relacji nikt nie wycenil.
        Wniosek operacyjny: transakcje za milczenie sklada sie OSTATNIA, nie pierwsza.
        Zauwazyla przy tym drugi raz tej nocy, ze Lucan wymienil aktyw i nie powiedzial,
        ze go oddaje.'
    disclosed_to_seraphine:
      source_event_id: event_turn_interlude_035_the_permit_disclosed
      text: 'Lucan oddal Seraphine TRESC leadu, nie samo istnienie: glejt to
        item_watch_transport_permit - autoryzacja TRASY wozu, czytelna pieczec i nazwa
        urzedu oraz typ autoryzacji, nieczytelne nazwisko podpisujacego i data. Jego
        wycena: bezwartosciowy haczyk do zaczecia dochodzenia, nie konkretna osoba, plus
        dedukcja o pozwoleniach in blanco (poziom kontroli na targu vs ciala wyjezdzajace
        miesiacami). SERAPHINE ODWROCILA TE WYCENE: brak nazwiska to nie slabosc, to
        ustalenie. Nazwisko urzad oddaje bez mrugniecia; blankietu oddac nie da sie, bo nie
        ma glowy, ktorej scieciem sprawa sie konczy - blankiet znaczy, ze urzad wystawia
        wladze bez atrybucji, a defektu instytucja broni twardziej niz czlowieka. Drugi
        wniosek: odkad urzad wie, ze taki dokument istnieje POZA nim, musi zalozyc, ze
        jest ich wiecej, bo blankietow nie da sie odwolac, jesli nie da sie ich zliczyc.
        KOSZT DLA NIEJ: teraz wie i nie da sie tego odwiedziec - jest adwokatka gildii
        opierajaca sie zadaniu o wydanie materialu i jedyna osoba swiadoma, ze czesc
        materialu lezy u jej klienta. Rano staje przed sluzbami miejskimi.'
    lucan_declared_objectives:
      source_event_id: event_turn_interlude_035_the_permit_disclosed
      text: 'Cel gracza wypowiedziany na glos: (a) znalezc kogos, kto na wiadomosc o
        istnieniu glejtu SPANIKUJE, albo (b) wbic sie w sledztwo po stronie sluzb.
        Seraphine rozebrala (a): panika w takiej strukturze idzie DO GORY, nie w strone
        Lucana - konstabl, ktory spanikuje, nie ma czym zaplacic i zamelduje temu, kto ma
        czym zakopac, wiec Lucan wykonalby audyt za urzad i dostal za to nic. (b) nazwala
        jedynym powaznym pomyslem, bo ma legalne formy: swiadek, informator albo droga
        przez spor gildii o dowody, w ktorym ONA ma pozycje. Cena (b): bycie w ich
        sledztwie znaczy bycie w ich AKTACH - ten sam problem co seminarium, rzeczy ktore
        zapisuja sa gorsze od tych, ktore sadza. UWAGA na presje po ich stronie -
        faction_lumaria_civic_services ma aktywna identify_responsibility_for_missing_bodies,
        wiec wiadomosc o glejcie nie wpada w pustke, tylko do juz toczacego sie szukania
        kogos, na kogo to spisac.'
    provocation_doctrine_and_its_limits:
      source_event_id: event_turn_interlude_037_every_signature_has_a_room
      text: 'DOKTRYNA GRACZA, wypowiedziana wprost: podraznic lwa, zobaczyc kto przyjdzie
        zabic, potem go okrasc; a skoro decyzji nie da sie okrasc, to kazda decyzja ma
        podpis, kazdy podpis ma pokoj, kazdy pokoj to lista ludzi, ktorych wystarczy
        wkurzyc, zeby robili glupoty. Seraphine przyznala mechanizm i dar Lucana, ale
        wyznaczyla granice, ktora warto trzymac przy planowaniu: prowokacja daje glupote
        PROWOKOWANEGO, nie glupote wybrana przez Lucana - urzednik prowadzacy urzad zamyka
        teczke i czlowieka, i robi to personelem, a podrazniony urzad produkuje papier, nie
        rabowalny blad. TRZY WARUNKI, w ktorych prowokacja placi: prowokowany musi
        zareagowac (a) publicznie, (b) w wyznaczonym terminie, (c) przy widowni, ktora widzi
        reakcje. Urzad zezwolen nie spelnia zadnego. Otwarta dysputa za ok. 16 dni spelnia
        wszystkie trzy i ma wyznaczonego oponenta (npc_ivar_kolm), ktory MUSI zareagowac -
        Seraphine wskazala publiczna dyskusje na Akademii jako wlasciwe miejsce na ten dar,
        nie znajac przy tym ani dysputy, ani planu wystawienia okazow.'
    related_ref: campaigns/lucan/entities/factions/lumaria-civic-services.yaml
    status: open
  - id: lead_relic_claimant_is_a_deadline
    logged_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    topic: Ustalic, kto i kiedy zglosi sie po relikwiarz
    note: 'Seraphine domyslila sie od razu, ze rzecz jest koscielna, i nie pytala o
      szczegoly - nazwala natomiast to, czym relikwiarz naprawde jest. Rzecz, po ktora ktos
      sie zglosi, nie jest aktywem, jest TERMINEM. Ktos jej juz szuka, a Lucan nie zna daty.
      Gracz nie oddaje przedmiotu, bo zamierza go uzyc jako dzwigni wobec Kosciola.'
    related_ref: campaigns/lucan/player/inventory.yaml
    status: open
  - id: lead_tannery_owner_surety_and_who_paid_it
    logged_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    topic: Ustalic, na jakiej podstawie garbarnik wyszedl i kto zlozyl poreczenie
    note: 'Wersja Seraphine, mocniejsza niz plotka z sali: gildia oddala dokumenty i tam jej
      udzial sie skonczyl, sprawa poszla do sluzb miejskich i tam stanela - ale NIE dlatego,
      ze go uniewinniono. Wyszedl za poreczeniem albo po prostu dlatego, ze nie bylo komu
      tego prowadzic, gdy ten sam urzad dostal na biurko handel zwlokami. Sprawa jest
      formalnie OTWARTA. Wniosek: teren nadal jego, on zywy i urazony, ma prawo wiedziec, kto
      napisal skarge, a dom przypisany do otwartego postepowania mozna legalnie przeszukac z
      nakazem. Do ustalenia: kto zlozyl poreczenie - jesli ktokolwiek.'
    related_ref: campaigns/lucan/entities/npcs/index.yaml
    status: open
  - id: lead_spy_spider_population
    logged_event_id: event_turn_interlude_075_sorting_the_night_haul
    topic: Zbudowac znacznie wieksza populacje malych pajakow-szpiegow
    note: 'Zamiar zadeklarowany przez gracza przy przebieraniu nocnego urobku, dzien 1
      interludium wieczor, i doprecyzowany poza gra tego samego wieczora. ARCHITEKTURA (wersja
      gracza, przyjeta): setki okazow w trybie zdalnym, samodzielnie polujacych; Lucan
      przetwarza swiadomie tylko jeden, moze kilka; reszta rozlozona po sieciarzach po 2-3 na
      sztuke, sieciarze odpowiadaja Spideyowi. Ciala NIE sa waskim gardlem - pajak piwniczny
      jest w kazdej piwnicy Lumarii, sieciarze dowioza tyle samo kazdej nocy. Ozywienie ciala
      owadziego to koszt formalny, nie rezerwa. CO REALNIE OGRANICZA: (1) OKNO SWIEZOSCI -
      urobek starzeje sie w dobe, wiec produkcja musi iterowac codziennie albo material idzie
      na czesci; (2) PASMO LACZA SIECIARZA - communication to thread_break_signal +
      minimal_status, wiec sieciarz nie jest jeszcze wezlem; dowod juz w plikach: rozkaz
      order_collect_live_specimens_from_posts zostal zdegradowany do "lapac male rzeczy, nosic
      do baszty", a dla garbarni i wysypiska dodatkowo degraded_by_distance. Wezel trzeba
      wypracowac: 8 x 1.5^n GODZIN przy stole, czyli 8 godzin za pierwszego sieciarza, bez
      kosztu energetycznego (retcon_000017) - konkuruje z godzinami na wabika, nie z rezerwa; (3) STRATY PROPAGACJI - patrz companions/webber-network.yaml
      network_cost_model, 20-30 procent na przeskok i mnozne, wiec plaska topologia jest tania
      a gleboka hierarchia droga; (4) DOWOD RZECZOWY - jedyna rzecz rosnaca liniowo z liczba
      okazow, nie energetyczna a prawna. WARIANT ZA ZERO, dostepny natychmiast: 2-3 szpiegi
      meldujace sie wprost do Spideya (autonomy simple_independent_planning, sortowanie juz
      raz delegowane w 015) - bez ulepszen, ograniczenie wylacznie geograficzne, bo Spidey
      chodzi z Lucanem. WYCOFANE jako naciagane: teza, ze polowanie kilkudziesieciu owadzich
      okazow przetrzebia zdobycz albo tworzy dostrzegalny wzor - nie tworzy.'
    related_ref: campaigns/lucan/companions/webber-network.yaml#network_cost_model
    status: open
