  - id: lead_well_diggers_read_stone
    logged_event_id: event_turn_interlude_081
    topic: Rozszerzenia Geo poza cmentarz nie ma w zadnej ksiazce - kamien czytaja zawodowo
      kamieniarze i STUDNIARZE
    note: 'Studniarz w miescie, pod ktorego gildia biegna kanaly, jest tropem podwojnym:
      uczy czytania kamienia poza cmentarzem i wie, gdzie pod Lumaria sa pustki i woda.
      Lucan ma juz progression_practical_masonry, wiec wchodzi w rozmowe jako fachowiec.'
