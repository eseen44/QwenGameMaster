    logged_event_id: event_turn_interlude_081
    topic: Srodkow przeciw wykryciu nie ma w jawnym obiegu targowym
    note: 'To material Kosciola i Akademii. Jesli cokolwiek z tej kategorii chodzi po
      targu, chodzi zapleczem (zone_market_back_alleys), bez katalogu i bez zapisu.
