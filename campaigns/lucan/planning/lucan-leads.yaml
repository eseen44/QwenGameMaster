    note: 'Pytal cicho i nie targowal sie, wiec Hesk pamieta go slabo. Lucan ma na glowie
      trzy pieczecie Varkhena i kaplana od pieczeci; ktos jeszcze w Lumarii szuka tego samego
      i szuka tego TANIO, czyli nie ma dostepu do biblioteki Kosciola ani Akademii.'
    related_ref: campaigns/lucan/planning/lucan-leads.yaml#lead_church_linked_academics_and_the_seal_priest
