    topic: Chlopiec na posylki w liverii kupuje dla kogos, kto sam nie przychodzi - tego
      samego dnia kazdego miesiaca
    note: 'Hesk nie zna heraldyki i nie poda barwy, ale podal rzecz operacyjnie lepsza:
      TERMIN. To nie nazwisko, to data - a Lucan ma osiem chrzaszczy siedzacych za darmo w
      smietnikach dzielnicy i zerowy kanal raportowania. Obserwacja straganu w znany dzien
