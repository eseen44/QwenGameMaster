    related_ref: campaigns/lucan/planning/lucan-leads.yaml#lead_want_list_livery_boy_monthly
    status: open
  - id: lead_library_marked_volume_disposition
    logged_event_id: event_turn_interlude_083
    topic: W skrzyni jest tom z wypalona biblioteczna sygnatura - wlasnosc instytucji, nie
      balwierza
    note: 'Posiadanie sledzalne do instytucji, ktora go stracila. Do rozstrzygniecia: oddac,
      sprzedac, zniszczyc sygnature albo trzymac. Sygnatura mowi tez, KTORA biblioteka
      stracila tom i kiedy balwierz mial do niej dostep.'
    status: open

  - id: lead_lamp_and_jar_instead_of_hunters
    logged_event_id: event_turn_interlude_088
    topic: Cmy same leca do swiatla - lampa i sloik w baszcie zbieraja wiecej CALYCH okazow
      niz czterech sieciarzy
    note: 'Sieciarz lowi w siec i gryzie, a u cmy skrzydla sa cala wartoscia i niszcza sie
      pierwsze - z kilkunastu cm cale skrzydla mialo 4-5. Rozwiazanie jest darmowe, nie
      wymaga zadnej slugi, nie zuzywa uwagi ani nie podlega stratom propagacji. Uwalnia tez
