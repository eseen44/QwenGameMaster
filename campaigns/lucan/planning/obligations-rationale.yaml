split_note: Wyniesione 2026-09-04 z state/obligations.yaml, ktory jest w active_refs i wchodzi do KAZDEJ
  tury. Tresc przeniesiona 1:1, bez skracania. W zobowiazaniu zostaly id, status, commitment, key_constraint
