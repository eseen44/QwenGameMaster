what_this_is: KIERUNEK PODANY PRZEZ GRACZA, nie harmonogram i nie zobowiazanie. Kolejnosc moze sie zmienic,
  a niewykonane rzeczy przechodza dalej - tak jak w interludium przed Aktem 3 (state/objectives.yaml#current_interlude_scope.entry_rule).
  Plik istnieje, zeby mapa nie zyla wylacznie w rozmowie.
narrator_warning: TO NIE JEST LISTA ZEGAROW. Zapisanie tu czegos NIE tworzy terminu, presji ani zobowiazania
  i nie wolno zestawiac tej listy z zegarami, zeby pokazac graczowi niedobor (retcon_000142). Elementy
  wchodza do gry dopiero przez deklaracje.
