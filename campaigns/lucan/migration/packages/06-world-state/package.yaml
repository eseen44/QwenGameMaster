revision_notes:
  - Rewizja 14: Lucan nie jest osobistym nemezis; jest środkiem nacisku w sporach instytucji. Ich przedstawiciele mogą jednak wypracować prywatną niechęć bez zmiany tej skali.
  - Rewizja 13: zagrożenie aktu trzeciego zdefiniowano jako instytucjonalne i systemowe; pojedyncze NPC mogą być twarzami lub wykonawcami procedur, nie domyślnymi źródłami prywatnej vendetty.
  - Rewizja 12: użytkownik zatwierdził stan świata, usunął zegar pieczęci i ustanowił akt trzeci jako polityczno-śledczy z opcjonalnym szpiegowaniem, bez domyślnej walki.
