revision_notes:
  - Rewizja 13: użytkownik zatwierdził pakiet sług. Energia życiowa może finansować nieograniczony, ale coraz droższy trwały wzrost; Spidey jest assassinem, a sieciarze są obecnie monitoringiem z docelową specjalizacją trappera.
  - Rewizja 12: Spidey jest opancerzonym nieumarłym zabójcą, nie delikatnym pająkiem; wzmocniono jego odporność, fizyczność i ugryzienie bez robienia z niego stworzenia oblężniczego. Sieciarze pozostają obecnie słabym monitoringiem, a trapper jest ich docelową specjalizacją wymagającą przyszłych ulepszeń.
  - Rewizja 11: Varkhen nie jest aktywnym famili­arem ani sługą polową; pozostaje autonomicznym partnerem kontraktowym z formalną, nieegzekwowaną więzią. Ewentualna późniejsza rola strażnika lub majordomusa wymaga osobnej sytuacji i zgody.
  - Rewizja 10 usuwa błędne założenia o aktywnym zdominowaniu Varkhena, lokalnym zasięgu więzi i znanej możliwości jej zerwania. Więź pozostaje formalna, nieegzekwowana i nieprzetestowana; aktualna autonomia Varkhena jest pełna.
  - Rewizja 9 zapisuje rozkaz dla Spideya i Anchoreda dotyczący zabicia Terena oraz Marael jako celowy element przykrywki nocnej operacji, a nie przypadkowe polowanie pająków.
  - Rewizja 8 usuwa niepotwierdzone uznanie sprzątania za pewną przyczynę śmierci piątego sieciarza; kanoniczne są odnalezienie zgniecionego ciała i późniejsze milczące przyznanie dotyczące trefnej działalności, nie tożsamość sprawcy.
  - Rewizja 7 potwierdza, że Spidey i sieciarze pozostają mali, a sieciarze są samowystarczalni dzięki polowaniu; brak rutynowego kosztu utrzymania nie oznacza nieograniczonej mocy ich oddzielnych zbiorników.
  - Rewizja 6 kanonizuje niefortunnie ujawniony rozkaz nocnego oczyszczenia dwóch ciał w kaplicy; jest oczekujący i nie wykonał się poza sceną.
  - Rewizja 5 przesuwa granicę do dobrowolnego układu dotyczącego ślubów i pieczęci; układ współpracy jest kanoniczny, ale nie zastępuje ani nie testuje formalnej więzi kontroli.
  - Skorygowano pozycje całej sieci: pająki ewakuują się do baszty zamiast pozostawać na dawnych posterunkach.
  - Zapisano utratę fragmentu tylnej nogi Spideya i brak automatycznego odtworzenia po transferze energii.
  - Skalibrowano zapasy po końcowym transferze na 10/12 dla Spideya i 5/6 dla każdego sieciarza; toksyna Spideya pozostaje pełna 4/4.
  - Dodano działające definicje Spideya, sieci i Varkhena oraz minimalny repertuar Varkhena ujawniony w walce.
  - Naprawiono historyczne identyfikatory przejęcia Varkhena z milestone_055 na milestone_045.
  - Zastąpiono model strategicznego więźnia zatwierdzonym modelem formalnej, lecz jeszcze nieegzekwowanej kontroli przy zachowaniu wolnej woli Varkhena.
  - Dodano profil Varkhena: staroświecki kodeks honorowy, doświadczenie w przemocy, słabe myślenie abstrakcyjne i brak znajomości nowej techniki magicznej.
  - Użytkownik zatwierdził dokładną zawartość północnej skrytki; nieokreślona drobnica nie została zamieniona w dodatkowy zasób.
