proposed:
  - id: fact_companion_unbounded_life_force_growth
    claim: "Słudzy nekromantyczni Lucana mogą trwale rosnąć przez świadomie inwestowaną energię życiową bez biologicznego sufitu, lecz każdy kolejny krok jest coraz droższy. Zwykłe polowanie utrzymuje ich obecne ciała, a nie daje automatycznych ulepszeń. Spidey jest assassinem; sieciarze pozostają dziś słabym monitoringiem i rozwiną się w trapperów dopiero przez przyszłe inwestycje."
    category: companion_progression
