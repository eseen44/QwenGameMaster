  - id: fact_magic_is_intuitive_and_procedurally_optimizable
    claim: >-
      Magia łączy intuicyjne kierowanie dostępnym rodzajem energii z proceduralną
      optymalizacją. Ten sam efekt można uzyskać nieskończenie wieloma drogami,
      które różnią się wydajnością, stabilnością, czasem, śladem i ryzykiem.
      Książki o magii nie są same w sobie magiczne: zapisują cudze działające
      intuicje, wizualizacje, metafory i procedury pozwalające odtworzyć efekt.
      Opis nie musi być naukowo prawdziwy, aby kodował skuteczną praktykę, a
      czytelnik nadal potrzebuje zgodnego kanału energii oraz ćwiczenia.
    category: world_magic
    source_refs: [source_user_decisions_current#calibration:intuitive-procedural-magic-and-nonmagical-books]
    confidence: confirmed
    cutoff_relation: timeless
    proposed_target: [system/magic.md, worlds/solmara/lore/magic-practice.yaml]
