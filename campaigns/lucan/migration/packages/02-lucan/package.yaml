  - id: fact_bruteforce_amplification_and_optimized_spells
    claim: >-
      Każdą opanowaną technikę magiczną można bez osobnej edukacji rozszerzać
      przez brutalne dostarczenie energii, o ile rzucający ma wystarczającą
      ekspertyzę i realne źródło mocy. Koszt, niestabilność i ślad rosną jednak
      znacznie szybciej niż rezultat. Oficjalne czary wyższych poziomów są
      zoptymalizowanymi formułami podobnych efektów i mogą być o wiele rzędów
      wielkości wydajniejsze. Ciągły stożek Bone Chill po przeciążeniu kolektora
      jest pierwszym precedensem: efekt poziomu 6 rozszerzony na cztery osie i
      pobierający ze źródła około 1024 jednostek na sześć sekund. Oznacza to
      przepływ około 170.67 jednostki na sekundę (narracyjnie około 200/s) przez
      połączony kanał Lucana i pająków o pojemności około 20. Przeciążenie około
      8.53x zostawia trwały ślad i może poszerzyć kanał, ale nie oznacza
      automatycznego zwęglenia Lucana.
    category: ability_system
    source_refs: [source_luka_b_fragment#line:9096-9233, source_user_decisions_current#calibration:bruteforce-metamagic-and-optimized-higher-spells]
    confidence: confirmed
    cutoff_relation: before
    proposed_target: [system/metamagic.md, system/mechanics/metamagic-scale.yaml, campaigns/lucan/player/abilities.yaml]
    proposed_value: {rule: core_bruteforce_amplification, special_education_required: false, known_pattern_and_expertise_required: true, optimized_tier_cost: "2^(tier-1)", brute_force_gap_multiplier: "2^gap", axes_priced_into_target_tier: true, cost_flow_and_capacity_distinct: true, historical_bone_chill_cone_tier: 6, historical_source_energy_per_6_seconds: 1024, historical_flow_per_second: 170.666666667, narrative_flow_per_second: about_200, linked_channel_capacity: about_20, historical_channel_load_ratio: 8.533333333, overload_result: permanent_channel_and_mental_scar_without_automatic_incineration, historical_total_energy: unmeasured}
    conflict_ids: []
