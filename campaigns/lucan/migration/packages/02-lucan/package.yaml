revision_notes:
  - >-
    Rewizja 14 przyjmuje koszty zoptymalizowanych poziomów według 2^(poziom-1)
    oraz karę 2^luka dla brutalnego skalowania. Rozdziela koszt źródła, przepływ
    na sekundę i pojemność kanału. Precedens kolektora pobiera 1024 energii przez
    sześć sekund, czyli około 170.67/s (narracyjnie około 200/s); przy połączonej
    pojemności około 20 jest to przeciążenie 8.53x, pozostawiające trwały ślad bez
    automatycznego zwęglenia. Całkowity historyczny koszt pozostaje nieznany.
  - >-
    Rewizja 13 ustanawia intuicyjno-proceduralny model magii i niemagiczną naturę
    podręczników. Jej pierwotna kalibracja kosztu stożka i wariantu globalnego
    została w całości zastąpiona przez rewizję 14.
  - >-
    Rewizja 12 dodaje ogólną brutalną metamagiczność: znany wzorzec można bez
    osobnej edukacji skalować energią, lecz luka względem zoptymalizowanego czaru
    podnosi koszt. Jej pierwotna kalibracja liczbowa i osobny mnożnik osi zostały
    w całości zastąpione przez rewizję 14.
  - >-
    Rewizja 11 kalibruje samoleczenie i Vital Overdrive jako czary pierwszego
    poziomu za 1 jednostkę. Leczenie naprawia ograniczony zakres obrażeń, a
    Overdrive daje jeden niestackowalny zryw siły i szybkości bez odporności na
    urazy; powtarzanie kumuluje obciążenie ciała.
  - >-
    Rewizja 10 wyłącza Confusion z grupy subtelnych cantripów i modeluje je jako
    jawny, podtrzymywany czar kontroli za 3 jednostki, wymagający koncentracji
    oraz ciągłego kontaktu wzrokowego. Rozdziela Bone Chill na pełny wariant
    bliski za 1 i słabszy dystansowy za 2, nadaje Geo koszt cantripu 0.1 oraz
    przywraca pominięty Minor Hex jako osobną klątwę koordynacji za 0.1.
  - >-
    Rewizja 9 skaluje zasób w pełnych jednostkach zaklęć: Numb i inne drobne
    klątwy kosztują 0.1, Bone Chill 1.0, a przeciążony Numb 1.5. Przeciążenie
    kolektora trwale zwiększa pojemność z komfortowego 12 do maksymalnego 15;
    bieżący stan po Varkhenie to 14/15 z łagodnym ciśnieniem powyżej starego progu.
  - Rewizja 8 rozdziela niemal bezwolne marionetki transportowe od prawdziwych zombie i kalibruje klątwy jako subtelne cantripy dominujące zwykłe nieprzygotowane cele, lecz normalnie kontrowane przez przygotowanych agentów. Dodaje nieekonomiczny tryb przeciążonego Numb oraz jego precedensy na Orenie i Varkhenie.
  - Rewizja 7 dodaje historycznie zademonstrowane granice kontroli prostych zombie: polecenia, wymianę zasilania, prymitywne wrażenia sensoryczne, autodestrukcję po przejęciu i wyrwanie marionetki spod zdalnej kontroli; nie rozszerza tego automatycznie na silnych autonomicznych nieumarłych.
  - Rewizja 6 klasyfikuje przewodzenie zimna przez szablę jako naturalne zastosowanie Mroźnego Dotyku/Bone Chill, nie odrębną zdolność źródłową.
  - Rewizja 5 dodaje potwierdzoną pojedynczą demonstrację fizycznego overdrive'u z nadmiaru siły życiowej bez udawania trwałego wzrostu statystyk; mechaniczny koszt i ryzyko pozostają do kalibracji przed aktywacją.
  - Rewizja 4 zapisuje wyłącznie minimalne kotwice przeszłości Lucana; świadkowie, rodzina i przyczyny upadku pozostają do ustalenia w akcie śledczym.
  - Odtworzono aktualny model osobowości i precedensy In Character Score.
