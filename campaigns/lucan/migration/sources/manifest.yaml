      - Obejmuje decyzję o granicy kanonu po przejęciu Varkhena.
      - Obejmuje decyzje dotyczące głębokości i procedury migracji.
      - Obejmuje korektę kolejności kaplicy, wysyłki trupów, powozu i systemu Orena.
      - Potwierdza basztę przy opuszczonym murze jako główną kryjówkę po piwnicy.
      - Potwierdza szczegółową sekwencję łuku garbarni od zlecenia w koszarach do ucieczki przed szczuroogrem.
      - Potwierdza dwie wczesne ofiary na wysypisku, domknięcie garbarni, awans do D-rank i tygodniowy downtime przed cmentarzem.
      - Potwierdza, że eksploracja cmentarza była osobnym, długim i wieloscenowym łukiem.
      - Potwierdza rekrutację czterech podstawowych sieciarzy po ulepszeniu Spideya; luka_B wyjaśnia, że zgnieciony został późniejszy piąty okaz kancelaryjny.
      - Potwierdza podział sieciarzy na jednego głównego i trzy jednostki monitorujące oraz aktualną detekcję zerwania nici.
      - Zatrucie przez nici, podsłuch i wykrywanie magii są aspiracjami rozwojowymi, a nie obecnymi zdolnościami.
      - Użytkownik opisywał Geo jako połączenie dwóch umiejętności; luka_B precyzuje je jako skrót równoczesnego wywołania Grave Sense i kamiennego skanera.
      - Potwierdza kradzież przedmiotów z wozu dokonaną przez pająki; luka_B ustala, że nastąpiła po przejęciu całego powozu.
      - Określa „Necronomicon dla biedoty” jako amatorską, nieprecyzyjną książkę dla aspirujących nekromantów, nie prawdziwy grimuar.
