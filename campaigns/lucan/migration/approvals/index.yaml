      - Rewizja 6: pieczęcie są długoterminową przysięgą bez zegara, a przyszła presja ma charakter instytucjonalny.
      - Rewizja 5: dodano jednorazową narrację wejściową streszczającą rozmowę z Seraphine i kończącą się na pytaniu o dwa ciała na wysypisku.
