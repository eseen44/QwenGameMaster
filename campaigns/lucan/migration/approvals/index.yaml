    notes:
      - Rewizja 14: Lucan jest środkiem nacisku w sporach instytucji, nie osobistym nemezis; przedstawiciel frakcji może mimo to prywatnie go nie lubić.
      - Rewizja 13: użytkownik doprecyzował, że zagrożenie aktu trzeciego wynika z układu sił instytucji, nie pojedynczych osób.
      - Rewizja 12: użytkownik zatwierdził stan świata; pieczęcie są długoterminowym hookiem bez zegara, a akt trzeci jest polityczno-śledczy z opcjonalnym szpiegowaniem.
