schema_version: 1
migration_id: migration_lucan_history_v1
activation_requires_all_current_revisions: true
approvals:
  - package_id: migration_package_01_timeline
    revision: 29
    status: approved
    approved_at: "2026-08-15"
    approver: user
    notes:
      - Rewizja 29: użytkownik zatwierdził pełną chronologię 58 kamieni milowych.
      - Rewizja 29: Lucan jest inicjatorem układu dotyczącego przysięgi Varkhena; w rozmowie po wyjściu Mary i Borosa pozostają Lucan, Seraphine oraz Varkhen.
      - Rewizja 28: użytkownik zatwierdził odcinek od śmierci Orena do formalnego przejęcia Varkhena; rozdzielono odkrycie komory spod północnego osuwiska od samego przejęcia.
      - Rewizja 27: weryfikacja z pełnym scalonym przebiegiem potwierdziła łuk Orena; B-rankerzy utrzymują kordon cmentarza, a Seraphine blokuje pierwszy cios Lucana.
      - Rewizja 26: użytkownik skorygował chronologię Orena — B-rankerzy najpierw osłaniają cywilów, Lucan i Seraphine schodzą pod kaplicę, Oren okazuje się ofiarą pasożytniczej więzi, a decyzja o jego zabiciu zapada później na powierzchni po naradzie.
      - Rewizja 24: użytkownik skorygował, że przeładowanie dotyczyło północno-zachodniego narzędzia logistycznego przy trasie wozu, a po odcięciu przepływu z serca do wschodniej części energia zaczęła poważnie ożywiać zwłoki; dopiero potem grupa ruszyła na wschód.
      - Rewizja 25: użytkownik zatwierdził przejście do wschodniej części cmentarza, pod kaplicę i północny fundament.
      - Rewizja 23: użytkownik wskazał, że po odwiezieniu dokumentów grupa wraca z Seraphine i dopiero wtedy przeładowuje kolektor.
      - Rewizja 22: użytkownik zatwierdził przejęcie wozu bez Orena oraz przeniesienie zawartości metalowej skrzyni przez Spideya i jednego sieciarza.
  - package_id: migration_package_02_lucan
    revision: 14
    status: approved
    approved_at: "2026-08-15"
    approver: user
    notes:
      - Rewizja 14: użytkownik przyjął koszt 2^(poziom-1), rozdzielił koszt od przepływu i pojemności kanału oraz skalibrował precedens kolektora na około 170.67 energii/s przez układ o pojemności około 20; przeciążenie zostawia trwały ślad, ale nie zwęgla automatycznie Lucana.
      - Rewizja 13: użytkownik ustanowił intuicyjno-proceduralny model magii, niemagiczną naturę podręczników oraz podniósł ciągły stożek kolektora do efektu poziomu 6 pobierającego energię w sposób ciągły.
      - Rewizja 12: użytkownik zatwierdził brutalne skalowanie dowolnego znanego czaru przez ekspertyzę i energię oraz wyższopoziomowe formuły jako zoptymalizowane, wielokrotnie wydajniejsze wersje efektów.
      - Rewizja 11: użytkownik skalibrował samoleczenie po przeciążeniu oraz fizyczny overdrive po masakrze cmentarnej jako czary pierwszego poziomu; oba kosztują 1 jednostkę i otrzymały ograniczone, działające efekty.
      - Rewizja 10: użytkownik skorygował Confusion jako jawny podtrzymywany czar kontroli, rozdzielił koszty bliskiego i dystansowego Bone Chill oraz potwierdził Geo jako cantrip; przegląd źródeł przywrócił pominięty Minor Hex.
      - Rewizja 9: użytkownik skalibrował Numb jako precyzyjny stackowalny cantrip za około 0.1, przeciążony wariant jako czar poziomu 1–2 za 1.5 oraz wskazał przeciążenie kolektora jako źródło poszerzonej rezerwy; przyjęto 14/15 z komfortowym progiem 12.
      - Rewizja 8: użytkownik potwierdził rozdział marionetek transportowych od prawdziwych zombie oraz model subtelnych cantripów, przygotowanej obrony, przeciążonego Numb na Orenie i kumulacyjnej roli Numb przeciw Varkhenowi.
      - Rewizja 7: źródła i użytkownik potwierdzili rozwój kontroli prostych zombie podczas śledztwa cmentarnego bez rozszerzania go na silnych autonomicznych nieumarłych.
      - Rewizja 6: użytkownik potwierdził, że przewodzenie zimna przez szablę jest naturalnym rozwinięciem Mroźnego Dotyku/Bone Chill.
      - Rewizja 5: użytkownik potwierdził pierwsze krótkie wzmocnienie siły i szybkości Lucana nadmiarem siły życiowej podczas ucieczki po masakrze cmentarnej; koszt i ryzyko wymagają mechanicznej kalibracji.
      - Rewizja 4 dodaje minimalne, źródłowe kotwice przeszłości: kilka lat wyższego kształcenia magicznego i późniejszy okres bezdomności, bez wymyślania osób ani przyczyn.
      - Rewizja 3 pierwotnie przyjmowała stan 11/12 bezpośrednio po przejęciu Varkhena; tę kalibrację zastąpiła rewizja 9 modelem 14/15 z komfortowym progiem 12.
  - package_id: migration_package_03_companions
    revision: 13
    status: approved
    approved_at: "2026-08-15"
    approver: user
    notes:
      - Rewizja 13: użytkownik zatwierdził pakiet sług i model nieograniczonego, coraz droższego wzrostu przez energię życiową.
      - Rewizja 12: Spidey jest opancerzonym nieumarłym zabójcą; sieciarze są obecnie słabym monitoringiem, a trapper jest ich przyszłą specjalizacją.
      - Rewizja 11: Varkhen nie jest aktywnym famili­arem; pozostaje autonomicznym partnerem kontraktowym, a funkcja strażnika lub majordomusa jest wyłącznie przyszłym kierunkiem.
      - Rewizja 10: Varkhen ma formalną, nieegzekwowaną więź kontroli; jej zasięg i możliwość zerwania są nieznane, a jego autonomia pozostaje pełna do czasu ewentualnej, jeszcze nieprzetestowanej próby wymuszenia.
      - Rewizja 9: użytkownik potwierdził, że zabicie Terena i Marael przez Spideya oraz Anchoreda było rozkazem Lucana służącym wzmocnieniu pająków i stworzeniu fałszywej przykrywki problemu pod kaplicą.
      - Rewizja 8: użytkownik potwierdził odnalezienie zgniecionego sieciarza w kancelarii, ale nie potwierdził sprawcy ani intencjonalności jego śmierci.
      - Rewizja 7: użytkownik potwierdził mały rozmiar pająków oraz samowystarczalność sieciarzy dzięki autonomicznemu polowaniu.
      - Rewizja 6: kanoniczny jest także wykryty przez Varkhena, oczekujący rozkaz nocnego oczyszczenia ciał w kaplicy.
      - Rewizja 5: użytkownik przesunął granicę do chwili po dobrowolnym układzie dotyczącym ślubów Varkhena i przed prywatną rozmową z Seraphine.
      - Zatwierdzono Spideya, czterech sieciarzy, formalną nieegzekwowaną kontrolę Varkhena oraz dokładną zawartość północnej skrytki.
  - package_id: migration_package_04_npcs_factions
    revision: 29
    status: approved
    approved_at: "2026-08-15"
    approver: user
    notes:
      - Rewizja 29: użytkownik zatwierdził pełny pakiet NPC i frakcji.
      - Rewizja 29: dodano Magistrat, rody szlacheckie, Akademię, konsorcja kupieckie, sieci przestępcze i zakony mieczowe; Straż jest odrębnym blokiem operacyjnym.
      - Rewizja 28: użytkownik zatwierdził całą sekcję NPC; karta Borosa otrzymała agendę zgodną z zakończoną walką.
      - Rewizja 27: użytkownik zaakceptował kartę Darrika jako postać historyczną.
      - Rewizja 26: użytkownik zaakceptował kartę Orena jako postać historyczną.
      - Rewizja 25: użytkownik zaakceptował kartę Varkhena i jego kartę relacji.
      - Rewizja 24: użytkownik zaakceptował kartę Halvena Ruska i jego kartę relacji.
      - Rewizja 23: użytkownik zaakceptował kartę Seraphine Vale i jej kartę relacji.
      - Rewizja 22: użytkownik zaakceptował kartę Mary Teln i jej kartę relacji.
      - Rewizja 21: zawężono wiedzę Mary i Borosa o walce z Varkhenem do widocznego osłabienia podczas kontaktu Lucana; nie znają mechaniki drenażu ani samodzielnej przyczynowości wyniku.
      - Rewizja 20: zatwierdzono osobne czteroosiowe karty relacji; wycofano zdublowane pojedyncze score z kart ważnych NPC.
      - Rewizja 19: Rusk jest drobnym antagonistą komicznym, Varkhen honorowym i pozbawionym urazy partnerem kontraktowym, a Seraphine jest osobiście zaangażowaną sojuszniczką warunkową, nie wyłącznie użytkowniczką narzędzia.
