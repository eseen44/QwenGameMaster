speech_traits:
  # OBOWIAZKOWE do przeczytania PRZED pierwsza kwestia tej postaci w scenie
  # (system/narrator.md#cechy-mowy). Ustanowione 2026-09-03 na zadanie gracza.
  - 'Mowi patrzac na ksiazke, nie na klienta. Powoli, bez wypelniaczy.'
  - 'Zanim poda cene, rozdziela robote na czesci i nazywa je - bo klienci myla przepisanie z oprawa, a oprawe z podrobieniem cudzej oprawy.'
  - 'Nie pyta, skad rzecz. Pyta wylacznie, CO ma zrobic.'
