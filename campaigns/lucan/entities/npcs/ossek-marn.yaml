speech_traits:
  # OBOWIAZKOWE do przeczytania PRZED pierwsza kwestia tej postaci w scenie
  # (system/narrator.md#cechy-mowy). Ustanowione 2026-09-03 na zadanie gracza.
  - 'Krotkie zdania, rzeczowniki fizyczne - drag, woz, papier, zmiana. Zadnej oglady.'
  - 'Zlosci sie najpierw na wlasne nogi, dopiero potem na obcego. Na cicho zadane pytanie nie warczy.'
  - 'Pod rozwiazanym jezykiem nie mowi nie wiem - produkuje cos, co brzmi jak odpowiedz (skutek uboczny z t_127).'
