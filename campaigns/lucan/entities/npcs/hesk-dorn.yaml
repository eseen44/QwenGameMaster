  terms: 'Notuje dalej OPISY i TWARZE. Nie chce pieniedzy - chce, zeby ktos raz na jakis
    czas przyszedl i wysluchal. Lucan przedstawil sie jako czlonek grupy badajacej wydarzenia
    na cmentarzu; legenda jest prawdziwa (operacja gildii z oficjalnym raportem).'
  cost_original: 'Po turze 083 Hesk zamierzal chwalic sie udzialem w sledztwie.'
  cost_after_warning:
    source_event_id: event_turn_interlude_084
    text: 'ODWROCONE W DUZEJ MIERZE. Lucan ostrzegl go, ze sprawa moze byc powiazana z
      NEKROMANCJA - konkretny powod zadzialal tam, gdzie samo "niebezpieczne" nie dzialaloby.
      Hesk ze strachu nie pisnie o gildii ani slowa na targu. ALE slowo "nekromancja" jest
      teraz w jego ustach, nie w domysle: zapytany WPROST przez urzad, gildie albo Kosciol
      wysypie wszystko natychmiast i skwapliwie, razem z tym, ze czlowiek od gildii ostrzegl
      go o nekromancji. Z paniki i z checi bycia po dobrej stronie, nie z ulosci.'
  his_own_condition: Prosi, zeby Lucan przychodzil sam i nie w liberii. Sam na to wpadl.
  owed_by_lucan: Zjawiac sie i sluchac.
