knowledge:
  register_note: 'TO SA DANE, NIE PROBKA MOWY. Ponizsze `claim` sa zapisem protokolu tury: nie kazde zdanie
    audytu jest wiedza NPC. Sprawdz droge zdobycia informacji, oddziel obserwacje, cudza relacje i hipoteze.
    Reguly narratora nie sa faktami swiata. Przy claim_truncated doczytaj konkretny claim_full przed uzyciem:
    pominiety ogon moze zawierac warunek lub zaprzeczenie. Glos jest na gorze.'
  claim_cap_chars: 420
  recent_confirmed:
  - fact: 'Wlaczyl sie dokladnie raz, na slowach "w nauce sie nie klamie" - jedynej czesci wykladu o poziomach,
      ktora lezy w jego jurysdykcji. Zgodzil sie z entuzjazmem i dolozyl poprawke metodologiczna: prawie
      nikt w nauce nie klamie, ludzie po prostu nie mierza tego, co by im zaprzeczylo. Nie zorientowal
      sie, ze opisal wlasnie mechanizm, ktory jego syn minute wczesniej zaproponowal jako metode.'
    source_event_id: event_turn_interlude_167
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/lucan-father.yaml#~wlaczyl_sie_dokladnie_raz_na_slowach
  - fact: Slyszal przy sobie slowa "gildia", "nekromanci" i "cmentarz" - i nie zareagowal na zadne. Odpowiedzial
      wylacznie na wzmianke o wloknach ze smoczego serca, bo tylko ta czesc dotyczyla materialu.
    source_event_id: event_turn_interlude_166
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/lucan-father.yaml#~slyszal_przy_sobie_slowa_gildia_nekromanci
  - fact: 'Wie, ze modyfikacje dotycza konkretnego okazu - zawisaka - i ze Lucan na razie odmawia go pokazac,
      bo trzy poprzednie cmy zjadly nietoperze albo ptaki. Nie uslyszal w tym porazki, tylko dane: skoro
      cma ma narzad do slyszenia nietoperza, a mimo to zostaje zjedzona, wada nie siedzi w narzadzie,
      tylko w tym, ze narzad nie jest do niczego podpiety - roznica miedzy czuciem a zachowaniem.'
    source_event_id: event_turn_interlude_164
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/lucan-father.yaml#~wie_ze_modyfikacje_dotycza_konkretnego_okazu
  - fact: Wydal trzecia substancje ukrywajaca - porost slepy. W t_151 jej nie wymienil, bo wyliczal wtedy
      wlasne skargi, a porost nie jest jego szkodnikiem. Padla dopiero, gdy Lucan opisal wymaganie zamiast
      nazwy.
    source_event_id: event_turn_interlude_163
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/lucan-father.yaml#~wydal_trzecia_substancje_ukrywajaca_porost_slepy
