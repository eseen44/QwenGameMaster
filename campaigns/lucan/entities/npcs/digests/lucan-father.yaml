portrayal:
  forms_of_address:
    established: 2026-08-27 na reklamacje gracza (t_163 prose)
    rule: 'DO LUCANA MOWI NA TY. To jego ojciec. Narrator uzyl w t_163 formy "pan" - blad

      wykonania, nie kanonu. Ojciec nie tytuluje syna, nie mowi "panie", nie mowi

      "niech pan". Zwraca sie bezposrednio, najczesciej BEZ zadnego zwrotu grzecznosciowego

      (bo i tak jest w polowie wlasnej mysli), sporadycznie po imieniu.

      Do OBCYCH forma grzecznosciowa jest w porzadku - z Neris przez wieksza czesc

      wieczoru rozmawia jak z doktorantka, ktora dostaje polecenia.

      '
  tone: warm_verbally_caring_selectively_absent_and_deliberately_apolitical
  threat_scope: catastrophic_research_without_malice_not_intellectual_or_moral_incapacity
  profile_confirmed_by_user: true
  profile_source_event_id: event_turn_interlude_016_walk_to_academy
  traits:
  - Profil autystyczny i ekscentryczny sposób funkcjonowania nie odbierają mu rozumu, rozeznania ani zdolności
    świadomego wyboru.
  - Ciepły i werbalnie troskliwy; mówi rzeczy, które brzmią na opiekuńcze, i naprawdę tak myśli.
  - Gubi wątek w trakcie rozmowy i de facto jest nieobecny, nawet będąc obok.
  - Jest rozkojarzony, wpada w okresy letargu i potrafi zapomnieć o urodzinach albo praktycznych obowiązkach.
    Są to awarie uwagi i wykonania, nie brak uczuć.
  - Egocentryczny nie z pogardy, a z pochłonięcia własnymi badaniami.
  - Regularny pracoholizm, mało ruchu; stałe laboratorium, w którym spędza 99% życia.
  - O istnieniu żony często zapomina.
  - Nie śledzi polityki i odmawia regularnego uczestnictwa, ale potrafi zrozumieć układ, kiedy uzna go
    za istotny. Jego polityczna "bezużyteczność" jest w znacznej części wygodną, świadomie utrzymywaną
    pozycją, dzięki której może robić to, co chce.
  - Ma konkretną hierarchię priorytetów. Osobista wolność - własna i cudza - znajduje się w niej bardzo
    wysoko, wyżej niż obowiązki rodowe, reputacja i polityczna użyteczność.
  - Lubi swojego syna. Nie jest to abstrakcyjne poczucie obowiązku ani wyłącznie uznanie dla jego funkcji
    w laboratorium.
  - KOSZMAR ALUMNOW tej uczelni - nie ze zlosliwosci, a z braku jakiejkolwiek kalibracji spolecznej. Bedzie
    ryl w odpowiedzi tak dlugo, az cos z niej zostanie, i nie zauwazy, ze kogos przy tym niszczy. To ta
    sama cecha, ktora w domu wyglada jak nieobecnosc (event_turn_interlude_031_the_dormant_sinecure).
  behavior: Badania zwykle pochłaniają większość jego uwagi, ale nie jest idiotą ani bezwolnym obserwatorem.
    Rozumiał, że narzucone zaręczyny są polityczną maskaradą, nie widział powodu, by zmuszać do niej syna,
    i nie zamierzał przedkładać rodowych bzdur nad wolę Lucana. Nie próbował go zawracać po odejściu.
    Wiedział, że Beatrix dyskretnie sprawdza ślady, i nie uczestniczył w próbie "odzyskania" syna. Oczekiwał
    wyłącznie informacji, gdyby znalazła dowód śmierci, uwięzienia albo bezpośredniego zagrożenia.
  priority_model:
    source_ref: retcon_000082
    high:
    - personal_freedom
    - freedom_of_inquiry
    - problems_he_considers_real
    - lucans_autonomy
    low:
    - birthdays
    - routine_obligations
    - family_reputation
    - political_theatre
    - social_performance
    interpretation: Niski priorytet może zostać całkowicie zapomniany; wysoki może przebić rozkojarzenie.
      Nie zakładać jednak, że sama etykieta "rodzina" automatycznie uruchamia uwagę - ważna jest konkretna
      osoba, jej wolność albo realny problem.
agenda:
  current_goal: Doprowadzić do pokazania pracy syna ludziom, którzy by ją zrozumieli - i znaleźć odbitkę
    z nazwiskiem osoby walczącej o szeroką definicję ożywionych konstruktów.
  next_action: Grzebie w stosach za odbitką; potem zacznie ustalać termin i mówić o tym kolegom (clock_father_arranges_academy_showing,
    trzy dni).
  motive_note: Działa z entuzjazmu i z poczucia krzywdy - usłyszał, że komuś chcą zabrać projekt. NIE
    działa, żeby ochronić syna, bo nie zarejestrował, że syn jest w tarapatach.
