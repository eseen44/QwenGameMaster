knowledge:
  recent_confirmed:
  - fact: 'Wlaczyl sie DOKLADNIE RAZ, na slowach "w nauce sie nie klamie" - jedynej czesci wykladu o poziomach,
      ktora lezy w jego jurysdykcji. Zgodzil sie z entuzjazmem i dolozyl poprawke metodologiczna: prawie
      nikt w nauce nie klamie, ludzie po prostu NIE MIERZA tego, co by im zaprzeczylo. Nie zorientowal
      sie, ze opisal wlasnie mechanizm, ktory jego syn minute wczesniej zaproponowal jako metode. Poziomow,
      umowy spolecznej, Kolma ani cmentarza nie skomentowal.'
    source_event_id: event_turn_interlude_167
  - fact: 'Slyszal przy sobie slowa "gildia", "nekromanci" i "cmentarz" - i nie zareagowal na zadne. Odpowiedzial
      WYLACZNIE na wzmianke o wloknach ze smoczego serca, bo tylko ta czesc dotyczyla materialu. NOWY
      KANON (gracz, t_166): profesor Veyr ma zwyczaj rzucac wloknem ze smoczego serca w dowolny problem,
      co czyni jego rozwiazania swietnymi i nieosiagalnymi cenowo - to jest powod, dla ktorego Lucan przedstawia
      mu problemy jako masowe. EKSPOZYCJA: zdania o cmentarzu padly przy czlowieku, ktory zamierza rozmawiac
      z kolegami (agenda.next_action). Nie laczy tego z synem, bo nie szuka przestepstwa. Ryzyko niskie
      i realne jednoczesnie - nie odpalac automatycznie.'
    source_event_id: event_turn_interlude_166
  - fact: 'Wie, ze modyfikacje dotycza konkretnego okazu - zawisaka - i ze Lucan na razie odmawia go pokazac,
      bo trzy poprzednie cmy zjadly nietoperze albo ptaki. Nie uslyszal w tym porazki, tylko dane: skoro
      cma ma narzad do slyszenia nietoperza, a mimo to zostaje zjedzona, wada nie siedzi w narzadzie,
      tylko w tym, ze narzad nie jest do niczego podpiety - roznica miedzy czuciem a zachowaniem. Nie
      wie o rozkazach ani o tym, ze cmy poszly w pole bez zadnego. CHCE ZOBACZYC OKAZ i traktuje odmowe
      jako opoznienie w dostawie, nie jako granice - wroci do tego.'
    source_event_id: event_turn_interlude_164
  - fact: 'WYDAL TRZECIA SUBSTANCJE UKRYWAJACA - porost slepy. W t_151 jej nie wymienil, bo wyliczal wtedy
      wlasne SKARGI, a porost nie jest jego szkodnikiem. Padla dopiero, gdy Lucan opisal wymaganie zamiast
      nazwy. Wszedl w temat glebiej, niz trzeba, bo to nowy problem badawczy (attitude_to_pc.likely_hook),
      i powtorzyl ograniczenie z kanonu: porost daje kryjowke W BEZRUCHU i nie znosi nocnego trybu okazu
      ani tego, ze za dnia rzuca sie w oczy. Przyjal tez bez sporu, ze Lucan bierze na siebie dziekana
      i dwoch ekspertow.'
    source_event_id: event_turn_interlude_163
