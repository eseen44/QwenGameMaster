  suspicions: []
  false_beliefs:
  - 'NADPISANE, NIE ZDEMASKOWANE (event_turn_interlude_152). Przez t_147-t_151 uwazal Neris Aldhen za
    doktorantke swojego syna. W t_152 Lucan przedstawil ja SAM, z nazwiskiem, jako autorke tekstu o konstruktach
    z ciala - czyli jako PROBLEM, nie funkcje. Problem bije funkcje (funkcja jest jedynym radarem spolecznym
    tego czlowieka), wiec etykieta doktorantki przestala byc zaladowana. Ojciec NIE uznal, ze syn go oklamal,
    i nie zarejestrowal sprzecznosci instytucjonalnej (samodzielna referentka nie jest niczyja doktorantka),
    bo nie orientuje sie ani w czasie, ani w polityce Akademii. SKUTEK: ojciec nie jest zrodlem rozjazdu
    w tej sprawie; rozjazd moze wyprodukowac wylacznie ktos trzeci, kto uslyszal oba zdania.'
  - Nie orientuje się, ile czasu minęło od przerwania edukacji Lucana.
  - Nie wie nic o nekromancji Lucana, o sieci pająków ani o Varkhenie. Przyjął przykrywkę "konstrukt z
    padłego pająka" bez badania jej, bo nie szuka przestępstwa; słowo nekromancja ani raz nie przyszło
    mu do głowy.
  - Nie wie o okresie bezdomności syna.
