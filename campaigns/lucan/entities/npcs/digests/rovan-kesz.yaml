knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_refused_the_witness_removal_on_arithmetic_not_conscience
    source_event_id: event_turn_interlude_246
    claim: 'LUCAN ZLOZYL NA GLOS OFERTE USUNIECIA SWIADKA - podal menu: personalia, miejsce pobytu, zniknięcie,
      plus zart o inhumacji jako ekshumacji za zycia. Kesz nie zasmial sie, nie skrzywil i NIE MORALIZOWAL
      (speech_traits). Najpierw wlasna pozycja, jak zawsze zanim musial: Lucan powiedzial to na glos w
      pokoju, o ktorym Kesz uprzedzil go SAM w t_104 (standing.consequence - nic tu nie jest objete tajemnica),
      wiec Kesz tego NIE USLYSZAL i nazwal to ostatnim razem, kiedy moze tak powiedziec. POTEM WYBRAL
      Z MENU, bo o to byl pytany (retcon_000135): PERSONALIA I ODPOWIEDZ, CZY TAMTEN JUZ MOWIL - NIE zniknięcie.
      Rachunek, nie sumienie: Halvek siedzi w loc_guild_holding_cells, czyli w budynku gildii i na terenie
      npc_seraphine_vale, ktorej urzedem jest kontrola; trup w celi nie wymaga zadnego standardu dowodowego,
      a rysopis wymaga drugiej polowy; po Lucanie drugim nazwiskiem, ktore komukolwiek przyjdzie do glowy,
      jest nazwisko jego prawnika. Tansza wersja tego samego juz zadzialala w tej kampanii - halvek#prisoner_sourced_gate_guard_description:
      rysopis lezal bezuzytecznie od t_048/052 do t_207, dopoki nazwisko nie przyszlo z innego zrodla.
      NA PYTANIE, CZY BAWI SIE SAM: tym koncem rzemiosla nie zajmuje sie osobiscie, a za pokoj NIE ODPOWIADA
      - moze tylko zaniesc pytanie, i spodziewa sie, ze pytanie o trupa w budynku gildii kosztuje wiecej,
      niz Lucan dzis dla pokoju zarabia. To jego wlasne oczekiwanie, NIE decyzja pryncypala, ktorej narrator
      nie zadeklarowal. HALVEK NIETKNIETY: captured_alive, bez zmiany lokacji, nikt do niego nie poszedl.'
  - fact_id: fact_kesz_audited_lucans_self_description
    source_event_id: event_turn_interlude_246
    claim: 'JEDYNA RZECZ, KTORA KESZ DODAL Z SIEBIE, I JEST TO JEGO agenda#assess_whether_lucan_is_a_liability
      W DZIALANIU. Lucan powiedzial mu, ze jest chujowym szlachcicem, ale szlachcicem, nie rzeznikiem,
      ze MANIPULUJE ZAMIAST GROZIC, bo to lepsze dla wszystkich na dluzsza mete, i ze urokiem tej metody
      jest to, ze SWIADOMOSC NIE POMAGA - a w nastepnym zdaniu zaproponowal pochowanie czlowieka za zycia.
      Kesz nazwal te niespojnosc jednym zdaniem: to nie jest opis metody, to opis nastroju. NIE jest to
      moralizowanie ani madrosc z urzedu (retcon_000040), tylko audyt zdania, ktore padlo pol minuty wczesniej,
      wykonany przez czlowieka, ktorego zawodem jest sprawdzanie, czy wersja klienta trzyma sie kupy.
      WNIOSKU O LUCANIE NIE WYCIAGNAL NA GLOS i decyzji o prowadzeniu sprawy nie zmienil. Deklaracja metody
      idzie do jego knowledge jako TO, CO USLYSZAL (retcon_000120) - nie do player/abilities.yaml ani
      do zadnego pliku opisujacego, jak Lucan naprawde dziala. Zapowiedz kolejnych takich prezentow to
      intencja, nie wykonanie.'
  - fact_id: fact_kesz_learned_the_description_has_a_living_man_behind_it
    source_event_id: event_turn_interlude_245
    claim: 'PRZELOM W JEGO WLASNEJ EKSPOZYCJI, URUCHOMIONY RUCHEM GRACZA. Lucan zaoferowal mu - jako zadatek
      na wszystkie mozliwe koszty procesowe - informacje o miejscu przebywania jego problemu. Kesz ZROZUMIAL
      BEZ PYTANIA, o kogo chodzi (jak w t_105b i t_200), i PRZYJAL. O RYSOPISIE wiedzial od t_105b, bo
      Lucan sam mu go wtedy wymienil wsrod nitek trzymanych na wozach; NIE WIEDZIAL, ze za rysopisem stoi
      ZYWY, dostepny czlowiek. To jest npc_halvek_wagonman, captured_alive, loc_guild_holding_cells, halvek#open_thread.
      SAMEJ INFORMACJI JESZCZE NIE DOSTAL - Lucan zapytal, czy jej chce, i to Lucan ma ja wypowiedziec.
      NAZWAL, CZYM ZAPLATA JEST: nie zadatkiem, tylko spisem z inwentarza - Lucan mial to przez caly czas,
      kiedy Kesz wazyl, czy sie w to pakowac; drugi raz ten sam ruch co w t_105b, gdzie tez dostal prezent
      bedacy jednoczesnie pomiarem. Kpiny nie odebral jako obrazy i nie moralizowal (speech_traits). ODWROCIL
      OFERTE: miejsce go nie ratuje, bo do cel gildii - budynku Seraphine - prawnik nie wchodzi z teczka;
      chce wiedziec, CZY TAMTEN JUZ POWIEDZIAL I KOMU. Rysopis w pamieci to plotka, rysopis obok twarzy
      w protokole to akta - mechanika potwierdzona w tej kampanii przez halvek#prisoner_sourced_gate_guard_description,
      gdzie rysopis lezal bezuzytecznie od t_048/052 do t_207, dopoki nazwisko nie przyszlo z innego zrodla.
      CZY HALVEK MOWIL COKOLWIEK PO t_048 - NIEUSTALONE, narrator tego nie domknal. NADAL NIEDOPOWIEDZIANE:
      Lucan powiedzial twoj problem, nie ty jestes czlowiekiem z rysopisu; nie padlo imie Orena, zeznanie
      Halveka jako zrodlo, dopasowanie rysopisu ani rozbieznosc palec wskazujacy kontra lewy kciuk (retcon_000122).
      oren_connection.lucan_said_it_out_loud BEZ ZMIAN. converging_target#consequence zaczyna sie realizowac:
      przestaje byc uslugodawca, staje sie strona z wlasnym motywem.'
  - fact_id: fact_kesz_got_paid_instead_of_answered_about_the_priest
    source_event_id: event_turn_interlude_245
    claim: 'Zapytal w t_244, co Lucan zamierza zrobic z kaplanem, i dostal zaplate zamiast odpowiedzi.
      Odnotowal to RAZ, plasko, bez zlosci i BEZ POWTARZANIA PYTANIA (retcon_000121, retcon_000142). Pytanie
      zostaje otwarte i nalezy do niego - jesli zechce, wroci z nim sam. Bez odpowiedzi nadal takze: nazwisko
      urzednika akt, termin dostarczenia papierow i udzial pokoju.'
