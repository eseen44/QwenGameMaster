knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_heard_the_papers_are_unclaimable_and_named_the_other_end
    source_event_id: event_turn_interlude_242
    claim: 'USLYSZAL WERSJE, NIE PRAWDE. Lucan powiedzial mu, ze papiery znalazl formalnie W SMIECIACH,
      eksplorujac ruiny i laboratoria biomutantow pod posesja, i ze wlasciciel nie moze ich przyznac,
      bo przyznalby, ze wiedzial o laboratoriach oznaczonych jako zagrozenie dla miasta - a za ich ukrywanie
      grozi mu dluga odsiadka. ZAPISYWAC JAKO TO, CO USLYSZAL: prawda z plikow jest inna i sie NIE ZMIENIA
      (papiery ze SKRYTKI i MIESZKANIA obecnego wlasciciela, otwartych jego wlasnymi kluczami - tannery-owner#the_vault,
      #the_lodging; retcon_000120). Wersja lezy w state/secrets.yaml#cover_stories. SAM ARGUMENT Kesz
      uznal za dobry i jest to odczyt z pliku, nie retoryka (tannery-owner#why_he_was_detained, #what_he_refuses).
      POKAZAL JEGO DRUGI KONIEC, bez nazywania kogokolwiek po imieniu: papier, ktorego wlasciciel nie
      moze przyznac, nie jest przez to papierem bez zainteresowanych, bo opisuje LABORATORIA, a to wynika
      z kategorii dokumentu, nie z niczyjego spisu (zadna lista, zaden swiadek, zaden zegar - retcon_000058,
      retcon_000055).'
  - fact_id: fact_kesz_knows_lucan_holds_the_owners_silver_seal
    source_event_id: event_turn_interlude_242
    claim: 'NAJDROZSZE UJAWNIENIE TEJ SCENY. Lucan powiedzial mu, ze ma srebrna pieczec zakladu, ktora
      ZAGINELA po katastrofie ze szczuroogrem (milestone_020/021). Kesz nie odrzucil sprawy i nie moralizowal,
      ale POSTAWIL GRANICE O SOBIE, zanim musial: nie chce byc czlowiekiem, ktory wie, gdzie ta pieczec
      jest. Jest to jego wlasna ekspozycja zawodowa, NIE sciana swiata - a przypomnienie, ze nic powiedziane
      przy nim nie jest objete tajemnica (standing.consequence), pochodzi od niego samego z t_104. WYCENIL
      DWIE DROGI: z pieczecia Lucan nie kupuje garbarni, tylko staje sie jej dokumentacja, a dokument
      z data z tamtego okresu wchodzi prosto w rozliczenie, ktore ktos wlasnie prowadzi (doslownie inventory#forgery_intent.dlaczego_to_teraz_ciekawsze_niz_bylo);
      bez pieczeci kupuje wolno i nikt tego potem nie rozplecie. ZADNA PIECZEC NIE ZOSTALA UZYTA i zadna
      nie opuscila zone_wall_void. CZEKA NA JEDNO SLOWO: ma o niej wiedziec czy nie.'
  - fact_id: fact_kesz_split_the_two_keys_guild_site_city_estate
    source_event_id: event_turn_interlude_242
    claim: 'Lucan zadeklarowal, ze majatkiem zarzadza obecnie GILDIA. Kesz rozdzielil to na dwa klucze,
      bo pliki mowia dwa razy co innego: GILDIA trzyma TEREN i klasyfikacje zagrozenia (ekipa A-rank zamknela
      podziemia), a MAJATEK ZAMROZILO MIASTO (tannery-owner#earlier_detention_history, inventory#forgery_intent,
      audyt t_234). Zeby kupic zaklad, potrzebne sa OBA. Czy majatek nadal jest zamrozony i czy brygadzista
      nadal prowadzi zaklad - NIEUSTALONE i w tej turze nieustalone dalej (tannery-owner#current_situation).
      PRZYJAL NATOMIAST BEZ SPORU I UZNAL ZA MOCNE: skarga na niezaplacone wynagrodzenie ZOSTALA ZLOZONA
      PRZEZ GILDIE (kanon - inventory#item_tannery_owner_cache.two_open_debts), czyli pozycja wierzyciela,
      ktora wycenil w t_240 jako mozliwa, JUZ ISTNIEJE, i to zlozona ZANIM byla potrzebna - wiec nikt
      nie czyta jej jako zagrywki. PYTANIE Z t_241 ZAMKNIETE: dluznikiem jest wlasciciel OBECNY. CZEKA,
      ktory klucz ruszaja pierwszy - gildie czy miasto.'
  - fact_id: fact_kesz_took_the_tannery_matter_as_a_paid_client
    source_event_id: event_turn_interlude_241
    claim: 'GLOWNA ZMIANA: WZIAL DRUGA SPRAWE, PIERWSZA FINANSOWANA PRZEZ LUCANA. Lucan zlecil przejecie
      garbarni jako sprawe troche kryminalna, troche prawna, i jawnie powiedzial, ze nie oczekuje pracy
      darmo. Kesz przyjal i zdecydowal SAM (retcon_000124 - nie odsyla do pryncypala). KWOTY NIE USTALONO
      i narrator jej nie wymyslil; powiedzial tylko, ze pieniadze sa najmniejsza czescia tego rachunku.
      WARUNEK POSTAWIONY ZAMIAST CENY: POKOJ SIE DOWIE, ze prowadzi dla Lucana sprawe majatkowa - staly
      klient nie dowiaduje sie takich rzeczy od kogos trzeciego. To protect_the_room_first i standing.room_condition,
      NIE prosba o zgode: informuje, nie pyta, i nie uzaleznil od tego przyjecia sprawy. CZEGO TO NIE
      ZALATWIA: pryncypal nadal NIENAZWANY, a pytanie czyja twarz kupuje zaklad zostaje otwarte - poinformowanie
      pokoju to nie wpuszczenie pokoju do transakcji.'
