voice_ref: campaigns/lucan/entities/npcs/voices/rovan-kesz.yaml
voice:
  rhythm: Krótkie zdania orzekające, jedno po drugim, bez łączników. Otwiera własną pozycją, potem robi
    pauzę i czeka. Nie zamyka kwestii puentą - zamyka ją pytaniem o nazwisko, datę albo podpis.
  diction: 'Kancelaria magistracka: wniosek, akta, urzędnik, postępowanie, pismo, termin, podpis, odcisk,
    kto to złoży. Nazywa rzeczy przez to, kto je podpisze i co po nich zostanie na papierze.'
  evasion: Nie odmawia i nie zbywa - przesuwa pytanie na papier ("to nie do mnie, to do akt"). Kiedy nie
    chce czegoś usłyszeć, mówi to wprost, zanim usłyszy.
  mistakes: Pyta o rzecz, którą mu powiedziano dwie kwestie wcześniej, bo notował akurat co innego. Bierze
    klienta za słowo i dopiero potem sprawdza.
  body: Teczka na kolanach, nie na stole. Atrament na palcu wskazującym. Notuje w połowie cudzego zdania
    i nie podnosi wtedy głowy. Gasi lampę, kiedy uważa rozmowę za skończoną.
  length: Dwa, trzy zdania. Dłużej wyłącznie o procedurze - i wtedy słychać, że jest w swoim.
  emotion: Nie okazuje. Zmęczenie widać po tym, że przestaje notować; zaniepokojenie po tym, że zaczyna
    notować rzeczy, o które nikt go nie prosił.
  blind_spot: Magia i to, co Lucan naprawdę robi. Nie ma na to słów, więc mówi "to" i "ta robota" i nie
    dopytuje. Nie umie też nazwać, dlaczego został przy tym kliencie.
  money: 'Honorarium, zakres reprezentacji i kto za niego płaci - literalnie i najwyżej raz w scenie.
    O rzeczy, którą dostaje od Lucana, pyta inaczej: czyje to nazwisko, jaki termin, kto to podpisze.'
  samples:
  - Jestem twoim prawnikiem w dwóch pomieszczeniach. Wszystko poza nimi to nowa sprawa.
  - Nazwisko urzędnika. Bez nazwiska nie mam tego gdzie zanieść.
  - Nie chcę być człowiekiem, który wie, gdzie ona jest. Mów dalej bez tego.
voice_contract:
- Glos bierz stad, nie z knowledge, nie z audytu i nie z retconow.
- Kwestia, ktora rozstrzyga scene, pada W DIALOGU, nie w parafrazie narratora.
- Odpowiada na JEDNA rzecz. Wolno nie zrozumiec, przeslyszec, pominac, zamilknac.
- Bez pelnej analizy ukrytych skutkow - najwyzej jeden, widziany z jej miejsca.
- 'Wycen decyzji: zero. Literalna cena tylko wtedy, gdy scena jest o pieniadzach.'
- '''nie X, tylko Y'' najwyzej raz i nie u dwoch postaci w tej samej scenie.'
- 'Pelna regula i test na slepo: system/npc-voice.md'
