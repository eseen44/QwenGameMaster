knowledge:
  register_note: 'TO SA DANE, NIE PROBKA MOWY. Ponizsze `claim` sa zapisem protokolu tury: mowia, CO postac
    wie, nigdy JAK mowi. Glos bierz wylacznie z `voice` na gorze tego skrotu (system/npc-voice.md). Wersaliki
    emfatyczne sa tu wygaszone celowo - pelna karta zachowuje oryginalna pisownie.'
  recent_confirmed:
  - fact_id: fact_kesz_got_the_priest_answer_and_it_is_a_fifth_option
    source_event_id: event_turn_interlude_248
    claim: 'Pytanie z t_244 odpowiedziane, mimochodem, NA odchodnym - I odpowiedz jest spoza jego listy.
      Kesz wymienil cztery pokoje: negocjowac, kupic, przycisnac, zniszczyc. Lucan podal piaty: Przekonac
      kaplana, ZE jest jego jedyna nadzieja - i dodal, ze zrobi to tak samo, jak zrobil to keszowi. Spojne
      z jego deklaracja metody z t_246 (manipuluje zamiast grozic, swiadomosc nie pomaga). Zapowiedzial
      wspolna konsultacje kesz + kaplan - jako plan, nie umowione spotkanie: kaplan nadal nie odpowiedzial
      na wiadomosc wyslana dzis rano, terminu nie ma i data nie jest Kesza do dania (t_113, t_193). Kesz
      odnotowal, ze klient powiedzial mu w twarz, iz zastosowal na nim te sama technike, i nazwal to bez
      emocji - albo bardzo szczery, albo bardzo pewny, ze to nic nie zmienia (agenda#assess_whether_lucan_is_a_liability).
      Wniosku nie wyciagnal na glos, umowy nie zerwal, z przesluchania sie nie wycofal. Na bedziemy bogaci
      nie dal sie rozchmurzyc. Zamknal jednym zadaniem: zeby Lucan przyniosl papiery. Nadal bez odpowiedzi:
      nazwisko urzednika akt, termin papierow, udzial pokoju, oraz co Kesz sam zdecyduje do rana (t_247).'
  - fact_id: fact_kesz_got_the_witnesses_name_and_the_state_of_his_testimony
    source_event_id: event_turn_interlude_247
    claim: 'Zaplata oddana w calosci. Kesz dostal od Lucana: (a) nazwisko - Halvek (npc_halvek_wagonman);
      (b) stan zeznania - powiedzial npc_seraphine_vale, kogo widzial, ale nieprecyzyjnie, bo rownoczesnie
      targowal sie z Lucanem o przysługi dla chorej matki, na czas po tym, jak straz rozwiaze problem
      jego zeznan; zeznanie jest wiec DO podwazenia; (c) czesc niebezpieczna - Halvek rozpozna Kesza,
      jesli znajda sie w jednym pokoju. Nazwisko przyjal bez komentarza. Ponowionej oferty zniknięcia
      (na promocji, poki siedzi w celi) nie przyjal i nie zamknal - policzyl raz w t_246 i drugi raz nie
      liczy (retcon_000135). Zeznanie do podwazenia uznal za jedyna dobra wiadomosc wieczoru.'
  - fact_id: fact_kesz_realised_he_already_promised_the_room_with_the_witness_in_it
    source_event_id: event_turn_interlude_247
    claim: 'Zestawienie, ktore zrobil sam i na glos - i ktore jest obowiazkiem narratora, nie gracza (retcon_000135).
      Rozpoznanie wymaga jednego pokoju, a Kesz juz jeden taki pokoj obiecal: standing.scope_of_representation
      - gwarant procedury na przesluchaniu kieronictwa gildii, w budynku gildii, a npc_halvek_wagonman
      siedzi w loc_guild_holding_cells, czyli w tym samym budynku. Zgodzil sie na to w t_194/t_199, kiedy
      wiedzial tylko o rysopisie i nie wiedzial, ze stoi za nim zywy czlowiek. Powiedzial to bez pretensji
      - Lucan oddal mu te wiedze dobrowolnie i to jedyny powod, dla ktorego ja ma; pulapki w plikach nie
      ma i Kesz jej nie zarzucil. Nie wycofal sie z przesluchania, nie zerwal umowy, nie zazadal pieniedzy.
      Powiedzial, ze do rana bedzie wiedzial, czego chce. Nieustalone: czy Halvek bedzie w tych celach
      w dniu przesluchania, czy ktokolwiek by ich zetknal i co Kesz ostatecznie zrobi.'
  - fact_id: fact_kesz_knows_the_room_will_not_stand_between_him_and_the_watch
    source_event_id: event_turn_interlude_247
    claim: 'Najzimniejszy wniosek tej sceny i jest to jego wlasna wiedza, nie madrosc z urzedu (retcon_000040).
      Lucan powiedzial, ze straz wykorzysta go jako kozla ofiarnego - ma to pokrycie w lucan-leads#lead_city_watch_covers_cemetery_corpse_trade
      (straz zakrywa afere z handlem zwlokami, wiec potrzebuje kogos spoza siebie). Kesz dolozyl wlasne
      zdanie z fact_kesz_priced_representation_before_guild_and_watch (t_193): pokoj powiedzial w t_100,
      ze Z klientem w mundurze sie nie konkuruje. Wniosek o sobie: jesli straz bedzie potrzebowala kozla,
      pokoj nie stanie miedzy nia a nim. Ochrona, na ktora liczyl, ma warunek, ktorego on nie ustala.
      Zaden zegar ani sledztwo z tego nie powstaly (retcon_000055, retcon_000058) - to odczyt dwoch zdan
      lezacych juz w plikach. converging_target#consequence: Pierwsza polowa zrealizowana - przestal byc
      uslugodawca i jest strona z wlasnym motywem, powiedzial to na glos. Druga polowa stoi: nie padlo
      imie Orena, nie padlo ty jestes czlowiekiem z rysopisu, nie padlo zeznanie z t_048 jako zrodlo ani
      rozbieznosc rysopisu (retcon_000122). oren_connection.lucan_said_it_out_loud bez zmian.'
