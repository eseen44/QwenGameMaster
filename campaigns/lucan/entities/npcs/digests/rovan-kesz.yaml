knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_was_shown_the_unread_crest
    source_event_id: event_turn_interlude_240
    claim: 'Lucan polozyl przed nim item_three_arrow_deer_signet (jelen przebity trzema strzalami) i poprosil
      o herb. NIE ZAPYTAL, SKAD JEST - konsekwentnie z fact_kesz_understood_the_category_without_asking
      (t_105b) i z t_200. NIE ROZPOZNAL RODU i powiedzial to wprost: heroldem nie jest, zna urzednikow
      magistratu, nie Akademie. ZAMIAST TEGO DAL DROGE PRAWNICZA: herb identyfikuje sie przez ODCISK PIECZECI
      porownany z AKTAMI WLASNOSCI, nie przez czyjas pamiec. heraldry_recognition w inventory zostaje
      attempted_and_failed, rod NIEUSTALONY, house-veyr-main-line#notes NIE zamkniete w zadna strone.
      POWIEDZIAL TEZ SAM, ZE ZAPISUJE PYTANIE - bez grozby, jako wlasna praktyke zawodowa: prowadzi ewidencje
      i ona po to jest. KOREKTA retcon_000159: pierwsza wersja tego wpisu kazala mu powolac sie na doktryne
      jawnej ewidencji, ktora Lucan wylozyl w t_226 - ale to bylo U SERAPHINE i Kesza tam nie bylo. Nie
      ma tego w jego knowledge i NIE GRAC tym. CZEGO NIE WIE: skad Lucan ma sygnet. Wersji nie musial
      podawac i nie podal - the_shield stoi (retcon_000058).'
  - fact_id: fact_kesz_knows_about_the_unpaid_tannery_wage
    source_event_id: event_turn_interlude_240
    claim: 'NOWA WIEDZA O AKCIE 1, dotad w jego karcie nieobecna. Lucan powiedzial mu, ze npc_tannery_owner
      zatrudnil go przez gildie i obiecal pieniadze OSOBNO, poza premia, i nie zaplacil. Kesz wycenil
      roszczenie dwukrotnie: jako PIENIADZE zero (sprawa garbarnika formalnie otwarta, czesc majatku zamrozona
      przez miasto, prywatne wynagrodzenie stoi w kolejce za miastem), jako POZYCJE cos (zarejestrowany
      wierzyciel ma prawo zajrzec do majatku - akty, inwentarz, uzgodnienia magistratu). Cene nazwal RAZ:
      podpisany wniosek jest dowodem, ze Lucan byl w tych podziemiach i mial dostep. Decyzja NIE PODJETA.
      CZEGO NIE USLYSZAL: ani slowa o mieszkaniu, skrytce, pieczeci, kluczach ani o tym, ze to Lucan wsadzil
      garbarnika papierami.'
  - fact_id: fact_kesz_priced_the_tannery_acquisition_and_asked_two_questions
    source_event_id: event_turn_interlude_240
    claim: 'Lucan zadeklarowal zamiar przejecia albo kupienia posesji (lead_tannery_acquisition_via_bailiff_auction).
      Kesz NIE odmowil i ani razu nie powiedzial nie da sie (speech_traits: wycenia, nie bramkuje). Nazwal
      dwie przeszkody, obie z adresem: (a) dopoki postepowanie jest formalnie otwarte, zaklad nie idzie
      pod mlotek, a rejestrem rusza URZEDNIK AKT MAGISTRATU - zapytal o jego nazwisko i CZEKA NA ODPOWIEDZ;
      (b) tragarz gildii rangi D kupujacy zaklad jest ekspozycja sam w sobie, wiec pieniadze potrzebuja
      TWARZY - zaproponowal twarz pokoju i od razu podal cene, ze wtedy pokoj ma w tym udzial (protect_the_room_first).
      NIEROZSTRZYGNIETE, bo nie padlo: co wie o poprzednim wlascicielu, czy garbarnia w ogole idzie pod
      mlotek i na jakich warunkach, ile zaklad przynosi. POWIAZANIE Z npc_ivar_kolm MU NIE PRZYSZLO DO
      GLOWY i narrator go nie podlozyl. NAPIECIE OTWARTE: standing.room_condition zada SYNDYKAT WIDOCZNY,
      PRYNCYPAL NIENAZWANY, a wpis w rejestrze wlasnosci jest najtrwalsza forma widocznosci.'
  - fact_id: fact_kesz_lost_half_his_ignorance_before_the_priest_meeting
    source_event_id: event_turn_interlude_203
    claim: 'Byl w pokoju, gdy Lucan podal pryncypalowi SKALE: najlepszy przypadek to trupy wychodzace
      z ziemi jak za pierwszym razem, najgorszy to zawalenie miasta w pustki pod nim. PRECYZJA, KTOREJ
      NIE WOLNO ZGUBIC: padly KONSEKWENCJE, nie przyczyna. Kesz nadal NIE WIE, CO jest pod cmentarzem,
      i moze to dalej uczciwie powiedziec - nie moze juz powiedziec, ze nie wie, ze to jest powazne. To
      zmniejsza o polowe zalete, ktora sam nazwal w t_194 (fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest:
      niesie rame, nie znajac tresci, bo czlowieka, ktory nie wie, nie da sie zmusic do rozwiniecia).
      Nazwal to sam, bez pretensji - wszedl w to dobrowolnie. forbidden_without_source nienaruszone: varkhen_existence,
      lucan_necromancy, spidey_existence.'
