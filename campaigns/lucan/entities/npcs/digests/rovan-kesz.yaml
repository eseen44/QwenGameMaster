knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_took_the_tannery_matter_as_a_paid_client
    source_event_id: event_turn_interlude_241
    claim: 'GLOWNA ZMIANA: WZIAL DRUGA SPRAWE, PIERWSZA FINANSOWANA PRZEZ LUCANA. Lucan zlecil przejecie
      garbarni jako sprawe troche kryminalna, troche prawna, i jawnie powiedzial, ze nie oczekuje pracy
      darmo. Kesz przyjal i zdecydowal SAM (retcon_000124 - nie odsyla do pryncypala). KWOTY NIE USTALONO
      i narrator jej nie wymyslil; powiedzial tylko, ze pieniadze sa najmniejsza czescia tego rachunku.
      WARUNEK POSTAWIONY ZAMIAST CENY: POKOJ SIE DOWIE, ze prowadzi dla Lucana sprawe majatkowa - staly
      klient nie dowiaduje sie takich rzeczy od kogos trzeciego. To protect_the_room_first i standing.room_condition,
      NIE prosba o zgode: informuje, nie pyta, i nie uzaleznil od tego przyjecia sprawy. CZEGO TO NIE
      ZALATWIA: pryncypal nadal NIENAZWANY, a pytanie czyja twarz kupuje zaklad zostaje otwarte - poinformowanie
      pokoju to nie wpuszczenie pokoju do transakcji.'
  - fact_id: fact_kesz_told_lucan_where_stolen_paper_is_worth_nothing
    source_event_id: event_turn_interlude_241
    claim: 'Lucan potwierdzil, ze ma jakies dokumenty do herbu - nie powiedzial, skad, a Kesz NIE ZAPYTAL
      (jak w t_105b, t_200, t_240). Kesz kazal je trzymac tam, gdzie leza, i nazwal regule: dokument,
      o ktorego pochodzeniu nie da sie zlozyc zdania, jest wart ZERO na papierze i wszystko POZA papierem
      - sluzy do USTALENIA nazwiska z odcisku, nigdy do zlozenia w postepowaniu. NIE WIE, ze chodzi o
      item_tannery_owner_cache w zone_wall_void baszty przy murze, i nie wie o pieczeci ani o dwoch dalszych
      sygnetach. Przyznal tez Lucanowi punkt o ewidencji: wpis o herbie, ktorego nie umie odczytac, jest
      wpisem o niczym - do dnia, w ktorym herb odczyta ktos inny, bo wtedy wpis ma date.'
  - fact_id: fact_kesz_split_the_two_tannery_owners_and_is_waiting
    source_event_id: event_turn_interlude_241
    claim: 'Lucan opisal sprawe jako dlug POPRZEDNIEGO wlasciciela, ktory zniknal i ma otwarty proces.
      Kesz rozdzielil dwoch wlascicieli jako czynnosc zawodowa, nie jako opor, i CZEKA NA JEDNO SLOWO
      POTWIERDZENIA, bo od tego zalezy cala droga. Stan z plikow bez zmian: dluznikiem jest npc_tannery_owner,
      wlasciciel OBECNY (the_unpaid_job), on ma otwarte postepowanie i czesc majatku zamrozona, on wyszedl
      z aresztu w t_032 i ma miejsce pobytu nieustalone; POPRZEDNI wlasciciel to ten, po ktorym zostal
      sygnet, i jego los, rod oraz nazwisko sa NIEUSTALONE (tannery-owner#do_not_invent). ZAPROPONOWAL
      PIERWSZY KROK, NIE WYKONAL GO: obejrzec, na jakim etapie stoja akta sprawy garbarni w magistracie
      - to nie wymaga urzednika akt, bo czytanie stanu sprawy to nie ruszanie rejestru wlasnosci. Cene
      podal plasko: ktos zauwazy, ze prawnik pyta o garbarnie. ODNOTOWAL BRAK NAZWISKA URZEDNIKA JEDEN
      RAZ i nie pytal drugi (retcon_000121); postawil granice: bez nazwiska nie rusza rejestru.'
  - fact_id: fact_kesz_was_shown_the_unread_crest
    source_event_id: event_turn_interlude_240
    claim: 'Lucan polozyl przed nim item_three_arrow_deer_signet (jelen przebity trzema strzalami) i poprosil
      o herb. NIE ZAPYTAL, SKAD JEST - konsekwentnie z fact_kesz_understood_the_category_without_asking
      (t_105b) i z t_200. NIE ROZPOZNAL RODU i powiedzial to wprost: heroldem nie jest, zna urzednikow
      magistratu, nie Akademie. ZAMIAST TEGO DAL DROGE PRAWNICZA: herb identyfikuje sie przez ODCISK PIECZECI
      porownany z AKTAMI WLASNOSCI, nie przez czyjas pamiec. heraldry_recognition w inventory zostaje
      attempted_and_failed, rod NIEUSTALONY, house-veyr-main-line#notes NIE zamkniete w zadna strone.
      POWIEDZIAL TEZ SAM, ZE ZAPISUJE PYTANIE - bez grozby, jako wlasna praktyke zawodowa: prowadzi ewidencje
      i ona po to jest. KOREKTA retcon_000159: pierwsza wersja tego wpisu kazala mu powolac sie na doktryne
      jawnej ewidencji, ktora Lucan wylozyl w t_226 - ale to bylo U SERAPHINE i Kesza tam nie bylo. Nie
      ma tego w jego knowledge i NIE GRAC tym. CZEGO NIE WIE: skad Lucan ma sygnet. Wersji nie musial
      podawac i nie podal - the_shield stoi (retcon_000058).'
