knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_asked_what_lucan_intends_to_do_with_the_priest
    source_event_id: event_turn_interlude_244
    claim: 'PYTANIE OTWARTE, POSTAWIONE PRZED CZASEM I NIE O PIENIADZE. Lucan zapytal, co z kaplanem;
      Kesz podal stan (wiadomosc poszla dzis, odpowiedzi nie ma, terminu nie wyznacza on - data nie jest
      jego do dania) i zaraz potem swoja pozycje, jak zawsze zanim musial. Dwa jego wlasne fakty sie tu
      spinaja: t_193 - skoro spotkanie organizuje ON, wprowadzenie tam Veyra po jawnej zapowiedzi wojny
      z Kosciolem jest pozycja, ktora bedzie musial komus wytlumaczyc; t_203 - po podaniu mu SKALI nie
      moze juz powiedziec, ze nie wie, ze sprawa jest powazna, czyli jego oslona z niewiedzy zmniejszyla
      sie o polowe. PYTA WIEC: co Lucan zamierza z tym kaplanem zrobic, i chce to wiedziec PRZED pokojem,
      nie w pokoju. NIE zazadal honorarium, weta ani warunku - to jest pytanie, nie brama. ODPOWIEDZI
      NIE DOSTAL w tej turze. CZEGO NIE POWIEDZIAL, choc doszedl do krawedzi: ani slowa o Orenie, o zmienianych
      trasach, o zeznaniu npc_halvek_wagonman ani o tym, ze kaplan przyszedl na cmentarz z Orenem. converging_target#consequence
      zostaje - zaden z nich nie dopowiedzial tego do konca na glos, a dopowiedzenie jest ruchem GRACZA.
      oren_connection bez zmian, confirmation_route przez Halveka nietknieta.'
  - fact_id: fact_kesz_wrote_unagreed_next_to_the_papers_and_the_rooms_share
    source_event_id: event_turn_interlude_244
    claim: 'Lucan powiedzial, ze temat garbarni jest uzgodniony, i przeszedl do kaplana - ale dwa praktyczne
      pytania Kesza z t_243 zostaly bez odpowiedzi: KIEDY dostanie papiery (zone_wall_void baszty, trzy
      kwadranse marszu, t_086) i ILE DOSTAJE POKOJ. Kesz dopisal przy nich w ksiedze nieumowione, jedna
      linijka, i nie wrocil do tematu - jego kalendarz od tego zalezy, ale nacisku nie stawia (retcon_000142).
      Nazwiska urzednika akt nie zazadal juz w ogole, zgodnie z tym, co sam powiedzial w t_243.'
  - fact_id: fact_kesz_accepted_the_two_road_strategy_and_goes_to_the_city_first
    source_event_id: event_turn_interlude_243
    claim: 'STRATEGIA LUCANA PRZYJETA W CALOSCI. Miasto - zajecie majatku i oplata; gildia - zamkniecie
      sprawy; zaden wspolny papier, wiec jedna sprawa nie zapala drugiej. PIECZEC ZAMKNIETA PO JEGO WOLI:
      Lucan powiedzial zakladam, ze nie wiesz, i Kesz to przyjal - wie, ze pieczec istnieje, NIE wie gdzie
      jest i nie chce wiedziec; nie zapisal i nie wraca. PIERWSZY KROK UMOWIONY I WYKONALNY BEZ NAZWISKA
      URZEDNIKA: idzie od rana do miasta, bo Lucan jest wierzycielem ze ZLOZONYM pismem (inventory#two_open_debts)
      i wierzyciel moze WNIESC O ZAJECIE majatku dluznika - urzednik akt jest potrzebny do ruszenia REJESTRU
      WLASNOSCI, nie do wniosku, a rejestru Kesz nie tyka. Nazwiska nie zazadal trzeci raz (retcon_000121),
      powiedzial tylko, gdzie droga sie bez niego konczy. POPRZEDNI WLASCICIEL: przyjal, ze nie ma praw
      do terenu, bo obecny nabyl wszystko na nowo - czyli stary jest bezwartosciowy dla samego nabycia
      i wartosciowy tylko jako osobny towar.'
  - fact_id: fact_kesz_named_the_price_of_throwing_the_old_owner_to_the_guild
    source_event_id: event_turn_interlude_243
    claim: 'Lucan zaproponowal rzucenie gildii starego wlasciciela jako udokumentowanego sprawcy, zeby
      domknela wlasne postepowanie. Kesz nazwal to najlepszym pomyslem wieczoru i NIE odradzil. DOLOZYL
      JEDNA CENE, JEDNYM ZDANIEM, I JEST TO CYTAT Z PLIKU, NIE HAK (retcon_000058 - nie powstala zadna
      lista, zaden swiadek, zaden zegar): inventory#item_tannery_owner_cache.why_it_matters_now mowi,
      ze te papiery to DOKLADNIE ta kategoria prawna, o ktora toczy sie otwarta dysputa, a katedra npc_ivar_kolm
      to biomutanty - Lucan trzyma gotowy precedens z Lumarii, ze ktos juz to robil pod warsztatem i miasto
      tego nie zobaczylo. To samo pismo, ktore zamyka postepowanie gildii, uzbraja wiec druga strone dysputy
      za okolo 16 dni. Decyzji NIE ZAZADAL teraz. NIEROZSTRZYGNIETE: czy stary wlasciciel zyje (tannery-owner#do_not_invent)
      - a to decyduje, czy gildia dostaje sprawce, czy tylko akta. ZAPYTAL O TERMIN dostarczenia papierow,
      bo leza trzy kwadranse marszu od miasta (t_086), a noc Lucana jest juz zajeta.'
