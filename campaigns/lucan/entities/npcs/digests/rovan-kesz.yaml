knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_lost_half_his_ignorance_before_the_priest_meeting
    source_event_id: event_turn_interlude_203
    claim: 'Byl w pokoju, gdy Lucan podal pryncypalowi SKALE: najlepszy przypadek to trupy wychodzace
      z ziemi jak za pierwszym razem, najgorszy to zawalenie miasta w pustki pod nim. PRECYZJA, KTOREJ
      NIE WOLNO ZGUBIC: padly KONSEKWENCJE, nie przyczyna. Kesz nadal NIE WIE, CO jest pod cmentarzem,
      i moze to dalej uczciwie powiedziec - nie moze juz powiedziec, ze nie wie, ze to jest powazne. To
      zmniejsza o polowe zalete, ktora sam nazwal w t_194 (fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest:
      niesie rame, nie znajac tresci, bo czlowieka, ktory nie wie, nie da sie zmusic do rozwiniecia).
      Nazwal to sam, bez pretensji - wszedl w to dobrowolnie. forbidden_without_source nienaruszone: varkhen_existence,
      lucan_necromancy, spidey_existence.'
  - fact_id: fact_kesz_stands_inside_the_phase_two_trigger
    source_event_id: event_turn_interlude_202
    claim: Zauwazyl i powiedzial na glos, ze nowa faza druga odpala sie, kiedy odbeda sie przesluchanie
      i dysputa - a on od t_199 STOI NA TYM PRZESLUCHANIU jako gwarant proceduralny. Nie jest wiec tylko
      linia niosaca pokojowi kalendarz; jego obecnosc wspoltworzy moment przejscia na drugi talerzyk.
      Powiedzial to sucho, bez pretensji i NIE ZAZADAL za to niczego (states_his_position_before_he_has_to).
  - fact_id: fact_kesz_finally_has_the_calendar_he_asked_for
    source_event_id: event_turn_interlude_201
    claim: 'DOSTAL ETAPY DO DATY, KTORA MIAL OD t_105b. fact_kesz_knows_about_the_two_week_deadline mowi,
      ze przyjal zapowiedz wojny domowej jako date w kalendarzu i chcial wiedziec, po ktorej stronie ma
      stac jego pokoj - ale mial sama date, bez etapow. Teraz zna cztery fazy protokolu Tobiego: stan
      obecny, wszystkie strony swiadome, kordon, wejscie oddzialu na cmentarz. NIE ZAPYTAL, co jest pod
      cmentarzem - konsekwentnie z t_194, gdzie sam uznal wlasna niewiedze za zalete, bo nie da sie go
      zmusic do rozwiniecia czegos, czego nie wie. forbidden_without_source nienaruszone.'
  - fact_id: fact_kesz_got_his_seraphine_answer_and_it_costs_him
    source_event_id: event_turn_interlude_200
    claim: 'ZAMKNIETE po drugim pytaniu. Seraphine NIE wie i ma sie dowiedziec dopiero po tym, jak zezna
      przed Straza to, co musi - powod Lucana jest sekwencyjny, nie osobisty: nie chce, zeby powiedziala
      za duzo i za szybko. Kesz przyjmuje bez sporu, bo jest juz w srodku, ale nazywa, co stracil: w t_194
      mowil, ze wolalby nie dowiedziec sie tego RAZEM z nia, a ta odpowiedz znaczy dokladnie tyle, ze
      dowie sie razem z nia albo po niej. NIE PYTAC O TO TRZECI RAZ - pytanie jest odpowiedziane (retcon_000121).'
