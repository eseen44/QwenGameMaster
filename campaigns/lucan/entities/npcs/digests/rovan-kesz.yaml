knowledge:
  recent_confirmed:
  - fact_id: fact_kesz_accepted_the_two_road_strategy_and_goes_to_the_city_first
    source_event_id: event_turn_interlude_243
    claim: 'STRATEGIA LUCANA PRZYJETA W CALOSCI. Miasto - zajecie majatku i oplata; gildia - zamkniecie
      sprawy; zaden wspolny papier, wiec jedna sprawa nie zapala drugiej. PIECZEC ZAMKNIETA PO JEGO WOLI:
      Lucan powiedzial zakladam, ze nie wiesz, i Kesz to przyjal - wie, ze pieczec istnieje, NIE wie gdzie
      jest i nie chce wiedziec; nie zapisal i nie wraca. PIERWSZY KROK UMOWIONY I WYKONALNY BEZ NAZWISKA
      URZEDNIKA: idzie od rana do miasta, bo Lucan jest wierzycielem ze ZLOZONYM pismem (inventory#two_open_debts)
      i wierzyciel moze WNIESC O ZAJECIE majatku dluznika - urzednik akt jest potrzebny do ruszenia REJESTRU
      WLASNOSCI, nie do wniosku, a rejestru Kesz nie tyka. Nazwiska nie zazadal trzeci raz (retcon_000121),
      powiedzial tylko, gdzie droga sie bez niego konczy. POPRZEDNI WLASCICIEL: przyjal, ze nie ma praw
      do terenu, bo obecny nabyl wszystko na nowo - czyli stary jest bezwartosciowy dla samego nabycia
      i wartosciowy tylko jako osobny towar.'
  - fact_id: fact_kesz_named_the_price_of_throwing_the_old_owner_to_the_guild
    source_event_id: event_turn_interlude_243
    claim: 'Lucan zaproponowal rzucenie gildii starego wlasciciela jako udokumentowanego sprawcy, zeby
      domknela wlasne postepowanie. Kesz nazwal to najlepszym pomyslem wieczoru i NIE odradzil. DOLOZYL
      JEDNA CENE, JEDNYM ZDANIEM, I JEST TO CYTAT Z PLIKU, NIE HAK (retcon_000058 - nie powstala zadna
      lista, zaden swiadek, zaden zegar): inventory#item_tannery_owner_cache.why_it_matters_now mowi,
      ze te papiery to DOKLADNIE ta kategoria prawna, o ktora toczy sie otwarta dysputa, a katedra npc_ivar_kolm
      to biomutanty - Lucan trzyma gotowy precedens z Lumarii, ze ktos juz to robil pod warsztatem i miasto
      tego nie zobaczylo. To samo pismo, ktore zamyka postepowanie gildii, uzbraja wiec druga strone dysputy
      za okolo 16 dni. Decyzji NIE ZAZADAL teraz. NIEROZSTRZYGNIETE: czy stary wlasciciel zyje (tannery-owner#do_not_invent)
      - a to decyduje, czy gildia dostaje sprawce, czy tylko akta. ZAPYTAL O TERMIN dostarczenia papierow,
      bo leza trzy kwadranse marszu od miasta (t_086), a noc Lucana jest juz zajeta.'
  - fact_id: fact_kesz_will_carry_the_honest_business_offer_to_the_principal
    source_event_id: event_turn_interlude_243
    claim: 'DRUGA, SZERSZA OFERTA DO SYNDYKATU - dotyka obligation_define_syndicate_exchange_beyond_gold,
      ktorego status to first_substantive_offer_made_not_yet_accepted (oferta z t_198: odpad jubilerski,
      potencjalnie Akademia jako odbiorca, UMOWY NIE MA). Lucan kazal przedstawic garbarnie jako POCZATEK
      SWOJEJ UCZCIWEJ PRZEDSIEBIORCZOSCI, ktora bedzie wymagala logistyki, pomocy prawnej i mniej prawnej
      - czyli wszystkiego, na czym pokoj zarabia - z pieczatka gildii pod statusem prawnym jako wisienka.
      Kesz WEZMIE to do pokoju i nie odradzil. POPRAWIL ADRES OFERTY, i jest to odczyt z pliku, nie madrosc
      z urzedu (retcon_000040): syndicate-weigher#seraphines_reading_of_the_motive mowi, ze syndykat KUPUJE
      PRZYSZLOSC TERENU - pryncypal sam powiedzial, ze pusta linia sciagnie kogos w ciagu tygodni i ze
      ktokolwiek ja wezmie, bedzie potrzebowal cmentarza. Wiec pokoju nie trzeba przekonywac do gruntu;
      pokoj grunt juz kupuje. Rada: Lucan ma SAM nazwac udzial pokoju, zanim pokoj nazwie go za niego.
      standing.room_condition nienaruszone - pryncypal nadal nienazwany, slowa Don Kesz nie powtarza.
      Pytanie czyja twarz kupuje zaklad NADAL OTWARTE - oferta go nie zalatwia.'
  - fact_id: fact_kesz_heard_the_papers_are_unclaimable_and_named_the_other_end
    source_event_id: event_turn_interlude_242
    claim: 'USLYSZAL WERSJE, NIE PRAWDE. Lucan powiedzial mu, ze papiery znalazl formalnie W SMIECIACH,
      eksplorujac ruiny i laboratoria biomutantow pod posesja, i ze wlasciciel nie moze ich przyznac,
      bo przyznalby, ze wiedzial o laboratoriach oznaczonych jako zagrozenie dla miasta - a za ich ukrywanie
      grozi mu dluga odsiadka. ZAPISYWAC JAKO TO, CO USLYSZAL: prawda z plikow jest inna i sie NIE ZMIENIA
      (papiery ze SKRYTKI i MIESZKANIA obecnego wlasciciela, otwartych jego wlasnymi kluczami - tannery-owner#the_vault,
      #the_lodging; retcon_000120). Wersja lezy w state/secrets.yaml#cover_stories. SAM ARGUMENT Kesz
      uznal za dobry i jest to odczyt z pliku, nie retoryka (tannery-owner#why_he_was_detained, #what_he_refuses).
      POKAZAL JEGO DRUGI KONIEC, bez nazywania kogokolwiek po imieniu: papier, ktorego wlasciciel nie
      moze przyznac, nie jest przez to papierem bez zainteresowanych, bo opisuje LABORATORIA, a to wynika
      z kategorii dokumentu, nie z niczyjego spisu (zadna lista, zaden swiadek, zaden zegar - retcon_000058,
      retcon_000055).'
