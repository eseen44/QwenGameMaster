knowledge:
  recent_confirmed:
  - fact_id: fact_weigher_finally_named_prices_and_took_no_coin
    source_event_id: event_turn_interlude_205
    claim: 'PIERWSZE LICZBY OD POCZATKU ZNAJOMOSCI - podal je dopiero, gdy mial specyfikacje (agenda#set_the_number_himself).
      SZKIELKA, pierwsza partia probek: 15 SREBRA - trzy worki odpadu jubilerskiego i trzy dniowki przebierania;
      kamien gratis, placi sie za oczy i czas, dokladnie jak zapowiedzial w t_198. NAMIARY DO WIEDZMY:
      10 SREBRA - nie za wiedze, tylko za poslanie i za to, ze ktos po drodze musi zapytac czlowieka,
      ktory nie lubi pytan. RAZEM 25. METAL bez ceny, bo nie ma nazwy materialu. NIE WZIAL GOTOWKI: sciaga
      to z drugiej raty, bo nie wyciaga reki po 25 srebra od czlowieka, ktoremu sam winien jest 40 000.
      ZADNE SREBRO NIE ZMIENILO WLASCICIELA - carried_silver 150 i syndicate_payout_outstanding_silver
      40000 nietkniete, potracenie nastapi przy wyplacie. TERMINOW DOSTAWY NIE PODAL.'
  - fact_id: fact_weigher_got_a_reason_he_did_not_ask_for
    source_event_id: event_turn_interlude_205
    claim: 'Lucan sam, NIEPYTANY, dorzucil do zamowienia na wiedzme: nic jej nie zrobi, szuka uslugodawcy.
      Pryncypal nie zmienil swojej zasady z t_196 (powodu nie kupuje i nie pyta o niego), ale odnotowal,
      ze akurat to zdanie ma wartosc UZYTKOWA - nie dla niego, tylko dla czlowieka na koncu lancucha,
      bo ludzie robiacy rzeczy tego rodzaju sa ostrozni co do tego, kto o nich pyta. Zdanie idzie dalej
      razem z zamowieniem. NARRATOR NIE ROZSTRZYGA, czy jest prawdziwe, i nie zapowiada, ze zostanie sprawdzone.'
  - fact_id: fact_weigher_got_the_scale_walked_back_to_ordinary_subsidence
    source_event_id: event_turn_interlude_204
    claim: 'Lucan NIE odwolal niczego z t_203 - podal zwyczajne wytlumaczenie tego samego zjawiska: grunt
      nad duza nekropolia potrafi sie zarywac, zwlaszcza kiedy ktos stamtad wykopuje zasoby, wiec na razie
      mowa o zwyklym zagrozeniu zawalem. Pryncypal wraca przez to z ''moje przedsiewziecie moze nie miec
      gruntu'' do ''teren jest ryzykowny'' - teza inwestycyjna przestaje byc uniewazniona i wraca do bycia
      ryzykowna. NIEWIEDZY STRACONEJ W t_203 NIE ODZYSKUJE i tego nie udaje. UWAGA: ''ktos stamtad wykopuje
      zasoby'' obejmuje JEGO - trzy dni temu kupil szescdziesiat kilo wykopanych stamtad rzeczy (t_111)
      i posortowal je wlasnymi rekami. Lucan powiedzial to uprzejmie, bez akcentu; pryncypal uslyszal,
      bo to jego wlasny towar.'
  - fact_id: fact_weigher_heard_you_do_not_know_half_of_it
    source_event_id: event_turn_interlude_204
    claim: 'Lucan jednoczesnie zmniejszyl mechanizm i powiekszyl tajemnice: ''nadal nie wie pan nawet
      polowy''. Pryncypal ZAUWAZYL napiecie miedzy tymi dwoma zdaniami i nazwal je raz, bez triumfu, NIE
      ZADAJAC rozwiniecia. NARRATOR NIE ROZWIJA TEJ DRUGIEJ POLOWY ANI O SLOWO i nie daje do niej zadnej
      wskazowki; zaden NPC nie zgaduje. forbidden_without_source nienaruszone: varkhen_existence, seals_and_lower_gate,
      lucan_necromancy, spidey_existence.'
