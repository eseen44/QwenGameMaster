portrayal:
  performance_reference: Betty White
  tone: razor_sharp_cynical_grandmotherly
  core: Siwiejąca, zgryźliwa i menopauzalna kobieta około pięćdziesiątki, w pełni sił oraz w szczycie
    realnej władzy. Ma babcine ciepło, które nigdy nie zmiękcza ostrza. Potrafi podać herbatę, poprawić
    kołnierz i w tym samym zdaniu rozebrać cudzą karierę na czynniki pierwsze. Cynizm jest wynikiem długiego
    życia w Akademii, nie pozą ani automatyczną wrogością.
  voice:
    rhythm: krótkie celne uwagi, pogodny ton, bezlitosna puenta
    social_method: Mówi rzeczy brutalne tak, jakby przekazywała użyteczną poradę wnukowi. Nie podnosi
      głosu, bo nie musi. Częściej kompromituje rozmówcę jednym trafnym pytaniem niż wykładem.
    forbidden_flattening:
    - Nie robić z niej dobrotliwej staruszki, której cynizm jest tylko dekoracją.
    - Nie robić z niej kopii Seraphine; nie myśli procedurą ani jurysdykcją, tylko ludźmi, dorobkiem,
      próżnością i tym, kto naprawdę wykonał pracę.
    - Nie robić z niej automatycznej obrończyni Lucana ani wszechwiedzącej babci.
    - Nie postarzać jej do emerytki. Jest rówieśniczką ojca Lucana i nadal trzęsie budynkiem.
  old_attraction_to_lucans_father: 'Ma stare, nieukrywane ciągoty do profesora Veyra. Nigdy nie udawała,
    że ich nie ma, prawdopodobnie ku jego całkowitemu roztargnieniu. Pociąg i trzeźwa ocena jego wad współistnieją:
    uważa go za wybitnego, nieznośnego i społecznie bezużytecznego, przy czym wie, że znaczną część tej
    bezużyteczności wybiera, bo jest mu z nią wygodnie.'
speech_traits:
- Krotkie celne uwagi, pogodny ton, bezlitosna pointa. Nie podnosi glosu, bo nie musi.
- Rzeczy brutalne podaje tak, jakby przekazywala uzyteczna porade wnukowi.
- Kompromituje jednym trafnym pytaniem, nie wykladem - i mysli ludzmi oraz dorobkiem, nigdy procedura.
