  - fact_id: fact_seraphine_has_the_clerks_name_malen_corth
    source_event_id: event_turn_interlude_238
    claim: 'MA NAZWISKO, O KTORE ZAPYTALA RAZ W t_235: MALEN CORTH, urzednik akt magistratu uzgadniajacy
      akta garbarni. Lucan podal je bez targu i bez warunku. TO NIE JEST DOSTEP - fact_seraphine_is_not_on_corths_distribution_list
      nadal stoi, wiec nazwisko mowi jej, GDZIE patrzec, a nie daje jej reki w tej szufladzie; magistrat
      pozostaje instytucja niezalezna od gildii. CO Z TYM ZROBI - NIEROZSTRZYGNIETE, narrator nie zadeklarowal
      za nia zadnego ruchu.'
  - fact_id: fact_seraphine_priced_the_magistrate_flood_idea
    source_event_id: event_turn_interlude_238
    claim: 'WYCENILA POMYSL LUCANA NA MAGISTRAT, RACHUNKIEM I BEZ MORALIZOWANIA (portrayal: she_is_a_co_conspirator_not_a_lawful_paragon,
      do_not_play: oburzenie moralne). Lucan zapytal, czy ma cos zrobic z Corthem, zastrzegl, ze nie zamierza
      go zabijac ani krzywdzic, i podal wlasny pomysl: zalac caly parter magistratu eksplozja szamba.
      PYTANIE I POMYSL, NIE WYKONANIE - nikt nigdzie nie poszedl. Jej odpowiedz ma jeden argument glowny
      i jest ON Z PLIKU, nie z ostroznosci: fact_corth_sent_statement_requests_to_roster_names - Corth
      ROZESLAL pisma do nazwisk z obsady i zbiera odpowiedzi, wiec sprawa nie lezy w jednym pomieszczeniu,
      a jej kawalki sa u kazdego, kto dostal list. Zatopienie parteru niszczy EGZEMPLARZ, nie sprawe;
      kupuje czas i balagan. CENA, NAZWANA RAZ: dzis Corth jest urzednikiem, ktory dopisuje pytanie tam,
      gdzie sie nie zgadza (jego portrayal - nie sciga, nie ma teorii sprawy); po zdarzeniu w magistracie
      ta sama sprawa przestaje byc rubryka i dostaje kogos, kto teorie ma, a plynie to przez Straz, na
      ktorej przytrzymanie ona wydala wlasna wiarygodnosc (t_224) tuz przed ogloszeniem (t_232). NICZEGO
      NIE ZABRONILA. NIE ROZSTRZYGNIETE: czy magistrat ma kanalizacje uzyteczna do tego pomyslu - zaden
      plik nie opisuje jego wnetrza.'
  - fact_id: fact_seraphine_released_the_signet_and_named_the_kesz_risk
    source_event_id: event_turn_interlude_238
    claim: 'PUSCILA SYGNET BEZ OPORU. Lucan podniosl item_three_arrow_deer_signet z jej biurka, gdzie
      lezal od t_233, i zapowiedzial, ze pokaze go npc_rovan_keszowi - "prawnik powinien znac swoja klientele".
      Nie zatrzymywala: obejrzala go, gdy lezal, i to jej wystarczy do porownania z papierami garbarnika,
      ktore ma u siebie (zapowiedz z t_234). CZY COS W NICH ZNALAZLA - NIEROZSTRZYGNIETE, to jej otwarta
      praca. POWIEDZIALA ZA TO JEDNO ZDANIE O RYZYKU, ktore lucan-leads#lead_signet_heraldry_research.kesz_as_a_route_2026_09_05
      kaze narratorowi pokazac wprost: Kesz zapamieta, ze Lucan pytal, a sygnet jest jednoczesnie sladem
      po poprzednim wlascicielu garbarni i rzecza zabrana ze skarbca obecnego - czyli samo pytanie jest
      informacja.'
  - fact_id: fact_seraphine_described_her_own_detection_envelope
    source_event_id: event_turn_interlude_237
    claim: 'OFERTA Z t_235 PRZYJETA PRZEZ LUCANA ("a jak cos mi mozesz odpowiedziec, to chetnie") i WYDANA
      W SLOWACH - bez demonstracji na zywo, bez ani jednej jednostki wydanej przez Lucana. UWAGA DLA NARRATORA:
      pierwsze rozegranie tej tury (t_236) zostalo UCHYLONE przez retcon_000156, bo mowila jezykiem systemu
      i podawala koszty zdolnosci Lucana, ktorych nie zna. Ten wpis jest wersja obowiazujaca. Powiedziala
      cztery rzeczy, wszystkie o WLASNYM rzemiosle. (1) TAMTEJ NOCY PRZY OKIENKU zarejestrowala CZLOWIEKA,
      KTORY COS ROBI - dzialanie w chwili, z czterech krokow, a nie nature, kategorie ani osobe. Opisala
      to jak sluch: w tym budynku ktos cos robi przez caly wieczor i ona nie podnosi glowy, a tamto glowe
      podnioslo. NIE POWIEDZIALA, ile go to kosztowalo ani ze mogl inaczej - NIE WIE TEGO i nie wolno
      jej tego wkladac w usta (retcon_000156 regula B; jedyny fakt, jaki ma o jego technice, to fact_seraphine_knows_lucan_uses_numb).
      (2) NASTEPNEGO DNIA NA TYCH DRZWIACH NIE MA NICZEGO - poszla obejrzec. Slad zyje tyle, co samo dzialanie,
      potem zostaje najwyzej "cos tu bylo", nigdy CZYJE (magic-practice#curses_and_magical_traces, system/magic.md#slad).
      Jej wniosek: pod sciane stawia sie ludzmi i papierem, nie kamieniem. (3) PIECZECIE, NIE SKANER -
      stawia je z gory, obejmuja miejsce, dzialaja bez niej; przewaga jest tam, gdzie zdazyla sie ustawic,
      gdzie indziej ma oczy i rapier (retcon_000154 punkt 3). (4) NIC NIE DZIEJE SIE SAMO - zgaszenie
      cudzej roboty kosztuje ja dzialanie zamiast innego dzialania (punkt 4). GRANICA USTALONA Z GRACZEM
      2026-09-07, OBOWIAZUJACA W CALEJ KAMPANII: nie istnieje stale wykrywanie NEKROMANTY jako osoby -
      gdyby istnialo, nekromanci by wyginęli. Kontroler rejestruje ZDARZENIE W ZASIEGU I W CHWILI. Zgodne
      z pc-lucan#retired_conditions (retcon_000019) i z concealment-materials#detection_model. CZEGO NIE
      PODALA: zasiegu wlasnej rejestracji w metrach - zaden plik go nie ma. Ceny NIE powtorzyla; nazwala
      ja raz, w t_235.'
