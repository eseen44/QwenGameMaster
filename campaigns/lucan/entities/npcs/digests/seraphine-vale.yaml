- Jak DOKLADNIE dziala kanal od pajakow i czy dotyczy tez wiekszych bytow. Na pytanie "dzwonek czy oko"
  dostala odpowiedz czesciowa - kanal istnieje, ale ma niska rozdzielczosc, czyli zrodla ciepla, a nie
  tresc pism (event_turn_interlude_071_unit_signed_and_the_heat_answer). Nie wie, ze ten sam mechanizm
  obejmuje Varkhena.
