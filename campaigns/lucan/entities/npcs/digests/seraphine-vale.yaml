  - fact_id: fact_seraphine_answered_the_combat_mage_question
    source_event_id: event_turn_interlude_235
    claim: 'Lucan zapytal, czy gildia ma dostep do magow bojowych, od ktorych daloby sie cos podlapac.
      NIE OBIECALA NIKOGO I NIE PODALA ZADNEGO NAZWISKA - zaden plik nie stawia w gildii maga bojowego,
      instruktora ani szkoly, a skladu ekipy A-rank z garbarni nie zna nikt (narrator obsady nie produkuje,
      retcon_000058). Odpowiedziala tym, czym gildia jest: organizacja najmujaca ekipy do zadan, nie kadra
      do wypozyczania. ZAOFEROWALA ZA TO WLASNE RZEMIOSLO: pokazac Lucanowi, CO dokladnie zarejestrowala
      w t_038, kiedy rzucil wzmocnionego znika cztery kroki od niej - czyli jak wyglada z drugiej strony
      pieczeci. Cene nazwala sama, raz: antymagiczka pokazujaca nekromancie, co widzi, oddaje mu sposob
      ukrycia sie przed soba. Zrobi to mimo tego. OFERTA STOI I NIE ZOSTALA PRZYJETA ANI ODRZUCONA.'
  - fact_id: fact_seraphine_registered_lucans_position_on_rusk
    source_event_id: event_turn_interlude_235
    claim: 'Lucan odlozyl cene z t_234: Rusk nie jest dla niego problemem, ale nie odpowiada za jego stan
      psychiczny. Przyjela to bez wyceniania drugi raz (retcon_000135 a) i bez wracania do sledztwa kompetencyjnego.
      Podala natomiast wlasny fakt operacyjny: pioro jest wygaszone, zrobila to sama w t_123/125 i cene
      przyjela swiadomie - Rusk pisze dalej. Zestawila to z kanalem magistratu: Rusk piszacy i urzednik
      rozsylajacy pisma o potwierdzenie dat maja jeden wspolny obiekt, obsade operacji w garbarni z nazwiskiem
      Lucana. NIE ZADALA ANI WYGASZENIA, ANI SPOSOBU - to zamkniete (retcon_000121).'
  - fact_id: fact_seraphine_asked_again_for_the_clerks_name
    source_event_id: event_turn_interlude_235
    claim: 'Zapytana, co z urzednikiem rozpytujacym bez jej udzialu, powtorzyla wynik sprawdzenia z t_125:
      NIE MA NICZEGO - kanal magistratu jest calkowicie niezalezny od niej, a relacja z garbarni sklada
      sie bez gildii, z ludzi gildii, imiennie. Nazwiska NADAL NIE MA, bo odmowila jego przyjecia w t_122.
      TERAZ ZAPYTALA O NIE SAMA, RAZ - kontekst zmienila ona: ogloszenie kryzysu (t_232) i uklad ze Straza
      (t_228-232). PYTANIE STOI OTWARTE, Lucan nie odpowiedzial. Od t_125 nikt tam nie zajrzal.'
  - fact_id: fact_seraphine_conceded_varkhen_is_citable_as_ancient_guardian
    source_event_id: event_turn_interlude_234
    claim: 'PRZYJELA REKLAMACJE LUCANA I COFNELA WLASNA REGULE Z t_227. Jego argument: mowimy o WEWNETRZNEJ
      DOKUMENTACJI GILDII, nie o aktach miejskich; prywatna organizacja nie jest zwiazana cudza doktryna;
      zadne prawo nie zakazuje rozmowy z wyzszym nieumarlym - po prostu rzadko kto ma ku temu okazje.
      AUDYT PLIKU POTWIERDZA: necromancy-law#legal_baseline kryminalizuje tworzenie, utrzymywanie i kontrole,
      nie rozmowe, a varkhen_exposure.ancient_guardian_cover_story trzyma sie, dopoki kontrola pozostaje
      niedowiedziona i Varkhen wspolpracuje dobrowolnie. OD TEJ TURY: Varkhen jest cytowalny JAKO PRADAWNY
      STRAZNIK NEKROPOLII skladajacy dobrowolne zeznanie. Niecytowalne jest jedno zdanie - nieumarly,
      ktorego Lucan kontroluje. Ograniczeniem nie jest zrodlo, tylko brzmienie (retcon_000138).'
