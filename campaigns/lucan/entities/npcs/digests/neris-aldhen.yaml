knowledge:
  register_note: 'TO SA DANE, NIE PROBKA MOWY. Ponizsze `claim` sa zapisem protokolu tury: nie kazde zdanie
    audytu jest wiedza NPC. Sprawdz droge zdobycia informacji, oddziel obserwacje, cudza relacje i hipoteze.
    Reguly narratora nie sa faktami swiata. Przy claim_truncated doczytaj konkretny claim_full przed uzyciem:
    pominiety ogon moze zawierac warunek lub zaprzeczenie. Glos jest na gorze.'
  claim_cap_chars: 420
  recent_confirmed:
  - fact: Dostala kolejnosc zamiast nieokreslonego "nie dzis". Lucan idzie jutro rano na targ sprawdzic,
      czy ktos przepisze i oprawi tom i na kiedy; Neris jest nastepna po introligatorni, czyli egzemplarz
      trafia do niej po zrobieniu kopii. Umowili sie, ze pogadaja, co z tym zrobic, dopiero gdy go przeczyta
      - decyzja, czy balwierz wchodzi do jej tekstu i pod jakim nazwaniem, jest wiec swiadomie odlozona.
    source_event_id: event_turn_interlude_174
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/neris-aldhen.yaml#~dostala_kolejnosc_zamiast_nieokreslonego_nie_dzis
  - fact: 'Dostala marginalia bez targu i dostala ramke, W ktorej ma je czytac. Lucan zgodzil sie od razu,
      a potem powiedzial jej, kim byl poprzedni wlasciciel: Czarnorynkowym balwierzem, ktory probowal
      przywracac swiezych topielcow bez magii, sama anatomia, i mial pewne sukcesy.'
    source_event_id: event_turn_interlude_173
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/neris-aldhen.yaml#~dostala_marginalia_bez_targu_i_dostala
  - fact: 'Drugie pytanie o nia sama w ciagu jednego wieczoru. Po "trzymasz sie?" (t_169) Lucan zapytal
      wprost, czy zamierza cos zjesc, czy idzie spac. Alternatywa rozlaczna, wiec nie da sie jej zbyc
      szczeroscia jak poprzedniej - a prawdziwa odpowiedz brzmi ani jedno, ani drugie (portrayal.the_body:
      nie jadla, jest jej zimno, nie zauwaza tego; portrayal.the_social_gap: prosby dla siebie formuluje
      niezrecznie i za pozno).'
    source_event_id: event_turn_interlude_173
  - fact: 'Wie o marginaliach i dowiedziala sie od lucana, zanim mogla skadkolwiek indziej. Powiedzial
      jej sam, z wlasnej inicjatywy: poprzedni wlasciciel zapisal tom odrecznymi notatkami, notatki sa
      widowiskowe, ich pokazanie na dyspucie wystarczyloby, zeby ta dysputa zostala przegrana, a czlowiek,
      ktory je pisal, lubil makabreski i preparowanie.'
    source_event_id: event_turn_interlude_172
    claim_truncated: true
    claim_full: campaigns/lucan/entities/npcs/neris-aldhen.yaml#~wie_o_marginaliach_i_dowiedziala_sie
