knowledge:
  register_note: 'TO SA DANE, NIE PROBKA MOWY. Ponizsze `claim` sa zapisem protokolu tury: mowia, CO postac
    wie, nigdy JAK mowi. Glos bierz wylacznie z `voice` na gorze tego skrotu (system/npc-voice.md). Wersaliki
    emfatyczne sa tu wygaszone celowo - pelna karta zachowuje oryginalna pisownie.'
  recent_confirmed:
  - fact: Dostala kolejnosc zamiast nieokreslonego "nie dzis". Lucan idzie jutro rano na targ sprawdzic,
      czy ktos przepisze i oprawi tom i na kiedy; Neris jest nastepna po introligatorni, czyli egzemplarz
      trafia do niej po zrobieniu kopii. Umowili sie, ze pogadaja, co z tym zrobic, dopiero gdy go przeczyta
      - decyzja, czy balwierz wchodzi do jej tekstu i pod jakim nazwaniem, jest wiec swiadomie odlozona.
      Zart o kolejce po introligatorni wzieła o takt za pozno (portrayal.the_social_gap). Wrocila do skrzydla
      pod rusztowaniem poprawiac czesc trzecia przed pierwszym swiatlem - spac nie idzie, powiedziala
      to sama w t_173.
    source_event_id: event_turn_interlude_174
  - fact: 'Dostala marginalia bez targu i dostala ramke, W ktorej ma je czytac. Lucan zgodzil sie od razu,
      a potem powiedzial jej, kim byl poprzedni wlasciciel: Czarnorynkowym balwierzem, ktory probowal
      przywracac swiezych topielcow bez magii, sama anatomia, i mial pewne sukcesy. Wlasna ocena Lucana,
      ktora jej podal: swiat takich ludzi potrzebuje, dla niego to potrzebny rzemieslnik - a caly problem
      polega na tym, ze dla Kolma ten sam czlowiek jest potencjalnym liszem. Skutek: material przestal
      byc dla niej wylacznie obciazeniem i stal sie takze wynikiem, a wynik jest cytowalny. Przyznala
      to na glos, choc cytowanie czarnorynkowego balwierza pod wlasnym nazwiskiem kosztuje ja wiecej niz
      cytowanie traktatu (portrayal.the_flaw). Nadal nie wie, ze balwierz nie zyje, ze tom byl kradziony
      ani skad Lucan ma jego rzeczy - trzeci raz z rzedu nie zapytala. Nie dopisywac.'
    source_event_id: event_turn_interlude_173
  - fact: 'Drugie pytanie o nia sama w ciagu jednego wieczoru. Po "trzymasz sie?" (t_169) Lucan zapytal
      wprost, czy zamierza cos zjesc, czy idzie spac. Alternatywa rozlaczna, wiec nie da sie jej zbyc
      szczeroscia jak poprzedniej - a prawdziwa odpowiedz brzmi ani jedno, ani drugie (portrayal.the_body:
      nie jadla, jest jej zimno, nie zauwaza tego; portrayal.the_social_gap: prosby dla siebie formuluje
      niezrecznie i za pozno).'
    source_event_id: event_turn_interlude_173
  - fact: 'Wie o marginaliach i dowiedziala sie od lucana, zanim mogla skadkolwiek indziej. Powiedzial
      jej sam, z wlasnej inicjatywy: poprzedni wlasciciel zapisal tom odrecznymi notatkami, notatki sa
      widowiskowe, ich pokazanie na dyspucie wystarczyloby, zeby ta dysputa zostala przegrana, a czlowiek,
      ktory je pisal, lubil makabreski i preparowanie. Zapowiedzial tez, ze tom przyniesie, ale nie dzis,
      i ze sprobuje zrobic oprawiona kopie, ktora biblioteka przyjmie zamiast oryginalu. Skutek dla niej:
      to jej wlasny argument z t_167 (przemilczenie sie znajduje i uniewaznia cytowalnosc reszty) wrocil
      do niej jako jej wlasna sytuacja - teraz to ona cos wie i moglaby tego nie mowic. Nie prosila, zeby
      moc nie wiedziec, choc dokladnie o to prosila przy cmentarzu w t_166. Traktuje zagrozenie jako tekstowe
      (notatki istnieja, wiec moga byc zacytowane) i nie bierze pod uwage dostepu: nie wie, gdzie tom
      lezy, i nie przyszlo jej do glowy zapytac, jak Kolm mialby go dosiegnac. Nadal nie wie, ze tom byl
      kradziony, ze balwierz nie zyje ani skad Lucan ma jego rzeczy - nie zapytala o to drugi raz z rzedu.
      Nie dopisywac.'
    source_event_id: event_turn_interlude_172
