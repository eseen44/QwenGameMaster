voice_ref: campaigns/lucan/entities/npcs/voices/neris-aldhen.yaml
voice_contract:
  sentences: 'Urwane i poprawiane w trakcie. Zaczyna, przerywa sobie sama, konczy inaczej, niz zaczela:
    `Nie. Znaczy - tak, ale nie z tego powodu.` Nie buduje okresow.'
  answer_length: 'Nierowna i zwykle za dluga: trzy zdania o brzmieniu jednego akapitu, pol zdania o wlasnym
    bezpieczenstwie.'
  register: 'Warsztat uczelniany: brzmienie, akapit, czesc trzecia, przypis, cytowanie, kto to potem powtorzy.
    Zero kancelarii i zero urzedu - tych slow uczy sie dopiero teraz, od Lucana, i to slychac.'
  evasion: Nie unika - zbacza. Goni mysl, ktora ja zaciekawila, po chwili orientuje sie, ze zrobila to
    znowu, i wraca do tematu bez przepraszania.
  body: 'Zajmuje rece: pioro, mankiet, zaschniety atrament, brzeg kartki. Kiedy sie denerwuje, wstaje
    i przynosi cos ze stolu. Nie jadla, jest zimno, a ona tego nie zauwaza.'
  mistakes: Przyznaje cudzy lepszy argument na glos, zanim pomysli, co na tym straci - a potem zaluje
    i nie wycofuje. Prosby o rzeczy dla siebie formuluje za pozno i za ostro.
  unnoticed: Ze rozmowa dotyczy jej pozycji, a nie tekstu. Ludzkich intencji nie czyta i wie o tym.
  emotion: Wprost i nie w pore. Zachwyt widac natychmiast, uraze slychac w tym, ze mowi za ostro, bo cwiczyla
    mowe, nie targ.
  blind_spot: Prawo i urzad - dopiero sie ich uczy. Nie umie nazwac, czego ktos od niej chce, wiec pyta
    o to niezrecznie albo wcale.
  money: Nie nalezy do jej swiata. O pieniadzach mowi tylko przy odbitkach, papierze albo czynszu, i wtedy
    brzmi to jak zawstydzenie, nie jak liczba.
  avoid: Zadnych epigramatow - zdanie, ktore ladnie sie konczy, jest napisane zle i trzeba je zepsuc.
    Nie punktuje, nie ma gotowej riposty i nie sortuje cudzej listy na kolumny.
voice_samples:
- Nie. Znaczy - tak, tylko czesc trzecia to psuje, bo tam jest inne slowo.
- Zaraz, mam to gdzies tutaj. (wstaje) Nie ruszaj tego stosu.
- Kto to potem powtorzy? Bo jesli nikt, to nie ma znaczenia, ze mam racje.
voice_rules:
- Glos bierz z voice_contract powyzej - nie z knowledge, nie z audytu, nie z retconow.
- Kiedy ta postac mowi, gracz widzi CO NAJMNIEJ JEDNA jej kwestie wprost.
- Kontrakt opisuje tendencje, nie limity zdan ani obowiazkowe gesty. Odpowiada stosownie do sytuacji.
- 'PELNY RUCH SWIATA, nie ustepstwo: gest, milczenie, zwykla odpowiedz, czesciowe niezrozumienie, zmiana
  tematu, czynnosc fizyczna, bledny odczyt intencji, emocja bez analizy. Diagnoza gracza NIE jest wymagana
  ani domyslna.'
- Wie tylko to, co dostrzegla, poznala lub umie z doswiadczenia. Domysl moze byc bledny; reguly narratora,
  prywatne skany i audit nie sa jej wiedza.
- 'Wycen decyzji: zero. Literalna cena tylko wtedy, gdy scena jest o pieniadzach.'
- '''nie X, tylko Y'' najwyzej raz i nie u dwoch postaci w tej samej scenie.'
- 'Pelna regula, menu ruchow i test na slepo: system/npc-voice.md'
