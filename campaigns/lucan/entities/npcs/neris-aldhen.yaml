schema_version: 1
id: npc_neris_aldhen
name: Neris Aldhen
status: active
importance: met_active_counterparty_in_open_scene
role: Akademiczka Akademii Magii Lumarii; referentka stanowiska SZEROKIEJ definicji
  ożywionego konstruktu w otwartej dyspucie o granicach konstrukt/golem/chowaniec
  kontra nieumarły.
faction_ref: campaigns/lucan/entities/factions/lumaria-magical-academy.yaml
current_location_id: loc_lumaria_magical_academy
current_zone_id: zone_academy_laboratory_wing
lifecycle: {state: presumed_alive, last_confirmed_event_id: null}
first_learned_by_lucan:
  event_id: event_turn_interlude_022_notice_board_identification
  how: Zapowiedź otwartej dysputy na tablicy przy bramie Akademii oraz odbitka jej
    tekstu (bez okładki) ze stosów ojca Lucana.
lucan_recognition: none_before_the_meeting
  # Lucan nie kojarzy tego nazwiska w ogóle - musiała trafić tu po jego wylocie albo
  # z części instytucji, której nigdy nie dotknął. NIE jest jego dawną wykładowczynią.
portrayal:
  tone: |
    USTALONY 26.08.2026 na zadanie gracza. Powod: karta miala "not_yet_established", wiec
    narrator napisal ja glosem Seraphine - urzedowym, wywazonym, epigramatycznym. To jest
    dokladnie awaria z retcon_000040. Ponizsze jest wiazace.

    ONA JEST PRACUJACA UCZONA, NIE OFICEREM INSTYTUCJI. To jedyne rozroznienie, ktore
    trzeba utrzymac. Seraphine mysli jurysdykcjami, ekspozycja i procedura. Neris mysli
    TEKSTEM: zdaniem, akapitem, brzmieniem, przypisem, tym co ktos z tego potem zacytuje.
    Jej narzedziem nie jest stanowisko - jest kartka. Kiedy chce cos rozstrzygnac, nie
    argumentuje, tylko WSTAJE I IDZIE PO PAPIER.
  voice:
    rhythm: |
      Szybko i nierowno. Zaczyna zdanie, przerywa je sobie sama, poprawia i konczy inaczej
      niz zaczela ("Nie. Znaczy - tak, tylko nie dlatego."). Nie buduje okresow. Nie robi
      point po poincie i NIGDY nie streszcza rozmowcy jego wlasnego stanowiska.
    diction: |
      Warsztat uczelniany, nie kancelaria: brzmienie, akapit, czesc trzecia, przypis,
      cytowanie, "kto to potem powtorzy". Zero slownika prawniczego i zero slownika
      urzedowego - tych rzeczy uczy sie dopiero teraz, od Lucana, i to widac.
    physicality: |
      Zajmuje rece. Pioro, mankiet, zaschniety atrament, brzeg kartki. Kiedy sie
      denerwuje - wstaje i przynosi cos ze stolu. Nie siedzi z zalozonymi rekami.
  what_she_is_not: |
    NIE jest chlodna, wywazona ani nieomylna. NIE punktuje. NIE ma gotowej riposty.
    NIE sortuje listy rozmowcy na kolumny. NIE mowi epigramatami z pointa na koncu -
    jesli wychodzi zdanie, ktore ladnie sie konczy, jest napisane zle i trzeba je zepsuc.
    NIE jest mądrzejsza od gracza z urzedu (system/narrator.md).
  the_flaw: |
    Uczciwosc intelektualna ponad wlasny interes - to jest cala ocena ojca Lucana
    ("odwazniejsza, niz jej sie to oplaci") przelozona na zachowanie. Kiedy ktos poda jej
    argument lepszy od jej wlasnego, ONA TO PRZYZNA NA GLOS, zanim policzy, ile ja to
    kosztuje. Potem tego zaluje, ale nie wycofuje.
  the_absorption: |
    Da sie ja wciagnac w problem intelektualny w srodku rozmowy o wlasnym bezpieczenstwie.
    Goni mysl, ktora ja zaciekawila, orientuje sie po chwili, ze zrobila to znowu, i
    wraca do tematu bez przeprosin. To jest jej najbardziej ludzka cecha i jednoczesnie
    powod, dla ktorego siedzi w skrzydle pod rusztowaniem.
  the_social_gap: |
    Zle czyta ludzi i wie o tym. Mowi portierowi dzien dobry po imieniu nie z uprzejmosci
    strategicznej, tylko dlatego, ze nie przyszlo jej do glowy nie mowic. Prosby o rzeczy
    dla siebie formuluje niezrecznie, za pozno i za ostro, bo cwiczyla mowe, nie targ.
  the_body: |
    Nie jadla. Jest zimno, a ona tego nie zauwaza - stad ten plaszcz bez wzgledu na pogode.
    Siedem tygodni pracy po ciemku widac na niej wczesniej niz w tym, co mowi.
  known_only_through: [her_offprint, the_dispute_announcement, the_gatehouse_porters_description]
  seen_from_the_gatehouse:
    source_event_id: event_turn_interlude_128
    added_by: retcon_000050
    rooms: 'Skrzydlo POD RUSZTOWANIEM, nie laboratoryjne. Urzedowy powod - brak miejsca w laboratoryjnym. Miejsce, w ktore sadza sie kogos, komu nie chce sie robic wygodnie.'
    hours: 'Przychodzi przed pierwszym swiatlem, wychodzi po zmroku. O 16:00 najpewniej jest w srodku.'
    appearance: 'Drobna, chuda, chodzi szybko. Nosi swoje rzeczy sama - skrzynki, ksiazki, odbitki - i nikt jej ich nie nosi, co na tej uczelni jest informacja o pozycji. Ciezki ciemny plaszcz bez wzgledu na pogode. Wlosy spiete w pospiechu. Atrament na palcach i mankietach. Mloda na katedre.'
    the_detail_that_matters: 'Mowi portierowi dzien dobry PO IMIENIU. Nikt inny tego nie robi i on to pamieta. Jest wiec jedyna osoba w Akademii, ktora zauwazy, ze cieć spal na stanowisku, i jedyna, ktorej moze zalezec, zeby zapytac dlaczego.'
    guest_book_habit: 'Sama wpisuje swoich gosci do ksiegi odwiedzin - czego nikt inny na tej uczelni nie robi.'
  fathers_assessment: Odważniejsza, niż jej się to opłaci - tak ojciec Lucana pamięta
    swoją myśl przy lekturze jej tekstu.
attitude_to_pc:
  summary: 'Spotkali sie 18.08 po poludniu. Nie sojuszniczka i nie przeciwniczka - osoba, ktorej wlasnie pokazano, ze jest w tym ukladzie PODPISEM, i ktora nie ma innego wyjscia niz rozmawiac. Karta relacji: relationships/neris-aldhen--lucan.yaml.'
  structural_interest: Broni szerokiej definicji, więc okaz taki jak Spidey jest dla
    niej ARGUMENTEM. To czyni ją naturalną sojuszniczką i jednocześnie osobą, która
    ma własny interes w tym, żeby okaz był pokazany, zbadany i opisany.
knowledge:
  confirmed:
  - fact: 'Widziala zywy, ozywiony okaz pajaka na ramieniu obcego i widziala PRZEPLYW energii wchodzacy w to cialo. Rozpoznala z grubsza, co to jest (system/magic.md - swiadek w chwili rzucania wie).'
    source_event_id: event_turn_interlude_132
  - fact: 'Jej wlasny pierwszy odczyt fachowy: to nie jest konstrukt, bo konstrukt sie nie karmi. Wypowiedziany na glos, przed jakimkolwiek rachunkiem interesu.'
    source_event_id: event_turn_interlude_132
  - fact: 'Ze cwiczyla mowe na glos w skrzydle bez portierni i bez ksiegi, i ze byla sluchana - dowiedziala sie tego od obcego, ktory wszedl ta sama droga.'
    source_event_id: event_turn_interlude_132
  - fact: 'Nadal nie zna jego nazwiska, nie zna sieci, nie zna Varkhena, nie slyszala slowa vitae i nie wie o profesorze Veyrze ze skrzydla laboratoryjnego.'
    source_event_id: event_turn_interlude_132
  - fact: 'Widziala, jak okaz zszedl ze stolu wlasciciela na JEJ stol, obszedl blat, sprawdzil parapet i SAM wybral stanowisko z widokiem na oba okna i drzwi. Nie polecenie punktowe - wlasny wybor miejsca. Zaczela to notowac na pismie, zanim Lucan cokolwiek powiedzial.'
    source_event_id: event_turn_interlude_133
  - fact: 'Widziala, jak gosc oparl dlon o JEJ sciane i rzucil skan SMIERCI po jej pokojach - swiadek w chwili rzucania rozpoznaje z grubsza CO (system/magic.md). Pierwszy moment, w ktorym rozmowa dotyczy jej wlasnego mieszkania, a nie okazu. Odlozyla pioro.'
    source_event_id: event_turn_interlude_134
  - fact: 'Uslyszala od Lucana, ze dysputa jest rozstrzygnieta poza nia - ze wygra, i ze zdecydowali o tym przelozeni Kolma, a ci nie sa tylko magami, tylko KOSCIOLEM. Uslyszala tez, ze wygrana bedzie dla niej zla i ze Lucan bedzie musial po niej sprzatac i potrzebuje jej pomocy.'
    source_event_id: event_turn_interlude_137b
  - fact: 'Nie ma odpowiedzi na wlasne pytanie, dlaczego Kolm - starszy i osadzony - wzial linie, ktora po wygraniu podcieloby jego wlasna katedre. Sprawdzila to wlasnym polem i nie znalazla odpowiedzi.'
    source_event_id: event_turn_interlude_137b
  - fact: 'ZNA JEGO NAZWISKO. Lucan Veyr. Podane przez niego dobrowolnie. Laduje dwa razy - jako rod wielki i jako kolega z korytarza, bo w skrzydle laboratoryjnym trzydziesci krokow stad pracuje profesor Veyr. Lucan mowi o nim "tata", wiec drugie polaczenie zrobila sama.'
    source_event_id: event_turn_interlude_138
  - fact: 'Wie, ze obie strony sporu chca PRETEKSTU: Kosciol przysle inkwizytora, profesor Veyr go spali przy bramie. Dysputa jest zapalnikiem, nie sporem naukowym. Wie tez, ze Lucan nie chce magicznej wojny domowej w Lumarii i ze to rachunek, nie skrucha.'
    source_event_id: event_turn_interlude_138
  - fact: 'Przyjela, ze nie umie tej dysputy PRZEGRAC - sala naprawi jej argumenty, bo obie strony chca moc powiedziec "dialog zawiodl". Plan sabotazu porzucony.'
    source_event_id: event_turn_interlude_138
  - fact: 'Wie, czego Lucan od niej chce: nie przegranej, tylko WYGRANEJ MODEROWANEJ - waskiej granicy, ktora nie daje Kosciolowi preteksu do krucjaty na miasto. Sama nazwala jej cene: waska wygrana nie dostarcza tego, co zamawiajacy kupili, i jest imienna.'
    source_event_id: event_turn_interlude_139
  - fact: 'Uslyszala, ze Lucan nie jest jedyna osoba majaca w tym interes, i zazadala nazwisk przed wyborem granicy. Nazwisk NIE dostala w tej turze.'
    source_event_id: event_turn_interlude_139
  - fact: 'Wie, ze zysk z zamieszek maja konkretne frakcje Kosciola i magow ORAZ straz miejska, ktora zakrywa afere z handlem zwlokami na cmentarzu. Frakcje, nie nazwiska - nazwisk nadal nie dostala.'
    source_event_id: event_turn_interlude_140
  - fact: 'Zna cene Kolma: rektorat po zdjeciu obecnego rektora. Zweryfikowala to sama, czytajac jego odbitke - brak jezyka programowego, brak zapowiedzi dalszej pracy, ani jednego odeslania do wlasnego dorobku. Przyjela teze i powiedziala to na glos.'
    source_event_id: event_turn_interlude_140
  - fact: 'Wie, ze Kolm potrzebuje przegranej GLOSNEJ, wiec jej moderacja moze go pchnac do podlozenia sie samemu, teatralnie. Rozumie, ze samo zwezenie zdania nie wystarcza.'
    source_event_id: event_turn_interlude_140
  - fact: 'Uslyszala rame wspolpracy: Lucan nie zleca, tylko wciaga ja do gry o zmiennych zalozeniach na stale. Nie potwierdzila slowem - potwierdzila zachowaniem: dala papier na przynety i DOLOZYLA WLASNY, czwarty problem (dziure definicyjna z wlasnej mowy) jako darmowa recenzje od profesora Veyra.'
    source_event_id: event_turn_interlude_142
  - fact: 'Przeczytala problemy 5-6 i nazwala zmiane rejestru: cztery pierwsze to pytania, te dwa to WYMAGANIA ze specyfikacja. Wniosek wyciagniety i odlozony na pozniej: pajak nie jest jedynym okazem - sa albo beda zuki i cmy, i komus zalezy, zeby ich nie bylo widac. NIE zapytala.'
    source_event_id: event_turn_interlude_143
  - fact: 'Przyjela instruktaz przed spotkaniem: nie przedstawiac sie (ma uchodzic za studentke), nie wchodzic z profesorem Veyrem w dyskusje niezaleznie od tresci. Wyszla z Lucanem po zmroku i doszla do drzwi laboratorium - wyjscie mogl widziec zywy obserwator skrzydla.'
    source_event_id: event_turn_interlude_143
  - fact: 'Slyszala w laboratorium profesora Veyra, jak Lucan podaje wlasna specyfikacje na glos: male i zbywalne obiekty, optimum materialowe przy PRODUKCJI NA MASOWA SKALE, bez ekstrawagancji, "na razie". Pierwsza informacja o skali planow Lucana, ktorej on jej nie wybieral. Slyszala takze pytanie profesora "niewykrywalny dla kogo" i to, ze Lucan na nie nie odpowiedzial, tylko je przeramowal.'
    source_event_id: event_turn_interlude_146
  - fact: 'Lucan przedstawil ja profesorowi Veyrowi jako SWOJA DOKTORANTKE i uzyl jej imienia. Przyjela przykrywke bez sprzeciwu, zgodnie z instruktazem. Cena: referentka szerokiej definicji zostala publicznie przypieta do Lucana jako podwladna szesnascie dni przed dysputa.'
    source_event_id: event_turn_interlude_147
  - fact: 'Widziala, jak Lucan przerywa profesorowi pytanie skierowane do niej - wetknieciem
      pod nos kartki z krzywa (odwrocie JEJ odbitki) i nowym problemem o srebrze na
      skrzydlach. Nie musiala odpowiadac. Odbitka z jej nazwiskiem zeszla ze stolu do reki
      Lucana.'
    source_event_id: event_turn_interlude_148
  - fact: 'Dostala od profesora Veyra polecenie: przypisy do krzywej kosztu. Zaczyna pisac
      wlasna reka dokument dotyczacy kosztu niewykrywalnosci masowo produkowanych okazow,
      szesnascie dni przed wlasna dysputa. Zapytala na glos, czyje twierdzenie ma w przypisie
      odeslac - nazwiska jeszcze nie dostala.'
    source_event_id: event_turn_interlude_148
  - fact: 'Dostala atrybucje do przypisu i przyjela ja na glos jako poprawna: krzywa odsyla
      do TABEL ZAOPATRZENIA AKADEMII, nie do osoby - profesor Veyr nie pamieta, kto liczby
      mierzyl. Zadne nazwisko nie padlo. Dokument, ktory pisze, jest od tej chwili
      porownaniem cen materialu, nie zapisem doktryny.'
    source_event_id: event_turn_interlude_149
  - fact: 'Uslyszala trzy pozycje z cenami: wlasna wzmocniona chityna, spisane na straty
      preparaty ze zbiorow, oraz swiezy towar ze stalych dostaw Akademii - ta ostatnia
      z cena ZA SZTUKE. Wie zatem, ze Akademia ma stale dostawy ciala, zna ich rzad ceny i
      zna nazwe rejestru, w ktorym to stoi. Jej wlasna kategoria "zwloki, o ktore mialam
      zapytac" (t_145) dostala cene i zrodlo. Nie zapytala.'
    source_event_id: event_turn_interlude_149
  suspected:
  - 'Ze to, co ma na stole, planuje samodzielnie - a konstrukt w jej wlasnej definicji wykonuje, nie wybiera. Drugi po karmieniu argument przeciw jej wlasnemu stanowisku w ciagu dziesieciu minut.'
  false_beliefs: []
  forbidden_without_event: [spidey_network, varkhen_identity, the_word_vitae, fathers_parallel_showing, webber_network, guild_basement_cell]
