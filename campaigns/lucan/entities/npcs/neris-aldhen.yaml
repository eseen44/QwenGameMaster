  text: 'ZAMIERZALA PRZEGRAC DYSPUTA, zeby jej nazwisko nie poszlo na to zdanie. Nie wie, ze to jedyny ruch niszczacy obrone klasyfikacyjna Lucana - wygrana Kolma czyni okaz taki jak Spidey prawnie nieumarlym.'
