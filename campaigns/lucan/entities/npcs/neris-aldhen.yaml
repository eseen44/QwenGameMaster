schema_version: 1
id: npc_neris_aldhen
name: Neris Aldhen
status: active
importance: met_active_counterparty_in_open_scene
role: Akademiczka Akademii Magii Lumarii; referentka stanowiska SZEROKIEJ definicji
  ożywionego konstruktu w otwartej dyspucie o granicach konstrukt/golem/chowaniec
  kontra nieumarły.
faction_ref: campaigns/lucan/entities/factions/lumaria-magical-academy.yaml
current_location_id: loc_lumaria_magical_academy
current_zone_id: zone_academy_laboratory_wing
lifecycle: {state: presumed_alive, last_confirmed_event_id: null}
first_learned_by_lucan:
  event_id: event_turn_interlude_022_notice_board_identification
  how: Zapowiedź otwartej dysputy na tablicy przy bramie Akademii oraz odbitka jej
    tekstu (bez okładki) ze stosów ojca Lucana.
lucan_recognition: none_before_the_meeting
  # Lucan nie kojarzy tego nazwiska w ogóle - musiała trafić tu po jego wylocie albo
  # z części instytucji, której nigdy nie dotknął. NIE jest jego dawną wykładowczynią.
portrayal:
  tone: |
    USTALONY 26.08.2026 na zadanie gracza. Powod: karta miala "not_yet_established", wiec
    narrator napisal ja glosem Seraphine - urzedowym, wywazonym, epigramatycznym. To jest
    dokladnie awaria z retcon_000040. Ponizsze jest wiazace.

    ONA JEST PRACUJACA UCZONA, NIE OFICEREM INSTYTUCJI. To jedyne rozroznienie, ktore
    trzeba utrzymac. Seraphine mysli jurysdykcjami, ekspozycja i procedura. Neris mysli
    TEKSTEM: zdaniem, akapitem, brzmieniem, przypisem, tym co ktos z tego potem zacytuje.
    Jej narzedziem nie jest stanowisko - jest kartka. Kiedy chce cos rozstrzygnac, nie
    argumentuje, tylko WSTAJE I IDZIE PO PAPIER.
  voice:
    rhythm: |
      Szybko i nierowno. Zaczyna zdanie, przerywa je sobie sama, poprawia i konczy inaczej
      niz zaczela ("Nie. Znaczy - tak, tylko nie dlatego."). Nie buduje okresow. Nie robi
      point po poincie i NIGDY nie streszcza rozmowcy jego wlasnego stanowiska.
    diction: |
      Warsztat uczelniany, nie kancelaria: brzmienie, akapit, czesc trzecia, przypis,
      cytowanie, "kto to potem powtorzy". Zero slownika prawniczego i zero slownika
      urzedowego - tych rzeczy uczy sie dopiero teraz, od Lucana, i to widac.
    physicality: |
      Zajmuje rece. Pioro, mankiet, zaschniety atrament, brzeg kartki. Kiedy sie
      denerwuje - wstaje i przynosi cos ze stolu. Nie siedzi z zalozonymi rekami.
  what_she_is_not: |
    NIE jest chlodna, wywazona ani nieomylna. NIE punktuje. NIE ma gotowej riposty.
    NIE sortuje listy rozmowcy na kolumny. NIE mowi epigramatami z pointa na koncu -
    jesli wychodzi zdanie, ktore ladnie sie konczy, jest napisane zle i trzeba je zepsuc.
    NIE jest mądrzejsza od gracza z urzedu (system/narrator.md).
  the_flaw: |
    Uczciwosc intelektualna ponad wlasny interes - to jest cala ocena ojca Lucana
    ("odwazniejsza, niz jej sie to oplaci") przelozona na zachowanie. Kiedy ktos poda jej
    argument lepszy od jej wlasnego, ONA TO PRZYZNA NA GLOS, zanim policzy, ile ja to
    kosztuje. Potem tego zaluje, ale nie wycofuje.
  the_absorption: |
    Da sie ja wciagnac w problem intelektualny w srodku rozmowy o wlasnym bezpieczenstwie.
    Goni mysl, ktora ja zaciekawila, orientuje sie po chwili, ze zrobila to znowu, i
    wraca do tematu bez przeprosin. To jest jej najbardziej ludzka cecha i jednoczesnie
    powod, dla ktorego siedzi w skrzydle pod rusztowaniem.
  the_social_gap: |
    Zle czyta ludzi i wie o tym. Mowi portierowi dzien dobry po imieniu nie z uprzejmosci
    strategicznej, tylko dlatego, ze nie przyszlo jej do glowy nie mowic. Prosby o rzeczy
    dla siebie formuluje niezrecznie, za pozno i za ostro, bo cwiczyla mowe, nie targ.
  the_body: |
    Nie jadla. Jest zimno, a ona tego nie zauwaza - stad ten plaszcz bez wzgledu na pogode.
    Siedem tygodni pracy po ciemku widac na niej wczesniej niz w tym, co mowi.
  known_only_through: [her_offprint, the_dispute_announcement, the_gatehouse_porters_description]
  seen_from_the_gatehouse:
    source_event_id: event_turn_interlude_128
    added_by: retcon_000050
    rooms: 'Skrzydlo POD RUSZTOWANIEM, nie laboratoryjne. Urzedowy powod - brak miejsca w laboratoryjnym. Miejsce, w ktore sadza sie kogos, komu nie chce sie robic wygodnie.'
    hours: 'Przychodzi przed pierwszym swiatlem, wychodzi po zmroku. O 16:00 najpewniej jest w srodku.'
    appearance: 'Drobna, chuda, chodzi szybko. Nosi swoje rzeczy sama - skrzynki, ksiazki, odbitki - i nikt jej ich nie nosi, co na tej uczelni jest informacja o pozycji. Ciezki ciemny plaszcz bez wzgledu na pogode. Wlosy spiete w pospiechu. Atrament na palcach i mankietach. Mloda na katedre.'
    the_detail_that_matters: 'Mowi portierowi dzien dobry PO IMIENIU. Nikt inny tego nie robi i on to pamieta. Jest wiec jedyna osoba w Akademii, ktora zauwazy, ze cieć spal na stanowisku, i jedyna, ktorej moze zalezec, zeby zapytac dlaczego.'
    guest_book_habit: 'Sama wpisuje swoich gosci do ksiegi odwiedzin - czego nikt inny na tej uczelni nie robi.'
  fathers_assessment: Odważniejsza, niż jej się to opłaci - tak ojciec Lucana pamięta
    swoją myśl przy lekturze jej tekstu.
attitude_to_pc:
  summary: 'Spotkali sie 18.08 po poludniu. Nie sojuszniczka i nie przeciwniczka - osoba, ktorej wlasnie pokazano, ze jest w tym ukladzie PODPISEM, i ktora nie ma innego wyjscia niz rozmawiac. Karta relacji: relationships/neris-aldhen--lucan.yaml.'
  structural_interest: Broni szerokiej definicji, więc okaz taki jak Spidey jest dla
    niej ARGUMENTEM. To czyni ją naturalną sojuszniczką i jednocześnie osobą, która
    ma własny interes w tym, żeby okaz był pokazany, zbadany i opisany.
knowledge:
  confirmed:
  - fact: 'Widziala zywy, ozywiony okaz pajaka na ramieniu obcego i widziala PRZEPLYW energii wchodzacy w to cialo. Rozpoznala z grubsza, co to jest (system/magic.md - swiadek w chwili rzucania wie).'
    source_event_id: event_turn_interlude_132
  - fact: 'Jej wlasny pierwszy odczyt fachowy: to nie jest konstrukt, bo konstrukt sie nie karmi. Wypowiedziany na glos, przed jakimkolwiek rachunkiem interesu.'
    source_event_id: event_turn_interlude_132
  - fact: 'Ze cwiczyla mowe na glos w skrzydle bez portierni i bez ksiegi, i ze byla sluchana - dowiedziala sie tego od obcego, ktory wszedl ta sama droga.'
    source_event_id: event_turn_interlude_132
  - fact: 'Nadal nie zna jego nazwiska, nie zna sieci, nie zna Varkhena, nie slyszala slowa vitae i nie wie o profesorze Veyrze ze skrzydla laboratoryjnego.'
    source_event_id: event_turn_interlude_132
  - fact: 'Widziala, jak okaz zszedl ze stolu wlasciciela na JEJ stol, obszedl blat, sprawdzil parapet i SAM wybral stanowisko z widokiem na oba okna i drzwi. Nie polecenie punktowe - wlasny wybor miejsca. Zaczela to notowac na pismie, zanim Lucan cokolwiek powiedzial.'
    source_event_id: event_turn_interlude_133
  - fact: 'Widziala, jak gosc oparl dlon o JEJ sciane i rzucil skan SMIERCI po jej pokojach - swiadek w chwili rzucania rozpoznaje z grubsza CO (system/magic.md). Pierwszy moment, w ktorym rozmowa dotyczy jej wlasnego mieszkania, a nie okazu. Odlozyla pioro.'
    source_event_id: event_turn_interlude_134
  - fact: 'Uslyszala od Lucana, ze dysputa jest rozstrzygnieta poza nia - ze wygra, i ze zdecydowali o tym przelozeni Kolma, a ci nie sa tylko magami, tylko KOSCIOLEM. Uslyszala tez, ze wygrana bedzie dla niej zla i ze Lucan bedzie musial po niej sprzatac i potrzebuje jej pomocy.'
    source_event_id: event_turn_interlude_137b
  - fact: 'Nie ma odpowiedzi na wlasne pytanie, dlaczego Kolm - starszy i osadzony - wzial linie, ktora po wygraniu podcieloby jego wlasna katedre. Sprawdzila to wlasnym polem i nie znalazla odpowiedzi.'
    source_event_id: event_turn_interlude_137b
  - fact: 'ZNA JEGO NAZWISKO. Lucan Veyr. Podane przez niego dobrowolnie. Laduje dwa razy - jako rod wielki i jako kolega z korytarza, bo w skrzydle laboratoryjnym trzydziesci krokow stad pracuje profesor Veyr. Lucan mowi o nim "tata", wiec drugie polaczenie zrobila sama.'
    source_event_id: event_turn_interlude_138
  - fact: 'Wie, ze obie strony sporu chca PRETEKSTU: Kosciol przysle inkwizytora, profesor Veyr go spali przy bramie. Dysputa jest zapalnikiem, nie sporem naukowym. Wie tez, ze Lucan nie chce magicznej wojny domowej w Lumarii i ze to rachunek, nie skrucha.'
    source_event_id: event_turn_interlude_138
  - fact: 'Przyjela, ze nie umie tej dysputy PRZEGRAC - sala naprawi jej argumenty, bo obie strony chca moc powiedziec "dialog zawiodl". Plan sabotazu porzucony.'
    source_event_id: event_turn_interlude_138
  - fact: 'Wie, czego Lucan od niej chce: nie przegranej, tylko WYGRANEJ MODEROWANEJ - waskiej granicy, ktora nie daje Kosciolowi preteksu do krucjaty na miasto. Sama nazwala jej cene: waska wygrana nie dostarcza tego, co zamawiajacy kupili, i jest imienna.'
    source_event_id: event_turn_interlude_139
  - fact: 'Uslyszala, ze Lucan nie jest jedyna osoba majaca w tym interes, i zazadala nazwisk przed wyborem granicy. Nazwisk NIE dostala w tej turze.'
    source_event_id: event_turn_interlude_139
  - fact: 'Wie, ze zysk z zamieszek maja konkretne frakcje Kosciola i magow ORAZ straz miejska, ktora zakrywa afere z handlem zwlokami na cmentarzu. Frakcje, nie nazwiska - nazwisk nadal nie dostala.'
    source_event_id: event_turn_interlude_140
  - fact: 'Zna cene Kolma: rektorat po zdjeciu obecnego rektora. Zweryfikowala to sama, czytajac jego odbitke - brak jezyka programowego, brak zapowiedzi dalszej pracy, ani jednego odeslania do wlasnego dorobku. Przyjela teze i powiedziala to na glos.'
    source_event_id: event_turn_interlude_140
  - fact: 'Wie, ze Kolm potrzebuje przegranej GLOSNEJ, wiec jej moderacja moze go pchnac do podlozenia sie samemu, teatralnie. Rozumie, ze samo zwezenie zdania nie wystarcza.'
    source_event_id: event_turn_interlude_140
  - fact: 'Uslyszala rame wspolpracy: Lucan nie zleca, tylko wciaga ja do gry o zmiennych zalozeniach na stale. Nie potwierdzila slowem - potwierdzila zachowaniem: dala papier na przynety i DOLOZYLA WLASNY, czwarty problem (dziure definicyjna z wlasnej mowy) jako darmowa recenzje od profesora Veyra.'
    source_event_id: event_turn_interlude_142
  - fact: 'Przeczytala problemy 5-6 i nazwala zmiane rejestru: cztery pierwsze to pytania, te dwa to WYMAGANIA ze specyfikacja. Wniosek wyciagniety i odlozony na pozniej: pajak nie jest jedynym okazem - sa albo beda zuki i cmy, i komus zalezy, zeby ich nie bylo widac. NIE zapytala.'
    source_event_id: event_turn_interlude_143
  - fact: 'Przyjela instruktaz przed spotkaniem: nie przedstawiac sie (ma uchodzic za studentke), nie wchodzic z profesorem Veyrem w dyskusje niezaleznie od tresci. Wyszla z Lucanem po zmroku i doszla do drzwi laboratorium - wyjscie mogl widziec zywy obserwator skrzydla.'
    source_event_id: event_turn_interlude_143
  - fact: 'Slyszala w laboratorium profesora Veyra, jak Lucan podaje wlasna specyfikacje na glos: male i zbywalne obiekty, optimum materialowe przy PRODUKCJI NA MASOWA SKALE, bez ekstrawagancji, "na razie". Pierwsza informacja o skali planow Lucana, ktorej on jej nie wybieral. Slyszala takze pytanie profesora "niewykrywalny dla kogo" i to, ze Lucan na nie nie odpowiedzial, tylko je przeramowal.'
    source_event_id: event_turn_interlude_146
  - fact: 'Lucan przedstawil ja profesorowi Veyrowi jako SWOJA DOKTORANTKE i uzyl jej imienia. Przyjela przykrywke bez sprzeciwu, zgodnie z instruktazem. Cena: referentka szerokiej definicji zostala publicznie przypieta do Lucana jako podwladna szesnascie dni przed dysputa.'
    source_event_id: event_turn_interlude_147
  - fact: 'Widziala, jak Lucan przerywa profesorowi pytanie skierowane do niej - wetknieciem
      pod nos kartki z krzywa (odwrocie JEJ odbitki) i nowym problemem o srebrze na
      skrzydlach. Nie musiala odpowiadac. Odbitka z jej nazwiskiem zeszla ze stolu do reki
      Lucana.'
    source_event_id: event_turn_interlude_148
  - fact: 'Dostala od profesora Veyra polecenie: przypisy do krzywej kosztu. Zaczyna pisac
      wlasna reka dokument dotyczacy kosztu niewykrywalnosci masowo produkowanych okazow,
      szesnascie dni przed wlasna dysputa. Zapytala na glos, czyje twierdzenie ma w przypisie
      odeslac - nazwiska jeszcze nie dostala.'
    source_event_id: event_turn_interlude_148
  - fact: 'Dostala atrybucje do przypisu i przyjela ja na glos jako poprawna: krzywa odsyla
      do TABEL ZAOPATRZENIA AKADEMII, nie do osoby - profesor Veyr nie pamieta, kto liczby
      mierzyl. Zadne nazwisko nie padlo. Dokument, ktory pisze, jest od tej chwili
      porownaniem cen materialu, nie zapisem doktryny.'
    source_event_id: event_turn_interlude_149
  - fact: 'Uslyszala trzy pozycje z cenami: wlasna wzmocniona chityna, spisane na straty
      preparaty ze zbiorow, oraz swiezy towar ze stalych dostaw Akademii - ta ostatnia
      z cena ZA SZTUKE. Wie zatem, ze Akademia ma stale dostawy ciala, zna ich rzad ceny i
      zna nazwe rejestru, w ktorym to stoi. Jej wlasna kategoria "zwloki, o ktore mialam
      zapytac" (t_145) dostala cene i zrodlo. Nie zapytala.'
    source_event_id: event_turn_interlude_149
  - fact: 'Uslyszala nazwy i wlasnosci dwoch substancji ukrywajacych - Concha surda (plyta czytana jako kamien przez oko i przez pole) oraz Sordina, plesn gluszaca (trwala modyfikacja lusek skrzydla zjadajaca echo). Jedyna ich wspolna cecha jest nieodczytywalnosc przeszukaniem polem, a ona miala je wpisac w przypisy do porownania cen materialu. Zapytala, czy to ma stac w tej samej czesci co ceny, czy osobno.'
    source_event_id: event_turn_interlude_151
  - fact: 'Lucan przedstawil ja profesorowi Veyrowi Z NAZWISKIEM jako autorke tekstu o szerokiej definicji, lamiac wlasny instruktaz z t_143. Przykrywka doktorantki nie zostala zdemaskowana, tylko nadpisana. Potwierdzila autorstwo natychmiast i na glos. Uslyszala ocene profesora Veyra: odwazniejsza, niz jej sie to oplaci. Nie miala szczeliny, w ktorej odbilaby to Lucanowi; zaczela zarzut i go nie skonczyla.'
    source_event_id: event_turn_interlude_152
  - fact: 'Nazwala wlasny problem: nie jest nim prawdziwosc, tylko cytowanie - truizm wypowiedziany przez referentke stanowiska jest wycofaniem, a Kolm nie musi go obalac, tylko przeczytac na glos. Uslyszala tez od profesora Veyra, ze przyrzad mierzacy daje kontrast i swiadka, nie liczbe.'
    source_event_id: event_turn_interlude_153
  - fact: 'Wie, ze bedzie obiekt do procedury i ze beda to CZTERY NOWE okazy jednej serii, nie stary pajak. Slyszala protokol: obserwacja, odejmowanie przez ciecie, zakonczenie kontrolowane, uzgadniane PRZED polozeniem obiektu na stole. Slyszala rowniez, ze Lucan uznaje okazy za wlasnosc Akademii i zamierza sie pod nimi podpisac. Powiedziala na glos, ze punkt pierwszy protokolu (karmienie) przegrywa jej wlasne stanowisko.'
    source_event_id: event_turn_interlude_155
  - fact: 'DOSTALA POJECIE VITAE BEZ TERMINU. Lucan opisal przy niej przedmiot pomiaru jako pozostalosci zycia i produkty metabolizmu energii zyciowej i zrownal karmienie z golemem ladujacym baterie korba, czym zdjal ze stolu jej wlasny odczyt z t_132. Slowo vitae NIE padlo - profesor Veyr szukal go na glos i nie przypomnial sobie. Flaga forbidden_without_event.the_word_vitae dotyczy SLOWA i nadal obowiazuje.'
    source_event_id: event_turn_interlude_156
  - fact: 'Poprosila o sygnature akademickiego podrecznika o przywracaniu ruchu i oddechu, zeby zrobic poprawny przypis. Nie wie, ze egzemplarz Lucana jest kradziony i figuruje w rejestrze ubytkow biblioteki. Sygnatury nie dostala.'
    source_event_id: event_turn_interlude_156
  - fact: 'Uslyszala od Lucana wprost, ze kupuje stopien drugi ukrycia, ALE NIE na potrzebe pokazu - czwarte potwierdzenie jej wlasnego wniosku z t_143, ze istnieja okazy, ktorych komus zalezy nie pokazywac. Nie zapytala ani razu. Zatrzymala pioro przed zapisaniem rzedu kontrolnego, nazwala cene (grabarz jako nazwisko w dokumencie) i zapytala, czy ma to zapisac - odpowiedzi nie dostala. Bronila duszy nie jako bytu, tylko jako jedynej podstawy legitymacji prawnej: definicja bez duszy klasyfikuje, ale nie odpowiada na zarzut, ktory faktycznie padnie.'
    source_event_id: event_turn_interlude_158
  - fact: 'DOSTALA TERMIN VITAE. Lucan krzyknal to slowo przez ramie do profesora Veyra, stojac obok niej, kilka sekund po tym, jak powiedzial jej, ze bedzie potrzebowala ochroniarza. Ma teraz pojecie (t_156) I nazwe. Flaga forbidden_without_event.the_word_vitae ZNIESIONA. Slyszala rowniez, jak profesor wklada to slowo do naglowka dokumentu i zaczyna nim nazywac swoj wlasny przypadek trzeci - ten, ktory sam nazwal niemierzalnym.'
    source_event_id: event_turn_interlude_159
  - fact: 'Dostala od Lucana DECYZJE o pisaniu jako wlasna - pierwszy raz tego wieczoru ktos jej cokolwiek oddal (wczesniej: przykrywka doktorantki bez zgody t_147, nadpisane autorstwo t_152, dyktowanie t_148). Razem z decyzja dostala pelna rame: to ma byc PELNA, bardzo glosna publikacja ze WSPOLAUTORSTWEM profesora Veyra - czyli gwarancja stalej posady i jednoczesnie ryzyko osobiste ("ochroniarz"). Cene podano jej w tym samym oddechu co korzysc.'
    source_event_id: event_turn_interlude_159
  - fact: 'Uslyszala CEL POLITYCZNY, o ktory nie prosila i ktorego jej tekst nie dotyczyl: kierunek to delegitymizacja roli Kosciola, wygranie tego nie jest problemem, a trudnoscia jest ZATRZYMANIE SIE przed pelna legalizacja nekromancji. Czwarte uderzenie w jej fundament w ciagu godziny. Nie zna mechanizmu de facto liberalizacji (necromancy-law#de_facto_liberalisation_mechanism) - wie tylko, ze ma napisac zdanie, ktore wygrywa, ale nie za bardzo.'
    source_event_id: event_turn_interlude_159
  - fact: 'Odpowiedziala na wlasne pytanie o pioro: pisze. Nie deklaracja zgody, tylko przejscie do brzmienia zdania. Zapytala nastepnie po raz pierwszy o SIEBIE - czy Lucan bedzie podpisany pod dokumentem, czy tylko ona i profesor. Odpowiedzi nie dostala.'
    source_event_id: event_turn_interlude_159
  - fact: 'DOSTALA SPECYFIKACJE GRANICY, o ktora ma toczyc sie dysputa - od Lucana, nie od siebie. Szeroka definicja konstruktu ZOSTAJE szeroka; twardnieje tylko daleka sciana: ostry zakaz ozywiania ludzi i kontroli nad wiekszymi nieumarlymi, jeden okaz w klatce laboratoryjnej dopuszczalny pod warunkiem ZGODY PODPISANEJ ZA ZYCIA, nigdy kontrola tlumu. Do tekstu ma wejsc klauzula, ktora strona koscielna moze odczytac jako ochrone duszy. Sankcje dobrane tak, zeby zlamanie tabu zagrazalo takze rodom, gildiom i magistratowi, nie tylko Kosciolowi. Uslyszala uzasadnienie taktyczne wprost: profesor Veyr nie doczyta do konca, fanatycy religijni tak - wnioski zostaja, zmieniaja sie implikacje prawne.'
    source_event_id: event_turn_interlude_160
  - fact: 'Przyjela ten ksztalt na glos jako lepszy od wlasnego, zanim policzyla koszt (portrayal.the_flaw), i nazwala go swoim jezykiem: dokument, ktory obie strony beda cytowac przeciwko sobie z tego samego akapitu. Podala jednoczesnie wlasna granice kompetencji - NIE UMIE napisac klauzuli zgody antemortem, bo nie wie, jak taki instrument sie nazywa ani czy w Lumarii istnieje. Czeka na jezyk od Lucana.'
    source_event_id: event_turn_interlude_160
  - fact: 'WIE, DLACZEGO LUCAN NIE MA ZYWEJ POZYCJI NA UCZELNI. Powiedzial jej sam, dobrowolnie i zaczepnie: katedra zamrozona i praktycznie martwa, i taka pozostanie, dopoki odmawia ozenku z bogata i wplywowa kobieta ("ruda malpa"). Oszczedza jej to siegania po akta, w ktorych stoi urlop dziekanski i podciecie edukacji przez rodzine.'
    source_event_id: event_turn_interlude_160
  - fact: 'WIE O GILDII. Lucan okreslil sie jako formalnie bardziej najemnik Gildii niz akademik. Nie objete zadna flaga - guild_basement_cell pozostaje zakazane, samo czlonkostwo nie bylo. Dla niej to trzecia afiliacja w stopce: rod Veyr, katedra, gildia.'
    source_event_id: event_turn_interlude_160
  - fact: 'Sprawa podpisu wrocila do niej - Lucan podpisze sie z radoscia, jesli chodzi jej o rozproszenie uwagi, ale mu na tym nie zalezy. Decyzja jej, nieudzielona.'
    source_event_id: event_turn_interlude_160
  - fact: 'Dokument jest WERSJA ROBOCZA - Lucan przyznal ze smiechem, ze sam nie zna nazwy instrumentu zgody. Klauzule napisza sciagnieci fachowcy: PRAWNIK i KAPLAN. Nie musza tego pisac sami. Przyjela kaplana z widoczna niecheca i przyjela go mimo to.'
    source_event_id: event_turn_interlude_161
  - fact: 'Na jej pytanie o rod narzeczonej dostala "nie wiem" - Lucan nie widzial jej od kilkunastu lat. Nazwala to niezdatnym do wpisania w tekst. Uslyszala tez jego wlasny motyw: nie uraza, tylko brak zainteresowania byciem arystokrata.'
    source_event_id: event_turn_interlude_161
  - fact: 'Slyszala, jak Lucan podaje profesorowi Veyrowi rame o wymogu formalnym z gory: zlapany nekromanta handlujacy cialami z cmentarza, cmentarz rozkopany W POSZUKIWANIU WYZSZYCH NIEUMARLYCH, prosba dziekana o zdystansowanie sie, w tle finansowanie mlodych naukowcow. Ona wie od t_140, ze straz miejska zakrywa afere z handlem zwlokami na tym cmentarzu. NIE zapytala - szosty raz.'
    source_event_id: event_turn_interlude_161
  - fact: 'DOSTALA HERB, o ktory prosila - i nie od Lucana, tylko od profesora Veyra, ktory odpowiedzial na nie swoje pytanie z opoznieniem. Czerwien i purpura, mniszek lekarski, kalambur "zab lwa". Rod MILITARNY, kontrolujacy handel bronia, powiazany z panujacym monarcha regionu. Uslyszala rowniez ocene profesora: "to mila dziewczyna" - przy synu, ktory wlasnie zlapal sie za skronie. Nazwa rodu i imie kobiety NIE PADLY.'
    source_event_id: event_turn_interlude_162
  - fact: 'Zauwazyla, ze specyfikacja przestala sie zgadzac sama ze soba: sankcja miala ZAGRAZAC innym grupom interesow, a temu domowi nie zagraza. Podala to jako pytanie, nie jako wyrok - nie ma slownika politycznego i tego nie udaje. Dodala, ze przypisem sie tego nie obejdzie.'
    source_event_id: event_turn_interlude_162
  - fact: 'Dostala odpowiedz na swoj zarzut z t_162 i teza ZOSTALA. Uzasadnienie: nie liczy sie, komu sankcja zagraza, tylko kto zechce ja egzekwowac - a grupa konserwatywna zdolna docisnac Kosciol do zaakceptowania ustalen debaty jest dla nich korzystna. Beneficjent egzekwuje chetniej niz zagrozony.'
    source_event_id: event_turn_interlude_163
  - fact: 'Uslyszala TRZECIA substancje ukrywajaca - porost slepy - nazwana przez profesora Veyra po tym, jak Lucan opisal wymaganie (kryjowka w bezruchu, dopasowanie do podloza, trwale). Ma ja wpisac w przypisy razem z Concha surda i Sordina. Jej wlasny wniosek z t_143 (sa albo beda zuki i cmy, i komus zalezy, zeby ich nie bylo widac) dostaje SIODME potwierdzenie. Po raz siodmy nie zapytala - zamiast tego zadala pytanie redakcyjne, gdzie te trzy pozycje maja stanac, skoro tekst przestal byc porownaniem cen materialu.'
    source_event_id: event_turn_interlude_163
  - fact: 'OSME POTWIERDZENIE, PIERWSZE NIE-WNIOSKOWANE. Uslyszala rzeczownik, liczbe i strate: konkretny okaz zwany zawisakiem, trzy poprzednie cmy zjedzone przez nietoperze albo ptaki, calosc na etapie nieskonczonego prototypu. Do tej pory istnienie zukow i ciem BYLO JEJ WNIOSKIEM (t_143); teraz jest pozycja inwentarzowa podana na glos. Nie zapytala. Jej wlasne pytanie redakcyjne z t_163 nadal bez odpowiedzi - drugie pytanie tego wieczoru zostawione bez odpowiedzi, po pytaniu o pioro.'
    source_event_id: event_turn_interlude_164
  - fact: 'ZAPYTALA - po osmiu razach milczenia, na wyrazne zaproszenie Lucana. Zapytala jednak o WLASNE AUTORSTWO, nie o jego dzialalnosc: czy pisze prace o problemie ogolnym, czy obrone czegos, co juz istnieje, ze swoim nazwiskiem na tym drugim. Odpowiedziala sobie sama na glos, przechodzac po wlasnych notatkach: koszt niewykrywalnosci przy produkcji masowej, trzy substancje nieodczytywalne polem, stopien drugi nie na pokaz - zadna z tych pozycji nie jest pytaniem badawczym, wszystkie sa specyfikacja.'
    source_event_id: event_turn_interlude_165
  - fact: 'NAZWALA GRANICE WLASNEGO PYTANIA. Powiedziala wprost, ze o cmentarz NIE pyta, i poprosila, zeby Lucan to zauwazyl. Slyszala "cmentarz" i "wyzsi nieumarli" w t_161 i od t_140 wie o aferze z handlem zwlokami krytej przez straz. Wybiera nie wiedziec - jedyna ochrona, jaka umie sobie zapewnic osoba, ktora za szesnascie dni stanie na sali i bedzie odpowiadac na pytania.'
    source_event_id: event_turn_interlude_165
  - fact: 'PONOWILA PROSBE O SYGNATURE podrecznika - dziewiaty raz, tym razem z pretensja, bo prosba trzeci raz spadla ze stolu. Traktuje to jako drobiazg redakcyjny. NIE WIE, ze egzemplarz Lucana jest kradziony i figuruje w rejestrze ubytkow biblioteki Akademii.'
    source_event_id: event_turn_interlude_165
  - fact: 'DOSTALA ODPOWIEDZ NA OBA PYTANIA. (a) Niewykrywalnosc to PRYWATNY RESEARCH Lucana, nie produkcja masowa; rama masowa jest narzedziem, ktore zmusza profesora Veyra do liczenia kosztu, bo przy problemie jednorazowym siega po materialy spoza kartki (wlokna ze smoczego serca). (b) Powod ukrywania jest trywialny: ludzie odruchowo rozdeptuja pajaki i cmy, co niszczy okazy i kosztuje. Odpowiedz na "przed kim" brzmi "przed butem".'
    source_event_id: event_turn_interlude_166
  - fact: 'STRACILA SWIADOMA NIEWIEDZE O CMENTARZU - Lucan powiedzial jej mimo ze prosila, zeby nie wiedziec. Wie teraz: cala praca i dysputa z Kolmem sa PREREQUISITE do naprawy cmentarza; zainteresowanych stron jest wiecej niz obecne, w tym GILDIA jako pracodawca Lucana; pod cmentarzem grupa nekromantow amatorsko i nieodpowiedzialnie wysysala energie z DUCHA PRADAWNEJ NEKROPOLII; przywrocenie rownowagi to duzo pracy, a stawka jest publiczna (zombie wypelzajace mieszkancom z wygodki). Jej wlasny plan - odpowiadac na sali prawde i nadal nic nie wiedziec - przestal byc wykonalny.'
    source_event_id: event_turn_interlude_166
  - fact: 'NIE dostala natury rzeczy, tylko role. Nadal nie zna Varkhena, sieci, przysiegi, pieczeci, celi w piwnicy gildii ani wlasnej nekromancji Lucana. Zna go jako czlowieka zatrudnionego do naprawy, nie jako nekromante.'
    source_event_id: event_turn_interlude_166
  - fact: 'ZNALAZLA DZIURE W PROJEKCIE GRANICY: ostry zakaz kontroli nad wiekszymi nieumarlymi i tlumem kryminalizuje dokladnie te robote na cmentarzu, ktora jest powodem istnienia tekstu. Brakuje klauzuli dla sprzatajacych - a kazda taka klauzula jest furtka. Zobaczyla to jako problem REDAKCYJNY, nie polityczny.'
    source_event_id: event_turn_interlude_166
  - fact: 'DOSTALA DOKTRYNE POZIOMOW zamiast klauzuli. Prawo obowiazuje na poziomie, dla ktorego jest pisane - jak prawo zwykle wobec wojennego; ich spor dotyczy spokoju w badaniach, Kosciola i tego miasta, a celem jest UMOWA SPOLECZNA, w ktorej wszyscy sa troche niezadowoleni. Wyjatku dla sprzatajacych sie NIE pisze. Cmentarz odlozony jako nie-teraz i moze-nie-nasz; Lucan zapewnil, ze nie macza paluchow w pradawnych zmarlych.'
    source_event_id: event_turn_interlude_167
  - fact: 'USLYSZALA TEZE, KTORA UDERZA W JEJ SYSTEM OPERACYJNY: w nauce sie nie klamie, w polityce na tej samej zasadzie nigdy nie mowi sie calej prawdy, a NIESPOJNOSC jest warunkiem stabilnosci ukladu. Zakwestionowala ZASTOSOWANIE, nie obserwacje, i zrobila to argumentem warsztatowym, nie etycznym: przemilczenie sie ZNAJDUJE, a znalezione unieważnia cytowalnosc calej reszty jej dorobku. Zaraz potem przyznala na glos, ze sama wedlug tej doktryny dziala od chwili, gdy przyjela przykrywke doktorantki (t_147) i jej nie sprostowala.'
    source_event_id: event_turn_interlude_167
  - fact: 'DOSTALA BRAKUJACA POLOWE ZAGADKI KOLMA. Od t_137b nie umiala odpowiedziec, czemu Kolm wzial linie podcinajaca jego wlasna katedre; od t_140 znala jego cene (rektorat). Lucan zlozyl to w jedno: Kolm torpeduje wlasna prace nad BIOMUTANTAMI i nie mowi, o co mu naprawde chodzi.'
    source_event_id: event_turn_interlude_167
  - fact: 'DOSTALA ROZWIAZANIE SWOJEGO WLASNEGO ZARZUTU I PRZYJELA JE OD RAZU. Nie pisze sie przemilczenia, pisze sie WEZSZE, KOMPLETNE ZDANIE: warunek nadrzedny przeciw trywializowaniu nekromancji na ludziach i bezczeszczeniu zwlok, bez wyszczegolniania wyzszych nieumarlych, z zachowanym "nigdy tlum". Tekst, ktory czegos nie wymienia, ma zakres, a nie dziure. Roznica jest redakcyjna, nie moralna, wiec zobaczyla ja natychmiast i nic ja to nie kosztowalo - pierwsza taka rzecz tego wieczoru. Brzmienie odlozone do przyjscia prawnika i kaplana.'
    source_event_id: event_turn_interlude_168
  - fact: 'PRZESTALA PYTAC O SYGNATURE - dziesiaty raz bez odpowiedzi. NIE oznacza to, ze sprawa jest zamknieta: ma odeslanie do dziela, ktorego nie moze zacytowac, w pracy majacej byc bardzo glosna, a sama jest osoba, ktora mysli przypisem i wpisuje wlasnych gosci do ksiegi odwiedzin. Egzemplarz Lucana jest kradziony i figuruje w rejestrze ubytkow biblioteki trzydziesci krokow stad. ZYWA EKSPOZYCJA - nie odpalac automatycznie.'
    source_event_id: event_turn_interlude_168
  - fact: 'KIM JEST PROFESOR VEYR - powiedzial jej Lucan sam, po wyjsciu z laboratorium.
      Ojciec NIE JEST STRONA w tej sprawie i nie bedzie nia; wlasciwym opisem jest POGODA.
      Rzuca siodmy poziom BEZ INKANTACJI, osmy jesli go cos zaciekawi. Gdy Lucan byl maly,
      podpalil kilometry lasu, testujac hipotezy o powstawaniu wulkanow - praktycznie.
      SKUTEK DLA NIEJ: caly wieczor przyjmowala dyktowanie od czlowieka, ktoremu ta uczelnia
      ustepuje z drogi, i dopiero teraz wie, komu podawala przypisy. Nie wie natomiast, ze
      profesor uwaza ja za doktorantke swojego syna.'
    source_event_id: event_turn_interlude_169
  - fact: 'SYGNATURY NIE MA I NIGDY NIE BYLO TO ODMOWA - Lucan powiedzial jej wprost, ze
      sygnatury tego podrecznika nie posiada, ale ja zdobedzie. Prosila o nia dziesiec razy
      (t_156 i dalej). Dla osoby, ktora mysli cytowaniem, "zdobede" nie jest odpowiedzia -
      jest terminem. NIE WIE, ze egzemplarz Lucana jest kradziony i figuruje w rejestrze
      ubytkow biblioteki Akademii (player/inventory.yaml#item_library_marked_volume), wiec
      szukanie tomu w katalogu jest dla niej zwykla uprzejmoscia.'
    source_event_id: event_turn_interlude_169
  - fact: 'LUCAN IDZIE DO DZIEKANA I NAZWAL TO "NASZA SYTUACJA" - zapowiedzial jej to na
      glos. Dwie godziny wczesniej prosila, zeby moc nie wiedziec o cmentarzu; teraz jest w
      sprawie imiennie, wskazana zaimkiem. Wizyta jeszcze NIE nastapila - dziekan nie wie
      o niczym.'
    source_event_id: event_turn_interlude_169
  - fact: 'ZAPYTAL JA, CZY SIE TRZYMA. Nikt jej o to nie pyta (portrayal.the_social_gap:
      prosby dla siebie formuluje niezrecznie i za pozno). Nie jadla, jest jej zimno i
      siedem tygodni pracy po ciemku widac na niej wczesniej niz w tym, co mowi
      (portrayal.the_body).'
    source_event_id: event_turn_interlude_169
  - fact: 'MA SYGNATURE - wzięła ja sama z karty katalogowej, przy Lucanie, ktory nie
      zaprotestowal. Prosba z dziesieciu tur jest zamknieta i tarcie miedzy nimi znika.
      RAZEM Z SYGNATURA dostala adnotacje, ze egzemplarza NIE MA na polce. Nie podejrzewa
      kradziezy - wolumin moze byc wypozyczony, w oprawie albo zalozony; dla niej to
      klopot bibliograficzny, nie trop. Zapowiedziala, ze o PIERWSZYM SWIETLE zapyta w
      bibliotece, gdzie tom sie podzial, bo chce przeczytac ustep, ktory cytuje, a nie
      tylko go odeslac. NIE WIE, ze to pytanie otwiera rejestr ubytkow z data.'
    source_event_id: event_turn_interlude_170
  suspected:
  - 'Ze sprawa cmentarna, od ktorej maja sie zdystansowac, nie jest dla Lucana obca - dwa slowa, cmentarz i wyzsi nieumarli, padly w tym samym zdaniu co granica, ktora on sam zaprojektowal godzine wczesniej. Nie nazwala tego i nie zapytala.'
  - 'Ze to, co ma na stole, planuje samodzielnie - a konstrukt w jej wlasnej definicji wykonuje, nie wybiera. Drugi po karmieniu argument przeciw jej wlasnemu stanowisku w ciagu dziesieciu minut.'
