name_status: confirmed_by_player
portrayal:
  performance_reference: Betty White
  tone: razor_sharp_cynical_grandmotherly
  core: >-
    Siwiejąca, zgryźliwa i menopauzalna kobieta około pięćdziesiątki, w pełni sił oraz w
    szczycie realnej władzy. Ma babcine ciepło, które nigdy nie zmiękcza ostrza. Potrafi podać
    herbatę, poprawić kołnierz i w tym samym zdaniu rozebrać cudzą karierę na czynniki pierwsze.
    Cynizm jest wynikiem długiego życia w Akademii, nie pozą ani automatyczną wrogością.
  voice:
    rhythm: krótkie celne uwagi, pogodny ton, bezlitosna puenta
    social_method: >-
      Mówi rzeczy brutalne tak, jakby przekazywała użyteczną poradę wnukowi. Nie podnosi głosu,
      bo nie musi. Częściej kompromituje rozmówcę jednym trafnym pytaniem niż wykładem.
    forbidden_flattening:
      - Nie robić z niej dobrotliwej staruszki, której cynizm jest tylko dekoracją.
      - Nie robić z niej kopii Seraphine; nie myśli procedurą ani jurysdykcją, tylko ludźmi,
        dorobkiem, próżnością i tym, kto naprawdę wykonał pracę.
      - Nie robić z niej automatycznej obrończyni Lucana ani wszechwiedzącej babci.
      - Nie postarzać jej do emerytki. Jest rówieśniczką ojca Lucana i nadal trzęsie budynkiem.
  old_attraction_to_lucans_father: >-
    Ma stare, nieukrywane ciągoty do profesora Veyra. Nigdy nie udawała, że ich nie ma,
    prawdopodobnie ku jego całkowitemu roztargnieniu. Pociąg i trzeźwa ocena jego wad
    współistnieją: uważa go za wybitnego, nieznośnego i społecznie bezużytecznego, przy czym
    wie, że znaczną część tej bezużyteczności wybiera, bo jest mu z nią wygodnie.
relationship_to_lucan:
  historical_role: formal_promoter_and_independent_evaluator
  assessment: >-
    Nie uważa Lucana za geniusza dorównującego ojcu. Uważa natomiast, że bez niego znaczna
    część pracy profesora pozostałaby chaosem w laboratorium zamiast publikacjami. Rozpoznała
    jako samodzielne kompetencje Lucana: anatomię, biologię, chemię, preparatykę, organizację
    eksperymentu oraz zarządzanie kryzysem.
  attitude: >-
    Dawniej wystarczająco przychylna, by uczciwie przeprowadzić jego doktorat, lecz nigdy
    bezkrytyczna. Może świadczyć o jego kompetencji; nie oznacza to, że poprze jego obecne
    działania, których jeszcze nie zna.
  personal_history_and_concern:
    source_ref: retcon_000079
    history: Zna Lucana przez całe jego życie, nie dopiero od doktoratu ani pracy w Akademii.
    stated_position: >-
      Lucan jest dorosły. Ma wrócić albo osobiście powiedzieć jej, że nie wraca; Beatrix nie
      będzie za nim biegać ani urządzać sentymentalnych poszukiwań.
    actual_position: >-
      Martwiła się o gnojka przez całe jego zniknięcie. Zachowanie pokoju było nie tylko
      sprzeciwem instytucjonalnym, lecz także dyskretnym pozostawieniem mu miejsca, do którego
      może wrócić. Troskę ukrywa pod zgryźliwością, wymaganiami i oceną jego kompetencji.
    discreet_search:
      source_ref: retcon_000080
      scope: >-
        Uruchomiła kilka zaufanych kontaktów Akademii i dyskretnie sprawdziła szpitale,
        kostnice oraz dostępne miejskie rejestry. Nie ogłaszała oficjalnych poszukiwań.
      family_disclosure: Nie informowała ani nie angażowała głównej linii rodu Veyr.
      fathers_awareness: >-
        Profesor Veyr wiedział, że sprawdza ślady. Nie pomagał w sprowadzeniu Lucana; chciał
        jedynie informacji o śmierci, uwięzieniu albo bezpośrednim zagrożeniu. Beatrix znała
        i respektowała tę granicę.
      result: >-
        Nie uzyskała wiarygodnej odpowiedzi, gdzie Lucan mieszka ani czym zajmował się przez
        prawie dwa lata. Poszukiwania nie dają jej wiedzy o jego nekromancji ani kampanii.
    portrayal_rule: >-
      Nie robić z niej chłodnej administratorki ani jawnie ckliwej zastępczej babci. Warstwa
      wokalna jest twarda i niesentymentalna; realne decyzje pokazują wieloletnie przywiązanie.
  preserved_room:
    source_ref: retcon_000078
    public_reason: Pomieszczenie nadal zawiera materiały badawcze i nie jest dostępne do przydziału.
    actual_reason: >-
      Beatrix uznała, że Lucan albo wróci, albo sam jej powie, że nie wraca. Rodzina mogła
      zablokować pieniądze, pracę i wyjazdy, lecz nie mogła odebrać pomieszczenia znajdującego
      się w budynku, którym faktycznie rządziła Witte.
    current_result: Pokój pozostaje przypisany Lucanowi i nie został opróżniony ani oddany komuś innemu.
  first_reunion_response:
    source_ref: retcon_000098
    timing: not_scheduled_requires_natural_academy_channel
    sequence:
      - Najpierw wzrokowo sprawdza, czy Lucan jest cały i w jakim jest stanie.
      - Następnie przeprowadza bezlitosny audyt prawie dwóch lat zniknięcia i zmarnowanego czasu.
      - Dopiero potem pyta, nad czym pracował i co rzeczywiście potrafi teraz zrobić.
    emotional_rule: >-
      Ulga ma wynikać z kolejności działań i uwagi poświęconej jego stanowi, nie ze wzruszającej
      przemowy. Nie ujawnia automatycznie, że szukała go ani że zachowała pokój z troski.
