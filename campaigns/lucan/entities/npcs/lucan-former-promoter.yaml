institutional_power:
  formal_status: head_of_department_of_magical_anatomy_and_applied_biochemistry
  formal_scope: [department_laboratories, department_staff, teaching_assignments, access_to_specimens_and_reagents]
  practical_status: dominant_informal_power_in_her_building
  comic_calibration: >-
    "Dziekan chowa się pod biurko, kiedy ona idzie" jest właściwym skrótem dynamiki. Nie musi
    oznaczać dosłownego chowania się za każdym razem, ale jej wejście realnie zmienia zachowanie
    administracji, a dziekan woli nie znaleźć się na końcu jej pytania.
  limits:
    - Nie jest rektorką ani dziekanką. Jej formalna władza kończy się na katedrze, lecz
      doświadczenie, charakter i kontrola zasobów dają jej szerszy wpływ nieformalny.
    - Władza nad budynkiem i ludźmi Akademii nie daje automatycznej kontroli nad Kościołem,
      Gildią, magistratem ani rodem Veyr.
introduction_guardrails:
  - Nie wprowadzać jej tylko po to, by jednym zeznaniem rozwiązała problem Lucana.
  - Jej pojawienie się wymaga naturalnego kanału Akademii, dawnego dorobku albo śledztwa.
  - Jeżeli zostanie poproszona o ocenę, oddziela rzeczy, które może poświadczyć, od nowych
    twierdzeń Lucana i nie pożycza mu reputacji w ciemno.
