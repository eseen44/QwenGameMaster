notes:
  - Powiązana z lead_signet_heraldry_research i objective_prepare_institutional_defense/map_city_factions_and_noble_relative_thread
    w planning/lucan-leads.yaml i state/objectives.yaml - gracz sygnalizuje możliwość
    przyszłego spotkania z kimś z tej strony rodziny.
  - 'Doprecyzowanie od gracza: to głowa/główna linia rodu Veyr (faction_house_veyr_main_line)
    ukręciła Lucanowi dalszą edukację jako odwet za sprzeciw wobec zaaranżowanego
    małżeństwa - NIE była narzeczona. Ona jest powodem konfliktu (jego niechcianą
    stroną), nie jego sprawczynią.'
  - 'Nie pisać jej automatycznie jako antagonistki. Określenie dziecięcej prześladowczyni
    pochodzi od Lucana i mówi również o nim; obiektywna skala konfliktu jest nieustalona
    (retcon_000066).'
