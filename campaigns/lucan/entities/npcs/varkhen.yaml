    - {fact_id: fact_varkhen_knows_guild_basement_custody, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine przeniosła Varkhena do piwnicy gildii i sprawdza formalną odpowiedzialność za jego podporządkowanie.}
    - {fact_id: fact_varkhen_knows_ring_transfer, source_event_id: event_act_02_closeout_interlude_import, claim: 'Varkhen rozpoznał Pierścień Grobowego Szeptu zabrany przez Lucana ze swego sarkofagu i zgodził się, by Lucan go zatrzymał.'}
    - {fact_id: fact_varkhen_knows_lucan_family_evasion, source_event_id: event_act_02_closeout_interlude_import, claim: 'Lucan powiedział Varkhenowi, że od dwóch lat ucieka przed rodziną i oczekiwaniami, których nie umie albo nie chce spełniać.'}
    - {fact_id: fact_varkhen_stated_what_he_wants, source_event_id: event_turn_interlude_230, claim: "Zapytany PRZEZ SERAPHINE BEZPOSREDNIO (pierwszy raz - dotad pytala o niego Lucana, mimo ze Varkhen stal w tym samym pokoju, retcon_000134), czego CHCE, a nie co mu wolno. Odpowiedzial: domknac to, po co go tam postawiono - trzy pieczecie i dolna brama. Przysiega jest niedokonczona i to jest cala tresc tego, czego chce. NA PYTANIE, CO POTEM, ODPOWIEDZIAL, ZE NIE WIE, i nie udawal, ze wie. Dodal z wlasnej inicjatywy, ze uklad z Lucanem przyjal DOBROWOLNIE, bo byl uczciwy. NARRATOR NIE DOPISUJE MU tesknoty za spoczynkiem, planu na wolnosc ani zadania wobec Lucana - to jest przestrzen do wypelnienia w grze, nie kanon."}
    - {fact_id: fact_varkhen_transport_plan_night_street, source_event_id: event_turn_interlude_230, claim: "Ustalony sposob dostania go pod trzecia pieczec: NOCA, normalnie ulica, plaszcz narzucony na zbroje - niepokojacy dragal 2,20 m idacy gdzies w nocy. Plan gracza, przyjety bez oporu; zaden plik nie stawia w Lumarii godziny policyjnej, a Varkhen jest mobilny (byl przenoszony i stoi). PLAN, NIE WYKONANIE - nikt jeszcze nie wyszedl. Lucan zadeklarowal warunkowo, ze nocnemu straznikowi, ktory sprobuje ich wylegitymowac, zniszczy umysl na miejscu; Seraphine to slyszala i potraktowala jako uprzedzenie wymagane jej warunkiem z t_044."}
    - {fact_id: fact_varkhen_heard_the_oral_only_plan, source_event_id: event_turn_interlude_233, claim: "Stal w rogu gabinetu i slyszal caly plan: Varkhen ma zostac przekazany wyzszemu dowodztwu gildii WYLACZNIE USTNIE, bez wpisu do raportu, a potem obie strony maja udawac, ze rozmowy nie bylo. Czesci o papierach, rejestrach i dowodztwie NIE ROZUMIE i powiedzial to wprost (speech_traits: nie udaje, ze rozumie). Zrozumial jedno i tylko to skomentowal: rzecz powiedziana ustnie nie jest dla niego rzecza mniejsza - czterysta lat stal na slowie, ktorego nikt nie zapisal. NARRATOR NIE WYCIAGA Z TEGO ANI ZGODY, ANI SPRZECIWU, ANI ZADANIA - Varkhen nie zostal o zdanie zapytany w tej sprawie i sam go nie zglosil."}
    - {fact_id: fact_varkhen_will_testify_as_ancient_guardian, source_event_id: event_turn_interlude_234, claim: "Regula z t_227, ze jego zeznanie 'nie jest cytowalne', zostala cofnieta (retcon_000138). Varkhen ma zlozyc zeznanie WEWNATRZ DOKUMENTACJI GILDII jako pradawny straznik nekropolii - dobrowolnie, co jest warunkiem trzymania sie przykrywki (necromancy-law#varkhen_exposure.ancient_guardian_cover_story). Zapytany, odpowiedzial w slowniku przysiegi: zeznanie zlozy, bo tak brzmi uklad, ktory przyjal dobrowolnie (milestone_046 jest paktem, nie wiezami). NARRATOR NIE DOPISUJE MU opinii o gildii, o Kosciele ani o tym, co bedzie potem - to nadal puste pole. Ma na sobie plaszcz narzucony na zbroje, zgodnie z planem transportu z t_230."}
    - {fact_id: fact_varkhen_rose_to_leave_for_the_third_seal, source_event_id: event_turn_interlude_235, claim: "Zapytany przez Lucana wprost \"idziemy?\", WSTAL - czyn, nie deklaracja - i odpowiedzial jednym zdaniem ze slownika przysiegi: przysiega jest niedokonczona (agenda: restore_and_secure_three_seals, keep_the_lower_gate_closed). Plaszcz ma na sobie od t_234. NARRATOR NIE DOPISUJE MU tesknoty za spoczynkiem, planu na potem, opinii o gildii ani zdania o papierach - \"co potem\" zostaje puste (fact_varkhen_stated_what_he_wants). NIKT JESZCZE NIE WYSZEDL Z POKOJU: wlasny plan Lucana z t_230 mowi NOCA, a jest 18:01."}
    - {fact_id: fact_varkhen_accepted_the_postponement_to_night, source_event_id: event_turn_interlude_237, claim: "STAL JUZ W PLASZCZU, GOTOWY DO WYJSCIA, I USLYSZAL \"JESZCZE NIE\". Lucan odwolal wyjscie na teraz i przesunal je na noc, zgodnie z wlasnym planem transportu z t_230 (fact_varkhen_transport_plan_night_street). Varkhen przyjal to bez skargi, bez zniecierpliwienia i bez pytania o powod - czterysta lat stal na slowie, ktorego nikt nie zapisal (fact_varkhen_heard_the_oral_only_plan), wiec kilka godzin nie jest dla niego terminem. NARRATOR NIE DOPISUJE MU ulgi, niecheci, opinii o zwloce ani planu na te godziny - \"co potem\" nadal zostaje puste (fact_varkhen_stated_what_he_wants, retcon_000142). Nie wyszedl z gabinetu; plaszcz ma na sobie od t_234."}
    - {fact_id: fact_varkhen_has_no_after_because_the_oath_had_no_end, source_event_id: event_turn_interlude_249, claim: "ZAPYTANY PRZEZ LUCANA WPROST, CO CHCE ROBIC PO TYM WSZYSTKIM. Pytanie padlo raz wczesniej, w t_230, i zadala je Seraphine; odpowiedz brzmiala 'nie wiem'. Teraz odpowiedzial to samo i dodal powod, ktorego wtedy nie podal: postawiono go przy bramie i dano mu slowo, a w tym slowie nie bylo konca. NIE JEST TO ANI TESKNOTA ZA SPOCZYNKIEM, ANI PLAN NA WOLNOSC, ANI ZADANIE WOBEC LUCANA - trzy rzeczy, ktorych karta zabrania mu dopisywac (fact_varkhen_stated_what_he_wants). Patrzyl przy tym na drzwi. NIEUSTALONE ZOSTAJE, CZY UWAZA, ZE COS PO TYM W OGOLE JEST; 'co potem' pozostaje polem pustym do wypelnienia w grze. Seraphine byla w pokoju i slyszala."}
    - {fact_id: fact_varkhen_walked_out_of_the_guild_for_the_third_seal, source_event_id: event_turn_interlude_250, claim: "WYSZEDL Z BUDYNKU GILDII NA WLASNYCH NOGACH, po raz pierwszy odkad zaczela sie kustodia. Na \"idziemy\" nie odpowiedzial slowem - kiwnal raz i ruszyl (voice_contract#body: kiedy sie zgadza, kiwa raz). Plaszcz na zbroi od t_234, plan transportu z t_230 (noca, normalnie ulica) wchodzi w wykonanie. Wczesniej w tym samym pokoju Lucan nazwal go poeta; Varkhen wzial to doslownie i odpowiedzial powaznie, ze poeta nie jest. Seraphine otworzyla drzwi i ZOSTALA W GABINECIE - nie zapytano jej, czy idzie, i sama sie nie zglosila. NARRATOR NIE DOPISUJE MU ulgi z wyjscia, ciekawosci miasta ani opinii o kustodii."}
    - {fact_id: fact_varkhen_received_the_offer_of_a_stewardship_after_the_oath, source_event_id: event_turn_interlude_251, claim: "PIERWSZA PROPOZYCJA TEGO, CO JEST PO PRZYSIEDZE, ZLOZONA PRZEZ LUCANA W DRODZE NA CMENTARZ. Lucan powiedzial cztery rzeczy: (a) jesli Varkhen ZOSTANIE na cmentarzu, powinien regenerowac sie szybciej i utrzyma go sama energia miejsca, wiec Lucan odepnie go od sieci - I OD SIEBIE TEZ; (b) nie ma dzis ani mozliwosci politycznej, ani zdolnosci, zeby uzyc jego umiejetnosci; (c) proponuje posade zarzadcy ziemskiego przy zarzadzaniu posiadloscia, po dopelnieniu przysiegi; (d) DECYZJA MA NALEZEC DO VARKHENA. NIC NIE ZOSTALO WYKONANE - cztery lacza upkeep pozostaja aktywne, a twierdzenie o energii cmentarza jest kwestia Lucana, nie mechanika (retcon_000120). VARKHEN ODPOWIEDZIAL JEDNYM PYTANIEM: \"Czyjej ziemi?\" - oparte na fact_varkhen_knows_lucan_family_evasion. Odpowiedzi nie dostal i nie dopytal. Sieci i polityki nie skomentowal wcale. NIE PRZYJAL I NIE ODMOWIL; NARRATOR NIE DOPISUJE MU wdziecznosci, ulgi, podejrzenia ani planu.", recall_summary: "Lucan zaproponowal zarzadzanie posiadloscia po dopelnieniu przysiegi; wybor nalezy do Varkhena. Zapytal: czyjej ziemi? Nie przyjal ani nie odmowil. Lucan zapowiedzial warunkowe odlaczenie wiezi przy pozostaniu na cmentarzu; do odlaczenia nie doszlo. Szybsza regeneracja byla twierdzeniem Lucana, nie potwierdzonym pomiarem."}
    - {fact_id: fact_varkhen_repeated_the_cemetery_is_watched_at_the_wall, source_event_id: event_turn_interlude_251, claim: "PRZY MURZE CMENTARZA, PIERWSZY RAZ ODKAD GO STAMTAD WYNIESIONO, zatrzymal sie, patrzyl dluzej niz zwykle i powtorzyl wlasne ostrzezenie z t_053: to miejsce jest obserwowane. W t_053 dodal, ze jest tez zwiazane z jego przysiega, i odradzal tam powrot jako kryjowke. TO JEST JEGO TWIERDZENIE, NIEPOTWIERDZONE ZADNYM INNYM PLIKIEM - nie wiadomo, kto obserwowal, ani czy nadal obserwuje, ani skad on to wie. Narrator nie postawil na cmentarzu zadnego obserwatora.", recall_summary: "Przy murze powtorzyl wlasne ostrzezenie, ze cmentarz jest obserwowany. Samo ostrzezenie nie potwierdza obecnosci obserwatora tej nocy; jego pozniejsze wyjasnienie dotyczy dawnych wizyt kaplana."}
    - {fact_id: fact_varkhen_named_the_priest_as_what_watched_means, source_event_id: event_turn_interlude_252, claim: "DOPYTANY PRZY MURZE, CO ZNACZY \"OBSERWOWANE\" I CO WIDZI, ODPOWIEDZIAL DOSLOWNIE: nie widzi, tylko wie. Zawezil wlasne ostrzezenie z t_053 - nie chodzi o kogos, kto patrzy TERAZ, tylko o to, czego byl swiadkiem, stojac tam: kaplan tu przychodzil, znal wlasciwe wejscie, sprawdzal pieczecie, a ostatnim razem nie byl sam. Jest to jego wlasny fact_varkhen_knows_priest_and_oren_visits, podany po raz pierwszy jako odpowiedz na pytanie o obserwacje. IMIENIA TOWARZYSZA NIE WYPOWIEDZIAL. NIEUSTALONE: kiedy kaplan byl tu ostatni raz, czy przychodzi nadal i skad Varkhen mialby wiedziec o wizytach z okresu, gdy lezal uszkodzony w komorze.", recall_summary: "Wyjasnil, ze nie widzi teraz obserwatora. Pamieta kaplana znajacego wejscie i sprawdzajacego pieczecie; podczas ostatniej znanej mu wizyty kaplanowi ktos towarzyszyl. Nie podal imienia. Nie wiadomo, kiedy to bylo ani czy wizyty nadal trwaja."}
    - {fact_id: fact_varkhen_charged_from_the_network_and_opened_the_foundation_on_a_please, source_event_id: event_turn_interlude_255, claim: "LUCAN POBRAL NADMIAR Z SIECI I ZALADOWAL GO W NIEGO (+2,0 do ancient_necrotic_reservoir, 19,4 -> 21,4; cialo tylko +0,2, bo condition_severely_depleted tlumi odbudowe). NA SAMA ENERGIE NIE ZAREAGOWAL SLOWEM - wdziecznosci nie mowi, wykonuje. ZAREAGOWAL NA \"PROSZE\": powtorzyl je jako stwierdzenie i od razu poszedl do roboty, wyjmujac trzy kamienie fundamentu recznie. To jest jego kontrakt, nie uleglosc - uprzejmosc bierze za zobowiazanie. RACJONOWANIE Z retcon_000113 NIE ZOSTALO ZNIESIONE: byl to jednorazowy pobor, nie zmiana stalej strugi. NIE PYTANO GO, co wie o tym pomieszczeniu ani o kanalach rytualnych, i sam nic o nich nie powiedzial - jego karta nie ma o tym miejscu ani slowa.", recall_summary: "Lucan przekazal mu energie, a nastepnie poprosil o odsloniecie fundamentu. Varkhen wyjal trzy kamienie. Nie zawarli przy tym nowej przysiegi ani umowy o stalym zasilaniu."}
    - {fact_id: fact_varkhen_does_not_know_the_foundation_object, source_event_id: event_turn_interlude_256, claim: "ZAPYTANY WPROST, CZY WIE, CO LEZY W NISZY POLNOCNEGO FUNDAMENTU, ODPOWIEDZIAL, ZE NIE WIE - i nie probowal tego nazwac po swojemu (voice_contract#blind_spot, #evasion). Dodal jedno zdanie z wlasnego rejestru: NIE POSTAWIONO GO TUTAJ. To pomieszczenie nie bylo czescia jego warty; strzegl trzech pieczeci i dolnej bramy (agenda: restore_and_secure_three_seals, keep_the_lower_gate_closed). Potem przestal patrzec na nisze i patrzyl na korytarz, ktorym przyszli - emocja przez to, na co patrzy, bez analizy. NARRATOR NIE ZESTAWIL ZA NIEGO TRZECH KANALOW Z TRZEMA PIECZECIAMI: zaden plik ich nie lączy, a wnioskowania o cudzych ukladach jego kontrakt zabrania. NIEUSTALONE: czy rytual przy fundamencie jest z jego epoki i czy ktos mu o tym pomieszczeniu kiedykolwiek mowil.", recall_summary: "Zapytany o rzecz w niszy odpowiedzial, ze jej nie zna i nie pelnil tu warty. Strzegl trzech pieczeci i dolnej bramy. Nie podal wyjasnienia pochodzenia przedmiotu."}
    - {fact_id: fact_varkhen_offered_to_carry_the_cold_vessel, source_event_id: event_turn_interlude_257, claim: "LUCAN WYJAL RZECZ Z NISZY GOLA REKA I PRZEKLADAL JA Z DLONI DO DLONI, bo zimno parzy (t_255). Varkhen odwrocil sie od korytarza dopiero na ten widok, wyciagnal reke i powiedzial, ze jemu zimno nie szkodzi. JEST TO OFERTA POMOCY, NIE NOWA PRZYSIEGA ANI UMOWA - zwyklej uprzejmosci nie zamienia w zobowiazanie (voice_contract#mistakes), a wdziecznosc za energie z t_255 wykonuje, nie mowi (#emotion). NADAL NIE WIE, CZYM TA RZECZ JEST (fact_varkhen_does_not_know_the_foundation_object): widzial tylko, ze wyszla bez oporu i ze Lucan ja zabral. LUCAN NIE ODDAL MU JEJ - reka wyciagnieta, decyzja nie podjeta. NIEUSTALONE, czy zimno faktycznie mu nie szkodzi; to jego twierdzenie o wlasnym ciele, niezmierzone.", recall_summary: "Widzial, jak Lucan wyjmuje rzecz z niszy i przeklada ja z reki do reki. Wyciagnal reke i powiedzial, ze jemu zimno nie szkodzi. Oferta poniesienia, nie nowa przysiega. Nadal nie wie, czym rzecz jest."}
    - {fact_id: fact_varkhen_saw_lucan_keep_the_vessel_and_leave_three_servants_in_the_niche, source_event_id: event_turn_interlude_258, claim: "OFERTA Z t_257 WYGASLA BEZ SPORU. Lucan powiedzial, ze podtrzyma sam, i owinal dlon wlasna moca; Varkhen opuscil reke, powiedzial \"Jak chcesz\" i poszedl przodem do hali wozow. ZERO URAZY I ZERO NALEGANIA - jego kontrakt nie zamienia odmowy w zobowiazanie ani w zawod. WIDZIAL TEZ, jak Lucan wklada trzy swoje male okazy do niszy, po jednym na kazdy kanal, i zostawia je tam. NIE WYJASNIONO MU, po co; nie pytal. NIE WIE, czym jest rzecz, ktora Lucan zabral, ani czym jest to, co kanaly dowoza. Z magii po jego czasach nie wnioskuje (voice_contract#blind_spot).", recall_summary: "Lucan zatrzymal rzecz przy sobie i zabezpieczyl dlon wlasna moca; Varkhen opuscil wyciagnieta reke bez sporu i poszedl przodem. Widzial trzy male okazy zostawione w niszy, po jednym na kanal, i nie pytal, po co."}
