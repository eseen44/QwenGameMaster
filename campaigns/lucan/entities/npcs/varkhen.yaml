    - {fact_id: fact_varkhen_detected_remote_corpse_order, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Varkhen wykrył, że Lucan wydał komuś zdalny rozkaz dotyczący zwłok.}
    - {fact_id: fact_varkhen_knows_four_marked_corpses, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Lucan wskazał dwie ofiary w kaplicy i dwie na wysypisku jako ciała noszące jego ślad.}
    - {fact_id: fact_varkhen_knows_guild_basement_custody, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine przeniosła Varkhena do piwnicy gildii i sprawdza formalną odpowiedzialność za jego podporządkowanie.}
    - {fact_id: fact_varkhen_knows_ring_transfer, source_event_id: event_act_02_closeout_interlude_import, claim: Varkhen rozpoznał Pierścień Grobowego Szeptu zabrany przez Lucana ze swego sarkofagu i zgodził się, by Lucan go zatrzymał.}
    - {fact_id: fact_varkhen_knows_lucan_family_evasion, source_event_id: event_act_02_closeout_interlude_import, claim: Lucan powiedział Varkhenowi, że od dwóch lat ucieka przed rodziną i oczekiwaniami, których nie umie albo nie chce spełniać.}
    - {fact_id: fact_varkhen_stated_what_he_wants, source_event_id: event_turn_interlude_230, claim: "Zapytany PRZEZ SERAPHINE BEZPOSREDNIO (pierwszy raz - dotad pytala o niego Lucana, mimo ze Varkhen stal w tym samym pokoju, retcon_000134), czego CHCE, a nie co mu wolno. Odpowiedzial: domknac to, po co go tam postawiono - trzy pieczecie i dolna brama. Przysiega jest niedokonczona i to jest cala tresc tego, czego chce. NA PYTANIE, CO POTEM, ODPOWIEDZIAL, ZE NIE WIE, i nie udawal, ze wie. Dodal z wlasnej inicjatywy, ze uklad z Lucanem przyjal DOBROWOLNIE, bo byl uczciwy. NARRATOR NIE DOPISUJE MU tesknoty za spoczynkiem, planu na wolnosc ani zadania wobec Lucana - to jest przestrzen do wypelnienia w grze, nie kanon."}
    - {fact_id: fact_varkhen_transport_plan_night_street, source_event_id: event_turn_interlude_230, claim: "Ustalony sposob dostania go pod trzecia pieczec: NOCA, normalnie ulica, plaszcz narzucony na zbroje - niepokojacy dragal 2,20 m idacy gdzies w nocy. Plan gracza, przyjety bez oporu; zaden plik nie stawia w Lumarii godziny policyjnej, a Varkhen jest mobilny (byl przenoszony i stoi). PLAN, NIE WYKONANIE - nikt jeszcze nie wyszedl. Lucan zadeklarowal warunkowo, ze nocnemu straznikowi, ktory sprobuje ich wylegitymowac, zniszczy umysl na miejscu; Seraphine to slyszala i potraktowala jako uprzedzenie wymagane jej warunkiem z t_044."}
    - {fact_id: fact_varkhen_heard_the_oral_only_plan, source_event_id: event_turn_interlude_233, claim: "Stal w rogu gabinetu i slyszal caly plan: Varkhen ma zostac przekazany wyzszemu dowodztwu gildii WYLACZNIE USTNIE, bez wpisu do raportu, a potem obie strony maja udawac, ze rozmowy nie bylo. Czesci o papierach, rejestrach i dowodztwie NIE ROZUMIE i powiedzial to wprost (speech_traits: nie udaje, ze rozumie). Zrozumial jedno i tylko to skomentowal: rzecz powiedziana ustnie nie jest dla niego rzecza mniejsza - czterysta lat stal na slowie, ktorego nikt nie zapisal. NARRATOR NIE WYCIAGA Z TEGO ANI ZGODY, ANI SPRZECIWU, ANI ZADANIA - Varkhen nie zostal o zdanie zapytany w tej sprawie i sam go nie zglosil."}
    - {fact_id: fact_varkhen_will_testify_as_ancient_guardian, source_event_id: event_turn_interlude_234, claim: "Regula z t_227, ze jego zeznanie 'nie jest cytowalne', zostala cofnieta (retcon_000138). Varkhen ma zlozyc zeznanie WEWNATRZ DOKUMENTACJI GILDII jako pradawny straznik nekropolii - dobrowolnie, co jest warunkiem trzymania sie przykrywki (necromancy-law#varkhen_exposure.ancient_guardian_cover_story). Zapytany, odpowiedzial w slowniku przysiegi: zeznanie zlozy, bo tak brzmi uklad, ktory przyjal dobrowolnie (milestone_046 jest paktem, nie wiezami). NARRATOR NIE DOPISUJE MU opinii o gildii, o Kosciele ani o tym, co bedzie potem - to nadal puste pole. Ma na sobie plaszcz narzucony na zbroje, zgodnie z planem transportu z t_230."}
    - {fact_id: fact_varkhen_rose_to_leave_for_the_third_seal, source_event_id: event_turn_interlude_235, claim: "Zapytany przez Lucana wprost \"idziemy?\", WSTAL - czyn, nie deklaracja - i odpowiedzial jednym zdaniem ze slownika przysiegi: przysiega jest niedokonczona (agenda: restore_and_secure_three_seals, keep_the_lower_gate_closed). Plaszcz ma na sobie od t_234. NARRATOR NIE DOPISUJE MU tesknoty za spoczynkiem, planu na potem, opinii o gildii ani zdania o papierach - \"co potem\" zostaje puste (fact_varkhen_stated_what_he_wants). NIKT JESZCZE NIE WYSZEDL Z POKOJU: wlasny plan Lucana z t_230 mowi NOCA, a jest 18:01."}
