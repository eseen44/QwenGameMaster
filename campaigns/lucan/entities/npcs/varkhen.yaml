# GLOS: patrz kontrakt glosu. Pole `speech_traits` zdjete 2026-09-09 -
# dwa zrodla glosu obok siebie rozjezdzaja sie, a to konkretne uczylo wyceniania.
voice_ref: campaigns/lucan/entities/npcs/voices/varkhen.yaml
voice_note: >-
  GLOS TEJ POSTACI JEST W KONTRAKCIE GLOSU, NIE TUTAJ: campaigns/lucan/entities/npcs/voices/varkhen.yaml
  (regula: system/npc-voice.md). Jedenascie osi zamiast trzech wypunktowan, i jedno zrodlo zamiast dwoch,
  ktore sie rozjezdzaja. Do 2026-09-09 stalo tu `speech_traits`; u Kesza kazalo mu wyceniac wprost, a
  narrator powolywal sie na to w audytach tur 240, 242, 244 i 245 - czyli karta byla przyczyna wady, nie
  ofiara.
