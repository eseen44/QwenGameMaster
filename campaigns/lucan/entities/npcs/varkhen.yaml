    - {fact_id: fact_varkhen_detected_remote_corpse_order, source_event_id: milestone_047_seraphine_risk_disclosure, claim: 'Varkhen wykrył, że Lucan wydał komuś zdalny rozkaz dotyczący zwłok.'}
