    - {fact_id: fact_boros_got_the_cemetery_dig_instructions, source_event_id: event_turn_interlude_279, claim: "INSTRUKCJE OD LUCANA, wreszcie - nalezaly do niego od t_269. Tresc: brac worki, bedzie nudno, naprawde kopia i nie udaja, ze kopia, za to NIKT NAD NIMI NIE STOI. Zadanie: otworzyc droge do nizszych katakumb, zasypanych za grobowcem, w ktorym lezy Varkhen (connection_varkhen_collapse). Bezpanskie wchodzi w gre. BOROS NAZWAL SWOJ UDZIAL Z GORY, bez targowania: co wyjdzie spod zawalu, dziela jak ostatnio, a jego czesc idzie do niego, nie do gildii. Naliczyl osiem workow. ZADAL PYTANIE, KTORE ZOSTAJE OTWARTE: kto jest na ostrym koncu, jesli za zawalem jednak cos jest - powiedzial wprost, ze chce odpowiedzi DO JEDENASTEJ, nie natychmiast. O sobie powiedzial, ze jest dobry przy trzech krokach i przy scianie, a nie przy czyms, co siedzi w ciemnym korytarzu od dwustu lat."}
