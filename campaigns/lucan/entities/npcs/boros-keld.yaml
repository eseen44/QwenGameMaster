  what_he_is_not: >-
    NIE jest analitykiem i nie wazy wariantow. Nie jest tez chlodnym zawodowcem - lubi Lucana
    i to widac. Zasad nie lamie z przekory: on ich nie zauwaza. Amoralnosc nie jest u niego
    okrucienstwem, tylko brakiem kategorii "nie wypada".
  the_core: >-
    STADNY I MATERIALISTYCZNY NARAZ, i to jest u niego jedna rzecz, nie dwie. Swoi to swoi -
    dla swoich zrobi wszystko i nie policzy tego. Reszta swiata jest zasobem, ktory mozna wziac,
    jesli nikt ze swoich na tym nie traci. Dlatego "bezpanskie" nie budzi w nim ani wahania,
    ani ekscytacji - to po prostu slowo, po ktorym sie podnosi glowe.
