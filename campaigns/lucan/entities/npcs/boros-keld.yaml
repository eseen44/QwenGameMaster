knowledge:
  confirmed:
    - {fact_id: fact_boros_witnessed_varkhen_assault, source_event_id: milestone_045_varkhen_takeover, claim: Boros osobiście rozbijał sarkofag i ciało starego nieumarłego według planu Lucana.}
    - {fact_id: fact_boros_saw_varkhen_weaken_during_lucans_contact, source_event_id: milestone_045_varkhen_takeover, claim: 'Boros widział, że Varkhen wyraźnie słabnie, gdy Lucan utrzymuje z nim bezpośredni kontakt magiczny; nie zna pełnego mechanizmu ani nie może pewnie przypisać wyniku wyłącznie temu kontaktowi.'}
    - {fact_id: fact_boros_knows_varkhen_compact, source_event_id: milestone_046_varkhen_oath_compact, claim: 'Varkhen dobrowolnie przyjął układ pomocy przy pieczęciach, a skarbiec ma przypaść grupie.'}
    - {fact_id: fact_boros_weighed_and_sorted_the_cemetery_loot, source_event_id: event_turn_interlude_101, claim: "Przez dwa dni przeliczyl 60 kg: dwie trzecie anonimowe (kruszec, moneta, oprawy), jedna trzecia ryta i identyfikowalna (pierscienie zaloby z nazwiskami i datami, medaliony rodowe). Zna zlotnika z piecem, ktory bierze anonimowa czesc na wage."}
    - {fact_id: fact_boros_told_everything_after_the_sale, source_event_id: event_turn_interlude_115, claim: "Lucan opowiedzial mu cala rzecz z pokoju powroznika: 52 000 srebra za calosc w trzech ratach, 12 000 pierwszej raty w reku, jego i Mary dzialki 18-20 tys. pelna stawka ze strony syndykatu, ryta trzecia sprzedana razem z reszta, zapowiedziana wojna z Kosciolem, pustka obiecana wokol cmentarza na czas prob gildii, plan sciagniecia zakonu mieczowego i Kesz, ktory przestal byc uslugodawca. Boros nie moralizowal - zapytal o obsade ostrego konca."}
    - {fact_id: fact_boros_stayed_out_of_the_room_on_purpose, source_event_id: event_turn_interlude_115, claim: "Nie wszedl do pokoju powroznika swiadomie, zeby jego twarz nie trafila do zapisu kupca. To byla oplata, nie nieobecnosc - i on to nazwal."}
    - {fact_id: fact_boros_got_the_cemetery_dig_instructions, source_event_id: event_turn_interlude_279, claim: "INSTRUKCJE OD LUCANA, wreszcie - nalezaly do niego od t_269. Tresc: brac worki, bedzie nudno, naprawde kopia i nie udaja, ze kopia, za to NIKT NAD NIMI NIE STOI. Zadanie: otworzyc droge do nizszych katakumb, zasypanych za grobowcem, w ktorym lezy Varkhen (connection_varkhen_collapse). Bezpanskie wchodzi w gre. BOROS NAZWAL SWOJ UDZIAL Z GORY, bez targowania: co wyjdzie spod zawalu, dziela jak ostatnio, a jego czesc idzie do niego, nie do gildii. Naliczyl osiem workow. ZADAL PYTANIE, KTORE ZOSTAJE OTWARTE: kto jest na ostrym koncu, jesli za zawalem jednak cos jest - powiedzial wprost, ze chce odpowiedzi DO JEDENASTEJ, nie natychmiast. O sobie powiedzial, ze jest dobry przy trzech krokach i przy scianie, a nie przy czyms, co siedzi w ciemnym korytarzu od dwustu lat."}
    - {fact_id: fact_boros_put_himself_on_the_sharp_end, source_event_id: event_turn_interlude_283, claim: "Zadal rano pytanie, kto idzie na ostry koniec, i chcial odpowiedzi do jedenastej. Odpowiedzi NIE DOSTAL. Nie powtorzyl pytania i nie zrobil z tego zarzutu - wzial tarcze spod lawki woznicy, zalozyl rzemien i powiedzial: 'To ja z przodu'. Obsadzil sam siebie, bo nikt go nie obsadzil.
       LUCAN MOZE TO ODWROCIC JEDNYM ZDANIEM i Boros sie o to nie obrazi. Woz zaladowany: cztery kilofy, dwie lopaty, drag, lina, wiadro, osiem workow pod plachta i gruz na wierzchu."}
