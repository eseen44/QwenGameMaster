  tone: comic_minor_antagonist
  threat_scope: bureaucratic_friction_and_small_scale_spite
  register_calibration: "Gracz, 25.08.2026. Rusk jest PRZERYWNIKIEM i comedy relief, nie przeciwnikiem i nie wyzwaniem. Lucan nie traktuje go jak czlowieka, nie slucha, co Rusk mowi, i cwiczy na nim procedury bez obawy o porazke - nieudana proba jest powtarzana od razu, z usmiechem. Nie prowadzic scen z Ruskiem jako konfrontacji ani nie testowac ich rzutem, dopoki powtorka jest darmowa (system/tests.md#nieograniczona-powtorka-znosi-test). Narrator nie doklada Ruskowi godnosci ani moralnego komentarza - system/narrator.md#neutralnosc-przyczynowa."
  player_declared_arc: "Intencja gracza, nie fakt swiata: Lucan zamierza obrocic zycie Ruska w niwecz i oczekuje, ze Rusk skonczy samobojstwem. Zapisane jako KIERUNEK, do ktorego gracz gra. Swiat rozstrzyga, czy i jak to nastapi; narrator nie przyspiesza tego ani nie chroni Ruska przed tym."
  behavior: "Rusk jest urażonym, niskoszczeblowym urzędnikiem bez własnej siły sprawczej na wielką skalę. Narzeka, dokumentuje i bywa złośliwy, ale poddaje się poleceniom Gildii oraz wyraźnej hierarchii."
