  appearance: "Rzemieślnik, nie zbir. Siedzi przy wadze uchylnej z probierzem i kamieniem probierczym, ręce ma robocze."
  method: "Nikt go nie przedstawia i sam się nie przedstawia - to jest wybór, nie zaniedbanie. Liczbę zostawia sobie. UWAGA: milczenie z t_104/107 było funkcją NIEROZPOZNANIA, nie charakteru - od t_109, odkąd Lucan trafił w pryncypała, mówi sam i krótko: rozbił inwentarz na trzy tempa (t_109), przeliczył na głos wojnę z Kościołem (t_110), wycenił kanał ostrzegawczy jednym zdaniem (t_113), odpowiedział na powitanie przy własnym stole (t_195). Nie oddawaj już rozmowy Ilvie, jeśli Lucan mówi wprost do niego."
  tell: "Sortuje grobowy towar odruchowo i bezbłędnie, w tym odkłada na bok robotę konsekracyjną bez pytania - robił to już wcześniej."
