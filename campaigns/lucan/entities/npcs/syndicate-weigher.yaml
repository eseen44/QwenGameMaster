    - {fact_id: fact_weigher_heard_the_entire_conversation, source_event_id: event_turn_interlude_107, claim: "Siedzial przy stole przez cala rozmowe: dzwignie Lucana, blankiet, zapowiedz wojny domowej za dwa tygodnie, odlozenie dostaw i obie prosby - prawnik i materialy."}
    - {fact_id: fact_weigher_was_addressed_directly_and_correctly, source_event_id: event_turn_interlude_107, claim: "Lucan poprosil wlasnie JEGO o wspolne liczenie pieniedzy, pod dworna wymowka o kasjerce. Trafil w pryncypala za drugim podejsciem."}
    - {fact_id: fact_weigher_agreed_to_stock_ahead_of_the_ruling, source_event_id: event_turn_interlude_109, claim: "Przyjal liste Lucana - zakazane podreczniki, materialy, egzotyczne stworzenia - i rozbil ja na tempa: materialy czwartek, zwierzeta w tygodniach, ksiazki bez terminu i tym samym kanalem co robota konsekracyjna. Zapas NIE bedzie lezal w miescie: stoi poza Lumaria i wchodzi na zamowienie, czyli kazde zamowienie jest nazwanym zyczeniem konkretnego czlowieka."}
    - {fact_id: fact_weigher_has_a_stake_in_lucan_surviving, source_event_id: event_turn_interlude_109, claim: "Powiedzial wprost: jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan, a zapas kupiony pod jego termin umiera razem z nim. Interes transakcyjny, nie zyczliwosc."}
    - {fact_id: fact_weigher_knows_lucan_declared_war_on_the_church, source_event_id: event_turn_interlude_110, claim: "Nie odradza i nie moralizuje. Kosciol jest zarazem jedyna instytucja miedzy nim a kategoria towaru, w ktora mial wlozyc pieniadze - dwa ryzyka na tej samej szali, wiec inwentarz na ten tydzien bedzie mniejszy i ostrozniejszy."}
    - {fact_id: fact_weigher_knows_a_bigger_cemetery_problem_exists, source_event_id: event_turn_interlude_110, claim: "Lucan nazwal ISTNIENIE wiekszego problemu z przyszloscia cmentarza, nie jego tresc. Dla ludzi zyjacych z wiedzenia wczesniej to najdrozszy rodzaj zdania."}
    - {fact_id: fact_weigher_priced_the_warning_channel_without_pressing, source_event_id: event_turn_interlude_113,
       claim: "Przyjal obietnice kanalu ostrzegawczego BEZ nacisku: nie zadal terminu i nie targowal sie o nazwisko. Powiedzial tylko, na czym polega produkt - ostrzezenie, ktore przychodzi tego samego dnia co klopot, nie jest ostrzezeniem, tylko wiadomoscia. Kupuje WYPRZEDZENIE; sygnal wart mniej niz doba jest wart nic."}
    - {fact_id: fact_weigher_saw_his_own_lawyer_arrive_beside_lucan, source_event_id: event_turn_interlude_195,
       claim: "Lucan doszedl do jego stolu na targu z Rovanem Keszem obok, nie po niego. Kesz jest stalym klientem pryncypala (retcon_000124), wiec pryncypal widzi wlasnego prawnika przychodzacego z kims. Odnotowal spojrzeniem, nie skomentowal. NIEROZSTRZYGNIETE I JEGO DO ROZSTRZYGNIECIA: czy chce, zeby jego prawnik byl widoczny jako gwarant proceduralny naprzeciw Strazy i na wewnetrznym przesluchaniu gildii (t_194 punkt 3)."}
    - {fact_id: fact_weigher_was_greeted_and_nothing_more, source_event_id: event_turn_interlude_195,
       claim: "Lucan otworzyl samym powitaniem o 13:03, pytajac o poranek, ktory juz sie skonczyl. Zadnej sprawy nie postawil: kanal ostrzegawczy nadal nienazwany, pytanie 'co poza zlotem' nadal bez odpowiedzi, pajak nadal w pudelku w kieszeni."}
    - {fact_id: fact_weigher_took_two_new_orders_stone_and_curse_information, source_event_id: event_turn_interlude_196,
       claim: "Przyjal do kanalu dwa zamowienia: (a) KAMIEN polszlachetny konkretnego szlifu, ktory Lucan opisal jako uzywany do przechowywania energii magicznej - wagowy takiego szlifu NIE ZNA, bo szlify zna po tym, ile biora, i poprosil o opis albo rysunek; powiedzial tez, ze najtansze zrodlo to szescdziesiat kilo bizuterii grobowej, ktore Lucan sam mu sprzedal trzy dni temu, i ze musi sprawdzic, czy kamienie jeszcze leza. (b) INFORMACJE o specjalistach od klatw i lokalnych wiedzmach. Przy obu powtorzyl cene z t_109: zapas nie lezy w miescie, wchodzi na zamowienie, wiec kazde zamowienie jest NAZWANYM ZYCZENIEM KONKRETNEGO CZLOWIEKA. Zadnej ceny nie podal i zadnego terminu nie ustalil."}
    - {fact_id: fact_weigher_heard_lucans_hobbyist_scholar_cover, source_event_id: event_turn_interlude_196,
       claim: "USLYSZAL, ze Lucan jest naukowcem hobbysta chcacym odtworzyc dzieje rzadkiej sztuki. To jest PRZYKRYWKA (state/secrets.yaml#cover_lucan_is_a_hobbyist_scholar_of_curse_history), a nie fakt o Lucanie - zapisywac wylacznie jako to, co uslyszal (retcon_000120). Nie kwestionowal jej. NIE MA na tej karcie zadnego faktu o tym, ze Lucan sam rzuca klatwy, i nie wolno mu takiego dopisac."}
    - {fact_id: fact_weigher_was_asked_for_a_person_of_unimpeachable_reputation, source_event_id: event_turn_interlude_196,
       claim: "Lucan poprosil go o czlowieka o nieposzlakowanej opinii, ktory wesprze go swoja osoba - i sam nazwal to najtrudniejsza z trzech spraw. Pryncypal nie odradzal i nie moralizowal (tak samo jak wobec wojny z Kosciolem w t_110): nazwal wlasciwosc wlasnego towaru - opinia, ktora ON moze dostarczyc, jest opinia czlowieka, ktory mu cos jest winien, czyli dokladnie ta cecha, ktora ja uniewaznia. ZADNEGO NAZWISKA NIE PODAL. Sprawa otwarta."}
    - {fact_id: fact_weigher_drew_the_line_at_the_market_table, source_event_id: event_turn_interlude_196,
       claim: "Na wprost zadane pytanie Lucana 'czy mozemy rozmawiac dalej tu' odpowiedzial, ze dwa pierwsze pytania sa tym, co przy tej wadze zadaje mu codziennie ktos inny, a trzecie nie jest. Precedens jest jego wlasny - caly interes z t_104-110 szedl w pokoju, nie na targu. NIE poprowadzil Lucana nigdzie, nie wyslal go po zgode i nie umowil terminu. Ruch zostal przy Lucanie."}
    - {fact_id: fact_weigher_got_the_full_stone_specification, source_event_id: event_turn_interlude_197,
       claim: "Dostal opis, o ktory prosil, i da sie go sprawdzic okiem pod swiatlo. SPECYFIKACJA: NIE bizuteria grobowa - Lucan odmowil odkupienia wlasnego towaru, mowiac, ze proweniencja PRZESZKADZA W FUNKCJI; charakter SOCZEWKI MINERALNEJ, nie kamienia ozdobnego; gatunek i cena gatunku niewazne; ZNAKOMITA PRZEJRZYSTOSC, najlepiej bez skazy. Pryncypal odpowiedzial jedna uwaga fachowa i nie targowal sie: w handlu kamieniem nie kosztuje rodzaj, tylko czystosc, bo czystosci nie da sie poprawic. Ceny NADAL nie podal."}
    - {fact_id: fact_weigher_heard_that_grave_provenance_spoils_the_function, source_event_id: event_turn_interlude_197,
       claim: "USLYSZAL - i to jest wszystko, co z tym wolno zrobic (retcon_000120). Zdanie 'proweniencja przeszkadza w funkcji' padlo w scenie, do niego, wiec NIE jest kanonem mechaniki: narrator nie ustanowil ani magazynowania energii w mineralach (t_192, nadal nie kanon), ani zadnej zasady o grobach. CO ON Z TEGO MA: jego agenda brzmi judge_lucan_by_what_he_declines_not_by_what_he_offers, a Lucan wlasnie odmowil wlasnego towaru i podal powod zakladajacy, ze kamien ma jakas funkcje. Rejestruje to i na tym koniec. forbidden_without_source obejmuje lucan_necromancy - NIE WOLNO mu z tego wyprowadzic nekromancji ani ramy dla niej."}
    - {fact_id: fact_weigher_took_lucan_off_the_table_into_the_back_room, source_event_id: event_turn_interlude_197,
       claim: "Na propozycje Lucana zszedl ze stolu wagowego do pokoju na zapleczu (zone_market_back_alleys) - bez targu, bez ceny wejscia i bez poreczenia, bo sam pol godziny wczesniej powiedzial, ze trzecia sprawa nie jest pytaniem do stolu. Weszli we trzech: on, Lucan i Kesz. Procedura z t_104 (towar zmienia rece za progiem) nie zadzialala, bo Lucan nie przyniosl towaru."}
    - {fact_id: fact_weigher_saw_the_beetle_and_got_the_optical_spec, source_event_id: event_turn_interlude_198,
       claim: "Lucan wylozyl mu na stol zuka (spy_beetle_01), do gory nogami, jako MIARE - chodzi o blaszke zastepujaca pancerz brzuszny. Zastosowanie podal obrazem: robi z niego swietlika, wiec kazda skaza rozprasza i marnuje swiatlo. To jest PRZYKRYWKA/obraz, nie mechanika - zapisywac wylacznie jako to, co uslyszal (retcon_000120). Zamowienie doprecyzowane: soczewki male, gatunek niewazny, kryterium to przejrzystosc, zrodlo to ODPAD JUBILERSKI. Pryncypal przyznal od razu, ze w odpadzie czystosc jest darmowa, a droga jest robocizna przebierania w miale - to jest dokladnie jego fach. Ceny nadal nie podal."}
    - {fact_id: fact_weigher_heard_the_cemetery_trace_reason, source_event_id: event_turn_interlude_198,
       claim: "USLYSZAL powod odmowy: Lucan nie moze pozwolic, zeby ktos powiazal mechanizmy ze szkielkami z cmentarzem i jego mana - 'pana zysk, moja strata'. NARRATOR NIE USTANOWIL z tego zadnej zasady o sladzie na towarze grobowym (retcon_000120, t_192). Co on z tego ma: klient odmowil wlasnego towaru z powodu zakladajacego slad na rzeczach z grobu, a przez jego magazyn przeszlo szescdziesiat kilo tego towaru. NIE PANIKUJE - robote konsekracyjna odklada odruchowo od lat (portrayal#tell), wiec kategoria rzeczy, z ktorych trzeba cos zdjac, nie jest dla niego nowina. forbidden_without_source obejmuje lucan_necromancy i NIE WOLNO mu tego stad wyprowadzic."}
    - {fact_id: fact_weigher_was_asked_for_a_hard_brittle_magic_conducting_metal, source_event_id: event_turn_interlude_198,
       claim: "Alternatywa podana przez Lucana: analog metaliczny zamiast soczewki, ale wymagalby czegos mniej elastycznego niz srebro - twardego i kruchego zamiast kowalnego, i przewodzacego magie. Lucan sam powiedzial, ze brzmi drogo. ZADEN PLIK KAMPANII NIE NAZYWA TAKIEGO METALU i narrator zadnego nie wymysla ani nie wyklucza. Pryncypal odpowiedzial w swoim fachu: metale zna po tym, jak zachowuja sie pod probierzem, kruche w jego robocie sa stopy i domieszki, takiego towaru nie trzyma. Zamowienie lezy w kanale, nierozstrzygniete."}
    - {fact_id: fact_weigher_got_the_first_non_gold_offer_from_lucan, source_event_id: event_turn_interlude_198,
       claim: "PIERWSZA odpowiedz na jego wlasne pytanie z t_103 (obligation_define_syndicate_exchange_beyond_gold, 95 tur w statusie unresolved_term): staly popyt na zbitki, czyli odpad jubilerski, ktorego nikt nie chce, potencjalnie z Akademia zamawiajaca w trybie stalym. Odnotowal trzy rzeczy i ZADNEJ NIE PRZYJAL: (a) to pierwsza pozycja z listy Lucana, ktora jest LEGALNA - nie potrzebuje kanalu spoza miasta i nie umiera razem z klientem; (b) w jednym zdaniu sa dwa warunki, jesli sie uda oraz Akademia moze zaczac, a on nie kupuje obietnic; (c) koszt sprawdzenia jest bliski zeru, bo zbitki kupuje sie workiem. Umowy nie ma, ceny nie ma."}
    - {fact_id: fact_weigher_narrowed_the_witch_order_to_a_name_and_a_place, source_event_id: event_turn_interlude_198,
       claim: "Lucan zawezil zamowienie: chce SAME NAMIARY - kto i gdzie - poza miastem byle nie daleko, bez wozenia kogokolwiek, raczej stara niz mloda. To zdejmuje cala logistyke zywego towaru, ktora w t_109 byla powodem terminow w tygodniach. ODPOWIEDZ PRYNCYPALA: wiedzmami nie handluje i takiego slowa w swoim fachu nie zna, ale kategoria pracy tego rodzaju u niego ISTNIEJE - robota konsekracyjna schodzi z grobowego towaru i nie schodzi w miescie (portrayal#tell + fact_weigher_agreed_to_stock_ahead_of_the_ruling + inventory.yaml: 52 000 'robota konsekracyjna wlacznie'). NIE ODDAL TEJ OSOBY: nazwiska nie podal, miejsca nie podal, spotkania nie umowil i nie opisal jej. Powiedzial, ze ktos, kto te robote wykonuje, wiedzialby, kto jeszcze w okolicy robi rzeczy tego rodzaju - i ze zapyta. ZAMOWIENIE ZLOZONE, ODPOWIEDZI NIE MA."}
    - {fact_id: fact_weigher_authorised_kesz_to_stand_visibly_for_lucan, source_event_id: event_turn_interlude_199,
       claim: "POWIEDZIAL TAK. Kesz staje jako gwarant proceduralny na przesluchaniu kierownictwa gildii i przed Straza, za wiedza i zgoda pokoju. Powod jest jego wlasny i transakcyjny, nie zyczliwy - fact_weigher_has_a_stake_in_lucan_surviving z t_109 (jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan, a zapas kupiony pod jego termin umiera razem z nim). Lucan nazwal mu to jego wlasne zdanie z powrotem i pryncypal potwierdzil je plasko. HONORARIUM ZERO, z jego wyboru: nie bierze pieniedzy za pilnowanie 40 000 srebra, ktorych jeszcze nie wyplacil."}
    - {fact_id: fact_weigher_set_one_condition_room_visible_principal_unnamed, source_event_id: event_turn_interlude_199,
       claim: "JEDYNY warunek, i jest to doslownie jego agenda#stay_unnamed, nie wymyslona cena. Plan Lucana opiera sie na tym, ze WSZYSCY BEDA WIEDZIEC; pryncypal rozdzielil to na dwie rzeczy: widoczny ma byc POKOJ, nie ON. Straz i gildia moga wiedziec, ze przy sprawie stoi syndykat - to jest produkt. Nikt nie wymawia jego osoby, nie opisuje wagi i nie podaje stolu na targu. Warunek nie blokuje planu, zaweza go o jedno slowo."}
    - {fact_id: fact_weigher_does_not_buy_the_spectacle, source_event_id: event_turn_interlude_199,
       claim: "Jedyna rzecz z calej oferty, ktorej nie kupil. Lucan zaproponowal, ze doceni dobry spektakl, kiedy szlachetni ludzie zrozumieja, ze wzial za zakladnika cale miasto. Pryncypal odmowil zgodnie z karta, nie z przekory: portrayal#appearance to rzemieslnik, nie zbir, a czlowiek, ktorego cala metoda polega na tym, zeby nikt nie pamietal, ze on tam byl, nie jest odbiorca spektaklu - spektakl sie ZAPAMIETUJE. Powiedzial to raz, bez moralizowania. To NIE jest weto wobec planu: zgoda, warunek i brak honorarium zostaja w mocy."}
    - {fact_id: fact_weigher_accepted_the_lawyer_line_as_partial_warning_channel, source_event_id: event_turn_interlude_199,
       claim: "Przyjal Kesza jako linie niosaca pokojowi tresc i terminy obu rozpraw wczesniej niz ktokolwiek inny. NIE ZAMYKA to obligation_name_advance_warning_channel_for_syndicate i sam Lucan uzyl slowa CZESC. Wlasne zdanie pryncypala z t_113 nadal obowiazuje: ostrzezenie przychodzace tego samego dnia co klopot nie jest ostrzezeniem, tylko wiadomoscia - kupuje wyprzedzenie warte co najmniej dobe, typu 'zamykajcie'. Kalendarz rozpraw tym nie jest. Pajak w pudelku NIE zostal zaoferowany."}
    - {fact_id: fact_weigher_received_toby_as_the_alarm_channel, source_event_id: event_turn_interlude_200,
       claim: "DOSTAL KANAL, ktorego zazadal w t_113. Lucan wylozyl na stol pajaka (spy_cellar_spider_06), przedstawil go jako Toby, kazal mu machnac lapka i oddal go na stale. Protokol: trzy albo cztery talerzyki, przejscie na kolejny = odpalenie kolejnej fazy. Alarm czytany OKIEM. Pryncypal przyznal terrarium albo wlasny kat bez dyskusji - kosztuje go skrzynke i miejsce na polce. NAZWAL TEZ, CO SIE PRZESUNELO: doba przewagi nie mieszka juz w kanale, tylko w Lucanie; urzadzenie dostarcza sygnal natychmiast, ale to Lucan decyduje kiedy. Podal to jako domkniecie transakcji, nie jako zastrzezenie. LICZBA I TRESC FAZ NIEUSTALONA."}
    - {fact_id: fact_weigher_saw_a_spider_obey_a_command_and_did_not_ask, source_event_id: event_turn_interlude_200,
       claim: "ZAPISYWAC DOKLADNIE TYLE I ANI SLOWA WIECEJ. Widzial pajaka, ktory na polecenie Lucana machnal lapka. NIE PADLO slowo nieumarly, martwy ani nekromancja, i nikt nie zapytal, czym ten pajak jest. Pryncypal nie zapytal zgodnie z wlasna zasada z t_196 - powodu nie kupuje i nie pyta o niego - oraz z portrayal#tell, bo robote konsekracyjna odklada odruchowo od lat. NIE WOLNO z tego zrobic, ze wie o nekromancji Lucana: worlds/solmara/lore/necromancy-law.yaml#animal_gray_zone ma pajaka zwiazanego magia smierci jako przypadek difficult_to_classify_and_prove. forbidden_without_source nadal obejmuje lucan_necromancy i spidey_existence - Toby nie jest companion_spidey i o Spideyu nie padlo nic."}
    - {fact_id: fact_weigher_had_his_name_refused_by_lucan, source_event_id: event_turn_interlude_200,
       claim: "Lucan nie tylko przyjal jego warunek z t_199, ale go przebil: powiedzial, ze nie wie, jak pryncypal sie nazywa, i NIE CHCE wiedziec, przynajmniej na razie, bo ciezko robi sie interesy z martwymi ludzmi. To trafia naraz w dwie z trzech pozycji jego agendy - stay_unnamed oraz judge_lucan_by_what_he_declines_not_by_what_he_offers. Czlowiek oceniajacy ludzi po tym, czego odmawiaja, dostal odmowe dokladnie tej rzeczy, ktorej sam pilnuje od poczatku znajomosci. Lucan zawezil przy tym wlasny interes: nie syndykat jako taki, tylko zeby szantazowani nie wiedzieli, i prawnik."}
    - {fact_id: fact_weigher_has_the_four_phase_schedule, source_event_id: event_turn_interlude_201,
       claim: "MA HARMONOGRAM. Cztery fazy Tobiego: (1) stan obecny, obowiazuje od teraz; (2) wszystkie strony swiadome - koniec przesluchan, powiadomieni rycerze, Akademia, Kosciol; (3) kordon dookola cmentarza; (4) wejscie grupy badawczo-uderzeniowej na cmentarz. Lucan zaklada DZIEN ALBO DWA miedzy faza 2 a scisla kontrola okolicy - to jego SZACUNEK, nie zegar, i zadnego wpisu w state/clocks.yaml z tego nie ma. POLICZYL NA GLOS, KTORY TALERZYK JEST TOWAREM: fazy 3 i 4 sa jako ostrzezenia bezuzyteczne, bo przy kordonie nie ma juz czego wywozic; doba, o ktora prosil w t_113, mieszka wylacznie w FAZIE 2. Potwierdzil konstrukcje gracza, nie poprawil jej. Szczegoly: planning/act-03-defence.yaml#syndicate_warning_channel."}
    - {fact_id: fact_weigher_still_does_not_know_what_is_under_the_cemetery, source_event_id: event_turn_interlude_201,
       claim: "GRANICA, KTORA MUSI ZOSTAC. Wszystkie cztery fazy opisuja REAKCJE INSTYTUCJI, nie przyczyne. Lucan nie powiedzial, co jest pod cmentarzem, po co mialby tam wejsc oddzial ani czego szuka, a pryncypal NIE ZAPYTAL. Dla niego to jest tylko harmonogram do kategorii, ktora juz mial - fact_weigher_knows_a_bigger_cemetery_problem_exists (t_110). forbidden_without_source NIENARUSZONE: varkhen_existence, seals_and_lower_gate, lucan_necromancy, spidey_existence."}
    - {fact_id: fact_weigher_has_the_revised_four_phases, source_event_id: event_turn_interlude_202,
       claim: "FAZY PRZEDEFINIOWANE szesc minut po pierwszej wersji, zastepuja te z t_201. (1) TERAZ - i to NIE jest sygnal 'usun dobytek', tylko 'usun siebie z miasta'; (2) odbylo sie przesluchanie Lucana ORAZ konferencja akademikow o prawnej naturze nekromancji - wszyscy wiedza, ale sa zbyt zajeci polityka; (3) koniec burzy politycznej i oficjalne powolanie grupy do problemu; (4) wejscie. KLUCZOWA ROZNICA WOBEC t_201: trojka przestala znaczyc kordon i znaczy 'powolano grupe', a kordon zszedl miedzy 3 a 4 - caly harmonogram jest o krok wczesniejszy. Szacunki Lucana: faza 2 trwa najwyzej pare dni, od fazy 3 do kordonu maksymalnie dzien-dwa. TO SA SZACUNKI, NIE ZEGARY. Szczegoly: planning/act-03-defence.yaml#syndicate_warning_channel."}
    - {fact_id: fact_weigher_accepted_that_the_last_saucer_is_the_deadline_to_be_gone, source_event_id: event_turn_interlude_202, corrected_by: retcon_000127,
       claim: "POPRAWIONE retconem 000127 - pierwsza wersja tego wpisu przypisywala instrukcje 'usun siebie z miasta' talerzykowi PIERWSZEMU; gracz mial na mysli CZWARTY. Faza 1 jest po prostu stanem biezacym. CZWARTY TALERZYK NIE JEST OSTRZEZENIEM, TYLKO TERMINEM: moment wejscia jest momentem, do ktorego pryncypala ma juz nie byc w miescie. W t_201 sam policzyl, ze towar siedzi w fazie 2; Lucan przestawil to o poziom wyzej - koncem drabinki nie jest 'przewiez towar', tylko 'ciebie ma tu nie byc', a na to potrzeba calego biegu 1-2-3, nie ostatniego sygnalu. Pryncypal przyjal to i nie jest to dla niego nowa mysl (t_109, fact_weigher_has_a_stake_in_lucan_surviving), tylko pierwszy raz powiedziana przy nim na glos. NIE ZADEKLAROWAL, ze wyjedzie, ani ze nie wyjedzie - decyzja nie zapadla i nie jest na dzis. Polowe ewakuacji ma zrobiona projektowo (zapas poza Lumaria od t_109); wywiezc nie da sie pokoju za straganami ani tego, ze nikt go nie zna."}
    - {fact_id: fact_weigher_asked_how_far_not_what_it_is, source_event_id: event_turn_interlude_202,
       claim: "JEDYNE PYTANIE, KTORE ZOSTALO W TYM POKOJU BEZ ODPOWIEDZI. Nie zapytal, CZYM jest rzecz pod cmentarzem - zapytal, JAK DALEKO ma sie usunac. Pytanie logistyczne, wiec nie lamie jego wlasnej zasady z t_196 (powodu nie kupuje i nie pyta o niego), a jednoczesnie jest konkretne. LUCAN NIE ODPOWIEDZIAL. forbidden_without_source nadal obejmuje varkhen_existence i seals_and_lower_gate - narrator skali nie zmysla."}
    - {fact_id: fact_weigher_was_told_the_scale_and_stopped_being_the_man_who_does_not_know, source_event_id: event_turn_interlude_203,
       claim: "USLYSZAL SKALE, o ktora nie prosil. Zapytal 'jak daleko' - pytanie logistyczne - i dostal odpowiedz szersza niz pytanie. NAJLEPSZY PRZYPADEK wg Lucana: to, co bylo za pierwszym razem, czyli trupy wychodzace z ziemi, duzo, wiecej niz oplaca sie tluc. NAJGORSZY: miasto moze przestac istniec, i nie przez nieumarlych, tylko przez zawalenie, gdy katakumby pod nimi zaczna sie wykopywac. CO NADAL WIE, A CZEGO NIE: padly KONSEKWENCJE, nie przyczyna - nie wie, CO tam jest ani dlaczego. Varkhen, pieczecie i dolna brama NIE PADLY; forbidden_without_source nienaruszone. TO NIE JEST KANON SWIATA (retcon_000120) - narrator NIE ustanowil katakumb pod targiem, zawalenia Lumarii ani zadnej mechaniki, i NIE ORZEKA, czy Lucan opisal sytuacje, czy dobral skale tak, zeby czlowiek na pewno wyjechal. Zapisane wylacznie jako to, co uslyszal."}
    - {fact_id: fact_weigher_lost_the_not_knowing_he_had_bought, source_event_id: event_turn_interlude_203,
       claim: "PRZECIETY ZOSTAL WARUNEK Z t_109. planning/act-03-defence.yaml#cemetery_syndicate_arrangement.what_lucan_bought konczy sie zdaniem: nie wchodza na teren, NIE CHCA WIEDZIEC, CO TAM JEST, nie biora odpowiedzialnosci za wynik; pryncypal kupuje CZAS I PUSTKE, nie wspolne przedsiewziecie. Trzymal to przez cala rozmowe - przy Tobim nie zapytal, przy czterech fazach nie zapytal, w t_196 powiedzial wprost, ze powodu nie kupuje. Nie robi z tego sceny i nie ma pretensji, ale NAZYWA zmiane: przestal byc czlowiekiem, ktory nie wie. Umowa z t_109 pozostaje w mocy i nie zostala odwolana."}
    - {fact_id: fact_weigher_had_his_investment_thesis_undercut, source_event_id: event_turn_interlude_203,
       claim: "Wedlug seraphines_reading_of_the_motive z tego samego pliku syndykat KUPUJE PRZYSZLOSC TERENU: pryncypal sam powiedzial, ze pusta linia sciagnie kogos w ciagu tygodni, ze ktokolwiek ja wezmie, bedzie potrzebowal cmentarza, i ze on tego dlugo nie zatrzyma. Cala ta kalkulacja zaklada, ze po wszystkim NADAL ISTNIEJE miasto i cmentarz. 'Miasto moze przestac istniec' nie jest wiec dla niego groza, tylko uniewaznieniem tezy inwestycyjnej - reaguje jak na wiadomosc, ze grunt pod swiezo kupiona dzialka moze nie byc gruntem. NIE ZERWAL ukladu, nie zazadal wiecej pieniedzy i nie zadeklarowal wyjazdu - zadna z tych decyzji nie zapadla."}
    - {fact_id: fact_weigher_got_the_scale_walked_back_to_ordinary_subsidence, source_event_id: event_turn_interlude_204,
       claim: "Lucan NIE odwolal niczego z t_203 - podal zwyczajne wytlumaczenie tego samego zjawiska: grunt nad duza nekropolia potrafi sie zarywac, zwlaszcza kiedy ktos stamtad wykopuje zasoby, wiec na razie mowa o zwyklym zagrozeniu zawalem. Pryncypal wraca przez to z 'moje przedsiewziecie moze nie miec gruntu' do 'teren jest ryzykowny' - teza inwestycyjna przestaje byc uniewazniona i wraca do bycia ryzykowna. NIEWIEDZY STRACONEJ W t_203 NIE ODZYSKUJE i tego nie udaje. UWAGA: 'ktos stamtad wykopuje zasoby' obejmuje JEGO - trzy dni temu kupil szescdziesiat kilo wykopanych stamtad rzeczy (t_111) i posortowal je wlasnymi rekami. Lucan powiedzial to uprzejmie, bez akcentu; pryncypal uslyszal, bo to jego wlasny towar."}
    - {fact_id: fact_weigher_heard_you_do_not_know_half_of_it, source_event_id: event_turn_interlude_204,
       claim: "Lucan jednoczesnie zmniejszyl mechanizm i powiekszyl tajemnice: 'nadal nie wie pan nawet polowy'. Pryncypal ZAUWAZYL napiecie miedzy tymi dwoma zdaniami i nazwal je raz, bez triumfu, NIE ZADAJAC rozwiniecia. NARRATOR NIE ROZWIJA TEJ DRUGIEJ POLOWY ANI O SLOWO i nie daje do niej zadnej wskazowki; zaden NPC nie zgaduje. forbidden_without_source nienaruszone: varkhen_existence, seals_and_lower_gate, lucan_necromancy, spidey_existence."}
    - {fact_id: fact_weigher_weighs_lucan_by_the_fact_he_has_not_left, source_event_id: event_turn_interlude_204,
       claim: "JEDYNY ARGUMENT TEJ ROZMOWY, KTORY WCHODZI MU DO KSIAG. Sam powiedzial w t_203, ze na kamieniu sie nie zna i nie ma jak odroznic opisu sytuacji od skali dobranej pod efekt. 'Gdybym wiedzial, ze nie ma tu czego szukac, dawno bym wyjechal' jest pierwszym zdaniem z pokryciem W ZACHOWANIU: Lucan kupuje warsztat alchemiczny, zamawia odpis tomu na dziewiec dni, bierze prawnika na dwie rozprawy - to sa wydatki czlowieka, ktory planuje tu byc. Zgodne z agenda#judge_lucan_by_what_he_declines_not_by_what_he_offers. NIE ZADEKLAROWAL przy tym, ze zostaje ani ze wyjezdza; uklad z t_109 w mocy, nierenegocjowany, ceny za trzy zamowienia nadal nie podal."}
