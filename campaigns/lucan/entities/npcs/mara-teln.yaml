    - {fact_id: fact_mara_received_records_clerk_letter_about_tannery_dates, source_event_id: event_turn_interlude_101, claim: "Dostala pismo urzednika akt magistratu z prosba o potwierdzenie dat pobytu w garbarni i skladu grupy; nazwiska urzednika nie zna. Na polecenie Lucana napisze PRAWDZIWE daty i dopisze npc_halven_rusk jako obecnego (event_turn_interlude_102)."}
    - {fact_id: fact_mara_overheard_the_whole_syndicate_room, source_event_id: event_turn_interlude_113, claim: "Slyszala cala rozmowe w pokoju powroznika: zapowiedz wojny z Kosciolem, sprzedaz wiedzy wyprzedzajacej, obietnice pustki wokol cmentarza na czas prob gildii, plan sciagniecia zakonu mieczowego do roboty, o ktorej gildia nie wie, i kwote 52 000 srebra. Przy obcych nie skomentowala niczego. Na ulicy oswiadczyla, ze o Kosciol NIE zapyta - woli nie musiec pozniej odpowiadac, czy wiedziala."}
    - {fact_id: fact_mara_knows_lucan_is_physically_weak_and_asked_for_training, source_event_id: event_turn_interlude_101, claim: "Lucan sam przyznal slabosc fizyczna i poprosil ja o pomoc z cwiczeniami; uzgodniona godzina dziennie rano od dnia czwartego."}
    - {fact_id: fact_mara_believes_lucan_sleeps_in_the_upstairs_duty_room, source_event_id: event_turn_interlude_117, updated_by_event_id: event_turn_interlude_182, claim: "Lucan powiedzial jej -pokoj w gildii, spie tam teraz- i nie sprostowal. Mara czyta to jako dyzurke na gorze zarejestrowana na Lucana i przyjdzie tam o swicie dnia czwartego na godzine cwiczen. KOREKTA t_182: dawny dopisek 'FAKTYCZNIE Lucan spi w celi po Varkhenie w piwnicy' jest NIEAKTUALNY - retcon_000038 ustalil, ze Lucan sypia wlasnie w pokoju dyzurnym na gorze, a cela w piwnicy jest jego formalnie i trzyma jego rzeczy, lecz celowo w niej nie sypia do konca sprawy. Przekonanie Mary jest wiec PRAWDZIWE i nie ma tu czego demaskowac. Ryzyko przykrywki dotyczy tego, komu cela jest przypisana w rejestrze, nie tego, gdzie Lucan lezy."}
    - {fact_id: fact_mara_knows_lucan_directs_life_force, source_event_id: event_turn_interlude_184, claim: "Zapytala wprost, czy to, co Lucan robil ze swoim barkiem na treningu, jest tym samym, co robil w sarkofagu. Dostala odpowiedz: 'troche tak, troche nie'. Lucan NAZWAL MECHANIZM - kieruje sila zyciowa; wlasna dokladnie, cudza z trudnoscia, na zywych nie probowal. U nie-martwych sila juz sie ciala nie trzyma, cialo jedzie na oparach, a sila przestala byc jego i szuka kogos, kto moze ja przyjac. Wyjasnil tez gojenie: nikt nie wie dokladnie, jak dziala cialo, wiec on wymusza na kawalku siebie, zeby sie gojlo, a anatomia i szkolne badanie procesu mowia mu, GDZIE nacisnac. Mara ROZUMIE TERAZ, czemu Varkhen slabl - a raczej wierzy, ze rozumie. UWAGA (retcon_000120): to co dostala jest WERSJA LUCANA, nie mechanizmem. Element 'na zywych nie probowalem' jest KLAMSTWEM ZASIANYM CELOWO, zeby Mara powtarzala je dalej - i powtorzy, bo nie ma powodu watpic. Reszta opisu jest zmiekczona w te sama strone. Zadnej obietnicy w zamian nie zlozyla (voluntary_agreement pozostaje forbidden_without_source)."}
    - {fact_id: fact_mara_assigned_to_the_cemetery_job_by_seraphine, source_event_id: event_turn_interlude_277, claim: "Seraphine przyszla do swietlicy pozno wieczorem dnia czwartego, powiedziala dwa zdania i wyszla: schodza we dwoje z Borosem, robota jest PODPISANA i ida DNIEM. Wersja, ktora Mara dostala, jest z papieru (t_266/t_267): naturalna niecka pod cmentarzem, cos sie obsuwa, trzeba obadac, ustabilizowac i odciac, kilofy i ludzie gildii, na pismie konserwacja. NIE dostala tego, co pod spodem, i sama powiedziala Lucanowi 'tyle dostalam i tyle chce miec'. INSTRUKCJI OD LUCANA NADAL NIE MA - nalezaly do niego od t_269 i Mara nazwala ten brak wprost."}
    - {fact_id: fact_mara_heard_lucan_did_not_sleep_and_ties_it_to_the_cemetery, source_event_id: event_turn_interlude_277, claim: "Lucan przeprosil za nieobecnosc na porannych cwiczeniach i powiedzial sam z siebie, ze nie spal, i ze ma to zwiazek z cmentarzem. UWAGA retcon_000120: to jest KWESTIA LUCANA, nie fakt o swiecie - Mara ma tyle, ile uslyszala. Zapytala wczesniej, gdzie byl z rana, i zaraz sama zamknela temat slowami, ze woli nie wiedziec, niz potem tlumaczyc, ze wiedziala. Zauwazyla za to zmyslami, ze po nieprzespanej nocy wyglada jak ktos wyspany, powiedziala mu to i dodala, ze nie pyta (retcon_000112 - jest jedyna osoba w zasiegu, ktora moze to zauwazyc)."}
    - {fact_id: fact_mara_knows_the_builder_cover_and_the_noon_entry, source_event_id: event_turn_interlude_277, claim: "Plan wejscia podany przez Lucana: na cmentarz wchodza ZA DNIA i JAWNIE, tak zeby widziano ich jako ekipe budowlana; czas do dziesiatej albo jedenastej, na miejscu o dwunastej. Mara przyjela to bez zastrzezen i dodala od siebie, ze murarzy na cmentarzu w poludnie ludzie zagaduja - grabarz zapyta, kto placi. Zgodzila sie tez na GODZINE treningu z Lucanem od razu, z wlasna granica: potem jedzenie i przeglad sprzetu, ktory wybierze Boros."}
    - {fact_id: fact_mara_heard_lucans_version_of_running_without_sleep, source_event_id: event_turn_interlude_278, claim: "Lucan powiedzial jej wprost, ze nawykl do malej ilosci snu i ze DOPALA SIE w sposob analogiczny do tego, co jej tlumaczyl na poprzednim treningu (t_184, kierowanie sila zyciowa), oraz ze na dluzsza mete pewnie nie jest to zdrowe, ale na dzis wytrzyma. UWAGA retcon_000120: to jest JEGO WERSJA, nie mechanizm - czesc prawdziwa (retcon_000112: nadwyzka sieci realnie pokrywa brak snu), czesc zmiekczona tak samo jak w t_184. Mara nie ma czym tego rozroznic i nie probuje."}
    - {fact_id: fact_mara_changed_her_training_method_because_lucan_masks_fatigue, source_event_id: event_turn_interlude_278, claim: "Druga sesja treningu. Mara PRZESTALA pytac Lucana o samopoczucie i powiedziala mu dlaczego: trener czyta zmeczenie, a jego odpowiedz jest bezuzyteczna, wiec bedzie czytac forme. Porownala tez wczoraj z dzis - drzenie reki po szesciu powtorzeniach w t_184, dzis zadnego - i nazwala to nie-komplementem. Zapowiedziala, ze tydzien codziennych sesji widac przy CHODZENIU, nie przy biciu. Umowa na dzis: pod brama o jedenastej."}
    - {fact_id: fact_mara_heard_the_dig_instructions_and_flagged_the_cover, source_event_id: event_turn_interlude_279, claim: "Byla przy instrukcjach - zna cel (otwarcie drogi do nizszych katakumb za zawalem przy komorze Varkhena), wie, ze ida bez nadzoru, i slyszala, ze bezpanskie wchodzi w gre oraz ze Boros nazwal swoj udzial z gory. WNIOSLA JEDNA RZECZ ZE SWOJEGO RZEMIOSLA: murarze wynosza GRUZ, a worki wychodzace pelne i nie wracajace puste wygladaja z zewnatrz inaczej niz worki, ktore wychodza i wracaja - wiec na wozie powinno byc i jedno, i drugie. To propozycja, nie warunek; nie postawila zadnego zadania ani terminu."}
    - {fact_id: fact_mara_loaded_both_rubble_and_sacks, source_event_id: event_turn_interlude_283, claim: "Zrealizowala wlasna uwage z t_277: na wozie jest I GRUZ, I WORKI - tynk i pol cegly wziete zza gildii leza na wierzchu, osiem zlozonych workow pod plachta. Zameldowala to jednym zdaniem, 'jest jedno i drugie', bez rozwijania. Siada na skrzyni tak, zeby miec przed soba cala ulice.
       Jej wyliczenie: pod brama cmentarna dwadziescia po jedenastej, godzina zapasu przed dwunasta."}
