schema_version: 1
id: npc_lucan_father
name: Ojciec Lucana (imię nieustalone)
status: active
importance: appeared_in_play_active_social_scene
role: Akademik; czwarty lub piąty syn głównej linii rodu Veyr, bez szans na
  dziedzictwo.
lifecycle: {state: alive_confirmed, last_confirmed_event_id: event_turn_interlude_017_misnotice_past_porter}
current_location_id: loc_lumaria_magical_academy
current_zone_id: zone_academy_laboratory_wing
surname_known: Veyr
name_status: Imię nieustalone; nazwisko rodowe Veyr jest kanoniczne i można go tak
  tytułować (profesor Veyr).
portrayal:
  tone: warm_verbally_caring_but_functionally_absent
  threat_scope: neglect_rather_than_active_harm
  profile_confirmed_by_user: true
  profile_source_event_id: event_turn_interlude_016_walk_to_academy
  traits:
    - Profil autystyczny - żyje we własnym świecie, nie w złej woli.
    - Ciepły i werbalnie troskliwy; mówi rzeczy, które brzmią na opiekuńcze, i
      naprawdę tak myśli.
    - Gubi wątek w trakcie rozmowy i de facto jest nieobecny, nawet będąc obok.
    - Egocentryczny nie z pogardy, a z pochłonięcia własnymi badaniami.
    - Regularny pracoholizm, mało ruchu; stałe laboratorium, w którym spędza 99% życia.
    - O istnieniu żony często zapomina.
    - Polityka go nie interesuje i nie orientuje się w niej.
    - KOSZMAR ALUMNOW tej uczelni - nie ze zlosliwosci, a z braku jakiejkolwiek kalibracji
      spolecznej. Bedzie ryl w odpowiedzi tak dlugo, az cos z niej zostanie, i nie zauwazy,
      ze kogos przy tym niszczy. To ta sama cecha, ktora w domu wyglada jak nieobecnosc
      (event_turn_interlude_031_the_dormant_sinecure).
  behavior: Zawsze bardziej interesowały go własne badania niż syn. Nie brał
    czynnego udziału w naciskach głównej linii rodu ani w wymuszonych zaręczynach
    - ale też nigdy nie stanął w obronie Lucana. Nie z kalkulacji; po prostu nie
    zauważył na czas.
attitude_to_pc:
  summary: Ciepło bez obecności. Nie wrogość ani pogarda - brak uwagi. Prawdopodobnie
    nie wie nic o obecnym (nekromantycznym, przestępczym) życiu Lucana.
  institutional_usefulness: Podwójna krawędź - obojętność wobec polityki oznacza, że
    nie sprzeda Lucana dla własnej pozycji ani nie kalkuluje, ale też nie będzie o
    niego walczył w żadnym sporze o jurysdykcję. Wartościowy jest jako ekspert i
    kanał do Akademii, nie jako obrońca.
  likely_hook: Prawdziwie nowatorski problem badawczy przyciągnie jego uwagę
    natychmiast, skuteczniej niż jakikolwiek apel rodzinny - Lucan pierwszy raz w
    życiu ma coś, co może go zainteresować.
knowledge:
  confirmed:
    - fact: Lucan zjawił się u niego w laboratorium wieczorem.
      source_event_id: event_turn_interlude_017_misnotice_past_porter
    - fact: Lucan przyniósł żywe jedwabniki.
      source_event_id: event_turn_interlude_017_misnotice_past_porter
    - fact: Lucan przyniósł martwego, zmodyfikowanego pająka i przedstawił go jako konstrukt
        zbudowany z padłego zwierzęcia; brakuje mu jednego odnóża.
      source_event_id: event_turn_interlude_018_father_construct_pitch
    - fact: Widział z bliska Corpse_Stitch, wzmocnioną chitynę, wszczepione zęby i osobny
        gruczoł, ocenił to jako cierpliwą, porządną robotę warsztatową.
      source_event_id: event_turn_interlude_018_father_construct_pitch
    - fact: Wie, że kikut wymaga materiału dawcy o zbliżonej skali, i sam wskazał zbiory
        Akademii oraz jej stałe dostawy żywego towaru jako źródło.
      source_event_id: event_turn_interlude_018_father_construct_pitch
    - fact: Spidey jest poruszany czystym vitae - energią życia w martwym ciele - i żywi
        się realnie jak żywy pająk. Lucan powiedział mu to wprost.
      source_event_id: event_turn_interlude_019_vitae_disclosure_to_father
    - fact: Lucan zgodził się dostarczyć kilka okazów na konferencję.
      source_event_id: event_turn_interlude_020_decoy_construct_plan
    - fact: Lucan wpadł do laboratorium o zmierzchu, wołając od progu, że potrzebuje
        konsultacji, i przyprowadził ze sobą kobietę, która się nie przedstawiła; niesie
        pod pachą dwie odbitki. Ojciec nie wie, kim ona jest.
      source_event_id: event_turn_interlude_144b
    - fact: Lucan przedstawił kobietę przy drzwiach jako swoją doktorantkę i użył jej
        imienia (Neris). Profesor przyjął to bez weryfikacji i zaczął jej dyktować.
      source_event_id: event_turn_interlude_147
    - fact: Lucan wetknął mu pod nos kartkę z narysowanym optimum krzywej kosztu i podał
        nowy problem - warstwa srebra na skrzydłach jako podstawa do rycia run, wskazana
        przez "jakiegoś profesora". O nazwisko nie zapytał. Sprawdził srebro własną krzywą
        i odrzucił je jako wybór grubo powyżej optimum; wniosek zapamiętany jako "ten
        profesor nie liczył".
      source_event_id: event_turn_interlude_148
    - fact: Zlecił przypisy do krzywej kosztu osobie, którą uważa za doktorantkę syna, i
        stoi obok, gdy ona pyta, czyje twierdzenie ma w tym przypisie odesłać.
      source_event_id: event_turn_interlude_148
    - fact: Syn poprosił go o trzy najlepsze wyniki do wniosków, bo będzie je porównywał
        cenami. Podał trzy - własna wzmocniona chityna, spisane na straty preparaty ze
        zbiorów, świeży towar ze stałych dostaw - wraz z ceną za sztukę tej trzeciej
        pozycji, na głos. Atrybucję odesłał do tabel zaopatrzenia Akademii, bo nie pamięta,
        kto te liczby mierzył.
      source_event_id: event_turn_interlude_149
    - fact: Wstał, żeby przynieść rejestr zaopatrzenia Akademii i otworzyć go na stole,
        skoro liczby mają być porównywane cenami.
      source_event_id: event_turn_interlude_149
    - fact: 'Wydal DWIE z trzech substancji ukrywajacych, obie jako skargi: Concha surda (skarbce Akademii sa nia wylozone, jego przyrzady nie czytaja w srodku) oraz Sordina, plesn gluszaca (szkodnik zjadajacy okazy w jego magazynie). Przyniosl zdrapke z magazynu i otworzyl droge do muszli u wapiennikow. Porostu slepego NIE wymienil.'
      source_event_id: event_turn_interlude_151
    - fact: 'Wie, ze kobieta, ktorej dyktuje, jest autorka tekstu o szerokiej definicji ozywionego konstruktu - Lucan przedstawil ja z nazwiskiem (Aldhen). Wylozyl swoja ocene jej tekstu (odwazniejsza, niz jej sie to oplaci) i zaczal ryc w czesci trzeciej, wskazujac niespojnosc miedzy kryterium obiektywnym na papierze i jej wlasnym zdaniem o granicy jako cechy patrzacego. Wyciagnal reke po odbitke i jej nie dostal.'
      source_event_id: event_turn_interlude_152
    - fact: 'Przyznal, ze krytyka poznania jest symetryczna i nie obala niczyjego dowodu, oraz ze przyrzad mierzacy nie podaje liczby, tylko potwierdzenie od czlowieka trzymajacego go w rece - odczyt jest kontrastem, a punktu odniesienia dla grabarza nikt nie ustalil. Przyjal przemianowanie przedmiotu pomiaru z energii smierci na pozostalosci i metabolizm energii zyciowej jako poprawke metodologiczna i zauwazyl, ze czyni to z dokumentu prace biologiczna, w ktorej Kosciol nie ma legitymacji. Doszedl do krawedzi slowa vitae (zna je z t_019) i NIE przypomnial go sobie.'
      source_event_id: event_turn_interlude_158
    - fact: 'Zaproponowal zamiane kryterium na PROCEDURE uzgadniana przed polozeniem obiektu na stole: obserwacja, odejmowanie przez ciecie, zakonczenie kontrolowane. Punkt pierwszy przepisal z karmienia na test zasilania zewnetrznego. Granice postawil ksiegowo w trzech przypadkach - bierze i przetwarza samo, ty placisz i staje gdy przestaniesz, albo domyka rachunek samo z czegos niezaksiegowanego - i przypadek trzeci nazwal niemierzalnym. Przyjal CZTERY NOWE okazy zamiast pajaka z kikutem, z procedura na jednym z czterech, oraz grabarza jako probe kontrolna, ktora rozszerzyl do calego rzadu kontrolnego. Zaproponowal wpisanie jednostki badawczej Lucana do rejestru zaopatrzenia Akademii - wpis niezlozony. Podal z tabeli, ze dostawa swiezego towaru idzie bez opoznien, za ok. cztery dni.'
      source_event_id: event_turn_interlude_155
  suspected: []
  answered_question:
    - Zapytał, co porusza pająka, i dostał prawdziwą odpowiedź (vitae). Przyjął ją jako
      problem definicyjny, nie jako przestępstwo (event_turn_interlude_019).
  does_not_know:
    - Że okaz oddany Akademii ma być wabikiem, a nie Spideyem.
    - Że kartka z krzywą, którą trzymał dziesięć centymetrów od twarzy, to odwrocie tekstu
      kobiety, której dyktuje - i że jej nazwisko wyszło ze stołu do ręki Lucana.
    - Że jego syn rozumiał słowo "zabrać" jako realną utratę towarzysza, nie prestiżu.
  false_beliefs:
    - 'NADPISANE, NIE ZDEMASKOWANE (event_turn_interlude_152). Przez t_147-t_151 uwazal Neris Aldhen za doktorantke swojego syna. W t_152 Lucan przedstawil ja SAM, z nazwiskiem, jako autorke tekstu o konstruktach z ciala - czyli jako PROBLEM, nie funkcje. Problem bije funkcje (funkcja jest jedynym radarem spolecznym tego czlowieka), wiec etykieta doktorantki przestala byc zaladowana. Ojciec NIE uznal, ze syn go oklamal, i nie zarejestrowal sprzecznosci instytucjonalnej (samodzielna referentka nie jest niczyja doktorantka), bo nie orientuje sie ani w czasie, ani w polityce Akademii. SKUTEK: ojciec nie jest zrodlem rozjazdu w tej sprawie; rozjazd moze wyprodukowac wylacznie ktos trzeci, kto uslyszal oba zdania.'
    - Nie orientuje się, ile czasu minęło od przerwania edukacji Lucana.
    - Nie wie nic o nekromancji Lucana, o sieci pająków ani o Varkhenie. Przyjął
      przykrywkę "konstrukt z padłego pająka" bez badania jej, bo nie szuka przestępstwa;
      słowo nekromancja ani raz nie przyszło mu do głowy.
    - Nie wie o okresie bezdomności syna.
  forbidden_without_event: [lucan_necromancy, spidey_network, varkhen_identity, cemetery_operation_details]
agenda:
  current_goal: Doprowadzić do pokazania pracy syna ludziom, którzy by ją zrozumieli -
    i znaleźć odbitkę z nazwiskiem osoby walczącej o szeroką definicję ożywionych
    konstruktów.
  next_action: Grzebie w stosach za odbitką; potem zacznie ustalać termin i mówić o tym
    kolegom (clock_father_arranges_academy_showing, trzy dni).
  motive_note: Działa z entuzjazmu i z poczucia krzywdy - usłyszał, że komuś chcą
    zabrać projekt. NIE działa, żeby ochronić syna, bo nie zarejestrował, że syn jest
    w tarapatach.
relationships:
  - {target_id: pc_lucan, file_status: not_yet_created, note: "Plik relacji tworzymy po pierwszym realnym rozstrzygnięciu społecznym w tej scenie, nie z góry."}
history_disclosed_by_lucan:
  disclosure_state:
    source: 'Tura 040 zostala cofnieta na zyczenie gracza (rollback A, 2026-08-20). Sama tresc
      pochodzi od gracza jako kanon swiata i ZOSTAJE, ale w fikcji Lucan nie powiedzial tego
      jeszcze Seraphine - nie przypisywac jej tej wiedzy.'
  source_event_id: event_turn_interlude_040_grey_zone_and_the_glass_skull
  source: 'Podane przez gracza Seraphine jako precedens dla szarej strefy.'
  human_transmutation_era: 'Kiedy ludzka transmutacja przeszla w szara strefe, ojciec Lucana
    doslownie ZSZYL DWOCH STUDENTOW ZE SOBA, zeby obserwowac, jak ich mozg poradzi sobie z
    polaczeniem dwoch ukladow nerwowych.'
  inquisition_condemnations: 'Inkwizycja potepila go DWA RAZY. Formalne potepienie nie
    zatrzymalo ani jego, ani jego pracy.'
  the_intruder: 'Raz ktos probowal wtargnac do laboratorium. Glowa tego czlowieka jest dzis
    uzywana na warsztatach z optyki - tyl czaszki zastapiono szklem, zeby obserwowac
    pobudzone nerwy. Trofeum stoi w obiegu dydaktycznym, nie w ukryciu.'
  reading_by_seraphine: 'Czlowiek, ktoremu Lucan zamierza wlozyc do reki gotowy okaz, wygral
    z Inkwizycja dwa razy i trzyma dowod na warsztatach. To nie jest naiwny, gubiacy watek
    akademik - to sojusznik znacznie mocniejszy i znacznie grozniejszy, niz zakladala.'

source_refs: [source_user_decisions_current#background:family-fiancee-and-education-sabotage-revealed]
