role: Portier w portierni przy bramie Akademii Magii Lumarii - stanowisko nowe od
  czasów studiów Lucana. Prowadzi księgę odwiedzin i przypina obwieszczenia.
faction_ref: campaigns/lucan/entities/factions/lumaria-magical-academy.yaml
current_location_id: loc_lumaria_magical_academy
