schema_version: 1
id: npc_academy_dean
name: Kalem Drost, dziekan
status: active
importance: administrative_gatekeeper_of_lucans_membership_and_discipline
role: Dziekan wydzialu, przy ktorym Lucan ma katedre. Administruje czlonkostwem,
  urlopami, procedura dyscyplinarna i obsada seminariow oraz otwartych disput.
  Stoi PONIZEJ rektora i to jest cala jego sytuacja.
faction_ref: campaigns/lucan/entities/factions/lumaria-magical-academy.yaml
current_location_id: loc_lumaria_magical_academy
current_zone_id: zone_academy_main_court
lifecycle: {state: alive_confirmed, last_confirmed_event_id: event_turn_interlude_169}
name_status: 'Imie i nazwisko wprowadzone przez narratora w t_169, bo dziekan jest
  osoba, ktora Lucan zna z nazwiska od lat - postac bez imienia byla nie do
  rozegrania w dialogu. Gracz moze nadpisac bez retconu.'
portrayal:
  tone: uprzejmosc_jako_tarcza_nie_jako_cieplo
  register: |
    Mowi strona bierna i rzeczownikiem proceduralnym. Unika pierwszej osoby przy
    decyzjach: nie "nie zgadzam sie", tylko "nie widze tu podstawy", "to nie jest
    pozycja, ktora wydzial obsadza", "sprawa nie ma u nas biegu". Zadaje pytania,
    ktorych jedynym celem jest to, zeby ZDANIE NALEZALO DO ROZMOWCY. Nie robi
    blyskotliwych przeciw-odczytow - robi przekierowania.
  traits:
    - Jego rzemioslem jest JURYSDYKCJA, a jurysdykcje sie ODDAJE. Dwadziescia lat
      uczyl sie, ktorych zdan nie da sie zacytowac przeciw niemu, i to jest cala
      jego kompetencja. Nie jest tepy - jest wyszkolony w jedna strone.
    - Nie zapisuje niczego, czego nie musi. Papier jest dla niego zagrozeniem, nie
      narzedziem - odwrotnie niz dla Neris.
    - NIE JEST MADRZEJSZY OD LUCANA Z URZEDU. Wolno mu nie zauwazyc wlasnej
      ekspozycji, przecenic bezpieczenstwo swojego biura i zapytac o rzecz, ktora
      sam ma w segregatorze.
    - Pamieta doklandie, co podpisal dwa lata temu, i nie jest z tym wygodnie.
      Nie przyzna tego, dopoki ktos nie postawi tego na stole.
  what_he_wants_from_this_conversation: |
    Zeby ta sprawa NIE BYLA JEGO. Przyszedl czlonek wydzialu z czyms, co pachnie
    Kosciolem, gildia i cmentarzem naraz - dziekan chce uslyszec jedno zdanie,
    ktore pozwoli mu to odeslac: do rektora, do gildii jako pracodawcy, do
    profesora Veyra jako ojca, do kogokolwiek. Pierwszy ruch to ZAWSZE
    przekierowanie, nie odmowa.
  what_he_refuses: |
    (a) Cokolwiek na pismie. (b) Nazwanie statusu Lucana - nie powie ani "czlonek w
    dobrej pozycji", ani "zawieszony", bo oba zdania da sie zacytowac za czternascie
    dni. Bedzie mowil o urlopie w trzeciej osobie, jakby zastal go w aktach.
  what_he_can_lose: |
    Posade, i to szybciej niz ktokolwiek inny w budynku. Otwarta dysputa jest etapem
    obsadzania wladzy Akademii (factions/lumaria-magical-academy.yaml#leadership):
    jesli rektorat przejdzie do proreligijnego konserwatysty - a to jest zaplata
    Kolma - pierwszym sprzatnietym bedzie dziekan, ktory mial administracyjny splot
    ze sprawa o nekromancje. Jest w tej chwili NAJBARDZIEJ EKSPONOWANYM urzednikiem
    wydzialu i moze jeszcze tego nie policzyc.
history_with_lucan:
  the_signature: |
    To jego podpis polozyl Lucana na WYMUSZONYM urlopie dziekanskim ponad dwa lata
    temu. Zrobil to, bo tak chciala GLOWNA LINIA rodu Veyr (retcon_000053 - nie dom
    narzeczonej). Nie byla to jego inicjatywa i nie byla to jego wygrana; byla to
    procedura, ktora ktos inny uruchomil, a on obsluzyl. Lucan to wie. On wie, ze
    Lucan wie.
  the_sinecure: |
    Katedra Lucana to nieplatna synekura, ktorej nikt nie audytuje, bo trzyma ja
    Veyr (event_turn_interlude_031_the_dormant_sinecure). Dwa lata lezala w jego
    ksiegach i nikt nigdy nie zapytal. Wejscie Lucana do gabinetu jest tym papierem
    wracajacym.
knowledge:
  confirmed:
    - fact: Lucan Veyr zjawil sie u niego wieczorem trzeciego dnia, bez zapowiedzi,
        po ponad dwoch latach nieobecnosci.
      source_event_id: event_turn_interlude_169
  suspected: []
  false_beliefs: []
  forbidden_without_event: [lucan_necromancy, spidey_network, varkhen_identity,
    webber_network, guild_basement_cell, cemetery_operation_role]
  not_yet_heard:
    - fact: 'O planowanym pokazie/oddaniu okazow Akademii NIE SLYSZAL. Profesor Veyr
        ma w agendzie mowienie o tym kolegom, ale siedzi w laboratorium i jeszcze
        tego nie zrobil. Lucan jest pierwszy - o wlos.'
      source_event_id: event_turn_interlude_169
    - fact: 'Zmyslona rama z t_161 - ze to ON grzecznie prosil Lucana o zdystansowanie
        sie od sprawy cmentarnej - jest dla niego CALKOWICIE NOWA. Nigdy tego nie
        powiedzial. Jesli Lucan poda mu ta rame, dziekan dostaje gotowa historie,
        w ktorej JUZ zachowal sie prawidlowo, i to jest dla czlowieka o tym profilu
        prezent, nie zagrozenie.'
      source_event_id: event_turn_interlude_169
agenda:
  current_goal: Obsadzic otwarta dysputa za czternascie dni tak, zeby nie bylo
    przy niej jego nazwiska w zadnym zdaniu, ktore mozna zacytowac.
  next_action: Nie ma wlasnego ruchu wobec Lucana. Reaguje.
  jurisdiction_he_holds:
    - czlonkostwo i urlop dziekanski Lucana
    - procedura dyscyplinarna wydzialu wobec czlonka
    - forma wezwania na seminarium (papier wychodzi z jego biura)
    - obsada otwartej disputy Aldhen kontra Kolm
relationships:
  - {id: npc_ivar_kolm, nature: przelozony_faktyczny_ryzyko, note: Kolm gra o rektorat;
     dziekan jest tym, kogo nowy rektor sprzatnie pierwszego.}
  - {id: npc_neris_aldhen, nature: czlonek_wydzialu_do_obsadzenia_w_dyspucie}
  - {id: npc_lucan_father, nature: czlonek_wydzialu_niesterowalny, note: Profesor Veyr
     nie jest strona i nie da sie nim administrowac - patrz npcs/lucan-father.yaml#not_a_party.}
