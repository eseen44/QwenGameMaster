the_dispute_is_thrown:
  source_event_id: event_turn_interlude_137b
  declared_by: player_as_world_canon
  text: 'PRZELOZENI KOLMA W TEJ DYSPUCIE TO NIE TYLKO MAGOWIE - TO KOSCIOL, i to ONI
    zdecydowali, ze wygra Neris Aldhen. Kolm prowadzi strone, ktora ma przegrac.
    Spojnosc z plikami: waska definicja to doslownie stanowisko Kosciola
    (necromancy-law.yaml#church_position.tendency, lumaria-church.yaml
    necromantic_animal_or_vermin_modification), a jednoczesnie jest to
    restrictive_precedent, ktorego Akademia sie boi - nikt osadzony nie bierze linii
    podcinajacej wlasna katedre, chyba ze odpowiada przed kims spoza instytucji.
    MOTYW KOSCIOLA: wygrana szerokiej definicji wtlacza hybrydy do kategorii konstruktu,
    czyli do szarej strefy, a szara strefa oznacza, ze PRZESTAJE SIE ROZPATRYWAC SKARGI
    (de_facto_liberalisation_mechanism). Kosciol nie przegrywa argumentu - kupuje za niego
    likwidacje forum, bo poza forum srodek zaradczy zmienia rece z papieru na ludzi.
    Precedens: ojca Lucana potepiono dwa razy, a potem ktos przyszedl do laboratorium
    osobiscie.'
  known_to_kolm: 'ROZSTRZYGNIETE (event_turn_interlude_140, declared_by player_as_world_canon):
    WIE. Nie jest prowadzony w ciemno - jest oplacony wynikiem.'
the_price_of_kolm:
  source_event_id: event_turn_interlude_140
  declared_by: player_as_world_canon
  text: 'CZLOWIEK, KTORY NISZCZY WLASNY TEMAT, NIE ZAMIERZA JUZ O NIM PUBLIKOWAC.
    Waska definicja, gdyby wygrala, podcina golemy, homunkulusy, protezy i chowance,
    czyli wlasna katedre Kolma - a on jest starszy i osadzony. Nikt takiej linii nie
    bierze dla dorobku. Bierze sie ja, kiedy przyszlosc lezy w ADMINISTRACJI, nie w
    dorobku. Zaplata Kolma to REKTORAT. Mechanizm: po zatrzymaniu wojenki (albo po
    zamieszkach) wladze beda otwarte na zdjecie rektora "ktory do tego doprowadzil",
    a wtedy potrzebny jest nastepca proreligijny i konserwatywny, ktory publicznie stal
    po waskiej stronie. Kolm jest tym kandydatem i dlatego stoi tam, gdzie stoi.'
  the_operational_consequence: 'JESLI KOLM JEST OPLACONY WYNIKIEM, A NIE ARGUMENTEM, TO
    POTRZEBUJE PRZEGRANEJ ODPOWIEDNIO GLOSNEJ. Wygrana moderowana zamowienia nie realizuje.
    W chwili, w ktorej Kolm zauwazy, ze Neris Aldhen nie jest tak krwiozercza, jak miala
    byc, jego wlasny interes kaze mu PODLOZYC SIE SAMEMU - i zrobic to teatralnie, bo
    o teatr wlasnie chodzi. Skutek dla planu Lucana: samo zwezenie zdania nie wystarcza,
    bo druga strona pulpitu potrafi wyprodukowac pretekst bez udzialu Neris.'
  the_textual_tell:
    source_event_id: event_turn_interlude_140
    read_by: npc_neris_aldhen
    text: 'Weryfikacja po jej stronie, wlasnym narzedziem: odbitka Kolma nie ma jezyka
      programowego, nie zapowiada dalszej pracy i nie odsyla ani razu do jego wlasnego
      dorobku. Aparat czlowieka, ktory temat ZAMYKA, nie otwiera. Teza przeszla.'
the_act_01_thread:
  status: KIERUNEK_ZATWIERDZONY_PRZEZ_GRACZA_MECHANIZM_OTWARTY
  source_event_id: player_ruling_2026_08_27
  declared: 'Gracz 2026-08-27: "dociagniecie aktu pierwszego do Kolma albo jego pracowni
    jest zreczne. podoba mi sie i daje ladnego end bossa."'
  co_zostalo_zatwierdzone: |
    (a) Watek Aktu 1 - nielegalna hodowla okazow pod garbarnia - LACZY SIE z Kolmem albo
    z jego pracownia. (b) Kolm jest END BOSSEM Aktu 3.
  co_jest_JESZCZE_OTWARTE: |
    Czy chodzi o Kolma OSOBISCIE, czy o jego pracownie/uczniow. Czym byl dla niego
    poprzedni wlasciciel garbarni: dostawca, wspolnikiem, przykrywka czy poprzednikiem.
    Czy Kolm WIE, ze papiery z Komory III istnieja i ze ktos je ma. Nie rozstrzygac za
    gracza - to sa cztery rozne kampanie.
  najmocniejszy_odczyt_z_istniejacych_plikow:
    status: 'ODCZYT, nie ustalenie. Podany, bo skladajac istniejace pliki wychodzi sam.'
    text: |
      Karta Kolma juz mowi, ze publicznie trzyma waska definicje, ktora podcielaby jego
      WLASNA katedre biomutantow, i ze zaplata jest rektorat. To wyjasnia, dlaczego stoi
      tam, gdzie stoi - ale nie wyjasnia, dlaczego godzi sie zniszczyc wlasny temat, a nie
      tylko go odlozyc. Watek Aktu 1 dokleja brakujacy motyw OSOBISTY: czlowiek, ktory ma
      w przeszlosci nielegalna hodowle, nie chce dobrego prawa dla hybryd - chce, zeby ta
      kategoria PRZESTALA BYC ROZPATRYWANA. Jego wlasna karta opisuje juz dokladnie ten
      mechanizm od strony Kosciola: hybrydy w szarej strefie znacza, ze
      "PRZESTAJE SIE ROZPATRYWAC SKARGI" (the_dispute_is_thrown,
      de_facto_liberalisation_mechanism). Stara sprawa spod garbarni w takim ukladzie
      przestaje byc scigalna.
    the_second_function_of_his_theatrical_loss: |
      Karta mowi, ze Kolm potrzebuje przegranej ODPOWIEDNIO GLOSNEJ i ze podlozy sie sam,
      teatralnie. Jesli ma wlasna stara sprawe do zakopania, ten teatr zyskuje druga
      funkcje: nie tylko realizuje zamowienie Kosciola, ale i domyka kategorie, w ktorej
      lezy jego wlasna przeszlosc. Nie trzeba tego dopisywac do fikcji - wystarczy, ze
      narrator o tym wie i nie napisze Kolma jako czystego karierowicza.
  gdzie_leza_dowody_i_dlaczego_to_wazne: |
    LUCAN TRZYMA JEDYNY ZNANY ZBIOR DOWODOW na te hodowle - item_tannery_owner_cache w
    zone_wall_void baszty: rejestr rachunkowy z symbolem poprzednika, tabliczka
    "KOMORA III - DOSTEP TECHNICZNY", notatki o niestabilnych okazach i karmieniu po
    zamknieciu sluzy, umowy dostaw, pieczec poprzednika. Do tego item_three_arrow_deer_signet,
    ktorego herb jest lacznikiem miedzy dwoma wlascicielami (retcon_000057).
    STRUKTURALNIE: Lucan ma dzwignie na end bossa, KTORY NIE WIE, ZE LUCAN ISTNIEJE
    (forbidden_without_event: lucans_identity_at_all). Nie odbierac mu tej pozycji przez
    przypadkowe ujawnienie i nie dawac Kolmowi wiedzy bez zdarzenia.
  co_to_zmienia_w_dyspucie: |
    Nic natychmiast, i to jest wazne. Dysputa nadal jest za czternascie dni, Kolm nadal
    nie wie o Lucanie, a Neris nadal ma wygrac waska wygrana. Zmienia sie STAWKA CZYTANIA:
    kazda linia, ktora Lucan wspolpisze i ktora wypycha hybrydy do szarej strefy,
    pracuje takze dla Kolma. Warunek nadrzedny z t_168 (zakaz trywializowania nekromancji
    na ludziach i bezczeszczenia zwlok) tego NIE dotyka - hodowla okazow nie jest
    nekromancja na ludziach. Luka jest wiec realna i zamierzona przez Lucana z innego
    powodu.
  do_not_invent:
    - 'Pracowni Kolma jako lokacji - nie ma jej w zadnym pliku. Kanon mowi "katedra", nie
       "pracownia". Jesli ma powstac, powstaje decyzja gracza.'
    - 'Nazwiska z herbu jelenia. Wychodzi z researchu heraldycznego, nie z zalozenia.'
    - 'Wiedzy Kolma o Lucanie, o Spideyu i o papierach. Zero, dopoki nie bedzie zdarzenia.'

