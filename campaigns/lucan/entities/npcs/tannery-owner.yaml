schema_version: 1
id: npc_tannery_owner
name: Właściciel garbarni (nazwisko znane Lucanowi, nieustalone w zapisie)
status: active
importance: act_01_creditor_and_victim_of_lucan_at_large_case_still_open
role: Właściciel garbarni i podziemi pod nią. Zatrudnił Lucana przez gildię do
  eksploracji podziemi. Był w areszcie miejskim, WYSZEDŁ.
current_location_id: loc_lumaria
current_zone_id: unknown
location_note: 'NA WOLNOSCI od event_turn_interlude_032. Dokladne miejsce pobytu
  nieustalone; loc_lumaria to miasto jako calosc. Areszt, w ktorym siedzial, byl przy
  ZACHODNIEJ STRAZNICY i nie jest to areszt gildii.'
lifecycle: {state: alive_confirmed, last_confirmed_event_id: event_act_02_closeout_interlude_import}
name_status: |
  Zrodlo Aktu 1 nigdy nie podaje jego nazwiska w tekscie, ALE Lucan je zna: dokument
  herbowy znaleziony przy szabli "wymienia jego nazwisko oraz wczesniejszego posiadacza
  szabli". Zapisywac jako znane postaci, nieustalone dla nas. Gracz moze nazwac bez retconu.

portrayal:
  tone: 'twardy pracodawca, ktory nagle stracil grunt - nie zbir i nie arystokrata w salonie'
  register: |
    Mowi krotko i z pozycji kogos, kto place. "Za duzo myslisz, Veyr." Nie tlumaczy sie,
    nie prosi, wzdycha i przechodzi do rzeczy. Nie jest to czlowiek doktryny ani polityki -
    jest to czlowiek INTERESU, ktory ma cos do ukrycia i wie, ile to warte.
  the_incongruity: |
    NAJWAZNIEJSZA RZECZ W TEJ KARCIE. Na garbarza mial stanowczo za duzo: ceremonialna
    szable "kompletnie niepasujaca do garbarza", dokument z HERBEM i wlasnym nazwiskiem,
    zapasowy sygnet w mieszkaniu i DWA kolejne sygnety w skrytce, akty wlasnosci, weksle,
    klejnoty, cienki zloty lancuszek. Cztery sygnety i herb. Kim on wiec jest naprawde -
    NIEUSTALONE i wlasnie to jest ciekawe.
  what_he_wants: |
    Zdjac z siebie sprawe i odzyskac to, co miasto zamrozilo. Sprawa jest FORMALNIE OTWARTA,
    wiec nie jest wolny - jest na zewnatrz. Wszystko inne jest wobec tego wtorne, lacznie
    z Lucanem.
  what_he_refuses: |
    Powiedziec, po co chcial papiery poprzednika. Zlecenie bylo sformulowane tak, zeby nie
    trzeba tego mowic ("przynosisz je najpierw mnie" - zanim zobaczy je miasto).
  what_he_can_lose: 'Zaklad, majatek i wolnosc. Czesc juz stracil.'

current_situation:
  status_corrected: 'retcon_000058, 2026-08-27. Karta mowila "SIEDZI" - bylo to
    NIEAKTUALNE. Seraphine powiedziala Lucanowi wprost, ze wlasciciel wyszedl.'
  released:
    source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed
    told_by: npc_seraphine_vale
    text: 'Wlasciciel WYSZEDL - za poreczeniem albo po prostu z braku kogokolwiek, kto by
      sprawe prowadzil. Sprawa garbarnika jest FORMALNIE OTWARTA.'
  the_lever_seraphine_handed_over: |
    Przy tej samej okazji Seraphine dala Lucanowi dzwignie, ktorej nie uzyl: DOM
    PRZYPISANY DO OTWARTEGO POSTEPOWANIA MOZNA LEGALNIE PRZESZUKAC Z NAKAZEM. Sprawa jest
    otwarta, wiec droga stoi otworem do dzis.
  earlier_detention_history: |
    Wczesniej: areszt miejski przy zachodniej straznicy, sledczy przesluchiwali go od
    poprzedniego dnia, miasto zamrozilo CZESC MAJATKU, garbarnie prowadzil tymczasowo
    brygadzista, podziemia zabezpieczone przez ekipe A-rank gildii. To jest HISTORIA,
    nie stan biezacy. Czy majatek nadal jest zamrozony i czy brygadzista nadal prowadzi
    zaklad - NIEUSTALONE.
  why_he_was_detained: |
    Lucan przekazal Seraphine dokumenty dowodzace, ze wlasciciel WCZESNIEJ ZNAL SKALE
    ZAGROZENIA i probowal zlecic zniszczenie sladow (milestone_022_owner_exposed_and_detained,
    fact_seraphine_received_tannery_evidence). Czyli to Lucan go wsadzil - papierami,
    ktore mial przyniesc jemu.

# ---------------------------------------------------------------------------
what_lucan_did_to_him:
  the_unpaid_job: 'Zatrudnil Lucana przez gildie i obiecal mu pieniadze OSOBNO, poza premia
    gildii. Nie zaplacil - wpadl wczesniej.'
  the_undelivered_papers: |
    Kazal przynosic wszystko z nazwiskiem poprzednika NAJPIERW SOBIE. Lucan nie dostarczyl:
    wzial papiery i swiadomie postanowil nie wracac ani nie spotykac pracodawcy.
  the_lodging: |
    Lucan obrabowal jego MIESZKANIE: osobiste papiery, zapasowy sygnet, 9 srebra, woreczek
    z trzema kamieniami szlachetnymi, dwa komplety ubran, ciezki plaszcz, pas z sakiewka,
    metalowa szkatulke i pakiet starych listow. Zamknal pokoj na klucz I ZATRZYMAL KLUCZ.
  the_vault: |
    Lucan obrabowal jego SKRYTKE - zelazne drzwiczki w podlodze tylnego magazynku, otwarte
    JEGO WLASNYM pekiem kluczy. Wynios: dwie kasetki z monetami (druga wylamana lomem:
    18 srebra, DWA SYGNETY, pakiet dokumentow, zloty lancuszek), pakiet klejnotow, AKTY
    WLASNOSCI, WEKSLE i drewniany futeral z ceremonialna szabla oraz dokumentem herbowym.
  the_seal: 'Zabral z biurka jego SREBRNA PIECZEC. Lucan sam nazwal ja "dowodem zbrodni".'
  the_keys: 'NADAL MA pek kluczy zakladu i podziemi, klucz "III", klucz do mieszkania oraz
    maly zbyt porzadny kluczyk z kieszeni jego plaszcza (do czego pasuje - nieustalone).'

exposure:
  who_he_would_suspect: |
    Lucan jest naturalnym kandydatem - skrytke otwarto jego wlasnymi kluczami, danymi
    jednemu czlowiekowi, ktory potem zniknal. ALE JEST TO PODEJRZENIE, NIE WIEDZA, i nie
    zamienia sie w wiedze samo z siebie.
  co_on_realnie_wie: |
    Ze rzeczy znikly i ze ktos je zabral. NIE WIE co dokladnie ani kto
    (inventory#item_three_arrow_deer_signet.if_it_surfaces.nobody_has_a_list). Nie ma
    spisu do porownania - poprzednia wersja tej karty budowala hak z "audytu majatku
    kontra spis przekazanych rzeczy". Takich list w kanonie nie ma; usuniete
    retconem 000058. NIE ODBUDOWYWAC.
  co_lucan_moze_powiedziec: |
    Stojac przed nim ma wolny wybor wersji - ze przedmiot jest z gildii, albo ze go
    znalazl. Obie sa nieweryfikowalne.
  what_he_does_NOT_have: |
    NIE MA nic na nekromancje Lucana. NIKT W AKCIE 1 NIE WIDZIAL SPIDEYA - a juz na pewno
    nikt, kto przezyl (kalibracja gracza 2026-08-27). Spidey dzialal wylacznie skrycie:
    szczelinami, rowem odplywowym, po dachach garbarni, na czatach. Widzial wiec robotnika
    E-rank, ktory zszedl w podziemia i zniknal - nie nekromante.
  the_claim_cuts_both_ways: |
    Roszczenie zlozone przez Lucana jest dowodem, ze Lucan tam byl i mial dostep. Zrodlo
    nazywa to wprost: "im dokladniej opiszesz zlecenie, tym bardziej wychodzi, ze mialies
    niszczyc dowody". Dlatego wniosek opisuje eksploracje i zabezpieczenie zagrozenia,
    a nie tresc zlecenia.

knowledge:
  confirmed:
    - fact: 'Zna Lucana z nazwiska i z twarzy - "Veyr. Znowu ty." Podal mu reke publicznie,
        przy inspektorze i ekipie.'
      source_event_id: event_act_02_closeout_interlude_import
    - fact: 'Wie, ze wyslal Lucana w podziemia po papiery poprzednika i ze Lucan nie wrocil
        z niczym.'
      source_event_id: event_act_02_closeout_interlude_import
  suspected:
    - 'Ze to Lucan obrobil skrytke i mieszkanie. Nie potwierdzone zdarzeniem, ale nie ma
       innego kandydata.'
  false_beliefs: []
  forbidden_without_event: [lucan_necromancy, spidey_network, varkhen_identity,
    webber_network, guild_basement_cell, cemetery_operation_role, academy_affiliation]

relationships:
  - {id: npc_boros_keld, nature: znany_z_tej_samej_roboty, note: Boros i Mara zlozyli raport
     po katastrofie.}
  - {id: pc_lucan, nature: dluznik_i_ofiara_jednoczesnie, ref: campaigns/lucan/entities/npcs/tannery-owner.yaml}

do_not_invent:
  - 'Nazwiska, herbu, rodu ani zwiazku z poprzednim wlascicielem - patrz
     planning/act-03-anticipated-shape.yaml#watek_garbarni_dwaj_wlasciciele.'
  - 'Haka z porownywania spisow. Nie ma zadnych spisow - patrz #exposure.co_on_realnie_wie
     oraz retcon_000058. Trzeci raz w jednej sesji ten sam tryb awarii.'
  - 'Tego, ze szuka Lucana. Ma na glowie otwarte postepowanie i zamrozony majatek.'
  - 'Zadnej wiedzy o nekromancji, Spideyu ani sieci.'

