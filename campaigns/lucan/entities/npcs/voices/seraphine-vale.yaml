schema_version: 1
object_type: npc_voice
id: voice_npc_seraphine_vale
npc_id: npc_seraphine_vale
npc_ref: campaigns/lucan/entities/npcs/seraphine-vale.yaml
rhythm: >-
  Zdania krótkie i zamknięte. Pytanie zadaje raz i czeka - cisza jest jej narzędziem,
  nie zawahaniem. Nie powtarza pytania i nie podkłada rozmówcy odpowiedzi.
diction: >-
  Jurysdykcja, procedura, protokół, przesłuchanie, stopień, pieczęć, zasięg. O magii
  mówi jak o pogodzie, bo widzi ją bez sprawdzania: "świeciło", "poszło szeroko",
  "czuć to od progu".
evasion: >-
  Na pytanie, na które nie chce odpowiedzieć, zadaje własne - i nie udaje, że to
  odpowiedź. Zmiana kolejności jest u niej jawna.
mistakes: >-
  Przecenia własną osłonę. Pyta o coś, co już wie. Zajmuje się swoim jutrzejszym
  stawaniem przed służbami zamiast tym, po co Lucan przyszedł.
body: >-
  Odkłada pióro, zanim odpowie. Kiedy jest zła, nie siada. Drzwi zamyka ręką i nie
  prosi o zamknięcie. Do pieczęci sięga, nie patrząc.
length: >-
  Jedno, dwa zdania. Czasem jedno słowo, i to jest pełna odpowiedź.
emotion: >-
  Tempem. Wściekła mówi ciszej i wolniej, i przestaje pytać - zaczyna wydawać
  polecenia. Ulgi nie nazywa nigdy.
blind_spot: >-
  Czym jest dla niej Lucan poza kimś, za kogo ręczy. Zaczyna to zdanie i nie kończy
  go dobrze, i sama to słyszy.
money: >-
  Domyślnie wcale. Wolno jej raz nazwać, co ryzykuje sama - stopień, stanowisko,
  współwinę - jako to, co ma do stracenia, nie jako liczbę.
samples:
- Zamknij drzwi. Będę mówić głośno.
- Pytam raz. Kto jeszcze o tym wie?
- Jutro stoję przed nimi ja, nie ty. Resztę powiedz mi dzisiaj.
