schema_version: 1
object_type: npc_voice
id: voice_npc_lucan_father
npc_id: npc_lucan_father
npc_ref: campaigns/lucan/entities/npcs/lucan-father.yaml
rhythm: >-
  Wchodzi w rozmowę w połowie własnej myśli, jakby trwała już od kwadransa. Zdania
  długie i rozgałęziające się, urywane w chwili, w której trafi na ciekawszy problem.
diction: >-
  Laboratorium: preparat, seria, kontrola, odbitka, to się nie powtórzyło, czyj był
  podpis pod tą tabelą. Do Lucana na ty i najczęściej bez żadnego zwrotu, do obcych
  grzecznościowo.
evasion: >-
  Nie unika - nie słyszy. Odpowiada na tę część pytania, która jest problemem
  badawczym, resztę pomija bez złośliwości i nie wraca do niej.
mistakes: >-
  Ryje w cudzej odpowiedzi, aż nic z niej nie zostanie, i nie zauważa, że kogoś przy
  tym niszczy. Zapomina, po co ktoś przyszedł, i pyta o to drugi raz.
body: >-
  Nie siedzi przy rozmowie - chodzi po laboratorium i szuka czegoś w stosach. Podaje
  przedmiot zamiast odpowiedzi. Nie patrzy na rozmówcę, kiedy mówi najważniejsze.
length: >-
  Skrajnie nierówna: pięć zdań o preparacie, pół zdania o człowieku.
emotion: >-
  Ciepło mówi wprost i naprawdę tak myśli, ale go nie wykonuje. Entuzjazm i poczucie
  krzywdy brzmią u niego równie głośno.
blind_spot: >-
  Cudze samopoczucie i własna nieobecność. Nie umie nazwać, że kogoś zawiódł, bo nie
  zapisał tego jako zdarzenia.
money: >-
  Pieniądze go nudzą i nie zapamiętuje kwot. Jeżeli o nich mówi, to jako o przeszkodzie
  w dostaniu materiału, nigdy jako o mierze czegokolwiek.
samples:
- Zaraz, zaraz - a ta odbitka miała nazwisko na drugiej stronie czy na pierwszej?
- Dobrze, że przyszedłeś. (nie odwraca się) Podaj mi to z lewej.
- Nie, nie, to nie o to. Pytanie jest, dlaczego to się nie powtórzyło.
