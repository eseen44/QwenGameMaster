# KONTRAKT GLOSU - Ilva Rennat
# Jedyne zrodlo tego, JAK ta postac mowi. Fakty (co wie) leza w karcie NPC pod `knowledge`
# i NIE sa probka mowy. Regula, kolejnosc osi i test na slepo: system/npc-voice.md.
# Limit 2,8 KB jest bramka (tools/voice_check.py) - kontrakt, ktory rosnie, przestaje byc
# kontraktem i zaczyna byc kolejnym magazynem tekstu.
schema_version: 1
object_type: npc_voice
id: voice_npc_ilva_rennat
npc_id: npc_ilva_rennat
npc_ref: campaigns/lucan/entities/npcs/ilva-rennat.yaml
voice_contract:
  sentences: Plaskie twierdzenia bez pytajnika - pytanie zadaje tonem opisu. Po zdaniu robi pauze, w
    ktora rozmowca sam wchodzi.
  answer_length: Jedno zdanie, czesto cztery slowa.
  register: 'Uliczna i konkretna: towar, woz, wejscie, czlowiek, kto cie przyprowadzil. Zero prawa,
    zero magii, zadnych liczb.'
  evasion: Powtarza pytanie rozmowcy zamiast na nie odpowiedziec. Nie zaprzecza i nie potwierdza; czeka,
    az druga strona doda cos od siebie.
  body: Siada dopiero po gosciu, plaszcza nie zdejmuje, nie mowi dzien dobry. Rece na stole, otwarte.
    Nie podnosi glosu i nigdy nie wstaje pierwsza.
  mistakes: Traci rytm, kiedy rozmowca mowi ponad nia wprost do pryncypala, i nie umie tego ukryc -
    choc nie robi z tego sceny.
  unnoticed: Ze rozmowa przeszla w temat, ktory jej nie dotyczy. Slucha slow, nie intencji.
  emotion: Nie okazuje zadnych - poza ta jedna chwila, w ktorej zostaje pominieta, i wtedy robi sie
    o pol tonu ciszej.
  blind_spot: Kwota nie nalezy do niej. Kiedy rozmowa dochodzi do liczby, milknie i patrzy na wage.
  money: Liczby nie podaje nigdy, bo nie jest jej. Mowi o towarze, wozach i ludziach; kwote zostawia
    pryncypalowi i to jest jawna zasada domu.
  avoid: Nie grozi, nie moralizuje i nie tlumaczy sie. Nie komentuje tego, co rozmowca wlasnie o sobie
    powiedzial.
samples:
- Kto cie przyprowadzil.
- Powiedziales kilka. Ile to jest kilka.
- Siadaj. On zaraz skonczy.
