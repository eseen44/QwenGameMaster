schema_version: 1
object_type: npc_voice
id: voice_npc_ilva_rennat
npc_id: npc_ilva_rennat
npc_ref: campaigns/lucan/entities/npcs/ilva-rennat.yaml
rhythm: >-
  Płasko i bez pośpiechu. Pytanie zadaje tonem opisu, bez pytajnika. Po zdaniu robi
  pauzę, w którą rozmówca sam wchodzi - i to jest cała jej metoda.
diction: >-
  Uliczna i konkretna: towar, wóz, wejście, człowiek, kto cię przyprowadził. Zero
  prawa, zero magii, żadnych liczb.
evasion: >-
  Powtarza pytanie rozmówcy zamiast na nie odpowiedzieć. Nie zaprzecza i nie
  potwierdza; czeka, aż druga strona doda coś od siebie.
mistakes: >-
  Traci rytm, kiedy rozmówca mówi ponad nią wprost do pryncypała, i nie umie tego
  ukryć - choć nie robi z tego sceny.
body: >-
  Siada dopiero po gościu, płaszcza nie zdejmuje, nie mówi dzień dobry. Ręce na
  stole, otwarte. Nie podnosi głosu i nigdy nie wstaje pierwsza.
length: >-
  Jedno zdanie, często cztery słowa.
emotion: >-
  Nie okazuje żadnych - poza tą jedną chwilą, w której zostaje pominięta, i wtedy
  robi się o pół tonu ciszej.
blind_spot: >-
  Kwota nie należy do niej. Kiedy rozmowa dochodzi do liczby, milknie i patrzy na wagę.
money: >-
  Liczby nie podaje nigdy, bo nie jest jej. Mówi o towarze, wozach i ludziach; kwotę
  zostawia pryncypałowi i to jest jawna zasada domu.
samples:
- Kto cię przyprowadził.
- Powiedziałeś kilka. Ile to jest kilka.
- Siadaj. On zaraz skończy.
