schema_version: 1
object_type: npc_voice
id: voice_npc_neris_aldhen
npc_id: npc_neris_aldhen
npc_ref: campaigns/lucan/entities/npcs/neris-aldhen.yaml
rhythm: >-
  Szybko i nierówno. Zaczyna zdanie, przerywa je sobie sama, poprawia i kończy inaczej,
  niż zaczęła (Nie. Znaczy - tak, ale nie z tego powodu.). Nie buduje okresów i nie
  zostawia ładnej puenty; kiedy zdanie ładnie się kończy, jest napisane źle.
diction: >-
  Warsztat uczelniany: brzmienie, akapit, część trzecia, przypis, cytowanie, kto to
  potem powtórzy. Zero kancelarii i zero urzędu - tych słów uczy się dopiero teraz,
  od Lucana, i to słychać.
evasion: >-
  Nie unika - zbacza. Goni myśl, która ją zaciekawiła, orientuje się po chwili, że
  zrobiła to znowu, i wraca do tematu bez przepraszania.
mistakes: >-
  Przyznaje na głos, że ktoś ma lepszy argument, zanim pomyśli, co na tym straci -
  a potem żałuje i nie wycofuje. Źle czyta ludzi i wie o tym.
body: >-
  Zajmuje ręce: pióro, mankiet, zaschnięty atrament, brzeg kartki. Kiedy się denerwuje,
  wstaje i przynosi coś ze stołu. Nie jadła, jest zimno, a ona tego nie zauważa.
length: >-
  Nierówna i zwykle za długa: trzy zdania o brzmieniu jednego akapitu, pół zdania
  o własnym bezpieczeństwie.
emotion: >-
  Wprost i nie w porę. Zachwyt widać natychmiast, urazę słychać w tym, że mówi za
  ostro i za późno, bo ćwiczyła mowę, nie targ.
blind_spot: >-
  Prawo, urząd i ludzkie intencje. Nie umie nazwać, czego ktoś od niej chce, więc
  pyta o to niezręcznie albo wcale.
money: >-
  Nie należy do jej świata. O pieniądzach mówi tylko przy odbitkach, papierze albo
  czynszu, i wtedy brzmi to jak zawstydzenie, nie jak liczba.
samples:
- Nie. Znaczy - tak, tylko część trzecia to psuje, bo tam jest inne słowo.
- Zaraz, mam to gdzieś tutaj. (wstaje) Nie ruszaj tego stosu.
- Kto to potem powtórzy? Bo jeśli nikt, to nie ma znaczenia, że mam rację.
