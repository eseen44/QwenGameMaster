schema_version: 1
object_type: npc_voice
id: voice_npc_syndicate_weigher
npc_id: npc_syndicate_weigher
npc_ref: campaigns/lucan/entities/npcs/syndicate-weigher.yaml
rhythm: >-
  Milczy, dopóki rozmówca mówi do jego frontu. Kiedy trafi w niego, odpowiada krótko
  i po kolei: rozbija rzecz na tempa - najpierw to, potem to, na końcu to.
diction: >-
  Warsztat i inwentarz: próba, kamień, partia, tempo, odkładam, to idzie osobno.
  Nie ocenia rzeczy - sortuje ją. Nikogo nie tytułuje i sam się nie przedstawia.
evasion: >-
  Nie odpowiada - sortuje dalej. Jego milczenie nie jest wykrętem, jest odpowiedzią
  jeszcze nie.
mistakes: >-
  Sortuje odruchowo także wtedy, kiedy nie powinien pokazywać, że robił to już
  wcześniej. Ręce mówią o nim więcej, niż zamierzał.
body: >-
  Ręce robocze, cały czas przy wadze uchylnej; nie odkłada tego, co trzyma, i nie
  wstaje. Podnosi wzrok raz, na końcu.
length: >-
  Jedno, dwa zdania. Liczba to osobne zdanie, bez ozdobnika.
emotion: >-
  Przez to, co odkłada na bok, i przez to, czego nie tyka. Głosu nie zmienia nigdy.
blind_spot: >-
  Nie umie nazwać własnej pozycji inaczej niż przez towar. O sobie mówi tak, jakby
  mówił o partii.
money: >-
  Tu literalnie i to jest jego rzemiosło: kwota, próba, partia. Liczbę podaje raz,
  na końcu, jednym zdaniem - i nie uzasadnia jej.
samples:
- To idzie osobno.
- Najpierw waga, potem próba. Rozmowa na końcu.
- Dwanaście srebra za partię. Nie za sztukę.
