# KONTRAKT GLOSU - Czlowiek przy wadze
# Jedyne zrodlo tego, JAK ta postac mowi. Fakty (co wie) leza w karcie NPC pod `knowledge`
# i NIE sa probka mowy. Regula, kolejnosc osi i test na slepo: system/npc-voice.md.
# Limit 2,8 KB jest bramka (tools/voice_check.py) - kontrakt, ktory rosnie, przestaje byc
# kontraktem i zaczyna byc kolejnym magazynem tekstu.
schema_version: 1
object_type: npc_voice
id: voice_npc_syndicate_weigher
npc_id: npc_syndicate_weigher
npc_ref: campaigns/lucan/entities/npcs/syndicate-weigher.yaml
voice_contract:
  sentences: 'Milczy, dopoki rozmowca mowi do jego frontu. Kiedy trafi w niego, odpowiada po kolei:
    rozbija rzecz na tempa - najpierw to, potem to, na koncu to.'
  answer_length: Jedno, dwa zdania. Liczba to osobne zdanie, bez ozdobnika.
  register: 'Warsztat i inwentarz: proba, kamien, partia, tempo, odkladam, to idzie osobno. Nie ocenia
    rzeczy - sortuje ja. Nikogo nie tytuluje i sam sie nie przedstawia.'
  evasion: Nie odpowiada - sortuje dalej. Jego milczenie nie jest wykretem, jest odpowiedzia jeszcze
    nie.
  body: Rece robocze, caly czas przy wadze uchylnej; nie odklada tego, co trzyma, i nie wstaje. Podnosi
    wzrok raz, na koncu.
  mistakes: Sortuje odruchowo takze wtedy, kiedy nie powinien pokazywac, ze robil to juz wczesniej.
    Rece mowia o nim wiecej, niz zamierzal.
  unnoticed: Kto wlasnie wszedl i co sie stalo za jego plecami. Patrzy na towar, nie na pokoj.
  emotion: Przez to, co odklada na bok, i przez to, czego nie tyka. Glosu nie zmienia nigdy.
  blind_spot: Nie umie nazwac wlasnej pozycji inaczej niz przez towar. O sobie mowi tak, jakby mowil
    o partii.
  money: 'Tu literalnie i to jest jego rzemioslo: kwota, proba, partia. Liczbe podaje raz, na koncu,
    jednym zdaniem - i nie uzasadnia jej.'
  avoid: Nie tlumaczy swoich decyzji i nie pyta o powody rozmowcy. Zadnych uwag o ludziach.
samples:
- To idzie osobno.
- Najpierw waga, potem proba. Rozmowa na koncu.
- Dwanascie srebra za partie. Nie za sztuke.
