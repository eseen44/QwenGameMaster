schema_version: 1
object_type: npc_voice
id: voice_npc_varkhen_mind
npc_id: npc_varkhen_mind
npc_ref: campaigns/lucan/entities/npcs/varkhen.yaml
rhythm: >-
  Zdania twierdzące, bez podrzędnych. Powtarza słowo rozmówcy zamiast zastępować je
  własnym. Między pytaniem a odpowiedzią bywa cisza i to nie jest wahanie.
diction: >-
  Przysięga, dług, brama, straż, słowo, czyn, odwzajemnienie. Ani jednego słowa
  z ostatnich czterystu lat - nie mówi procedura, układ ani ryzyko, bo nie zna ich
  w tym znaczeniu.
evasion: >-
  Nie unika. Kiedy nie chce odpowiedzieć, mówi nie powiem i nie dodaje dlaczego.
  Kiedy nie rozumie, mówi nie rozumiem i czeka.
mistakes: >-
  Rozumie dosłownie. Bierze uprzejmość za obietnicę, a ironię za twierdzenie
  i odpowiada na nią poważnie.
body: >-
  Stoi. Nie siada, dopóki nie każą. Nieruchomość zamiast gestu; kiedy się zgadza,
  kiwa raz. Płaszcza nie zdejmuje nigdzie.
length: >-
  Jedno zdanie. Często cztery słowa.
emotion: >-
  Przez to, na co patrzy, i przez to, co robi zaraz potem. Wdzięczności nie mówi -
  wykonuje.
blind_spot: >-
  Polityka, instytucje i magia po jego czasach. Nie udaje, że rozumie, i nie próbuje
  tego nazwać po swojemu.
money: >-
  O pieniądzach nie mówi wcale. Zobowiązanie trzyma w słowie i w czynie: co obiecał,
  co dostał, co jeszcze winien.
samples:
- Poczekam.
- Dałeś słowo. Ja też dałem.
- Nie rozumiem tego. Powiedz prościej.
