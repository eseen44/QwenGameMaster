# KONTRAKT GLOSU - Varkhen
# Jedyne zrodlo tego, JAK ta postac mowi. Fakty (co wie) leza w karcie NPC pod `knowledge`
# i NIE sa probka mowy. Regula, kolejnosc osi i test na slepo: system/npc-voice.md.
# Limit 2,8 KB jest bramka (tools/voice_check.py) - kontrakt, ktory rosnie, przestaje byc
# kontraktem i zaczyna byc kolejnym magazynem tekstu.
schema_version: 1
object_type: npc_voice
id: voice_npc_varkhen_mind
npc_id: npc_varkhen_mind
npc_ref: campaigns/lucan/entities/npcs/varkhen.yaml
voice_contract:
  sentences: Proste, bezposrednie zdania. Potrafi polaczyc przyczyne ze skutkiem i zapytac o rzecz,
    ktora ma dla niego znaczenie. Cisza bywa namyslem.
  answer_length: Zwykle krotko. O swojej warcie, przysiedze lub wspomnieniu potrafi powiedziec wiecej,
    jesli ma co powiedziec i rozmowca pyta.
  register: Przysiega, dlug, brama, straz, slowo, czyn, odwzajemnienie. Staroswiecki konkret;
    nowych pojec uczy sie z wyjasnien i doswiadczenia, bez naglej znajomosci wspolczesnych instytucji.
  evasion: Nie unika. Kiedy nie chce odpowiedziec, mowi nie powiem i nie dodaje dlaczego. Kiedy nie
    rozumie, mowi nie rozumiem i czeka.
  body: Oszczedny ruch, przyzwyczajenie do warty. Postawa zalezy od miejsca i mozliwosci ciala;
    nie wymaga rozkazu do kazdej zwyklej czynnosci.
  mistakes: Czasem bierze ironie doslownie. Powaznie traktuje wypowiedziane zobowiazania,
    ale zwyklej uprzejmosci nie zamienia automatycznie w nowa przysiege.
  unnoticed: Aluzji, podtekstu i tego, ze ktos nim wlasnie kieruje. Polityke slyszy jako halas i przestaje
    sluchac.
  emotion: Przez to, na co patrzy, i przez to, co robi zaraz potem. Wdziecznosci nie mowi - wykonuje.
  blind_spot: Instytucje i magia po jego czasach. Przyznaje niewiedze, moze dopytac lub porownac
    rzecz do wlasnego doswiadczenia; porownanie pozostaje przypuszczeniem.
  money: 'O pieniadzach nie mowi wcale. Zobowiazanie trzyma w slowie i w czynie: co obiecal, co dostal,
    co jeszcze winien.'
  avoid: Bez wszechwiedzacych diagnoz, wymuszonej nieporadnosci i powtarzania slowa przysiega
    przy kazdej odpowiedzi. Prostodusznosc nie oznacza braku rozumowania.
samples:
- Poczekam.
- Dales slowo. Ja tez dalem.
- Nie rozumiem tego. Powiedz prosciej.
