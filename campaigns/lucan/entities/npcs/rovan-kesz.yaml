portrayal:
  temperament: [precise, unsentimental, states_his_position_before_he_has_to]
  appearance: "Po pięćdziesiątce, ubrany jak urzędnik ze średniej półki, teczka, atrament na palcu wskazującym."
  group_role: "Prawnik obiegu przestępczego - ten z pakietu drogi Mary. Zna urzędników magistratu, nie Akademię."
oren_connection:
  status: strong_description_match_not_yet_confirmed_identity
  source_event_id: event_turn_interlude_105b
  established_by: player_worldbuilding_interlude
  claim: "Rysopis Kesza pasuje do czlowieka SPOZA ZALOGI, po spotkaniach z ktorym Oren zmienial trasy wozu ze zwlokami - zeznanie Halveka, event_turn_interlude_048, urwane wtedy na 'na razie nie podaje wiecej'."
  confirmation_route: "npc_halvek_wagonman siedzi w celach gildii (loc_guild_holding_cells) i widzial tego czlowieka. Rozpoznanie przez niego zamienilo by dopasowanie w tozsamosc."
  implication: "Syndykat - albo przynajmniej Kesz osobiscie - JEST w linii transportu cial. Pierwsza teza Lucana z tej rozmowy byla trafna."
  lucan_said_it_out_loud: said_obliquely_as_shared_interest_identity_still_unspoken
  said_out_loud_detail: >-
    event_turn_interlude_199. Lucan powiedzial przy pryncypale, ze jest niewinny dokladnie
    tak samo jak rzeczony prawnik, ktory ma interes w tym, zeby nikt w Strazy ani w gildiach
    nie dokopal sie do JEGO albo JEGO KLIENTOW udzialu w procederze cmentarnym. Nazwal wiec
    EKSPOZYCJE Kesza jako wspolny interes - nie jako oskarzenie i nie jako szantaz.
    CZEGO NIE PADLO: Oren, zeznanie npc_halvek_wagonman z event_turn_interlude_048,
    dopasowanie rysopisu ani zdanie, ze to Kesz jest czlowiekiem, po ktorego spotkaniach
    Oren zmienial trasy. Tozsamosc NADAL niepotwierdzona, confirmation_route przez Halveka
    w loc_guild_holding_cells nietknieta.

standing:
  primary_client: the_syndicate
  is_lucans_lawyer: true
  became_lucans_lawyer_at_event_id: event_turn_interlude_199
  scope_of_representation: >-
    WASKI I TAKI, JAKI PRZYJAL SAM W t_194: GWARANT PROCEDURY, nie obronca. Lucan broni sie
    SAM. Zadanie wg jego wlasnej poprawki zawodowej: nie "niech nazwia przepis", tylko "niech
    to WEJDZIE DO PROTOKOLU" - swiadek milczacy, ktory na koncu zapisuje, ze zadnego przepisu
    nie przywolano. Dotyczy przesluchania kierownictwa gildii i rozmowy ze Straza.
  fee: >-
    ZERO. Pryncypal nie wzial honorarium, bo prawnik stojacy przy Lucanie chroni 40 000 srebra
    jeszcze niewyplaconych, kategorie towaru kupiona pod termin Lucana i szescdziesiat kilo,
    ktore juz przez ten dom przeszlo (fact_weigher_has_a_stake_in_lucan_surviving, t_109).
    Po stronie Lucana nie ma wydanego srebra.
  room_condition: >-
    JEDYNY warunek pryncypala: SYNDYKAT WIDOCZNY, PRYNCYPAL NIENAZWANY. Straz i gildia moga
    wiedziec, ze przy sprawie stoi syndykat - to jest produkt. Nikt nie wymawia jego osoby,
    nie opisuje wagi i nie podaje stolu na targu (agenda#stay_unnamed, jego name_status).
    Warunek nie blokuje planu Lucana, zaweza go o jedno slowo.
  moved_seats: "Po mowie Lucana przesiadl sie po te sama strone stolu (event_turn_interlude_105b) - wobec Lucana przestal byc prawnikiem pokoju i nazwal wspolny problem wprost." 
  declared_at_event_id: event_turn_interlude_104
  declaration: "Powiedział Lucanowi wprost, przy pierwszym kontakcie, że dziś jest prawnikiem tego pokoju i to pokój decyduje, czego Kesz o Lucanie może się dowiedzieć."
  declaration_status: "UNIEWAZNIONA WOBEC LUCANA przez moved_seats (t_105b) - patrz retcon_000124. Nie grac tym polem. Kesz NIE odsyla Lucana do pryncypala po zgode na wlasny udzial; decyduje sam, wazac wlasne ryzyko i interes stalego klienta."
  consequence: "Nic powiedzianego przy nim teraz nie jest objęte tajemnicą zawodową wobec Lucana."
  what_moved_seats_does_not_mean: "NIE zerwal z syndykatem. Pryncypal zostaje jego stalym klientem, a protect_the_room_first zostaje w agendzie. Przesiadka znaczy tyle, ze wobec Lucana rozmawia jako czlowiek z tym samym problemem, nie jako bramka pokoju."
  serves_defence_line: criminal_not_classificatory
  second_matter_2026_09_08:
    event_id: event_turn_interlude_241
    text: >-
      DRUGA SPRAWA, POZA zakresem dwoch pomieszczen i POZA fee ZERO: przejecie garbarni
      (lead_tannery_acquisition_via_bailiff_auction). PIERWSZA, KTORA FINANSUJE SAM LUCAN -
      kwoty nie ustalono, Kesz powiedzial tylko, ze pieniadze sa najmniejsza czescia tego
      rachunku. Warunek postawiony zamiast ceny: POKOJ SIE DOWIE, ze Kesz prowadzi dla
      Lucana sprawe majatkowa. Informuje, nie pyta o zgode, i nie uzaleznil od tego
      przyjecia sprawy. room_condition bez zmian - pryncypal nadal nienazwany.
knowledge:
  confirmed:
    - {fact_id: fact_kesz_knows_lucan_entered_on_teln_vouching, source_event_id: event_turn_interlude_104, claim: "To on zatrzymał rewizję Lucana jednym zdaniem - 'Gość Teln'. Wie zatem, że Lucan wszedł nieprzeszukany i dlaczego."}
    - {fact_id: fact_kesz_knows_lucan_broke_the_body_line_and_holds_the_leverage, source_event_id: event_turn_interlude_105b, claim: "Lucan powiedzial mu, ze gildia zna punkty kontrolne, ma blankiet autoryzacji trasy, ma rysopis i dosc nitek, by spowolnic biznes ze straza i magistratem - i oddal to jako prezent, nie jako szantaz."}
    - {fact_id: fact_kesz_understood_the_category_without_asking, source_event_id: event_turn_interlude_105b, claim: "Nie zapytal, o jakie kategorie towaru chodzi - zapytal o ilosc, czestotliwosc i stan. Obslugiwal logistyke dostarczajaca Orenowi to samo."}
    - {fact_id: fact_kesz_knows_about_the_two_week_deadline, source_event_id: event_turn_interlude_105b, claim: "Lucan zapowiedzial, ze w ciagu dwoch tygodni wywola i rozwiaze w miescie wojne domowa. Kesz przyjal to jako date w kalendarzu i chce wiedziec, po ktorej stronie ma stac jego pokoj."}
    - {fact_id: fact_kesz_knows_lucan_declared_war_on_the_church, source_event_id: event_turn_interlude_110, claim: "Lucan potwierdzil, ze zapowiedziana wojna domowa za dwa tygodnie dotyczy Kosciola."}
    - {fact_id: fact_kesz_holds_lucans_acceptance_of_the_priest_meeting, source_event_id: event_turn_interlude_113, claim: "Lucan przyjal oferte na odchodnym. Kesz organizuje i przysle wiadomosc. Odbil pytanie: KIM Lucan ma tam siedziec - czlonkiem Akademii na urlopie dziekanskim, czlonkiem gildii czy Veyrem. Chce odpowiedzi PRZED spotkaniem."}
    - {fact_id: fact_kesz_has_lucans_answer_all_three_hats_at_once, source_event_id: event_turn_interlude_193, claim: "Pytanie z t_113 ZAMKNIETE po 80 turach. Lucan siada u kaplana jako WSZYSTKIE TRZY naraz: czlonek Akademii na urlopie dziekanskim, czlonek gildii i Veyr. Kesz przyjal i zapisal, nie odradzal. Nazwal cene: trzy instytucje, do ktorych kaplan moze pojsc na skarge, i jednoczesnie trzy, ktore trzeba ruszyc, zanim ktokolwiek Lucana dotknie. Za element realnie zmieniajacy pokoj uwaza VEYRA - dla czlowieka w stule to rodzina, ktora dwa razy wygrala z Inkwizycja."}
    - {fact_id: fact_kesz_named_his_own_exposure_at_the_priest_meeting, source_event_id: event_turn_interlude_193, claim: "Powiedzial zanim musial, ze skoro spotkanie organizuje ON, to wprowadzenie tam Veyra po jawnej zapowiedzi wojny z Kosciolem (t_110) jest pozycja, ktora bedzie musial komus wytlumaczyc. Nie wycofal sie. NIE WIE, ze Lucan ma go za kandydata na czlowieka z atramentem - oren_connection.lucan_said_it_out_loud nadal false."}
    - {fact_id: fact_kesz_sent_word_to_the_priest, source_event_id: event_turn_interlude_193, claim: "Wiadomosc do kaplana idzie tego samego dnia (dzien 4 interludium). Terminu ani miejsca nie podal - data nie jest jego do dania, tak samo jak w t_113."}
    - {fact_id: fact_kesz_priced_representation_before_guild_and_watch, source_event_id: event_turn_interlude_193, source_retcon_id: retcon_000124, claim: "Lucan poprosil go o reprezentacje przed kierownictwem gildii i przed Straza. Kesz nie odmowil i nie obiecal - NAZWAL DWIE CENY. (a) STRAZ jest jego forum, ale pokoj powiedzial w t_100, ze z klientem w mundurze sie nie konkuruje, wiec jego WIDOCZNA obecnosc naprzeciw Strazy jest kosztem dla jego stalego klienta. (b) GILDIA nie jest jego forum - zna urzednikow magistratu, nie statuty korporacji, a prawnik obiegu przestepczego na wewnetrznym przesluchaniu sam w sobie jest komunikatem o Lucanie. KOREKTA retcon_000124: pierwsza wersja tego wpisu mowila, ze Kesz PRZENIOSL DECYZJE DO PRYNCYPALA jak bramka. To bylo granie polem standing.declaration z t_104, uniewaznionym przez standing.moved_seats z t_105b. Wobec Lucana Kesz decyduje o wlasnym udziale SAM."}
    - {fact_id: fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest, source_event_id: event_turn_interlude_194, claim: "Wiadomosc do kaplana ma brzmiec, ze spotkanie dotyczy TEGO, CO JEST POD CMENTARZEM. Kesz niesie to zdanie NIE ZNAJAC jego tresci - w t_110 Lucan nazwal przy nim ISTNIENIE wiekszego problemu z cmentarzem, nie jego zawartosc - i sam uznal niewiedze za zalete, bo nie da sie go zmusic do rozwiniecia. Varkhen NIE padl; forbidden_without_source nienaruszone."}
    - {fact_id: fact_kesz_holds_the_blackmail_cover_story, source_event_id: event_turn_interlude_194, claim: "Lucan dal mu do uzytku wersje, ze Lucan go SZANTAZUJE - jeszcze nieprawdziwa, ale formalnie pasujaca. Kesz wzial ja bez wahania, bo odpowiada na pytanie, ktore sam postawil: jak wytlumaczy wprowadzenie Veyra po zapowiedzi wojny z Kosciolem. Wycenil dwie rzeczy: karta gra RAZ i obniza jego pozycje w tamtym pokoju, a wersji nie wolno zdementowac zachowaniem Lucana w trakcie."}
    - {fact_id: fact_kesz_accepted_the_procedural_guarantor_role, source_event_id: event_turn_interlude_194, claim: "Rola przeformulowana przez Lucana i przyjeta: NIE obronca, tylko GWARANT PROCEDURY. Lucan broni sie sam i zamierza szantazowac zarowno Straz, jak i kierownictwo gildii; Kesz ma stac i pilnowac, zeby nie doszlo do rozwiazania nieformalnego. Jego wlasna poprawka zawodowa: zadanie brzmi nie 'niech nazwia przepis', tylko 'niech to wejdzie do PROTOKOLU' - swiadek milczacy, ktory na koncu zapisuje brak przywolanego przepisu, jest wart wiecej niz obronca. Zauwazyl tez, ze jego obecnosc JEST komunikatem: po tej rozmowie Straz wie, ze przy sprawie stoi syndykat. Zadnej umowy ani honorarium - is_lucans_lawyer nadal formalnie false."}
    - {fact_id: fact_kesz_is_the_authorised_line_to_the_principal, source_event_id: event_turn_interlude_194, claim: "Lucan wprost zgodzil sie, zeby Kesz powtarzal pryncypalowi tresc obu rozpraw, i sam zaproponowal uzywanie go jako linii do powiadamiania o terminach. To zamienia udzial Kesza z ekspozycji w aktyw dla pokoju (protect_the_room_first). NIE zamyka obligation_name_advance_warning_channel_for_syndicate - t_109 zadal sygnalu wartego dobe przewagi typu 'zamykajcie', a nie prawnika noszacego terminy."}
    - {fact_id: fact_kesz_asked_whether_seraphine_knows_he_will_be_there, source_event_id: event_turn_interlude_194, claim: "Zapytal, czy oficer gildii oslaniajacy Lucana wie, ze Kesz stanie na przesluchaniu. Pytanie operacyjne, nie moralne. Odpowiedzi nie zazadal na miejscu i nie dostal."}
    - {fact_id: fact_kesz_became_lucans_lawyer_with_the_rooms_blessing, source_event_id: event_turn_interlude_199, claim: "is_lucans_lawyer false -> true, pierwszy raz w kampanii. Warunek z jego wlasnej agendy - take_lucan_as_client_only_if_the_room_allows - spelniony, bo pokoj byl obecny i zostal zapytany. GRANICA retcon_000124: Kesz NIE prosil o zgode na wlasny udzial i nikt go po nia nie odsylal; role przyjal SAM w t_194. Pryncypalowi nalezalo co innego, co Kesz sam nazwal w t_194 - czy POKOJ chce byc widziany, bo widoczna obecnosc Kesza jest deklaracja zainteresowania syndykatu. Chce. Honorarium zero, zakres waski, warunek jeden: syndykat widoczny, pryncypal nienazwany."}
    - {fact_id: fact_kesz_heard_lucan_name_his_cemetery_exposure_out_loud, source_event_id: event_turn_interlude_199, claim: "Lucan po raz pierwszy nazwal na glos, przy pryncypale, ze Kesz ma wlasny interes w tym, by sledztwo nie dokopalo sie do jego albo jego klientow udzialu w procederze cmentarnym - patrz oren_connection.said_out_loud_detail. Kesz PRZYJAL to bez oporu, bo rozpoznaje wzor: w t_105b Lucan oddal mu dzwignie JAKO PREZENT i wlasnie dlatego przesiadl sie po te sama strone stolu. Ten sam ruch drugi raz, w mniejszej skali. Reaguje jak czlowiek rozpoznajacy wzor, nie jak przylapany."}
    - {fact_id: fact_kesz_asked_about_seraphine_a_second_time, source_event_id: event_turn_interlude_199, claim: "Powtorzyl pytanie z t_194: czy npc_seraphine_vale, oficer gildii oslaniajacy Lucana, wie, ze Kesz stanie na przesluchaniu. TO NIE JEST pulapka retcon_000121 - tamta polegala na powtorzeniu zadania, ktore pozniejsza tura ZAMKNELA; tego nie zamknela zadna, Lucan nigdy nie odpowiedzial. Teraz, gdy udzial jest przesadzony, pyta drugi raz - i znowu NIE ZADA odpowiedzi na miejscu. Odpowiedzi nadal nie ma."}
    - {fact_id: fact_kesz_got_his_seraphine_answer_and_it_costs_him, source_event_id: event_turn_interlude_200, claim: "ZAMKNIETE po drugim pytaniu. Seraphine NIE wie i ma sie dowiedziec dopiero po tym, jak zezna przed Straza to, co musi - powod Lucana jest sekwencyjny, nie osobisty: nie chce, zeby powiedziala za duzo i za szybko. Kesz przyjmuje bez sporu, bo jest juz w srodku, ale nazywa, co stracil: w t_194 mowil, ze wolalby nie dowiedziec sie tego RAZEM z nia, a ta odpowiedz znaczy dokladnie tyle, ze dowie sie razem z nia albo po niej. NIE PYTAC O TO TRZECI RAZ - pytanie jest odpowiedziane (retcon_000121)."}
    - {fact_id: fact_kesz_saw_the_spider_obey_after_he_was_already_lucans_lawyer, source_event_id: event_turn_interlude_200, claim: "ZAPISYWAC DOKLADNIE TYLE. Widzial pajaka machajacego lapka na polecenie Lucana. Slowo nieumarly, martwy ani nekromancja NIE PADLO i on nie zapytal - zgodnie z fact_kesz_understood_the_category_without_asking z t_105b, gdzie tez nie zapytal o kategorie towaru, tylko o ilosc, czestotliwosc i stan. Jego jedyna uwaga dotyczyla JEGO, nie Lucana: jest prawnikiem Lucana od okolo dziesieciu minut (t_199) i dopiero potem zobaczyl pokaz; powiedzial, ze doradzilby dokladnie taka kolejnosc. NIE ORZEKL nic o tajemnicy zawodowej i narrator tez nie - legal-order.yaml nie zawiera ZADNEGO zapisu o przywileju, a Kesz sam mowi, ze zna urzednikow magistratu, nie statuty korporacji. forbidden_without_source nadal obejmuje lucan_necromancy i spidey_existence."}
    - {fact_id: fact_kesz_finally_has_the_calendar_he_asked_for, source_event_id: event_turn_interlude_201, claim: "DOSTAL ETAPY DO DATY, KTORA MIAL OD t_105b. fact_kesz_knows_about_the_two_week_deadline mowi, ze przyjal zapowiedz wojny domowej jako date w kalendarzu i chcial wiedziec, po ktorej stronie ma stac jego pokoj - ale mial sama date, bez etapow. Teraz zna cztery fazy protokolu Tobiego: stan obecny, wszystkie strony swiadome, kordon, wejscie oddzialu na cmentarz. NIE ZAPYTAL, co jest pod cmentarzem - konsekwentnie z t_194, gdzie sam uznal wlasna niewiedze za zalete, bo nie da sie go zmusic do rozwiniecia czegos, czego nie wie. forbidden_without_source nienaruszone."}
    - {fact_id: fact_kesz_stands_inside_the_phase_two_trigger, source_event_id: event_turn_interlude_202, claim: "Zauwazyl i powiedzial na glos, ze nowa faza druga odpala sie, kiedy odbeda sie przesluchanie i dysputa - a on od t_199 STOI NA TYM PRZESLUCHANIU jako gwarant proceduralny. Nie jest wiec tylko linia niosaca pokojowi kalendarz; jego obecnosc wspoltworzy moment przejscia na drugi talerzyk. Powiedzial to sucho, bez pretensji i NIE ZAZADAL za to niczego (states_his_position_before_he_has_to)."}
    - {fact_id: fact_kesz_lost_half_his_ignorance_before_the_priest_meeting, source_event_id: event_turn_interlude_203, claim: "Byl w pokoju, gdy Lucan podal pryncypalowi SKALE: najlepszy przypadek to trupy wychodzace z ziemi jak za pierwszym razem, najgorszy to zawalenie miasta w pustki pod nim. PRECYZJA, KTOREJ NIE WOLNO ZGUBIC: padly KONSEKWENCJE, nie przyczyna. Kesz nadal NIE WIE, CO jest pod cmentarzem, i moze to dalej uczciwie powiedziec - nie moze juz powiedziec, ze nie wie, ze to jest powazne. To zmniejsza o polowe zalete, ktora sam nazwal w t_194 (fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest: niesie rame, nie znajac tresci, bo czlowieka, ktory nie wie, nie da sie zmusic do rozwiniecia). Nazwal to sam, bez pretensji - wszedl w to dobrowolnie. forbidden_without_source nienaruszone: varkhen_existence, lucan_necromancy, spidey_existence."}
    - {fact_id: fact_kesz_was_shown_the_unread_crest, source_event_id: event_turn_interlude_240, claim: "Lucan polozyl przed nim item_three_arrow_deer_signet (jelen przebity trzema strzalami) i poprosil o herb. NIE ZAPYTAL, SKAD JEST - konsekwentnie z fact_kesz_understood_the_category_without_asking (t_105b) i z t_200. NIE ROZPOZNAL RODU i powiedzial to wprost: heroldem nie jest, zna urzednikow magistratu, nie Akademie. ZAMIAST TEGO DAL DROGE PRAWNICZA: herb identyfikuje sie przez ODCISK PIECZECI porownany z AKTAMI WLASNOSCI, nie przez czyjas pamiec. heraldry_recognition w inventory zostaje attempted_and_failed, rod NIEUSTALONY, house-veyr-main-line#notes NIE zamkniete w zadna strone. POWIEDZIAL TEZ SAM, ZE ZAPISUJE PYTANIE - bez grozby, jako wlasna praktyke zawodowa: prowadzi ewidencje i ona po to jest. KOREKTA retcon_000159: pierwsza wersja tego wpisu kazala mu powolac sie na doktryne jawnej ewidencji, ktora Lucan wylozyl w t_226 - ale to bylo U SERAPHINE i Kesza tam nie bylo. Nie ma tego w jego knowledge i NIE GRAC tym. CZEGO NIE WIE: skad Lucan ma sygnet. Wersji nie musial podawac i nie podal - the_shield stoi (retcon_000058)."}
    - {fact_id: fact_kesz_knows_about_the_unpaid_tannery_wage, source_event_id: event_turn_interlude_240, claim: "NOWA WIEDZA O AKCIE 1, dotad w jego karcie nieobecna. Lucan powiedzial mu, ze npc_tannery_owner zatrudnil go przez gildie i obiecal pieniadze OSOBNO, poza premia, i nie zaplacil. Kesz wycenil roszczenie dwukrotnie: jako PIENIADZE zero (sprawa garbarnika formalnie otwarta, czesc majatku zamrozona przez miasto, prywatne wynagrodzenie stoi w kolejce za miastem), jako POZYCJE cos (zarejestrowany wierzyciel ma prawo zajrzec do majatku - akty, inwentarz, uzgodnienia magistratu). Cene nazwal RAZ: podpisany wniosek jest dowodem, ze Lucan byl w tych podziemiach i mial dostep. Decyzja NIE PODJETA. CZEGO NIE USLYSZAL: ani slowa o mieszkaniu, skrytce, pieczeci, kluczach ani o tym, ze to Lucan wsadzil garbarnika papierami."}
    - {fact_id: fact_kesz_priced_the_tannery_acquisition_and_asked_two_questions, source_event_id: event_turn_interlude_240, claim: "Lucan zadeklarowal zamiar przejecia albo kupienia posesji (lead_tannery_acquisition_via_bailiff_auction). Kesz NIE odmowil i ani razu nie powiedzial nie da sie (speech_traits: wycenia, nie bramkuje). Nazwal dwie przeszkody, obie z adresem: (a) dopoki postepowanie jest formalnie otwarte, zaklad nie idzie pod mlotek, a rejestrem rusza URZEDNIK AKT MAGISTRATU - zapytal o jego nazwisko i CZEKA NA ODPOWIEDZ; (b) tragarz gildii rangi D kupujacy zaklad jest ekspozycja sam w sobie, wiec pieniadze potrzebuja TWARZY - zaproponowal twarz pokoju i od razu podal cene, ze wtedy pokoj ma w tym udzial (protect_the_room_first). NIEROZSTRZYGNIETE, bo nie padlo: co wie o poprzednim wlascicielu, czy garbarnia w ogole idzie pod mlotek i na jakich warunkach, ile zaklad przynosi. POWIAZANIE Z npc_ivar_kolm MU NIE PRZYSZLO DO GLOWY i narrator go nie podlozyl. NAPIECIE OTWARTE: standing.room_condition zada SYNDYKAT WIDOCZNY, PRYNCYPAL NIENAZWANY, a wpis w rejestrze wlasnosci jest najtrwalsza forma widocznosci."}
    - {fact_id: fact_kesz_took_the_tannery_matter_as_a_paid_client, source_event_id: event_turn_interlude_241, claim: "GLOWNA ZMIANA: WZIAL DRUGA SPRAWE, PIERWSZA FINANSOWANA PRZEZ LUCANA. Lucan zlecil przejecie garbarni jako sprawe troche kryminalna, troche prawna, i jawnie powiedzial, ze nie oczekuje pracy darmo. Kesz przyjal i zdecydowal SAM (retcon_000124 - nie odsyla do pryncypala). KWOTY NIE USTALONO i narrator jej nie wymyslil; powiedzial tylko, ze pieniadze sa najmniejsza czescia tego rachunku. WARUNEK POSTAWIONY ZAMIAST CENY: POKOJ SIE DOWIE, ze prowadzi dla Lucana sprawe majatkowa - staly klient nie dowiaduje sie takich rzeczy od kogos trzeciego. To protect_the_room_first i standing.room_condition, NIE prosba o zgode: informuje, nie pyta, i nie uzaleznil od tego przyjecia sprawy. CZEGO TO NIE ZALATWIA: pryncypal nadal NIENAZWANY, a pytanie czyja twarz kupuje zaklad zostaje otwarte - poinformowanie pokoju to nie wpuszczenie pokoju do transakcji."}
    - {fact_id: fact_kesz_told_lucan_where_stolen_paper_is_worth_nothing, source_event_id: event_turn_interlude_241, claim: "Lucan potwierdzil, ze ma jakies dokumenty do herbu - nie powiedzial, skad, a Kesz NIE ZAPYTAL (jak w t_105b, t_200, t_240). Kesz kazal je trzymac tam, gdzie leza, i nazwal regule: dokument, o ktorego pochodzeniu nie da sie zlozyc zdania, jest wart ZERO na papierze i wszystko POZA papierem - sluzy do USTALENIA nazwiska z odcisku, nigdy do zlozenia w postepowaniu. NIE WIE, ze chodzi o item_tannery_owner_cache w zone_wall_void baszty przy murze, i nie wie o pieczeci ani o dwoch dalszych sygnetach. Przyznal tez Lucanowi punkt o ewidencji: wpis o herbie, ktorego nie umie odczytac, jest wpisem o niczym - do dnia, w ktorym herb odczyta ktos inny, bo wtedy wpis ma date."}
    - {fact_id: fact_kesz_split_the_two_tannery_owners_and_is_waiting, source_event_id: event_turn_interlude_241, claim: "Lucan opisal sprawe jako dlug POPRZEDNIEGO wlasciciela, ktory zniknal i ma otwarty proces. Kesz rozdzielil dwoch wlascicieli jako czynnosc zawodowa, nie jako opor, i CZEKA NA JEDNO SLOWO POTWIERDZENIA, bo od tego zalezy cala droga. Stan z plikow bez zmian: dluznikiem jest npc_tannery_owner, wlasciciel OBECNY (the_unpaid_job), on ma otwarte postepowanie i czesc majatku zamrozona, on wyszedl z aresztu w t_032 i ma miejsce pobytu nieustalone; POPRZEDNI wlasciciel to ten, po ktorym zostal sygnet, i jego los, rod oraz nazwisko sa NIEUSTALONE (tannery-owner#do_not_invent). ZAPROPONOWAL PIERWSZY KROK, NIE WYKONAL GO: obejrzec, na jakim etapie stoja akta sprawy garbarni w magistracie - to nie wymaga urzednika akt, bo czytanie stanu sprawy to nie ruszanie rejestru wlasnosci. Cene podal plasko: ktos zauwazy, ze prawnik pyta o garbarnie. ODNOTOWAL BRAK NAZWISKA URZEDNIKA JEDEN RAZ i nie pytal drugi (retcon_000121); postawil granice: bez nazwiska nie rusza rejestru."}
    - {fact_id: fact_kesz_heard_the_papers_are_unclaimable_and_named_the_other_end, source_event_id: event_turn_interlude_242, claim: "USLYSZAL WERSJE, NIE PRAWDE. Lucan powiedzial mu, ze papiery znalazl formalnie W SMIECIACH, eksplorujac ruiny i laboratoria biomutantow pod posesja, i ze wlasciciel nie moze ich przyznac, bo przyznalby, ze wiedzial o laboratoriach oznaczonych jako zagrozenie dla miasta - a za ich ukrywanie grozi mu dluga odsiadka. ZAPISYWAC JAKO TO, CO USLYSZAL: prawda z plikow jest inna i sie NIE ZMIENIA (papiery ze SKRYTKI i MIESZKANIA obecnego wlasciciela, otwartych jego wlasnymi kluczami - tannery-owner#the_vault, #the_lodging; retcon_000120). Wersja lezy w state/secrets.yaml#cover_stories. SAM ARGUMENT Kesz uznal za dobry i jest to odczyt z pliku, nie retoryka (tannery-owner#why_he_was_detained, #what_he_refuses). POKAZAL JEGO DRUGI KONIEC, bez nazywania kogokolwiek po imieniu: papier, ktorego wlasciciel nie moze przyznac, nie jest przez to papierem bez zainteresowanych, bo opisuje LABORATORIA, a to wynika z kategorii dokumentu, nie z niczyjego spisu (zadna lista, zaden swiadek, zaden zegar - retcon_000058, retcon_000055)."}
    - {fact_id: fact_kesz_knows_lucan_holds_the_owners_silver_seal, source_event_id: event_turn_interlude_242, claim: "NAJDROZSZE UJAWNIENIE TEJ SCENY. Lucan powiedzial mu, ze ma srebrna pieczec zakladu, ktora ZAGINELA po katastrofie ze szczuroogrem (milestone_020/021). Kesz nie odrzucil sprawy i nie moralizowal, ale POSTAWIL GRANICE O SOBIE, zanim musial: nie chce byc czlowiekiem, ktory wie, gdzie ta pieczec jest. Jest to jego wlasna ekspozycja zawodowa, NIE sciana swiata - a przypomnienie, ze nic powiedziane przy nim nie jest objete tajemnica (standing.consequence), pochodzi od niego samego z t_104. WYCENIL DWIE DROGI: z pieczecia Lucan nie kupuje garbarni, tylko staje sie jej dokumentacja, a dokument z data z tamtego okresu wchodzi prosto w rozliczenie, ktore ktos wlasnie prowadzi (doslownie inventory#forgery_intent.dlaczego_to_teraz_ciekawsze_niz_bylo); bez pieczeci kupuje wolno i nikt tego potem nie rozplecie. ZADNA PIECZEC NIE ZOSTALA UZYTA i zadna nie opuscila zone_wall_void. CZEKA NA JEDNO SLOWO: ma o niej wiedziec czy nie."}
    - {fact_id: fact_kesz_split_the_two_keys_guild_site_city_estate, source_event_id: event_turn_interlude_242, claim: "Lucan zadeklarowal, ze majatkiem zarzadza obecnie GILDIA. Kesz rozdzielil to na dwa klucze, bo pliki mowia dwa razy co innego: GILDIA trzyma TEREN i klasyfikacje zagrozenia (ekipa A-rank zamknela podziemia), a MAJATEK ZAMROZILO MIASTO (tannery-owner#earlier_detention_history, inventory#forgery_intent, audyt t_234). Zeby kupic zaklad, potrzebne sa OBA. Czy majatek nadal jest zamrozony i czy brygadzista nadal prowadzi zaklad - NIEUSTALONE i w tej turze nieustalone dalej (tannery-owner#current_situation). PRZYJAL NATOMIAST BEZ SPORU I UZNAL ZA MOCNE: skarga na niezaplacone wynagrodzenie ZOSTALA ZLOZONA PRZEZ GILDIE (kanon - inventory#item_tannery_owner_cache.two_open_debts), czyli pozycja wierzyciela, ktora wycenil w t_240 jako mozliwa, JUZ ISTNIEJE, i to zlozona ZANIM byla potrzebna - wiec nikt nie czyta jej jako zagrywki. PYTANIE Z t_241 ZAMKNIETE: dluznikiem jest wlasciciel OBECNY. CZEKA, ktory klucz ruszaja pierwszy - gildie czy miasto."}
    - {fact_id: fact_kesz_accepted_the_two_road_strategy_and_goes_to_the_city_first, source_event_id: event_turn_interlude_243, claim: "STRATEGIA LUCANA PRZYJETA W CALOSCI. Miasto - zajecie majatku i oplata; gildia - zamkniecie sprawy; zaden wspolny papier, wiec jedna sprawa nie zapala drugiej. PIECZEC ZAMKNIETA PO JEGO WOLI: Lucan powiedzial zakladam, ze nie wiesz, i Kesz to przyjal - wie, ze pieczec istnieje, NIE wie gdzie jest i nie chce wiedziec; nie zapisal i nie wraca. PIERWSZY KROK UMOWIONY I WYKONALNY BEZ NAZWISKA URZEDNIKA: idzie od rana do miasta, bo Lucan jest wierzycielem ze ZLOZONYM pismem (inventory#two_open_debts) i wierzyciel moze WNIESC O ZAJECIE majatku dluznika - urzednik akt jest potrzebny do ruszenia REJESTRU WLASNOSCI, nie do wniosku, a rejestru Kesz nie tyka. Nazwiska nie zazadal trzeci raz (retcon_000121), powiedzial tylko, gdzie droga sie bez niego konczy. POPRZEDNI WLASCICIEL: przyjal, ze nie ma praw do terenu, bo obecny nabyl wszystko na nowo - czyli stary jest bezwartosciowy dla samego nabycia i wartosciowy tylko jako osobny towar."}
    - {fact_id: fact_kesz_named_the_price_of_throwing_the_old_owner_to_the_guild, source_event_id: event_turn_interlude_243, claim: "Lucan zaproponowal rzucenie gildii starego wlasciciela jako udokumentowanego sprawcy, zeby domknela wlasne postepowanie. Kesz nazwal to najlepszym pomyslem wieczoru i NIE odradzil. DOLOZYL JEDNA CENE, JEDNYM ZDANIEM, I JEST TO CYTAT Z PLIKU, NIE HAK (retcon_000058 - nie powstala zadna lista, zaden swiadek, zaden zegar): inventory#item_tannery_owner_cache.why_it_matters_now mowi, ze te papiery to DOKLADNIE ta kategoria prawna, o ktora toczy sie otwarta dysputa, a katedra npc_ivar_kolm to biomutanty - Lucan trzyma gotowy precedens z Lumarii, ze ktos juz to robil pod warsztatem i miasto tego nie zobaczylo. To samo pismo, ktore zamyka postepowanie gildii, uzbraja wiec druga strone dysputy za okolo 16 dni. Decyzji NIE ZAZADAL teraz. NIEROZSTRZYGNIETE: czy stary wlasciciel zyje (tannery-owner#do_not_invent) - a to decyduje, czy gildia dostaje sprawce, czy tylko akta. ZAPYTAL O TERMIN dostarczenia papierow, bo leza trzy kwadranse marszu od miasta (t_086), a noc Lucana jest juz zajeta."}
    - {fact_id: fact_kesz_will_carry_the_honest_business_offer_to_the_principal, source_event_id: event_turn_interlude_243, claim: "DRUGA, SZERSZA OFERTA DO SYNDYKATU - dotyka obligation_define_syndicate_exchange_beyond_gold, ktorego status to first_substantive_offer_made_not_yet_accepted (oferta z t_198: odpad jubilerski, potencjalnie Akademia jako odbiorca, UMOWY NIE MA). Lucan kazal przedstawic garbarnie jako POCZATEK SWOJEJ UCZCIWEJ PRZEDSIEBIORCZOSCI, ktora bedzie wymagala logistyki, pomocy prawnej i mniej prawnej - czyli wszystkiego, na czym pokoj zarabia - z pieczatka gildii pod statusem prawnym jako wisienka. Kesz WEZMIE to do pokoju i nie odradzil. POPRAWIL ADRES OFERTY, i jest to odczyt z pliku, nie madrosc z urzedu (retcon_000040): syndicate-weigher#seraphines_reading_of_the_motive mowi, ze syndykat KUPUJE PRZYSZLOSC TERENU - pryncypal sam powiedzial, ze pusta linia sciagnie kogos w ciagu tygodni i ze ktokolwiek ja wezmie, bedzie potrzebowal cmentarza. Wiec pokoju nie trzeba przekonywac do gruntu; pokoj grunt juz kupuje. Rada: Lucan ma SAM nazwac udzial pokoju, zanim pokoj nazwie go za niego. standing.room_condition nienaruszone - pryncypal nadal nienazwany, slowa Don Kesz nie powtarza. Pytanie czyja twarz kupuje zaklad NADAL OTWARTE - oferta go nie zalatwia."}
    - {fact_id: fact_kesz_asked_what_lucan_intends_to_do_with_the_priest, source_event_id: event_turn_interlude_244, claim: "PYTANIE OTWARTE, POSTAWIONE PRZED CZASEM I NIE O PIENIADZE. Lucan zapytal, co z kaplanem; Kesz podal stan (wiadomosc poszla dzis, odpowiedzi nie ma, terminu nie wyznacza on - data nie jest jego do dania) i zaraz potem swoja pozycje, jak zawsze zanim musial. Dwa jego wlasne fakty sie tu spinaja: t_193 - skoro spotkanie organizuje ON, wprowadzenie tam Veyra po jawnej zapowiedzi wojny z Kosciolem jest pozycja, ktora bedzie musial komus wytlumaczyc; t_203 - po podaniu mu SKALI nie moze juz powiedziec, ze nie wie, ze sprawa jest powazna, czyli jego oslona z niewiedzy zmniejszyla sie o polowe. PYTA WIEC: co Lucan zamierza z tym kaplanem zrobic, i chce to wiedziec PRZED pokojem, nie w pokoju. NIE zazadal honorarium, weta ani warunku - to jest pytanie, nie brama. ODPOWIEDZI NIE DOSTAL w tej turze. CZEGO NIE POWIEDZIAL, choc doszedl do krawedzi: ani slowa o Orenie, o zmienianych trasach, o zeznaniu npc_halvek_wagonman ani o tym, ze kaplan przyszedl na cmentarz z Orenem. converging_target#consequence zostaje - zaden z nich nie dopowiedzial tego do konca na glos, a dopowiedzenie jest ruchem GRACZA. oren_connection bez zmian, confirmation_route przez Halveka nietknieta."}
    - {fact_id: fact_kesz_wrote_unagreed_next_to_the_papers_and_the_rooms_share, source_event_id: event_turn_interlude_244, claim: "Lucan powiedzial, ze temat garbarni jest uzgodniony, i przeszedl do kaplana - ale dwa praktyczne pytania Kesza z t_243 zostaly bez odpowiedzi: KIEDY dostanie papiery (zone_wall_void baszty, trzy kwadranse marszu, t_086) i ILE DOSTAJE POKOJ. Kesz dopisal przy nich w ksiedze nieumowione, jedna linijka, i nie wrocil do tematu - jego kalendarz od tego zalezy, ale nacisku nie stawia (retcon_000142). Nazwiska urzednika akt nie zazadal juz w ogole, zgodnie z tym, co sam powiedzial w t_243."}
    - {fact_id: fact_kesz_learned_the_description_has_a_living_man_behind_it, source_event_id: event_turn_interlude_245, claim: "PRZELOM W JEGO WLASNEJ EKSPOZYCJI, URUCHOMIONY RUCHEM GRACZA. Lucan zaoferowal mu - jako zadatek na wszystkie mozliwe koszty procesowe - informacje o miejscu przebywania jego problemu. Kesz ZROZUMIAL BEZ PYTANIA, o kogo chodzi (jak w t_105b i t_200), i PRZYJAL. O RYSOPISIE wiedzial od t_105b, bo Lucan sam mu go wtedy wymienil wsrod nitek trzymanych na wozach; NIE WIEDZIAL, ze za rysopisem stoi ZYWY, dostepny czlowiek. To jest npc_halvek_wagonman, captured_alive, loc_guild_holding_cells, halvek#open_thread. SAMEJ INFORMACJI JESZCZE NIE DOSTAL - Lucan zapytal, czy jej chce, i to Lucan ma ja wypowiedziec. NAZWAL, CZYM ZAPLATA JEST: nie zadatkiem, tylko spisem z inwentarza - Lucan mial to przez caly czas, kiedy Kesz wazyl, czy sie w to pakowac; drugi raz ten sam ruch co w t_105b, gdzie tez dostal prezent bedacy jednoczesnie pomiarem. Kpiny nie odebral jako obrazy i nie moralizowal (speech_traits). ODWROCIL OFERTE: miejsce go nie ratuje, bo do cel gildii - budynku Seraphine - prawnik nie wchodzi z teczka; chce wiedziec, CZY TAMTEN JUZ POWIEDZIAL I KOMU. Rysopis w pamieci to plotka, rysopis obok twarzy w protokole to akta - mechanika potwierdzona w tej kampanii przez halvek#prisoner_sourced_gate_guard_description, gdzie rysopis lezal bezuzytecznie od t_048/052 do t_207, dopoki nazwisko nie przyszlo z innego zrodla. CZY HALVEK MOWIL COKOLWIEK PO t_048 - NIEUSTALONE, narrator tego nie domknal. NADAL NIEDOPOWIEDZIANE: Lucan powiedzial twoj problem, nie ty jestes czlowiekiem z rysopisu; nie padlo imie Orena, zeznanie Halveka jako zrodlo, dopasowanie rysopisu ani rozbieznosc palec wskazujacy kontra lewy kciuk (retcon_000122). oren_connection.lucan_said_it_out_loud BEZ ZMIAN. converging_target#consequence zaczyna sie realizowac: przestaje byc uslugodawca, staje sie strona z wlasnym motywem."}
    - {fact_id: fact_kesz_got_paid_instead_of_answered_about_the_priest, source_event_id: event_turn_interlude_245, claim: "Zapytal w t_244, co Lucan zamierza zrobic z kaplanem, i dostal zaplate zamiast odpowiedzi. Odnotowal to RAZ, plasko, bez zlosci i BEZ POWTARZANIA PYTANIA (retcon_000121, retcon_000142). Pytanie zostaje otwarte i nalezy do niego - jesli zechce, wroci z nim sam. Bez odpowiedzi nadal takze: nazwisko urzednika akt, termin dostarczenia papierow i udzial pokoju."}
    - {fact_id: fact_kesz_refused_the_witness_removal_on_arithmetic_not_conscience, source_event_id: event_turn_interlude_246, claim: "LUCAN ZLOZYL NA GLOS OFERTE USUNIECIA SWIADKA - podal menu: personalia, miejsce pobytu, zniknięcie, plus zart o inhumacji jako ekshumacji za zycia. Kesz nie zasmial sie, nie skrzywil i NIE MORALIZOWAL (speech_traits). Najpierw wlasna pozycja, jak zawsze zanim musial: Lucan powiedzial to na glos w pokoju, o ktorym Kesz uprzedzil go SAM w t_104 (standing.consequence - nic tu nie jest objete tajemnica), wiec Kesz tego NIE USLYSZAL i nazwal to ostatnim razem, kiedy moze tak powiedziec. POTEM WYBRAL Z MENU, bo o to byl pytany (retcon_000135): PERSONALIA I ODPOWIEDZ, CZY TAMTEN JUZ MOWIL - NIE zniknięcie. Rachunek, nie sumienie: Halvek siedzi w loc_guild_holding_cells, czyli w budynku gildii i na terenie npc_seraphine_vale, ktorej urzedem jest kontrola; trup w celi nie wymaga zadnego standardu dowodowego, a rysopis wymaga drugiej polowy; po Lucanie drugim nazwiskiem, ktore komukolwiek przyjdzie do glowy, jest nazwisko jego prawnika. Tansza wersja tego samego juz zadzialala w tej kampanii - halvek#prisoner_sourced_gate_guard_description: rysopis lezal bezuzytecznie od t_048/052 do t_207, dopoki nazwisko nie przyszlo z innego zrodla. NA PYTANIE, CZY BAWI SIE SAM: tym koncem rzemiosla nie zajmuje sie osobiscie, a za pokoj NIE ODPOWIADA - moze tylko zaniesc pytanie, i spodziewa sie, ze pytanie o trupa w budynku gildii kosztuje wiecej, niz Lucan dzis dla pokoju zarabia. To jego wlasne oczekiwanie, NIE decyzja pryncypala, ktorej narrator nie zadeklarowal. HALVEK NIETKNIETY: captured_alive, bez zmiany lokacji, nikt do niego nie poszedl."}
    - {fact_id: fact_kesz_audited_lucans_self_description, source_event_id: event_turn_interlude_246, claim: "JEDYNA RZECZ, KTORA KESZ DODAL Z SIEBIE, I JEST TO JEGO agenda#assess_whether_lucan_is_a_liability W DZIALANIU. Lucan powiedzial mu, ze jest chujowym szlachcicem, ale szlachcicem, nie rzeznikiem, ze MANIPULUJE ZAMIAST GROZIC, bo to lepsze dla wszystkich na dluzsza mete, i ze urokiem tej metody jest to, ze SWIADOMOSC NIE POMAGA - a w nastepnym zdaniu zaproponowal pochowanie czlowieka za zycia. Kesz nazwal te niespojnosc jednym zdaniem: to nie jest opis metody, to opis nastroju. NIE jest to moralizowanie ani madrosc z urzedu (retcon_000040), tylko audyt zdania, ktore padlo pol minuty wczesniej, wykonany przez czlowieka, ktorego zawodem jest sprawdzanie, czy wersja klienta trzyma sie kupy. WNIOSKU O LUCANIE NIE WYCIAGNAL NA GLOS i decyzji o prowadzeniu sprawy nie zmienil. Deklaracja metody idzie do jego knowledge jako TO, CO USLYSZAL (retcon_000120) - nie do player/abilities.yaml ani do zadnego pliku opisujacego, jak Lucan naprawde dziala. Zapowiedz kolejnych takich prezentow to intencja, nie wykonanie."}
    - {fact_id: fact_kesz_got_the_witnesses_name_and_the_state_of_his_testimony, source_event_id: event_turn_interlude_247, claim: "ZAPLATA ODDANA W CALOSCI. Kesz dostal od Lucana: (a) NAZWISKO - Halvek (npc_halvek_wagonman); (b) STAN ZEZNANIA - powiedzial npc_seraphine_vale, kogo widzial, ale NIEPRECYZYJNIE, bo rownoczesnie targowal sie z Lucanem o przysługi dla chorej matki, na czas po tym, jak straz rozwiaze problem jego zeznan; zeznanie jest wiec DO PODWAZENIA; (c) CZESC NIEBEZPIECZNA - Halvek ROZPOZNA Kesza, jesli znajda sie w JEDNYM POKOJU. Nazwisko przyjal bez komentarza. Ponowionej oferty zniknięcia (na promocji, poki siedzi w celi) NIE przyjal i nie zamknal - policzyl raz w t_246 i drugi raz nie liczy (retcon_000135). Zeznanie do podwazenia uznal za jedyna dobra wiadomosc wieczoru."}
    - {fact_id: fact_kesz_realised_he_already_promised_the_room_with_the_witness_in_it, source_event_id: event_turn_interlude_247, claim: "ZESTAWIENIE, KTORE ZROBIL SAM I NA GLOS - i ktore jest obowiazkiem narratora, nie gracza (retcon_000135). Rozpoznanie wymaga jednego pokoju, a Kesz JUZ JEDEN TAKI POKOJ OBIECAL: standing.scope_of_representation - gwarant procedury na PRZESLUCHANIU KIERONICTWA GILDII, w BUDYNKU GILDII, a npc_halvek_wagonman siedzi w loc_guild_holding_cells, czyli w tym samym budynku. Zgodzil sie na to w t_194/t_199, kiedy wiedzial tylko o RYSOPISIE i nie wiedzial, ze stoi za nim zywy czlowiek. Powiedzial to bez pretensji - Lucan oddal mu te wiedze dobrowolnie i to jedyny powod, dla ktorego ja ma; pulapki w plikach nie ma i Kesz jej nie zarzucil. NIE WYCOFAL SIE Z PRZESLUCHANIA, nie zerwal umowy, nie zazadal pieniedzy. Powiedzial, ze do rana bedzie wiedzial, czego chce. NIEUSTALONE: czy Halvek bedzie w tych celach w dniu przesluchania, czy ktokolwiek by ich zetknal i co Kesz ostatecznie zrobi."}
    - {fact_id: fact_kesz_knows_the_room_will_not_stand_between_him_and_the_watch, source_event_id: event_turn_interlude_247, claim: "NAJZIMNIEJSZY WNIOSEK TEJ SCENY I JEST TO JEGO WLASNA WIEDZA, NIE MADROSC Z URZEDU (retcon_000040). Lucan powiedzial, ze straz wykorzysta go jako kozla ofiarnego - ma to pokrycie w lucan-leads#lead_city_watch_covers_cemetery_corpse_trade (straz zakrywa afere z handlem zwlokami, wiec potrzebuje kogos spoza siebie). Kesz dolozyl wlasne zdanie z fact_kesz_priced_representation_before_guild_and_watch (t_193): pokoj powiedzial w t_100, ze Z KLIENTEM W MUNDURZE SIE NIE KONKURUJE. Wniosek o sobie: jesli straz bedzie potrzebowala kozla, POKOJ NIE STANIE MIEDZY NIA A NIM. Ochrona, na ktora liczyl, ma warunek, ktorego on nie ustala. ZADEN ZEGAR ANI SLEDZTWO Z TEGO NIE POWSTALY (retcon_000055, retcon_000058) - to odczyt dwoch zdan lezacych juz w plikach. converging_target#consequence: PIERWSZA POLOWA ZREALIZOWANA - przestal byc uslugodawca i jest strona z wlasnym motywem, powiedzial to na glos. DRUGA POLOWA STOI: nie padlo imie Orena, nie padlo ty jestes czlowiekiem z rysopisu, nie padlo zeznanie z t_048 jako zrodlo ani rozbieznosc rysopisu (retcon_000122). oren_connection.lucan_said_it_out_loud BEZ ZMIAN."}
    - {fact_id: fact_kesz_got_the_priest_answer_and_it_is_a_fifth_option, source_event_id: event_turn_interlude_248, claim: "PYTANIE Z t_244 ODPOWIEDZIANE, MIMOCHODEM, NA ODCHODNYM - I ODPOWIEDZ JEST SPOZA JEGO LISTY. Kesz wymienil cztery pokoje: negocjowac, kupic, przycisnac, zniszczyc. Lucan podal piaty: PRZEKONAC KAPLANA, ZE JEST JEGO JEDYNA NADZIEJA - i dodal, ze zrobi to TAK SAMO, JAK ZROBIL TO KESZOWI. Spojne z jego deklaracja metody z t_246 (manipuluje zamiast grozic, swiadomosc nie pomaga). ZAPOWIEDZIAL WSPOLNA KONSULTACJE KESZ + KAPLAN - jako PLAN, nie umowione spotkanie: kaplan nadal nie odpowiedzial na wiadomosc wyslana dzis rano, terminu nie ma i data nie jest Kesza do dania (t_113, t_193). Kesz odnotowal, ze klient powiedzial mu w twarz, iz zastosowal na nim te sama technike, i nazwal to bez emocji - albo bardzo szczery, albo bardzo pewny, ze to nic nie zmienia (agenda#assess_whether_lucan_is_a_liability). WNIOSKU NIE WYCIAGNAL NA GLOS, umowy nie zerwal, z przesluchania sie nie wycofal. Na bedziemy bogaci nie dal sie rozchmurzyc. ZAMKNAL JEDNYM ZADANIEM: zeby Lucan przyniosl papiery. Nadal bez odpowiedzi: nazwisko urzednika akt, termin papierow, udzial pokoju, oraz co Kesz sam zdecyduje do rana (t_247)."}
