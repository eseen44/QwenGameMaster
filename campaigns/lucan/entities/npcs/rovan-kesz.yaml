portrayal:
  temperament: [precise, unsentimental, states_his_position_before_he_has_to]
  appearance: "Po pięćdziesiątce, ubrany jak urzędnik ze średniej półki, teczka, atrament na palcu wskazującym."
  group_role: "Prawnik obiegu przestępczego - ten z pakietu drogi Mary. Zna urzędników magistratu, nie Akademię."
oren_connection:
  status: strong_description_match_not_yet_confirmed_identity
  source_event_id: event_turn_interlude_105b
  established_by: player_worldbuilding_interlude
  claim: "Rysopis Kesza pasuje do czlowieka SPOZA ZALOGI, po spotkaniach z ktorym Oren zmienial trasy wozu ze zwlokami - zeznanie Halveka, event_turn_interlude_048, urwane wtedy na 'na razie nie podaje wiecej'."
  confirmation_route: "npc_halvek_wagonman siedzi w celach gildii (loc_guild_holding_cells) i widzial tego czlowieka. Rozpoznanie przez niego zamienilo by dopasowanie w tozsamosc."
  implication: "Syndykat - albo przynajmniej Kesz osobiscie - JEST w linii transportu cial. Pierwsza teza Lucana z tej rozmowy byla trafna."
  lucan_said_it_out_loud: said_obliquely_as_shared_interest_identity_still_unspoken
  said_out_loud_detail: >-
    event_turn_interlude_199. Lucan powiedzial przy pryncypale, ze jest niewinny dokladnie
    tak samo jak rzeczony prawnik, ktory ma interes w tym, zeby nikt w Strazy ani w gildiach
    nie dokopal sie do JEGO albo JEGO KLIENTOW udzialu w procederze cmentarnym. Nazwal wiec
    EKSPOZYCJE Kesza jako wspolny interes - nie jako oskarzenie i nie jako szantaz.
    CZEGO NIE PADLO: Oren, zeznanie npc_halvek_wagonman z event_turn_interlude_048,
    dopasowanie rysopisu ani zdanie, ze to Kesz jest czlowiekiem, po ktorego spotkaniach
    Oren zmienial trasy. Tozsamosc NADAL niepotwierdzona, confirmation_route przez Halveka
    w loc_guild_holding_cells nietknieta.

standing:
  primary_client: the_syndicate
  is_lucans_lawyer: true
  became_lucans_lawyer_at_event_id: event_turn_interlude_199
  scope_of_representation: >-
    WASKI I TAKI, JAKI PRZYJAL SAM W t_194: GWARANT PROCEDURY, nie obronca. Lucan broni sie
    SAM. Zadanie wg jego wlasnej poprawki zawodowej: nie "niech nazwia przepis", tylko "niech
    to WEJDZIE DO PROTOKOLU" - swiadek milczacy, ktory na koncu zapisuje, ze zadnego przepisu
    nie przywolano. Dotyczy przesluchania kierownictwa gildii i rozmowy ze Straza.
  fee: >-
    ZERO. Pryncypal nie wzial honorarium, bo prawnik stojacy przy Lucanie chroni 40 000 srebra
    jeszcze niewyplaconych, kategorie towaru kupiona pod termin Lucana i szescdziesiat kilo,
    ktore juz przez ten dom przeszlo (fact_weigher_has_a_stake_in_lucan_surviving, t_109).
    Po stronie Lucana nie ma wydanego srebra.
  room_condition: >-
    JEDYNY warunek pryncypala: SYNDYKAT WIDOCZNY, PRYNCYPAL NIENAZWANY. Straz i gildia moga
    wiedziec, ze przy sprawie stoi syndykat - to jest produkt. Nikt nie wymawia jego osoby,
    nie opisuje wagi i nie podaje stolu na targu (agenda#stay_unnamed, jego name_status).
    Warunek nie blokuje planu Lucana, zaweza go o jedno slowo.
  moved_seats: "Po mowie Lucana przesiadl sie po te sama strone stolu (event_turn_interlude_105b) - wobec Lucana przestal byc prawnikiem pokoju i nazwal wspolny problem wprost." 
  declared_at_event_id: event_turn_interlude_104
  declaration: "Powiedział Lucanowi wprost, przy pierwszym kontakcie, że dziś jest prawnikiem tego pokoju i to pokój decyduje, czego Kesz o Lucanie może się dowiedzieć."
  declaration_status: "UNIEWAZNIONA WOBEC LUCANA przez moved_seats (t_105b) - patrz retcon_000124. Nie grac tym polem. Kesz NIE odsyla Lucana do pryncypala po zgode na wlasny udzial; decyduje sam, wazac wlasne ryzyko i interes stalego klienta."
  consequence: "Nic powiedzianego przy nim teraz nie jest objęte tajemnicą zawodową wobec Lucana."
  what_moved_seats_does_not_mean: "NIE zerwal z syndykatem. Pryncypal zostaje jego stalym klientem, a protect_the_room_first zostaje w agendzie. Przesiadka znaczy tyle, ze wobec Lucana rozmawia jako czlowiek z tym samym problemem, nie jako bramka pokoju."
  serves_defence_line: criminal_not_classificatory
knowledge:
  confirmed:
    - {fact_id: fact_kesz_knows_lucan_entered_on_teln_vouching, source_event_id: event_turn_interlude_104, claim: "To on zatrzymał rewizję Lucana jednym zdaniem - 'Gość Teln'. Wie zatem, że Lucan wszedł nieprzeszukany i dlaczego."}
    - {fact_id: fact_kesz_knows_lucan_broke_the_body_line_and_holds_the_leverage, source_event_id: event_turn_interlude_105b, claim: "Lucan powiedzial mu, ze gildia zna punkty kontrolne, ma blankiet autoryzacji trasy, ma rysopis i dosc nitek, by spowolnic biznes ze straza i magistratem - i oddal to jako prezent, nie jako szantaz."}
    - {fact_id: fact_kesz_understood_the_category_without_asking, source_event_id: event_turn_interlude_105b, claim: "Nie zapytal, o jakie kategorie towaru chodzi - zapytal o ilosc, czestotliwosc i stan. Obslugiwal logistyke dostarczajaca Orenowi to samo."}
    - {fact_id: fact_kesz_knows_about_the_two_week_deadline, source_event_id: event_turn_interlude_105b, claim: "Lucan zapowiedzial, ze w ciagu dwoch tygodni wywola i rozwiaze w miescie wojne domowa. Kesz przyjal to jako date w kalendarzu i chce wiedziec, po ktorej stronie ma stac jego pokoj."}
    - {fact_id: fact_kesz_knows_lucan_declared_war_on_the_church, source_event_id: event_turn_interlude_110, claim: "Lucan potwierdzil, ze zapowiedziana wojna domowa za dwa tygodnie dotyczy Kosciola."}
    - {fact_id: fact_kesz_holds_lucans_acceptance_of_the_priest_meeting, source_event_id: event_turn_interlude_113, claim: "Lucan przyjal oferte na odchodnym. Kesz organizuje i przysle wiadomosc. Odbil pytanie: KIM Lucan ma tam siedziec - czlonkiem Akademii na urlopie dziekanskim, czlonkiem gildii czy Veyrem. Chce odpowiedzi PRZED spotkaniem."}
    - {fact_id: fact_kesz_has_lucans_answer_all_three_hats_at_once, source_event_id: event_turn_interlude_193, claim: "Pytanie z t_113 ZAMKNIETE po 80 turach. Lucan siada u kaplana jako WSZYSTKIE TRZY naraz: czlonek Akademii na urlopie dziekanskim, czlonek gildii i Veyr. Kesz przyjal i zapisal, nie odradzal. Nazwal cene: trzy instytucje, do ktorych kaplan moze pojsc na skarge, i jednoczesnie trzy, ktore trzeba ruszyc, zanim ktokolwiek Lucana dotknie. Za element realnie zmieniajacy pokoj uwaza VEYRA - dla czlowieka w stule to rodzina, ktora dwa razy wygrala z Inkwizycja."}
    - {fact_id: fact_kesz_named_his_own_exposure_at_the_priest_meeting, source_event_id: event_turn_interlude_193, claim: "Powiedzial zanim musial, ze skoro spotkanie organizuje ON, to wprowadzenie tam Veyra po jawnej zapowiedzi wojny z Kosciolem (t_110) jest pozycja, ktora bedzie musial komus wytlumaczyc. Nie wycofal sie. NIE WIE, ze Lucan ma go za kandydata na czlowieka z atramentem - oren_connection.lucan_said_it_out_loud nadal false."}
    - {fact_id: fact_kesz_sent_word_to_the_priest, source_event_id: event_turn_interlude_193, claim: "Wiadomosc do kaplana idzie tego samego dnia (dzien 4 interludium). Terminu ani miejsca nie podal - data nie jest jego do dania, tak samo jak w t_113."}
    - {fact_id: fact_kesz_priced_representation_before_guild_and_watch, source_event_id: event_turn_interlude_193, source_retcon_id: retcon_000124, claim: "Lucan poprosil go o reprezentacje przed kierownictwem gildii i przed Straza. Kesz nie odmowil i nie obiecal - NAZWAL DWIE CENY. (a) STRAZ jest jego forum, ale pokoj powiedzial w t_100, ze z klientem w mundurze sie nie konkuruje, wiec jego WIDOCZNA obecnosc naprzeciw Strazy jest kosztem dla jego stalego klienta. (b) GILDIA nie jest jego forum - zna urzednikow magistratu, nie statuty korporacji, a prawnik obiegu przestepczego na wewnetrznym przesluchaniu sam w sobie jest komunikatem o Lucanie. KOREKTA retcon_000124: pierwsza wersja tego wpisu mowila, ze Kesz PRZENIOSL DECYZJE DO PRYNCYPALA jak bramka. To bylo granie polem standing.declaration z t_104, uniewaznionym przez standing.moved_seats z t_105b. Wobec Lucana Kesz decyduje o wlasnym udziale SAM."}
    - {fact_id: fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest, source_event_id: event_turn_interlude_194, claim: "Wiadomosc do kaplana ma brzmiec, ze spotkanie dotyczy TEGO, CO JEST POD CMENTARZEM. Kesz niesie to zdanie NIE ZNAJAC jego tresci - w t_110 Lucan nazwal przy nim ISTNIENIE wiekszego problemu z cmentarzem, nie jego zawartosc - i sam uznal niewiedze za zalete, bo nie da sie go zmusic do rozwiniecia. Varkhen NIE padl; forbidden_without_source nienaruszone."}
    - {fact_id: fact_kesz_holds_the_blackmail_cover_story, source_event_id: event_turn_interlude_194, claim: "Lucan dal mu do uzytku wersje, ze Lucan go SZANTAZUJE - jeszcze nieprawdziwa, ale formalnie pasujaca. Kesz wzial ja bez wahania, bo odpowiada na pytanie, ktore sam postawil: jak wytlumaczy wprowadzenie Veyra po zapowiedzi wojny z Kosciolem. Wycenil dwie rzeczy: karta gra RAZ i obniza jego pozycje w tamtym pokoju, a wersji nie wolno zdementowac zachowaniem Lucana w trakcie."}
    - {fact_id: fact_kesz_accepted_the_procedural_guarantor_role, source_event_id: event_turn_interlude_194, claim: "Rola przeformulowana przez Lucana i przyjeta: NIE obronca, tylko GWARANT PROCEDURY. Lucan broni sie sam i zamierza szantazowac zarowno Straz, jak i kierownictwo gildii; Kesz ma stac i pilnowac, zeby nie doszlo do rozwiazania nieformalnego. Jego wlasna poprawka zawodowa: zadanie brzmi nie 'niech nazwia przepis', tylko 'niech to wejdzie do PROTOKOLU' - swiadek milczacy, ktory na koncu zapisuje brak przywolanego przepisu, jest wart wiecej niz obronca. Zauwazyl tez, ze jego obecnosc JEST komunikatem: po tej rozmowie Straz wie, ze przy sprawie stoi syndykat. Zadnej umowy ani honorarium - is_lucans_lawyer nadal formalnie false."}
    - {fact_id: fact_kesz_is_the_authorised_line_to_the_principal, source_event_id: event_turn_interlude_194, claim: "Lucan wprost zgodzil sie, zeby Kesz powtarzal pryncypalowi tresc obu rozpraw, i sam zaproponowal uzywanie go jako linii do powiadamiania o terminach. To zamienia udzial Kesza z ekspozycji w aktyw dla pokoju (protect_the_room_first). NIE zamyka obligation_name_advance_warning_channel_for_syndicate - t_109 zadal sygnalu wartego dobe przewagi typu 'zamykajcie', a nie prawnika noszacego terminy."}
    - {fact_id: fact_kesz_asked_whether_seraphine_knows_he_will_be_there, source_event_id: event_turn_interlude_194, claim: "Zapytal, czy oficer gildii oslaniajacy Lucana wie, ze Kesz stanie na przesluchaniu. Pytanie operacyjne, nie moralne. Odpowiedzi nie zazadal na miejscu i nie dostal."}
    - {fact_id: fact_kesz_became_lucans_lawyer_with_the_rooms_blessing, source_event_id: event_turn_interlude_199, claim: "is_lucans_lawyer false -> true, pierwszy raz w kampanii. Warunek z jego wlasnej agendy - take_lucan_as_client_only_if_the_room_allows - spelniony, bo pokoj byl obecny i zostal zapytany. GRANICA retcon_000124: Kesz NIE prosil o zgode na wlasny udzial i nikt go po nia nie odsylal; role przyjal SAM w t_194. Pryncypalowi nalezalo co innego, co Kesz sam nazwal w t_194 - czy POKOJ chce byc widziany, bo widoczna obecnosc Kesza jest deklaracja zainteresowania syndykatu. Chce. Honorarium zero, zakres waski, warunek jeden: syndykat widoczny, pryncypal nienazwany."}
    - {fact_id: fact_kesz_heard_lucan_name_his_cemetery_exposure_out_loud, source_event_id: event_turn_interlude_199, claim: "Lucan po raz pierwszy nazwal na glos, przy pryncypale, ze Kesz ma wlasny interes w tym, by sledztwo nie dokopalo sie do jego albo jego klientow udzialu w procederze cmentarnym - patrz oren_connection.said_out_loud_detail. Kesz PRZYJAL to bez oporu, bo rozpoznaje wzor: w t_105b Lucan oddal mu dzwignie JAKO PREZENT i wlasnie dlatego przesiadl sie po te sama strone stolu. Ten sam ruch drugi raz, w mniejszej skali. Reaguje jak czlowiek rozpoznajacy wzor, nie jak przylapany."}
    - {fact_id: fact_kesz_asked_about_seraphine_a_second_time, source_event_id: event_turn_interlude_199, claim: "Powtorzyl pytanie z t_194: czy npc_seraphine_vale, oficer gildii oslaniajacy Lucana, wie, ze Kesz stanie na przesluchaniu. TO NIE JEST pulapka retcon_000121 - tamta polegala na powtorzeniu zadania, ktore pozniejsza tura ZAMKNELA; tego nie zamknela zadna, Lucan nigdy nie odpowiedzial. Teraz, gdy udzial jest przesadzony, pyta drugi raz - i znowu NIE ZADA odpowiedzi na miejscu. Odpowiedzi nadal nie ma."}
    - {fact_id: fact_kesz_got_his_seraphine_answer_and_it_costs_him, source_event_id: event_turn_interlude_200, claim: "ZAMKNIETE po drugim pytaniu. Seraphine NIE wie i ma sie dowiedziec dopiero po tym, jak zezna przed Straza to, co musi - powod Lucana jest sekwencyjny, nie osobisty: nie chce, zeby powiedziala za duzo i za szybko. Kesz przyjmuje bez sporu, bo jest juz w srodku, ale nazywa, co stracil: w t_194 mowil, ze wolalby nie dowiedziec sie tego RAZEM z nia, a ta odpowiedz znaczy dokladnie tyle, ze dowie sie razem z nia albo po niej. NIE PYTAC O TO TRZECI RAZ - pytanie jest odpowiedziane (retcon_000121)."}
    - {fact_id: fact_kesz_saw_the_spider_obey_after_he_was_already_lucans_lawyer, source_event_id: event_turn_interlude_200, claim: "ZAPISYWAC DOKLADNIE TYLE. Widzial pajaka machajacego lapka na polecenie Lucana. Slowo nieumarly, martwy ani nekromancja NIE PADLO i on nie zapytal - zgodnie z fact_kesz_understood_the_category_without_asking z t_105b, gdzie tez nie zapytal o kategorie towaru, tylko o ilosc, czestotliwosc i stan. Jego jedyna uwaga dotyczyla JEGO, nie Lucana: jest prawnikiem Lucana od okolo dziesieciu minut (t_199) i dopiero potem zobaczyl pokaz; powiedzial, ze doradzilby dokladnie taka kolejnosc. NIE ORZEKL nic o tajemnicy zawodowej i narrator tez nie - legal-order.yaml nie zawiera ZADNEGO zapisu o przywileju, a Kesz sam mowi, ze zna urzednikow magistratu, nie statuty korporacji. forbidden_without_source nadal obejmuje lucan_necromancy i spidey_existence."}
    - {fact_id: fact_kesz_finally_has_the_calendar_he_asked_for, source_event_id: event_turn_interlude_201, claim: "DOSTAL ETAPY DO DATY, KTORA MIAL OD t_105b. fact_kesz_knows_about_the_two_week_deadline mowi, ze przyjal zapowiedz wojny domowej jako date w kalendarzu i chcial wiedziec, po ktorej stronie ma stac jego pokoj - ale mial sama date, bez etapow. Teraz zna cztery fazy protokolu Tobiego: stan obecny, wszystkie strony swiadome, kordon, wejscie oddzialu na cmentarz. NIE ZAPYTAL, co jest pod cmentarzem - konsekwentnie z t_194, gdzie sam uznal wlasna niewiedze za zalete, bo nie da sie go zmusic do rozwiniecia czegos, czego nie wie. forbidden_without_source nienaruszone."}
    - {fact_id: fact_kesz_stands_inside_the_phase_two_trigger, source_event_id: event_turn_interlude_202, claim: "Zauwazyl i powiedzial na glos, ze nowa faza druga odpala sie, kiedy odbeda sie przesluchanie i dysputa - a on od t_199 STOI NA TYM PRZESLUCHANIU jako gwarant proceduralny. Nie jest wiec tylko linia niosaca pokojowi kalendarz; jego obecnosc wspoltworzy moment przejscia na drugi talerzyk. Powiedzial to sucho, bez pretensji i NIE ZAZADAL za to niczego (states_his_position_before_he_has_to)."}
    - {fact_id: fact_kesz_lost_half_his_ignorance_before_the_priest_meeting, source_event_id: event_turn_interlude_203, claim: "Byl w pokoju, gdy Lucan podal pryncypalowi SKALE: najlepszy przypadek to trupy wychodzace z ziemi jak za pierwszym razem, najgorszy to zawalenie miasta w pustki pod nim. PRECYZJA, KTOREJ NIE WOLNO ZGUBIC: padly KONSEKWENCJE, nie przyczyna. Kesz nadal NIE WIE, CO jest pod cmentarzem, i moze to dalej uczciwie powiedziec - nie moze juz powiedziec, ze nie wie, ze to jest powazne. To zmniejsza o polowe zalete, ktora sam nazwal w t_194 (fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest: niesie rame, nie znajac tresci, bo czlowieka, ktory nie wie, nie da sie zmusic do rozwiniecia). Nazwal to sam, bez pretensji - wszedl w to dobrowolnie. forbidden_without_source nienaruszone: varkhen_existence, lucan_necromancy, spidey_existence."}
  converging_target:
    id: the_local_priest
    source_event_id: event_turn_interlude_110
    logic: "Lokalny kaplan jest umoczony w sprawe cmentarza - znal wlasciwe wejscie, ogladal pieczecie, przy ostatniej wizycie przyszedl Z ORENEM (faction_lumaria_church.knowledge). Kesz jest czlowiekiem spoza zalogi, po spotkaniach z ktorym Oren zmienial trasy. Sciezka Lucana do Kosciola i ekspozycja Kesza celuja w te sama osobe."
    consequence: "Kesz przestaje byc uslugodawca i staje sie strona z wlasnym motywem. Zaden z nich nie dopowiedzial tego do konca na glos."
  suspicions: []
  false_beliefs: []
  forbidden_without_source: [lucan_necromancy, spidey_existence, varkhen_existence, veyr_house_structure]
  known_about_lucans_father: "Wiedza, ze ojciec Lucana byl dwa razy potepiony przez Inkwizycje i przezyl to (event_turn_interlude_109/110). Ukladu rodu Veyr nie znaja i nie interesuje ich - licza precedens operacyjny, nie nazwisko."
agenda: [arrange_the_meeting_with_the_priest, protect_the_room_first, assess_whether_lucan_is_a_liability, take_lucan_as_client_only_if_the_room_allows]
source_refs: [event_turn_interlude_101, event_turn_interlude_104, event_turn_interlude_199, event_turn_interlude_200, event_turn_interlude_201, event_turn_interlude_202, event_turn_interlude_203, retcon_000124, campaigns/lucan/planning/act-03-defence.yaml#criminal_circuit_lawyer, campaigns/lucan/planning/lucan-leads.yaml#lead_two_contradictory_defences]
speech_traits:
  # OBOWIAZKOWE do przeczytania PRZED pierwsza kwestia tej postaci w scenie
  # (system/narrator.md#cechy-mowy). Ustanowione 2026-09-03 na zadanie gracza.
  - 'Podaje wlasna pozycje, zanim ktos go o nia zapyta - nie z uprzejmosci, tylko zeby nie musiec sie z niej potem tlumaczyc.'
  - 'Wycenia, nie bramkuje: mowi to kosztuje tyle, nigdy nie da sie.'
  - 'Precyzyjny i bez sentymentu; zero ozdobnikow, zero moralizowania nad tym, co wycenia.'
