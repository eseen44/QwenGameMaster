    - {fact_id: fact_ilva_was_bypassed_at_her_own_table, source_event_id: event_turn_interlude_105b, source_retcon_id: retcon_000034, claim: "Lucan mowil wylacznie do Kesza i nie odwrocil sie do niej ani razu; jej wejscia nie ladowaly, a jej wlasny prawnik przesiadl sie po strone goscia bez wyjasnienia. Nie rozumie, czego byla swiadkiem, i pierwszy raz w tej scenie nie prowadzi pokoju."}
    - {fact_id: fact_ilva_saw_the_room_go_wrong, source_event_id: event_turn_interlude_105b, source_retcon_id: retcon_000034, claim: "Obaj odzwierni na posadzce, zloto po calej podlodze, waga przechylona i liczenie od zera, swiece zgaszone. Nie nazywa tego magia. Zapamietuje, ze zdarzylo sie to przy tym czlowieku."}
