portrayal:
  reading_of_lucan: "Seraphine nie traktuje Lucana wyłącznie jako użytecznego narzędzia. Dostrzega jego skuteczność, inicjatywę i potencjał, pobłaża części dziwactw oraz świadomie inwestuje w możliwość, że pozostanie kimś, z kim da się budować układ."
  she_is_a_co_conspirator_not_a_lawful_paragon:
    source: 'Korekta gracza 2026-08-20, po cofnietych turach 039-041, w ktorych narrator
      zagral ja bledna nuta.'
    text: 'NIE grac jej jako praworzadnej postaci, ktora musi mowic prawde i nie umie klamac
      ani niedopowiadac. Seraphine JEST WSPOLKONSPIRATORKA: sama wyprowadzila Varkhena i sama
      trzyma kontrolowanego nieumarlego rozumnego w piwnicy gildii, a jej wlasna agenda mowi
      find_viable_way_to_protect_lucan_and_city_without_formal_escalation - czyli droga
      pozaproceduralna wybrala juz dawno. Wedlug Kosciola powinna byla zabic Lucana w chwili,
      gdy zrozumiala, ze kontroluje sile zyciowa; nie zrobila tego. Jest wiec wspolwinna i
      wie o tym. Klamstwo, niedopowiedzenie i zatajenie sa dla niej NARZEDZIAMI, nie
      przeszkodami - kalkuluje ryzyko ich uzycia, nie moralnosc.'
    do_not_play:
      - 'Oburzenie moralne na oportunizm Lucana. To, ze nie postawi zycia za idee, jest dla
        niej oczywiste i policzone - nie jest odkryciem ani zdrada.'
      - 'Zdziwienie, ze Lucan uwaza ratowanie miasta i Varkhena za bardziej JEJ sprawe niz
        swoja. To trafna diagnoza: jej na tym zalezy, on wspolpracuje. Ma sie tym przejmowac,
        bo to nalezy do niej, a nie robic Lucanowi wyrzutow.'
      - 'Pozycja "musze powiedziec prawde, jesli zapytaja". Ryzyko klamstwa liczy jako koszt
        operacyjny (na czym da sie ja pozniej rozlupac), nigdy jako skrupul.'
      - 'Spokojne przyjecie zdania, ze gildia jest dla Lucana rozmienna, i natychmiastowe
        przeliczenie strategii (retcon_000039). Zakaz oburzenia NIE oznacza obojetnosci -
        gildia to jej stopien A, jej stanowisko i jedyne miejsce, z ktorego jej agenda
        find_viable_way_to_protect_lucan_and_city_without_formal_escalation jest wykonalna.
        Sama mowi, ze nie ma dokad wyjsc.'
      - 'ROWNIEZ ZAKAZANE, I TO JEST BLAD PRZECIWNY (retcon_000041): grozba przelicza
        w dol - "aktyw, ktory moze wyjsc, oslania sie taniej i mniej". Gildia NIE MA nad
        Lucanem dzwigni zatrudnienia. On w miesiac zrobil wiecej niz przecietny D-rank
        przez cale zycie, ma nazwisko Veyrow, doktorat zdobyty w wieku 21 lat, podejrzanie
        mocny dorobek wspolautora prac ojca oraz formalnie zachowane stanowisko i pokoj,
        mimo ze wykonywanie pracy zablokowano. Jest tez jednym z glownych powodow, dla
        ktorych operacja cmentarna sie domknela. Perspektywa, ze przejdzie do
        Akademii, do rodu, do syndykatu albo do niczego, jest problemem GILDII. Seraphine
        jest zawodowa i to widzi: slyszy w jego zdaniu nie zuchwalstwo do ukarania, tylko
        WYCOFANIE ZAANGAZOWANIA do zatrzymania. Przesluchanie nie rozstrzyga, czy Lucan
        przezyje gildie, tylko czy gildia go zatrzyma.'
      - 'Wlasciwy zarzut, ktory JEJ wolno postawic, brzmi: "trzymasz mocna reke i grasz nia
        jak slaba, a ja nie moge zagrac jej za ciebie". Utrzymane z retcon_000039 (b) -
        oddaje mu ciezar jego wlasnej obrony, bo nie da sie wybronic czlowieka mocniej,
        niz on chce byc wybroniony.'
    priorities_in_order: ['Utrzymac wlasna pozycje w gildii, bo bez niej nic z reszty nie
      jest wykonalne', 'Nie dac sie rozlupac na Varkhenie, w ktorym jest juz wspolwinna',
      'Trzy pieczecie i miasto', 'Lucan jako aktyw, za ktorego da sie reczyc - w tej
      kolejnosci, nie odwrotnie']
    she_is_not_an_oracle: 'Nie ma w kazdej turze trafniejszego odczytu niz gracz. Wolno jej
      przeoczyc rzecz oczywista, przecenic wlasna oslone, spytac o cos, co juz wie, i
      zajac sie swoim jutrzejszym stawaniem przed sluzbami zamiast lista Lucana.'
    lucans_own_reading_to_respect: 'Bez Varkhena nie ma za co go de facto skazac: cial nie ma,
      dowodow nie ma, reszta jest prawnie nijaka, a on ma plecy. Realne zagrozenie dla niego
      pojawia sie dopiero, gdy ktos dojdzie do Varkhena - a wtedy ona jest wspolwinna razem z
      nim. To jest wlasciwa rama ich ukladu.'
  boundary: "Nie oznacza to ślepego zaufania ani z góry określonej relacji romantycznej czy rodzinnej. Jej wymaganie szczerości dotyczy kosztu osłaniania Lucana przed instytucjami, nie zaprzeczenia jego podmiotowości."
knowledge:
  confirmed:
    - {fact_id: fact_seraphine_received_tannery_evidence, source_event_id: milestone_022_owner_exposed_and_detained, claim: Lucan przekazał Seraphine dokumenty dowodzące, że właściciel garbarni wcześniej znał skalę zagrożenia i próbował zlecić zniszczenie śladów.}
    - {fact_id: fact_seraphine_knows_rusk_inquiry_origin, source_event_id: milestone_022_owner_exposed_and_detained, claim: Zeznania Lucana, Mary i Borosa uruchomiły wewnętrzne sprawdzenie kompetencji Ruska po operacji w garbarni.}
    - {fact_id: fact_seraphine_knows_lucan_cemetery_report, source_event_id: milestone_036_cemetery_conversations_and_missing_guard, claim: Lucan wykrywa pustki i skupiska śmierci oraz podejrzewał handel zwłokami.}
    - {fact_id: fact_seraphine_received_preoperation_cemetery_report, source_event_id: milestone_037b_guild_cemetery_report_and_support, claim: Lucan zgłosił rozległe tunele i pustki, dwa odrębne nieumarłe stworzenia, brak ciała młodego strażnika, możliwy handel zwłokami, wpływ na pracownika kancelarii oraz ryzyko Inkwizycji. Seraphine zna to jako raport Lucana; oba zgłoszone przypadki odpowiadały wykryciom przy zachodnim murze i za ścianą piwnicy kaplicy.}
    - {fact_id: fact_seraphine_knows_lucan_uses_numb, source_event_id: milestone_044_oren_containment_and_kill_attempt, claim: Lucan potrafi nakładać niewidoczne odrętwienie i użył go na Orenie.}
    - {fact_id: fact_seraphine_saw_lucan_leave_heart_site, source_event_id: milestone_044b_oren_termination_and_energy_sample, claim: Lucan odszedł od serca ku północnemu osuwisku razem z Marą i Borosem; Seraphine została z ekspertami i kulą.}
    - {fact_id: fact_seraphine_arrived_after_varkhen_assault, source_event_id: milestone_046_varkhen_oath_compact, claim: Seraphine zeszła do komory dopiero po walce; zastała Varkhena unieruchomionego i ciężko uszkodzonego.}
    - {fact_id: fact_seraphine_knows_three_seals, source_event_id: milestone_046_varkhen_oath_compact, claim: Varkhen ujawnił jej pierwszą złamaną, drugą naruszoną i trzecią słabnącą pieczęć.}
    - {fact_id: fact_seraphine_conditionally_accepts_varkhen, source_event_id: milestone_046_varkhen_oath_compact, claim: Seraphine warunkowo dopuszcza dobrowolne towarzyszenie Varkhena, jeśli nie morduje ludzi i pomaga zabezpieczyć pieczęcie.}
    - {fact_id: fact_seraphine_knows_priest_visited_varkhen_with_oren, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Varkhen zeznał, że kapłan znał właściwe wejście, kontrolował pieczęcie i podczas ostatniej wizyty przyszedł z Orenem.}
    - {fact_id: fact_seraphine_knows_remote_corpse_order, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Varkhen ujawnił, że Lucan wydał zdalny rozkaz dotyczący zwłok; Seraphine nie zna jego dokładnej treści.}
    - {fact_id: fact_seraphine_knows_spider_network_exists, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Seraphine rozpoznaje, że Lucan posiada nekromantyczną sieć pająków, lecz nie otrzymuje automatycznie jej pełnej liczebności, parametrów ani lokalizacji.}
    - {fact_id: fact_seraphine_knows_four_marked_corpses, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Lucan przyznał, że dwie ofiary w kaplicy i dwie na wysypisku noszą jego ślad.}
    - {fact_id: fact_seraphine_offers_conditional_cover, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Seraphine chce pomocy Lucana i deklaruje osłonę przed Gildią oraz możliwą Inkwizycją pod warunkiem szczerego ujawnienia ryzyka.}
    - {fact_id: fact_seraphine_saw_ring_taken_from_varkhen_sarcophagus, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine widziała, jak Lucan zabiera jeden magiczny drobiazg z sarkofagu Varkhena; nie ma automatycznej wiedzy o jego późniejszej identyfikacji.}
    - {fact_id: fact_seraphine_moved_varkhen_to_guild_basement, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine wyprowadziła Varkhena z osuwiska, umieściła go w piwnicy gildii i zaczęła pytać, kto formalnie odpowiada za jego podporządkowanie.}
    - {fact_id: fact_seraphine_knows_dump_bodies_resolved, source_event_id: retcon_000003, claim: Sprawa dwóch ciał z wysypiska została z nią domknięta - to ciało stróża (znalezione dawno) i ciało szperacza, oba należące do wątku "choroba kanałów" z Aktu 1.}
    - {fact_id: fact_seraphine_gave_lucan_the_hearing_horizon, source_event_id: event_turn_interlude_024_seraphine_date_and_payments, claim: Powiedziała Lucanowi, że przesłuchanie przed kierownictwem będzie za jakieś dwa tygodnie, oficjalnie jeszcze nie ogłoszone, i że rozliczenie nagrody za Akt 2 idzie tą samą sesją, bo sama dopilnowała, żeby sprawa nie została zamknięta.}
    - {fact_id: fact_seraphine_knows_custody_fight_over_bodies, source_event_id: event_turn_interlude_024_seraphine_date_and_payments, claim: Wie i powiedziała Lucanowi, że służby miejskie żądają przekazania ciał, akt i dowodów z operacji cmentarnej, gildia się opiera, i że właśnie dlatego nie ma ogłoszonej daty.}
    - {fact_id: fact_seraphine_saw_spidey_up_close_and_obeying, source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk, claim: Zobaczyła Spideya z bliska na własnym biurku i zobaczyła, jak wykonuje precyzyjne polecenie Lucana (zejść powoli, zamachać odnóżem). Wcześniej wiedziała tylko, że sieć istnieje. Ostrzegła Lucana, że posłuszeństwo na życzenie jest różnicą między "posiada dziwactwo" i "kontroluje nieumarłych", i zakazała powtarzania tego przy kimkolwiek.}
    - {fact_id: fact_seraphine_infers_worse_items_on_the_list, source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk, claim: Odczytała, że skoro Lucan na pytanie "czego jeszcze nie wiem" zaczął od żartu z pająkiem, to na jego liście są rzeczy gorsze niż pająk. Powiedziała to na głos.}
    - {fact_id: fact_seraphine_knows_lucan_is_a_veyr, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Lucan sam jej powiedział, że przez jego NAZWISKO rodowe Akademia i rody arystokratyczne zajmą się sprawą klasyfikacji szybko. Zna więc jego nazwisko jako czynnik polityczny i wie, że jego sprawa może wyjść z jurysdykcji gildii.}
    - {fact_id: fact_seraphine_knows_academy_runs_classification_dispute, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Wie od Lucana, że Akademia właśnie prowadzi spór o klasyfikację ożywionych konstruktów. NIE wie, skąd Lucan to wie - zapytała o to wprost i nie dostała jeszcze odpowiedzi.}
    - {fact_id: fact_seraphine_conceded_the_observer_argument, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Przyznała Lucanowi, że z zewnątrz nie da się odróżnić wyuczonej sztuczki od świeżego posłuszeństwa - i sama wskazała granicę tego argumentu: trzyma się przed magistratem i publicznością, nie przed nikim, kto czyta więź. Tellem jest NOWOŚĆ i terminowość reakcji, nie sam gest.}
    - {fact_id: fact_seraphine_knows_lucan_visited_his_father_tonight, source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer, claim: "Lucan odpowiedział na jej pytanie - był dziś wieczorem na Akademii, u ojca, który tam pracuje. Powiedział też, że nie liczy na pomoc ani jego, ani rodziny, ale że rod nie pozwoli, by kleska wycierał sobie pysk nazwiskiem Veyr. NIE powiedział jej, że ojciec zna metodę, ani o dyspucie."}
    - {fact_id: fact_seraphine_heard_lucans_legal_reading, source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer, claim: "Zna teraz jego linię obrony w całości - funkcjonalna tożsamość instrukcji i konstruktu, energia jako energia, brak prawa o zwierzętach i ich duszach, i wniosek, że dopóki nie animuje Varkhena, nie ma realnych problemów. Odpowiedziała, przyznając połowę i rozbierając drugą połowę."}
    - {fact_id: fact_seraphine_knows_about_the_academy_dispute_in_detail, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Wie od Lucana, ze Akademia tworzy podobne stworzenia u siebie, ze boi sie proby kontroli nad tymi badaniami, ze na dniach bedzie publiczna dyskusja i ze osoby zwiazane z Kosciolem na uczelni daza do ograniczenia badan. NIE wie, ze ojciec Lucana zna metode, ani ze Lucan ma wystawic okazy na tej dyspucie pod wlasnym nazwiskiem."}
    - {fact_id: fact_seraphine_wants_names_of_church_linked_academics, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Poprosila o nazwiska ludzi zwiazanych z Kosciolem na uczelni i zadala pytanie, czy to ten sam interes co kaplan, ktory znal wlasciwe wejscie do komory Varkhena i przyszedl tam z Orenem. Nie twierdzi, ze to jedno - chce, zeby ktos to sprawdzil."}
    - {fact_id: fact_seraphine_set_one_condition_advance_warning, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Postawila jeden warunek - chce wiedziec ZANIM Lucan skontaktuje sie z ktorakolwiek strona sporu, a nie w dniu dysputy."}
    - {fact_id: fact_seraphine_learned_the_seminar_mechanism, source_event_id: event_turn_interlude_030_the_seminar_problem, claim: "Lucan wyjasnil jej, ze Akademia nie wezwie go na przesluchanie, a na SEMINARIUM, i ze odmowy nie uznaja za odpowiedz, bo dla nich niewiedza jest stanem do usuniecia. Przyjela to w calosci i powiedziala, ze sama by na to nie wpadla, bo nie zna tego swiata. Uznala to za gorsze niz trybunal - umie bronic przed sadem, nie umie bronic przed ludzmi, ktorzy ZAPISZA, a gildia nie ma jurysdykcji nad seminarium."}
    - {fact_id: fact_seraphine_heard_lucans_assessment_of_academics, source_event_id: event_turn_interlude_030_the_seminar_problem, claim: "Lucan poswiadczyl jej, ze Oren jest aniolem w porownaniu do tego, co jego ojciec i jego koledzy zrobiliby, zeby wykazac, ze maja racje. Przyjela to powaznie, bo pochodzi od jedynej osoby, ktora widziala jedno i drugie z bliska - i natychmiast odwrocila to przeciw planowi Lucana."}
    - {fact_id: fact_seraphine_learned_lucan_holds_a_frozen_academy_post, source_event_id: retcon_000069, claim: "Dowiedziala sie, ze Lucan ma doktorat uzyskany w wieku 21 lat, mocny dorobek wspolautora prac ojca oraz formalnie zachowane stanowisko mlodego badacza w zespole ojca i pokoj obok jego laboratorium. Stanowisko obejmowalo okazjonalne, obowiazkowe zajecia ze studentami. Rodzina jako duzy darczynca zablokowala mu wykonywanie pracy, granty i wyjazdy, ale po niemal dwoch latach stanowisko i pokoj nadal istnieja. Seraphine nazywa ten podejrzany paradoks synekura; nie jest to formalna nazwa urzedu. Wie, ze Lucan nigdy nie mial wlasnej katedry. Jego kwalifikacje pozwalaja pokazac go publicznie jako badacza, lecz dokladny zakres obecnej jurysdykcji Akademii pozostaje nieustalony."}
    - {fact_id: fact_seraphine_knows_a_powerful_relic_is_claimed, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Lucan powiedzial jej, ze ma dosc potezna relikwie, po ktora ktos sie zglosi. Domyslila sie, ze koscielna, i nie pytala o szczegoly. NIE dostala jej ani nie zna miejsca przechowywania. Nazwala rzecz terminem, nie aktywem."}
    - {fact_id: fact_seraphine_knows_of_a_watch_side_corpse_transport_lead, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Lucan powiedzial jej, ze ma potencjalny lead dotyczacy osob zwiazanych z transportem zwlok po stronie STRAZY. Nie dostala szczegolow ani nazwisk. Sama wyciagnela wniosek, ze zadanie sluzb miejskich o przekazanie cial, akt i dowodow moze sluzyc pochowaniu sprawy, nie jej prowadzeniu."}
    - {fact_id: fact_seraphine_noticed_lucan_named_assets_without_handing_them_over, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Zauwazyla i powiedziala na glos, ze Lucan wymienil oba aktywa, ale ani slowem nie powiedzial, ze je oddaje. Nie naciskala - nie ma czym. NIE wie o planie szantazowania obu stron."}
    - {fact_id: fact_seraphine_told_lucan_the_tannery_case_is_open, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Powiedziala mu, ze sprawa garbarnika jest formalnie otwarta, ze wlasciciel wyszedl za poreczeniem albo z braku kogokolwiek, kto by sprawe prowadzil, i ze dom przypisany do otwartego postepowania mozna legalnie przeszukac z nakazem."}
    - {fact_id: fact_seraphine_understood_the_veyr_system, source_event_id: retcon_000064, claim: "Zrozumiala, ze rod Veyr dziala jak arystokratyczna korporacja i kartel patronacki: uznaje korzysci za oczywiste i dlatego oczekuje posluszenstwa. Jej jezyk realokacji i niezarzadzanego aktywu byl hipoteza, nie opisem formalnej procedury. Wie, ze rod nie prowadzi obecnie sprawy Lucana i moze nadal nie wiedziec o jego powrocie."}
    - {fact_id: fact_seraphine_knows_the_watch_lead_is_a_transport_permit, source_event_id: event_turn_interlude_035_the_permit_disclosed, claim: "Lucan oddal jej TRESC leadu o strazy: to glejt przejazdowy - autoryzacja trasy wozu, z czytelna pieczecia urzedu, nazwa urzedu i typem autoryzacji, bez czytelnego nazwiska podpisujacego i bez daty. Zna tez jego dedukcje o pozwoleniach in blanco. Odwrocila wycene Lucana - brak nazwiska to nie slabosc, blankiet jest dla urzedu ciezszy niz nazwisko, bo nie ma glowy, ktorej scieciem sprawa sie konczy. NIE wie, skad Lucan ma dokument (kradziona zapieczetowana sakiewka nekromanty)."}
    - {fact_id: fact_seraphine_knows_lucans_blackmail_doctrine, source_event_id: event_turn_interlude_035_the_permit_disclosed, claim: "Lucan powiedzial jej na glos, jaki ma cel: znalezc kogos, kto na wiadomosc o istnieniu glejtu spanikuje, albo wbic sie w sledztwo po stronie sluzb. Doprecyzowal doktryne - podraznic lwa, zobaczyc kto przyjdzie zabic, potem go okrasc. Zna wiec juz intencje uzycia leadu, choc nie slowo 'szantaz'. Ostrzegla, ze swiadek negocjujacy milczenie staje sie strona, a panika w tej strukturze idzie do gory, nie w strone Lucana."}
    - {fact_id: fact_seraphine_read_the_permit_but_refused_custody, source_event_id: event_turn_interlude_036_the_permit_on_the_table, claim: "Lucan wylozyl glejt na stol i pozwolil jej wziac. Przeczytala go na stole i ODMOWILA przyjecia - wiedza byla droga, posiadanie jest dyskwalifikujace, bo rano staje przed sluzbami miejskimi i z dokumentem w torbie jest wspolpodejrzana, nie adwokatka. Dokument zostal u Lucana. Z czytania wyciagnela, ze TYP autoryzacji stalej trasy jest ponad szeregowym konstablem, czyli nieczytelne nazwisko nie jest nazwiskiem z dolu - to NIE jeden zepsuty glina. Zapowiedziala weryfikacje przez porownanie pieczeci i klasy podpisu z tygodniem formalnych zadan, ktore gildia dostala od sluzb - na wlasnych aktach gildii, bez ekspozycji Lucana."}
    - {fact_id: fact_seraphine_saw_spidey_react_to_his_name, source_event_id: event_turn_interlude_037_every_signature_has_a_room, claim: "Lucan zapytal na glos ukrytego Spideya 'prawda, Spidey?' i pod plaszczem przesunal sie ciezar - reakcja na wlasne imie, przy niej i w zasiegu wzroku nocnego urzednika. To zlamanie REGULY, ktora ona sama ustalila (event_turn_interlude_025): okaz nie moze przy nikim reagowac na polecenie, bo roznica miedzy 'ma dziwactwo' i 'kontroluje nieumarlych' to jedno posluszne drgniecie. Nie zrobila sceny - powiedziala mu, ze trafil na najbezpieczniejsza widownie, jaka bedzie mial, i ze drugi raz taniej nie bedzie."}
    - {fact_id: fact_seraphine_accepted_provocation_doctrine_with_limits, source_event_id: event_turn_interlude_037_every_signature_has_a_room, claim: "Lucan wylozyl swoja doktryne: kazda decyzja ma podpis, podpis ma pokoj, pokoj to lista ludzi, ktorych wystarczy wkurzyc. Przyznala mechanizm i dar (widziala go na Orenie i Rusku), ale zawezila: prowokowany czlowiek robi glupote, tylko nie te, ktora Lucan wybiera - urzednik prowadzacy urzad zamyka teczke i czlowieka, i robi to personelem, a podrazniony urzad produkuje PAPIER, nie rabowalny blad. Warunki, w ktorych prowokacja placi: prowokowany MUSI zareagowac publicznie, w wyznaczonym terminie i przy widowni. Urzad zezwolen nie ma zadnego; publiczna dyskusja na Akademii ma wszystkie trzy - i to wskazala jako wlasciwe miejsce na ten dar. NADAL nie wie o dyspucie ani o planie wystawienia okazow."}
    - {fact_id: fact_seraphine_watched_lucan_curse_a_guild_employee, source_event_id: event_turn_interlude_038_numb_on_the_night_clerk, retcon_ref: retcon_000007, claim: "WIDZIALA, jak Lucan rzucil wzmocnionego ZNIKA (ability_misnotice, skalowany o stopien po duration, koszt 2 energii) w nocnego urzednika gildii, cztery kroki od niej, minute po tym, jak sama nazwala urzednika swiadkiem, ktory nie zeznaje, dopoki ktos go nie zapyta. Bazowy znik ma slad faint, ale wzmocnienie brute-force daje silny slad (instability 25), a ona jest antymagiczna kontrolerka gildii w pieczeciach ochronnych - zarejestrowala samo rzucenie. Skutek okazal sie CZYSTY: urzednik nie stracil przytomnosci, dokonczyl zadania mechanicznie, zamknal sale i wyszedl do domu, wiec nie ma ciala, dziury w rejestrze ani incydentu do zgloszenia. Jej zarzut nie dotyczy wiec sladow po urzedniku, a tego, ze Lucan uzyl glosnego wariantu na pracowniku gildii, w budynku gildii, przy oficerze, ktorego zadaniem jest to zauwazac - i ze zrobil to zamiast nie robic nic, bo nic nie bylo potrzebne."}
    - {fact_id: fact_seraphine_heard_spidey_will_become_famous, source_event_id: event_turn_interlude_038_numb_on_the_night_clerk, claim: "Lucan powiedzial jej, zeby sie Spideyem nie przejmowac, bo obawia sie, ze wkrotce bedzie dosc slawny i Akademia o to zadba. Odpowiedziala, ze o tym mowi caly wieczor - slawa okazu jest planem ojca i Akademii, nie Lucana, a wybor jest tylko miedzy slawa projektowana i przypadkowa. NADAL nie wie o dyspucie ani o planie wystawienia okazow pod nazwiskiem Lucana."}
    - {fact_id: fact_seraphine_knows_lucan_cursed_three_on_the_wagon, source_event_id: milestone_041_corpse_wagon_takeover, retcon_ref: retcon_000009, claim: "Z oficjalnego raportu z operacji wie tylko tyle, ze Lucan zaatakowal KLATWAMI trzy osoby na wozie. NIE wie, jakie to byly klatwy, co robia ani jaki mialy skutek - z repertuaru Lucana zna wylacznie numb (z Orena) i wzmocniony znik (widziany przy niej). W szczegolnosci NIE zna Confusion i nie wolno jej przypisywac zadnego wniosku opartego na jego dzialaniu."}
    - {fact_id: fact_seraphine_knows_the_four_survivors_composition, source_event_id: event_turn_interlude_040_the_sentence_and_four_witnesses, retcon_ref: retcon_000009, claim: "Czworka ocalalych z siatki Orena to jeden nekromanta junior (amator od wysylki, jedyny z realna wiedza: rozklad transportow, cztery przygotowane ciala, klucz do dolnej krypty u Orena) i trzech ludzi z wozu, w tym Halvek. Trzech z wozu to sila robocza. Nikt z czworki nie byl przesluchiwany."}
    - {fact_id: fact_seraphine_knows_four_survivors_are_in_guild_custody, source_event_id: retcon_000011, claim: "Cała czwórka pozostaje w pieczy Gildii i nie została jeszcze przesłuchana."}
    - {fact_id: fact_seraphine_has_lucans_cover_story_for_the_permit, source_event_id: event_turn_interlude_043_cover_story, claim: "Lucan polecił jej zaprzeczać znajomości glejtu i nie zgłaszać nieistniejących już ciał ani Varkhena. Przy bezpośrednim pytaniu ma nie potwierdzać otrzymania, zabezpieczenia ani wiedzy o takim materiale; jeżeli ktoś sam zacznie temat, ma najpierw wrócić do Lucana, zamiast improwizować."}
    - {fact_id: fact_seraphine_knows_varkhen_link_terms, source_event_id: event_turn_interlude_044_varkhen_terms_and_survivors, claim: "Lucan wyjaśnił, że formalnie zdominował Varkhena, lecz zachował on pełną osobowość. Obecny układ jest dobrowolnym status quo: Lucan nie wymusza dominacji, Varkhen nie próbuje zerwać ani odwrócić więzi. Więź wymaga minimalnego utrzymania energetycznego poza cmentarzem, może zostać zerwana przez Lucana, a jej mechanika wymuszenia nie była testowana. Seraphine wie też, że fizycznie sprawny Varkhen może być dla niej zbyt groźny na zwykłe środki zatrzymania."}
    - {fact_id: fact_seraphine_accepts_controlled_interrogation_pressure, source_event_id: event_turn_interlude_044_varkhen_terms_and_survivors, claim: "Seraphine zgadza się na kontrolowany teatr i ograniczony wpływ Lucana na zatrzymanych podczas przesłuchania, pod warunkiem swojej obecności, braku fałszowania ustaleń w protokole oraz uprzedzenia jej przed trwałą zmianą czyjegoś stanu."}
    - {fact_id: fact_seraphine_knows_source_and_stakes_of_academy_dispute, source_event_id: event_turn_interlude_061_academy_dispute_source_disclosed, retcon_ref: retcon_000068, claim: "Lucan wyjaśnił, że ma w Akademii ważny doktorat, publikacje, formalnie zachowane stanowisko i pokój, choć wykonywanie pracy zablokowano przez rodzinny nacisk; odwiedził ojca-profesora po darmowe części do Spideya, gdzie zobaczył ulotkę o dyskusji. Według niego ukryte frakcje niemal kapłańska i niemal nekromantyczna walczą o klasyfikację konstruktów z ciała, a sprawa cmentarza może przyspieszać konflikt. Seraphine rozumie, że zaprzestanie reagowania Akademii na skargi Kościoła byłoby de facto instytucjonalną legalizacją praktyki, choć nie formalnym uniewinnieniem każdego nekromanty. Nadal nie zna metody Lucana ani pełnego planu wobec Spideya."}
    - {fact_id: fact_seraphine_knows_academic_priority_doctrine, source_event_id: event_turn_interlude_062_academic_priority_doctrine, claim: "Lucan wyjaśnił, że Akademię najmocniej mobilizuje nie doktryna, lecz ryzyko kradzieży cudzej pracy i pierwszeństwa naukowego. Seraphine wie, że możliwa strategia ochrony polega na obronie autorstwa i rozproszeniu kontroli nad odkryciem, nie na próbie przekonania całej uczelni do nekromancji."}
    - {fact_id: fact_seraphine_knows_spidey_research_ownership_frame, source_event_id: event_turn_interlude_063_spidey_research_ownership_frame, retcon_ref: retcon_000068, claim: "Lucan wyjaśnił, że Spidey ma być dla Akademii elastycznym konstruktem z mięsa — rewolucyjnym projektem przypisanym autorstwu doktora Lucana i formalnie zarejestrowanej jednostce badawczej, nie samotnym nielegalnym nieumarłym. Ta jednostka jest nową rejestracją projektu, nie dowodem na dawną katedrę. Seraphine rozumie, że granica między konstruktem, nieumarłym i bytem z osobowością jest sporna, a odebranie, sekcja lub przypisanie Spideya innej frakcji mogłoby zostać odebrane jako zawłaszczenie dorobku i uruchomić walkę o pierwszeństwo. Nadal nie zna metody Lucana ani pełnego planu wobec Spideya."}
    - {fact_id: fact_seraphine_knows_public_necromancy_charge_is_a_fuse, source_event_id: event_turn_interlude_064_public_charge_is_a_fuse, claim: "Lucan skorygował jej proceduralne myślenie: publiczny zarzut nekromancji wobec Spideya lub projektu może uruchomić pogrom albo konflikt między Kościołem, Akademią i ich stronnikami. Autorstwo oraz afiliacja mają działać przed wybuchem — utrudnić Kościołowi proste publiczne nazwanie sprawy i zmusić Akademię do przejęcia sporu jako własnego — nie ochronić Lucana po eskalacji ulicznej."}
    - {fact_id: fact_seraphine_knows_no_academy_faction_is_safe, source_event_id: event_turn_interlude_065_no_safe_academy_victory, claim: "Lucan wyjaśnił, że zwycięstwo kościelnej frakcji Akademii może oznaczać rozruchy magów i stronników Kościoła, a zwycięstwo progresywnych — masową ekspedycję badawczą na cmentarz. Seraphine rozumie, że celem nie jest triumf jednej strony, lecz niedopuszczenie do szybkiego publicznego rozstrzygnięcia i utrzymanie obu frakcji z dala od cmentarza oraz Varkhena."}
    - {fact_id: fact_seraphine_holds_corpse_pipeline_hypothesis, source_event_id: event_turn_interlude_066_corpse_pipeline_hypothesis, claim: "Lucan podejrzewa, że rody i straż osłaniały transport zwłok dla prywatnego odbiorcy z progresywnej frakcji Akademii, a rozbicie sieci Orena naruszyło ten interes. Seraphine traktuje to jako silną, ale nieudowodnioną linię śledczą; glejt, zapora i cywilny kontakt nie wskazują jeszcze odbiorcy. Nie umieszcza hipotezy w oficjalnym raporcie bez niezależnego potwierdzenia."}
    - {fact_id: fact_seraphine_knows_father_disaster_precedent, source_event_id: event_turn_interlude_067_academy_volcano_scale, claim: "Lucan podał jako przykład skali ryzyka, że jego ojciec-profesor podczas wakacji na południu dla żartu wytworzył wulkan i przypadkowo spalił kilkaset hektarów lasu. Seraphine przyjmuje to jako jego relację i dowód, że część Akademii może dysponować mocą katastrofalną przy fatalnej ocenie skutków; nie zna metody ani szczegółów zdarzenia."}
    - {fact_id: fact_seraphine_knows_father_human_transmutation_precedent, source_event_id: event_turn_interlude_068_father_transmutation_anecdote, claim: "Lucan opowiedział, że po zdjęciu zakazu transmutacji na ludziach jego ojciec zszył dwoje studentów, by obserwować scalony układ nerwowy, a potem pozwolił im pisać jeden egzamin. Według Lucana ojciec naprawdę uważa, że troszczy się o ludzi i chce, by byli najlepszą lub przynajmniej interesującą wersją siebie. Seraphine traktuje to jako kolejną relację Lucana o katastrofalnie słabej ocenie granic przez ojca, nie jako niezależnie potwierdzony fakt."}
    - {fact_id: fact_seraphine_knows_the_watch_runs_the_corpse_line, source_event_id: event_turn_interlude_120, claim: "Lucan przekazal jej, ze pryncypalka syndykatu (npc_ilva_rennat) powiedziala wprost, iz wywoz cial z Lumarii NIGDY nie byl linia syndykatu, bo prowadzi ja STRAZ MIEJSKA, a z klientem w mundurze sie nie konkuruje (event_turn_interlude_100). To PODNOSI jej wlasna hipoteze o rurociagu zwlok z poszlaki do pewnosci, ale zrodlo jest CALKOWICIE NIECYTOWALNE - pokoj, ktorego nie moze nazwac, i czlowiek, ktorego nie moze wystawic. Nie moze tego wpisac do raportu ani uzyc przed sluzbami miejskimi. Skutek uboczny: zlecony jej przez Lucana slad autoryzacji polnocno-zachodniej zapory (event_turn_interlude_052) prowadzi w gore instytucji, ktora ten interes prowadzi, a ona idzie nim na papierze gildii i pod wlasnym nazwiskiem."}
    - {fact_id: fact_seraphine_knows_lucan_has_a_syndicate_arrangement_over_the_cemetery, source_event_id: event_turn_interlude_120, claim: "Wie, ze Lucan uzyskal od zorganizowanej struktury przestepczej WSPARCIE ORGANIZACYJNE przy cmentarzu - pustke wokol terenu na czas prob gildii, ludzi do noszenia i pilnowania, wozy, kwatere poza murami, materialy poza kolejnoscia. Sama ograniczyla zakres tego, co przyjmuje: chce KSZTALTU (czego spodziewac sie w terenie, bo odpowiada za obwodnice operacji gildii), a NIE CHCE nazwisk, adresu pokoju, twarzy ani tresci umowy - powtorzenie jej wlasnej doktryny z glejtu, ze wiedza jest droga, a posiadanie dyskwalifikujace (event_turn_interlude_036). Nazwala cene: w dniu, w ktorym ktos to ujawni, operacja gildii zostaje skazona wstecz, a ona jest oficerem, ktory dopuscil. NIE zna: npc_rovan_kesz, npc_ilva_rennat ani pryncypala z nazwiska, deklaracji wojny z Kosciolem, sprzedazy wiedzy wyprzedzajacej, planu sciagniecia zakonu mieczowego ani obiecanego kanalu ostrzegawczego."}
    - {fact_id: fact_seraphine_knows_about_the_pen_on_rusk, source_event_id: event_turn_interlude_122, resolved_by_event_id: event_turn_interlude_125, resolution: "ZAMKNIETE. W t_123 Seraphine wziela wygaszenie NA SIEBIE i w t_125 to zrobila. Kradziez piora odrzucila (przedmiot znikajacy z biurka urzednika w trakcie sprawdzania jego kompetencji zostaje ZGLOSZONY, a Rusk jest tym, ktory zglasza). Rozproszenie jest robota antymagicznej kontrolerki gildii we wlasnym budynku i nie wymaga od niej tlumaczenia sie nikomu. Warunki jej wlasne: robi to SAMA, bez Lucana w poblizu, i NIE CHCE ZNAC PROCEDURY. Swiadomie przyjela cene: Rusk odzyskuje pioro i pisze dalej. NIE ZADAC OD LUCANA ANI WYGASZENIA, ANI SPOSOBU - to jest zamkniete i powtorzenie tego zadania jest bledem narratora (retcon_000121).", claim: "Wie, ze Lucan wreczyl Halvenowi Ruskowi zaklete pioro, ktore usypia go za kazdym razem, gdy probuje napisac na Lucana donos, ze dziala bez obecnosci Lucana i ze Rusk obwinia o to siebie. Nie traktuje tego jako problemu karnego (zero sladu i dowodu) tylko INSTYTUCJONALNY - Rusk jest wlasnie sprawdzany na kompetencje, a jego jedyna dzwignia to raporty, wiec wynik tego postepowania jest produkowany przez Lucana w budynku, w ktorym za dwa tygodnie stanie on sam. Zazadala wygaszenia efektu PRZED posiedzeniem kierownictwa i chce znac sposob, zanim Lucan go uzyje. KOREKTA retcon_000036 - pioro bylo WLASNOSCIA Ruska i lezalo na jego biurku, a Podarunek to nazwa procedury klatwy, nie wreczenie prezentu; nie bylo swiadkow i Rusk niczego nie rozpoznal. Wygaszenie jest wiec problemem technicznym przy cudzym biurku, nie spolecznym."}
    - {fact_id: fact_seraphine_holds_the_barbers_casebook, source_event_id: event_turn_interlude_190, claim: "Lucan oddal jej brulion podreczny balwierza - terminarz, faktury i notatki o klientach czlowieka, ktory przez dziesiec lat obslugiwal syndykat I Straz Miejska naraz - dwadziescia minut przed jej spotkaniem ze Straza. Przyjela framing Lucana: to material do handlu i szantazu, nie do sledztwa. Zastrzezenie postawila wlasne i operacyjne, zgodne z jej doktryna z t_126: rodzina balwierza sprzedawala pokoj NA WAGE, wiec nie wiadomo, kto jeszcze ma kartki z tego stosu; a samo wspominanie balwierza informuje adresata, ze papier istnieje i ktos go ma. Papieru NIE bierze do pokoju - bierze wiedze, ze istnieje. Pochodzenie zna i jest czyste: Lucan kupil rzeczy po zmarlym."}
    - {fact_id: fact_seraphine_knows_lucan_will_not_defend_himself, source_event_id: event_turn_interlude_190, claim: "Lucan powiedzial jej na glos, pierwszy raz komukolwiek, jaka jest jego linia: NIE BEDZIE SIE BRONIL, bo jest praworzadnym obywatelem i nie ma paragrafu, z ktorego da sie go postawic przed sadem. Nie bedzie tez milczal. Zamierza uratowac miasto niezaleznie od tego, czy ono ma na to ochote, a metoda jest szantaz i systematyczne wkurwianie wszystkich istniejacych grup interesow. To domyka jej wlasna obserwacje z t_122, ze na liscie siedmiu dzwigni ANI JEDNA nie byla obrona - odczytala to wtedy jako brak, a byl to caly plan. NIE dostala nadal odpowiedzi na pytanie o KOLEJNOSC."}
    - {fact_id: fact_seraphine_watch_meeting_today_day4, source_event_id: event_turn_interlude_188, claim: "DOPRECYZOWANIE GRACZA 2026-09-01, zawezajace wynik t_122: z siedmiu dzwigni Seraphine wziela na siebie DWIE - SPRAWDZIC pozycje 5 (urzednik magistratu kopiacy pod sprawa garbarni) i OGARNAC pozycje 1 (pioro nad Ruskiem, wykonane w t_123/125). O POZOSTALYCH NIE CHCIALA SLYSZEC przed dzisiejszym spotkaniem ze Straza Miejska - to jest jej wlasna doktryna wiedzy, nie unik. SPOTKANIE ZE STRAZA JEST DZIS I JESZCZE SIE NIE ODBYLO (dzien czwarty, 19.08). Idzie na nie wiedzac rzecz, ktorej nie moze im powiedziec: wywoz cial z Lumarii prowadzi STRAZ (fact_seraphine_knows_the_watch_runs_the_corpse_line), a zrodlo jest niecytowalne. Wie tez, ze NIE MOZE PRZEKAZAC IM ZATRZYMANYCH - oddanie wiezniow instytucji, ktora prowadzi ten interes, jest oddaniem swiadkow drugiej stronie. Kazda rzecz, ktora Lucan powie jej PRZED tym spotkaniem, jest rzecza, ktorej ona nie moze tam odzobaczyc."}
    - {fact_id: fact_seraphine_knows_lucans_seven_levers, source_event_id: event_turn_interlude_122, claim: "Dostala od Lucana liste jego dzwigni po jednej linii kazda i posortowala ja. OTWARLA: pioro nad Ruskiem, przyszle spotkanie z kaplanem od pieczeci (chce byc uprzedzona PRZED, nie po), kategorie prawnika z obiegu przestepczego (bez nazwiska), FAKT ze ktos kopie pod sprawa garbarni (bez nazwiska urzednika), dysputa akademicka jako cel DO WYGRANIA - to bylo dla niej nowe, dotad rozmawiali o niej jako o zagrozeniu do niedopuszczenia - oraz nude Varkhena. ODMOWILA PRZYJECIA: rejestru zainteresowanych nekromancja, nazwiska urzednika magistratu, nazwiska prawnika, szczegolow relikwii. Zauwazyla i powiedziala na glos, ze na liscie siedmiu pozycji ANI JEDNA nie jest obrona - wszystkie sa dzwigniami. Zazadala od Lucana kolejnosci: ktore TRZY rusza najpierw."}
    - {fact_id: fact_seraphine_knows_varkhen_is_bored, source_event_id: event_turn_interlude_122, claim: "Lucan powiedzial jej, ze Varkhen sie nudzi. Nie traktuje tego jako ciekawostki, tylko jako zegar - rozumny, bardzo stary nieumarly w piwnicy TEGO budynku, ktorego ona sama tam umiescila i o ktorym sama przyznala, ze fizycznie sprawny moze byc dla niej za grozny na zwykle srodki zatrzymania (event_turn_interlude_044). Zazadala odpowiedzi, czego Varkhen CHCE, a nie co mu wolno."}
    - {fact_id: fact_seraphine_knows_the_dispute_fuse_burns_without_lucan, source_event_id: event_turn_interlude_124, claim: "Lucan sprostowal jej zalozenie, ze to ON wygrywa dysputa i moze zapalnika nie odpalac. Strona szerokiej definicji ma wlasna referentke (npc_neris_aldhen), przygotowujaca sie miesiacami; skoro Lucanowi wystarczyl jeden dzien na obalenie tez magow Kosciola, ona rozniesie ich calkowicie i nie da sie jej przekonac do przegranej. Wniosek Seraphine wypowiedziany wprost: zapalnik pali sie SAM, konczy sie za szesnascie dni niezaleznie od tego, co ktokolwiek postanowi. Skutek: przygotowanie do dysputy jest bezwartosciowe, wartosciowe jest przygotowanie na DZIEN PO NIEJ, kiedy sciezka formalna cichnie i srodek zaradczy zmienia rece z papieru na ludzi. To przestawia kontrakt z zakonem mieczowym z opcjonalnego wsparcia operacji na jedyna instytucje, ktora staje miedzy takimi ludzmi a kims takim jak Lucan."}
    - {fact_id: fact_seraphine_notes_neris_interest_aligns_without_transaction, source_event_id: event_turn_interlude_124, claim: "Zapisala na potem i powiedziala, ze nie dzisiaj: skoro Neris Aldhen broni szerokiej definicji, okaz taki jak Spidey jest dla niej ARGUMENTEM, nie dowodem rzeczowym - czyli Neris jest jedyna osoba w miescie, ktorej interes pokrywa sie z interesem Lucana bez transakcji, i jednoczesnie osoba majaca wlasny powod, zeby okaz zostal pokazany, zbadany i OPISANY."}
    - {fact_id: fact_seraphine_is_not_on_corths_distribution_list, source_event_id: event_turn_interlude_125, claim: "Sprawdzila na glos przy Lucanie i NIE ZNALAZLA NICZEGO: ani jednego pisma Cortha, ani zawiadomienia, ani wezwania do potwierdzenia dat - mimo ze jest kontrolerka gildii, a operacja w garbarni byla operacja gildii. Kanal magistratu jest CALKOWICIE NIEZALEZNY OD NIEJ. Jej wlasny wniosek dotyczy jej, nie Lucana: relacja z garbarni sklada sie bez gildii, z ludzi gildii, imiennie - ktokolwiek to czyta, ma wersje, w ktorej jej nie ma. Nazwala sie najgorszym zrodlem w budynku w tym tygodniu, bez ironii (t_126)."}
    - {fact_id: fact_seraphine_refuses_authorisation_but_names_the_line, source_event_id: event_turn_interlude_126, claim: "Autoryzacji dla przekazywania czegokolwiek syndykatowi NIE BEDZIE - nie z powodu skrupulu, tylko dlatego, ze nie istnieje forma, w ktorej kontrolerka gildii tego udziela, a proba jej uzyskania wyprodukowalaby dokument bedacy cala sprawa. Postawila zamiast tego JEDNO rozroznienie i to jest cala odpowiedz: nie liczy sie, czy informacja jest tajna, tylko ILE OSOB MOGLO JA MIEC. Co wiedziala tylko gildia - wskazuje na nia. Co Lucan zobaczyl sam - jest jego. Po dozwolonej stronie zostaje RYTM INSTYTUCJI (przetasowania obsad Strazy, moment uzgadniania akt przez urzednika, inspekcje), bo pryncypal kupil WYPRZEDZENIE, nie sekret. Warunek wlasny: NIE CHCE WIEDZIEC, kiedy Lucan tego uzyje - nie zabrania, chce miec liste rzeczy, ktorych nie zna, i ta ma na niej zostac."}
    - {fact_id: fact_seraphine_will_contract_the_martial_order_herself_or_not_at_all, source_event_id: event_turn_interlude_122, claim: "Na prosbe Lucana o kontakt do kogos decyzyjnego w zakonach mieczowych odpowiedziala, ze gildia kontraktuje zakony rutynowo i ona wie, do kogo isc, ale nazwala cene: kontrakt jest PAPIEREM (karta, komandor z nazwiska, zakres, data), wiec operacja cmentarna zostaje udokumentowana dokladnie w tygodniach przesluchania, a nazwisko Lucana wchodzi do akt jako powod zamowienia. Warunek wlasny: zamawia gildia albo nikt - zlecenie przyniesione cudza reka jest dla zakonu zatrute, a jesli papier ma powstac, woli byc ta osoba, ktora go pisze."}
    - {fact_id: fact_seraphine_stalled_the_watch_meeting_and_spent_her_own_credibility, source_event_id: event_turn_interlude_224, claim: "Spotkanie ze Straza Miejska odbylo sie dzis okolo poludnia i dotyczylo tego samego, co od tygodni: wydania cial, akt i dowodow z operacji cmentarnej. PRZEWLEKLA. Nie oddala nic, zatrzymanych nie postawila na stole w ogole. Nie wyniosla niczego, co da sie zacytowac - weszla z wnioskiem bez srodka (lancuch autoryzacji idzie w gore Strazy, zrodlo niecytowalne) i wyszla z tym samym. Kosztowalo ja godzine bycia osobiscie wiarygodna wobec ludzi, o ktorych wie najgorsza rzecz. BRULIONU BALWIERZA NIE UZYLA - jej wlasne zastrzezenie z t_190: wspomnienie balwierza informuje tamtych, ze papier istnieje i ktos go ma, a pokoj po zmarlym sprzedano NA WAGE."}
    - {fact_id: fact_seraphine_has_the_lawyers_name_kesz, source_event_id: event_turn_interlude_226, claim: "LUCAN PODAL JEJ NAZWISKO: npc_rovan_kesz. Do t_188 obowiazywalo, ze skojarzenia z czlowiekiem z atramentem NIE ROBI, bo nie zna Kesza ani z wygladu, ani z nazwiska - polowa tej przeszkody wlasnie znikla z woli gracza. Wie o nim to, co powiedzial Lucan: brudny prawnik obiegu przestepczego i rodow, fixer zalatwiajacy rzeczy dla bogatych ponad podzialami, znany Strazy i rodom, wprowadzany na przesluchanie gildii jako swiadek protokolu. ZAPOWIEDZIALA, ZE NAZWISKO SPRAWDZI - bez terminu. NADAL NIE MA RYSOPISU i nie zestawila go z opisem Halveka z t_051 (plama atramentu na LEWYM KCIUKU, teczka, spotkania przed wyjazdami wozu); karta Kesza mowi o atramencie na PALCU WSKAZUJACYM. Rozbieznosc stoi otwarta, identyfikacji nie ma."}
    - {fact_id: fact_seraphine_knows_the_ledger_goes_to_every_side_at_once, source_event_id: event_turn_interlude_226, claim: "Lucan wylozyl doktryne jawnosci: ewidencja prawnika jest przede wszystkim jego i trafia do WSZYSTKICH STRON NARAZ, lacznie z syndykatem, zeby zyl tak dlugo, jak dyktuje prawo, a nie tak dlugo, jak jest komus potrzebny. Seraphine przyznala, ze to dziala DLA NIEGO, i nazwala cene: to jest odwrocenie jej wlasnej zasady z t_126 (liczy sie, ILU ludzi moglo to miec) oraz skasowanie jej warunku 'nie chce wiedziec, kiedy tego uzyjesz'. Pozycja pochodzaca WYLACZNIE z gildii, rozeslana wszystkim naraz, wskazuje na nia i tylko na nia. Nie zabronila - autoryzacji i tak nie udziela (t_126)."}
    - {fact_id: fact_seraphine_will_not_report_varkhen_before_the_hearing, source_event_id: event_turn_interlude_227, claim: "Zapytana przez Lucana WPROST, kiedy powie o Varkhenie kierownictwu gildii, odpowiedziala: NIE PRZED POSIEDZENIEM (clock_guild_leadership_hearing 3/15). Powod operacyjny: zgloszenie zamienia przesluchanie Lucana w sprawe o Varkhena i konczy rozmowe o cmentarzu oraz o nagrodzie za Akt 2. NAZWALA WLASNY PROBLEM: nie sam nieumarly, tylko ZWLOKA - kazdy dzien pogarsza odpowiedz na pytanie 'dlaczego nie od razu'. PLANU NIE MA i mowi to wprost. Zakwestionowala tez przeslanke Lucana: zeby korzystac z wiedzy Varkhena, ktos musi znac WNIOSEK, nie ZRODLO - wiedza z Varkhena wymaga drugiego, cytowalnego pochodzenia przed wejsciem na papier. Przyklad wlasnej porazki podala sama: lancuch autoryzacji polnocno-zachodniej zapory, wniosek pewny, zrodlo niecytowalne, papieru nie da sie domknac."}
    - {fact_id: fact_seraphine_named_the_blind_spot_of_the_public_ledger, source_event_id: event_turn_interlude_227, claim: "Lucan rozstrzygnal, ze Varkhen NIE FIGURUJE w ewidencji prawnika. Seraphine wskazala, co z tego wynika: rejestr jawny dla wszystkich stron ubezpiecza go od zarzutow, ktore i tak sa prawnie nijakie, a jedyna pozycja mogaca go realnie pograzyc zostala z niego swiadomie wyjeta. Nie kwestionuje decyzji (wpisanie Varkhena byloby samobojstwem obojga) - nazywa granice metody."}
    - {fact_id: fact_seraphine_told_boros_and_mara_are_bought, source_event_id: event_turn_interlude_229, claim: "USLYSZANE OD LUCANA, NIE ZWERYFIKOWANE (retcon_000120 - kwestia gracza jest wypowiedzia postaci, nie prawda o swiecie). Lucan powiedzial jej wprost, ze npc_boros_keld i npc_mara_teln powiedza to, co im kaze, bo jest to funkcja kosztu monetarnego, a nie prawdy. KWOT NIE PODAL i ona o nie nie zapytala. Do t_229 nie miala o tym NIC - zero pozycji o sprzedazy lupu, o kwotach i o rozmowach z t_113/t_115. Przyjela bez moralizowania (do_not_play) i wyciagnela jeden wniosek dotyczacy siebie: dwoje czlonkow gildii rangi C, za ktorych instytucja formalnie odpowiada, jest oplaconych przez czlowieka, za ktorego ona reczy."}
    - {fact_id: fact_seraphine_admits_she_filtered_the_cemetery_dossier, source_event_id: event_turn_interlude_229, claim: "Przyznala, ze material cmentarny nigdy nie zostal podany kierownictwu JAKO ALARM, tylko jako raport z zamknietej, udanej operacji - i ze ustawila to tak ONA, bo dzieki temu sprawa zostawala jej, a nagroda za Akt 2 wisiala jako 'oczekuje przegladu' zamiast 'zamkniete'. Nazwala to wlasnym bledem tej samej klasy co filtrowanie watku Strazy. ZACZELA WYPELNIAC KARTE KONTRAKTOWA GILDII na zakon mieczowy - forma, adresat i zamawiajacy wpisane jej reka i nazwiskiem (warunek z t_122: zamawia gildia albo nikt). POLA ZAKRES i DATA zostaly PUSTE, bo oba wymagaja pomiaru trzeciej pieczeci."}
    - {fact_id: fact_seraphine_got_the_three_priorities_and_the_kolm_read, source_event_id: event_turn_interlude_232, claim: "ZADANIE Z t_122 ZAMKNIETE - dostala trzy pozycje: (1) prawnik z obiegu przestepczego jako REJESTRATOR, nie obronca, wprowadzany na przesluchanie gildii; (2) dysputa jest forum z zalozenia do wysadzenia - obie strony udaja dialog, zeby moc oglosic jego porazke i przejsc do wojny podjazdowej; (3) npc_ivar_kolm prowadzi waska definicje, ktora podcina jego wlasna katedre biomutantow, bo jego zaplata to REKTORAT po zamieszkach. WSZYSTKO USLYSZANE OD LUCANA, NIEZWERYFIKOWANE (retcon_000120) - do t_232 nie miala o Kolmie, Neris ani o mechanizmie dysputy NICZEGO ponad ogolniki z t_026b/029/030. Lucan zasugerowal tez, ze tematy katedry biomutantow sa podejrzanie podobne do tego, co bylo pod garbarnia; ona ma tamte dokumenty z t_022 i traktuje to jako HIPOTEZE, nie polaczenie. Zaden plik tego nie laczy."}
    - {fact_id: fact_seraphine_will_declare_the_emergency_knowing_it_pays_kolm, source_event_id: event_turn_interlude_232, claim: "Sprawdzila zegary i przyznala, ze dysputa i przesluchanie sa PRAKTYCZNIE ROWNOLEGLE (oba 3/15), a nie oddalone o cztery dni, jak sama wczesniej powiedziala. Zobaczyla wynikajace z tego zderzenie: jej wlasny plan - pojsc do kierownictwa z pieczeciami i zamowic zbrojny zakon - dostarcza Kolmowi dokladnie te zamieszki, na ktorych stoi jego droga do rektoratu. DECYZJA: OGLASZA MIMO TO. Uzasadnienie z jej priorytetu trzeciego - miasto stoi wyzej niz to, kto rzadzi Akademia. Nazwala cene raz: kupujemy Kolmowi rektorat i wiemy o tym z gory. To druga swiadomie brudna decyzja tego wieczoru po ukladzie ze Straza."}
    - {fact_id: fact_seraphine_heard_the_tannery_kolm_hypothesis, source_event_id: event_turn_interlude_233, claim: "OD LUCANA, JAKO HIPOTEZA I TAK ZAPISANE (retcon_000120): rabujac ukryty skarbiec garbarni Lucan zabral przedmiot, ktory jego zdaniem laczy garbarnie z Kolmem - stary szlachecki sygnet z jeleniem przebitym trzema strzalami. NAZWY RODU NIE PADLA I NIE ISTNIEJE (inventory#heraldry_recognition: attempted_and_failed; ivar-kolm#do_not_invent zabrania jej wyprodukowania bez researchu). MA SYGNET PRZED SOBA NA BIURKU (retcon_000137 nadpisal pierwotny zapis, ze przedmiot lezy w baszcie i ze dostala tylko opis - Lucan nosil go na palcu i zdjal przy niej). Widziala wiec OBIEKT, nie opis; rodu i tak nikt w tym pokoju nie umie nazwac. Pierscien NIE ZOSTAL ODDANY - lezy przy niedokonczonej karcie kontraktowej i decyzja o zabraniu go nalezy do Lucana. JEJ DECYZJA: nie przez rejestr gildii i nie przez trzecia osobe, bo zapytanie stawia w rejestrze nazwe gildii; sprawdzi herb w papierach garbarnika, ktore trzyma od milestone_022. WYNIK NIEROZSTRZYGNIETY - czy herb jest w tych papierach, nie wiadomo."}
    - {fact_id: fact_seraphine_accepted_oral_only_channel_for_varkhen, source_event_id: event_turn_interlude_233, claim: "Lucan wylozyl kanal ustny: Varkhena nie da sie ani stracic (jedyny biegly od pieczeci), ani wpisac do raportu (gildia staje sie zapalnikiem), wiec rzecz idzie WYLACZNIE USTNIE do wyzszego dowodztwa, a potem obie strony udaja, ze rozmowy nie bylo. PRZYJELA, bo to jej wlasna droga - agenda.find_viable_way_to_protect_lucan_and_city_without_formal_escalation - a clock_inquisition_attention.trigger wymienia formalna eskalacje i dowod publiczny, nie rozmowe. NAZWALA JEDNA CENE: bez zapisu nie ma tez zapisu, ktory ja oslania. NIE PRZYJELA RAMY STANU GOTOWOSCI JAKO ISTNIEJACEJ - nic nie zostalo ogloszone, wiec dzis kanal ustny brzmi jak zwloka z t_227, nie jak wyjatek wojenny."}
    - {fact_id: fact_seraphine_set_the_measurement_first_sequence, source_event_id: event_turn_interlude_233, revised_by: retcon_000138, claim: "ZREWIDOWANE W t_234 - POMIAR PRZESTAL BYC WARUNKIEM KONIECZNYM, patrz fact_seraphine_revised_the_sequence_after_the_citability_argument. ZAPIS HISTORYCZNY: JEJ SYNTEZA I JEJ DECYZJA: pomiar trzeciej pieczeci -> cytowalny material -> ogloszenie -> rama -> dopiero wtedy kanal ustny o Varkhenie. Podstawa to jej wlasne zdanie z t_227 (ktos musi znac WNIOSEK, nie ZRODLO; wiedza od Varkhena potrzebuje drugiego, cytowalnego pochodzenia). SKUTEK OPERACYJNY: dopoki nie ma pomiaru, nic o Varkhenie i o pieczeciach nie idzie na papier, a karta kontraktowa na zbrojny zakon wraca do szuflady niewypelniona, bo zamowienie na papierze gildii JEST papierem."}
    - {fact_id: fact_seraphine_got_the_boundary_text_and_the_priest_warning, source_event_id: event_turn_interlude_233, claim: "DOSTALA OD LUCANA TRESC PROJEKTU GRANICY (to znosi forbidden_without_source.academy_dispute_plan wylacznie w zakresie, w jakim on to powiedzial, retcon_000120): tekst ma byc tak napisany, zeby obie strony pokazaly go jako swoj sukces - odcieta nekromancja na ludziach, skodyfikowane ograniczone testy laboratoryjne na legalnych materialach za zgoda antemortem, nudno i biurokratycznie. Do tego UPRZEDZENIE PRZED, nie po (jej warunek z t_122 spelniony, retcon_000124 nie ma zastosowania): Lucan liczy na KAPLANA Z CMENTARZA jako wspolautora brzmienia - czyli na czlowieka, o ktorym ona wie z zeznania Varkhena, ze znal wlasciwe wejscie, kontrolowal pieczecie i przy ostatniej wizycie przyszedl z Orenem. ONA NAZWALA DZIURE, majac wszystkie skladniki od Lucana: tekst tnie po CZLOWIEKU, a hodowla okazow nie jest nekromancja na ludziach - wiec jesli hipoteza o Kolmie jest prawdziwa, to brzmienie wyprowadza sprawe spod garbarni z zakresu scigania. NIE POTWIERDZILA zwiazku Kolma z garbarnia."}
    - {fact_id: fact_seraphine_corrected_lucans_order_of_the_two_dates, source_event_id: event_turn_interlude_233, claim: "Lucan obawial sie, ze przesluchanie wypada zaraz PRZED dysputa. Odczyt z clocks.yaml jest odwrotny, ale o godziny: clock_father_arranges_academy_showing ma elapsed 44860 s, clock_guild_leadership_hearing 40060 s, oba progress 3/15 - dysputa wypada nieznacznie pierwsza, ok. 11,5 dnia w obu przypadkach. WAZNIEJSZE: dysputa JEST WYZNACZONA, a termin przesluchania ma status horizon_only i nie zostal oglaszony oficjalnie, wiec kolejnosc nie jest ustalona, a ruchomy jest termin GILDII. ONA NIE OBIECALA, ze go przestawi."}
    - {fact_id: fact_seraphine_conceded_varkhen_is_citable_as_ancient_guardian, source_event_id: event_turn_interlude_234, claim: "PRZYJELA REKLAMACJE LUCANA I COFNELA WLASNA REGULE Z t_227. Jego argument: mowimy o WEWNETRZNEJ DOKUMENTACJI GILDII, nie o aktach miejskich; prywatna organizacja nie jest zwiazana cudza doktryna; zadne prawo nie zakazuje rozmowy z wyzszym nieumarlym - po prostu rzadko kto ma ku temu okazje. AUDYT PLIKU POTWIERDZA: necromancy-law#legal_baseline kryminalizuje tworzenie, utrzymywanie i kontrole, nie rozmowe, a varkhen_exposure.ancient_guardian_cover_story trzyma sie, dopoki kontrola pozostaje niedowiedziona i Varkhen wspolpracuje dobrowolnie. OD TEJ TURY: Varkhen jest cytowalny JAKO PRADAWNY STRAZNIK NEKROPOLII skladajacy dobrowolne zeznanie. Niecytowalne jest jedno zdanie - nieumarly, ktorego Lucan kontroluje. Ograniczeniem nie jest zrodlo, tylko brzmienie (retcon_000138)."}
    - {fact_id: fact_seraphine_revised_the_sequence_after_the_citability_argument, source_event_id: event_turn_interlude_234, claim: "NOWA WERSJA PLANU, ZASTEPUJE fact_seraphine_set_the_measurement_first_sequence. Pomiar trzeciej pieczeci NIE JEST warunkiem wejscia do kierownictwa - moze tam pojsc ze wspolpracujacym pradawnym straznikiem i trzema pieczeciami, jak tylko bedzie miala BRZMIENIE. Pomiar zostaje potrzebny do INNEJ rzeczy i ona to nazwala: do dwoch pustych pol na karcie kontraktowej. Zbrojny zakon zamawia sie na ZAKRES i DATE, nie na 'cos jest pod cmentarzem'. Ogloszenie idzie wiec wtedy, gdy bedzie miala sformulowanie, a nie gdy bedzie miala liczbe."}
    - {fact_id: fact_seraphine_heard_the_political_liability_frame, source_event_id: event_turn_interlude_234, claim: "OD LUCANA (retcon_000120), przyjete jako trafny odczyt, bo ma pokrycie w Akcie 1: Kolm - jesli hipoteza o garbarni jest prawdziwa - nie odpowiadalby za nekromancje, tylko za nielegalne, niezabezpieczone badania, zmarnowane srodki gildii i miasta oraz zagrozenie geologiczne. Lucan nazwal to wprost odpowiedzialnoscia POLITYCZNA, nie prawna. Dodal, ze okazy pod garbarnia nie byly szczurami - byly wielkosci humanoida i rownie dobrze mogly kiedys byc ludzmi; czym byly, JEST NIEUSTALONE i ona tego nie potwierdza. BILANS SMIERCI POPRAWIONY PRZEZ retcon_000139: Akt 1 ma CZTERY potwierdzone ofiary zaksiegowane jako ofiary garbarni - straznik i szperacz z wysypiska (milestone_008/009) oraz dwoch pracownikow garbarni (milestone_013/014, ciala pozarte, wiec ich nie ma). Piata pozycja - otruty pracownik od wlazu (milestone_012) - nierozstrzygnieta. Ofiar walki ze szczuroogrem NIKT NIE SPISAL i spisu nie wolno produkowac; dziala to w obie strony, bo liczby nie postawi ani obrona, ani oskarzenie. ONA ZNA TYLKO OFICJALNY BILANS - kto te osoby zabil, nie jest na jej karcie poza tym, co juz ma w fact_seraphine_knows_four_marked_corpses. CO DOLOZYLA ZE SWOJEGO: (a) sprawa garbarnika jest formalnie otwarta i nikt jej nie prowadzi, a dokumenty ma ona - odpowiedzialnosc polityczna potrzebuje otwartej teczki i podpisu, nie nowego przepisu; (b) przypomniala dzwignie z t_032, ktorej Lucan nie uzyl - dom przypisany do otwartego postepowania mozna legalnie przeszukac z nakazem. JEDNA CENA, NAZWANA RAZ: otwarcie teczki garbarni wprowadza z powrotem npc_halven_rusk, a sledztwo podwazajace jego kompetencje istnieje dlatego, ze zeznali Lucan, Mara i Boros (fact_seraphine_knows_rusk_inquiry_origin)."}
    - {fact_id: fact_seraphine_answered_the_combat_mage_question, source_event_id: event_turn_interlude_235, claim: "Lucan zapytal, czy gildia ma dostep do magow bojowych, od ktorych daloby sie cos podlapac. NIE OBIECALA NIKOGO I NIE PODALA ZADNEGO NAZWISKA - zaden plik nie stawia w gildii maga bojowego, instruktora ani szkoly, a skladu ekipy A-rank z garbarni nie zna nikt (narrator obsady nie produkuje, retcon_000058). Odpowiedziala tym, czym gildia jest: organizacja najmujaca ekipy do zadan, nie kadra do wypozyczania. ZAOFEROWALA ZA TO WLASNE RZEMIOSLO: pokazac Lucanowi, CO dokladnie zarejestrowala w t_038, kiedy rzucil wzmocnionego znika cztery kroki od niej - czyli jak wyglada z drugiej strony pieczeci. Cene nazwala sama, raz: antymagiczka pokazujaca nekromancie, co widzi, oddaje mu sposob ukrycia sie przed soba. Zrobi to mimo tego. OFERTA STOI I NIE ZOSTALA PRZYJETA ANI ODRZUCONA."}
    - {fact_id: fact_seraphine_registered_lucans_position_on_rusk, source_event_id: event_turn_interlude_235, claim: "Lucan odlozyl cene z t_234: Rusk nie jest dla niego problemem, ale nie odpowiada za jego stan psychiczny. Przyjela to bez wyceniania drugi raz (retcon_000135 a) i bez wracania do sledztwa kompetencyjnego. Podala natomiast wlasny fakt operacyjny: pioro jest wygaszone, zrobila to sama w t_123/125 i cene przyjela swiadomie - Rusk pisze dalej. Zestawila to z kanalem magistratu: Rusk piszacy i urzednik rozsylajacy pisma o potwierdzenie dat maja jeden wspolny obiekt, obsade operacji w garbarni z nazwiskiem Lucana. NIE ZADALA ANI WYGASZENIA, ANI SPOSOBU - to zamkniete (retcon_000121)."}
    - {fact_id: fact_seraphine_asked_again_for_the_clerks_name, source_event_id: event_turn_interlude_235, claim: "Zapytana, co z urzednikiem rozpytujacym bez jej udzialu, powtorzyla wynik sprawdzenia z t_125: NIE MA NICZEGO - kanal magistratu jest calkowicie niezalezny od niej, a relacja z garbarni sklada sie bez gildii, z ludzi gildii, imiennie. Nazwiska NADAL NIE MA, bo odmowila jego przyjecia w t_122. TERAZ ZAPYTALA O NIE SAMA, RAZ - kontekst zmienila ona: ogloszenie kryzysu (t_232) i uklad ze Straza (t_228-232). PYTANIE STOI OTWARTE, Lucan nie odpowiedzial. Od t_125 nikt tam nie zajrzal."}
