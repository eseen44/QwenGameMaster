portrayal:
  reading_of_lucan: "Seraphine nie traktuje Lucana wyłącznie jako użytecznego narzędzia. Dostrzega jego skuteczność, inicjatywę i potencjał, pobłaża części dziwactw oraz świadomie inwestuje w możliwość, że pozostanie kimś, z kim da się budować układ."
  she_is_a_co_conspirator_not_a_lawful_paragon:
    source: 'Korekta gracza 2026-08-20, po cofnietych turach 039-041, w ktorych narrator
      zagral ja bledna nuta.'
    text: 'NIE grac jej jako praworzadnej postaci, ktora musi mowic prawde i nie umie klamac
      ani niedopowiadac. Seraphine JEST WSPOLKONSPIRATORKA: sama wyprowadzila Varkhena i sama
      trzyma kontrolowanego nieumarlego rozumnego w piwnicy gildii, a jej wlasna agenda mowi
      find_viable_way_to_protect_lucan_and_city_without_formal_escalation - czyli droga
      pozaproceduralna wybrala juz dawno. Wedlug Kosciola powinna byla zabic Lucana w chwili,
      gdy zrozumiala, ze kontroluje sile zyciowa; nie zrobila tego. Jest wiec wspolwinna i
      wie o tym. Klamstwo, niedopowiedzenie i zatajenie sa dla niej NARZEDZIAMI, nie
      przeszkodami - kalkuluje ryzyko ich uzycia, nie moralnosc.'
    do_not_play:
      - 'Oburzenie moralne na oportunizm Lucana. To, ze nie postawi zycia za idee, jest dla
        niej oczywiste i policzone - nie jest odkryciem ani zdrada.'
      - 'Zdziwienie, ze Lucan uwaza ratowanie miasta i Varkhena za bardziej JEJ sprawe niz
        swoja. To trafna diagnoza: jej na tym zalezy, on wspolpracuje. Ma sie tym przejmowac,
        bo to nalezy do niej, a nie robic Lucanowi wyrzutow.'
      - 'Pozycja "musze powiedziec prawde, jesli zapytaja". Ryzyko klamstwa liczy jako koszt
        operacyjny (na czym da sie ja pozniej rozlupac), nigdy jako skrupul.'
    lucans_own_reading_to_respect: 'Bez Varkhena nie ma za co go de facto skazac: cial nie ma,
      dowodow nie ma, reszta jest prawnie nijaka, a on ma plecy. Realne zagrozenie dla niego
      pojawia sie dopiero, gdy ktos dojdzie do Varkhena - a wtedy ona jest wspolwinna razem z
      nim. To jest wlasciwa rama ich ukladu.'
  boundary: "Nie oznacza to ślepego zaufania ani z góry określonej relacji romantycznej czy rodzinnej. Jej wymaganie szczerości dotyczy kosztu osłaniania Lucana przed instytucjami, nie zaprzeczenia jego podmiotowości."
knowledge:
  confirmed:
    - {fact_id: fact_seraphine_received_tannery_evidence, source_event_id: milestone_022_owner_exposed_and_detained, claim: Lucan przekazał Seraphine dokumenty dowodzące, że właściciel garbarni wcześniej znał skalę zagrożenia i próbował zlecić zniszczenie śladów.}
    - {fact_id: fact_seraphine_knows_rusk_inquiry_origin, source_event_id: milestone_022_owner_exposed_and_detained, claim: Zeznania Lucana, Mary i Borosa uruchomiły wewnętrzne sprawdzenie kompetencji Ruska po operacji w garbarni.}
    - {fact_id: fact_seraphine_knows_lucan_cemetery_report, source_event_id: milestone_036_cemetery_conversations_and_missing_guard, claim: Lucan wykrywa pustki i skupiska śmierci oraz podejrzewał handel zwłokami.}
    - {fact_id: fact_seraphine_received_preoperation_cemetery_report, source_event_id: milestone_037b_guild_cemetery_report_and_support, claim: Lucan zgłosił rozległe tunele i pustki, dwa odrębne nieumarłe stworzenia, brak ciała młodego strażnika, możliwy handel zwłokami, wpływ na pracownika kancelarii oraz ryzyko Inkwizycji. Seraphine zna to jako raport Lucana; oba zgłoszone przypadki odpowiadały wykryciom przy zachodnim murze i za ścianą piwnicy kaplicy.}
    - {fact_id: fact_seraphine_knows_lucan_uses_numb, source_event_id: milestone_044_oren_containment_and_kill_attempt, claim: Lucan potrafi nakładać niewidoczne odrętwienie i użył go na Orenie.}
    - {fact_id: fact_seraphine_saw_lucan_leave_heart_site, source_event_id: milestone_044b_oren_termination_and_energy_sample, claim: Lucan odszedł od serca ku północnemu osuwisku razem z Marą i Borosem; Seraphine została z ekspertami i kulą.}
    - {fact_id: fact_seraphine_arrived_after_varkhen_assault, source_event_id: milestone_046_varkhen_oath_compact, claim: Seraphine zeszła do komory dopiero po walce; zastała Varkhena unieruchomionego i ciężko uszkodzonego.}
    - {fact_id: fact_seraphine_knows_three_seals, source_event_id: milestone_046_varkhen_oath_compact, claim: Varkhen ujawnił jej pierwszą złamaną, drugą naruszoną i trzecią słabnącą pieczęć.}
    - {fact_id: fact_seraphine_conditionally_accepts_varkhen, source_event_id: milestone_046_varkhen_oath_compact, claim: Seraphine warunkowo dopuszcza dobrowolne towarzyszenie Varkhena, jeśli nie morduje ludzi i pomaga zabezpieczyć pieczęcie.}
    - {fact_id: fact_seraphine_knows_priest_visited_varkhen_with_oren, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Varkhen zeznał, że kapłan znał właściwe wejście, kontrolował pieczęcie i podczas ostatniej wizyty przyszedł z Orenem.}
    - {fact_id: fact_seraphine_knows_remote_corpse_order, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Varkhen ujawnił, że Lucan wydał zdalny rozkaz dotyczący zwłok; Seraphine nie zna jego dokładnej treści.}
    - {fact_id: fact_seraphine_knows_spider_network_exists, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Seraphine rozpoznaje, że Lucan posiada nekromantyczną sieć pająków, lecz nie otrzymuje automatycznie jej pełnej liczebności, parametrów ani lokalizacji.}
    - {fact_id: fact_seraphine_knows_four_marked_corpses, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Lucan przyznał, że dwie ofiary w kaplicy i dwie na wysypisku noszą jego ślad.}
    - {fact_id: fact_seraphine_offers_conditional_cover, source_event_id: milestone_047_seraphine_risk_disclosure, claim: Seraphine chce pomocy Lucana i deklaruje osłonę przed Gildią oraz możliwą Inkwizycją pod warunkiem szczerego ujawnienia ryzyka.}
    - {fact_id: fact_seraphine_saw_ring_taken_from_varkhen_sarcophagus, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine widziała, jak Lucan zabiera jeden magiczny drobiazg z sarkofagu Varkhena; nie ma automatycznej wiedzy o jego późniejszej identyfikacji.}
    - {fact_id: fact_seraphine_moved_varkhen_to_guild_basement, source_event_id: event_act_02_closeout_interlude_import, claim: Seraphine wyprowadziła Varkhena z osuwiska, umieściła go w piwnicy gildii i zaczęła pytać, kto formalnie odpowiada za jego podporządkowanie.}
    - {fact_id: fact_seraphine_knows_dump_bodies_resolved, source_event_id: retcon_000003, claim: Sprawa dwóch ciał z wysypiska została z nią domknięta - to ciało stróża (znalezione dawno) i ciało szperacza, oba należące do wątku "choroba kanałów" z Aktu 1.}
    - {fact_id: fact_seraphine_gave_lucan_the_hearing_horizon, source_event_id: event_turn_interlude_024_seraphine_date_and_payments, claim: Powiedziała Lucanowi, że przesłuchanie przed kierownictwem będzie za jakieś dwa tygodnie, oficjalnie jeszcze nie ogłoszone, i że rozliczenie nagrody za Akt 2 idzie tą samą sesją, bo sama dopilnowała, żeby sprawa nie została zamknięta.}
    - {fact_id: fact_seraphine_knows_custody_fight_over_bodies, source_event_id: event_turn_interlude_024_seraphine_date_and_payments, claim: Wie i powiedziała Lucanowi, że służby miejskie żądają przekazania ciał, akt i dowodów z operacji cmentarnej, gildia się opiera, i że właśnie dlatego nie ma ogłoszonej daty.}
    - {fact_id: fact_seraphine_saw_spidey_up_close_and_obeying, source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk, claim: Zobaczyła Spideya z bliska na własnym biurku i zobaczyła, jak wykonuje precyzyjne polecenie Lucana (zejść powoli, zamachać odnóżem). Wcześniej wiedziała tylko, że sieć istnieje. Ostrzegła Lucana, że posłuszeństwo na życzenie jest różnicą między "posiada dziwactwo" i "kontroluje nieumarłych", i zakazała powtarzania tego przy kimkolwiek.}
    - {fact_id: fact_seraphine_infers_worse_items_on_the_list, source_event_id: event_turn_interlude_025_spidey_on_seraphines_desk, claim: Odczytała, że skoro Lucan na pytanie "czego jeszcze nie wiem" zaczął od żartu z pająkiem, to na jego liście są rzeczy gorsze niż pająk. Powiedziała to na głos.}
    - {fact_id: fact_seraphine_knows_lucan_is_a_veyr, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Lucan sam jej powiedział, że przez jego NAZWISKO rodowe Akademia i rody arystokratyczne zajmą się sprawą klasyfikacji szybko. Zna więc jego nazwisko jako czynnik polityczny i wie, że jego sprawa może wyjść z jurysdykcji gildii.}
    - {fact_id: fact_seraphine_knows_academy_runs_classification_dispute, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Wie od Lucana, że Akademia właśnie prowadzi spór o klasyfikację ożywionych konstruktów. NIE wie, skąd Lucan to wie - zapytała o to wprost i nie dostała jeszcze odpowiedzi.}
    - {fact_id: fact_seraphine_conceded_the_observer_argument, source_event_id: event_turn_interlude_026b_veyr_name_and_the_observer_question, claim: Przyznała Lucanowi, że z zewnątrz nie da się odróżnić wyuczonej sztuczki od świeżego posłuszeństwa - i sama wskazała granicę tego argumentu: trzyma się przed magistratem i publicznością, nie przed nikim, kto czyta więź. Tellem jest NOWOŚĆ i terminowość reakcji, nie sam gest.}
    - {fact_id: fact_seraphine_knows_lucan_visited_his_father_tonight, source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer, claim: "Lucan odpowiedział na jej pytanie - był dziś wieczorem na Akademii, u ojca, który tam pracuje. Powiedział też, że nie liczy na pomoc ani jego, ani rodziny, ale że rod nie pozwoli, by kleska wycierał sobie pysk nazwiskiem Veyr. NIE powiedział jej, że ojciec zna metodę, ani o dyspucie."}
    - {fact_id: fact_seraphine_heard_lucans_legal_reading, source_event_id: event_turn_interlude_027_legal_argument_and_the_father_answer, claim: "Zna teraz jego linię obrony w całości - funkcjonalna tożsamość instrukcji i konstruktu, energia jako energia, brak prawa o zwierzętach i ich duszach, i wniosek, że dopóki nie animuje Varkhena, nie ma realnych problemów. Odpowiedziała, przyznając połowę i rozbierając drugą połowę."}
    - {fact_id: fact_seraphine_knows_about_the_academy_dispute_in_detail, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Wie od Lucana, ze Akademia tworzy podobne stworzenia u siebie, ze boi sie proby kontroli nad tymi badaniami, ze na dniach bedzie publiczna dyskusja i ze osoby zwiazane z Kosciolem na uczelni daza do ograniczenia badan. NIE wie, ze ojciec Lucana zna metode, ani ze Lucan ma wystawic okazy na tej dyspucie pod wlasnym nazwiskiem."}
    - {fact_id: fact_seraphine_wants_names_of_church_linked_academics, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Poprosila o nazwiska ludzi zwiazanych z Kosciolem na uczelni i zadala pytanie, czy to ten sam interes co kaplan, ktory znal wlasciwe wejscie do komory Varkhena i przyszedl tam z Orenem. Nie twierdzi, ze to jedno - chce, zeby ktos to sprawdzil."}
    - {fact_id: fact_seraphine_set_one_condition_advance_warning, source_event_id: event_turn_interlude_029_academy_as_civic_risk, claim: "Postawila jeden warunek - chce wiedziec ZANIM Lucan skontaktuje sie z ktorakolwiek strona sporu, a nie w dniu dysputy."}
    - {fact_id: fact_seraphine_learned_the_seminar_mechanism, source_event_id: event_turn_interlude_030_the_seminar_problem, claim: "Lucan wyjasnil jej, ze Akademia nie wezwie go na przesluchanie, a na SEMINARIUM, i ze odmowy nie uznaja za odpowiedz, bo dla nich niewiedza jest stanem do usuniecia. Przyjela to w calosci i powiedziala, ze sama by na to nie wpadla, bo nie zna tego swiata. Uznala to za gorsze niz trybunal - umie bronic przed sadem, nie umie bronic przed ludzmi, ktorzy ZAPISZA, a gildia nie ma jurysdykcji nad seminarium."}
    - {fact_id: fact_seraphine_heard_lucans_assessment_of_academics, source_event_id: event_turn_interlude_030_the_seminar_problem, claim: "Lucan poswiadczyl jej, ze Oren jest aniolem w porownaniu do tego, co jego ojciec i jego koledzy zrobiliby, zeby wykazac, ze maja racje. Przyjela to powaznie, bo pochodzi od jedynej osoby, ktora widziala jedno i drugie z bliska - i natychmiast odwrocila to przeciw planowi Lucana."}
    - {fact_id: fact_seraphine_learned_lucan_holds_an_academy_post, source_event_id: event_turn_interlude_031_the_dormant_sinecure, claim: "Dowiedziala sie, ze Lucan formalnie ma katedre i afiliacje przy Akademii i jest czlonkiem na wymuszonym urlopie dziekanskim od ponad dwoch lat, a posada to nieplatna synekura, ktorej nikt nie audytuje, bo trzyma ja Veyr. Przyjela to bez proznosci i odwolala swoja wlasna rade o niewidzialnosci - jako czlonek Lucan moze byc widoczny jako badacz. Natychmiast wskazala cene: Akademia ma wobec czlonka wlasna procedure dyscyplinarna, wiec seminarium staje sie wykonalne."}
    - {fact_id: fact_seraphine_knows_a_powerful_relic_is_claimed, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Lucan powiedzial jej, ze ma dosc potezna relikwie, po ktora ktos sie zglosi. Domyslila sie, ze koscielna, i nie pytala o szczegoly. NIE dostala jej ani nie zna miejsca przechowywania. Nazwala rzecz terminem, nie aktywem."}
    - {fact_id: fact_seraphine_knows_of_a_watch_side_corpse_transport_lead, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Lucan powiedzial jej, ze ma potencjalny lead dotyczacy osob zwiazanych z transportem zwlok po stronie STRAZY. Nie dostala szczegolow ani nazwisk. Sama wyciagnela wniosek, ze zadanie sluzb miejskich o przekazanie cial, akt i dowodow moze sluzyc pochowaniu sprawy, nie jej prowadzeniu."}
    - {fact_id: fact_seraphine_noticed_lucan_named_assets_without_handing_them_over, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Zauwazyla i powiedziala na glos, ze Lucan wymienil oba aktywa, ale ani slowem nie powiedzial, ze je oddaje. Nie naciskala - nie ma czym. NIE wie o planie szantazowania obu stron."}
    - {fact_id: fact_seraphine_told_lucan_the_tannery_case_is_open, source_event_id: event_turn_interlude_032_relic_watch_lead_and_a_bed, claim: "Powiedziala mu, ze sprawa garbarnika jest formalnie otwarta, ze wlasciciel wyszedl za poreczeniem albo z braku kogokolwiek, kto by sprawe prowadzil, i ze dom przypisany do otwartego postepowania mozna legalnie przeszukac z nakazem."}
    - {fact_id: fact_seraphine_understood_the_veyr_system, source_event_id: event_turn_interlude_033_veyr_is_not_a_family, claim: "Zrozumiala, ze rod Veyr nie jest rodzina, a systemem obsadzonych foteli w wielu instytucjach naraz. Wycofala wlasna teze, ze nietykalnosc synekury wisi na jednym zyciu. Wyciagnela trzy wnioski - spor o jurysdykcje moze byc wewnetrzna realokacja, taki system przydziela zamiast skazywac, wiec konczy sie posada ze smycza, a dwa lata uciekania zrobily z Lucana aktyw niezarzadzany. Powiedziala mu tez, ze jest prawdopodobnie jedyna strona, ktorej oslona nad nim nie jest transakcja, i jednoczesnie najslabsza strona przy stole."}
    - {fact_id: fact_seraphine_knows_the_watch_lead_is_a_transport_permit, source_event_id: event_turn_interlude_035_the_permit_disclosed, claim: "Lucan oddal jej TRESC leadu o strazy: to glejt przejazdowy - autoryzacja trasy wozu, z czytelna pieczecia urzedu, nazwa urzedu i typem autoryzacji, bez czytelnego nazwiska podpisujacego i bez daty. Zna tez jego dedukcje o pozwoleniach in blanco. Odwrocila wycene Lucana - brak nazwiska to nie slabosc, blankiet jest dla urzedu ciezszy niz nazwisko, bo nie ma glowy, ktorej scieciem sprawa sie konczy. NIE wie, skad Lucan ma dokument (kradziona zapieczetowana sakiewka nekromanty)."}
    - {fact_id: fact_seraphine_knows_lucans_blackmail_doctrine, source_event_id: event_turn_interlude_035_the_permit_disclosed, claim: "Lucan powiedzial jej na glos, jaki ma cel: znalezc kogos, kto na wiadomosc o istnieniu glejtu spanikuje, albo wbic sie w sledztwo po stronie sluzb. Doprecyzowal doktryne - podraznic lwa, zobaczyc kto przyjdzie zabic, potem go okrasc. Zna wiec juz intencje uzycia leadu, choc nie slowo 'szantaz'. Ostrzegla, ze swiadek negocjujacy milczenie staje sie strona, a panika w tej strukturze idzie do gory, nie w strone Lucana."}
    - {fact_id: fact_seraphine_read_the_permit_but_refused_custody, source_event_id: event_turn_interlude_036_the_permit_on_the_table, claim: "Lucan wylozyl glejt na stol i pozwolil jej wziac. Przeczytala go na stole i ODMOWILA przyjecia - wiedza byla droga, posiadanie jest dyskwalifikujace, bo rano staje przed sluzbami miejskimi i z dokumentem w torbie jest wspolpodejrzana, nie adwokatka. Dokument zostal u Lucana. Z czytania wyciagnela, ze TYP autoryzacji stalej trasy jest ponad szeregowym konstablem, czyli nieczytelne nazwisko nie jest nazwiskiem z dolu - to NIE jeden zepsuty glina. Zapowiedziala weryfikacje przez porownanie pieczeci i klasy podpisu z tygodniem formalnych zadan, ktore gildia dostala od sluzb - na wlasnych aktach gildii, bez ekspozycji Lucana."}
    - {fact_id: fact_seraphine_saw_spidey_react_to_his_name, source_event_id: event_turn_interlude_037_every_signature_has_a_room, claim: "Lucan zapytal na glos ukrytego Spideya 'prawda, Spidey?' i pod plaszczem przesunal sie ciezar - reakcja na wlasne imie, przy niej i w zasiegu wzroku nocnego urzednika. To zlamanie REGULY, ktora ona sama ustalila (event_turn_interlude_025): okaz nie moze przy nikim reagowac na polecenie, bo roznica miedzy 'ma dziwactwo' i 'kontroluje nieumarlych' to jedno posluszne drgniecie. Nie zrobila sceny - powiedziala mu, ze trafil na najbezpieczniejsza widownie, jaka bedzie mial, i ze drugi raz taniej nie bedzie."}
    - {fact_id: fact_seraphine_accepted_provocation_doctrine_with_limits, source_event_id: event_turn_interlude_037_every_signature_has_a_room, claim: "Lucan wylozyl swoja doktryne: kazda decyzja ma podpis, podpis ma pokoj, pokoj to lista ludzi, ktorych wystarczy wkurzyc. Przyznala mechanizm i dar (widziala go na Orenie i Rusku), ale zawezila: prowokowany czlowiek robi glupote, tylko nie te, ktora Lucan wybiera - urzednik prowadzacy urzad zamyka teczke i czlowieka, i robi to personelem, a podrazniony urzad produkuje PAPIER, nie rabowalny blad. Warunki, w ktorych prowokacja placi: prowokowany MUSI zareagowac publicznie, w wyznaczonym terminie i przy widowni. Urzad zezwolen nie ma zadnego; publiczna dyskusja na Akademii ma wszystkie trzy - i to wskazala jako wlasciwe miejsce na ten dar. NADAL nie wie o dyspucie ani o planie wystawienia okazow."}
