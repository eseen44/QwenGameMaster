the_living_saints_reading:
  status: NIEDOPOWIEDZIANE_CELOWO
  declared_by: player
  source_event_id: player_ruling_2026_08_27
  player_words: 'Praca nad bio modyfikowanymi superludzmi brzmi troche jak Kosciol
    generujacy zywych swietych. Moze to pozostac niedopowiedziane, ale ladnie spina
    wszystkie watki i daje powod, dla ktorego Kosciol moglby na koniec zrezygnowac
    z otwartej konfrontacji.'
  JAK_TO_PROWADZIC: |
    TO NIE JEST TRESC DO WYPOWIEDZENIA W FIKCJI. Gracz wprost chce, zeby zostalo
    niedopowiedziane. Narratorowi wolno pozwolic temu DZIALAC - w decyzjach Kosciola,
    w tym, czego nie sciga, w tym, kogo nagle przestaje naciskac - ale NIE WOLNO tego
    nazwac ani kazac zadnemu NPC tego wylozyc. Zaden kaplan nie mowi "budujemy swietych".
    Jesli gracz sam do tego dojdzie i powie to na glos, to jest jego odkrycie, nie
    ekspozycja narratora.
  co_to_spina: |
    (a) MOTYW KOSCIOLA PRZESTAJE BYC DOKTRYNALNY. Dotychczasowy zapis mowi, ze Kosciol
    kupuje wygrana szerokiej definicji, bo szara strefa likwiduje forum i przenosi
    srodek zaradczy "z papieru na ludzi" (npcs/ivar-kolm.yaml#the_dispute_is_thrown).
    Ta warstwa dodaje drugi, mocniejszy powod: w szarej strefie NIKT NIE ROZPATRUJE
    TEZ JEGO WLASNEJ PRACY nad modyfikowanymi ludzmi. Nie chodzi o czystosc kategorii,
    chodzi o MONOPOL na technologie.
    (b) KOLM PRZESTAJE BYC KARIEROWICZEM. Jego katedra to biomutanty; jesli koncowym
    produktem sa modyfikowani ludzie, to Kolm nie jest oplacony samym rektoratem -
    jest w programie. Patrz npcs/ivar-kolm.yaml#the_act_01_thread.
    (c) HODOWLA POD GARBARNIA PRZESTAJE BYC POBOCZNA. "Okazy niestabilne. Karmic
    wylacznie po zamknieciu sluzy" czyta sie wtedy jako WCZESNY, NIEUDANY ETAP tego
    samego programu, a poprzedni wlasciciel garbarni jako jego dostawce albo przykrywke.
    (d) DAJE POWOD, ZEBY KOSCIOL WYCOFAL SIE Z OTWARTEJ KONFRONTACJI. Instytucja nie
    niszczy tego, co chce posiadac. W momencie, w ktorym Lucan okazuje sie kims, kto
    umie to robic taniej i lepiej, fanatyzm przestaje byc oplacalny. To jest wyjscie
    z Aktu 3, ktore NIE jest deus ex machina, bo motyw stal tam od poczatku.
  co_to_NIE_zmienia_teraz: |
    Doktryna publiczna Kosciola zostaje bez zmian: necromantic_practice
    fanatically_opposed, modyfikacja zwierzat doktrynalnie potepiona bez szarej strefy.
    Fanatyzm szeregowych jest SZCZERY - to nie jest instytucja, w ktorej wszyscy wiedza.
    Ta warstwa dotyczy gory i tylko gory. Nie zmiekczac ksiezy w terenie.
  do_not_invent:
    - 'Nazwy programu, jego lokalizacji, liczby ludzi ani zadnego "swietego". Nic z tego
       nie ma sie pojawic jako fakt sceny.'
    - 'Wiedzy Lucana. On tego NIE wie i nie ma jak wiedziec.'
    - 'Tego, ze Kosciol na pewno sie wycofa. To jest MOZLIWE WYJSCIE, nie zapowiedziane.'
