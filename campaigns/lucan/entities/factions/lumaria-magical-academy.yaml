archive_and_recordkeeping:
  disclosure_state:
    source: 'Tura 040 zostala cofnieta na zyczenie gracza (rollback A, 2026-08-20). Sama tresc
      pochodzi od gracza jako kanon swiata i ZOSTAJE, ale w fikcji Lucan nie powiedzial tego
      jeszcze Seraphine - nie przypisywac jej tej wiedzy.'
  source_event_id: retcon_000009
  source: 'Podane przez gracza jako wiedza Lucana o instytucji, w ktorej uzyskal doktorat,
    zachowal formalne stanowisko i wspoltworzyl prace ojca.'
  text: 'Akademia zbiera wszystko, co moze, i zapisuje to AUTOMATYCZNIE - gdzies. Kartoteka
    ma wiecej wymiarow, niz ktokolwiek potrafi ogarnac, wiec zapis nie jest tym samym co
    dostepnosc: leza tam notatki arcymagow z przed eonow, ktore wyleczylyby wszystkie
    choroby, i nikt nie umie ich znalezc. SKUTEK DLA GRY - nie modelowac archiwum Akademii
    jako rejestru, ktory da sie odpytac. Zapisanie czegos jest niemal pewne, odnalezienie
    tego jest osobnym, trudnym zadaniem. Dotyczy to takze akt samego Lucana, jego doktoratu,
    publikacji i rodzinnego nacisku, ktory zablokowal wykonywanie pracy, granty i wyjazdy,
    pozostawiajac stanowisko oraz pokoj: sa zapisane, ale ktos musi ich SZUKAC, zeby na nie
    trafic.'

