    duties: [coauthor_and_research_organizer, occasional_mandatory_student_teaching]
    teaching_subjects: [practical_anatomy, specimen_preparation, introductory_laboratory_chemistry]
    teaching_style: >-
      Kompetentne zajecia praktyczne, sekcje i proste doswiadczenia. Lucan byl bardzo mlody,
      swobodny przy materiale biologicznym i przynosil z laboratorium ojca funkcjonalne, ale
      nieortodoksyjne standardy bezpieczenstwa.
    research_fields: [anatomy, biology, chemistry, magical_applications]
    student_impression: >-
      Odbior byl mieszany. Studenci praktyczni i eksperymentalni cenili bezposredni styl oraz
      fakt, ze Lucan byl znacznie latwiejszy we wspolpracy niz ojciec. Ambitni i wrazliwi na
      hierarchie widzieli doktora niewiele starszego od siebie, z nazwiskiem Veyr i podejrzanie
      mocnym dorobkiem, wiec podejrzewali nepotyzm, dopisywanie do prac ojca albo specjalne
      traktowanie. Konserwatywnych niepokoila swoboda wobec sekcji, ryzyka i tabu. Nie jest to
      automatyczne podejrzenie nekromancji.
    room_status:
      source_ref: retcon_000078
      assigned_to_lucan: true
      preserved_by: npc_lucan_former_promoter
      public_reason: still_contains_research_materials
      actual_reason: beatrix_expected_him_to_return_or_resign_in_person
  historical_people:
