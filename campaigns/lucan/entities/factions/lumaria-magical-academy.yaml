    note: 'Rektor wchodzi do kanonu dopiero tu; wczesniej nie istnial w zadnym pliku.
      Jest urzedem POLITYCZNIE ZAGROZONYM: po zamieszkach albo po wojence magicznej
      wladze miasta beda otwarte na zdjecie rektora "ktory do tego doprowadzil".
      To jest zaplata npc_ivar_kolm - patrz npcs/ivar-kolm.yaml#the_price_of_kolm.
      Nastepca ma byc proreligijny konserwatysta, ktory publicznie stal po stronie
      waskiej definicji.'
  consequence: 'Otwarta dysputa nie jest tylko sporem o definicje - jest takze etapem
    obsadzania wladzy Akademii. Kazdy, kto liczy tylko granice prawna, liczy polowe.'
