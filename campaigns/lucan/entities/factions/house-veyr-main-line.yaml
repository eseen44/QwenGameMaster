schema_version: 1
id: faction_house_veyr_main_line
name: Główna Linia Rodu Veyr
status: needs_review
kind: aristocratic_patronage_cartel_operating_like_a_family_corporation
scale: MAJOR_noble_house
scale_note: 'POPRAWKA gracza po event_turn_interlude_033 - rod Veyr NIE jest drobnym rodem.
  Jest rodem WIELKIM. Wczesniejszy zapis "minor_noble_house_relative_to_lucan" byl bledny i
  brał skale rodu z pozycji Lucana, a nie z pozycji rodu. Ubostwo i niewaznosc dotycza
  wylacznie jego bocznej galezi, nie domu.'
lucans_branch:
  status: politically_distant_comparatively_poor_side_branch
  why_it_is_out:
    - Apolityczność ojca sprawiała, że Lucan od dzieciństwa pozostawał z dala od głównej
      linii. Gałąź nie była biedna, lecz wyglądała ubogo przy ostentacyjnym bogactwie rodu.
    - Lucan odciął kontakt dopiero po narzuconym mariażu i nieproporcjonalnych represjach.
  consequences:
    - Nazwisko wazy duzo, ale Lucan osobiscie nie ma z tej wagi prostej oslony. Rod jako duzy
      darczynca zablokowal mu wykonywanie pracy, granty i wyjazdy. Formalne stanowisko
      przetrwalo, a pokoj pozostal przypisany dlatego, ze Beatrix Witte osobiscie odmowila
      jego ponownego przydzialu - z zewnatrz jest to paradoks, ktory Seraphine nazywa synekura.
    - Nie ma zadnego prywatnego kanalu do systemu. Nikt mu nic nie zawdzięcza. Gdyby
      kiedykolwiek musial z tej dzwigni skorzystac, musialby przejsc dokladnie przez tych
      ludzi, ktorych odmawia uznawac.
    - Wielki rod ma wiecej do stracenia na skandalu niz drobny - co czyni ciche zamkniecie
      sprawy Lucana i bardziej prawdopodobnym, i bardziej stanowczym.
current_state: structurally_present_everywhere_not_yet_directly_engaged_in_lucans_case
relationship_to_lucan:
  institutional_attitude: opportunistic_disinterest_escalating_to_retaliation
  summary: Nigdy nie interesowała się życiem Lucana, dopóki nie pojawiła się
    możliwość użycia go w mariażu po pierwszych sukcesach akademickich. Uznała bogatą,
    dobrze usytuowaną partię za przysługę oraz powrót bocznej gałęzi "na łono" rodziny.
    Lucan odmówił nawet formalnego spotkania; dla rodu, który uważał sprawę za przesądzoną,
    był to afront i zła prasa. Próby wymuszenia rozsądku przez ograniczenie statusu,
    kariery, grantów, wyjazdów i praw akademickich były nieproporcjonalne i doprowadziły
    do załamania oraz zniknięcia Lucana. Główna linia nie widziała go od prawie dwóch lat
    i nie wie o jego powrocie.
claims: [head_of_house_authority_over_side_branch, right_to_arrange_marriages_of_side_branch]
structure:
  established_by: event_turn_interlude_033_veyr_is_not_a_family
  established_how: Wyjasnione przez gracza slowami Lucana; przyjete jako kanon.
  principle: 'Rod działa bardziej jak korporacja i nieformalny kartel patronacki niż jak
    rodzina osobista. Obsadzanie foteli w różnych instytucjach zapewnia członkom realne
    korzyści. Starszyzna uważa te korzyści za tak oczywiste, że posłuszeństwo członka rodu
    powinno nastąpić samo - klasyczny arystokratyczny nepotyzm w stylu "babcia wie lepiej".
    Może przez większość życia nie pamiętać, że Lucan istnieje, a po zauważeniu go nadal
    oczekiwać podporządkowania bez dostrzegania w tym sprzeczności.'
  reach:
    confirmed_scope: [miasto, region]
    contested_scope: Zlosliwi mowia, ze caly kraj.
    hyperbole: Szurnieci mowia, ze swiat. To jest cytat z Lucana i element jego jezyka, NIE
      ustalony fakt swiata.
  consequences:
    - >-
      Zachowanie stanowiska i pokoju nie oznacza, ze Lucan ma katedre ani ze moze faktycznie
      pracowac. Rodzina potrafila zamrozic kariere, lecz w budynku Beatrix Witte nie zdolala
      doprowadzic do ponownego przydzialu jego pokoju. Przetrwanie pokoju jest wynikiem jej
      konkretnego oporu, nie dowodem lagodnosci rodu ani automatycznej ochrony Akademii.
    - Jeżeli ród zauważy Lucana, może potraktować jego sprawę jak wewnętrzny problem
      patronacki i zaproponować korzystną posadę, ochronę albo obowiązek. To możliwość,
      nie uruchomiona procedura ani ustalone zakończenie.
    - Rodzina nie prowadzi dosłownego rejestru "aktywów" i nie ma jeszcze operacji
      podporządkowania Lucana. Język aktywu lub realokacji jest metaforą korporacyjnego
      sposobu myślenia, nie mechaniką świata (retcon_000064).
  open_question:
    - Jesli fotele sa obsadzone w ten sposob, czy siec transportu zwlok po stronie strazy jest
      w ogole scigana, czy tolerowana przez kogos wystarczajaco wysoko? W drugim wypadku lead
      Lucana celuje w jego wlasny system, a szantaz nie jest dzwignia, a zgloszeniem sie do
      kolejki. Pytanie zadane przez Seraphine, bez odpowiedzi.
fears: [loss_of_status, side_branch_becoming_a_public_liability_or_scandal]
members_known:
  - {id: npc_lucan_father, relation: fifth_or_sixth_son_no_inheritance_prospects, status: deliberately_apolitical_refuses_to_enforce_family_will}
  - {id: npc_lucan_mother, relation: married_in_from_wealthy_bourgeois_family, status: concerned_and_seeking_information_but_without_real_influence}
  - {id: npc_lucan_former_fiancee, relation: intended_bride_chosen_by_head_of_house, status: refused_before_any_formal_meeting_family_proceeded_and_bullied_unilaterally}
knowledge:
  confirmed: []
  current_awareness_of_lucan: none_outside_father
  forbidden_without_event: [lucan_necromancy, spidey_identity, varkhen_identity, lucan_current_location]
notes:
  - 'Jako rod WIELKI jest znaczacym czlonkiem faction_lumaria_noble_estates, nie petentem. Może się powiązać z faction_lumaria_noble_estates (rule: no_single_house_position,
    House Veyr może zajmować odrębne stanowisko od reszty bloku) oraz z
    lead_signet_heraldry_research i objective_interlude_investigations w
    planning/lucan-leads.yaml i state/objectives.yaml.'
  - Żadna konkretna osoba nie jest jeszcze nazwana ani nie pojawiła się w bieżącej
    linii czasowej - to czysto tło ustalone przez gracza, do rozwinięcia w grze.
  - Ród nie jest obecnie aktywną presją na Lucana. Może zainteresować się nim po uzyskaniu
    wiarygodnej informacji, ale nie wolno zakładać, że już prowadzi sprawę albo śledzi jego
    widoczność.
