  forbidden_without_event: [lucan_necromancy, spidey_identity, varkhen_identity, lucan_current_location]
notes:
  - 'Jako rod WIELKI jest znaczacym czlonkiem faction_lumaria_noble_estates, nie petentem. Może się powiązać z faction_lumaria_noble_estates (rule: no_single_house_position,
    House Veyr może zajmować odrębne stanowisko od reszty bloku) oraz z
    lead_signet_heraldry_research i objective_prepare_institutional_defense w
    planning/lucan-leads.yaml i state/objectives.yaml.'
  - Żadna konkretna osoba nie jest jeszcze nazwana ani nie pojawiła się w bieżącej
    linii czasowej - to czysto tło ustalone przez gracza, do rozwinięcia w grze.
