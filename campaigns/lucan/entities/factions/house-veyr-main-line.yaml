schema_version: 1
id: faction_house_veyr_main_line
name: Główna Linia Rodu Veyr
status: needs_review
kind: distributed_patronage_and_corruption_management_apparatus
scale: MAJOR_noble_house
scale_note: 'POPRAWKA gracza po event_turn_interlude_033 - rod Veyr NIE jest drobnym rodem.
  Jest rodem WIELKIM. Wczesniejszy zapis "minor_noble_house_relative_to_lucan" byl bledny i
  brał skale rodu z pozycji Lucana, a nie z pozycji rodu. Ubostwo i niewaznosc dotycza
  wylacznie jego bocznej galezi, nie domu.'
lucans_branch:
  status: ostracized_ignored_and_poor_side_branch
  why_it_is_out:
    - Ojciec Lucana jest politycznie slepy - nie orientuje sie w polityce, nie zabiega,
      nie utrzymuje kontaktow, i prawdopodobnie wlasnie to zeplo galaz na margines
      (npc_lucan_father).
    - Lucan sam odmawia wypelniania zobowiazan wobec glownej linii i odmawia utrzymywania z
      nia kontaktu. Ostracyzm jest wiec czesciowo zaslugą obu stron, nie tylko krzywda.
  consequences:
    - Nazwisko wazy duzo, a Lucan osobiscie nie ma z tej wagi zadnej oslony - korzysta z niej
      biernie (nieplatna synekura, ktorej nikt nie audytuje), nie czynnie.
    - Nie ma zadnego prywatnego kanalu do systemu. Nikt mu nic nie zawdzięcza. Gdyby
      kiedykolwiek musial z tej dzwigni skorzystac, musialby przejsc dokladnie przez tych
      ludzi, ktorych odmawia uznawac.
    - Wielki rod ma wiecej do stracenia na skandalu niz drobny - co czyni ciche zamkniecie
      sprawy Lucana i bardziej prawdopodobnym, i bardziej stanowczym.
current_state: structurally_present_everywhere_not_yet_directly_engaged_in_lucans_case
relationship_to_lucan:
  institutional_attitude: opportunistic_disinterest_escalating_to_retaliation
  summary: Nigdy nie interesowała się życiem Lucana, dopóki nie pojawiła się
    możliwość zarobku na nim. Zdecydowała wydać go za zamożną, rudowłosą
    kobietę (npc_lucan_former_fiancee) bez jego zgody. Lucan odmówił natychmiast
    po otrzymaniu tej decyzji - do żadnego formalnego etapu (spotkania, zaręczyn)
    nigdy nie doszło. Główna linia rodu mimo to brnęła w formalności jednostronnie,
    próbując zastraszyć go (i jego rodziców) do uległości, po czym eskalowała do
    pogardy, prześladowań i prób dyskredytacji - w tym ukręceniem mu dalszej
    edukacji magicznej. To ona, nie domniemana narzeczona, jest sprawcą tej
    eskalacji.
claims: [head_of_house_authority_over_side_branch, right_to_arrange_marriages_of_side_branch]
structure:
  established_by: event_turn_interlude_033_veyr_is_not_a_family
  established_how: Wyjasnione przez gracza slowami Lucana; przyjete jako kanon.
  principle: 'To NIE jest rodzina w zadnym osobistym sensie. To system gospodarowania -
    obsadzone fotele w roznych instytucjach naraz. Zawsze bedzie jakis profesor Veyr. Albo
    sedzia Veyr. Albo komendant Veyr. Lucan nie ma z tymi ludzmi nic wspolnego, ale z racji
    urodzenia jest w to wlaczony.'
  reach:
    confirmed_scope: [miasto, region]
    contested_scope: Zlosliwi mowia, ze caly kraj.
    hyperbole: Szurnieci mowia, ze swiat. To jest cytat z Lucana i element jego jezyka, NIE
      ustalony fakt swiata.
  consequences:
    - Nietykalnosc nieplatnej synekury Lucana NIE wisi na zyciu jego ojca - jest strukturalna.
      Zawsze jest jakis Veyr w odpowiednim fotelu. Wczesniejsza teza Seraphine o jednym zyciu
      zostala przez nia wycofana.
    - Spor o jurysdykcje nad Lucanem moze wcale nie byc sporem, a WEWNETRZNA REALOKACJA -
      nikt nie musi wygrac, ktos musi tylko zdecydowac.
    - Taki system nie skazuje i nie broni. On PRZYDZIELA. Najbardziej prawdopodobnym
      zakonczeniem sprawy nie jest kara, a posada - dobra i ze smycza. Zgodne z
      legal-order.yaml, ktore wymienia wymiane odstapienia od zarzutow na sluzbe, dostep,
      lojalnosc, milczenie albo oddanie odkrycia.
    - System nie prowadzi rejestru sympatii, prowadzi rejestr POZYCJI. Dwa lata uciekania nie
      wypisaly Lucana z niczego - zrobily z niego AKTYW NIEZARZADZANY, a takie zostaja
      zarzadzone w chwili, gdy staja sie widoczne.
  open_question:
    - Jesli fotele sa obsadzone w ten sposob, czy siec transportu zwlok po stronie strazy jest
      w ogole scigana, czy tolerowana przez kogos wystarczajaco wysoko? W drugim wypadku lead
      Lucana celuje w jego wlasny system, a szantaz nie jest dzwignia, a zgloszeniem sie do
      kolejki. Pytanie zadane przez Seraphine, bez odpowiedzi.
fears: [loss_of_status, side_branch_becoming_a_public_liability_or_scandal]
members_known:
  - {id: npc_lucan_father, relation: fourth_or_fifth_son_no_inheritance_prospects, status: side_branch_disinterested_bystander}
  - {id: npc_lucan_mother, relation: married_in_commoner_born, status: side_branch_performing_status}
  - {id: npc_lucan_former_fiancee, relation: intended_bride_chosen_by_head_of_house, status: refused_before_any_formal_meeting_family_proceeded_and_bullied_unilaterally}
knowledge:
