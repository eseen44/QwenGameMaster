  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - silnik uznal to za automatyczne: material lezy na stole, nikt
    nie przeszkadza, brak presji. Godzina przebierania daje Lucanowi pelny obraz i
    jedna zla wiadomosc, ktorej nie szukal. 1. CO JEST W UROBKU. Okolo czterdziestu
    cial, posortowane wedlug trzech kryteriow naraz - swiezosci, wielkosci i tego,
    czy sieciarze nie zmiazgly srodka przy pakowaniu. Realnie na cialo okazu nadaje
    sie DZIESIEC. Pajaki piwniczne (szesc, najlepsze - dlugonogie, ciche, wchodza
    w kazda szczeline, sylwetka nudna). Osy (trzy cale z pieciu, i to one sa nagroda,
    bo LATAJA - ale skrzydla sa cienkie i jedno uderzenie o mur je konczy). Stonogi
    (dwie, szybkie i plaskie, doskonale w scianach, obrzydliwie biologiczne w ruchu).
    Chrzaszcze (osiem, opancerzone i tepe - dobry nosnik, zly szpieg). Reszta to czesci
    albo smiec. 2. CIALA NIE SA WASKIM GARDLEM. Pajak piwniczny jest w kazdej piwnicy
    Lumarii; sieciarze przyniosa tyle samo nastepnej nocy i nastepnej. Materialu na
    "znacznie wieksza populacje" jest w miescie nieskonczenie duzo i to jest jedyna
    czesc tego planu, ktora nie kosztuje nic. 3. WASKIE GARDLO PIERWSZE - OKNO SWIEZOSCI.
    Urobek ma noc. Czesc cial jest juz za granica metody i nadaje sie tylko na czesci;
    z tej dziesiatki do rana wypadnie kolejne kilka. Co ma zostac podniesione z tej
    partii, musi zostac podniesione DZIS. 4. WASKIE GARDLO DRUGIE, POWAZNIEJSZE -
    ODBIORNIK. Rozdzielczosc kanalu nigdy nie byla wada oczu pajaka, tylko wada odbiornika.
    Lucan jest odbiornikiem. Spidey plus czterech sieciarzy to piec jednoczesnych
    wrazen i to juz jest szum, ktory trzeba swiadomie rozsortowywac. Dwadziescia zrodel
    nie da dwudziestu razy wiecej informacji; da dwadziescia razy wiecej szumu i mniej
    z kazdego. Siec szpiegow wymaga inwestycji w LUCANA albo w przekaznik miedzy nim
    a sieciarzami - to trwaly krok wzrostu, nie kolejny okaz na stole, i nie jest
    policzony. 5. WASKIE GARDLO TRZECIE - CZAS DOJRZEWANIA. Swiezo utworzony pajak
    jest posluszny, tepy i bardziej konstruktem niz sluga - dokladnie to, po co jest
    wabik, i dokladnie to, czego szpieg NIE moze byc. Szpieg potrzebuje sadu. Sad
    przychodzi z wiekiem, a razem z nim temperament. Populacja postawiona dzis jest
    siecia termometrow, ktora za kilka tygodni zamieni sie w siec czegos, co ma wlasne
    zdanie. 6. UTRZYMANIE JEST TANIE, ALE WIDOCZNE. Kazdy okaz to kolejny zbiornik
    tracacy jednostke na dobe i odrabiajacy ja polowaniem - czyli kazdy z nich musi
    nocami WYCHODZIC. Dwadziescia malych rzeczy polujacych w jednej dzielnicy to nie
    koszt energii, to wzor, ktory ktos w koncu zauwazy. 7. SIECIARZ CZEKA. Ten przy
    baszcie (5/6 zbiornika, wciaz oddajacy cwiartke na dobe Varkhenowi) siedzi nad
    rozlozonym materialem i czeka na polecenie, czy nastepnej nocy przyniesc wiecej
    i czego szukac.'
  new_decision: 'Okno swiezosci zamyka sie do rana. Co schodzi ze stolu tej nocy -
    i z ktorych cial: pierwszy okaz serii szpiegowskiej, maly pajak alarmowy obiecany
    Seraphine, czy oba, jesli energia i noc wystarcza na dwa proste okazy.'
