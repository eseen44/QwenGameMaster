  new_decision: 'Cmentarz, przy rampie, 21:52, dzien piaty. Ciemno. Bez zmiany wzgledem
    t_299 - ta tura nie zajela ani sekundy. LUP SCHOWANY W loc_tannery_cellar_hideout:
    osiem workow, okolo 55 kg, w zawalonej piwnicy przy garbarni, ktora byla PIERWSZA
    KRYJOWKA LUCANA (milestone_005). Drzwi od ulicy nie ma. Weszli OD LAKI ZA GARBARNIA
    - na wpol zawalonymi schodami przy murze, zarosnietymi na tyle, ze trzeba wiedziec,
    gdzie sie odgarnia. Druga droga, przez podziemia kopca, istnieje i nie byla dzis
    uzyta; stan kopca po Akcie 1 pozostaje NIEUSTALONY. Boros byl tam raz - wywozil
    stamtad papiery garbarnika do Seraphine - i nie skomentowal, ze ktos tam mieszkal.
    Mara nie schodzila, zostala przy koniu. WEJSCIE DO SKLADU JEST DWADZIESCIA KROKOW
    OD DWOCH WLASNYCH SIECIARZY Lucana, ktorzy siedza na tej lace od t_091 i zbieraja
    owady zamiast pilnowac rewirow. MELDUNKI SIECI bez zmian: wszystkie wezly odpowiadaja,
    ale z odleglosci kanal niesie OBECNOSC, nie tresc. To, co Toby slyszal na zapleczu
    syndykatu, czeka, az Lucan przy nim stanie. Tkacz - jedyny pelny odczyt: przez
    caly dzien do rampy nie podszedl nikt poza grabarzem. RACHUNEK LUCANA: lup lezy
    na parceli, ktora MA przypisany zmysl obszarowy, ale sieciarz jest od t_091 na
    lace. Zdjecie rozkazu to jedno slowo i narrator go nie wypowiedzial. WORKI: dwadziescia.
    Rezerwa 14,6/15. OTWARTE: czy schodza nizej dzis po ciemku, czy Lucan odsyla sieciarza
    na parcele garbarni, czy ktos w koncu spi.'
