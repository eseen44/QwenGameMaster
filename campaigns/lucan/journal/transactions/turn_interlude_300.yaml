  summary: 'POWTORKA t_299, ZAKRES: PROZA, CZAS ZERO. Zegar, stan sieci i wszystkie
    fakty poza miejscem skladowania zostaja. t_299 dostaje superseded_by ze scope
    prose. CO BYLO HALUCYNACJA: narrator zadeklarowal NOWA zone_cellar w loc_tannery
    i dopisal do niej klodke na skoblu, wejscie od podworza, dwie beczki bez dna,
    zapach wapna, wizyte Borosa "w maju" i otwieranie dragiem. Zaden z tych szczegolow
    nie ma zrodla. CO JEST W PLIKACH: loc_tannery_cellar_hideout - ZAWALONA PIWNICA
    PRZY GARBARNI, pierwsza kryjowka Lucana (milestone_005, confidence confirmed).
    Odwolywana z czterech miejsc i bez wlasnego pliku, ktory powstal przy tej poprawce.
    FURTKI I DRZWI OD ULICY NIE MA, ale sa DWIE drogi. GLOWNA, uzupelniona przez gracza:
    od strony LAKI ZA GARBARNIA - na wpol zawalone schody, zarosniete, malo widoczne,
    przytulone do muru; tedy wnosi sie ladunek bez schodzenia pod ziemie. DRUGA, przez
    podziemia: wlaz z podworza, kopiec loc_rat_mound, zone_old_cellar_link, connection_old_cellar
    (2 min). ZBIEG OKOLICZNOSCI, KTORY WART JEST ODNOTOWANIA, a nie jest zaczepka:
    laka za garbarnia to ta sama parcela, na ktorej od t_091 stoja DWAJ sieciarze
    - webber_tannery i webber_home - zbierajac prostoskrzydle zamiast pilnowac rewirow.
    Wejscie do skladu jest dwadziescia krokow od nich. BOROS PAMIETA TO Z JEDNEJ ROBOTY,
    podanej przez gracza: pomagal wywiezc stamtad DOKUMENTY WLASCICIELA GARBARNI do
    Seraphine. Narrator nie rozszerza tej pamieci ani o zdanie. CZEGO NARRATOR CELOWO
    NIE ROZSTRZYGA: stanu podziemi kopca po Akcie 1. loc_rat_mound ma w layoucie zone_colony_edge
    i zone_rat_ogre_breach; zaden plik nie mowi, co tam jest DZIS, wiec droga jest
    opisana jako przejscie, a nie jako pusta ani jako niebezpieczna. ZOSTAJE BEZ ZMIAN:
    meldunki sieci i ich ograniczenie, pelny odczyt Tkaczki, dwadziescia workow, brak
    zaczepki, powrot pod cmentarz, godzina 21:52.'
  prose: '— Mamy to gdzie składować?


    Boros myśli przez trzy kroki konia.


    — Piwnica przy garbarni — mówi Lucan, zanim tamten skończy. — Powinieneś pamiętać.


    I Boros pamięta, bo był tam raz i z konkretnego powodu.


    — Woziliśmy stamtąd papiery garbarnika — mówi. — Do niej. — Nie wymienia imienia
    i nie musi.

    — Nie ma tam drzwi od ulicy. Wchodzi się od łąki, schodkami przy murze.


    — Zgadza się.


    Wyjeżdżają bramą jak każdy wóz, który cały dzień woził gruz, i nikt na nich nie
    patrzy,

    bo nie ma po co. Grabarz siedzi przy szopie i je.


    — Jakby ktoś nas zaczepiał, pacnijcie mnie — mówi Lucan i opiera głowę o deski.


    Potem przez większość drogi go nie ma.


    Sieć odpowiada cała i to jest pierwsza rzecz, którą sprawdza: nikogo nie brakuje.
    Żuki

    wokół baszty, pająki na swoich miejscach, ćmy i osa na łąkach, wije pod dzielnicą
    gildii,

    szczury w kanale pod garbarnią, do której właśnie jadą. Wszyscy są.


    I to jest wszystko, co dostaje.


    Bo z tej odległości kanał niesie obecność, a nie treść. Pająk siedzący w skrzynce
    na

    zapleczu syndykatu jest dla niego w tej chwili jedną rzeczą: *jest*. Co słyszał
    przez cały

    dzień, zostanie w nim do momentu, w którym Lucan stanie dwadzieścia kroków od
    tej skrzynki

    i weźmie to sam.


    Jeden węzeł jest wyjątkiem, bo został pół mili za nimi.


    Tkacz oddaje pełny rewir i oddaje go tak, jak oddaje się rzecz prostą: przez cały
    dzień

    do rampy nie podszedł nikt poza jednym człowiekiem w południe, tym samym, który
    potem

    wrócił do swojej łopaty. Nikt nie krążył. Nikt nie stanął i nie patrzył. Nikt
    nie wszedł

    za nimi.


    Lucan wraca do siebie gdzieś w połowie drogi i robi rachunek, którego nie robił
    przez cały

    dzień: sieciarz przypisany do garbarni siedzi od dwóch tygodni na łące i zbiera
    prostoskrzydłe,

    bo ktoś kiedyś tak kazał. Jego parcela stoi pusta. A za pół godziny Lucan położy
    na tej

    parceli pięćdziesiąt pięć kilo czegoś, czego nie da się wytłumaczyć.


    Nikt go nie pacnął przez całą drogę.


    Nie jadą pod podwórze. Podjeżdżają od łąki.


    Wejście jest tam, gdzie było: przy samym murze, po wpół zawalonych schodach, tak
    zarośniętych,

    że trzeba wiedzieć, gdzie się odgarnia. Lucan odgarnia to bez patrzenia. Ktoś,
    kto nie wie,

    przejdzie tędy dziesięć razy i zobaczy krzak przy murze.


    Osiem worków schodzi po dwa, ostrożnie, bo trzeci stopień od dołu ma tylko połowę
    siebie.


    Kryjówka jest dokładnie taka, jaką ją zostawił: zapadnięty strop po jednej stronie,
    kawałek

    klepiska, który kiedyś był jego podłogą, i miejsce pod ścianą, gdzie stał siennik.


    Worki lądują właśnie tam.


    Boros rozgląda się po tym raz, z lampą przy biodrze, i nie mówi ani słowa o tym,
    że ktoś

    tu kiedyś mieszkał. Mara w ogóle nie schodzi — zostaje na górze przy koniu, bo
    ktoś musi.


    Worki Boros załatwia po drodze powrotnej, u kogoś, kogo nie przedstawia, i wraca
    z pękiem

    dwudziestu na ramieniu.


    — Będzie — mówi. — Do gildii nie jedziemy?


    — Nie dzisiaj.


    — Dobrze.


    Wóz zawraca pod cmentarz, a nad miastem jest już zupełnie ciemno.

    '
