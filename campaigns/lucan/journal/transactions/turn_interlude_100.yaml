  declared_action: Lucan stawia oba pajaki na uzgodnionych miejscach - jednego w szufladzie
    biurka Seraphine, drugiego we wlasnym pokoju na gorze jako czujnik przeszukania
    - i wychodzi z gildii do Borosa i Mary na dzisiejsze spotkanie. Zuka do pokoju
