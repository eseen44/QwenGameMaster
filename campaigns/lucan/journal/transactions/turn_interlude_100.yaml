    path: position
    value:
      location_id: loc_lumaria_adventurers_guild
      zone_id: zone_guild_upper_offices
      detail: lucans_cover_room_search_sensor
  - *id002
  summary: 'Bez testu. Czterdzieści minut: dwa czujniki postawione, wyjscie z gildii,
    marsz. Zero energii - rozkaz istniejacej sludze nic nie kosztuje. 1. PIERWSZE
    DWA CZUJNIKI W SIECI, KTORE POWSTAJA ZA ZGODA, A NIE OBOK NIEJ. spy_cellar_spider_03
    wchodzi do szuflady biurka Seraphine, spy_cellar_spider_04 do pokoju na gorze.
    Oba niezakotwiczone, oba tam, gdzie sluga jest najlepsza: w zamknieciu, bez ruchu
    na widoku, bez niczego, na co ktos moglby patrzec dluzej niz pol sekundy. Warunek
    Seraphine byl instytucjonalny i zostal spelniony - wie, kiedy weszly, i wie, w
    ktorych dwoch pomieszczeniach sa. Dalej zaczynaja sie cudze pokoje. 2. CZUJNIK
    PRZESZUKANIA W POKOJU NA GORZE ZAMYKA KONSTRUKCJE, KTORA BUDUJE SIE OD TURY 072.
    Pokoj byl przykrywka bez ostrzegania: przeszukanie znalazloby wygniecione lozko
    i trzy nudne ksiazki, ale Lucan dowiedzialby sie o nim po fakcie albo nigdy. Od
    teraz drgania w tym pokoju maja odbiorce. Przykrywka przestaje byc tylko dekoracja
    i zaczyna byc czujnikiem. 3. ZUK ODLOZONY - I DOBRZE, BO PLAN MIAL W SOBIE POMYLKE.
    Zapisane jako lead_council_room_beetle_deferred, nie wykonane. Trzy rzeczy, ktore
    trzeba pamietac: (a) spy_beetle_01 JUZ MA uszy z tury 089 - problem nie jest brak
    narzadu, tylko PASMO, bo cma slyszy nietoperze, a nie slowa; potrzebny jest narzad
    prostoskrzydlego, ok. godziny pracy, a trzej sieciarze sa juz po material i laki
    graja do konca sierpnia. (b) Wlasciwe ucho nie poszerza lacza - zostaje minimal_status
    i pozyczanie zmyslu z bliska, a sluchanie na zywo zjada caly slot uwagi Lucana
    (event_turn_interlude_086). Prawdziwy podsluch jest problemem ZAPISU, nie sluchu.
    (c) "Antydetekcja" nie jest problemem magicznym: slad nie niesie autora (retcon_000028),
    pajeczyna jest brudem (retcon_000029). Realne ryzyka to but sprzataczki i to,
    ze zuk jest ZAKOTWICZONY - sekcja ujawnia Death_Anchor, czyli nazwana technike,
    a nie martwego robaka. Maskowanie znaczy schowek niedostepny dla miotly, nie zaklecie.
    4. WYJSCIE. Lucan schodzi przez hol - ten sam, w ktorym rano rozsial pechy i dal
    sie zapamietac - i wychodzi na miasto. Zostawia w budynku: Spideya i zakotwiczonego
    zuka w celi, dwa nowe czujniki na gorze, Varkhena na kroplowce w gabinecie Seraphine,
    spy_cellar_spider_06 w piwnicy i Halvena Ruska z przekletym piorem. 5. CO NIESIE
    NA SPOTKANIE. Dwa tematy zamowione dwa dni temu - pieniadze z szescdziesieciu
    kilo i prawnik z obiegu przestepczego - plus dwie rzeczy, ktorych nikt poza nim
    jeszcze nie zna: MALEN CORTH uzgadnia akta z garbarni z nazwiskiem Lucana po stronie
    MAGISTRATU, gdzie Seraphine nie ma jurysdykcji, oraz Rusk ma wlasny, nieurzedowy
    odpis kanalow i piwnic pod dzielnica gildii, lezacy w jego gabinecie. 6. I JEDNA
    RZECZ, KTORA ZAMOWIL U MARY, A KTORA JEST NOWA. Zamierza poruszyc z nia wlasna
    slabowitosc fizyczna i poprosic o pomoc z cwiczeniami. Karta Lucana mowi to bez
    ogrodek: bez przygotowania pozostaje fizycznie w zakresie zwyklego, niezbyt silnego
    czlowieka, a cala jego przewaga idzie z wiedzy, przygotowania, slug i cudzych
    slabosci. Mara jest zwiadowczynia rangi C, cicha i uwazna, ktora widziala go w
    komorze Varkhena i ma wobec niego dwa podejrzenia o sredniej pewnosci - w tym
    to, ze kontroluje Varkhena. Prosba o trening jest wiec pierwsza rzecza, o ktora
    Lucan prosi ja OSOBISCIE. 7. STAN. 11:40 dnia trzeciego. Energia 8 z 15, integralnosc
    19 z 19, bez warunkow. Pudelko puste. Wszystkie cztery pajaki piwniczne rozstawione.'
  new_decision: Lucan idzie na spotkanie z Borosem i Mara. Na stole beda pieniadze,
    prawnik syndykatu i prosba o trening - a w kieszeni dwie rzeczy, o ktorych nie
    wie jeszcze nikt.
