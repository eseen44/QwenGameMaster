    za zawalem jest POMIESZCZENIE ZBUDOWANE PO TO, ZEBY ICH TAM KLASC. Wszystko czyta
    sie plasko i staro; nic swiezego, nic co drgnelo. Uklad urywa sie w glab - koniec
