outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PROCEDURA STALA ZAPISANA (deklaracja gracza w nawiasie, zero czasu): abilities.yaml#ability_geo_protocol.standing_procedure
    - przed kazdym skanem Lucan odsyla wlasne okazy poza zasieg. Od teraz jest to
    ODRUCH POSTACI i narrator NIE odegra tej samej straty trzeci raz. Nie dotyczy
    kanalu kamienia; Stone Sense czyta drgania i wlasny pajak mu nie przeszkadza.
    DRUGI SKAN, KANAL CZYSTY. Co Grave Sense daje wedle karty: PATTERNS, NOT COMPLETE
    EXPLANATIONS. Stad odczyt jest ukladem, nie inwentarzem: duzo umarlych, starych,
    ulozonych REGULARNIE i w odstepach - czyli nisze grobowe, czyli miejsce ZBUDOWANE,
    nie naturalna pustka. Zgadza sie to z discovery.yaml podziemi, ktore ma old_lower_structure
    jako odkryty sekret bez opisu. CZEGO NIE MA W ODCZYCIE, i jest to wazniejsze od
    tego, co jest: niczego swiezego i niczego, co sie rusza. Wszystko czyta sie plasko
    i staro. CZEGO TEN ZMYSL NIE ZOBACZY W OGOLE: ZYWEGO. Lucan sam to nazwal na wozie
    godzine temu (t_285) - a to wlasnie zywe za sciana nazwal jedynym momentem, w
    ktorym moze pojsc naprawde zle. Skan NIE rozstrzyga wiec jego wlasnego ryzyka
    i narrator tego nie zaciera. Nie jest to komplikacja dolozona przez narratora:
    to limit z karty zdolnosci, ktory gracz zna i sam wypowiedzial. ZASIEG: odczyt
    urywa sie w pewnej odleglosci i dalej nie ma nic - pustka albo koniec zasiegu,
    NIEROZSTRZYGNIETE. Zaden plik nie daje Geo zasiegu w metrach; sto metrow z t_285
    dotyczylo rekonesansu SIECIA, nie tego protokolu, i narrator tych dwoch rzeczy
    nie miesza. KOSZT: 0,1 jednostki, 14,9 -> 14,8.'
  prose: 'Spidey odchodzi, zanim komenda zdąży się skończyć.


    Nie w bok i nie za plecy — wraca korytarzem tam, skąd przyszli, i idzie dalej,
    niż trzeba,

    bo tak robi zawsze. Dopiero kiedy przestaje być słyszalny, zatrzymuje się i siada

    w ciemności, żeby poczekać.


    Dłoń wraca na ścianę. Tym razem Lucan zaczyna od tej drugiej połowy.


    Kanał otwiera się czysto i to jest pierwsza dobra wiadomość, bo znaczy, że cała
    smuga

    sprzed dwóch minut naprawdę miała osiem nóg i właśnie poszła sobie do domu.


    A potem przychodzi to, co jest za gruzem, i jest tego dużo.


    Nie jako liczba — jako **układ**. Dziesiątki, może więcej, i wszystkie ułożone
    równo:

    w rzędach, w odstępach, jedna nad drugą, z tą samą przerwą między każdą a następną.
    Nikt

    nie umiera w odstępach. Tak się umarłych **układa** — i to znaczy, że za tym zawałem
    nie

    ma dziury w ziemi, tylko pomieszczenie, które ktoś zbudował po to, żeby ich tam
    kłaść.


    Wszystko czyta się płasko. Staro. Bez jednego punktu, który byłby świeższy od
    reszty,

    i bez jednego, który by drgnął.


    Układ ciągnie się w głąb, a potem urywa — czy dlatego, że tam się kończy, czy
    dlatego,

    że dalej ręka już nie sięga, kamień nie powie.


    Lucan cofa dłoń ze ściany i przez chwilę stoi bez ruchu.


    Bo jest jeszcze jedna rzecz, i wie o niej dokładnie od godziny, bo sam ją powiedział
    na

    wozie: ten zmysł czyta umarłych. Cokolwiek za tym gruzem oddycha, nie zostawiło
    w tym

    odczycie ani jednego śladu — i nie zostawi.


    — Coś tam jest? — pyta Boros. Kilof trzyma opuszczony i nie robi kroku.

    '
