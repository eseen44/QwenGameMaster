  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero wydane.

    Falszywe imie, uscisk dloni i rysopis kupuja nazwisko.


    0. KOREKTA GRACZA PRZYJETA - I MIALA POKRYCIE OD t_052. Narrator odmowil podania
    rysopisu

    straznika, twierdzac, ze Lucan go nie ma, bo znalazl tylko item_watch_transport_permit

    z nieczytelnym nazwiskiem. Gracz wskazal zrodlo: rysopis podali ZATRZYMANI Z WOZU.

    Ma racje i dowod stal w pliku przez caly czas - t_052 mowi, ze Seraphine przyjela
    zlecenie

    na gospodarstwo domowe "WSKAZANEGO straznika". Wskazac mozna wylacznie kogos,
    kogo sie ma.

    Rysopis nie byl nigdy dopisany do karty npc_halvek_wagonman ani do leadu - awaria

    dokladnie wg retcon_000121 (karta jest tak swieza, jak ostatni dopisek, nie jak
    ostatnia

    tura). Zapis naprawiony: karta Halveka i nowa karta npc_ossek_marn.

    NIE JEST TO RETCON. Nic nie zostalo cofniete - uzupelniono brakujacy zapis istniejacego

    faktu.


    1. "MARC" WCHODZI I NIE ZOSTAJE SPRAWDZONY. Lucan potwierdza zalozenie, ktore
    Dast zrobil

    sam w t_206 (belief_dast_thinks_lucan_is_a_tradesman), podaje falszywe imie i
    wyciaga reke.

    Dast ja sciska - dla niego czlowiek ze skrzynka to dostawa, a dostawa ma imie,
    nie sprawe.

    Zadnego pytania o nazwisko, zadnego wpisu. Falszywa tozsamosc nie jest w tej turze

    testowana przez nic i przez nikogo; narrator NIE zapowiada, ze bedzie.


    2. RYSOPIS OSADZONY, NAZWISKO PADA: OSSEK MARN. Wiek, posterunek i "ten od podnoszenia

    bramy wozom" to nie jest dla Dasta informacja poufna - to jest NAGLOWEK. Dwadziescia
    lat

    za tym kontuarem znaczy, ze rejestr posterunkow i zmian ma w glowie, a czlowiek
    pytajacy

    o kolege nie pyta o nic, za co Dast musialby potem odpowiadac (portrayal#what_he_refuses
    -

    granica dotyczy nazwisk, ktore WRACAJA, nie nazwisk z rozdzielnika).

    MARN NIE JEST PODPISUJACYM GLEJT i narrator tego nie sugeruje. t_036 ustalilo,
    ze TYP

    autoryzacji stalej trasy stoi PONAD szeregowym konstablem. Marn jest reka przy
    dragu,

    nie glowa nad papierem. To sie nie zmienia.


    3. "SIWA SUKA Z GILDII" TRAFIA - I JEST TO RYSOPIS, NIE WYZWISKO.

    entities/npcs/seraphine-vale.yaml#appearance ma wprost silver_hair. Zdanie Lucana
    jest

    wiec ROZPOZNAWALNYM opisem konkretnej osoby, nie ogolnikiem.

    DAST JEJ NIE IDENTYFIKUJE i narrator mu tego nie doklada - nie zna Seraphine,
    nie wie,

    kto po stronie gildii opiera sie zadaniu, i nie robi zadnego polaczenia ze sprawa

    cmentarna (retcon_000040: NPC nie jest madrzejszy od gracza z urzedu). Trafia
    w co innego:

    w slowo GILDIA, ktore jest jego wlasna zaloscia z t_206, bo trzeci raz w tym tygodniu

    przepisywal pismo, na ktore gildia nie odpisuje. Historia o kolegu, ktoremu gildia
    nie

    daje zyc, jest dla niego POTWIERDZENIEM, nie zagadka. Rozgrzewa go, zamiast zamykac.


    4. CO Z SIEBIE DAJE POZA NAZWISKIEM - I DLACZEGO TO JEST WAZNIEJSZE NIZ NAZWISKO.

    Wraca do wlasnej sprawy, tak jak powinien (retcon_000040), i skarzy sie na oddzialy

    bramne: przepuszczaja na papiery, ktorych on nigdy nie oglada. Dla niego to niechlujstwo

    i lekcewazenie kontuaru.

    DLA LUCANA TO JEST DEFEKT INSTYTUCJI OPISANY OD SRODKA PRZEZ CZLOWIEKA, KTORY
    NIE WIE,

    CO OPISUJE. Dokladnie to ustalili z Seraphine w t_035 i t_036: glejt jest BLANKIETEM,

    urzad wystawia wladze bez atrybucji, a "odkad urzad wie, ze taki dokument istnieje
    POZA

    nim, musi zalozyc, ze jest ich wiecej, bo blankietow nie da sie odwolac, jesli
    nie da sie

    ich zliczyc". Dast wlasnie potwierdzil od dolu, ze papiery przechodza przez brame
    poza

    jego ksiega.

    NARRATOR NIE ROZWIJA TEGO ZA GRACZA: nie podaje urzedu, nie podaje ilosci, nie
    mowi,

    ze to ten sam papier co glejt Lucana, i nie pozwala Dastowi tego skojarzyc.


    5. CZEGO NARRATOR TU NIE ZROBIL (retcon_000058, retcon_000055). Zadnej listy,
    zadnego

    rejestru wyniesionego na blat, zadnego spisu przepustek. Dast nie wymienia innych

    straznikow, nie zna lancucha autoryzacji polnocno-zachodniej zapory (to jest u
    Seraphine,

    t_052) i nie podejrzewa "Marca" o nic. Nie powstalo zadne sledztwo, zaden zegar
    i zaden

    termin. Nikt nie poszedl nikogo ostrzec.

    Nie ustanowiono tez, ze Ossek Marn wie o tym pytaniu. Nie wie - nikt mu nic nie
    przekazal.


    6. CO JEST TERAZ STAWKA. Dast jest czlowiekiem, ktory GADA - to jest jego cecha,
    nie kara.

    Ma dzis pierwsza od dawna rozmowe, w ktorej nikt niczego od niego nie chcial,
    i ma o niej

    co opowiedziec. Narrator NIE rozstrzyga, komu i czy w ogole; odnotowuje wylacznie,
    ze

    "Marc pytajacy o Marna i o babe z gildii" jest historia, ktora ten czlowiek MOZE
    powtorzyc.

    Zadnej konsekwencji z tego dzis nie wynika.


    7. STAN. Czwarty dzien interludium, 14:49, izba od ulicy w komendzie strazy miejskiej.

    Obecni: Lucan (jako Marc), Verek Dast. Energia i integralnosc bez zmian poza regeneracja.

    Zegary bez ruchu poza uplywem czasu. Skrzynka szkla przy nodze. Zuk w kieszeni.
    Spidey

    w gildii. W ksiedze nadal nie ma ani jednego wpisu, a pioro nadal lezy.

    '
