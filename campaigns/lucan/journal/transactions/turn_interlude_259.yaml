  summary: 'OBSADA NISZY USTALONA: zostaje sam spy_beetle_01 przy zbiegu trzech torow
    (ok. 1,8 na dobe wobec jego sufitu 1,5 - retcon_000165 i notatka w discovery).
    Spidey i Tkacz wyszli na rozkaz mentalny (zero sekund, retcon_000032/000060) i
    dogonili Lucana w czasie marszu. Do growth-banks nadal nie wchodzi zadna stawka
    - wejdzie, gdy obsada bedzie ustalona na stale i bedzie co zmierzyc. GEO: siedem
    skanow po 0,1 = 0,7 (cantrip, energy_cost_per_declared_scan z karty). Wynik jest
    PASEM wzdluz trasy, nie mapa - limit repeated_detailed_scans_consume_time_and_attention
    i combined_noise obowiazuja. Co weszlo do wiedzy Lucana: pustki ukladaja sie w
    linie rownolegle do trasy i schodza glebiej ku wschodowi; pod tym poziomem jest
    DRUGI, starszy, bez sladu kol i rynien; zageszczenie smierci lezy POMIEDZY grobami
    i pod nimi, warstwami glebiej niz siega skan. Zrodla: discovered_secrets#old_lower_structure,
    layout#zone_old_lower_route, #zone_unresolved_sealed_depths z feature_unknown_lower_seal,
    oraz sito pustek z t_253. To jest POTWIERDZENIE skali z retcon_000166 odczytem
    z terenu, nie nowa struktura dopisana przez narratora. VARKHEN ODPOWIADA Z WLASNEJ
    WARTY: stan trzech pieczeci podaje zgodnie z objectives#varkhen_three_seals_oath
    (pierwsza pekla, druga zabrudzona, trzecia trzymala, gdy go wynoszono) i WPROST
    zaznacza, ze nie wie, co jest prawda dzis - to jego wiedza sprzed uszkodzenia,
    nie pomiar. Dodaje, ze cmentarz polozono na wierzchu czegos starszego, co jest
    wiedza jego roli, i ze pilnowal dolnej bramy z rozkazu, a nie z wiedzy, co za
    nia lezy. O drodze mowi jedno zdanie: ta, ktora chodzil, to osuwisko, ktorym go
    stad wyniesiono (connection_varkhen_collapse, travel_time uncertain_after_collapse).
    Nazwanie tej przeszkody jest licencjonowane przez retcon_000152 i zrodlowane plikiem;
    zegara, terminu ani pogoni nie dodano. RUCH: loc_cemetery_underworks -> loc_cemetery,
    zone_north_ramp. Uczestnicy sceny bez zuka, ktory zostaje pod ziemia. NIEUSTALONE:
    co lezy na drugim poziomie, czy trzecia pieczec nadal trzyma, czy da sie zejsc
    do dolnej bramy inaczej niz osuwiskiem.'
  prose: "Żuk został sam i nie zauważył nawet, że ktoś mu ustąpił miejsca. Spidey\
    \ wylazł\nz rowka bez pretensji, ale najpierw oczyścił sobie odnóża z fundamentowego\
    \ pyłu,\na dopiero potem ruszył. Tkacz wyszła zaraz za nim i nie obejrzała się\
    \ na żadne\nz nich. Dogonili ich w połowie hali - jedno po ścianie, drugie po\
    \ podłodze.\n\nGeo co kilkadziesiąt kroków kosztuje tyle, co nic, i przez pierwsze\
    \ trzy razy daje\nto samo, co zawsze: kamień, pustka, kamień. Za czwartym zaczyna\
    \ się układać w coś,\nczego z góry nie było jak zobaczyć, bo z góry widziało się\
    \ plamę. Pustki nie leżą\nprzypadkiem. Idą liniami, równolegle do tunelu, którym\
    \ właśnie się idzie, i im dalej\nna wschód, tym głębiej schodzą. A pod poziomem,\
    \ po którym stąpają, jest drugi.\nNie techniczny: kamień inny, starszy, cięty\
    \ inaczej, bez śladu kół i bez rynien.\n\nDruga połowa protokołu mówi to samo\
    \ od drugiej strony. Zagęszczenie śmierci nie\nsiedzi tam, gdzie są groby. Siedzi\
    \ pomiędzy nimi i pod nimi, warstwa na warstwie,\ni schodzi głębiej, niż sięga\
    \ skan. To, na czym stoi ten cmentarz, nie jest cmentarzem.\nCmentarz jest skórką.\n\
    \nPytanie o stan tego miejsca Varkhen przyjął tak, jak przyjmuje pytania o swoją\
    \ wartę:\nbez wstępu.\n\n- Trzy pieczęcie - powiedział. - Pierwsza pękła. Drugą\
    \ ktoś zabrudził. Trzecia\n  trzymała, kiedy mnie stąd wynosili. Czy trzyma teraz,\
    \ nie wiem i nie będę zgadywał.\n\nPrzeszedł kilka kroków i dodał resztę, bo pytanie\
    \ było o całość.\n\n- To nie jest cmentarz. Cmentarz położono na wierzchu. Dolna\
    \ brama jest starsza\n  ode mnie. Pilnowałem jej, bo mi kazano, nie dlatego, że\
    \ wiem, co za nią leży.\n\nA potem, już przy samej rampie, jedno zdanie więcej,\
    \ bez proszenia:\n\n- Droga, którą tam chodziłem, to ta, którą mnie stąd wynieśli.\
    \ Osuwisko.\n\nRampa wypuszcza ich w noc. Powietrze jest o dziesięć stopni cieplejsze\
    \ i pachnie\nmokrą trawą zamiast kamieniem; nad polem grobów stoi ta sama cisza\
    \ co zawsze, a od\nzachodu, daleko, czernieje bryła kaplicy. Za plecami zostaje\
    \ otwarta brama, której\nnikt nie zamyka od lat, a dwa poziomy niżej i kilkaset\
    \ kroków stąd siedzi w kamiennej\ndziurze bardzo zadowolony żuk.\n"
