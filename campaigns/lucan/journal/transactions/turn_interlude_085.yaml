outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Podzial skrzyni na dwie kupki zajmuje pol godziny i wychodzi
    z niego rzecz wieksza niz cala reszta targu. 1. SORTOWANIE. Atlasy i brulion balwierza
    ida na bok do przeniesienia w baszte - i to jest wlasciwy adres nie tylko z ostroznosci:
    warsztat Lucana i jego stol sa w baszcie, a atlasy sa materialem do PRACY, nie
    do czytania w lozku. Makulatura zostaje w celi jako rekwizyt przykrywki. 2. CZYM
    JEST TOM Z SYGNATURA. To akademicki podrecznik medyczny o PRZYWRACANIU RUCHU I
    ODDECHU CIALU, KTORE PRZESTALO - utopionym, poraz onym, zaczadzonym, pozornie
    zmarlym. Rzecz licencjonowana, recenzowana, z sygnatura biblioteki AKADEMII wypalona
    w okladce. Balwierz ukradl ja z powodu calkowicie zrozumialego: przywrocenie utopionego
    jest jedynym cudem, ktory balwierz moze zrobic publicznie i za ktory moze policzyc.
    3. DLACZEGO TO JEST WAZNIEJSZE NIZ ATLASY. Obrona klasyfikacyjna Lucana stala
    do tej pory na argumencie o odzywianiu, ktory sam gracz rozebral (ozywieniec tez
    sie odzywia, retcon_000023). TO jest lepszy fundament: instytucja, ktora bedzie
    Lucana sadzic, ma w swojej wlasnej bibliotece licencjonowany, recenzowany traktat
    o przywracaniu ruchu ciala, ktore stanelo. Granica "zywe/martwe" jest u nich samych
    opisana jako CIAGLOSC z procedura, nie jako przepasc. Nie jest to uniewinnienie
    - jest to jezyk i precedens Z ICH WLASNEJ POLKI, po ktory nie trzeba niczego zmyslac.
    4. MARGINALIA TA SAMA REKA CO W ATLASACH. Balwierz probowal z tego korzystac i
    notowal proby - kto, kiedy, jak dlugo pod woda, czy wrocil. Wiekszosc wpisow konczy
    sie nie. Kilka nie. To grymasna lektura, ale to takze DANE: sekwencja prob i granica,
    po ktorej balwierz przestawal probowac. 5. CZEGO SYGNATURA NIE UKRYWA. Sygnatura
    mowi, ktora biblioteka stracila tom, i biblioteki prowadza rejestr ubytkow. Ktos
    w Akademii ma zapis, ze ten wolumin zniknal, i date. Lucan jest czlonkiem tej
    Akademii i za czternascie dni ma tam byc wezwany. Oznacza to dwie czyste drogi,
    obie legalne: oddac tom jako znaleziony - co jest przysluga, powodem do wejscia
    do biblioteki i pierwszym w tej sprawie kontaktem, w ktorym Lucan daje, a nie
    bierze - albo zatrzymac i miec u siebie rzecz, ktora prowadzi do instytucji. 6.
    NIC NIE PRZENIESIONE. Kupki lezą w celi. Do baszty Lucan jeszcze nie ruszyl.'
  operations:
  - *id002
  new_decision: Tom akademicki jest zidentyfikowany i nierozstrzygniety - oddac go
    Akademii jako znaleziony, czy zatrzymac. Atlasy i brulion czekaja w celi na przeniesienie
    do baszty.
