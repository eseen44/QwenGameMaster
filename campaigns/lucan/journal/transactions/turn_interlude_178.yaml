      rate_per_day: 2.0
      behavioural_grade: has_judgement_demonstrated_event_turn_interlude_133
      measured_event_id: event_turn_interlude_178
      note: 'DRABINA NIE NADAZA ZA TYM, CO SPIDEY JUZ ROBI. Stopnia "z sadem" nie
