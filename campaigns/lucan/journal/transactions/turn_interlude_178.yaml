  - op: set
    instance_id: spy_cellar_spider_06
    path: resources.necrotic_reservoir.growth_bank.note
    value: 'Reczne karmienie ponad pojemnosc 3 nie powieksza zbiornika - nadwyzka
      laduje w banku wzrostu tego slugi (system/companion-growth.md). KOREKTA t_178:
      dawne zdanie "pierwszy trwaly krok wzrostu kosztuje 8" bylo pozostaloscia po
      formule 8 x 1.5^n, skasowanej w calosci przez retcon_000024. Trwaly krok kosztuje
      CZAS PRZY STOLE (ok. godziny), nie jednostki z banku; bank finansuje mase i
      dojrzewanie.'
  - op: advance_time
    seconds: 1800
  - *id002
  summary: 'Bez testu - trzydziesci minut kontaktu po jednym wezle, zero energii.
    Deklaracja

    gracza laduje w calosci. Tura otwiera ksiegi wzrostu, ktorych do dzis nie bylo.


    1. SEN - GRACZ MA POD SOBA PLIK, NIE ZALOZENIE. retcon_000112 wymienia "pokrycie
    braku

    snu" jako pierwszy z efektow rozwoju nekromanty z nadwyzki. Zaden plik w repo
    nie definiuje

    dla Lucana warunku zmeczenia, niewyspania ani kary za nieprzespana noc - sprawdzone

    grepem po state, entities i system. Wiec zadnej kary nie ma i nie wolno jej dopisac.

    Nowa flaga: running_on_life_energy_not_sleep.


    2. ALE ZRODLO JEST INNE, NIZ MOWI DEKLARACJA, I TO JEST REALNA INFORMACJA. "Energia

    z sieci" dzisiaj do Lucana NIE PLYNIE. Cztery lacza podtrzymujace ida w Varkhena
    i sa

    celowo racjonowane (retcon_000113), a domyslne surplus_routing kazdego innego
    wezla to

    "growth", dopoki Lucan nie wskaze odbiorcy (retcon_000109). Jego 14,1/15 to wlasna

    regeneracja 0,25 na godzine przy zerowym wydatku od dni. Rzecz stoi wiec nie na
    sieci,

    tylko na tym, ze nic go nie kosztowalo - a nadwyzka zaczyna nie miec gdzie isc,
    dokladnie

    jak zapowiadal t_177 p.9. Przepiecie routingu na siebie to jeden rozkaz, ZA DARMO
    i bez

    czasu przy stole. Nie zostal wydany. Nie wydawac go za gracza.


    3. ZUK - ODCZYT, KTORY BOLI, I NIC W NIM NIE JEST WYMYSLONE. Kontakt przy odleglosci

    kieszeni czysty, kotwica trzyma, ucho cmy podaje kierunek i natezenie bez slow.
    Tylko ze

    bank wzrostu wynosi ZERO: od t_091 jest przenoszony jako przedmiot, a posterunek
    bez zeru

    to wiersz -1,0 z retcon_000105. Pelne 3/3 to nie zdrowie, to brak wydatku. Wezel,
    ktorego

    kierunek rozwoju nazwano DOWODZENIEM, nie ma ani zeru, ani jednego podleglego
    ciala

    w polu. Flagi bez zmian: newly_animated, fresh_obedient_and_dull. Jego doktrynalne

    lenistwo brzmi w kontakcie jak stanowisko dowodzenia, ktore melduje gotowosc i
    nie ma

    komu wydac rozkazu. Jedno zdanie, nie watek

    (planning/anchored-companions#not_the_main_plot).


    4. TKACZ - NAJSZYBSZA W CALEJ SIECI I DOPIERO OD PIECIU GODZIN. Odzysk 3 na dobe,
    ubytek

    zdjety permanentnie w t_177, wiec caly odzysk jest nadwyzka: +3,0 na dobe. Prog
    osiadly

    za trzy doby z niewielkim ogonem, prog z sadem w okolicy dziesieciu - oba PRZED
    horyzontem

    przesluchan. Kanal juz teraz klasy kotwicy (retcon_000106): niesie pozyczony zmysl
    i nacisk

    na dystans. Pierwsza noc poza baszta i pierwsza w jednym pokoju ze Spideyem, ktory
    dostal

    wczoraj godzine uwagi przy stole - w kontakcie slychac to jako chlod skierowany
    w bok,

    nie w Lucana. Hard limits obowiazuja: zadnej realnej przemocy wobec innego familiara.


    5. SPIDEY - DRABINA NIE NADAZA ZA NIM. Stopnia "z sadem" nie trzeba mu przyznawac,
    bo go

    zademonstrowal w t_133 sam wybierajac stanowisko. Materialnych zyskow drabiny
    nie naliczamy

    wstecz - jego 12 zbiornika i 33 integralnosci to godziny przy stole, nie dojrzewanie.

    Bank otwiera sie na 0,4 przy +2,0 na dobe. Kanal 70 procent bliskiego zasiegu
    i od t_176

    jako JEDYNY w sieci niesie TRESC rozmowy.


    6. PAMIEC - I TU LEZY ODPOWIEDZ NA PYTANIE, KTORE ZOSTALO OTWARTE WCZORAJ. retcon_000112

    wymienia wprost, co przynosi dojrzewanie sludze: wieksza pamiec ORAZ zdolnosc
    dzielenia

    sie wspomnieniami, i mowi, ze umiejetnosc pojawiajaca sie sama z dojrzalosci NIE
    wymaga

    godzin przy stole. To jest dokladnie ta rzecz, ktorej brakowalo w t_176 p.5: problem

    podsluchu przestal byc problemem czujnika i stal sie problemem ZAPISU. Karta Spideya
    juz

    dzis notuje o nim "Nie kloci sie o to. Zapamietuje". Zaden plik nie podaje terminu
    ani

    progu dla tej umiejetnosci i nie wolno go tu wymyslic - odczyt mowi tylko tyle,
    ze droga

    przez dojrzewanie istnieje i nie kosztuje warsztatu.


    7. CZEGO ODCZYT NIE ZMIENIA. Uwaga nadal idzie po JEDNYM wezle naraz i sluchanie
    na zywo

    zjada ja calkowicie (event_turn_interlude_086) - to jest sciana, ktorej dojrzewanie
    samo

    nie zdejmie. Integralnosc Spideya 27/33 nie odbudowuje sie z energii, bo trzyma
    ja warunek

    partial_hind_leg_loss, a nie ubytek tkanki - urwana noga jest robota przy stole,
    nie

    kwestia zeru. Zawisak nadal held_back_pending_hardening, nadal bez ulepszen.


    8. MASA, POLICZONA PRZY OKAZJI. Zuki 02-08 chodza bez rozkazu od t_077 (16.08,
    20:56),

    czyli od dwoch dob i ok. osmiu godzin, a padlinozerca bez rozkazu to +0,5 na dobe
    -

    okolo jednej jednostki kazdy. Prog osiadly przy tym tempie to okolo dwudziestu
    dni od

    wypuszczenia, daleko za oboma przesluchaniami. Celowy brak rozkazu jest darmowy,
    ale jest

    tez NAJWOLNIEJSZA droga rozwoju w calej sieci. Bez imion, bez cech, bez sledzenia
    - to masa

    (planning/anchored-companions#rule_personalities_are_anchor_only).


    9. NAPRAWIONA MARTWA FORMULA. growth_bank u spy_cellar_spider_06 nosil zdanie
    "pierwszy

    trwaly krok wzrostu kosztuje 8" - pozostalosc po formule 8 x 1.5^n, skasowanej
    w calosci

    przez retcon_000024. Zapis poprawiony, zeby nie odtworzyl niedoboru przy nastepnym
    czytaniu.


    10. STAN. Czwarty dzien interludium, 05:30, pokoj dyzurny na gorze w gildii. Energia

    14,1/15 bez zmian (30 minut nie domyka cyklu regeneracji), integralnosc 19/19,
    bez

    warunkow. Zegary bez ruchu. Zaden termin nie powstal. Poranek nadal ma dwie wlasne
    rzeczy:

    targ po introligatora i pierwszy trening z Mara.'
  new_decision: 'Lucan ma trzy liczby, ktorych rano nie mial, i trzy darmowe dzwignie,
    ktorych nie pociagnal: rozkaz przepinajacy nadwyzke wezlow na siebie zamiast na
    "growth", wylot i zer dla zuka, ktorego wlasnie zaglodzil z funkcji, oraz wybor,
    komu z sieci daje reczne karmienie. Zadna nie kosztuje energii ani godziny przy
    stole. Za oknem swita, a poranek jest juz zajety dwoma rzeczami naraz - targiem
    po introligatora i pierwszym treningiem z Mara.'
