          note: 'DRABINA NIE NADAZA ZA TYM, CO SPIDEY JUZ ROBI. Stopnia "z sadem"
            nie trzeba mu przyznawac, bo go zademonstrowal w t_133 - zszedl ze stolu,
            obszedl blat, sprawdzil parapet i sam wybral stanowisko z widokiem na
            oba okna i drzwi, bez polecenia punktowego. Materialnych zyskow drabiny
            (+1 zbiornika, +2 integralnosci na stopien) NIE naliczamy wstecz: jego
            12 zbiornika i 33 integralnosci maksymalnej pochodza z godzin przy stole
            i naliczenie ich drugi raz byloby podwojnym ksiegowaniem. Bank otwiera
            sie na 0,4 (pieciogodzinne okienko od pozwolenia na polowanie, odzysk
            2 na dobe minus zdjety ubytek) i liczy do NASTEPNEGO stopnia. Progi sa
            jawnie regulowalne (system/companion-growth.md - progi sa propozycja narratora,
            drabina wylacznie przyznaje).'
      paralytic_toxin_reservoir:
