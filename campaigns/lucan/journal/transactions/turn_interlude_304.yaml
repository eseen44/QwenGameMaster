    wysokosc, wpuszczona rowno w lico i BEZ ZAPRAWY - dopasowana tak jak bloki sciany.
    Boros nazwal to od razu: wyjmowalna. Za plyta jest KOMORA, nie szpara - pustka
    wieksza, niz cialo potrzebuje. CO PODAL KAMIEN: w komorze kilka miejsc, w ktorych
    drganie urywa sie krotko - twarde, geste, nie ta sama rzecz co mur. Kilka malych
    w linii wzdluz, jedno wieksze przy glowie. Leza W PORZADKU, polozone, nie zsuniete.
    CZYM SA - NIEUSTALONE i dlon tego nie poda (poor_material_identification; to samo
    ograniczenie co przy linii w scianie w t_303). CO PODALA SYGNATURA: jedno cialo,
    cale, wyciagniete prosto, plaskie i ciche. Zadnej tozsamosci (no_identity_reading).
    CO DAJE NALOZENIE: twarde rzeczy leza OBOK ciala, nie na nim. Na gorze metal byl
    NA ludziach (okucia, obraczki, t_295) - tutaj przedmioty sa ulozone osobno, w
    rzedzie. Roznica obyczaju; co z niej wynika, narrator nie rozstrzyga. METODA:
    wycena grobu bez otwierania - 180 s i 0,1 jednostki za plyte, przez JEDNA plyte
    naraz (do sasiedniej niszy kamien nie dochodzi). Sciana jest dluga; ile nisz -
    nieustalone. SPIDEY nadal zwiedza hale i nie wrocil. OTWARTE: czy otwieraja te
    plyte, czy najpierw obchodza sciane i wyceniaja kilka, czy ida wzdluz wytartego
    pasa ku linii z t_303, czy czekaja na Spideya. Mara postawila pytanie o liczbe
    nisz i nikt na nie nie odpowiedzial.'
