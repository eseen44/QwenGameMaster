outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'GRACZ ZAPYTAL O ZAKRES ZDOLNOSCI I DOSTAJE GO DOKLADNIE TAKIM, JAKI STOI
    W PLIKU. Deklaracja brzmiala "geo powinno wyczuwac i nieumarlych i gestosc ziemi
    w tym metale". Polowa tego jest w karcie, polowa nie, i tura rozstrzyga to jawnie
    zamiast cicho poszerzac zdolnosc: TAK - struktura. effect_lucan_stone_sense ma
    vector structural_detection: pustki, drgania, nieciaglosci. Gesta rzecz w komorze
    grobowej JEST nieciagloscia i czyta sie jako miejsce, w ktorym drganie urywa sie
    krotko. To jest w kanale. NIE - identyfikacja materialu. limitations zawieraja
    wprost poor_material_identification i weak_through_discontinuities. Dlon podaje
    "twarde, geste, nie nalezy do muru" i nie podaje "srebro". t_303 powiedzial to
    samo o linii w scianie ("co to za material, dlon nie powie") i narrator nie cofa
    tego jedna ture pozniej. TAK - sygnatura przy kontakcie. imprecise_direction przestaje
    bolec, kiedy rzecz jest pod dlonia. Jedno cialo, cale, plaskie, ciche. no_identity_reading
    zostaje: kto to byl, nie wiadomo. CO DAJE NALOZENIE DWOCH KANALOW - i to jest
    wlasciwy zysk tury: twarde rzeczy leza OBOK ciala, nie na nim. Na gorze metal
    byl NA ludziach (okucia, obraczki, t_295). Tutaj przedmioty sa ulozone osobno
    i w porzadku. Roznica obyczaju, nie skarb - narrator jej nie tlumaczy. KOMORA,
    NIE SZPARA: za plyta pustka wieksza, niz cialo potrzebuje. Rozwiniecie tego, co
    juz stoi w location.yaml#zone_deep_hall ("nisze glebsze w murze, wieksze i rzadsze"),
    nie nowa rzecz. PLYTA BEZ ZAPRAWY, DOPASOWANA - tak samo jak bloki sciany w tym
    samym wpisie. Wynika z tego, ze plyte sie WYJMUJE, a nie rozbija. To ulatwienie,
    nie przeszkoda; zauwaza je Boros. METODA, KTORA GRACZ WLASNIE ZDOBYL: wycena grobu
    bez otwierania. 180 sekund i 0,1 jednostki za grob, przez JEDNA plyte naraz (weak_through_discontinuities
    - sasiednia nisza nie wchodzi). Ekonomia jest jego do policzenia i narrator jej
    za niego nie liczy. ZERO REAKCJI, jak w t_293 i t_295. Zaden plik nie stawia tu
    mechanizmu ani strazy. KOSZT 0,1; 14,5 -> 14,4. CZAS 180 s, wiersz rozporzadzenie_przy_stole.'
  prose: 'Najbliższa nisza jest trzy kroki w lewo od ostatniego stopnia.


    Z bliska widać to, czego lampa z góry schodów nie pokazała: to nie jest dziura
    zamurowana

    czym popadnie. Nisza ma płytę — jedną, na całą wysokość, wpuszczoną w mur równo
    z licem.

    I tak samo jak bloki dookoła: bez zaprawy. Dociętą.


    Boros widzi to wcześniej niż Lucan i mówi jedno słowo.


    — Wyjmowalna.


    Lucan kładzie dłoń na środku płyty. Dwa kanały, osobno, bo protokół mówi osobno.


    Najpierw kamień.


    Za płytą jest pustka — i to pierwsza rzecz, która nie zgadza się z górą. Tam nisza
    była

    szczeliną na ciało, dokładnie na ciało. Tutaj pustka jest większa, niż ciało potrzebuje.

    To komora, nie szpara.


    I w tej komorze drganie nie gaśnie równo.


    Są miejsca, w których urywa się krótko. Twarde, gęste, zbudowane z czegoś innego
    niż ściana.

    Kilka małych, ułożonych w linii wzdłuż. Jedno większe przy tym końcu, który u
    człowieka

    byłby głową.


    Czym one są, dłoń nie powie — i nie powie, choćby ją tam trzymał do rana. Kamień
    podaje

    twardość i to, że rzecz nie należy do muru. Nie podaje nazwy. Srebro, szkatuła,
    szkło,

    polewana glina o ścianach grubszych niż tamto naczynie z góry — wszystko to brzmi
    z tej

    strony płyty identycznie.


    Podaje za to coś innego i to jest więcej warte: te rzeczy leżą **w porządku**.
    Nie zsypane,

    nie zsunięte w kąt przez czas. Położone.


    Teraz drugi kanał.


    Jedno ciało. Całe, wyciągnięte prosto. Płaskie, stare, zupełnie ciche — ani śladu
    tego

    drobnego oporu, który zostaje po czymś, co jeszcze w sobie coś ma. Kto to był,
    sygnatura

    nie mówi i nigdy nie mówi.


    A potem Lucan nakłada jedno na drugie i to jest właściwa odpowiedź na jego pytanie.


    Ciało leży pośrodku komory. Twarde rzeczy leżą **obok** niego. Wzdłuż boku, i
    to jedno

    większe przy głowie.


    Na górze metal był na ludziach. Okucie pasa, obrączka, klamra — rzeczy, które
    się nosiło

    i z którymi się poszło. Tutaj ktoś ułożył przedmioty osobno, obok zmarłego, w
    rzędzie.

    Jak się kładzie rzeczy na stole przed kimś, kto ma z nich skorzystać.


    Lucan zdejmuje dłoń.


    I dopiero teraz do niego dociera, że zawartość tego grobu jest tutaj rzeczą drugą.

    Pierwszą jest **sposób**. Trzy

    minuty i paznokieć energii na płytę, a wie, czy w środku cokolwiek jest, zanim
    ktokolwiek

    weźmie się za jej ruszanie. Przez jedną płytę naraz — kamień urywa mu się na krawędzi

    komory i do sąsiedniej niszy już nie dochodzi.


    Ale ta ściana jest długa.


    — No i? — Boros stoi już z dłonią na krawędzi płyty.


    — Jest coś w środku — mówi Lucan. — Kilka rzeczy, twardych. Leżą obok ciała, nie
    na nim.

    Czym są, kamień milczy.


    Mara patrzy w tę stronę, w którą hala biegnie w ciemność, i liczy nisze, których
    stąd

    nie widać.


    — To ile tego jest wzdłuż tej ściany — mówi. Nie jak pytanie.

    '
