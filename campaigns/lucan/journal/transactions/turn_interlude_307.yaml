outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'CIALO NIE NIESIE NIC I TO JEST ODPOWIEDZ, NIE PUSTE MIEJSCE. Roznica obyczaju
    nazwana w t_304 (na gorze metal byl NA ludziach - okucia, obraczki, klamry, t_295;
    tutaj rzeczy leza OBOK) zostaje potwierdzona druga, niezalezna droga: rece wzdluz
    bokow puste, przy szyi nic, w szczece nic, pod zebrami i pod cialem nic. Kto tu
    lezy, zostal ubrany w tkanine i polozony, a wszystko, co mial, ustawiono przy
    nim. Operacyjnie znaczy to, ze w pozostalych niszach przeszukiwanie CIAL jest
    strata czasu - wartosc lezy w rzedach. Gracz zaplacil za te informacje jedna tura
    i dostaje ja wprost. JEDNA RZECZ, KTORA DAJE DLON, A NIE DALO OKO: pod barkami
    i pod biodrami cienka ciemna linia, reszta deski albo mar, na ktorych cialo zlozono.
    Nie jest to lup ani zagrozenie - jest to trzeci dowod na to, ze pogrzeb byl URZADZANY,
    a nie odbywany napredce. ZERO REAKCJI NA DOTKNIECIE CIALA, czwarty raz w tych
    podziemiach. t_293 ustalil to wprost ("otwarty grob czyta sie dokladnie tak samo
    jak zamkniety") i narrator nie cofa tego dlatego, ze teraz dotyka sam Lucan. Zadnego
    kosztu energii - gracz nie zadeklarowal skanu ani sondy, wiec narrator ich za
    niego nie odpala. "PAKUJ" JEST ROZKAZEM BLANKIETOWYM I TAK ZOSTAJE WYKONANY -
    rzad i skrzynka ida do worka. Lucan nie wyjal skrzynki z rozkazu i narrator jej
    za niego nie wyjmuje. KANAL, KTORYM IDENTYFIKACJA JEST DOZWOLONA: retcon_000197
    zabrania Stone Sense nazywac material - NIE zabrania tego dloni fachowca. Boros
    sortuje kruszec zawodowo (t_101, t_104) i biorac rzad do reki daje ODCZYT ZWYKLY,
    nie magiczny: to metal, i nie zelazo. Dalej sam siebie zatrzymuje, bo zeby powiedziec
    wiecej, trzeba by przetrzec jedna sztuke - a przetarta sztuka wyglada na ruszana.
    To jest WYBOR GRACZA postawiony jako fakt rzemieslniczy, nie komplikacja. SKRZYNKA
    CIEZSZA, NIZ WYGLADA - gestsza od rzedu. Boros tego takze nie nazywa. Zwazenie
    w dloni jest zwyklym postrzeganiem i wolno je podac; nazwanie materialu wymaga
    otwarcia albo oczyszczenia. MASA: rzad plus skrzynka to okolo trzech kilogramow,
    czyli wiecej niz trzy lepsze groby z gory razem (2,5 kg, t_295). Mara nazywa konsekwencje,
    ktora juz raz w tej kampanii byla wazna (t_298 - 55 kg to trzy kursy po rampie):
    to samo trzeba bedzie wniesc po czterdziestu stopniach. Fakt logistyczny, ZADNEGO
    zegara. CZAS 600 s, proporcjonalnie do t_295 (trzy groby z otwieraniem i sortowaniem
    - 3000 s).'
  prose: 'Lucan cofa własną komendę i robi to tak, jak się cofa komendę, której się
    już nie potrzebuje:

    bez tłumaczenia. Skoro ktoś ma tknąć to pierwszy, to on.


    Wsuwa rękę do komory.


    Kamień jest zimny i zupełnie suchy, a to, co kiedyś było tkaniną, rozpada się
    pod palcami

    na coś w rodzaju popiołu. Idzie po ciele tak, jak się idzie po ciele, kiedy się
    wie, gdzie

    ludzie chowają rzeczy.


    Ręce wzdłuż boków — puste. Palce ułożone, nic w nich.


    Przy szyi nic. Pod żebrami nic. W szczęce nic — a tam kładą najczęściej i on o
    tym wie.

    Przesuwa dłoń pod barkiem i pod biodrem, bo pod ciałem też się kładzie, i pod
    ciałem też

    nie ma nic.


    Ten człowiek został ubrany, położony i zostawiony bez jednej rzeczy na sobie.


    I to jest odpowiedź, nie puste miejsce. Na górze metal był na ludziach — okucie
    pasa,

    obrączka, klamra, to, co się nosiło i z czym się szło. Tutaj wszystko, co ktoś
    miał,

    ustawiono obok niego w rzędzie. Dwa różne sposoby chowania, dwie różne epoki,
    ta sama

    ziemia.


    Jedno dłoń jednak znajduje, czego oko nie widziało. Pod barkami i pod biodrami,
    tam gdzie

    ciężar był największy, biegnie cienka ciemna linia — ostatek deski albo mar, na
    których

    go tu przyniesiono i złożono. Nikt go nie wsunął. Ułożono go.


    Lucan wyciąga rękę i wyciera ją o udo.


    — Pakuj.


    Boros czekał na to słowo i widać, jak długo. Wchodzi w niszę barkiem naprzód,
    bierze rząd

    od największej sztuki, i każdą przekłada szmatą, żeby nie stukały o siebie w worku.
    Robi

    to szybko i bez ceremonii, a przy trzeciej sztuce przystaje i waży ją w dłoni
    dłużej.


    — Metal — mówi. — I to nie żelazo.


    Czeka chwilę, jakby miał coś dodać, i nie dodaje.


    — Musiałbym przetrzeć jedną — mówi zamiast tego. — A przetarta wygląda, jakby
    ktoś ją brał

    do ręki.


    Skrzynkę bierze na koniec, obiema dłońmi, i przez moment trzyma ją tak, jakby
    się pomylił

    co do jej wielkości. Potem wkłada ją do worka osobno, na wierzch, i zawiązuje.


    Mara przez cały czas patrzy w ciemność wzdłuż ściany, nie w niszę.


    — To samo trzeba będzie wnieść po tych schodach — mówi.

    '
