  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero wydane.

    Trzy sprawy postawione, dwie wchodza do kanalu od reki, trzecia dostaje odpowiedz

    strukturalna zamiast nazwiska. Pytanie o miejsce zadal SAM GRACZ, wiec odpowiedz
    na

    nie nie jest bramkowaniem.


    1. KAMIEN - POWTORZENIE USTALENIA Z t_192, ZEBY NIE ROZJECHALO SIE DRUGI RAZ.

    ZADEN plik kampanii nie opisuje kamienia szlachetnego jako zbiornika energii

    nekrotycznej i ZADEN tego nie zabrania - sprawdzone wyszukiwaniem po calym repo

    w t_192 i niezmienione. Kamien jako bateria jest DODANIEM do kanonu, nie jego

    odczytaniem; mechanike zmienia wylacznie deklaracja gracza DO SYSTEMU

    (retcon_000120). Zdanie Lucana o "szlifie typowo do przechowywania energii" pada

    DO HANDLARZA, w scenie - jest wiec kwestia dialogowa, nie deklaracja o swiecie.

    NIE zapisuje go jako faktu o Solmarze i NIE orzekam, ze taki szlif nie istnieje.

    Jesli gracz poda mechanike, wpis idzie do worlds/solmara/lore/ plus

    planning/specimen-upgrades.yaml, tak jak t_192 juz zapowiedzial.


    2. CO WAGOWY MOZE NA TO ODPOWIEDZIEC Z WLASNEJ KARTY, A CZEGO NIE. Jest rzemieslnikiem

    przy wadze uchylnej z probierzem i kamieniem probierczym (portrayal#appearance),
    nie

    magiem i nie jubilerem-teoretykiem. Kupuje i sprzedaje PO OPISIE - szlify zna
    po tym,

    ile biora, nie po tym, co rzekomo trzymaja. Nie udaje wiec, ze wie, o ktory szlif

    chodzi, i prosi o opis albo rysunek. To nie jest opor: to jest dokladnie ten sam
    tryb,

    w ktorym przyjal liste w t_109, i jednoczesnie oddaje definicje tam, gdzie wedlug

    retcon_000120 nalezy - do gracza.

    IRONIA JEST ZALOGOWANA W t_192 I NIE JEST NARRATORSKA: trzy dni temu Lucan sprzedal

    temu czlowiekowi szescdziesiat kilo towaru opisanego w inventory.yaml jako

    mostly_gold_and_silver_mortuary_jewelry, a bizuteria grobowa ma kamienie; pryncypal

    posortowal ja odruchowo (portrayal#tell). Wagowy mowi to na glos, bo to jest jego

    najtansze zrodlo. NIE ORZEKAM, czy kamienie jeszcze leza - zaden plik tego nie
    mowi,

    wiec on sam mowi, ze musi sprawdzic. Zadnej ceny nie podaje (agenda#set_the_number_himself

    dziala w obie strony - nie wycenia towaru, ktorego opisu jeszcze nie ma).


    3. WIEDZMY I SPECJALISCI OD KLATW - NIE WYMYSLAM ICH. Sprawdzone przeszukaniem
    repo:

    w calej kampanii NIE MA ani jednego NPC-specjalisty od klatw poza samym Lucanem,
    nie ma

    wiedzmy, nie ma frakcji i nie ma kategorii prawnej. system/curses.md opisuje MECHANIKE

    klatw, entities/npcs/fixtures/syndicate-doormen.yaml notuje wrecz, ze klatwy nie

    wystepuja w legal-order.yaml ani necromancy-law.yaml, a lead_more_curses jest
    OTWARTYM

    leadem gracza bez zadnego zrodla osobowego. Test z retcon_000058: wskaz PLIK,
    w ktorym

    ten czlowiek istnieje. Nie umiem - wiec ekspozycji nie ma i pryncypal zadnego
    nazwiska

    nie podaje.

    TO NIE JEST ODMOWA. Kanal do zamawiania rzeczy spoza obiegu jest otwarty od t_109:

    przyjal wtedy liste "zakazane podreczniki, materialy, egzotyczne stworzenia" i
    rozbil

    ja na tempa, a t_191 wprost odnotowal, ze do tej listy mozna dopisac. Informacja
    wchodzi

    tym samym trybem. Wagowy PRZYJMUJE zamowienie i powtarza jedyna cene, ktora sam
    juz

    nazwal w t_109: zapas nie lezy w miescie, stoi poza Lumaria i wchodzi na zamowienie,

    wiec KAZDE ZAMOWIENIE JEST NAZWANYM ZYCZENIEM KONKRETNEGO CZLOWIEKA. Pytanie o
    wiedzmy

    jest wiec pytaniem, ktore po zlozeniu ma wlasciciela.

    IRONIA, KTOREJ NPC POWIEDZIEC NIE MOZE: Lucan jest w Lumarii specjalista od klatw
    i

    wlasnie placi za znalezienie kogos, kto robi to gorzej. Wagowy tego NIE WIE -
    na jego

    karcie nie ma ani jednego faktu o klatwach Lucana - i narratorowi nie wolno mu
    tego

    dopisac.


    4. PRZYKRYWKA ZAPISANA JAKO PRZYKRYWKA, NIE JAKO FAKT (retcon_000120). "Naukowiec

    hobbysta odtwarzajacy dzieje rzadkiej sztuki" idzie do knowledge tego NPC jako
    to, co

    USLYSZAL, i do state/secrets.yaml#cover_stories - nie do zadnego pliku opisujacego,
    kim

    Lucan jest. Wagowy jej nie kwestionuje, bo nie ma po co: nie kupuje powodu, tylko

    zamowienie.


    5. CZLOWIEK O NIEPOSZLAKOWANEJ OPINII - LUCAN SAM NAZWAL GO NAJTRUDNIEJSZYM I
    MA RACJE,

    ALE NIE Z POWODOW MORALNYCH. Pryncypal nie odradza i nie moralizuje - precedens
    jest

    w t_110, gdzie na wojne z Kosciolem odpowiedzial przeliczeniem, nie kazaniem.
    Nazywa

    wlasciwosc wlasnego towaru: opinia, ktora on moze dostarczyc, jest opinia czlowieka,

    ktory mu cos jest winien, a to jest dokladnie ta cecha, ktora ja uniewaznia. Nie
    zamyka

    sprawy i nie mowi "nie da sie". ZADNEGO NAZWISKA NIE PADA, bo zadnego pliku nie
    ma.


    6. MIEJSCE - ODPOWIEDZ NA PYTANIE GRACZA, NIE BRAMKA. Gracz zapytal wprost, wiec

    milczenie byloby tu bledem. Dwa pierwsze pytania sa tym, co przy tej wadze zadaje
    mu

    codziennie ktos inny, i przy stole nikogo nie dziwia. Trzecie nie jest. Precedens
    jest

    w plikach i jest jego wlasny: caly poprzedni interes szedl w pokoju (t_104-110),
    nie na

    targu. Pryncypal to mowi - i NA TYM POPRZESTAJE. Nie prowadzi Lucana nigdzie,
    nie wysyla

    go po zgode i nie umawia terminu; ruch zostaje przy Lucanie, bo lokacji nie zmieniam
    bez

    jego deklaracji.


    7. KESZ. Stoi pol kroku z tylu i slucha trzeciej sprawy. Nic nie mowi. Jego wlasna

    otwarta kwestia z t_194 - czy pryncypal chce go widziec jako gwaranta proceduralnego

    naprzeciw Strazy i na przesluchaniu gildii - NIE zostala w tej turze podniesiona
    przez

    nikogo i zostaje otwarta.


    8. CZEGO NARRATOR TU NIE ROBI. Nie wymysla wiedzmy, klatownika ani "kobiety z
    zaulka".

    Nie ustanawia szlifu kamienia ani mechaniki magazynowania energii w mineralach.
    Nie

    podaje nazwiska czlowieka o nieposzlakowanej opinii. Nie dopisuje pryncypalowi
    podejrzen

    z powodu tych pytan - pytanie o kamien na targu jest pytaniem o kamien (retcon_000055).

    Nie stawia terminu, nie tworzy zegara, nie zapowiada, ze cos pojdzie zle, i nie
    przenosi

    Lucana do innej lokacji.


    9. STAN. Czwarty dzien interludium, 13:11, stol wagowy na targu. Energia i integralnosc

    bez zmian poza regeneracja. Zegary bez ruchu poza uplywem czasu. Nic nie zaplacone,
    zadna

    cena nie padla, zaden termin nie powstal. Dwa zamowienia zlozone i czekaja na
    doprecyzowanie

    przez Lucana: kamien - na opis szlifu, informacja o klatwach - na to, ze jest
    juz nazwanym

    zyczeniem konkretnego czlowieka. Trzecia sprawa postawiona i nierozstrzygnieta.

    '
