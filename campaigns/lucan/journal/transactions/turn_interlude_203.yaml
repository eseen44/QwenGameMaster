  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero wydane.

    Lucan sprzedal pryncypalowi skale. Czlowiek, ktory kupil sobie prawo NIEWIEDZENIA,

    wlasnie sie dowiedzial - i nie prosil o to.


    1. CO ZOSTALO POWIEDZIANE, DOKLADNIE. Najlepszy przypadek: to, co bylo za pierwszym

    razem - trupy wychodzace z ziemi, duzo, wiecej niz oplaca sie tluc. Najgorszy:
    miasto moze

    przestac istniec, i NIE za sprawa nieumarlych, tylko przez zawalenie, kiedy katakumby
    pod

    nimi zaczna sie wykopywac.

    CO NIE ZOSTALO POWIEDZIANE: nic o tym, CO tam jest ani dlaczego. Padly KONSEKWENCJE,
    nie

    przyczyna. forbidden_without_source obu obecnych nienaruszone - Varkhen nie padl,
    pieczecie

    i dolna brama nie padly, nekromancja Lucana nie padla. Lucan opisal, co ziemia
    moze zrobic,

    a nie kto pod nia lezy.


    2. CZEGO NARRATOR Z TEGO NIE ROBI KANONEM (retcon_000120). Zdanie pada w scenie,
    do

    pryncypala. NIE ustanawiam, ze pod targiem biegna katakumby. NIE ustanawiam, ze
    Lumaria

    moze sie zawalic. NIE ustanawiam mechaniki osiadania ani zadnej liczby. To sa
    TWIERDZENIA

    LUCANA i ida wylacznie do knowledge tych dwoch NPC jako to, co uslyszeli.

    NIE ROZSTRZYGAM TEZ, CZY SA PRAWDZIWE. Moga byc dokladnym opisem sytuacji albo
    skala

    dobrana tak, zeby czlowiek na pewno wyjechal - narrator tego nie orzeka i nie
    zdradza

    tego zadnym sygnalem w scenie. Gracz wie, co wie.

    CO W PLIKACH ISTNIEJE I JEST SASIEDNIE, wiec nie jest to twierdzenie zawieszone
    w prozni:

    (a) lead_well_diggers_read_stone - studniarz "wie, gdzie pod Lumaria sa PUSTKI
    I WODA",

    czyli pustki pod miastem sa w tym swiecie rzecza znana zawodowo; (b) loc_cemetery_underworks

    i loc_city_sewer istnieja jako lokacje; (c) Lucan ma progression_practical_masonry
    i

    rozszerzenie Geo, czyli jest w tym pokoju JEDYNYM czlowiekiem, ktory kamien czyta
    zawodowo.

    To ostatnie jest istotne dramaturgicznie i nie wymaga ode mnie ustanawiania niczego:

    pryncypal nie ma jak tego sprawdzic, a mowi mu to fachowiec.


    3. TO PRZECINA DOKLADNIE TEN WARUNEK, ZA KTORY PRYNCYPAL ZAPLACIL - I JEST TO
    ZAPISANE

    W PLIKU OD t_109. planning/act-03-defence.yaml#cemetery_syndicate_arrangement.what_lucan_bought

    konczy sie zdaniem: "Nie wchodza na teren, NIE CHCA WIEDZIEC, CO TAM JEST, nie
    biora

    odpowiedzialnosci za wynik. Pryncypal kupuje CZAS I PUSTKE, nie wspolne przedsiewziecie."

    Przez cala dzisiejsza rozmowe trzymal to konsekwentnie: w t_196 powiedzial "powodu
    nie

    kupuje i nie pytam o niego", przy Tobim nie zapytal ani razu, przy czterech fazach
    nie

    zapytal. Zapytal wylacznie "jak daleko", bo to jest logistyka.

    DOSTAL ODPOWIEDZ SZERSZA NIZ PYTANIE. Nie ma o to pretensji i nie robi z tego
    sceny -

    ale nazywa, co sie wlasnie stalo: przestal byc czlowiekiem, ktory nie wie. To
    NIE jest

    narratorska kara ani nowe ryzyko doklejone graczowi; to jest zauwazenie zmiany
    stanu,

    ktora gracz wywolal swiadomie.


    4. I UDERZA W JEGO WLASNY DLUGI INTERES, KTORY TEZ STOI W PLIKU. Ten sam plik,

    seraphines_reading_of_the_motive: syndykat nie robi uprzejmosci, KUPUJE PRZYSZLOSC
    TERENU -

    pryncypal sam powiedzial, ze pusta linia sciagnie kogos w ciagu tygodni, ze ktokolwiek
    ja

    wezmie, bedzie potrzebowal cmentarza, i ze on tego dlugo nie zatrzyma. Cala jego
    kalkulacja

    zaklada, ze PO WSZYSTKIM nadal istnieje miasto i nadal istnieje cmentarz.

    "Miasto moze przestac istniec" nie jest wiec dla niego groza - jest uniewaznieniem
    tezy

    inwestycyjnej. Reaguje na to jak na wiadomosc, ze grunt pod dzialka, ktora wlasnie
    kupil,

    moze nie byc gruntem. To jest jego rejestr i nic tu nie trzeba dodawac.


    5. KESZ TRACI DOKLADNIE TE RZECZ, KTORA W t_194 NAZWAL SWOJA ZALETA - I MOWI TO
    SAM.

    fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest: niesie kaplanowi
    zdanie

    "to, co jest pod cmentarzem", NIE ZNAJAC jego tresci, i sam uznal niewiedze za
    zalete,

    bo czlowieka, ktory nie wie, nie da sie zmusic do rozwiniecia.

    PRECYZJA, KTORA TRZEBA UTRZYMAC: on nadal NIE WIE, CO tam jest. Lucan podal skutki,
    nie

    przyczyne. Kesz moze wiec dalej uczciwie powiedziec, ze nie wie, co to jest. NIE
    MOZE juz

    powiedziec, ze nie wie, ze to jest powazne. Zaleta zmniejszyla sie o polowe i
    on to nazywa -

    bez pretensji, bo states_his_position_before_he_has_to i bo sam wszedl w to dobrowolnie.


    6. CZEGO NARRATOR TU NIE ROBI. Nie ustanawia katakumb pod targiem, zawalenia miasta
    ani

    zadnej mechaniki geologicznej. Nie orzeka, czy Lucan mowi prawde, czy skaluje
    pod efekt.

    Nie odslania Varkhena, pieczeci ani dolnej bramy - i nie pozwala zadnemu NPC sie
    ich

    domyslic. Nie tworzy zegara ("tygodnie" z t_109 to cytat z pryncypala, nie nowy
    licznik),

    nie stawia terminu i nie zapowiada, ze cos pojdzie zle. Nie kaze pryncypalowi
    ani wyjechac,

    ani zerwac ukladu, ani zazadac wiecej pieniedzy - zadna z tych decyzji nie zapada
    dzis.

    Nie podaje ceny za trzy zamowienia.


    7. STAN. Czwarty dzien interludium, 13:59, pokoj syndykatu na zapleczu targu.
    Obecni:

    Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary
    bez ruchu

    poza uplywem czasu. Toby w skrzynce na dolnej polce, na pierwszym talerzyku. Zuk
    nadal na

    stole brzuchem do gory. Trzy zamowienia bez ceny, oferta na zbitki bez umowy,
    Kesz bez

    honorarium, umowa o pustke i czas z t_109 nadal w mocy i nieodwolana. Pytanie
    "jak daleko"

    odpowiedziane. Zaden termin nie powstal.

    '
  operations:
  - op: set
    instance_id: pc_lucan
