    value: in_the_syndicate_back_room_answered_how_far_with_scale_best_case_the_dead_coming_out_of_the_ground_again_worst_case_the_city_collapsing_into_its_own_voids_cause_never_named_and_the_principal_who_had_bought_the_right_not_to_know_now_knows
