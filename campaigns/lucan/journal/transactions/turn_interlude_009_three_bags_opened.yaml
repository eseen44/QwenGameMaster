outcome:
  intent_achieved: true
  arrangement: unchanged
  perspective: pc_lucan
  summary: 'Boros wyciaga trzy worki spod stolu (byly schowane blisko trasy do gildii,
    nietkniete). Otwieraja je razem. Dwa sa nudne: garsc cmentarnej bizuterii i drobnej
    monety (razem okolo 40 srebra po grubym oszacowaniu Borosa) oraz zestaw uzytkowych
    narzedzi grabarskich - nic magicznego, nic co wymaga eksperta. Trzeci wart jest
    uwagi: ciezki, srebrny relikwiarz z religijnymi zdobieniami, wewnatrz zawierajacy
    to co wyglada na zakonserwowany fragment kosci. Boros gwizdze przez zeby. Mara
    natychmiast rozpoznaje styl zdobien jako koscielny, nie swiecki - to nie zwykly
    lup, to prawdopodobnie skradzione mienie Kosciola, i sprzedanie tego przez pierwszego
    lepszego pasera moze sciagnac dokladnie ten rodzaj uwagi, ktorej Lucan chce teraz
    unikac. Nikt z obecnych nie potrafi ocenic czy relikwiarz ma realna magiczna moc,
    czy jest tylko symbolicznie/religijnie wazny - do tego trzeba by eksperta, ktorego
    zapytanie samo w sobie jest ryzykowne. Boros przy okazji tlumaczy jak dziala sprzedaz
    lupu w gildii: rzeczy zwykle wycenia kontraktowy rzeczoznawca gildii wedlug wartosci
    rynkowej minus prowizja gildii, nie ''na kilogramy zlomu'' jak zartowal Lucan
    - ale cokolwiek wyglada na magiczne albo naznaczone (jak ten relikwiarz) wymaga
    osobnej, drozszej i wolniejszej identyfikacji, i moze zostac odrzucone albo zglodzone
    przez gildie, jesli wyglada na zbyt goracy towar.'
  operations:
  - *id002
  new_decision: 'Dwa nudne worki mozna bezpiecznie oddac do wyceny gildyjnemu rzeczoznawcy
    razem z reszta nagrod za Akt 2. Relikwiarz to osobna decyzja: oddac go formalnie
    gildii/Kosciolowi (bezpiecznie, ale bez zysku i z ryzykiem pytan skad go macie),
    sprobowac go po cichu spieniezyc przez kogos mniej oficjalnego (ryzyko rozpoznania),
    czy zatrzymac i zbadac go samemu, zanim cokolwiek zdecydujecie?'
