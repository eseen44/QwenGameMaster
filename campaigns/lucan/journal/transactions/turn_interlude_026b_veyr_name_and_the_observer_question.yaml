  summary: 'Bez testu. Trzy rzeczy w jednej rozmowie i wszystkie trzy landuja.

    NOGA - Lucan podaje wersje z drzwiami w podziemiach. Seraphine przyjmuje ja bez

    drgnienia, bo jest nudna i nic nie zmienia. UWAGA KANONOWA: akta mowia inaczej
    -

    partial_hind_leg_loss ma source_event_id milestone_042_spiders_steal_wagon_chest_contents.

    Wersja z drzwiami jest wiec oslona, nie prawda, i to oslona sensowna, bo prawdziwa

    wersja brzmi "moje pajaki obrabowaly skrzynie z wozu", czyli przyznanie sie do
    kradzieży

    przed oficerem gildii. Zapisane u niej jako false_belief.

    NAZWISKO - to jest pierwsza rzecz tego wieczoru, ktora realnie zmienia jej rachunek.

    Lucan wyklada, ze Akademia juz prowadzi spor o klasyfikacje, i ze przez jego nazwisko

    zajma sie tym szybko takze rody. Seraphine odklada pioro po raz drugi. Nekromanta
    bez

    nazwiska to sprawa dyscyplinarna gildii i sprawa karna. Nekromanta z nazwiskiem
    rodowym

    to spor o jurysdykcje miedzy Akademia, rodami, magistratem i Kosciolem - a w takim
    sporze

    Lucan przestaje byc oskarzonym i staje sie STAWKA. Mowi mu to wprost i dodaje
    obie strony:

    jej warunkowa oslona slabnie, bo nie da sie oslaniac czlowieka w jurysdykcji,
    w ktorej

    ona nie siedzi; ale rownoczesnie nazwisko jest powodem, dla ktorego ktos wysoko
    moze

    CHCIEC korzystnej klasyfikacji.

    PYTANIE LUCANA - i to jest jego najlepszy ruch tego wieczoru, bo Seraphine przyznaje

    mu racje. Z zewnatrz NIE DA SIE odroznic wyuczonej sztuczki od swiezego posluszenstwa.

    Ale zaraz zamyka to nozycami: ona nie jest obserwatorem z zewnatrz i nie patrzy
    na

    pajaka. Argument "konstrukt" jest argumentem PRAWNYM i PUBLICZNYM - trzyma sie
    przed

    magistratem, przed urzednikiem, przed tlumem. Nie trzyma sie przed nikim, kto
    czyta wiez.

    Zdradza nie samo machniecie, a NOWOSC i TERMINOWOSC reakcji: wyuczona sztuczka
    powtarza

    sie identycznie, posluszenstwo dostosowuje sie do prosby. Kto poprosi o inny gest
    i

    dostanie inny gest, ma dowod.

    I na koniec sama zauwaza dziure, ktorej Lucan nie zalepil: mowi jej, ze Akademia

    prowadzi ten spor, i nie mowi, skad to wie.

    '
  new_decision: 'Seraphine przyznala mu argument i od razu pokazala jego granice -
    konstrukt obroni sie

    przed sadem, nie przed specjalista, a tellem jest nowosc reakcji, nie sam gest.
    Wie

    teraz o nazwisku i o sporze na Akademii, wie tez, ze Lucan nie powiedzial, skad
    ma te

    wiedze, i wlasnie o to zapytala. Lucan przyznaje, ze byl tam dzis wieczorem, podaje

    wersje ostrozniejsza, wyklada wreszcie dyspute i ojca, czy przekierowuje rozmowe
    na

    to, co ona sama otworzyla - ciala, akta i to, kto je trzyma?

    '
  operations:
  - *id002
