outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: mixed
  perspective: pc_lucan
  summary: 'Bez testu - Ilva i Mara sa pelnymi agentami, wiec rozstrzyga ich interes,
    nie rzut. Dziesiec minut, zero energii. Zagrywka statusowa: Lucan odmawia uznania
    Ilvy za rozmowce, nazywa ja "zlotko" i "ordynarna kasjerka", dom "burdelem", ogłasza,
    ze caly czas mowil do Kesza jako do reprezentanta wlasciciela, i zwraca sie do
    wagowego z prosba o "kierownika". 1. WAGOWY NIE PODNOSI GLOWY. Nie jest kierownikiem,
    wlascicielem ani nikim - jest rzemieslnikiem na dniowce, ktory liczy kruszec i
    nie chce miec z tym nic wspolnego. Zbiera dalej rozsypane pierscienie spod stolu.
    Jedyna reakcja w pokoju na te czesc zagrywki to cisza. 2. KESZ PROSTUJE SIE ZAWODOWO
    I PRECYZYJNIE, BEZ URAZY. Nie jest prawnikiem wlasciciela i nigdy tego nie powiedzial
    - jest prawnikiem POKOJU. Rozroznienie, ktore Lucan probuje wyciac miedzy "kasjerka"
    a "pryncypalem", w tym aparacie nie istnieje w sposob, ktory mu cokolwiek daje.
    Potem robi rzecz gorsza niz sprzeciw: ZAMYKA TECZKE. Notatka jest skonczona, a
    w niej stoi to, co Lucan sam powiedzial przy pisarzu bez tajemnicy zawodowej -
    ze rozbil linie Strazy, ze ma blankiet i ze za dwa tygodnie wywola w miescie wojne
    domowa. 3. ILVA SIE NIE OBRAZA, BO ZAWODOWCY SIE NIE OBRAZAJA - ROBI JEDNA RZECZ,
    KTOREJ WCZESNIEJ NIE ZROBILA: PATRZY NA NIEGO. I odpowiada na TRESC, bo tresc
    byla niegłupia. Tak, jest ktos nad nia. Nie, nie jest to zadna tajemnica. Wlasciciel
    NIE SPOTYKA SIE ZE SPRZEDAJACYMI - spotyka sie z ludzmi, ktorych pokoj juz zamknal.
    Wyjscie w gore nie jest awansem; problemow sie w gore nie wysyla, problemy sie
    odsyla. 4. ROZDZIELA DWIE ROZMOWY I PRZYZNAJE MU JEDNA RACJE. Zloto jest jej sprawa
    i zamyka sie dzis, u niej, po jej liczbie - i ta liczba nadal jest realna, bo
    obrazenie nie zmienia wagi kruszcu. DOSTEP nie jest jej sprawa i nigdy nie byl;
    w tym Lucan mial racje, tyle ze wyciagnal z tego zly wniosek. Pakiet (prawnik,
    staly dostep, rynek) BYL wyceniony dla klienta i przestaje byc oferowany - nie
    ze zlosci, tylko dlatego, ze przestala widziec klienta. 5. JEDNE DRZWI ZOSTAJA
    OTWARTE I MAJA CENE, TE SAMA CO PRZEDTEM. Spotkanie z czlowiekiem nad nia da sie
    kupic, a taryfa nie zmienila sie ani o grosz: FIZYCZNA PRZEPUSTKA. Roznica jest
    w tym, co za nia leci - juz nie caly pakiet, tylko WPROWADZENIE WYZEJ. Nazwiska
    Ilva nie podaje i nie poda przed zaplata. 6. WORLD MOVE, I JEST TO NAJDROZSZA
    RZECZ TEJ TURY - MARA WSTAJE. Pierwszy raz odzywa sie, odkad Lucan zaczal mowic,
    i nie mowi do niego, tylko do Ilvy: jej nazwisko przykrylo czlowieka, ktory wszedl
    przez te drzwi, a nie czlowieka, ktory mowi teraz, i od tego zdania nie stoi za
    niczym, co on jeszcze powie. Nie wychodzi z pokoju i nie zaprzecza niczemu - po
    prostu zdejmuje poreczenie na przyszlosc. MECHANICZNIE: nieprzeszukany status
    Lucana byl wyjatkiem zrobionym NA TO PORECZENIE (event_turn_interlude_104), a
    przepustka i Spidey sa nadal pod plaszczem. Wyjatek wlasnie przestal byc bezterminowy.
    7. ODZWIERNY PRZY DRZWIACH PROSTUJE SIE NA "BURDEL" I ZRZUCA RYGIEL Z HAKA - z
    hukiem, w cisze. Drugie wyjscie effect_syndicate_doormen_minor_bad_luck. W pokoju
    czyta sie to jako niezdarnosc i nikt nie laczy tego z niczym. 8. CZEGO LUCAN NIE
    UZYSKAL. Nie dostal kierownika, nie dostal nazwiska, nie przesunal ceny ani o
    grosz i nie zmienil tego, ze jedynym towarem, ktorego oni od niego chca, jest
    papier. Uzyskal jedno prawdziwe ustalenie: hierarchia istnieje, dostep do niej
    jest do kupienia, a taryfa jest znana. 9. STAN. 14:50 dnia trzeciego. Energia
    7,8 z 15, integralnosc 19 z 19, bez warunkow. Towar u nich, ryta trzecia nadal
    zbierana z podlogi, przepustka i Spidey pod plaszczem, Mara stoi, Kesz ma zamknieta
    teczke, a rygiel lezy na posadzce.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: Zapłacić przepustką za wprowadzenie do człowieka nad Ilvą, wziąć samą
    liczbę za złoto i wyjść, czy odzyskać rozmowę tu i teraz - przy Marze, która właśnie
    zdjęła poręczenie, i przy odźwiernych, dla których nie jesteś już wyjątkiem.
