  summary: 'Bez testu. Seraphine przyjmuje "nie wiem" jako jedyna uczciwa odpowiedz
    tego wieczoru i od

    razu robi z niej cos uzytecznego, ale placi za to Lucan.

    1. NIE MUSI SIE TAM PRZECHODZIC, BO POMIAR JUZ TRWA. Gildia opiera sie zadaniu
    sluzb

    miejskich o ciala, akta i dowody z cmentarza od TYGODNIA. Jeden zepsuty konstabl
    nie

    utrzyma zadania miedzyinstytucjonalnego przez tydzien - prosba jednego czlowieka
    umiera na

    czyims biurku po dwoch dniach. To zadanie nie umarlo, wraca, i nikt przy tym nie
    chce

    wyznaczyc daty przesluchania. Seraphine nie nazywa tego dowodem; nazywa, na co
    patrzec:

    kto podpisze nastepne zadanie, na jakim szczeblu i jak szybko wroci, kiedy ona
    przewlecze

    je jeszcze raz. To probe, ktora ona moze puscic z wnetrza WLASNEJ sprawy, bez
    tego zeby

    Lucan pojawil sie gdziekolwiek. Chair albo czlowiek - odpowiedz przyjdzie sama.

    2. WEJSCIE DO KOMISARIATU JEST WIDOCZNOSCIA, nie rekonesansem. Aktyw niezarzadzany,
    ktory

    przychodzi na komende zadawac pytania o transport zwlok, wpisuje sie wlasna reka
    do

    rejestru pozycji - dwa tygodnie przed trzema forami. A jesli siec jest tolerowana
    z gory,

    raport z jego wizyty idzie do gory, zanim on wyjdzie z budynku. Dodaje przy tym
    rzecz,

    ktorej nie owija: w tylnym pokoju komendy nie ma zadnej pozycji. Ma glos w sprawach

    cechowych i przy urzednikach magistratu; tam nie ma nic.

    3. I LAPIE TO, CZEGO LUCAN NIE POWIEDZIAL. "Transakcja za milczenie" znaczy, ze
    ktos ma

    Lucanowi zaplacic za zakopanie czegos, czyli ze Lucan cos trzyma. Mowi to sucho,
    drugi raz

    tej nocy: znowu wymienil aktyw i znowu nie powiedzial, ze go oddaje. Nie naciska.
    Kladzie

    natomiast na stol punkt, ktory nalezy do niej i ktorego nikt inny mu nie powie:
    SWIADEK,

    KTORY NEGOCJUJE MILCZENIE, PRZESTAJE BYC SWIADKIEM I STAJE SIE STRONA. Rzecz sprzedana

    staje sie rzecza, ktora da sie postawic w zarzucie, a co gorsza - kazde pozniejsze
    slowo

    Lucana o tych ludziach jest juz zeznaniem czlowieka, ktory raz sprzedal swoje
    milczenie.

    To niszczy jego jedyna darmowa oslone: bycie tym, ktorego relacji nikt jeszcze
    nie wycenil.

    Transakcje za milczenie, dodaje, sklada sie ostatnia, nie pierwsza.

    Nocny urzednik zaczyna gasic lampy przy filarach i glowna sala schodzi do jednego
    kregu

    swiatla nad ich stolem. Seraphine nie proponuje niczego w sprawie noclegu.

    '
  new_decision: 'Seraphine oferuje probe bez ekspozycji Lucana - przewlecze zadanie
    sluzb jeszcze raz i

    bedzie patrzec, kto je podpisze i na jakim szczeblu wroci, co odpowie na pytanie
    o jeden

    glina versus cala komenda. W zamian bedzie chciala tego samego, co przy stronach

    akademickich: wiedziec, ZANIM lead zostanie uzyty. Ostrzegla tez, ze transakcja
    za

    milczenie zamienia Lucana ze swiadka w strone i uniewaznia wszystko, co powie
    pozniej.

    Lampy gasna, sala sie zamyka, Lucan nadal nie ma gdzie spac. Przyjmuje probe i
    daje jej

    ostrzezenie o leadzie, trzyma lead przy sobie i idzie na komende sam, domyka wreszcie

    temat ojca i metody, czy konczy noc i idzie do baszty po urobek?

    '
  operations:
  - *id002
