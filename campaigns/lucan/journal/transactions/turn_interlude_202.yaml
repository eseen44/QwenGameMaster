  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero wydane.

    Fazy przedefiniowane przez gracza. Nie jest to retcon - obaj nadal siedza przy
    tym samym

    stole i Lucan poprawia wlasna oferte na biezaco, szesc minut po jej zlozeniu.


    1. NOWY PODZIAL, DOKLADNIE JAK PODANY.

    (1) TERAZ - stan sprzed wszystkiego.

    (2) ODBYLY SIE OBIE RZECZY: przesluchanie Lucana ORAZ konferencja akademikow o
    prawnej

    naturze nekromancji. Wszyscy wiedza, co sie dzieje, ale sa zbyt zajeci polityka,
    zeby sie

    tym przejac. Etap trwa NAJWYZEJ PARE DNI.

    (3) KONIEC BURZY POLITYCZNEJ i oficjalne utworzenie grupy do problemu. Stad MAKSYMALNIE

    DZIEN, DWA do kordonu.

    (4) WEJSCIE.

    Poprzedni podzial z t_201 zostaje zastapiony. Talerzyk trzeci przestal znaczyc
    "kordon"

    i znaczy teraz "powolano grupe"; kordon zszedl do przedzialu MIEDZY trojka a czworka.

    To jest istotna zmiana, bo przesuwa caly harmonogram o jeden krok wczesniej.


    2. FAZA DRUGA JEST TERAZ ZAKOTWICZONA W DWOCH ISTNIEJACYCH ZEGARACH - I TO NIE
    JA JE

    DOKLEILEM. clock_guild_leadership_hearing stoi na 3/15, clock_father_arranges_academy_showing

    stoi na 3/15 i jego wlasny effect mowi "ok. 16 dni" (npc_neris_aldhen kontra npc_ivar_kolm).

    Do tego current_scope#entry_rule: "Pierwsze z dwoch przesluchan rozpoczyna Akt
    3 niezaleznie

    od liczby wykonanych prac". Lucan powiedzial "dziwnym trafem obie w podobnym czasie"
    i ma

    racje - to jest w plikach, obie na tym samym oczku. Zbiega sie to takze z jego
    wlasna

    zapowiedzia z t_105b: wojna domowa w ciagu dwoch tygodni.

    ZEGAROW NIE RUSZAM I NOWYCH NIE TWORZE. "Pare dni" oraz "dzien, dwa" to nadal
    SZACUNKI

    Lucana podane kontrahentowi, nie wpisy w state/clocks.yaml. Postep obu zegarow
    bez zmian.


    3. "KONFERENCJA O PRAWNEJ NATURZE NEKROMANCJI" - ZAPISANE JAKO JEGO SFORMULOWANIE,
    NIE

    JAKO TYTUL WYDARZENIA. W plikach jest OTWARTA DYSPUTA Akademia-Kosciol, Neris
    przeciw

    Kolmowi, w formie seminarium, nad ktorym Gildia nie ma jurysdykcji. Lucan opisuje
    ja

    kontrahentowi po swojemu i to jest kwestia w scenie (retcon_000120) - nie ustanawiam

    oficjalnej nazwy ani tematu dysputy na podstawie zdania powiedzianego paserowi.


    4. TEZA O PIERWSZYM TALERZYKU JEST CELNA I PRYNCYPAL TO PRZYJMUJE, ALE NIE ZA
    DARMO.

    Szesc minut temu sam policzyl, ze towar siedzi w drugim. Lucan podwaza to jednym

    rozroznieniem: pierwszy talerzyk nie znaczy "usun dobytek", znaczy "usun siebie
    z miasta".

    CZEGO PRYNCYPAL NIE MUSI SIE UCZYC, BO TO JUZ JEST NA JEGO KARCIE: w t_109 sam
    powiedzial,

    ze jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan, a zapas kupiony
    pod jego

    termin umiera razem z nim (fact_weigher_has_a_stake_in_lucan_surviving). Rozszerzenie
    tego

    na wlasna osobe nie jest dla niego nowa mysla, tylko pierwszym razem, kiedy ktos
    wypowiada

    ja przy nim na glos.

    I MA JEDNA PRZEWAGE, KTORA TEZ STOI W PLIKACH: fact_weigher_agreed_to_stock_ahead_of_the_

    ruling (t_109) - zapas NIE lezy w miescie, stoi poza Lumaria i wchodzi na zamowienie.

    Polowe ewakuacji ma wiec zrobiona projektowo, od trzech dni. Tego, czego wywiezc
    nie da

    sie, jest dokladnie dwoje: pokoj za straganami i to, ze nikt go nie zna. Czlowiek,
    ktory

    wyjezdza i wraca, jest czlowiekiem, ktorego zapamietuje sie dwa razy - a jego
    cala metoda

    polega na tym, zeby nie zapamietano go ani raz (agenda#stay_unnamed).


    5. JEDNO PYTANIE, KTORE ZADAJE - I NIE LAMIE NIM WLASNEJ ZASADY. Nie pyta, CZYM
    jest

    rzecz pod cmentarzem; pyta, JAK DALEKO. To jest pytanie logistyczne, a logistyke
    wlasnie

    kupuje. Rozroznienie jest zgodne z jego wlasnym zdaniem z t_196 - powodu nie kupuje
    i nie

    pyta o niego - a jednoczesnie daje Lucanowi konkretna rzecz do odpowiedzenia.

    ODPOWIEDZI NIE MA W TEJ TURZE i narrator jej nie zmysla: skala tego, co jest pod

    cmentarzem, nie zostala przez gracza podana, a forbidden_without_source pryncypala
    nadal

    obejmuje varkhen_existence oraz seals_and_lower_gate.


    6. KESZ STOI W SRODKU WYZWALACZA I ZAUWAZA TO. Faza druga odpala sie, kiedy odbeda
    sie

    przesluchanie i dysputa - a Kesz od t_199 STOI NA TYM PRZESLUCHANIU jako gwarant

    proceduralny. Nie jest wiec tylko linia niosaca kalendarz; jest jednym z ludzi,
    ktorych

    obecnosc wspoltworzy moment przejscia na drugi talerzyk. Mowi to sucho i bez pretensji
    -

    states_his_position_before_he_has_to. Nie zada za to niczego.


    7. CZEGO NARRATOR TU NIE ROBI. Nie tworzy zegara ani terminu z "paru dni" i "dnia,
    dwoch".

    Nie rusza postepu clock_guild_leadership_hearing ani clock_father_arranges_academy_showing.

    Nie ustanawia oficjalnego tematu dysputy. Nie odslania niczego o zawartosci cmentarza
    i nie

    odpowiada za Lucana na pytanie "jak daleko". Nie kaze pryncypalowi obiecywac,
    ze wyjedzie,

    ani deklarowac, ze nie wyjedzie - to jest jego decyzja i nie zapada dzis. Nie
    zapowiada, ze

    cos pojdzie zle. Nie podaje ceny za trzy zamowienia.


    8. STAN. Czwarty dzien interludium, 13:53, pokoj syndykatu na zapleczu targu.
    Obecni:

    Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary
    bez ruchu

    poza uplywem czasu. Toby siedzi w skrzynce na dolnej polce, na pierwszym talerzyku,
    z nowa

    trescia faz. Zuk nadal lezy na stole brzuchem do gory. Trzy zamowienia bez ceny,
    oferta na

    zbitki bez umowy, Kesz bez honorarium. Na stole zostaje jedno niedomkniete pytanie
    i nie

    jest ono Lucana do zignorowania: jak daleko.

    '
