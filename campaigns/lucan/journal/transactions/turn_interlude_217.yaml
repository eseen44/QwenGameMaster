  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Trzy minuty,
    zero energii.

    Swieta nie ma. Rozwiazany jezyk nie robi z tego zagadki, tylko przemowe.


    1. USPOKOJENIE DZIALA, BO JEST PRAWDZIWE. Lucan nie sklamal ani slowem: w izbie
    pije sie

    od poludnia, jest glosno, nikt nie wyszedl (ustalone w t_214 i t_216). Marn to
    kupuje

    natychmiast, bo chce kupic, i widac po nim, jak schodzi z niego napiecie - to
    byla jedyna

    rzecz, ktora go w tej chwili obchodzila (portrayal#what_he_can_lose).


    2. PYTANIE O SWIETO - I ODPOWIEDZ JEST NUDNA, BO KANON NIE MA TU NIC INNEGO.

    NIE MA ZADNEGO SWIETA. Nie ma awansow, nie ma nowego kapitana, nie ma urodzin.
    Zsuniete

    stoly to nie okazja, tylko rozklad dnia: poludniowa zmiana schodzi i idzie tutaj,
    bo

    locations/pod-obrecza istnieje w kampanii dokladnie z tego powodu - Dast nazwal
    to

    miejsce w t_208 jako to, w ktorym oddzialy bramne siedza PO ZMIANIE.

    NARRATOR NIE PODLOZYL POD TO PYTANIE ZADNEGO WYDARZENIA. Byla pokusa - gracz podal
    na

    tacy trzy gotowe haczyki (awans, nowy kapitan, urodziny) i kazdy z nich dalby
    sie rozwinac

    w watek. Zaden nie ma pliku. Wymyslenie ktoregokolwiek byloby dokladnie ta awaria,
    ktora

    opisuje retcon_000058, tylko podana graczowi jako prezent zamiast jako hak.

    MARN ODPOWIADA PRZECZACO NA WSZYSTKIE TRZY i smieje sie z pomyslu o lepszym kapitanie
    -

    to jedyne miejsce, w ktorym pytanie w niego trafia, bo jest zart, a nie informacja.


    3. ALE ODPOWIADA DLUGO - I NA TYM POLEGA PROCEDURA. Czlowiek bez rozwiazanego
    jezyka

    powiedzialby "nic, po prostu pijemy" i skonczyl. Ten mowi to samo na czterdziesci
    sposobow:

    ze codziennie tak jest, ze po zmianie nie ma dokad isc, ze w domu i tak nikt nie
    czeka

    wczesniej, ze ta izba to jedyne miejsce, gdzie nikt od niego niczego nie chce.

    ROZWIAZANY JEZYK DAJE OBJETOSC, NIE TRESC - i to jest wlasciwe odczytanie karty
    procedury.

    On mowi WIECEJ, nie MADRZEJ, i nie zaczyna sam z siebie sypac niczego, o co nie
    zapytano.


    4. KONFABULACJA NIE ZOSTALA URUCHOMIONA I NARRATOR TO ODNOTOWUJE WPROST.

    Skutek uboczny z t_127 odpala sie PRZY BRAKU ODPOWIEDZI. Tu odpowiedz istniala
    i byla

    prosta - "nie swietujemy nic" - wiec Marn nie mial czego zmyslac i nie zmyslil.

    ZADNE ZDANIE W TEJ TURZE NIE JEST KONFABULACJA. To jest zapis na przyszlosc: kiedy

    konfabulacja padnie, ma byc oznaczona w summary tak samo jawnie.


    5. CO Z SIEBIE DAJE POZA TYM - I DLACZEGO TO JEST WIECEJ NIZ ODPOWIEDZ.

    Podaje imie. "Ossek." Czlowiek, ktorego ktos wlasnie podniosl z ziemi, podaje
    imie; to

    nie jest zwyciestwo procedury, tylko zwykla kolej rzeczy. I ODWZAJEMNIA PYTANIE
    -

    narrator NIE wklada Lucanowi w usta zadnej odpowiedzi (system/player-agency.md).

    Mowi tez rzecz najbardziej uzyteczna w calej turze, i mowi ja jako skarge na noge,
    nie

    jako propozycje: NIE WRACA JESZCZE DO IZBY. Nie da rady wejsc tam kulejac na oczach

    osmiu ludzi. Zamierza stac tu pod sciana, az noga zejdzie.

    ZNACZY TO, ZE LUCAN MA PRYWATNA ROZMOWE Z CZLOWIEKIEM OD PODNOSZENIA DRAGA, poza
    izba,

    poza swiadkami, z rozwiazanym jezykiem, i to ten czlowiek chce jej dalej, nie
    on.

    NARRATOR NIE NAZYWA TEGO OKAZJA I NIE STAWIA ZEGARA na to, jak dlugo to potrwa.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie wspomnial bramy, wozow, glejtu, stalej trasy,

    polnocno-zachodniej zapory, komendy, gildii ani cmentarza - Marn o niczym z tego
    nie

    zaczal sam i nie ma pliku, ktory kazalby mu zaczac. Nie ustanowil, ze cokolwiek

    podejrzewa. Nie zauwazyl Spideya ani Tkacza nikim. Nikt z izby nie wyszedl. Zaden
    zegar

    nie drgnal poza uplywem czasu. Zaden termin nie powstal.


    7. STAN. Czwarty dzien interludium, podworzec Pod Obrecza. Obecni: Lucan (imie

    NIEPODANE, pytanie o nie wisi), npc_ossek_marn - o sciane, na jednej nodze, dwa
    stacki

    numb, rozwiazany jezyk aktywny, w trakcie deklarowania, ze na razie nie wraca
    do izby.

    Tkacz przy Lucanie, Spidey na belce, zuk i glejt w kieszeni, "Uprzejmosci" pod
    pacha.

    Integralnosc 19/19, energia bez wydatku w tej turze. Godzine czytac ze state/time.yaml.

    '
