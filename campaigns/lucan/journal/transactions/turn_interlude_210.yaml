  summary: 'Bez testu - interludium, roll_policy disabled. Szesnascie minut: minuta
    pozegnania,

    pietnascie marszu. Zero energii w tej turze - jednostka za zapadnie poszla juz
    w t_208.

    Klatwa dostarczona, pieczec odczytana, podpis nie.


    1. DOSTAWA WYKONANA. Dast oddaje uscisk bez wahania - podal reke sam z siebie
    juz w t_207,

    a "Marc" wychodzi jako czlowiek, ktoremu pomogl. To jest dokladnie dotyk przyjety

    DOBROWOLNIE w ramach okazji towarzyskiej, czyli kanal opisany w

    abilities.yaml#delivery i system/curses.md#dotyk-jako-kanal-dostarczenia.

    Procedura jest mastered_repeatable od t_129, rzutow nie ma, nic sie nie sypie
    i nic nie

    jest widoczne - klasa opozniona nie daje zadnego objawu przy dostawie.

    SKUTEK, DOKLADNIE TYLE I NIC WIECEJ: wspomnienie TWARZY sie nie konsoliduje. Za
    godzine

    Dast nie potrafi Lucana opisac. NADAL BEDZIE PAMIETAL rozmowe, imie Marc, pytanie

    o Ossena Marna, zdanie o kobiecie z gildii i to, ze sam sprawdzil rozdzielnik.
    Traci

    RYSOPIS, nie tresc. Narratorowi nie wolno tego ani poszerzyc, ani zwezic.


    2. ZERKNIECIE - CO SIE UDALO, A CO NIE, I DLACZEGO. Nawias mieszczacy sie w wykonaniu

    zadeklarowanego poza nawiasem uscisku; zero sekund, brak widocznego gestu.

    GEOMETRIA BYLA USTALONA PRZED TA DEKLARACJA (t_209): arkusz lezy na BRZEGU biurka,

    pieczecia do gory, okolo czterech krokow od Lucana, do gory nogami dla niego.

    PODPISU NIE ODCZYTAL. Cudza reka, z trzech metrow, odwrocona, w dwie sekundy,
    przy

    jednoczesnym scisnieciu komus dloni - to nie jest opor narratora, to jest odleglosc.

    Widzi, ZE podpis jest: jeden autograf, krotki, pewna reka, nie blankiet z pusta
    linia.

    To jest odczyt KLASY, nie nazwiska.

    PIECZEC ODCZYTAL - I TO JEST WYNIK TEJ TURY. Pieczec jest ksztaltem, a nie pismem,
    jest

    duza i Lucan zna ta konkretna na pamiec: ma jej egzemplarz w kieszeni od poczatku

    kampanii i rozkladal go na stole przed Seraphine w t_036.

    TO TA SAMA PIECZEC URZEDU CO NA item_watch_transport_permit.


    3. CO TO USTANAWIA, A CZEGO NIE - GRANICA MA BYC OSTRA.

    USTANAWIA: dokument autoryzujacy stala trase wozu do przewozu zwlok i dokument
    zadajacy

    od gildii wydania cial, akt i dowodow z operacji cmentarnej wychodza spod TEJ
    SAMEJ

    PIECZECI URZEDU. Nie jest to skok kanoniczny - inventory#known_effect mowi od
    dawna, ze

    glejt wystawilo faction_lumaria_civic_services, a t_034 nazywa zadanie "zadaniem
    sluzb

    miejskich". Nowa jest ZGODNOSC NA POZIOMIE KONKRETNEJ PIECZECI, nie sama frakcja.

    NIE USTANAWIA: nazwiska, szczebla, ani tego, ze podpisuje ta sama osoba. Zgodnosc
    pieczeci

    to zgodnosc URZEDU, nie reki.

    ROZLICZA POLOWE ZADANIA SERAPHINE Z t_036 - zapowiedziala "weryfikacje przez porownanie

    PIECZECI I KLASY PODPISU z tygodniem formalnych zadan". Pieczec: porownana, zgodna.

    Klasa podpisu: NIEODCZYTANA, wiec jej polowa zadania zostaje otwarta.

    I ROBI TO POZA JEJ AKTAMI: ona miala to zrobic na papierze gildii i pod wlasnym

    nazwiskiem; Lucan zrobil to okiem, pod cudzym imieniem, i nikt tego nigdzie nie
    zapisal.


    4. CZEGO NARRATOR TU NIE ZROBIL. Nie podal urzedu z nazwy, mimo ze office_name
    jest

    w legible_details glejtu - Lucan zna te nazwe od dawna i nie jest to zdobycz tej
    tury;

    narrator nie robi z niej odkrycia i nie wklada jej w usta zadnemu NPC.

    Nie ujawnil tresci arkusza poza tym, co Dast sam powiedzial w t_206 i t_209. Nie
    stworzyl

    podejrzenia u Dasta - uscisk dloni na pozegnanie jest uscisksem dloni na pozegnanie.
    Nikt

    nie wybiegl za Lucanem, nikt nie zajrzal za nim na ulice, nikt nie zapisal niczego

    w ksiedze. Nie stworzyl zegara ani terminu.

    NIE ORZEKL, CZY OSSEK MARN JEST W SZYNKU. Rozdzielnik mowi tylko, ze zszedl w
    poludnie.


    5. MARSZ. Pietnascie minut na polnocny zachod, skala miasta wg retcon_000042.
    Lucan idzie

    ze skrzynka szkla alchemicznego, ktora dla "Marca" jest najlepszym mozliwym rekwizytem:

    czlowiek niosacy skrzynke ma widoczny powod, zeby gdziekolwiek isc.

    Konczy PRZED szynkiem, na ulicy - loc_tavern_pod_obrecza, zone_obrecza_street.
    Do izby

    szynkowej nie wchodzi, bo tego nie zadeklarowal; pelny opis pierwszego wejscia
    nalezy

    sie dopiero przy wejsciu (system/locations-and-maps.md).


    6. STAN. Czwarty dzien interludium, 15:14, ulica przed szynkiem Pod Obrecza, w
    cieniu

    polnocno-zachodniej zapory. Lucan sam. Integralnosc 19/19, energia bez wydatku
    w tej

    turze. Zegary bez ruchu poza uplywem czasu. Skrzynka szkla w rekach, zuk w kieszeni,

    glejt w kieszeni. Zapadnia pamieci ROZLADOWANA - dostarczona, dziala w npc_verek_dast.

    Na komendzie w ksiedze nie ma ani jednego wpisu i nigdy nie bylo.

    '
