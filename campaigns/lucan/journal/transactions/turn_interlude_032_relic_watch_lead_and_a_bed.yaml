  declared_action: 'Lucan koryguje ja jeszcze raz. Seminarium jest nieuniknione, o
    tym wlasnie mowil - one

    MUSZA. Tytuly nie generuja niczego same z siebie, a synekura jest nietykalna:
    moglby byc

    woznym i nikt nie ruszylby jego pokoju, dopoki profesor Veyr zyje. Nie jest tez

    zainteresowany powrotem na uczelnie, i tlumaczy, ze to nie dziala tak, jak Seraphine

    mysli - wystarczy, ze wiedza, kim jest. To ludzie, ktorzy moga cie nie widziec
    trzydziesci

    lat i zaczynaja rozmowe w punkcie, w ktorym ja skonczyliscie.

    Dokłada dwie rzeczy: dosc potezna relikwie, po ktora ktos sie zglosi, oraz potencjalny
    lead

    dotyczacy osob zwiazanych z transportem zwlok po stronie STRAZY. Zadnej z nich
    jej nie

    oddaje - zamierza szantazowac obie strony, o czym jej nie mowi.

    Na koniec prosba praktyczna: potrzebuje lokalu do spania - naprawde do spania,
    ale przede

    wszystkim takiego, ktory ktos moze przeszukac i nic tam nie znalezc. Ma kandydata
    i macha

    kluczami: dom wlasciciela garbarni. Tylko skurwysyn podobno wyszedl - czy Seraphine
    powie

    mu o tym cos wiecej?

    '
  fiction_verdict: automatic
