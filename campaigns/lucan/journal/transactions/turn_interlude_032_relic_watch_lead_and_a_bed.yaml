  summary: 'Bez testu. Seraphine przyjmuje korekte o uczelni w calosci - afiliacja
    nie jest procedura,

    jest ROZPOZNANIEM, i to zdejmuje z planu koszt trzeci: zaden podpis nie jest potrzebny,

    bo nie ma czego reaktywowac. Wystarczy, ze wiedza, kim jest. Notuje tez, ze nietykalnosc

    synekury jest zawieszona na jednym zyciu - dopoki profesor Veyr zyje.

    RELIKWIA - domysla sie od razu, ze to koscielne, i nie pyta o szczegoly. Nazywa
    natomiast

    to, czym rzecz naprawde jest: rzecz, po ktora ktos sie zglosi, nie jest aktywem.
    Jest

    TERMINEM. Ktos juz jej szuka, a Lucan nie zna daty.

    LEAD O STRAZY - i tu wieczor sie odwraca. Seraphine slyszy w tym cos, czego Lucan
    nie

    szukal, i sklada to na glos w trzy sekundy: jesli ludzie ze strazy siedza w transporcie

    zwlok, to zadanie sluzb miejskich, zeby przekazano im ciala, akta i dowody z operacji

    cmentarnej, ma DRUGIE czytanie. Nie chca materialu, zeby prowadzic sprawe. Chca
    materialu,

    zeby go pochowac. A gildia, opierajac sie od tygodnia, przez caly czas chroni
    dowody przed

    ludzmi, ktorych te dowody dotycza - nie wiedzac o tym. To zmienia charakter przesluchania

    za dwa tygodnie: to nie jest sesja, na ktorej Lucan sie tlumaczy, to sesja, na
    ktorej dwie

    instytucje walcza o to, czy ta sprawa w ogole bedzie istniala.

    Zauwaza przy tym, ze Lucan wymienil oba aktywa, ale ani slowem nie powiedzial,
    ze je oddaje.

    Mowi to na glos, sucho, bez oskarzenia - i nie naciska. Nie ma czym.

    LOKAL - odpowiada rzeczowo i rozbiera pomysl z garbarnia. Gildia oddala dokumenty
    i tam jej

    udzial sie skonczyl; sprawa poszla do sluzb i tam stanela, ale NIE dlatego, ze
    go

    uniewinniono. Wlasciciel wyszedl - za poreczeniem albo po prostu dlatego, ze nie
    bylo komu

    tego prowadzic, gdy ten sam urzad dostal na biurko handel zwlokami. Sprawa jest
    formalnie

    OTWARTA. Czyli: teren nadal jego, on zywy, urazony i ma pelne prawo wiedziec,
    kto napisal

    na niego skarge - a dom przypisany do otwartego postepowania jest jednym z niewielu
    miejsc

    w tym miescie, ktore da sie legalnie przeszukac Z NAKAZEM. Lucan chce lokalu,
    ktory da sie

    przeszukac bez skutku; wybral lokal, ktory zostanie przeszukany, a wszystko, co
    tam

    znajda, przyklei sie do niego.

    Formuluje za niego wlasciwe kryterium: nie chodzi o pusty pokoj, chodzi o pokoj
    z NUDNYM

    wlascicielem i bez zadnego zwiazku z zadnym otwartym postepowaniem.

    '
  new_decision: 'Uczelnia zalatwiona - nic nie trzeba reaktywowac, wystarczy byc rozpoznanym,
    a synekura

    trzyma sie na zyciu ojca. Relikwia jest terminem, nie aktywem. Lead o strazy przewrocil

    cala sprawe custody: sluzby moga chciec dowodow, zeby je pochowac, a przesluchanie
    staje

    sie polem walki dwoch instytucji, nie tlumaczeniem sie Lucana. A dom garbarnika
    jest

    najgorszym mozliwym wyborem, bo jako jedyny w okolicy da sie legalnie przeszukac
    z

    nakazem. Lucan pyta ja o inny lokal, ciagnie temat custody i tego, co teraz zrobi
    z leadem

    o strazy, wypytuje o poreczenie garbarnika i kto je zlozyl, czy konczy noc i idzie
    do

    baszty po urobek?

    '
  operations:
  - *id002
