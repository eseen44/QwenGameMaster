outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. "CALE MIASTO MOZE PRZESTAC BYC BEZPIECZNE" TRAFIA W JEDYNY NERW,
    KTORY TEN CZLOWIEK MA. Pryncypal nie pyta o dusze i nie pyta o pieczecie. Miasto,
    ktore przestaje byc bezpieczne, to miasto, w ktorym trasy, magazyny i klienci
    przestaja istniec - a on nie ma dokad przeniesc interesu, ktory jest zbudowany
    z ludzi znajacych sie od dwudziestu lat. Zgadza sie, zanim Lucan skonczy uzasadniac.
    2. PRZESTRZEN DOSTAJE KSZTALT OPERACYJNY I DOSTAJE JA ILVA. Pierwszy raz od czasu,
    gdy pryncypal przejal rozmowe, zwraca sie do niej - i to jest dokladnie jej robota:
    przez czas prob gildii wokol cmentarza ma byc pusto. Zadnych zbieraczy, zadnych
    ciekawskich, zadnych cudzych ludzi wchodzacych na teren, na ktorym pracuje gildia,
    i zadnej komorki probujacej przejac pusta linie AKURAT TERAZ. Syndykat nie umie
    tego zagwarantowac wobec calego polswiatka, bo komorki sa rozproszone (faction_lumaria_criminal_networks),
    ale umie to zrobic wobec wszystkich, ktorych zna - a zna wiekszosc. 3. WSPARCIE
    JEST RZECZOWE I WASKIE. Ludzie do noszenia i pilnowania, wozy, kwatera poza murami,
    materialy poza kolejnoscia. NIE ma w tym: udzialu w tym, co jest pod ziemia, wejscia
    ich ludzi na cmentarz ani odpowiedzialnosci, jesli gildii nie wyjdzie. Pryncypal
    mowi to bez ogrodek - kupuje CZAS I PUSTKE, nie wspolne przedsiewziecie. 4. CENA
    JEST JEDNA I JEST DOKLADNIE TA, KTOREJ MOZNA BYLO SIE SPODZIEWAC PO CZLOWIEKU
    ZYJACYM Z WIEDZENIA WCZESNIEJ: chce OSTRZEZENIA. Nazwisko i sposob, w jaki dostanie
    sygnal, ze ma zamykac. Nie chce wiedziec, co jest pod cmentarzem; chce wiedziec,
    kiedy zabrac ludzi z ulic. Lucan ma podac ten kanal. 5. KESZ WIDZI TO, CZEGO LUCAN
    NIE POWIEDZIAL, I NAZYWA TO JAKO PRAWNIK - TO JEST NAJLEPSZA POZYCJA PRAWNA, JAKA
    LUCAN MIAL OD DWOCH LAT. Czlowiek, ktory odsuwa zagrozenie w skali miasta, nie
    jest sadzony; jest UZYWANY. Kanon: necromancy-law.yaml#information_rule - uratowanie
    miasta wplywa na decyzje o oslonie, karze albo wykorzystaniu Lucana, ale nie legalizuje
    wstecznie nekromancji. Kesz dodaje druga polowe, bo jest prawnikiem, a nie pocieszycielem:
    to jest tez dokladnie ta droga, na koncu ktorej czlowiek dostaje posade ze smycza
    - to samo, co Seraphine nazwala dwa dni temu (event_turn_interlude_033). 6. WORLD
    MOVE - KWOTA WRESZCIE PADA I PADA Z UST PRYNCYPALA, TAK JAK ZAPOWIEDZIAL. PIECDZIESIAT
    DWA TYSIACE SREBRA ZA CALOSC, ryta trzecia i konsekrowana robota wlacznie - przy
    wartosci brutto okolo stu tysiecy i przy tym, ze droga przetopu dawala okolo jednej
    trzeciej wartosci obrobkowej i zostawiala ryta trzecia w worku. Wyplata w trzech
    ratach, bo taka gotowka nie lezy w pokoju powroznika; pierwsza dzis, do reki.
    Udzialy Borosa i Mary ida osobno, pelna stawka, z ich strony, a dodatkowy procent
    schodzi z Lucana zgodnie z jego wlasna propozycja. 7. STAN. 16:10 dnia trzeciego.
    Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow. Pierwsza rata w kieszeni,
    przepustka nadal pod plaszczem i nietknieta, Spidey nieodkryty, materialy na czwartek,
    przestrzen przy cmentarzu obiecana, prawnik przestal byc uslugodawca a stal sie
    strona, a syndykat czeka na kanal ostrzegawczy, ktorego Lucan jeszcze nie podal.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Syndykat daje przestrzeń i wsparcie za jedną cenę: kanał ostrzegawczy
    - nazwisko i sposób, w jaki dostaną sygnał, że mają zamykać. Lucan ma go podać.
    Pierwsza rata jest w kieszeni, kwadrans po szesnastej, i nic już go w tym pokoju
    nie trzyma.'
