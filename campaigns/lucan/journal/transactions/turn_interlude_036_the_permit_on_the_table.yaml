  summary: 'Bez testu. Lucan kladzie glejt na stol i oferuje go Seraphine. ONA GO
    NIE BIERZE - i to

    jest wazniejsze niz to, ze go czyta.

    1. CZYTA, ALE NIE PRZYJMUJE NA PRZECHOWANIE. Obraca dokument palcem, nie podnoszac
    go ze

    stolu, czyta dwa razy i przesuwa z powrotem do Lucana. Powod jest zawodowy i mowi
    go bez

    owijania: WIEDZA byla droga, POSIADANIE jest dyskwalifikujace. Jesli glejt bedzie
    w jej

    torbie, kiedy rano stanie przed sluzbami, nie jest adwokatka Lucana, jest wspolpodejrzana,

    a Lucan traci jedyna osobe, ktora ma pozycje w sporze o dowody. Zostawia mu wiec
    rzecz i

    bierze tylko to, co przeczytala.

    2. CO DAJE SAMO CZYTANIE - i to jest realny zysk z oddania. Nazwiska nie ma, ale
    TYP

    autoryzacji jest czytelny, a typ mowi o WYSOKOSCI FOTELA. Autoryzacja stalej trasy
    nie

    jest klasa dokumentu, ktora podpisuje szeregowy konstabl; nieczytelne nazwisko
    nie jest

    wiec nazwiskiem z dolu. To nie wskazuje czlowieka, ale odpowiada na polowe pytania

    wieczoru: NIE jest to jeden zepsuty glina. Zastrzega, ze chce to potwierdzic,
    i ma na to

    legalna probke - gildia od tygodnia dostaje od sluzb formalne zadania wydania
    materialu,

    opieczetowane i podpisane. Porownanie pieczeci, formy i klasy podpisu robi sie
    na wlasnych

    aktach gildii, bez zadnej ekspozycji Lucana.

    3. DOKTRYNA LUCANA - PRZYJETA, POTEM ROZLOZONA NA WARUNKI. Nie mowi mu, ze podraznienie
    lwa

    nie dziala; mowi, ze dzialalo i wlasnie dlatego on jeszcze zyje. Ale metoda ma
    dwa

    zalozenia i oba wygasaja w ciagu dwoch tygodni. PIERWSZE - to, co przyjdzie cie
    zabic,

    musi byc rabowalne. Czlowieka z sakiewka da sie okrasc; realokacji nie. Fotela
    nie da sie

    okrasc, bo fotel nie przychodzi sam i nie przychodzi z niczym w kieszeni. DRUGIE
    - trzeba

    umiec wyjsc z zagrody po fakcie. To bylo prawda przez dwa lata niewidzialnosci
    i przestaje

    byc prawda w chwili, gdy trzy fora maja jego nazwisko w terminarzu. Jej wniosek
    nie jest

    zakazem, jest KOLEJNOSCIA: podraznic lwa mozna, ale trzynastego dnia, nie pierwszego
    -

    po odczycie, po lozku, ktorego nikt nie przeszuka, po prawniku i po jednej wersji

    opowiesci. Dwa tygodnie na to sa.

    Nocny urzednik podchodzi i mowi, ze zamyka sale. Seraphine wstaje, zbiera swoje
    rzeczy i

    zostawia Lucanowi otwarte drzwi na gore - jej pokoj jest o tej porze pusty, prywatny
    i bez

    wpisu. Chce jednak wiedziec przed rankiem, co ma powiedziec, jesli sluzby zapytaja
    ja

    wprost.

    '
  new_decision: 'Seraphine przeczytala glejt, ale ODMOWILA wziecia go - posiadanie
    zrobiloby z niej

    wspolpodejrzana zamiast adwokatki, wiec dokument zostaje u Lucana. Z samego czytania

    wyszlo jedno: typ autoryzacji stalej trasy jest ponad szeregowym konstablem, czyli
    to NIE

    jest jeden zepsuty glina; potwierdzi to, porownujac pieczecie z tygodniem formalnych
    zadan,

    ktore gildia dostala od sluzb - bez ekspozycji Lucana. Jego doktryne przyjela,
    ale

    przestawila na kolejnosc: draznic lwa trzynastego dnia, nie pierwszego, bo fotela
    nie da

    sie okrasc, a z zagrody nie bedzie jak wyjsc. Urzednik zamyka sale. Lucan idzie
    z nia na

    gore do jej pokoju, zeby ustalic wersje na rano, konczy noc i wychodzi na ulice
    do baszty

    po urobek, schodzi do piwnicy do Varkhena, czy robi cos innego?

    '
  operations:
  - *id002
