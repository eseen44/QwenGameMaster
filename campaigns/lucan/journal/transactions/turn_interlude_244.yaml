  prose: 'Wiadomosc poszla rano i odpowiedzi jeszcze nie ma. Kesz nie robil z tego
    tajemnicy ani problemu: zdanie o tym, co jest pod cmentarzem, nie jest zdaniem,
    na ktorym ktos w stule siedzi tydzien, wiec spodziewa sie odpowiedzi jutro, najpozniej
    pojutrze - a terminu i tak nie wyznaczy on. Potem powiedzial to, co u niego zawsze
    przychodzi wczesniej, niz musi. Wchodzil w to jako czlowiek, ktory NIC nie wie,
    i to byla cala jego oslona; po wtorkowej rozmowie o skali juz nie moze powiedziec,
    ze nie wie, ze sprawa jest powazna. Zapytal wiec o jedno, i nie o pieniadze: co
    Lucan zamierza z tym kaplanem zrobic. Nie z ciekawosci - to jego nazwisko jest
    na zaproszeniu i to on bedzie musial komus wytlumaczyc, po co wprowadzil Veyra
    do pokoju czlowieka Kosciola po tym, jak Lucan publicznie zapowiedzial Kosciolowi
    wojne. Chce to wiedziec PRZED tym pokojem, nie w nim. Do ksiegi dopisal jeszcze
    dwa slowa przy papierach i przy udziale pokoju: nieumowione.'
  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero srebra.

    STAN WIADOMOSCI PODANY, ZADANIE KESZA POSTAWIONE. Zaden termin nie wyznaczony,
    zadna

    decyzja Lucana nie podjeta.


    1. STAN FAKTYCZNY, PROSTO Z KARTY. fact_kesz_sent_word_to_the_priest (t_193):
    wiadomosc

    do kaplana idzie TEGO SAMEGO DNIA, czyli dnia 4 interludium - a jest dzien 4,
    19:11.

    Wiec poszla dzis. ODPOWIEDZI NIE MA. Terminu ani miejsca Kesz nie podal i nie
    poda,

    bo "data nie jest jego do dania" (ten sam wpis, powtorzone z t_113).

    RAMA WIADOMOSCI BEZ ZMIAN: spotkanie dotyczy TEGO, CO JEST POD CMENTARZEM, i Kesz
    niesie

    to zdanie NIE ZNAJAC jego tresci (fact_kesz_carries_the_under_the_cemetery_framing_to_the_priest).

    OCENA CZASU JEST OSADEM NARRATORA W JEGO WLASNEJ DOMENIE, nie zegarem: Kesz spodziewa

    sie odpowiedzi jutro albo pojutrze, bo takiego zdania nikt w stule nie odklada.

    ZADEN ZEGAR NIE POWSTAL (retcon_000055), zaden termin nie zostal wyznaczony, zadna
    nowa

    strona nie weszla do sprawy (retcon_000058). Kaplan pozostaje BEZ IMIENIA - nie
    ma karty

    NPC, faction_lumaria_church mowi o nim tylko "local_priest", i narrator go nie
    nazwal.


    2. ZADANIE KESZA - JEGO WLASNE, POSTAWIONE PRZED CZASEM, ZGODNIE Z JEGO CECHA
    MOWY.

    speech_traits: "Podaje wlasna pozycje, zanim ktos go o nia zapyta - nie z uprzejmosci,

    tylko zeby nie musiec sie z niej potem tlumaczyc". Dwa fakty z karty sie tu spinaja

    i to jest cale uzasadnienie, nie nowy pomysl narratora:

    (a) fact_kesz_named_his_own_exposure_at_the_priest_meeting (t_193) - skoro spotkanie

    organizuje ON, to wprowadzenie tam Veyra po jawnej zapowiedzi wojny z Kosciolem
    (t_110)

    jest pozycja, ktora bedzie musial komus wytlumaczyc;

    (b) fact_kesz_lost_half_his_ignorance_before_the_priest_meeting (t_203) - po podaniu
    mu

    SKALI nie moze juz powiedziec, ze nie wie, ze sprawa jest powazna, co o polowe
    zmniejsza

    zalete, ktora sam nazwal w t_194 (czlowieka, ktory nie wie, nie da sie zmusic
    do

    rozwiniecia).

    PYTA WIEC O JEDNO I NIE O PIENIADZE: co Lucan zamierza z tym kaplanem ZROBIC.
    Chce to

    wiedziec PRZED pokojem, nie w pokoju. Nie zazadal honorarium, nie zazadal weta
    i nie

    postawil warunku - to jest PYTANIE, nie brama (speech_traits: wycenia, nie bramkuje).


    3. CZEGO KESZ NIE ZAPYTAL PO RAZ DRUGI (retcon_000121). Kim Lucan tam siedzi -
    PYTANIE

    ZAMKNIETE w t_193, wszystkie trzy kapelusze naraz, i Kesz do tego nie wracal.
    Seraphine -

    zamkniete w t_200, nie pytac trzeci raz. Nazwisko urzednika akt - powiedzial w
    t_243,

    ze nie zapyta drugi raz, i nie zapytal.


    4. CZEGO NARRATOR NIE DOPOWIEDZIAL ZA GRACZA - I TO JEST SWIADOME.

    converging_target#consequence mowi: "Kesz przestaje byc uslugodawca i staje sie
    strona

    z wlasnym motywem. ZADEN Z NICH NIE DOPOWIEDZIAL TEGO DO KONCA NA GLOS". Ten stan

    ZOSTAJE. Kesz doszedl do krawedzi - powiedzial, ze to jego nazwisko jest na zaproszeniu
    -

    i nie powiedzial ani slowa o Orenie, o zmienianych trasach, o zeznaniu npc_halvek_wagonman

    z t_048 ani o tym, ze kaplan przyszedl na cmentarz WLASNIE Z ORENEM

    (faction_lumaria_church#knowledge: local_priest_last_visited_with_oren).

    oren_connection.lucan_said_it_out_loud zostaje bez zmian

    (said_obliquely_as_shared_interest_identity_still_unspoken), tozsamosc NIEPOTWIERDZONA,

    confirmation_route przez Halveka w loc_guild_holding_cells NIETKNIETA. Dopowiedzenie

    tego jest ruchem GRACZA, nie narratora.

    Nie ruszony tez lead_varkhen_as_witness_against_the_priest - Varkhen jest jedynym

    swiadkiem, a jego uzycie rozbija doktryne o zwierzetach. Kesz o Varkhenie NIE
    WIE

    (forbidden_without_source) i nic o nim nie padlo.


    5. DWIE RZECZY NIEUMOWIONE, ODNOTOWANE RAZ I BEZ NACISKU. Lucan powiedzial "to

    uzgodnione" i przeszedl dalej, ale dwa praktyczne pytania Kesza z t_243 zostaly
    bez

    odpowiedzi: KIEDY dostanie papiery (leza w zone_wall_void baszty, trzy kwadranse
    marszu,

    t_086) i ILE DOSTAJE POKOJ. Kesz dopisal przy nich "nieumowione" - jedna linijka,
    bez

    wracania do tematu, bo od tego zalezy jego wlasny kalendarz (retcon_000142: nie
    dokladac

    bilansu nieproszony, ale wlasne pytanie zadane ture wczesniej wolno odnotowac).

    Nadal otwarte takze: nazwisko urzednika akt i czyja twarz kupuje zaklad.


    6. CZEGO NARRATOR NIE ZROBIL. Nie nazwal kaplana. Nie wyznaczyl terminu spotkania.
    Nie

    zbudowal zegara ani nowej presji. Nie wypuscil niczego z forbidden_without_source

    [lucan_necromancy, spidey_existence, varkhen_existence, veyr_house_structure].
    Nie

    dopowiedzial za Lucana ani za Kesza tego, czego oba pliki wprost nie dopowiadaja.

    Nie wycenial niczego po raz kolejny (retcon_000135).


    7. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, 19:17. Obecni: Lucan,

    npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen w gildii.
    Sygnet

    u Lucana; pieczec, klucze i papiery w zone_wall_void baszty. Lucan 19/19, energia
    bez

    wydatku - czytac z pliku. Wyjscie pod trzecia pieczec nadal zaplanowane na dzisiejsza
    noc.

    '
  new_decision: 'Kesz zadal jedno pytanie i czeka: CO LUCAN ZAMIERZA ZROBIC Z KAPLANEM
