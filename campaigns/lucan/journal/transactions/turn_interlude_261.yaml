    dzis tedy nie przejda. Zostaja DWA dzialajace tropy i ZERO zegara: przekop (czas
    i rece, nie energia) albo wejscie frontowe, ktore znal kaplan (fact_varkhen_knows_priest_and_oren_visits).
    VARKHEN PYTANY WIELOKROTNIE ODPOWIADA Z ODCZUCIA, NIE Z POMIARU: druga pieczec
    czuje jako zabrudzona i mowi, ze to czuc mocniej niz kiedys; trzecia czuje, ze
    jest, i mowi wprost, ze trzyma inaczej, niz trzymala, ale NIE UMIE tego nazwac
    ani zmierzyc. Zgodne z voice_contract#blind_spot i #evasion; narrator nie dopisuje
    mu diagnozy. NIEUSTALONE: gdzie jest wlot korytarza frontowego, jak gruby jest
    zasyp, co znaczy "trzyma inaczej". POLA RUSZONE: pozycje czterech instancji, rezerwa
    Lucana (-0,5), scene_update na loc_varkhen_chamber.'
  prose: "Liny nikt z nich nie ma, ale lina tu jest. Wisi od tamtej nocy, przywiązana\
    \ do tego\nsamego kamienia co wtedy, sztywna od wilgoci i oślizgła na dwa chwyty\
    \ - nikt jej nie\nzwinął, bo nikt tu po tamtym nie schodził. Zejście trwa dwie\
    \ minuty i jest dokładnie\ntak nieprzyjemne, jak wygląda.\n\nVarkhen zszedł ostatni\
    \ i na dole postał chwilę dłużej, niż trzeba było na obejrzenie\nsię. Komora jest\
    \ jego i nie jest: sarkofag stoi otwarty i pusty, bo to on z niego\nwstał, a metal\
    \ rozsypany po posadzce leży dokładnie tam, gdzie go rozrzucono, gdy go\nstąd\
    \ wyciągano. Nikt tego nie ruszał od tamtej nocy.\n\nGeo, pięć razy, z różnych\
    \ miejsc komory. Kamień odpowiada za każdym razem to samo\ni dopiero złożone razem\
    \ zaczyna mieć sens: za starą bramą jest korytarz. Robiony,\nnie wyrwany - równe\
    \ ściany, spadek w dół i na wschód, i idzie dokładnie tam, gdzie\nVarkhen mówi,\
    \ że jest dolna brama. Tyle że wlot ma gdzieś indziej. Ta komora nigdy\nnie była\
    \ wejściem; ktoś ją kiedyś przebił od tyłu, żeby wejść do skarbca od strony,\n\
    z której nikt nie pilnuje.\n\nI jeszcze jedno, mniej przyjemne: pierwsze kilkanaście\
    \ kroków za bramą nie istnieje.\nJest tam ziemia, kamień i połamana płyta - to\
    \ samo osuwisko, które wypchnęło Varkhena\nna górę, poszło też w drugą stronę.\
    \ Kamień nie mówi, jak gruby jest ten korek. Mówi\ntylko, że za nim znowu jest\
    \ pustka.\n\n- Czujesz coś? - pyta Lucan po każdym skanie, i za każdym razem dostaje\
    \ inną część\nodpowiedzi.\n\n- Drugą czuję - powiedział w końcu. - Brudna. Mocniej\
    \ niż wtedy.\n\nA przy samej bramie, kiedy pytanie padło ostatni raz:\n\n- Trzecia\
    \ jest. Trzyma. - Zatrzymał się na tym dłużej, niż on się zatrzymuje. -\n  Ale\
    \ nie tak, jak trzymała. Nie umiem powiedzieć lepiej.\n"
