    value: in_the_corridor_outside_neris_aldhens_door_unlogged_no_entry_in_any_book_two_workmen_closing_from_the_left
  - *id002
  new_decision: Robotnicy sa dziesiec krokow od Lucana, wiec obserwacja konczy sie
    teraz. Puka do drzwi i wchodzi w rozmowe jako drugi bezimienny gosc tego tygodnia?
