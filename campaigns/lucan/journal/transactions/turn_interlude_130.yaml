    w wneke i traci zwyczajnosc, zeby zyskac jeszcze kilka minut patrzenia? Czy najpierw
    idzie na rusztowanie sprawdzic tamten poziom i tamten pyl, zanim ktokolwiek w
    tym skrzydle uslyszy jego glos?
