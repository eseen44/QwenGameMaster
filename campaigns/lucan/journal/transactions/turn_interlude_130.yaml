outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - obserwacja rzeczy oczywistych nie wymaga rzutu (system/locations-and-maps.md).
    Dziesiec minut, zero energii. Pierwsze wejscie Lucana do skrzydla pod rusztowaniem;
    ujawnione strefy zapisane w locations/lumaria-academy/discovery.yaml, utworzonym
    ta tura. 1. WEJSCIE BEZ SLADU. Przez brame przechodzi sie obok spiacego czlowieka
    i pustej ksiegi. Ani gosc, ani czlonek - w papierach Akademii z tego dnia nie
    ma nazwiska Veyr po raz drugi (pierwszy raz: event_turn_interlude_017, wtedy za
    cene Misnotice, dzis za cene dwoch procedur i jednego spiacego ciecia). 2. SKRZYDLO
    POD RUSZTOWANIEM JEST DOKLADNIE TYM, CZYM WYGLADA - I TO JEST NAJWAZNIEJSZA INFORMACJA
    TEJ TURY. Nie ma portierni. Nie ma ksiegi. Nie ma nikogo, kto liczy wchodzacych.
    Korytarz jest w polowie zastawiony materialem, dwa przejscia zaslepione plandeka,
    na kamieniu warstwa pylu, ktora zapisuje kazdy but. Akademia posadzila referentke
    szerokiej definicji w JEDYNYM skrzydle, ktorego nikt nie obserwuje - i to samo
    czyni to skrzydlo najlepszym pomieszczeniem w calej Akademii dla czlowieka takiego
    jak Lucan. Wygoda i nadzor zostaly jej odjete jednym ruchem. 3. GABINET. Swiatlo
    pod drzwiami, w srodku ktos chodzi i mowi do siebie na glos - czyta wlasny tekst
    na uszy, jak czlowiek, ktory przygotowuje mowe, a nie rozmowe. Sama. Zgodne z
    karta: nikt jej rzeczy nie nosi, wiec nikt jej tu nie asystuje. Na drzwiach przypiete
    papiery - jej wlasne, nie urzedowe. Rog jednego urwany, na drugim ktos dopisal
    cos recznie. Ta sama rzecz co przy tablicy w bramie, gdzie portier przypinal zawiadomienie
    trzy razy. Naciska na nia nie instytucja, a pojedynczy ludzie i robia to drobno.
    4. I RZECZ, KTORA PYL ZAPISAL ZA NIA. Pod drzwiami slady, ktore PRZYCHODZA I WRACAJA
    - ktos podszedl, stanal, nie zapukal i odszedl ta sama droga. Nie robotnik: nie
    ma z nimi ani wapna, ani powtorzen w kolejna strone. Nie da sie z tego powiedziec,
    kto ani kiedy dokladnie. Da sie powiedziec, ze BYL. 5. DRUGIE MIEJSCE, KTORE LUCAN
    CZYTA ODRUCHOWO, BO SAM TAK PRACUJE. Rusztowanie obiega skrzydlo z zewnatrz i
    jest z niego poziom z czystym widokiem na jej okna - a takze droga do tych okien
    i z nich. Pyl na tamtym poziomie tez jest naruszony. Dwie obserwacje osobno sa
    niczym; razem mowia, ze ktos interesuje sie Neris Aldhen szesnascie dni przed
    dysputa, nie wchodzac do zadnej ksiegi. Zgadza sie z bezimiennym, ktory dwa razy
    pytal w bramie, kiedy ona bywa (event_turn_interlude_128) - zgadza sie, ale tego
    nie dowodzi. 6. WORLD MOVE. Korytarzem ida dwaj robotnicy z dylem na ramieniu
    i zaraz beda tu, gdzie stoi Lucan. Trzeba albo ustapic i zostac zauwazonym jak
    kazdy inny czlowiek w przejsciu, albo wejsc w wneke - czyli zaczac sie ukrywac
    w skrzydle, w ktorym do tej chwili nie robil nic, czego nie wolno. Obserwacja
    ma od tej minuty koniec, niezaleznie od tego, co Lucan wybierze. 7. POZYCJA, W
    KTOREJ TO STAWIA LUCANA, NAZWANA WPROST. Jesli zapuka teraz, jest DRUGIM obcym
    w tym tygodniu, ktory przyszedl do niej bez wpisu i bez zapowiedzi - a ona sama
    jest osoba, ktora wpisuje swoich gosci do ksiegi wlasna reka. Jest tez jednak
    jedyna osoba w tym miescie, ktorej interes pokrywa sie z jego wlasnym bez zadnej
    transakcji (npc_neris_aldhen.attitude_to_pc.structural_interest). 8. STAN. 16:10
    dnia trzeciego, korytarz skrzydla pod rusztowaniem, przed jej drzwiami. Energia
    12.0 z 15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka
    syndykatu pod plaszczem, Spidey przy zebrach. USTALONE: wejscie bez sladu wykorzystane;
    skrzydlo pod rusztowaniem nie ma zadnej kontroli dostepu; ona jest w srodku, sama,
    cwiczy tekst na glos; ktos stal pod jej drzwiami i nie zapukal; z rusztowania
    jest widok na jej okna i pyl tam jest naruszony.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.zone_id
    value: zone_academy_scaffolded_wing
  - op: set
    instance_id: pc_lucan
