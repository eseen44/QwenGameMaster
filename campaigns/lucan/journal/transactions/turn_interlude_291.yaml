  scene_update: null
  new_decision: 'Komora grobowa za zawalem, 15:32, dzien piaty. ZAWAL OTWARTY, przejscie
    na tyle szerokie, ze da sie przejsc bokiem. Lucan w srodku z lampa, Boros na progu,
    Mara przy przejsciu, Spidey w komorze od trzech godzin, Tkacz na gorze przy rampie.
    CO WIDAC: komora wyzsza od korytarza o dwa wzrosty, szeroka na siedem-osiem krokow,
    ciagnie sie dalej, niz siega jedna lampa. Sciany z ciosanych blokow ZA DUZYCH
    jak na dzisiejsze rzemioslo, zaprawa drobniejsza i twardsza niz wszystko po drodze.
    TO MIEJSCE JEST STARSZE NIZ CMENTARZ NAD NIM - odczyt Lucana z practical_masonry,
    pierwszy konkret do old_lower_structure, ktore w discovery.yaml stalo jako sekret
    bez opisu. Po obu stronach TRZY POZIOMY POLEK w rzedach, az za zasieg swiatla.
    Zawartosci nisz NIE ROZSTRZYGNIETO - nikt jeszcze do zadnej nie zajrzal. NIEUSTALONE
    DALEJ: zrodlo przeciagu i dokad prowadzi drugie wejscie; jak daleko ciagnie sie
    komora. BOROS PYTA WPROST "mow, co robimy" - stoi na progu z lampa i osiem pustych
    workow lezy na wozku. Lucan ma rece bez sily po trzech godzinach noszenia; zaden
    warunek ani ubytek z tego nie wynika, to opis.'
