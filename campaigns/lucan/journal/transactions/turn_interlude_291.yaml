outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'ROBOTA IDZIE TAK, JAK ZAPOWIEDZIAL KAMIEN, I NARRATOR NIC DO NIEJ NIE
    DOKLADA (retcon_000015, retcon_000033): strop trzyma, bo Geo z t_288 tak powiedzialo,
    gruz jest plytki, bo tak powiedzialo, i nic zywego nie wychodzi, bo Spidey w t_290
    tego nie znalazl. Zaden rzut nie padl - roll_policy disabled. TRZY GODZINY: basis
    workshop_hours, czyli praca reczna wyceniana w godzinach (retcon_000024). Trzy-cztery
    kroki sypanego materialu, troje ludzi, kilofy i lopaty, plus wynoszenie urobku.
    Gracz zapowiedzial to slowami "bedzie nudno, naprawde kopiemy" i tak jest zagrane.
    LUCAN JEST NAJSLABSZYM OGNIWEM I JEST TO FAKT Z PLIKU, NIE KARA: character.yaml
    daje mu direct_physical E i physical_force 16, a Mara powiedziala mu rano wprost,
    ze miesnia jeszcze tam nie ma (t_278). Nie nakladam za to zadnego warunku ani
    ubytku - to jest opis, nie koszt mechaniczny. PRZYKRYWKA DZIALA SAMA Z SIEBIE:
    urobek jedzie na gore w workach i na wozie, dokladnie tak, jak Mara ustawila to
    w t_277 i zaladowala w t_283. Nikt nie musi nic tlumaczyc, bo ekipa faktycznie
    wynosi gruz. CO WIDAC PO PRZEBICIU: skala i WIEK. Lucan czyta mur, bo ma progression_practical_masonry
    (low_D w waskiej domenie, milestone_033) - komora jest starsza niz cmentarz nad
    nia. Jest to zgodne z discovery.yaml podziemi, ktore ma old_lower_structure jako
    odkryty sekret BEZ OPISU; ta tura nadaje mu pierwszy konkret i nic poza tym. CZEGO
    NIE ROZSTRZYGAM: zawartosci nisz, wartosci czegokolwiek, zrodla przeciagu i tego,
    dokad prowadzi drugie wejscie. Osiem workow lezy pustych i to jest decyzja gracza,
    nie moja.'
  prose: '— Możesz bić — mówi Lucan. — Pusto, cicho. Jest przeciąg, więc chyba gdzieś
    z drugiej

    strony jest wyjście.


    Boros wstaje z wózka, bierze kilof i przez następne trzy godziny nie mówi prawie
    nic.


    To jest ta część, o której Lucan uprzedzał, że będzie nudna, i jest nudna dokładnie
    tak,

    jak obiecał. Gruz schodzi warstwami. Boros rozbija to, co się zaklinowało, Mara
    odgarnia

    łopatą na bok, Lucan nosi. Worek, próg, wózek, z powrotem. Worek, próg, wózek,
    z powrotem.


    Strop trzyma — dokładnie tak, jak powiedział kamień. Nic się nie osypuje ponad
    to, co

    odrywają sami, i po pierwszej godzinie przestają zadzierać głowy.


    Po drugiej godzinie Lucan przestaje być użyteczny i wie o tym pierwszy. Ręce ma
    bez siły

    w konkretny, znajomy od rana sposób: nie boli, po prostu nie chce. Mara patrzy
    na to raz,

    nie komentuje i przesuwa się tak, żeby brać z jego strony więcej.


    Boros wali dalej równo, bez przyspieszania i bez zwalniania, jak coś nakręconego.


    Urobek jedzie na górę partiami. Wóz stoi przy rampie, gruz leży na wierzchu, worki
    pod

    płachtą — i cała przykrywka zaczyna działać sama z siebie, bo nie trzeba już niczego

    udawać. Ekipa w podziemiach cmentarza wynosi gruz. Dokładnie to robią.


    Kwadrans po trzeciej kilof przechodzi na wylot.


    Boros cofa się o krok, patrzy w dziurę wielkości pięści i mówi jedno słowo, którego

    Lucan nie słyszy, bo w tym samym momencie przez otwór idzie powietrze i lampa
    kładzie

    się płomieniem na bok.


    Poszerzają to we trzech. Kwadrans, może dwadzieścia minut, i przejście robi się
    takie,

    że da się przejść bokiem.


    Mara podaje lampę Lucanowi, bo on wchodzi pierwszy — tak stoi umowa od rana.


    I komora jest większa, niż powinna być.


    Nie ogromna. Ale wyższa niż korytarz o dobre dwa wzrosty, szeroka na siedem, może
    osiem

    kroków, i ciągnie się w ciemność dalej, niż sięga jedna lampa. Ściany są z kamienia

    ciosanego w bloki, które są **za duże** — takie, jakich nikt dziś nie kładzie,
    bo nikt

    dziś nie ma po co. W rzędach, po obu stronach, biegną półki. Trzy poziomy, jeden
    nad

    drugim, równo, aż tam, gdzie światło się kończy.


    Lucan przejeżdża palcami po spoinie i zatrzymuje rękę.


    Zaprawa jest inna niż wszystko, przez co dzisiaj szli. Drobniejsza, twardsza,
    bez

    wypełniacza, jaki dokładali później. Cmentarz nad ich głowami jest stary. To jest

    starsze.


    Za plecami Boros stawia lampę na progu i ogląda swoją dłoń, na której dwie godziny
    temu

    pękł odcisk.


    — No to jesteśmy poza papierem — mówi spokojnie. — Mów, co robimy.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs:
