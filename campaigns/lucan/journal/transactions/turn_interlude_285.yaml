outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: unchanged
  perspective: pc_lucan
  summary: 'POWTORKA t_284, ZAKRES: PROZA. Zaden fakt, zaden stan i zadna sekunda
    sie nie zmieniaja - t_284 dostaje superseded_by z supersession_scope: prose, a
    jego pierwotna wersja idzie do journal/superseded (dziennik jest append-only,
    AGENTS.md). CO BYLO ZLE, ZMIERZONE. (1) Z jedenastu elementow deklaracji gracza
    proza oddala SIEDEM. Cztery brakujace - wyczucie umarlych, brak wyczucia zywych,
    rekonesans na sto metrow i prosba, zeby nie pytac jak - byly calym ujawnieniem
    i zostaly wylacznie w audycie. Przyczyna: cala mowa poszla jako PARAFRAZA NARRATORA,
    a parafraza kompresuje. (2) Kwestie Mary: 62 slowa, 6 wystapien "nie" (9,7%),
    5 z 7 zdan z zaprzeczeniem, 3 zdania zaczynajace sie od "Nie". Przyczyna zmierzona:
    10 z 11 osi jej kontraktu glosu jest zdefiniowanych przez zaprzeczenie, a narrator
    uzyl kontraktu jako GENERATORA zamiast jako filtra. Do tego jej kwestia z t_277
    posluzyla za SZABLON, co zamienilo jednorazowe nawiazanie w tik i przenioslo retcon_000162
    z narratora na postac. (3) Cztery kalki skladniowe, w tym niegramatyczne "nie
    prosze, zebys cofnal" bez dopelnienia. CO JEST TERAZ: cala mowa Lucana w dialogu,
    wszystkie jedenascie elementow. Mara ma piec krotkich zdan, JEDNO zaprzeczenie
    i dwa zdania twierdzace o tym, co zrobi. Boros bez zmian - jego kwestie byly poprawne
    i jego pytanie o sygnal zostaje otwarte tak, jak bylo.'
  prose: 'Przecznicę za gildią ulica robi się na tyle pusta, że da się mówić. Lucan
    mówi do pleców

    Borosa i do profilu Mary, bo tak się rozmawia na wozie.


    — Sera nic nie wie i ma tak zostać. Wszystko za pierwszym zawałem jest poza zleceniem.

    Przebijamy się przez pierwszy. Jeśli za nim będą następne, przez nie też — tego
    już nikt

    nam nie zlecił i nie zleci. Co robimy dalej, należy do nas trojga, a cokolwiek
    tam leży,

    jest nasze. Złoto i ryzyko po równo.


    Koń idzie równo, koła robią swoje, nikt się nie odwraca.


    — Teraz to, o co Boros pytał rano. Umarłego wyczuję. Wyczuję go wcześniej, niż
    on zobaczy

    was, i zdążę was stamtąd wyprowadzić. — Krótka pauza. — Żywego nie wyczuję. Zwierzę,

    człowiek, cokolwiek oddycha — nic. Za to korytarz przed nami obejrzę na sto metrów.

    Co najmniej.


    Mara nie odwraca głowy. Boros przekłada uzdę do drugiej ręki i to jest cała jego
    reakcja.


    — I o jedno proszę: nie pytajcie jak. Do końca śledztwa. Potem powiem sam, obojgu.
    —

    Lucan pozwala temu chwilę poleżeć, zanim domknie. — Z tego wychodzi jedna rzecz
    i chcę,

    żeby padła głośno. Jedyny moment, w którym może pójść naprawdę źle, to coś żywego

    bezpośrednio za ścianą, którą właśnie rozbijamy.


    Wóz mija bramę podwórza i skręca w szerszą ulicę.


    — I na koniec, żeby potem nie było: po pierwszym kopaniu jesteśmy poza podatkami,
    poza

    przepisami, a gildia umyje ręce, jeśli coś się nam stanie. Pytania?


    Boros nie reaguje ani na podatki, ani na przepisy, ani na umyte ręce. Te trzy
    rzeczy

    przechodzą przez niego tak, jak przechodzi informacja, że w czwartek będzie targ.


    Reaguje dokładnie na jedno.


    — Jaki sygnał? — pyta, nie odwracając się. — Bo ja będę stał przodem do ściany
    i będę

    miał w rękach kilof. Jak mam się cofnąć, to musi być coś, co usłyszę przez walenie.


    Mara odzywa się dopiero po nim, i krótko.


    — Teraz już wiem — mówi. — Jak mnie zapytają, skłamię. Chcę, żebyś to policzył.


    Poprawia rzemień kołczana, na którym nic nie wymaga poprawiania.


    — Pytać nie będę. Idziemy.


    Boros wybiera ten moment, żeby poprawić tarczę na plecach.


    — Ja mam pytanie na potem — mówi. — Jak się skończy, to mi powiesz. — Pauza długości

    dwóch kroków konia. — Ale sygnał chcę teraz.

    '
