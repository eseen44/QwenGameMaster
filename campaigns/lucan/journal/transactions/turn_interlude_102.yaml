  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Czterdziesci minut, zero energii. Dwie decyzje postawione i
    obie przyjete. 1. PRAWDA - I JEST TO NAJTANSZA DOBRA DECYZJA TRZECH DNI. Lucan
    mowi Marze, zeby napisala dokladne daty, nic nie uzgadniala i nie pytala go o
    wersje. Mara przyjmuje to natychmiast i nazywa mechanizm, ktorego Lucan nie musial
    jej podawac: urzednik akt nie porownuje zeznania z rzeczywistoscia, bo nie ma
    do niej dostepu - porownuje zeznania ZE SOBA. Uzgodniona wersja jest wiec ryzykiem
    rosnacym z liczba osob na obsadzie, a na obsadzie garbarni jest wiecej ludzi,
    niz Mara umialaby skoordynowac. Prawda nie ma tego problemu w ogole. 2. DOPISANIE
    RUSKA JEST MATERIALNIE KORZYSTNE I MARA WIDZI TO OD RAZU. Halven Rusk byl w garbarni
    i to jego odciagano od szczuroogra (milestone_021_rusk_rescued) - fakt, ktorego
    Mara nie miala na liscie, bo Rusk nie byl czescia grupy, byl POWODEM, dla ktorego
    grupa tam weszla. Dopisanie go zmienia kategorie wpisu: przestaje to byc "czterech
    czlonkow gildii w cudzej garbarni", a staje sie "wypadek inspektora zagrozen podziemnych
    z asysta gildii" - a to jest kategoria, ktora ma wlasny formularz i wlasny precedens.
    Rubryka, ktora sie zgadza, nie generuje pytania. 3. CENA, KTORA MARA NAZYWA. Rusk
    nie jest zyczliwym swiadkiem. Byl tam i zostal wyciagniety, ale od miesiecy opowiada
    kazdemu, kto sluchа, ze ucieczka poszla nie tak, i ma wlasna teorie dlaczego (suspicion_lucan_sabotaged_escape,
    srednia pewnosc; agenda avoid_being_used_as_lucan_cover). Wpisanie go do zeznania
    kladzie go NA TEJ SAMEJ STRONIE co Lucana, celowo. 4. CENA, KTOREJ NIE WIDZI NIKT
    POZA LUCANEM. Dzwignia Ruska nigdy nie byla trescia jego zeznania - byla WOLUMENEM
    i INICJATYWA: raporty i sprzeciwy proceduralne pisane z wlasnej woli, bez pytania,
    na ilosc. To jest dokladnie to, co zabralo pioro (turn_interlude_097). UWAGA,
    ZEBY NIE PRZESADZIC: klatwa nie zamyka Ruskowi ust. Uruchamia sie, gdy Rusk PISZE
    TYM PIOREM. Wezwany przez urzednika moze zeznac ustnie i ktos to spisze za niego.
    Lucan nie uciszyl Ruska - odjal mu zdolnosc dosypywania papieru z wlasnej inicjatywy,
    a wroga wersja potrzebuje wlasnie inicjatywy. 5. I TU JEST DRUGA STRONA TEGO SAMEGO
    MEDALU. Metoda Cortha to dopisywanie pytania wszedzie, gdzie sie nie zgadza. Urzednik
    miejski, ktory nie oddaje zeznania na pismie, generuje otwarta rubryke, nie zamkniecie
    - a otwarta rubryka przy nazwisku Lucana zostaje tam trzynascie dni. Dodatkowo
    urzednik, ktory przestaje produkowac raporty, w koncu zostaje zastapiony, a nastepca
    zaczyna od zera: bez miesiecy zmeczenia Corthem i bez piora. 6. CALY LUP IDZIE
    DO SYNDYKATU - DECYZJA PODJETA, PRZETOP ODRZUCONY. Lucan wybiera cala droge Mary,
    ryta trzecia wlacznie: zorganizowana przestepczosc zamiast przypadkowej slamazarnosci,
    bo przetop to trzy tygodnie nocy przy piecu, jedna trzecia ceny i worek identyfikowalnej
    roboty lezacy dalej pod czyjas podloga. 7. BOROS DOSTAJE TERMIN I ODDYCHA. Poniesie
    szescdziesiat kilo, przekaze je i na tym konczy - nie chce znac nazwiska czlowieka,
    ktory placi, i swoj udzial wezmie z reki Lucana, nie z ich. To nie jest tchorzostwo,
    to jest ta sama arytmetyka, ktora podal godzine wczesniej: czlonek gildii rangi
    C nie ma po co istniec w cudzej ksiedze. 8. MARA STAWIA CENE PORECZENIA, JEDYNA,
    JAKA MA. Wprowadzenie idzie na JEJ nazwisko - jesli Lucan okaze sie problemem,
    to ona go przyprowadzila. Zada jednej rzeczy i formuluje ja tym samym plaskim
    tonem, co wszystko wczesniej: chce wiedziec ZAWCZASU, jesli Lucan zamierza zrobic
    cos, czego oni pozalują. Nie grozi i nie prosi o szczegoly. 9. WORLD MOVE - ODPOWIEDZ
    WRACA W CIAGU GODZINY I JEST GORSZA, NIZ LUCAN LICZYL. Termin: DZIS. I oni JUZ
    WIEDZA, czyje to jest. Szescdziesiat kilo grobowego towaru wynurzajace sie w tym
    samym miesiacu co operacja gildii na cmentarzu nie jest zagadka dla ludzi, ktorych
    fach polega na wiedzeniu, skad przychodzi towar. Chca zobaczyc towar i czlowieka
    RAZEM, raz, w jednym pokoju. Kwoty nie podaja - to jest ich dzwignia i wiedza
    o tym. Powod pospiechu jest rzeczowy: ryta robota mortualna ma termin waznosci,
    bo parafie uzgadniaja ksiegi a rodziny pamietaja rocznice, wiec kazdy tydzien
    obniza cene i podnosi ryzyko. 10. PROBLEM, KTORY WLASNIE STAL SIE DZISIEJSZY.
    Szescdziesiat kilo musi przejsc przez miasto do wskazanego miejsca, a to jest
    dokladnie "ciezszy ladunek" z objective_liquidate_cemetery_loot: kontrola na wjazdach
    na targ i swieze obwieszczenie o zezwoleniach na transport szczatkow zostawiaja
    wpis w rejestrze na kazdej formalnej trasie. 11. STAN. 13:40 dnia trzeciego. Energia
    8 z 15, integralnosc 19 z 19, bez warunkow. Zloto nadal u Borosa, ale juz z terminem.
    Prawnik dostepny w pakiecie od momentu wejscia do pokoju. Trening z Mara od rana
    dnia czwartego. Corth ma prawdziwe daty w drodze i nazwisko Ruska w rubryce.'
  operations:
  - *id002
  new_decision: 'Syndykat chce dzis: towar i czlowiek w jednym pokoju, godzina i miejsce
    od nich, kwota nienazwana. Jak szescdziesiat kilo przechodzi przez miasto bez
    wpisu do rejestru - i kto wchodzi do tego pokoju: Lucan sam, czy z Borosem i Mara,
    ktorych nazwiska sa juz w transakcji?'
