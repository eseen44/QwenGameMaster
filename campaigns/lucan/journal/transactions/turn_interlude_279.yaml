outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'INSTRUKCJE WRESZCIE PADLY. Nalezaly do Lucana od t_269 ("INSTRUKCJE DLA
    MARY I BOROSA NALEZA DO LUCANA - nie padly w tej turze") i Mara nazwala ten brak
    w t_277. Tresc w calosci z deklaracji gracza; narrator nic do niej nie dolozyl.
    ZADANIE JEST KANONICZNE, NIE WYMYSLONE: locations/cemetery-underworks#connection_varkhen_collapse
    laczy zone_old_lower_route z loc_varkhen_chamber i ma travel_time "uncertain_after_collapse".
    Zawal za grobowcem istnieje w pliku od dawna. DOSTAWA WARSZTATU ROZSTRZYGNIETA.
    item_basic_alchemical_bench stal od t_191 jako "oplacony, czeka na dostawe do
    piwnicy gildii", a jego plik mowil wprost, ze moment dostawy NIE JEST ustalony
    zadnym plikiem i czeka na ture albo deklaracje gracza. Deklaracja padla. Skrzynia
    przyszla ze straganu w ciagu trzech dni od zaplaty, bez udzialu Lucana - zgodnie
    z retcon_000129 (Lucan nigdy jej nie niosl). Nie robie z niej ani dowodu, ani
    zegara (retcon_000055), i nie dokladam jej roli, ktorej gracz nie zadeklarowal.
    GLOSY: Boros z portrayal i speech_traits - praktyczny, sprowadza plan do czynnosci,
    nie moralizuje, pyta o obsade ostrego konca, wlasny udzial nazywa na glos bez
    targowania. Jego agenda ma claim_agreed_share_of_treasure, wiec slowo "bezpanskie"
    trafia w nia wprost. Mara z kontraktu glosu: jedno zdanie, z jej rzemiosla - jak
    rzecz wyglada z zewnatrz. ZACZEPKA, NIE KOMPLIKACJA (retcon_000164): uwaga Mary
    o tym, ze murarze wynosza gruz, a nie worki. Nie stawia terminu, kary ani obowiazku;
    jest rzemioslem zwiadowczyni. PYTANIE BOROSA ZOSTAJE OTWARTE i on sam odklada
    je do jedenastej - narrator nie odpowiada za Lucana (system/player-agency.md).
    NIEUSTALONE: co jest za zawalem; kto idzie na ostry koniec; czy Varkhen wie, ze
    ekipa przyjdzie przez jego komore.'
  prose: 'Na dole pachnie kurzem i olejem do drewna. Boros stoi nad trzema kilofami
    rozłożonymi

    na ziemi i właśnie odkłada czwarty na bok, bo trzonek ma słój idący w poprzek.


    — Mów — rzuca, nie podnosząc głowy.


    Lucan mówi. Worki. Będzie nudno. Naprawdę kopiemy, nie udajemy, że kopiemy. Za
    to nikt

    nad nami nie stoi. Mamy otworzyć drogę do niższych katakumb, tych, które zasypało
    za

    grobowcem z truposzem — i nikomu nie będzie szkoda niczego, co bezpańskie, ale
    droga

    ma być przede wszystkim wolna.


    Boros podnosi głowę dopiero przy „bezpańskie".


    — Dobrze. — Odkłada kilof. — To ja mówię swoje teraz, żeby potem nie było: co
    wyjdzie

    spod zawału, dzielimy jak ostatnio, i moja część idzie do mnie, nie do gildii.
    Nie

    targuję się o to, tylko ci to mówię. — Zbiera z ziemi zwój płótna i zaczyna liczyć

    worki, po dwa na rękę. — Osiem. Jak wyjdzie więcej, to wyjdzie więcej, ale ośmioma
    da

    się jeszcze iść.


    Potem pauza, krótka, i to jest ta jego jedna rzecz.


    — Idziemy przez komorę, w której leży. — Nie nazywa Varkhena inaczej. — Więc kto
    jest

    na ostrym końcu, jak coś tam jednak jest? Bo ja jestem dobry przy trzech krokach
    i przy

    ścianie, a nie przy czymś, co siedzi w ciemnym korytarzu od dwustu lat.


    Mara przyszła w połowie tego i stoi przy skrzyni z klinami, ważąc jeden w dłoni.
    Odzywa

    się raz.


    — Murarze wynoszą gruz — mówi. — Worki, które wychodzą pełne i nie wracają puste,
    wyglądają

    z zewnątrz inaczej niż worki, które wychodzą i wracają. — Odkłada klin. — Ja bym
    miała

    na wozie i jedno, i drugie.


    Boros patrzy na nią przez chwilę, potem na kilofy, potem wzrusza ramionami i dokłada
    do

    stosu łopatę.


    — Pomyśl o tym ostrym końcu do jedenastej — mówi do Lucana. — Nie dziś, teraz.
    Do

    jedenastej.


    ---


    Cela w piwnicy jest zimna i pusta w ten konkretny sposób, w jaki puste są pomieszczenia,

    które ktoś ma, ale w nich nie mieszka. Skrzynia stoi pod ścianą i stoi tam najwyraźniej

    od paru dni — siano na wierzchu zdążyło osiąść, a kredowy znak straganiarza rozmazał

    się od wilgoci.


    W środku, jedno po drugim: retorta z bąblem w szkle przy szyjce, alembik, rura
    chłodząca

    owinięta w szmatę, trzy stojaki, moździerz z tłuczkiem, waga uchylna, palnik i
    komplet

    słoi z korkami. Wszystko z drugiej ręki i wszystko nosi ślady po kimś, kto tego
    używał

    przed nim — jeden stojak ma wypaloną obrączkę dokładnie tam, gdzie stawia się
    małą

    kolbę, i to jest jedyna rzecz w tej celi, o której Lucan wie na pewno, co znaczy.


    Rozstawia to na ławie pod ścianą. Retorta po lewej, bo tak się stoi, kiedy nalewa
    się

    prawą. Stojaki w rzędzie. Słoje na półce nad ławą, korkami do góry, etykietami
    do

    siebie, choć na żadnym nie ma jeszcze ani jednej etykiety.


    Kiedy kończy, siada na pryczy i przez chwilę na to patrzy. To jest pierwsza rzecz

    w tym mieście, która nie jest niczyim zleceniem.

    '
