outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. TEMPERAMENT POKOJU - HUMOR. Praktycy MAJA go duzo i jest szubieniczny,
    i to jest pulapka: pokoj, ktory sie smieje z twojego zartu, nie zdecydowal jeszcze
    niczego. Ale humor jest jedyna waluta, ktora u nich chodzi - czlowiek, ktory nie
    umie sie zasmiac z wlasnej operacji, jest dla nich czlowiekiem, ktory cos chowa.
    Urzednicy: zero. Nie dlatego, ze sa ponurzy - dlatego, ze zart nie wchodzi do
    protokolu, a TRESC zartu wchodzi. Wszystko, co Lucan powie zartem, zostanie zapisane
    bez zartu. 2. TROSKA O MALUCZKICH. U praktykow jest PRAWDZIWA I WASKA: obejmuje
    swoich - ludzi, ktorzy wchodza w dziury. Argument "uratowalem miasto" nie robi
    tam nic. Argument "nikt z naszych nie oberwal i oto dlaczego" robi wszystko. U
    urzednikow troska nie istnieje jako uczucie, tylko jako SKARGA: mieszczanin, ktory
    zlozyl pismo, jest sprawa; mieszczanin, ktory zginal i nie zlozyl pisma, nie jest
    niczym. 3. KOLKA W DUPIE. Praktycy - male. Kazdy z nich zrobil w polu cos, czego
    nie wpisal do raportu, i wszyscy o tym wzajemnie wiedza. Urzednicy - calkowite,
    ale NIE moralne, tylko proceduralne. Urzednika nie gorszy nekromancja. Urzednika
    gorszy brakujacy podpis. 4. I ZARAZ POTEM SERAPHINE DODAJE RZECZ, KTOREJ LUCAN
    NIE ZAMOWIL: najgrozniejszy czlowiek w tej sali nie jest ani praktykiem, ani urzednikiem.
    Jest nim ten, kto ma powod OSOBISTY. Sprawdzenie kompetencji Ruska ruszylo po
    zeznaniach Lucana, Mary i Borosa (fact_seraphine_knows_rusk_inquiry_origin) -
    i to jest jedyna rubryka w tej sprawie, w ktorej ktos moze cos stracic z powodu
    Lucana osobiscie. 5. WIADOMOSC O STRAZY LADUJE MOCNIEJ, NIZ LUCAN JA PODAL, I
    JEST TWARDSZA NIZ JEGO WERSJA. Ilva nie powiedziala, ze biznes zwlokowy ma "akceptacje"
    strazy. Powiedziala, ze wywoz cial z Lumarii NIGDY nie byl linia syndykatu, bo
    prowadzi ja STRAZ, a z klientem w mundurze sie nie konkuruje (event_turn_interlude_100).
    To nie jest oslona instytucji nad cudzym interesem - to jest operacja instytucji.
    Seraphine nie reaguje ulga i nie reaguje szokiem. Milczy dluzej, niz milczala
    przez caly wieczor. 6. BO TO POTWIERDZA JEJ WLASNA HIPOTEZE Z ZUPELNIE ZLEJ STRONY.
    Trzymala linie sledcza, ze rody i straz oslanialy transport zwlok dla prywatnego
    odbiorcy (fact_seraphine_holds_corpse_pipeline_hypothesis) i sama zdecydowala,
    ze nie wpisze jej do raportu bez niezaleznego potwierdzenia. Potwierdzenie wlasnie
    przyszlo - od pryncypalki syndykatu, w pokoju, ktorego Seraphine nie moze nazwac,
    przez czlowieka, ktorego nie moze wystawic jako zrodla. Wiedza jest pewna i CALKOWICIE
    NIECYTOWALNA. Mowi to na glos jednym zdaniem: dostal jej wlasny wniosek z powrotem,
    tylko zatruty. 7. I NATYCHMIAST WIDZI, CO TO ROBI Z JEJ ROBOTA. To LUCAN zlecil
    jej polaczenie obsady polnocno-zachodniej zapory, podpisow i zrodla rozkazow (event_turn_interlude_052)
    - czyli chodzi juz od dwoch dni po aktach gildii, sladem, ktory prowadzi w gore
    Strazy Miejskiej, na papierze gildii i pod wlasnym nazwiskiem. Do dzisiaj myslala,
    ze szuka zepsutego urzednika. Teraz wie, ze idzie w strone instytucji, ktora ten
    interes PROWADZI - i ze tygodniowe formalne zadania sluzb o przekazanie cial,
    akt i dowodow leza w tej chwili na jej wlasnym blacie, cztery cale od kwiatow.
    8. ODPOWIEDZ NA "JAK DUZO CHCESZ WIEDZIEC" JEST NATYCHMIASTOWA I MA JUZ SWOJ PRECEDENS.
    Powtarza doktryne, ktora sama ustanowila przy glejcie: wiedza jest droga, POSIADANIE
    jest dyskwalifikujace (event_turn_interlude_036). Chce KSZTALTU, nie nazwisk.
    Konkretnie: (a) MUSI wiedziec, czego sie spodziewac w terenie - obcy ludzie, wozy,
    kwatera poza murami, materialy poza kolejnoscia - bo to ONA odpowiada za obwodnice
    operacji gildii i inaczej zgłosi wlasnego dostawce jako obce wejscie; (b) NIE
    CHCE nazwisk, adresu pokoju, twarzy ani tresci umowy, bo tego nie da sie odzobaczyc
    przed sluzbami miejskimi, a ona staje przed nimi rano; (c) chce wiedziec JEDNO,
    i pyta o to wprost - czy ci ludzie wiedza, co jest pod cmentarzem. Odpowiedz "nie"
    jest jedyna, przy ktorej reszta ma sens. 9. CENA, KTORA NAZYWA BEZ EMOCJI I KTORA
    JEST NAJPOWAZNIEJSZA RZECZA TEJ TURY. Proby gildii na cmentarzu beda odbywac sie
    w pustce KUPIONEJ od przestepczej organizacji. Dopoki nikt tego nie wie, to jest
    przewaga. W dniu, w ktorym ktos to nazwie, cala operacja zostaje skazona WSTECZ:
    kazdy czlonek gildii, ktory tam pracowal, staje sie czlowiekiem, ktory pracowal
    pod oslona syndykatu, a ona - oficerem, ktory to dopuscil. To jest dokladnie to,
    o co Boros prosil jako o wspolna wersje przed pierwszym butem na cmentarzu (event_turn_interlude_116),
    tylko z drugiej strony stolu i o dwa tygodnie wczesniej. 10. KWIATY. Lucan zaslania
    sie nimi dokladnie tak, jak zapowiedzial. Seraphine nie wchodzi w to ani jednym
    slowem - patrzy przez nie, czeka, az opadna, i mowi dalej. To jest gorsze niz
    gdyby sie zasmiala. 11. WORLD MOVE - ONA STAWIA WLASNY WARUNEK PO RAZ PIERWSZY
    TEGO WIECZORU I NIE JEST TO prosba. Skoro Lucan kupil pustke wokol cmentarza na
    czas prob GILDII, to gildia wejdzie tam na jego układzie - a ona jest jedynym
    oficerem, ktory o tym wie. Zada wiec, zeby zanim padnie data prob, ustalili razem,
    co dokladnie w tej sprawie powie ona, jesli ktos ja zapyta pod protokolem. Nie
    chce wersji Lucana. Chce SWOJEJ - takiej, ktora nie bedzie klamstwem, tylko zdaniem
    prawdziwym i niepelnym, bo tylko takie wytrzymuje urzednika. 12. STAN. 18:35 dnia
    trzeciego, gorne biura, skorupy pod drzwiami. Energia 7.8 z 15, integralnosc 19
    z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu w kieszeni, Spidey
    przy zebrach nieodkryty. NOWA WIEDZA SERAPHINE: linie wywozu cial prowadzi Straz
    Miejska (zrodlo niecytowalne), Lucan ma uklad z syndykatem o pustke wokol cmentarza.
    NADAL nie wie: nazwisk z pokoju, o Keszu, o wojnie z Kosciolem, o sprzedanej wiedzy
    wyprzedzajacej, o zakonie mieczowym i o kanale ostrzegawczym.'
  new_decision: Seraphine pyta wprost, czy syndykat wie, co jest pod cmentarzem, i
    zada wlasnej wersji na protokol, zanim padnie data prob. Co odpowiada Lucan -
    i czy zatrzymuje sie na ksztalcie, czy idzie dalej niz ona poprosila.
