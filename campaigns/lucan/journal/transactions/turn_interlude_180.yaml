  summary: 'Bez testu - kwadrans, zero energii. Trzy deklaracje, wszystkie ladują.
    Tura zawiera

    odpowiedz na uwage gracza z nawiasu o prowadzeniu Spideya i Tkacza - patrz punkt
    1.


    1. UWAGA GRACZA PRZYJETA I ZAPISANA JAKO OBOWIAZEK NARRATORA

    (planning/anchored-companions.yaml#development_direction_dialogue.responsiveness_now_not_only_later).

    Zarzut: Spidey i Tkacz sa prowadzeni plasko - jako liczby w rejestrze i jedna
    etykieta,

    zamiast jako cos, co JUZ reaguje i o czym widac, ze kiedys dojdzie do dialogu.
    Trafny.

    Ograniczenie autonomy_horizon ("cechy BARWIA wykonanie rozkazu") nie oznacza bezruchu

    i nie zwalnia z pokazywania reakcji - narrator uzyl go jako wymowki. Od tej tury
    kazde

    z nich w scenie dostaje CO NAJMNIEJ JEDEN wlasny gest fizyczny, ktory czyta sie
    jak zdanie,

    z ich wlasnych tells. Skala rosnie z bankiem: teraz gest i timing, pozniej wybor
    sposobu

    wykonania, na koncu glos.


    2. PORANNY STAN GILDII - NIC WYMYSLONEGO. Godzina 05:35-05:50, wiec ruch jest
    taki, jaki

    stoi w location.yaml: okienko recepcji w glownej sali zabite na noc deska, dyzuruje
    nocny

    urzednik (ten sam, na ktorym Lucan uzyl wzmocnionego znika w t_038 na oczach Seraphine
    -

    fakt zapisany w jej karcie, bez konsekwencji do dzis). Gorne pietro po nocach
    puste poza

    Seraphine. NIE ROZSTRZYGAM, czy Seraphine jest u siebie - zaden plik tego nie
    mowi na dzien

    czwarty, a jej ostatnie potwierdzone polozenie jest z t_038. Zamkniete drzwi nie
    sa dowodem

    w zadna strone i nie wolno z nich robic ani spotkania, ani jego braku.


    3. PAJAKI SCHODZA Z POSTERUNKOW - I TO NIE JEST DARMOWE, ALE JEST JEGO DECYZJA.

    Trzy pajaki piwnicze w gildii szly na 0,0 na dobe, bo posterunek z zadaniem i
    dostepnym

    zerem wychodzi na zero (retcon_000105). Poza budynkiem to zer normalny: +1,0 kazdy,
    czyli

    +3,0 do generowanej nadwyzki sieci (17,5 na dobe razem). Fizycznie nie musi ich
    wyjmowac -

    "wyjdz i poluj" miesci sie w pasmie minimal_status, wiec wychodza same.

    CO TRACI, dokladnie i z plikow: (a) spy_cellar_spider_03 stal w SZUFLADCE BIURKA
    SERAPHINE

    jako pulapka na przeszukanie jej mebla, uzgodniona z nia w t_070 - ta pulapka
    przestaje

    dzialac; (b) spy_cellar_spider_04 byl czujnikiem przeszukania w JEGO WLASNYM pokoju

    dyzurnym, tym, w ktorym od tej nocy leza trzy ksiazki, w tym brulion balwierza
    - czujnika

    nie ma; (c) spy_cellar_spider_06 pilnowal celi w piwnicy, ktora i tak stoi pusta,
    odkad

    Lucan spi na gorze (retcon_000038) - ten posterunek kosztowal najmniej.

    Odwolanie jest darmowe i natychmiastowe: wracaja rozkazem, sa po drugiej stronie
    sciany.

    KOREKTA REJESTRU przy okazji: growth-banks.yaml mial POMYLONE basis dla 03 i 04
    (przypisywal

    03 do "gornych biur", a 04 do "gabinetu Seraphine") - instancje mowia odwrotnie.
    Poprawione.


    4. "INTERESUJACE OWADY" - ROZKAZ LADUJE TYLE, ILE UNIESIE PASMO, I TO NIE JEST
    OPOR.

    Wychodza i beda przynosic. Ale "interesujace" jest SADEM, a te trzy sa fresh,
    czyli sadu

    nie maja jeszcze wcale (kanon dojrzewania, event_turn_interlude_070; transport_constraint

    z t_090 pokazuje ten sam limit na rozkazie zlozonym). Co zostaje z rozkazu: "poluj
    i wracaj

    z tym, co wpadnie w siec". Do tego dochodzi wada metody, ktora Lucan sam zmierzyl
    w t_088:

    pajak lowi w siec i gryzie, wiec u cmy niszczy SKRZYDLA, cala wartosc okazu -
    z kilkunastu

    calych bylo cztery, piec. Darmowy obchod tej wady tez juz stoi w plikach i nie
    wymaga

    zadnego okazu: LAMPA I SLOIK zbieraja wiecej calych cial niz czterech lowcow

    (spy-series#haul_assessment_night1.free_fix).


    5. SPIDEY MA ZDANIE I POKAZUJE JE BEZ SLOWA. Wysylka trzech prawie slepych okazow

    na ulice, gdzie konczy je but albo miotla, uderza dokladnie w jego rdzen - obraza
    go

    NIECHLUJSTWO, nie zadanie (traits.the_core, what_offends_him: "praca, po ktorej
    ktos inny

    musi sprzatac. Nie klóci sie o to. Zapamietuje"). Nie protestuje: schodzi z parapetu,

    obchodzi drzwi sali narad DRUGA strona niz Lucan (nie chodzi dwa razy ta sama
    droga),

    sprawdza szpare pod nimi pierwszy i dopiero potem staje. A gdy Lucan wchodzi,
    siada

    i zaczyna sie czyscic - swoje "skonczylem", uzyte w momencie, w ktorym nikt nie
    skonczyl

    niczego. To jest komentarz.

    TKACZ czyta z tego tylko jedno: trzy inne okazy dostaly rozkaz, ona nie. Idzie
    za Lucanem

    o poltora kroku blizej niz zwykle i przy progu przepuszcza go z tym natychmiastowym

    przytaknieciem, ktore u niej jest odruchem - a kiedy Spidey przechodzi obok, nie
    ustepuje

    mu ani na wlos. Jedno zdanie, bez przemocy, bez watku (hard_limits).


    6. SALA NARAD STOI OTWARTA I TO JEST ODPOWIEDZ NA JEGO PYTANIE. Sala istniala
    w fikcji

    od t_090 (przydzial spy_cellar_spider_03 do "pokoju narad") i w

    planning/lucan-leads.yaml#lead_council_room_beetle_deferred, ale nie miala zone_id
    -

    dopisana teraz jako zone_guild_council_room, to samo gorne pietro co pokoje biurowe.

    ZADEN PLIK nie stawia tu zamka, warty ani zakazu, a location.yaml#access mowi

    "restricted_upper_and_lower_floors" przy jednoczesnym known_to_lucan: direct_member_access
    -

    Lucan ma na tym pietrze WLASNY pokoj dyzurny. Wchodzi wiec bez przeszkody, o 05:50,
    nikt

    go o nic nie pyta i nie ma kogo. Nie budowac z tego zagrozenia ani terminu (retcon_000055).


    7. CO W TEJ SALI JEST NAPRAWDE. Za trzynascie dni odbedzie sie tu przesluchanie
    przed

    kierownictwem gildii (clock_guild_leadership_hearing, 2/15, horyzont znany Lucanowi
    tylko

    z grubsza od Seraphine - nie data). Stoi tu wiec pusty pokoj z tym jednym znaczeniem.

    Podsluch tej sali NIE jest uzgodniony z nikim i pozostaje odlozony przez samego
    Lucana do

    dwoch ulepszen zuka (lead_council_room_beetle_deferred) - a jedno z tych ulepszen,
    ucho

    prostoskrzydlego, zostalo wykonane w t_176. Drugie, maskowanie, nie.


    8. STAN. Czwarty dzien interludium, 05:50, sala narad na gornym pietrze gildii.
    Energia

    14,35/15, integralnosc 19/19, bez warunkow. Zegary bez ruchu. Zaden termin nie
    powstal.

    Trzy pajaki na zaulkach, +3,0 do nadwyzki sieci, dwa czujniki przeszukania zdjete.

    Poranek nadal ma dwie wlasne rzeczy: targ po introligatora i pierwszy trening
    z Mara.'
  new_decision: 'Lucan stoi w pustej sali narad, w ktorej za trzynascie dni beda go
    pytali, i nikt mu tego nie zabronil. Zuk z gotowym uchem siedzi w jego kieszeni,
    brakuje mu tylko maskowania - a godzina przy stole, ktora je zalatwia, lezy w
    baszcie, trzy kwadranse marszu stad. Poranek ma juz dwie wlasne rzeczy: targ po
    introligatora i pierwszy trening z Mara.'
