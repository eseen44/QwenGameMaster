          note: 'OBNIZONE Z 0,75 NA 0,25 PRZEZ retcon_000196 - koniec podwojnego liczenia.
            0,25 na godzine to 6,0 na dobe i jest to WYLACZNIE wlasna regeneracja
            Lucana (retcon_000045). Dawne 0,50/h, czyli 12,0 na dobe, opisane bylo
            jako DOWOZ Z SIECI - czyli ta sama energia, ktora rejestr liczyl juz jako
            nadwyzke wezlow. Liczba pochodzila z retcon_000141, kiedy siec generowala
            16,5, i nie byla nigdy przeliczona. DOWOZ Z SIECI ISTNIEJE DALEJ, ale
            jako POZYCJA KASKADY, nie jako drugi wpis w tym polu: surplus sieci wypelnia
            growth od gory - Lucan, zakotwiczone, reszta - a przydzial Lucana idzie
            NAJPIERW w rezerwe do sufitu 15, potem w bank (retcon_000141, kolejnosc
            bez zmian). Model w calosci: growth-banks.yaml#energy_model. Rachunek
            na zadanie: python tools/energy_pl.py.'
