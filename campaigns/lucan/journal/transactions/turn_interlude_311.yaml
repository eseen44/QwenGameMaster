outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PIERWSZA TURA POD RETCON_000198. Wiadomosc gracza miala dwa czlony i narrator
    rozdziela je tak, jak regula kaze: kwestia do Borosa i Mary jest WYPOWIEDZIA -
    slysza ja i reaguja na nia - a ture realizuje CZYN, czyli zejscie z Varkhenem.
    Pomiar tla dla Seraphine zostaje tym, czym gracz go uczynil: zdaniem powiedzianym
    dwojgu ludziom. Narrator NIE rozstrzyga, czy Lucan zamierza go wykonac, i nie
    nalicza za niego ani czasu, ani energii. NIKT NIE DOPYTUJE, I KAZDE Z NICH Z INNEGO
    POWODU. Boros po prostu robi - jego kontrakt mowi, ze cudzego pomyslu nie rozbiera
    na czesci, i pada jedno slowo o miejscu, bo piwnice za garbarnia zna od Aktu 1.
    Mara nie pyta, dokad ani po co: jej blind_spot mowi, ze zamiast nazwac troske
    podaje rzecz do zrobienia. Podaje wiec lampe. To NIE JEST ZEGAR - lampa pali sie
    tyle, ile ma oleju, i zaden plik nie robi z tego terminu ani zagrozenia (retcon_000015,
    retcon_000055). VARKHEN DOSTAJE ODPOWIEDZ NA SWOJE PYTANIE I NIE JEST NIA SLOWO.
    W t_310 zapytal "Idziesz tam?" i odpowiedzi nie dostal. Teraz Lucan staje nad
    sarkofagiem osobiscie - to jest cala odpowiedz i Varkhen tak ja czyta. Zgodnie
    z voice_contract#body ("kiedy sie zgadza, kiwa raz", t_250) i #emotion (wdziecznosci
    nie mowi, wykonuje) NIE dostaje przemowy, ulgi ani planu. POZOR SNU WYGASA SAM,
    BEZ CEREMONII. t_263 byl PROSBA, nie przysiega, a proszono o udawanie przed ludzmi.
    Ludzie wlasnie odjechali. Narrator nie robi z tego ani sceny wyzwolenia, ani zlamania
    ukladu. JEGO CIALO JEST TAKIE, JAKIE JEST W PLIKU, i tura tego nie pomija: integrity
    11,7 z 65, condition_severely_depleted. Chodzi, bo chodzil juz w t_250 i t_261,
    ale to jest wrak, ktory chodzi. W t_262 sam powiedzial przy zasypie "nie tej nocy"
    o WLASNYCH silach - zasyp jest dzis przekopany, wiec przejscie go nie kosztuje,
    i narrator nie dokłada mu ani cudownej poprawy, ani nowego zalamania. DROGA JEST
    JEGO I TURA TO POKAZUJE BEZ KOMENTARZA: osuwisko, ktorym go stad wyniesiono (connection_varkhen_collapse,
    t_259), potem komora grobowa, potem czterdziesci stopni, potem hala, o ktorej
    wczoraj powiedzial "to moja droga". Emocja przez to, na co patrzy - nic wiecej.
    CZEGO NARRATOR NIE ZROBIL: nie postawil nikogo na rampie, nie odegral watpliwosci
    Mary jako podejrzenia, nie kazal Lucanowi tlumaczyc sie z niczego i nie ruszyl
    ekipy z powrotem. Tkacz zostaje na rampie z pelnym czuciem obszaru, Spidey na
    ramieniu Lucana. KOSZT: zero energii. Marsz nie jest magia, a zaden skan nie zostal
    zadeklarowany. CZAS 1200 s: pozegnanie przy wozie, zejscie rampa do komory Varkhena,
    podniesienie go i zejscie ta sama trasa, ktora mierzyla 1500 s w obie strony w
    t_309.'
  prose: 'Boros nawet się nie prostuje. Bierze dwa worki, kładzie je na wozie tam,
    gdzie leżą równo,

    i mówi jedno słowo, bo jedno wystarcza:


    — Do piwnicy.


    Zna tamto miejsce. Wywoził stamtąd kiedyś cudze papiery i nikt go o to nigdy nie
    zapytał.


    Mara wchodzi na kozioł, zbiera lejce i patrzy na Lucana dłużej, niż wypada, tak
    jak patrzy

    zawsze. Nie pyta, dokąd. Nie pyta, po co.


    — Lampa ci starczy na trzy godziny — mówi. — Licz od teraz.


    Wóz rusza. Koło wpada w koleinę przy rampie, potem drugie, potem dźwięk się wyrównuje

    i cichnie w stronę muru, a Lucan stoi i słucha go, aż przestaje być słyszalny
    — dokładnie

    tak, jak słuchał dziś rano, kiedy Spidey odchodził w ciemność.


    Zostaje rampa, Tkacz przy niej i cisza, która jest większa, niż była przez całą
    noc.


    Potem Lucan schodzi.


    Nie tą drogą, którą nosili worki, bo ta prowadzi do hali. Tą, która prowadzi do
    komory.


    Sarkofag stoi otwarty, tak jak stał przez pięć dni. Varkhen leży w nim płasko,
    ręce wzdłuż

    ciała, powieki uchylone na tyle, żeby patrzeć — bo o tyle go poproszono i tyle
    robi od pięciu

    dni, z własnej woli, dlatego że ktoś poprosił.


    Lucan staje nad nim.


    Nic nie mówi. Nie musi — wczoraj przez linię padło pytanie i nie padła odpowiedź,
    a teraz

    odpowiedź stoi nad sarkofagiem z lampą w ręce i pająkiem na ramieniu.


    Varkhen patrzy na niego jedną chwilę dłużej, niż trzeba, żeby zrozumieć.


    Potem kiwa raz.


    I wstaje — a to trwa, i wygląda dokładnie na to, czym jest. Jedenaście z sześćdziesięciu

    pięciu to nie jest strażnik. To jest rzecz, która pamięta, jak się było strażnikiem,
    i robi

    to z pamięci, staw po stawie. Płaszcz ma na sobie od trzech dni. Prostuje się
    do swoich dwóch

    metrów dwudziestu i pod tym sufitem musi trzymać głowę pochyloną.


    Idą.


    Osuwisko przechodzą bez słowa. To jest ta sama dziura, przez którą wynoszono go
    stąd jako

    ciało, i przekopana dziś rano przez Borosa na tyle, żeby przeszło troje ludzi
    z workami —

    więc i on przechodzi, bokiem, bez wysiłku, o który jeszcze wczoraj sam siebie
    podejrzewał.


    Zatrzymuje się dopiero w komorze grobowej.


    Stoi tam, gdzie jedenaście płyt leży opartych o ścianę, i patrzy na nie. Nie mówi
    nic

    i Lucan go o nic nie pyta.


    Potem czterdzieści stopni w dół.


    I hala.


    Varkhen wychodzi na jej podłogę, staje na wytartym pasie, który biegnie środkiem,
    i przez

    moment stoi na nim bez ruchu, jak człowiek, który stanął na własnym śladzie.


    Lampa nie sięga ani sufitu, ani końca.

    '
