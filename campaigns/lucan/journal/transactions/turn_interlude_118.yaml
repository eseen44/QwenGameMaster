  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii, kilka drobnych z kieszeni. 1. KWIATY SA I NIKT SIE NIE ZDZIWIL.
    Sklepik gildii przy recepcji trzyma je z tego samego powodu, z ktorego trzyma
    bandaze i olej - bo czlonkowie tej gildii regularnie potrzebuja czegos, co sie
    zanosi. Na pogrzeb, do rodziny po tym, kto nie wrocil, albo pod drzwi, ktore sie
    samemu zatrzasnelo. Lucan dostaje pek zywy, nie zaloby - i placi bez targu. 2.
    ZART PADL I ZOSTAL ZROZUMIANY INACZEJ, NIZ LUCAN GO POWIEDZIAL. Na "beda mi potrzebne,
    zeby przezyc" czlowiek za lada nie mrugnal - u nich to zdanie znaczy tyle, co
    "wracam do domu po tygodniu, ktorego nie umiem wytlumaczyc". Zaden z niego swiadek
    czegokolwiek. 3. ALE SWIADKIEM JEST WIECZOR W GILDII. Recepcja obsadzona, w kilku
    oknach swiatlo, a Lucan idzie po schodach na gore z kwiatami, do biura kontrolerki
    antymagicznej, ktora go oslania. To nie jest incydent i nie idzie do zadnego rejestru
    - to idzie do rozmowy przy stole, a plotka o oficerze gildii i jej podopiecznym
    ma wlasna wage, kiedy za dwa tygodnie kierownictwo pyta, czyim glosem Seraphine
    mowi. Nikt nie powiedzial nic. Kilka osob podnioslo glowe. 4. GORNE BIURA O ZMIERZCHU
    SA PUSTE POZA JEDNYMI DRZWIAMI. Pod nimi szpara swiatla. Lucan puka - niesmialo,
    ciszej niz trzeba - i wchodzi, nie czekajac na pelna odpowiedz. 5. SERAPHINE JEST
    ZA BIURKIEM I NIE PRACUJE NAD SWOJA ROBOTA. Na blacie akta gildii i tygodniowe
    formalne zadania sluzb miejskich - to, co sama zapowiedziala: porownanie pieczeci
    i klasy podpisu z glejtu z wlasnymi aktami, bez ekspozycji Lucana (event_turn_interlude_036).
    Robi to wieczorem, sama, w budynku, w ktorym kazdy inny juz poszedl. Podnosi wzrok
    na pukanie i przez jedna sekunde ma twarz czlowieka, ktory spodziewal sie zlej
    wiadomosci. 6. POTEM WIDZI KWIATY I TA SEKUNDA SIE KONCZY. Nie wstaje, nie dziekuje,
    nie robi z tego sceny. Odsuwa akta na bok blatu - grzbietem dloni, zeby zrobic
    miejsce - i mowi mu, zeby usiadl. Zaraz potem mowi druga rzecz, bo jest soba:
    ze czlowiek, ktory przychodzi sam, wieczorem, z wlasnej woli i z czyms w rekach,
    przychodzi zaplacic z gory za cos, o co dopiero zamierza poprosic. I ze sluchа.
    7. WORLD MOVE - ONA MA WLASNE PIERWSZE PYTANIE I NIE ODDAJE GO ZA DARMO. Jej agenda
    od dni brzmi tak samo: reszta nieujawnionej listy PRZED przesluchaniem (npc_seraphine_vale.agenda).
    Nie zaczyna od niej. Zaczyna od tego, gdzie Lucan byl caly dzien - bo wie, ze
    mial spotkanie z Boros i Mara w sprawie pieniedzy, i patrzy na plaszcz, ktory
    wisi ciezej, niz wisial rano. 8. STAN. 18:10 dnia trzeciego, gorne biura gildii,
    drzwi zamkniete, tylko oni dwoje. Energia 7.8 z 15, integralnosc 19 z 19, bez
    warunkow. Przy Lucanie 4 000 srebra w zlocie, przepustka syndykatu w tej samej
    kieszeni, Spidey przy zebrach - nieodkryty i milczacy. Nieudzielone: kanal ostrzegawczy
    dla syndykatu, odpowiedz dla Kesza, wspolna wersja dla gildii, i teraz takze -
    ile z dzisiejszego dnia Seraphine uslyszy.'
  new_decision: Seraphine pyta, gdzie Lucan byl caly dzien, i patrzy na jego plaszcz.
    Ile jej powiedziec - i od czego zaczac.
