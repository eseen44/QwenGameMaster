  summary: 'Bez testu - rozmowa, szesc minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Trzy ruchy: zarzut o grabarza rozbrojony, przedmiot dokumentu

    przemianowany, granica postawiona bez duszy.

    1. NOWY KANON SWIATA PODANY PRZEZ GRACZA - GRABARZE W LUMARII. Nie sa poczciwymi

    poslugaczami; to glownie drobni kryminalisci i alkoholicy, tani do kupienia, przez

    nikogo nie lubiani, nie dbajacy o opinie. Zaden plik temu nie przeczy; przyjete
    jako

    kanon. Skutek natychmiastowy: zarzut Neris dotyczyl UTRATY REPUTACJI, a czlowiek
    bez

    reputacji nie ma czego stracic. Ona nie ma na to odpowiedzi, bo argumentowala
    z

    wlasnego swiezego doswiadczenia bycia nazwiskiem w cudzym dokumencie, a grabarz
    nie

    jest nia.

    2. EKSPOZYCJA, KTOREJ NIKT W POKOJU NIE NAZWAL - DO ZAPAMIETANIA, NIE DO WYPOWIEDZENIA

    PRZEZ NPC. Swiadek kupiony tanio jest swiadkiem, ktorego mozna kupic drugi raz,
    a

    drobny kryminalista jest czlowiekiem, na ktorego straz miejska ma juz teczke.
    To jest

    dokladnie ta os zagrozen, na ktorej stoi kampania - instytucjonalna i informacyjna

    (retcon_000015). Ani ojciec (polityka go nie interesuje), ani Neris (nie jej dziedzina)

    nie sa wlasciwymi ustami dla tej uwagi; nie wkladac jej im w usta.

    3. PRZEMIANOWANIE JEST NAJMOCNIEJSZYM RUCHEM TEJ TURY I OJCIEC CHWYTA JE JAKO
    SWOJE.

    "Tendencyjna nazwa" to jego gatunek pretensji. Przyjmuje bez sporu, ze przedmiotem

    pomiaru sa pozostalosci zycia albo produkty metabolizmu energii zyciowej, i mowi,
    ze

    nazwa "energia smierci" zaklada wniosek w przeslance, czyli jest bledem

    metodologicznym, nie tylko politycznym.

    4. I MA TO SKUTEK JURYSDYKCYJNY, KTORY OJCIEC PODAJE JAKO SZCZEGOL KANCELARYJNY.

    Dokument o metabolizmie jest praca BIOLOGICZNA. Kosciol nie ma legitymacji w pracy

    biologicznej - jego kryterium (necromancy-law#construct_boundary.church_position:

    uzycie energii smierci, martwa tkanka, profanacja, skazenie duchowe) potrzebuje

    przedmiotu opisanego jego wlasnym jezykiem. Odebranie nazwy odbiera podstawe

    wystapienia. Ojciec traktuje to jak wybor naglowka.

    5. OSTRZEZENIE, KTORE NIE WYBUCHLO. Opisujac przemianowany przedmiot ojciec dochodzi
    do

    krawedzi slowa, ktore ZNA - Lucan powiedzial mu wprost w t_019, ze Spideya porusza

    czyste vitae. Zaczyna zdanie o tym, ze to jest przeciez ta sama rzecz, ktora poruszala

    jego pajaka, i NIE PRZYPOMINA SOBIE NAZWY, bo gubi nazwy, a pamieta problemy i
    papier.

    Slowo nie padlo. Zapalnik jest naladowany i lezy na wierzchu; kazda kolejna tura
    w tym

    temacie moze go odpalic. Ograniczenie z objectives ("nie mowic vitae przy nikim
    w

    stule") nadal formalnie nienaruszone.

    6. ALE NERIS DOSTALA POJECIE BEZ TERMINU. Opis "pozostalosci zycia, produkty

    metabolizmu energii zyciowej" jest opisem vitae we wszystkim poza nazwa, podany
    przy

    osobie magicznie pismiennej, ktora napisala wlasny tekst o granicy konstruktu.
    Flaga

    forbidden_without_event.the_word_vitae dotyczy SLOWA i nadal obowiazuje; zapisac

    natomiast, ze koncepcja przeszla.

    7. GRANICA BEZ DUSZY - OJCIEC PODAJE KSIEGOWOSC, NIE ONTOLOGIE. Nie broni duszy
    i nie

    jest nia zainteresowany: nie umie jej zmierzyc, wiec nie jest jego. Jego granica
    ma

    trzy przypadki i jedno pytanie - skad to bierze to, czego uzywa, i czy rachunek

    domyka sie bez ciebie. (a) Bierze z zewnatrz samo i przetwarza samo - zywe. (b)
    TY

    placisz, a jak przestaniesz placic, staje - konstrukt albo golem, i to jest legalne,

    bo golemy sa legalne. (c) Domyka rachunek samo, ale z czegos, czego nie umiesz

    zaksiegowac - i TU ludzie mowia dusza, a on w tym miejscu przestaje mowic, bo
    nie ma

    przyrzadu.

    8. LUCAN ROZPOZNAJE PRZYPADEK TRZECI, NIKT INNY W POKOJU NIE. Wlasna rezerwa Varkhena

    jest starozytna i samopodtrzymujaca sie; upkeep z sieci sieciarzy idzie na NAPRAWE,
    nie

    na zasilanie (state/sustained-links.yaml, purpose: slow_distributed_repair). Ojciec

    wlasnie zdefiniowal kategorie, w ktorej Varkhen stoi jako jedyny znany Lucanowi
    okaz -

    i ktora sam uznal za niemierzalna. Klasyfikacja pajakow zostala rozwiazana; Varkhen

    wpadl do kosza, ktorego nie da sie otworzyc.

    9. WORLD MOVE - NERIS ODBIJA "BEZ DUSZ" ZARZUTEM, NIE ZGODA (constraint

    retcon_000039). Nie broni duszy jako bytu; broni jej jako JEDYNEGO POWODU, DLA
    KTOREGO

    PRAWO SIE TYM ZAJMUJE. Kosciol nie pali za nieregularnosc metaboliczna - pali
    za

    profanacje i za zwiazana osobe. Zdjecie duszy z definicji daje kryterium, ktore

    klasyfikuje piesknie i nie chroni NIKOGO, bo przestaje odpowiadac na zarzut, ktory

    faktycznie zostanie postawiony. To trzecie uderzenie w jej fundament w ciagu godziny
    i

    pierwsze, na ktore odpowiada natychmiast, bez przyznawania racji.

    10. PIORO NADAL NIE RUSZYLO SIE Z MIEJSCA. Pytanie "mam to zapisac" z t_157 nie

    dostalo odpowiedzi i wisi, a ojciec zaczyna dyktowac naglowek dokumentu. Neris
    go nie

    zapisuje.

    11. CZEGO NIE PADLO. Trzecia substancja (lichen_speculans) nadal nie wymieniona
    w

    swiecie. Sygnatura podrecznika nieudzielona. Wpis do rejestru zaopatrzenia niezlozony.

    Nikt nie zapytal, po co Lucanowi okazy, ktorych nie pokazuje - czwarte potwierdzenie

    bez pytania. Ojciec nadal nie wie o nekromancji, sieci, Varkhenie, syndykacie
    ani o

    slowie wabik.

    12. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:18. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: grabarze w Lumarii to element

    polswiatka, tani i bez reputacji; przedmiot dokumentu przemianowany na pozostalosci
    i

    metabolizm energii zyciowej, co czyni z niego prace biologiczna poza jurysdykcja

    Kosciola; ojciec doszedl do krawedzi slowa vitae i nie przypomnial go sobie; granica

    ojca to trzy przypadki ksiegowe, przypadek trzeci nazwany niemierzalnym; Neris
    broni

    duszy jako podstawy legitymacji prawnej, nie jako bytu; pioro nadal nie pisze.

    '
