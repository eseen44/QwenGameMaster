outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'NIC SIE NIE DZIEJE I TO JEST PELNA, UCZCIWA ODPOWIEDZ. Gracz zaprojektowal
    najtanszy mozliwy test i wykonal go poprawnie: plyta bez znakow, przy wejsciu,
    z radarem w trakcie. Zaden plik nie stawia tu mechanizmu, klatwy ani strazy -
    Mara powiedziala w t_292 wprost, ze to grobowiec, nie skarbiec. Narratorowi NIE
    WOLNO dorobic konsekwencji, zeby tura miala komplikacje (retcon_000015, retcon_000033,
    retcon_000055) i tego nie robi. GEO W TRAKCIE, kanal czysty (procedura stala z
    t_289 - Spidey odeslany). Kamien nie drgnal poza tym, co odrywali sami; sygnatury
    nie zmienily sie ani przed zdjeciem plyty, ani po. Otwarty grob czyta sie dokladnie
    tak samo jak zamkniety. CO W NISZY: najubozsza wersja, zgodna z gradientem, ktory
    Mara nazwala w t_292 - plyty przy wejsciu proste, dalej bogatsze. Kosci, prochy
    tkaniny, jedno naczynie z gliny bez polewy. ZERO METALU. Generowane wedle zasady
    z 13.09.2026: najtansza i najmniej dramatyczna wersja, ktora domyka luke. DRUGA,
    NIEZALEZNA LINIA DOWODU NA WIEK. W t_291 Lucan datowal to miejsce z muru (practical_masonry).
    Teraz dostaje to samo z ciala: stan kosci i sposob ulozenia. Ma do tego pokrycie
    w progression#learning_foundation - anatomia i biologia sa wprost wymienione jako
    przyspieszane dziedziny. Dwie niezalezne przeslanki daja ten sam wniosek i dlatego
    jest on mocniejszy niz kazda z osobna. NADAL nie jest to data - Lucan nie jest
    historykiem i zaden plik nie daje mu chronologii Lumarii. CZEGO NIE ROZSTRZYGAM:
    co lezy w plytach dalszych i bogatszych; czyje to groby; co znaczy uklad rak.
    Nie robie z tego tajemnicy ani zapowiedzi - po prostu nikt tego jeszcze nie wie.
    KOSZT: 0,1 jednostki, 14,7 -> 14,6.'
  prose: 'Płyta schodzi ciężko i to jest jedyna trudność, jaką stawia.


    Boros wchodzi drągiem w spoinę u dołu, podważa raz, drugi, trzeci — kamień ustępuje

    z chrupnięciem starej zaprawy — a potem bierze ją oburącz i odstawia na podłogę
    oparta

    o półkę, zamiast pozwolić jej upaść. Robi to bez komentarza i bez żadnego powodu,
    który

    by wypowiedział.


    Lucan trzyma dłoń na murze przez cały ten czas.


    I nie dzieje się nic.


    Kamień nie drga nigdzie poza tym miejscem, w którym właśnie go ruszyli. Sygnatury
    nie

    przesuwają się ani o włos — ani kiedy drąg wchodzi w spoinę, ani kiedy płyta wychodzi,

    ani potem. Otwarty grób czyta się dokładnie tak samo jak zamknięty. To, co leży
    w niszy

    obok, leży dalej tak samo płasko.


    Żadnego dźwięku poza ich własnym. Żadnego ruchu powietrza poza tym, który idzie
    tędy od

    lat. Nic.


    Mara podaje lampę bliżej.


    W środku leży człowiek i leży tam bardzo długo. Kości są suche i lekkie, koloru
    starego

    papieru, a w miejscach, gdzie dotykają kamienia, zrosły się z nim osadem. Tkanina,
    w którą

    go zawinięto, jest już tylko ciemniejszą warstwą pyłu o kształcie ciała. Przy
    głowie stoi

    jedno naczynie z gliny, bez polewy, bez zdobienia, wielkości dwóch pięści.


    Poza tym nie ma nic. Ani obrączki, ani sprzączki, ani gwoździa.


    — No i masz — mówi Boros. Bez rozczarowania, jak człowiek odczytujący wagę. —
    Biedny.


    Lucan kuca przy niszy dłużej niż tamci dwoje i patrzy na coś innego niż oni.


    Ręce są ułożone. Nie splecione na piersi, nie wzdłuż ciała — wyprostowane po bokach,

    dłońmi do góry, obie tak samo. Ktoś je tam położył celowo i ktoś położył je tak
    samo

    wszystkim, bo w następnej niszy przez szparę widać dokładnie ten sam kształt.


    I kość jest w stanie, którego nie osiąga się przez sto lat ani przez dwieście.


    Mur mówił to samo cztery godziny temu. Teraz mówi to ciało, a to są dwie różne
    rzeczy

    mówiące jedno.


    — Więc? — pyta Mara.


    — Więc nic nam nie zrobili — mówi Lucan, prostując się. — I nie zrobią.

    '
