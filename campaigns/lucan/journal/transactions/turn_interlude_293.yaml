  new_decision: 'Komora grobowa, 16:32, dzien piaty. PIERWSZA PLYTA OTWARTA I NIC
    SIE NIE STALO - ani przy podwazaniu, ani po. Geo prowadzone w trakcie nie zlapalo
    zadnej zmiany: otwarty grob czyta sie tak samo jak zamkniety. TEST GRACZA DAL
    WYNIK NEGATYWNY W DOBRYM ZNACZENIU i od tej chwili wiadomo, ze rozbijanie tutaj
    niczego nie budzi. Zaden zegar nie ruszyl. W NISZY: kosci bardzo stare, suche,
    miejscami zrosniete z kamieniem osadem; prochy tkaniny w ksztalcie ciala; jedno
    naczynie gliniane bez polewy przy glowie. ZERO METALU - potwierdza gradient Mary
    z t_292, wiec bogatsze rzeczy sa w plytach dalszych i lepiej cietych. DWIE NIEZALEZNE
    PRZESLANKI NA WIEK: mur z t_291 i teraz stan kosci. Obie mowia, ze miejsce jest
    duzo starsze niz cmentarz nad nim. To nadal NIE JEST data. SZCZEGOL, KTOREGO NIKT
    NIE WYJASNIL: rece ulozone wyprostowane po bokach, DLONMI DO GORY, i tak samo
    w niszy obok. Uklad celowy, powtarzalny. Co znaczy - NIEUSTALONE i narrator nie
    robi z tego ani tajemnicy, ani zapowiedzi. OTWARTE: czy ida do bogatszych plyt,
    czy w glab za daleki koniec komory, czy szukaja drugiego wejscia. Osiem workow
    nadal pustych. Rezerwa 14,6/15.'
