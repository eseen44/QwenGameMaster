outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'OJCIEC PODANY JAKO EKSPERT. Seraphine nie recytuje jego profilu z karty
    (nie zna go), robi to, co jest jej rejestrem: liczy glowy i instytucje. "Nikt
    nie wie" padlo kilka zdan wczesniej, wiec nazywa, co sie wlasnie zmienilo - i
    to jest obserwacja, nie zarzut ani warunek. OBIE INSCENIZACJE ODRZUCONE OPERACYJNIE,
    BEZ MORALIZOWANIA (karta zabrania wprost oburzenia na oportunizm Lucana). Powod
    nazwany jej wlasnymi priorytetami: podpalenie kaplicy wprowadza KOSCIOL, nowy
    trup wprowadza STRAZ i sledztwo - czyli te dwie instytucje, przed ktorymi go oslania
    i przy ktorych jej wspolwina jest najdrozsza. PODSTAWA PRZYJETA: zabezpieczenie
    osypujacych sie dowodow wystarcza i sama mowi, co pod tym podpisze. DO TEGO ROZWIAZANIE
    PROSTSZE, WYNIKAJACE Z GEOMETRII, A NIE Z PRZENIKLIWOSCI PONAD GRACZA: korek lezy
    pod ziemia, za stara brama, a do komory wchodzi sie gotowym otworem po osuwisku
    (feature_ropes - lina z nocy wydobycia nadal wisi), wiec NIKT NIE MUSI ROZKOPYWAC
    POSWIECONEJ POWIERZCHNI i sprawa Kosciola w ogole nie wstaje. ZERO ZEGARA: zaden
    plik nie stawia wezwania, godziny policyjnej ani patrolu; narrator zadnego nie
    dodal. Kiedy i z kim - decyzja gracza. Tura rozmowna, bez kosztow i ruchu.'
  prose: '- Tata.


    Seraphine milczy przez moment dłuższy, niż milczała przy czymkolwiek dzisiaj.


    - Kwadrans temu nikt nie wiedział - mówi w końcu. - Teraz wie twój ojciec, w Akademii,

    w tygodniu, w którym Akademia szykuje sobie dysputę o klasyfikacji. Nie mówię,
    żebyś

    tego nie robił. Mówię, żebyś wiedział, że to policzyłam.


    Potem dwie propozycje Lucana, jedna po drugiej, i przy obu nie zmienia tonu ani
    na

    jotę.


    - Podpalenie kaplicy sprowadza na cmentarz Kościół. Nie straż, nie magistrat -

    Kościół, z własnym dochodzeniem, na swojej ziemi, w miejscu, w którym leży twój

    nieumarły. - Odkłada ręce płasko na blacie. - A nowy trup sprowadza straż i śledztwo,

    i pierwszym człowiekiem, o którego zapytają, będziesz ty, bo już raz o ciebie
    pytali.

    Obie te rzeczy kupują mi dokładnie to, czego przez pół roku unikam.


    Dopiero teraz sięga po czysty arkusz.


    - Twój pierwszy powód wystarczy. Grunt pod cmentarzem jest sitem i sam to zmierzyłeś,

    a gildia zamykała tam robotę ekipą A - mogę napisać, że zabezpieczamy to, co ekipa

    zostawiła, zanim się osunie. Pod tym się podpiszę.


    Pisze dwie linijki i podnosi pióro.


    - I jeszcze jedno, bo to jest darmowe: nikt nie będzie kopał na powierzchni. Wasz

    korek leży pod ziemią, a dziura po osuwisku już jest i wisi w niej lina. Schodzimy

    tamtędy i Kościół nie ma o co zapytać, bo nic nie ruszyliśmy na wierzchu.

    '
  apply_required_costs: true
