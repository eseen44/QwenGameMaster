    potrzebuje czegos "bardziej z jajem" - i rzuca dwie propozycje INSCENIZACJI: ktos
    podpalajacy kaplice, zeby zatrzec slady, albo nowy trup na cmentarzu.'
  actor_id: pc_lucan
  scope: execution
  stakes: 'OJCIEC ZE STANU: npc_lucan_father, akademik w loc_lumaria_magical_academy,
    threat_scope "catastrophic_research_without_malice", ciepły, roztargniony, apolityczny,
    99% zycia w laboratorium. Seraphine nie zna jego profilu z karty i nie wolno jej
    go recytowac; wolno jej natomiast policzyc GLOWY i zauwazyc instytucje, bo to
    jest jej rejestr, a "nikt nie wie" padlo pare zdan wczesniej. DWIE PROPOZYCJE
    INSCENIZACJI - JEJ REAKCJA MA BYC OPERACYJNA, NIE MORALNA. Karta zabrania wprost
    oburzenia moralnego na oportunizm Lucana (do_not_play). Ocenia wiec skutki: podpalenie
    kaplicy wprowadza KOSCIOL, a nowy trup na cmentarzu wprowadza STRAZ i sledztwo
    - czyli dokladnie te dwie instytucje, przed ktorymi go oslania, i przy ktorych
    jej wlasna wspolwina jest najdrozsza. To nie jest zakaz wymyslony przez narratora,
    tylko jej priorytety z karty w kolejnosci: pozycja, nierozlupanie na Varkhenie,
    pieczecie i miasto. PODSTAWA NA PAPIERZE: sama zapytala o nia w t_266 i t_267
    i jest to waluta, ktora kontroluje. GEOMETRIA POZWALA JEJ ZROBIC RZECZ PROSTSZA,
    I TO JEST JEJ KOMPETENCJA, NIE PRZENIKLIWOSC PONAD GRACZA: korek lezy POD ZIEMIA,
    za stara brama w komorze Varkhena, a do komory wchodzi sie gotowym otworem po
    osuwisku (feature_ropes, lina z nocy wydobycia nadal wisi) - wiec nikt nie musi
    rozkopywac poswieconej powierzchni. ZERO ZEGARA I ZERO TERMINU: zaden plik nie
    stawia ani wezwania, ani godziny policyjnej, ani patrolu. Decyzja o tym, kiedy
    i z kim, nalezy do gracza.'
