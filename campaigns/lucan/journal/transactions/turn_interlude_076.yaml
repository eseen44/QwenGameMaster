  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - metoda znana, material swiezy, nikt nie przeszkadza. Cztery
    gatunki, cztery ozywienia, cztery rozne odpowiedzi na pytanie "do czego to jest".
    Nowa grupa: companion_spy_series_01 (spy_cellar_spider_01, spy_wasp_01, spy_centipede_01,
    spy_beetle_01), zadne nie zakotwiczone, komunikacja minimal_status. 1. PAJAK PIWNICZNY
    - STALY OBSERWATOR. Wchodzi w kazda szczeline, stoi nieruchomo dniami, umie rozsnuc
    rzadka siec jak sieciarze, sylwetke ma tak nudna, ze nikt nie podnosi wzroku.
    Prawie slepy - czuje drgania i ruch powietrza, nie obraz. Konczy go miotla. To
    jest gotowy pajak alarmowy do gabinetu Seraphine, dokladnie ta funkcja, ktora
    obiecal. 2. OSA - KURIER, I TO ONA JEST ODKRYCIEM. Jedyna, ktora LATA, czyli jedyna,
    ktora zamyka odleglosc. Skoro strata rosnie z dystansem, to odpowiedzia na straty
    przesylowe nie jest szersza rura, a KURIER - osa, ktora fizycznie doleci do Spideya
    albo do Lucana, zamienia lacze zdalne z narastajaca strata na lacze bliskiego
    zasiegu. Cena: skrzydla konczy pierwsze twarde uderzenie, brzeczy wiec sciaga
    na siebie przemoc, a na zamknietym posterunku glodnieje, bo nie ma na czym polowac.
    3. STONOGA - INFILTRACJA. Plaska i szybka, chodzi w pustkach scian, pod podlogami
    i w odplywach; jedyna z czworki, ktora wejdzie do zamknietego pokoju z zewnatrz.
    Czuje calym cialem, ze wzroku nie ma zadnego uzytku. Widziana nie wywoluje ciekawosci,
    tylko natychmiastowa eksterminacje, a w ruchu jest bezdyskusyjnie biologiczna
    - najgorszy mozliwy kandydat na cokolwiek, co ma udawac mechanizm. 4. CHRZASZCZ
    - NOSNIK I MARTWA SKRZYNKA. Opancerzony na tyle, ze przezyje kieszen, worek i
    przenoszenie; uniesie duzo na swoja skale; da sie go przewiezc jak przedmiot,
    w sloiku, bez wzbudzania pytania. Powolny, slabo trzyma sie gladkich powierzchni
    i kilka po kamieniu. 5. WSPOLNE - PRZEPUSTOWOSC I DOJRZALOSC. Cztery ciala poruszaja
    sie w tej chwili z przepustowoscia informacyjna JEDNEGO: Lucan jest jedynym odbiornikiem
    i uwage daje jednemu naraz, pozostale zyja i nie raportuja. Wszystkie sa swieze,
    wiec posluszne i tepe - idealne dla linii wabika, bezuzyteczne tam, gdzie potrzebny
    jest sad. Zbiornik 3 przy ubytku 1 na dobe daje trzydniowa smycz: okaz na posterunku,
    ktory nie ma na czym polowac, konczy sie sam. 6. WASKIE GARDLO PRODUKCJI SERYJNEJ
    OKAZALO SIE ODCZYNNIKIEM, NIE ENERGIA. Cztery ozywienia zjadly ok. 40 procent
    fiolki necromantic_conduction_agent ze schowka. Zostaje material na piec-szesc
    malych okazow. Potem to zakup na targu, a targ otwiera sie rano, a pieniadze sa
    u Borosa przez dwa dni.'
  new_decision: Cztery okazy stoja na blacie, do rana zostaje jeszcze kilka uzytecznych
    cial i ok. 60 procent fiolki. Do rozstrzygniecia - czy Lucan podnosi z tej partii
    wiecej okazow tej samej nocy i jakich, gdzie wysyla lub deponuje te cztery, i
    czy pajak piwniczny idzie do Seraphine juz teraz jako obiecany alarm.
