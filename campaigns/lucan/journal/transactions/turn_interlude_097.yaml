    units: 3.0
  - *id002
  summary: 'Bez testu (system/tests.md#nieograniczona-powtorka-znosi-test). Trzydziesci
    minut, trzy jednostki - najdrozsza procedura w ksiazce i pierwsza, ktora cos naprawde
    robi. 1. DRUGI UDANY PRZEBIEG: PODARUNEK Z USYPIANIEM. Unoszenie piora pod swiatlo
    i wychwalanie go NIE jest ozdoba, tylko oknem roboczym - podarunek to najwolniejsza
    procedura w zbiorze, potrzebuje kilku minut ciaglego kontaktu z przedmiotem, a
    teatralny zachwyt daje dokladnie taki kontakt bez tlumaczenia sie z niego. Lucan
    domyka jedna procedure i tylko jedna (zasada z tury 095) i wreca pioro Ruskowi
    jako narzedzie jego wladzy. Rusk je bierze - z rozwiazanym jezykiem, urazony,
    ale ugloskany, przyjmuje podarunek od czlowieka, ktory wlasnie mu wspolczul. 2.
    CO TO PIORO TERAZ ROBI. Nosnikiem jest przedmiot, wiec efekt dziala BEZ OBECNOSCI
    Lucana i tak dlugo, jak pioro jest w uzyciu. Usypianie to nie czar snu, tylko
    narastajace cisnienie senne przechodzace w sen prawdziwy; cel budzi sie i obwinia
    wino albo dlugi dzien. Halven Rusk jest czlowiekiem, ktorego JEDYNA dzwignia to
    routine_reports_and_procedural_objections. Od tej chwili nie moze napisac raportu,
    nie zasypiajac nad nim - i bedzie o to obwinial siebie. Zero sladu, zero dowodu,
    zero progu karnego (retcon_000028). To nie jest atak. To jest demontaz czlowieka
    przez jego wlasne narzedzie pracy. 3. MAPY - I NIE TE, KTORYCH LUCAN SIE SPODZIEWAL.
    Egzemplarze urzedowe sa poza zasiegiem Ruska od czasu sprawdzenia kompetencji:
    bez samodzielnego podpisu kazde wydanie kontrasygnuje ktos inny, wiec wyciagniecie
    oficjalnej kopii zostawiloby wpis z nazwiskiem. Ale Rusk nie pracuje z egzemplarzem
    urzedowym. Pracuje z WLASNYM, wysluzonym odpisem obchodow, dopisywanym przez lata:
    wloty, ktore zasypano i ktorych nie ma na planie, piwnice prywatne przebite do
    kolektora bez zezwolenia, miejsca, gdzie ciag stoi i gazy siadaja. Ten odpis lezy
    w tym gabinecie. Rusk mowi o nim sam, z duma czlowieka, ktoremu pierwszy raz od
    miesiecy ktos pozwolil opowiedziec o swojej robocie. 4. I TO ODPOWIADA NA PYTANIE
    Z TURY 091. spy_centipede_01 siedzi w ciosanym kamieniu, w stojacym powietrzu,
    bez ciagu i bez wody - Lucan wzial to za czyjas piwnice i mial racje. Wedlug Ruska
    pod dzielnica gildii jest tego kilkanascie: stare piwnice kupieckie przebite do
    kanalu prywatnie, zeby nie placic za wywoz. Nieujete nigdzie oficjalnie. Zeby
    dowiedziec sie ktora, wystarczy odpis ze scianki tego gabinetu. 5. SLEDZTWO -
    ODPOWIEDZ JEST NIEPRZYJEMNA I MA NAZWISKO. Ruski nie wie, kto poprowadzi przesluchanie
    w gildii; to jest pietro nad nim i domena Seraphine. Ale wie doskonale, kto uzgadnia
    akta z garbarni, bo to jego wlasne postepowanie kompetencyjne i ten ktos meczy
    go o zeznania od tygodni: MALEN CORTH, urzednik akt magistratu (npc_malen_corth,
    nowa karta). Corth nikogo nie sciga i nie ma teorii sprawy - uzgadnia daty, obsady
    i podpisy, i dopisuje pytanie wszedzie, gdzie sie nie zgadzaja. Ma pelna obsade
    operacji w garbarni Z NAZWISKAMI, w tym Lucana. 6. DLACZEGO TO JEST GORSZE NIZ
    PRZESLUCHANIE W GILDII. To jest MAGISTRAT, nie gildia. Seraphine nie ma tam jurysdykcji,
    nie osloni tego rota sprzatania ani rejestrem, i nie wiedziala o tym kanale -
    a Lucan wlasnie odkryl, ze jego nazwisko lezy w aktach porzadkowanych przez czlowieka,
    ktorego nie da sie ani sprowokowac, ani przekonac, bo nie ma zdania, tylko rubryki.
    Trzynascie dni. 7. RUSK NIE ZAPAMIETA TEGO JAKO PRZESLUCHANIA. Taka jest wlasnosc
    procedury: badany pamieta mila rozmowe. Zapamieta, ze ktos wreszcie go wysluchal,
    wspolczul mu i dal mu pioro. Jego relacja do Lucana nie poprawia sie - ale scena,
    ktora bedzie pamietal, nie jest ta, ktora sie odbyla. 8. STAN. 10:20 dnia trzeciego.
    Energia 8 z 15 - najwiekszy wydatek interludium, w calosci na klatwy. Integralnosc
    19 z 19, bez warunkow. Dwa udane przebiegi z jedenastu; swiad i zapasc nadal bez
    ani jednego. Boros i Mara nadal dzisiaj.'
  new_decision: Rusk trzyma przeklete pioro i nadal mowi. Jego wlasny odpis kanalow
    lezy w tym pokoju, Malen Corth uzgadnia akta z nazwiskiem Lucana po stronie magistratu,
    a energia zeszla z 14,5 do 8 przed spotkaniem, na ktore Lucan jeszcze nie poszedl.
