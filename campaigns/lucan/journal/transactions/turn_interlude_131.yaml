  - *id002
  new_decision: 'Ona stoi w drzwiach i czeka na jedno zdanie - kim on jest. Cztery
    odpowiedzi sa realne i kazda otwiera inna rozmowe: czlonek Akademii na urlopie
    dziekanskim z katedra i afiliacja (prawda, ktorej nie sprawdzi bez archiwum, i
    ktora czyni ich kolegami); Veyr, czyli nazwisko rodu (dzwignia i kajdany naraz);
    czlonek gildii poszukiwaczy przygod w sprawie klasyfikacji okazu (prawda operacyjna,
    ktora od razu stawia na stole to, po co przyszedl); albo syn profesora Veyra z
    laboratoryjnego (najkrotsza droga do zaufania i jednoczesnie wpuszczenie ojca
    w te rozmowe). Kim jest Lucan w tym progu - i czy mowi jej o okazie od razu, czy
    najpierw o tym, ze ktos stal pod jej drzwiami i nie zapukal?'
