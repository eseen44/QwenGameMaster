outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - dwaj zwykli ludzie bez kart, nieprzygotowani, nieszukajacy
    nikogo, czyli najlepszy mozliwy scenariusz Misnotice (system/curses.md; kalibracja
    19.08.2026). Dziesiec minut, 0.2 jednostki (dwa cantripy po 0.1, wg pomiaru z
    event_turn_interlude_093). Kara za powtarzalny wzorzec z event_turn_interlude_017
    nie obowiazuje - inni ludzie, inne miejsce. 1. ZNIK DZIALA W SWOJEJ NAJLEPSZEJ
    ODMIANIE, BO LUCAN GO NIE PRZECIAZYL. Nie probuje byc niewidzialny w pustym korytarzu
    - USTEPUJE DROGI, czyli daje im dokladnie to zachowanie, ktorego oczekuja od czlowieka
    w przejsciu, a znik odbiera temu zachowaniu zapamietywalnosc. Robotnicy przechodza,
    jeden mruczy podziekowanie w powietrze i po dwoch krokach nie ma w nim nikogo,
    komu dziekowal. 2. WZOREC, KTORY WARTO ZAPISAC: znik polaczony z zachowaniem ZWYCZAJNYM
    jest tanszy i pewniejszy niz znik uzyty zamiast zachowania. Dwa cantripy zamiast
    chowania sie w wnece - i w pyle nie zostaje trzeci slad pod jej drzwiami, tylko
    przejscie jak kazde inne. 3. PUKNIECIE. W srodku glos urywa sie w polowie zdania
    - to nie jest cisza czlowieka, ktory przestal mowic, tylko czlowieka, ktoremu
    ktos przerwal w miejscu, ktore juz raz cwiczyl. Krzeslo, dwa kroki, zasuwa. 4.
    NERIS ALDHEN OTWIERA I MYLI SIE CO DO NIEGO - jak czlowiek, nie jak wyrocznia.
    Widzi w progu kogos, kogo nie zna, w skrzydle, w ktorym nie ma nikogo poza rzemieslnikami,
    i bierze go za kolejnego czlowieka od remontu, ktory przychodzi wiercic w jej
    scianie. Ma te rozmowe za soba wiele razy i wchodzi w nia od razu, bez powitania,
    tonem czlowieka broniacego szesnastu dni, ktorych mu nie zostalo. 5. ZGODNIE Z
    KARTA I Z OPISEM Z BRAMY: drobna, chuda, atrament na palcach i na mankiecie, ciezki
    ciemny plaszcz na oparciu krzesla mimo pogody, wlosy spiete w pospiechu. Za nia
    pokoj w skrzydle, ktorego nikt nie pilnuje, i stos odbitek - ten sam druk, z ktorego
    jedna sztuka lezy w stosach ojca Lucana. 6. POTEM ZAUWAZA, ZE PLASZCZ JEST ZLY
    NA ROBOTNIKA, I POPRAWIA SIE SAMA - bez podejrzenia i bez ostroznosci, ktorej
    ta uczelnia jej nie wyrobila. Pyta wprost, kim jest i w jakiej sprawie, i pyta
    to zniecierpliwiona, nie zaniepokojona. NIE zauwaza dwoch cantripow, ktore padly
    w jej korytarzu przed chwila; klatwa rzucona na kogos INNEGO nie jest domyslnie
    zauwazalna nawet dla magicznie pismiennej osoby (system/curses.md). 7. WORLD MOVE,
    KTORY ROBI ONA, A NIE NARRATOR: nie zaprasza go do srodka. Stoi w drzwiach, na
    wpol zaslaniajac wejscie, z reka na framudze. Nie z lekiem - z rachunkiem czasu.
    Kazda minuta rozmowy w progu jest minuta odjeta od cwiczenia mowy, ktora za szesnascie
    dni rozstrzyga o jej pozycji, i ona to wprost mowi. 8. PYTANIE, KTORE PADA I NA
    KTORE LUCAN MUSI ODPOWIEDZIEC PIERWSZYM ZDANIEM, ZANIM CZEGOKOLWIEK ZAZADA: KIM
    JEST. Nie jest to grzecznosc - to jedyna rzecz, ktorej ona od obcego w tym skrzydle
    potrzebuje, i pyta o to jako pierwsza w calym miescie, ktora zapytala i czeka
    na odpowiedz. 9. STAN. 16:20 dnia trzeciego, prog gabinetu Neris Aldhen w skrzydle
    pod rusztowaniem. Energia 11.8 z 15, integralnosc 19 z 19, bez warunkow. 4 000
    srebra w zlocie i przepustka syndykatu pod plaszczem, Spidey przy zebrach nieodkryty.
    USTALONE: robotnicy przeszli i nie zapamietali nikogo; pierwszy kontakt z Neris
    Aldhen nawiazany; ona nie zna Lucana, wziela go za czlowieka od remontu i sama
    sie poprawila; rozmowa toczy sie W PROGU, nie w pokoju; ona pilnuje szesnastu
    dni.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
    units: 0.2
  - op: set
    instance_id: pc_lucan
    path: position.formation
