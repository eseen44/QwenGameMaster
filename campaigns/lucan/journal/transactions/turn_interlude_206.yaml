  summary: 'Bez testu - interludium, roll_policy disabled. Trzydziesci piec minut,
    zero energii, zero

    wydane. 5 minut odbior skrzynki, 20 minut marszu przez miasto (retcon_000042),
    10 minut

    w izbie od ulicy.


    0. KOREKTA NARRATORA PRZYJETA OD GRACZA, ZANIM TURA RUSZYLA. Narrator dwa razy
    podal

    warunek Seraphine z t_034 ("chce wiedziec, zanim lead zostanie uzyty") jako rachunek

    ciazacy na Lucanie. retcon_000124 mowi wprost, ze jej warunek NIE JEST jego obietnica

    i ze narratorowi nie wolno go tak przedstawiac. Gracz to wylapal. Warunek zostaje
    na

    jej karcie jako jej cena; z tej tury nie wynika zadne zobowiazanie Lucana i nie
    wolno

    z tego robic dlugu.


    1. SKRZYNKA ODEBRANA. item_basic_alchemical_bench przechodzi z

    market_stall_paid_awaiting_collection na carried_in_the_crate. Nic nie zostalo
    zaplacone -

    70 srebra poszlo w t_191, carried_silver stoi na 150 i nie jest ruszane. Sprzet
    NADAL nie

    stoi w celi w piwnicy gildii; retcon_000123 zostaje w mocy, bo Lucan tam po prostu
    nie

    zaszedl. Niesie skrzynke przez miasto i wnosi ja na komende.

    NARRATOR NIE ROBI ZE SKRZYNKI DOWODU ANI ZAGROZENIA - player/inventory.yaml#visibility

    mowi to wprost: szklo alchemiczne u czlowieka z doktoratem z chemii jest szklem

    alchemicznym u czlowieka z doktoratem z chemii (retcon_000055).


    2. LOKACJA ZALOZONA PRZY PIERWSZYM WEJSCIU. loc_lumaria_watch_house, trzy strefy:

    izba od ulicy (otwarta), korytarz za kontuarem (akta, izba z zamknieciem, cele
    - tylko

    z zaproszeniem), podworzec (nieogladany). Do t_206 komenda istniala w kampanii
    wylacznie

    jako POJECIE - Lucan sam powiedzial w t_034, ze nie wie o tej strazy nic, "jeden
    zepsuty

    glina czy caly komisariat".

    OBSADA JEST DEKLARACJA GRACZA i tak zapisana w pliku lokacji: ludzie majacy udzial

    w sprawie cmentarza nie siedza z przodu. Narrator NIE ustanawia, dlaczego - ani
    spotkania

    u Seraphine, ani roboty na cmentarzu. Nie ustanawia tez, ze komenda jest bezpieczna
    albo

    czysta; kanoniczny stan strazy pozostaje NIEZNANY.


    3. VEREK DAST - KARTA ZALOZONA PRZED PIERWSZA KWESTIA (retcon_000040). Piecdziesiat
    kilka

    lat, dwadziescia za tym samym kontuarem, czlowiek od papieru, nie od patrolu:
    przepisuje

    na czysto, pieczetuje, wpisuje do ksiegi. Bron wisi na kolku za nim i widac, ze
    wisi tam

    od dawna.

    CZEGO CHCE Z TEJ ROZMOWY: poskarzyc sie komus, kto NIE PRZYSZEDL SIE SKARZYC.
    Przy tym

    kontuarze kazdy czegos od niego chce; czlowiek, ktory niczego nie chce, jest u
    niego

    rzadkim towarem. Dlatego gada.

    CZEGO ODMAWIA: nie wpuszcza za kontuar, nie wpisuje niczego do ksiegi, dopoki
    nie musi,

    i nie wymawia nazwiska, za ktore musialby odpowiadac.

    CO MOZE STRACIC: spokojne popoludnie i opinie czlowieka, ktory nie gada.


    4. CO FAKTYCZNIE PADLO - I JEST TO ZAKOTWICZONE W t_034, NIE WYMYSLONE. Zadanie
    sluzb

    miejskich do gildii poszukiwaczy o ciala, akta i dowody z operacji cmentarnej
    idzie

    i wraca OD TYGODNIA - to stoi w kanonie od t_034 slowo w slowo. Dast jest czlowiekiem,

    ktory je przepisuje na czysto, i przepisywal je w tym tygodniu kilka razy. Skarzy
    sie na

    to jako na marnowanie reki, nie jako na sprawe.

    DRUGA RZECZ, KTORA MOWI, JEST WAZNIEJSZA: pismo NIE POWSTAJE na jego pietrze.
    Schodzi do

    niego juz rozstrzygniete, a jego czescia jest odpis i pieczec. To jest ta sama
    teza, ktora

    Seraphine postawila w t_034 - za zadaniem stoi fotel, nie czlowiek - tylko potwierdzona

    z drugiej strony, przez czlowieka bez zadnego udzialu w sprawie.

    NAZWISKA PODPISUJACEGO NIE PODAL. Nie da sie z tej rozmowy stwierdzic, czy nie
    wie, czy

    nie mowi - i narrator tego NIE ROZSTRZYGA. Portrayal#what_he_refuses mowi tylko
    tyle, ze

    nazwiska w cudzych ustach wracaja do tego, kto je podal, i ze nauczyl sie tego
    przez

    dwadziescia lat.


    5. CZEGO NARRATOR TU NIE ZROBIL (retcon_000058). Zadnej listy, zadnego spisu,
    zadnego

    zestawienia. Dast nie wyciaga ksiegi, nie pokazuje rejestru sluzb, nie wymienia
    obsady

    bramnej i nie zna lancucha autoryzacji polnocno-zachodniej zapory - ten watek
    jest

    osobny i jest u Seraphine (t_052). Zwykly dyzurny wie tyle, ile przeszlo mu przez
    rece,

    i dokladnie tyle dostal Lucan.

    Nie ustanowiono tez, ze straz cokolwiek zakrywa. lead_city_watch_covers_cemetery_corpse_trade

    jest deklaracja gracza z t_140 i pozostaje leadem, nie potwierdzeniem.


    6. ZALOZENIE, KTORE POWSTALO I JEST ZYWE. Dast wzial Lucana za rzemieslnika albo
    dostawce -

    czlowieka ze skrzynka szkla, ktory zaszedl przeczekac. Rozmawial swobodniej WLASNIE

    dlatego. Przez cala rozmowe NIE ZAPYTAL o nazwisko ani o sprawe, wiec Lucan nie
    musial

    ani potwierdzic, ani zaprzeczyc - narrator nie wlozyl mu w usta zadnej deklaracji

    (system/player-agency.md). belief_dast_thinks_lucan_is_a_tradesman zapisane jako
    falszywe

    przekonanie, nie jako fakt.

    To zalozenie jest teraz stawka: trzyma sie dokladnie do momentu, w ktorym Lucan
    poda

    nazwisko albo sprawe.


    7. STAN. Czwarty dzien interludium, 14:43, izba od ulicy w komendzie strazy miejskiej.

    Obecni: Lucan, Verek Dast. Energia i integralnosc bez zmian poza regeneracja.
    Zegary bez

    ruchu poza uplywem czasu. Skrzynka szkla stoi przy nodze Lucana. Zuk w kieszeni.
    Spidey

    ZOSTAL w gildii (state/instances/spidey.yaml - zone_guild_upper_offices), nie
    ma go tu.

    Nic nie zostalo wpisane do ksiegi. Pioro Dasta lezy.

    '
