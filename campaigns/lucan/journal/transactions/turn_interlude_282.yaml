  new_decision: 'Piwnica gildii, schody do holu, 10:35, dzien piaty. Rozmowa z czworka
    zamknieta przez Lucana i on od nich odchodzi. CO ZOSTALO ZASIANE: warunkowa oferta
    pracy po sprawie, rada zeby o nich zapomniano przez ok. dwa tygodnie, ostrzezenie
    o rozpoznawaniu i polecenie prosby o kuratele gildii. Reth przyjal to i sam domknal
    wnioskiem "to bedziemy nie rozpoznawac nikogo". NIEUSTALONE: czy poprosza o kuratele
    i czy ja dostana; kim byl dla nich ten glos. NOWA WIEDZA LUCANA: Oren placil wozakowi
    trzydziesci srebra tygodniowo przy stawce rynkowej osmiu, plus dokladka za nocne
    kursy - czyli placil za milczenie, nie za wozenie. OTWARTE I PILNE: BOROS CHCE
    ODPOWIEDZI, KTO IDZIE NA OSTRY KONIEC, DO JEDENASTEJ. Zostalo okolo dwudziestu
    pieciu minut, a Lucan idzie wlasnie na gore.'
