outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'WYGENEROWANA LICZBA, BO SCENA JEJ WYMAGALA (zasada 13.09.2026): stawka
    Retha u Orena. Oparta na jedynych kotwicach cenowych w plikach - 70 srebra za
    komplet szkla alchemicznego z targu (t_191) i 12 000 pierwszej raty syndykatu
    (t_114) - wiec tygodniowka wozaka musi byc jednocyfrowa, a stawka za milczenie
    jej wielokrotnoscia. Podane jako JEGO slowa, nie jako tabela plac: osiem srebra
    tygodniowo za wiezienie siana, trzydziesci u Orena plus dokladka za nocne kursy.
    Zaden plik nie stawial dotad ceny pracy w Lumarii; ta jedna zostaje jako punkt
    odniesienia dla przyszlych i nie jest kanonem placy w calym miescie. OFERTA LUCANA
    JEST WARUNKOWA I TAK ZAGRANA: po sprawie, o ile beda zyli. Do wiedzy czworki wchodzi
    jako TO, CO USLYSZELI OD NIEZNANEGO GLOSU (retcon_000120) - nie jako umowa i nie
    jako zobowiazanie Lucana. Zaden obligations wpis z tego nie powstaje: Lucan nie
    zlozyl obietnicy, podal warunek. RYZYKO ZREALIZOWANE, KTOREGO NARRATOR NIE CHOWA:
    Lucan powiedzial czterem zatrzymanym wspolpracujacym z gildia, ze bedzie szukal
    ludzi BEZ SUMIENIA I BEZ PAMIECI do logistyki. To jest zdanie, ktore przy nastepnym
    przesluchaniu moze pasc z ich ust. Nie robie z tego zegara ani sledztwa (retcon_000055,
    retcon_000015) - zapisuje jako fakt w ich wiedzy i jako lead, bo ambiwalencja
    dziala na korzysc gracza: glos nie podal imienia. DWA TYGODNIE TO OCENA LUCANA,
    nie termin swiata. Zgadza sie z rzedem wielkosci obu zegarow (4/15 i 4/15, dysputa
    ok. 16 dni), ale zaden plik tego nie obiecuje i narrator nie zamienia tego w obietnice.
    KURATELA GILDII: Lucan im to DORADZIL. Czy o nia poprosza i czy ja dostana - NIEUSTALONE,
    narrator nie rozstrzyga za nich ani za gildie.'
  prose: '— Ile zarabialiście na robocie?


    Reth nie odpowiada od razu, ale nie dlatego, że się zastanawia, tylko dlatego,
    że sprawdza,

    czy to jest podchwytliwe. Dochodzi do wniosku, że nie ma już czego chronić.


    — Trzydzieści srebra na tydzień — mówi. — I dokładka za kursy po ciemku, licząc
    od wozu.

    — Krótka pauza. — Siano woziłem za osiem. Za to samo siano, tym samym wozem, tą
    samą drogą.


    Ktoś w głębi mruczy coś, co brzmi jak potwierdzenie.


    — I nikt nie pytał, dlaczego trzydzieści — dodaje Reth, już bez pytania. — Bo
    jak ktoś pyta,

    to już za drogo.


    Lucan mówi dalej, a Reth nie przerywa ani razu.


    Że to świetnie, bo będzie potrzebował kilku ludzi bez sumienia, bez pamięci, z
    doświadczeniem

    w logistyce i chwilowo bez nadziei na zatrudnienie. Że będzie ich potrzebował,
    a nie

    potrzebuje teraz — dopiero jak to całe gówno się skończy. I o ile będą żywi.


    Że na razie mają dbać wyłącznie o jedno: żeby o nich zapomniano. Dwa tygodnie,
    co najmniej,

    licząc na oko.


    Że życzy im najlepiej, ale nie obroni ich, jeśli nie daj Boże rozpoznają kogoś,
    kogo nie

    powinni. Że mają prosić o kuratelę gildii — i trzymać się jej, bo w tej chwili,
    w której

    ją stracą, on będzie musiał szukać nowych pracowników.


    Za drzwiami nie ma żadnej odpowiedzi przez dobre trzy oddechy.


    — Panie — mówi w końcu Reth, i po raz pierwszy słychać, że mówi wolniej, niż myśli.
    — Ja to

    słyszę i ja to rozumiem. Tylko jedno: my nie wiemy, kogo nie powinniśmy rozpoznać.


    To jest uczciwe pytanie i nie zostaje na nie udzielona odpowiedź.


    — Dobrze — mówi Reth po chwili, sam. — To będziemy nie rozpoznawać nikogo.


    Ktoś od siennika odzywa się głośniej niż przez całą rozmowę i pierwszy raz da
    się go

    zrozumieć:


    — A kuratela to się prosi kogo?


    — Powiedzą wam na górze — mówi Reth, zanim Lucan zdąży cokolwiek, i to zdanie
    jest

    w zasadzie odprawą. Potem, ciszej, już wyraźnie do drzwi: — Dziękuję za rozmowę.
    Piąta

    w tym tygodniu, a pierwsza, po której coś wiem.


    Lucan życzy im szczęścia i odchodzi korytarzem w stronę schodów. Za plecami słyszy
    jeszcze,

    jak czterech ludzi zaczyna mówić naraz — i po raz pierwszy od pięciu dni brzmi
    to jak

    ludzie, którzy mają o czym.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs: []
