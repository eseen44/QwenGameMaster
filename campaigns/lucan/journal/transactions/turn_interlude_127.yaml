outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - zwykly czlowiek bez karty, wiec rozstrzygniecie narracyjne
    (kalibracja gracza 19.08.2026). Dziesiec minut, 0.1 jednostki, dotyk przy podaniu
    reki. Cantrip na rozwiazanie jezyka NIE MA jeszcze pliku w mechanice - zarejestrowany
    do dopisania jako effect_lucan_loose_tongue (cantrip, dotyk, wektor mentalny,
    slad faint, 0.1), na wzor minor-hex. 1. CANTRIP DZIALA I DZIALA ZA DOBRZE. Ciec
    nie jest podejrzliwy, nie jest magicznie pismienny i nie ma sie czym bronic; robi
    sie z niego czlowiek, ktory mowi wszystko, co mu przychodzi do glowy, w kolejnosci
    przychodzenia. 2. PROFESOR VEYR JEST NA MIEJSCU i portier nie musi tego sprawdzac,
    bo pytanie jest dla niego bezsensowne - profesor Veyr nie wychodzi. Nie ma gabinetu
    w zadnym uzytecznym sensie, ma laboratorium w skrzydle laboratoryjnym i tam jest
    (zgodne z karta: stale laboratorium, 99 procent zycia). 3. WYCIEK, KTORY POTWIERDZA
    ZEGAR OD ZEWNATRZ. Portier siedzi w bramie, wiec slyszy wszystko, i sam z siebie
    mowi, ze profesor od dwoch dni zatrzymuje ludzi w przejsciu i opowiada o jakims
    okazie, i ze dopytuje o termin. To niezalezne potwierdzenie clock_father_arranges_academy_showing
    (2/15) i pierwszy dowod, ze rzecz jest JUZ publiczna na poziomie plotki portierni,
    nie tylko w glowie ojca. 4. KSIEGA - DOSTAJE ROZNICE, O KTORA NIE PYTAL. Sa dwa
    wejscia i dwa slady: gosc idzie do ksiegi odwiedzin, ktora raz na jakis czas znika
    w archiwum i nikt jej nigdy nie odpytuje (faction_lumaria_magical_academy.archive_and_recordkeeping
    - zapisane niemal pewnie, odnalezione prawie nigdy); czlonek nie wpisuje sie tam
    wcale, ale przejscie czlonka na urlopie dziekanskim jest zdarzeniem, o ktorym
    portiernia gada, a przez portiernie przechodzi cala Akademia. 5. I KOSZT, KTORY
    JEST BEZPOSREDNIM SKUTKIEM WLASNEGO CZARU. To ten sam ciec, ktoremu Misnotice
    zgasilo polrozpoznanie tej twarzy w event_turn_interlude_017 - tylko wtedy bylo
    ciemno, a teraz jest 15:40 i Lucan sam wyciagnal do niego reke. Rozwiazany jezyk
    nie zataja niczego, wiec czlowiek mowi na glos to, co wczesniej zostalo w nim:
    ze widzial gdzies te twarz, chyba wieczorem, i ze nie umie tego ulozyc. Nie oskarza.
    Zwierza sie. 6. I DOMYKA TO PYTANIEM, KTORE JEST CALYM PUNKTEM DECYZJI: pytanie
    o profesora Veyra zadaje czlowiek o twarzy, ktora portier zna, wiec pyta wprost,
    czy pan to rodzina - i przy rozwiazanym jezyku zapyta jeszcze raz, jesli nie dostanie
    odpowiedzi. 7. STAN. 15:40 dnia trzeciego, portiernia przy bramie Akademii. Energia
    8.4 z 15 (po retcon_000045 rezerwa odrasta 0,25 na godzine). Integralnosc 19 z
    19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu pod plaszczem,
    Spidey przy zebrach nieodkryty. USTALONE: ojciec jest w laboratorium; plotka o
    okazie krazy po Akademii od dwoch dni; ksiega gosci trafia do archiwum, ktorego
    nikt nie odpytuje; portier pamieta twarz Lucana z wieczora i mowi o tym na glos.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
