  perspective: pc_lucan
  summary: 'Lucan przez godzinę kalibruje dobrowolne, rozproszone zasilanie Varkhena:
    każdy z czterech sieciarzy będzie przekazywał drobny udział własnego nocnego urobku,
    bez drenowania rezerwy Lucana. Przepływ jest celowo powolny — wystarcza do odzyskiwania
    energii i bardzo wolnej naprawy uszkodzeń, nie do szybkiego postawienia Varkhena
    na nogi. Prosty rozkaz sieci przechodzi jako: polować dyskretnie na zdobycz większą
    niż owady, którą da się obezwładnić bez widocznego zamieszania. Szczury i podobne
    szkodniki są realnym celem; zdrowe koty nie są pewną zdobyczą dla obecnie słabych
    sieciarzy. Sieciarz z dachu Gildii dociera dachami i skrajami ulic na łąki nad
    garbarnią, gdzie rozstawia rzadką sieć obserwacyjną.'
  operations:
  - op: set
    instance_id: webber_anchored
    path: position
    value:
      location_id: loc_tannery
      zone_id: zone_upper_meadow
      formation: solo_regular_post
