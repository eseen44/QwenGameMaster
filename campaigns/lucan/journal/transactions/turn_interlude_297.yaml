outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PODLACZENIE Z NADWYZKI, NIE Z NICZYJEGO ZBIORNIKA - i wychodzi na to,
    ze nie kosztuje nikogo nic mierzalnego. Zrodla wybrane po jednym kryterium: MAJA
    OVERFLOW_PER_DAY zapisany w growth-banks, czyli nadmiar PONAD wlasny sufit rozwoju.
    Wij 01 i Wij 02 po 0,5, General 0,3 - razem 1,3 na dobe wychodzace. Po stratach
    propagacji (webber-network#network_cost_model, mnozne na przeskok; General blisko,
    wije daleko) dochodzi okolo 0,8. DLACZEGO TO NIE JEST NICZYJA STRATA: siec generuje
    25,3 na dobe, a sufit przyjecia Lucana to 7,5 - wiec ponad siedemnascie jednostek
    dziennie i tak nie ma gdzie wejsc. Odciecie 1,3 z tego nadmiaru nie rusza ani
    zbiornikow wezlow, ani banku Lucana. SKUTEK MIERZALNY: integrity.repair Varkhena
    0,8 -> 1,6 na dobe. Droga do pelna skraca sie z okolo 70 dob do okolo 35. To jest
    dokladnie "tyle, zeby zauwazyl" - podwojenie, nie odbudowa. FORMA ZAPISU: rejestr
    RECZNY w growth-banks plus podniesione units w integrity.repair, a NIE wpis w
    sustained-links. Powod stoi w pc-lucan.yaml#regeneration.note: process_sustained_links
    wymaga zrodla bedacego istniejaca instancja i DEBETUJE jej pule, a ekonomia foragingowa
    nie jest w runtime symulowana w ogole. Lacze typu feed zabieraloby wijom ze zbiornika
    3/3 zamiast brac z nadmiaru - czyli robiloby cos innego, niz gracz zadeklarowal.
    RETCON_000113 NIE ZOSTAJE UCHYLONY. Racjonowanie bylo i jest decyzja Lucana; Lucan
    wlasnie podjal inna decyzje, mniejsza niz zniesienie limitu. Varkhen nadal nie
    jest w rozdziale nadwyzki i nadal stoi poza drabina wzrostu. REAKCJA VARKHENA
    zagrana z osi emotion ("Wdziecznosci nie mowi - wykonuje") i z tego, ze ma stac
    przy pozorze snu z t_263: NIE RUSZA SIE, bo o to poproszono. Odzywa sie linia
    alarmowa, jednym slowem. SKLAD PRZENIESIONY na strone ekipy, za zalom korytarza
    starej nizszej trasy - poza linie wzroku z komory Varkhena, tak jak gracz kazal.
    BOROS I MARA MOWIA CO INNEGO I OBOJE MAJA RACJE. To nie jest przeszkoda - to wybor.'
  prose: 'Lucan nie podłącza go do siebie.


    Robi coś tańszego i mniej widocznego: bierze to, co i tak się marnuje. Dwa wije
    pod dzielnicą

    gildii zbierają więcej, niż mieszczą; Generał w niszy pod kaplicą tak samo. Ta
    nadwyżka

    płynie dziś donikąd, bo jego własna rezerwa stoi pełna od wczoraj.


    Więc przekłada jej kawałek. Nie całą — kawałek.


    To idzie długo i przychodzi mało, bo każdy przeskok zjada swoje, a wije siedzą
    pod drugim

    końcem miasta. Z tego, co wychodzi, dociera może dwie trzecie.


    I to wystarczy.


    Linia do Varkhena jest linią, po której od tygodnia nic nie leci — otwartym portem,
    o którym

    obie strony wiedzą, że jest. Teraz coś nim idzie. Niedużo. Tyle, ile poczułby
    człowiek,

    któremu ktoś dołożył drugi koc.


    Odzywa się po dłuższej chwili i mówi jedno słowo.


    — Czuję.


    Nic więcej. Nie dziękuje, nie pyta, ile i skąd, i nie rusza się ani o palec, bo
    leży tak,

    jak go poproszono, i będzie tak leżał.


    Lucan liczy to sobie po drodze do worków. Dwa razy więcej niż dawał sam cmentarz.
    Siedemdziesiąt

    dni robi się trzydziestoma pięcioma.


    Potem godzina. Za kwadrans szósta.


    Worki są w ośmiu sztukach i ważą tyle, ile Boros powiedział. Przenoszą je razem
    przez

    przebicie na drugą stronę i układają za załomem starego korytarza — piętnaście
    kroków od

    przejścia, w ślepym kącie, którego nie widać ani z komory Varkhena, ani z prostej.
    Kto tędy

    przejdzie, minie je i nie zobaczy, jeśli nie będzie wiedział.


    — Co myślicie? — pyta Lucan.


    Odpowiadają jednocześnie i mówią co innego.


    — Zostawiamy i schodzimy — mówi Boros. — Worek leży. Worek nie ucieknie, nie zgnije
    i nie

    zmieni zdania. A dziura w ziemi, do której nikt nie chodził od trzystu lat, może
    mieć drugie

    wyjście, którym ktoś jutro wejdzie.


    — Wywozimy teraz — mówi Mara. — Do zmierzchu zostały dwie godziny. Jeden kurs
    zrobimy przy

    świetle i nikt na niego nie spojrzy. — Poprawia rzemień. — Jak zejdziemy, to wyjdziemy
    po

    ciemku i wyjedziemy po ciemku, a wtedy to już nie jest wóz z gruzem.


    Patrzą po sobie. Żadne z nich nie zmienia zdania i żadne nie podnosi głosu.


    — Ja bym oddał głos temu, kto ma iść pierwszy — mówi w końcu Boros. — A pierwszy
    idziesz ty.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs:
