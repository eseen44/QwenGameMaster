  scene_update: null
  new_decision: 'Stara nizsza trasa, za zalomem przy skladzie, 18:27, dzien piaty.
    VARKHEN PODLACZONY Z NADWYZKI: Wij 01, Wij 02 i General oddaja swoj overflow (0,5
    + 0,5 + 0,3 = 1,3 na dobe), po stratach propagacji dochodzi okolo 0,8. integrity.repair
    0,8 -> 1,6 na dobe, czyli okolo 35 dob do pelna zamiast 70. NIKOGO to nie kosztuje
    mierzalnie, bo siec generuje 25,3 przy sufcie przyjecia Lucana 7,5. retcon_000113
    nie uchylony - racjonowanie bylo decyzja Lucana i nadal nia jest, tyle ze decyzja
    sie zmienila. Varkhen odpowiedzial jednym slowem, nie ruszyl sie i o nic nie poprosil.
    SKLAD: osiem workow, okolo 16 kg, przeniesione na strone ekipy i zlozone za zalomem,
    pietnascie krokow od przebicia, poza linia wzroku z komory Varkhena. EKIPA JEST
    PODZIELONA I OBOJE MAJA RACJE. Boros: zostawic i schodzic, bo worek nie ucieknie,
    a dziura moze miec drugie wyjscie, ktorym ktos jutro wejdzie. Mara: wywiezc teraz,
    bo do zmierzchu dwie godziny i jeden kurs przy swietle nie zwroci niczyjej uwagi,
    a po ciemku ten sam woz przestaje byc wozem z gruzem. Boros sam oddal glos Lucanowi
    slowami, ze pierwszy idzie ten, kto idzie pierwszy. OTWARTE I POSTAWIONE WPROST:
    kurs na gore teraz czy zejscie. Rezerwa 14,6/15.'
