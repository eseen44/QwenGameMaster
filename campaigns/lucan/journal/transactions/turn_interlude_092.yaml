  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Poltorej godziny lektury do prawie piatej i cztery godziny
    snu. Nauka z ksiazki jest jedyna rzecza w tej kampanii, ktora Lucan robi lepiej
    niz ktokolwiek wokol niego, i tej nocy to widac. 1. CALY KATALOG WCHODZI ZA PIERWSZYM
    RAZEM. Nie dlatego, ze ksiazka jest latwa, tylko dlatego, ze jest napisana jak
    PROCEDURY, a Lucan cale zycie czytal procedury. Struktura okazja - wektor - ladunek
    sklada sie u niego z rzeczami, ktore juz umie: gdzie biegnie nerw, ktory miesien
    trzyma bron, co robi histamina, ile trwa, zanim wyrzut hormonow bedzie widoczny.
    Autor daje dostarczenie; anatomie Lucan dokłada sam i to jego czesc jest lepsza
    niz autora. 2. CO ZNACZY "ZNAM TEORETYCZNIE" - PRECYZYJNIE. Lucan potrafi kazda
    z jedenastu procedur nazwac, rozlozyc na kolejnosc krokow, wskazac wizualizacje
    i opisac przeplyw energii. Wie, ktore sa tanie, ktore opozniona, ktora ile trwa.
    To jest pelna wiedza magiczna w rozumieniu system/magic.md - zapis cudzej dzialajacej
    intuicji. Czego nie ma: ANI JEDNEGO UDANEGO PRZEBIEGU. Wzorzec trzeba raz odtworzyc
    wlasnym kanalem, zeby stal sie powtarzalny. 3. I TU JEST KOSZT, KTORY NIE JEST
    ENERGIA ANI CZASEM. Praktyka wymaga CELU. Czesc fizyczna i biologiczna da sie
    wycwiczyc na kregowcu - szczury sa darmowe i sa objete stalym rozkazem polowania
    od tury 055, wiec material treningowy przychodzi sam. Ale zapadnia pamieci, rozwiazanie
    jezyka i usypianie nie maja wersji szczurzej. Nie istnieje szczur, ktory nie potrafi
    opisac twarzy. Pierwsza proba tych trzech odbedzie sie na CZLOWIEKU i bedzie jednoczesnie
    pierwszym uzyciem - a procedura, ktora zadziala w polowie, zostawia czlowieka,
    ktory pamieta Lucana POLOWICZNIE, czyli gorzej, niz gdyby nie rzucil wcale. 4.
    RZECZ, KTORA WYCHODZI Z LEKTURY MIMOCHODEM I JEST NIEPRZYJEMNA. Cala ta szkola
    stoi na kontakcie - reka, ramie, kieliszek, uklon. Lucan przez dwa lata budowal
    zycie na dokladnie odwrotnej zasadzie: nie dotykac, nie byc widzianym, nie zostawiac
    twarzy. Ksiazka jest uzyteczna dokladnie w tej mierze, w jakiej przestanie sie
    ukrywac - a to akurat i tak zaczyna sie za trzynascie dni, z wezwaniem, seminarium
    i rodzina naraz. 5. SEN. Cztery godziny w prawdziwym lozku, pierwszy raz od poczatku
    interludium. Pokoj na gorze zyskuje przy okazji to, czego przykrywka potrzebowala
    najbardziej - realne slady zamieszkania, wygniecione posciel i trzy nudne ksiazki
    na stoliku. Przeszukanie znalazloby teraz pokoj czlowieka, ktory sie uczy do przesluchania.
    6. STAN NA RANO. Dzien trzeci, energia 14,5 z 15, integralnosc pelna, bez warunkow.
    Pietro nizej w celi: Spidey, zakotwiczony zuk i pudelko z dwoma pajakami. W baszcie
    czekaja Tkacz i zawisak, obaj z nieskonczona robota przy stole. Boros i Mara sa
    dzisiaj.'
  new_decision: 'Rano dnia trzeciego, pokoj na gorze, gildia budzi sie pietro nizej.
    Dzis jest spotkanie z Borosem i Mara - pieniadze i prawnik z polswiatka jednym
    posiedzeniem. Przed nim Lucan ma jeszcze wolne godziny i cztery rzeczy w zasiegu
    reki: postawic dwa pajaki (pokoj i gabinet), wrocic do baszty do Tkacza i zawisaka,
    zaczac cwiczyc pierwsza klatwe na szczurze, albo domknac linie obrony przed przesluchaniem,
    ktora nadal nie jest wybrana.'
  operations:
  - *id002
