outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Piec minut, zero energii. Nawias z czynem rozstrzygniety
    (retcon_000032): machniecie na Neris i wyjecie kartki to deklaracje, nie komentarz.
    Przyneta przebija agende ojca dokladnie tak, jak zapowiada jego karta (attitude_to_pc.likely_hook).

    1. ODBITKI PRZECHODZA Z RAK DO RAK I NIE ZOSTAJA PRZECZYTANE. Neris podaje je
    bez slowa - instruktaz z t_143 wykonuje doslownie. Ojciec bierze je, ale kartka
    z szescioma problemami wchodzi mu w pole widzenia w tej samej sekundzie, a on
    ma JEDEN kanal uwagi naraz. Odbitka jest dla niego tylko droga do problemu; tu
    ktos podaje mu szesc problemow na skroty. Odklada odbitki pod lokiec, naglowkiem
    w dol. To NIE jest uratowane - to jest odroczone. Nazwisko Neris lezy na jego
    stole, trzydziesci centymetrow od jego reki, i wystarczy jeden odruch, zeby je
    obrocic.

    2. RYJE OD RAZU I NIE PO KOLEI. Zaczyna od problemu (a) - skala dawcy - bo to
    on sam go nazwal przy kikucie odnoza (t_018) i przez dwa dni o tym nie zapomnial.
    Potwierdza to, co stoi w karcie: ma dane, nie ma modelu, i wlasnie dostal kogos,
    kto pyta o model.

    3. PROBLEMY 5 I 6 NIE BUDZA W NIM PODEJRZLIWOSCI - BUDZA APETYT. Neris zobaczyla
    w nich zmiane rejestru (t_143); ojciec widzi cos innego i zgodnego z jego karta:
    problem z warunkami brzegowymi to problem, ktory KOMUS jest potrzebny, czyli lepiej
    postawiony. Polityki w tym nie szuka, bo polityka go nie interesuje i sie w niej
    nie orientuje. Nie jest to przenikliwosc ani jej brak - to inna oś zainteresowania.

    4. I DLATEGO ZADAJE PYTANIE, KTORE JEST NIEBEZPIECZNE BEZ ZLEJ WOLI. Zeby ruszyc
    problem 5, musi znac specyfikacje: NIEWYKRYWALNY DLA KOGO. Pyta o to na glos,
    w laboratorium bez zamknietych drzwi, przy nieprzedstawionej kobiecie, ktora za
    szesnascie dni stanie na otwartej dyspucie przed publicznoscia zawierajaca ludzi
    Kosciola. Slowo "niewykrywalny" pada od niego, nie od Lucana - ale odpowiedziec
    musi Lucan.

    5. WORLD MOVE - ROZMOWA JEST TERAZ GLOSNA I MA SWIADKA. Do tej pory Neris dostawala
    od Lucana rzeczy, ktore Lucan wybieral. Od tej chwili slyszy to, co wybiera profesor
    Veyr, a profesor Veyr nie ma pojecia, ze cos trzeba wybierac. Jej wlasna kategoria
    "zwloki, o ktore mialam zapytac" wlasnie dostala pierwsze zasilanie z zewnatrz.

    6. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    oraz tego, kim jest kobieta przy drzwiach i czyje nazwisko lezy pod jego lokciem.

    7. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra. Energia bez zmian,
    integralnosc 19 z 19, bez warunkow. Kartka z szescioma problemami w rekach ojca,
    dwie odbitki pod jego lokciem naglowkiem w dol. USTALONE: przyneta przebila agende
    ojca; odbitki oddane, ale nieprzeczytane; ojciec pyta na glos, dla kogo okaz ma
    byc niewykrywalny.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: in_his_fathers_laboratory_bait_sheet_handed_over_and_working_offprints_face_down_under_the_professors_elbow_unread_neris_silent_at_the_door_father_asking_out_loud_undetectable_to_whom
  - op: advance_time
    seconds: 300
  - *id002
