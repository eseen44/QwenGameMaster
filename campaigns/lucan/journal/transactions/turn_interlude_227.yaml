  summary: 'Bez testu - interludium, roll_policy disabled. Cztery minuty, zero energii.

    PYTANIE TRAFIA W PRIORYTET DRUGI Z JEJ KARTY I NIE JEST CIOSEM - JEST JEJ WLASNYM,

    NIEROZWIAZANYM PROBLEMEM, ZADANYM NA GLOS PRZEZ JEDYNA OSOBE, KTORA JEST W NIM
    RAZEM Z NIA.


    1. ROZSTRZYGNIECIE GRACZA O TRESCI REJESTRU LADUJE I JEST ZAPISANE.

    Varkhen NIE FIGURUJE w ewidencji prawnika. Zadnej pozycji, zadnej wzmianki, zadnego

    omownego opisu. Zgodne z forbidden_without_source na karcie npc_rovan_kesz

    (varkhen_existence) - Kesz nadal nie wie i nic tu tego nie zmienia.


    2. I DOKLADNIE TU SERAPHINE ZAMYKA PETLE, KTORA GRACZ SAM OTWORZYL - Z JEJ WLASNEJ
    KARTY,

    NIE Z WYMYSLU NARRATORA. seraphine-vale.yaml#portrayal.lucans_own_reading_to_respect:

    "Bez Varkhena nie ma za co go de facto skazac: cial nie ma, dowodow nie ma, reszta
    jest

    prawnie nijaka, a on ma plecy. REALNE ZAGROZENIE POJAWIA SIE DOPIERO, GDY KTOS
    DOJDZIE

    DO VARKHENA - a wtedy ona jest wspolwinna razem z nim."

    WNIOSEK, KTORY WYPOWIADA: rejestr jawny dla wszystkich stron ubezpiecza Lucana
    od

    wszystkich zarzutow, ktore i tak sa nijakie, a jedyna pozycja mogaca go realnie

    pograzyc zostala z niego swiadomie wyjeta. Ubezpieczenie pokrywa wylacznie te
    szkody,

    ktore i tak nie zachodza. To NIE jest zarzut wobec decyzji gracza - decyzja jest

    poprawna, bo wpisanie Varkhena byloby samobojstwem obojga. To jest nazwanie granicy

    tej metody i ona ja nazywa, bo nazywanie ceny jest jej pierwsza cecha mowy.


    3. PRZESLANKA LUCANA ZOSTAJE ZAKWESTIONOWANA - I TO NIE JEST OPOR, TYLKO JEJ DOKTRYNA

    Z t_126 ZASTOSOWANA WPROST. Lucan mowi: "jesli chcemy korzystac z jego wiedzy,
    ktos

    bedzie musial wiedziec". Ona odpowiada: NIE. Ktos bedzie musial znac WNIOSEK,
    nie

    ZRODLO. Cala jej zasada brzmi "nie liczy sie, czy informacja jest tajna, tylko
    ILE OSOB

    MOGLO JA MIEC" - wiedza pochodzaca z Varkhena musi dostac DRUGIE, CYTOWALNE

    POCHODZENIE, zanim wejdzie na jakikolwiek papier.

    I MA NA TO ZYWY, DZISIEJSZY PRZYKLAD WLASNEJ PORAZKI, WIEC NIE MOWI TEGO Z POZYCJI

    WYROCZNI (portrayal#she_is_not_an_oracle): lancuch autoryzacji polnocno-zachodniej

    zapory. Wniosek ma i wie, ze jest prawdziwy; zrodlo jest niecytowalne; papieru
    nie

    da sie domknac (t_188 punkt 3). Pranie zrodel to nie teoria - to jest to, na czym

    ona dzis stanela.


    4. ODPOWIEDZ NA "KIEDY" - UCZCIWA, BEZ PLANU I BEZ DATY.

    NIE PRZED POSIEDZENIEM (clock_guild_leadership_hearing 3/15). Powod operacyjny,
    nie

    tchorzostwo: zgloszenie Varkhena przed przesluchaniem zamienia przesluchanie Lucana

    w sprawe o Varkhena, a wtedy nie ma juz zadnej rozmowy o cmentarzu, o nagrodzie
    za

    Akt 2 ani o czymkolwiek innym.

    CO JEST JEJ REALNYM PROBLEMEM I CO NAZYWA WPROST: nie sam nieumarly. OPOZNIENIE.

    fact_seraphine_moved_varkhen_to_guild_basement (act-02 closeout) mowi, ze wyprowadzila

    go i ZACZELA PYTAC, kto formalnie odpowiada za jego podporzadkowanie - czyli pytanie

    o zgloszenie jest OTWARTE OD DAWNA i jest jej wlasne. Kazdy kolejny dzien pogarsza
    nie

    fakt, tylko odpowiedz na pytanie "dlaczego nie od razu". Przestepstwem instytucjonalnym

    jest zwloka, nie stworzenie.

    NARRATOR NIE DAJE JEJ GOTOWEGO ROZWIAZANIA I NIE POZWALA JEJ WYMYSLIC PLANU NA
    POCZEKANIU.

    Nie ma daty, nie ma procedury, nie ma pomyslu. Ma problem i mowi, ze go ma.


    5. CZEGO NIE ROBI (do_not_play, retcon_000039, retcon_000041). Nie oburza sie.
    Nie

    moralizuje. Nie grozi przeliczeniem Lucana w dol. Nie zwija sie i nie przelicza
    planu

    na poczekaniu - robi sie rzeczowa, bo to jest jej sposob na rzecz, ktora boli.

    NIE JEST TO TEZ cios we wlasny fundament w rozumieniu retcon_000039: pytanie nie

    podwaza jej instytucji ani jej pozycji, tylko wskazuje termin, ktorego ona sama

    pilnuje. Slyszy je jako to, czym jest - jedyna osoba w tym ukladzie, ktora tez

    utonie, pyta, kiedy zaczniemy plywac.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie ustanowil, ze ktokolwiek z kierownictwa juz
    wie

    ani ze ktos podejrzewa - zaden plik tego nie mowi (retcon_000058). Nie stworzyl
    nowego

    zegara, terminu, sledztwa ani swiadka (retcon_000055). Nie wpisal daty ujawnienia.

    Nie rozstrzygnal, czy da sie znalezc drugie pochodzenie dla wiedzy Varkhena -
    to jest

    robota, nie fakt. Nie przypisal Lucanowi zadnej obietnicy ani zobowiazania wobec
    niej.

    Nie ruszyl zegarow poza uplywem czasu.


    7. STAN. Czwarty dzien interludium, gabinet Seraphine, gorne pietro gildii.

    Obecni: Lucan, npc_seraphine_vale. Spidey i Tkacz przy Lucanie, zuk w kieszeni.

    Integralnosc 19/19, energia bez wydatku - czytac z pliku. Godzine czytac ze

    state/time.yaml po commicie. Pozycje druga i trzecia z siedmiu nadal nie padly.

    '
  new_decision: Seraphine mowi, ze o Varkhenie nie zglosi przed posiedzeniem i ze
    problemem jest zwloka, nie sam nieumarly - a wiedza Varkhena wymaga drugiego,
    cytowalnego pochodzenia, zanim wejdzie na jakikolwiek papier. Nie ma na to pomyslu.
    Czeka, co Lucan z tym zrobi - i nadal czeka na pozycje druga i trzecia z siedmiu.
