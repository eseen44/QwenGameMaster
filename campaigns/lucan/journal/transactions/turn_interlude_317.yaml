outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PYTANIE PIERWSZE ODPOWIADA SOBIE SAM LUCAN, BO TO JEGO WIEDZA, NIE VARKHENA.
    Varkhena znaleziono dopiero po tamtej nocy (milestone_044c), wiec ducha nie widzial
    i narrator nie dopisuje mu o nim ani zdania. CO SIE STALO Z DUCHEM - WPROST Z
    PLIKOW, BEZ JEDNEGO NOWEGO BYTU: milestone_043c nazwal go glodnym duchem / genius
    loci cmentarza, ktory postrzegal Orena jako nalezaca do siebie czesc. milestone_044b
    konczy sie tak: Seraphine zabija Orena humanitarnie, Lucan pobiera minimalna probke
    sygnatury, ENERGIA COFA SIE POD ZIEMIE, a nieumarli nieruchomieja. TYLE. NIKT
    GO NIE ZABIL, nikt go nie zwiazal i nikt sie nim potem nie zajal. Rozwiazana zostala
    PASOZYTNICZA WIEZ, a nie duch. Jest tam nadal. PYTANIE DRUGIE IDZIE DO VARKHENA,
    BO TO JEGO WARTA. objectives#varkhen_three_seals_oath ma to zapisane od Aktu 2:
    seal_one, state broken, location under_oldest_mausoleum. Varkhen potwierdza to
    z wlasnej pamieci i powtarza to, co powiedzial w t_313 - siega po nia i nie ma
    czego dotknac. ZESTAWIENIE, KTORE NARRATOR MA OBOWIAZEK POLOZYC OBOK SIEBIE (retcon_000135)
    I KTOREGO NIE DOMYKA (retcon_000136): dwa wpisy w plikach wskazuja NA TO SAMO
    MIEJSCE. objectives mowi, ze pierwsza pieczec - JEDYNA ZLAMANA - lezy POD NAJSTARSZYM
    MAUZOLEUM. underworks/ description.md mowi, ze najglebsza znana droga biegnie
    ku SERCU POD NAJSTARSZYM MAUZOLEUM, a layout.yaml stawia tam feature_heart_route
    i zone_heart_approach. Serce to duch. ZLAMANA PIECZEC I DUCH SA W JEDNYM MIEJSCU.
    Zaden plik nie mowi, ktore z tego jest przyczyna, i narrator tego nie rozstrzyga.
    TRZECIA RZECZ, KTORA LUCAN WIDZI SAM, BO JEST NAUKOWCEM - i ktora tura NAZYWA
    JAKO SLABA: trzy pieczecie ustawiaja sie w kolejnosci. Przy sercu ZLAMANA. Sto
    kilkanascie metrow dalej BRUDNA, z osadem tego samego ducha. Najdalej, przy dolnej
    bramie, CIENKA, ale trzymajaca. TRZY PUNKTY TO NIE JEST DOWOD i Lucan sam sobie
    to mowi; to jest ksztalt, ktory moze byc przypadkiem trzech roznych awarii. CZEGO
    NARRATOR NIE ZROBIL: nie postawil zegara, nie orzekl, ze pieczecie padaja po kolei,
    nie zapowiedzial niczego i nie kazal duchowi zareagowac. Zaden plik tego nie stawia
    (retcon_000015, retcon_000055). KOSZT: zero. Rozmowa i wlasna pamiec nic nie kosztuja.'
  prose: 'Lucan zadaje pierwsze pytanie sobie, bo Varkhen nie ma na nie odpowiedzi
    — znaleźli go

    dopiero później, w komorze, kiedy tamto już się skończyło.


    A odpowiedź jest krótsza, niż powinna być.


    Nikt go nie zabił.


    Ta noc skończyła się tak: Oren leżał sparaliżowany, Seraphine podeszła i zrobiła
    to szybko,

    Lucan zdążył zdjąć minimalną próbkę — a potem energia cofnęła się pod ziemię i
    zwłoki na

    cmentarzu przestały się ruszać. Dla wszystkich w tamtym pokoju była to rzecz zamknięta
    -

    i w jednym mieli rację: zamknęła się **więź**.


    Rozwiązali pasożytniczą więź trzydziestu jeden lat. Trzymał ją człowiek i człowiek
    przestał

    istnieć, więc przestała trzymać.


    Sam duch nie został ruszony w żaden sposób. Nikt go nie związał, nie wypchnął,
    nie zamknął

    i nie nazwał po imieniu. Cofnął się i leży.


    Lucan ma jego próbkę w pamięci i właśnie znalazł ją drugi raz, na kamieniu, pięć
    kroków stąd.


    — A ostatnia? — pyta na głos.


    Varkhen odpowiada bez wahania, bo to jest jego warta i pamięta ją lepiej niż własne
    ciało.


    — Pod najstarszym mauzoleum.


    I zaraz to, co powiedział już przy bramie:


    — Tej sięgam i nie ma czego dotknąć.


    Lucan stoi z tym chwilę.


    Bo pod najstarszym mauzoleum jest jeszcze coś i on to wie od Aktu drugiego, tylko
    nigdy nie

    postawił tych dwóch zdań obok siebie. Najgłębsza droga, jaką znają te podziemia,
    prowadzi

    ku sercu — a serce leży pod najstarszym mauzoleum.


    Serce to duch.


    Więc jedyna złamana pieczęć z trzech leży dokładnie tam, gdzie leży to, co je
    psuje. Albo

    tam, gdzie leży to, co przez nią wyszło. Kamień nie mówi, w którą stronę to szło,
    i żaden

    plik w jego głowie tego nie rozstrzyga.


    A potem widzi jeszcze jedno i sam sobie mówi, żeby się z tym nie spieszyć.


    Przy sercu — złamana. Sto kilkanaście metrów dalej, tutaj — brudna, z osadem tego
    samego

    ducha. Najdalej, przy dolnej bramie — cienka, ale trzymająca.


    Trzy punkty. To nie jest dowód. To jest kształt, który równie dobrze może być
    zbiegiem

    trzech osobnych awarii, i człowiek, który spędził rok na układaniu cudzego chaosu

    w powtarzalne wyniki, wie o tym lepiej niż ktokolwiek.


    Ale kształt już zobaczył i nie da się go odzobaczyć.

    '
