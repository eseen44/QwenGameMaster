            growth od gory - Lucan, zakotwiczone, reszta - a przydzial Lucana idzie
            NAJPIERW w rezerwe do sufitu 15, potem w bank (retcon_000141, kolejnosc
            bez zmian). Model w calosci: growth-banks.yaml#energy_model. Rachunek
            na zadanie: python tools/energy_pl.py.'
