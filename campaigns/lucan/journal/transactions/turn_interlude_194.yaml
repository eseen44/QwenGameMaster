  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii.

    Kesz grany zgodnie z retcon_000124: po tej samej stronie stolu od t_105b, decyduje
    o

    wlasnym udziale SAM. Wszystkie trzy przeformulowania Lucana ladują; Kesz wycenia,
    nie

    bramkuje, i idzie z nim do wagi.


    1. RAMA DLA KAPLANA PRZYJETA - I KESZ MOZE JA NIESC WLASNIE DLATEGO, ZE NIE WIE,
    CO ZNACZY.

    "Spotkanie dotyczy tego, co jest pod cmentarzem" jest zdaniem, ktorego kaplan
    nie odrzuci:

    znal wlasciwe wejscie do komory, ogladal pieczecie, a przy ostatniej wizycie przyszedl

    Z ORENEM (faction_lumaria_church.knowledge, cytowane we wlasnym converging_target
    Kesza).

    Kesz zna ISTNIENIE wiekszego problemu z cmentarzem, bo siedzial w pokoju w t_110,
    gdzie

    Lucan nazwal jego istnienie i nie nazwal tresci. Nie wie wiec, o czym mowi - i
    sam

    zauwaza, ze to jest zaleta, bo czlowieka, ktory nie wie, nie da sie zmusic do
    rozwiniecia.

    forbidden_without_source nienaruszone: Varkhen nie pada.


    2. OSLONA "ON MNIE SZANTAZUJE" - WZIETA I WYCENIONA, BO TO JEST DLA NIEGO CENNIEJSZA
    POLOWA.

    Kesz szukal odpowiedzi na pytanie, ktore sam postawil pol godziny temu: jak wytlumaczy,
    ze

    wprowadza Veyra po jawnej zapowiedzi wojny z Kosciolem. Dostal ja gotowa. "Formalnie
    pasuje"

    to jest jego wlasny slownik i przyjmuje to bez zawahania. Nazywa dwie ceny, obie
    zawodowe,

    zadna moralna: (a) czlowiek szantazowany jest czlowiekiem ze slaboscia, wiec ta
    karta gra

    RAZ i po niej jego pozycja w tamtym pokoju jest nizsza; (b) wersji nie wolno zdementowac

    zachowaniem - jesli Lucan w tej samej rozmowie zagra jak wspolnik, oslona pada
    w tej samej

    sekundzie.


    3. STRAZ - ROZROZNIENIE PRZYJETE, KOLIZJA Z t_100 ZNIKA, ZOSTAJE INNY KOSZT I
    NIE JEST

    WYMYSLONY. Gwarant proceduralny nie konkuruje z klientem w mundurze, bo nie wystepuje

    przeciw niemu - stoi i pilnuje formy. Kesz przyjmuje to jako zawezenie roli i
    od razu

    dopowiada rzecz, ktora Lucan wlasciwie sam powiedzial: jego obecnosc JEST komunikatem.

    Po tej rozmowie Straz wie, ze przy tej sprawie stoi syndykat. To nie konkurencja
    - to

    deklaracja zainteresowania, i nie jego jest ostatnie slowo, czy pryncypal ja chce.

    Nie odsyla przez to Lucana po zgode (retcon_000124) - po prostu i tak ida obaj
    do wagi.


    4. GILDIA - NAJTANSZA Z TRZECH RZECZY I KESZ JA OSTRZY. Statuty rzeczywiscie sa

    niepotrzebne, skoro rola brzmi "na kazda kare trzeba podac przepis". Zawodowa
    poprawka

    Kesza: zadanie nie brzmi "niech nazwia przepis", tylko "niech to WEJDZIE DO PROTOKOLU".

    Swiadek, ktory przez cala rozprawe milczy, a na koncu zapisuje, ze zadnego przepisu
    nie

    przywolano, jest wart wiecej niz obronca. To jest dokladnie jego fach - obieg
    karny i

    urzednicy magistratu, nie Akademia.

    PYTA O JEDNA RZECZ OPERACYJNA, NIE MORALNA: czy oficer gildii, ktory Lucana oslania,

    wie, ze on tam bedzie. Nie zada odpowiedzi teraz.


    5. LINIA DO PRYNCYPALA - TO JEST CZESC, KTORA CZYNI RESZTE SPRZEDAWALNA W SRODKU.

    protect_the_room_first stoi w jego agendzie od poczatku. Lucan wlasnie zamienil
    jego udzial

    z ekspozycji w AKTYW: pokoj dostaje tresc obu rozpraw i terminy wczesniej niz
    ktokolwiek.

    Kesz nie udaje, ze to nie jest dla niego wygodne.

    NARRATOR ZGLASZA, NIE ROZSTRZYGA: to OCIERA SIE o obligation_name_advance_warning_channel_

    for_syndicate, ale go NIE zamyka. t_109 zadal NAZWISKA I SPOSOBU sygnalu wartego
    co

    najmniej dobe przewagi - "zamykajcie". Prawnik noszacy terminy rozpraw to co innego
    niz

    sygnal alarmowy. Moze byc kandydatem na to nazwisko, jesli gracz tak zadeklaruje.


    6. IDA. Kesz bierze teczke i idzie z Lucanem do stolu wagowego. Zadna umowa nie
    zostala

    zawarta, honorarium nie padlo, is_lucans_lawyer nadal formalnie false.


    7. CZEGO NARRATOR TU NIE ROBI. Nie kaze Keszowi odsylac Lucana po zgode (to byl
    blad

    t_193, patrz retcon_000124). Nie robi z niego wyroczni - nie rozgryza planu szantazu,

    nie pyta, czym Lucan dysponuje na gildie i na Straz, i nie dopowiada tresci, ktorej

    gracz nie zadeklarowal (retcon_000058). Nie stawia terminu, nie tworzy zegara,
    nie

    zapowiada, ze cos pojdzie zle. Nie orzeka za pryncypala.


    8. STAN. Czwarty dzien interludium, targ, w drodze do stolu wagowego, we dwoch.

    Energia i integralnosc bez zmian poza regeneracja. Zegary bez ruchu poza uplywem
    czasu.

    Wiadomosc do kaplana idzie dzis z rama "to, co pod cmentarzem". Oslona "on mnie
    szantazuje"

    wydana Keszowi do uzytku. Rola gwaranta proceduralnego wobec Strazy i gildii przyjeta

    bez umowy. Zaden termin nie powstal.

    '
