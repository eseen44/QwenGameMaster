outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Trzydziesci minut,
    zero energii. 1. ODLOZENIE DOSTAW PRZYJETE OD RAZU I Z SZACUNKIEM ZAWODOWYM. Kesz
    nie nalega ani sekundy: "za goracy w tej okolicy" to zdanie, ktore w jego fachu
    konczy dyskusje, a nie ja zaczyna. Nazywa to poprawnie - Lucan wlasnie odmowil
    zakupu, ktory bylby dla niego korzystny i dla obu ryzykowny, w tygodniu, w ktorym
    magistrat porzadkuje akta. To jest pierwsza rzecz, po ktorej Kesz traktuje go
    jak partnera, a nie jak klienta z pieniedzmi. 2. DWIE ZYWE PROSBY ZOSTAJA NA STOLE
    I OBIE SA WYKONALNE BEZ RUSZANIA CIAL. (a) PRAWNIK O SZCZEGOLNEJ SPECJALIZACJI
    - Kesz nie udaje, ze jest nim sam. Obsluguje forum karne i urzednikow magistratu;
    to jest jedna z dwoch linii, ktore SOBIE PRZECZA (lead_two_contradictory_defences).
    Zadaje pytanie rozstrzygajace, ktorego Lucan unikal od dwoch dni: czy chce czlowieka
    do obrony KARNEJ, czy do KLASYFIKACYJNEJ. Deklaruje przy tym, ze do drugiej tez
    zna nazwiska, ale sa to nazwiska z zupelnie innego swiata i kosztuja inaczej.
    (b) MATERIALY DO HOBBY - to jest dostawa, ktora syndykat moze zrobic bez wozu
    ze zwlokami i bez zapory: sol, srodki konserwujace, preparaty, narzedzia, szklo,
    drut, plotno, a takze material nieludzki i drobny. Kesz nie pyta, po co. 3. LUCAN
    ODWRACA SIE DO WAGOWEGO I ODZYWA SIE DO NIEGO PIERWSZY RAZ W CALEJ SCENIE. Rzemieslnik
    na dniowce, ktory do tej pory nie powiedzial ani slowa. Prosba jest grzeczna i
    zawodowa - dobry biznesmen liczy pieniadze sam - a liczyc trzeba i tak OD ZERA,
    bo wazona czesc zmieszala sie z niewazona przy upadku. Wagowy podnosi wzrok na
    Ilve, nie dostaje ani zakazu, ani zgody, i zaczyna liczyc razem z Lucanem. Kesz
    nie ingeruje. 4. OBELGA POD ADRESEM ILVY - DRUGA W TEJ SCENIE I TYM RAZEM PUBLICZNA
    ORAZ OSOBISTA. Ilva nie reaguje. Nie podnosi glosu, nie odpowiada, nie wychodzi.
    Podnosi z podlogi jeden pierscien zaloby, kladzie go na blacie po swojej stronie
    i zostaje przy wadze - jedyna rzecz, ktora robi, to ta, ktora nalezy do niej:
    liczba za towar bedzie jej liczba, niezaleznie od tego, kto przesypuje kruszec.
    ZAPISAC NA PRZYSZLOSC: dwa ominiecia i jedna obelga o charakterze seksualnym,
    w jej wlasnym pokoju, przy jej ludziach lezacych na podlodze. Nie ma z tego natychmiastowej
    kary i nie bedzie - jest z tego trwala pozycja Lucana w jej pamieci i w pamieci
    pokoju. 5. MARA. Nie odzywa sie, ale przy zdaniu o "zmyslowej kasjerce" odwraca
    glowe i patrzy na Lucana pierwszy raz od poczatku jego mowy. Nic nie mowi. Nadal
    reczy. 6. WORLD MOVE - LICZENIE OD ZERA WYCIAGA NA WIERZCH RZECZ, KTORA BYLA W
    KANONIE OD DNIA PIERWSZEGO I NIKT JEJ NIE DOTKNAL. Wsrod rytej trzeciej sa sztuki
    z ROBOTA KONSEKRACYJNA - Boros wymienil je przy sortowaniu (event_turn_interlude_101)
    i nikt nie wrocil do tego, co one znacza. Wagowy odklada je na bok bez pytania,
    odruchowo, jak czlowiek, ktory to juz kiedys robil. Kesz komentuje krotko: przedmiot
    konsekrowany nie idzie tymi samymi kanalami co reszta, bo kupuje go inny rodzaj
    klienta i szuka go inny rodzaj ludzi. To jest ta sama kategoria, co relikwiarz
    lezacy u Lucana, o ktorym Seraphine powiedziala, ze rzecz, po ktora ktos sie zglosi,
    nie jest aktywem, tylko TERMINEM (event_turn_interlude_032). 7. STAN. 15:05 dnia
    trzeciego. Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow. Liczenie w toku,
    dwie trzecie anonimowe przesypywane na wage, ryta trzecia rozdzielona na swiecka
    i konsekrowana, odzwierni pozbierani z podlogi i milczacy, dwie swiece zapalone
    od nowa. Kwota nadal nienazwana. Pytanie Kesza wisi.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Kesz czeka na rozstrzygnięcie, którego Lucan unikał od dwóch dni:
    prawnik do obrony KARNEJ czy do KLASYFIKACYJNEJ - a na stole leży osobno stosik
    przedmiotów konsekrowanych, które nie idą tymi samymi kanałami co reszta łupu.'
