  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii.

    TRZECIA POZYCJA PADA I NATYCHMIAST ZDERZA SIE Z DECYZJA, KTORA SERAPHINE PODJELA

    PIETNASCIE MINUT TEMU. Ona to zderzenie widzi i rozstrzyga je w tej samej turze.


    0. NARRATOR PROSTUJE WLASNY BLAD Z t_231. Powiedzialem jej ustami "dysputa okolo

    szesnastu dni, przesluchanie dwanascie". To bylo zle. state/clocks.yaml:

    clock_father_arranges_academy_showing progress 3/15 ORAZ clock_guild_leadership_hearing

    progress 3/15 - OBA maja identyczna wartosc, czyli oba sa rownolegle. "Ok. 16
    dni"

    w polu effect zegara ojca to PROZA Z CHWILI PRZESTAWIENIA (8 -> 15 w t_022), a
    nie

    biezacy odczyt. LUCAN MA RACJE I MA JA CO DO LICZBY. Seraphine sprawdza i przyznaje.


    1. ODCZYT KOLMA JEST TRAFNY I NARRATOR NIE STAWIA MU ZADNEGO OPORU.

    ivar-kolm.yaml#role: reprezentuje stanowisko WASKIEJ definicji.

    #the_price_of_kolm: "waska definicja, gdyby wygrala, podcina golemy, homunkulusy,
    protezy

    i chowance, czyli WLASNA KATEDRE KOLMA - a on jest starszy i osadzony. Nikt takiej
    linii

    nie bierze dla dorobku. Bierze sie ja, kiedy przyszlosc lezy w ADMINISTRACJI.
    Zaplata

    Kolma to REKTORAT. Mechanizm: po zatrzymaniu wojenki ALBO PO ZAMIESZKACH wladze
    beda

    otwarte na zdjecie rektora ''ktory do tego doprowadzil'', a wtedy potrzebny jest
    nastepca

    proreligijny i konserwatywny, ktory publicznie stal po waskiej stronie."

    Gracz odtworzyl to co do mechanizmu, nie znajac tresci pliku. Zadnego nowego bytu
    nie

    trzeba i narrator zadnego nie dodaje (retcon_000058).


    2. CO SERAPHINE Z TEGO MA, A CZEGO NIE - DYSCYPLINA WIEDZY (retcon_000136).

    NIE MIALA NIC o Kolmie - audyt jej karty daje zero trafien na Kolma, Neris i dyspute

    ponad ogolniki z t_026b/029/030 (Akademia prowadzi spor, bedzie publiczna dyskusja,

    ludzie zwiazani z Kosciolem daza do ograniczenia badan). Nazwisko, katedra biomutantow,

    rektorat i mechanizm zaplaty przychodza do niej WYLACZNIE od Lucana w tej turze
    i tak

    zostaja zapisane: jako to, co uslyszala (retcon_000120), nie jako zweryfikowane.

    MA NATOMIAST WLASNY MATERIAL, KTORY DO TEGO PASUJE I NIE JEST WYMYSLONY:

    fact_seraphine_received_tannery_evidence - to ona dostala dokumenty dowodzace,
    ze

    wlasciciel garbarni znal skale zagrozenia wczesniej i probowal zlecic zniszczenie
    sladow.

    Wiec kiedy Lucan mowi "tematy podejrzanie podobne do tego, co bylo pod garbarnia",

    ona jest jedyna osoba w pokoju, ktora widziala tamte papiery.

    NARRATOR NIE DOMYKA TEGO POLACZENIA I NIE POTWIERDZA GO (retcon_000058). Zaden
    plik nie

    laczy katedry biomutantow z garbarnia. To zostaje HIPOTEZA, ktora ona nazywa hipoteza
    -

    i odnotowuje, ze wlasciciel garbarni mial na garbarza stanowczo za duzo (cztery
    sygnety

    i herb, tannery-owner.yaml#the_incongruity), wiec pytanie "kto nad nim stal" jest
    otwarte

    niezaleznie od Kolma.


    3. ZDERZENIE, KTORE JEST WLASCIWA TRESCIA TURY - I ONA ROBI SYNTEZE SAMA

    (retcon_000135 punkt d).

    Jesli zaplata Kolma uruchamia sie PO ZAMIESZKACH, to Kolm nie potrzebuje wygrac
    dysputy.

    Potrzebuje, zeby miasto sie zatrzeslo w okolicach jej daty.

    A CO SERAPHINE POSTANOWILA ZROBIC PIETNASCIE MINUT TEMU? Pojsc do kierownictwa

    z pieczeciami i zamowic zbrojny zakon na papierze gildii. Czyli OGLOSIC KRYZYS

    NEKROMANTYCZNY POD MIASTEM - dokladnie w oknie dysputy i przesluchania, ktore
    wlasnie

    okazaly sie tym samym oknem.

    JEJ WLASNY PLAN JEST DOSTAWA TEGO, CZEGO KOLM POTRZEBUJE. Zbrojny zakon na ulicach,

    panika przy cmentarzu i rektor, ktory "do tego dopuscil".

    NARRATOR NIE PODSUWA JEJ TRZECIEJ, CZYSTEJ DROGI. Nie ma jej.


    4. DECYZJA - PODJETA W TEJ TURZE, NAZWANA PO IMIENIU, JEDNA CENA (retcon_000135
    punkt a).

    OGLASZA MIMO TO. Priorytet trzeci z jej karty brzmi "trzy pieczecie i miasto"
    i stoi

    wyzej niz to, kto bedzie rektorem Akademii. Miasto, ktore przetrwa z Kolmem na
    rektoracie,

    jest lepsze od miasta, ktore nie przetrwa z obecnym.

    MOWI TO BEZ POCIESZANIA SIE: kupujemy Kolmowi rektorat i wiemy o tym z gory. To
    jest

    druga dzisiaj rzecz, ktora robi swiadomie brudno - po ukladzie ze Straza.

    CO ZOSTAJE OTWARTE I CZEGO NARRATOR NIE ROZSTRZYGA: czy da sie ogloszenie ustawic
    tak,

    zeby zamieszania bylo mniej, albo zeby przypisano je komu innemu. To jest robota,
    nie

    fakt, i nalezy do gracza.


    5. TERMINARZ - JEDYNA LICZBA, KTORA SIE TU ZMIENIA, I POCHODZI Z ZEGAROW, NIE
    Z NARRATORA.

    Dysputa i przesluchanie sa RUCHOME WZGLEDEM SIEBIE O DZIEN, nie o cztery dni.
    Praktycznie

    jedno okno. Pieczecie nadal bez zegara i bez terminu - i to sie w tej turze nie
    zmienia,

    bo pomiaru nie bylo.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie potwierdzil zwiazku katedry biomutantow z
    garbarnia.

    Nie podal nazwiska obecnego rektora ani zadnego szczegolu polityki uczelni ponad
    to, co

    stoi w ivar-kolm.yaml. Nie stworzyl zegara pieczeci ani nie przestawil zadnego
    istniejacego

    (retcon_000055) - zegary ruszaja sie same z uplywem czasu. Nie kazal Seraphine
    sprawdzic

    Kolma "od reki" ani wyprodukowac kontaktu na Akademii. Nie odwrocil niczego z
    t_228-231.

    Nie pozwolil jej uzyc ani jednego faktu spoza karty (retcon_000136).


    7. STAN. Czwarty dzien interludium, gabinet Seraphine, gorne pietro gildii.

    Obecni: Lucan, npc_seraphine_vale, npc_varkhen_mind (rog pokoju). Spidey i Tkacz
    przy

    Lucanie, zuk w kieszeni. Na blacie niedokonczona karta kontraktowa - puste ZAKRES
    i DATA.

    Varkhen 9,2/65. Lucan 19/19, energia bez wydatku - czytac z pliku.

    TRZY POZYCJE Z SIEDMIU PODANE: prawnik, dysputa, Kolm. Zadanie z t_122 ZAMKNIETE.

    '
  new_decision: 'Trzy pozycje podane, zadanie Seraphine z t_122 zamkniete. Ona sprawdza
