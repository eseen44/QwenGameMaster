  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Spidey sortuje (jest wyznaczonym sortujacym od rozkazu 015),
    Lucan ocenia. Kupka jest spora - okolo trzydziestu miekkich, skrzydlatych rzeczy
    - ale liczy sie nie wielkosc kupki, a to, ile ma CALE SKRZYDLA. 1. ROZKAZ PRZESZEDL,
    KATEGORYZACJA NIE - DOKLADNIE JAK ZAPISANO. W urobku sa cmy, ale tez muchy, komary,
    dwie zlotooki i - zgodnie z wlasnym zastrzezeniem Lucana z tury 078 - para motyli
    dziennych, ktore sa bezuzyteczne z powodu, ktory sam wtedy podal: lataja dniem,
    sa kolorowe i nie wchodza do budynkow. Czworka sieciarzy jest starsza i madrzejsza,
    wiec "miekkie i skrzydlate" przeszlo czysto; "gatunek" nadal nie przechodzi. 2.
    I TU WYCHODZI WADA METODY, KTORA NIE JEST WADA SIECIARZY. Sieciarz lowi w siec
    i gryzie. Dla zuka to bez znaczenia - chityna zniesie wszystko. Dla cmy skrzydla
    SA cala wartoscia, a skrzydla sa pierwszym, co niszczy siec i szczekoczuly. Z
    kilkunastu cm w kupce cale skrzydla ma CZTERY albo PIEC. Resztа jest cialem, nie
    lotnikiem. 3. ROZWIAZANIE JEST DARMOWE I NIE POTRZEBUJE ZADNEJ SLUGI. Cma sama
    leci do swiatla - to byl caly powod, dla ktorego Lucan ja zamowil. Lampa i sloik
    w baszcie zbieraja wiecej i CALYCH okazow niz czterech lowcow, bez rozkazu, bez
    propagacji i bez uwagi. Sieciarze nie sa do tego potrzebni w ogole; ich nocna
    rotacja moze wrocic do polowania na energie dla Varkhena. 4. ZNALEZISKO - JEDEN
    ZAWISAK. W kupce lezy duza cma zmierzchnicowa: gruby, masywny tulow, waskie mocne
    skrzydla, lot szybki i BEZSZELESTNY, potrafi zawisnac w miejscu i lata noca. Jest
    to lepszy kurier od osy na kazdej osi poza jedna: (a) nie brzeczy, wiec nie sciaga
    przemocy, (b) unosi wiecej, bo tulow jest grubszy - jest w nim miejsce na modyfikacje,
    ktorego u osy nie ma, (c) noc jest jego czasem pracy, nie utrudnieniem. Trafil
    do kupki CALY, bo jest za mocny, zeby sieciarz go poszarpal. 5. JEGO SLABOSC JEST
    DOKLADNIE TA, KTORA LUCAN MA CZYM ZALATAC. Zywi sie cukrem - nektarem, sokiem,
    gnijacym owocem - i musi WYCHODZIC, wiec na zamknietym posterunku glodnieje w
    trzy dni tak samo jak osa. Na stole leza akurat trzy porcje tlumiace rozklad (preparat
    plus dwie fiolki). Zbieznosc nie jest przypadkiem - to ten sam problem smyczy,
    ktory Lucan zmierzyl godzine temu. 6. DRUGIE, MNIEJ OCZYWISTE. Zawisak jest DUZY
    jak na cme. W nocy nikt go nie zobaczy; w dzien, jesli usiadzie na widoku, jest
    zjawiskiem, nie owadem. To okaz nocny i tylko nocny. 7. NIC NIE OZYWIONE. Urobek
    lezy przebrany na dwie kupki: cztery-piec cm z calymi skrzydlami plus zawisak
    na jednej, resztа jako material i karma na drugiej.'
  operations:
  - *id002
  new_decision: Zawisak lezy caly na blacie - najlepsze cialo kurierskie, jakie Lucan
    mial w rekach. Czy Lucan go ozywia teraz, czy zaklada najpierw lampe i sloik jako
    stale zrodlo calych okazow.
