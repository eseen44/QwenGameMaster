outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. INWENTARZ PRZYJETY I ROZBITY NA TRZY TEMPA PRZEZ PRYNCYPALA.
    (a) MATERIALY - czwartek, juz umowione, skrzynki z gwozdziami. (b) EGZOTYCZNE
    STWORZENIA - wykonalne i wieksze niz rzad zwierzecy na targu, ale wolne: zywy
    towar jest jedyna rzecza, ktora nie umie jechac po cichu, bo je, smierdzi i halasuje.
    Terminy w tygodniach, nie dniach. (c) ZAKAZANE PODRECZNIKI - najtrudniejsze i
    - to jest puenta - IDA TYM SAMYM KANALEM CO ROBOTA KONSEKROWANA lezaca w tej chwili
    osobno na stole: biblioteki prywatne, likwidacje spadkow, kolekcje po potepionych.
    Inny kupiec, inni ludzie, ktorzy tego szukaja. Stosik na blacie i lista Lucana
    okazuja sie jednym interesem. 2. LUCAN SAM NAZYWA SLABY PUNKT WLASNEJ DOKTRYNY,
    ZANIM ZROBI TO KTOKOLWIEK INNY. Kosciol spor akademicki przegra, ale nie przyjmie
    wyniku - de facto legalizacja praktycznej anatomii nie zostanie przelkniena. Pokrycie
    w plikach jest pelne: faction_lumaria_church.doctrine_and_enforcement ma necromantic_animal_or_vermin_modification
    jako doctrinally_condemned_without_secular_gray_zone. 3. ODPOWIEDZ PRYNCYPALA
    JEST NAJWARTOSCIOWSZA RZECZA, JAKA LUCAN USLYSZAL W TYM POKOJU, I NIE JEST POCIESZAJACA.
    Zgadza sie w calosci i przenosi problem z polki prawnej na polke bezpieczenstwa,
    czyli na wlasny jezyk. Kosciol, ktory przegrywa spor o definicje, nie sklada apelacji
    - precedens jest w rodzinie Lucana: ojca Inkwizycja potepila dwa razy, a potem
    ktos przyszedl do laboratorium osobiscie. Wniosek operacyjny: TEN ZAPAS NIE BEDZIE
    LEZAL W MIESCIE. Bedzie stal poza Lumaria i wchodzil na zamowienie. 4. CENA TEJ
    OSTROZNOSCI SPADA NA LUCANA I JEST PODANA WPROST. Po pierwsze czas - kazda rzecz
    ma teraz wyprzedzenie zamowienia zamiast lezec na polce. Po drugie slad: kazde
    zamowienie jest NAZWANYM ZYCZENIEM konkretnego czlowieka, a nie anonimowym zakupem
    z zapasu. Syndykat prowadzi zapis, bo zapis jest ich ubezpieczeniem - Mara mowila
    to trzy godziny temu i nic sie w tej sprawie nie zmienilo. 5. I RZECZ, KTORA ZMIENIA
    CHARAKTER TEJ RELACJI - ICH INTERESEM STAJE SIE ZYCIE LUCANA. Wylozone bez sentymentu:
    jesli Kosciol przejdzie z papieru na rece, celem bedzie Lucan, a zapas kupiony
    pod jego termin umiera razem z nim. Od tej chwili pryncypal ma powod, zeby Lucan
    przetrwal - transakcyjny, nie zyczliwy, i dlatego trwalszy. 6. WORLD MOVE - KESZ
    KLADZIE OBOK SIEBIE DWA ZDANIA LUCANA I PYTA, CZY TO JEST TO SAMO ZDANIE. Godzine
    temu: "w ciagu dwoch tygodni wywolam i rozwiaze w tym miescie wojne domowa". Przed
    chwila: "Kosciol nie przelknie tego wyniku". Kesz nie zgaduje na glos i nie doradza
    - pyta, bo od odpowiedzi zalezy, ile i czego pryncypal kupuje w tym tygodniu.
    7. DRUGI WORLD MOVE, POSIANY I NIEROZWINIETY. Pryncypal wspomina mimochodem, ze
    linia transportu cial od czasu cmentarza nie ma nikogo, kto by ja prowadzil -
    jest pusta i niczyja. Nie sklada oferty i nie pyta. Odnotowuje, patrzac na czlowieka,
    ktory ja oproznil. Kanon: faction_lumaria_criminal_networks ma exploit_power_vacuum
    wsrod interesow, a komorki sa rozproszone i NIE sa automatycznie sojusznikiem
    sieci Orena. 8. STAN. 15:40 dnia trzeciego. Energia 7.8 z 15, integralnosc 19
    z 19, bez warunkow. Kwota za zloto nadal nienazwana, liczenie stoi, konsekrowany
    stosik okazal sie czescia zamowienia Lucana, materialy na czwartek, zwierzeta
    w tygodniach, ksiazki bez terminu.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: Kesz pyta wprost, czy zapowiedziana wojna domowa i Kościół, który
    nie przełknie wyniku, to to samo zdanie - bo od tego zależy, co pryncypał kupuje
    w tym tygodniu.
