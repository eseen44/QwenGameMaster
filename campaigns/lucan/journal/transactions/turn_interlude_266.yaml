  turn_id: turn_interlude_266
  declared_action: 'LUCAN SKLADA SERAPHINIE RAPORT Z NOCY, CZTERY RZECZY. (1) VARKHEN
    SPI WE WLASNYM LOZU, tak jak go zastali za pierwszym razem; wytransportowanie
    go po linach do gory przez jednego czlowieka okazalo sie problemem. (2) ZEBY DOSTAC
    SIE DO PIECZECI, POTRZEBUJE KOGOS Z KILOFEM - preferowalby arcymaga magii ziemi
    z doswiadczeniem sztygarskim, ale jak sie nie da, to Boros tez da rade. (3) POKAZUJE
    RZECZ Z NISZY jako "znalezione w gratisie" i opisuje ja WLASNYMI SLOWAMI: raczej
    nieszkodliwa, chyba ze sie ja trzyma; moze byc cenna dla niewlasciwych ludzi;
    cos jak krysztal many, tylko z energii zycia, znaczy smierci - sam sie gubi w
    zeznaniach. (4) DODAJE, ZE NIE NALEZY JEJ ZOSTAWIAC NA CMENTARZU, BO WYBUCHNIE
    ALBO OZYJE, gdy zmagazynuje dosc energii, i ze przy odrobinie szczescia zrobi
    z niej wisiorek, pierscien albo rozdzke podobna do jej wlasnej.'
  actor_id: pc_lucan
  scope: execution
  stakes: 'CO JEST KANONEM, A CO TYLKO KWESTIA (retcon_000120): punkt 4 NIE MA POKRYCIA
    W PLIKACH. t_256 i t_257 ustalily, ze rzecz jest zbiornikiem bez obiegu, bez rozkladu
    i bez szwu, i ze CZYM JEST RYTUAL - sonda nie mowi. Nic nie mowi o wybuchu ani
    o ozywieniu. Wersja Lucana idzie wiec do state/secrets.yaml#cover_stories z truth_status
    i do knowledge Seraphiny jako TO, CO USLYSZALA - nigdzie indziej, a zwlaszcza
    nie do pliku opisujacego, jak rzecz dziala. CO SERAPHINE FAKTYCZNIE ODCZUWA: voice_contract#register
    - o magii mowi jak o pogodzie, bo widzi ja bez sprawdzania, "czuc to od progu"
    (magic_interception 82). Odsloniety przedmiot, ktory jest tak nasycony, ze przy
    nim grave sense przestaje byc narzedziem precyzyjnym (t_255), MUSI byc dla niej
    z dwoch metrow czyms bardzo wyraznym - i to jest INFORMACJA DLA GRACZA o tym,
    jak widoczna jest ta rzecz. Nie odczytuje z niej jednak ani rytualu, ani przeznaczenia;
    nie jest nekromantka. CZEGO JEJ NIE WOLNO: rozbierac wypowiedzi Lucana na punkty,
    wyliczac konsekwencji, moralizowac, grozic zatrudnieniem (retcon_000041) ani byc
    madrzejsza od gracza (she_is_not_an_oracle). Wolno jej natomiast nazwac raz, co
    ryzykuje sama - stopien, stanowisko, wspolwine. ARCYMAG ZIEMI: zaden plik nie
    stawia takiego w Lumarii ani w gildii, a w t_235 na prosbe o magow bojowych odpowiedziala
    "nie ma czym". Odmowa zasobu, ktorego nie ma, jest wiec zgodna ze stanem - ale
    nie wolno z tego robic blokady calej sprawy: kustodia, zlecenie i papier na robote
    przy cmentarzu sa WLASNIE ta waluta, ktora ona kontroluje. KUSTODIA: status_flag
    guild_basement_custody jest formalna, a Varkhen wyszedl juz w t_250 przy jej wlasnej
    otwartej rece - wiec to nie jest nowe przewinienie Lucana i narrator nie robi
    z tego zegara ani zarzutu.'
