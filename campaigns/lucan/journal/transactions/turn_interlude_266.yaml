outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'CZTERY RZECZY PODANE, TRZY PRZYJETE, JEDNA ODRZUCONA JAKO ZASOB, KTOREGO
    NIE MA. (1) VARKHEN: przyjela bez zarzutu i nazwala wylacznie swoja czesc - kustodia
    jest formalna, a on lezy dwa poziomy pod ziemia. Zaden zegar nie ruszyl; w t_250
    sama otworzyla mu drzwi, wiec to nie jest nowe przewinienie Lucana. (2) ARCYMAG
    ZIEMI: nie ma i nie mial go skad przybyc - spojne z jej wlasna odpowiedzia o magach
    bojowych z t_235 ("nie ma czym"). Kilof i ludzi MA. Pytanie, ktore postawila,
    jest jej rejestrem wprost (jurysdykcja, procedura): na jakiej podstawie ekipa
    gildii kopie noca na cmentarzu. NARRATOR NIE PODSUNAL ZA GRACZA jego wlasnego
    pomyslu na zlecenie - Lucan powiedzial o nim Varkhenowi w t_263, nie jej. (3)
    PRZEDMIOT: odslony reaguje u niej ODRUCHEM CIALA (reka do pieczeci bez patrzenia,
    voice_contract#body) i jednym pomiarem podanym jak pogoda: czuje go przez biurko,
    a przez plaszcz czula juz od progu i brala to za slad pracy kanalem z t_265. TO
    JEST TWARDA INFORMACJA DLA GRACZA o widocznosci rzeczy dla kazdego wyszkolonego
    antymaga. NIE odczytala z niej rytualu, przeznaczenia ani pochodzenia - nie jest
    nekromantka (retcon_000156). (4) "WYBUCHNIE ALBO OZYJE" NIE JEST KANONEM, TYLKO
    KWESTIA LUCANA (retcon_000120). Zapisane jako cover_lucan_calls_the_vessel_an_unstable_life_energy_crystal
    w state/secrets.yaml z truth_status i jako to, co Seraphine USLYSZALA. Pliki mowia
    wylacznie tyle, ze rzecz jest zbiornikiem bez obiegu i bez szwu, a czym jest rytual
    - sonda nie powie (t_256). Narrator nie uczynil z tej wersji faktu swiata ani
    jej nie obalil. JEJ PYTANIE NA KONIEC - kto jeszcze wie, ze to istnieje - jest
    jej agenda wprost (get_the_rest_of_lucans_undisclosed_list_before_the_hearing)
    i zostaje jako punkt decyzyjny. Odpowiedz zna gracz, a stan zna tylko jedna wersje:
    o dodatkowej emisji z tego miejsca wiedzieli Lucan i Oren, a Oren nie zyje (retcon_000163).'
  prose: 'Wysłuchała wszystkiego bez wchodzenia w słowo.


    - Wieczorem był w mojej piwnicy - mówi, kiedy Lucan kończy. - Teraz leży dwa poziomy

    pod cmentarzem, a na papierze nadal jest mój.


    Pióro zostaje tam, gdzie je odłożyła.


    - Arcymaga ziemi nie mam. Nie miałam go, kiedy pytałeś o magów bojowych, i przez

    tydzień mi nie przybył. Kilof mam. Ludzi mam. - Patrzy na niego spokojnie. - Powiedz

    mi tylko, na jakiej podstawie ekipa gildii kopie nocą na cmentarzu, jak ktoś zapyta

    rano.


    Potem Lucan odwija połę płaszcza.


    Seraphine nie wstaje, ale krzesło odjeżdża o dwie piędzi, a lewa ręka idzie do

    pieczęci przy pasie - bez patrzenia, odruchem, jakim się łapie poręcz na schodach.

    Zauważa to dopiero po fakcie i ręki nie cofa.


    - Zakryj - mówi ciszej niż przedtem. - Czuję to przez biurko. Przez płaszcz czułam

    od progu i wzięłam za twoją nocną robotę kanałem. Każdy, kto ma połowę mojego

    wyszkolenia, wejdzie do tego pokoju i powie ci, że coś tu jest.


    Czeka, aż płaszcz wróci na miejsce. Kiedy wraca, mówi dalej tym samym wolniejszym

    tempem, w którym u niej nie ma nic uspokajającego.


    - Ma wybuchnąć albo ożyć. Dobrze. - Odchyla się. - Różdżki z tego nie zrobisz

    w moim pokoju i nie zrobisz jej w gildii.


    I dopiero teraz pytanie, po które odłożyła pióro kwadrans temu:


    - Pytam raz. Kto jeszcze wie, że to istnieje?

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs: []
  operations:
  - *id002
  scene_update: null
  new_decision: 'Gabinet Seraphiny, 23:07. Rzecz widziana i WYCZUWALNA - czuje ja
    przez biurko, a przez plaszcz czula od progu; kazdy wyszkolony antymag pozna,
    ze cos jest w pokoju. Arcymaga ziemi nie ma, kilof i ludzi ma, ale chce wiedziec,
    na jakiej podstawie gildia kopie noca na cmentarzu. Roboty przy rzeczy zabrania
    u siebie i w gildii. I pyta raz: kto jeszcze wie, ze to istnieje.'
