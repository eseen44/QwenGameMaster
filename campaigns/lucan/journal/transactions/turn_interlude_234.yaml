  summary: 'Bez testu - interludium, roll_policy disabled. Siedem minut, zero energii.

    GRACZ ROZBIJA REGULE, KTORA NARRATOR USTANOWIL W t_227, I MA RACJE CO DO PLIKU.

    Tura sciaga jeden warunek konieczny z planu i przenosi caly watek Aktu 1 z rejestru

    prawnego do politycznego.


    0. NARRATOR PROSTUJE WLASNE ORZECZENIE (retcon_000138). W t_227 i t_233 padlo,
    ze

    zeznanie Varkhena "nie jest cytowalne". Bylo to zlepienie prawa z ekspozycja.

    AUDYT: necromancy-law#legal_baseline kryminalizuje TWORZENIE, UTRZYMYWANIE i KONTROLE

    nieumarlych - nie rozmowe; theoretical_knowledge_and_prior_education:

    not_illegal_by_itself. clock_inquisition_attention.trigger wymaga FORMALNEJ ESKALACJI

    albo JAWNOSCI, a wewnetrzna dokumentacja gildii nie jest ani jednym, ani drugim.

    A varkhen_exposure.ancient_guardian_cover_story jest wprost skrojona pod cytowanie:

    trzyma sie, dopoki kontrola i utrzymywanie pozostaja NIEDOWIEDZIONE, a Varkhen

    wspolpracuje DOBROWOLNIE - a milestone_046 jest paktem, nie wiezami.

    WNIOSEK: VARKHEN JEST CYTOWALNY jako pradawny straznik nekropolii skladajacy dobrowolne

    zeznanie. Niecytowalne jest jedno zdanie - "nieumarly, ktorego Lucan kontroluje".

    Ograniczeniem nie jest ZRODLO, tylko BRZMIENIE.


    1. SERAPHINE PRZYJMUJE TO BEZ OBRONY WLASNEJ POZYCJI I TO JEST ZGODNE Z KARTA,
    NIE

    ustepstwem narratora. portrayal.she_is_not_an_oracle pozwala jej sie mylic i przecenic

    wlasna oslone; she_is_a_co_conspirator_not_a_lawful_paragon mowi, ze klamstwo,

    niedopowiedzenie i zatajenie sa dla niej NARZEDZIAMI, a kalkuluje ryzyko, nie
    moralnosc.

    Postac, ktora liczy ekspozycje, a nie skrupuly, slyszy w argumencie Lucana poprawke

    rachunku - i przelicza. Grana inaczej byla grana wbrew karcie (zarzut gracza,

    retcon_000138).


    2. CO Z TEGO SPADA Z PLANU. Kolejnosc z t_233 (pomiar -> cytowalny material ->

    ogloszenie -> rama -> Varkhen ustnie) PRZESTAJE BYC WARUNKIEM KONIECZNYM. Nie
    potrzebuje

    pomiaru, zeby wejsc do kierownictwa ze wspolpracujacym pradawnym straznikiem i
    trzema

    pieczeciami. POMIAR ZOSTAJE POTRZEBNY DO INNEJ RZECZY I ONA TO NAZYWA: do dwoch
    pustych

    pol na karcie kontraktowej. Zbrojny zakon zamawia sie na ZAKRES i DATE, a nie
    na

    "cos jest pod cmentarzem". Ogloszenie idzie wiec wtedy, kiedy bedzie miala brzmienie,

    a nie kiedy bedzie miala liczbe.


    3. PRZERAMOWANIE KOLMA - LADUJE I MA MOCNE POKRYCIE W AKCIE 1.

    planning/act-03-anticipated-shape#watek_garbarni_dwaj_wlasciciele (canon_status:

    MA_MOCNE_POKRYCIE_W_AKCIE_1): poprzedni wlasciciel prowadzil NIELEGALNA HODOWLE
    OKAZOW -

    Komora III z dostepem technicznym, sluza, harmonogram karmienia "Okazy niestabilne.

    Karmic wylacznie po zamknieciu sluzy", nocne transporty i dolny sklad BEZ KSIEGOWANIA

    MIEJSKIEGO. Nastepstwa sa w plikach co do sztuki: garbarnia EWAKUOWANA, gildia
    wyslala

    EKIPE A-RANK do zamkniecia podziemi, miasto ZAMROZILO CZESC MAJATKU, a inspektor
    gildii

    (npc_halven_rusk) o wlos nie zginal pod szczuroogrem.

    Wiec teza gracza, ze to sprawa o niezabezpieczone badania i zmarnowane srodki,
    a nie

    o nekromancje, jest ODCZYTEM Z PLIKU, nie retoryka - i narrator nie stawia jej
    oporu

    (retcon_000033).


    4. JEDNA POPRAWKA FAKTOGRAFICZNA, KTOREJ NARRATOR NIE MOZE PRZEMILCZEC (retcon_000058).

    "SMIERC PRZYNAJMNIEJ KILKU LUDZI" NIE MA POKRYCIA. Milestones 018-022 nie zapisuja
    ani

    jednej nazwanej ofiary ludzkiej: Rusk PRZEZYL, wlasciciel PRZEZYL katastrofe,
    grupa

    wyszla. Narrator nie dopisuje trupow, ktorych nie ma, i nie pozwala Seraphine
    ich uzyc.

    CO JEST NATOMIAST W PLIKU I JEST MOCNIEJSZE, BO UDOKUMENTOWANE: ewakuacja zakladu,

    ekipa A-rank, zamrozony majatek, o wlos uratowany inspektor oraz dokumenty dowodzace,

    ze wlasciciel ZNAL SKALE ZAGROZENIA WCZESNIEJ i probowal zlecic zniszczenie sladow

    (milestone_022). W rejestrze politycznym "wiedzial i kazal zatrzec" bije "byly
    ofiary".


    5. "TO NIE BYLY SZCZURY" - PRAWDA I TO NIE JEST NADINTERPRETACJA.

    milestone_018: pod garbarnia byly ARCHIWUM, KOMORA III, LABORATORIUM oraz PRZYKUTY

    ZMUTOWANY OBIEKT EKSPERYMENTALNY. Zrodlo Aktu 1 mowi wprost, ze grupa oczyszczala
    komory

    "ze szczurow I GHULI" - a ghul jest humanoidem z ludzkiego ciala. Do tego szczuroogr,

    opisany jako ogromny mutant. Skala humanoidalna jest wiec w plikach, nie w tezie
    gracza.

    CZYM TE OKAZY BYLY WCZESNIEJ - NIEUSTALONE I NARRATOR TEGO NIE ROZSTRZYGA. Gracz
    sam

    nazwal to poprawnie: w rejestrze politycznym niejednoznacznosc wystarcza, bo

    necromancy-law#information_rule mowi, ze podejrzenie, wiedza prywatna, dowod

    instytucjonalny i fakt publiczny sa ODREBNYMI STANAMI, a zwycieska interpretacja
    zalezy

    od sily i koalicji.


    6. CO ONA DOKLADA ZE SWOJEGO - DWIE RZECZY, OBIE Z KARTY.

    (a) SPRAWA GARBARNIKA JEST FORMALNIE OTWARTA I NIKT JEJ NIE PROWADZI

    (fact_seraphine_told_lucan_the_tannery_case_is_open), a dokumenty ma ONA

    (fact_seraphine_received_tannery_evidence). Odpowiedzialnosc polityczna nie potrzebuje

    nowego przepisu - potrzebuje otwartej teczki i kogos, kto podpisze sie pod nazwiskiem.

    Teczka jest otwarta.

    (b) DZWIGNIA, KTORA DALA MU W t_032 I KTOREJ NIE UZYL: dom przypisany do otwartego

    postepowania mozna legalnie przeszukac Z NAKAZEM (tannery-owner#the_lever_seraphine_

    handed_over). Droga stoi otworem do dzis.

    CZEGO NIE ROBI: nie potwierdza zwiazku Kolma z garbarnia (zaden plik go nie laczy)

    i nie produkuje kontaktu na Akademii.


    7. JEDNA CENA, NAZWANA RAZ (retcon_000135 punkt a i b - poprzednia tura tej postaci

    konczyla sie decyzja, ta konczy sie decyzja).

    Otwarcie teczki garbarni wprowadza z powrotem do pokoju npc_halven_rusk - a wewnetrzne

    sledztwo podwazajace jego kompetencje istnieje dlatego, ze zeznali Lucan, Mara
    i Boros

    (fact_seraphine_knows_rusk_inquiry_origin). Kto wraca do garbarni, wraca tez do
    tego,

    kto na Rusku stanal. To wszystko, co ona ma prawo o tym powiedziec - suspicion
    o

    sabotazu szczuroogra siedzi na KARCIE RUSKA (confidence: medium), NIE na jej,
    i narrator

    jej tego nie wklada w usta (retcon_000136).


    8. VARKHEN - DEKLARACJA WYKONANA, BEZ INSCENIZACJI OPORU.

    Plaszcz byl ustalony w t_230 jako czesc planu (fact_varkhen_transport_plan_night_street:

    noca, normalnie ulica, plaszcz narzucony na zbroje). Nie powstaje godzina policyjna,

    nie powstaje nocny straznik do przetestowania deklaracji o umysle (retcon_000055
    i

    retcon_000033), nie powstaje zegar. Uprzedzenie zostalo powtorzone i zostaje odnotowane

    jako uprzedzenie, drugi raz - warunek Seraphine z t_044 nadal spelniony.

    JEGO WLASNY BEAT: pytany o cytowalnosc siebie samego, odpowiada w slowniku przysiegi
    -

    zeznanie zlozy, bo tak brzmi uklad, ktory przyjal dobrowolnie. NARRATOR NIE DOPISUJE
    MU

    opinii o gildii, o Kosciele ani o tym, co potem.


    9. CZEGO NARRATOR TU NIE ZROBIL. Nie potwierdzil ofiar ludzkich w Akcie 1. Nie
    nazwal

    rodu z herbu. Nie potwierdzil zwiazku Kolma z garbarnia. Nie rozstrzygnal, czym
    byly

    okazy przed mutacja. Nie dal Kolmowi wiedzy o Lucanie. Nie zainscenizowal nikogo

    z kierownictwa gildii ani nocnej Strazy. Nie stworzyl zegara pieczeci ani daty

    ogloszenia. Nie wlozyl Seraphine w usta podejrzenia z karty Ruska. Nie zabral
    sygnetu

    z biurka za gracza - Lucan go nie podniosl, wiec lezy tam dalej.


    10. STAN. Czwarty dzien interludium, 17:54:40, gabinet Seraphine. Obecni: Lucan,

    npc_seraphine_vale, npc_varkhen_mind. Na biurku: karta kontraktowa z pustymi ZAKRES

    i DATA oraz sygnet z jeleniem, ktory Lucan zostawil. Varkhen 9,2/65, plaszcz na
    zbroi.

    Lucan 19/19, energia bez wydatku - czytac z pliku. Wyjscie pod trzecia pieczec

    zadeklarowane na dzisiejsza noc; nikt jeszcze nie wyszedl z budynku.

    '
