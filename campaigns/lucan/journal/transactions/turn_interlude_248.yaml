  prose: 'Na "prostodusznego" Kesz nie odpowiedzial, bo nie ma zwyczaju bronic sie
    przed komplementami wypowiedzianymi od tylu. Odpowiedzial na to drugie, bo to
    drugie bylo wreszcie odpowiedzia na jego pytanie sprzed kwadransa: nie negocjowac,
    nie kupic, nie przycisnac i nie zniszczyc, tylko przekonac, ze sie jest czyjas
    jedyna nadzieja. Piata opcja, ktorej sam nie wymienil. Zauwazyl na glos, ze Lucan
    powiedzial mu przy tym, iz jego samego zrobil tak samo - i ze czlowiek, ktory
    to mowi swojemu prawnikowi w twarz, albo jest bardzo szczery, albo bardzo pewny,
    ze to nic nie zmienia. Na "bedziemy bogaci" nie rozchmurzyl sie ani troche; powiedzial
    tylko, ze bogaci tez stoja przed sadem, po prostu lepiej ubrani, i zeby Lucan
    przyniosl papiery. Potem zgasil ostatnia lampe. Powrot przez Lumarie zajal dwadziescia
    minut i byl zupelnie zwyczajny - o tej porze miasto sklada stragany i nikt nie
    patrzy na czlowieka w plaszczu. W glownej sali gildii okienko recepcji bylo juz
    zabite deska, a na gorze czekal Varkhen, w plaszczu, tak jak stal cztery godziny
    wczesniej.'
  summary: 'Bez testu - interludium, roll_policy disabled. Dwadziescia dwie minuty,
    zero energii,

    zero srebra. SCENA U KESZA ZAMKNIETA, LUCAN W GILDII. Pytanie o kaplana odpowiedziane

    mimochodem i jest to odpowiedz spoza listy.


    1. ODPOWIEDZ NA PYTANIE Z t_244 - PADLA, I TO JEST PIATA OPCJA. Kesz wymienil
    cztery

    pokoje: negocjowac, kupic, przycisnac, zniszczyc. Lucan podal piaty: PRZEKONAC
    KAPLANA,

    ZE JEST JEGO JEDYNA NADZIEJA - i zaznaczyl, ze zrobi to TAK SAMO, JAK ZROBIL TO
    KESZOWI.

    Jest to spojne z jego wlasna deklaracja metody z t_246 (manipuluje zamiast grozic,

    a swiadomosc nie pomaga) i narrator nie zamienil tego w zadna z czterech kategorii
    Kesza.

    ZAPOWIEDZIANA WSPOLNA KONSULTACJA KESZ + KAPLAN - jako PLAN, nie jako umowione

    spotkanie. Kaplan nie odpowiedzial jeszcze na wiadomosc (t_244:

    fact_kesz_sent_word_to_the_priest, odpowiedzi brak), wiec nic sie tu nie umowilo

    i zadnego terminu nie ma. To jest deklaracja intencji do

    planning/lucan-leads.yaml / state/objectives.yaml, nie wykonanie.


    2. UWAGA KESZA - KROTKA, BO LUCAN JUZ WYCHODZIL. agenda#assess_whether_lucan_is_a_liability

    dalej pracuje: odnotowal, ze klient powiedzial mu w twarz, iz zastosowal na nim
    te sama

    technike, i nazwal to bez emocji - albo bardzo szczery, albo bardzo pewny, ze
    to nic nie

    zmienia. NIE wyciagnal wniosku na glos, NIE zerwal umowy i NIE wycofal sie

    z przesluchania. Na "bedziemy bogaci" nie dal sie rozchmurzyc (speech_traits:
    precyzyjny

    i bez sentymentu, zero ozdobnikow) i zamknal jedynym zadaniem, ktore ma otwarte

    i konkretne: zeby Lucan przyniosl papiery.


    3. POWROT. loc_lumaria_market#zone_market_back_alleys -> loc_lumaria_adventurers_guild.

    Dwadziescia minut marszu plus dwie minuty na pozegnanie i wyjscie - dokladnie
    tak samo

    jak w t_239 w druga strone (system/pacing.md, retcon_000042: przejscie przez to
    miasto

    to okolo dwadziescia minut, nie godzina). Spidey i webber_anchored przy Lucanie,
    ukryci.

    Nic po drodze sie nie wydarzylo i narrator niczego po drodze nie postawil - napiecie
    0,

    zaden zegar nie dziala, a wynik "complicated" wymagalby zrodla (AGENTS.md pkt
    8).

    W glownej sali okienko recepcji zabite deska i nocny urzednik na dyzurze -

    locations/lumaria-guild#zone_guild_main_hall, opis z pliku, nie wymyslony.


    4. VARKHEN CZEKA I NIC MU SIE NIE DOPISUJE. fact_varkhen_accepted_the_postponement_to_night

    (t_237): stal juz w plaszczu, uslyszal "jeszcze nie", przyjal bez skargi i bez
    pytania

    o powod; plaszcz ma na sobie od t_234. Narrator NIE dopisuje mu ulgi, niecierpliwosci,

    opinii o zwloce ani planu na te godziny - "co potem" nadal zostaje puste

    (retcon_000142). Nie wyszedl z budynku, bo nikt mu tego nie kazal.


    5. CZEGO NARRATOR NIE ZROBIL. Nie umowil spotkania z kaplanem i nie wyznaczyl
    terminu -

    data nie jest Kesza do dania (t_113, t_193). Nie rozstrzygnal, co Kesz zdecyduje
    do rana

    (t_247). Nie ruszyl Halveka: captured_alive, loc_guild_holding_cells. Nie ruszyl
    zegarow

    3/15. Nie postawil zadnego zdarzenia na drodze przez miasto. Nie wypuscil niczego

    z forbidden_without_source [lucan_necromancy, spidey_existence, varkhen_existence,

    veyr_house_structure]. oren_connection.lucan_said_it_out_loud BEZ ZMIAN.


    6. STAN NA ZAMKNIECIE SCENY. Czwarty dzien interludium, 19:53, glowna sala gildii.

    Obecni: Lucan, companion_spidey i webber_anchored (ukryci); npc_varkhen_mind czeka
    na

    gorze w plaszczu. Lucan 19/19, energia bez wydatku - czytac z pliku. Sygnet przy
    nim.

    Pieczec, klucze i papiery garbarnika NADAL w zone_wall_void Opuszczonej baszty
    przy

    murze - trzy kwadranse marszu (t_086), a Lucan obiecal je Keszowi.

    OTWARTE NA NASTEPNA SCENE: wyjscie pod trzecia pieczec z Varkhenem tej nocy; decyzja

    Kesza do rana; nazwisko urzednika akt (Malen Corth, Lucan je ma); termin papierow;

    udzial pokoju; odpowiedz kaplana; czyja twarz kupuje garbarnie.

    '
  new_decision: Lucan jest w gildii, na gorze czeka Varkhen w plaszczu, a noc pod
    trzecia pieczec jest zaplanowana. Scena u prawnika zamknieta - nastepny ruch to
    wyjscie w noc albo cokolwiek, co Lucan chce zrobic w gildii przedtem.
