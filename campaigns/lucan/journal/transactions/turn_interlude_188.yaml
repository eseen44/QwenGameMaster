  - *id002
  summary: 'Bez testu - osiem minut, zero energii. Tura oparta na retcon_000122 (trzy
    korekty gracza).

    Lucan przychodzi po ZLECENIA i nie dokłada niczego przed spotkaniem ze Straza.


    1. ZAKRES, KTORY OBOWIAZUJE OD TEJ TURY. Z siedmiu dzwigni z t_122 Seraphine wziela
    na

    siebie DWIE: sprawdzic pozycje 5 (urzednik magistratu kopiacy pod garbarnia) i
    ogarnac

    pozycje 1 (pioro, wykonane w t_123/125). O reszcie NIE CHCE SLYSZEC przed dzisiejszym

    spotkaniem ze Straza. Narratorowi nie wolno wiec podsuwac jej kaplana, prawnika,
    dysputy

    ani Varkhena w tej scenie - to jej wlasna doktryna wiedzy, nie unik.


    2. SPOTKANIE ZE STRAZA JEST DZIS I JESZCZE PRZED NIA. Idzie tam wiedzac, ze wywoz
    cial

    z Lumarii prowadzi Straz (fact_seraphine_knows_the_watch_runs_the_corpse_line,
    t_120)

    i ze zrodlo tej wiedzy jest CALKOWICIE NIECYTOWALNE. Do tego wie, ze NIE MOZE
    PRZEKAZAC

    IM ZATRZYMANYCH - oddanie swiadkow instytucji prowadzacej ten interes jest oddaniem
    ich

    drugiej stronie. Idzie wiec na spotkanie, na ktorym ma byc wiarygodna wobec ludzi,
    o

    ktorych wie najgorsza mozliwa rzecz i nie moze jej nazwac.


    3. ZLECENIE PIERWSZE - LANCUCH AUTORYZACJI. Doszla do konca i wie, ze ma racje.
    Lancuch

    idzie w gore Strazy Miejskiej. Nie da sie tego napisac: jedyne, co domyka dowod,
    przyszlo

    z pokoju powroznika, ktorego nie moze nazwac, od czlowieka, ktorego nie moze wystawic.

    Papier idzie na blankiecie gildii i pod jej nazwiskiem. Ma wiec WNIOSEK bez SRODKA.


    4. ZLECENIE DRUGIE - GOSPODARSTWO STRAZNIKA, NIETKNIETE I TO JEST WYKONANIE, NIE
    ZANIEDBANIE.

    Warunek postawila ona sama w t_052: nie szuka losowo rodzin szlacheckich, nie
    kontaktuje

    sie z bliskimi straznika, najpierw podpisy, obsada i zrodlo rozkazow. Podpisy
    i obsada

    ma. Pod niczyje drzwi nie poszla i mowi to wprost, zeby Lucan nie odkryl tego
    sam.


    5. CZLOWIEK Z ATRAMENTEM WRACA I JEST W PLIKU OD DNIA PIERWSZEGO. t_051: Halvek
    opisal

    kontakt Orena - bez munduru i bez broni, ciemny miejski plaszcz, skorzana teczka
    na

    dokumenty, PLAMA ATRAMENTU NA LEWYM KCIUKU, spotkania PRZED WYJAZDAMI, a funkcjonariusz

    przy zaporze skinal mu glowa PIERWSZY. Nazwiska ani urzedu Halvek nie zna.

    KANDYDAT, KTORY SIE NARZUCA I KTOREGO NARRATOR NIE ZAMYKA: npc_rovan_kesz - po

    piecdziesiatce, ubrany jak urzednik ze sredniej polki, teczka, atrament - a

    lead_priest_is_the_converging_target mowi wprost, ze po spotkaniach z Keszem Oren

    ZMIENIAL TRASY. ROZBIEZNOSC ZOSTAJE NA WIERZCHU: karta Kesza mowi atrament na
    PALCU

    WSKAZUJACYM, Halvek widzial LEWY KCIUK. To nie jest identyfikacja (retcon_000058).

    Seraphine tego skojarzenia NIE ROBI, bo nie zna Kesza z wygladu ani z nazwiska.


    6. CO ROBI PYTANIE "JAK SIE TRZYMASZ" - I DLACZEGO NIE JEST DROBIAZGIEM.

    rel_seraphine--lucan i cala jej karta pokazuja czlowieka, ktory dostaje od Lucana
    zadania,

    ryzyko i listy. Nikt jej dzis nie zapytal, jak wchodzi na to spotkanie. Nie rozczula
    sie

    i nie dziekuje - odpowiada rzeczowo, bo tak odpowiada na wszystko. Ale odpowiada.


    7. LUCAN NIC NIE DOKLADA I ONA TO ZAUWAZA. Przyszedl z trzema ksiazkami i zwitkiem

    kartek, o ktorych nie powiedzial ani slowa, i nie polozyl przed nia niczego nowego
    przed

    spotkaniem. To jest dokladnie ta rzecz, o ktora prosila w t_126 - "chce miec liste
    rzeczy,

    ktorych nie znam, i ta ma na niej zostac". Pierwszy raz ktos jej to dal bez proszenia.


    8. CZEGO NARRATOR NIE ROBI. Nie stawia terminu spotkaniu ze Straza, nie robi z
    niego

    zegara, nie zapowiada, ze cos tam pojdzie zle, i nie domyka tozsamosci czlowieka

    z atramentem. Zadne z tego nie stoi w pliku.


    9. STAN. Czwarty dzien interludium, 11:28, gabinet Seraphine. Energia 10,35/15,

    integralnosc 19/19, bez warunkow. Zegary bez ruchu poza uplywem czasu. Oba zlecenia

    z t_052 odebrane. Zaden termin nie powstal. Targ po introligatora nadal otwarty.'
  new_decision: Seraphine oddala oba zlecenia i idzie na spotkanie ze Straza. Lucan
    ma opis czlowieka z atramentem na lewym kciuku, wniosek o lancuchu, ktorego nie
    da sie napisac, i nietknięte gospodarstwo straznika. Zostaje w gabinecie i mowi
    jej cos przed wyjsciem, wychodzi na targ po introligatora, czy robi cos z samym
    opisem kontaktu?
