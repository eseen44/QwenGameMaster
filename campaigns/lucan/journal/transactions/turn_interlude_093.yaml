    pool: lucan_necrotic_energy
    units: 1.0
  - *id002
  summary: 'Rzut roll_turn_interlude_093: naturalna 58, po modyfikatorze rozsiewu
    bez celowania 48 przy progu 20 - przechodzi spokojnie, bez krytyka. Dziesiec minut
    w glownym holu, okolo dziesieciu cantripow, jedna jednostka rezerwy. 1. CZESC,
    KTORA JEST MADRA, I NIKT JEJ TAK NIE NAZWAL. "Upewniam sie, ze wszyscy widza,
    ze tu jestem" trafia dokladnie w dziure, ktora Seraphine nazwala w turze 072:
    umie zrobic pomiete lozko i zuzyta miske, NIE UMIE wyprodukowac czlonkow gildii,
    ktorzy pamietaja, ze go tam widzieli - przykrywka wytrzyma przeszukanie, nie wytrzyma
    rozpytywania. Lucan wlasnie zaczal produkowac to sam, i jest jedyna osoba, ktora
    moze. Nie kosztowalo nic. Rano dnia trzeciego w holu jest ruch: tablica zlecen,
    okienko recepcji, dwie druzyny czytajace ogloszenia, tragarz ze skrzyniami. Urzednik
    wita go po nazwisku przy okienku, przy swiadkach. To jest slad, ktorego rota sprzatania
    nie zrobi. 2. PECHY IDA I NIC SIE NIE SKLADA. Pomniejsza klatwa pecha to cantrip
    klasy 0,1 - subtelny, szybki, zwykle odczytywany jako zbieg okolicznosci. Rozsiane
    bez wyboru celu po holu daja to, co daja: pekniety rzemien u torby, atrament,
    ktory przeskakuje w pol slowa, but zaczepiony o wystajaca plyte, rog skrzyni,
    ktory zsuwa sie tragarzowi z kolana, rachunek, ktory dwa razy nie chce sie zgodzic.
    Kazda z tych rzeczy osobno jest poniedzialkiem. Zaden zapis nie zostal zniszczony,
    nikt nie zostal ranny, nic nie uderzylo w nic, czego Lucan potrzebuje - limit
    outcome_may_harm_the_situation nie zapalil sie przy 48. 3. NIKT NIE ZAUWAZYL,
    I TO NIE JEST SZCZESCIE, TYLKO KANON. system/curses.md: mag moze zauwazyc, ze
    JEGO ktos przeklina; zauwazenie, ze ktos rzuca klatwe z opoznionym dzialaniem
    na KOGOS INNEGO, jest znacznie trudniejsze i nie jest domyslne. W holu nie bylo
    nikogo, kto by tego szukal, bo klatwy uchodza w tym swiecie za slabe i nikt sie
    przed nimi nie zabezpiecza. 4. UBOCZNY SKUTEK, KTORY JEST FAKTYCZNIE UZYTECZNY
    - PODNIESIONE TLO. Wzorzec dowodowy potrzebuje sygnalu ponad tlem. Gildia ma od
    dzis rano, w ktorym mnostwo drobiazgow poszlo nie tak bez autora. Jesli Lucan
    kiedykolwiek bedzie musial rzucic pecha w tym budynku CELOWO, bedzie to lezalo
    w szumie, ktory sam wyprodukowal. Nie planowal tego. Ma to. 5. I RZECZ, KTORA
    NAPRAWDE ZOSTALA W GLOWACH - NIE PECHY, TYLKO NUCENIE. Ludzie nie zapamietali,
    ze cos im sie stalo. Zapamietali CZLOWIEKA, ktory szedl przez hol i podspiewywal
    sobie pod nosem. Lucan prosil o pamietalnosc i dostal ja w calosci; nie dostal
    tego RODZAJU pamietalnosci, ktory zaprojektowala Seraphine. Jej przykrywka brzmi
    "nudny czlowiek, ktory uczy sie do przesluchania". Jego brzmi teraz "ten, co nuci".
    Za trzynascie dni ktos bedzie zadawal ludziom w tym holu pytania i to jest zdanie,
    ktore uslyszy, bo jest barwne, a barwne zdania wracaja pierwsze. 6. OSTRY KONIEC
    - JEDEN Z CZWORKI. Przez hol prowadzono wlasnie na gore jednego z czterech ocalalych
    - wspolpracujacych swiadkow, ktorych pokoj wychodzi na ten sam korytarz zatrzyman
    co cela Lucana. Minal go w odleglosci trzech krokow i przyjrzal sie dokladnie.
    To jest jedyny czlowiek w tym holu, ktorego kto s NA PEWNO zapyta, co widzial,
    i ktory juz wczesniej znal godziny Lucana, jego wejscia i to, ze mieszka pod ziemia.
    Teraz ma do tego obrazek. 7. STAN. 09:10 dnia trzeciego. Energia 13,5 z 15, integralnosc
    19 z 19, bez warunkow. Boros i Mara nadal dzisiaj. Dwa pajaki nadal w pudelku
    w celi, Tkacz i zawisak nadal w baszcie, linia obrony nadal nie wybrana.'
  new_decision: Lucan stoi w glownym holu gildii, widziany, przywitany po nazwisku
    i zapamietany. Swiadek wlasnie zniknal na schodach. Do spotkania z Borosem i Mara
    zostaly godziny.
