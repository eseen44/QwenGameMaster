outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Lucan wchodzi do osobnego pomieszczenia Varkhena. Varkhen nie słyszał
    treści przesłuchania przez kamienne drzwi, tylko ruch w piwnicy. Jest ciężko uszkodzony
    i wyczerpany, ale nie załamany; traktuje obecny układ jako nadal obowiązujący.
    Nie zna współczesnej Lumarii ani gotowej kryjówki. Odradza powrót na cmentarz,
    bo miejsce jest obserwowane i związane z jego przysięgą. Proponuje metodę, nie
    adres: dopóki jest uszkodzony, można przewieźć go jako ciężką kamienną rzeźbę
    lub zabytek w skrzyni do nudnego prywatnego magazynu albo posesji z piwnicą, a
    nie do kolejnego grobowca. Podkreśla, że potrzebuje miejsca zamykanego, niekoniecznie
    świętego.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position
    value:
      location_id: loc_lumaria_guild_basement
      zone_id: zone_temporary_holding
      formation: speaking_with_varkhen
  - op: set
    instance_id: companion_spidey
    path: position
    value:
      location_id: loc_lumaria_guild_basement
      zone_id: zone_temporary_holding
      formation: concealed_with_lucan
  - *id002
  new_decision: 'Varkhen nie ma gotowego adresu, ale daje praktyczny plan transportu
    i kryjówki: udawać zabytkową rzeźbę, szukać nudnej posesji lub magazynu z piwnicą,
    nie cmentarza. Lucan może dopytać o wymogi Varkhena, zaplanować taki transport
    albo zostawić go na noc w Gildii.'
