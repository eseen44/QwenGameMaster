  - *id002
  summary: 'Bez testu. Pierwszy trwaly krok wzrostu w tej serii - spy_cellar_spider_01
    dostaje gruczol przedny z zywego jedwabnika i przestaje byc zwyklym pajakiem piwnicznym.
    1. PRZESZCZEP SIE PRZYJMUJE. permanent_growth_steps 0 -> 1. Kolejny krok dla tego
    okazu bedzie kosztowal 12 (8 x 1.5^1). 2. JEDWAB DAJE DOKLADNIE TO, CO GRACZ CHCIAL,
    I TO Z POWODU SWOJEJ WADY. Jedwabnik przedzie nic ciagla, mocna, obfita i NIELEPKA,
    bez kontroli wyrzutu (canon, item_live_silkworms). Na lapanie czegokolwiek jest
    wiec bezuzyteczna - i wlasnie dlatego nadaje sie na siec GESTA i WIDOCZNA. Alarm,
    ktory czyta sie OKIEM, nie wymaga zadnego pasma: Seraphine nie musi niczego odbierac,
    wystarczy, ze patrzy na kurtyne i widzi, ze jest przerwana. Najtansze mozliwe
    lacze w calym projekcie, bo zadne. 3. CENA JEST TA SAMA OSMIOKA, KTORA MIAL ZJESC
    WABIK. Krok kosztuje 8. Wyssane resztki z czterech martwych os daly 0,5, wiec
    z rezerwy Lucana schodzi 7,5 - z 11,5 na 4,0 z 15. Jeden porzadny krok obudowania
    wabika wymaga 8, wiec DZIS wabika juz nie ruszy. Do pokazu jest 15 dni i siec
    poluje, wiec to strata odzyskiwalna, ale wieczor wlasnie zostal wydany na Seraphine,
    nie na Akademie. 4. OKAZ ZOSTAJE NA LUCANIE, NIE NA POSTERUNKU. Siedzi mu na ubraniu,
    dokarmiany recznie, wiec problem zywienia jest odlozony, nie rozwiazany - patrz
    nizej. 5. NOWA WADA, KTOREJ NIE MIAL PRZED PRZESZCZEPEM. Pajak piwniczny byl niewidzialny,
    bo nikt nigdy nie patrzy na pajaka piwnicznego. Pajak produkujacy gesta biala
    kurtyne w gabinecie kontrolerki gildii jest ZJAWISKIEM - kazdy, kto tam wejdzie,
    zobaczy oczywiscie nienaturalna siec pod nazwiskiem Seraphine. To alarm zadeklarowany,
    nie ukryty; ona wzięła to ryzyko swiadomie, ale teraz ma nazwe i wyglad. 6. I
    DRUGA, MECHANICZNA. Zywnoscia pajaka bylo to, co samo wejdzie w rzadka siec. Gesta
    siec z nielepkiego jedwabiu nie lapie NICZEGO, wiec na posterunku ten okaz nie
    wyzywi sie z wlasnej pajeczyny - w gabinecie bedzie potrzebowal karmienia albo
    zdechnie w trzy dni. To jest powod, zeby tam zagladac, albo powod, zeby go tam
    nie stawiac.'
  new_decision: 22:56, Lucan ma 4,0/15 energii, pajaka z gruczolem jedwabnika na ubraniu
    i wabika wciaz nierozpoczetego. Do rozstrzygniecia - czy zostaje w baszcie i robi
    cos, co nie kosztuje energii, czy niesie pajaka do gildii jeszcze tej nocy, czy
    idzie spac.
