  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, piec minut, zero energii. Tura dostarcza to, co lezalo
    w

    worlds/solmara/lore/concealment-materials.yaml ze statusem "NIE POWIEDZIANE W

    SWIECIE - do wydania w nastepnej scenie", who_delivers npc_lucan_father, when

    "bezposrednio po pytaniu do ktorego stopnia kupujemy". ZADEN RETCON NIE JEST

    POTRZEBNY: t_149 podal os materialu, t_150 podal os wykrywalnosci w postaci klas

    obserwatora, a substancje sa krokiem trzecim tej samej odpowiedzi i stoja w pliku

    od 26.08. Kolejnosc wydania zgodna z player_sequence_for_the_scene: najpierw DWIE

    pozycje, potem dopiero cma.

    1. PYTANIE PRZESTAWIA GO Z EPISTEMOLOGII NA MATERIALOZNAWSTWO I TO JEST JEGO

    WLASCIWE POLE. "Jakie substancje" to pytanie, na ktore ten czlowiek odpowiada

    odruchowo - nie musi liczyc ani wnioskowac, tylko przypomniec sobie, co go w

    zyciu wkurzalo. Oba tryby dostepu do tej wiedzy sa te same: SKARGA.

    2. POZYCJA PIERWSZA - CONCHA SURDA, SKORUPA MILCZACA. Podana jako pretensja, nie

    jako rozwiazanie: skarbce Akademii sa nia wylozone i przyrzady profesora Veyra
    nie

    czytaja w srodku. Dopiero mowiac to na glos slyszy, ze wlasnie odpowiedzial.

    Malz z glebokiej toni, muszla rosnie spirala zwracajaca podpis wlasnej masy

    mineralnej; mielona z olowiem szmelcowym daje zaprawe.

    3. I JEST TO ODPOWIEDZ NA "ANTYWYKRYCIE" BEZ WPADNIECIA W ANTYMAGIE. Plyta nie
    robi

    dziury - podszywa sie pod mur. Pole czyta kamien tam, gdzie jest kamien, i idzie

    dalej. To jedyny znany ojcu wyjatek od jego wlasnej tezy z t_150, ze oslona jest

    dowodem zamiaru: przedmiot bez oslony jest okazem, z oslona jest zamiarem, ale

    KAMIEN nie jest oslona.

    4. CENA I OGRANICZENIE PODANE UCZCIWIE. Muszla to odpad rybacki, wapiennicy i
    tak

    ja miela - materialowo grosze. Pracochlonna: pierwsza plyta ok. 16 h, kazda

    nastepna 6-8 h, bo forma jest. Dziala TYLKO na kamieniu i murze. Zdejmowana,

    okaz pod nia chodzi i zywi sie normalnie, lacze z siecia bez zmian.

    5. KOREKTA, KTORA OJCIEC ROBI NIE ZAUWAZAJAC, ZE JA ROBI. Lucan pytal o

    modyfikacje CHITYNY. Pozycja pierwsza modyfikacja chityny NIE JEST - jest

    oporzadzeniem: plyta na grzbiet, odlewana i dopasowywana. Profesor nie widzi w
    tym

    sprzeciwu wobec pytania, bo dla niego rozroznienie cialo/sprzet nie ma znaczenia

    metodologicznego. Dla Lucana ma: oporzadzenie da sie zdjac i znalezc osobno.

    6. POZYCJA DRUGA - SORDINA, PLESN GLUSZACA, I TA JEST WLASNIE MODYFIKACJA CIALA.

    Znowu skarga, i to bardziej zapalczywa niz przy muszli: to ONA zjada okazy w jego

    magazynie. Rosnie w dzwonnicach i piwnicach, gdzie nocuja nietoperze, i

    wyewoluowala tak, zeby jej nie bylo slychac - nietoperze omijaja plamy, na ktorych

    siedzi. Zdrapywana nozem.

    7. WLASNOSCI SORDINY - DOKLADNIE TO, O CO GRACZ SIE UPIERAL. Sfilcowana w luski

    skrzydel zjada echo powrotne: brak trzepotu dla ludzkiego ucha, dziura w obrazie

    pomieszczenia dla nietoperza. TRWALA, wchodzi w symbioze z okazem i zyje z niego,

    niezuzywalna, bez nakladania i bez serwisowania, nie ciezsza, nie wolniejsza,
    nie

    rusza Death_Anchor. Koszt materialowy zero, nakladana raz.

    8. WORLD MOVE - IDZIE PO PROBKE. Nie pyta, po co, i nie stawia warunku. Wymienil

    szkodnika, wiec chce go pokazac; wychodzi z laboratorium po zdrapke z magazynu
    i

    mowi przez ramie, ze muszle da sie miec od wapiennikow "w kazdej ilosci, bo to

    odpad". Drugi raz w tej scenie otwiera cudzy dostep do zasobu instytucji, nie

    rozumiejac tego jako przysluge.

    9. WORLD MOVE B - NERIS ZAPISALA OBIE POZYCJE, ZANIM POLICZYLA, CO ZAPISUJE.

    Przypisy do porownania cen materialu dostaly dwie substancje, ktorych jedyna

    wspolna cecha jest to, ze nie da sie ich odczytac przeszukaniem polem. Nie

    komentuje i nie punktuje - konczy zdanie, patrzy na wlasny akapit i pyta o rzecz

    warsztatowa: czy to ma stac w tej samej czesci co ceny, czy osobno. Pytanie brzmi

    redakcyjnie i jest redakcyjne, ale odpowiedz rozstrzyga, czy dokument jej reka

    zawiera osobna sekcje o niewykrywalnosci.

    10. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,

    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    kim

    naprawde jest kobieta przy scianie, ani ze trzymal pod nosem odwrocie jej tekstu.

    11. CZEGO NIE PADLO. Trzecia pozycja (lichen_speculans, porost slepy) NIE zostala

    wymieniona - zgodnie z player_sequence_for_the_scene wchodzi dopiero po

    naprowadzeniu na cme. Nie padlo tez nic o kamuflazu W LOCIE w dzien. Pytanie ojca

    "do ktorego stopnia kupujemy" zostalo przysypane wlasna odpowiedzia i nadal jest

    otwarte.

    12. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:46. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. Odbitka Neris nadal w rece Lucana.

    USTALONE: Concha surda i Sordina wylozone z nazwami, kosztami i ograniczeniami;

    plyta z muszli jest jedynym wyjatkiem od tezy "oslona jest dowodem zamiaru";

    Sordina jest trwala modyfikacja skrzydla, pozycja pierwsza tylko oporzadzeniem;

    ojciec wyszedl po probke plesni i otworzyl droge do muszli u wapiennikow; Neris

    pyta, czy niewykrywalnosc ma byc osobna czescia dokumentu.

    '
