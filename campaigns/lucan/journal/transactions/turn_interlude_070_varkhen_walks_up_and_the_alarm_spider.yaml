    a tego trzeba dopiero spreparowac. Podaje przy tym wlasnosc gatunku - pajaki madrzeja
    i robia sie bardziej temperamentne z wiekiem, wiec swiezo utworzony jest realnie
    blizszy konstruktowi.'
