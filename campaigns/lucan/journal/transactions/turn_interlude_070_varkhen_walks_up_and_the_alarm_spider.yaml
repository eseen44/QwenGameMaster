  - *id002
  new_decision: Seraphine czeka na odpowiedz, czy pajak alarmowy widzi. Osobno lezy
    jej propozycja, zeby zarejestrowac dzis sama jednostke badawcza bez wymieniania
    okazu. A Lucan nadal nie ma warsztatu - male okazy da sie zaczac z nocnego urobku
    sieciarzy w baszcie, ale musi wskazac miejsce, w ktorym usiadzie do roboty.
