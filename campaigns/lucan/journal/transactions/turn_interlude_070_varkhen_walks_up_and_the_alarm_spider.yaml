outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu. Varkhen wchodzi na gore o wlasnych silach, Seraphine przyjmuje
    oba kanaly alarmowe i sama naprawia problem z papierem, ktory Lucan wlasnie odlozyl.
    1. NOCNY URZEDNIK - LUCAN MA RACJE, SERAPHINE ODDAJE PUNKT. Znik nie naruszyl
    niczego trwalego; czlowiek domknal dyzur przekonany, ze juz sprawdzil, i poszedl
    spac. Seraphine przyznaje, ze mowila o kategorii, nie o tym jednym cieciu: jej
    zarzut dotyczyl swiadka jako klasy, a nie szkody wyrzadzonej temu konkretnemu.
    2. VARKHEN WCHODZI SAM I PLACI ZA TO. Rozkaz przez wiez przyjmuje bez sprzeciwu.
    Wejscie tylnymi schodami zajmuje mu kilkanascie minut przy 8/65 integralnosci
    - musi przystawac, opierac sie o mur i rozkladac ciezar, zeby kamien nie zabrzmial.
    Kosztuje go 1 punkt rezerwy (18 -> 17), czyli okolo pieciu dni rozproszonego zasilania
    od sieciarzy. Staje w rogu biura Seraphine i przestaje sie ruszac. Nikt na korytarzu
    go nie widzi. 3. DWA KANALY ALARMOWE - PRZYJETE OBA, ALE Z JEJ WARUNKIEM. Sygnal
    od Varkhena przez wiez uznaje za oczywisty i darmowy. Pajaka alarmowego przyjmuje
    po chwili milczenia: jest antymagiem i wie, co dopuszcza do wlasnego biura, ale
    liczy ryzyko, nie moralnosc. Warunek jest jej wlasny i stary - okaz nie moze przy
    nikim reagowac na polecenie. Zerwana pajeczyna jest w porzadku, bo to mechanika,
    nie posluszenstwo. 4. PYTA WPROST, CZY TO WIDZI. Nie oskarza, pyta praktycznie:
    chce wiedziec, czy wpuszcza do gabinetu z wrazliwymi papierami dzwonek, czy oko.
    Lucan jeszcze nie odpowiedzial. Jej wlasna wiedza o repertuarze Lucana konczy
    sie na zniku, wiec nie ma czym tego sprawdzic. 5. PAPIER - ODLOZONY, ALE ONA GO
    OBCHODZI. Lucan odmawia pisania dzis, bo dokument ma byc wystawiony na innego
    pajaka niz Spidey, a tamtego trzeba dopiero zrobic. Podaje przy tym wlasnosc gatunku,
    ktora wzmacnia caly plan wabika: pajaki madrzeja i robia sie bardziej temperamentne,
    im dluzej zyja, wiec swiezo utworzony okaz jest realnie blizszy konstruktowi,
    a nie tylko tak wygladajacy. Seraphine przyjmuje to i wskazuje obejscie: rejestracja
    JEDNOSTKI badawczej nie musi wymieniac okazu. Papier o jednostce mozna datowac
    dzis i przypisac do niego przedmiot pozniej - wtedy slad autorstwa jest starszy
    niz cokolwiek, co ktos zobaczy, a Lucan nie musi teraz nazywac zadnego pajaka.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 600
  - op: set
    instance_id: companion_varkhen
    path: position.location_id
    value: loc_lumaria_adventurers_guild
