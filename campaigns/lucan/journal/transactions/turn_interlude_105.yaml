request:
  schema_version: 1
  turn_id: turn_interlude_105
  declared_action: 'Lucan ziewa i otwiera z pozycji siły: twierdzi, że jest im znany,
    bo rozbił operację na ciałach, w której - jak zakłada - byli pośrednikiem. Oferuje
    pro bono informację, że gildia zna punkty kontrolne transportów, ma dokument in
    blanco, który je pozornie autoryzował, ma jego rysopis i dość nitek, by spowolnić
    ich biznes ze strażą i magistratem. Żąda uczciwej doli dla towarzyszy, dodatkowy
    procent gotów oddać ze swojej. Deklaruje, że nie potrzebuje pieniędzy, tylko usług
    i konkretnych kategorii towaru, których - jak twierdzi - oni się domyślają. Zapowiada,
    że w ciągu dwóch tygodni wywoła i rozwiąże w mieście wojnę domową, i sugeruje,
    że jeśli jego wyniki nie wystarczą, rozwiąże sprawę od strony innego stronnictwa.'
