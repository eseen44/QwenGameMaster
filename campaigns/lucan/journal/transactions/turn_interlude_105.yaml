outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: mixed
  perspective: pc_lucan
  summary: 'Bez testu - Lucan mowi prawde i sklada oferte, wiec rozstrzyga interes
    drugiej strony, nie rzut. Dwadziescia piec minut, zero energii. Nawiasowa deklaracja
    rzucenia pecha na obu odzwiernych NIE ZOSTALA WYKONANA (system/player-agency.md
    - nawias nie jest dzialaniem). 1. PIERWSZA TEZA LUCANA JEST BLEDNA I ILVA PROSTUJE
    JA BEZ URAZY. Wywoz cial z Lumarii NIE jest linia syndykatu i nigdy nie byl -
    nie ze skrupulow, tylko dlatego, ze prowadzi ja STRAZ, a z klientem w mundurze
    sie nie konkuruje. Syndykat wie o tej linii od lat i trzyma sie od niej z daleka.
    Lucan rozbil wiec cudza operacje, nie ich, i przyszedl grozic dzwignia, ktora
    na te kobiete nie dziala. To potwierdza od drugiej strony to, co Seraphine zlozyla
    w turze 33: ludzie strazy siedza w transporcie zwlok. 2. I DOKLADNIE DLATEGO TA
    SAMA INFORMACJA JEST DLA NIEJ WARTA WIECEJ, NIZ LUCAN CHCIAL ZAPLACIC. Dla gildii
    przepustka in blanco jest DOWODEM. Dla niej jest KLUCZEM: stala autoryzacja trasy
    z pieczecia Strazy Miejskiej, bez nazwiska i bez daty, przewozi cokolwiek, dopoki
    urzad nie nauczy sie liczyc blankietow - a blankietow nie da sie zliczyc. Lucan
    oddal ISTNIENIE tego papieru za darmo, slowem "pro bono", w pokoju, ktory nie
    ma pozycji "pro bono" w cenniku. Ilva nie udaje, ze tego nie slyszala. 3. WYCENA
    CZLOWIEKA, PODANA PLASKO I BEZ ZLOSLIWOSCI. Lucan przedstawil sie jako ktos, kto
    rozbija operacje, nosi cudze papiery i za dwa tygodnie wywola w miescie wojne
    domowa. Ilva: to nie jest opis klienta, to jest opis POGODY. Klientowi udziela
    sie kredytu, pogodzie sie nie udziela. Nie wyrzuca go - bo jest papier i bo Mara
    reczy - tylko SKRACA TERMIN: jesli te dwa tygodnie sa serio, wszystko miedzy nimi
    zamyka sie przed nimi, a nie po. Grozbe przejscia do innego stronnictwa kwituje
    jednym zdaniem: towar lezy juz na ich stole, wiec to nie jest karta, tylko informacja
    o tym, ze Lucan takie karty wyklada. 4. DOLA TOWARZYSZY - PRZYJETA OD RAZU I TO
    NAJTANSZA RZECZ W TEJ ROZMOWIE. Boros i Mara dostana swoje z ICH reki, pelna stawka,
    osobno, bez potracen; dodatkowy procent schodzi z Lucana, tak jak sam zaproponowal.
    Ilva mowi przy tym rzecz, ktora powinna go zmrozic bardziej niz cokolwiek innego
    tego dnia: to pierwsze zdanie, z ktorego dowiedziala sie, CZYM da sie Lucana kupic.
    Nie srebrem. Ludzmi, ktorych chce miec czystych. 5. "DOMYSLACIE SIE, CZEGO POTRZEBUJE"
    - NIE DOMYSLAJA SIE I NIE BEDA. Zasada domu: nie pytaja, co klient robi, ale wyceniaja
    to, o co klient prosi, wiec KATEGORIA MUSI PASC. Czlowiek, ktory nie nazywa, co
    kupuje, w pokoju, w ktorym papier jest ubezpieczeniem, nie kupuje nic. Ilva nie
    zgaduje na glos ani razu - i to jest jej metoda, nie brak domyslnosci. 6. OFERTA,
    KTORA KLADZIE NA STOLE - CALOSC ZA JEDNA RZECZ. Za FIZYCZNY dokument, dzis, w
    tym pokoju: (a) pelna, realna cena za szescdziesiat kilo, ryta trzecia wlacznie;
    (b) udzialy Borosa i Mary wyplacone osobno i w pelni; (c) npc_rovan_kesz jako
    prawnik Lucana do linii KARNEJ, odblokowany przez pokoj; (d) staly dostep do rynku,
    z kategoria nazwana przy pierwszej dostawie, nie dzis. Cene przeciwna wyklada
    sama, bo klient oszukany pozniej jest drozszy niz powiedziana prawda: ten papier
    jest jedynym fizycznym uchwytem gildii na udzial Strazy i jedyna twarda dzwignia
    Lucana na przesluchaniu za dwa tygodnie. Oddajac go, zamienia wlasny dowod w cudzy
    klucz. 7. WORLD MOVE - KESZ ODZYWA SIE PIERWSZY RAZ I ZADAJE JEDYNE PYTANIE, KTORE
    USTALA CENE. Pisal od pierwszego zdania Lucana; teraz podnosi glowe i pyta: KTO
    JESZCZE WIE, ZE PAN TEN PAPIER MA? Bo blankiet, o ktorym nikt nie wie, jest kluczem,
    a blankiet opisany komus i potem znikajacy jest zeznaniem przeciwko temu, kto
    go mial. Pytanie jest zawodowe, nie podchwytliwe - i jest niewygodne, bo kanon
    odpowiedzi brzmi: adwokatka gildii zna tresc (event_turn_interlude_035), dokument
    byl na stole (event_turn_interlude_036), a Seraphine stanela nazajutrz przed sluzbami.
    Kesz slucha jako prawnik POKOJU, wiec odpowiedz nie jest objeta zadna tajemnica.
    8. MARA. Uprzedzila go raz i poprosila o jedno: zeby wiedziala ZAWCZASU o rzeczach,
    ktorych oni pozaluja. O wojnie domowej za dwa tygodnie uslyszala razem z nimi,
    siedzac obok jako poreczycielka, rozbrojona. Nie odzywa sie i nie patrzy na Lucana
    ani razu do konca sceny. To nie jest zerwanie - to jest pierwszy raz, kiedy Lucan
    wystawil jej nazwisko na cos, o czym jej nie powiedzial. 9. CZEGO POKOJ NADAL
    NIE WIE. Nie padlo slowo o nekromancji, o Spideyu, o Varkhenie ani o nazwisku
    Veyr. Ilva ma Lucana za czlowieka gildii z papierem i z ambicjami, ktory rozbil
    linie Strazy - i to jest wersja, ktora jej wystarcza do handlu. 10. STAN. 14:40
    dnia trzeciego. Energia 8 z 15, integralnosc 19 z 19, bez warunkow. Towar u nich,
    kwota nadal nienazwana bo zalezy od odpowiedzi, przepustka nadal pod plaszczem
    Lucana razem ze Spideyem, Kesz z otwarta teczka i pytaniem w powietrzu.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: Oddać syndykatowi fizyczną przepustkę in blanco za pełną cenę, udziały
    towarzyszy, Kesza jako prawnika i stały dostęp - czy zatrzymać ją jako jedyną
    twardą dźwignię na przesłuchanie; i co odpowiedzieć Keszowi na pytanie, kto jeszcze
    wie, że Lucan ten papier ma.
