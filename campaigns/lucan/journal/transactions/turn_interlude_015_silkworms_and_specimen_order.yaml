  location_id: loc_lumaria_market
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Jedwabniki kupione - koszyk zywych larw na wadze za 1 srebro, transakcja
    calkowicie

    nudna i niezapamietywalna, kupiec nie pyta po co. Lucan ma teraz material na

    gruczoly przedne.

    Rozkaz do sieci wydany, ale nie w tej formie, w jakiej byl pomyslany. Kontrola
    nad

    sieciarzami to simple_necromantic_command o sile stable_for_simple_orders, a kanal

    to thread_break_signal plus minimalny status - "przyniescie probki, po jednej
    z

    kazdego gatunku, zywe" jest poza pasmem tego lacza. Co realnie poszlo dalej to

    wersja uproszczona: lapcie male rzeczy, nie zjadajcie, przynoscie do baszty.

    Webber_home (przy baszcie) i webber_anchored (dach gildii, blisko) przyjmuja czysto.

    Webber_tannery i webber_dump sa przez pol miasta, wiec przez remote_with_distance_loss

    dostaja te instrukcje w wersji jeszcze bardziej okrojonej - dojdzie do nich, ale
    bez

    niuansow. Sortowanie i tak spadnie na Spideya w baszcie; on ma wlasne planowanie
    i

    linked_logistics, wiec jako jedyny moze cos posegregowac zamiast wysypac na kupe.

    Zbior bedzie nocny (o tej porze i tak), wiec wynik czeka na Lucana w baszcie nad

    ranem - prawdopodobnie mieszanka polamana, czesciowo zdechla i czesciowo ucieknieta.

    Biomy sa niezle skladane - garbarnia daje muchy, chrzaszcze i pajaki ze skladu
    skor,

    wysypisko chrzaszcze padlinozerne, plujki, karaluchy i stonogi, dach gildii cmy,

    osy i pajaki ogrodowe, baszta pajaki piwniczne.

    RUCH SWIATA - handlarz alchemiczny, zwijajac ostatnia skrzynke, widzi Lucana z

    koszykiem jedwabnikow i bierze go za kolege po fachu. Rzuca bez pytania, ze on
    sam

    najwiecej zywego towaru sprzedaje Akademii - to jego najlepszy klient, biora

    okazy stale i placa bez targowania. Nie wie, komu to mowi. Dla Lucana to dwie

    rzeczy naraz - kanal do Akademii, ktory nie prowadzi przez ojca, i informacja,
    ze

    Akademia z zasady chce miec dostep do okazow. Spidey jest okazem.

    '
  new_decision: 'Robi sie ciemno. Jedwabniki w koszyku, sieciarze ruszaja na nocny
    zbior, probki

    beda w baszcie nad ranem. Handlarz stoi jeszcze pol minuty przy skrzynkach i da

    sie go zagadac o Akademie albo o pajaki na zamowienie. Alternatywy - powrot do

    baszty, albo odlozenie wszystkiego na jutro razem z reszta listy (raport Seraphine,

    szukanie ojca, linia obrony "konstrukt"). Co robi Lucan?

    '
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.zone_id
    value: zone_market_main_row
  - *id002
