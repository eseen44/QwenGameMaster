    sieciarze pleta siec, inne owady nie, a przy przyszlym podsluchu przez nic im

    wiecej nici tym lepiej. Nastepnie wydaje sieciarzom rozkaz - kazdy ma przyniesc

    do baszty probki tego, co potrafi znalezc w swoim biomie (inne pajaki, osy, muchy,

    karaluchy, cmy, stonogi); Lucan obejrzy i rozwazy wszystko na miejscu.

    '
