    baszty, bez rozkazu, maja dojrzewac. (2) GOLAB WYRZUCONY - cialo wygaszone w t_272
    idzie na smietnik. (3) ZAWISAK ZACZYNA PASC SIE NORMALNIE na lakach przed baszta,
    zamiast byc karmiony z kosza jedwabnikow. Kot zostaje na boku stolu bez decyzji.
  actor_id: pc_lucan
  scope: execution
  stakes: 'DWIE KOREKTY KANONU ZATWIERDZONE W NAWIASIE PRZED TA TURA, obie potwierdzone
    w plikach, obie zapisane jako retcony. (A) retcon_000170: necromantic_preservative
    NIE jest pozycja pozostala - poszedl na webber_anchored w t_177 (flaga decay_suppressed_permanent_event_turn_interlude_177,
    basis w growth-banks "porcja tlumiaca zdjela ubytek na stale", oba ucha od t_176).
    Wszystkie trzy porcje tlumiace sa wydane; narrator w tej sesji polozyl graczowi
    nieistniejaca porcje na stole jako opcje dla kota. (B) retcon_000171: szczury
    z t_273 nie zeszly "do kratki z wijami" - zaden wij tam nie siedzi. centipede_localisation
    (t_091) stawia spy_centipede_01 pod dzielnica GILDII w czyjejs piwnicy, a spy_centipede_02
    opisuje jako sygnal matowy "po stronie muru i garbarni" bez wspolrzednych; obie
    maja staly rozkaz z t_186 mapowac gildie od spodu. Szczury siedza w KANALACH POD
    GARBARNIA (nowa strefa zone_sewer_tannery), stawki bez zmian. BILANS ZAWISAKA,
    KTOREGO NIE WOLNO SCHOWAC: od t_271 nosi sordine i porost slepy, a ich utrzymanie
    to 2,0 na dobe z wlasnego zbiornika o pojemnosci 3 (instancja#symbiont_upkeep_per_day,
    rejestr reczny). Sam nektar na lace to zer normalny +1,0 wg daily_balance_model,
    czyli netto -1,0 na dobe i powrot trzydniowej smyczy. NARRATOR NIE ODCINA KOSZA
    I NIE ROZSTRZYGA TEGO ZA GRACZA - kosz stoi dalej na stole, pytanie o pokrycie
    symbiontow zostaje otwarte i podane graczowi wprost. ZAWISAK JEST JEDYNYM OKAZEM,
    KTORY NIGDY NIE ZEROWAL SAM: traits glutton i regal, nota "zer traktuje jak nalezna
    danine", flaga fed_on_silkworm_life_force_not_foraging od t_088/090. Jednoczesnie
    subordination mowi, ze zwierzchnictwo Lucana uznaje bez sporu i bez ironii. Reakcja
    ma byc z tego, nie z odmowy. Flagi nocturnal_and_only_nocturnal i conspicuous_in_daylight
    znacza, ze wylatuje O ZMIERZCHU, nie teraz o 06:36. NOWE INSTANCJE: dwa biegaczowate
    dostaja ROLE, wiec zgodnie z zasada z t_272 awansuja z item_animated_raw_specimens_tower_bench
    na wlasne pliki (spy_beetle_09, spy_beetle_10), wpisy w indeksie i w growth-banks
    po 0,5 jak zuki 02-08. Nadwyzka sieci 21,8 -> 20,8 (zawisak 3,0 -> 1,0 minus dwa,
    dwa zuki plus jeden), pilnowane przez reconcile_growth --check. KOT: bez decyzji,
    zostaje na boku stolu nieutrwalony. Intencja gracza (isc z problemem futra i z
    rzecza z niszy do ojca) zapisana w planning/lucan-leads.yaml#intent_take_the_fur_problem_and_the_vessel_to_the_father
    jako deklaracja W NAWIASIE - nie wykonana, czas nie ruszyl. KOS zostaje na blacie,
    gracz sie o nim nie wypowiedzial - narrator go nie rozdysponowuje.'
