  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Dwie minuty.

    KOSZT: 1,1 jednostki - 0,1 za trzeci stack numb, 1 za zapadnie pamieci przez dotyk.

    Twarz wymazana. Noga zabrana na dluzej, niz Lucan chcial.


    1. WYMIGANIE SIE JEST DOBRYM RUCHEM I NIC NIE KOSZTUJE. Marn nie nalega - konfabulacja

    z t_219 byla przechwalka o dostepie, nie planem, i czlowiek, ktory ja wyprodukowal,
    nie

    ma jej czym podeprzec. Odpuszcza z ulga, ktorej sam nie nazywa.


    2. TRZECI STACK - PROG PRZESKAKUJE O JEDEN I TO JEST W TABELI, NIE W NARRACJI.

    effect_numb#stacking, prog 3 = PARTIALLY_IMMOBILIZED. Skumulowane: mobility -15,

    coordination -21. Koszt 0,1, rzucone z wlasnego ciala z kilku krokow, bez strat
    sieci.

    Marn stal na jednej nodze, opierajac sie o sciane. Prog 3 znaczy, ze ta jedna
    noga tez

    przestaje byc pewna. Zjezdza po scianie i siada drugi raz, tym razem bez halasu
    -

    drewno juz sie rozsypalo.

    NARRATOR ODNOTOWUJE, CO TO ZNACZY MECHANICZNIE NA DLUZEJ, BO GRACZ MA PRAWO TO
    WIEDZIEC:

    przy trzech stackach to nie jest juz "noga siadla po piwie". To jest czlowiek,
    ktory NIE

    DOJDZIE do domu o wlasnych silach i NIE STANIE JUTRO NA ZMIANIE, jesli to nie
    zejdzie.

    effect_numb nie ma pola czasu trwania i narrator zadnego nie wymysla - ani zegara

    wygasania, ani obietnicy, ze to zostaje. Rozstrzygnie sie, kiedy bedzie mialo
    znaczenie.


    3. ZAPADNIA SIADA NA DRUGIM PODANIU REKI. curse_memory_trap: tier 2, klasa mentalna,

    mastery MASTERED_REPEATABLE od t_129, measured_cost_units 1.

    KANAL: retcon_000132 zniosl przypisanie do POZEGNANIA - pole delivery bylo zapisem

    pierwszego przebiegu, nie wymogiem. Reka podana czlowiekowi, zeby go podniesc,
    jest

    aktem przyjecia czegos, co nalezy do rzucajacego, dokladnie tak samo jak uscisk
    na

    pozegnanie. Klasa OPOZNIONA doklejona jako osobna os: zrywa lancuch przyczynowo-skutkowy,

    wiec rzut na wykrycie odpada calkowicie.

    ZASADA Z t_095 SPRAWDZONA: to jest DRUGI, osobny kontakt. Pierwszy niosl rozwiazanie

    jezyka i domknal sie w t_216. Na tym idzie jedna procedura i nic wiecej.

    SKUTEK, DOKLADNIE TYLE I NIC WIECEJ: wspomnienie TWARZY sie nie konsoliduje. Za
    godzine

    Marn nie potrafi Lucana opisac. NADAL BEDZIE PAMIETAL: ze byl mlody czlowiek z
    uczelni

    z ksiazka, ze podniosl go dwa razy, ze pytal o preparaty umrzykow, ze on sam opowiedzial

    o wozie i o stalej trasie, i ze sam zaoferowal zalatwienie papieru. TRACI RYSOPIS,

    NIE TRESC. Narratorowi nie wolno tego ani poszerzyc, ani zwezic.

    TO KASUJE ODNOTOWANE W t_218 OBCIAZENIE: "Marn pamieta twarz" przestaje byc prawda
    stanu.


    4. CZEGO MARN NIE ROZPOZNAL, A CO ZACZYNA GO NIEPOKOIC - I ROZNICA JEST WAZNA.

    effect_numb#visibility: mundane_target_usually_identifies_curse false. Nie szuka
    magii

    i nie znajdzie jej. ALE trzecia awaria tej samej nogi w dziesiec minut przestaje
    sie

    mieszcic w "wypilem". On sie nie boi klatwy - boi sie WLASNEGO CIALA. To jest
    zwykly

    strach zwyklego czlowieka o zdrowie i narrator nie robi z niego podejrzenia wobec
    Lucana.

    Nie ustanowiono, ze cokolwiek kojarzy z obcym w furtce. Zaden plik tego nie mowi.


    5. "NIECH PAN WROCI DO SRODKA" TRAFIA W SCIANE Z JEGO WLASNEJ KARTY.

    portrayal#what_he_refuses: bycia zaniesionym przez izbe; woli siedziec na podworcu
    do

    wieczora, niz zeby oddzial zobaczyl, jak go ktos prowadzi. Przy trzech stackach
    nie ma juz

    wyboru miedzy kusztykaniem a wejsciem o wlasnych silach - jest wybor miedzy byciem

    wniesionym a niewchodzeniem.

    NIE WCHODZI. Mowi to bez zloscі i bez pretensji do Lucana, bo nie ma powodu miec
    pretensji.

    Prosi natomiast o dwie rzeczy, obie bedace jego wlasnym problemem, a NIE hakiem
    ani

    dzwignia dla gracza (narrator ma tego tak nie rozgrywac): zeby go posadzic na
    beczce przy

    scianie i zeby - jak juz Lucan i tak idzie - nie mowic w izbie, ze on tu siedzi.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie ustanowil, ze ktos wyszedl, uslyszal albo
    zauwazyl.

    Nie zrobil z trzeciego upadku sceny medycznej ani zagrozenia (retcon_000055).
    Nie dopisal

    Marnowi podejrzenia. Nie stworzyl zegara, terminu ani sledztwa. Nie orzekl, ile
    trwa numb.

    Nie rozstrzygnal, czy Marn stanie jutro na zmianie - odnotowal tylko, ze to jest
    teraz

    otwarte pytanie, ktore wyprodukowala akcja gracza, a nie narrator.


    7. STAN. Czwarty dzien interludium, podworzec Pod Obrecza. Obecni: Lucan (imie
    nigdy

    niepodane, twarz od tej chwili wymazywana), npc_ossek_marn - na ziemi albo na
    beczce,

    trzy stacki numb (partially_immobilized), rozwiazany jezyk w drugiej warstwie,
    zapadnia

    pamieci dostarczona i pracujaca. Tkacz przy Lucanie, Spidey nadal na belce W IZBIE.

    Integralnosc 19/19, energia po odjeciu 1,1 - czytac z pliku.

    Godzine czytac ze state/time.yaml po commicie.

    '
