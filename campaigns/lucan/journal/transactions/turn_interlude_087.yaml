outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Pol godziny nad wlasnym stolem i pakiet ze skrzyni wozu przestaje
    byc "materialami do preparowania", a staje sie lista konkretnych ulepszen - bo
    od retcon_000015 to sa TRWALE ULEPSZENIA dla istniejacych slug, nie odczynniki
    zuzywane przy ozywieniu. 1. SRODEK PRZEWODZACY (necromantic_conduction_agent,
    1 fiolka). Jedyna pozycja, ktora uderza w zmierzona wczoraj strate propagacji.
    Przewodzenie to dokladnie ten parametr, ktory psuje sie na kazdym przeskoku -
    80 procent do Varkhena, 70 procent Lucan/Spidey, mnozne. Fiolka jest JEDNA, wiec
    podnosi jednego sluge, nie siec. 2. PREPARAT KONSERWUJACY + DWIE FIOLKI TLUMIACE
    ROZKLAD. Uderzaja w drugi zmierzony problem: trzydniowa smycz. Zbiornik 3 przy
    ubytku 1 na dobe konczy kazdy posterunek, na ktorym nie ma co jesc - to wlasnie
    dlatego osa w zamknietym gabinecie zdycha w trzy dni. Stlumiony rozklad zamienia
    gatunki krotkiej smyczy w mozliwe posterunki. Preparat jeden, fiolki dwie - razem
    trzy okazy. 3. SOL RYTUALNA I PROSZEK OSUSZAJACY. Utrwalaja tkanke - czyli robia
    z ciala material MECHANICZNY, nie przeszczepialny. Do transplantacji bezuzyteczne,
    do OBUDOWY WABIKA idealne: suchy, solony chityn to jest dokladnie ta ocieżala,
    martwa skorupa, o ktora chodzi w RoboCopie. 4. MALY ZESTAW NARZEDZI RYTUALNYCH
    plus wypozyczony zestaw chirurgiczny gildii (skalpel, igly, mocna nic, pinceta,
    zaciski) plus swieze atlasy anatomiczne. Warsztat jest kompletny po raz pierwszy
    w tej kampanii. 5. KOSZYK ZYWYCH JEDWABNIKOW - NADAL PELNY. Jeden osobnik poszedl
    na gruczol w turze 079 i to wszystko. Gruczol przedny na sieciarza to okolo godziny
    pracy; czterech sieciarzy to okolo czterech godzin. Znana wada materialu zostaje:
    nic ciagla, mocna, NIELEPKA i bez kontroli wyrzutu. Kleistosc i przenoszenie trucizny
    nicia to osobne, pozniejsze modyfikacje. 6. SREBRZYSTA ESENCJA ZACHOWANIA ZWLOK
    - JEDYNA RZECZ NA STOLE, KTORA JEST NAPRAWDE MAGICZNA i jedyna, ktorej Lucan nadal
    nie rozumie. Identyfikacja czesciowa: zwiazana ze smiercia i zachowaniem ciala,
    dokladne dzialanie nieustalone. Czeka na eksperyment albo na eksperta - a Lucan
    ma teraz i material doswiadczalny w nadmiarze, i ojca w Akademii. 7. RESZTA STOLU.
    Sygnet z jeleniem przebitym trzema strzalami - herb autentyczny i stary, rod nierozpoznany.
    Papiery, klucze i srebrna pieczec wlasciciela garbarni. Piecdziesiat srebra pod
    cegla. Pierscien Grobowego Szeptu przy palcu - jedno pytanie do swiezych zwlok
    na dobe, potwierdzone przez Varkhena, w tej chwili niewykorzystywane wcale. 8.
    NOCNY UROBEK CZEKA. Sieciarze przyniesli miekkie, skrzydlate rzeczy - cmy i to,
    co przyszlo do lampy. Do tego trzy pajaki piwniczne czekajace na rotacje i spy_beetle_01
    nieprzydzielony na blacie. 9. WNIOSEK Z PRZEGLADU. Przy nowym modelu kosztu (ok.
    godziny za modyfikacje, bez eskalacji - retcon_000024) na tym stole nie ma ani
    jednej rzeczy, ktora wymagalaby dnia pracy. Sa dwie rzeczy w ilosciach ograniczonych
    - jedna fiolka przewodzaca i trzy porcje tlumiace rozklad - i to jest jedyny realny
    wybor materialowy w calym schowku.'
  operations:
  - *id002
  new_decision: Warsztat kompletny, material rozpoznany. Czym Lucan zajmuje popoludnie
    przy stole - i na kogo idzie jedyna fiolka srodka przewodzacego.
