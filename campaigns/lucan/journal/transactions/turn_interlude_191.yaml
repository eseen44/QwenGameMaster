  summary: 'Bez testu - interludium, roll_policy disabled. CZTERDZIESCI PIEC MINUT,
    zero energii.

    Program czteropunktowy; punkty 1-3 wykonane, punkt 4 doprowadzony do progu i tam

    zatrzymany, bo negocjacja kanalu ostrzegawczego nalezy do gracza.


    0. UWAGA O CZASIE (retcon_000123). Pierwsze podanie tej tury mialo 5400 sekund
    i bylo

    ZA DLUGIE - lamalo skale miasta z retcon_000042 (przejscie przez Lumarie ~20 min,
    cala

    negocjacja w pokoju syndykatu <=1 h). Poprawione na 2700: 10 min marszu, 8 Hesk,

    12 Sedd z dojsciem na tyly rzedu, 8 handlarz zywego towaru, 12 szklo i targowanie.

    Poprawione takze drugie potkniecie tej samej tury: skrzynka ze szklem NIE MOGLA
    trafic

    do piwnicy gildii, bo Lucan przez cala ture jest na targu. Stoi oplacona pod straganem.


    1. PAJAK WZIETY - I JEST TYLKO JEDEN, KTOREGO WOLNO BYLO WZIAC. W gildii siedza
    trzy

    pajaki piwniczne i dwa maja robote: spy_cellar_spider_03 to UZGODNIONY kanal alarmowy

    Seraphine (t_070, retcon_000116), spy_cellar_spider_04 wrocil w t_183 na czujnik

    przeszukania do pokoju, w ktorym leza papiery z baszty. Wolny jest wylacznie

    spy_cellar_spider_06 - zaulki wokol gildii, bez rozkazu poza domyslnym. Poszedl
    do

    pudelka. spy_cellar_spider_01 nie wchodzi w rachube, jest destroyed_drained_by_lucan.


    2. HESK DORN ODPOWIADA NA PYTANIE, KTORE JEST JEGO WLASNYM FACHEM - I DLATEGO
    GADA.

    Kupuje ksiazki NA WAGE, partiami, wiec polowa jego towaru przychodzi rozklejona;

    ma wiec swojego czlowieka od skladania tego z powrotem. To nie jest przysluga
    ani

    informacja poufna, tylko rzemieslnicza oczywistosc - i Hesk jest wyraznie zadowolony,

    ze ktos znowu pyta go o robote, a nie o towar (portrayal: gadatliwy, uprzejmy,
    szczerze

    zadowolony, gdy ktos okaze zainteresowanie jego rzemioslem). Za obiad wzial cztery

    srebra i nie chcial wiecej.

    NAZWISKO: ILMAR SEDD, introligator z tylu rzedu ksiazkowego. Nowy byt, karta zalozona.

    KANONICZNE TLO WYBORU (lead_scribe_catalogue_and_the_order_record, t_081): rzad
    skrybow

    przepisuje kazdy tytul, tanio i powoli, ale zamowienie ZOSTAWIA ZAPIS, kto czego
    szukal.

    Zaplecze za straganami nie ma katalogu ani zapisu. Sedd jest w tej drugiej kategorii
    -

    pracuje dla czlowieka handlujacego makulatura, wiec ksiegi zamowien nie prowadzi.


    3. WARUNKI SEDDA - PODANE JAKO RZEMIOSLO, NIE JAKO PRZESZKODA. Pelen tom akademicki,

    czysta reka, bez marginaliow: DWANASCIE DNI przepisywania plus DWA na oprawe,
    40 srebra

    za odpis i 18 za oprawe. Skrocenie do osmiu dni jest mozliwe na dwie rece - drugi

    kopista, czyli druga para oczu. Sam Sedd zaznacza, ze oprawa to najlatwiejsza
    czesc,

    a UDAWANIE OPRAWY BIBLIOTECZNEJ to inna robota niz zrobienie ksiazki i chce wiedziec

    z gory, ktora zamawia Lucan.

    DWIE RZECZY, KTORE Z TEGO WYNIKAJA WPROST I NIE SA WYMYSLONE PRZEZ NARRATORA:

    (a) kopista MUSI MIEC TOM u siebie przez te dwanascie dni - a sekwencja z t_174
    stawia

    krok (3) "Neris dostaje oryginal do przeczytania" PRZED oddaniem czegokolwiek
    bibliotece;

    (b) polecenie "przepisz bez marginaliow" znaczy, ze kopista marginalia WIDZI.
    Neris zna

    ich charakter i ciezar (t_172); pochodzenia tomu nie zna nikt poza Lucanem.

    ZAMOWIENIE NIE ZOSTALO ZLOZONE, zaliczki nie ma, tom zostaje u Lucana - Sedd czeka

    na decyzje.


    4. CZESCI DO SLUG - CO TARG MA, CZEGO NIE MA, I CO JUZ JEST W DRODZE.

    (a) POWIEKSZENIE BATERII ZUKA nie jest zakupem. enlarge_reservoir_to_tank

    (specimen-upgrades.yaml#build_beetle_tank_and_battery) to zbiornik 3 -> 12 za
    OKOLO

    GODZINE PRZY STOLE, bez odczynnikow i bez energii (retcon_000017 + retcon_000024).

    ZRODLO TEGO KROKU: plik ma naglowek source: player_declaration_day3_evening_specimen_builds,

    decided_on 2026-08-26 - to jest wlasna deklaracja gracza z wieczora dnia trzeciego,

    nie pomysl narratora. Racjonal w pliku brzmi "maly tank, ruchoma bateria, punkt
    kontaktowy

    spajajacy siec" i nie mowi NIC o tym, z czego bateria jest zrobiona.

    (b) DUZE PAJECZAKI: rzad zwierzecy ich nie ma i nie miewa - to samo ustalil t_014.

    Ale zamowienie JUZ ISTNIEJE i jest w tempie: receive_large_arachnid_donors ma
    stan

    due_interlude_day_6_or_7, a pryncypal syndykatu przyjal egzotyczne stworzenia
    w tempie

    tygodni (t_109). Dzis jest dzien czwarty.

    (c) JAD DO NICI: handlarz zywego towaru dla alchemikow na koncu rzedu ma skorpiony
    i duze

    chrzaszcze na zamowienie, z zaliczka, z zapisem i z pytaniem "po co"

    (lead_market_run_spidey_parts_and_exotic_creatures, lead_human_scale_silk_is_a_material_problem).

    Sam jad kupic mozna; PRZENOSZENIE TRUCIZNY NICIA to osobny krok wzrostu, nie zakup
    -

    stoi tak w spy-cellar-spider-01.yaml od poczatku.

    (d) OSTRZA/SZPONY DLA SPIDEYA: ten sam handlarz, ta sama droga - szczypce skorpionie
    jako

    dawca o wlasciwej budowie. Precedens w plikach jest: Spidey nosi juz enlarged_chelicerae,

    implanted_marsh_viper_fangs i separate_paralytic_gland.

    (e) NARZADY ILUZJI ALBO KONTROLI UMYSLU: NIE MA. Nie ma ich w jawnym obiegu targowym
    i

    narrator zadnego nie wymysla - zaden plik kampanii nie opisuje takiego narzadu
    ani takiej

    klasy modyfikacji. Najblizszy istniejacy kanal to material Kosciola i Akademii,
    ktory

    chodzi zapleczem bez katalogu (lead_anti_detection_only_through_back_alleys),
    oraz droga

    ojca, ktora ma jeszcze jedna niewydana pozycje: lichen_speculans

    (concealment-materials.yaml#delivery_in_fiction.remaining). Kanal do zamowienia
    rzeczy

    spoza obiegu jest otwarty - pryncypal przyjal liste "zakazane podreczniki, materialy,

    egzotyczne stworzenia" i mozna do niej dopisac.


    5. WARSZTAT ALCHEMICZNY KUPIONY I TO JEST KOMPETENCJA Z KARTY, NIE UPRZEJMOSC
    NARRATORA.

    character.yaml - doktorat i badania Lucana dotyczyly anatomii, biologii oraz chemii.

    Wie, gdzie kupuje sie szklo z drugiej reki i czego nie warto brac nowego. Retorta,

    alembik, rura chlodzaca, trzy stojaki, mozdzierz, waga uchylna, palnik i komplet
    sloi -

    70 srebra, wszystko drugi gatunek. Skrzynka OPLACONA I ZOSTAWIONA POD STRAGANEM
    do

    odebrania; docelowo ma stanac w pustej celi w piwnicy gildii, ktora jest formalnie
    jego,

    odkad spi na gorze (retcon_000038).

    PIENIADZE: 24 srebra w kieszeni nie starczyloby, wiec Lucan rozmienil czesc pierwszej

    raty na 200 srebra w bilonie. Wydane 74 (70 sprzet, 4 obiad Heska). Kurs zlota
    do srebra

    nie stoi w zadnym pliku i narrator go NIE ustanawia - zapis prowadzony w srebrze.


    6. CZEGO NARRATOR TU NIE ROBI. Nie stawia terminu, nie robi zegara z niczego,
    nie zapowiada

    klopotu z Seddem ani z handlarzem zywego towaru, nie doklejaja sie tu ani chlopiec
    w

    liverii, ani spis zyczen Heska - gracz ich nie zadeklarowal, a lead_find_copyist_and_binder

    wprost zabrania doklejania Heskowych watkow do wyjscia po introligatora. Nie rozstrzyga
    tez,

    czy pajak w pudelku wystarczy syndykatowi za kanal.


    7. STAN. Czwarty dzien interludium, glowny rzad targu. Energia i integralnosc
    bez

    zmian poza regeneracja. Zegary bez ruchu poza uplywem czasu. W rekach: atlasy
    balwierza,

    tom z sygnatura, dyktando Mary, pudelko z pajakiem. Pod straganem oplacona skrzynka
    szkla.

    Zaden termin nie powstal. Do stolu wagowego i do Kesza jest stad kilkadziesiat
    krokow.

    '
