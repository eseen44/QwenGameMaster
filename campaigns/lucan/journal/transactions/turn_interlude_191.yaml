    - ma sluzyc za sygnalizator. (1) Idzie do Heska Dorna, handlarza starzyzna z rzedu
    ksiazkowego, licząc, ze Hesk wskaze mu kogos, kto przepisze i oprawi akademicki
    tom z sygnatura biblioteki - i na kiedy. (2) Przy okazji szuka na targu czesci
    do zwierzakow: przede wszystkim powiekszenia baterii zuka, zatrucia nici tkacza,
    ostrzy/szponow dla Spideya oraz narzadow zwiazanych z iluzja albo kontrola umyslow
    po stronie Zawisaka. (3) Kupuje podstawowy sprzet alchemiczny do piwnicy gildii
    - zna sie na chemii z doktoratu i wie, gdzie na targu kupuje sie szklo i naczynia
    po kosztach, bo na uczelni ciagle cos sie tluklo. (4) Na koniec kieruje sie w
    strone syndykatu i prawnika, zeby domknac sprawe kanalu ostrzegawczego - pajak
    w pudelku ma tam robic za sygnalizator.'
