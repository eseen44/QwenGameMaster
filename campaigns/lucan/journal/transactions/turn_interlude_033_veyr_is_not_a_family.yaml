outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: worsened
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Seraphine w koncu lapie i to jest najdrozsza rzecz, jaka zrozumiala
    tego wieczoru.

    NAJPIERW WYCOFUJE WLASNE ZDANIE. Powiedziala, ze nietykalnosc synekury wisi na
    jednym zyciu -

    to bylo bledne. Nie wisi na profesorze Veyrze. Wisi na tym, ze zawsze bedzie jakis
    Veyr w

    odpowiednim fotelu. Nietykalnosc jest strukturalna, nie osobista.

    POTEM PRZELICZA CALY WIECZOR OD NOWA i wychodzi jej trzy rzeczy, wszystkie gorsze
    niz to, co

    mowila wczesniej.

    1. SPOR O JURYSDYKCJE MOZE NIE BYC SPOREM. Jesli Veyrowie siedza w fotelach po
    roznych

    stronach - katedra, sad, komenda - to "walka instytucji o Lucana" moze byc wewnetrzna

    realokacja. Nikt nie musi wygrac. Ktos musi tylko zdecydowac.

    2. TAKI SYSTEM NIE SKAZUJE I NIE BRONI. On PRZYDZIELA. Wynikiem nie bedzie uniewinnienie
    ani

    stos, a znalezienie dla Lucana uzytku - odstapienie od zarzutow w zamian za sluzbe,
    dostep,

    lojalnosc, milczenie albo oddanie odkrycia. Najbardziej prawdopodobnym koncem
    tej sprawy nie

    jest kara. Jest POSADA. Prawdopodobnie dobra, na pewno ze smycza.

    3. I to, co Seraphine mowi mu na koniec, bo nikt inny mu tego nie powie. Lucan
    powtarza, ze

    nie ma z tymi ludzmi nic wspolnego, i socjalnie to prawda. Systemowi jest to obojetne
    -

    system nie prowadzi rejestru sympatii, prowadzi rejestr POZYCJI. Dwa lata uciekania
    nie

    wypisaly go z niczego. Zrobily z niego aktyw NIEZARZADZANY. A aktywa niezarzadzane
    zostaja

    zarzadzone dokladnie w chwili, w ktorej staja sie widoczne - czyli za dwa tygodnie,
    trzy razy

    z rzedu: na przesluchaniu, na seminarium i na dyspucie.

    PYTANIE, KTORE ZADAJE I NA KTORE SAMA NIE MA ODPOWIEDZI: jesli fotele sa obsadzone
    w ten

    sposob, to czy siec transportu zwlok po stronie strazy jest w ogole przestepstwem,
    ktore ktos

    chce sciagac - czy jest tolerowana przez kogos, kto siedzi wystarczajaco wysoko?
    Bo w drugim

    wypadku lead Lucana jest wycelowany w jego wlasny system, a szantaz oparty na
    czyms takim

    nie jest dzwignia, tylko zgloszeniem sie do kolejki.

    I ostatnia rzecz, ktora mowi o sobie, po raz pierwszy tej nocy bez ironii: jest
    w tej sprawie

    prawdopodobnie jedyna strona, ktorej oslona nad Lucanem nie jest transakcja. Jest
    tez

    najslabsza strona przy stole i wlasnie to zrozumiala.

    '
  new_decision: 'Seraphine wycofala teze o jednym zyciu, przeliczyla wieczor i wyszlo
    jej, ze najbardziej

    prawdopodobnym koncem tej sprawy nie jest kara, a posada ze smycza - bo system
    nie skazuje,

    tylko przydziela, a dwa lata uciekania zrobily z Lucana aktyw niezarzadzany, ktory
    zostanie

    zarzadzony w chwili widocznosci. Zadala tez pytanie, na ktore nie ma odpowiedzi:
    czy siec

    transportu zwlok po stronie strazy jest scigana, czy tolerowana z gory - bo w
    drugim wypadku

    szantaz jest zgloszeniem sie do kolejki. Noc jest gleboka i Lucan nadal nie ma
    gdzie spac.

    Lucan bierze to pytanie o siec i strazy, pyta ja kto konkretnie z Veyrow siedzi
    w ktorym

    fotelu, domyka wreszcie ojca i metode, czy konczy noc i idzie do baszty po urobek?

    '
  operations:
  - *id002
