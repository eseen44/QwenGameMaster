outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cel bez wlasnej obrony nie tworzy testu (system/tests.md).
    Dwie minuty, zero energii. Interludium buduje gracz (retcon_000033): deklaracja
    o oknie na moderacje LADUJE jak zadeklarowana, bo zaden plik jej nie przeczy,
    a mechanizm dysputy ja podpiera.

    0. KOREKTA KANONU POZA GRA, ZGLOSZONA PRZEZ GRACZA I POTWIERDZONA. Teza o DWOCH
    WYKLUCZAJACYCH SIE OBRONACH byla juz uchylona trzy razy - przez Kesza (t_108),
    przez Seraphine (t_123) i przez wlasna doktryne Lucana - a mimo to siedziala jako
    aktywny key_constraint w state/objectives.yaml i bez znacznika w planning/act-03-defence.yaml.
    Bledu nie kasuje sie: blok #two_contradictory_defences dostal status UCHYLONE
    ze wskazaniem na #lucans_legal_doctrine_and_the_syndicate_pitch, a ograniczenie
    w stanie zostalo przepisane na prawdziwe. Przy okazji poprawiono drugie zgnile
    ograniczenie - "mocny argument to ODZYWIANIE" upadlo retconem 000023 i zostalo
    zastapione podrecznikiem Akademii. Zadna z tych zmian nie dotyka dziennika ani
    czasu.

    1. ODPOWIEDZ NA ZARZUT JEST ZMIANA PIETRA I DZIALA. Ona zarzucila mu, ze wojne
    odradza syn jednej ze stron zapalnika. On nie zaprzecza pokrewienstwu - odbiera
    zarzutowi skale: nikt nie bedzie liczyl jej ani jego jako strony, bo za akcje
    starego wariata nie odpowiada asystentka z korytarza obok. To jest kanonicznie
    poprawne. Profesora Veyra potepiono DWA RAZY i nie zatrzymalo to ani jego, ani
    jego pracy; odpowiedzialnosc w tej sprawie nigdy nie szla przez przypisanie winy,
    tylko przez to, ze ktos przyszedl osobiscie.

    2. I DLATEGO JEJ KONTRA JEST DOBRA, A NIE OPOREM NARRATORA. Ona uczy na tej uczelni
    i ma pod reka dokladnie ten dowod: tyl czaszki zastapiony szklem, w obiegu dydaktycznym,
    na warsztatach z optyki. Wyciaga z tego wniosek przeciwny do jego pocieszenia.
    Krucjata nie potrzebuje winnego. Potrzebuje ADRESU. Bycie za malym, zeby odpowiadac,
    nie jest ochrona - jest tylko gwarancja, ze nikt nie bedzie sie tlumaczyl, kiedy
    juz przyjda. Drugi raz w ciagu pol godziny slyszy, ze jest za mala, i drugi raz
    tego nie przyjmuje cicho (retcon_000039, retcon_000041).

    3. OKNO NA MODERACJE PRZYJETE JAKO WYKONALNE I ONA NAZYWA JEGO KSZTALT LEPIEJ
    NIZ ON. Jego rozumowanie stoi: skoro wynik jest uzgodniony, sala nie bedzie sie
    bic o sformulowania, tylko przyklepie to, co dostanie - a przyklepie rowniez wersje
    WASKA. Ona doklada techniczna czesc, ktorej Lucan nie ma: rozne granice dadza
    rozny efekt, ale ceny tez sa rozne, a nikt ich nie zna dopoki nie padnie konkret.
    Nie deklaruje jeszcze, ktora bierze.

    4. CENA, KTORA ONA NAZYWA I KTORA JEST PRAWDZIWA. Wygrana moderowana jest wygrana,
    ktora nie dostarcza tego, co zostalo kupione. Jesli o wyniku zdecydowali przelozeni
    Kolma, to ci sami ludzie zobaczą, ze zdanie, po ktore siegali, nie zostalo napisane
    - a jedyna osoba, ktora mogla je napisac inaczej, to referentka. Sabotaz przez
    porazke nie dzialal, bo sala naprawilaby jej argumenty. Sabotaz przez WASKA WYGRANA
    dziala i wlasnie dlatego jest widoczny i imienny. Zamienia niebezpieczenstwo rozlane
    na cale miasto w niebezpieczenstwo wycelowane w nia.

    5. WORLD MOVE - SIEGA PO TO, CO ZOSTALO POWIEDZIANE MIMOCHODEM. "Nie jestem jedyna
    osoba, ktora ma w tym interes" mialo byc pociecha. Przy discretion_trust -20 brzmi
    jak druga polowa transakcji. Zada, zeby te osoby zostaly nazwane, i podaje powod,
    ktorego nie da sie zbyc: jesli ma napisac zdanie na czyjes zamowienie, chce wiedziec,
    czyj podpis stoi obok jej wlasnego. Wie juz, ze jeden z tych interesow pracuje
    trzydziesci krokow stad i nosi to samo nazwisko co gosc na jej lezance.

    6. CZEGO ONA NADAL NIE WIE. Sieci sieciarzy, Varkhena, slowa vitae, ojcowskiego
    planu pokazu i tego, ze ojciec od dwoch dni szuka odbitki z JEJ nazwiskiem, celi
    w piwnicy gildii, syndykatu. Nic z tego nie padlo.

    7. STAN. Popoludnie dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie, Spidey
    na parapecie przeciwnego okna. Energia bez zmian, integralnosc 19 z 19, bez warunkow.
    4 000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: zarzut o
    syna jednej ze stron odbity zmiana skali i nie wraca; okno na moderacje uznane
    za wykonalne po obu stronach; cena moderacji nazwana i jest imienna - waska wygrana
    widac; Neris zada nazwisk pozostalych zainteresowanych, zanim powie, ktora granice
    bierze.'
  new_decision: 'Neris Aldhen zada nazwisk - kto jeszcze ma w tym interes - i nie
    powie, ktora granice bierze, zanim ich nie uslyszy. Lucan decyduje, kogo z listy
    ujawnia: Akademie jako frakcje, ojca, Seraphine i gildie, syndykat, czy nikogo.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: on_the_daybed_in_neris_aldhens_rooms_moderated_narrow_win_accepted_as_feasible_by_both_but_she_names_its_price_and_demands_the_names_of_the_other_interested_parties_before_choosing_a_boundary
