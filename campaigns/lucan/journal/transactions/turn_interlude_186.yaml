  summary: 'Bez testu - trzy minuty, zero energii. Jedna kwestia poza nawiasem i jeden
    akt wewnetrzny

    w nawiasie. Druga intencja z nawiasu ZAPISANA JAKO PLAN, nie wykonana - patrz
    punkt 4.


    1. MARA NIE IDZIE I MA DO TEGO WLASNY POWOD, NIE ODMAWIA LUCANOWI. Uzgodniona
    stawka

    z t_101 to GODZINA DZIENNIE. Dzis dala cztery i pol: trzy i pol treningu plus
    godzine

    dyktanda. Nie wspomina o tym i nie wystawia rachunku - po prostu ma wlasny dzien.

    Jej agenda ma answer_the_records_clerk_letter_truthfully i await_next_group_decision,

    a jej karta trzyma current_location_id: loc_lumaria_market, wiec targ zna lepiej
    niz on

    i wlasnie dlatego moze mu o nim cos powiedziec, nie idac tam z nim.


    2. ROZKAZ DLA WIJOW LADUJE JAKO AKT WEWNETRZNY (parenthetical_action, 0 sekund).

    Mentalny rozkaz bez widocznego gestu - retcon_000032 doprecyzowany przez retcon_000060.

    Oba wije dostaja staly rozkaz: aktywnie mapowac i eksplorowac teren pod gildia,
    z daleka

    od ludzi i halasu. Ruszaja z zone_sewer_wall_district; trasa kanal -> pod piwnice
    gildii

    jest FIZYCZNIE CIAGLA i to nie jest nowy fakt - t_181 ustalil ja przez

    feature_corridor_floor_drain, dwoje drzwi od dawnej celi Lucana.


    3. CZEGO TEN ROZKAZ NIE ZALATWIA - I TO STOI W PLIKACH, NIE JEST OPOREM.

    (a) WIJ NIE MA WSPOLRZEDNYCH. Zerowy uzytek ze wzroku i minimal_status: zyje,
    syty, chodzi

    w pustkach scian, pod podlogami i w odplywach - ale nie umie powiedziec GDZIE
    jest

    (t_181 punkt 8). Lucan obchodzil to juz raz, w t_091, uzywajac krzywej straty
    jako

    dalmierza. Mapa powstanie wiec dokladnie w takim stopniu, w jakim on ja z nich
    WYCIAGNIE.

    (b) UWAGA JEST SZEREGOWA: ~15 s na wezel, ~10 s wyczucia i ~5 s przelaczenia

    (retcon_000100). Dwa wije to dwa sloty, jeden naraz.

    (c) Otwarty watek z t_091 zostaje otwarty: spy_centipede_01 wszedl kiedys otworem
    od spodu

    do CZYJEJS piwnicy z ciosanego kamienia i stojacym powietrzem. Nadal nie wiadomo
    czyjej

    i nie wolno tego dopisac (retcon_000058).

    ODCZYT NARRATORA CO DO STAWEK - do korekty jednym slowem gracza: rozkaz eksploracji
    NIE

    jest posterunkiem statycznym, wiec regula "posterunek z zadaniem i dostepnym zerem
    wychodzi

    na zero" (retcon_000105) tu nie wchodzi. Wije ida przez zer obfity i jedza po
    drodze,

    wiec stawka zostaje 2,0 na dobe kazdy, cap 1,5, nadmiar 0,5 dalej plynie w siec.


    4. DRUGA INTENCJA Z NAWIASU - ZAPISANA, NIEWYKONANA, I TAK MA BYC. Gracz zapowiedzial

    w nawiasie: wejsc na gore, wziac trzy ksiazki, a po wyjsciu z pokoju isc w kierunku
    pokoju

    Seraphine. To jest RUCH FIZYCZNY I ZAUWAZALNY, wiec nawias go nie wykonuje - potrzebuje

    jednej linii poza nawiasem (system/player-agency.md#nawiasy). Zapisane jako plan
    w formacji

    Lucana. Narrator PRZYGOTOWAL to i nie kaze powtarzac szczegolow.

    RZECZ, KTORA WARTO ZNAC PRZED TYM KROKIEM: zaden plik nie mowi, czy Seraphine
    jest dzis

    u siebie. t_180 odmowil rozstrzygniecia tego wprost i to nadal obowiazuje - jej
    ostatnie

    potwierdzone polozenie jest z t_038. Zamkniete drzwi nie beda dowodem w zadna
    strone.


    5. STAN. Czwarty dzien interludium, 11:08, zaulek za gildia. Energia 10,35/15,

    integralnosc 19/19, bez warunkow. Zegary bez ruchu poza uplywem czasu. Zaden termin
    nie

    powstal. Dwa wije w drodze pod gildie. Poranek ma nadal targ po introligatora.'
