  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Dwie minuty.

    KOSZT: 1 jednostka. Trzecia procedura mentalna tej kampanii, dostarczona reka
    podana

    czlowiekowi, ktory sam o nia nie poprosil.


    1. PROCEDURA JEST OPANOWANA, WIEC NIE MA TU CZEGO ROZSTRZYGAC.

    curse_loosened_tongue: tier 2, klasa mentalna, mastery MASTERED_REPEATABLE, pierwszy
    udany

    przebieg t_096 na npc_halven_rusk, drugi w t_127, measured_cost_units 1, dostarczane

    rozdzialem POWITANIE. Ostrzezenie z practice_gate#mental dotyczy PIERWSZEJ proby
    - ta byla

    w t_096. Nie wolno go recyklingowac przy przebiegu opanowanym (ta sama uwaga co
    w t_208).

    ZASADA Z t_095 SPRAWDZONA I NIE ZLAMANA: jedna procedura na kontakt. Na tym dotyku
    idzie

    wylacznie rozwiazanie jezyka i nic wiecej.

    Nawias mieszcza sie w regule retcon_000032/000060: nalozenie jest aktem wewnetrznym,
    bez

    widocznego gestu, zero sekund. Sam DOTYK jest juz normalna, widoczna czynnoscia

    zadeklarowana poza nawiasem.


    2. MARN PRZYJMUJE REKE - I ROBI TO Z POWODU, KTORY SAM PODAL MINUTE TEMU.

    portrayal#what_he_refuses: bycia zaniesionym przez izbe. portrayal#what_he_wants:
    wstac

    o wlasnych silach, zanim ktos z osmiu wyjdzie. Obcy w furtce jest dokladnie tym,
    czego

    potrzebuje: jedna para rak, ktora nie stoi z nim jutro na zmianie i ktorej nie
    bedzie

    jutro w izbie. NIE JEST TO ULEGLOSC ANI WDZIECZNOSC - jest to rachunek czlowieka

    wstydzacego sie przed swoimi, a nie przed nieznajomym.

    Sam nie poprosil. Wyciagnal reke dopiero wtedy, gdy Lucan podszedl i zapytal drugi
    raz

    cialem, nie slowem.

    PODNIESIENIE GO TO ROBOTA. Marn jest ciezki, noga nie bierze zadnego ciezaru

    (dwa stacki, prog slowed), a klepisko jest sliskie od tego, co sam zrobil. Idzie
    w gore

    ciezko, opiera sie ramieniem o sciane i stoi na jednej nodze. NARRATOR NIE ROBI
    Z TEGO

    ANI TESTU, ANI PROBLEMU - napiecie 0, rzutow nie ma, a zwykly czlowiek nie jest

    przeciwnikiem. Odnotowane, bo jest prawda sytuacji.


    3. PROCEDURA SIADA W CHWILI DOTYKU. Dotyk przyjety DOBROWOLNIE w ramach okazji

    towarzyskiej - abilities.yaml#delivery. Nic nie jest widoczne, nic nie boli, nic
    nie

    brzeczy. Marn nie ma pojecia, ze cokolwiek przeszlo.

    SKUTEK, DOKLADNIE TYLE I NIC WIECEJ: obnizenie hamowania, jak po alkoholu - a
    on i tak

    jest po alkoholu, wiec granica miedzy jednym a drugim przestaje istniec dla wszystkich

    poza Lucanem. Bedzie mowil. Zapamieta MILA ROZMOWE, nie przesluchanie.

    SKUTEK UBOCZNY ZMIERZONY W t_127 I OBOWIAZUJACY TU BEZ ZMIAN, PODANY GRACZOWI
    Z GORY,

    BO JEST RYZYKIEM DLA NIEGO, NIE DLA NARRATORA: rozwiazany jezyk nie zataja TAKZE
    tego, co

    cel normalnie zatrzymalby dla siebie - i PRZY BRAKU ODPOWIEDZI KONFABULUJE. Pytanie

    o rzecz, ktorej Marn nie wie, nie dostanie "nie wiem". Dostanie cos, co brzmi
    jak

    odpowiedz. To jest jedyny prawdziwy koszt tej procedury i on siedzi w wiarygodnosci

    tego, co Lucan uslyszy.


    4. CO MARN MOWI TERAZ - I DLACZEGO NIC WIECEJ. Stoi, dyszy, klnie na noge i DZIEKUJE,

    rozwlekle, bo hamowanie wlasnie zeszlo. Wraca do jedynego tematu, ktory ma:

    wlasnego cialа i wstydu. Pyta, czy widac po nim, i czy tamci cos slyszeli.

    NARRATOR NIE PODKLADA MU ZADNEGO TEMATU. Nie wspomina bramy, wozow, glejtu, stalej
    trasy

    ani cmentarza - zaden plik nie stawia tych rzeczy w jego ustach przy pierwszej
    rozmowie

    z obcym, ktory go wlasnie podniosl, a to, ze mogłby o nich gadac, nie jest zrodlem

    (retcon_000058). Rozwiazany jezyk NIE JEST wyroznia i nie robi z niego kogos,
    kto sam

    z siebie zaczyna sypac akta. On mowi WIECEJ, nie MADRZEJ. Zeby uslyszec cokolwiek

    z watku, Lucan musi zapytac - i wtedy dopiero procedura zarabia na siebie.

    Nie zapytal o nazwisko Lucana. Nie zapytal, skad sie tu wzial.


    5. CZEGO NARRATOR TU NIE ZROBIL. Nie ustanowil, ze ktokolwiek wyszedl z izby,
    nie postawil

    zegara i nie zaczal odliczania - drzwi sa nadal uchylone, w izbie nadal glosno.
    Nie zauwazyl

    Spideya ani Tkacza nikim. Nie wlozyl Lucanowi w usta zadnego imienia. Nie ustanowil,
    ze

    Marn cokolwiek podejrzewa. Nie polaczyl dwoch stackow numb z niczym magicznym
    w jego glowie -

    effect_numb#visibility mowi wprost, ze zwykly cel nie identyfikuje klatwy.


    6. STAN. Czwarty dzien interludium, podworzec Pod Obrecza. Obecni: Lucan (bez
    podanego

    imienia), npc_ossek_marn - stojacy o sciane na jednej nodze, dwa stacki numb,
    rozwiazany

    jezyk aktywny. Tkacz przy Lucanie, Spidey na belce nad beczkami, zuk i glejt w
    kieszeni,

    "Uprzejmosci" pod pacha. Integralnosc 19/19, energia po odjeciu jednostki - czytac
    z pliku.

    Zegary bez ruchu poza uplywem czasu. Godzine czytac ze state/time.yaml po commicie.

    '
