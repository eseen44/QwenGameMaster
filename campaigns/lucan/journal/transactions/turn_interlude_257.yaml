  summary: 'WYJECIE ROZSTRZYGNIETE JAKO WYKONALNE BEZ TESTU. scene.immediate_questions
    zostawialo "czy przedmiot da sie wyjac" nieustalone; t_255 opisuje rzecz jako
    lezaca "dokladnie tak, jak lezy rzecz odlozona", kamienie byly wyjete w t_255,
    roll_policy disabled, napiecie 0 - deklaracja gracza laduje tak, jak zostala zadeklarowana
    (retcon_000033, retcon_000164). Pulapki, alarmu, straznika ani zegara nie dodano:
    zaden plik ich nie stawia. NOWE OBSERWACJE Z KONTAKTU (nie z sondy): masa nieproporcjonalna
    do rozmiaru (spojne z "punkt gesty" t_254); trzy wytarte zaglebienia w bokach
    dokladnie tam, gdzie dochodzily tory - rzecz zrobiono, zeby do niej WCHODZILO;
    brak szwu i kierunku, za ktory dalo by sie to ujac. To ostatnie jest WNIOSKIEM
    Z t_256 ("nie ma obiegu, nie ma rozkladu, jest wplyw"), nie nowym ograniczeniem.
    NIEUSTALONE: czy da sie z tego ciagnac energie wprost (wymagaloby nowej dzwigni),
    skad kanaly biora smierc, czym jest rytual. Dwoch hipotez gracza - zrodlo energii
    do rozwoju albo material na pomniejszy artefakt - narrator NIE rozstrzyga za niego.
    KANALY: zyja dalej, tak samo ledwo, i koncza sie na golym kamieniu po odbiorniku.
    Obserwacja bez konsekwencji negatywnej; nic nie wykipialo. KOSZT: zimno z t_255
    ("zimna tak, ze parzy") odegrane sensorycznie - bialy, bezczulny opuszek i ciagniecie
    ciepla do przegubu. ZERO obrazen mechanicznych i ZERO energii: zaden plik ich
    nie stawia. VARKHEN: gest plus jedna kwestia wprost, oferta poniesienia rzeczy,
    bo jemu zimno nie szkodzi. Zgodne z voice_contract (wdziecznosc wykonuje, nie
    mowi; zadnej diagnozy). Jego niewiedza o przedmiocie (fact_varkhen_does_not_know_the_foundation_object@256)
    bez zmian; oferta nie jest nowa przysiega. NIE WYKONANO wlozenia zuka ani sieciarza
    do niszy - w wiadomosci gracza to rozwazanie ("zastanawiam sie, co by bylo, gdyby"),
    nie deklaracja. Nawiasowa intencja przypisania skutkow wyjecia usunieciu Orena
    zapisana jako PLAN w planning/lucan-leads.yaml, zero czasu, nikomu nic nie powiedziano.
    POLA RUSZONE: position.formation Lucana i Varkhena (operacje); osobno dopisane
    player/inventory.yaml (item_north_foundation_vessel, carried, niezidentyfikowany),
    locations/cemetery-underworks/discovery.yaml i karta Varkhena.'
  prose: 'Kamień nie trzymał rzeczy niczym. Leżała w zbiegu trzech torów jak odłożona
    i wyszła

    tak samo: bez oporu, bez trzasku, bez niczego, co by się za nią ciągnęło.


    Zimno przyszło pół sekundy po dotknięciu. Nie jak mróz, tylko jak coś, co bierze

    ciepło stamtąd, gdzie je znajdzie - od palców w górę, do przegubu, aż opuszki
    zrobiły

    się białe i przestały czuć fakturę. I rzecz waży za dużo. Nie o trochę; pięść
    kamienia

    nie ciągnie ręki w ten sposób. Obrobiona owszem, płaszczyzny starte równo, ale
    nie

    szlifem klejnotnika - raczej cierpliwością kogoś, kto pracował długo i po ciemku.

    W trzech miejscach na bokach są wytarte zagłębienia, płaskie i gładkie, dokładnie

    tam, gdzie dochodziły do niej wyrobione w kamieniu tory. Ktokolwiek to zrobił,
    zrobił

    to tak, żeby TU coś wchodziło.


    Z ręki grave sense mówi to samo, co z metra, tylko głośniej. Nie ma szwu. Nie
    ma

    kierunku. Nie ma nic, za co dałoby się to ująć tak, jak się ujmuje zwłoki albo
    węzeł

    w sieci - masa bez obiegu, śmierć sprasowana na płasko i niczyja, więc nie ma
    czyjej

    ani jak starej. Ilości jest przy tym tyle, że gdyby znalazł uchwyt, nie liczyłby
    jej

    w dniach.


    Nisza za to nie przestała. Trzy tory żyją dalej, tak samo ledwo jak przedtem,
    i kończą

    się teraz na gołym kamieniu w miejscu, w którym stała rzecz. Nic nie wykipiało,
    nic

    nie huknęło. Po prostu dowożą, w nic.


    Varkhen odwrócił się od korytarza dopiero wtedy, kiedy zobaczył, jak Lucan przekłada

    to z dłoni do dłoni.


    - Daj - powiedział. - Mnie zimno nie szkodzi.

    '
