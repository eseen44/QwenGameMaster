  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut. JEDNA JEDNOSTKA
    ENERGII.

    Zapadnia pamieci uzbrojona i czeka na dotyk. Rozdzielnik podaje zmiane.


    1. PROCEDURA JEST OPANOWANA, WIEC NIE MA TU CZEGO ROZSTRZYGAC.

    player/abilities.yaml#curse_memory_trap: tier 2, klasa mentalna, mastery

    MASTERED_REPEATABLE, pierwszy udany przebieg t_129 na npc_academy_porter,

    measured_cost_units 1, delivery pozegnanie_klasa_opozniona. Ostrzezenie z

    practice_gate#mental ("procedura, ktora zadziala w polowie, zostawia czlowieka

    pamietajacego Lucana POLOWICZNIE") dotyczy PIERWSZEJ proby - ta byla w t_129 i
    wyszla.

    Nie wolno tego ostrzezenia recyklingowac jako ryzyka przy przebiegu opanowanym.

    Rzutow nie ma (roll_policy disabled) i nie byloby ich tak czy inaczej.


    2. KOSZT NALICZONY TERAZ, BO TERAZ ZOSTAL RZUCONY. Jedna jednostka z

    lucan_necrotic_energy przez op consume. Jesli pozegnalnego dotyku nie bedzie,
    jednostka

    przepada - to jest uczciwa cena slowa "przygotowuje", a nie kara. Narrator NIE
    dodaje

    zadnego innego kosztu (retcon_000015: ta nekromancja jest tania, ograniczenia
    sa

    instytucjonalne i informacyjne, nie zasobowe).


    3. CZEGO ZAPADNIA NIE ROBI - GRANICA MA ZOSTAC OSTRA. Karta mowi wprost: "wspomnienie

    TWARZY sie nie konsoliduje - godzine pozniej cel nie potrafi Lucana opisac. NIE
    zabiera

    samej rozmowy ani wnioskow celu, tylko rysopis."

    Znaczy to, ze po zadzialaniu Dast NADAL bedzie pamietal: ze byl czlowiek ze skrzynka,

    ze przedstawil sie jako Marc, ze pytal o Ossena Marna i ze wspomnial o kobiecie
    z gildii.

    Straci wylacznie zdolnosc podania, JAK ten czlowiek wygladal. Narrator nie ma
    prawa

    rozszerzyc tego na wymazanie rozmowy ani zawezic do niczego mniejszego.


    4. DOSTAWA JEST DOTYKIEM I JESZCZE NIE NASTAPILA. abilities.yaml#delivery dla
    calego

    zbioru: "wszystkie dostarczane DOTYKIEM PRZYJETYM DOBROWOLNIE w ramach okazji

    towarzyskiej". Klasa opozniona siedzi uzbrojona i czeka na uscisk dloni na pozegnanie.

    Dast juz raz podal reke sam z siebie w t_207, wiec okazja jest naturalna - ale

    NIE NASTAPILA I NARRATOR JEJ NIE WYKONUJE ZA GRACZA (system/player-agency.md).


    5. DAST WRACA Z ROZDZIELNIKIEM. Byl w korytarzu okolo minuty, wrocil z plachta
    i czyta

    ja na blacie, do gory nogami dla siebie, bo obraca ja w strone "Marca" - odruch
    czlowieka,

    ktory cale zycie pokazuje ludziom papier przez kontuar.

    PODAJE ZMIANE I POSTERUNEK OSSENA MARNA. Rozdzielnik to rozdzielnik: kto, gdzie,
    kiedy.

    Nic ponadto w nim nie stoi i narrator nic ponadto z niego nie wyjmuje.

    DORZUCA JEDNA RZECZ OD SIEBIE, bo jest rozgadany i bo to jego wlasny rejestr wiedzy

    o ludziach z budynku: gdzie oddzialy bramne siedza po zmianie. Podaje szynk. To
    NIE jest

    poufne i nie jest przysluga - dla niego to jest ta sama kategoria co godzina zmiany.


    6. CZEGO NARRATOR TU NIE ZROBIL (retcon_000058, retcon_000055). Nie wyjal z rozdzielnika

    zadnej listy, zadnego zestawienia przepustek, zadnych innych nazwisk i zadnego
    sladu

    lancucha autoryzacji - ten watek jest u Seraphine (t_052) i nie lezy w rozdzielniku
    zmian.

    Nie ustanowil, ze ktos zauwazyl nieobecnosc Dasta przy kontuarze. Nie wprowadzil
    nikogo

    do izby. Nie zrobil z minuty samotnosci Lucana okazji do niczego ani zagrozenia
    -

    gracz nie zadeklarowal zadnego ruchu i narrator za niego zadnego nie wykonuje.

    Nie stworzyl zegara, terminu ani podejrzenia.


    7. STAN. Czwarty dzien interludium, 14:54, izba od ulicy w komendzie strazy miejskiej.

    Obecni: Lucan (jako Marc), Verek Dast. Integralnosc 19/19, bez warunkow.

    Energia po odjeciu jednostki i po regeneracji - czytac z pliku, nie z tej deklaracji.

    Zegary bez ruchu poza uplywem czasu. Skrzynka szkla przy nodze. Zuk w kieszeni.

    ZAPADNIA PAMIECI UZBROJONA, CEL npc_verek_dast, CZEKA NA DOTYK PRZY POZEGNANIU.

    W ksiedze nadal nie ma ani jednego wpisu.

    '
