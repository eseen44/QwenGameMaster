  summary: 'Bez testu - marsz i przeglad, 51 minut, zero energii. Tura ODTWORZONA
    po audycie

    31.08.2026: poprzednie rozegranie nie zostalo nigdzie zapisane (transkrypt mowil
    o

    turze 175, pliki konczyly sie na 174). Numeracja ciagla, tresc wg deklaracji gracza.


    1. CZAS - PIERWSZE ZASTOSOWANIE retcon_000100. Trzy kwadranse marszu z bramy Akademii

    do baszty (t_086) plus przeglad dwudziestu trzech wezlow po ~15 s kazdy, czyli
    ~6 minut.

    Razem 51 minut, nie dwie i pol godziny. Przeglad miesci sie w marszu i nie jest
    osobnym

    wydarzeniem. Poprzedni odczyt t_086 podwajal ten sam kwadrans i zostal uchylony.


    2. SPIDEY IDZIE Z NIM (retcon_000101). Wyszedl z Akademii razem z Lucanem i Neris;

    wczesniejszy zapis position na parapecie u Neris byl sprzeczny z wlasna flaga

    carried_concealed_with_lucan w tym samym pliku. Pokoje Neris NIE maja obsady i
    nie mialy

    jej od wyjscia. Lacze wraca na 70 procent bliskiego zasiegu, wiec pozyczenie zmyslu
    przez

    Spideya jest znowu narzedziem dostepnym od reki.


    3. PRZEGLAD - CO MILCZY, TO DOBRA WIADOMOSC. Trzy pajaki w gildii (03 i 04 w gornych

    biurach, 06 w celi w piwnicy) nietkniete, zadna siec nie rozerwana. Milczenie
    jest jedyna

    informacja, jaka potrafia przekazac, i dzis znaczy: nikt tam nie szukal. Wij_01
    i wij_02

    w kanalach, pelne, bez rozkazu poza domyslnym. Zuki 02-08 po ulicach i smietnikach
    wokol

    baszty, zra gnilne, bez zadania - celowo, scatter_and_wait. Cma_01 w gornej lace,
    bez

    rozkazu. Pajaki 02 i 05 w baszcie.


    4. TRZEJ SIECIARZE WROCILI I WROCILI Z URABOKIEM (retcon_000102). Konie polne
    i szarancza,

    czesc polamana w szczekoczulkach - i to nie ma znaczenia, bo ucho prostoskrzydlego
    siedzi

    w PRZEDNIEJ NODZE, nigdy w skrzydle. Material na kilkanascie przeszczepow, nie
    na dwa.

    Znika wiec wybor "ucho cmy dzis albo ucho konika nad ranem" - oba leza na blacie.


    5. JEDEN WEZEL W KLOPOCIE, DWA KROKI OD LUCANA. Osa_01 siedzi na blacie z jedna
    jednostka

    z trzech i nie ma jak zerowac, bo w zamknietej izbie nie ma czego jesc, a wylotu
    nikt jej

    nie dal. Przy ubytku 1 na dobe to nie jest trzydniowa smycz, tylko jedna doba.
    Zrodlo

    problemu jest rozkazowe, nie energetyczne - patrz spy-series#limitation.


    6. STAN BLATU. Ucho dawcy z cmy, drugi gruczol przedni, trzecia i ostatnia porcja
    tlumiaca

    rozklad podpisana imieniem Tkacza, obok na plotnie Zawisak - twardnieje, nietkniety,

    fiolke dostal juz dawno. Tkacz siedzi przy podpisanej porcji od trzech dni i nie
    ruszyla

    sie o krok w bok. Kolejka warsztatowa z t_090 czeka w calosci.


    7. UCHO CMY MA WADE, KTORA LUCAN SAM ZMIERZYL. Slyszy pasmo nietoperzy, nie ludzki
    glos.

    Wlasciwy narzad rosnie w przedniej nodze konika polnego i lezy juz na blacie razem
    z reszta

    urobku. To nie jest wada, to wybor pasma - t_091 p.7 zmierzyl, ze zuk z uchem
    cmy jest

    wykrywaczem nietoperzy i szczurow, czyli przyrzadem pokazujacym, gdzie jest zywe
    zarcie

    dla reszty sieci.


    8. STAN. Wieczor dnia trzeciego, 20:33, izba glowna Opuszczonej baszty przy murze.

    Energia 11,85/15, integralnosc 19/19, bez warunkow. Zegary bez ruchu. Zaden termin
    nie

    powstal. Rano targ i pierwszy trening z Mara.

    '
