  prose: Slonce stalo jeszcze wysoko nad dachami warsztatow, wiec Lucan stwierdzil,
    ze troche za wczesnie na prowadzanie kawalera po miescie. Varkhen nie usiadl i
    nie westchnal - powiedzial, ze poczeka, i zabrzmialo to jak stwierdzenie pogody.
    Potem Lucan odwrocil sie do biurka i poprosil, zeby powiedziala, co widziala.
    Seraphine odlozyla pioro. Powiedziala, ze tamtej nocy nie zobaczyla nekromanty,
    tylko czlowieka, ktory cos robi - i ze to jest cala roznica, jaka ma do zaoferowania.
    Potem dodala, czego nie widzi, i to bylo dluzsze.
  summary: "POWTORZENIE TURY UCHYLONEJ PRZEZ retcon_000156. Bez testu - interludium,\n\
    roll_policy disabled. Osiem minut, zero energii. Ta sama deklaracja gracza,\n\
    ta sama tresc merytoryczna, INNY GLOS SERAPHINY.\n\n0. CO BYLO ZLE W t_236 I CO\
    \ SIE ZMIENILO. Reklamacja gracza 2026-09-07: postac\nlamala czwarta sciane (\"\
    cantrip\", \"brutalne skalowanie\", \"bajka dla D-rankow\")\ni mowila o zdolnosciach\
    \ Lucana, ktorych nie zna - podala klase kosztu znika\ni porownanie jego wariantow,\
    \ majac na karcie DOKLADNIE JEDEN fakt w tej sprawie\n(fact_seraphine_knows_lucan_uses_numb).\
    \ Reguly A i B z retcon_000156 obowiazuja\nw tej turze i w kazdej nastepnej. W\
    \ t_237 nie pada ani jedno pojecie z warstwy\nmechanicznej i ani jedno zdanie\
    \ o ekonomii mocy Lucana.\n\n1. WYJSCIE ODWOLANE NA TERAZ, PRZESUNIETE NA NOC.\
    \ Deklaracja gracza, nie opor\nnarratora - fact_varkhen_transport_plan_night_street\
    \ mowil NOCA od t_230.\nNarrator NIE tworzy godziny policyjnej, straznika ani\
    \ zdarzenia na ulicy\n(retcon_000055, retcon_000033). Nikt nie wyszedl z gabinetu.\n\
    \n2. VARKHEN - JEDNO ZDANIE, ZE SLOWNIKA PRZYSIEGI. Uslyszal \"jeszcze nie\" i\
    \ przyjal\nto bez skargi: czterysta lat stal na slowie, ktorego nikt nie zapisal\n\
    (fact_varkhen_heard_the_oral_only_plan). NARRATOR NIE DOPISUJE mu zniecierpliwienia,\n\
    ulgi ani planu na te godziny - \"co potem\" zostaje puste (retcon_000142).\n\n\
    3. CO ONA MOWI, WYLACZNIE Z WLASNEGO RZEMIOSLA I WLASNYCH ZMYSLOW.\n  a) TAMTA\
    \ NOC. Byla przy tym (fact_seraphine_watched_lucan_curse_a_guild_employee),\n\
    \     cztery kroki od okienka. Zarejestrowala CZLOWIEKA, KTORY COS ROBI - nie\
    \ nature,\n     nie kategorie, nie osobe do zaszufladkowania. Mowi o tym jak o\
    \ sluchu: w tym\n     budynku przez caly wieczor ktos cos robi i ona nie podnosi\
    \ glowy. Tamto\n     podnioslo. NIE MOWI, ile go to kosztowalo, ani ze mogl inaczej\
    \ - tego nie wie\n     i teraz tego nie udaje.\n  b) NASTEPNEGO DNIA NIE MA NICZEGO.\
    \ Poszla obejrzec. Slad zyje tyle, co samo\n     dzialanie, potem zostaje najwyzej\
    \ \"cos tu bylo\", nigdy CZYJE\n     (magic-practice#curses_and_magical_traces,\
    \ system/magic.md#slad). Jej wniosek\n     zawodowy, w jej jezyku: pod sciane\
    \ stawia sie ludzmi i papierem, nie kamieniem.\n  c) PIECZECIE, NIE SKANER (retcon_000154\
    \ punkt 3). Stawia je z gory, obejmuja\n     miejsce, dzialaja bez niej. Przewaga\
    \ jest tam, gdzie zdazyla sie ustawic;\n     gdzie indziej ma oczy i rapier.\n\
    \  d) NIC NIE DZIEJE SIE SAMO (punkt 4). Zgaszenie cudzej roboty kosztuje ja\n\
    \     dzialanie - powiedziane jej jezykiem, jako \"musze to zrobic zamiast czegos\n\
    \     innego\", bez slowa \"akcja\".\n\n4. GRANICA, KTORA JEST TRESCIA TEJ TURY\
    \ (zadanie gracza 2026-09-07). NIE ISTNIEJE\nSTALE WYKRYWANIE NEKROMANTY. Gdyby\
    \ istnialo, nekromanci by wyginęli. Kontroler\nrejestruje ZDARZENIE W ZASIEGU\
    \ I W CHWILI - nie nature, nie stan, nie zawartosc\nrezerwy. Zgodne z pc-lucan#retired_conditions\
    \ (retcon_000019: detekowalnosc jest\nfunkcja tego, CO Lucan robi, nie tego, ile\
    \ ma) oraz z\nconcealment-materials#detection_model (schody i klasy obserwatora;\
    \ stopien 2 -\nktos magicznie pismienny, ktory SZUKA - pokonuje sie KONSTRUKCJA,\
    \ brakiem czynnego\nkanalu). Seraphine wypowiada to jako obserwacje z pola, nie\
    \ jako regule systemu.\n\n5. CZEGO NARRATOR TU NIE ZROBIL. Nie podal zasiegu jej\
    \ rejestracji w metrach\n(kanon ma tylko 18 m kontrzaklecia i \"cztery kroki\"\
    \ z t_038). Nie wycenil oferty\ndrugi raz - cene nazwala raz, w t_235 (retcon_000135\
    \ a). Nie powtorzyl jej pytania\no nazwisko urzednika - pyta raz i czeka (speech_traits).\
    \ Nie przeprowadzil\ndemonstracji na zywo: gracz poprosil o ODPOWIEDZ, Lucan nie\
    \ wydal ani jednej\njednostki. Nie zrobil z niej wyroczni. Nie zmienil player/abilities.yaml\n\
    (retcon_000120). Nie ruszyl zadnego zegara reka.\n\n6. STAN. Czwarty dzien interludium,\
    \ gabinet Seraphine, gorne pietro gildii.\nObecni: Lucan, npc_seraphine_vale,\
    \ npc_varkhen_mind (stoi, plaszcz na zbroi).\nSpidey i Tkaczka przy Lucanie, zuk\
    \ w kieszeni. Na biurku sygnet z jeleniem;\nkarta kontraktowa w szufladzie, ZAKRES\
    \ i DATA puste. Lucan 19/19, energia bez\nwydatku - czytac z pliku. Wyjscie pod\
    \ trzecia pieczec przesuniete na noc.\nPytanie Seraphine o nazwisko urzednika\
    \ NADAL OTWARTE.\n"
  new_decision: 'Wieczor jest jeszcze wczesny, a Seraphine wlasnie oddala Lucanowi
    rysunek wlasnej slepoty: slyszy dzialanie, nie czlowieka, i tylko tam, gdzie zdazyla
    sie ustawic. Lucan ma kilka godzin do ciemnosci, kontrolerke rangi A, ktora odpowiada
    na pytania o wlasne rzemioslo, i trzy rzeczy lezace obok siebie na wyciagniecie
    reki: jej pieczecie, wlasna siec, ktorej ona do konca nie rozumie, i pytanie o
    nazwisko urzednika, ktore ona zadala raz i na ktore czeka. Co Lucan robi z tym
    wieczorem?'
