  - op: advance_time
    seconds: 1200
  - *id002
  summary: 'Bez testu - dwadziescia minut, zero energii. Sala narad zostaje PUSTA:
    gracz nie stawia

    tam niczego i nie wolno tego rozegrac jako straconej okazji. Pierwsza swiadoma
    sesja

    cwiczenia pozyczonego zmyslu.


    1. NIC NIE ZOSTAJE W SALI I TO JEST DECYZJA, NIE ZWLOKA. Trzy drogi z t_181 stoja
    opisane

    w layout.yaml i nie wygasaja - zaden plik nie stawia im terminu. Nie robic z tego
    zegara

    ani z niepostawienia pluskwy porazki (retcon_000055).


    2. CWICZENIE MA MIERZALNA PODSTAWE, KTORA JUZ ISTNIEJE. Uwaga jest szeregowa:
    ~15 s na wezel,

    z tego ~10 s wyczucia i ~5 s przelaczenia (retcon_000100, zmierzone w t_086).
    Sluchanie na

    zywo zjada caly slot. Cwiczenie polega wiec na dwoch rzeczach naraz: skracaniu
    przelaczenia

    i utrzymywaniu wyczucia dluzej niz dziesiec sekund. ZADEN PLIK NIE PODAJE liczby,
    na ktora

    te 15 s spada od trenowania, i narrator jej nie wymysla. Jesli gracz chce, zeby
    to bylo

    liczba rosnaca, to jest kierunek do zadeklarowania w objective_develop_lucan

    #develop_active_abilities - krok postawiony teraz na practising_borrowed_sense_first_session_t_182.


    3. CO SESJA DAJE NAPRAWDE - REFERENCJE, I TO JEST RZECZ UZYTECZNA. Spidey i Tkacz
    maja od

    t_176 OBA PASMA: ultradzwiek cmy i pasmo ludzkiego glosu z prostoskrzydlego. Pierwszy
    raz

    Lucan sluchal wiec tej samej ulicy przez dwa rozne ucha, na dwoch roznych dystansach
    i przez

    dwie rozne klasy kanalu - Spidey 70 procent bliskiego zasiegu, Tkacz klasa kotwicy

    (retcon_000106). Efektem jest WZORZEC: wie teraz, jak brzmi ludzka mowa przez
    pozyczone ucho

    przy znanej odleglosci i za znana przegroda. To jest dokladnie ta skala, ktora
    bedzie

    potrzebna, zeby ocenic, czy okaz w pustce podlogi sali narad poda slowa czy tylko
    rytm

    (layout.yaml#feature_council_floor_void). Referencja jest darmowa i nie wymaga
    niczyjej zgody.


    4. UBOCZNY WNIOSEK, ZGODNY Z TYM, CO ZMIERZONO WCZESNIEJ. Pasmo ultradzwiekowe
    CICHNIE

    ze switem - nietoperze wracaja na dzien, a t_091 ustalil, ze noc nad ulica nalezy
    do nich.

    Zostaja szczury, ktore piszcza wysoko i ktorych czlowiek nie slyszy w ogole. Ucho
    cmy jest

    wiec przyrzadem NOCNYM: pokazuje, gdzie jest zywe zarcie, i robi to najlepiej
    po ciemku.

    A to znaczy, ze zuk - ktory nosi wylacznie ucho cmy (retcon_000116) - jest w sali
    narad

    za dnia najslabszym mozliwym wyborem, niezaleznie od maskowania.


    5. CO SLYSZAL W PASMIE LUDZKIM, BEZ DOKLADANIA NICZEGO. Okiennice po kolei, kola
    reczne

    na bruku, pierwsze glosy przy studni, i nizej w budynku nocny urzednik chodzacy
    po glownej

    sali. Nic z tego nie jest tropem i nic z tego nie zostaje doklejone do zadnego
    watku -

    brulion balwierza ma nazwiska, ale zaden z nich nie wyszedl z tej ulicy dzisiaj
    i nie wolno

    go tu wprowadzic bez deklaracji gracza (retcon_000058).


    6. SPIDEY I TKACZ POD UWAGA - I ROZNICA MIEDZY NIMI JEST SLYSZALNA. Spidey pracuje:
    kiedy

    Lucan wchodzi w jego zmysl, on nie zmienia zachowania, tylko PRZESTAJE sie ruszac
    i czeka,

    az uwaga zejdzie - jakby ustepowal miejsca przy przyrzadzie. Robi to sam, po drugim
    przelaczeniu,

    bez rozkazu. Tkacz odwrotnie: pod uwaga staje sie NADAKTYWNA, zmienia pozycje,
    obraca sie

    w strone dzwieku, ktory jej sie wydaje wazny, i przez to psuje wlasny odczyt.
    To nie jest wada

    kanalu, to jest ta jej gorliwosc wobec Lucana z traits - chce dostarczyc, wiec
    przeszkadza.

    Jedno zdanie, bez watku (planning/anchored-companions#not_the_main_plot).


    7. MARA JEST W DRZWIACH I MA DO TEGO PODSTAWE W PLIKU. Jej karta mowi wprost:
    przyjdzie

    do pokoju dyzurnego na gorze o SWICIE DNIA CZWARTEGO na godzine cwiczen (t_117),
    a godzina

    dzienna rano jest uzgodniona od t_101. Jest 06:30 i jest juz jasno.

    KOREKTA KARTY przy okazji: dopisek "FAKTYCZNIE Lucan spi w celi po Varkhenie w
    piwnicy" byl

    NIEAKTUALNY - retcon_000038 ustalil, ze Lucan sypia wlasnie na gorze. Przekonanie
    Mary jest

    PRAWDZIWE i nie ma tu czego demaskowac; nie rozgrywac przyjscia Mary jako testu
    przykrywki.


    8. STAN. Czwarty dzien interludium, 06:30, pokoj dyzurny na gorze w gildii. Integralnosc

    19/19, bez warunkow. Zegary bez ruchu. Zaden termin nie powstal. Sala narad pusta,
    trzy drogi

    opisane i otwarte. Krok develop_active_abilities przestal byc "planned".'
  new_decision: 'Na schodach krok, ktory Lucan zna: Mara, o switie dnia czwartego,
    dokladnie tak, jak umowili sie trzy dni temu. Przychodzi na godzine cwiczen do
    pokoju, ktory uwaza za jego sypialnie - i ma racje. Za nia zostaje poranek z dwiema
    wlasnymi rzeczami: targiem po introligatora i tym, co Lucan wlasnie zaczal cwiczyc
    sam.'
