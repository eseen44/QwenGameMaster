  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PELNY PRZEGLAD SIECI W DRODZE DO GILDII, ZERO KOSZTU. t_086 ustalil wprost,
    ze granica takiego obchodu jest UWAGA, a nie energia, i ze pelny przeglad dwudziestu
    kilku wezlow zajmuje tyle, co spacer - narrator nie dolozyl tu ani jednostki.
    Trasa: loc_cemetery zone_south_gate -> loc_lumaria_adventurers_guild, 45 minut.
    WYNIK JEST NEGATYWNY I TO JEST INFORMACJA (jak w t_253): nigdzie nie ma wlamania,
    przeszukania, obserwatora ani goscia, bo zaden plik ich dzis nie stawia. Czujnik
    przeszukania w pokoju dyzurnym (spy_cellar_spider_04, inventory#container_guild_duty_room)
    jest nietkniety. CO WESZLO DO WIEDZY LUCANA: rozklad wezlow potwierdzony ze stanu
    - baszta przy murze (zuki 02-08 w ulicach, pajaki 01/02/05, osa, zawisak na stole),
    lakа nad garbarnia (cmy 01-04, webber_home, webber_tannery), wysypisko (webber_dump),
    kanal w dzielnicy muru (wije 01-02), tylne uliczki targu (pajak 06), gorne biura
    gildii (pajaki 03-04). Zawisak jest widocznie dalej w rozwoju niz reszta - zgodne
    z kanonem o najszybciej rosnacym wezle. Zuki pod murem zbieraja sie pod jedna
    plyta; to zaczepka bez terminu i bez obowiazku (retcon_000164), nie zapowiedz
    watku. SWIATLO W GABINECIE SERAPHINY o tej porze jest zgodne ze stanem (w t_250
    zostala w gabinecie) i jest informacja NA KORZYSC gracza, nie zegarem - nikt nie
    zostal wezwany, nikt nie czeka, nic nie wygasa. TURA KONCZY SIE NA PROGU: co Lucan
    powie Seraphinie, jest osobna deklaracja gracza. POLA RUSZONE: pozycje trzech
    instancji, scene_update na gildie.'
  prose: 'Przegląd sieci nie wygląda z zewnątrz na nic. Idzie się ulicą, mija się
    zamknięte

    okiennice, i tylko od czasu do czasu człowiek na chwilę traci rytm kroku, bo jest

    gdzie indziej.


    Baszta przy murze: zimno, ciemno, stół tak, jak został zostawiony. Zawisak siedzi

    przy koszu z jedwabnikami i jest już wyraźnie czymś innym niż tydzień temu -

    cięższy, twardszy, spokojniejszy w tym, jak trzyma skrzydła. Pająki przy wejściu

    i w składzie bez ruchu. Żuki w okolicznych uliczkach zrobiły coś, czego nikt im
    nie

    kazał: zamiast rozejść się po całym odcinku, zebrały się po ciemku pod jedną i
    tą

    samą płytą przy murze. Sześć sztuk, jeden na drugim, jak kupka kamieni.


    Kanał pod dzielnicą muru: wije na swoim odcinku, woda, szczury, nic więcej. Łąka

    nad garbarnią: cztery ćmy i dwa sieciarze, garbarnia pod spodem ciemna i pusta
    jak

    od tygodnia. Wysypisko: sieciarz przy wejściu, i to samo, co zawsze - dym, psy,

    nikogo. Tylne uliczki targu: kramy pozamykane na noc, pająk pod okapem, żadnego

    światła.


    Wszędzie to samo, czyli nic. Sieć jest nudna i to jest jej najlepsza cecha: nikt

    jej nie ruszył, nikt niczego nie szukał, nikomu nie przyszło do głowy zajrzeć
    pod

    płytę na murze ani pod okap na targu.


    Gildia o wpół do jedenastej stoi ciemna od frontu, ale nie cała. Pająk w górnych

    biurach podaje to bez emocji, bo emocji nie ma: nitka w drzwiach pokoju dyżurnego

    nietknięta, a pod drzwiami gabinetu Seraphine leży wąski pasek światła.


    Jest jeszcze u siebie.

    '
