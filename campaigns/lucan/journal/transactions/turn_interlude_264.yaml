      tells:
      - Czysci sie po robocie. Zawsze, drobiazgowo, przy Lucanie i bez pospiechu -
        to jest jego wytarcie ostrza i jednoczesnie komunikat, ze skonczyl.
      - Nie chodzi dwa razy ta sama droga. Nawet gdy to nadklada. Nawet gdy nikt nie
        patrzy.
      - Czeka. Godzinami, bez ruchu, jak pajak - a potem dziala raz. Poganiany nie
        przyspiesza.
      - Trudniejsze wyjscie wybiera swiadomie, jesli jest czystsze. Ryzykuje ze stylu,
        nie z brawury.
      what_offends_him: 'Uzycie go jak przedmiotu tam, gdzie mogl byc operatorem:
        wysłanie bez informacji, rozkaz punktowy na cos, co sam zrobilby lepiej, albo
        praca, po ktorej ktos inny musi sprzatac. Nie klóci sie o to. Zapamietuje.'
      contrast_with_the_moth: Cma jest prozna z POZYCJI, Spidey z WYKONANIA. Ona chce,
        zeby jej sie nalezalo; on chce, zeby bylo zrobione dobrze. Zuk kaze robic,
