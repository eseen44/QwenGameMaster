  declared_action: 'DROGA DO GILDII Z PELNYM PRZEGLADEM SIECI. Lucan idzie z cmentarza
    do gildii, do Seraphiny, i po drodze "przechodzi po wszystkich minionkach i ich
    okolicy" - wezel po wezle. Zgodnie z t_086 granica takiego przegladu jest UWAGA,
