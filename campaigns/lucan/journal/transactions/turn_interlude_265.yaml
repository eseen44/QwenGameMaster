outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'WEJSCIE DO GABINETU, PIERWSZE ZDANIE ODDANE JAKO KWESTIA DO NIEJ - gracz
    potwierdzil adresata wprost, wiec nie bylo to pytanie do systemu. IZOLACJA WYGASLA
    I JEST TO ZAPISANE, NIE PRZEMILCZANE: rozciagniety Mrozny Dotyk z t_258 byl jednym
    rzutem na kilka do kilkunastu minut (retcon_000165), a od tamtej tury minelo 45
    minut. Rzecz jedzie owinieta w pole plaszcza, dlon Lucana jest odmrozona i bez
    czucia. Narrator NIE naliczyl za to obrazen (zaden plik ich nie stawia) i NIE
    wydal za gracza energii na ciche powtorne rzuty. CO SERAPHINE ZOBACZYLA I CZEGO
    NIE: widzi slad dlugiej pracy wlasnym kanalem i stan reki - to jest jej rejestr
    wprost z voice_contract ("o magii mowi jak o pogodzie, czuc to od progu") i z
    karty (magic_interception 82, zasieg 18 m). NIE odczytala, co Lucan niesie, ani
    ile mu zostalo w rezerwie (retcon_000156). Pyta o reke, bo reke widzi; o przedmiocie
    nie wie. JEJ RUCH: odpowiada krotko i zamknieto, na pytanie o sen nie robi anegdoty,
    a kolejnosc zmienia jawnie - odklada pioro i zadaje wlasne pytanie. To, o co pyta,
    wynika ze stanu: w t_250 otworzyla drzwi, gdy Varkhen wychodzil pod trzecia pieczec,
    a pomiar tej pieczeci jest krokiem pierwszym jej wlasnej kolejnosci z t_234. ZERO
    ZEGARA: zaden plik nie stawia jej na jutro wezwania ani terminu i narrator zadnego
    nie dodal. Nie rozebrala wypowiedzi Lucana na punkty, nie wyliczyla konsekwencji,
    nie postawila warunku. STAN: bez kosztow i bez ruchu poza wejsciem; scene_update
    dodaje ja do uczestnikow.'
  prose: 'Puka i wchodzi, nie czekając na drugie zaproszenie, bo pierwszego nie było.


    Gabinet o tej porze wygląda jak miejsce, w którym ktoś przegrał z papierami: dwie

    lampy zamiast jednej, pieczęć odłożona na boku, i ta sama kobieta co zawsze, tylko

    z rękawami podwiniętymi wyżej.


    - Czy ty w ogóle sypiasz?


    - Nie dzisiaj - mówi Seraphine i odkłada pióro. Nie tak, jak się odkłada pióro
    na

    chwilę.


    Patrzy na niego dokładnie tyle, ile trzeba, i to nie jest spojrzenie na twarz.

    Antymagiczka rangi A nie musi niczego sprawdzać; po prostu widzi pogodę w pokoju,

    a pogoda mówi, że ten człowiek przez ostatnie godziny ciągnął coś własnym kanałem

    i robił to długo.


    - Rękę masz białą - mówi. - Od czego?


    A potem, zanim padnie odpowiedź, zmienia kolejność i nie udaje, że tego nie robi:


    - Nie, najpierw to. Wyszedł stąd wczoraj wieczorem i poszedł pod trzecią pieczęć.

    Stoisz w drzwiach sam.

    '
