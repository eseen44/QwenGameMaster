  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Lucan zna ten swiat od wewnatrz i to jest tura, w ktorej ta
    wiedza wyprzedza

    Seraphine trzy razy z rzedu.

    UKRYWANI NEKROMANCI - przyznaje. Z perspektywy Kosciola Akademia jest pelna nekromantow
    i

    wcale nie jest to bledna perspektywa. Ale wskazuje roznice, ktora jest cala stawka:
    oni maja

    PLASZCZ. Nikt tam nie jest nekromanta, kazdy jest licencjonowanym badaczem, i
    ta zbiorowa

    fikcja dziala dokladnie tak dlugo, jak nie da sie wskazac jednego nazwiska bez
    afiliacji.

    Lucan nie jest zapisany, nie jest zatrudniony, nie ma katedry, opiekuna ani licencji.
    Jest

    wiec jedynym okazem, na ktorego Kosciol moze wskazac palcem, nie uderzajac w instytucje.

    Ochrona w tym porzadku prawnym bierze sie ze statusu, afiliacji i patrona - Lucan
    ma cechowa

    i nazwisko, nie ma akademickiej. WNIOSEK OPERACYJNY, ktory z tego wychodzi i ktory
    jest nowa

    droga: zdobyc plaszcz. Wpis, afiliacja badawcza, opiekun, cokolwiek formalnego
    - PRZED tym,

    jak stanie sie widoczny. Wtedy "niewidzialne zrodlo" i "widoczny badacz" przestaja
    sie

    wykluczac, bo widoczny bylby jako badacz, nie jako nekromanta.

    OREN - przyjmuje to poswiadczenie powaznie, bo pochodzi od jedynej osoby, ktora
    widziala

    jedno i drugie z bliska. I odwraca je natychmiast przeciw planowi Lucana: jesli
    akademicy

    sa gorsi od Orena, to wlasnie im Lucan zamierza wlozyc do reki gotowy okaz.

    SEMINARIUM - i tu Seraphine milknie na dluzej. Mowi wprost, ze to jest gorsze
    niz wszystko,

    co powiedziala tego wieczoru, i ze sama by na to nie wpadla, bo nie zna tego swiata.

    Rozumowanie Lucana przyjmuje w calosci: nie wezwa go na przesluchanie, wezwa go
    na

    seminarium, odmowy nie uznaja za odpowiedz, bo dla nich niewiedza jest stanem
    do usuniecia,

    nie granica do respektowania. Powod, dla ktorego to jest najgorszy scenariusz,
    jest prosty -

    ona umie bronic czlowieka przed trybunalem. Nie umie bronic go przed ludzmi, ktorzy
    ZAPISZA.

    Recenzowany, spisany opis metody jest dokladnie tym dowodem, ktorego Kosciol nie
    ma, wykonanym

    w dobrej wierze, przez jego wlasna strone, z przypisami. A gildia nie ma zadnej
    jurysdykcji

    nad seminarium.

    I to samo rozumowanie przekwalifikowuje zegar, ktory Lucan sam uruchomil. To,
    co nadchodzi za

    pietnascie dni, nie jest zyczliwym pokazem. Ojciec juz zaczyna o tym mowic kolegom
    - a

    seminarium jest tym, w co takie mowienie sie zamienia.

    CO ONA MOZE DAC W ZAMIAN, i daje: dwie taktyki. Pierwsza - nie odmawiac. Akademik
    nie

    przyjmuje "nie", ale przyjmuje "nie umiem tego jeszcze sformalizowac" i bedzie
    sie o to

    klocil miesiacami, zamiast probowac to z Lucana wyciagnac. Opis na poziomie mechanizmu,
    bez

    procedury odtwarzalnej. Druga - jedna wersja. Przygotowac kanoniczna opowiesc
    ZANIM ktokolwiek

    zapyta, i trzymac ja identyczna na seminarium, na przesluchaniu i u prawnika.
    Rozjazd miedzy

    forami zabija szybciej niz tresc.

    '
  new_decision: 'Lucan wyprzedzil ja trzy razy i dostal za to dwie rzeczy: droge do
    instytucjonalnego

    plaszcza, ktory pogodzilby jej rade z planem ojca, oraz dwie taktyki na seminarium
    - nie

    odmawiac, tylko nie umiec sformalizowac, i miec jedna wersje na wszystkie fora.
    Zla

    wiadomosc jest ta, ktora sam przyniosl: to, co idzie za pietnascie dni, to nie
    pokaz, a

    wezwanie, ktorego nie da sie odrzucic, i ojciec juz o tym mowi. Lucan mowi jej
    teraz o

    ojcu i o okazach, zaczyna od razu ustalac te jedna kanoniczna wersje, pyta ja
    jak zdobyc

    afiliacje, czy konczy noc i idzie do baszty po urobek?

    '
  operations:
  - *id002
