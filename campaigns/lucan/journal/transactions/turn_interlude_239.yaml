  prose: Zeszli razem do glownej sali - Varkhen do progu, dalej nie. Zostal w budynku,
    bo Lucan sam pol godziny wczesniej powiedzial, ze na spacery jest za jasno, a
    Varkhen nie jest czlowiekiem, ktory sie o takie rzeczy dopytuje. Potem byla zwykla
    droga przez Lumarie o tej porze, kiedy stragany zaczynaja sie skladac i nikt nie
    patrzy na czlowieka w plaszczu, bo wszyscy licza utarg. Dwadziescia minut i Lucan
    stal na zapleczu targu, przed drzwiami, za ktorymi Rovan Kesz urzeduje, kiedy
    nie urzeduje nigdzie indziej. Sygnet mial w kieszeni, ciepły od dloni.
  summary: 'Bez testu - interludium, roll_policy disabled. Dwadziescia dwie minuty,
    zero energii.

    PRZEJSCIE, NIE SPOTKANIE. Tura konczy sie przed drzwiami; rozmowa z Keszem nalezy

    do nowej sceny.


    1. WYJSCIE Z GILDII. Lucan schodzi z gornego pietra i idzie na zaplecze targu

    (loc_lumaria_market#zone_market_back_alleys) - tam pracuje Kesz i tam od t_202
    stoi

    spy_cellar_spider_06 w skrzynce. Czas z system/pacing.md i retcon_000042: przejscie

    przez to miasto to okolo dwadziescia minut, nie godzina. Doliczone dwie minuty
    na

    zejscie i wyjscie z budynku. Targ ma access: public_open_daylight_hours, a jest

    sierpniowy wieczor przed zmierzchem, wiec dostep jest normalny.


    2. VARKHEN ZOSTAJE - I TO NIE JEST DECYZJA NARRATORA ZA GRACZA. Osiem minut wczesniej

    Lucan sam odwolal wyjscie za dnia i przesunal je na noc (t_237,

    fact_varkhen_accepted_the_postponement_to_night). Zadna deklaracja tego nie cofnela,

    wiec narrator NIE wyprowadza dwumetrowego dragala w plaszczu na ulice w swietle
    dnia

    - to bylaby zmiana planu wykonana za Lucana (system/player-agency.md). Varkhen
    zostaje

    w budynku gildii i nie dostaje ani opinii o tym, ani planu na te godziny

    (retcon_000142). Spidey i Tkaczka ida z Lucanem, bo sa przy nim od t_233 i nic
    tego

    nie zmienilo.


    3. CZEGO NARRATOR NIE ZROBIL PO DRODZE. Nie stworzyl zadnego zdarzenia na ulicy,
    nie

    postawil patrolu, nie kazal nikomu sie przygladac i nie zrobil z przejscia sceny

    (retcon_000055, retcon_000033: opor tylko z pliku albo z deklaracji gracza; przy

    napieciu 0 wykonalna, powtarzalna czynnosc laduje tak, jak zadeklarowana).

    Nie otworzyl drzwi, nie wprowadzil Lucana do srodka, nie napisal ani jednej kwestii

    Kesza i nie rozstrzygnal, czy Kesz w ogole tam jest - to jest tresc nastepnej
    sceny,

    a jego karta jest 35 tur za stanem (retcon_000121), wiec przed pierwsza kwestia

    wymaga sprawdzenia dziennika.


    4. LINIA ROZWOJU ZAPISANA JAKO PLAN GRACZA, NIE JAKO WYKONANIE. Gracz zadeklarowal

    kierunek: manipulacja nieczystosciami, woda, ziemia i chorobami, a operacyjnie
    -

    przerobienie posiadanych wstepow do klatw na skuteczne psucie jedzenia i wywolywanie

    gwaltownych niestrawnosci w stolowce magistratu. Zapisane w

    planning/lucan-leads.yaml#lead_filth_water_earth_disease_curse_line. To jest

    INTENCJA STERUJACA TYM, CO NARRATOR PRZYGOTOWUJE, a nie wykonane dzialanie

    (system/player-agency.md) - nic z tego nie zostalo w tej turze zrobione, przecwiczone

    ani wypowiedziane na glos do Seraphine.


    5. STAN. Czwarty dzien interludium, zaplecze targu miejskiego, przed drzwiami

    zaplecza syndykatu. Obecni: Lucan, companion_spidey, webber_anchored. Varkhen
    zostal

    w gildii. Sygnet z jeleniem u Lucana (od t_238), "Uprzejmosci" jak zwykle przy
    nim.

    Lucan 19/19, energia bez wydatku - czytac z pliku. Wyjscie pod trzecia pieczec
    nadal

    zaplanowane na dzisiejsza noc.

    '
  new_decision: 'Lucan stoi na zapleczu targu przed drzwiami prawnika, z sygnetem
    w kieszeni i dwoma sprawami do polozenia na jednym stole: herb, ktorego nikt nie
