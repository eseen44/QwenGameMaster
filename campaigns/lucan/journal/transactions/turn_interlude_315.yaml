    nie zadeklarowal. GDZIE STOI DRUGA PIECZEC: W TYM SAMYM POMIESZCZENIU, w ktorym
    Lucan byl cztery dni temu - przy SCIANIE POLUDNIOWEJ, po PRZECIWNEJ stronie niz
    nisza z kanalami. Piec krokow od niszy. JAK WYGLADA: identycznie jak trzecia -
    krag wpuszczony w kamien, wielkosci rozlozonej dloni, na wysokosci piersi Varkhena.
    Jeden uklad, jeden wzor, bez napisu i bez znaku. CO JEST NA NIEJ: OSAD. Cienka,
    ciemna warstwa na kregu i wokol niego, ktora osiadla i zostala. Kamien pod spodem
    byl kiedys czysty. CZYM JEST OSAD I CZY JEST PRZYCZYNA, CZY OBJAWEM - NIEUSTALONE.
    "Brudna" okazuje sie slowem doslownym; Varkhen uzywal go od t_259. ROZNICA, KTORA
    VARKHEN NAZWAL SAM: trzeciej musial DOTKNAC, zeby cokolwiek powiedziec, tej NIE
    MUSI - stoi obok i juz wie. Dloni na niej NIE POLOZYL. JEGO OGRANICZENIE, TRZECI
    RAZ: byl wtedy caly, jest na 11,7/65, i nie rozdzieli, czy zmienila sie pieczec,
    czy on. Zadnej miary i zadnego zegara. TRZY RZECZY W JEDNYM POKOJU, NIESKLEJONE:
    (1) druga pieczec przy poludniowej scianie, (2) nisza w polnocnej z trzema czynnymi
    kanalami, w ktorej siedzi General, (3) miejsce po przekazniku Orena (feature_relay),
    ktory stal tu w Akcie 2. t_256 mowi wprost, ze zaden plik nie laczy kanalow z
    pieczeciami, a zwiazek przekaznika z niszą to hipoteza z t_255, nie ustalenie.
    Narrator tego NIE domyka. VARKHEN NIE SPOJRZAL NA NISZE ANI RAZU - nie postawiono
    go tutaj i nisza nie jest jego sprawa (fact_varkhen_does_not_know_the_foundation_object).
    OTWARTE: czy Lucan dotyka kregu, czy robi Geo albo sonde nekromantyczna, czy oglada
    sam osad, czy pyta Varkhena o cokolwiek, czy rusza Generala z niszy, czy wraca
    na gore. Lampa pali sie od okolo 1 h 40 z trzech.'
