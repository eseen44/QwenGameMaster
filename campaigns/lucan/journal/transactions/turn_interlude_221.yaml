  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Dwadziescia
    siedem minut.

    KOSZT: 3 JEDNOSTKI. Najdrozszy czar dnia rzucony na czlowieka, ktory i tak nie
    mial dokad

    isc. Rezerwa schodzi ponizej polowy.


    0. ROZSTRZYGNIECIE GRACZA W NAWIASIE, PRZYJETE, ZERO SEKUND. Ta rozmowa nie liczy
    sie jako

    kontakt w rozumieniu objective..#map_gate_guard_household_without_contact. Uzasadnienie

    gracza jest twarde i sprawdzalne w plikach: Marn nie zna imienia Lucana (nigdy
    nie padlo),

    od t_220 nie potrafi go opisac (zapadnia pamieci) i byl w trakcie rozmowy niezdolny
    do

    zlozenia spojnego sprawozdania z czegokolwiek. Zlecenie Seraphine dotyczy zmapowania

    gospodarstwa domowego BEZ SLADU u celu - a sladu nie ma. Stan kroku BEZ ZMIAN,

    obligation_conditional_risk_disclosure_to_seraphine NIE zostaje uruchomiona.

    Narrator podniosl to w poprzedniej turze jako pytanie, nie jako fakt, i nic nie
    zostalo

    zacommitowane - nie ma czego cofac.


    1. CONFUSION NIE JEST STEROWANIEM I TO STOI W KARCIE, NIE W ODMOWIE NARRATORA.

    ability_confusion, limits: NOT_DIRECT_MIND_CONTROL. uses: silne zaburzenie spojnosci

    decyzji, niestabilna falszywa logika. Lucan nie moze kazac. Moze POWIEDZIEC, i
    to jest

    cala roznica.

    CO SIE FAKTYCZNIE STALO: czar wchodzi, spojnosc decyzji Marna sie sypie - a Marn
    jest

    juz bez hamowania (druga warstwa rozwiazanego jezyka) i bez nogi (trzy stacki
    numb).

    W tym stanie jedyne czytelne zdanie, jakie do niego dociera, to zdanie jedynego
    czlowieka

    na podworcu: do srodka. NIE DLATEGO, ZE MUSI. Dlatego, ze nie ma z czym tego zestawic.

    Zaczyna sie przesuwac w strone tylnych drzwi - polzac, na trzech konczynach, jedna
    reka

    o beczke. Powodu, dla ktorego to robi, nie da sie odtworzyc i on sam go nie zna.

    RZECZY, KTORE ODMAWIAL PIETNASCIE MINUT TEMU - nie wchodzic o kulach, nie na oczach

    oddzialu - PRZESTAJA NA NIEGO DZIALAC, bo do ich utrzymania potrzebna jest spojna
    ocena

    sytuacji, a wlasnie ona zostala rozbita. Narrator nie nazywa tego zlamaniem woli.

    To jest dokladnie to, co robi drugi poziom: nie rozkaz, tylko usuniecie wszystkiego,

    co stalo miedzy czlowiekiem a najprostsza dostepna czynnoscia.


    2. CO TEN CZAR KOSZTOWAL I CZEGO NIE KUPIL - RACHUNEK JAWNY.

    energy_cost 3. Rezerwa 6,47 -> 3,47 przed regeneracja. To ponad polowa tego, co
    Lucanowi

    zostalo, i wiecej niz wszystkie klatwy tej sceny razem wziete (0,14 + 0,14 + 1
    + 2 + 0,1

    + 1 = 4,38 rozlozone na szesc procedur).

    CZEGO NIE KUPIL: trwalosci. concentration required, continuous_mutual_eye_contact
    required,

    ends_when_eye_contact_line_of_sight_or_concentration_breaks. Lucan odchodzi -
    czar KONCZY

    SIE w tej samej chwili. Zostaje po nim tylko to, co Marn zdazyl juz zaczac robic.

    visible: true, magical_trace: STRONG. To najglosniejsza rzecz, jaka Lucan zrobil
    dzisiaj,

    i kontrast jest caly: szesc procedur za 4,38 poszlo bez sladu, ten jeden czar
    za 3 poszedl

    z pelnym.

    KTO TO WIDZIAL: wylacznie Marn, ktory (a) nie jest magicznie pismienny, (b) ma
    rozbita

    spojnosc decyzji dokladnie w chwili, w ktorej mialby to zapamietac, (c) od t_220
    nie

    potrafi Lucana opisac. Nikogo innego na podworcu nie bylo i narrator nikogo nie
    dostawia.

    system/curses.md i system/magic.md: rezyduum po fakcie nie jest niczym, swiadek
    na zywo

    jest zagrozeniem. Swiadka na zywo nie ma.


    3. WYJSCIE. Lucan odchodzi na bezpieczna odleglosc i wychodzi furtka na boczna
    uliczke.

    Nie oglada sie i nie sprawdza, czy Marn dopelzl. NARRATOR TEZ NIE ROZSTRZYGA,
    CZY DOPELZL -

    gracz zadeklarowal wprost, ze ma to gdzies, a narrator nie dopisuje sceny, ktorej
    nikt nie

    oglada. Nie powstaje z tego zegar, termin, swiadek ani podejrzenie (retcon_000055).


    4. SPIDEY SCHODZI Z BELKI SAM. Rozkaz staly "luzno, w zasiegu pokoju od Lucana,
    bez

    obowiazku siedzenia na ciele" nie zostal odwolany i po retcon_000130 narrator
    ma go

    egzekwowac, a nie gubic. Spidey wychodzi z izby ta sama droga, ktora wszedl, i
    dolacza na

    uliczce. Tkacz juz jest przy nodze. Zuk w kieszeni. Nikt zadnego z nich nie zauwazyl.


    5. MARSZ DO GILDII. Dwadziescia piec minut przez miasto, skala z retcon_000042.

    Lucan idzie z pustymi rekami, z "Uprzejmosciami" pod pacha, glejtem w kieszeni
    i rezerwa

    ponizej polowy. Konczy w glownej sali gildii poszukiwaczy, przy okienku recepcji
    - tym

    samym, przy ktorym w t_012 odbieral stypendium polowe.

    PYTANIE, PO KTORE PRZYSZEDL, NIE ZOSTAJE W TEJ TURZE ZADANE. Scena sie tu zamyka

    i nalezy mu sie normalne otwarcie nastepnej.


    6. BILANS SCENY, PODANY BEZ POCIESZANIA, BO GRACZ SAM NAZWAL TO PRZEGRANA.

    ZDOBYTE: czwarte niezalezne potwierdzenie, ze glejt stalej trasy schodzi z gory,
    tym razem

    od czlowieka przy dragu; opis mechanizmu od dolu (woz stalej trasy NIE STAJE);
    zmierzone

    na wlasne oczy, jak rozwiazany jezyk produkuje material nieprawdziwy - i zmierzone
    tanio,

    na przechwalce, ktora da sie sprawdzic; pierwszy przebieg rzucania z pozycji slugi.

    NIEZDOBYTE: nazwisko, urzad, szczebel, zawartosc wozu, trasa. I nie zostalo zapytane

    o jedyna rzecz, ktora Marn mogl wiedziec z pierwszej reki - czy wiedzial, co wozi.

    ZAPLACONE: 7,38 jednostki energii z 15, w tym 3 za czar, ktory skonczyl sie w
    chwili

    odejscia.

    ZOSTAWIONE ZA SOBA: czlowiek, ktory nie stanie jutro na zmianie, jesli noga nie
    zejdzie,

    i ktory zachowuje CALA TRESC rozmowy bez twarzy.


    7. STAN. Czwarty dzien interludium, glowna sala gildii poszukiwaczy przy okienku
    recepcji.

    Lucan sam - Spidey i Tkacz przy nim, zuk w kieszeni. Integralnosc 19/19, energia
    po odjeciu

    3 i po regeneracji - czytac z pliku. Zegary bez ruchu poza uplywem czasu.

    Godzine czytac ze state/time.yaml.

