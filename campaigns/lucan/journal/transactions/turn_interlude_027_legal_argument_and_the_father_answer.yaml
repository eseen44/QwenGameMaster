  summary: 'Bez testu - to jest rozmowa o prawie, a Seraphine odpowiada tym, co wie.

    GDZIE LUCAN MA RACJE, i ona to potwierdza: prawo Solmary jest antropocentryczne
    i nie

    tworzy ogolnych praw zwierzat, dusz ani godnosci (legal-order.yaml). Modyfikacja

    drobnych bezkregowcow to realna szara strefa, a maly zywy pajak zmodyfikowany
    magia

    smierci jest "trudny do zaklasyfikowania i dowiedzenia" (necromancy-law.yaml).
    Akademia

    faktycznie klasyfikuje przez mechanizm, ciaglosc zycia i wiazanie duszy, wiec
    jego

    framing energii jest jej wlasnym argumentem. I ma racje, ze kontrolowany nieumarly

    rozumny - Varkhen - to zupelnie inna kategoria, "severe necromantic offense".

    GDZIE SIE MYLI, i Seraphine wyklada to punkt po punkcie:

    1. PRAKTYKA. Nielegalne nie jest posiadanie pajaka - nielegalna jest sama PRAKTYKA

    nekromancji. Pajak nie jest oskarzonym, jest DOWODEM. Brak prawa o godnosci zwierzat
    nie

    ma tu nic do rzeczy, bo zarzut dotyczy tego, co robi Lucan, nie tego, czym jest
    pajak.

    2. ODREBNE PRZESTEPSTWA. Szara strefa nie daje immunitetu. Uzycie pajaka do zabijania,

    szpiegowania albo przenoszenia zakazanej energii tworzy osobne czyny - a Lucan
    ma

    wszczepione zeby zmii, osobny gruczol paralityczny, zademonstrowane skrytobojstwo
    i

    cztery sieciarze na stalych posterunkach w garbarni, na wysypisku i na dachu tej
    wlasnie

    gildii. Nie trzeba klasyfikowac pajaka, zeby postawic zarzut uzycia jadowitego
    zwierzecia

    jako narzedzia zabojstwa i siatki obserwacyjnej. To sie dowodzi latwiej niz nekromancja.

    3. BRAK PRZEPISU NIE JEST BEZPIECZENSTWEM - to jest doslownie zasada tego porzadku

    prawnego. Wladza ma zagrozenie publiczne, swietokradztwo, bezprawna magie, zniszczenie

    wlasnosci i zaklocenie porzadku. Zawsze cos sie znajdzie.

    4. VARKHEN JUZ JEST PROBLEMEM, nie przyszlym. Lucan mowi "dopoki nie animuje Varkhena",

    ale wiez formalnej kontroli JUZ istnieje. Przykrywka starozytnego straznika trzyma
    sie

    wylacznie dopoki kontrola i nekromantyczne utrzymanie pozostaja niedowiedzione
    - a

    demonstracja precyzyjnego posluszenstwa martwej rzeczy, ktora Lucan zrobil przed

    minuta, jest dokladnie tym rodzajem dowodu, ktory czyni "kontroluje nieumarlych"

    wiarygodnym takze co do duzego.

    ODPOWIEDZ NA "I CO WTEDY SIE ZMIENI" - Seraphine daje ja precyzyjnie. Prawnie:

    prawdopodobnie nic natychmiast, bo Kosciol nie ma tu jurysdykcji karnej i doktrynalnie

    nie uznaje szarej strefy zwierzat wcale. Praktycznie: WSZYSTKO, bo zmienia sie
    stan

    wiedzy z podejrzenia na potwierdzenie, a domyslna reakcja Kosciola na wiarygodny
    dowod

    nie jest procesem - jest zadaniem stlumienia, zniszczenia i kary. To jest tez
    dokladnie

    ten warunek, ktory uruchamia zegar zainteresowania Inkwizycji.

    PRAWNICY - jedna uwaga praktyczna. Prawnik z ulicy zna urzednikow magistratu,
    nie

    Akademie. Obrona karna i obrona klasyfikacyjna to dwie rozne obrony i moga sobie

    przeczyc: jedna mowi "to nie bylo nekromancja", druga "nawet jesli, to nie ma
    przepisu".

    Wybor jednej oslabia druga.

    NAZWISKO - Seraphine przyznaje mu i to. Chroniony aktor moze negocjowac klasyfikacje,

    forum, dowody i warunki oslony; nazwisko realnie to daje. Ale dorzuca kwasniejsza
    wersje

    tego, co Lucan sam powiedzial: rod nie bedzie bronil Lucana. Rod bedzie bronil
    NAZWISKA.

    A najtansza metoda niedopuszczenia, zeby kleska wycieral sobie pysk nazwiskiem
    Veyr, nie

    jest publiczna obrona Lucana - jest ciche zamkniecie sprawy na ich warunkach,
    w ktorym

    cena to on. To sa ci sami ludzie, ktorzy nie interesowali sie nim, dopoki nie
    dalo sie na

    nim zarobic.

    Pytanie o ojca zostalo w koncu odpowiedziane - Seraphine wie teraz, ze Lucan byl
    dzis

    wieczorem na Akademii u ojca, ktory tam pracuje, i ze Lucan nie liczy ani na niego,
    ani

    na rodzine. NIE wie, ze ojciec zna metode, ani o dyspucie.

    '
  new_decision: 'Seraphine oddala mu polowe argumentow i rozebrala druga polowe -
    praktyka jest

    przestepstwem niezaleznie od pajaka, siec i jad to osobne zarzuty latwiejsze do

    dowiedzenia, brak przepisu nie jest oslona, a Varkhen jest problemem teraz, nie
    potem.

    Na pytanie o kaplana odpowiedziala, ze prawnie nie zmieni sie nic, a praktycznie

    wszystko. Nazwisko przyznala jako realna dzwignie i od razu pokazala jego cene.
    Wie

    juz o ojcu i o Akademii. Nie wie o dyspucie za szesnascie dni ani o tym, ze ojciec

