  - op: set
    instance_id: companion_spidey
    path: position.zone_id
    value: zone_temporary_holding
  - *id002
  new_decision: 'Lucan mieszka w piwnicy gildii, dwoje drzwi od czworki wspolpracujacych
    swiadkow. Seraphine czeka na doprecyzowanie, co dokladnie wnosi do celi - a osobno
    wisi warsztat: schowek w murze miejskim jest zaopatrzony i pusty, nocny urobek
    sieciarzy lezy w baszcie, a pajak alarmowy do jej gabinetu nie zostal jeszcze
    zrobiony. Lucan nie zdecydowal tez, czy rusza dzis w noc, czy najpierw spi.'
