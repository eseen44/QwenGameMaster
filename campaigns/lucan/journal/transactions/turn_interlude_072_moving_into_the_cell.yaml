outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  summary: 'Bez testu. Lucan wprowadza sie do celi po Varkhenie. Seraphine zgadza
    sie na uklad i utrzymuje pokoj na gorze, ale wskazuje dwie ceny, ktorych Lucan
    nie policzyl. 1. CELA PRZYJETA. Pomieszczenie po Varkhenie (zone_temporary_holding)
    staje sie kwatera Lucana - kamienne, zamykane, suche, bez okna. Wnosi tam swoje
    rzeczy. Spidey schodzi z nim. 2. POKOJ NA GORZE ZOSTAJE ZAREJESTROWANY. Seraphine
    nie odbiera go z rejestru, bo pusty wpis jest bezuzyteczny, a wpis z nazwiskiem
    jest przykrywka. Bierze na siebie utrzymywanie sladu zamieszkania - korytarz i
    rota sprzatania sa jej. Nazywa granice tego, co potrafi: umie zrobic pomiete lozko
    i zuzyta miske, nie umie wyprodukowac czlonkow gildii, ktorzy pamietaja, ze go
    tam widzieli. Przykrywka wytrzyma przeszukanie, nie wytrzyma rozpytywania. 3.
    SASIEDZI. Cela Lucana i pokoj czworki ocalalych wychodza na TEN SAM krotki korytarz
    zatrzymań. Seraphine wskazuje oba ostrza: z jednej strony nikt z nich nie zamieni
    slowa z kimkolwiek bez jej wiedzy i Lucan siedzi im na glowie; z drugiej - to
    sa wspolpracujacy swiadkowie, ktorych ktos predzej czy pozniej zapyta, co widzieli,
    a oni beda znac jego godziny, jego wejscia i to, ze mieszka pod ziemia w budynku
    gildii. 4. GRATY - PYTANIE BEZ ODPOWIEDZI. Seraphine pyta wprost, co znaczy "swoje
    rzeczy", bo od tego zalezy, czy wlasnie zgodzila sie na kwaterę, czy na skład.
    Zaznacza, ze szescdziesiat kilo cmentarnego zlota pod jej wlasnym rejestrem wejsc
    to nie jest schowek, tylko jej wspoludzial z podpisem i data. Lucan jeszcze nie
    sprecyzowal. 5. EKSPERYMENTY POZA DOMEM - PRZYJETE, I ZOSTAJE JEDNO GOTOWE MIEJSCE.
    Deklaracja Lucana zdejmuje wade, ktora Seraphine wskazala wczesniej: przeszukanie
    budynku nie znajdzie warsztatu, bo warsztatu w budynku nie bedzie. Lucan ma juz
    zaopatrzony schowek w murze miejskim (cache_cemetery_north_bushes w loc_city_wall_hideout):
    preparat konserwujacy, sol rytualna, proszek osuszajacy, dwie fiolki opozniajace
    rozklad, srodek przewodzacy i maly zestaw narzedzi rytualnych. Zimno, daleko i
    poza murem budynku - ale to gotowy stol.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 600
  - op: set
    instance_id: pc_lucan
    path: position.location_id
    value: loc_lumaria_guild_basement
  - op: set
