  actor_id: pc_lucan
  scope: execution
  time_seconds: 1200
  stakes: 'Pajeczyny w trzech miejscach sa jedynym fizycznym osadem, ktory Seraphine
    uznala za realny dowod przeciw Lucanowi (planning/act-03-defence.yaml#legal_doctrine_stress_test).
    Czwarta mialaby lezec w jej wlasnym biurku. Osobno: Seraphine prowadzi to pietro,
    a Lucan wlasnie wyszedl z gabinetu Ruska przez drzwi, ktore wyja.'
