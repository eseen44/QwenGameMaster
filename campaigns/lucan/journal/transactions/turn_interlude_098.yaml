outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu. Dwadziescia minut rozmowy, zero energii, nic nie postawione.
    1. STAN FAKTYCZNY, ZANIM COKOLWIEK PADNIE. W szufladzie NIE MA pajeczyny i nigdy
    nie bylo - to byla deklaracja intencji, nigdy nie wykonana, i dlatego siedzi na
    liscie presji jako a_web_in_her_desk_drawer_is_declared_intent_only. Zaden sieciarz
    ani pajak nie jest na tym pietrze: spy_cellar_spider_03 i 04 leza w pudelku w
    celi w piwnicy, spy_cellar_spider_06 chodzi po piwnicy, czterej sieciarze sa w
    baszcie i przy garbarni. Lucan nie pokazuje wiec niczego - PROPONUJE i pyta o
    zgode przed faktem. 2. I TO JEST ROZNICA, KTOREJ SERAPHINE NIE PRZEOCZY. Pyta
    przed. Nie po. Cala historia ich ukladu sklada sie z rzeczy, ktore Lucan robil,
    a ona dowiadywala sie o nich pozniej albo w trakcie - zloto pod jej rejestrem,
    Spidey drgajacy przy nocnym urzedniku. To jest pierwszy raz, kiedy przynosi jej
    decyzje, zanim ja podejmie. Przyjmuje to jak coś, co ma cene, i pyta wprost, co
    sie zmienilo. 3. ZGODA JEST, I JEST WARUNKOWA. Sam pomysl uznaje za DOBRY, bo
    szuflada z papierami to nie inwigilacja jej osoby, tylko alarm na przeszukanie
    - drgania mowia, ze ktos otwiera, i nic ponadto. Przyjela juz oba kanaly alarmowe
    w turze 070 i to sie z tym domyka. Ale nazywa cene, ktorej Lucan nie policzyl,
    tak samo jak nazwala ja przy zlocie i przy pokoju na gorze. 4. CENA - PAJECZYNA
    JEST JEDYNYM DOWODEM, KTORY JEJ ZOSTAL. Przy rozbieraniu doktryny prawnej (event_turn_interlude_027,
    028) Seraphine oddala Lucanowi trzy z czterech dziur: nie ma cial, najemnik moze
    nosic narzedzia mordu, zarzut siatki zamyka sie na oskarzeniu. Zostal jej DOKLADNIE
    JEDEN argument i sama nazwala go cienkim: fizyczny osad, czyli pajeczyny w trzech
    miejscach. Lucan proponuje wlasnie czwarta - w jej wlasnym biurku, w budynku,
    ktory go ukrywa. Jesli ktos kiedykolwiek pociagnie za ten jeden watek, nie znajdzie
    sladu Lucana w gabinecie Seraphine. Znajdzie slad Seraphine. 5. WARUNKI, KTORE
    STAWIA. Zgoda obejmuje TE szuflade i nic wiecej; ma wiedziec, kiedy okaz zostanie
    wniesiony, zeby nie bylo drugiego drgniecia przy swiadku; i ma to byc okaz NIEZAKOTWICZONY
    - bo od tury 089 kazdy zakotwiczony nosi w sobie Death_Anchor, czyli nazwana technike
    nekromantyczna, a nie martwego robaka. Znaleziony pajak bez kotwicy jest brudem.
    Znaleziony pajak z kotwica jest dowodem rzeczowym z podpisem. Oba pajaki w pudelku
    sa niezakotwiczone, wiec warunek jest spelniony z marszu. 6. PYTANIE, KTORE ZADAJE
    POTEM, I JEST GORSZE NIZ CALA RESZTA. "Gdzie jeszcze?" Nie pyta oskarzycielsko
    - pyta jak ktos, kto zarzadza budynkiem i wlasnie uslyszal, ze ktos rozstawia
    w nim czujniki. Lucan ma w pudelku DWA pajaki, a uzgodniony jest jeden. Drugi
    mial isc do pokoju narad gildii - sali, w ktorej za trzynascie dni odbedzie sie
    jego wlasne przesluchanie - i nie jest uzgodniony z nikim. 7. WORLD MOVE - ONA
    JUZ WIE O RUSKU. To jest jej pietro, jej korytarz i jej rota. Nie potrzebowala
    magii: drzwi Ruska wyly przez cala dlugosc otwarcia, a przedtem czlowiek zarejestrowany
    w pokoju na gorze przeszedl przez hol tak, zeby wszyscy go zapamietali, podspiewujac.
    Mowi mu obie rzeczy jednym zdaniem i bez pretensji: widocznosc w holu jest DOKLADNIE
    tym, czego jej przykrywce brakowalo i sama tego nie umiala zrobic (event_turn_interlude_072);
    nucenie i wizyta u Ruska nie sa. Nie pyta, co tam robil. 8. CZEGO NIE POWIEDZIAL.
    Lucan nie wspomnial o Malenie Corthu ani o tym, ze akta z garbarni z jego nazwiskiem
    sa uzgadniane TERAZ po stronie magistratu. Seraphine nadal o tym nie wie, a to
    jest kanal, w ktorym nie ma jurysdykcji. Nadal nie wie tez o dyspucie ani o planie
    wystawienia okazow. 9. STAN. 10:40 dnia trzeciego. Energia 8 z 15, integralnosc
    19 z 19, bez warunkow. Szuflada nadal pusta, pajaki nadal w pudelku pietro nizej.
    Boros i Mara nadal dzisiaj, i zostalo na nich mniej dnia niz bylo.'
  new_decision: Seraphine zgodzila sie na jednego pajaka w szufladzie, na wymienionych
    warunkach, i wlasnie zapytala, gdzie jeszcze. W pudelku sa dwa. Drugi mial isc
    do pokoju narad.
