outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'DOJSCIE DO ZAWALU WYKONANE, ZEJSCIE NIE - gracz zadeklarowal powrot do
    zawalu, wiec tura konczy sie na krawedzi. Trasa: zone_north_ramp -> zone_north_collapse,
    ok. 130 m po przeskalowaniu (retcon_000166), trzy minuty nocnym polem. CO POKAZANO
    ZE ZRODEL, NIC PONAD TO: feature_collapse ma kind unstable_descent; connection_collapse_descent
    do loc_varkhen_chamber ma w pliku travel_time "2 minutes with ropes", a LIN W
    player/inventory.yaml NIE MA - to fakt z rejestru, nie przeszkoda wymyslona przez
    narratora, i nie zamieniono go ani w zakaz, ani w zegar. Od strony podziemi ta
    sama droga ma travel_time "uncertain_after_collapse", wiec stan przelotu w dol
    pozostaje NIEUSTALONY do momentu sprawdzenia. VARKHEN: to miejsce zna wylacznie
    od spodu - tedy go wyniesiono, i w t_253 przy bramie stanal twarza wlasnie w te
    strone. Tutaj dostaje gest, nie wyklad; jego cialo (integrity 9,4/65, severely_depleted)
    ogranicza to, co moze zrobic rekami, i narrator nie kaze mu tego samemu oceniac.
    Zadnej nowej wiedzy mu nie dopisano. NIE DOTKNIETO: obsady niszy, zuka, growth-banks.
    Zgoda gracza na lekkie rozpychanie zbiornika przeladowaniem jest ZANOTOWANA, ale
    nie zapisana jako stawka - w obecnym ukladzie zuk nie jest przeladowany i nie
    ma czego rozpychac (rachunek podany graczowi poza gra). POLA RUSZONE: pozycje
    czterech instancji.'
  prose: 'Pole grobów o tej porze jest cichsze, niż powinno być miejsce z taką zawartością.

    Trawa mokra, ziemia miękka po dniu, płyty krzywe i połamane tak, jak zostawiło
    je

    sto lat osiadania. Idzie się tu wolniej, niż się wydaje, bo nic nie leży równo.


    Zawał poznaje się z dwudziestu kroków - najpierw po tym, że trawa się kończy.

    Potem po lejku: kilkanaście kroków w poprzek, ziemia zsunięta w dół jak piasek

    w klepsydrze, w środku połamane płyty ustawione dziobem do góry i czarna dziura,

    z której idzie powietrze. Zimniejsze niż noc i bez zapachu trawy. Krawędzie są

    wygryzione, nie zaokrąglone - to się osunęło niedawno w skali tego miejsca,

    a nie zarosło przez pokolenie.


    Varkhen podszedł do samej krawędzi i stanął. Nie zaglądał w dół i nie odsunął
    się.

    Stał tak, jak stoi się przed drzwiami własnego domu, o którym się wie, że w środku

    jest ktoś inny.


    Zejść się tędy da - tyle widać. Nie widać, czy da się zejść i wrócić, bo to nie
    jest

    schodek, tylko sypka skarpa z przewieszką w połowie, i z góry nie widać, gdzie
    się

    kończy. Kiedy wyciągało się stąd Varkhena, robiło to sześć osób i lina.


    Liny nikt z nich nie ma.

    '
