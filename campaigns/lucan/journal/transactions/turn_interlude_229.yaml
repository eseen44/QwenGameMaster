  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii.

    TURA ROZEGRANA PONOWNIE PO retcon_000136. Kazde zdanie Seraphine ma teraz wskazane

    zrodlo w JEJ knowledge albo w scenie, w ktorej byla obecna.


    1. DYSCYPLINA WIEDZY - CO ZOSTALO WYCIETE W STOSUNKU DO POPRZEDNIEGO PRZEBIEGU.

    Nie mowi: o kwotach 18-20 tys. dla Borosa i Mary, o 52 000 za lup, o reakcji Borosa

    w pokoju powroznika (t_115), o deklaracji Mary w sprawie Kosciola (t_113), o trwalym

    powiekszeniu rezerwy Lucana z 12 na 15. AUDYT: seraphine-vale.yaml nie ma zadnego

    z tych faktow. Nie miala prawa ich znac i nie zna.

    CO ZOSTAJE, BO MA TO NA KARCIE: raport przedoperacyjny Lucana z pelna trescia

    (fact_seraphine_received_preoperation_cemetery_report), smierc Orena na powierzchni
    przy

    niej i przy ekspertach z pobrana probka (byla obecna, milestone_044b), trzy pieczecie

    z zeznania Varkhena (fact_seraphine_knows_three_seals), kaplan znajacy wejscie
    i wizyta

    z Orenem (fact_seraphine_knows_priest_visited_varkhen_with_oren), nagroda wisząca
    jako

    "oczekuje przegladu" bo sama tego dopilnowala (act-03-defence#reward_is_hostage),
    oraz

    droga do zakonow mieczowych (t_122, jej wlasna oferta).


    2. INFORMACJA O BOROSIE I MARZE JEST NOWA I PRZYCHODZI OD LUCANA W TEJ TURZE.

    Gracz mowi jej wprost, ze dwoje czlonkow gildii rangi C powie to, co im kaze,
    bo jest to

    funkcja kosztu. To NIE jest potwierdzenie czegos, co ona podejrzewala - to jest
    fakt,

    ktorego nie miala. Zgodnie z retcon_000120 wchodzi do jej knowledge JAKO TO, CO
    USLYSZALA

    OD LUCANA, a nie jako prawda o swiecie; kwot nie podano i ona o nie nie pyta w
    tej turze.

    JAK REAGUJE - zgodnie z karta, nie z odruchem moralnym (do_not_play: zadnego oburzenia

    na oportunizm Lucana, to dla niej oczywiste i policzone). Przyjmuje to jako dana

    operacyjna i wyciaga z niej jeden wniosek, ktory dotyczy JEJ: dwoje ludzi, za
    ktorych

    gildia formalnie odpowiada, jest kupionych przez czlowieka, za ktorego ona reczy.

    Nie robi z tego sceny i nie grozi (retcon_000041). Odnotowuje.


    3. REKLAMACJA O SKALI - TRAFNA, PRZYJETA, I ODPOWIEDZ JEST O NIEJ, NIE O INSTYTUCJI.

    Material w aktach nie jest slaby. Raport przedoperacyjny wymienial: rozlegle tunele

    i pustki, DWA odrebne nieumarle stworzenia, brak ciala mlodego straznika, mozliwy
    handel

    zwlokami, wplyw na pracownika kancelarii, RYZYKO INKWIZYCJI - i potwierdzil sie
    co do

    punktu. Do tego smierc Orena przy ekspertach z probka i zeznanie o trzech pieczeciach.

    DLACZEGO NIKT NIE ZAREAGOWAL: bo to nigdy nie zostalo PODANE JAKO ALARM. Zostalo
    podane

    jako raport z zamknietej, udanej operacji - i ustawila to tak ONA, majac z tego
    dwie

    korzysci: sprawa zostaje jej, a nagroda wisi w rejestrze jako "oczekuje przegladu"

    zamiast "zamkniete". Uwage kierownictwa zjada od tygodni zadanie sluzb o wydanie
    materialu.

    ONA TO PRZYZNAJE JAKO WLASNY BLAD, drugi raz w ciagu kwadransa, i nazywa go tak
    samo:

    filtrowala przeplyw, bo priorytet pierwszy kazal jej trzymac sprawe w rekach.


    4. POZYCJA NAZWANA WPROST (retcon_000041, bo gracz ma prawo ja czuc).

    Gildia nie ma nad Lucanem dzwigni zatrudnienia; przesluchanie rozstrzyga, czy
    instytucja

    go ZATRZYMA. W ramie pieczeci Lucan nie jest podsadnym - jest jedynym czlowiekiem,

    ktorego raport sie sprawdzil, i jedynym z dostepem do bieglego.


    5. CZYNNOSC, NIE PLAN (retcon_000135 punkt b). Wyjmuje czysta karte kontraktowa
    gildii

    i wypelnia ja przy Lucanie: forma, adresat i zamawiajacy - gildia, jej reka, jej

    nazwiskiem, bo "zamawia gildia albo nikt" to jej wlasny warunek z t_122.

    DWA POLA ZOSTAJA PUSTE: ZAKRES i DATA. Oba wymagaja pomiaru trzeciej pieczeci.

    NARRATOR NIE PODAJE nazwiska komandora, zakonu ani terminu (retcon_000058) - pola
    sa

    opisane, nie wypelnione trescia, ktorej zaden plik nie ma. Karta lezy niedokonczona.


    6. VARKHEN - jedno zdanie, zgodne ze speech_traits (nie udaje, ze wie, kiedy nie
    wie):

    stad nie poda i nie bedzie zgadywal, musi stanac przy trzeciej pieczeci, a idzie
    tam

    mierzyc, nie patrzec, i mierzenie trwa. NARRATOR NIE PODAJE ILE.


    7. CZEGO NARRATOR TU NIE ZROBIL. Nie stworzyl zegara pieczeci (retcon_000055).
    Nie podal

    nazwiska komandora, zakonu, terminu ani zakresu. Nie wprowadzil nikogo z kierownictwa

    i nie ustanowil ich reakcji. Nie odwrocil decyzji z t_228 - uklad ze Straza stoi.

    NIE POZWOLIL SERAPHINE UZYC ANI JEDNEGO FAKTU SPOZA JEJ KARTY (retcon_000136).

    Zegary bez ruchu poza uplywem czasu.


    8. STAN. Czwarty dzien interludium, gabinet Seraphine, gorne pietro gildii.

    Obecni: Lucan, npc_seraphine_vale, npc_varkhen_mind (rog pokoju). Spidey i Tkacz
    przy

    Lucanie, zuk w kieszeni. Na blacie: niedokonczona karta kontraktowa, dwa pola
    puste.

    Varkhen 9,2/65. Lucan 19/19, energia bez wydatku - czytac z pliku.

    '
  new_decision: 'Karta kontraktowa lezy na blacie z dwoma pustymi polami - zakres
    i data - i oba wymagaja pomiaru trzeciej pieczeci. Seraphine przyznaje, ze to
    ona filtrowala przeplyw i ze material nigdy nie zostal podany jako alarm. Kwestie
    Borosa i Mary przyjela od Lucana bez moralizowania i bez pytania o kwoty. Zostaje
    jedno: kiedy i jak Varkhen trafia pod trzecia pieczec.'
