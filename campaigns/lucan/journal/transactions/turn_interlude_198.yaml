  declared_action: 'Lucan tlumaczy odmowe: nie moze pozwolic, zeby ktos powiazal mechanizmy
    ze szkielkami z cmentarzem i jego mana - "pana zysk, moja strata". Wyklada zuka
    na stol, do gory nogami, jako miare: chodzi o blaszke, ktora zastapilaby mu pancerz
    BRZUSZNY. Zastosowanie podaje obrazem - robi z niego swietlika, wiec kazda skaza
    przeszkadza w swieceniu i marnuje swiatlo. To male soczewki, wiec cena gatunku
    nie jest problemem: takie kawalki powstaja jako odpad jubilerski, natomiast wyszukanie
    dobrego kawalka w miale zajmie chwile. Alternatywa: analog metaliczny, ale to
    wymagaloby czegos mniej elastycznego niz srebro - twardego i kruchego zamiast
    kowalnego, i przewodzacego magie - co brzmi drogo. Sklada tez propozycje handlowa:
    zbitki sa dobrym materialem, bo nikt ich nie chce, a jesli plan wyjdzie, bedzie
    ich potrzebowal duzo - na tyle duzo, ze Akademia moze zaczac zamawiac je w trybie
    stalym, co jak na odpad przemyslowy powinno pryncypala zainteresowac. Na koniec
    zaweza zamowienie na wiedzme: chce same namiary, kto i gdzie, moze byc poza miastem
    byle nie daleko, nie trzeba jej wozic, raczej stara niz mloda.'
