  perspective: pc_lucan
  summary: 'Lucan po cichu rzuca trzy male, ciche klatwy pecha na drzwi gabinetu Ruska
    pietro wyzej, nie ruszajac sie z glownej sali gildii i nie widzac samego Ruska.
    Efekty osiadaja w drewnie i okuciach: zawiasy dostana skrzypienie ktore pojawi
    sie w najgorszym mozliwym momencie, zamek zacznie sie zacinac tak ze trzeba go
    szarpnac pod specyficznym katem, a prog drzwi dostanie male, niepozorne wybrzuszenie
    akurat na wysokosci czubka buta. Nic z tego nie jest niemozliwe ani widowiskowe
    - to zwykly pech, dopoki ktos nie zacznie szukac wzoru. Trzy stakowane klatwy
    na jednym obiekcie w krotkim czasie zostawiaja jednak nieco wyrazniejszy magiczny
    slad niz pojedyncze uzycie - wciaz niewykrywalny dla Ruska (nie jest magicznie
    swiadomy), ale teoretycznie widoczny dla kogos przygotowanego, kto zdecydowalby
    sie zbadac te konkretne drzwi.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
    units: 0.3
  - *id002
  new_decision: Klatwy czekaja cicho na Ruska, ktory nie jest teraz na miejscu - efekt
