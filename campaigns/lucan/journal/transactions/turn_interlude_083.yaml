  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Skrzynia na wage - 15 srebra, obiad dla dwoch - 3; zostaje
    24. Wysilek zerowy, zwrot nieproporcjonalnie duzy. 1. CO JEST W SKRZYNI. Zmarly
    byl BALWIERZEM-CHIRURGIEM, nie magiem, i to jest lepszy los niz jakikolwiek grymuar.
    Trzy czwarte zawartosci to makulatura: traktaty dewocyjne, almanachy, poradniki
    o humorach. Reszta to rzeczy, ktorych Lucan nie mial i nie mogl kupic u skryby:
    PORZADNE ATLASY ANATOMICZNE z rysunkami z sekcji, z marginaliami jednej reki poprawiajacymi
    drukarza. Corpse_Stitch stoi u Lucana na 35 z jawnie zapisanym ograniczeniem "anatomical
    mistakes remain possible" - to jest material, ktory uderza dokladnie w to ograniczenie,
    i to na ludzkiej skali, nie owadziej. 2. NOTATNIK PODRECZNY BALWIERZA. Wsrod ksiag
    lezy jego wlasny brulion: kto, kiedy, co zszyte, ile zaplacono. Balwierz lataja
    ludzi PO CICHU, bez zglaszania ran, wiec ten brulion jest spisem cichej przemocy
    w dzielnicy z ostatnich lat - z nazwiskami albo przezwiskami, datami i kwotami.
    Nikt tego nie schowal, bo rodzina sprzedala pokoj na wage. 3. JEDNA RZECZ, KTOREJ
    NIE POWINNO TAM BYC. W skrzyni jest tom z ZNAKIEM WLASNOSCI - biblioteczna sygnatura
    wypalona w okladce. Ksiazka nigdy nie byla wlasnoscia balwierza. Posiadanie jej
    jest sledzalne do instytucji, ktora ja stracila; Lucan nie jest zmuszony jej trzymac
    i wie o tym od pierwszego rzutu okiem. 4. HESK PRZYJMUJE UKLAD OD RAZU I ZA TANIO.
    Legenda "grupa badajaca wydarzenia na cmentarzu" dziala, bo jest PRAWDZIWA - operacja
    cmentarna byla robota gildii z oficjalnym raportem. Dla Heska to nie legitymacja
    urzedu, to sensacja: pierwszy raz ktos chce od niego czegos, co on juz ma. Zgadza
    sie notowac dalej, i to nie tylko OPISY, ale i TWARZE. Nie chce pieniedzy. Chce,
    zeby ktos raz na jakis czas przyszedl i wysluchal. 5. CO WOLONTARYJNIE DORZUCIL,
    BO SCHLEBIONY CZLOWIEK MOWI WIECEJ, NIZ GO PYTANO. Po cmentarnej sprawie handel
    tego rodzaju ksiazkami nie zrobil sie glosniejszy, a CICHSZY - pytania o "mieso,
    ktore sie nie psuje" URWALY SIE mniej wiecej miesiac temu i od tamtej pory nie
    wrocily. Rozbicie siatki Orena nie przenioslo popytu w inne miejsce, ono go wygasilo.
    To znaczy, ze pytajacy byli JEDNA grupa, nie rozproszonymi amatorami. 6. TERMIN
    CHLOPCA W LIVERII. Hesk sprawdza wlasny spis i podaje date: chlopiec zjawia sie
    ZA OSIEM DNI. Wypada to przed przesluchaniem i przed dysputa. Hesk obiecuje przyjrzec
    sie barwie, choc heraldyki nie zna i sam mowi, ze na pewno jej nie nazwie. 7.
    KOSZT JAWNY. Hesk przyklada teraz Lucana do sprawy cmentarnej na stale i bedzie
    o tym mowil - z checia, jako o swoim udziale w sledztwie. To sie nie da odwolac.'
  operations:
  - op: change_relationship
    npc_id: npc_hesk_dorn
    delta: 25
  - *id002
  new_decision: Skrzynia jest kupiona i zbyt ciezka, zeby chodzic z nia po miescie
    - trzeba ja gdzies odniesc (cela w piwnicy gildii, schowek w baszcie) i zdecydowac,
    co zrobic z tomem z bibliotecznej sygnatury oraz czy Lucan siada teraz do brulionu
    balwierza.
