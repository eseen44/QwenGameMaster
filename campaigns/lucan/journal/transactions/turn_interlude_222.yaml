  summary: 'Bez testu - interludium, roll_policy disabled, fixture bez arkusza. Cztery
    minuty,

    zero energii. Obie odpowiedzi ladują, druga jest gorsza, niz Lucan sie spodziewal,

    i nie dlatego, ze ktos mu czegos odmawia.


    1. SERAPHINE JEST W BUDYNKU - Z KARTY, NIE Z DECYZJI NARRATORA. seraphine-vale.yaml

    ma current_location_id: loc_lumaria_adventurers_guild, current_zone_id:

    zone_guild_upper_offices. Wyszla dzis okolo poludnia na spotkanie ze Straza Miejska

    (t_190, material oddany jej dwadziescia minut przed wejsciem do tamtego pokoju);

    jest 16:52, spotkanie sie skonczylo i wrocila. Urzedniczka wie to z wlasnego okienka,

    bo przez nie sie przechodzi. NARRATOR NIE DODAJE, JAK POSZLO, ANI W JAKIM ONA
    JEST

    STANIE - zaden plik tego nie mowi, a karta Seraphine ma

    lifecycle.last_confirmed_event_id: event_turn_interlude_187, czyli sprzed 35 tur

    (retcon_000121). Tresc tamtego spotkania jest OTWARTA i dowie sie jej wylacznie
    ten,

    kto pojdzie na gore i zapyta.


    2. CO PRZYSLUGUJE D-RANKOWI - ODPOWIEDZ Z TARYFY, KTORA URZEDNICZKA ZNA NA PAMIEC.

    Stypendium polowe: 15 srebra za dni pracy przy operacji, wyplacone w tym okienku

    w t_012 (inventory.yaml#carried_silver). Tablica zlecen: ranga D otwiera zlecenia

    D-rankowe, i to jest cala tresc awansu - nie stawka, tylko dostep do drozszej
    pracy.

    Nagroda za Akt 2: w rejestrze stoi "oczekuje przegladu kierownictwa", nie "zamkniete",

    i Seraphine sama dopilnowala, zeby tak stalo (act-03-defence.yaml#act_02_rewards,

    reward_is_hostage). Urzedniczka czyta to z wpisu bez wlasnego zdania - agenda:

    escalate_flagged_cases_without_personal_opinion.


    3. CZEGO NIE MA I NARRATOR TEGO NIE WYMYSLA (retcon_000058). ZADEN plik tej kampanii

    nie ustanawia gildyjnych swiadczen, budzetu szkoleniowego, opieki medycznej ani

    instytucji nauczyciela. Nie ma takiej listy, wiec nie zostaje wyjeta. To NIE jest

    odmowa ani opor postawiony graczowi (retcon_000015/000055) - to jest brak bytu.

    Urzedniczka odpowiada dokladnie tyle, ile ma w taryfie: gildia PLACI ZA WYKONANA

    ROBOTE i nic poza tym przy tym okienku nie przechodzi. Nie mowi "nie wolno", mowi

    "nie tedy". Cokolwiek innego jest sprawa na gore, a nie do rejestru.

    NARRATOR NIE USTANAWIA TEZ, ZE TAKIEJ RZECZY NIE DA SIE ZALATWIC - ustanawia tylko,

    ze dzis nie istnieje w zadnym pliku. Jesli ma powstac, powstanie z ukladu, nie

    z formularza.


    4. CO ISTNIEJE I JEST ODPOWIEDZIA NA TO SAMO PYTANIE, TYLKO OD DRUGIEJ STRONY.

    Trening z Mara Teln (C-rank) - objective_develop_lucan#daily_training_with_mara,

    ostatnio t_184. To nie jest program gildii, tylko druga poszukiwaczka, ktora zgodzila

    sie z nim stawac. Dostep do nauczycieli, ktory Lucan realnie ma, jest wiec calkowicie

    prywatny i oparty na relacjach, a nie na przynaleznosci - dokladnie tak samo jak

    Akademia, katedra i ojciec. Instytucja daje mu pokoj dyzurny na gorze

    (retcon_000038) i wstep do budynku. Nic wiecej i nic mniej.


    5. ARYTMETYKA, KTORA MOWI SAMA. Piecnascie srebra stypendium wobec 4045 srebra

    netto, ktore Lucan ma dzis z tego, co syndykat zaplacil za lup cmentarny

    (inventory.yaml#total_known_net_silver, 40 000 wciaz do odebrania). Cala roczna

    hojnosc gildii miesci sie w reszcie z obiadu dla introligatora.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie podal daty przesluchania (nie jest ogloszona,

    act-03-defence#why_no_date_announced). Nie ruszyl zadnego zegara poza uplywem
    czasu.

    Nie ustanowil, ze urzedniczka wie cokolwiek o dzisiejszym dniu Lucana, o Marnie,

    o rogatce albo o syndykacie. Nie zrobil z pytania o swiadczenia sygnalu, ktory
    ktos

    gdzies odnotowuje. Nikt nie zszedl z gory i nikt nie wszedl z ulicy.


    7. STAN. Czwarty dzien interludium, glowna sala gildii przy okienku recepcji.

    Seraphine u siebie na gorze. Integralnosc 19/19, energia po regeneracji - czytac

    z pliku. Godzine czytac ze state/time.yaml.

    '
  new_decision: Urzedniczka juz wrocila do rejestru. Schody na gore sa dwa kroki dalej
    - Lucan idzie do Seraphine, czy zalatwia przy okienku cos jeszcze.
