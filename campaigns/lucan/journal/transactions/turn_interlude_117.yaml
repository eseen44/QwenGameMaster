outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Czterdziesci minut,
    zero energii. 1. POKOJ W GILDII MARA CZYTA JAKO DYZURKE NA GORZE - TE ZAREJESTROWANA
    NA LUCANA - I NIE MRUGA. Kiwa glowa, mowi, ze bedzie przed swiatlem, i odchodzi
    w strone glownego rzedu. Lucan nie prostuje, wiec przykrywka dostaje pierwszego
    swiadka. 2. I TO JEST DOKLADNIE JEJ ZNANA WADA, NIE NOWY PROBLEM. Pokoj dyzurny
    zostal wziety JAKO PRZYKRYWKA do przeszukania, a Lucan spi w celi po Varkhenie
    w piwnicy; przy zakladaniu tego uzgodniono wprost, ze przykrywka nie wytrzyma
    rozpytywania czlonkow gildii (event_turn_interlude_072). Mara JEST czlonkiem gildii
    i o swicie stanie pod tymi drzwiami. Od jutra rana przykrywka albo bedzie miala
    wspolnika, albo dziure - zaleznie od tego, co Lucan zrobi do swiatla. 3. ROZSTANIE
    BEZ CEREMONII. Mara idzie swoja droga z czterema tysiacami i lukiem, Boros juz
    zniknal, targ za nimi gasnie. 4. DROGA PRZEZ LUMARIE O ZMIERZCHU JEST ZWYCZAJNA
    I DLATEGO WARTA ODNOTOWANIA: Lucan idzie przez miasto z czterema tysiacami w zlocie
    pod plaszczem, przepustka syndykatu w tej samej kieszeni i Spideyem przy zebrach.
    Nikt go nie zatrzymuje. Trzeci dzien interludium konczy sie bez jednego rzutu
    i bez jednej straty. 5. GILDIA WIECZOREM PRACUJE WOLNIEJ, ALE PRACUJE. Swiatlo
    w kilku oknach, recepcja obsadzona, korytarz do piwnicy pusty. 6. WORLD MOVE -
    SERAPHINE JEST NA MIEJSCU I NIE TRZEBA JEJ SZUKAC. To jest zbieznosc, ktora Lucanowi
    powinna dac do myslenia: jej wlasna agenda od dni brzmi - wyciagnac od Lucana
    reszte nieujawnionej listy PRZED przesluchaniem (npc_seraphine_vale.agenda). Czlowiek,
    ktory przychodzi sam, wieczorem, z wlasnej woli, jest dokladnie tym, na co ona
    czeka - z ta roznica, ze tym razem to on wybral godzine i miejsce, a nie ona.
    7. STAN. 17:50 dnia trzeciego, gildia, zmierzch. Energia 7.8 z 15, integralnosc
    19 z 19, bez warunkow. Przy Lucanie 4 000 srebra w zlocie plus drobne, 40 000
    do odebrania. Przepustka nietknieta, Spidey nieodkryty. Wiszace i nieudzielone:
    kanal ostrzegawczy dla syndykatu, odpowiedz dla Kesza kim Lucan siada przy kaplanie,
    droga po zakon mieczowy, wspolna wersja dla gildii przed cmentarzem i przykrywka
    dyzurki na jutrzejszy swit.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: Seraphine podnosi wzrok. Lucan przyszedl sam i z wlasnej woli - teraz
    decyduje, ile z ostatnich trzech godzin kladzie na stol i w jakiej kolejnosci.
