  summary: 'Lucan zaciska dlon na relikwiarzu i puszcza Geo - roll_turn_interlude_010_reliquary_geo_scan:
    98 vs 45, zdecydowany sukces. Stone Sense nic nie daje (srebro, nie kamien), ale
    Grave Sense uderza czysto i mocno: to nie jest przypadkowa ozdoba. Fragment kosci
    w srodku niesie realna, silna sygnature - nie nekromantyczna, tylko odwrotna:
    konsekrowana, czynna warda przeciw nieumarlym i wprost przeciw takiej mocy jak
    jego wlasna. To autentyczna relikwia, prawdopodobnie po niewielkim swietym albo
    meczenniku, nie bibelot. Trzymajac ja, Lucan czuje wyrazny, nieprzyjemny nacisk
    gdzies w okolicy wlasnej nekrotycznej rezerwy - cichy, fizyczny sprzeciw przedmiotu
    wobec jego natury. Rzecz tej klasy nie ginie bez sladu - ktos po stronie koscielnej
    najprawdopodobniej juz wie, ze jej brakuje, i wie dokladnie czego szuka.'
