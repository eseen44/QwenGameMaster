  resolved_world_reaction_ids: []
  summary: 'Bez testu. Dwie godziny przy wlasnym stole: obie odbitki przeczytane,
    kupka ciem obejrzana pod katem dawcy, dwa ulepszenia sieciarzy rozpisane na czesci.
    1. DYSPUTA NIE JEST O TYM, CZY COS ZYJE. Akademia klasyfikuje przez MECHANIZM
    I WIAZANIE DUSZY, i dokladnie tam obaj stawiaja granice, tylko z dwoch roznych
    stron. Kolm (waska definicja): rozstrzyga POCHODZENIE IMPULSU - cialo, ktore bylo
    martwe i porusza sie moca smierci, jest nieumarle i zadna dalsza wlasciwosc tego
    nie zmienia. Aldhen (szeroka): rozstrzyga TO, CO SIEDZI W SRODKU - jesli nie ma
    zwiazanej woli ani duszy, a jest zewnetrzny operator prowadzacy mechanizm, to
    jest konstrukt, niezaleznie od tego, czym cialo bylo wczesniej. 2. TO SAME KRYTERIUM
    RATUJE SPIDEYA I TOPI VARKHENA. Spidey nie ma zwiazanej duszy, chodzi na komende
    - u Aldhen jest konstruktem czysto. Varkhen jest doslownie drugim przypadkiem:
    rozumny, wlasna wola, wiez formalnej kontroli JUZ ISTNIEJE. Lucan nie moze uzyc
    szerokiej definicji polowicznie; jedna linia obrony obsluguje jego pajaki i jednoczesnie
    nazywa jego najwiekszy problem po imieniu. 3. SLABE MIEJSCE KOLMA LEZY NA TYM
    SAMYM STOLE. Jego kryterium wymaga ostrej granicy "bylo martwe / nie bylo", a
    Akademia trzyma we wlasnej bibliotece licencjonowany podrecznik o przywracaniu
    ruchu i oddechu utopionym i pozornie zmarlym - z sygnatura wypalona w okladce,
    dwa kroki od Lucana. Kolm jest tym, ktory wniesie kryterium na sale; egzemplarz,
    ktory to kryterium rozmywa, lezy w schowku w murze. 4. ALDHEN JEST SOJUSZNICZKA,
    KTORA MA WLASNY INTERES. Zeby wygrac, potrzebuje OKAZU - pokazanego, zbadanego
    i opisanego. Jej odwaga jest realna i, jak ujal to ojciec, wieksza, niz jej sie
    oplaca. Sojusz z nia jest sojuszem z osoba, ktorej zwyciestwo wymaga wystawienia
    czegos Lucana na stol. 5. ZADNE Z NICH NIE WIE, ZE LUCAN ISTNIEJE. Szesnascie
    dni. On zna ich definicje, przyklady i nawyki; oni nie znaja nawet jego nazwiska
    w tej sprawie. 6. CMY - CO NAPRAWDE LEZY NA BLACIE. Cztery albo piec sztuk z calymi
    skrzydlami plus zawisak. Wazniejsze od skrzydel jest to, po co cma je ma: cmy
    SLYSZA. Maja narzady sluchu, ktorymi lapia nietoperza w ciemnosci, i to jest jedyny
    material dawcy sluchu, jaki Lucan mial kiedykolwiek w reku - lezy tu przypadkiem,
    przyniesiony przez sieciarzy do zupelnie innego celu. 7. PODSLUCH ROZKLADA SIE
    NA TRZY WARSTWY I TYLKO PIERWSZA JEST TANIA. (a) CZUJNIK - sieciarz juz czyta
    drgania, tak poluje, ale mowa idzie POWIETRZEM, nie nicia. Wersja darmowa: duza,
    luzna plachta sieci jako membrana - daje rytm, liczbe glosow i to, czy ktos mowi,
    nie daje slow. Wersja wlasciwa: przeszczep narzadu sluchu z cmy, ok. godziny pracy
    recznej na sieciarza (retcon_000024). (b) KANAL - i to jest waskie gardlo, nie
    czujnik. Lacze niesie thread_break_signal i minimal_status; uslyszane nie znaczy
    przekazane. Wiek daje sad, nie pasmo (maturation) - pasmo kupuje sie osobnym krokiem
    wzrostu, a droga przez Spideya jako agregator kosztuje propagacje: 0,8 x 0,7 to
    okolo 56 procent na dwoch przeskokach. (c) UWAGA - sluchanie na zywo zjada caly
    jeden slot Lucana na caly czas trwania rozmowy, a uwaga jest seryjna (event_turn_interlude_086).
    Prawdziwy podsluch jest problemem ZAPISU, nie sluchu; voice_recording stoi w development_path
    jako osobna, nieopłacona funkcja. 8. PULAPKI NA WIEKSZE OBIEKTY - BRAKUJE TRZECH
    RZECZY NARAZ. (a) KLEISTOSC - jedwab jedwabnika jest ciagly i mocny, ale NIELEPKI
    i bez kontroli wyrzutu; klejenie to osobny krok. (b) ILOSC - male cialo daje metry,
    nie siec; wiekszy producent albo czterej sieciarze pracujacy w jednym miejscu,
    a jedwab w skali ludzkiej to problem MATERIALU, nie magii, i nie ma go w zadnej
    ksiazce (event_turn_interlude_081). (c) ZAKOTWICZENIE - wieksze cialo wnosi sile;
    puszcza nie nic, tylko punkty mocowania. Kolejnosc jest wymuszona: gruczol przedny
    (ok. godzina na sieciarza, jedwabniki w koszyku), potem kleistosc, potem kontrola
    wyrzutu. Pulapka na cos duzego dzisiaj to MECHANIZM - ciezar, petla, napiecie
    na belce - czyli stolarka z nicia, nie krok wzrostu. 9. STAN WEJSCIOWY DO OBU
    SCIEZEK JEST TEN SAM I ZEROWY. Czterej sieciarze maja permanent_growth_steps 0;
    pierwszy krok na calej czworce to okolo czterech godzin przy stole i nic poza
    tym. Nic z tego nie kosztuje energii. 10. NIC NIE ZROBIONE. Zaden przeszczep nie
    wykonany, zaden okaz nie ozywiony, zaden rozkaz nie zmieniony. Obie odbitki przeczytane
    i odlozone.'
  new_decision: 'Jest po czwartej po poludniu, warsztat stoi otwarty i wszystko jest
    w zasiegu reki: przeszczep sluchu z cmy do sieciarza, przeszczep gruczolu przednego,
    ozywienie zawisaka, lampa i sloik na noc, albo trzy pozostale nieprzeczytane rzeczy
    - formuly prawne, Uprzejmosci i brulion balwierza.'
  operations:
  - *id002
