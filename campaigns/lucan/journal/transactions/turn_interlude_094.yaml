  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu. Dziesiec minut: schody, korytarz pietro wyzej, wejscie. Zero
    energii. 1. DRZWI PRACUJA DLA NIEGO - I TO JEST JEGO WLASNA ROBOTA SPRZED DWOCH
    DNI. Na drzwiach gabinetu Ruska siedza trzy klatwy pecha z tury 008, nadal nieodkryte:
    skrzypienie zawiasow, ktore pojawia sie w najgorszym mozliwym momencie, zamek
    zacinajacy sie tak, ze trzeba szarpnac pod konkretnym katem, i male wybrzuszenie
    progu akurat na wysokosci czubka buta. Lucan wie o kazdej z tych trzech, bo sam
    je postawil - prog omija bez patrzenia, zamek szarpie pod wlasciwym katem za pierwszym
    razem. A zawiasy robia dokladnie to, do czego zostaly przeklete: wyja przez cala
    dlugosc otwarcia. "Najgorszy mozliwy moment" jest zdefiniowany z punktu widzenia
    wlasciciela drzwi, wiec dla wchodzacego jest to najlepszy mozliwy moment. Lekki
    dramatyczny krok dostaje darmowa oprawe dzwiekowa od klatwy, ktora Lucan zalozyl,
    zanim wiedzial, ze bedzie jej dzis potrzebowal. 2. RUSK JEST U SIEBIE I NIE WIEDZIAL.
    Tura 011 zamknela sie zdaniem "Rusk poczeka, i tak nie wie, ze Lucan tu jest".
    To wlasnie przestalo byc prawda i przestalo w najgorszy dla Ruska sposob - nie
    przez wpis w rejestrze ani czyjas wzmianke, tylko przez wyjacy zawias i czlowieka
    w drzwiach. Podnosi glowe znad papierow z twarza czlowieka, ktory przez sekunde
    nie moze ulozyc tego, co widzi, w nic sensownego. 3. CO RUSK MA NA LUCANA, DOKLADNIE.
    Potwierdzone: Lucan przezyl garbarnie i pomogl odciagnac szczuroogra (milestone_021,
    ten sam, w ktorym Ruska uratowano), oraz Lucan uzywa skutecznej magii zimna (milestone_016).
    Podejrzenie o sredniej pewnosci: Lucan sabotowal ucieczke szczuroogra. NIC o Spideyu,
    nic o nekromancji, nic o Varkhenie - to sa jego forbidden_without_source. Relacja:
    personal_regard -35, discretion_trust -20, cooperation -5, judgment_confidence
    20. Stance: bureaucratically_hostile_but_limited. 4. I DOKLADNIE TYLE, ILE MOZE
    Z TYM ZROBIC. Karta mowi to bez ogrodek: urazony, niskoszczeblowy urzednik bez
    wlasnej sily sprawczej na wieksza skale. Narzeka, dokumentuje, bywa zlosliwy,
    poddaje sie poleceniom Gildii i wyraznej hierarchii. Jego jedyna dzwignia to routine_reports_and_procedural_objections.
    Lucan trzyma po swojej stronie wiedze o niekompetencji i niewiarygodnosci Ruska
    - i to jest asymetria, ktora nie zmienila sie od garbarni. 5. DLACZEGO TO JEST
    NIEMAL IDEALNY MATERIAL CWICZEBNY. Zaden z jedenastu ladunkow z Uprzejmosci nie
    zostal nigdy wykonany; kazdy potrzebuje pierwszego przebiegu wlasnym kanalem,
    zeby stal sie powtarzalny. Rusk spelnia komplet warunkow: nie jest magicznie swiadomy,
    wiec nie rozpozna kanalu; nie ma relacji do stracenia; jest w zasiegu dotyku;
    klatwy sa w Lumarii legalna sztuka, a po kalibracji z 25.08.2026 przeklinanie
    urzednika to najwyzej nagana, dopoki nie stanie mu sie cos TRWALEGO. Trzy z jedenastu
    procedur - zapadnia pamieci, rozwiazanie jezyka, usypianie - nie maja wersji szczurzej
    i pierwsza proba i tak musi pasc na czlowieku (event_turn_interlude_092). Ten
    czlowiek wlasnie podniosl glowe. 6. CZEGO TO NIE ZMAZUJE. Cena jest jedna i nazwala
    ja Seraphine w turze 037: podrazniony urzad produkuje PAPIER, nie rabowalny blad.
    Rusk dokumentuje zawodowo, ma w agendzie avoid_being_used_as_lucan_cover, a za
    trzynascie dni ktos zacznie czytac to, czego przez cala kampanie nikt nie czytal.
    Slad magiczny nie jest tu zadnym problemem (retcon_000028) - swiadek i notatka
    sa. 7. STAN. 09:20 dnia trzeciego. Energia 13,5 z 15, integralnosc 19 z 19, bez
    warunkow. Zadna procedura nie zadeklarowana, zadna reka nie wyciagnieta, nic nie
    rzucone.'
  new_decision: Lucan stoi w otwartych drzwiach gabinetu, Rusk patrzy na niego znad
    papierow i jeszcze nic nie powiedzial. Szesc sposobow dostarczenia i jedenascie
    ladunkow - albo zadnego.
