  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Szesc minut, zero energii. Interludium buduje gracz
    (retcon_000033), a deklaracja o przelozonych Kolma LADA JAK ZADEKLAROWANA: zaden
    plik jej nie przeczy, a cztery ja podpieraja. 1. NOWY KANON SWIATA, PODANY PRZEZ
    GRACZA. Otwarta dysputa Aldhen kontra Kolm jest ROZSTRZYGNIETA POZA UCZESTNIKAMI.
    O tym, ze wygra szeroka definicja, zdecydowali przelozeni Kolma - i nie sa to
    tylko magowie. To KOSCIOL. Kolm prowadzi strone, ktora ma przegrac, i nie prowadzi
    jej po to, zeby wygrac. 2. DLACZEGO TO SIEDZI W PLIKACH IDEALNIE. Waska definicja
    Kolma - "cos takiego to nieumarly i nic wiecej" - jest DOSLOWNIE stanowiskiem
    Kosciola (necromancy-law.yaml#church_position.tendency; lumaria-church.yaml necromantic_animal_or_vermin_modification:
    doctrinally_condemned_without_secular_gray_zone). Jednoczesnie ta sama definicja,
    gdyby wygrala, uderzalaby w golemy, homunkulusy, protezy i chowance, czyli w restrictive_precedent,
    ktorego Akademia sie BOI (faction_lumaria_magical_academy#fears). Nikt starszy
    i osadzony - a Kolm jest osadzony (npc_ivar_kolm#lucan_recognition) - nie bierze
    strony, ktora kryminalizuje polowe przywilejow jego wlasnej instytucji, chyba
    ze odpowiada przed kims spoza niej. 3. I DLATEGO KOSCIOL CHCE PRZEGRAC TEN SPOR.
    Wygrana waskiej definicji utrzymuje nekromancje jako kategorie FORMALNA, rozpatrywana
    w forach, gdzie Akademia ma ekspertow, a Seraphine ma glos, i gdzie Kosciol musi
    wygrywac sprawa po sprawie. Wygrana szerokiej definicji wtlacza cala klase hybryd
    do kategorii KONSTRUKTU, czyli do szarej strefy - a szara strefa nie legalizuje
    sie proklamacja, tylko tym, ze PRZESTAJE SIE ROZPATRYWAC SKARGI (de_facto_liberalisation_mechanism).
    Zanik sciezki formalnej nie usuwa srodka zaradczego, ZMIENIA MU RECE Z PAPIERU
    NA LUDZI. Kosciol nie przegrywa argumentu - kupuje za niego likwidacje sadu. Precedens
    stoi w tych samych plikach i jest dla Lucana osobisty: ojca potepiono dwa razy
    - to byla faza papierowa i zawiodla - a potem ktos przyszedl do laboratorium OSOBISCIE.
    4. CZYM WIEC JEST NERIS ALDHEN W TYM UKLADZIE. Podpisem. Jej nazwisko idzie na
    zdanie, ktore rozpuszcza sciezke formalna, i staje sie najczesciej cytowanym i
    najbardziej znienawidzonym zdaniem w Lumarii. Kazdy szczegol z jej karty, ktory
    dotad czytalo sie jako zlosliwosc uczelni, czyta sie teraz jako PRZYGOTOWANIE,
    i ona moze sprawdzic kazdy sama: mloda na katedre; posadzona w skrzydle POD RUSZTOWANIEM
    z urzedowym powodem "brak miejsca w laboratoryjnym", czyli w jedynym skrzydle
    bez portierni i bez ksiegi; nikt jej nie nosi rzeczy, wiec nikt tez nie jest swiadkiem;
    gosci wpisuje do ksiegi WLASNA REKA, bo nie ma komu; odbitka jej tekstu krazy
    juz po miescie z jej nazwiskiem na okladce. Ocena ojca Lucana z jej karty brzmi
    teraz jak diagnoza: odwazniejsza, niz jej sie to oplaci. 5. I OBSERWATOR ROBI
    SIE CZYTELNY. Ktos stal pod jej drzwiami i nie zapukal, ktos naruszyl pyl na poziomie
    rusztowania z widokiem na jej okna, szesnascie dni przed dysputa - a Geo potwierdzilo,
    ze ten ktos jest ZYWY (event_turn_interlude_135). Kolm nie ma powodu jej pilnowac;
    on ma przegrac. Pilnuje jej ten, kto liczy, gdzie bedzie stalo nazwisko, kiedy
    skargi przestana byc rozpatrywane. 6. JEJ REAKCJA - NAJPIERW ZAPRZECZENIE PRZEZ
    KOMPETENCJE, NIE PRZEZ STRACH. Nie przyjmuje tego od bezimiennego i mowi to wprost.
    Ale sprawdza teze narzedziem, ktore ma najlepsze na swiecie - wlasnym polem -
    i test wypada przeciw niej: pyta samej siebie, dlaczego Kolm wzial linie, ktora
    po wygraniu podcina jego wlasna katedre. Odpowiedzi nie ma i widac, ze jej nie
    ma. Nie zwija sie i nie przelicza planu (retcon_000039) - robi sie zimna. 7. WORLD
    MOVE - SIEGA PO JEDYNA DZWIGNIE, KTORA MA, I JEST TO DZWIGNIA WYCELOWANA W LUCANA.
    Jesli jej zwyciestwo jest mechanizmem, to ona go zatrzyma: PRZEGRA dysputa. Poswieci
    siedem tygodni i pozycje, zeby zdanie nie poszlo z jej nazwiskiem. Nie zauwaza
    - bo nie ma jak - ze wlasnie zaproponowala jedyna rzecz, ktora niszczy obrone
    Lucana. Wygrana Kolma znaczy, ze okaz taki jak Spidey JEST prawnie nieumarlym,
    a wtedy obrona klasyfikacyjna Lucana przestaje istniec i zostaje mu tylko karna,
    ktora jej przeczy (institutional_defence#two_contradictory_defences). 8. CZEGO
    ONA NADAL NIE WIE. Nazwiska, sieci, Varkhena, slowa vitae, profesora Veyra ze
    skrzydla laboratoryjnego, ojcowskiego pokazu. Nie padlo nic z tego. 9. STAN. 16:49
    dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie, Spidey na parapecie. Energia
    10.65 z 15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka
    syndykatu pod plaszczem. USTALONE: dysputa jest ustawiona, a strona ustawiajaca
    to Kosciol przez przelozonych Kolma; Neris jest w tym ukladzie podpisem, nie zwyciezczynia;
    ona proponuje PRZEGRAC dysputa, co niszczy obrone klasyfikacyjna Lucana; nazwisko
    Lucana nadal niepodane.'
  operations:
