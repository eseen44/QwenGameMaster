  summary: 'Bez testu - powtorka jest darmowa, wiec nie ma czego testowac (system/tests.md#nieograniczona-powtorka-znosi-test,
    kalibracja gracza 25.08.2026). Dwadziescia minut. Jedna jednostka. 1. PIERWSZA
    UDANA PROCEDURA Z UPRZEJMOSCI W CALEJ KAMPANII. Poprawka z tury 095 byla jedyna,
    jakiej brakowalo: JEDNA procedura na kontakt, domknieta, zanim zacznie sie cokolwiek
    innego. Dlon na przedramieniu - jedyny dotyk, ktorego nikt nie odmawia, a cel
    jest juz rozproszony - i ROZWIAZANIE JEZYKA wchodzi czysto. Wzorzec przeszedl
    wlasnym kanalem, wiec od tej chwili jest POWTARZALNY (progression_curses_and_misdirection).
    Zostalo dziesiec procedur bez pierwszego przebiegu. 2. KLAMSTWO DZIALA LEPIEJ
    NIZ PRAWDA BY ZADZIALALA. Degradacji nie bylo i Lucan o tym wie - mowi to, zeby
    podniesc Ruskowi cisnienie. Efekt jest lepszy, niz gdyby trafil: czlowiek, ktoremu
    wspolczuje sie z powodu ponizenia, ktore go nie spotkalo, MUSI zaprzeczyc, a zaprzeczajac
    wymienia to, co go naprawde spotkalo. Rusk prostuje z furia, ze tytulu nie stracil
    - i w tym samym oddechu wykłada, ze po garbarni bylo wewnetrzne sprawdzenie kompetencji,
    ze zostal przy tytule, ale bez samodzielnego podpisu, i ze wnioski, ktore kiedys
    zamykal sam, teraz kontrasygnuje ktos inny. Zeznania Lucana, Mary i Borosa uruchomily
    to sprawdzenie (karta Seraphine, fact_seraphine_knows_rusk_inquiry_origin) - Lucan
    poznaje wlasnie jego wynik, ktorego nie znal nikt w plikach. 3. KONDOLENCJE SA
    WIEC PRAWDZIWE, TYLKO NIE O TYM. Forma sie domyka, bo Rusk sam dostarczyl powod
    - i to jest cala teza ksiazki w jednym ruchu: nosnikiem jest forma, ktorej cel
    nie moze odrzucic bez obrazy, a tresc jest obojetna. 4. KARTKA. Rusk pisze - to
    jego jedyna dzwignia, routine_reports_and_procedural_objections, i siega po nia
    odruchowo. Nie konczy zdania. Lucan wyjmuje mu kartke z reki, patrzy mu w oczy,
    usmiecha sie i zjada ja. Zuje dokladnie i przelyka. Nie jest to przestepstwo,
    nie jest to nawet wykroczenie - jest to rzecz, na ktora nie ma procedury, a Rusk
    jest czlowiekiem, ktory poza procedura nie istnieje. Notatka przestaje istniec
    razem z nia. 5. I TERAZ ZART, KTORY LUCAN SAM NA SIEBIE ZASTAWIL. Rozwiazanie
    jezyka dziala: hamulce spadaja jak po winie i Rusk MOWI, duzo, szybko i bez filtra.
    Lucan zadeklarowal, ze go nie slucha i ma w dupie, co mowi, wiec wiekszosc idzie
    mimo - zal, pretensje do magistratu, cos o zonie, cos o kosztach. Dwa ksztalty
    przebijaja sie same, bo trafiaja w rzeczy, ktorych Lucan szuka od dwoch dni: (a)
    SPRAWDZENIE KOMPETENCJI WCIAZ SIE TOCZY W PAPIERZE - ktos porzadkuje akta z garbarni,
    a to znaczy, ze nazwiska z tamtej operacji, w tym Lucana, sa czytane teraz, trzynascie
    dni przed przesluchaniem; (b) RUSK JEST INSPEKTOREM PODZIEMNYCH ZAGROZEN MIEJSKICH
    i mowi o piwnicach i kanalach pod dzielnica gildii jak o wlasnym mieszkaniu -
    dokladnie o tym terenie, w ktorym spy_centipede_01 siedzi w czyjejs piwnicy bez
    wspolrzednych. Najlepsze zrodlo w miescie na ten jeden temat wlasnie zostalo magicznie
    zmuszone do gadania, a Lucan zapowiedzial, ze nie slucha. 6. CZEGO RUSK NIE DOSTAL.
    Zaden warunek nie zostal na nim zalozony na trwale, nic mu sie nie stalo nieodwracalnie,
    zaden prog karny nie zostal przekroczony (retcon_000028). Ma zimno w pamieci z
    tury 095, brak jednej kartki i rozwiazany jezyk, ktory przejdzie sam. 7. STAN.
    09:50 dnia trzeciego. Energia 11 z 15, integralnosc 19 z 19, bez warunkow. Swiad,
    zapasc i usypianie nadal bez ani jednego przebiegu; pioro nadal na biurku, nieprzeklete
    i niepodarowane. Boros i Mara nadal dzisiaj.'
  new_decision: Rusk mowi i nie moze przestac, Lucan postanowil nie sluchac, kartki
    nie ma, a pioro lezy miedzy nimi na biurku. Zostaly trzy niewyprobowane procedury
    z pierwotnego planu i czlowiek, ktory odpowie teraz na kazde pytanie.
