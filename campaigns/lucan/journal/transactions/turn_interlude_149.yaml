outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Piec minut, zero energii. Zagrywka gracza laduje
    w calosci (retcon_000033) i jest to najczystsze przestawienie rejestru w tej scenie:
    dokument doktrynalny zamienia sie w porownanie zaopatrzeniowe.

    1. PYTANIE O ATRYBUCJE ROZWIAZUJE SIE BEZ PODANIA NAZWISKA - I ROZWIAZUJE JE SAM
    OJCIEC. Zapytany o trzy najlepsze wyniki mowi, ze nie sa jego, bo on ich nie mierzyl,
    i nie pamieta, kto mierzyl. Pamieta PAPIER: tabele zaopatrzenia. Przypis dostaje
    wiec odeslanie do rejestru dostaw Akademii, nie do czlowieka. Lucan nie musial
    klamac ani wymyslac nazwiska - karta ojca (gubi nazwiska, pamieta papier) zrobila
    to za niego.

    2. NERIS PRZYJMUJE TO NA GLOS JAKO POPRAWNE ODESLANIE, ZANIM POLICZY, CO JEJ TO
    DAJE (portrayal.the_flaw). Odeslanie do rejestru jest lepsze od odeslania do osoby
    - sprawdzalne, bezimienne, nudne. Pisze je.

    3. DOKUMENT ZMIENIL GATUNEK. Do tej pory powstawal zapis o koszcie niewykrywalnosci
    masowo produkowanych okazow. Po tej turze powstaje POROWNANIE CEN MATERIALU -
    dokladnie to, co legalnie produkuje zarejestrowana jednostka badawcza gildii (druk
    podpisany, t_071). To jest realny zysk obronny i pochodzi wprost ze slowa "cenami".

    4. TRZY WYNIKI PODANE, WSZYSTKIE NA KORZYSC LUCANA. (a) Wlasna chityna wzmocniona
    - najnizszy punkt krzywej, kosztuje tylko godziny przy stole, ojciec widzial to
    na Spideyu i ocenil jako porzadna robote (t_018). (b) Utrwalone preparaty ze zbiorow
    - spisane na straty, bezuzyteczne do przeszczepu, dobre na obudowe; cena praktycznie
    zerowa. (c) Swiezy towar ze stalych dostaw - koniec drogi, jedyna pozycja z realna
    cena. Srebro nie miesci sie na wykresie.

    5. WORLD MOVE - CENA POZYCJI TRZECIEJ PADA ZA JEDNOSTKE, A JEDNOSTKA W TYM HANDLU
    JEST CIALEM. Ojciec podaje ja jak kazda inna liczbe, bo dla niego jest to pozycja
    w tabeli, nie zdanie o moralnosci. Mowi to przy Neris, ktora od t_145 ma otwarta
    wlasna kategorie "zwloki, o ktore mialam zapytac" - i wlasnie dostala do niej
    cene rynkowa i nazwe rejestru, w ktorym ona stoi. Nie zapytala.

    6. WORLD MOVE B - OJCIEC IDZIE PO KSIEGE. Skoro liczby maja byc porownywane cenami,
    to trzeba miec dokladne liczby, a on ma dostep do tabel. Wstaje, zeby przyniesc
    rejestr zaopatrzenia i otworzyc go na stole. Nie jest to oferta ani zobowiazanie;
    to czlowiek, ktory zaczal planowac eksperyment i przy okazji otwiera cudzy dostep
    do dokumentu instytucji (ten sam mechanizm co t_146 world move A).

    7. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    kim naprawde jest kobieta, ktorej dyktuje, ani ze trzymal pod nosem odwrocie jej
    tekstu.

    8. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:38. Energia
    bez zmian, integralnosc 19 z 19, bez warunkow. Odbitka z nazwiskiem Neris nadal
    w rece Lucana. USTALONE: przypis odsyla do rejestru zaopatrzenia Akademii, nie
    do osoby; dokument jest porownaniem cen materialu; trzy wyniki podane; cena za
    sztuke swiezego towaru padla przy Neris; ojciec wstal po ksiege.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: in_his_fathers_laboratory_attribution_resolved_to_the_academy_supply_registry_with_no_name_given_the_document_now_a_material_price_comparison_three_results_named_own_reinforced_chitin_then_written_off_preserved_specimens_then_fresh_standing_supply_whose_per_unit_price_was_said_out_loud_in_front_of_neris_father_gone_to_fetch_the_supply_ledger_neris_offprint_still_in_lucans_hand
  - op: advance_time
    seconds: 300
  - *id002
  new_decision: Ojciec wstal i idzie po rejestr zaopatrzenia Akademii, zeby otworzyc
    go na stole - z cenami za sztuke, przy Neris, ktora to zapisuje. Lucan pozwala
    mu przyniesc ksiege i bierze dokladne liczby razem ze swiadkiem, zatrzymuje go,
    albo wykorzystuje te chwile, gdy ojca nie ma w pokoju, na cokolwiek innego.
