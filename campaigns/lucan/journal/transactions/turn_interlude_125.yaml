  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut,
    zero energii. Varkhen obecny (retcon_000037). 1. LUCAN ODPOWIEDZIAL WIECEJ, NIZ
    PROSILA, I ONA TO MOWI. Prosila o dwie rzeczy - co sklamac, czego nie znac - dostala
    siedem i teraz nie moze tego odzobaczyc przed jutrzejszym rankiem. Nie jest to
    wyrzut, jest to zapis kosztu. 2. JEDYNY FAKT, KTORY WNOSI ONA I KTORY JEST NAJWAZNIEJSZY
    W TEJ TURZE: NIE DOSTALA ANI JEDNEJ KOPII. Ani jednego pisma Cortha, ani jednego
    zawiadomienia, ani jednego wezwania do potwierdzenia dat - a jest kontrolerka
    gildii i operacja w garbarni byla operacja gildii. Sprawdza to na glos przy Lucanie
    i nie znajduje niczego. Zgadza sie z karta Cortha, ktora mowi wprost, ze to kanal
    CALKOWICIE NIEZALEZNY OD SERAPHINE - magistrat, nie gildia (npc_malen_corth.relevance_to_lucan).
    3. I ROBI Z TEGO WNIOSEK O SOBIE, NIE O LUCANIE: relacja z garbarni jest skladana
    bez gildii, z ludzi gildii, imiennie. Ktokolwiek to czyta, bedzie mial wersje,
    w ktorej jej nie ma - a ona stanie przed sluzbami za dziesiec godzin i nie bedzie
    wiedziala, co juz lezy na stole. 4. ZAUWAZA PRZESUNIECIE W ODPOWIEDZI I NAZYWA
    JE BEZ ZLOSLIWOSCI: pytala o ziemie, dostala odpowiedz o papierze. To jest gorsza
    odpowiedz. Na terenie mozna kogos nie znalezc; z papieru nie da sie wyjsc, bo
    papier nie szuka - on sie uzgadnia. 5. PIORO - BIERZE JE NA SIEBIE, TAK JAK OBIECALA,
    I ROBI TO Z POWODU ZAWODOWEGO. Enchantment poziomu 1 bez sladu i bez progu karnego
    (retcon_000028, karta Ruska) to dla antymagicznej kontrolerki gildii robota rutynowa,
    ktorej nie musi nikomu tlumaczyc. Kradziez pajakiem odrzuca krotko i praktycznie:
    przedmiot znikajacy z biurka urzednika w trakcie sprawdzenia jego kompetencji
    zostaje ZGLOSZONY, a zgloszenie jest jedyna rzecza, ktora kazalaby Ruskowi podejrzewac
    przedmiot - dzis nie podejrzewa go w ogole. 6. PRAWDZIWE DATY - PRZYJMUJE BEZ
    SPORU I Z ULGA. Jedna wersja na wszystkich forach jest jedyna, ktorej nie da sie
    rozlupac na rozjezdzie; nie interesuje jej, ze przy tej wersji Rusk wychodzi na
    obecnego. 7. WLASCICIEL GARBARNI - NIE POTWIERDZA I NIE ZGADUJE. Mowi, ze nie
    wie, i mowi, ile kosztuje sprawdzenie: pytanie o te akta w magistracie robi z
    niej OSOBE, KTORA ZAPYTALA, a to jest inna pozycja w cudzych notatkach niz kontrolerka,
    ktora przyszla w swojej sprawie. Nie odmawia. Odklada cene na widok. 8. CZEGO
    NIE ZAUWAZA - i to zostaje po stronie Lucana: ze pelne donosy Ruska sa dokladnie
    tym strumieniem, ktory prywatnie zamawiana teczka ceni najwyzej, czyli ze pioro
    od trzech dni tlumi najcenniejsze zrodlo drugiej strony. Jest zmeczona i liczy
    pod jutrzejszy pokoj, nie pod cala sprawe. 9. WORLD MOVE - WYBIERA WLASNY RUCH
    I NIE PYTA LUCANA O ZGODE. Jutro nie zapyta o akta garbarni. Zapyta, dlaczego
    jej nie ma na rozdzielniku - to czysta reklamacja administracyjna, do ktorej ma
    tytul z urzedu, nie ujawnia zadnej wiedzy i wymusza, zeby kopie zaczely do niej
    chodzic. 10. ZEGAR, KTORY WLASNIE ZOSTAL URUCHOMIONY PRZEZ SAMEGO LUCANA. Rozproszenie
    pioro nastapi dzisiaj w nocy, bez Lucana w poblizu. Rusk odzyskuje wiec zdolnosc
    pisania od rana - a pierwsza rzecz, ktora napisze, idzie do Cortha. Cokolwiek
    Lucan chce zrobic z tym strumieniem, ma na to godziny, nie dni. 11. STAN. 19:10
    dnia trzeciego, gorne biura, drzwi na zasuwie. Energia 7.8 z 15, integralnosc
    19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu w kieszeni,
    Spidey przy zebrach nieodkryty. Varkhen: integralnosc 8.4 z 65. USTALONE: Seraphine
    nie dostala zadnej kopii pism Cortha; pioro gasi ona sama dzisiejszej nocy; prawdziwe
    daty przyjete; jutro reklamuje rozdzielnik, nie akta.'
  new_decision: Pioro gasnie dzisiejszej nocy, wiec Rusk pisze od rana, a pierwsze
    pismo idzie do Cortha. Lucan ma godziny na decyzje, co zrobic z tym strumieniem,
    zanim wroci.
