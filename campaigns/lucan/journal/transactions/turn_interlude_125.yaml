  declared_action: 'Lucan odpowiada, ze te trzy pozycje sa w pakiecie, i podaje tresc.
    URZEDNIK: Corth pisal do Ruska, Mary i Borosa; Rusk zaczal odpisywac pelnymi donosami,
    nie odpowiedziami na pojedyncze pytania; Lucan kazal Marze i Borosowi wpisywac
    prawdziwe daty wszedzie, gdzie Corth pyta o garbarnie. GARBARNIA: ani Lucana,
    ani jego slug nie ma na terenie - kopanie odbywa sie na papierze, bo Corth wysyla
    duze ilosci pism, pomijajac oficjalne kanaly, w tym Seraphine. PIORO: Lucan zauwazyl,
    ze Rusk kombinuje, i chcial go pozbawic mozliwosci wyslania raportu tego dnia;
    Rusk nie ma pojecia, ze pioro go usypia; slaby enchantment poziomu 1, zwykle rozproszenie
    zmyje je calkowicie - alternatywnie pajak moze pioro ukrasc. HIPOTEZY LUCANA:
    caly ruch moze byc powiazany z bylym wlascicielem garbarni, ktory zapadl sie pod
    ziemie bez procesu i z pieniedzmi Lucana, albo z tym, ze ktos wlasnie szuka na
    nich brudow.'
