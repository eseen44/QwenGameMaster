  summary: "Bez testu - interludium, roll_policy disabled, cel bez arkusza. Trzy minuty.\n\
    KOSZT: kolejne 0,14. Drugi stack, prog SLOWED. Marn dostaje pierwsza kwestie w\
    \ kampanii.\n\n1. DRUGI STACK - I DLACZEGO SIE UTRZYMUJE, KIEDY LUCAN WYCHODZI\
    \ Z WEZLA. To jest realne\npytanie mechaniczne i odpowiedz stoi w plikach, nie\
    \ w wygodzie.\nability_numb ma limit \"stacking_requires_continued_effort\" -\
    \ czyli DOKLADANIE stackow\nkosztuje kolejne rzuty i kolejny wysilek. NIE MA natomiast\
    \ ani pola concentration, ani\nklauzuli konca. Dla kontrastu ability_confusion\
    \ ma jedno i drugie wprost:\n\"concentration: required\" oraz \"ends_when_eye_contact_line_of_sight_or_concentration_breaks\"\
    .\nRoznica jest w kanonie, nie dorobiona: numb sie NAKLADA, confusion sie TRZYMA.\n\
    Lucan moze wiec wyjsc ze Spideya, wstac i przejsc uliczka, a noga zostaje taka,\
    \ jaka jest.\neffect_numb nie ma pola czasu trwania i narrator ZADNEGO NIE WYMYSLA\
    \ - nie stawia zegara\nwygasania, nie odlicza minut i nie obieca, ze to trwa wiecznie.\
    \ Jesli kiedys bedzie to\nmialo znaczenie, rozstrzygnie sie wtedy i zostanie zapisane.\n\
    DWA STACKI: mobility -10, coordination -14, prog 2 = SLOWED (effects/numb.yaml#stacking).\n\
    Nadal NIE unieruchomiony - to prog 3 i 4.\nKoszt drugiego rzutu identyczny: 0,1\
    \ / 0,7 = 0,14.\n\n2. MARN PROBUJE WSTAC I NIE WSTAJE. Ogarnia sie - to robi pierwsze,\
    \ odruchowo, jeszcze\nsiedzac. Potem podciaga sie na stosie drewna i noga po prostu\
    \ nie wchodzi pod niego,\ntak jakby jej tam nie bylo. Siada z powrotem, tym razem\
    \ swiadomie, i to jest gorsze niz\npierwszy upadek: pierwszy byl wypadkiem, drugi\
    \ jest informacja.\n\n3. LUCAN WYCHODZI Z WEZLA I IDZIE. Zamyka \"Uprzejmosci\"\
    , wstaje, boczna uliczka wzdluz\nsciany (connection_obrecza_side_lane_to_back_yard,\
    \ ponizej minuty, nikogo po drodze).\nTkacz idzie za nim - stary rozkaz staly,\
    \ nikt jej nie odwolal. Spidey zostaje na belce.\nLucan staje w furtce. NIE WCHODZI\
    \ NA PODWORZEC, bo gracz zadeklarowal furtke.\n\n4. PIERWSZA KWESTIA OSSEKA MARNA\
    \ - KARTA WCZYTANA PRZED NAPISANIEM (retcon_000040).\nUstalone przed pierwszym\
    \ zdaniem:\n- CZEGO CHCE Z TEJ ROZMOWY: zeby jej nie bylo. Chce wstac o wlasnych\
    \ silach i wrocic do\n  kubka, zanim ktokolwiek z osmiu za scianа wyjdzie sprawdzic,\
    \ gdzie sie podzial.\n- CZEGO ODMOWI: bycia zaniesionym przez izbe. Wolałby siedziec\
    \ tu do wieczora, niz zeby\n  jego oddzial zobaczyl, jak go ktos prowadzi.\n-\
    \ CO MOZE STRACIC: twarz przed osmioma ludzmi, z ktorymi jutro stoi na zmianie.\n\
    \  Dwadziescia krokow i uchylone drzwi.\nJego rejestr: czlowiek, ktory od dwudziestu\
    \ lat podnosi drag. Krotkie zdania, rzeczowniki\nfizyczne, zadnej ogłady. Zloszcza\
    \ go najpierw wlasne nogi, dopiero potem obcy.\nNIE ROZPOZNAJE LUCANA i nie ma\
    \ jak - nigdy sie nie widzieli. Widzi mlodego czlowieka\nz ksiazka pod pacha,\
    \ ktory stoi w furtce i pyta cicho. To nie jest zagrozenie i nie brzmi\njak litosc,\
    \ wiec Marn nie warczy.\nODPOWIADA, ZE NIE. Bo to jest oczywiste, a on nie ma\
    \ sily klamac akurat w tej pozycji.\nPodaje wlasna diagnoze i jest nia PIWO -\
    \ dokladnie tak, jak mowi\neffect_numb#visibility.mundane_target_usually_identifies_curse:\
    \ false. Mowi to z\nzazenowaniem czlowieka, ktory pije od dwudziestu lat i pierwszy\
    \ raz zrobila mu to noga.\nI DODAJE JEDNA RZECZ, KTORA JEST JEGO WLASNYM PROBLEMEM,\
    \ NIE HAKIEM DLA GRACZA:\nprosi, zeby nie wolac tych z izby.\n\n5. CZEGO NARRATOR\
    \ TU NIE ZROBIL - GRANICA MA BYC OSTRA. Marn nie powiedzial nic\no bramie, wozach,\
    \ glejcie, stalej trasie, cmentarzu ani o niczym, co Lucan sledzi, i nie\nma pliku,\
    \ ktory kazalby mu o tym gadac przy pierwszym zdaniu do obcego (retcon_000058).\n\
    Nie jest skruszony, nie jest podejrzliwy, nie jest wyrocznia i nie wyprzedza gracza\n\
    (retcon_000040). do_not_play z jego karty obowiazuje w calosci.\nNarrator NIE\
    \ wlozyl Lucanowi w usta zadnego imienia - \"Marc\" padl na komendzie i nikt\n\
    tu go nie powtorzyl. Nie ustanowil, ze Lucan pokazal odznake ani ze Marn ja zauwazyl.\n\
    Nikt z izby nie wyszedl. Zaden zegar nie drgnal poza uplywem czasu.\n\n6. STAN.\
    \ Czwarty dzien interludium, furtka podworca Pod Obrecza. Obecni: Lucan (bez\n\
    podanego imienia), npc_ossek_marn. Tkacz przy nodze Lucana, Spidey na belce nad\
    \ beczkami,\nzuk w kieszeni, glejt w kieszeni, \"Uprzejmosci\" zamkniete pod pacha.\n\
    Integralnosc 19/19, energia po drugim 0,14 - czytac z pliku. Marn na ziemi, dwa\
    \ stacki\nnumb, prog slowed, i wlasnie poprosil, zeby nie wolac kolegow.\nGodzine\
    \ czytac ze state/time.yaml po commicie.\n"
