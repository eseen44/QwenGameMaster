outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'roll_turn_interlude_129 - naturalna 54, po karze minus 10 za pierwszy
    w zyciu przebieg wynik 44 przy progu 20. Zdane z zapasem dwudziestu czterech,
    bez krytyka. Dziesiec minut, dwie jednostki, dwa osobne kontakty. 1. SEPARACJA
    ROBI DOKLADNIE TO, PO CO ISTNIEJE. Rozdzielenie procedur na dwa akty jest bezposrednim
    zastosowaniem zasady, ktora Lucan zmierzyl wlasnym kosztem na Rusku (event_turn_interlude_095)
    - i tym razem kanal oddaje dwie czyste procedury zamiast jednej smugi. Zadnego
    impulsu chlodu. 2. AKT PIERWSZY - KONDOLENCJE. Dlon na przedramieniu jest jedynym
    dotykiem, ktorego nikt nie odmawia, a wspolczucie okazane czlowiekowi, ktory od
    godziny mowi wszystko, co mu przyjdzie do glowy, trafia w niego mocniej niz w
    kogokolwiek trzezwego. curse_induced_sleep (opanowana od event_turn_interlude_097)
    domyka sie w chwili kontaktu. To nie czar snu - to narastajace cisnienie, ktore
    portier bierze za wlasne zmeczenie i sam je sobie tlumaczy, dokladnie jak przewiduje
    karta procedury. 3. AKT DRUGI - POZEGNANIE, KLASA OPOZNIONA. Dotyk na rozstanie
    niesie curse_memory_trap solo i wchodzi czysto. TRZECIA PROCEDURA Z UPRZEJMOSCI
    OPANOWANA I POWTARZALNA - po rozwiazaniu jezyka (096) i usypianiu (097). Wzorzec
    przeszedl wlasnym kanalem, wiec od tej chwili nie ma juz kary minus 10 przy nastepnym
    uzyciu. 4. CO ZAPADNIA ZABIERA, A CZEGO NIE. Wspomnienie TWARZY sie nie konsoliduje.
    Godzine pozniej portier nie potrafi Lucana opisac - nie umie podac wzrostu, wieku
    ani niczego, po czym dalo by sie go rozpoznac. NIE zabiera samej rozmowy ani wnioskow:
    portier nadal wie, ze ktos pytal o profesora Veyra i o Neris Aldhen, i nadal ma
    swoja teorie. 5. I TO JEST LEPSZY WYNIK NIZ CZYSTE WYMAZANIE. Konfabulacja z tury
    128 ZOSTAJE, tylko traci twarz. Do wieczora po Akademii chodzi wersja, ze ktos
    przychodzi wieczorami do Aldhen - i nie ma zywego czlowieka, ktory potrafi powiedziec,
    jak ten ktos wyglada. Przykrywka bez rysopisu jest warta wiecej niz brak przykrywki.
    6. ZAMKNIETA PETLA Z DNIA PIERWSZEGO. Polrozpoznanie z event_turn_interlude_017
    zostaje jako mgliste poczucie, ze cos juz bylo, ale nie dostaje nic nowego do
    zaczepienia. Jedyny czlowiek w Lumarii, ktory sam z siebie dwa razy prawie ulozyl
    te twarz, wlasnie stracil zdolnosc jej ulozenia. 7. WORLD MOVE - CENA, KTORA PLACI
    PORTIER, NIE LUCAN. Cisnienie senne narasta i cieć zasypia na stanowisku o czwartej
    po poludniu, przy otwartej bramie, w dzien. Nikt nie napisal w ksiedze ani slowa,
    bo nie ma komu pisac. Ale portiernia jest nowa, jego posada jest nowa i on to
    wie (npc_academy_porter - what_he_can_lose: posade); spiacy cieć w dziennym swietle
    jest widoczny dla kazdego, kto przechodzi przez brame, a przechodzi przez nia
    cala Akademia. Kto go znajdzie pierwszy, jest teraz zmienna, ktorej Lucan nie
    kontroluje. 8. IRONIA, KTORA WARTO ZAPISAC. Ten bezimienny, ktory dwa razy pytal,
    kiedy bywa Aldhen, mial w tym miescie dokladnie jedno zrodlo zdolne go opisac
    - czlowieka z bramy. To zrodlo wlasnie spi i nie umie opisac nikogo. 9. STAN.
    16:00 dnia trzeciego, brama Akademii, portiernia bez portiera. Energia 12.0 z
    15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu
    pod plaszczem, Spidey przy zebrach nieodkryty. Ksiega odwiedzin pusta i niepilnowana.
    USTALONE: curse_memory_trap opanowana i powtarzalna; portier spi na stanowisku
    i nie potrafi opisac Lucana; wersja o wieczornych wizytach u Aldhen krazy bez
    rysopisu; ojciec jest w laboratorium.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
    units: 2
  - *id002
  new_decision: Brama stoi otwarta, ksiega lezy niepilnowana, a jedyny swiadek przy
    niej spi i nie potrafi opisac nikogo. Wejscie bez zadnego sladu - ani gosc, ani
    czlonek - jest osiagalne teraz, w tej minucie, i za chwile przestanie byc, bo
    ktos tego ciecia znajdzie. Lucan idzie do skrzydla laboratoryjnego do ojca, do
    tablicy obwieszczen po reszte tego, co wisi, szukac Neris Aldhen, ktora przychodzi
    przed swiatlem i dzisiaj juz raczej wyszla - czy robi cos jeszcze ze spiacym czlowiekiem
    przy bramie?
