  summary: 'Bez testu - rozmowa, osiem minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Doktryna, nie redakcja - i to jest wlasciwa odpowiedz na dziure
    z

    t_166.


    1. DZIURA ROZWIAZANA PRZEZ ZMIANE POZIOMU, NIE PRZEZ KLAUZULE. Neris pytala, jak

    napisac wyjatek dla sprzatajacych. Odpowiedz: nie pisac go. Tekst nie obowiazuje
    na

    poziomie, na ktorym sprzatanie sie odbywa. Prawa sa dla NAS - dla badaczy, kapituly,

    miasta - nie dla tych, ktorzy decyduja na poziomie panstwa; jak prawo wojenne

    uchylajace zwykle. Kto ratuje swiat, nie sprawdza kodeksu.


    2. I TO JEST SPOJNE Z KANONEM, KTORY JUZ STOI. necromancy-law#information_rule
    mowi

    wprost, ze ta sama osoba moze byc dla jednej strony przestepca, dla drugiej

    chronionym ekspertem, a dla trzeciej zakladnikiem, i ze zwycieska interpretacja

    zalezy od sily i koalicji, nie od tekstu. Gracz nie wprowadza nowej mechaniki
    -

    nazywa te, ktora plik juz opisuje, i buduje na niej projekt.


    3. UMOWA SPOLECZNA JAKO CEL - PIERWSZE POZYTYWNE SFORMULOWANIE CELU W CALYM AKCIE
    3.

    Do tej pory cel byl obronny ("nie dac Kosciolowi pretekstu", "nie dopuscic do
    pelnej

    legalizacji"). Teraz brzmi: wszyscy troche niezadowoleni, i to jest sukces. To
    zmienia

    kryterium oceny dysputy. Waska wygrana Neris (t_139) przestaje byc kompromisem

    z koniecznosci i staje sie POSTACIA DOCELOWA.


    4. "NIE MACZAM PALUCHOW W PRADAWNYCH ZMARLYCH" - ZDANIE, KTORE DEMONSTRUJE WLASNA

    DOKTRYNE W TEJ SAMEJ MINUCIE, W KTOREJ JA WYKLADA. Varkhen jest pradawny i Lucan

    utrzymuje go czterema laczami (state/sustained-links.yaml). Nie jest to klamstwo
    w

    rozumieniu Lucana, tylko dokladnie to, co przed chwila opisal: w polityce nie
    mowi

    sie calej prawdy. WIDZI TO WYLACZNIE LUCAN. Neris nie ma jak tego zlapac - nie
    zna

    Varkhena (forbidden_without_event nienaruszone). Nie wkladac tej ironii nikomu
    w usta.


    5. CMENTARZ ODLOZONY JAKO NIE-TERAZ I MOZLIWE NIE-NASZ. Uwaga dla ciaglosci:

    objective_fulfill_varkhen_oath (trzy pieczecie, dolne wrota) pozostaje aktywne
    i

    status_long_term. Deklaracja gracza dotyczy PRIORYTETU I RETORYKI wobec Neris,
    nie

    anulowania przysiegi. Nie kasowac celu.


    6. KOLM - DWIE POLOWY WRESZCIE ZLOZONE. t_137b: Neris nie umiala odpowiedziec,
    czemu

    Kolm wzial linie podcinajaca jego wlasna katedre. t_140: zna jego cene - rektorat.

    Lucan laczy to teraz jednym zdaniem: Kolm torpeduje wlasna prace nad biomutantami,
    bo

    nie mowi, o co mu chodzi. NOWY KANON gracza: katedra Kolma to BIOMUTANTY - spojne
    z

    necromancy-law#construct_boundary.institutional_interest, gdzie biokonstrukty
    stoja

    na liscie zagrozonej szeroka definicja.


    7. WORLD MOVE A - NERIS NIE PRZYJMUJE TEGO SPOKOJNIE I NIE MA PRAWA (retcon_000039).

    "W nauce sie nie klamie" nie jest dla niej moralnoscia, tylko systemem operacyjnym
    -

    cala jej pozycja to tekst, ktory da sie cytowac. Kontestuje jednak ZASTOSOWANIE,
    nie

    OBSERWACJE, i robi to argumentem ze swojego warsztatu, nie z etyki: przemilczenie
    nie

    jest bezpieczne, bo przemilczenie sie ZNAJDUJE, a znalezione przemilczenie unieważnia

    cytowalnosc WSZYSTKIEGO innego, co napisala. To jest realne ograniczenie tego,
    jak

    daleko dokument moze byc polityczny, i jest dla Lucana uzyteczne, nie przeszkadzajace.


    8. WORLD MOVE B - I NATYCHMIAST TRACI PRAWO DO TEGO ARGUMENTU, CO SAMA ZAUWAZA

    (portrayal.the_flaw). Godzine temu przyjela przykrywke doktorantki i jej nie

    sprostowala (t_147). Zyla wiec ta doktryna, zanim ja uslyszala. Przyznaje to na
    glos,

    zanim policzy koszt, i to ja kosztuje wiecej niz cokolwiek dzisiaj.


    9. WORLD MOVE C - OJCIEC WLACZA SIE DOKLADNIE RAZ, NA SLOWACH "W NAUCE SIE NIE

    KLAMIE", BO TO JEDYNA CZESC W JEGO JURYSDYKCJI. Zgadza sie z entuzjazmem i doklada

    poprawke, ktora jest metodologiczna, a nie oskarzycielska: prawie nikt w nauce
    nie

    klamie: ludzie po prostu NIE MIERZA tego, co by im zaprzeczylo. Nie ma pojecia,
    ze

    opisal wlasnie mechanizm, ktory jego syn przed chwila zaproponowal jako metode.
    Wraca

    do rejestru. Nie robic z tego oskarzenia - to jest jego rejestr, nie jego intencja.


    10. CZEGO NADAL NIE PADLO. Sygnatura - dziesiaty raz. Odpowiedz na pytanie redakcyjne

    o trzy substancje. Wpis do rejestru zaopatrzenia niezlozony. Imie narzeczonej
    i nazwa

    rodu - NIE WYMYSLAC. Ojciec nadal nie wie o nekromancji, sieci, Varkhenie, syndykacie

    ani o slowie wabik.


    11. STAN. Wieczor dnia trzeciego, laboratorium profesora Veyra, 19:08. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: doktryna poziomow - prawo

    obowiazuje na poziomie, na ktorym sie je pisze; cel to umowa spoleczna, w ktorej

    wszyscy sa troche niezadowoleni; wyjatku dla sprzatajacych sie NIE pisze; cmentarz

    odlozony jako nie-teraz; katedra Kolma to biomutanty i jego linia torpeduje jego

    wlasna prace; Neris zakwestionowala doktryne argumentem z cytowalnosci i sama

    przyznala, ze juz wedlug niej dziala.

    '
