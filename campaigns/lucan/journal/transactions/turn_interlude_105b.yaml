outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium jest etapem budowy swiata prowadzonym przez gracza
    (retcon_000033), wiec deklarowana fabula ladnie laduje tak, jak zostala zadeklarowana.
    Dwadziescia minut, koszt 0.2 jednostki, rezerwa 8.0 -> 7.8. 1. KOREKTA GRACZA
    PRZYJETA - ROZMOWCA JEST KESZ. Lucan mowi do prawnika i tylko do prawnika. Ilva
    Rennat zostaje przy wadze, przy swoim towarze i swojej liczbie; zloto jest jej
    sprawa i tylko jej. Rozmowa o tym, kim Lucan jest i po co przyszedl, idzie z Keszem,
    i to jest wlasciwy adres. 2. ROZPOZNANIE, KTORE ZOSTAJE W GLOWIE LUCANA I NIE
    PADA NA GLOS. Rysopis Kesza zgadza sie z czlowiekiem SPOZA ZALOGI, po spotkaniach
    z ktorym Oren zmienial trasy - to zeznanie Halveka z event_turn_interlude_048,
    ktore wtedy urwalo sie na "na razie nie podaje wiecej", bo nikt nie mial twarzy
    do przypisania. Teraz Lucan siedzi naprzeciwko tej twarzy. Kanon zapisuje to jako
    MOCNE DOPASOWANIE, nie jako potwierdzona tozsamosc: potwierdzenie moze dac Halvek,
    ktory siedzi w celach gildii i widzial tego czlowieka. 3. WYNIKA Z TEGO RZECZ,
    KTORA PRZEWRACA CALA WCZESNIEJSZA OSTROZNOSC LUCANA - ONI SA W TEJ LINII. Nie
    "byli posrednikiem" w domysle Lucana, tylko realnie: prawnik obiegu spotykal sie
    z operatorem nekromantycznej logistyki cmentarza i po tych spotkaniach zmieniala
    sie trasa wozu ze zwlokami. Pierwsza teza Lucana byla trafna. Kesz nie potwierdza
    jej ani slowem i nie musi - potwierdza ja tym, ze przestaje pisac i nie zadaje
    ani jednego pytania wyjasniajacego, chociaz kazde zdanie Lucana jest dla postronnego
    prawnika belkotem o cudzych wozach. 4. DZWIGNIA DZIALA I DZIALA OSOBISCIE. Punkty
    kontrolne, blankiet, rysopis i nitki do strazy i magistratu nie sa dla Kesza abstrakcja
    instytucjonalna - to jest lista rzeczy, ktore prowadza do NIEGO. Lucan podal ja
    jako prezent, "pro bono", i to jest jedyny powod, dla ktorego rozmowa idzie dalej
    w strone interesu, a nie w strone usuwania problemu: czlowiek, ktory przynosi
    ci twoja wlasna ekspozycje i kladzie ja na stole zamiast handlowac nia przez posrednika,
    oferuje uklad, nie szantaz. Kesz czyta to poprawnie i mowi to na glos. 5. KATEGORII
    NIE TRZEBA NAZYWAC I TO JEST PUENTA CALEJ ZAGRYWKI. Lucan powiedzial, ze oni sie
    domyslaja, czego potrzebuje. Ilva by sie nie domyslila i kazalaby nazwac. Kesz
    obslugiwal logistyke, ktora dostarczala Orenowi dokladnie to samo. Nie pyta, co
    to za "kategorie towarow". Pyta o ILOSC, CZESTOTLIWOSC I STAN - i to jedno pytanie
    jest calym przyznaniem sie do wszystkiego, czego Lucan nie zdolal udowodnic przez
    trzy dni. 6. DOLA TOWARZYSZY PRZECHODZI BEZ TARGU. Boros i Mara biora swoje z
    reki syndykatu, pelna stawka, osobno, bez potracen; dodatkowy procent schodzi
    z Lucana zgodnie z jego wlasna propozycja. Mara slyszy, ze zostala wymieniona
    jako pierwsza i ze Lucan zdejmuje to z siebie, nie z niej. 7. WOJNA DOMOWA ZA
    DWA TYGODNIE - PRZYJETA JAKO TERMIN, NIE JAKO CHELPLIWOSC. Kesz jest prawnikiem
    ludzi, ktorzy zyja z tego, ze wiedza wczesniej. Nie smieje sie i nie odradza.
    Traktuje to jak date w kalendarzu, do ktorej trzeba ustawic pozycje - i wlasnie
    dlatego chce wiedziec, po ktorej stronie ma stac jego pokoj. 8. KLATWA WYKONANA,
    NIEZAUWAZONA. Pomniejsza klatwa pecha na obu odzwiernych (ability_minor_bad_luck,
    0.1 na cel), cele nieuprzedzone i niepismienne magicznie, bez testu zgodnie z
    kalibracja z 19.08. Pierwsze wyjscie: drugiemu odzwiernemu pęka szew worka przy
    przestawianiu i ryta trzecia rozsypuje sie po posadzce. W pokoju czyta sie to
    jako niezdarnosc. Wagowy zbiera bez slowa. 9. WORLD MOVE - KESZ ZMIENIA STOLEK.
    Zamyka teczke, ale nie chowa jej; przesiada sie tak, ze siedzi po tej samej stronie
    stolu co Lucan, plecami do wagi. Od tego ruchu przestaje byc prawnikiem pokoju
    wobec Lucana i staje sie czlowiekiem, ktory ma z Lucanem wspolny problem - i mowi
    to wprost, bo obaj i tak to wiedza. Nie oferuje jeszcze niczego. Zadaje jedno
    pytanie, ktore musi paść przed czymkolwiek innym. 10. STAN. 14:35 dnia trzeciego.
    Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow. Zloto u nich, liczba Ilvy
    nadal nienazwana bo to osobna rozmowa, przepustka i Spidey pod plaszczem, odzwierni
    przeklęci, Mara nadal reczy.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: set
    instance_id: pc_lucan
    path: resources.lucan_necrotic_energy.current
    value: 7.8
  - *id002
  new_decision: Kesz pyta o ilość, częstotliwość i stan - czyli o to, czego Lucan
    naprawdę potrzebuje - i chce wiedzieć, po której stronie jego pokój ma stać za
    dwa tygodnie.
