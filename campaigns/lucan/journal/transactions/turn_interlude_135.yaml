outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - retcon_000052. Geo jest cantripem za 0.2 jednostki, powtarzalnym
    natychmiast i dowolna liczbe razy, wiec wg system/tests.md nie ma czego testowac;
    rzut roll_turn_interlude_134 zostaje w dzienniku, ale nie rozstrzyga. Cztery minuty,
    0.2 jednostki. 1. PRZESZKODA BYLA NAZYWALNA I USUWALNA, WIEC LUCAN JA USUWA. Spidey
    schodzi ze skrzynki na parapet przeciwnego okna. Wlasna sygnatura smierci wychodzi
    z bliskiego kanalu, kanal sie oczyszcza. To cala nauka pierwszego podejscia i
    cala jego cena. 2. CZUCIE KAMIENIA NADAL NIE ODDAJE NIC I NIE ODDA. To nie bylo
    wykonanie - to jest wlasnosc lokacji. Remont rozcial strukture skrzydla, a Stone
    Sense wymaga ciaglego kamienia. Powtorka tego nie naprawia i zadna liczba powtorek
    nie naprawi. Zostaje jako trwaly fakt o zone_academy_scaffolded_wing. 3. GRAVE
    SENSE ODPOWIADA. W promieniu trzydziestu metrow jest DOKLADNIE JEDNA czynna sygnatura
    smierci i siedzi na parapecie. Poza nia nic. Za oknami, na poziomie rusztowania,
    na ktorym pyl jest naruszony, NIE STOI nic martwego. W scianach, pod podloga i
    nad sufitem tez nie. 4. I TO JEST DOBRA WIADOMOSC, KTOREJ WARTOSC WIDAC DOPIERO
    PO ZLOZENIU Z RETCONEM 000051. Obserwator tego skrzydla jest ZYWY. Zywy znaczy
    CIEPLY, a cieply znaczy, ze miesci sie w profilu, ktory posterunek Spideya lapie
    bez zadnego wysilku - przez sciane, w ciemnosci, bez ruchu i bez dzwieku. Luka
    ''martwe I nieruchome jednoczesnie'' istnieje, ale ten konkretny czlowiek do niej
    nie wchodzi. Od tej chwili nie da sie stanac pod jej drzwiami ani na rusztowaniu
    za jej oknami, kiedy Spidey tam jest, i nie zostac policzonym. 5. CZEGO TO NIE
    ZNACZY, ZEBY NIKT PO TO NIE SIEGAL POZNIEJ. Nie znaczy, ze nikogo tam teraz nie
    ma poza zasiegiem trzydziestu metrow. Nie znaczy, ze obserwator nie moze przyslac
    kogos innego. Znaczy tylko, ze na dzisiaj, w tym promieniu, martwych nie ma. 6.
    WORLD MOVE - PYTANIE NERIS ALDHEN STOI I ZMIENILO TEMAT ROZMOWY. Ona nie widziala
    wyniku, widziala CZYNNOSC: gosc drugi raz oparl dlon o jej mur i poszukal w nim
    trupa, a potem przestawil swojego pajaka na jej parapet. Przestala pytac o okaz.
    Pyta o wlasne sciany i siedzi blizej, nie dalej. 7. STAN. 16:38 dnia trzeciego,
    pokoje Neris Aldhen, drzwi na zasuwie, Spidey na parapecie przeciwnego okna. Energia
    10.65 z 15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka
    syndykatu pod plaszczem. USTALONE: w promieniu 30 m nie ma zadnej sygnatury smierci
    poza Spideyem; obserwator skrzydla jest ZYWY, wiec wpada w profil wykrywalny przez
    posterunek; skrzydla nadal nie da sie sluchac przez kamien; Neris pyta o swoje
    sciany, nie o okaz.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
    units: 0.2
  - op: set
    instance_id: companion_spidey
    path: position.formation
    value: on_the_far_window_sill_in_neris_aldhens_rooms_moved_out_of_lucans_near_channel_still_covering_both_windows_and_the_door
  - *id002
  new_decision: Neris Aldhen siedzi blizej niz przedtem, z odlozonym piorem, i pyta,
    czego Lucan szuka w jej scianach. On wie juz, ze odpowiedz brzmi 'niczego martwego'
    - i ze jej obserwator jest zywym czlowiekiem, ktorego od teraz da sie policzyc.
    Jej pytanie o to, kto jeszcze widzial okaz, nadal nie zostalo odpowiedziane.
