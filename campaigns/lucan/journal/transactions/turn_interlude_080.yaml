  - op: advance_time
    seconds: 23400
  - *id002
  summary: 'Bez testu. Noc konczy sie krotko i bez ceremonii. 1. PAJAK WYSTAWIONY
    I ZOSTAWIONY SAM. spy_cellar_spider_01 idzie do gabinetu Seraphine w budynku gildii
    i zostaje tam bez zadnego ustalenia co do karmienia. Wystawiony przez szczeline
    w oknie, wchodzi w rog za szafa i zaczyna prasc - gesta, biala, jawnie nienaturalna
    kurtyna, ktora rano bedzie pierwsza rzecza, jaka kontrolerka zobaczy. Alarm dziala
    i nie potrzebuje pasma. Trzy dni to jego termin, jesli nikt go nie nakarmi - a
    Lucan wlasnie przestal sie tym zajmowac. Sama Seraphine nie zostala uprzedzona,
    ze cos jej stoi w gabinecie i predzej czy pozniej zapyta, czym to jest i pod czyim
    nazwiskiem. 2. LUCAN WRACA DO GILDII. Cela po Varkhenie, kamien, sucho, bez okna,
    dwoje drzwi od korytarza zatrzyman i od czworki wspolpracujacych swiadkow - i
    od kratki w podlodze, przez ktora ida kanaly, w ktorych chodza teraz dwie jego
    stonogi. Spidey schodzi z nim, spy_cellar_spider_06 tez, program recznego karmienia
    dziala dalej. 3. NOC. Siec pracuje bez nadzoru: osiem zukow rozchodzi sie po smietnikach
    dzielnicy muru, dwie stonogi po kanalach, sieciarze poluja i po raz pierwszy szukaja
    miekkich, skrzydlatych rzeczy pod lampami. Trzy pajaki czekaja w baszcie na najblizsza
    rotacje sieciarzy. Nikt nie ma rozkazu i o to chodzi - dojrzewaja. 4. STAN NA
    KONIEC. Lucan 11,5/15 energii (koszt upgradu zwrocony, retcon_000017), 19/19 integralnosci,
    siedemnascie slug serii w polu, wabik nierozpoczety, pajak alarmowy DOSTARCZONY
    choc nieuzgodniony. Do pokazu i przesluchania czternascie dni.'
  new_decision: 'Rano dnia drugiego interludium, cela w piwnicy gildii. Do rozstrzygniecia
    - czym Lucan zaczyna dzien: wabikiem przy stole w baszcie, rozmowa z Seraphine
    o tym, co jej wisi w gabinecie, czy czyms zupelnie innym.'
