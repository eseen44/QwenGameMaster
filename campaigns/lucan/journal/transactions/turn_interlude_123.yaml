  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dwadziescia minut,
    zero energii. Scena toczy sie przy Varkhenie, ktory stoi w tych samych gornych
    biurach (retcon_000037). 1. PIORO - SERAPHINE BIERZE TO NA SIEBIE I ROBI TO Z
    POWODU CZYSTO OPERACYJNEGO, NIE Z LITOSCI NAD RUSKIEM. Nie broni go ani slowem;
    przyjmuje ocene Lucana bez sporu. Ale kradziez odrzuca i nazywa dlaczego: przedmiot
    znikajacy z biurka urzednika miejskiego w trakcie trwajacego sprawdzenia jego
    kompetencji zostaje ZGLOSZONY, a Rusk jest dokladnie tym czlowiekiem, ktory zglasza
    - jego jedyna dzwignia to raporty i zastrzezenia proceduralne. Kradzione pioro
    produkuje wiec dokladnie ten dokument, ktoremu klatwa zapobiegala. Rozproszenie
    robi ona: jest antymagiczna kontrolerka gildii, zdejmowanie cudzych efektow w
    budynku gildii jest jej robota i nie wymaga od niej tlumaczenia sie nikomu. Warunek:
    robi to sama, bez Lucana w poblizu, i nie chce znac procedury. 2. "JEDEN DZIEN
    OPOZNIENIA" - NIE SPIERA SIE O SKALE, TYLKO PRZESTAWIA, CZEGO TO DOTYCZY. Zgadza
    sie, ze Rusk jako czlowiek jest bez znaczenia. Rzecz w tym, ze Rusk jest w tej
    chwili MIERZONY, a mierzy sie go zdolnoscia do pisania - wiec efekt nie opoznia
    raportu, tylko ustawia wynik postepowania. Po wygaszeniu Rusk odzyskuje pioro
    i pisze dalej; to jest cena, ktora ona swiadomie przyjmuje, i mowi to wprost,
    zeby Lucan nie odkryl tego sam. 3. "JESLI GILDIA ZECHCE SIE MNIE POZBYC, ICH STRATA"
    - I TO JEST MOMENT, W KTORYM ROZMOWA ZMIENIA RAME. Seraphine nie robi z tego urazy.
    Nie moralizuje i nie udaje zaskoczonej - wie od dawna, ze Lucan nie postawi zycia
    za idee i ma to policzone. Robi cos innego: PRZELICZA STRATEGIE. Skoro gildia
    jest rozmienna, to przestaja optymalizowac przesluchanie jako rzecz do przetrwania,
    a zaczynaja traktowac je jako rzecz do WYDANIA. Mowi jedno zdanie o sobie i nie
    wraca do niego: ona rozmienna nie jest, bo nie ma dokad wyjsc, ale to jest jej
    problem, nie jego. 4. DOKTRYNA PRAWNA - PRZYJMUJE JA W CALOSCI I SAMA WYCOFUJE
    WLASNY ZARZUT SPRZED GODZINY. Argument Lucana pokrywa sie z tym, co ustalil w
    pokoju syndykatu: nie ma sprawy, bo nie ma nekromanty - jest akademik budujacy
    golemy z ciala, a prawo Solmary nie zna kategorii dotyczacych zwierzat (necromancy-law.yaml#animal_and_vermin_modification,
    #construct_boundary). Spojnosc daje mu NARZUCONE SOBIE OGRANICZENIE: nie tyka
    ludzkich zwlok, i dlatego odmowil dostaw cial od syndykatu. Przy tym ograniczeniu
    obrona karna i klasyfikacyjna przestaja sobie przeczyc, wiec teza o dwoch wykluczajacych
    sie liniach UPADA (act-03-defence.yaml#two_contradictory_defences uchylone przez
    #lucans_legal_doctrine). 5. ALE NAZYWA JEDYNY SZEW I NAZYWA GO DOKLADNIE TAK SAMO
    JAK PRAWNIK Z DRUGIEJ STRONY BARYKADY: Kosciol nie uznaje szarej strefy zwierzecej
    DOKTRYNALNIE (church_position.animal_gray_zone_recognized_doctrinally: false).
    Doktryna jest szczelna wobec forum swieckiego i bezwartosciowa wobec kaplana.
    I zostaje Varkhen, ktory nie miesci sie w niej w zaden sposob - co Lucan sam przyznal.
    6. PRAWNIK I KAPLAN - JEJ CZYTANIE JEST TWARDSZE NIZ TO, KTORE LUCAN PRZYNIOSL.
    Prawnik moze skontaktowac go z kaplanem, bo jest POWIAZANY ZE SPRAWA CMENTARZA
    - czyli nie jest posrednikiem, tylko czlowiekiem z tego samego obiegu co kaplan.
    Wniosek: on nie organizuje spotkania DLA Lucana. Organizuje spotkanie dla SIEBIE,
    z Lucanem w roli osoby, ktora ma tam siedziec. Trafia to co do slowa w to, co
    w pokoju zostalo zapisane - prawnik przestal byc uslugodawca i stal sie strona
    z wlasnym motywem (event_turn_interlude_109). 7. CZEGO CHCA OD KAPLANA - ONA MA
    ODPOWIEDZ I CZEKALA NA MOZLIWOSC JEJ POWIEDZENIA. Nie zemsty i nie ciszy. Ten
    kaplan jest jedynym ZYWYM swiadkiem, ktory laczy Kosciol z pieczeciami i z Orenem:
    znal wlasciwe wejscie, kontrolowal pieczecie i przy ostatniej wizycie przyszedl
    z Orenem. Lucan ma juz jednego swiadka na to samo - Varkhena - ale Varkhena nie
    da sie postawic przed zadnym forum bez konca calej sprawy. Kaplan jest tym samym
    zeznaniem w formie, ktora WOLNO pokazac. Zabity albo zastraszony jest wart zero;
    potrzebny jest zywy, mowiacy i majacy wlasny powod, zeby mowic. 8. URZEDNIK -
    JEJ ODCZYT JEST NATYCHMIASTOWY I NIEPRZYJEMNY. Urzednik akt, ktory pisze do OSOB
    - do Ruska, do Mary, do Borosa - a nie do instytucji, nie omija kanalow przypadkiem.
    Albo buduje prywatna teczke, albo ktos buduje ja jego reka. I zbieg, ktory Lucan
    podal, nie zauwazajac go: jednym z adresatow jest Rusk, czyli czlowiek, ktoremu
    Lucan wlasnie odebral zdolnosc odpisywania. Kanal, ktory Lucan zbudowal, i kanal,
    ktory Lucan zablokowal, to ten sam czlowiek. 9. DYSPUTA - I TO JEST NAJCIEZSZA
    RZECZ TEJ TURY. Seraphine nie kwestionuje, ze Lucan obali tezy magow Kosciola
    miazdzaco. Przyjmuje to i natychmiast odwraca: jesli Kosciol CHCE przegrac, to
    dysputa nie jest polem bitwy, tylko PRETEKSTEM. Instytucja, ktora publicznie przegrywa
    spor, jaki mogla wygrac, kupuje sobie prawo powiedziec, ze droga formalna zawiodla.
    Mechanizm stoi w plikach po obu stronach: legalizacja de facto polega na tym,
    ze przestaje sie rozpatrywac skargi (necromancy-law.yaml#de_facto_liberalisation_mechanism),
    a Kesz ostrzegl dokladnie tak samo jak ona - gdy sciezka formalna cichnie, srodek
    zaradczy zmienia rece z papieru na LUDZI. Zwyciestwo Lucana jest wiec dokladnie
    tym, czego ta strona potrzebuje, zeby przestac uzywac papieru. To nie odbiera
    mu wygranej; zmienia to, co wygrana uruchamia. 10. ZAKON - ZGODA I NATYCHMIASTOWY
    PROBLEM, KTORY LUCAN NAZWAL SAM. Zakony mieczowe zyja z powstrzymywania niekontrolowanych
    nieumarlych; to jest ich interes wlasny, nie usluga (faction_lumaria_martial_orders.interests).
    Kontrakt na cmentarz oznacza wiec zbrojnych ludzi z misja przeciw dokladnie tej
    kategorii bytu, ktora Lucan przyprowadzi ze soba. Seraphine nie rozstrzyga tego
    sama i mowi dlaczego: to jest pierwsza decyzja tego wieczoru, ktora dotyczy kogos,
    kto stoi w tym pokoju. 11. WORLD MOVE - ODWRACA SIE DO VARKHENA I PYTA JEGO. Przez
    cala rozmowe stal w tych samych gornych biurach i slyszal wszystko: uklad z syndykatem,
    linie Strazy, siedem dzwigni i zdanie o nudzacym sie staruszku, powiedziane o
    czlowieku stojacym trzy kroki dalej. Pyta go o dwie rzeczy naraz, bo obie sa jego:
    czy zgodzi sie byc widziany przez zakon, ktory zostanie sciagniety do jego wlasnych
    pieczeci - i czego on wlasciwie chce, skoro sie nudzi. Zaznacza, ze nie pyta,
    co mu wolno. 12. STAN. 19:35 dnia trzeciego, gorne biura, drzwi na zasuwie. Lucan:
    energia 7.8 z 15, integralnosc 19 z 19, bez warunkow, 4 000 srebra w zlocie i
    przepustka syndykatu w kieszeni, Spidey przy zebrach nieodkryty. USTALONE: pioro
    rozprasza Seraphine, sama i bez Lucana; doktryna prawna przyjeta, teza o dwoch
    sprzecznych obronach uchylona; kaplan potrzebny ZYWY jako swiadek; prawnik uznany
    za strone; przesluchanie przekwalifikowane z rzeczy do przetrwania na rzecz do
    wydania. OTWARTE: czy dysputa zostaje wygrana mimo odczytu, co z zakonem wobec
    Varkhena, kanal ostrzegawczy dla syndykatu, kim Lucan siada przy kaplanie.'
  new_decision: Seraphine pyta Varkhena wprost, czy zgadza sie byc widziany przez
    zakon sciagniety do jego pieczeci i czego chce, skoro sie nudzi. Odpowiedz nalezy
    do Varkhena, ale to Lucan trzyma wiez - i to on musi zdecydowac, czy dysputa nadal
    ma zostac wygrana miazdzaco.
