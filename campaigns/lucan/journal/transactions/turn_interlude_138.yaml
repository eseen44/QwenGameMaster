outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, interludium buduje gracz. Osiem minut, zero energii.
    NAJWAZNIEJSZA TURA TEJ SCENY: pada nazwisko i pada prawdziwa stawka dysputy. 1.
    TOZSAMOSC UJAWNIONA. "Lucan Veyr" znosi forbidden_without_event lucans_identity_at_all
    z karty npc_neris_aldhen. Skutek jest ten, ktory nazwala Seraphine (institutional_defence#noble_name_disclosure):
    nekromanta bez nazwiska to sprawa dyscyplinarna i karna, nekromanta Z NAZWISKIEM
    to spor o jurysdykcje, w ktorym Lucan przestaje byc oskarzonym i staje sie STAWKA.
    Cena zaplacona swiadomie osobie, ktora za szesnascie dni stanie na OTWARTEJ dyspucie.
    2. I NAZWISKO LADUJE U NIEJ DWA RAZY. Raz jako rod - Veyr jest rodem wielkim.
    Drugi raz jako KOLEGA Z KORYTARZA, bo w skrzydle laboratoryjnym trzydziesci krokow
    stad pracuje profesor Veyr (npc_lucan_father, surname_known: Veyr, current_zone_id
    zone_academy_laboratory_wing). Lucan mowi o nim "tata", wiec drugie polaczenie
    robi ona sama i natychmiast. 3. IRONIA, KTOREJ ONA NIE MOZE JESZCZE ZOBACZYC,
    A LUCAN MOZE. Agenda ojca brzmi doslownie: "znalezc odbitke z nazwiskiem osoby
    walczacej o szeroka definicje ozywionych konstruktow". On grzebie w stosach za
    JEJ nazwiskiem od dwoch dni, trzydziesci krokow stad. Ona siedzi na wlasnym stosie
    tych odbitek. Szukajacy i szukana sa w jednym budynku i zaden nie wie. 4. GROZBA
    O OJCU NIE JEST PRZESADA I ONA MA JAK TO SPRAWDZIC BEZ WIARY NA SLOWO. Inkwizycja
    potepila profesora Veyra DWA RAZY i formalne potepienie nie zatrzymalo ani jego,
    ani jego pracy. Raz ktos probowal wtargnac do laboratorium - glowa tego czlowieka
    jest dzis uzywana na WARSZTATACH Z OPTYKI, z tylem czaszki zastapionym szklem,
    i stoi w OBIEGU DYDAKTYCZNYM, nie w ukryciu (npc_lucan_father#history_disclosed_by_lucan).
    Neris uczy na tej uczelni. Nie musi wierzyc Lucanowi - musi tylko przypomniec
    sobie, na czyjej czaszce demonstrowala pobudzone nerwy. 5. JEJ DROGA WYJSCIA ZOSTAJE
    ZAMKNIETA I ARGUMENT LUCANA JEST POPRAWNY. Sabotaz nie dziala, kiedy wynik jest
    uzgodniony z gory: dyskusja z sali dostarczy argumentow za nia, nikt ich nie zakwestionuje,
    bo OBIE STRONY CHCA MOC POWIEDZIEC "DIALOG ZAWIODL". Zle wygloszona mowa zostanie
    naprawiona przez publicznosc i i tak wygra. Neris nie ma wyjscia przez porazke
    - ma tylko wyjscie przez to, CZYM ta wygrana zostanie. 6. PRAWDZIWA STAWKA, NAZWANA
    WPROST. Obie strony chca PRETEKSTU. Kosciol z radoscia przysle inkwizytora; profesor
    Veyr z jeszcze wieksza radoscia go spali przy bramie. Dysputa jest zapalnikiem,
    nie sporem naukowym. Zgodne z kanonem: Inkwizycji brakowalo nie zamieszek, a preteksu,
    a mechanizm szarej strefy wypycha spor z forow, gdzie srodek zaradczy zmienia
    rece z papieru na ludzi. Motyw Lucana podany bez owijania: lubi to miasto na tyle,
    zeby nie chciec magicznej wojny domowej. NIE jest to skrucha ani lecznie moralne
    - jest to rachunek. 7. WORLD MOVE - ONA ODDAJE PLAN PRZEGRANIA I ODDAJE PRZY TYM
    PIERWSZY CIOS WLASNY. Przyjmuje, ze nie umie tego przegrac. Ale nie zostaje przekonana
    na kolanach i nie robi sie sojuszniczka z wdziecznosci: wskazuje Lucanowi dziure
    w jego wlasnej pozycji, ta, ktorej on nie moze zaprzeczyc - czlowiek, ktory nie
    chce wojny, przyszedl ja odradzac jako syn jednej z dwoch stron zapalnika. Pyta,
    co konkretnie znaczy "posprzatac" i czego on od niej chce, i pyta to jako warunek,
    nie jako zgoda. 8. CZEGO ONA NADAL NIE WIE. Sieci sieciarzy, Varkhena, slowa vitae,
    ojcowskiego planu pokazu, celi w piwnicy gildii, syndykatu. Zadna z tych rzeczy
    nie padla. 9. STAN. 16:57 dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie,
    Spidey na parapecie. Energia 10.65 z 15, integralnosc 19 z 19, bez warunkow. 4
    000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: Neris zna
    nazwisko Lucan Veyr i wie, ze jest synem profesora Veyra; plan przegrania dysputy
    PORZUCONY jako niewykonalny; obie strony chca preteksu, a dysputa jest zapalnikiem;
    motyw Lucana ujawniony - nie chce magicznej wojny domowej w Lumarii.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: on_the_daybed_in_neris_aldhens_rooms_name_given_lucan_veyr_she_knows_he_is_the_professors_son_and_is_asking_what_cleaning_up_means
