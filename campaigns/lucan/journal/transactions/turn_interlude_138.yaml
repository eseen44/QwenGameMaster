    jej zostalo: co konkretnie znaczy "posprzatac" i czego Lucan Veyr od niej chce.
    Stawia przy tym zarzut, na ktory on nie ma gotowej odpowiedzi - odradza wojne
    jako syn jednej z dwoch stron zapalnika.'
