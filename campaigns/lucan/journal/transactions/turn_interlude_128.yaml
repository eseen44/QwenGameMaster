outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - zwykly czlowiek bez karty (kalibracja 19.08.2026), a procedura
    jest juz aktywna i domknieta, bo persistence oplacona dotykiem nie wymaga podtrzymywania
    (system/curses.md#dotyk-jako-kanal-dostarczenia). Dziesiec minut, zero energii.
    Rezerwa po retcon_000046: 7.5 z 15. 1. WYKORZYSTANIE MECHANIZMU DZIALA DOKLADNIE
    TAK, JAK LUCAN ZALOZYL. Nowe pytanie jest nowym torem, a czlowiek z obnizonym
    hamowaniem nie umie zostawic pytania bez odpowiedzi ani wrocic do poprzedniego.
    Portier porzuca wlasne pytanie w pol zdania. 2. I ODDAJE TO, CO MA - CZYLI WIEDZE
    Z BRAMY, NIE Z KATEDRY. To on pina obwieszczenia, wiec dysputa jest dla niego
    kartka, ktora wisi od dwoch tygodni i ktora przypinal TRZY RAZY, bo dwa razy ktos
    urwal jej rog. Data sie zgadza: okolo szesnastu dni. Nazwiska tez - Aldhen i Kolm.
    3. NERIS ALDHEN WIDZIANA Z PORTIERNI. Zna ja z widzenia, bo przychodzi pierwsza,
    przed swiatlem, i sama wpisuje swoich gosci do ksiegi, czego nikt inny na tej
    uczelni nie robi. Nie ma jej tu dlugo - potwierdza to, czego karta mowi wprost
    (lucan_recognition: none): przyszla po wylocie Lucana. 4. JAK CZYTA JA PORTIERNIA,
    CZYLI JAK CZYTA JA POL AKADEMII. W jego ustach jej stanowisko nie jest o definicjach:
    to ta, ktora mowi, ze o tym, co sie liczy, ma decydowac Akademia, a nie ksieza.
    Starsi mowia o niej, ze skreci sobie na tym kark - identycznie jak zapamietal
    to ojciec Lucana przy jej odbitce (''odwazniejsza, niz jej sie to oplaci'', npc_neris_aldhen.portrayal.fathers_assessment).
    Zbieznosc jest teraz potwierdzona z drugiego, calkiem niezaleznego zrodla. 5.
    NOWY TROP, KTORY MOZE DAC TYLKO CZLOWIEK Z BRAMY. Dwa razy przyszedl ktos z zewnatrz
    i pytal, kiedy ona bywa. Nie zostawil nazwiska, nie wszedl do srodka - a skoro
    nie wszedl, portier nie zapisal nic i nigdzie. Nie byl to student i portier nie
    umie powiedziec, czyj byl. Pierwsza konkretna oznaka, ze strona szerokiej definicji
    jest przez kogos obserwowana PRZED dysputa. 6. CENA, TA SAMA MONETA, KTORA LUCAN
    WLASNIE WYDAL. Obnizone hamowanie nie znosi tylko dyskrecji - znosi te ostroznosc,
    ktora kazalaby czlowiekowi przyznac, ze czegos nie wie. Portier nie dostal odpowiedzi
    na pytanie o rodzine, wiec ZLEPIA SOBIE WERSJE z dwoch rzeczy, ktore ma pod reka
    - z twarzy, ktora widzial kiedys wieczorem, i z pytania o Neris Aldhen, ktore
    wlasnie uslyszal. Wychodzi mu, ze Lucan przychodzi DO NIEJ, i to po zmroku. Mowi
    to na glos, z zadowoleniem, konfidencjonalnie, jak czlowiek, ktory wlasnie sam
    sie domyslil. 7. WORLD MOVE. Ta wersja nie zostanie w portierni. Przez brame przechodzi
    cala Akademia, a portier mowi dzisiaj wszystko, co mu przyjdzie do glowy, i bedzie
    tak jeszcze kilka godzin - wiec do wieczora jest to wersja, ktora chodzi po uczelni:
    ktos bez nazwiska przychodzi wieczorami do Aldhen. Jest to jednoczesnie przykrywka,
    ktora nie ma nic wspolnego ani z ojcem, ani z nekromancja, i publiczne przywiazanie
    Lucana do jednej strony dysputy, ktorej nigdy nie spotkal. 8. NOWY BYT W PLIKACH:
    npc_academy_porter - swiadek stanowiskowy z jednym polrozpoznaniem twarzy (event_turn_interlude_017),
    jednym falszywym przekonaniem (ta tura) i najlepszym w miescie widokiem na to,
    kto do kogo przychodzi. 9. STAN. 15:50 dnia trzeciego, portiernia przy bramie.
    Energia 7.5 z 15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i
    przepustka syndykatu pod plaszczem, Spidey przy zebrach nieodkryty. W ksiedze
    nadal ani slowa. USTALONE: dysputa za ok. 16 dni, kartka wisi od dwoch tygodni
    i byla dwa razy naruszona; Aldhen przychodzi przed swiatlem i sama wpisuje gosci;
    portiernia czyta jej teze jako ''Akademia zamiast ksiezy''; ktos bezimienny pytal
    dwa razy, kiedy ona bywa; portier uwazza, ze Lucan przychodzi do niej wieczorami,
    i mowi to kazdemu.'
  operations:
  - *id002
  new_decision: 'Portier wlasnie sam wymyslil Lucanowi przykrywke i zaraz zaczyna
    ja roznosic. Lucan moze ja zostawic - jest darmowa, nie dotyka ojca ani nekromancji,
    ale do wieczora wiaze go publicznie z Neris Aldhen, ktorej nigdy nie widzial,
    i wchodzi jej do zyciorysu bez jej zgody. Moze ja tez poprawic, tylko kazda poprawka
    to ZDANIE, ktore ten czlowiek dzisiaj powtorzy doslownie. Trzecia droga jest droga:
    zapadnia pamieci (curse_memory_trap, tier 2, jeszcze bez pierwszego przebiegu)
    kosztuje kolejny kontakt i lamie zasade jednej procedury na kontakt z event_turn_interlude_095.
    Co robisz - i czy w ogole wchodzisz przez te brame?'
