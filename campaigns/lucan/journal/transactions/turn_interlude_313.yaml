outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PYTANIE TRAFIA W JEDYNE MIEJSCE, W KTORYM VARKHEN MA WIECEJ NIZ ZWYKLE
    - i to nie jest premia od narratora, tylko realizacja tego, co sam powiedzial
    w t_262: "zeby wiedziec, trzeba przy niej stanac". Stoi. Kontrakt glosu pozwala
    mu mowic dluzej wlasnie o warcie, przysiedze i wspomnieniu, jesli ma co powiedziec
    i rozmowca pyta - wiec odpowiedz jest dluzsza niz jego zwykla, i to jest zgodne
    z kontraktem, a nie wbrew niemu. CO DAJE DOTKNIECIE TRZECIEJ: swiezy punkt odniesienia,
    ktorego nie mial od Aktu 2. Do dzis porownywal wszystko z pamiecia sprzed uszkodzenia;
    teraz ma pod dlonia jedna rzecz zmierzona TERAZ i moze do niej przyrownac reszte.
    To jest jedyny nowy zasob w tej turze. TRZECIA - CIENKA. Jest i trzyma, lecz slabo;
    doprecyzowanie "nie tak, jak trzymala" z t_261 bez podawania miary, bo miary nadal
    nie ma. DRUGA - GLOSNA I BRUDNA, i to jest wlasciwa odpowiedz na pytanie. Czuje
    ja STAD, mimo ze trzecia jest pod jego dlonia. Zgadza sie to z t_261 ("brudna,
    mocniej niz wtedy") i domyka jedno z NIEUSTALONYCH z tamtej tury: odleglosc widocznie
    nie znosi tego, co czuje - druga dochodzi przez pol podziemi. ROZROZNIENIE, KTOREGO
    WCZESNIEJ NIE UMIAL POSTAWIC: to sa DWA ROZNE RODZAJE ZEPSUCIA, nie dwa stopnie
    tego samego. Trzecia jest cienka. Druga jest brudna i coraz glosniejsza. Narrator
    NIE zamienia tego w skale, procent ani zegar (retcon_000015, retcon_000055). PIERWSZA
    - CISZA. Siega po nia i nie ma czego dotknac. Wlasna interpretacja Varkhena, podana
    jako jego zdanie: rzecz pekniata moze juz nie miec czym brzmiec. Zgodne z objectives#seal_one
    (state: broken) i z jego wlasnym meldunkiem z t_259. ZASTRZEZENIE, KTOREGO NIE
    POMIJA NIGDY: byl wtedy caly, a jest tym, czym jest (11,7/65). Czy zmienily sie
    pieczecie, czy on - nie rozdzieli. Powtorzenie t_262, nie nowa teza. NARRATOR
    KLADZIE OBOK SIEBIE I NIE SKLEJA (retcon_000135, retcon_000136): DRUGA PIECZEC
    LEZY POD KAPLICA (objectives#seal_two.location: beneath_chapel). W polnocnym fundamencie
    tej samej kaplicy siedza od t_258 trzy zakotwiczone okazy Lucana, po jednym na
    kazdy z trzech kanalow rytualnych, i pija to, co kanaly dowoza. t_256 mowi WPROST,
    ze narrator NIE zestawil trzech kanalow z trzema pieczeciami i ze zaden plik ich
    nie laczy. Nadal ich nie laczy. Varkhen tym bardziej - jego blind_spot to magia
    po jego czasach, a o cudzych ukladach nie wnioskuje. Fakty leza obok siebie i
    domkniecie ich nalezy do gracza. KOSZT: zero. Rozmowa nie jest magia, a zaden
    skan nie zostal zadeklarowany.'
  prose: 'Varkhen odpowiada nie od razu.


    U niego cisza bywa namysłem i to jest ta cisza. Stoi przy ścianie, przy kręgu,
    którego już

    nie dotyka, i nie rusza się przez dłuższą chwilę — a Lucan zdążył się przez te
    dni nauczyć,

    że wtedy się nie przerywa.


    — Teraz mam czym mierzyć — mówi w końcu. — Przez cztery dni porównywałem wszystko
    z tym,

    co pamiętam. Pamięć jest sprzed. Ta jedna jest z teraz.


    Podnosi rękę do kręgu, kładzie na nim dłoń jeszcze raz, krótko, i opuszcza ją.


    — Ta jest cienka. Trzyma, ale cienko. Tyle o niej umiem powiedzieć.


    Potem odwraca głowę w prawo, w stronę, z której przyszli, i patrzy tam, gdzie
    lampa

    nie sięga.


    — A drugą słyszę stąd.


    Mówi to bez żadnego nacisku, więc Lucan musi sam zrozumieć, co właśnie usłyszał:
    trzecia

    pieczęć jest pod jego dłonią, a druga leży pod kaplicą, przez pół podziemi stąd
    — i mimo

    to jest głośniejsza.


    — Brudna — mówi Varkhen. — Brudna i coraz głośniejsza. To nie jest to samo zepsucie,
    co

    tutaj. Ta jest cienka, tamta jest brudna. Dwie różne rzeczy.


    — A pierwsza?


    Varkhen milczy jeszcze raz, krócej, i to milczenie też jest odpowiedzią, zanim
    padną słowa.


    — Nic. Sięgam i nie ma czego dotknąć.


    Potem dodaje swoje własne zdanie i zaznacza, że jest własne:


    — Tak myślę: rzecz pęknięta może już nie mieć czym brzmieć. Ale to jest moje zdanie.


    Opuszcza rękę i staje prosto, o tyle, o ile sufit mu pozwala.


    — I to samo co wtedy. Byłem wtedy cały, a jestem tym. Czy zmieniły się one, czy
    ja, tego

    nie rozdzielę.


    Lucan stoi z tym chwilę.


    Druga pieczęć leży pod kaplicą.


    Pod tą samą kaplicą, w niszy północnego fundamentu, siedzą od czterech dni trzy
    jego własne

    okazy — po jednym na każdy z trzech kanałów — i piją to, co te kanały przynoszą.


    Nikt tego jeszcze nigdzie nie zapisał obok siebie. Varkhen tym bardziej: on o
    cudzych

    układach nie wnioskuje, a magia po jego czasach jest dla niego hałasem.


    Lucan zapisuje to sobie tak, jak się zapisuje rzeczy, których się jeszcze nie
    rozumie.

    '
