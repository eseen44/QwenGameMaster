  new_decision: 'Przy trzeciej pieczeci, 03:16, dzien szosty. Rezerwa 15/15 - rozmowa
    nic nie kosztuje. CO SIE ZMIENILO W JEGO ZDOLNOSCI ODPOWIADANIA: ma SWIEZY PUNKT
    ODNIESIENIA. Do dzis porownywal wszystko z pamiecia sprzed uszkodzenia; teraz
    ma jedna pieczec dotknieta TERAZ. To realizacja jego wlasnego zdania z t_262:
    zeby wiedziec, trzeba przy niej stanac. TRZECIA: CIENKA. Trzyma, ale cienko. Zadnej
    miary nadal nie podaje. DRUGA: SLYSZY JA STAD - spod kaplicy, przez pol podziemi,
    i mimo to jest GLOSNIEJSZA niz trzecia pod jego dlonia. BRUDNA I CORAZ GLOSNIEJSZA.
    Domyka to jedno z nieustalonych z t_261: odleglosc nie znosi tego, co czuje. ROZROZNIENIE,
    KTOREGO WCZESNIEJ NIE STAWIAL: to sa DWA ROZNE RODZAJE ZEPSUCIA, nie dwa stopnie
    tego samego. Trzecia cienka, druga brudna. PIERWSZA: CISZA. Siega i nie ma czego
    dotknac. Jego wlasne zdanie, oznaczone jako wlasne: rzecz pekniata moze juz nie
    miec czym brzmiec. ZASTRZEZENIE BEZ ZMIAN: byl wtedy caly, jest na 11,7/65, i
    nie rozdzieli, czy zmienily sie pieczecie, czy on. CO LEZY OBOK SIEBIE I NIE ZOSTALO
    SKLEJONE (retcon_000135, retcon_000136, t_256): druga pieczec jest POD KAPLICA
    (objectives#seal_two.location: beneath_chapel). W niszy polnocnego fundamentu
    TEJ SAMEJ kaplicy siedza od t_258 trzy zakotwiczone okazy Lucana, po jednym na
    kazdy z trzech kanalow rytualnych, i pija to, co kanaly dowoza. Zaden plik tych
    dwoch rzeczy nie laczy i narrator ich nie laczy. Varkhen tym bardziej - o cudzych
    ukladach nie wnioskuje. ZADNEGO ZEGARA Z TEGO NIE POWSTALO. "Coraz glosniejsza"
    jest jego odczuciem porownanym z wlasna pamiecia, nie terminem i nie odliczaniem.
    OTWARTE: czy Lucan robi Geo przy tej pieczeci albo przy bramie, czy dopytuje Varkhena
    o druga, czy odsyla okazy z niszy pod kaplica, czy probuje bramy, czy wraca na
    gore. Lampa pali sie od okolo 40 minut z trzech, ktore dala jej Mara.'
