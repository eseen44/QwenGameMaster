  prose: 'Lucan spojrzal w okno, gdzie sierpniowe slonce stalo jeszcze wysoko nad
    dachami, i stwierdzil, ze troche za wczesnie na prowadzanie kawalera po miescie.
    Varkhen przyjal to bez slowa skargi - czterysta lat czekal na cos, czego nikt
    mu nie zapisal, wiec kilka godzin nie jest dla niego terminem. Potem Lucan odwrocil
    sie do biurka i przyjal oferte: niech powie, co widziala. Seraphine nie robila
    z tego ceremonii. Zapytala tylko, czy on chce wiedziec, co ona widzi, czy raczej,
    czego nie widzi - bo to sa dwie rozne lekcje i tylko jedna z nich jest przyjemna.
    A potem powiedziala obie.'
  summary: "Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii.\n\
    DWIE DEKLARACJE: wyjscie przesuniete na noc (wlasny plan gracza z t_230) oraz\n\
    PRZYJECIE OFERTY SERAPHINE z t_235. Oferta przestaje wisiec, zaczyna sie\nekspozycja\
    \ o aparacie percepcji antymagiczki.\n\n1. WYJSCIE ODWOLANE NA TERAZ, PRZESUNIETE\
    \ NA NOC. To jest deklaracja gracza,\nnie opor narratora - fact_varkhen_transport_plan_night_street\
    \ mowil NOCA od t_230,\na zegar po commicie stoi na wieczorze dnia czwartego.\
    \ Narrator NIE tworzy godziny\npolicyjnej, nocnego straznika ani zdarzenia na\
    \ ulicy (retcon_000055, retcon_000033).\nNikt nie wyszedl z gabinetu; wszyscy\
    \ trzej sa tam, gdzie byli.\n\n2. VARKHEN - JEDNO ZDANIE, ZE SLOWNIKA PRZYSIEGI,\
    \ I NIC PONADTO.\nZapytany wczesniej \"idziemy\" wstal (t_235); teraz uslyszal\
    \ \"jeszcze nie\" i przyjal\nto. Podstawa: fact_varkhen_heard_the_oral_only_plan\
    \ - \"czterysta lat stal na slowie,\nktorego nikt nie zapisal\". NARRATOR NIE\
    \ DOPISUJE mu zniecierpliwienia, ulgi, opinii\no zwloce ani planu na te godziny\
    \ (retcon_000142, fact_varkhen_stated_what_he_wants:\n\"co potem\" zostaje puste).\
    \ Plaszcz ma na sobie od t_234.\n\n3. CO ONA MOWI I SKAD TO MA. Cala ekspozycja\
    \ jest jej wlasnym rzemioslem plus\nkanonem swiata; ani jedno zdanie nie jest\
    \ uzasadnieniem narratora podanym jako\nwiedza postaci (retcon_000136).\n  a)\
    \ CO ZAREJESTROWALA W t_038 - byla przy tym\n     (fact_seraphine_watched_lucan_curse_a_guild_employee).\
    \ Zarejestrowala AKT\n     RZUCANIA z czterech krokow, nie osobe i nie kategorie.\
    \ Uwage zwrocilo\n     WZMOCNIENIE, nie tresc: brutalne skalowanie nigdy nie jest\
    \ subtelne\n     (metamagic#konsekwencje, curses#eskalacja-mocy). Znik rzucony\
    \ normalnie,\n     cantripem za 0,1, bylby jednym z kilkudziesieciu czarow w tym\
    \ budynku tego\n     wieczora.\n  b) CZEGO NIE MA NASTEPNEGO DNIA - magic-practice#curses_and_magical_traces\n\
    \     i system/magic.md#slad: slad istnieje w chwili rzucania, po kilku minutach\n\
    \     zostaje najwyzej kategoria zdarzenia, nigdy autor. Na drzwiach nocnego\n\
    \     urzednika nie ma niczego.\n  c) JEJ WLASCIWA MOC TO SIGILE, NIE SKANER (portrayal.power_register\
    \ punkt 3).\n     Stawia je Z GORY, obejmuja OBSZAR, dzialaja CIAGLE i bez jej\
    \ uwagi. Przewaga\n     jest najwieksza tam, gdzie zdazyla sie ustawic. Poza tym\
    \ jest kobieta\n     z rapierem, ktora ma dobre oczy.\n  d) ZERO DARMOWYCH REAKCJI\
    \ (portrayal.power_register punkt 4) - zgaszenie cudzego\n     czaru kosztuje\
    \ ja akcje jak kazde inne dzialanie. Powiedziala to sama,\n     bo jest to ograniczenie,\
    \ ktore Lucan i tak wylapie przy pierwszym starciu.\n\n4. GRANICA POSTAWIONA WPROST\
    \ NA ZADANIE GRACZA (2026-09-07): NIE MA CZEGOS TAKIEGO\nJAK STALE WYKRYWANIE\
    \ NEKROMANTY. Gdyby bylo, nekromanci by wyginęli. Kontrolerka\nrejestruje ZDARZENIE\
    \ W ZASIEGU I W CHWILI - nie stan, nie nature, nie zawartosc\nrezerwy. Zaden plik\
    \ nie daje jej wykrywania osoby, a pc-lucan#retired_conditions\n(elevated_energy_signature_above_old_threshold,\
    \ uchylone przez retcon_000019)\nwprost mowi, ze detekowalnosc jest funkcja tego,\
    \ CO LUCAN ROBI, a nie tego,\nile ma w rezerwie. To zdanie zostaje w kanonie jako\
    \ doprecyzowanie, nie nowa regula.\nZgodne tez z concealment-materials#detection_model:\
    \ wykrywalnosc to SCHODY i klasy\nobserwatora, a nie jedna krzywa - stopien 2\
    \ (ktos magicznie pismienny, ktory SZUKA)\npokonuje sie KONSTRUKCJA, brakiem czynnego\
    \ kanalu.\n\n5. CZEGO NARRATOR TU NIE ZROBIL. Nie podal zasiegu jej rejestracji\
    \ w metrach\n(zaden plik go nie ma; kanon ma tylko 18 m dla kontrzaklecia i \"\
    cztery kroki\"\nz t_038). Nie zrobil z niej wyroczni (portrayal.she_is_not_an_oracle).\
    \ Nie wycenil\noferty drugi raz - cene nazwala raz, w t_235, i retcon_000135 punkt\
    \ a zabrania\npowtorki. Nie powtorzyl jej pytania o nazwisko urzednika - pyta\
    \ raz i czeka\n(speech_traits). Nie przeprowadzil demonstracji na zywo: gracz\
    \ poprosil\no ODPOWIEDZ, nie o protokol z rzucaniem, a Lucan nie wydal ani jednej\
    \ jednostki.\nNie dopisal Lucanowi nowej zdolnosci ani nie zmienil player/abilities.yaml\n\
    (retcon_000120). Nie ruszyl zadnego zegara reka.\n\n6. STAN. Czwarty dzien interludium,\
    \ gabinet Seraphine, gorne pietro gildii.\nObecni: Lucan, npc_seraphine_vale,\
    \ npc_varkhen_mind (stoi, plaszcz na zbroi).\nSpidey i Tkaczka przy Lucanie, zuk\
    \ w kieszeni. Na biurku sygnet z jeleniem;\nkarta kontraktowa w szufladzie, ZAKRES\
    \ i DATA puste. Lucan 19/19, energia bez\nwydatku - czytac z pliku. Wyjscie pod\
    \ trzecia pieczec przesuniete na noc.\nPytanie Seraphine o nazwisko urzednika\
    \ NADAL OTWARTE.\n"
  new_decision: 'Wieczor jest jeszcze wczesny, a Seraphine wlasnie oddala Lucanowi
    rysunek wlasnej slepoty: rejestruje akt, nie osobe, i tylko tam, gdzie zdazyla
    sie ustawic. Lucan ma teraz kilka godzin do ciemnosci, kontrolerke rangi A, ktora
    odpowiada na pytania o wlasne rzemioslo, i trzy rzeczy lezace obok siebie na wyciagniecie
    reki: jej sigile, wlasna siec, ktorej ona do konca nie rozumie, i pytanie o nazwisko
    urzednika, ktore ona zadala raz i na ktore czeka. Co Lucan robi z tym wieczorem?'
