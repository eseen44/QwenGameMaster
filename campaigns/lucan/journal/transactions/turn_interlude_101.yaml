outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - wspolpracujacy towarzysze, rozmowa w kompetencji obu stron,
    zero energii. Osiemdziesiat minut: marsz i spotkanie w zapleczu targu (zone_market_back_alleys),
    w poludniowym halasie, gdzie nikt nikogo nie slyszy, bo wszyscy krzycza. 1. AGENDA
    LUCANA PRZESZLA CALA I W JEGO KOLEJNOSCI. Trzy punkty, wszystkie postawione: pieniadze,
    prawnik, trening. Corth i odpis kanalow Ruska NIE padly - swiadoma decyzja gracza,
    uzasadniona i wykonana czysto. Nic z tego nie wyszlo przypadkiem. 2. BOROS PRZEZ
    DWA DNI NIE SIEDZIAL NA ZLOCIE - PRZELICZYL JE. Szescdziesiat kilo dzieli sie
    na dwie kategorie, ktorych Lucan nie rozdzielil, a ktore rozstrzygaja cala sprawe.
    DWIE TRZECIE JEST ANONIMOWE: kruszec luzem, moneta, wylamane oprawy, drut, blacha
    trumienna. Nie ma na tym nic, co cokolwiek mowi. JEDNA TRZECIA JEST DOKUMENTEM:
    pierscienie zaloby z nazwiskiem i data rytymi po wewnetrznej stronie, medaliony
    mortualne ze znakami rodow, kilka sztuk z robota konsekracyjna. Ryty pierscien
    zaloby nie jest zlotem o wadze - jest zapisem, kto umarl i kiedy, a takich zapisow
    sa duplikaty po stronie parafii i rodu. Wartosc tej trzeciej jest wielokrotnie
    wyzsza wlasnie dlatego, ze jest robota, i dokladnie dlatego jest nie do sprzedania
    nikomu, kto nie wywiezie jej z miasta. 3. DWIE DROGI, KAZDA PELNA I KAZDA Z INNA
    CENA - TO JEST TRESC TEJ TURY. DROGA BOROSA (przetop): zlotnik z piecem w zapleczu,
    uzywany przez niego wczesniej, bierze anonimowe dwie trzecie NA WAGE i przetapia
    tej samej nocy. Bez rejestru, bez wjazdu, bez trasy, bez nowego czlowieka, ktory
    zapamietuje nazwiska. Cena: okolo jednej trzeciej wartosci obrobkowej, ryta trzecia
    zostaje w worku na nieokreslony czas, i zaden prawnik z tego nie wychodzi. DROGA
    MARY (obieg): istnieje operacja, ktora wchlonie calosc, ryta trzecia wlacznie,
    i wyprowadzi ja z Lumarii kanalami nietykajacymi zapory ani cennika. Placi realna
    liczbe. Cena jest potrojna i Mara wylozyla ja bez owijania: (a) beda WIEDZIELI
    dokladnie, co przyszlo i skad, bo inaczej tego nie kupuja; (b) prowadza zapis,
    bo zapis jest ich ubezpieczeniem, nie zaniedbaniem; (c) wejscie idzie przez ICH
    prawnika - i to jest dokladnie ten prawnik z obiegu przestepczego, o ktorego Lucan
    prosil. Jeden czlowiek, dwa problemy, jedna transakcja. 4. I TU JEST HACZYK, KTORY
    NIE JEST HACZYKIEM MARY. Ten prawnik ma stalego klienta i to nie jest Lucan. Lucan
    wchodzi jako klient przyprowadzony przez strone, ktora go sprawdzila, do czlowieka,
    ktorego pierwsza lojalnosc jest gdzie indziej. Zgodne z uwaga Seraphine (lead_two_contradictory_defences):
    prawnik z ulicy zna urzednikow magistratu, a nie Akademie, wiec obsluguje obrone
    KARNA, nie klasyfikacyjna - a Lucan nie wybral jeszcze ktora jest glowna. 5. BOROS
    MA WLASNY INTERES I POWIEDZIAL GO WPROST. Trzyma szescdziesiat kilo grobowego
    towaru pod podloga jako czlonek gildii rangi C, w tygodniu, w ktorym magistrat
    porzadkuje akta. Nie odmawia, nie grozi, nie podnosi ceny - mowi, ze chce, zeby
    to ruszylo albo lezalo gdzie indziej, i ze woli usłyszec termin niz zapewnienie.
    Relikwiarz pozostaje wylaczony ze sprzedazy i jest u Lucana; nikt nie proponowal
    inaczej. 6. MARA ZGODZILA SIE NA TRENING I ZROBILA TO POWAZNIEJ, NIZ LUCAN PROSIL.
    Nie obiecuje sily - mowi wprost, ze dwa tygodnie nie robia nikogo silnym, i wymienia
    to, co dwa tygodnie daja: oddech, zeby nie byc skonczonym po dziesieciu sekundach;
    upadanie bez lamania sie; i wychodzenie z linii, czyli nieobecnosc tam, gdzie
    pada pierwszy cios. Jej wlasna obserwacja z garbarni i z komory Varkhena, podana
    bez ogrodek: Lucana nikt nigdy nie przegral w walce - jego problem jest ten, ze
    wszystko, co robi, wymaga stania w miejscu i uwagi. Trening ma wiec kupowac SEKUNDY,
    nie wygrywac wymiany. Warunek: godzina dziennie, rano, przez wiekszosc dni, inaczej
    to jest dekoracja. 7. CENY TRENINGU, KTOREJ MARA NIE WYMIENILA. Godzina dziennie
    z bliska przez dwa tygodnie z osoba, ktora widziala Varkhena slabnacego pod dotykiem
    Lucana i trzyma dwa podejrzenia o sredniej pewnosci (kontrola nad Varkhenem, zdalne
    wsparcie nekromantyczne). Zobaczy, ile Lucan spi, jak oddycha po wysilku i co
    nosi pod plaszczem. To pierwsza rzecz, o ktora Lucan poprosil ja OSOBIscie, i
    pierwsza, przy ktorej sam nazwal wlasna slabosc na glos. Jednoczesnie trzynascie
    dni jest juz obsadzone: wabiki, jedna kanoniczna wersja opowiesci, prawnik, zbyt
    zlota i trzy pieczecie. 8. WORLD MOVE - LUCAN POSTANOWIL, ZE CORTH NIE JEST ICH
    SPRAWA, A CORTH POSTANOWIL INACZEJ, DWA DNI WCZESNIEJ. Na koniec, bez ciezaru,
    Mara wspomina, ze dostala pismo od urzednika akt: prosba o potwierdzenie dat,
    w ktorych byla w garbarni, i kto z nia byl. Bez zarzutu, bez teorii sprawy, sama
    rubryka - dokladnie metoda Malena Cortha, ktorego nazwiska Mara nie wymienia,
    bo pismo jest nudne. Dodaje, ze Rusk dostaje takie od tygodni i wszyscy o tym
    wiedza. Zamierza odpowiedziec, bo nieodpowiedzenie urzednikowi akt jest sposobem
    na stanie sie interesujacym. I pyta Lucana lagodnie, czy jest wersja tych dat,
    ktora by mu bardziej pasowala. 9. CO TO ZNACZY MECHANICZNIE. Lucan wlasnie dowiedzial
    sie, ze jego decyzja o zatrzymaniu Cortha dla siebie ma termin waznosci liczony
    w dniach, nie tygodniach, oraz ze ma proponowana wspolprace swiadka, o ktora nie
    prosil. Przyjecie jej daje spojnosc zeznan i wymaga wtajemniczenia Mary; odrzucenie
    zostawia ja przy prawdzie, ktorej Lucan nie zna w jej wersji. Zasada z magazynu
    obrony: JEDNA wersja opowiesci na wszystkie fora, rozjazd zabija szybciej niz
    tresc. 10. STAN. 13:00 dnia trzeciego. Energia 8 z 15, integralnosc 19 z 19, bez
    warunkow. Zloto nadal u Borosa, ani jedna sztuka nie sprzedana, kupiec nie wybrany.
    Prawnik dostepny wylacznie razem z droga Mary. Trening uzgodniony, nie rozpoczety
    - pierwsza sesja rano dnia czwartego. Corth ma pismo w obiegu i nazwiska w rubryce.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position
    value:
      location_id: loc_lumaria_market
      zone_id: zone_market_back_alleys
      formation: sitting_with_boros_and_mara_spidey_under_the_coat_and_spy_beetle_01_in_the_pocket
