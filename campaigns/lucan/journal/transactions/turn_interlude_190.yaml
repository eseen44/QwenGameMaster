  - *id002
  summary: 'Bez testu - osiem minut, zero energii. NAJWAZNIEJSZA TURA TEJ SCENY: Lucan
    pierwszy raz

    mowi na glos, jaka jest jego linia, i oddaje material, ktory zmienia pozycje Seraphine

    wobec Strazy na dwadziescia minut przed jej wejsciem do tamtego pokoju.


    1. RIPOSTA TRAFIA I ONA JA PRZYJMUJE - CZESCIOWO. "Skautowanie" zostaje zdefiniowane

    nie jako moralnosc, tylko jako NIESPOJNOSC: trzyma czterystuletniego nieumarlego
    pod

    podloga i martwi sie rodzina jednego straznika. Sprzecznosc jest realna i ona
    to widzi.

    Jej wlasny powod jest jednak operacyjny, nie sumieniowy, i tez stoi w plikach

    (fact_seraphine_refuses_authorisation_but_names_the_line, t_126): rodziny GADAJA.
    Zona

    straznika pamieta dzien, w ktorym ktos przyszedl, i pamieta go za rok. Varkhen
    w piwnicy

    nie opowie o sobie nikomu, bo nie ma komu. To nie jest to samo ryzyko i nie wolno
    grac

    jej oburzenia zamiast tego rachunku (karta, do_not_play).


    2. LINIA LUCANA ZOSTAJE POWIEDZIANA NA GLOS - PIERWSZY RAZ, KOMUKOLWIEK.

    act-03-defence.yaml#lucans_declared_line_2026_09_01 zmienia status z

    DECLARED_BY_PLAYER_NOT_YET_SAID_ALOUD_TO_ANYONE na powiedziane Seraphine w t_190.

    Tresc: zadnej obrony, bo nie ma paragrafu; zadnego milczenia; ratowanie miasta
    niezaleznie

    od jego woli; metoda to szantaz i systematyczne wkurwianie wszystkich grup interesow.

    To retrospektywnie tlumaczy jej wlasna uwage z t_122, ze na liscie siedmiu pozycji
    ANI

    JEDNA nie jest obrona - nie byl to brak, byl to caly plan, a ona zobaczyla go
    pierwsza

    i zle odczytala jako lekkomyslnosc.


    3. BRULION BALWIERZA ZMIENIA WLASCICIELA. Zawartosc byla w pliku od t_083: "kto,
    kiedy,

    co zszyte, ile zaplacono - lata cichego latania ludzi bez zglaszania ran", wartosc:

    "spis cichej przemocy w dzielnicy, z nazwiskami albo przezwiskami, datami i kwotami".

    DEKLARACJA GRACZA POSZERZA TO I LADUJE W CALOSCI (retcon_000033): to terminarz,
    faktury

    i notatki o klientach czlowieka, ktory przez DZIESIEC LAT obslugiwal SYNDYKAT
    I STRAZ

    NARAZ. Spojne z istniejacym opisem, nie sprzeczne.

    Framing Lucana jest wlasciwa trescia daru i ona go przyjmuje: to nie jest material
    na

    sledztwo, bo sledztwa nikt nie ma czasu prowadzic. To jest material do HANDLU
    I SZANTAZU.

    Recepta podana wprost: przy prawdziwych klopotach zaczac wspominac balwierza.


    4. POCHODZENIE JEST CZYSTE I TO NIE JEST WERSJA - TO STOI W PLIKU. inventory.yaml
    mowi

    o brulionie: "Rodzina sprzedala pokoj na wage i nikt tego nie schowal". Lucan
    kupil rzeczy

    po zmarlym. Kradziez w tym watku dotyczy CZEGO INNEGO - to BALWIERZ ukradl akademicki
    tom

    z sygnatura (item_library_marked_volume#provenance). Zdanie "to nie ja go zabilem"
    jest

    wiec PRAWDZIWE i narrator nie zapisuje go jako cover story (odwrotnie niz w retcon_000120).


    5. CO ONA Z TYM ROBI - PRZYJMUJE, ALE NIE BIERZE DO POKOJU. Priorytety z karty
    w

    kolejnosci: utrzymac pozycje, nie dac sie rozlupac na Varkhenie, pieczecie i miasto,
    Lucan

    jako aktyw. Material trafia w priorytet PIERWSZY i robi to na dwadziescia minut
    przed

    spotkaniem, na ktore szla bez niczego. Nie bierze papieru ze soba - bierze WIEDZE,
    ze

    papier istnieje i gdzie lezy. Sama nazwala w t_126 doktryne, ktora tu obowiazuje:
    liczy

    sie, ilu ludzi moglo to miec.

    I STAD JEJ JEDYNE REALNE ZASTRZEZENIE, ktore NIE jest oporem narratora, tylko
    jej

    wlasnym rachunkiem z pliku: rodzina sprzedala pokoj NA WAGE. Nikt nie wie, kto
    jeszcze

    kupil kartki z tego samego pokoju. Oraz: wspomnienie balwierza dziala, ale jednoczesnie

    informuje tamtych, ze papier istnieje i ze ktos go ma.


    6. CZEGO NARRATOR NIE ROBI. Nie wypisuje ani jednego nazwiska z brulionu ani jednej

    sytuacji z niego - zawartosc wypelnia deklaracja gracza w momencie uzycia (retcon_000058).

    Nie stawia terminu, nie robi zegara ze spotkania ze Straza, nie zapowiada, ze
    cos pojdzie

    zle, i nie orzeka, kto jeszcze kupil kartki.


    7. STAN. Czwarty dzien interludium, 11:41, gabinet Seraphine. Energia 10,35/15,

    integralnosc 19/19, bez warunkow. Brulion balwierza u Seraphine. Atlasy anatomiczne

    i tom z sygnatura nadal u Lucana. Zegary bez ruchu poza uplywem czasu. Zaden termin

    nie powstal.'
  new_decision: 'Seraphine ma brulion i ma trzydziesci sekund, zeby zdecydowac, jak
    z nim wejdzie do Strazy. Powiedziala jedno zastrzezenie: rodzina sprzedawala pokoj
    NA WAGE, wiec nie wiadomo, kto jeszcze ma kartki z tego samego stosu. Lucan odpowiada
    na to zastrzezenie, mowi jej wreszcie kolejnosc trzech dzwigni, o ktora prosila,
    czy wychodzi na targ po introligatora i zostawia ja z tym?'
