    Potem odpowiada na jej pytanie z t_122, dlaczego przynosi dzwignie zamiast obrony:
    nie zamierza sie bronic, bo jest praworzadnym obywatelem i nie ma paragrafu, z
    ktorego da sie go postawic przed sadem - ale nie zamierza milczec. Zamierza uratowac
    to miasto niezaleznie od tego, czy ono ma na to ochote, wiec beda szantazowac
    i wkurwiac wszystkie istniejace grupy interesow. I klad,ie na stole brulion balwierza:
    terminarz, faktury i notatki o klientach czlowieka, ktory przez dziesiec lat obslugiwal
    syndykat I straz naraz. Nazywa, czym to jest - nie materialem na sledztwo, na
    ktore nie maja czasu, tylko materialem do handlu i szantazu; radzi, zeby przy
    prawdziwych klopotach zaczela po prostu wspominac balwierza. Na koniec dodaje,
    ze to nie byl mily czlowiek, ale to nie on go zabil - kupil rzeczy po zmarlym.'
  actor_id: pc_lucan
