  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Piec minut, zero energii. Uniki nie ma; jest przeramowanie,
    ktore w jezyku nauki jest LEPSZE od pytania, ktore zastapilo, i ktore dlatego
    przechodzi bez oporu.

    1. UNIK, KTORY NIE JEST UNIKIEM. "Dla kogo" to specyfikacja przeciwnika; "wykrywalnosc
    jako funkcja kosztu" to charakterystyka odpowiedzi w calym zakresie. Drugie zawiera
    pierwsze i nie wymaga nazywania nikogo. Ojciec nie tylko to przyjmuje - uznaje
    za poprawke metodologiczna i sam mowi, ze zle postawil pytanie. Nie ustepuje synowi;
    ustepuje lepszej robocie. To jedyny rodzaj argumentu, ktory u niego dziala (attitude_to_pc.likely_hook,
    portrayal: brak kalibracji spolecznej, pelna kalibracja na problem).

    2. I DLATEGO NIE PYTA JUZ NIGDY W TEJ ROZMOWIE, DLA KOGO. Pytanie zostalo skonsumowane,
    nie zbyte. Nie wroci, dopoki ktos inny mu go nie zada.

    3. NOWA SPECYFIKACJA PODANA NA GLOS PRZEZ LUCANA: male i zbywalne obiekty, optimum
    materialowe przy produkcji masowej, bez ekstrawagancji, "na razie". Dla ojca jest
    to zawezenie problemu i podnieta - przechodzi natychmiast na material i serie.
    Dla Neris jest to trzecia informacja z rzedu tego samego rodzaju i pierwsza, ktorej
    Lucan jej nie wybieral.

    4. WORLD MOVE A - OJCIEC ODDAJE COS, CZEGO LUCAN NIE PROSIL. Ma dostep do zbiorow
    i do stalych dostaw Akademii (potwierdzone t_018) i traktuje serie porownawcza
    jako oczywisty nastepny krok. Nie jest to zobowiazanie ani umowa - jest to czlowiek,
    ktory zaczal planowac eksperyment i przy okazji planuje cudzy dostep do materialu.

    5. WORLD MOVE B - ODBITKA WRACA DO GRY JAKO MAKULATURA, NIE JAKO CEL. Potrzebuje
    czystej powierzchni do narysowania krzywej, siega po najblizszy papier - czyli
    po odbitki spod wlasnego lokcia - i obraca jedna GRZBIETEM DO GORY, zeby rysowac
    na pustej stronie. Nazwiska nadal nie przeczytal. Trzyma je w rece.

    6. WORLD MOVE C - PIERWSZY RAZ ZWRACA SIE DO NERIS. Nie dlatego, ze ja zauwazyl
    jako osobe, tylko dlatego, ze potrzebuje DRUGIEJ kartki. Kobieta przy drzwiach
    zostaje zagadnieta wprost, a instruktaz Lucana (nie przedstawiac sie, nie wchodzic
    w dyskusje) wlasnie zderzyl sie z bezposrednim pytaniem gospodarza. Ona nie ma
    juz czym zaslonic sie od odpowiedzi - odbitki oddala.

    7. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    oraz kim jest kobieta przy drzwiach - mimo ze wlasnie sie do niej odezwal i trzyma
    w rece jej tekst.

    8. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra. Energia bez zmian,
    integralnosc 19 z 19, bez warunkow. USTALONE: przeramowanie przyjete i pytanie
    "dla kogo" zamkniete na czas tej rozmowy; specyfikacja masowej produkcji padla
    przy swiadku; ojciec siega po serie porownawcza z materialu Akademii; odbitki
    w jego rece, nazwisko nieprzeczytane; ojciec odezwal sie bezposrednio do Neris.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: in_his_fathers_laboratory_reframe_accepted_and_the_for_whom_question_closed_mass_production_spec_stated_in_front_of_neris_father_sketching_a_cost_curve_on_the_blank_back_of_one_offprint_and_addressing_neris_directly_for_the_second_sheet
  - op: advance_time
    seconds: 300
  - *id002
