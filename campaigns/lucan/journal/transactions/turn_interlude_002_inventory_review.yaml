    dokument przewozowy (roll_turn_interlude_002_pouch_seal: natural 65 vs difficulty
    50, sukces). Piecziec i nazwa urzedu - Straz Miejska i Sluzby Reagowania Lumarii
    - sa czytelne, tresc w wiekszosci odczytywalna: to formalna przepustka/autoryzacja
    trasy dla wozu do przewozu zwlok. Podpis urzednika i dokladna data sa zamazane
    wilgocia.'
