  - *id002
  new_decision: 'Straz Miejska formalnie autoryzowala trase tego wozu do przewozu
    zwlok - a Straz aktywnie szuka odpowiedzialnego za zniknniete cialla. Co Lucan
    robi z ta przepustka: zachowuje ja jako dowod/kartem przetargowa, próbuje ustalic
    kto ja podpisal, czy chowa ja glebiej i udaje ze jej nie widzial?'
