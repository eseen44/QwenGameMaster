outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, brak oporu mechanicznego, cel bez wlasnej obrony
    nie tworzy testu (system/tests.md). Piec minut, zero energii. 1. TEZA LUCANA JEST
    W KANONIE PRAWDZIWA I TO JEST NAJWAZNIEJSZA RZECZ TEJ TURY. Nie jest blefem ani
    retoryka. Lancuch stoi w plikach: (a) Akademia broni szerokiej definicji KONSTRUKTU,
    bo zbyt szeroka definicja NEKROMANCJI zagrazalaby golemom, homunkulusom, protezom
    i chowancom (necromancy-law.yaml#construct_boundary.institutional_interest); (b)
    jesli hybryda wpada do kategorii konstruktu, spor przestaje byc sprawa karna i
    staje sie sprawa akademicka, czyli szara strefa; (c) szara strefa nie legalizuje
    sie proklamacja - PRZESTAJE SIE ROZPATRYWAC SKARGI, bez ogloszenia, bez licencji,
    bez rejestru (de_facto_liberalisation_mechanism, kanon gracza); (d) Kosciol doktrynalnie
    NIE UZNAJE szarej strefy zwierzecej i na wiarygodny dowod odpowiada zadaniem stlumienia
    (church_position); (e) wiec zanik sciezki formalnej nie usuwa srodka zaradczego,
    tylko ZMIENIA MU RECE Z PAPIERU NA LUDZI. Precedens jest w plikach i jest osobisty
    dla Lucana, choc ona o tym nie wie: ojca potepiono dwa razy, a potem ktos przyszedl
    do laboratorium osobiscie. 2. I DLATEGO "Z INNYCH POWODOW, NIZ MYSLISZ" JEST DOSLOWNE.
    Ona sadzi, ze spiera sie o granice kategorii naukowej. Spiera sie o to, KTO TRZYMA
    FORUM - a brak definicji jest oslona tego, kto forum trzyma, nie oskarzonego.
    Jej mowa nie rozstrzyga, czym te rzeczy sa. Rozstrzyga, ktora instytucja o nich
    orzeka, i wypycha z tej rozmowy te, ktora przestanie sie pytac. 3. ONA SLYSZY
    PIERWSZE SLOWO, NIE OSTRZEZENIE, I TO JEST JEJ LUDZKI BLAD. Z calego zdania dziala
    na nia "WYGRASZ". Szesnascie dni przed dysputa, w polowie trzeciej czesci mowy,
    w pokoju bez portierni - obcy mowi jej, ze wygra. Pyta o to pierwsza, zanim zapyta
    o cene, i sama slyszy, jak to zabrzmialo. 4. POTEM DOSTAJE CIOS W FUNDAMENT I
    NIE PRZYJMUJE GO SPOKOJNIE (retcon_000039). Nie przelicza planu, nie sortuje jego
    listy na kolumny. Broni sie kompetencja: chce wiedziec, skad czlowiek, ktory wszedl
    tu bez wpisu, zna wynik dysputy, ktorej nie widzial, i przebieg trzeciej czesci
    mowy, ktorej nikt jeszcze nie slyszal. 5. I DLATEGO NAZWISKO WRACA. W turze 131
    zapytala i odpuscila, bo okaz byl wazniejszy (scene#pressures). Teraz teza dotyczy
    JEJ - jej dysputy, jej pozycji, jej kariery po wygranej - i pytanie o nazwisko
    przestaje byc uprzejmoscia. Nie przyjmie wykladu o wlasnej przyszlosci od kogos
    bez nazwiska. To jej wlasny priorytet, nie opor narratora. 6. WERSJE PRZYJMUJE
    DLUGA I SAMA NAZYWA CENE, KTORA MA. Nie odsyla go i nie targuje sie o minuty tak,
    jak targowala sie w progu - odklada mowe. Ale stawia warunek i stawia go wprost:
    dluga wersja za nazwisko. Jesli ma sluchac czlowieka, ktory twierdzi, ze wie,
    jak skoncza sie jej szesnascie dni, chce wiedziec, kto to mowi. 7. CZEGO ONA NADAL
    NIE WIE. Nie zna nazwiska, nie zna sieci, nie zna Varkhena, nie slyszala slowa
    vitae, nie wie o profesorze Veyrze ze skrzydla laboratoryjnego ani o tym, ze ktos
    od dwoch dni opowiada o tym okazie trzydziesci krokow stad. Zadna z tych rzeczy
    nie padla w tej turze. 8. I PULAPKA, KTOREJ LUCAN NIE MOZE NIE ZAUWAZYC. Podanie
    nazwiska Veyr osobie, ktora za szesnascie dni stanie na otwartej dyspucie, jest
    tym samym ruchem co ujawnienie sie Akademii - a nazwisko idzie dalej niz okaz.
    Nazwisko zamienia sprawe dyscyplinarna i karna w spor o jurysdykcje, w ktorym
    Lucan przestaje byc oskarzonym i staje sie STAWKA (institutional_defence#noble_name_disclosure).
    Dodatkowo jego ojciec pracuje trzydziesci krokow stad i to samo nazwisko nosi.
    9. STAN. 16:43 dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie, Spidey na
    parapecie przeciwnego okna. Energia 10.65 z 15, integralnosc 19 z 19, bez warunkow.
    4 000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: teza Lucana
    o dyspucie jest kanonicznie prawdziwa i wynika z czterech plikow; ona przyjmuje
    dluga wersje, ale za nazwisko; odlozyla mowe na dzis; pytanie o to, kto jeszcze
    widzial okaz, zostalo przez nia PORZUCONE na rzecz wazniejszego.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: on_the_daybed_in_neris_aldhens_rooms_she_has_accepted_the_long_version_on_condition_he_gives_his_name
