    czy podaje Veyr osobie, ktora za szesnascie dni stanie na otwartej dyspucie i
    pracuje trzydziesci krokow od jego ojca - czy daje jej cos innego zamiast nazwiska,
    wiedzac, ze wykladu o wlasnej przyszlosci od bezimiennego nie przyjmie.'
