  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Dwie minuty, zero energii. Interludium buduje gracz
    (retcon_000033): trzy nowe fakty swiata podane przez gracza LADUJA jak zadeklarowane,
    bo zaden plik im nie przeczy, a trzy je podpieraja.

    1. NOWY KANON - KTO ZARABIA NA ZAMIESZKACH. Nie "Kosciol" i nie "Akademia" jako
    calosci, tylko KONKRETNE FRAKCJE w obu, plus trzecia strona dotad nieliczona:
    STRAZ MIEJSKA. Straz probuje wlasnie zakryc afere z handlem zwlokami na cmentarzu.
    Spojnosc z plikami jest mocna i wczesniejsza niz ta tura: npc_hesk_dorn sam zauwazyl,
    ze pytania o "mieso, ktore sie nie psuje" URWALY SIE miesiac temu i nie wrocily
    (event_turn_interlude_083), a jego falszywe przekonanie mowi, ze pytali rzeznicy
    - w karcie stoi wprost, ze pytali ludzie handlu zwlokami. Cichy handel to handel
    osloniety, nie handel zakonczony. Do tego idzie lancuch autoryzacji polnocno-zachodniej
    zapory, ktory Seraphine ma rozplatac, i porzadkowanie akt w magistracie. Zamieszki
    kasuja sledztwo skuteczniej niz jakakolwiek lapowka.

    2. NOWY KANON - CENA KOLMA MA NAZWE I JEST TO REKTORAT. Zamyka to otwarte pole
    z jego karty (known_to_kolm: nierozstrzygniete). Kolm WIE, ze ma przegrac, i wie,
    po co. Rozumowanie gracza jest w jezyku instytucji akademickiej i nie wymaga zadnej
    nowej mechaniki: kto niszczy wlasny temat, nie zamierza juz o nim publikowac,
    wiec jego przyszlosc nie lezy w dorobku, tylko w administracji. Po zatrzymaniu
    wojenki wladze beda otwarte na zastapienie rektora "ktory do tego doprowadzil"
    - i wtedy potrzebny jest kandydat proreligijny i konserwatywny, ktory publicznie
    stal po stronie waskiej definicji. Rektor Akademii Magii Lumarii wchodzi tym samym
    do kanonu jako urzad obsadzony i zagrozony; wczesniej nie istnial w zadnym pliku.

    3. I DLATEGO WNIOSEK OPERACYJNY JEST WAZNIEJSZY OD SAMEJ DIAGNOZY. Jesli Kolm
    jest oplacony wynikiem, a nie argumentem, to interesuje go nie przegrana, tylko
    przegrana ODPOWIEDNIO GLOSNA. Wygrana moderowana nie dostarcza zamieszek, wiec
    w chwili, w ktorej Kolm zauwazy, ze Neris nie jest tak krwiozercza, jak miala
    byc, jego wlasny interes kaze mu podlozyc sie SAMEMU i zrobic to teatralnie. Skutek
    dla planu: waskie zdanie to za malo, bo druga strona pulpitu moze wyprodukowac
    pretekst bez jej udzialu.

    4. WERYFIKACJA PO JEJ STRONIE - ROBI TO WLASNYM NARZEDZIEM I TEZA PRZECHODZI.
    Nie wierzy na slowo i nie musi. Siega po odbitke Kolma i czyta ja jak tekst, nie
    jak stanowisko: brak jezyka programowego, brak zapowiedzi dalszej pracy, brak
    jednego odeslania do wlasnego dorobku. Aparat czlowieka, ktory zamyka temat, nie
    otwiera go. To jest dokladnie ten rodzaj dowodu, ktory ona umie ocenic lepiej
    niz Lucan, i pierwszy moment tej rozmowy, w ktorym ona wnosi cos, czego on nie
    mial.

    5. PRZYZNAJE TO NA GLOS, ZANIM POLICZY, ILE JA TO KOSZTUJE (portrayal.the_flaw).
    Siedem tygodni tlumaczyla sobie zachowanie Kolma glupota. Wyjasnienie przez rektorat
    tlumaczy wszystko naraz i ona to mowi wprost, chociaz oznacza, ze przegrala wlasna
    ocene sytuacji drugi raz w ciagu godziny.

    6. WORLD MOVE - ORIENTUJE SIE Z OPOZNIENIEM, ZE NADAL NIE DOSTALA NAZWISK. Dostala
    frakcje, mechanizm i jeden rozebrany przypadek - i dala sie temu porwac, bo to
    jest ciekawe (portrayal.the_absorption). Wraca do wlasnego zadania pozno i niezrecznie
    (portrayal.the_social_gap), ale wraca. Jednoczesnie stawia nowe pytanie, ktore
    jest konsekwencja jego wlasnej tezy i ktorego on nie zamknal: skoro Kolm moze
    eskalowac sam, to samo przepisanie zdania nie wystarczy, a kazde dojscie do Kolma
    jest juz ruchem, ktory ktos zobaczy.

    7. CZEGO ONA NADAL NIE WIE. Sieci sieciarzy, Varkhena, slowa vitae, ojcowskiego
    planu pokazu, celi w piwnicy gildii, syndykatu. Nic z tego nie padlo. NOWE: nie
    wie takze, ze straz miejska ma powod osobisty przy cmentarzu, poza tym co uslyszala
    teraz.

    8. STAN. Popoludnie dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie, Spidey
    na parapecie przeciwnego okna. Energia bez zmian, integralnosc 19 z 19, bez warunkow.
    4 000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: zysk z zamieszek
    maja konkretne frakcje Kosciola i magow oraz straz miejska kryjaca handel zwlokami;
    Kolm wie, ze ma przegrac, a jego zaplata to rektorat po zdjeciu obecnego rektora;
    Kolm moze eskalowac teatralnie, jesli moderacja pozbawi go zamieszek; Neris zweryfikowala
    teze o Kolmie wlasnym czytaniem jego odbitki i przyjela ja; nazwisk nadal nie
    dostala.'
  new_decision: 'Dwie rzeczy stoja naraz. Neris wraca po nazwiska - frakcje jej nie
    wystarcza, bo frakcji nie da sie zapytac, kto zamowil. I stawia nowe: skoro Kolm
    moze podlozyc sie sam, samo zwezenie zdania nie wystarcza, wiec ktos musialby
    do niego dojsc przed dysputa. Lucan decyduje, czy podaje nazwiska, czy bierze
    Kolma na siebie, czy jedno i drugie - i czy Neris ma sie do Kolma w ogole zblizac.'
  operations:
