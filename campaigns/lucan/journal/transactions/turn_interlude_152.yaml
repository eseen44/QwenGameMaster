  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, trzy minuty, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Poprawka nazwiska: ALDHEN, nie Aldheim. Lucan sam odpalil zapalnik

    z t_147 na wlasnym takcie - i to jest dokladnie ten mechanizm, ktory karta ojca

    przewiduje, wiec nie wymaga zadnej narratorskiej pomocy ani zadnego oporu.

    1. ODLICZANIE ROBI TO, PO CO BYLO, ZANIM PADLO JEDNO SLOWO. Kiwniecie glowa zdejmuje

    Neris pioro z kartki - i jest to OSTATNIA instrukcja Lucana, ktorej ona posluchala,

    bo za dziesiec sekund on sam zlamie pozostale trzy z t_143 (nie przedstawiac sie,

    uchodzic za studentke, nie wchodzic w dyskusje z profesorem Veyrem). Dziesiec
    palcow

    liczonych bez spojrzenia na drzwi mowi jej dwie rzeczy naraz: to sie zaraz stanie
    i

    to jest zaplanowane. Ojciec wraca na siodmym, staje przy blacie na dziewiatym,

    Lucan mowi na dziesiatym. Odliczanie bylo trafne, choc Lucan nie sprawdzal.

    2. NAZWISKO NIE JEST TYM, CO ODPALA - ODPALA OPIS PROBLEMU. Karta ojca jest

    jednoznaczna (t_147): "Neris" nie jest dla niego haslem, dopoki nie stoi w nagłowku,

    na ktory patrzy. Ale "osoba, ktora tak ladnie pisze o konstruktach z ciala" to
    jest

    PAPIER I PROBLEM, czyli jedyne dwie rzeczy, ktore ten czlowiek pamieta. Trafienie

    jest natychmiastowe i pelne. Agenda ojca (current_goal) od trzech dni brzmi doslownie:

    znalezc odbitke z nazwiskiem osoby walczacej o szeroka definicje ozywionych

    konstruktow. Lucan wlasnie postawil ja przed nim.

    3. PRZYKRYWKA DOKTORANTKI NIE ZOSTAJE ZDEMASKOWANA - ZOSTAJE NADPISANA. Ojciec
    nie

    przezywa "syn mnie oklamal", bo nie zestawia dwoch etykiet. "Doktorantka" byla
    dla

    niego FUNKCJA (t_147: funkcja jest jedynym radarem spolecznym, jaki ten czlowiek
    ma),

    a "autorka tekstu o szerokiej definicji" jest PROBLEMEM - i problem bije funkcje.

    Sprzecznosc instytucjonalna (samodzielna referentka nie jest niczyja doktorantka)
    nie

    rejestruje sie, bo on nie orientuje sie ani w czasie, ani w polityce Akademii.

    SKUTEK UBOCZNY DO ZAPAMIETANIA: klamstwo z t_147 nie zostalo wykryte, ale przestalo

    dzialac. Ojciec nie bedzie zrodlem rozjazdu, bo pierwszej etykiety juz nie ma
    w

    pamieci - rozjazd moze wyprodukowac tylko ktos trzeci, kto uslyszal oba zdania.

    4. TO, CO OJCIEC MOWI JAKO PIERWSZE, JEST CIEPLE I JEDNOCZESNIE OKRUTNE. Wyklada

    swoja ocene jej tekstu tak, jak ja zapamietal (fathers_assessment): odwazniejsza,
    niz

    jej sie to oplaci. Mowi to jako komplement zawodowy, bez cienia swiadomosci, ze

    wlasnie powiedzial kobiecie szesnascie dni przed jej dysputa, ze przeliczyla sie
    na

    wlasna szkode.

    5. WORLD MOVE - DARMOWA RECENZJA PRZYCHODZI W NAJGORSZEJ MOZLIWEJ FORMIE. Neris
    sama

    dolozyla w t_142 czwarty problem - dziure definicyjna z wlasnej mowy - LICZAC
    NA

    DARMOWA RECENZJE OD PROFESORA VEYRA. Dostaje ja teraz, na zywo, bez znieczulenia
    i

    bez wstepu: ojciec przechodzi z komplementu wprost do czesci trzeciej jej tekstu
    i

    zaczyna RYC. To jest ta cecha z karty, ktora czyni go koszmarem alumnow - bedzie
    rylo

    tak dlugo, az cos z odpowiedzi zostanie, i nie zauwazy, ze kogos przy tym niszczy.

    Nie jest to opor narratora ani kara za zagrywke; jest to spelnienie jej wlasnej

    prosby przez czlowieka bez kalibracji spolecznej.

    6. NERIS NIE ZAPRZE SIE WLASNEGO TEKSTU I TO BYLO DO PRZEWIDZENIA Z KARTY.

    portrayal.the_flaw: kiedy ktos poda jej argument lepszy od jej wlasnego, przyznaje
    to

    na glos, ZANIM policzy, ile ja to kosztuje. Tu nie ma nawet argumentu do przyznania
    -

    jest jej wlasne autorstwo. Potwierdza je. Nie klamie i nie odmawia. Zaluje w

    nastepnej sekundzie i nie wycofuje.

    7. ALE NIE ZWIJA SIE POD CIOS W FUNDAMENT (constraint z relationships,

    retcon_000039). Uderzenie w jej pozycje odbija zarzutem, nie zgoda - i zarzut
    jest

    skierowany do Lucana, nie do ojca. Nie moze go jednak postawic, bo profesor Veyr
    juz

    zadaje pytanie o czesc trzecia, a ona nie jest zdolna nie odpowiedziec na pytanie
    o

    wlasny tekst. To jest realna pulapka tej zagrywki: nie ma szczeliny, w ktorej
    dalaby

    Lucanowi po rekach.

    8. LUCAN ODDAL JEJ NAZWISKO - NIE ODDAL ODBITKI. Szeroki gest wykonuje reka, w

    ktorej trzyma jej tekst, krzywa do gory, naglowkiem w dol. Ojciec wyciaga po niego

    reke odruchowo, bo od trzech dni szuka wlasnie tej kartki. Lucan jej nie puscil.

    Kartka nadal jest jego decyzja.

    9. PARTIALNA ZAPLATA STAREGO DLUGU, NIEROZPOZNANA JAKO ZAPLATA. Neris postawila

    w t_139 i t_140 warunek: nazwiska tych, ktorzy maja interes w dyspucie, przed
    wyborem

    granicy (relationship.open_question). Dostala wlasnie nazwisko - najciezsze, jakie

    bylo do dania, we wlasnej osobie i we wlasnym laboratorium. Nie dostala go jako

    odpowiedzi na swoje pytanie, tylko jako prezentacje, i nikt jej nie powiedzial,
    ze

    to jest jedno z tych nazwisk. Wniosek jest po jej stronie do zrobienia; ona zna
    z

    t_138 zdanie o tym, ze profesor Veyr spali inkwizytora przy bramie.

    10. RUCH OSI RELACJI. cooperation 22 -> 26: przypiecie do najmocniejszego dostepnego

    sojusznika po jej wlasnej stronie sporu jest realna wartoscia i ona to policzy.

    discretion_trust -5 -> -9: przesunal jej pozycje bez ostrzezenia i bez pytania,

    lamiac instruktaz, ktory sam nadal dwie godziny wczesniej; to nie ukrywanie, ale
    to

    jest ta sama wada widziana od drugiej strony. judgment_confidence bez zmian.

    personal_regard bez zmian.

    11. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,

    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    ani

    tego, ze kartka, ktora mu przed chwila wetknieto pod nos i ktorej teraz nie dostal,

    to odwrocie tekstu tej wlasnie kobiety.

    12. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:49. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. Zdrapka plesni glusszacej lezy na blacie,

    przyniesiona i zapomniana. USTALONE: ojciec zna autorke i ma ja w laboratorium;

    przykrywka doktorantki nadpisana, nie zdemaskowana; Neris potwierdzila autorstwo;

    ojciec ryje w czesci trzeciej jej tekstu; odbitka nadal w rece Lucana; pytanie
    o

    stopien i trzecia substancja nadal nietkniete.

    '
