  summary: 'Bez testu - rozmowa w drodze przez dziedziniec, piec minut, zero energii.
    Zagrywka gracza

    laduje w calosci (retcon_000033). Tura rozegrana po synchronizacji repo; event
    170 pozostaje

    wycofany przez retcon_000059 i nie jest tu w zaden sposob wskrzeszany.


    1. LUCAN OTWIERA TEMAT SAM, ZANIM NERIS DO NIEGO DOJDZIE. Obligation

    obligation_return_borrowed_academy_volume mowila "wyjasnic Neris historie tomu";
    gracz

    wykonuje jej pierwsza czesc z wlasnej inicjatywy, w chwili gdy Neris wlasnie zaoferowala,

    ze poszuka tomu w katalogu. Oferta katalogowa traci przedmiot: nie trzeba szukac
    ksiazki,

    ktora rozmowca ma.


    2. DWA FAKTY DEKLAROWANE PRZEZ GRACZA WCHODZA DO KANONU. (a) Egzemplarz NIE JEST
    wypozyczony

    na Lucana - spojne z provenance w inventory (skradziony przez balwierza, Lucan
    dostal go ze

    skrzyni po zmarlym), wiec nie ma karty wypozyczenia, ktora mozna by zamknac. (b)
    Tom jest

    ZDEWASTOWANY i nie nadaje sie do udostepniania studentom. Stan fizyczny nie byl
    dotad nigdzie

    zapisany; deklaracja gracza go ustanawia i nic jej nie przeczy - przeciwnie, ksiazka

    przeszla przez rece balwierza, ktory pisal po jej marginesach.


    3. TO ZMIENIA DROGE ZWROTU Z CICHEJ NA JAWNA - I TO JEST TANSZE, NIE DROZSZE.
    Podlozenie

    na polke bylo wykonalne, ale wymagalo, zeby ksiazka wygladala na swoja. Zdewastowana
    nie

    wyglada. Oddanie jej czlowiekowi z wyjasnieniem zamienia "brakujacy wolumin" w
    "wolumin

    zwrocony w zlym stanie przez doktora tej Akademii" - czyli w sprawe introligatorska
    albo

    oplate, dokladnie tak jak mowi inventory#not_a_threat. Nie budowac z tego zagrozenia
    ani

    terminu; bibliotekarz nie ma karty NPC i jest zwyklym urzednikiem (zasada gracza
    2026-08-19).


    4. CO NERIS TERAZ WIE, A CZEGO NADAL NIE. WIE: egzemplarz Lucana jest wlasnoscia
    biblioteki

    Akademii i nie jest jego wypozyczeniem; jest zniszczony; zwrot pojdzie przez bibliotekarza

    i Lucan chce ja przy tym miec. NIE WIE: ze tom byl kradziony przez balwierza,
    ani ze na

    marginesach sa jego proby na topielcach. Lucan tego nie powiedzial - nie dopisywac.


    5. WORLD MOVE - ONA MYSLI PRZYPISEM, WIEC SLYSZY W TYM JEDNO SLOWO: DOSTEP. Przez
    dziesiec

    tur prosila o sygnature, zeby zrobic poprawny przypis, i od t_169 wiadomo, ze
    nie chce samej

    sygnatury - chce PRZECZYTAC ustep, ktory cytuje (portrayal.tone: nie argumentuje,
    wstaje

    i idzie po papier). Zniszczony egzemplarz oddany bibliotece idzie do oprawy albo
    z polki

    schodzi; jej okno dostepu jest wiec teraz, u Lucana, a nie potem, w bibliotece.
    Prosi, zeby

    zobaczyc tom przed zwrotem. To nie jest opor wobec planu gracza - plan przyjmuje
    w calosci

    i sama proponuje, ze umowi bibliotekarza (sama wpisuje gosci do ksiegi odwiedzin,
    wiec

    papierkowa robote tej instytucji zalatwia osobiscie).


    6. I DLATEGO TO JEST DECYZJA, A NIE KOMPLIKACJA. Marginalia sa jedyna czescia
    tomu, ktora

    nie jest tresci licencjonowana (inventory#marginalia_note) - cudze proby na ludziach,

    wiekszosc zakonczonych smiercia, czternascie dni przed przesluchaniem Lucana.
    Pokazanie jej

    ksiazki oznacza pokazanie ich albo wczesniejsze ich usuniecie. Zaden plik nie
    stawia tu

    terminu i nikt nikogo nie sciga.


    7. STAN. Wieczor dnia trzeciego, dziedziniec Akademii, 19:27. Energia bez zmian,
    integralnosc

    19 z 19, bez warunkow. Tom nadal lezy w container_wall_hideout w baszcie przy
    murze - trzy

    kwadranse marszu, sprawa wieczoru.

    '
  new_decision: Neris przyjmuje droge przez bibliotekarza i sama oferuje, ze go umowi,
    ale prosi, zeby zobaczyc tom przed zwrotem - chce przeczytac ustep, ktory cytuje,
    zanim egzemplarz zniknie w oprawie. Tom lezy w baszcie przy murze. Lucan decyduje,
    czy jej go pokazuje w calosci, czy najpierw robi cos z marginaliami balwierza,
    czy odmawia.
