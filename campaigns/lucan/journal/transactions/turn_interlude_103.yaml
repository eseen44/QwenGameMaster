outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Dwadziescia pięć minut marszu, zero energii - utrzymanie sieci
    to 0 (companions/webber-network.yaml#network_cost_model), cena tej tury byla w
    UWADZE. 1. TRANSPORT ROZWIAZAL SIE SAM I TO JEST DOKLADNIE TO, ZA CO LUCAN ZAPLACIL
    WYBOREM DROGI. Miejsce wyznaczyli oni, a zawodowcy wyznaczaja pokoje, do ktorych
    da sie dojsc bez punktu kontrolnego - kontrola na wjazdach na targ i obwieszczenie
    o szczatkach przestaja byc problemem, bo trasa ich nie dotyka. Problem "ciezszego
    ladunku" byl problemem tylko dopoki druga strona byla amatorem. Cena: ostatni
    odcinek biegnie po ICH terenie, wiec Lucan i szescdziesiat kilo sa przez kwadrans
    w calosci w cudzej kontroli - i to jest miejsce, w ktorym odebranie towaru bez
    placenia byloby najprostsze. Mara mowi to na glos, bez dramatyzowania. 2. SKLAD
    USTALONY. Boros donosi towar do progu, stawia go i konczy - nie wchodzi, nie widzi
    placacego, udzial wezmie z reki Lucana. Ostatni odcinek i wejscie: Lucan i Mara.
    3. LUCAN UPRZEDZA MARE ZAWCZASU, SAM, BEZ PYTANIA - I TO JEST DRUGA RZECZ Z RZEDU,
    KTORA ROBI PRZED, A NIE PO. Mowi, ze nie idzie po jednorazowa transakcje: chce
    wspolpracy, dostepu do ich rynku i do ich prawnikow. 4. ODPOWIEDZ MARY PRZESTAWIA
    CALA STAWKE I ONA WIE, ZE JA PRZESTAWIA. To nie jest ostrzezenie, o ktore prosila
    - to jest DRUGA PROSBA, i zmienia to, za co ona reczy. Poreczenie za czlowieka,
    ktory sprzedaje zloto, jest male i konczy sie razem z workiem. Poreczenie za czlowieka,
    ktory chce byc klientem calego aparatu, jest bez daty konca, i powoduje, ze w
    pokoju bedzie wyceniany CZLOWIEK, a nie towar. Nie wycofuje sie i nie targuje
    - nazywa to i idzie dalej. 5. PYTANIE, KTORE ZOSTAWIA LUCANOWI I KTORE ZADADZA
    MU ONI, PIERWSZE, PRZED KAZDA LICZBA. Dostepu sie nie dostaje, dostep sie wymienia.
    Wiec: co Lucan ma, czego oni chca, POZA zlotem? Mara nie odpowiada za niego i
    nie zgaduje na glos na targu. Mowi tylko, ze ludzie, ktorzy zyja z kupowania i
    sprzedawania, placa za MOZLIWOSCI, nie za kruszec, a ona widziala go przy robocie,
    ktorej nikt inny w tej grupie nie umial zrobic. 6. WYRYWKOWY PRZEGLAD SIECI -
    PIEC WEZLOW, BO TYLE SIE ZMIESCILO. Uwaga jest seryjna, jeden wezel naraz, zmierzone
    tempo to ok. dwie minuty na wezel (event_turn_interlude_086), a Lucan rownolegle
    prowadzil rozmowe. Co przyszlo: (a) DWA SIECIARZE SA NA LACE (webber_home, webber_tannery
    - loc_tannery, zone_upper_meadow, meadow_foraging_for_orthopterans). Szukaja narzadu
    prostoskrzydlego dla zuka. Wiernosc na tym dystansie jest zla - Lucan wie, ze
    SA i ze pracuja, nie wie, czy cokolwiek zlapaly. (b) TRZECI JESZCZE IDZIE (webber_dump,
    loc_dump, zone_entry, travelling_to_the_meadow_degraded_by_distance). Najdalszy,
    najgorszy sygnal, nic poza kierunkiem. (c) CZWARTY CZEKA PRZY STOLE (webber_anchored,
    loc_city_wall_hideout, zone_hideout_workshop, stationed_at_the_tower_awaiting_lucans_return_to_the_bench).
    Zszedl z dachu gildii do baszty. Razem z nim spy_hawk_moth_01 trzymany przy stole
    do stwardnienia na sile zyciowej jedwabnikow i spy_wasp_01 na blacie. (d) NOWE
    CZUJNIKI W GILDII MILCZA (spy_cellar_spider_03 w szufladzie Seraphine, spy_cellar_spider_04
    w pokoju przykrywkowym). Dwie i pol godziny, zero drgan. To JEST informacja: pokoju
    na gorze nikt nie przeszukiwal. (e) VARKHEN NA KROPLOWCE (zone_guild_upper_offices).
    Integralnosc 8,2, rezerwa 17,8, bodily_integrity_compromised nadal aktywne. Cztery
    lacza po 0,2 na dobe do rezerwy i 0,05 na dobe do integralnosci - naprawa idzie,
    ale w skali tygodni, nie dni. 7. I RZECZ, KTORA PRZEGLAD WYCIAGNAL, A KTOREJ LUCAN
    NIE SZUKAL - TRZY SLUGI SA BEZPANSKIE. spy_centipede_02 chodzi po loc_city_sewer,
    zone_sewer_wall_district, released_unsupervised_no_standing_order. spy_beetle_05
    jest rozproszony solo bez rozkazu w ulicach i odpadkach wokol baszty. spy_moth_01
    wypuszczona na lace bez rozkazow, dojrzewa. To nie sa zagrozenia magiczne i nie
    zdradzaja autora (retcon_000028), ale kanon ma dokladnie JEDNA os, na ktorej sieciowa
    robota zamienia sie w dowod rzeczowy: fizyczne ODZYSKANIE OKAZU i stwierdzenie,
    ze pajak jest martwy i chodzi (retcon_000029, korekta gracza 25.08). Lucan ma
    co najmniej trzy okazy bez rozkazu, bez schowka i bez nadzoru, chodzace po miescie.
    8. WORLD MOVE - MARA WIDZI, ZE GO CZASEM NIE MA. Podzielona uwaga nie jest bezkosztowa
    u boku zwiadowczyni. Lucan wychodzi z rozmowy na kilka sekund naraz, pieciokrotnie,
    i za kazdym razem wraca dokladnie w to samo miejsce w zdaniu - co jest gorsze
    niz gdyby tracil watek. Mara nie pyta i nie komentuje. Ale od rana ma z nim spedzac
    godzine dziennie z bliska, i to jest dokladnie ta obserwacja, ktorej wczesniej
    nie mogla zrobic: kiedy Lucan jest nieobecny i jak dlugo (suspicion_lucan_has_remote_necromantic_support,
    srednia pewnosc). 9. STAN. 14:05 dnia trzeciego. Energia 8 z 15, integralnosc
    19 z 19, bez warunkow. Sa pod drzwiami. Szescdziesiat kilo stoi na progu, Boros
    odchodzi, kwota nadal nienazwana, a pierwsze pytanie w tym pokoju nie bedzie dotyczylo
    zlota.'
