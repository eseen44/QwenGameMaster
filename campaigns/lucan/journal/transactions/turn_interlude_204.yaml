  resolved_world_reaction_ids: []
  consequence_source_refs: []
  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii,
    zero wydane.

    Lucan sciaga apokalipse z powrotem do kategorii "zagrozenie zawalem" i podaje
    jedyna

    rzecz w calej rozmowie, ktora pryncypal moze sprawdzic sam.


    1. DEESKALACJA JEST WYKONANA MECHANIZMEM, NIE ZAPRZECZENIEM - I DLATEGO DZIALA.

    Lucan nie odwoluje niczego z t_203. Podaje ZWYCZAJNE wytlumaczenie tego samego
    zjawiska:

    grunt nad duza nekropolia potrafi sie zarywac, zwlaszcza kiedy ktos stamtad wykopuje

    zasoby. Zawal przestaje byc koncem swiata i staje sie geologia.

    I JEST W TYM ZDANIU HACZYK, KTORY JEST PRAWDZIWY I FILE-GROUNDED: "ktos stamtad
    wykopuje

    zasoby" to miedzy innymi CZLOWIEK PO DRUGIEJ STRONIE STOLU. Trzy dni temu kupil

    szescdziesiat kilo wykopanych stamtad rzeczy (player/inventory.yaml, event_turn_interlude_111)

    i posortowal je wlasnymi rekami. Lucan mowi to uprzejmie i nie akcentuje; pryncypal
    to

    slyszy, bo to jest jego wlasny towar.

    Zgodnie z retcon_000039 nie kwituje ciosu we wlasny fundament przeliczeniem -
    ale to nie

    jest cios, tylko trafna uwaga o wspolnym udziale, i przyjmuje ja jako taka.


    2. "NIE WIE PAN NAWET POLOWY" - NARRATOR NIE ROZWIJA TEGO ANI O SLOWO. Lucan jednoczesnie

    zmniejsza mechanizm i powieksza tajemnice. To jest jego zagrywka i narrator jej
    nie psuje:

    nie podpowiada, czego dotyczy druga polowa, nie daje zadnej wskazowki i nie pozwala
    zadnemu

    NPC zgadywac. forbidden_without_source obu obecnych nadal nienaruszone - Varkhen,
    pieczecie,

    dolna brama, nekromancja Lucana, Spidey.


    3. "TRUPY PO OSTATNIEJ AKCJI JUZ PAN WIDZIAL" - ZAPISANE JAKO SFORMULOWANIE LUCANA,
    BEZ

    ROZSTRZYGANIA. Zaden plik nie mowi, ze pryncypal widzial ciala; linia syndykatu
    to NIE jest

    wywoz cial i nigdy nie byl (event_turn_interlude_105, prostowane przez npc_ilva_rennat).

    Widzial natomiast bezspornie SKUTKI ostatniej akcji - szescdziesiat kilo towaru
    grobowego

    przeszlo przez jego rece. Narrator NIE ustanawia, ze widzial zwloki, i NIE kaze
    pryncypalowi

    tego prostowac ani potwierdzac; zdanie zostaje jako rama Lucana (retcon_000120).
    Pryncypal

    nie czepia sie slowa, bo sens jest dla niego jednoznaczny.


    4. I TU JEST TA JEDNA RZECZ, KTORA PRYNCYPAL POTRAFI ZWERYFIKOWAC - I NA TYM SIE
    OPIERA.

    Cala reszta dzisiejszej rozmowy byla dla niego niesprawdzalna: nie zna sie na
    kamieniu,

    powiedzial to sam w t_203, i nie ma jak odroznic opisu sytuacji od skali dobranej
    pod efekt.

    "Gdybym wiedzial, ze nie ma tu czego szukac, dawno bym wyjechal" jest pierwszym
    zdaniem

    w tej rozmowie, ktore ma pokrycie W ZACHOWANIU, a nie w slowie. Lucan jest w miescie.

    Kupuje warsztat alchemiczny, zamawia odpis tomu na dziewiec dni, buduje siec,
    bierze

    prawnika na dwie rozprawy - to sa wszystko wydatki czlowieka, ktory planuje tu
    byc.

    Dla czlowieka, ktory OCENIA LUDZI PO TYM, CZEGO ODMAWIAJA I CO ROBIA, a nie po
    tym, co

    mowia (agenda#judge_lucan_by_what_he_declines_not_by_what_he_offers), jest to
    jedyny

    argument tej rozmowy, ktory w ogole wchodzi mu do ksiag.

    ZAUWAZA TEZ NAPIECIE MIEDZY DWOMA ZDANIAMI - i nie jest to bystrosc ponad gracza

    (retcon_000040), tylko sluchanie: w jednym oddechu uslyszal "to zwykly zawal"
    i "nie wie

    pan nawet polowy". Nazywa to raz, bez triumfu, i nie zada rozwiniecia.


    5. CO SIE PRZEZ TO ZMIENIA, A CO NIE. Pryncypal nie odzyskuje niewiedzy, ktora
    stracil

    w t_203 - tego sie nie da cofnac i on tego nie udaje. Odzyskuje natomiast RAMY:
    wraca

    z "moje przedsiewziecie moze nie miec gruntu" do "teren jest ryzykowny, ryzyko
    jest

    wyceniane, a czlowiek, ktory wie najwiecej, zostaje". Jego teza inwestycyjna z

    seraphines_reading_of_the_motive przestaje byc uniewazniona i wraca do bycia ryzykowna.

    NIE ZAPADA ZADNA NOWA DECYZJA: nie deklaruje, ze zostaje, nie deklaruje, ze wyjezdza,

    nie zmienia ukladu z t_109, nie zada wiecej pieniedzy i nie podaje ceny za trzy
    zamowienia.

    Umowa o czas i pustke nadal w mocy, nieodwolana i nierenegocjowana.


    6. KESZ MILCZY. Powiedzial swoje w t_203 i nie doklada. Jego stan bez zmian: nie
    wie, CO

    jest pod cmentarzem, wie, ze powazne, idzie z tym do kaplana.


    7. CZEGO NARRATOR TU NIE ROBI. Nie rozwija "drugiej polowy" i nie daje do niej
    zadnej

    wskazowki. Nie ustanawia geologii, nekropolii ani mechaniki osiadania jako kanonu
    - to

    nadal sa zdania w scenie. Nie orzeka, czy Lucan mowil prawde w t_203, czy teraz.
    Nie

    wymusza na pryncypale deklaracji w zadna strone. Nie tworzy zegara, terminu ani
    nowego

    ryzyka. Nie podaje ceny za kamien, metal i namiary - pryncypal nadal nie ma czego
    zwazyc.


    8. STAN. Czwarty dzien interludium, 14:04, pokoj syndykatu na zapleczu targu.
    Obecni:

    Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary
    bez ruchu

    poza uplywem czasu. Toby w skrzynce na dolnej polce, na pierwszym talerzyku. Zuk
    nadal na

    stole brzuchem do gory - nikt go nie schowal przez cztery tury. Trzy zamowienia
    bez ceny,

    oferta na zbitki bez umowy, Kesz prawnikiem bez honorarium, uklad z t_109 w mocy.

    Wszystko, po co Lucan tu zszedl, jest zalatwione i rozmowa nie ma juz wlasnego
    ciagu dalszego.

    '
