  perspective: pc_lucan
  summary: Bez testu. Lucan wychodzi z gildii i rozdziela swoje trzy adresy na trzy
    funkcje. 1. PODZIAL MIEJSC USTALONY. Cela w piwnicy gildii - mieszkanie i alchemiczna
    przykrywka. Pokoj dyzurny na gorze - papier do przeszukania, utrzymywany przez
    Seraphine. Baszta przy murze (loc_city_wall_hideout) - warsztat i cala robota
    nad drugim pajakiem, poza budynkiem gildii, zgodnie z wlasna deklaracja Lucana
    o eksperymentach poza domem. 2. WYJSCIE. Seraphine wypuszcza go wlasnymi kluczami
    przed koncem dyzuru. Varkhen zostaje w rogu jej gabinetu, nieruchomy, z protokolem
    sygnalu przez wiez. Czworka ocalalych zostaje w piwnicy, dwoje drzwi od nowej
    kwatery Lucana. 3. CO JEST DO ZALATWIENIA PO DRODZE I CZEGO NIE DA SIE ZALATWIC
    DZIS. Rzeczy z baszty Lucan sciagnie sam - nie jest tego duzo. Sprzet do przykrywki
    (retorta, palnik, mozdzierz, nudne odczynniki) wymaga targu i gotowki; targ otwiera
    sie rano, a pieniadze sa u Borosa do spotkania za dwa dni. Do tego czasu alchemiczny
    blat stoi pusty. 4. NIETKNIETE. Pajak alarmowy do gabinetu Seraphine nie zostal
    zrobiony. Nocny urobek sieciarzy czeka w baszcie i jest drobny - dobry na male
    okazy, za maly na odnoze.
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 600
  - op: set
    instance_id: pc_lucan
    path: position.location_id
    value: loc_city_wall_hideout
  - op: set
