  - *id002
  new_decision: Lucan jest w baszcie, przy zaopatrzonym schowku i nocnym urobku sieciarzy,
    z cala noca przed soba i bez nikogo, kto by patrzyl. Zaczyna prace nad drugim
    pajakiem.
