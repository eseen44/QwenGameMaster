  prose: 'Lucan podal nazwisko bez ceregieli - Malen Corth, akta magistratu - i Seraphine
    zapisala je bez komentarza, tak samo, jak zapisuje wszystko inne. Potem zapytal,
    czy ma z nim cos zrobic, i zaznaczyl, ze nie zamierza go zabijac ani krzywdzic,
    bo mial na mysli raczej zalanie calego parteru magistratu szambem. Nie oburzyla
    sie. Policzyla to na glos i wyszlo jej, ze pomysl jest zly nie dlatego, ze brudny,
    tylko dlatego, ze CELUJE W ZLE MIEJSCE: papieru z tej sprawy dawno nie ma w jednym
    budynku, bo Corth sam go rozeslal. Na koniec Lucan wzial sygnet z biurka i powiedzial,
    ze pokaze go prawnikowi - prawnik powinien znac swoja klientele. Seraphine nie
    zatrzymala go. Powiedziala tylko, co Kesz z tym zrobi: zapamieta.'
  summary: "Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii.\n\
    TRZY RZECZY: nazwisko oddane, pomysl na magistrat wyceniony rachunkiem zamiast\n\
    moralnoscia, sygnet wraca do Lucana i rusza droga Kesza.\n\n1. NAZWISKO PODANE\
    \ - PYTANIE Z t_235 ZAMKNIETE. Malen Corth, urzednik akt\nmagistratu uzgadniajacy\
    \ akta garbarni. Lucan ma je od Ruska pod rozwiazaniem\njezyka (t_096/097) razem\
    \ z tym, czego Corth chce. Seraphine zadala to pytanie\nRAZ i czekala (speech_traits);\
    \ dostala odpowiedz i nie robi z tego sceny.\nCZEGO NIE DOSTAJE: dostepu. fact_seraphine_is_not_on_corths_distribution_list\n\
    stoi - nazwisko mowi jej, GDZIE patrzec, a nie daje jej reki w tej szufladzie.\n\
    Magistrat to inna instytucja niz gildia i to sie nazwiskiem nie zmienia.\n\n2.\
    \ POMYSL Z SZAMBEM - WYCENIONY, NIE ZBESZTANY (portrayal:\nshe_is_a_co_conspirator_not_a_lawful_paragon,\
    \ do_not_play: oburzenie moralne).\nOdpowiada rachunkiem i robi to raz.\n  a)\
    \ ARGUMENT GLOWNY JEST Z PLIKU, NIE Z OSTROZNOSCI NARRATORA\n     (retcon_000138:\
    \ nie przebierac wlasnej ostroznosci za ograniczenie swiata).\n     fact_corth_sent_statement_requests_to_roster_names\
    \ - Corth ROZESLAL pisma\n     do nazwisk z obsady i zbiera odpowiedzi. Czyli\
    \ sprawa nie lezy w jednym\n     pomieszczeniu; jej kawalki sa u kazdego, kto\
    \ dostal list, i wracaja poczta.\n     Zatopienie parteru niszczy egzemplarz,\
    \ nie sprawe. To jest obserwacja\n     zawodowa, a nie zakaz.\n  b) CO TO NAPRAWDE\
    \ KUPUJE: czas i balagan. Uzgadnianie akt zaczyna sie od nowa,\n     terminy sie\
    \ przesuwaja. Ona nazywa to raz i nie wraca.\n  c) CENA, NAZWANA RAZ (retcon_000135):\
    \ dzis Corth jest urzednikiem, ktory\n     dopisuje pytanie tam, gdzie sie nie\
    \ zgadza (jego portrayal: nie sciga,\n     nie ma teorii sprawy). Po zdarzeniu\
    \ w magistracie ta sama sprawa przestaje\n     byc rubryka i staje sie incydentem,\
    \ ktorym zajmuje sie ktos, kto teorie\n     ma. Adres tej ceny jest konkretny:\
    \ ona sama wydala wlasna wiarygodnosc na\n     przytrzymanie Strazy (t_224) i\
    \ szykuje ogloszenie (t_232) - incydent\n     w magistracie plynie przez te sama\
    \ Straz.\n  d) CZEGO NARRATOR NIE ZROBIL: nie stworzyl sledczego, ktory dojdzie\
    \ do Lucana\n     po zalaniu (system/magic.md#slad + zasada, ze dowod robi sie\
    \ ludzmi\n     i papierem - a nie po to, zeby teraz zbudowac z tego hak, retcon_000055).\n\
    \     Nie rozstrzygnal, czy magistrat MA kanalizacje uzyteczna do tego pomyslu\
    \ -\n     zaden plik nie opisuje jego wnetrza, wiec pytanie zostaje otwarte i\
    \ nalezy\n     do gracza, nie do narratora. Nie zabronil niczego. Nie wykonal\
    \ niczego:\n     to bylo pytanie, nikt nigdzie nie poszedl.\n\n3. SYGNET WRACA\
    \ DO LUCANA. item_three_arrow_deer_signet lezal na biurku od t_233\n(zdjety z\
    \ palca, retcon_000137); inventory#current_placement mowi wprost, ze\nNIE ZOSTAL\
    \ ODDANY i decyzja o zabraniu go nalezy do Lucana - wiec bierze go bez\noporu.\
    \ Seraphine nie zatrzymuje: obejrzala go, gdy lezal, i to jej wystarczy do\nporownania\
    \ z papierami garbarnika, ktore ma u siebie (zapowiedziane w t_234).\nCZEGO NARRATOR\
    \ NIE ROZSTRZYGNAL: czy w tych papierach cos znalazla - to jej\notwarta praca,\
    \ nie wynik do wrecznia w tej samej turze.\n\n4. KESZ - RYZYKO POKAZANE, BO PLIK\
    \ KAZE JE POKAZAC.\nlucan-leads#lead_signet_heraldry_research.kesz_as_a_route_2026_09_05\
    \ zawiera\njawna instrukcje: \"RYZYKO, ktorego narrator ma nie chowac: Kesz zapamieta,\
    \ ze\nLucan pytal, a sygnet jest jednoczesnie sladem po poprzednim wlascicielu\
    \ garbarni\ni rzecza zabrana ze skarbca obecnego - czyli pytanie samo w sobie\
    \ jest informacja\".\nSeraphine nazywa to jednym zdaniem i na tym konczy. Kesz\
    \ zna urzednikow magistratu,\nnie Akademie (jego portrayal.group_role) - wiec\
    \ ta sama wizyta jest jednoczesnie\ndroga do herbu i droga do Cortha. Zestawienie\
    \ tych dwoch watkow jest obowiazkiem\nnarratora (retcon_000135 d), ale WYBOR nalezy\
    \ do gracza.\nCZEGO NARRATOR NIE ROZSTRZYGNAL: czy Kesz rozpozna herb, czy zechce\
    \ powiedziec\ni czego zazada - plik zabrania tego wprost.\n\n5. VARKHEN - MILCZY\
    \ I TO JEST POPRAWNE. Nie zostal o nic zapytany, a sprawy\npapierowe sam nazwal\
    \ niezrozumialymi (fact_varkhen_heard_the_oral_only_plan).\nNarrator nie dopisuje\
    \ mu zdania o magistracie ani o szambie (retcon_000142).\n\n6. STAN. Czwarty dzien\
    \ interludium, gabinet Seraphine, gorne pietro gildii.\nObecni: Lucan, npc_seraphine_vale,\
    \ npc_varkhen_mind (stoi, plaszcz na zbroi).\nSpidey i Tkaczka przy Lucanie, zuk\
    \ w kieszeni. NA BIURKU JUZ NIE MA SYGNETU -\njest u Lucana; karta kontraktowa\
    \ w szufladzie, ZAKRES i DATA puste. Lucan 19/19,\nenergia bez wydatku - czytac\
    \ z pliku. Wyjscie pod trzecia pieczec nadal na noc.\n"
  new_decision: 'Nazwisko oddane, sygnet w kieszeni, pomysl z magistratem wisi niewyceniony
    na wykonanie i nierozstrzygniety - ona powiedziala tylko, w co on nie trafia.
    Do ciemnosci wciaz kilka godzin, Varkhen stoi w plaszczu, a jedna wizyta u Kesza
    laczy teraz dwie sprawy naraz: herb z sygnetu i urzednika, ktorego Kesz zna z
    zawodu. Lucan wychodzi z gabinetu i zaczyna cos robic z tym wieczorem, czy ma
    do niej jeszcze cos, dopoki tu siedzi?'
