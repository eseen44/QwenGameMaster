  summary: 'Bez testu - dwadziescia minut ogladu, zero energii. Dwie korekty z nawiasow
    przyjete,

    jedna z nich moja wlasna. Pierwszy szczegolowy oglad sali narad; powstala geometria

    autorytatywna (locations/lumaria-guild/maps/layout.yaml) i discovery.yaml.


    1. KOREKTA GRACZA - PAJAK W SZUFLADZIE NIE JEST PULAPKA (retcon_000116). Narrator

    zlepil dwie rozne rzeczy: uzgodniony w t_070 KANAL ALARMOWY, ktory Seraphine PRZYJELA

    i na ktory czekala, oraz nieuzgodniony pomysl z lucan-leads na rzadka siec w jej
    szufladzie

    jako czujnik przeszukania mebla (status: awaiting_declaration_outside_parentheses).
    To

    pierwsze jest sposobem, w jaki SERAPHINE moze zwrocic uwage Lucana, ze cos poszlo
    bardzo

    nie tak - bez wpisu, bez posylania czlowieka, bez czekania. Zdjecie okazu nie
    wylaczaloby

    pulapki, PRZECINALOBY JEJ LINIE DO NIEGO. Rzecz obietnicowa, nie taktyczna.


    2. BLAD WLASNY NARRATORA W TEJ SAMEJ TURZE (retcon_000116 czesc druga). t_180
    napisal,

    ze zuk ma juz ucho prostoskrzydlego "zrobione od wczoraj". NIE MA. W t_176 narzad

    prostoskrzydlego dostali TKACZ i SPIDEY; spy_beetle_01 nosi wylacznie ucho cmy
    i flage

    hears_ultrasonic_band_not_words. Warunek (1) z lead_council_room_beetle_deferred
    jest wiec

    NIEWYKONANY. Praktyczny wniosek odwraca caly plan podsluchu: dzis tresc rozmowy
    przenosza

    WYLACZNIE Spidey i Tkacz, nie zuk.


    3. DOPRECYZOWANIE ROZKAZOW (retcon_000117). Przynoszenie ciekawych okazow dotyczy
    Spideya

    i Tkacza - blisko, ale bez obowiazku siedzenia na ciele; oboje rozumieja, co znaczy
    "cos

    ciekawego" (Spidey ma sad zademonstrowany w t_133, Tkacz dostaje to deklaracja
    gracza).

    Pozostale okazy: zwyczajny zer, nic specjalnego, Z DALEKA OD LUDZI. Zer pajaka
    piwnicznego

    jest dostepny w budynku (spy-series#feeding_model), wiec "z daleka od ludzi" realizuje
    sie

    w pustkach scian i na strychu, nie w rynsztoku - i nie wystawia ich na miotle
    i but.

    spy_cellar_spider_03 wraca wiec w zasieg gabinetu Seraphine i jej kanal dziala
    dalej.

    Stawki bez zmian: +1,0 na dobe kazdy, bo brak zadania.


    4. CZEGO W TEJ SALI NIE MA I TO NIE JEST OPOR, TO EPOKA. Lumaria jest malym miastem

    sredniowiecznym (retcon_000042). W tym budynku NIE ISTNIEJA przewody wentylacyjne
    ani

    instalacja wodna - nie ma rury, nie ma odplywu, nie ma szachtu. Nie ma tez zamka
    na klucz

    w drzwiach sali (jest zapadka), warty ani dyzurnego. Zaden plik nie stawia tu
    przeszkody

    i zadnej nie dopisuje.


    5. CO JEST, ZMIERZONE. Sala 7 na 5 metrow, trzy metry do sufitu. Jedne drzwi na
    zapadke,

    szpara pod skrzydlem ok. 1,5 cm. Podloga to deski debowe na trzy centymetry, a
    POD NIMI

    PUSTKA MIEDZY LEGARAMI na ok. 20 cm - i pod ta pustka sufit glownej sali. Male
    ognisko,

    latem zimne, a jego SZYB IDZIE PROSTO NA DACH. Dwa okna od ulicy, okiennice zamykane
    od

    wewnatrz. Stol na kobylicach, 3,5 metra. Okuta, zamknieta skrzynia na akta - zawartosci

    Lucan nie zna. Dzban i miednica.


    6. TRZY DROGI, W KOLEJNOSCI WARTOSCI - I ZADNA NIE JEST WYMYSLONA.

    (a) PUSTKA PODLOGI. Okaz siedzacy tam NIE JEST W POKOJU, wiec przeszukanie sali
    go nie

    znajduje i miotla tam nie wchodzi. Cena: trzy centymetry debu tlumia, wiec narzad
    tympanalny

    dostaje rytm, nacisk i dzwiek ostry pewnie, slowa slabiej. Wejscie: pustki scian
    od korytarza

    gornych biur albo od sufitu glownej sali.

    (b) SZYB OGNISKA. Pionowa droga z sali narad PROSTO NA DACH - a na dachu od tury
    007 stoi

    posterunek Tkacza. Nikt nigdy nie zamiata wnetrza komina i sadza kryje wszystko.
    Cena nie

    jest terminem z pliku, jest pora roku: jesienia ktos w koncu rozpali.

    (c) SPOD BLATU, w zlaczu blatu z kobylica: szpara na wysokosci MOWIACYCH GLOW,
    najlepsza

    akustyka w pokoju, kij od miotly tam nie dochodzi. Cena: to jednak JEST w pokoju,
    wiec

    przeszukanie sali ten schowek znajduje.

    Okna sa najgorsze z czterech - wneki zawiasow daja schowek, ale okiennice sa otwierane

    na posiedzenia i myte z zewnatrz.


    7. DZBAN JEST INFORMACJA, NIE DROGA. Woda nie przychodzi rura, wiec KTOS JA PRZYNOSI
    przed

    posiedzeniem - czyli sala ma obsluge, a obsluga ma miotle. To dokladnie jedno
    z dwoch

    realnych ryzyk nazwanych wprost w lead_council_room_beetle_deferred ("but sprzataczki"),

    i jest fizyczne, nie magiczne. Kto konkretnie i o ktorej - Lucan nie wie i nie
    wolno tego

    dopisac; nie ma w plikach ani takiej osoby, ani grafiku.


    8. DROGA OD SPODU JEST CIAGLA I PRZECHODZI JA WIJ, NIE ZUK. Kanaly siegaja pod
    piwnice

    gildii przez feature_corridor_floor_drain, dwoje drzwi od dawnej celi Lucana,
    a

    spy_centipede_01 juz raz wszedl otworem od spodu do CZYJEJS piwnicy z ciosanego
    kamienia

    i stojacym powietrzem - ktorej, wciaz nie wiadomo (t_091, watek otwarty). Kanal
    -> piwnica

    -> pustki scian -> pustka podlogi sali narad jest wiec trasa fizycznie ciagla.
    Wij chodzi

    w pustkach scian, pod podlogami i w odplywach; zuk jest wolny, klika po kamieniu
    i nie

    trzyma sie gladkich powierzchni. Cena wija jest za to twarda: zerowy uzytek ze
    wzroku

    i minimal_status, czyli zyje i syty, ale bez wspolrzednych - dokladnie ten problem,
    ktory

    Lucan obchodzil w t_091 krzywa straty jako dalmierzem.


    9. SCIANA, KTORA TEN OGLAD PRZESUNAL, ALE NIE ZDJAL. Problem nie jest juz drogą
    - drogi

    sa trzy. Problem jest ZAPISEM: sluchanie na zywo zjada CALA uwage Lucana, a uwaga
    idzie po

    jednym wezle (event_turn_interlude_086); voice_recording pozostaje nieoplacona
    funkcja

    w development_path. Pluskwa w tej sali pracuje wiec tylko na posiedzeniach, na
    ktorych Lucan

    NIE SIEDZI - a na wlasnym przesluchaniu bedzie siedzial. I druga sciana: zakotwiczony
    okaz

    znaleziony i przecietny UJAWNIA Death_Anchor, czyli nazwana technike nekromantyczna

    (t_089), a niezakotwiczony pajak piwniczny jest po prostu martwym pajakiem.


    10. SPIDEY ROBI OGLAD RAZEM Z NIM I NIE PYTA O POZWOLENIE. Zeskakuje z ramienia
    przy

    drzwiach, idzie po listwie przypodlogowej caly obwod sali - raz, w jedna strone,
    bez

    zawracania - zatrzymuje sie dwa razy: pod blatem w zlaczu z kobylica i przy szparze

    przy ognisku. Potem wraca i czeka. Nie melduje, bo nie ma czym; ale wybral te
    same dwa

    miejsca, ktore Lucan wybral, i zrobil to szybciej.

    TKACZ zostala przy drzwiach, bo nikt jej nie kazal wejsc. Kiedy Spidey przechodzi
    obok

    z powrotem, robi krok W JEGO TRASE i staje - nie zagradza, po prostu zajmuje jego
    droge

    powrotna, tak, zeby musial ja obejsc. On ja obchodzi. Ona idzie za Lucanem.


    11. STAN. Czwarty dzien interludium, 06:10, sala narad na gornym pietrze gildii.
    Energia

    14,35/15, integralnosc 19/19, bez warunkow. Zegary bez ruchu. Zaden termin nie
    powstal.

    Poranek nadal ma dwie wlasne rzeczy: targ po introligatora i pierwszy trening
    z Mara.'
  new_decision: 'Sala ma trzy drogi, a Lucan ma w kieszeni okaz, ktory nie umie ich
    uzyc - zuk slyszy nietoperze, nie slowa, i brakuje mu godziny przy stole oraz
    maskowania. Oba wezly, ktore UMIEJA przeniesc tresc rozmowy, chodza dzis przy
    nim jako jego wlasna oslona: Spidey i Tkacz. Zostawienie ktoregokolwiek w tej
    sali znaczy oddanie sobie wlasnych oczu na dni - i oddanie zakotwiczonego okazu
    w pokoj, ktory ktos przed posiedzeniem zamiata. A za oknem juz jasno i poranek
    ma dwie wlasne rzeczy: targ po introligatora i pierwszy trening z Mara.'
