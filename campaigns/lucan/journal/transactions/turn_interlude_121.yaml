outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. ODPOWIEDZ "WIEDZA TYLKO, ZE COS JEST I ZE TO DUZE" JEST DLA NIEJ
    WYSTARCZAJACA I MOWI TO OD RAZU. Zgadza sie z zapisem: Lucan nazwal ISTNIENIE
    problemu, nie tresc, a pokoj nie wie o Varkhenie, pieczeciach ani dolnych wrotach
    (event_turn_interlude_109). To jedyna odpowiedz, przy ktorej reszta ukladu ma
    sens, i Seraphine wyraznie odklada napiecie. 2. TRESC UKLADU PRZYJMUJE PUNKT PO
    PUNKCIE, BEZ SPRZECIWU: sygnal od Lucana zamiast terminu, pustka wokol terenu
    na czas prob, ludzie do noszenia i pilnowania, wozy, kwatera poza murami, materialy
    poza kolejnoscia, brak ich wejscia na cmentarz, brak ich odpowiedzialnosci za
    wynik. To sie zgadza z tym, co pryncypal powiedzial wprost - kupuje CZAS I PUSTKE,
    nie wspolne przedsiewziecie (event_turn_interlude_110). 3. ALE PRZY JEDNYM SLOWIE
    SIE ZATRZYMUJE I ROBI DOKLADNIE TO, CO ZROBILA KWADRANS TEMU: kaze powtorzyc zdanie.
    Chodzi o STRAZ. W pokoju padlo, ze pustke syndykat umie zrobic wobec zbieraczy,
    ciekawskich, cudzych ludzi i komorek probujacych przejac pusta linie - wobec wszystkich,
    ktorych ZNA, a zna wiekszosc (event_turn_interlude_110). O strazy nie padlo nic,
    a w tej samej rozmowie ta sama organizacja powiedziala, ze z klientem w mundurze
    SIE NIE KONKURUJE (event_turn_interlude_100). Seraphine nie zarzuca Lucanowi zmyslania.
    Pyta o rozroznienie, ktore u niej jest zawodowe: czy oni to POWIEDZIELI, czy on
    to USLYSZAL. 4. BO OBIE ODPOWIEDZI SA DUZE, TYLKO ROZNE. Jesli nie powiedzieli
    - Lucan ma dziure w najwazniejszym punkcie obwodnicy i dowie sie o niej w najgorszym
    momencie, bo patrol przy cmentarzu to jedyny rodzaj obcego, ktorego syndykat nie
    odgoni. Jesli powiedzieli - to organizacja, ktora od lat trzyma sie od tej linii
    z daleka, wlasnie zadeklarowala, ze odsunie z terenu ludzi instytucji, ktora ta
    linie prowadzi. To nie jest przysluga. To jest ZAPOWIEDZ PRZEJECIA. 5. I W TYM
    MIEJSCU SERAPHINE SKLADA CALOSC, KTOREJ LUCAN JEJ NIE PODAL. Pryncypal sam powiedzial,
    ze pusta linia sciagnie kogos w ciagu tygodni, ze ktokolwiek ja wezmie, bedzie
    potrzebowal cmentarza, i ze on tego dlugo nie zatrzyma (event_turn_interlude_109).
    Wiec syndykat nie robi Lucanowi uprzejmosci - kupuje PRZYSZLOSC tego terenu. Chce,
    zeby w dniu, w ktorym nisza sie otwiera, cmentarz byl juz posprzatany cudzymi
    ludzmi, bezpieczny, i otoczony osobami, ktore maja u niego dlug. "Na razie nie
    sa zainteresowani handlem" - Seraphine czyta "na razie" jako DATE, nie jako usposobienie.
    6. WNIOSEK, KTORY NAZYWA BEZ OSTREGO TONU, BO NIE JEST TO ZARZUT: gildia ma spalic
    ludzi i zasoby na oczyszczenie terenu, a wartosc oczyszczonego terenu zainkasuje
    ktos, kto na niego nie wszedl. Lucan dostal to, po co przyszedl, i zaplacil czyms,
    czego jeszcze nie policzyl - kolejnoscia. Pierwszy jest ten, kto stoi obok, kiedy
    robota jest skonczona. 7. KWESTIA NITEK - I TU ONA ZMIENIA REGULE, BO ZAUWAZYLA
    WZORZEC. Drugi raz tego wieczoru Lucan kaze JEJ wybrac wlasna niewiedze, a to
    jest sposob na uczynienie jej wspolwinna wszystkiego, o co nie zapytala. Odmawia
    dalszego wybierania w ciemno i stawia metode: Lucan ma wymienic nitki po JEDNEJ
    LINII kazda - czym to jest i co to na nia sciaga, jesli ona to wie - a ona wskaze,
    ktore otwiera. Nazwiska padaja dopiero po wskazaniu. Uzasadnienie jest jej doktryna
    z glejtu w wersji operacyjnej: chce miec liste rzeczy, ktorych NIE zna, zeby wiedziec,
    w co nie wolno jej wdepnac rano przed sluzbami. 8. WORLD MOVE - WSTAJE PIERWSZY
    RAZ OD WEJSCIA LUCANA I ROBI DWIE RZECZY. Zamyka drzwi na zasuwe, ktorej wczesniej
    nie ruszyla, bo do awantury drzwi zamkniete nie sa potrzebne, a do listy sa. I
    podaje Lucanowi smietniczke, bo obiecal posprzatac - bez komentarza, z kamienna
    twarz, i to jest jedyny raz tego wieczoru, kiedy oddaje mu zart. 9. STAN. 18:50
    dnia trzeciego, gorne biura, drzwi na zasuwie. Energia 7.8 z 15, integralnosc
    19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu w kieszeni,
    Spidey przy zebrach nieodkryty. OTWARTE I NOWE: czy syndykat naprawde obiecal
    odsuniecie strazy (do rozstrzygniecia przez Lucana - powiedzieli czy uslyszal),
    oraz lista nitek po jednej linii, ktorej Seraphine oczekuje TERAZ. Nadal nieudzielone:
    kanal ostrzegawczy, odpowiedz dla Kesza, droga po zakon mieczowy, wspolna wersja
    dla gildii i wersja Seraphine na protokol.'
  new_decision: 'Seraphine chce dwoch rzeczy naraz: rozstrzygniecia, czy odsuniecie
    strazy padlo z ich ust czy z domyslu Lucana, oraz listy nitek po jednej linii
    kazda, z ktorej sama wybierze, co otworzy. Co Lucan wpisuje na te liste - i czy
    wpisuje tam Kesza, Kosciol i zakon.'
