outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  summary: 'Bez testu - przejscie przez prog na zaproszenie, z poreczeniem, zero energii.
    Dziesiec minut. 1. TOWAR ZMIENIA RECE ZANIM PADNIE JAKAKOLWIEK LICZBA. Za progiem
    stoja dwaj ludzie, ktorzy nie witaja sie i nie pytaja - biora worki i niosa je
    sami. To nie jest uprzejmosc, to jest procedura: od tej sekundy szescdziesiat
    kilo jest u nich, a Lucan jest w srodku bez towaru i bez ceny. Dokladnie ta cena,
    ktora Mara nazwala na glos przed drzwiami, zaplacona w pierwszych dziesieciu sekundach
    i nie do cofniecia. 2. REWIZJA BYLA O JEDNO SLOWO. Odzwierny odbiera Marze luk
    i krotki miecz bez pytania, bez pokwitowania, i siega do plaszcza Lucana. Zatrzymuje
    go czlowiek stojacy z boku jednym zdaniem: "Gosc Teln." Reka opada. Spidey pod
    plaszczem i spy_beetle_01 w kieszeni nie zostaly dotkniete WYLACZNIE dlatego,
    ze Mara reczy - i wszyscy w pokoju to widzieli. Poreczenie Mary wyplacilo sie
    fizycznie, natychmiast, i jednoczesnie pokazalo Lucanowi, ile dzieli go od rewizji:
    jedno cofniete slowo. 3. CZLOWIEK, KTORY TO SLOWO POWIEDZIAL, TO PRAWNIK. npc_rovan_kesz,
    po piecdziesiatce, ubrany jak urzednik ze sredniej polki, teczka, atrament na
    palcu wskazujacym. Przedstawia sie bez tytulu i mowi Lucanowi jedna rzecz od razu,
    zeby nie bylo nieporozumienia: dzis nie jest jego prawnikiem, jest prawnikiem
    tego pokoju, i to pokoj decyduje, czego Kesz o Lucanie moze sie dowiedziec. Nie
    jest to grozba - jest to definicja stanowiska, wylozona wczesniej, niz musiala
    byc. To jest ten sam czlowiek z pakietu (criminal_circuit_lawyer): zna urzednikow
    magistratu, nie Akademie, i obsluguje obrone KARNA. 4. POKOJ. Zaplecze powroznika:
    dlugi stol, waga uchylna, probierz, kamien probierczy, swiece ustawione tak, zeby
    swiatlo padalo na blat, a nie na twarze. Zadnych okien. Przy stole wagowy - rzemieslnik,
    nie zbir - ktory nie zostaje przedstawiony i nie odzywa sie ani razu przez cala
    scene. 5. ROOM RUNNER - npc_ilva_rennat. Czterdziestka, plaszcz podrozny, ktorego
    nie zdejmuje, siada dopiero po Lucanie. Nie mowi "dzien dobry" i nie mowi "pokazcie".
    Mowi wagowemu jedno slowo i wagowy zaczyna sortowac - i sortuje DOKLADNIE tak,
    jak sortowal Boros: kruszec luzem i moneta na jedna strone wagi, ryte pierscienie
    i medaliony na sukno obok, osobno. Boros przeczytal ten towar tak samo, jak czytaja
    go zawodowcy. To milcząco potwierdza jakosc Borosa - i jednoczesnie znaczy, ze
    nic, co Lucan moglby o tym towarze powiedziec, nie jest dla nich nowa informacja.
    6. ONI ODROBILI PRACE DOMOWA I ILVA POKAZUJE TO OD RAZU, JEDNYM ZDANIEM. Nie pyta,
    skad zloto. Pyta, czy Lucan wie, ze przychodzi do nich w tygodniu, w ktorym urzednik
    akt magistratu rozeslal pisma z nazwiskami z garbarni. Wiedza to nie z magii i
    nie od Mary - wiedza to, bo kancelaria magistratu jest miejscem, w ktorym oni
    maja ludzi od zawsze. Znaczenie: syndykat sledzi te sama nitke co Corth, z drugiej
    strony, i wie o niej wiecej niz Lucan. Nie uzywa tego jako grozby. Uzywa jako
    CENNIKA - klient, przy ktorego nazwisku jest otwarta rubryka, jest drozszy w obsludze.
    7. ZLOTO ZOSTAJE ODLOZONE - CELOWO. Ilva przerywa wazenie w polowie, kiedy tylko
    wagowy potwierdza pierwsze przyblizenie, i mowi, ze liczbe za towar podadza na
    koncu, bo ta liczba jest latwa i obie strony ja znaja z grubsza. Trudna jest druga.
    Mara zdazyla ich uprzedzic, ze przychodzi czlowiek, ktory chce byc klientem, nie
    sprzedawca - i to jest jedyny powod, dla ktorego Ilva w ogole siedzi w tym pokoju
    zamiast przyslac samego wagowego. 8. WORLD MOVE - PYTANIE PADA I MA TERMIN. "Dostep
    kosztuje. Nie srebrem - srebro macie wy, my mamy go wiecej. Co pan ma, czego my
    nie mamy i czego nie kupimy gdzie indziej?" Ilva dodaje warunek, ktory zamyka
    droge ucieczki: chce odpowiedzi w tym pokoju, dzis, teraz, a nie obietnicy namyslu
    - bo czlowiek, ktory potrzebuje tygodnia na wymyslenie, co ma do zaoferowania,
    w praktyce nie ma nic, a oni juz raz zrobili wyjatek, wpuszczajac go bez rewizji.
    9. CO JEST NA STOLE, A CZEGO LUCAN JESZCZE NIE POLOZYL. Kandydaci nierozstrzygniete
    (planning/act-03-defence.yaml#syndicate_access): okazy, wiedza, Varkhen, nazwisko
    Veyr. Kazdy ma inna cene ujawnienia PRZY MARZE, ktora siedzi obok, reczy za niego
    i trzyma dwa podejrzenia o sredniej pewnosci. Doszedl czynnik nowy: Kesz slucha
    jako prawnik POKOJU, nie Lucana, wiec wszystko powiedziane teraz jest powiedziane
    bez tajemnicy zawodowej. 10. STAN. 14:15 dnia trzeciego. Energia 8 z 15, integralnosc
    19 z 19, bez warunkow. Towar u nich, kwota nienazwana, Mara rozbrojona i siedzaca
    obok, Spidey nietkniety pod plaszczem.'
