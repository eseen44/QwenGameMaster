outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'PROCEDURA STALA Z t_289 ZADZIALALA SAMA: Spidey rusza zwiedzac, wiec kanal
    sygnatur jest czysty, zanim Lucan zacznie. Gracz nie musial o tym pamietac i narrator
    nie odegral tej straty trzeci raz. KAMIEN DAJE DUZO, BO JEST DOPASOWANY. connected_stone_and_focus
    jest spelnione lepiej niz gdziekolwiek dzis: bloki bez spoin przewodza uwage dalej
    niz mur z zaprawa. Stad zasieg wiekszy niz w komorze - i to jest WNIOSEK Z LIMITU
    Z KARTY, nie premia dana przez narratora. CO KAMIEN PODAJE: hala jest DLUGA, nie
    okragla - biegnie w strone przeciagu i w ta sama strone, co wytarty pas. Sufit
    jest wysoki i jednolity. A w kierunku przeciagu, daleko, kamien SIE KONCZY - nie
    pustka i nie rog, tylko LINIA, na ktorej material sie zmienia. Geometria przybliżona,
    bo karta mowi geometry_is_approximate; odleglosci Lucan nie podaje. CO PODAJA
    SYGNATURY: umarli sa w niszach tej hali, ale INACZEJ NIZ WYZEJ - mniej ich i kazdy
    czyta sie "grubiej", bo nisze sa wieksze i rzadsze. Wszystko plasko i staro, nic
    nie drgnelo. I rzecz, ktora jest informacja, a nie zapowiedzia: sygnatury KONCZA
    SIE PRZED ta linia. Miedzy ostatnia nisza a zmiana materialu nie ma nic. CZEGO
    NARRATOR NIE ROZSTRZYGA: ze to jest brama. Varkhen powiedzial w t_296, ze nizej
    jest brama i przy niej trzecia pieczec - ale to jest JEGO PAMIEC, a kamien podaje
    wylacznie zmiane materialu. Zestawienie tych dwoch rzeczy nalezy do gracza; narrator
    kladzie je obok siebie i nie domyka (retcon_000136 - uzasadnienie narratora nie
    jest wiedza postaci). SPIDEY wyszedl i jeszcze nie wrocil. Jego raport bedzie
    osobno i bedzie pelny, bo jest blisko. KOSZT: 0,1 jednostki, 14,6 -> 14,5.'
  prose: 'Spidey rusza, zanim Lucan zdąży o to poprosić.


    To jest teraz odruch po obu stronach: pająk odchodzi w ciemność wzdłuż lewej ściany,
    a Lucan

    czeka, aż przestanie być słyszalny, i dopiero wtedy kładzie dłoń na kamieniu.


    I kamień odpowiada inaczej niż wszystko, czego dziś dotykał.


    Tam na górze były bloki i zaprawa, a zaprawa jest przerwą — uwaga idzie po skale
    i potyka się

    o każdą spoinę. Tutaj spoin nie ma. Kamienie są dopasowane jeden do drugiego tak
    ciasno, że

    cała ściana pracuje jak jedna rzecz, i dłoń idzie po niej dalej, niż powinna.


    Trzy rzeczy, znowu po kolei, tylko że tym razem większe.


    Hala jest długa. Nie okrągła, nie kwadratowa — biegnie, i biegnie dokładnie w
    tę stronę,

    w którą idzie powietrze i w którą prowadzi wytarty pas na podłodze. Sufit trzyma
    się na

    jednej wysokości przez cały czas; ktoś to wybrał i wykonał, a nie wydrążył, gdzie
    się dało.


    Nisze są. Mniej niż w komorze i każda czyta się grubiej — bo są większe, a to,
    co w nich

    leży, leży samo, a nie jedno nad drugim. Wszystko płaskie i stare. Nic nie drgnęło.


    A potem trzecia rzecz i to ona zatrzymuje mu rękę.


    Daleko, w tę samą stronę, kamień się kończy.


    Nie pustką — pustkę czuł dzisiaj trzy razy i wie, jak brzmi. Nie rogiem, bo róg
    zawraca.

    To jest **linia**: miejsce, w którym ta sama ściana przestaje być tą samą ścianą
    i zaczyna

    być czymś innym. Materiał się zmienia. Co to za materiał, dłoń nie powie — powie
    tylko,

    że od tego miejsca przestaje przewodzić tak, jak przewodziła.


    I jeszcze jedno, po drugiej połowie protokołu.


    Umarli kończą się wcześniej niż kamień. Między ostatnią niszą a tą linią jest
    odcinek,

    w którym nie ma nic — ani jednej sygnatury, ani starej, ani nowej. Ktoś przestał
    tam

    kłaść ciała na długo przed tym, zanim skończyła się hala.


    Lucan zdejmuje dłoń ze ściany.


    Varkhen powiedział dziś na wozie, że niżej jest brama, a przy bramie trzecia pieczęć.

    Kamień nie mówi „brama". Kamień mówi „tu ściana przestaje być ścianą".


    To są dwie różne rzeczy i Lucan nie skleja ich, stojąc w ciemności.


    — No? — pyta Boros.


    — Coś tam jest w tamtą stronę — mówi Lucan. — Daleko. I nie leżą tam już umarli.

    '
