outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'OTWARTYCH POLEK NIE MA I JEST TO ODPOWIEDZ, NIE PRZESZKODA. t_292 ustalil
    wprost, ze wszystkie nisze sa zamkniete plytami, a t_293 dodal, ze kurz nie ma
    sladu stopy - wiec gdyby cokolwiek bylo tu otwarte, ktos by to otworzyl, a nikt
    tu nie byl. Narrator nie cofa wlasnego ustalenia sprzed dwoch tur po to, zeby
    graczowi bylo latwiej albo trudniej. Jedyna otwarta nisza to ta, ktora sami zdjeli
    kwadrans temu. GROBOWCE SIE ZMIENIAJA i zmieniaja sie tak, jak zapowiadal gradient
    Mary z t_292: nisze wieksze, plyty lepiej ciete, kamien starannie licowany. POJAWIA
    SIE ZNAK - prosty, ryty, ten sam na kazdej z lepszych plyt. NIE nadaje mu znaczenia
    i nie mowie, czyj jest; nikt z trojki nie umie go przeczytac i narrator tego za
    nich nie robi (retcon_000058). CO SIE NIE ZMIENIA: uklad rak. W kazdej niszy,
    ktora widac przez szpare, ten sam - wyprostowane, dlonmi do gory. Detal z t_293
    potwierdzony w skali calej komory; nadal NIEUSTALONY. ZEJSCIE ISTNIEJE. Daleki
    koniec komory nie jest sciana, tylko progiem: stopnie wyciete w skale, waskie,
    wytarte srodkiem, schodzace w ciemnosc. PRZECIAG IDZIE STAMTAD - czyli drugie
    wejscie, o ktorym wiadomo od t_290, jest NIZEJ. Domyka to trzy osobne przeslanki
    w jedna: powietrze, uklad sygnatur ciagnacy sie poza komore i kamien mowiacy,
    ze na koncu nie ma sciany. SPIDEY MELDUJE TRZY RZECZY i wszystkie sa ksztaltem,
    nie obrazem (low_bandwidth): nizej jest przestrzen inna niz ta, przeciag jest
    tam mocniejszy, a w calej komorze NIE MA PAJECZYN ANI OWADOW. To ostatnie jest
    obserwacja, nie hipoteza - narrator jej NIE tlumaczy i Lucan tez nie, bo suchy,
    zamkniety grobowiec bez zeru moze byc pusty z nudnych powodow. ZERO ZEGARA, zero
    rzutu, nic nikogo nie goni. NIEUSTALONE: co jest nizej; co znaczy znak; czyje
    to groby; czy w lepszych plytach cokolwiek jest, bo nikt zadnej nie otworzyl.'
  prose: '— Idźcie bokami — mówi Lucan. — Patrzcie w półki, może gdzieś coś stoi na
    wierzchu. Ja idę

    przodem. Jak zacznę krzyczeć, wychodzimy.


    — Wiem — mówi Boros. Nic więcej.


    Idą tak przez dobre pięćset kroków i pierwszą rzeczą, którą ustalają, jest to,
    że nic nie

    stoi na wierzchu.


    Wszystkie płyty siedzą w kamieniu. Każda. Mara sprawdza je dłonią po kolei, nie
    wzrokiem,

    bo dłoń wyczuje szparę tam, gdzie oko jej nie zobaczy — i po stu niszach przestaje
    sprawdzać

    każdą, a zaczyna co czwartą. Nie znajduje ani jednej ruszonej. Jedyny otwarty
    grób w tej

    komorze to ten, który zdjęli sami kwadrans temu.


    Za to grobowce się zmieniają.


    Zaczyna się to niepostrzeżenie, gdzieś między drugą a trzecią setką kroków. Nisze
    robią się

    wyższe. Płyty przestają być po prostu dopasowane i zaczynają być **cięte** — krawędzie

    równe, licowanie takie, że spoina jest cieńsza niż paznokieć. Kamień przestaje
    być tym

    samym kamieniem: jest ciemniejszy i drobniejszy, i ktoś go tu przywiózł, bo w
    ścianach

    wokół takiego nie ma.


    A potem na płytach pojawia się znak.


    Ten sam na każdej. Prosty, ryty płytko, wielkości dłoni — kilka kresek, które
    na pewno coś

    znaczą i których żadne z trojga nie umie przeczytać. Mara patrzy na niego dłużej
    niż na

    cokolwiek dzisiaj i mówi tylko, że nie widziała takiego nigdy, i że to jej nic
    nie mówi.


    Boros ogląda spoinę, nie znak.


    — Te są lepsze — mówi. — Kto stać go na taką płytę, tego nie kładą z gliną przy
    głowie.


    Lucan idzie szybciej niż tamci i to on dochodzi do końca.


    Koniec nie jest ścianą.


    Podłoga urywa się progiem, a za progiem w skale wycięte są stopnie. Wąskie, strome,

    bez poręczy i bez ozdoby — i wytarte pośrodku, każdy tak samo, w płytkie zagłębienie

    w kształcie ludzkiej stopy. Ktoś tędy chodził. Nie w tym roku i nie w tym stuleciu,
    ale

    chodził tyle razy, że kamień ustąpił.


    Schody schodzą w ciemność i nie widać, gdzie się kończą.


    Lampa przy krawędzi kładzie się płomieniem od dołu do góry. Przeciąg idzie stamtąd.


    Spidey czeka przy progu i siedzi tak, jak siedzi wtedy, kiedy ma coś do powiedzenia
    i czeka,

    aż ktoś zapyta.


    Przynosi trzy rzeczy i wszystkie są kształtem, nie obrazem.


    Niżej jest przestrzeń, która brzmi inaczej niż ta — dłużej i głębiej, jakby dźwięk
    miał

    gdzie polecieć. Przeciąg jest tam mocniejszy, więc droga na zewnątrz idzie właśnie
    tamtędy.


    I trzecia, ta, po której Lucan zatrzymuje się na moment: w całej komorze, przez
    którą

    właśnie przeszli, nie ma ani jednej pajęczyny. Ani jednego martwego owada pod
    ścianą.

    Ani jednego żywego.


    Lucan odnotowuje to i nie robi z tego nic więcej, bo suchy, zamknięty kamień bez
    czegokolwiek

    do jedzenia bywa pusty z bardzo nudnych powodów.


    Za plecami słychać Borosa, który postukuje kostkami w kolejną płytę i liczy je
    pod nosem.

    '
