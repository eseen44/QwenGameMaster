outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozkaz dla wlasnej slugi z autonomia learned_preferences_and_simple_independent_planning
    nie wymaga rzutu, a utrzymanie sieci ma maintenance_cost 0 (companions/spidey.yaml).
    Dwie minuty, zero energii. 1. POSTERUNEK OBSADZONY I DZIALA. Spidey schodzi z
    ramienia na stol, przechodzi raz po calym blacie, wchodzi na parapet, wraca i
    sadowi sie na skrzyni pod scianka, z ktorej widzi oba okna i drzwi. Nieruchomy
    posterunek jest jego najlepszym trybem: decay_suppressant ze schowka (event_turn_interlude_090)
    zdejmuje dobowy ubytek, wiec moze tak siedziec dowolnie dlugo bez polowania i
    bez kosztu. 2. CO TEN POSTERUNEK NAPRAWDE DAJE. Narzad sluchowy z cmy (moth_tympanal_hearing_organ)
    niesie obecnosc mowy, liczbe glosow, rytm, nacisk i dzwieki ostre - przez sciane
    i przez drzwi, choc nie slowa. Do tego drgania blatu i podlogi oraz ruch powietrza.
    Przy skupieniu kanal Spideya oddaje Lucanowi pozyczony zmysl i niskopasmowa migawke
    wzrokowa. Na czlowieka, ktory podchodzi pod drzwi i staje - dokladnie ten z tury
    130 - to jest wykrywacz lepszy niz oko. 3. I CZEGO NIE DAJE, CZEGO LUCAN NIE ZAUWAZYL,
    DOPOKI NIE SIEGNAL. Spidey NIE MA zadnego czujnika ciepla. Lista modyfikacji jest
    zamknieta i nie ma na niej narzadu termicznego: reinforced_chitin_shell, enlarged_chelicerae,
    implanted_marsh_viper_fangs, separate_paralytic_gland, Corpse_Stitch, preservation,
    Death_Anchor, moth_tympanal_hearing_organ, decay_suppressant. Z zmija wszedl KIEL,
    nie dol policzkowy. Czlowiek, ktory stoi cicho i nieruchomo na rusztowaniu za
    oknem - czyli jedyny wykryty dotad tryb obserwacji tego skrzydla - jest dla tego
    posterunku niewidzialny. USTALONA LUKA, nie kara. 4. ROZWALENIE SIE NA LEZANCE
    JEST RUCHEM STATUSOWYM I ONA TAK TO CZYTA. Lucan zajmuje jedyny mebel do siedzenia
    w pokoju, w ktorym nikt go nie zaprosil siedziec, i robi to gestem czlowieka nastawiajacego
    sie na dluga rozmowe. Ona zostaje na nogach, przy wlasnym stole, na ktorym siedzi
    teraz jego okaz. 5. WORLD MOVE - ONA SIEGA PO PAPIER, NIE PO PRAWO. Referentka
    szerokiej definicji oglada, jak okaz sam wybiera stanowisko z widokiem na oba
    okna, i to jest dla niej gorsze niz karmienie: konstrukt wykonuje polecenie, a
    to cos WYBRALO miejsce. Odsuwa stos wlasnych odbitek, siada na skrzynce po druga
    strone stolu - nizej niz on - i wyciaga czysta karte i pioro. Atrament ma na palcach
    od rana. Notuje pierwsze zdanie, zanim Lucan cokolwiek powie. 6. I TO JEST CENA,
    KTORA WLASNIE ZOSTALA WYSTAWIONA, A NIE ZAPLACONA. Ona chce, zeby okaz zostal
    pokazany, zbadany i OPISANY (attitude_to_pc.structural_interest) - opisany znaczy
    zapisany, a zapisane istnieje poza pokojem, w ktorym stoi zasuwa. Pytanie o to,
    kto jeszcze to widzial, nadal wisi bez odpowiedzi i teraz wisi nad kartka. 7.
    STAN. 16:32 dnia trzeciego, wnetrze pokoi Neris Aldhen, drzwi na zasuwie, Spidey
    na posterunku na skrzyni pod scianka. Energia 11.05 z 15, integralnosc 19 z 19,
    bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE:
    posterunek obsadzony i bezkosztowy; sluch Spideya kryje drzwi i korytarz, NIE
    kryje nieruchomego obserwatora na rusztowaniu; Spidey nie ma i nigdy nie mial
    czujnika ciepla; Lucan siedzi, ona notuje.'
