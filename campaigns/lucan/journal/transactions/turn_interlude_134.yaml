outcome:
  schema_version: 1
  intent_achieved: false
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'roll_turn_interlude_134 - naturalna 25, po karze minus 10 wynik 15 przy
    progu 31 (capability_lucan_geo_protocol.ratings.accuracy). Nie zdane. Test DIAGNOSTYCZNY,
    wiec wg system/tests.md niski wynik nie jest cisza, tylko faktem fabularnym. Dwie
    minuty, 0.2 jednostki (dwa cantripy po 0.1 - effect_lucan_grave_sense i effect_lucan_stone_sense).
    1. ROZUMOWANIE GRACZA JEST POPRAWNE I ZOSTAJE JAKO USTALONA ZASADA. Posterunek
    Spideya lapie CIEPLO (zmysl wrodzony, retcon_000051) I RUCH oraz dzwiek (narzad
    cmy plus drgania blatu i podlogi). Przekroj tych dwoch luk jest waski: przez taki
    posterunek przechodzi wylacznie cos MARTWEGO I NIERUCHOMEGO JEDNOCZESNIE. Nie
    jest to dziura wielkosci bramy, tylko jeden konkretny profil. 2. I DLATEGO LUCAN
    SIEGA PO NARZEDZIE, KTORE DOKLADNIE TEN PROFIL WIDZI. Grave Sense nie potrzebuje
    ani ciepla, ani ruchu - patrzy na sygnature smierci. Metoda jest trafna. Zawodzi
    wykonanie, nie pomysl. 3. KARA BYLA PRZEWIDYWALNA I LUCAN JA SAM SOBIE POSTAWIL.
    Spidey siedzi metr od niego i JEST sygnatura smierci. Grave Sense ma w karcie
    overlapping_signatures, a protokol Geo combined_noise. Kanal oddaje najglosniejsza
    rzecz w zasiegu - wlasnego pajaka - i wszystko slabsze tonie za nim w smudze.
    4. CZUCIE KAMIENIA NIE ODDAJE NIC I TO JEST NAJWAZNIEJSZY WYNIK TEJ TURY, BO JEST
    TRWALY. Sciana pod dlonia nie jest ciagla z niczym. To skrzydlo jest W REMONCIE:
    nowe scianki, swiezy tynk, plandeki, przejscia zaslepione, a wsporniki rusztowania
    wbite w mur od zewnatrz rozcinaja to, co zostalo. Karta mowi to wprost - disconnected_material,
    weak_through_discontinuities, noisy_vibrations, requires_contact_with_connected_stone.
    USTALONY FAKT O LOKACJI: SKRZYDLA POD RUSZTOWANIEM NIE DA SIE SLUCHAC PRZEZ KAMIEN.
    Ani Lucanowi, ani nikomu innemu, kto probuje tego z tego samego kierunku. 5. I
    TO ZAMYKA SIE Z TURA 130 W SPOSOB, KTORY LUCAN ZAUWAZA OD RAZU. Skrzydlo bez portierni,
    bez ksiegi, z nieciagla scisla struktura i z rusztowaniem dajacym droge do okien
    jest najlepszym miejscem w calej Akademii do obserwowania kogos - i wlasnie dlatego
    ktos w nim stal. Akademia nie posadzila jej w zlym pokoju przez zlosliwosc. Posadzila
    ja w pokoju, ktorego nie da sie ani upilnowac, ani przeskanowac. 6. CZEGO LUCAN
    NIE WIE PO TEJ TURZE I MUSI WIEDZIEC, ZE NIE WIE. Pytanie "czy za oknem stoi cos
    martwego i nieruchomego" POZOSTAJE BEZ ODPOWIEDZI. Wynik 15 nie znaczy ''nikogo
    tam nie ma'' - znaczy ''ten pomiar nic nie orzeka''. Powtorka jest tania (0.2
    jednostki), ale nie jest darmowa: Spideya trzeba wyprowadzic z kanalu albo dotknac
    kamienia noscego, a kazde kolejne rzucenie odbywa sie na oczach magicznie pismiennego
    swiadka. 7. WORLD MOVE - ONA WIDZI, CO ON ROBI, I NIE JEST TO PAJAK. Zgodnie z
    system/magic.md swiadek w chwili rzucania wie i z grubsza rozpoznaje CO. Neris
    Aldhen widzi, ze gosc oparl dlon o JEJ sciane i puscil skan SMIERCI po jej pokojach.
    Pajak byl okazem, ciekawostka, argumentem. To jest pierwszy moment, w ktorym ta
    rozmowa dotyczy jej wlasnego mieszkania - i pierwszy, w ktorym pyta o cos innego
    niz nauka. 8. STAN. 16:34 dnia trzeciego, pokoje Neris Aldhen, drzwi na zasuwie,
    Spidey na posterunku. Energia 10.85 z 15, integralnosc 19 z 19, bez warunkow.
    4 000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: profil luki
    posterunku to martwe I nieruchome jednoczesnie; Geo nie rozstrzygnelo niczego,
    bo Spidey zaglusza kanal, a kamien skrzydla jest nieciagly; skrzydla pod rusztowaniem
    NIE DA SIE sluchac przez kamien - trwaly fakt o lokacji; Neris widziala skan smierci
    we wlasnym pokoju.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: on_the_daybed_in_neris_aldhens_rooms_palm_on_the_wall_after_an_inconclusive_geo_scan_she_saw_him_cast_it
