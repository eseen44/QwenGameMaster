  declared_action: 'ODPOWIEDZ LUCANA, PIEC RZECZY. (1) NIKT NIE WIE. (2) WERSJA POCHODZENIA:
    znalazl to losowo, sondujac cmentarz; lezalo w NATURALNEJ NIECCE, gdzie zbierala
