outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'DWIE NOWE WERSJE ZASIANE I ZAPISANE JAKO KWESTIE (retcon_000120): "nikt
    nie wie" oraz "lezalo w naturalnej niecce, znalezione losowo przy sondowaniu".
    Oba ida do state/secrets.yaml jako cover_lucan_says_he_found_the_vessel_randomly_in_a_natural_hollow
    z truth_status i do knowledge Seraphiny jako to, co uslyszala. PLIKI MOWIA CO
    INNEGO: rzecz lezala w wykutej niszy, w zbiegu trzech wyrobionych kanalow, za
    przesunietymi kamieniami, ktore Varkhen wyjal recznie w t_255 - i VARKHEN TO WIDZIAL.
    Slabosc wersji jest zapisana w coverze, nie rozegrana przeciwko graczowi: Seraphine
    nie ma czym tego sprawdzic, do niszy nie zejdzie, a o dodatkowej emisji z tego
    miejsca wiedzieli tylko Lucan i Oren (retcon_000163). SERAPHINE ROZSTRZYGA SPRAWE
    VARKHENA I NAZYWA WYBOR (retcon_000135): zostaje tam, gdzie lezy. Powod podala
    wlasny i jest to jej rejestr - ruch w miescie kosztuje ludzi i oczu, a w tej chwili
    nikt po niego nie przychodzi. Nie wymyslila trzeciej, czystej drogi i nie odlozyla
    decyzji. EKIPA Z KILOFEM: warunkiem jest to, o co sama zapytala w t_266 - podstawa,
    ktora wytrzyma pytanie rano. Tego Lucan jej jeszcze nie dal; jego wlasny pomysl
    na zlecenie padl w t_263 do VARKHENA, nie do niej, i narrator go jej nie podsunal.
    PYTANIE O EKSPERTA jest zgodne z jej agenda i z tym, ze o nazwisko urzednika pytala
    dwa razy. Odpowiedz nie padla w tej turze i zostaje jako punkt decyzyjny. ZERO
    ZEGARA: zaden plik nie stawia wezwania, terminu ani patrolu i narrator zadnego
    nie dodal. Stan bez zmian - tura rozmowna, bez kosztow i bez ruchu.'
  prose: '- Nikt nie wie - mówi Lucan, i to jest zdanie, które Seraphine przyjmuje
    tak, jak

    przyjmuje się podpis pod dokumentem: bez komentarza i z pełną świadomością, czyje

    nazwisko będzie pod spodem, jeżeli okaże się fałszywy.


    - Dobrze - mówi tylko.


    Reszty słucha z rękami na blacie. Naturalna niecka, sondowanie, niestabilne złogi,

    stabilizacja i izolacja, dziewięćdziesiąt procent roboty - ani razu nie przerywa,

    a kiedy pada zdanie o ojcu i o tym, co on nazwałby ciekawym, coś jej przechodzi

    przez twarz i znika, zanim da się to nazwać.


    Potem Varkhen.


    - Nie. Zostaje tam, gdzie leży. - Mówi to od razu, bez tego pół oddechu, które
    ludzie

    robią przy decyzjach. - Przenosiliśmy go nocą przez miasto raz i już wtedy wiedziało

    o tym za dużo osób. Drugi raz to są kolejne oczy, a on w tej chwili nikomu nie
    jest

    potrzebny do niczego - dopóki nie jest.


    Bierze pieczęć do ręki, obraca ją i odkłada.


    - Kilof dostaniesz. Ludzi dostaniesz. - Podnosi wzrok. - Daj mi powód, który wytrzyma

    pytanie o dziewiątej rano, i będą tam o północy. Nie mam w szufladzie niczego,
    co

    pozwala mojej ekipie kopać na poświęconej ziemi, bo tak wyszło z rozmowy.


    I na koniec, tym samym tonem, którym pytała o nazwisko urzędnika dwa razy:


    - Jaki ekspert?

    '
  apply_required_costs: true
