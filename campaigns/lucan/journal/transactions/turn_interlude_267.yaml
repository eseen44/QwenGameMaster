    WIE, CO ROBI - to dokladnie ten rodzaj materialu, ktory jego ojciec nazwalby ciekawym;
    MA EKSPERTA, ktory mu z tym pomoze (nazwiska nie podaje). (5) JESLI CHCE VARKHENA
    Z POWROTEM, to pojdzie po niego, ale bedzie potrzebowal wiecej miesni. Dodaje,
    ze praca z czyms takim to w 90% stabilizacja i izolacja, a material jest dobry
    do umagicznienia.'
  actor_id: pc_lucan
  scope: execution
  stakes: 'DWIE NOWE WERSJE DO ZAPISANIA JAKO KWESTIE, NIE JAKO KANON (retcon_000120):
    "nikt nie wie" oraz "lezalo w naturalnej niecce". Pliki mowia co innego i to jest
    sprawdzalne: rzecz lezala w WYKUTEJ NISZY, w zbiegu TRZECH WYROBIONYCH W KAMIENIU
    KANALOW, za przesunietymi kamieniami polnocnego fundamentu, ktore Varkhen wyjal
    recznie w t_255. VARKHEN TO WIDZIAL I WIE, ZE LUCAN TO ZABRAL (fact_varkhen_saw_lucan_keep_the_vessel...,
    fact_varkhen_left_in_his_sarcophagus...). "Nikt nie wie" jest wiec falszywe wobec
    jednego swiadka, ktory lezy dwa poziomy pod ziemia i ktory NIE KLAMIE - to zapisac
    w coverze jako slabosc wersji, a nie rozgrywac teraz przeciwko graczowi. CZEGO
    SERAPHINE NIE MOZE ZROBIC: sprawdzic ani jednej z tych wersji. Nie jest nekromantka,
    do niszy nie zejdzie, a o dodatkowej emisji z tego miejsca wiedzieli tylko Lucan
    i Oren (retcon_000163). Ma prawo UWIERZYC, miec watpliwosc albo odlozyc sprawe
    - nie ma prawa wiedziec. CO JEJ WOLNO ROZSTRZYGNAC: sprawe Varkhena, bo to jej
    kustodia i jej druga priorytet z karty (nie dac sie rozlupac na Varkhenie). Binarke
    postawil gracz, wiec postac MA WYBRAC I NAZWAC WYBOR (retcon_000135) - bez wymyslania
    trzeciej, czystej drogi i bez odkladania decyzji. Wolno jej tez postawic warunek
    na ekipe z kilofem, bo podstawa na papierze jest dokladnie ta waluta, ktora ona
    kontroluje, i sama o nia zapytala w t_266. ZADNEGO ZEGARA, TERMINU ANI WEZWANIA
    NARRATOR NIE DODAJE - zaden plik ich nie stawia. Pytanie o eksperta jest zgodne
    z jej agenda (get_the_rest_of_lucans_undisclosed_list_before_the_hearing) i z
    tym, ze o nazwisko urzednika pytala dwa razy.'
