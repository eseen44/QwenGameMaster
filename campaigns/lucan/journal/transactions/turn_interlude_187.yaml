  - *id002
  summary: 'Bez testu - dziesiec minut przejscia, zero energii. Deklaracja gracza
    laduje w calosci.

    Seraphine JEST u siebie i to nie jest decyzja narratora - patrz punkt 2.


    1. TRZY KSIAZKI ZABRANE. Atlasy anatomiczne balwierza, brulion podreczny balwierza

    i akademicki tom z sygnatura biblioteki - te same "trzy ksiazki z nocy", o ktorych
    mowil

    t_180. Wracaja z guild_duty_room do carried. W pokoju zostaja odpis brulionu formul

    prawnych i dwie odbitki akademickie (Kolm, Aldhen), a takze czujnik przeszukania
    -

    spy_cellar_spider_04 wrocil tam w t_183. Ten zestaw jest spojny z sekwencja z
    t_174:

    na targ ida dokladnie te rzeczy, ktore maja byc przepisane i oprawione.


    2. SERAPHINE JEST U SIEBIE - Z PLIKU, NIE Z DECYZJI NARRATORA. seraphine-vale.yaml
    ma

    current_location_id: loc_lumaria_adventurers_guild i current_zone_id: zone_guild_upper_offices.

    t_180 odmowil rozstrzygniecia tego o 05:35, bo o tej godzinie gorne pietro jest
    puste - ale

    jest 11:20 w dzien roboczy, a karta stawia ja tutaj. Zadnego nowego faktu nie
    trzeba.

    Drzwi sa uchylone.


    3. CZYM ONA JEST ZAJETA - TEZ Z PLIKU. fact_seraphine_knows_the_watch_runs_the_corpse_line

    (t_120): idzie sladem autoryzacji polnocno-zachodniej zapory, ZLECONYM JEJ PRZEZ
    LUCANA

    w t_052, na papierze gildii i pod wlasnym nazwiskiem - a slad prowadzi w gore
    instytucji,

    ktora ten interes prowadzi, czyli Strazy Miejskiej. Zrodlo, ktore podnioslo jej
    hipoteze

    do pewnosci, jest CALKOWICIE NIECYTOWALNE. Siedzi wiec nad papierem, ktorego nie
    da sie

    domknac tym, co naprawde wie. To jej wlasna sprawa i ma prawo byc nia zajeta bardziej
    niz

    lista Lucana (portrayal#she_is_not_an_oracle).


    4. CZEGO ONA CHCE Z TEJ ROZMOWY - OTWARTE ZADANIA, WSZYSTKIE Z t_122, ZADNE NIEWYMYSLONE.

    (a) KOLEJNOSC: dostala liste siedmiu dzwigni Lucana, posortowala ja, zauwazyla
    na glos, ze

    ANI JEDNA pozycja nie jest obrona - i zazadala, zeby powiedzial, KTORE TRZY rusza
    najpierw.

    Nie dostala tego do dzis. To jest pierwsza rzecz, ktora powie.

    (b) PIORO NAD RUSKIEM: zazadala wygaszenia efektu PRZED posiedzeniem kierownictwa
    i chce

    znac sposob, zanim Lucan go uzyje.

    (c) VARKHEN: zazadala odpowiedzi, czego on CHCE, nie co mu wolno.

    Jej agenda otwiera sie od get_the_rest_of_lucans_undisclosed_list_before_the_hearing.

    Nie gra jej jako praworzadnej - jest wspolkonspiratorka i wie o tym.


    5. CZEGO NARRATOR TU NIE ROBI. Nie robi z wejscia Lucana testu, nie stawia w tej
    scenie

    terminu ani zagrozenia i nie zamienia otwartych zadan Seraphine w ultimatum -
    zaden plik

    nie stawia na nie daty. Nie odpala tez obowiazku ujawnienia ryzyka: rozstrzygniete
    w t_185,

    ze rozmowa z Mara nie dostarczyla Seraphine niczego nowego.


    6. STAN. Czwarty dzien interludium, 11:20, gorne biura gildii, przy uchylonych
    drzwiach

    Seraphine. Energia 10,35/15, integralnosc 19/19, bez warunkow. Zegary bez ruchu
    poza

    uplywem czasu. Trzy ksiazki i godzina dyktanda Mary w rekach. Zaden termin nie
    powstal.'
  new_decision: Seraphine jest u siebie, nad papierem, ktorego nie da sie domknac
    tym, co naprawde wie, i ma do Lucana trzy niezalatwione zadania z t_122. Lucan
    stoi w uchylonych drzwiach z trzema ksiazkami pod pacha. Z czym wchodzi?
