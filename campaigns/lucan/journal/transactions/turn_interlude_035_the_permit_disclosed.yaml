outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Lucan pierwszy raz oddaje jej TRESC leadu, nie samo jego istnienie
    - i Seraphine

    odwraca jego wlasna wycene dokumentu, przyznajac przy tym jedna rzecz i tracac
    jedna.

    1. BRAK NAZWISKA NIE JEST SLABOSCIA, JEST USTALENIEM. Lucan uwaza glejt za bezwartosciowy,

    bo nie wskazuje czlowieka. Seraphine czyta klase dokumentu, nie tresc: autoryzacja
    TRASY,

    pieczec urzedu i typ autoryzacji czytelne, podpis i data nie. Taki dokument jest
    albo

    blankietem, albo falszywka, i oba warianty sa dla urzedu GORSZE niz jeden przekupiony

    konstabl. Nazwisko da sie oddac - urzedy oddaja ludzi bez mrugniecia. Blankietu
    nie da sie

    oddac, bo nie ma glowy, ktorej scieciem sprawa sie konczy: znaczy, ze urzad wystawia

    wladze bez atrybucji. Instytucje broni sie defektu twardziej niz czlowieka. Drugi
    wniosek

    z tego samego: od chwili, w ktorej urzad wie, ze taki dokument istnieje POZA nim,
    musi

    zalozyc, ze jest ich wiecej - blankietow nie da sie odwolac, jesli nie da sie
    ich zliczyc.

    Dedukcje Lucana o pozwoleniach in blanco przyjmuje bez zastrzezen; mowi, ze to
    wlasnie

    dlatego dokument jest ciezszy, niz mu sie wydaje.

    2. PRZYZNAJE MU RACJE CO DO PROBE. Tak, jej pomiar nie ugra niczego na wyzszym
    poziomie i

    nie mial. Nie jest dzwignia, jest ODCZYTEM - ma powiedziec, JAKA rzecz Lucan trzyma,
    zanim

    ja wyda. A on wlasnie zapowiedzial, ze wyda ja nie wiedzac tego.

    3. ROZBIERA OBA JEGO CELE. "Ktos, kto spanikuje" - panika w takiej strukturze
    idzie DO

    GORY, nie w strone Lucana. Konstabl, ktory spanikuje, nie ma czym mu zaplacic;
    zamelduje

    temu, kto ma czym zakopac. Lucan wykonalby audyt za urzad i dostal za to nic.
    "Wbic sie w

    sledztwo po ich stronie" nazywa jedynym powaznym pomyslem tego wieczoru, bo takie
    wejscie

    ma legalna forme - swiadek, informator, albo droga przez spor gildii o dowody,
    w ktorym ona

    ma pozycje. Cena jest ta sama, ktora dzis juz raz przerobili: bycie w ich sledztwie
    znaczy

    bycie w ich AKTACH, a rzeczy, ktore go zapisuja, sa gorsze od tych, ktore go sadza.

    4. CO JA TO KOSZTUJE, i mowi to bez pretensji. Teraz WIE. Nie da sie tego odwiedziec.

    Jest adwokatka gildii, ktora opiera sie zadaniu o wydanie materialu i od tej chwili
    jest

    jedyna osoba przy tym stole swiadoma, ze czesc materialu nigdy nie zostanie wydana,
    bo

    lezy u jej klienta. Rano staje przed sluzbami. Jesli ktos zapyta ja wprost, klamstwo

    kosztuje ja pozycje, a prawda kosztuje Lucana.

    Nocny urzednik gasi ostatnia lampe poza ich kregiem i przystaje w poblizu, nie
    odchodzac -

    sala sie zamyka.

    '
  new_decision: 'Seraphine odwrocila wycene glejtu (blankiet jest ciezszy niz nazwisko),
    przyznala, ze jej

    probe nie jest dzwignia a tylko odczytem, rozbila pomysl z panikujacym konstablem
    i

    nazwala "wbicie sie w sledztwo" jedyna powazna droga - z cena w postaci wpisu
    do ich akt.

    Sama zostala z wiedza, ktorej nie da sie odwiedziec, i rano staje przed sluzbami
    miejskimi.

    Nocny urzednik czeka, zeby zamknac sale, a Lucan nadal nie ma gdzie spac. Daje
    jej glejt

    do przeczytania albo do reki, ustala z nia co ma powiedziec rano jesli ja zapytaja,
    wybiera

    droge wejscia w sledztwo przez spor gildii, czy konczy noc i idzie do baszty po
    urobek?

    '
  operations:
  - *id002
