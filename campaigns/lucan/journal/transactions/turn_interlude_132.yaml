outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - interludium buduje gracz (retcon_000033), a widocznosc przeplywu
    jest wprost w kanonie: w chwili rzucania swiadek wie i z grubsza rozpoznaje CO
    (system/magic.md, sekcja o sladzie magicznym). Dziesiec minut, 1 jednostka. 1.
    DEMONSTRACJA JEST CZYSTYM KOSZTEM I LUCAN O TYM WIE. Spidey stoi na 12 z 12, wiec
    transfer nie ma gdzie wejsc - receiver_capacity_applies. Idzie wiec ROZPROSZENIEM,
    ktore jest jawnym trybem tej zdolnosci (effect_lucan_network_energy_transfer,
    ''Transfer albo rozproszenie energii w sieci''), a nie naciskiem w pelna pule,
    ktory moglby okaz uszkodzic. Jedna jednostka wydana wylacznie na to, zeby ktos
    to zobaczyl. 2. I ONA TO WIDZI. Nie domysla sie, nie wnioskuje - widzi przeplyw
    wchodzacy w cialo, ktore nie ma prawa niczego przyjmowac. 3. JEJ PIERWSZA REAKCJA
    JEST ZAWODOWA I DZIALA PRZECIW JEJ WLASNEMU INTERESOWI. Nie krzyczy, nie cofa
    sie, nie mowi o prawie. Patrzy, podchodzi blizej niz powinna i wydaje wyrok fachowy,
    ktory wypada jej z ust przed jakimkolwiek rachunkiem: TO NIE JEST KONSTRUKT. Konstrukt
    sie nie karmi. Referentka szerokiej definicji, ogladajac najlepszy mozliwy okaz
    dla swojego stanowiska, jako pierwsza rzecz orzeka, ze okaz do jej kategorii NIE
    WCHODZI. 4. POTEM SIE HAMUJE, I TO JEST MOMENT, W KTORYM ROZUMIE, CO STOI W JEJ
    PROGU. Za szesnascie dni ma dowodzic, ze rzeczy takie jak to sa konstruktami.
    Ma teraz w reku jednoczesnie najlepszy dowod, ze jej definicja jest praktycznie
    potrzebna, i najlepszy dowod, ze jest merytorycznie falszywa. Nie umie tego rozdzielic
    w progu i nie udaje, ze umie. 5. DRUGIE ZDANIE LUCANA UDERZA MOCNIEJ NIZ PAJAK,
    BO DOTYCZY JEJ, NIE NAUKI. Ma racje i ona to wie natychmiast: cwiczy mowe na glos,
    dzien po dniu, w skrzydle bez portierni, bez ksiegi i bez nikogo, kto liczy wchodzacych.
    O gosciach NIE WIEDZIALA - jej karta nie ma o nich nic (event_turn_interlude_128
    i 130 to obserwacje Lucana, nie jej). Dowiaduje sie, ze byla sluchana, od obcego,
    ktory wszedl ta sama droga co oni. 6. WORLD MOVE - PIERWSZY RUCH, KTORY ONA WYKONUJE
    SAMA. Przestaje zaslaniac wejscie. Bierze go za rekaw, wciaga do pokoju i zarzuca
    zasuwe - nie z zaufania, tylko dlatego, ze wlasnie jej pokazano, ile jest wart
    jej korytarz. Rozmowa przestaje sie toczyc w progu. 7. I ZADAJE PYTANIE, KTORE
    JEST CALYM PUNKTEM DECYZJI, i jest to pytanie akademika, nie prawnika: KTO JESZCZE
    TO WIDZIAL. Nie pyta, czy to legalne, i nie pyta, czego on chce. Od odpowiedzi
    na to jedno zalezy, czy trzyma w rekach odkrycie, czy skandal - i ona mowi to
    wprost, tymi slowami. 8. CZEGO NADAL NIE MA. Nie zna jego nazwiska ani nazwy tego,
    co widziala; nie zna sieci, nie zna Varkhena, nie slyszala slowa vitae. Nie wie
    tez, ze czlowiek, ktory od dwoch dni chodzi po tej Akademii i opowiada kolegom
    o pewnym okazie, pracuje trzydziesci krokow stad w skrzydle laboratoryjnym. 9.
    STAN. 16:30 dnia trzeciego, wnetrze pokoi Neris Aldhen, drzwi na zasuwie. Energia
    10.8 z 15, integralnosc 19 z 19, bez warunkow. Spidey na ramieniu, jawny. 4 000
    srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: okaz ujawniony
    osobie magicznie pismiennej po raz pierwszy poza gildia i ojcem; jej pierwszy
    odczyt fachowy brzmi ''to nie konstrukt''; wie, ze byla sluchana, i wie to od
    Lucana; wciagnela go do pokoju i zamknela drzwi; czeka na odpowiedz, kto jeszcze
    to widzial.'
  operations:
  - op: consume
    instance_id: pc_lucan
    pool: lucan_necrotic_energy
    units: 1
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: inside_neris_aldhens_rooms_door_latched_spidey_openly_on_his_shoulder_she_is_asking_who_else_has_seen_it
  - *id002
  new_decision: 'Pytanie jest jedno i ona nie odpuszcza: kto jeszcze to widzial. Prawda
    jest dluga - gildia, Seraphine, Boros i Mara, syndykat, i przede wszystkim profesor
    Veyr ze skrzydla laboratoryjnego, ktory od dwoch dni opowiada o tym okazie kolegom
    i chodzi z tym na seminarium za pietnascie dni. Kazda wersja tej odpowiedzi ustawia
    cala reszte rozmowy: krotka lista czyni z tego jej odkrycie, dluga czyni z tego
    cudza sprawe, w ktorej ona jest ostatnia. A powiedzenie jej o ojcu jest jednoczesnie
    ujawnieniem, kim Lucan jest. Co jej mowisz - i czy nadal nie podajesz nazwiska?'
