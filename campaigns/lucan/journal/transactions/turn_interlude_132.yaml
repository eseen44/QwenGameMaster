  declared_action: 'Lucan przyklada palec do ust. Spidey wychodzi mu na ramie w sposob
    calkowicie widoczny, a Lucan puszcza przez lacze energie tak, zeby przeplyw byl
    dostrzegalny dla osoby magicznie pismiennej - demonstracja, nie doladowanie. Potem
    mowi: trudno bedzie jej kogos zaskoczyc argumentami, skoro pol budynku ja slyszy,
    i ze miala juz co najmniej dwa razy gosci, ktorzy sluchali jej perory.'
  actor_id: pc_lucan
  scope: execution
  stakes: Ujawnienie nieodwracalne. system/magic.md - w chwili rzucania swiadek wie
    i z grubsza rozpoznaje CO; po kilku minutach nie zostaje nic przypisywalnego,
    wiec cena jest wylacznie w jej glowie i pamieci, nie w dowodzie rzeczowym. Neris
    Aldhen jest referentka szerokiej definicji, czyli okaz jest dla niej argumentem
    - i jednoczesnie osoba, ktora ma wlasny interes w tym, zeby okaz zostal pokazany,
    zbadany i OPISANY (npc_neris_aldhen.attitude_to_pc.structural_interest).
