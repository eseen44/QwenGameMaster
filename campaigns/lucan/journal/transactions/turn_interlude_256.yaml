  prose: 'Varkhen nie udawal, ze rozumie, i nie probowal tego nazwac po swojemu.


    - Nie wiem - powiedzial. - Nie postawiono mnie tutaj.


    Potem juz nie patrzyl na nisze, tylko na korytarz, ktorym przyszli.


    Sonda weszla latwiej, niz powinna. Lucan podszedl do tego jak do czegos zywego
    -

    szukal obiegu, kierunku, tetna - i wlasnie dlatego od razu bylo widac, ze niczego

    takiego tam nie ma. Nie ma obiegu. Nie ma rozkladu. Jest wplyw. Trzy kanaly zyja,

    ledwo, i wszystkie trzy ida W JEDNA STRONE: do wnetrza. Ta rzecz nie zasila niczego.

    Ta rzecz od bardzo dawna sie zbiera.


    Sygnatura jest druga rzecza, ktora Lucan potrafi sprawdzic, bo probke ducha cmentarza

    ma u siebie od tej nocy, kiedy Oren umarl. Nie zgadza sie. To nie jest duch i
    nie ma

    w tym niczyjego imienia - jest smierc bez wlasciciela, rowna, sprasowana, bez
    ani

    jednej warstwy, po ktorej dalo by sie powiedziec, czyja byla. I to jest cala odpowiedz

    na pytanie, dlaczego grave sense nigdy tego nie sklasyfikowalo: grave sense czyta,

    CZYJA jest smierc i jak stara. Tutaj nie ma czyjej.


    Czym jest sam rytual, ktory to zbudowal - sonda nie mowi i nie powie.

    '
  summary: 'Interludium, roll_policy disabled - bez rzutu. Dziesiec minut, koszt zaokraglony
    do zera:

    capability_lucan_necromantic_probe nie ma zadeklarowanego energy_cost w zadnym
    pliku,

    a jest technika skanowa klasy cantripa - nie wymyslam liczby, ktorej nie ma. Przedmiotu

    NIE dotknieto i NIE wyjeto.


    1. VARKHEN NIE WIE I POWIEDZIAL TO WPROST - kontrakt: kiedy nie rozumie, mowi
    nie rozumiem

    i czeka; nie udaje i nie nazywa po swojemu. Dodal jedno zdanie z wlasnego rejestru,
    ktore

    JEST informacja: nie postawiono go tutaj. To pomieszczenie nie bylo czescia jego
    warty -

    strzegl trzech pieczeci i dolnej bramy. NARRATOR NIE ZESTAWIL ZA NIEGO "trzy kanaly"
    z

    "trzema pieczeciami": to byloby wnioskowanie, ktorego jego karta zabrania, a plik
    nigdzie

    tych trzech nie lączy. Nowy fakt: fact_varkhen_does_not_know_the_foundation_object.


    2. SONDA DALA DOKLADNIE TO, NA CO MA UPRAWNIENIA, I ANI JEDNEJ RZECZY WIECEJ.

    uses: read_energy_structure -> brak obiegu i brak rozkladu; identify_links ->
    trzy kanaly

    CZYNNE, slabe, JEDNOKIERUNKOWE DO WNETRZA (odpowiedz na pytanie otwarte z t_255);

    sample_signature -> porownanie z probka ducha cmentarza z milestone_044b: NIE
    ZGADZA SIE.

    Zablokowane przez plik: not_ritual_identification i does_not_replace_ritual_expertise,

    wiec CZYM JEST RYTUAL - nierozstrzygniete i sonda tego nie ruszy.


    3. "SMIERC BEZ WLASCICIELA" WYJASNIA CALA HISTORIE NIESKLASYFIKOWANIA tego sygnalu
    od

    milestone_036: grave_sense czyta, czyja jest smierc i jak stara, a tutaj nie ma
    czyjej.

    Nie jest to nowa mechanika - jest to zastosowanie ability_grave_sense#limits

    (overlapping_signatures, detects_patterns_not_complete_explanations).


    4. NIEUSTALONE I ISTOTNE: skad kanaly biora to, co wnosza, i czy ktos to zauwazyl.

    effect#limitations ma reciprocal_contact_possible, a Lucan wlasnie wlozyl wlasna
    energie

    w czynna siec trzech kanalow o nieznanym przebiegu. Narrator NIE POSTAWIL po drugiej
    stronie

    zadnego obserwatora ani reakcji - nie ma na to zadnego pliku (retcon_000033, retcon_000058).

    Otwarte zostaje takze, czy przedmiot da sie wyjac bez zerwania kanalow.

    '
