  summary: 'Bez testu - interludium, roll_policy disabled. Dwanascie minut, ZERO ENERGII.

    Dwa uszy w izbie, ktorej Lucan nie widzial. Nazwisko pada z cudzych ust.


    0. TURA MOZLIWA DOPIERO PO TRZECH KOREKTACH GRACZA (retcon_000128, 000129, 000130),

    wszystkie w jednym nawiasie, wszystkie zerosekundowe. Najwazniejsza jest ostatnia:

    Spidey i Tkacz orbituja Lucana CALY DZIEN i narrator dwa razy napisal, ze zostali

    w gildii, bo czytal zamrozone wspolrzedne zamiast zywego pola formation

    ("hunting_loose_within_a_room_of_lucan"). To retcon_000121 na polu pozycji.


    1. KOSZT ZEROWY I TAK MA BYC. network_cost_model: routine_upkeep_cost 0, kazdy
    wezel

    odrabia wlasny ubytek polowaniem. ability_borrowed_sense nie ma w player/abilities.yaml

    zadnego kosztu zasobowego - ma limity (linked_servant_required, low_bandwidth,

    switching_causes_brief_disorientation), a to nie to samo. Narrator NIE doklada
    ceny,

    ktorej kanon nie ma (retcon_000015).


    2. WEJSCIE. Sierpniowe popoludnie, drzwi szynku stoja otwarte na oscierz dla przewiewu
    -

    szpara pod nimi nie jest nawet potrzebna. Spidey idzie gora: futryna, belka, cien
    pod

    krokwia, i stamtad ma cala izbe. Tkacz idzie dolem, pod lawa przy scianie.

    ROZNICA MIEDZY NIMI JEST W PLIKACH OD t_182 i wychodzi tu drugi raz: Spidey pod
    uwaga

    Lucana NIERUCHOMIEJE i czeka, az uwaga zejdzie. Tkacz pod uwaga staje sie NADAKTYWNA,

    obraca sie w strone kazdego dzwieku, ktory jej sie wydaje wazny. Przez pierwsze
    minuty

    Lucan musi ja WYCISZAC uwaga zamiast nia sluchac. Nikt jej nie zauwaza - ludzie
    nie

    patrza pod lawe - ale jako szpieg jest gorsza od Spideya i to jest jej cecha,
    nie awaria.


    3. ODPOWIEDZ NA WARUNEK GRACZA: LOKAL NIE JEST PUSTY. To wynika z premisy samego
    pliku

    lokacji - szynk istnieje w kampanii dlatego, ze oddzialy bramne siedza w nim PO
    ZMIANIE,

    a poludniowa zmiana zeszla trzy godziny temu. Jest glosno.

    ALE PODSLUCH NIE POTRZEBUJE CISZY, TYLKO BLISKOSCI, i dokladnie to daja oba okazy:
    od

    t_176 maja OBA PASMA - ultradzwiek cmy i pasmo ludzkiego glosu z prostoskrzydlego
    -

    i to WYLACZNIE one przenosza slowa. Zuk zostaje w kieszeni na ulicy, bo ma tylko
    ucho

    cmy i flage hears_ultrasonic_band_not_words (t_181); do slow jest bezuzyteczny.

    KOSZT JEST INNY NIZ ENERGETYCZNY I STOI W retcon_000100: uwaga Lucana jest SZEREGOWA.

    Jeden wezel naraz, przelaczanie kosztuje krotka dezorientacje. Nie sluchal wiec
    izby -

    sluchal jednego stolu naraz, na zmiane, opartу o mur z oczami gdzie indziej.


    4. CO IZBA MA W SRODKU - PIERWSZA OBSERWACJA zone_obrecza_common_room, przez cudze
    zmysly.

    Jedno pomieszczenie, niskie, dluzsze niz szersze, okolo osmiu krokow na dwanascie.
    Szynkwas

    po prawej od wejscia, za nim baba i wyrostek. Pod dluzsza sciana dwa stoly zsuniete
    razem;

    reszta to lawy pod oknami i dwa male stoliki. Drugie wyjscie na tylach, za szynkwasem
    -

    na podworzec, uchylone. Klepisko, trociny, zapach piwa i skory.

    LUDZI JEST JEDENASCIORO. Osmioro przy zsunietych stolach - to jest ten wezel,
    dziewczyna

    roznosi tam dzbanki bez pytania, czyli siedza od dawna. Dwoje osobno pod oknem.
    Jeden

    spi na lawie przy tylnych drzwiach.

    NARRATOR NIE WYJMUJE STAD NICZEGO WIECEJ: zadnej mapy, zadnego planu, zadnej listy

    nazwisk, zadnego papieru na zadnym stole (retcon_000058).


    5. NAZWISKO PADA - I PADA JAKO ZAWOLANIE, NIE JAKO INFORMACJA. Przy zsunietych
    stolach

    rozmowa jest taka, jaka jest u ludzi po zmianie: pieniadze, upal, czyjas siostra,
    czyjs

    dlug. Nic z tego nie dotyka niczego, co Lucan sledzi, i narrator tego nie nagina.

    W pewnym momencie ktos przez stol rzuca "Ossek, no dawaj" przy odliczaniu miedziakow
    za

    dzban - i to jest cala identyfikacja, jaka Lucan dostaje.

    DLACZEGO WLASNIE TAK, A NIE PO TWARZY: karta npc_ossek_marn nie zawiera zadnego
    opisu

    wygladu. Rysopis od zatrzymanych z wozu to WIEK, POSTERUNEK i "ten od podnoszenia
    bramy

    wozom" - trzy rzeczy, z ktorych zadna nie wskazuje palcem czlowieka w izbie na
    jedenascie

    osob. Ucho wskazuje. Oko nie mialo czym.

    MARN SIEDZI PRZY ZSUNIETYCH STOLACH, w srodku grupy, nie z kraju. Ma za soba trzy
    godziny

    przy dzbanku i tyle po nim widac. NIE JEST SAM I TO JEST GLOWNA TRUDNOSC TEJ SYTUACJI,

    a nie zaden opor - zeby z nim pogadac, trzeba albo wejsc do osmiu ludzi naraz,
    albo

    zaczekac, az wstanie.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie kazal nikomu mowic o cmentarzu, o wozach,
    o glejcie

    ani o zadaniu do gildii - zaden plik nie stawia tych tematow w tej izbie i teoretyczna

    mozliwosc, ze ktos mogl o tym gadac, nie jest zrodlem (retcon_000058). Nie ustanowil,

    ze Marn cokolwiek wie ani ze slyszal o pytaniu "Marca" - do_not_play na jego karcie
    mowi

    to wprost. Nie zrobil z niego ani skruszonego swiadka, ani czlowieka spisku. Nikt
    nie

    zauwazyl zadnego z okazow, nikt nie wyszedl na ulice, nikt nie spojrzal na czlowieka

    opartego o mur. Nie powstal zaden zegar, termin ani podejrzenie.

    forbidden_without_source#spidey_existence NIENARUSZONE.


    7. STAN. Czwarty dzien interludium, ulica przed szynkiem Pod Obrecza. Lucan oparty
    o mur,

    z pustymi rekami - rekwizytowa skrzynka zostala na komendzie, warsztat alchemiczny
    idzie

    z targu do piwnicy gildii i nigdy w tej sprawie nie byl. Zuk w kieszeni, glejt
    w kieszeni.

    Integralnosc 19/19, energia bez wydatku w tej turze - czytac z pliku, nie z tej
    deklaracji.

    Zegary bez ruchu poza uplywem czasu. Spidey pod krokwia, Tkacz pod lawa, oboje
    w izbie.

    Godzine czytac ze state/time.yaml po commicie.

    '
