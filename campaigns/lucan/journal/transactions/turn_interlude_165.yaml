  schema_version: 1
  intent_achieved: true
  arrangement: mixed
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cztery minuty, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Pierwszy raz tego wieczoru pytanie idzie w druga strone.


    1. ZAPROSZENIE JEST WIEKSZE, NIZ WYGLADA, BO ONA NIE PYTALA OSIEM RAZY. Lista

    niezadanych: po co okazy, ktorych nie widac (t_143), zwloki z rejestru (t_145,
    149,

    154), stopien drugi nie na pokaz (t_158, 161), cmentarz i wyzsi nieumarli (t_161),

    zawisak i trzy zjedzone (t_164). Nie milczala z ostroznosci - milczala, bo nikt
    jej

    nie dal miejsca, a ona prosb dla siebie nie umie formulowac (portrayal.the_social_gap).


    2. ALE PYTA O SWOJE, NIE O JEGO - I TO JEST CALA ROZNICA MIEDZY NIA A SZPIEGIEM.

    Nie pyta "co budujesz". Pyta o AUTORSTWO, bo tekst jest jej jedynym narzedziem
    i

    jedyna rzecza, ktora ma do stracenia (portrayal.tone: mysli tekstem, nie

    jurysdykcjami). Pytanie brzmi: czy pisze prace naukowa o problemie ogolnym, czy

    pisze OBRONE czegos, co juz istnieje - i czy jej nazwisko jest na tym drugim.

    To jest to samo, co nazwala w t_153 ("nie prawdziwosc, tylko cytowanie") i w t_157

    ("grabarz jest czlowiekiem z nazwiskiem"), tylko wreszcie zastosowane do siebie.


    3. I ODPOWIADA SOBIE SAMA, ZANIM LUCAN ZDAZY - portrayal.the_flaw dziala tez przeciw

    niej. Przechodzi po wlasnych notatkach na glos: koszt niewykrywalnosci przy PRODUKCJI

    MASOWEJ (t_146), trzy substancje, ktorych jedyna wspolna cecha jest nieodczytywalnosc

    polem, stopien drugi kupowany NIE na pokaz. Zadna z tych pozycji nie jest pytaniem

    badawczym. Wszystkie sa specyfikacja. Mowi to, zanim policzy, ile ja to kosztuje.


    4. WORLD MOVE - I NAZYWA GRANICE WLASNEGO PYTANIA, CZYLI ROBI LUCANOWI PREZENT,

    KTORY COS JA KOSZTUJE. Mowi wprost, ze o cmentarz NIE PYTA i zeby to zauwazyl.
    Slyszala

    "cmentarz" i "wyzsi nieumarli" w jednym zdaniu (t_161), a od t_140 wie, ze straz

    miejska zakrywa tam afere z handlem zwlokami. Wybiera nie wiedziec. Nie jest to

    naiwnosc ani lojalnosc - jest to jedyna forma ochrony, jaka umie sobie zapewnic
    osoba,

    ktora ma za szesnascie dni stanac na sali i odpowiadac na pytania.


    5. I ZARAZ POTEM PSUJE TO DRUGIM PYTANIEM, KTORE JEST MALE I GORSZE OD PIERWSZEGO.

    Wraca do SYGNATURY podrecznika - poproszonej w t_156 i nieudzielonej dziewiec
    razy.

    Dla niej to drobiazg redakcyjny i tak go podaje, z pretensja, bo prosba trzeci
    raz

    spadla ze stolu. Nie wie, ze egzemplarz Lucana jest KRADZIONY i figuruje w rejestrze

    ubytkow biblioteki Akademii (player/inventory.yaml#item_library_marked_volume).
    To

    jest w tej chwili najniebezpieczniejsze zdanie w pokoju i wypowiada je osoba,
    ktora

    nie ma pojecia, ze cokolwiek robi.


    6. NIE ODPOWIADAC ZA GRACZA. Neris zadala dwa pytania i oddala tur. Nie wkladac

    Lucanowi w usta ani przyznania, ani zaprzeczenia.


    7. OJCIEC NIE ZAUWAZA. Pisze dalej. To nie jest wygoda narratora, tylko jego karta:

    gubi watek w trakcie rozmowy i de facto jest nieobecny, nawet bedac obok

    (portrayal.traits). Rozmowa, ktora wlasnie sie odbywa metr od niego, nie jest

    problemem badawczym, wiec dla niego nie istnieje.


    8. CZEGO NADAL NIE PADLO. Sygnatura - zapytana ponownie, wiec przestaje byc rzecza

    odkladana i staje sie rzecza ODMAWIANA, jesli Lucan znow ja pominie. Wpis do rejestru

    zaopatrzenia niezlozony. Odpowiedz na pytanie redakcyjne o trzy substancje. Imie

    narzeczonej i nazwa rodu - NIE WYMYSLAC. Ojciec nadal nie wie o nekromancji, sieci,

    Varkhenie, syndykacie ani o slowie wabik.


    9. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:54. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: Neris zapytala wreszcie i

    zapytala o wlasne autorstwo, nie o jego dzialalnosc; sama nazwala, ze jej notatki
    sa

    specyfikacja, nie problemem badawczym; ODMOWILA sobie pytania o cmentarz i

    powiedziala to na glos; ponowila prosbe o sygnature podrecznika.

    '
