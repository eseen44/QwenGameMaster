  summary: 'Bez testu. Siedem godzin przy stole, od popoludnia do przed polnoca. Wszystko
    sie udalo i jedna rzecz wyszla inaczej, niz Lucan zakladal - ale wyszla POMIERZONA.
    1. DOKTRYNA KOTWICY PRZYJETA I ZAPISANA. Kotwica przestaje byc wyjatkiem dla Spideya,
    a staje sie ZNACZNIKIEM: dostaje ja sluga, ktorej Lucan nie moze stracic i w ktora
    zamierza inwestowac. Uchyla to standing_decision no_anchoring z tury 078. Doktryna
    jest mechanicznie SLUSZNA - Death_Anchor to wzmacniacz sygnalu i tether trwalosci
    wiezi (retcon_000016), wiec kotwica poprawia dokladnie to, co u swiezego okazu
    jest najgorsze: zasieg i wiernosc. Cena tez jest realna i teraz swiadomie kupiona:
    (a) uszkodzenie propaguje przez kotwice w OBIE strony, (b) sekcja zakotwiczonego
    okazu UJAWNIA Death_Anchor, czyli nazwana technike nekromantyczna, a nie martwego
    robaka - stracony zuk przestal byc smieciem, a stal sie dowodem. 2. TKACZA NIE
    MA NA STOLE. webber_anchored siedzi na swoim posterunku w gornej lace przy garbarni,
    przez pol dzielnicy stad. Rozkaz powrotu poszedl, ale maly pajak idzie wlasnymi
    nogami i bedzie tu nad ranem. Jego robota - ucho, drugi gruczol przedni i porcja
    tlumiaca rozklad - czeka na stole. Nazwa zostaje: od dzis jest TKACZ. 3. SPIDEY
    MA USZY. Godzina pracy, przeszczep przyjmuje sie czysto; material dawcy wyszedl
    z poszarpanej kupki, bo narzad sluchu siedzi w tulowiu, a nie w skrzydlach - cme
    z urwanym skrzydlem stac na oddanie ucha. 4. ZUK: KOTWICA I USZY. spy_beetle_01
    dostaje Death_Anchor i przeszczep. Roznica w laczu jest wyczuwalna od razu - z
    tego samego pokoja sygnal jest twardszy niz z reszty serii. To najlepszy mozliwy
    posterunek dlugoterminowy w calym stanie posiadania: zuk je ROZKLAD, wiec przetrwa
    tygodnie w zamknietym budynku, w ktorym nie ma na co polowac. 5. POMIAR DNIA -
    CO UCHO CMY NAPRAWDE SLYSZY. Cma nie ma uszu do sluchania ludzi. Ma je do lapania
    NIETOPERZA, czyli jest nastrojona wysoko, daleko ponad ludzki glos. Przeszczep
    dziala, narzad zyje i reaguje, tylko odbiera nie to pasmo. Praktycznie: sluga
    wie, ZE ktos mowi, ilu ich jest, w jakim rytmie, gdzie pada nacisk i kiedy pada
    rzecz ostra - klucz, zgrzyt krzesla, podniesiony glos, brzek. NIE dostarcza SLOW.
    To nie jest porazka przeszczepu, to zla nastrojona membrana, i Lucan wie o tym
    dlatego, ze wlasnie to zrobil, a nie dlatego, ze ktos mu powiedzial. 6. MATERIAL
    SAM POKAZUJE POPRAWKE. Narzad sluchu nastrojony na LUDZKIE pasmo maja owady, ktore
    sluchaja WLASNEGO spiewu - swierszcze i pasikoniki, u nich ucho siedzi w przedniej
    nodze. Koniec sierpnia, laki za murem graja calymi nocami, a posterunek Tkacza
    stoi doslownie w gornej lace. Material jest darmowy, legalny, nudny i osiagalny
    tej samej nocy. Cma zostaje przy tym doskonalym czujnikiem OSTRZEGAWCZYM - slyszy
    to, czego czlowiek nie slyszy w ogole. 7. DRUGA WARSTWA NIE ZNIKNELA. Najlepsze
    ucho nie poszerza rury. U Spideya to nie boli: jego kanal niesie pozyczony zmysl
    przy skupieniu, wiec Lucan JUZ TERAZ moze przez niego sluchac pokoju. U zuka i
    serii zostaje minimal_status plus pozyczenie zmyslu z bliska - kotwica to poprawia,
    ale nie zamienia w telefon. 8. CMY WSTAJA. Cztery cale okazy plus zawisak, jeden
    gest kazdy, bez odczynnikow i bez kosztu rezerwy. Cztery male, nocne, ciche latacze
    bez rozkazu. 9. ZAWISAK - TRZY WARSTWY NARAZ. Death_Anchor, fiolka przewodzaca,
    porcja tlumiaca rozklad. Przewodzenie robi z niego nie tylko kuriera, ale LATAJACY
    PRZEKAZNIK: moze zawisnac pod oknem i skrocic droge sygnalu zamiast tylko przeniesc
    rzecz. Cena jest jednoznaczna - fiolka byla JEDNA, wiec lacze Lucan-Spidey zostaje
    na swoich siedemdziesieciu procentach na zawsze albo do nastepnej dostawy. Tlumienie
    rozkladu zdejmuje z niego trzydniowa smycz: zawisak moze siedziec na zamknietym
    posterunku, nie wychodzac po cukier. 10. PORCJE TLUMIACE - DWIE ZUZYTE, JEDNA
    ODLOZONA. Zawisak i Spidey dostaja swoje; trzecia lezy zawinieta i podpisana dla
    Tkacza, do rana. 11. PAJAKI PIWNICZNE - JEDEN JEST JUZ NA MIEJSCU, DWA TRZEBA
    ZANIESC. spy_cellar_spider_06 siedzi w piwnicy gildii od wczoraj, wiec cela jest
    obsadzona od zaraz. Pozostale czekaja w baszcie i tu wychodzi granica pasma, nie
    odleglosci: rozkaz "przejdz przez pol miasta, wejdz do gildii i zajmij POKOJ NARAD"
    jest dla swiezego okazu z minimal_status calkowicie nieczytelny. Ida w pudelku,
    w kieszeni Lucana, kiedy wroci spac do celi. Transport to zero ryzyka - mieszczanin
    z pudelkiem to najnudniejszy widok w Lumarii. 12. RZECZ, KTORA TRZEBA POWIEDZIEC
    NA GLOS. Pajak alarmowy do gabinetu Seraphine jest UZGODNIONY - sama przyjela
    oba kanaly alarmowe w turze 070 i czeka na okaz. Pokoj narad gildii nie jest uzgodniony
    z nikim. To jest pluskwa w sali, w ktorej za dwa tygodnie bedzie sie toczyc przesluchanie
    Lucana, postawiona w instytucji, ktora go w tej chwili ukrywa, karmi i oslania.
    Jesli kiedykolwiek zostanie znaleziona, nie bedzie to wykroczenie przeciw miastu
    - bedzie to rzecz zrobiona SERAPHINE, a od dzis kazdy taki okaz nosi w sobie kotwice,
    ktora mowi, czyj jest. 13. STAN. Zadna z tych rzeczy nie kosztowala energii -
    Lucan konczy na 14,5 z 15. Kosztowal czas: siedem godzin przy stole. Kolejka na
    jutro rano: Tkacz (ucho, drugi gruczol, porcja), swierszcze z laki, gruczoly przednie
    dla trzech pozostalych sieciarzy.'
  new_decision: Jest przed polnoca. Stol jest zastawiony robota zrobiona, dwa pajaki
    czekaja w pudelku, a lampa w baszcie moglaby pracowac przez noc zamiast stac ciemna.
    Lucan moze isc spac do celi w gildii i po drodze obsadzic dwa pomieszczenia, moze
    zostac i postawic lampe ze sloikiem, moze wyslac sieciarzy albo nowe cmy po swierszcze
    z laki - albo poczekac na Tkacza i skonczyc robote nad ranem. Jutro sa Boros i
    Mara.
  operations:
  - *id002
