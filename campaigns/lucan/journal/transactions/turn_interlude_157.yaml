  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cztery minuty, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Dwa ruchy, oba domykaja rzeczy wiszace od kilku tur.

    1. GRABARZ JAKO PROBA KONTROLNA JEST DOKLADNIE TA RZECZA, KTOREJ OJCIEC PRZED

    MINUTA POWIEDZIAL, ZE NIE ISTNIEJE. W t_156 sam nazwal luke: nikt nie ustalil,
    ile

    energii smierci jest normalne u grabarza, bo nikomu sie nie oplacilo zmierzyc.

    Lucan podstawia punkt odniesienia. To nie jest zart mimo tego, ze zostal powiedziany

    jako zart - to jest brakujaca polowa kazdego pomiaru kontrastowego.

    2. UKLAD, Z KTOREGO STRONA PRZECIWNA NIE MA WYJSCIA. Jesli przyrzad swieci na

    licencjonowanym miejskim grabarzu, to albo przyrzad nie rozdziela (i kryterium

    church_position z necromancy-law#construct_boundary upada jako narzedzie

    klasyfikacji), albo Kosciol musi na glos orzec, ze skazony jest pracownik magistratu

    wykonujacy obowiazek nalozony przez to samo miasto. Trzeciej odpowiedzi nie ma.

    Zbudowane wylacznie z ich wlasnego urzadzenia i z kanonu podanego przez gracza
    w

    t_156 (grabarze nasyceni stale, nie sa martwi).

    3. OJCIEC ROZSZERZA TO NATYCHMIAST I PRZESTAJE ROZMAWIAC, ZACZYNA PROJEKTOWAC.

    Jeden grabarz to anekdota - to jego wlasny argument z t_021, ktorym Lucan przestawil

    mu zegar. Chce RZAD KONTROLNY: grabarz, ktos od nastawiania kosci albo uzdrowiciel,

    rzeznik, i jesli da sie dostac - trupojad. Wszystko mierzone tym samym przyrzadem,

    tego samego dnia, przez te sama osobe, z zapisem. To jest tryb z jego karty

    (likely_hook: prawdziwie nowatorski problem badawczy) i ten sam ruch co przy poroscie

    w concealment-materials.yaml.

    4. STOPIEN DRUGI PRZYJETY BEZ CIEKAWOSCI - I TO JEST SKUTEK KARTY, NIE LASKI.

    Polityka ojca nie interesuje i sie w niej nie orientuje, wiec "kupujemy stopien
    drugi"

    odklada jako SPECYFIKACJE, nie jako oswiadczenie o wrogu. Pytanie "dla kogo" nie

    wraca po raz trzeci. Zapalnik znow nie zostal dotkniety.

    5. ALE KWALIFIKATOR "NIE NA POTRZEBE POKAZU" MA TWARDA KONSEKWENCJE WARSZTATOWA
    I

    OJCIEC WYCIAGA JA OD RAZU. Sordina i porost sa TRWALE - wchodza w symbioze, wszczepia

    sie raz, rosna z okazem, nie da sie ich zdjac

    (worlds/solmara/lore/concealment-materials.yaml: sordina "TRWALA, wchodzi w symbioze";

    lichen "TRWALY, wszczepiany raz"). Plyta z Concha surda jest zdejmowana, wiec
    ta jedna

    jest neutralna. Wniosek: okazy pokazowe i okazy operacyjne musza byc DWIEMA ROZNYMI

    BUDOWAMI, a decyzja ktora sztuka jest ktora musi paść PRZED rozpoczeciem pracy,
    nie

    po. Nie da sie zrobic czterech identycznych i wybrac potem.

    6. RACHUNEK GODZIN, WYLACZNIE Z ISTNIEJACYCH LICZB. Wabik pokazowy ok. 4 h za
    sztuke

    (retcon_000021 + retcon_000024). Okaz operacyjny to te same 4 h plus wszczepienie

    porostu ok. 12 h, plus plyta z muszli 16 h za pierwsza i 6-8 h za kazda nastepna,

    bo forma zostaje. Sordina zero - nakladana raz, bez kosztu. Energii nie kosztuje
    nic

    z tego (retcon_000017: trwale ulepszenie slugi kosztuje CZAS PRZY STOLE, nie energie).

    Zaden z tych kosztow nie jest nowy i zaden nie jest wymyslony na te ture.

    7. WORLD MOVE A - NERIS ZACZYNA PISAC I ZATRZYMUJE SIE PIERWSZY RAZ TEGO WIECZORU.

    Rzad kontrolny to papier, na ktory czeka od siedmiu tygodni, wiec siega po pioro

    odruchowo (portrayal.the_absorption). Potem przerywa w polowie slowa - bo wszystko,
    co

    dzisiaj napisala albo powiedziala, policzyla dopiero potem, i wlasnie to zauwazyla.

    8. WORLD MOVE B - I NAZYWA CENE, KTORA WIDZI TYLKO ONA, BO JEJ SIE TO WLASNIE

    ZDARZYLO DWA RAZY. Grabarz nie jest pozycja w tabeli. Grabarz jest CZLOWIEKIEM
    Z

    NAZWISKIEM, ktore stanie w dokumencie o energii smierci, w miescie, w ktorym obie

    strony sporu szukaja pretekstu (t_138, t_140). Ona zostala nazwiskiem w cudzym

    dokumencie dwa razy w ciagu godziny - jako doktorantka (t_147) i jako autorka

    (t_152) - i dlatego to widzi. Mowi to niezrecznie, za ostro i za pozno

    (portrayal.the_social_gap), i konczy pytaniem, ktore oddaje decyzje Lucanowi:
    czy ona

    ma to zapisac.

    9. CZEGO NIKT NIE ZAPYTAL. Po co Lucanowi okazy, ktorych nie pokazuje. Neris ma
    ten

    wniosek gotowy od t_143 ("pajak nie jest jedynym okazem - sa albo beda zuki i
    cmy, i

    komus zalezy, zeby ich nie bylo widac") i wlasnie dostala trzecie potwierdzenie
    wprost.

    Nie zapytala ani razu. Nie zapytala tez o zwloki z rejestru (t_145, t_149, t_154).

    10. CZEGO NIE PADLO. Trzecia substancja (lichen_speculans) NADAL nie wymieniona
    przez

    ojca w swiecie - Lucan zna ja tylko z warstwy planowania, nie z tej rozmowy; przy

    liczeniu godzin operacyjnych to ma znaczenie. Sygnatura podrecznika nieudzielona.
    Wpis

    do rejestru zaopatrzenia niezlozony. Ojciec nadal nie wie o nekromancji, sieci,

    Varkhenie, syndykacie ani o slowie wabik.

    11. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:12. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: grabarz jako proba kontrolna

    przyjety i rozszerzony przez ojca do rzadu kontrolnego; stopien drugi wybrany
    jako

    poziom zakupu, z wylaczeniem okazow pokazowych; okazy pokazowe i operacyjne to
    dwie

    rozne budowy, decyzja przed praca; Neris zatrzymala sie przed zapisaniem i pyta,
    czy

    ma zapisac; nazwisko grabarza nazwane jako cena.

    '
