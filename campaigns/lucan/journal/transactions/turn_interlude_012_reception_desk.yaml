  perspective: pc_lucan
  summary: 'Recepcjonistka (bez imienia w aktach, po prostu urzednik) sprawdza rejestr.
    Operacja cmentarna jest zalogowana, ale oznaczona czerwona flaga: ''oczekuje przegladu
    kierownictwa'', nie standardowe rozliczenie. Wyplaca Lucanowi zwykly stypendium
    polowe za dni pracy (15 srebra) - to jest automatyczne i bezsporne. Ale pelna
    nagroda/uznanie za rozwiazanie kryzysu cmentarnego nie jest do wziecia dzis przy
    okienku: skala sprawy (starozytny nieumarly, pieczecie, zaginiecia) oznacza ze
    zdecyduje o tym kierownictwo gildii, prawdopodobnie w tym samym kontekscie co
    nadchodzace przesluchania instytucjonalne. Boros wzdycha - spodziewal sie tego,
    ale i tak jest zawiedziony. Mara zauwaza sucho, ze to akurat dobra wiadomosc:
    ''przynajmniej nie zamietli tego pod dywan''. Recepcjonistka dodaje, ze ktos z
    kierownictwa prawdopodobnie wezwie Lucana na rozmowe, gdy tylko harmonogram sie
    ustali - nie podaje kiedy.'
  operations:
  - *id002
  new_decision: Reka gildii jest teraz formalnie w grze - nagroda za Akt 2 zleje sie
    z nadchodzacym przesluchaniem instytucjonalnym, nie zalatwi sie osobno. Lucan
    ma teraz 15 srebra wiecej w kieszeni i cala reszte dnia przed soba - do czego
    z notatnika (prawnik, legalny status Spideya, targ, badania, Rusk...) siega teraz?
