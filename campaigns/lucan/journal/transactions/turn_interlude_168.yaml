  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cztery minuty, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Zamkniecie wieczoru i odpowiedz na jedyny zarzut, ktory dzis

    przetrwal.


    1. TO NIE JEST PRZEMILCZENIE I NA TYM POLEGA CALA ROZNICA. Neris pytala, jak napisac

    tekst, ktory czegos NIE MOWI, i przetrwa znalezienie tego miejsca. Odpowiedz gracza

    omija pytanie w jedyny sposob, ktory dziala: nie pisze sie luki, pisze sie MNIEJSZE

    ZDANIE, ktore jest kompletne. Tekst, ktory czegos nie wymienia, nie ma dziury
    -

    ma zakres. Dziure ma dopiero tekst, ktory cos wymienia i zaraz z tego wyjmuje
    wyjatek.


    2. ZAPIS ZMIENIA KSZTALT - Z WYLICZENIA NA WARUNEK NADRZEDNY. Nowa postac granicy:

    od gory stoi warunek zakazujacy TRYWIALIZOWANIA NEKROMANCJI NA LUDZIACH i

    BEZCZESZCZENIA ZWLOK. Wyzsi nieumarli NIE sa wyszczegolnieni. "Nigdy tlum" zostaje
    -

    gracz go nie uchylil.


    3. I TO ROZWIAZUJE NARAZ TRZY RZECZY, KTORE PRZEZ OSIEM TUR SIE ZE SOBA BILY.

    (a) DZIURA SPRZATAJACYCH (t_166) znika, bo tekst nie siega tam, gdzie nie wymienia.

    (b) KOSCIOL DOSTAJE WIECEJ, NIZ MIAL DOSTAC - profanacja i cialo ludzkie to jest

    DOKLADNIE jego wlasne kryterium (necromancy-law#church_position.tendency: uzycie

    energii smierci, martwa tkanka, PROFANACJA, skazenie duchowe). Warunek nadrzedny
    mowi

    jego jezykiem, wiec czyta sie jak wygrana, nie jak ustepstwo.

    (c) VARKHEN PRZESTAJE BYC WPISANY DO PRZEPISU. Poprzedni ksztalt (t_160) zakazywal

    ostro kontroli nad wiekszymi nieumarlymi, czyli celowal wprost w to, co Lucan
    trzyma

    w piwnicy gildii. Nowy nie wymienia go w ogole. Nie jest to legalizacja - to jest

    brak przedmiotu, czyli ta sama figura, na ktorej stoi cala jego obrona

    (act-03-defence#two_contradictory_defences: obie linie mowia "przedmiotu sprawy
    nie ma").

    WIDZI TO WYLACZNIE LUCAN.


    4. CENA, KTOREJ NIE ZDJETO. Warunek nadrzedny obejmuje CIALO LUDZKIE i PROFANACJE.

    Praca na cmentarzu jest praca na ludzkich zwlokach. Zapis nie kryminalizuje jej

    wprost, ale tez nie zostawia jej czysto - zostawia ja w gestii tego, kto zdefiniuje

    "trywializowanie" i "bezczeszczenie". Slowa nieostre sa oslona TEGO, KTO TRZYMA
    FORUM

    (#legal_doctrine_stress_test, czwarta dziura). Zapisac jako otwarte.


    5. ODLOZENIE JEST WLASCIWYM RUCHEM I NIE JEST UNIKIEM. Instrument zgody, brzmienie

    warunku nadrzednego i klauzula czytelna dla Kosciola to trzy rzeczy, ktorych ani

    Lucan, ani Neris nie umieja napisac - i obaj eksperci sa juz zakontraktowani

    (prawnik t_102, kaplan przez Kesza t_113). Dokument jest wersja robocza (t_161).

    Terminy pozwalaja: seminarium 13 dni, dysputa 14, przesluchanie 13.


    6. WORLD MOVE A - NERIS PRZYJMUJE TO OD RAZU I ROZPOZNAJE FIGURE, BO TO JEST JEJ

    DOMENA. Roznica miedzy tekstem niekompletnym a tekstem waskim jest roznica

    redakcyjna, nie moralna, wiec widzi ja natychmiast i nie musi sobie niczego

    wybaczac. Pierwsza rzecz tego wieczoru, ktora nie kosztuje jej nic.


    7. WORLD MOVE B - I ZOSTAJE Z JEDNA RZECZA NIEZALATWIONA, KTOREJ JUZ NIE PONAWIA.

    Sygnatura podrecznika - dziesiaty raz bez odpowiedzi. Przestala pytac. To NIE
    jest

    zamkniecie sprawy: osoba, ktora sama wpisuje gosci do ksiegi odwiedzin

    (portrayal.guest_book_habit) i mysli przypisem, ma teraz odeslanie do dziela,
    ktorego

    nie moze zacytowac, w pracy majacej byc bardzo glosna. Egzemplarz jest kradziony
    i

    figuruje w rejestrze ubytkow biblioteki trzydziesci krokow stad. Nie odpalac;
    trzymac

    jako zywa ekspozycje.


    8. WORLD MOVE C - OJCIEC KONCZY WIECZOR TAK, JAK GO PRZEZYL: NIE ZAUWAZAJAC GO.

    Zostaje przy rejestrze, ma termin na okazy, ma zapis do akceptacji i ma prosbe
    o

    pokazanie zawisaka. Nie zarejestrowal, ze cokolwiek waznego zdarzylo sie miedzy

    synem a kobieta, ktorej dyktowal.


    9. CZEGO NADAL NIE PADLO. Sygnatura. Odpowiedz na pytanie redakcyjne o trzy

    substancje (gdzie w tekscie maja stanac). Wpis jednostki badawczej do rejestru

    zaopatrzenia. Imie narzeczonej i nazwa rodu - NIE WYMYSLAC. Ojciec nadal nie wie
    o

    nekromancji, sieci, Varkhenie, syndykacie ani o slowie wabik.


    10. STAN. Wieczor dnia trzeciego, laboratorium profesora Veyra, 19:12. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: granica przybiera postac
    warunku

    nadrzednego - zakaz trywializowania nekromancji na ludziach i bezczeszczenia zwlok,

    bez wyszczegolniania wyzszych nieumarlych, z zachowanym "nigdy tlum"; nie jest
    to

    przemilczenie, tylko wezszy zakres, wiec zarzut o cytowalnosc upada; brzmienie

    odlozone do przyjscia prawnika i kaplana.

    '
