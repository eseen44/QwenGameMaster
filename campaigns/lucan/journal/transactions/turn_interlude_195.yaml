  summary: 'Bez testu - interludium, roll_policy disabled. Trzy minuty, zero energii,
    zero wydane.

    Powitanie i nic wiecej: Lucan dochodzi do stolu wagowego i mowi "dzien dobry".


    0. ADRESAT SPRAWDZONY W participants, NIE ZGADNIETY (retcon_000054). W scenie
    sa trzej:

    Lucan, Kesz i wagowy. "Dzien dobry" na koncu czterdziestu krokow i "panu" w liczbie

    pojedynczej to powitanie przy stole, a nie kwestia do Kesza, z ktorym Lucan rozmawia

    nieprzerwanie od dwoch tur. Nikt nowy nie jest dopisywany do sceny.


    1. KARTA PRYNCYPALA BYLA STARA I ZOSTALA SPRAWDZONA PRZED PIERWSZA KWESTIA

    (retcon_000121). lifecycle.last_confirmed_event_id: event_turn_interlude_110,
    przy

    last_event_id 194 - osiemdziesiat cztery tury luki. Recall na "wagowy", "syndykat",

    "pryncypal" i "Ilva" nie zwraca po t_113 NICZEGO. Jedyna rzecz mlodsza od karty
    to

    punkt 3 z t_113 i ona zostaje wazna. Karta uzupelniona po tej scenie.


    2. METODA Z KARTY JEST JUZ NIEAKTUALNA - I WYNIKA TO Z PLIKOW, NIE Z WYGODY NARRATORA.

    portrayal#method mowi "milczy przez cala rozmowe, rozmowe i nacisk oddaje Ilvie".

    To jest opis z t_104 i t_107, czyli SPRZED momentu, w ktorym Lucan trafil w pryncypala

    (fact_weigher_was_addressed_directly_and_correctly, t_107). Od t_109 mowi sam:
    rozbil

    inwentarz na trzy tempa, przeliczyl na glos wojne z Kosciolem w t_110 i wycenil
    kanal

    ostrzegawczy jednym zdaniem w t_113. Milczenie bylo funkcja nierozpoznania, nie

    charakteru. Mowi wiec - krotko, bo to jest jego rejestr.


    3. GODZINA. Jest 13:00 i poranek sie skonczyl. Czlowiek, ktory caly dzien siedzi
    przy

    wadze uchylnej z probierzem i kamieniem probierczym, ma dokladnie jeden sposob
    mowienia

    o tym, jak mu poszedl - i uzywa go. To nie jest przytyk ani wychwycenie Lucana
    na

    pomylce; to jest jedyny slownik, jaki ten czlowiek ma.


    4. KESZ OBOK - I TO JEST INFORMACJA DLA PRYNCYPALA, NIE DLA LUCANA. Kesz jest
    jego

    stalym klientem (retcon_000124: przesiadka po strone Lucana NIE zerwala tej relacji,

    protect_the_room_first zostaje w agendzie). t_194 zostawilo to otwarte wprost:

    "nie jego jest ostatnie slowo, czy pryncypal ja chce". Pryncypal widzi wiec wlasnego

    prawnika, ktory nadchodzi Z KIMS, a nie PO NIEGO. Odnotowuje jednym spojrzeniem
    i nie

    komentuje - agenda#judge_lucan_by_what_he_declines_not_by_what_he_offers. Kesz
    zostaje

    pol kroku z tylu, bo to jest stol jego klienta.


    5. WORLD MOVE - ZWYKLY INTERES PRZY WADZE, BEZ FABULY. Przy stole konczy sie cudza

    sprawa: ktos przynosi drobiazg do zwazenia, dostaje liczbe i odchodzi. Wagowy
    odklada

    probierz i ma wolne rece, kiedy Lucan staje przed nim. Nikt nie robi z tego ceremonii

    ani zagrozenia.


    6. CZEGO NARRATOR TU NIE ROBI. Nie wprowadza Ilvy Rennat - zaden plik nie stawia
    jej

    przy stole na targu, a pusta lista participants nie dowodzi tez, ze jej nie ma;
    po

    prostu jej nie gram (retcon_000054). Nie przywoluje czwartkowej dostawy materialow

    z t_109, bo state/time.yaml ma calendar: null i ZADEN plik nie mowi, ktory to
    dzien

    tygodnia - narrator kalendarza nie ustanawia. Nie kaze pryncypalowi upominac sie
    o

    kanal ostrzegawczy: t_113 punkt 3 mowi wprost, ze przyjal obietnice BEZ nacisku,
    nie

    zadal terminu i nie targowal sie o nazwisko. Nie wycenia niczego za niego

    (agenda#set_the_number_himself). Nie stawia terminu, nie tworzy zegara, nie zapowiada,

    ze cos pojdzie zle, i nie dokleja Lucanowi ani jednego zdania poza tym, co powiedzial.


    7. STAN. Czwarty dzien interludium, targ, stol wagowy. Energia i integralnosc
    bez zmian

    poza regeneracja. Zegary bez ruchu poza uplywem czasu. W kieszeni pudelko z pajakiem,

    w rekach atlasy balwierza, tom z sygnatura i dyktando Mary; pod straganem oplacona

    skrzynka szkla. Otwarte wobec tego czlowieka i niezalatwione: kanal ostrzegawczy
    warty

    dobe przewagi, odpowiedz, co Lucan daje poza zlotem, oraz to, czy pryncypal chce
    widziec

    swojego prawnika naprzeciw Strazy. Nic z tego nie zostalo dzis ruszone. Zaden
    termin

    nie powstal.

    '
