outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  summary: 'Bez testu - dziesiec minut, zero energii. Gracz swiadomie NIE interweniuje
    i czeka

    na rozwoj wypadkow, wiec swiat sie rusza sam. Karta Neris mowi "ZYWA EKSPOZYCJA
    -

    nie odpalac automatycznie", dlatego to nie detonuje; przesuwa sie o jeden szczebel.


    1. NERIS DOSTAJE SYGNATURE I TARCIE MIEDZY NIMI ZNIKA. Prosba z dziesieciu tur

    (od t_156) jest zamknieta, i to bez zadnej ceny ze strony Lucana - wzieła ja sama

    z karty katalogowej. Dla niej sprawa jest skonczona: ma poprawny przypis.


    2. ALE KARTA KATALOGOWA PODAJE DWIE RZECZY, NIE JEDNA. Razem z sygnatura stoi

    adnotacja, ze egzemplarza nie ma na polce. To NIE jest odkrycie kradziezy - tom
    moze

    byc wypozyczony, w oprawie, zalozony. Neris nie podejrzewa niczego i nie ma powodu;

    traktuje to jako klopot bibliograficzny.


    3. I WLASNIE DLATEGO JEST GROZNA - BO ROBI TO, CO ROBI UCZONA, A NIE TO, CO ROBI

    SLEDCZY. Nie zamierza poprzestac na sygnaturze: chce PRZECZYTAC ustep, ktory cytuje,

    zanim go odesle (portrayal.tone - mysli tekstem, nie zaufaniem). Zapowiada, ze
    o

    pierwszym swietle zapyta w bibliotece, gdzie wolumin sie podzial. To pytanie otwiera

    rejestr ubytkow Z DATA. WORLD MOVE - i nie odpalil go narrator, odpalila go jej

    kompetencja przy graczu, ktory postanowil nie przerywac.


    4. TWARDY TERMIN: PIERWSZE SWIATLO. Lucan ma jedna noc, nie wieczor. Wolumin lezy
    w

    container_wall_hideout (loc_city_wall_hideout, wlazem od kanalu), wiec

    Akademia -> schowek -> Akademia to pelna noc logistyki.


    5. DECYZJA O ODDANIU NIE JEST NOWA - t_086 ustawil disposition

    keep_then_return_after_study. Dzisiaj dostala TERMIN, i to zmienia jej charakter:

    dopoki nikt nie zapytal, tom moze wrocic jako ZNALEZIONY. Jesli Neris zapyta

    pierwsza, ubytek ma date i nazwisko pytajacego, a tom oddany nastepnego dnia nie

    jest znaleziony - jest ODDANY. Roznica miedzy tymi dwoma slowami to cala wartosc

    tego, ze Lucan trzymal go dotad w murze.


    6. "SZYBKO PRZEPISAC" DZIALA DLA TRESCI, NIE DLA MARGINALIOW - i to jest

    informacja, ktorej gracz potrzebuje do swiadomego wyboru (narrator.md). Tresc
    jest

    licencjonowana i recenzowana, czyli faktycznie jest gdzie indziej. Marginalia
    NIE

    SA - to proby balwierza pisane ta sama reka co w atlasach: kto, kiedy, jak dlugo
    pod

    woda, czy wrocil, i wiekszosc konczy sie nie. Oddanie woluminu oddaje TE KARTKI

    Akademii czternascie dni przed wezwaniem Lucana. Zostawienie ich sobie to wyrwanie

    albo przepisanie recznie - godziny, nie minuty.


    7. PORTIERNIA - drugi szczebel tej samej ekspozycji, bez detonacji. Wychodza razem

    po zmroku, a cieć nie umie Lucana opisac (curse_memory_trap) i doskonale pamieta

    wlasny wniosek: ze ten ktos przychodzi wieczorami do Neris Aldhen. Dostal wlasnie

    potwierdzenie wzrokowe. Neris mowi mu dobry wieczor po imieniu, czego nie robi
    nikt

    inny - jest wiec jedyna osoba, ktorej cieć chetnie odpowie na pytanie, i jedyna,

    ktora moze zapytac, dlaczego spal na stanowisku w dzien.

    '
