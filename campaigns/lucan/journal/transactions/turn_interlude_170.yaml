  new_decision: 'Noc jest jedynym zapasem, jaki zostal, i trzeba ja rozdysponowac
    teraz. Wolumin

    lezy w schowku w murze, marginalia balwierza nie sa tresci licencjonowana i nie

    przepisza sie w kwadrans, a o pierwszym swietle Neris zada w bibliotece pytanie,

    po ktorym "znaleziony" przestaje byc dostepnym slowem. Lucan moze pojechac po
    tom

    i zdazyc go podlozyc przed swiatem, moze zdjac z Neris ten poranny krok, zamiast

    scigac sie z nim, albo moze uznac, ze rejestr ubytkow z data jest cena, ktora

    warto zaplacic za spokojna noc i porzadne przepisanie.

    '
