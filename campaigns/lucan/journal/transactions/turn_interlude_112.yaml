outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut w
    drzwiach, zero energii. 1. ZAKONY MIECZOWE - ODPOWIEDZ PRYNCYPALA JEST KROTKA
    I JEST ODMOWA Z UZASADNIENIEM, KTORE LUCANOWI SIE PRZYDA. Syndykat ma dzwignie
    na POJEDYNCZYCH ludzi w zakonach - kwatermistrz z dlugiem, wyrzucony brat, kontrakt
    ochronny oplacony nie tam, gdzie trzeba - ale NIE MA kanalu do komandora, i to
    jest roznica miedzy szantazem a zleceniem. Powod jest w tym, czego zakony sie
    boja: byc uzytym jako czyjas jednorazowa palka (faction_lumaria_martial_orders.fears).
    Prosba przyniesiona ich reka jest zatruta w chwili dotkniecia. 2. I ZARAZ POTEM
    RZECZ, KTORA JEST DLA LUCANA LEPSZA NIZ KONTAKT: pryncypal mowi, ze tego zlecenia
    nie trzeba nikomu wciskac. Powstrzymywanie niekontrolowanych nieumarlych i zbrojnego
    chaosu jest WPISANE w to, czym zakony chca byc (faction_lumaria_martial_orders.interests),
    a kontrakty ochronne sa ich chlebem. Nie trzeba ich przekonywac do roboty - trzeba
    im podac ja tak, zeby wygladala na ich wlasna. 3. TRZY DROGI, KAZDA Z NAZWANA
    CENA. (a) PRZEZ SYNDYKAT - odpada, patrz wyzej. (b) PRZEZ GILDIE - wlasciwa i
    najtansza; gildia kontraktuje zakony rutynowo. CENA: kontrakt jest PAPIEREM. Karta,
    komandor z nazwiska, zakres, data - czyli operacja cmentarna staje sie udokumentowana
    dokladnie w tygodniach, w ktorych Lucan idzie na przesluchanie, a jego nazwisko
    wchodzi do niej jako powod. (c) TRZECIA DROGA, KTORA WYKLADA KESZ, BO JEST PRAWNIKIEM,
    A NIE PRZYJACIELEM: komandor Veyr. W tym miescie zawsze jest jakis Veyr w odpowiednim
    fotelu (faction_house_veyr_main_line). Ta droga jest natychmiastowa, nie zostawia
    sladu w gildii i jest dokladnie ta smycza, z ktorej Lucan zazartowal piec minut
    wczesniej. 4. ZART O WUJU NIE PRZESZEDL NIEZAUWAZONY. Lucan pierwszy raz sam,
    z wlasnej woli, przyznal przy obcych, ze ma w glownej linii rodu konkretnego czlowieka
    - dotad rod byl dla niego abstrakcyjnym systemem foteli. Pokoj tego nie komentuje.
    Kesz to zapamietuje, bo w jego fachu rodzina jest kategoria prawna. 5. KAPLAN
    - I TU KESZ SAM SIE ZGLASZA, BO SLUZY TO JEMU. Nie mowi, ze zna kaplana. Mowi,
    ze wie, jak sie do takiego czlowieka podchodzi, i ze zorganizuje spotkanie, jesli
    Lucan tego chce. Nie dodaje, ze kaplan jest jego wlasnym problemem; obaj to wiedza
    od kwadransa i zaden nie dopowiada. 6. "GILDIA JESZCZE NIE WIE, ZE Z WAMI WSPOLPRACUJE"
    - pryncypal kwituje to jednym zdaniem, ze wiekszosc jego klientow nie wie i wszystkim
    jest z tym lepiej. Ale Kesz odnotowuje na glos, ze to dziala tylko dopoki nie
    ma kontraktu na papierze, a droga (b) papier tworzy. 7. WORLD MOVE - MARA STOI
    W DRZWIACH I MOWI "IDZIEMY?". Slyszala cala rozmowe: zapowiedz wojny z Kosciolem,
    sprzedaz wiedzy wyprzedzajacej, obietnice przestrzeni przy cmentarzu i teraz plan
    sciagniecia zakonu do roboty, o ktorej gildia jeszcze nie wie. Nie skomentowala
    ani jednej z tych rzeczy przy obcych. Wyjdzie z nim na targ i tam juz obcych nie
    bedzie. 8. STAN. 16:20 dnia trzeciego. Energia 7.8 z 15, integralnosc 19 z 19,
    bez warunkow. Pierwsza rata w kieszeni, przepustka nietknieta, sprawa zamknieta,
    drzwi otwarte, a przed Lucanem trzy decyzje na wyjsciu: ktora droga po zakon,
    czy przyjac spotkanie z kaplanem i co powiedziec Marze na ulicy.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Trzy drogi po zakon mieczowy: przez gildię (papier, kontrakt, nazwisko
    Lucana w aktach przed przesłuchaniem) albo przez komendanta Veyra (natychmiast,
    bez śladu, smycz) - syndykat odpada. Kesz oferuje zorganizowanie spotkania z kapłanem.
    Mara czeka w drzwiach.'
