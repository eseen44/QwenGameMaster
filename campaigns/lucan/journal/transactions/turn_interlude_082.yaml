  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - handlarz starzyzna jest zwyklym czlowiekiem bez karty, a to
    interludium. Dwadziescia dwa srebra wychodza z sakiewki, zostaje czterdzieci dwa.
    Do schowka wjezdzaja "Uprzejmosci", odpis brulionu formul prawnych i dwie akademickie
    odbitki - Kolma i Aldhen. 1. HANDLARZ POKAZUJE SPIS BEZ WAHANIA I JEST NIM WRECZ
    ZADOWOLONY. npc_hesk_dorn, straganiarz ze starzyzna, prowadzi go od lat jako czysta
    ksiegowosc: klient pyta o cos, czego nie ma, on notuje, zeby wiedziec, co odlozyc
    z nastepnej partii. Nikt go nigdy o ten spis nie zapytal, wiec pytanie odczytuje
    jako uznanie dla rzemiosla. Zapisy nie sa tytulami - klienci tytulow nie znaja
    - sa OPISAMI, czesto tym samym opisem powtorzonym roznymi slowami. 2. WIEKSZOSC
    SPISU JEST NUDNA I TO JEST INFORMACJA. Studenci Akademii pytaja o tanie odpisy,
    bo biblioteka nie wypozycza na miasto. To wyjasnia caly wolumen obrotu i nie znaczy
    nic wiecej. 3. WPIS PIERWSZY, POWTARZAJACY SIE - "COS O TYM, ZEBY MIESO SIE NIE
    PSULO". Trzy albo cztery razy w ciagu ostatnich miesiecy, rozni ludzie, ta sama
    parafraza, zaden nie umial powiedziec, o jaka ksiazke chodzi. Hesk uwaza, ze to
    rzeznicy. To nie sa rzeznicy - rzeznik wie, jak sie nazywa peklowanie. Siatka
    Orena zostala rozbita, HANDEL NIE, a handel kupuje wiedze najtaniej, jak moze.
    4. WPIS DRUGI, POJEDYNCZY I NAJGORSZY - "ZNAKI, KTORE TRZYMA SIE POD KAMIENIEM".
    Jeden czlowiek, jeden raz, pytal o cokolwiek o pieczeciach i granicach konsekracji.
    Hesk pamieta go slabo, bo pytal cicho i nie targowal sie. Lucan ma na glowie trzy
    pieczecie Varkhena i kaplana od pieczeci - i wlasnie dowiedzial sie, ze ktos jeszcze
    w Lumarii szuka tego samego na targu ze starzyzna. 5. WPIS TRZECI, MIERZALNY -
    CHLOPIEC NA POSYLKI W LIVERII. Kupuje dla kogos, kto sam nie przychodzi. Hesk
    nie zna heraldyki i nie potrafi powiedziec, czyja to barwa, ale wie rzecz lepsza:
    chlopiec przychodzi TEGO SAMEGO DNIA KAZDEGO MIESIACA. To nie nazwisko, to TERMIN
    - a Lucan ma szesnascie slug w polu i osiem chrzaszczy, ktore juz teraz siedza
    w smietnikach dzielnicy za darmo. 6. HESK ODWRACA TRANSAKCJE SAM Z SIEBIE. Spis
    dziala u niego w dwie strony: notuje tez, co KUPIL. Miesiac temu wzial cala skrzynie
    ksiag od rodziny sprzatajacej pokoj po zmarlym - do dzis nieprzebrana, lezy z
    tylu straganu. Nie wie, co w niej jest, i nie ma zamiaru tego czytac. Proponuje
    Lucanowi obejrzenie na miejscu albo cala skrzynie na wage. 7. KOSZT JAWNY, NIE
    UKRYTY. Hesk zapamietal Lucana - mieszczanin, ktory kupil klatwy dworskie, formy
    prawne i odbitki OBU stron nadchodzacej dysputy w jednym podejsciu, a potem poprosil
    o spis. To nie jest podejrzenie i nie jest zagrozeniem; jest to konkretny czlowiek,
    ktory potrafi Lucana opisac i chetnie o nim opowie, bo uwaza rozmowe za mila.'
  operations:
  - *id002
  new_decision: 'Czy Lucan przebiera skrzynie po zmarlym na miejscu, kupuje ja na
    wage w ciemno, czy odklada - i czy dopytuje Heska o ktorykolwiek z trzech wpisow:
    miesa, pieczeci albo chlopca w liverii.'
