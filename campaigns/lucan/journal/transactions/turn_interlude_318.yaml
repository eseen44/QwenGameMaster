outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'VARKHEN WRACA SIE POLOZYC I NIE ROBI Z TEGO SCENY. Ostatnia pieczec zostaje
    nieobejrzana, a jego karta mowi wprost, jak na to reaguje: w t_237 stal juz w
    plaszczu gotowy do wyjscia, uslyszal "jeszcze nie" i przyjal to bez skargi, bez
    zniecierpliwienia i bez pytania o powod, bo czterysta lat stal na slowie, ktorego
    nikt nie zapisal. Narrator nie dopisuje mu ani zawodu, ani ulgi (retcon_000142).
    SIECIARZ GARBARNIA ODPOWIADA I ODPOWIADA UZYTECZNIE, bo siedzi dokladnie tam,
    gdzie trzeba. Jego posterunek to loc_tannery / zone_upper_meadow - czyli laka
    za garbarnia PRZY WEJSCIU DO PIWNICY (rozstrzygniecie gracza z /minionki, retcon_000171).
    Gracz ustalil tez zasieg: sieciarz ma czujki na polowie parceli i CZUJE, gdy cos
    przemieszcza sie przez jego rewir. CO PODAJE - I TYLKO TYLE, BO JEST SIECIARZEM,
    A NIE SPIDEYEM: woz stanal na lace; DWOJE LUDZI; SZESC PRZEJSC w dol i szesc z
    powrotem; ciezar szedl W DOL i NIE WROCIL; potem woz odjechal. Zadnych twarzy,
    zadnych slow, zadnych szczegolow - low_bandwidth i odleglosc do cmentarza robia
    z tego liczby, nie obraz. NEGATYW JEST TU WART TYLE SAMO CO RESZTA: przez jego
    rewir NIE PRZESZEDL NIKT WIECEJ przez cala noc. Milczenie posterunku jest informacja,
    a nie przeoczeniem narratora - tak samo jak milczenie Tkacza przy rampie w t_309.
    NARRATOR NIE DOKLADA ANI OBSERWATORA, ANI SLADU, ANI NICZYJEGO ZAINTERESOWANIA.
    Zaden plik nikogo tam nie stawia (retcon_000015, retcon_000033, retcon_000055).
    ARYTMETYKA CZASU, PODANA ZEBY DALA SIE ZAKWESTIONOWAC: wyjscie z poziomu fundamentu
    na powierzchnie tunelem przy murze i rampa - okolo 900 s. Marsz z cmentarza do
    gildii - 2700 s, wedle jedynej zmierzonej trasy tej dlugosci w plikach (durations#marsz_pod_mur,
    t_086). Razem 3600 s: 04:31 -> 05:31. SWIT: KONIEC SIERPNIA, wiec o 05:31 jest
    juz szaro. Jest to fakt kalendarzowy, NIE zegar i NIE zagrozenie - nikt na Lucana
    nie czeka i narrator nikogo nie stawia. KOSZT: zero. Marsz, komendy w siec i odpytanie
    posterunku nic nie kosztuja.'
  prose: '— Wracaj i połóż się — mówi Lucan.


    Varkhen kiwa raz.


    Nie pyta, kiedy wrócą po ostatnią, i nie mówi, że stała nieobejrzana przez czterysta
    lat,

    więc postoi jeszcze dobę. Odwraca się i idzie swoją drogą, tą samą, którą tu przyszli,

    z głową pochyloną pod stropem, wolno.


    Lucan patrzy za nim, aż kroki przestają być słyszalne, i dopiero potem rusza w
    górę.


    Po drodze, gdzieś między starą kryptą a tunelem przy murze, sięga po nitkę, która
    idzie

    przez pół miasta.


    Sieciarz Garbarnia siedzi tam, gdzie go posadził: na łące za garbarnią, przy samym
    wejściu

    do piwnicy. Nie jest Spideyem i nigdy nim nie będzie, więc to, co przychodzi z
    powrotem,

    jest liczbami, nie obrazem.


    Wóz stanął na łące.


    Dwoje ludzi. Sześć przejść w dół i sześć z powrotem — a ciężar szedł w dół i z
    powrotem

    nie wracał. Potem wóz odjechał.


    I jeszcze jedno, które Lucan ceni wyżej niż tamto: przez jego rewir przez całą
    noc nie

    przeszedł nikt więcej. Ani jeden człowiek, ani jedno zwierzę większe od kota.


    Boros zrobił dokładnie to, do czego się zobowiązał, i nikt przy tym nie stał.


    Na rampie Tkacz schodzi ze swojego miejsca i rusza za nim, a Spidey siedzi mu
    na ramieniu

    od kilku godzin i nie zamierza go opuszczać.


    Wychodzą na cmentarz.


    Nad murem jest już szaro. Koniec sierpnia — świt przychodzi wcześnie i przychodzi
    bez

    ostrzeżenia, więc Lucan robi to, co zawsze o tej porze na tym cmentarzu: idzie
    środkiem,

    spokojnie, jak człowiek, który wraca z pracy.


    Bo wraca z pracy.


    Trzy kwadranse do gildii. Za murem budzi się miasto, które o niczym nie wie: o
    dwudziestu

    pięciu kilogramach srebra w piwnicy za garbarnią, o trzynastu pustych niszach,
    o czterech

    zamkniętych skrzynkach, o strażniku, który wrócił się położyć, i o tym, że pod
    najstarszym

    mauzoleum leży złamana pieczęć w tym samym miejscu, w którym leży duch.


    Przed gildią Lucan przystaje na trzy oddechy i porządkuje sobie w głowie, co z
    tego

    Seraphine w ogóle usłyszy.


    Potem wchodzi.

    '
