  summary: 'Bez testu - godzina przy stole, marsz i noc czytania, 4 h 27 min, zero
    energii.

    Zagrywka gracza laduje w calosci (retcon_000033). Cztery deklaracje w jednej turze
    i

    zadna z nich nie potrzebuje oporu.


    1. TKACZ SCHODZI Z KAZDEJ SMYCZY - GODZINA, TRZECIA I OSTATNIA PORCJA. Podpisana
    jej

    imieniem od tury 090, lezala nieotwarta trzy dni. Efekt jest PERMANENTNY: zdejmuje
    dobowy

    ubytek raz na zawsze (spy-series#decay_suppressant_rule). Nie zwalnia z zywienia
    - jedzenie

    finansuje mase i dojrzewanie, nie przetrwanie. Zapas porcji ze schowka jest teraz
    WYCZERPANY:

    Spidey (t_090), Zawisak (t_090), Tkacz (t_177). Czwartej nie ma i nikt nie wie,
    skad wziac.


    2. CALA SIEC DOSTAJE POZWOLENIE NA POLOWANIE. To nie jest kosmetyka, odkad obowiazuje

    retcon_000105: rozkaz "polujcie" zamienia posterunek bez zeru w wezel na zerze,
    a wezel bez

    zadania w wezel ZARABIAJACY do growth_bank. Osa schodzi z jednodobowej smyczy
    - dostaje

    wylot i zer, z ograniczeniem gracza: male obiekty, z dala od duzych.


    3. TRZY KSIAZKI ZE SCHOWKA W MURZE - I TO SA DOKLADNIE TRZY, KTORE TAM LEZALY.

    item_barber_surgeon_anatomy_atlases (study_status byl not_yet_studied),

    item_barber_surgeon_casebook (read_status byl unread) oraz item_library_marked_volume.

    Wszystkie trzy przechodza z wall_hideout do carried.


    4. ATLASY - PIERWSZE PRZEJSCIE, I UDERZAJA W ZAPISANE OGRANICZENIE. inventory

    #mechanical_relevance mowi wprost: atlasy uderzaja w jawnie zapisany limit

    ability_corpse_stitch ("anatomical mistakes remain possible") i to na skali LUDZKIEJ,

    nie owadziej - rzecz nie do kupienia u skryby. Pierwsze przejscie nocy nie jest
    mistrzostwem:

    study_status idzie na studied_first_pass. Lucan wie teraz, GDZIE popelnial bledy,
    i to

    wystarczy, zeby przestac je popelniac w miejscach oczywistych. Rysunki z sekcji
    plus

    marginalia jedna reka poprawiajace drukarza - poprawki sa czesto celniejsze od
    druku.


    5. BRULION JEST NAJCIEZSZA RZECZA, JAKA LUCAN PRZECZYTAL TEJ NOCY, I NIE CHODZI
    O NEKROMANCJE.

    inventory#value: kto, kiedy, co zszyte, ile zaplacono - lata cichego latania ludzi
    bez

    zglaszania ran, z nazwiskami albo przezwiskami, datami i kwotami. To jest SPIS
    CICHEJ

    PRZEMOCY W DZIELNICY. Rana, ktorej nie zglaszono, ma zawsze dwie strony i obie
    sa w tym

    brulionie. Kazde nazwisko jest wezlem, ktory Lucan moze potem sprawdzic - nie
    doklejac tu

    zadnego konkretnego trafienia, dopoki gracz nie zadeklaruje, ktorego watku szuka.


    6. TOM Z SYGNATURA - PRZEKARTKOWANY W NOCY, CZYLI WARUNEK ZWROTU ODHACZONY.

    obligation_return_borrowed_academy_volume wymagala DOKLADNIE tego: "zwrocic tom
    jawnie

    przez bibliotekarza, po przekartkowaniu go w nocy". Warunek wstepny wykonany.
    Lucan wie

    teraz, ile dokladnie tresci licencjonowanej ma do przepisania i ktore strony niosa
    marginalia

    - czyli idzie rano na targ z konkretem, a nie z pytaniem.


    7. GDZIE TO WSZYSTKO LEZY I DLACZEGO TO NIE JEST ZAGROZENIE. Lucan czyta w pokoju
    dyzurnym

    NA GORZE (retcon_000038), nie w celi w piwnicy. inventory#storage_plan brulionu
    mowi

    "nie trzymac w celi dwoje drzwi od czworki wspolpracujacych swiadkow" - i ta uwaga

    wlasnie NIE ma zastosowania, bo cela zostala na dole. Zaden plik nie stawia tu
    terminu,

    nikt nie przeszukuje pokoju i nic tego nie uruchamia. Nie budowac z tego zegara.


    8. SPIDEY I TKACZ LUZEM, W ZASIEGU POKOJU. Oboje poluja w ograniczonym zakresie
    blisko

    Lucana, bez obowiazku siedzenia na ciele. Dla Spideya to zero zmian w laczu (70
    procent

    bliskiego zasiegu). Dla Tkacza to pierwsza noc poza baszta od nadania imienia
    - i pierwsza

    z oboma pasmami sluchu oraz z klasa kanalu kotwicy (retcon_000106). Jej traits
    mowia,

    co z tego wyniknie predzej czy pozniej: wobec Lucana ulegla i wycofana, wobec
    innych okazow

    zazdrosna - a wlasnie spedza noc w jednym pokoju ze Spideyem, ktory dostal godzine
    uwagi

    przy stole. Jedno zdanie na scene, nie watek.


    9. STAN. Czwarty dzien interludium, 05:00, pokoj dyzurny na gorze w budynku gildii.

    Energia 14,10/15 - blisko sufitu, wiec nadwyzka niedlugo nie bedzie miala gdzie isc (patrz

    retcon_000109 - to jest moment, w ktorym surplus_routing zaczyna miec znaczenie).

    Integralnosc 19/19, bez warunkow. Zegary bez ruchu. Lucan nie spal.

    '
  new_decision: 'Swita, Lucan nie spal, a poranek ma juz dwie wlasne rzeczy: targ
    po introligatora i pierwszy trening z Mara. Ktora bierze pierwsza - i czy brulion
    balwierza idzie z nim, czy zostaje na gorze?'
