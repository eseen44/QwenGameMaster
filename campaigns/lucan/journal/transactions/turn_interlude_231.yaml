  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii.

    UJAWNIENIE, KTORE LUCAN SAM ZAPOWIEDZIAL JAKO NIEMILE. Seraphine dowiaduje sie,
    ze jest

    w tym sporze glebiej, niz jej mowil - i reaguje rachunkiem, nie pretensja.


    1. DYSCYPLINA WIEDZY - CO ONA MA, A CZEGO NIE (retcon_000136, audyt karty przed
    tura).

    MA: ze Akademia prowadzi spor o klasyfikacje ozywionych konstruktow (t_026b),
    ze bedzie

    publiczna dyskusja, ze osoby zwiazane z Kosciolem na uczelni daza do ograniczenia
    badan

    i ze Akademia tworzy podobne stworzenia u siebie (t_029), ze wezwanie ma postac

    SEMINARIUM, a nie przesluchania (t_030).

    NIE MA I NIE WOLNO JEJ TEGO UZYC: ze ojciec Lucana zna metode; ze Lucan ma wystawic
    okazy

    POD WLASNYM NAZWISKIEM; ze Lucan juz rozmawial z npc_neris_aldhen; ze zaprojektowal

    granice prawna (t_160); ze wynik dysputy jest ustawiony przez Kosciol (ivar-kolm.yaml

    #the_dispute_is_thrown - to jest kanon swiata, ale ZRODLEM DLA NIEJ jest wylacznie

    to zdanie Lucana i tak zostaje zapisane, retcon_000120).


    2. WARUNEK Z t_029 WLASNIE ZOSTAL MINIETY - I NARRATOR MA TO ROZEGRAC DOKLADNIE
    WEDLUG

    retcon_000124, CZYLI NIE JAKO ZLAMANIE SLOWA. obligation_warn_seraphine_before_contacting

    _dispute_sides: to JEJ WARUNEK, NIE JEGO OBIETNICA - zgody Lucana nie ma w zapisie.

    Wiec: (a) narratorowi NIE WOLNO przedstawiac tego jako zdrady ani jako zlamanego
    slowa;

    (b) koszt jest REALNY, ale JEJ - fact_seraphine_offers_conditional_cover wiaze
    jej oslone

    przed Gildia i Inkwizycja ze szczerym ujawnianiem ryzyka, wiec dowiadujac sie
    po fakcie

    traci nie honor, tylko podstawe wlasnej oslony. Nazywa to raz i idzie dalej

    (retcon_000135: jedno zdanie ceny, potem decyzja).

    ONA NIE PYTA, JAK DALEKO ZASZEDL. To jest swiadoma decyzja postaci spojna z t_126:

    "chce miec liste rzeczy, ktorych nie znam". Woli nie wiedziec, ile dokladnie,
    dopoki

    moze jeszcze uczciwie powiedziec, ze nie wie.


    3. TRESC UJAWNIENIA - CO NARRATOR PRZYJMUJE, A CZEGO NIE DOPOWIADA.

    Teza Lucana (obie strony udaja dialog, zeby moc oglosic jego porazke i przejsc
    do wojny

    podjazdowej) jest ZGODNA Z KANONEM SWIATA: ivar-kolm.yaml#the_dispute_is_thrown
    mowi, ze

    przelozeni Kolma to Kosciol i to ONI zdecydowali, ze wygra Neris; Kolm prowadzi
    strone,

    ktora ma przegrac. MOTYW KOSCIOLA jest tam wypisany: wygrana szerokiej definicji
    wtlacza

    hybrydy w szara strefe, przestaje sie rozpatrywac skargi - Kosciol nie przegrywa

    argumentu, tylko KUPUJE ZA NIEGO LIKWIDACJE FORUM, bo poza forum srodek zaradczy
    zmienia

    rece Z PAPIERU NA LUDZI. Precedens tez tam stoi: ojca Lucana potepiono dwa razy,
    a potem

    ktos przyszedl do laboratorium osobiscie.

    NARRATOR NIE DOPISUJE ANI JEDNEGO NOWEGO ELEMENTU - zadnych nazwisk, zadnej daty,
    zadnego

    planu Kosciola ponad to, co juz stoi w pliku (retcon_000058).


    4. SYNTEZA, KTORA JEST OBOWIAZKIEM NARRATORA (retcon_000135 punkt d) - I ONA JA
    ROBI.

    Jesli forum jest z zalozenia do wysadzenia, to data dysputy przestaje byc terminem
    na

    wygranie argumentu i staje sie DATA STARTU czegos innego. Zestawienie zegarow,
    wszystkie

    z state/clocks.yaml, zadnego nowego:

    - clock_father_arranges_academy_showing: 3/15, ok. 16 dni - dysputa.

    - clock_guild_leadership_hearing: 3/15 - przesluchanie.

    - PIECZECIE: ZERO. Nie ma zegara i nikt nie zna terminu.

    WNIOSEK, KTORY WYPOWIADA: dwie instytucje maja daty, a jedyna rzecz, ktora moze
    rozerwac

    miasto, nie ma zadnej. Jesli trzecia pieczec pusci PO dyspucie, miasto dostanie
    kryzys

    nekromantyczny w tygodniu, w ktorym Kosciol bedzie juz poza forum i bedzie zalatwial

    sprawy ludzmi. To nie jest przepowiednia - to jest zestawienie trzech pozycji
    z tego

    samego pliku, ktorego nikt dotad nie zestawil.


    5. PODPIS NA DOKUMENTACH ETYKI - TA SAMA INWERSJA, TRZECI RAZ W TEJ SCENIE.

    the_boundary_lucan_designed#the_shift: od t_160 Lucan przestaje byc przedmiotem

    klasyfikacji i staje sie jej AUTOREM - z zalozenia przy cudzych nazwiskach na
    stopce.

    Obawa gracza jest wiec obawa o utrate anonimowosci autorstwa, a nie o tresc.

    SERAPHINE CZYTA TO ODWROTNIE i ma na to precedens z tej samej rozmowy (karta kontraktowa,

    nazwisko jako powod zamowienia): czlowiek, ktorego podpis stoi pod kodeksem etyki
    pracy,

    nie jest przedmiotem tego kodeksu. Autor normy nie jest jej podsadnym.

    NIE UDAJE, ZE TO JEST DARMOWE - nazywa jeden koszt i tylko jeden: podpis jest
    trwaly,

    a autorstwo dziala rowniez wtedy, gdy norma zostanie pozniej uznana za bledna.


    6. MAJORDOMUS - JEDEN BEAT, BEZ SENTYMENTU (portrayal.cognition: proste linie,
    ocena po

    czynach; speech_traits: nie udaje, ze rozumie, kiedy nie rozumie).

    Varkhen nie odbiera tego jako zartu ani jako oferty. Odbiera jako pytanie o to,
    co bedzie

    potem - czyli o rzecz, o ktorej dziesiec minut temu powiedzial, ze jej nie zna.
    Odpowiada

    krotko i bez wdziecznosci: sluzyl w jednym miejscu czterysta lat, bo tak brzmiala

    przysiega, a nie dlatego, ze lubil. NARRATOR NIE ROZSTRZYGA, czy by chcial - to
    zostaje

    otwarte, bo zaden plik tego nie ma i sam Varkhen tego nie wie.


    7. CZEGO NARRATOR TU NIE ZROBIL. Nie ujawnil Seraphine, ze Lucan rozmawial z Neris
    ani ze

    projektuje tresc granicy - Lucan tego nie powiedzial, wiec ona tego nie wie. Nie
    kazal

    jej sie oburzyc na miniety warunek (retcon_000124). Nie stworzyl zegara pieczeci
    ani

    zadnej daty (retcon_000055). Nie dopisal Kosciolowi zadnego nowego planu, nazwiska
    ani

    ruchu. Nie odwrocil niczego z t_228-230: uklad ze Straza stoi, karta kontraktowa
    lezy

    z dwoma pustymi polami, transport noca przyjety.


    8. STAN. Czwarty dzien interludium, gabinet Seraphine, gorne pietro gildii.

    Obecni: Lucan, npc_seraphine_vale, npc_varkhen_mind (rog pokoju). Spidey i Tkacz
    przy

    Lucanie, zuk w kieszeni. Na blacie niedokonczona karta kontraktowa - puste ZAKRES
    i DATA.

    Varkhen 9,2/65. Lucan 19/19, energia bez wydatku - czytac z pliku.

    '
  new_decision: 'Seraphine liczy dysputę jako pozycję drugą z trzech i zestawia zegary:
