    SAMO, i wlasnie dlatego cztery lacza upkeep opisano jako "bardzo powolna odbudowa".

    Do pracy fizycznej potrzebne bylo paliwo i paliwo dostal.


    2. RACJONOWANIE NIE ZOSTALO ZNIESIONE. retcon_000113 (struga 1,0/0,8 na dobe,
    Varkhen poza

    drabina) STOI - to byl jednorazowy pobor nadmiaru, nie zmiana rozkazu stalego.
    Gracz nie

    zadeklarowal zmiany stawki i narrator jej za niego nie zmienil.


    3. NA "PROSZE" ZAREAGOWAL, NA ENERGIE NIE. Kontrakt glosu: bierze uprzejmosc za
    obietnice,

    a wdziecznosci nie mowi - wykonuje. Dlatego kwestia jest jednym slowem powtorzonym
    po

    rozmowcy, a odpowiedzia na ladowanie jest robota. Nie dopisano mu ulgi, komentarza
    o wlasnym

    stanie ani zdania o tym, co robia.


    4. ZA KAMIENIAMI JEST TO, CO PLIK TRZYMAL SCHOWANE OD AKTU 2: feature_ritual_channels

    (kind: embedded_old_ritual, zone_ritual_channels, player_visible FALSE, x_m 3,
    y_m -1 -

    czyli po polnocnej stronie kaplicy). Kanaly zbiegaja sie do jednego miejsca i
    koncza na

    przedmiocie. TO NIE JEST DOPISANA STRUKTURA - to odsloniecie cechy, ktora lezala
    w

    layout.yaml kaplicy z flaga niewidocznosci dla gracza. Od teraz widoczna.


    5. CZYM JEST PRZEDMIOT - NIEROZSTRZYGNIETE, I NARRATOR TEGO NIE ROZSTRZYGNAL.
    Ustalone:

    wielkosc piesci, obrobiony reka ludzka, zimny, nasycony na tyle, ze zaklóca grave
    sense,

    nie jest i nigdy nie byl cialem. NIEUSTALONE: co robi, czyj jest, czy nadaje sie
    na medium

    do klatw (lead_curse_medium_from_material), czy da sie go stamtad wyjac bez konsekwencji

    i czy kanaly sa czynne. Zwiazek z Orenem podany jako WNIOSEK LUCANA z ukladu miejsca,
    nie

    jako fakt swiata.


    6. LUKA SYSTEMOWA, RAPORTOWANA: nie ma intentu dla vectora linked_resource_transfer

    (effect_lucan_network_energy_transfer), wiec silnik odrzuca ten transfer jako
    ture

    mechaniczna i trzeba go rozstrzygac recznie. Do zalozenia przy najblizszej pracy
    nad

    migration/mechanics/intents.

    '
