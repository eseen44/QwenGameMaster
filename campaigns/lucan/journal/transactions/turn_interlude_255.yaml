  prose: 'Siec oddala nadmiar bez oporu - jest go tyle, ile go jest, i po drodze czesc
    zostaje

    na przeskokach. W Varkhenie widac to nie po tym, ze wyprostowal sie czy odetchnal,

    bo on nie robi ani jednego, ani drugiego. Widac po tym, ze przestal stac jak rzecz

    postawiona pod sciana.


    Potem padlo "prosze", i to bylo jedyne slowo, na ktore w tej rozmowie zareagowal

    od razu.


    - Prosisz - powiedzial.


    Nie bylo w tym pytania i nie bylo podziekowania za energie. Podszedl do fundamentu,

    wsadzil palce w szczeline i wyjal pierwszy kamien tak, jak sie wyjmuje ksiazke

    z polki. Drugi szedl gorzej. Trzeci wyszedl razem z warstwa zaprawy i wtedy zrobil

    sie otwor na reke, a za nim nisza.


    I w niszy nie ma tylko tego punktu. Sa TORY - kanaly wyrobione w kamieniu fundamentu,

    stare, zbiegajace sie z trzech stron do jednego miejsca, i konczace sie na tym,
    co

    tam lezy. Rzecz jest wielkosci piesci, obrobiona ludzka reka, zimna tak, ze parzy,

    i tak nasycona, ze grave sense przestaje przy niej byc narzedziem precyzyjnym.

    Nie jest cialem. Nigdy nim nie bylo.


    Oren nie postawil tu przekaznika przypadkiem. Postawil go na koncu czegos.

    '
  summary: 'Interludium, roll_policy disabled - bez rzutu. Pietnascie minut, ZERO
    z rezerwy Lucana:

    zrodlem byla siec, nie jego pula, a rezerwa stoi przy sufcie (14,8/15), wiec szczebel
