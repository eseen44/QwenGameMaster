  summary: 'Bez testu - rozmowa, szesc minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033) i jest sprawdzona w plikach, nie przyjeta na slowo.

    1. WERYFIKACJA PRAWNA - GRACZ MA RACJE CO DO LITERY KANONU.

    worlds/solmara/lore/necromancy-law.yaml#legal_baseline nie zakazuje energii jako

    takiej. Zakazana jest PRAKTYKA nekromancji oraz tworzenie, utrzymywanie i kontrola

    nieumarlych; wrodzona zdolnosc i wiedza teoretyczna sa wprost NIE nielegalne,
    a

    modyfikacja zwierzat i robactwa jest szara strefa. Pomiar nie jest ani praktyka,
    ani

    nieumarlym. JEDYNE ZASTRZEZENIE, ktore w kanonie stoi: animal_gray_zone.limit
    mowi o

    "transporcie zakazanej energii" jako mozliwym odrebnym przestepstwie - czyli kategoria

    energii zakazanej istnieje, ale dotyczy UZYCIA I PRZENOSZENIA, nie mierzenia.
    Argument

    Lucana przezywa to bez zadrapania.

    2. NOWY KANON SWIATA WPROWADZONY PRZEZ GRACZA (interludium, retcon_000033) - do

    utrzymania jako obowiazujacy: (a) grabarze sa stale nasyceni energia smierci i
    nie sa

    martwi; to samo dotyczy czesci trupojadow, np. sepow; (b) techniki pacyfikowania
    i

    lokalizowania nieumarlych bazuja na tej samej energii; (c) istnieje przyrzad

    ("radar") uzywany do oceny stanu cmentarza, dzialajacy na tej samej zasadzie;
    (d)

    czesc czarow leczacych rowniez z niej korzysta; (e) golemy wymagaja zasilania.
    Zadne

    z tych zdan nie przeczy istniejacym plikom.

    3. ARGUMENT INSTRUMENTALNY JEST NAJMOCNIEJSZY I OJCIEC PRZYJMUJE GO Z PRZYJEMNOSCIA.

    Pudelko musi oddzialywac z tym, co mierzy, wiec pracuje w tej samej przestrzeni

    energetycznej co rzecz mierzona. To jest jego wlasne pole - przed chwila skarzyl
    sie,

    ze jego przyrzady nie czytaja w skarbcach. Doklada czesc, ktora nalezy do niego:

    przyrzad NIE PODAJE LICZBY, tylko potwierdzenie od czlowieka, ktory go trzyma,
    a

    odczyt jest KONTRASTEM, nie wartoscia bezwzgledna - i nie istnieje uzgodniony
    punkt

    odniesienia mowiacy, ile energii smierci jest normalne u grabarza. Mowi to jako

    pretensje techniczna. Polityka go nie interesuje, wiec nie zauwaza, ze wlasnie
    nazwal

    cala slabosc strony przeciwnej.

    4. PRZEWROT NA KRYTERIUM KOLMA. Do tej pory asymetria brzmiala: Kolm ma przyrzad,

    Neris nie ma nic (t_153). Po tej turze przyrzad nadal istnieje, ale przestaje
    byc

    dowodem obiektywnym i staje sie SWIADKIEM Z URZADZENIEM. Kryterium "martwa tkanka
    i

    energia smierci" (necromancy-law#construct_boundary.church_position) nie rozdziela

    okazu Lucana od grabarza, sepa i uzdrowiciela, dopoki ktos nie ustali progu -
    a progu

    nikt nie ustalil, bo exact_statutes_penalties_and_exceptions: not_yet_codified.

    5. PODRECZNIK ISTNIEJE, JEST KANONICZNY I JEST NAJMOCNIEJSZYM FUNDAMENTEM OBRONY.

    player/inventory.yaml#item_library_marked_volume - akademicki podrecznik przywracania

    ruchu i oddechu cialu, ktore przestalo, rzecz licencjonowana i recenzowana, sygnatura

    biblioteki Akademii, obejrzany przez Lucana w t_085. planning/act-03-defence.yaml
    juz

    go zapisuje jako mocniejszy fundament niz upadly argument o odzywianiu (retcon_000023):

    instytucja, ktora bedzie Lucana sadzic, trzyma na wlasnej polce procedure przywracania

    zatrzymanego ciala, wiec granica zywe/martwe jest w JEJ jezyku ciagloscia z procedura.

    6. ALE EGZEMPLARZ LUCANA JEST KRADZIONY I MA SYGNATURE, I TO JEST W PLIKU, NIE

    WYMYSLONE. item_library_marked_volume.type: stolen_institutional_property;

    .problem: biblioteki prowadza rejestr ubytkow, wiec ktos w Akademii ma zapis,
    ze

    wolumin zniknal. Powolac sie na DZIELO mozna bezpiecznie. Podac SYGNATURE albo
    pokazac

    egzemplarz w tym budynku - nie.

    7. WORLD MOVE A - NERIS PROSI O SYGNATURE I ROBI TO NIEWINNIE. Jest osoba, ktora
    sama

    wpisuje wlasnych gosci do ksiegi odwiedzin (portrayal: guest_book_habit) i mysli

    przypisem; odeslanie do dziela bez sygnatury jest dla niej robota niedokonczona.

    Prosi, zeby sprawdzic i zacytowac poprawnie. Nie podejrzewa niczego. Pytanie ma
    zeby

    wylacznie dlatego, ze ksiazka lezy w skrytce w scianie, a nie na polce.

    8. GOLEM I KORBA - ARGUMENT ROZBIJA PUNKT PIERWSZY PROTOKOLU I JEST ZGODNY Z

    ISTNIEJACYM RETCONEM. retcon_000023 juz ustalil, ze argument o odzywianiu upadl,
    bo

    ozywieniec tez sie odzywia. Lucan doklada druga polowe: odzywianie sie nie odroznia

    rowniez OD KONSTRUKTU, bo pobieranie energii z zewnatrz jest tym samym u golema
    z

    korba i u pajaka z mucha. Rozni sie forma podania, nie natura operacji. Kryterium

    "konstrukt sie nie karmi" przestaje cokolwiek rozdzielac.

    9. NERIS PRZYZNAJE TO NA GLOS I TYM RAZEM DOSTAJE, NIE TRACI (portrayal.the_flaw

    dziala w obie strony). Jej wlasny odczyt z t_132, ktory od pierwszego spotkania

    podkopywal jej wlasne stanowisko, wlasnie zostal zdjety ze stolu. Jest to pierwsza

    rzecz tego wieczoru, ktora ja WZMACNIA, i pierwsza, ktora dostala od Lucana bez

    ceny widocznej od razu.

    10. WORLD MOVE B - OJCIEC PRZEPISUJE PUNKT PIERWSZY PROTOKOLU I ROBI Z NIEGO TEST

    ZASILANIA. Skoro karmienie nie rozdziela, to punkt pierwszy nie brzmi "czy pobiera

    pokarm", tylko: czy da sie obiekt POPROWADZIC Z ZEWNATRZ i czy STAJE, gdy zasilanie

    ustaje. Odejmowalne, powtarzalne, zapisywalne, odporne na krytyke poznania. To
    jest

    dokladnie argument Lucana zamieniony w procedure - i wypisuje odczyt KONSTRUKTU.

    11. I TU JEST CENA, KTORA WYNIKA WPROST Z WLASNEGO RUCHU GRACZA. Zademonstrowanie

    zasilania z zewnatrz oznacza pokazanie CZYNNEGO LACZA - a czynne lacze to jest

    dokladnie to, czego szuka stopien drugi wykrywalnosci

    (worlds/solmara/lore/concealment-materials.yaml#detection_model.step_2: szuka

    czynnego kanalu, nie ksztaltu). Protokol wymagalby wiec od Lucana pokazania na

    zywo, przy magicznie pismiennej publicznosci, tego jednego zjawiska, przed ktorym

    cala jego konstrukcja wabika mala go chronic. Nie jest to opor narratora ani kara
    -

    jest to konsekwencja tego, ze wlasny argument stal sie punktem protokolu.

    12. CZEGO NIE PADLO. Trzecia substancja (lichen_speculans) nadal nie. Pytanie
    "do

    ktorego stopnia kupujemy" nadal nietkniete, piaty raz - i wlasnie przestalo byc

    akademickie, bo demonstracja zasilania sama w sobie jest zdarzeniem stopnia drugiego.

    Ojciec nadal nie wie o nekromancji, sieci, Varkhenie, syndykacie ani o slowie
    wabik.

    13. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:08. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. Szkielko z Sordina w kieszeni, odbitka

    Neris w rece, rejestr zaopatrzenia otwarty, wpis niezlozony. USTALONE: pomiar
    energii

    smierci nie jest zarzutem i nie rozdziela okazu od grabarza; przyrzad daje kontrast
    i

    swiadka, nie liczbe; podrecznik o resuscytacji wszedl do rozmowy jako dzielo;
    Neris

    prosi o sygnature; karmienie odrzucone jako kryterium po obu stronach; punkt pierwszy

    protokolu przepisany na test zasilania zewnetrznego.

    '
