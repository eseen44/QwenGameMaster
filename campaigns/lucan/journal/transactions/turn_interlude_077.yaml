  summary: 'Bez testu. Druga stonoga wstaje jednym gestem (spy_centipede_02), obie
    ida do studzienki w ulicy przy murze i znikaja pod kratą. 1. BIOM IDEALNY. Kanaly
    to dla stonogi dokladnie to, do czego jest zbudowana - mokro, ciemno, plasko,
    pelno robactwa. Zdobycz i trzydniowa smycz zbiornika przestaja byc problemem;
    te dwie utrzymaja sie same bez zadnej opieki. 2. I NATYCHMIAST WYCHODZI WADA,
    KTORA NIE JEST WADA STONOGI. Komunikacja tej serii to minimal_status - zyje, glodny.
    Nic wiecej. Lucan stoi nad krata z dwoma zywymi sygnalami gdzies pod ziemia i
    zerowa informacja o tym, GDZIE sa. To pierwsza polowa jego wlasnej architektury
    postawiona w polu i pierwszy pomiar: dwa wezly, zero danych. Odpowiedzia jest
    kurier albo kupiony wezel, nie kolejna stonoga. 3. CO UJAWNIAJA SAME KANALY -
    I TO JEST ZNALEZISKO WIEKSZE NIZ OBIE STONOGI. Siec kanalow siega POD PIWNICE
    GILDII. W korytarzu zatrzyman jest kratka w podlodze (feature_corridor_floor_drain,
    szerokosc dloni, nieprzejezdna dla czlowieka, przejezdna dla slugi tej skali)
    - dwoje drzwi od nowej celi Lucana i dwoje drzwi od pokoju czworki wspolpracujacych
    swiadkow. Wpuszczajac stonogi do studzienki przy murze Lucan otworzyl droge do
    wlasnej kwatery i do gildii, w obie strony, i nikt jej nie pilnuje. Kurierska
    trasa pod ziemia nie podlega stratom odlegloscii tak jak lacze zdalne - byle dotarla.
    4. LOKACJA ISTNIEJE, MAPY NIE MA. loc_city_sewer wchodzi do indeksu jako known_by_proxy_unmapped:
    Lucan nie byl tam osobiscie, zna dwa wejscia i nic wiecej. Zanim wejdzie sam,
    potrzebny layout i discovery. 5. BEZ ROZKAZU. Lucan wrzucil je i nie powiedzial
    im, czego szukac. Dzialaja wiec na domyslnym trybie: polowac, chodzic, zyc. Nikt
    niczego nie mapuje.'
  new_decision: Studzienka zamknieta, dwie stonogi zyja w kanalach bez zadania, a
    kanaly wychodza kratka w korytarzu dwoje drzwi od celi Lucana. Do rozstrzygniecia
    - czy Lucan daje im jakikolwiek rozkaz teraz, dopoki jest blisko i strata na odleglosc
    jest mala, i czy wraca do stolu, gdzie zostaje resztka urobku i trzy nieprzydzielone
    okazy.
