  summary: 'Bez testu - ojciec nie szuka przestepstwa, wiec nie ma czego przelamywac.

    Lucan mowi prawde w swoim wlasnym slowniku - czyste vitae, energia zycia, a pajak

    zywi sie realnie tak, jak zywilby sie zywy - i dorzuca, ze kaplan nazwalby to

    smiercia. Ojciec przyjmuje to bez drgnienia. Nie slyszy w tym zbrodni, slyszy

    problem definicyjny, i natychmiast zaczyna go poprawiac jak zle sformulowana teze

    studenta - bo argument z odzywiania jest mocniejszy, niz Lucan go postawil.

    Utrzymanie znaczy przemiane materii, a przemiana materii znaczy proces ciagly;

    ozywienie nie je. Radzi tez, zeby slowa vitae nie uzywac przy nikim w stule, bo

    kaplan usluszy w nim dokladnie to, co chce uslyszec.

    Potem pada druga polowa tego, co Lucan powiedzial, i tu ojciec reaguje mocno -
    ale

    nie na to, co gracz mowil. Z "mam problemy, beda chcieli mi go zabrac, moj projekt"

    ojciec slyszy WYLACZNIE "chca mi zabrac projekt". To jest jedyna krzywda, ktora

    rozumie w kosciach. Nagle jest calkowicie po stronie Lucana, mowi ze to nie

    uchodzi, ze wlasnie tak sie robi ludziom, ktorzy pracuja - i nie zauwaza, ze jego

    syn powiedzial mu, ze ma problemy.

    KONKRET - tu na miejscu toczy sie otwarty spor o klasyfikacje ozywionych

    konstruktow i ktos w tym budynku walczy o szeroka definicje. Ojciec nie pamieta

    nazwiska tej osoby, opisuje ja przez to, co pisze, i obiecuje sprawdzic. Do tego

    material dawcy - odnoze duzego pajeczaka ze zbiorow Akademii - traktuje jako

    zalatwione, bo w jego swiecie to jest zalatwione.

    KOSZT, ktory ojciec wnosi zupelnie bezinteresownie - chce to pokazac. Nie donieść,

    nie wydac: POKAZAC, ludziom ktorzy by zrozumieli, bo dobra praca ma byc widziana.

    Nie ma pojecia, ze proponuje wlasnie ten mechanizm, ktorym instytucja uzyskuje

    dostep do okazu, i ze slowo "zabrac" w ustach jego syna nie dotyczylo prestizu.

    '
  new_decision: 'Ojciec jest kupiony, po stronie Lucana i uzbrojony w lepszy argument
    niz ten, z

    ktorym Lucan przyszedl - i wlasnie zaproponowal, zeby pokazac Spideya komus, kto
    by

    zrozumial. Lucan pozwala mu szukac tej osoby i wprowadza Spideya do sporu jako

    eksponat, hamuje go i bierze tylko noge oraz argument, probuje mu wytlumaczyc,
    co

    naprawde znaczylo "zabrac" - czy pyta o cene dostepu do zbiorow, zanim cokolwiek

    obieca?

    '
  operations:
  - *id002
