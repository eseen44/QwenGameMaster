  prose: 'Brama nie jest zamykana od lat i to sie nie zmienilo. Varkhen wszedl trzy
    kroki

    za nim, zatrzymal sie i stanal twarza na polnoc - tam, gdzie w ciemnosci jest

    osuwisko, przez ktore go wyniesiono. Nie powiedzial nic.


    Geo kosztuje tyle, co nic, i tyle wlasnie zabralo. Kamien odpowiedzial znajomo:

    ziemia pod tym polem jest sitem, dokladnie tym samym sitem co poprzednio - te
    same

    pustki, te same tunele, te same zawaly, zasieg konczy sie mniej wiecej na kaplicy.

    I to jest cala wiadomosc, bo nie ma w niej NICZEGO NOWEGO: ani swiezego przekopu,

    ani nowego szybu, ani osypanej sciany. Ktokolwiek tu bywa, nie kopie.


    Druga polowa protokolu dala to, co daje cmentarz - warstwy na warstwach, nie do

    rozdzielenia. Poza jednym. Na samej krawedzi zasiegu, pod polnocnym fundamentem,

    siedzi ten sam sygnal, ktorego Lucan nie umial nazwac ostatnim razem, i po tym

    skanie nadal nie umie.

    '
  summary: 'Interludium, roll_policy disabled - bez rzutu, verdict automatic_with_cost.

    Piec minut, 0,1 jednostki z lucan_necrotic_energy (casting_profile#energy_cost_per_declared_scan),

    slad magiczny faint. zone_south_gate -> zone_grounds, wszyscy czterej.


    1. SKAN POTWIERDZA, NIE ODKRYWA - I TO JEST WYNIK, NIE PUSTA TURA. Wszystko, co

    kamien podal, stoi juz w locations/cemetery/discovery.yaml: feature_geo_many_voids_and_earth_collapses,

    feature_geo_west_wall_tunnel, chapel_substructure, przyblizona rozciaglosc

    zone_buried_old_network bez geometrii przejsc. Narrator NIE dolozyl ani jednej
    nowej

    struktury, bo zasieg 20 m i limit repeated_detailed_scans nie sa pretekstem do

    rysowania mapy od nowa (retcon_000058).


    2. WYNIK NEGATYWNY JEST TU INFORMACJA: brak swiezego przekopu, szybu i osypania

    znaczy, ze od poprzedniego skanu nikt tu nie ruszal ziemi. Zestawia sie to z tym,

    co Varkhen powiedzial kwadrans wczesniej - kaplan znal WLASCIWE WEJSCIE i sprawdzal

    pieczecie. Zestawienie jest obowiazkiem narratora (retcon_000135), ale WNIOSKU

    narrator nie podaje: nie twierdzi, ze kaplan wchodzil korytarzem prob, bo

    front_trial_corridor ma w plikach status geometry_unknown.


    3. SYGNAL POD POLNOCNYM FUNDAMENTEM ODCZYTANY PONOWNIE I NADAL NIESKLASYFIKOWANY.

    Jest w discovery.yaml jako strange_signal_beneath_north_foundation, odrebny od
    zombie

    pod kaplica i od nieumarlego przy zachodnim murze. Lezy na krawedzi zasiegu; skan
    go

    nie zblizyl i narrator nie nadal mu tresci.


    4. VARKHEN BEZ KWESTII - stanal twarza na polnoc, ku osuwisku, przez ktore go

    wyniesiono. Emocja przez to, na co patrzy (voice_contract#emotion). Nie dopisano
    mu

    ani rozpoznania miejsca, ani planu, ani zdania o skanie.

    '
