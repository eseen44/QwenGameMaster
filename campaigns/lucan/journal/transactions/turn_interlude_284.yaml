outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'UJAWNIENIE. Lucan powiedzial Borosowi i Marze, ze wyczuje umarlych i zdazy
    ich wycofac, a korytarze potrafi obejrzec na sto metrow do przodu - i poprosil,
    zeby nie pytali JAK. Nie jest to podane z zera: oboje byli przy milestone_045
    i widzieli, jak Varkhen slabnie przy kontakcie, a Mara dostala w t_184 wlasna
    wersje mechanizmu. Do ich wiedzy wchodzi to jako KWESTIA LUCANA (retcon_000120),
    nie jako mechanika - i tak jest zapisane na obu kartach. W PLIKACH TO MA POKRYCIE
    i nie jest przechwalka: ability_necromantic_probe, wyczucie nieumarlego z milestone_045,
    oraz siec - spy_beetle_01 "General" siedzi JUZ w podziemiach cmentarza (zone_relay_chamber),
    a wije maja staly rozkaz mapowania. Sto metrow to deklaracja Lucana, nie zmierzona
    wartosc; narrator jej nie potwierdza ani nie podwaza, dopoki nie zostanie uzyta.
    ZOBOWIAZANIE, KTORE POWSTAJE: "cokolwiek znajdziemy, jest nasze - i zloto, i ryzyko".
    Domyka to, co Boros nazwal sam z gory w t_279 (dzielimy jak ostatnio, moja czesc
    idzie do mnie). Wpisane do obligations jako zobowiazanie Lucana wobec ekipy, bo
    tym razem to JEGO slowa, a nie cudzy warunek. REAKCJE Z KONTRAKTOW. Boros (retcon_000183):
    zadnej analizy, zero reakcji na podatki i przepisy - on ich nie widzi - i jedno
    pytanie czysto operacyjne o sygnal odwrotu, bo wlasnie stoi na ostrym koncu. Mara:
    jedno zdanie i tylko o tej jednej rzeczy, ktora naprawde jej dotyczy. Jej os z
    kontraktu brzmi "wole nie wiedziec, niz potem tlumaczyc, ze wiedzialam", a Lucan
    wlasnie to jej odebral - i ona to NAZYWA, bez pretensji, bo tak wlasnie mowi.
    CZEGO NARRATOR NIE ROZSTRZYGNAL: czy Seraphine faktycznie "nieoficjalnie chcialaby",
    zeby przebili kolejne zawaly. To jest charakterystyka Lucana, nie stan jej umyslu;
    w t_269 powiedziala tylko, ze pod tym, co ekipa przywiezie, ma sie zgadzac to,
    co podpisala. NIEUSTALONE: czy Lucan poda sygnal odwrotu, o ktory pyta Boros;
    co odpowie Marze.'
  prose: 'Przecznicę za gildią ulica robi się na tyle pusta, że da się mówić.


    Lucan mówi do pleców Borosa i do profilu Mary, bo tak się rozmawia na wozie, i
    nikt się nie

    odwraca — co jest akurat wygodne dla wszystkich trojga.


    Seraphine nic nie wie i ma tak zostać. Wszystko za pierwszym zawałem jest poza
    zleceniem.

    Przez pierwszy trzeba się przebić, a jeśli za nim będą następne, to nieoficjalnie
    przez nie

    też. Co dalej — należy do nich. I cokolwiek znajdą, jest ich: i złoto, i ryzyko.


    Boros nie reaguje ani na podatki, ani na przepisy, ani na to, że gildia umyje
    ręce. Te trzy

    zdania przechodzą przez niego tak, jak przechodzi przez człowieka informacja,
    że w czwartek

    będzie targ.


    Reaguje dokładnie na jedno.


    — Jaki sygnał? — pyta, nie odwracając się. — Bo ja będę stał przodem do ściany
    i będę miał

    w rękach kilof. Więc jak mam się cofnąć, to musi być coś, co usłyszę przez walenie.


    To jest całe jego pytanie. Nie pyta, skąd Lucan będzie wiedział, nie pyta, co
    jeśli, i nie

    pyta, czy to bezpieczne.


    Mara słucha do końca i dopiero wtedy odwraca głowę — nie do Lucana, tylko tyle,
    żeby go mieć

    bokiem w polu widzenia.


    — Powiedziałeś mi to, czego nie chciałam wiedzieć — mówi. Zupełnie spokojnie,
    bez cienia

    wyrzutu, tym samym tonem, którym rano mówiła o workach. — Rano mówiłam, że tyle
    dostałam

    i tyle chcę mieć. Teraz mam więcej i nie mogę tego oddać.


    Poprawia rzemień kołczana, na którym nic nie wymaga poprawienia.


    — Nie proszę, żebyś cofnął. Mówię tylko, że od tej chwili, jak mnie ktoś zapyta,
    to albo

    skłamię, albo cię wydam. Chcę, żebyś wiedział, że ja to wiem.


    Cisza, w której koło wpada w koleinę i wóz się przechyla.


    — Nie pytam jak — dodaje po chwili, już zwyczajnie. — Nie pytałam wczoraj i dzisiaj
    też nie

    będę.


    Boros wybiera ten moment, żeby przełożyć uzdę do drugiej ręki.


    — Ja tam mam pytanie na potem — mówi. — Nie teraz. Jak się skończy, to mi powiesz,
    i tyle.

    — Pauza długości dwóch kroków konia. — Ale sygnał chcę teraz.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs: []
  operations:
  - *id002
  scene_update: null
  new_decision: 'Ulica w drodze na cmentarz, 10:49, dzien piaty. Odprawa wygloszona
    w calosci. Boros przyjal wszystko bez jednego slowa o podatkach, przepisach i
    umytych rekach - te kategorie u niego nie istnieja - i postawil JEDNO pytanie,
    ktorego nie odpusci: JAKI SYGNAL ODWROTU, slyszalny przez walenie kilofem, bo
    to on stoi przodem do sciany. Chce go TERAZ. Reszte odklada na po sprawie. Mara
    nie poprosila o cofniecie niczego i nie zapytala JAK. Nazwala natomiast koszt,
    ktory wlasnie poniosla: od tej chwili, zapytana, albo sklamie, albo go wyda -
    i chce, zeby Lucan wiedzial, ze ona to wie. To NIE jest warunek ani grozba; to
    jest jej "wole nie wiedziec, niz potem tlumaczyc, ze wiedzialam" wypowiedziane
    po tym, jak juz jest za pozno. OTWARTE I POSTAWIONE WPROST: (1) sygnal odwrotu
    dla Borosa, (2) czy i co Lucan odpowie Marze. NIEROZSTRZYGNIETE: czy Lucan potwierdzi
    Borosa na ostrym koncu. Pod brama cmentarna wedle Mary dwadziescia po jedenastej.'
