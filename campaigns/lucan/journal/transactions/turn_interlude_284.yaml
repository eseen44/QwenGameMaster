    - id: order_night_chapel_residue_cleanup
      status: completed
      source_event_id: event_act_02_closeout_interlude_import
      instruction: Pomóc przenieść, wyssać i ukryć szczątki dwóch ofiar z kaplicy.
      historical_parenthesis_exception: true
      precedent_for_future_parenthetical_messages: false
      time_advanced_when_issued: false
      execution_started: true
    - id: order_standoff_escort_fifty_metres
      status: active
      source_event_id: event_turn_interlude_276
      instruction: 'Towarzyszyc Lucanowi poza baszta w dystansie ok. 50 m - nie na
        nim. Zadanie: oslona i wczesne dostrzezenie zagrozenia. Wybor trasy i stanowiska
        pozostawiony okazowi (karta: sam wybiera stanowisko, t_133).'
    last_event_id: event_turn_interlude_284
