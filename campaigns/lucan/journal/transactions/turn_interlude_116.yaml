outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut,
    zero energii. 1. PODZIAL WYKONANY OD RAZU I PO ROWNO - CZTERY TYSIACE NA GLOWE,
    W ZLOTEJ MONECIE, tej samej, ktora dalo sie wyniesc z pokoju powroznika. Lucan
    nie czeka na osobne rozliczenie ze strony syndykatu i nie robi z tego przedstawienia.
    Boros bierze swoje bez komentarza i zaklada, ze idzie to na poczet jego dzialki,
    dopoki nikt nie powie inaczej. Mara przelicza, chowa i nie dziekuje - u niej brak
    podziekowania jest komplementem, bo znaczy, ze to bylo nalezne. 2. ODPOWIEDZ O
    GILDII BOROS NAZYWA TYM, CZYM JEST, I ROBI TO BEZ ZLOSLIWOSCI: to nie jest wersja,
    to jest odroczenie. Prosil o jedno zdanie, ktore wszyscy troje powiedza tak samo,
    a dostal termin bez daty. 3. ALE ODROCZENIE PRZYJMUJE - I PRZESUWA TYLKO PROG,
    PO ZOLNIERSKU. Nie zada wersji przed przesluchaniem. Zada jej PRZED PIERWSZYM
    BUTEM NA CMENTARZU. Kolejnosc, ktora mu odpowiada: przesluchanie, potem wspolna
    wersja, potem pieczecie. Jesli proby gildii wypadna wczesniej niz przesluchanie,
    ta kolejnosc sie sypie i wtedy rozmawiaja jeszcze raz - to jest jego jedyny warunek
    i nie ma w nim grozby. 4. SERAPHINE - I TU ODZYWA SIE MARA, KTORA O KOSCIOL NIE
    ZAPYTALA, ALE O TO PYTA. Jej odczyt jest chlodny i trudny do zbicia: Seraphine
    JUZ w tym jest. Utrzymuje slad zamieszkania w pokoju dyzurnym, ktory jest przykrywka
    do przeszukania (event_turn_interlude_072), i dostala do prowadzenia lancuch autoryzacji
    polnocno-zachodniej zapory (event_turn_interlude_052). Nie jest osoba, ktora mozna
    oszczedzic - jest osoba, ktora juz plynie. 5. WNIOSEK MARY, POSTAWIONY JAKO PYTANIE,
    NIE JAKO RADA: co dokladnie zabija Seraphine szybciej - uslyszenie tego wczesnie,
    w miejscu, ktore sama wybierze, czy uslyszenie tego pozno, w sali, w ktorej bedzie
    musiala zareagowac na oczach kierownictwa, nie majac przygotowanej ani jednej
    odpowiedzi. Mara nie rozstrzyga. Mowi tylko, ze widziala juz ludzi, ktorych zabilo
    to drugie. 6. WORLD MOVE - DZIEN SIE KONCZY I OBOJE MAJA WLASNE PLANY, KTORE NIE
    CZEKAJA NA LUCANA. Boros zabiera swoje cztery tysiace i znika na dzien albo dwa:
    gotowke trzeba schowac tak, zeby nie tlumaczyc sie z niej przy zadnym stole, a
    on ma juz jedna zasade, ktorej nie zlamie - nie byc w niczyjej ksiedze. Mara przypomina
    o godzinie cwiczen o swicie dnia czwartego i pyta, gdzie po niego przyjsc. 7.
    STAN. 17:10 dnia trzeciego, targ zamkniety, zmierzch. Energia 7.8 z 15, integralnosc
    19 z 19, bez warunkow. Przy Lucanie zostaje 4 000 srebra w zlocie plus drobne;
    40 000 do odebrania w dwoch ratach. Przepustka nietknieta, Spidey nieodkryty.
    Nieudzielone i wiszace: kanal ostrzegawczy dla syndykatu, odpowiedz dla Kesza
    kim Lucan siada przy kaplanie, droga po zakon mieczowy, i teraz takze - kiedy
    i gdzie Seraphine tego sluchа.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Wieczor dnia trzeciego stoi otworem, a lista jest krotka i cala pilna:
    Seraphine (wczesnie i po swojemu czy pozno i na sali), odpowiedz dla Kesza, kanal
    ostrzegawczy dla syndykatu, droga po zakon. Mara czeka tylko na jedno slowo -
    gdzie ma po Lucana przyjsc o swicie.'
