    definicja, co to w zasadzie znaczy; prawa nie pisal inkwizytor, uczony ani mag,
    tylko

    trzeciorzedny szlachcic, ktorego glowna kwalifikacja jest walenie konkubiny. To,
    ze

    inkwizytor albo tluszcza uwazaja cos za oburzajace, nie znaczy, ze mozna za to
    osadzic i

    skazac. SKRYTOBOJSTWO - nie ma cial, nie ma skrytobojstwa; nigdy zresztą nie mowil
    jej o

    zadnym wielkim skrytobojstwie, a jako najemnik moze miec przy sobie narzedzia
    mordu.

    SIATKA - zarzut jest jeszcze smieszniejszy: skad ona wnioskuje, ze ten "bezmyslny

    konstrukt" moze go o czymkolwiek informowac? Jest malym ludzkim radarem, moze
    wiedziec

    rzeczy, a nawet gdyby - od kiedy to jest nielegalne? VARKHEN - nie ma zadnego
    polaczenia,

    jak nieumarly zostanie wyzerowany; a poza tym wydawalo mu sie, ze jej zalezalo
    na

    zachowaniu dziadka w stanie, w ktorym moze pomoc z cmentarzem, wiec niech przestanie

    przedstawiac to jako wylacznie problem Lucana.

    '
