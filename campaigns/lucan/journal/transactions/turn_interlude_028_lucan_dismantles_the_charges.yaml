  summary: 'Bez testu. Lucan wygrywa te wymiane i Seraphine oddaje mu punkt po punkcie
    - a to, co

    zostaje po jej stronie, jest gorsze niz to, co stracila.

    PRAKTYKA - przyznaje premise: definicji nie ma, statuty i kary nie sa skodyfikowane,
    a

    prawo Lumarii jest sredniowieczne, rozdrobnione, oparte na statusie i egzekwowane

    niekonsekwentnie. Ale odwraca to: brak definicji nie jest jego oslona, to jest
    oslona

    TEGO, KTO TRZYMA FORUM. Skodyfikowany przepis dalby mu granice, za ktora moze
    stanac.

    Nieokreslony czyn definiuje ten, kto ma dowod, widownie, pozycje i sile. Zgadza
    sie

    rowniez, ze oburzenie nie jest wyrokiem - i wlasnie dlatego Kosciol nie skazuje,
    a

    ZADA stlumienia.

    CIALA - oddaje calkowicie. Nie ma zadnych cial. Kaplicowe sa nierozpoznawalne
    i tylko

    Lucan i jego sludzy wiedza gdzie; ona nie ma tego w swojej wiedzy i nie moze na
    tym nic

    zbudowac. Ciala z wysypiska umarly miesiac temu i sa dawno pochowane albo spalone
    jako

    chorobowe. Przyznaje tez narzedzia mordu: najemnik moze nosic bron, to nie jest
    zarzut.

    SIATKA - oddaje niemal calkowicie i mowi mu wprost, ze to byl jego najlepszy ruch,
    bo

    zamknal na niej pulapke: jesli Spidey jest bezmyslnym konstruktem, to nie moze

    raportowac, a jesli raportuje, to nie jest bezmyslny. Nie da sie miec obu naraz
    i to

    ONA zostaje z tym problemem, nie on. Dorzuca, ze jego alibi jest instytucjonalne
    i

    wlasnie ona je przyjela: raport przedoperacyjny z cmentarza, w ktorym Lucan zglasza,
    ze

    sam wykrywa pustki i skupiska smierci. Wiedza i zdolnosc jej uzycia nie sa nielegalne.

    Zostaje jej tylko fizyczny osad - pajeczyny w trzech miejscach powiazanych z jego

    sprawami - i sama nazywa to cienkim.

    VARKHEN - oddaje w calosci i przyjmuje uderzenie. Tak, wyzerowany nieumarly to
    brak

    wiezi. Tak, to ona chce zachowac dziadka w stanie uzytecznym dla pieczeci, ona
    go

    wyprowadzila z osuwiska i ona go trzyma w piwnicy TEGO budynku. Jest w tym razem
    z nim

    i nie udaje inaczej. Dodaje jednak koszt, ktorego Lucan nie policzyl: Varkhen
    jest

    jedynym swiadkiem tego, ze kaplan znal wlasciwe wejscie, kontrolowal pieczecie
    i przy

    ostatniej wizycie przyszedl z Orenem. Wyzerowanie go likwiduje dowod przeciw Lucanowi
    i

    jednoczesnie jedyna bron Lucana przeciw Kosciolowi.

    WNIOSEK, ktory Seraphine wyciaga na glos i ktory jest cala nowa informacja tej
    tury:

    nie jest oskarzycielem. Prowadzila sprawe drugiej strony, zeby Lucan uslyszal
    ja od

    kogos przyjaznego. Skutek jest jednak inny, niz zakladala - jego pozycja PRAWNA
    jest

    znacznie mocniejsza, niz sadzila. A to nie usuwa zagrozenia, tylko je PRZENOSI.
    Czlowiek,

    ktorego nie da sie skazac, jest problemem, ktory rozwiazuje sie bez sadu: cichym

    zamknieciem sprawy przez wlasny rod, stlumieniem po stronie Kosciola, albo wymiana

    odstapienia od zarzutow na sluzbe, dostep i milczenie. Wygral proces, ktorego

    najprawdopodobniej nigdy nie dostanie.

    '
  new_decision: 'Seraphine oddala mu ciala, narzedzia, siatke i Varkhena, przyznala,
    ze siedzi w tym z

    nim, i przeniosla zagrozenie z sali sadowej na to, co sie dzieje bez sadu. Wskazala
    tez

    nowa dzwignie, o ktorej Lucan nie myslal - Varkhen jako swiadek przeciw kaplanowi.

    Zostaly dwie rzeczy niepowiedziane, dysputa i to, ze ojciec zna metode, a noc
    jest juz

    gleboka. Lucan bierze temat kaplana i zeznania Varkhena, domyka wreszcie dyspute,
    pyta

    ja, kto konkretnie w rodzinie moglby chciec cichego zamkniecia sprawy, czy konczy
    i

    idzie do baszty po urobek?

    '
  operations:
  - *id002
