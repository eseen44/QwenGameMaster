outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'NARRATOR POMINAL NAJWAZNIEJSZY RAPORT DNIA i gracz to wylapal. W t_299/t_300
    przy przegladzie sieci wymienione zostaly wezly z drugiego konca miasta, a Spidey
    - jedyny okaz, ktory spedzil POL DNIA w podziemiach - nie zostal w ogole odpytany.
    Ta tura to nadrabia. KANAL JEST PELNY, bo Spidey stoi obok. spy-series#link mowi,
    ze pozyczenie zmyslu zalezy od pasma okazu i od ODLEGLOSCI; z cmentarza nie da
    sie odpytac pajaka na targu, ale okaz przy nodze oddaje wszystko, na co go stac.
    Ta sama regula, ktora w t_300 uciela reszte sieci, dziala tu w druga strone. ROZSTRZYGNIETE:
    (1) komora konczy sie schodami i nie ma innego wyjscia na tym poziomie; (2) ZRODLO
    PRZECIAGU, otwarte od t_290 - powietrze wchodzi NIZEJ; (3) ponizej schodow jest
    przestrzen, ktora oddaje dzwiek inaczej niz komora. SPIDEY NIE ZSZEDL DO KONCA
    I JEST TO JEGO DECYZJA, NIE LIMIT NARRATORA: stopnie sa strome, a on ma condition
    partial_hind_leg_loss o magnitude 30. Zszedl tyle, ile mogl zejsc i miec pewnosc
    powrotu, po czym wrocil. Karta mowi, ze ryzykuje ze stylu, nie z brawury, i ze
    sam wybiera stanowisko - wiec narrator go nie zawracal niczym wymyslonym. CZEGO
    TEN RAPORT NIE ROZSTRZYGA I NIE MOZE: blind_to_undead - zaden okaz serii nie widzi
    nieumarlego. Cisza Spideya dotyczy ZYWYCH. Na martwych odpowiadalo Geo w t_289
    i t_292 (plasko, staro, nic nie drgnelo), ale tylko w zasiegu reki na kamieniu.
    NIEUSTALONE: co jest na dole; gdzie dokladnie wchodzi powietrze; czy ktos tamtedy
    chodzi.'
  prose: 'Lucan siada przy tylnym kole i dopiero teraz robi rzecz, którą powinien
    był zrobić cztery

    godziny temu.


    Pyta Spideya.


    Ten czeka na to od rana. Nie niecierpliwie — po prostu czeka, jak czeka pająk,
    i kiedy Lucan

    wreszcie sięga, wszystko jest już ułożone, bo miał pięć godzin na ułożenie.


    Z bliska kanał niesie wszystko, na co go stać, i to jest cała różnica między tym
    a resztą

    sieci. Toby na zapleczu syndykatu jest w tej chwili jednym słowem: *jest*. Spidey
    siedzi metr

    dalej i oddaje pięć godzin.


    Najpierw kształt.


    Komora kończy się schodami i to jest jej jedyne zakończenie. Spidey obszedł ją
    całą — obie

    ściany, oba końce, i wrócił inną stroną niż poszedł, bo tak robi zawsze. Na tym
    poziomie nie

    ma drugiego wyjścia. Żadnej szpary, żadnego przewiewu w bok, żadnych drzwi. Kto
    tam wejdzie,

    wejdzie albo przez ich przebicie, albo od dołu.


    Potem powietrze, i to jest odpowiedź na pytanie, które stoi od południa.


    Przeciąg nie ma źródła w komorze. Wchodzi **niżej** — Spidey zszedł za nim schodami
    i czuł,

    jak z każdym stopniem robi się mocniejszy, nie słabszy. Cokolwiek łączy to miejsce
    ze światem,

    jest pod nimi, nie przy nich.


    Zszedł kawałek. Nie do końca.


    I tu jest jedyna rzecz w całym raporcie, która brzmi jak coś więcej niż pomiar:
    stopnie są

    strome, a Spidey nie ma jednej tylnej nogi w całości. Zszedł dokładnie tyle, ile
    mógł zejść

    i mieć pewność, że wyjdzie z powrotem, a potem się zatrzymał i wrócił. Nie dlatego,
    że coś

    go zawróciło. Dlatego, że policzył.


    To, co zdążył złapać z dołu, jest krótkie.


    Tam jest przestrzeń i brzmi inaczej niż komora. Komora odbija dźwięk od równych
    ścian i oddaje

    go szybko. To pod spodem oddaje go wolno, długo i nie ze wszystkich stron — jakby
    część

    dźwięku poleciała gdzieś i nie wróciła wcale.


    I żadnego ciepła. W niczym, co objął, ani jednej żywej plamy.


    Lucan puszcza kanał i przez chwilę siedzi z tym.


    Bo to nie znaczy, że na dole nie ma nic. To znaczy, że na dole nie ma nic, co
    oddycha —

    a Spidey jest ślepy dokładnie na to jedno, na co Lucan sam patrzy najczęściej.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs:
  - campaigns/lucan/companions/spy-series.yaml#link
  - campaigns/lucan/companions/spy-series.yaml#blind_to_undead
  - campaigns/lucan/state/instances/spidey.yaml#conditions.partial_hind_leg_loss
  operations:
  - *id002
  scene_update: null
  new_decision: 'Cmentarz, przy wozie, 22:07, dzien piaty. RAPORT SPIDEYA - piec godzin
    wlasnej roboty w podziemiach, odebrany z pelnego pasma, bo stal obok. (1) KOMORA
    KONCZY SIE SCHODAMI i nie ma na tym poziomie innego wyjscia; obszedl obie sciany
    i oba konce, wracajac inna strona. Kto tam wejdzie, wejdzie przez ich przebicie
    albo od dolu. (2) ZRODLO PRZECIAGU JEST NIZEJ - z kazdym stopniem powietrze mocniejsze.
    Pytanie otwarte od t_290 rozstrzygniete: polaczenie ze swiatem jest POD nimi.
    (3) NA DOLE JEST PRZESTRZEN, ktora oddaje dzwiek wolno, dlugo i nie ze wszystkich
    stron - czesc dzwieku nie wraca wcale. (4) ZERO CIEPLA w tym, co objal. SPIDEY
    NIE ZSZEDL DO KONCA I SAM PRZERWAL: stopnie strome, a on ma partial_hind_leg_loss.
    Zszedl tyle, ile mogl zejsc z pewnoscia powrotu. Nic go nie zawrocilo - policzyl.
    OGRANICZENIE: blind_to_undead. Cisza Spideya dotyczy ZYWYCH. Na martwych odpowiadalo
    Geo, ale tylko w zasiegu reki na kamieniu. SIECIARZE POPRAWIENI (retcon_000195):
    sa na wlasnych rewirach, rozkaz zbierania z t_091 zamkniety. Garbarnia - laka
    za garbarnia, czyli DOKLADNIE tam, gdzie lezy sklad. Cmentarz - tutaj. Baszta
    (dawniej Wysypisko) - laki przed baszta, kilometr do trzech dalej wzdluz muru,
    OSOBNY rewir. Nadwyzka sieci 25,3 -> 28,3. OTWARTE: czy schodza dzis po ciemku,
    czy ktos spi, czy Lucan idzie sam za przeciagiem.'
