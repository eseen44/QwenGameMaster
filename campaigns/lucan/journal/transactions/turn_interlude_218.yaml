  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Trzy minuty.

    KOSZT: 2 JEDNOSTKI - podwojnie, bo bez opakowania. Marn sam z siebie mowi o wozie.


    1. PIERWSZE ROZLICZENIE retcon_000132 W GRZE I WYPADA DROZEJ, NIE TANIEJ.

    Kanal nie jest zrosniety z klatwa, wiec rozwiazanie jezyka wolno rzucic goło i
    na

    dystans - ale metamagia dziala w obie strony. curse_loosened_tongue ma

    measured_cost_units 1 ZMIERZONE PRZEZ POWITANIE, czyli z osia range na zerze.

    curses.md#dotyk-jako-kanal-dostarczenia: "ograniczenie dostarczenia do dotyku
    jest warte

    okolo jednego poziomu", z precedensem Bone Chill 1 przez dotyk / 2 na dystans.

    Zdjecie range z zera to jeden poziom w gore, a metamagic.md daje 2^(poziom-1).

    1 -> 2. NALICZONE 2 JEDNOSTKI. Rzucone z wlasnego ciala, nie przez Spideya, wiec
    bez

    strat sieciowych (retcon_000131 nie ma tu zastosowania - Lucan stoi obok celu).

    ENERGIA SCHODZI Z 9,57 NA 7,57. Sesja klatw kosztuje dzis wiecej niz caly dzien
    pracy.


    2. CO KOSZT KUPIL, A CZEGO NIE. Bez rozdzialu towarzyskiego i bez opoznienia jest
    to

    WERSJA ODSLONIETA: rzut obronny odpada tylko przy automatyzmie spolecznym, a tu
    zadnego

    nie bylo, i rzut na rozpoznanie-skojarzenie jest dopuszczalny (retcon_000132 punkt
    5).

    NIC SIE NIE STALO, ale narrator odnotowuje DLACZEGO, zeby nie czytac tego jako
    reguly:

    cel jest cywilem bez arkusza, niemagicznym, nieprzygotowanym, po czterech godzinach
    piwa,

    w polowie zdania, i ma juz na sobie warstwe tej samej procedury. Wobec kogos

    przygotowanego albo magicznie pismiennego to bylby wlasnie ten rzut, ktory zapada.

    Rzutow i tak nie ma - roll_policy disabled.


    3. DRUGA WARSTWA - CO DODAJE, A CZEGO NARRATOR NIE WYMYSLA. curse_loosened_tongue
    NIE MA

    W PLIKU TABELI STACKOWANIA (w odroznieniu od effect_numb, ktory ma jawne progi
    1-4).

    Narrator wiec ZADNEJ NIE DORABIA i nie awansuje tego na nowy prog o nazwie.

    Rozstrzyga narracyjnie i skromnie: to jest WZMOCNIENIE, nie eskalacja. Hamowanie
    schodzi

    glebiej, tempo mowy rosnie, Marn przestaje robic pauzy, w ktorych normalnie by
    sie

    zastanowil, co wypada powiedziec obcemu.

    CENA TEGO WZMOCNIENIA JEST KONKRETNA I JEST W PLIKU: skutek uboczny z t_127 skaluje
    sie

    razem z glebokoscia. Im mniej hamowania, tym wieksza sklonnosc do KONFABULACJI
    przy

    pytaniu o rzecz, ktorej nie wie. Od tej chwili traktowac to jako podwyzszone ryzyko,

    nie jako pewnosc.


    4. HACZYK CHWYTA - I CHWYTA NIE TAM, GDZIE ZOSTAL ZARZUCONY. Lucan mowi o uczelni,

    o preparatach umrzykow i o tym, ze nikt nie wie, o co chodzi. To jest zasiana
    wersja,

    nie prawda o swiecie - idzie do state/secrets.yaml#cover_stories, nie do zadnego
    pliku

    opisujacego, jak cos naprawde jest (retcon_000120).

    MARN NIE MA POJECIA, CO TO JEST PREPARAT, I MOWI TO WPROST. Ale slowo "umrzyki"
    wchodzi

    w niego bez zadnego filtra, bo filtra juz nie ma, i wyrzuca z siebie skojarzenie,

    ktorego trzezwy nie podalby obcemu:

    ZE ON TEZ MA COS Z TRUPAMI, TYLKO OD DRUGIEJ STRONY. Wóz. Podnosi dla niego drag.

    CO MOWI, BO TO WIE - I JEST TO DOKLADNIE ZAKRES WIEDZY CZLOWIEKA OD DRAGA:

    ze woz jezdzi STALA TRASA i ze przy takim wozie nie ma sie czego czepiac - papier
    sie

    pokazuje, drag idzie w gore, woz jedzie. Ze zwykly woz stoi i sie go oglada, a
    ten nie stoi.

    Ze robi to od dawna i nigdy nikt mu z tego powodu nic nie powiedzial.

    CZEGO NIE MOWI, BO NIE WIE: kto podpisuje, co konkretnie jest w srodku, dokad
    to jedzie.

    NARRATOR NIE ROZSTRZYGA, CZY NIE WIE, CZY NIE MOWI - ale tym razem nie jest to
    unik,

    tylko zapis granicy z jego wlasnej karty: what_is_not_known ma wprost pozycje
    "czy wiedzial,

    co wozi woz, czy podnosil drag na okazany papier i nie patrzyl dalej". Ta pozycja

    ZOSTAJE OTWARTA, bo Lucan o to jeszcze nie zapytal.

    ZADNE ZDANIE W TEJ TURZE NIE JEST KONFABULACJA - Marn mowil wylacznie o rzeczach,
    ktore

    robi wlasnymi rekami.


    5. CO SIE WLASNIE POTWIERDZILO OD DOLU, TAK SAMO JAK U DASTA. item_watch_transport_permit

    ma known_effect "formalna autoryzacja TRASY wozu do przewozu zwlok" i legible_details

    z typem autoryzacji STALEJ TRASY. Seraphine odczytala w t_036, ze ten typ stoi
    PONAD

    szeregowym konstablem. Marn wlasnie opisal tę samą rzecz z poziomu draga, nie
    wiedzac,

    co opisuje: stala trasa to w praktyce woz, ktorego sie NIE ZATRZYMUJE.

    To jest trzecie potwierdzenie tego samego mechanizmu z trzeciego niezaleznego
    kierunku

    (t_034 Seraphine, t_207/209 Dast, teraz Marn) i ZADNE Z NICH nie wymagalo dopisania

    nowego faktu do swiata.


    6. CZEGO NARRATOR TU NIE ZROBIL (retcon_000058). Nie podal nazwiska podpisujacego,
    urzedu,

    daty, trasy, czestotliwosci ani zawartosci. Nie wyjal zadnej listy. Nie ustanowil,
    ze Marn

    wie o cmentarzu, o gildii, o Seraphine albo o czymkolwiek ze sprawy. Nie zrobil
    z niego

    wspolnika ani swiadka do zlamania (do_not_play). Nie skojarzyl mu "czlowieka z
    uczelni"

    z niczym. Nikt z izby nie wyszedl. Zaden zegar nie drgnal poza uplywem czasu.

    ODNOTOWANE JAKO PRAWDA STANU, BEZ DRAMATYZOWANIA (retcon_000055): Marn ma teraz

    wspomnienie mlodego czlowieka z uczelni, ktory podniosl go z ziemi i pytal o trupy.

    Zapadni pamieci na nim NIE MA. Nikt tego nigdzie nie zapisal i nic z tego dzis
    nie wynika.


    7. STAN. Czwarty dzien interludium, podworzec Pod Obrecza. Obecni: Lucan (imie
    nadal

    niepodane), npc_ossek_marn - o sciane, dwa stacki numb, rozwiazany jezyk w drugiej

    warstwie. Tkacz przy Lucanie, Spidey na belce, zuk i glejt w kieszeni.

    Integralnosc 19/19, energia po odjeciu 2 jednostek - czytac z pliku.

    Godzine czytac ze state/time.yaml po commicie.

    '
