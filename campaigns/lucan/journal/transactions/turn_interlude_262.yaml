outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: unchanged
  perspective: pc_lucan
  summary: 'PYTANIE ZADANE VARKHENOWI, NIE SYSTEMOWI - tekst poza nawiasem, a on stoi
    obok (retcon_000054). ODPOWIEDZ JEST ODMOWA POMIARU I JEST ZGODNA Z KARTA: jego
    ostatni pobyt tutaj to milestone_045, kiedy byl cialem wyciaganym z komory, a
    nie straznikiem na warcie; punkt odniesienia ma wiec sprzed uszkodzenia, a wlasne
    cialo stoi na integrity 9,4/65 z condition severely_depleted. Mowi wprost, ze
    nie umie oddzielic, czy zmienila sie pieczec, czy on. Narrator NIE dal mu skali
    ani procentu - to byloby uczynienie go przyrzadem wbrew voice_contract#blind_spot.
    CO PADLO KONKRETNEGO: zeby to wiedziec, trzeba stanac przy pieczeci - a tedy sie
    nie da (t_261). To jest jego zdanie, nie zestawienie zrobione przez narratora
    za gracza; wejscia frontowego ani kaplana Varkhen w tej turze nie wymienil. PRZEKOP:
    ocena Lucana wypowiedziana glosno, narrator jej nie potwierdza jako pewnika ani
    nie obala - geo nie podalo grubosci korka i to zostaje NIEUSTALONE. STAN NIETKNIETY:
    zero kosztow, zero ruchu, zero nowych zobowiazan. Zegary bez zmian. Pytanie decyzyjne
    z t_261 zostaje w mocy, wiec new_decision puste (retcon_000142).'
  prose: "- Nie przekopiemy się tędy - mówi Lucan, i to nie jest pytanie.\n\nVarkhen\
    \ patrzy na zasyp tak, jak się patrzy na robotę, którą się zna. Nie odpowiada\n\
    od razu. Kładzie dłoń na płycie sterczącej z ziemi, przyciska, i płyta nie drgnie;\n\
    ręka, która wyjmowała kamienie z fundamentu kaplicy, zostaje na niej chwilę dłużej,\n\
    niż trzeba, żeby się przekonać.\n\n- Nie tej nocy - mówi w końcu i cofa rękę.\n\
    \nPytanie o to, o ile gorzej jest po drugiej stronie, przyjmuje bez pośpiechu\
    \ i bez\npróby ratowania się ogólnikiem.\n\n- Ostatni raz byłem tu jako to, co\
    \ się wynosi - mówi. - Nie stałem na warcie. Nie\n  czułem wtedy nic, bo nie było\
    \ czym.\n\nCisza, w której coś liczy, chociaż nie liczbami.\n\n- Pamiętam, jak\
    \ trzymała, kiedy byłem cały. Teraz czuję ją stąd i jest inaczej.\n  Ale ja też\
    \ jestem inny. - Patrzy na własną rękę, na to, czego w niej brakuje. -\n  Nie\
    \ wiem, czy zmieniła się ona, czy ja. Nie powiem ci, o ile, bo nie wiem.\n\nI\
    \ jeszcze jedno, spokojnie, jakby to była oczywistość, którą się mówi dziecku:\n\
    \n- Żeby wiedzieć, trzeba przy niej stanąć.\n"
