  summary: 'Bez testu - rozmowa, siedem minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Poprzedzona uznana reklamacja kanonu - patrz retcon_000053.


    1. RETCON_000053 - SPRAWCA SABOTAZU EDUKACJI. Narrator przypisal w t_162 domowi

    narzeczonej podciecie edukacji Lucana. Zrobila to GLOWNA LINIA RODU VEYR

    (player/background.yaml#background_family_retaliation_and_education_sabotaged).
    Dom

    narzeczonej byl stroną OBRAZONA - niedotrzymanie ustalen, nie krzywda. Odczyt

    publikacji odwraca sie na korzysc Lucana: mozliwe ZADOSCUCZYNIENIE, nie uwertura.

    O samej kobiecie nadal nie wiemy nic i jest to celowe; wspomnienia Lucana sa z
    wieku

    10-14 lat i nie okreslaja jej dzisiaj.


    2. TEZA ZOSTAJE - I UZASADNIENIE JEST MOCNIEJSZE NIZ ZARZUT NERIS. Beneficjent
    nie

    jest wada projektu, tylko jego MECHANIZMEM. Cel z t_160 brzmial: Kosciol ma

    zaakceptowac ustalenia debaty, a nie zostac pokonany. Kanon mowi, ze Kosciol reaguje

    na wiarygodny dowod zadaniem stlumienia (necromancy-law#church_position) i nie
    uznaje

    szarej strefy doktrynalnie - czyli sam z siebie nie zaakceptuje niczego. Musi
    zostac

    DOCISNIETY przez strony, ktorych nie moze zignorowac. Grupa konserwatywna, militarna,

    siedzaca przy tronie i majaca wlasny interes w twardym zakazie, jest dokladnie
    takim

    dociskiem. Lucan nie kupuje ich przychylnosci - kupuje ich NACISK.


    3. I TO ODWRACA ZARZUT NERIS Z t_162, NIE ODRZUCA GO. Ona miala racje co do litery:

    tej grupie sankcja nie zagraza. Miala jednak zle kryterium - liczy sie nie to,
    komu

    zagraza, tylko kto bedzie chcial ja egzekwowac. Beneficjent egzekwuje chetniej
    niz

    zagrozony.


    4. CENA, KTOREJ NIKT NIE ZDJAL. Egzekutor powiazany z panujacym monarcha jest
    powyzej

    forow miejskich, a caly projekt mial trzymac spor w forach, bo poza forami oslona

    Seraphine nie dziala (act-03-defence#legalisation_horizon). Lucan przyjmuje to

    swiadomie. Zostaje w plikach jako otwarte, nie jako rozstrzygniete.


    5. ZMIANA TEMATU PRZYJETA - I ZAMYKA DWIE RZECZY NARAZ. Dziekan i dwoch ekspertow

    (prawnik z t_102, kaplan przez Kesza z t_113) sa po stronie Lucana; pisanie materialu

    wraca na stol. Ojciec nie ma z tym problemu, bo dostal deliverable z bramka.


    6. TRZECIA SUBSTANCJA PADA WRESZCIE - POROST SLEPY (lichen_speculans). Wisiala

    niewymieniona przez PIEC tur (t_151, 155, 156, 157, 158, 161). Ojciec nie podal
    jej

    w t_151, bo wtedy wyliczal SKARGI - Concha surda przeszkadza jego przyrzadom,
    Sordina

    zzera mu okazy w magazynie - a porost nie jest jego szkodnikiem ani jego problemem,

    wiec nie mial powodu o nim mowic. Lucan opisal WYMAGANIE (kryjowka w bezruchu,

    dopasowanie do podloza, trwale), a nie nazwe, bo nazwe zna wylacznie z warstwy

    planowania. Ojciec podal nazwe. Kanaly wiedzy zostaly rozdzielone poprawnie.


    7. TO DOMYKA build_moth_glutton (planning/specimen-upgrades.yaml). Obie pozycje
    maja

    teraz zrodlo w swiecie: implant_sordina 8 h, implant_lichen_speculans 12 h. Razem
    z

    utwardzeniem zawisaka to jedyne, co dzieli spy_hawk_moth_01 od wypuszczenia. Koszt

    jest CZASEM PRZY STOLE, nie energia (retcon_000017). Nie doliczac nic ponad to.


    8. WORLD MOVE A - OJCIEC WCHODZI W POROST GLEBIEJ, NIZ TRZEBA, BO TO JEST NOWY

    PROBLEM (attitude_to_pc.likely_hook). Nie zadaje pytania "po co", zadaje pytania

    wykonawcze. Doklada tez ostrzezenie, ktore juz stoi w kanonie i ktorego nie wolno

    rozszerzac: porost daje kryjowke W BEZRUCHU i nie znosi ani nocnego trybu okazu,
    ani

    tego, ze za dnia rzuca sie w oczy (specimen-upgrades#daylight_note).


    9. WORLD MOVE B - I TO JEST SIODMY RAZ, KIEDY NERIS NIE PYTA. Trzecia substancja

    ukrywajaca wchodzi przy niej do rozmowy, a ona ma to wpisac w przypisy razem z

    dwiema poprzednimi (t_151: pytala, czy stoja w tej samej czesci co ceny). Jej
    wlasny

    wniosek z t_143 - ze sa albo beda zuki i cmy, i komus zalezy, zeby ich nie bylo
    widac

    - dostaje siodme potwierdzenie. Nadal nie zadaje pytania. Zamiast tego zadaje
    pytanie

    REDAKCYJNE, bo to jest jedyny sposob, w jaki ta osoba dotyka rzeczy niewygodnych.


    10. CZEGO NADAL NIE PADLO. Sygnatura podrecznika nieudzielona - osmy raz. Wpis
    do

    rejestru zaopatrzenia niezlozony. Imie narzeczonej i nazwa rodu - NIE WYMYSLAC.

    Ojciec nadal nie wie o nekromancji, sieci, Varkhenie, syndykacie ani o slowie
    wabik.


    11. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:47. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: teza zostaje, beneficjent
    jest

    mechanizmem docisku na Kosciol, nie wada; dziekan i dwaj eksperci po stronie Lucana;

    porost slepy nazwany w swiecie, build_moth_glutton domkniety materialowo; Neris
    ma

    trzecia substancje do przypisow i po raz siodmy nie pyta.

    '
