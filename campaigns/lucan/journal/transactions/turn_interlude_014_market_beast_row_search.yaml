  resolved_world_reaction_ids: []
  summary: 'Lucan przechodzi caly zwierzecy rzad. Zywych duzych pajeczakow na straganach
    NIE

    MA i nie bywa - to nie jest towar, ktory ktos trzyma w klatce dla klienta z ulicy.

    Rzed ma to, czego Lucan nie chce: kury, kroliki, prosiaki, koza, ptaki spiewajace,

    czyli same ssaki i ptaki. Z owadow jest tylko drobnica na przynete wedkarska -

    robaki, larwy, swierszcze, mączniki, tanio i w kazdej ilosci, ale dokladnie tej

    wielkosci, ktora Lucan juz opanowal i ktora nic nowego nie daje.

    Dwie realne sciezki wychodza z tego przejscia.

    PIERWSZA - handlarz zwijajacy stragan na koncu rzedu prowadzi "zywy towar dla

    alchemikow": skorpiony, duze chrzaszcze, czasem pajaki z karawan poludniowych.

    Nie trzyma zapasu, przyjmuje zamowienia i sprowadza na termin. Bierze zaliczke,

    zapisuje zamowienie i pyta po co - nie z podejrzliwosci, tylko dlatego, ze cena

    zalezy od tego, czy towar ma dojechac zywy. Kazde takie zamowienie to nazwisko,

    termin i swiadek, ktory bedzie pamietal, ze poszukiwacz przygod z gildii kupowal

    zywe pajaki, akurat na kilka dni przed przesluchaniami.

    DRUGA - darmowa i bez sladu. Skladowe i piwnice wokol rynku, spichlerz i zaplecze

    rzeznickie sa pelne duzych pajakow piwnicznych, kosarzy i tlustych chrzaszczy

    padlinozernych. Nikt ich nie sprzedaje, bo nikt ich nie chce; wystarczy noc,

    latarnia i cierpliwosc, ewentualnie sam Spidey albo sieciarz jako lowca.

    Trzecia rzecz sama wpada w oko przy skrecie do rzedu tkanin: kupiec jedwabniczy

    ma zywe jedwabniki na wage, koszykami. Owad, hodowany masowo, legalny, nudny -

    i produkujacy nic. Do lead_webber_silk_upgrade_human_scale to material az nazbyt

    oczywisty.

    '
  new_decision: 'Na straganach nie ma czego szukac - duzy pajeczak to albo zamowienie
    z nazwiskiem

    u handlarza alchemicznego, albo darmowe nocne lowy we wlasnych piwnicach miasta.

    Jedwabniki leza na wyciagniecie reki i sa calkowicie niewinne. Zostala niecala

    godzina swiatla. Lucan podchodzi do handlarza i pyta o warunki, kupuje jedwabniki,

    planuje nocne lowy z Spideyem - czy zamyka temat i wraca do baszty?

    '
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.zone_id
    value: zone_market_livestock_and_beasts
  - *id002
