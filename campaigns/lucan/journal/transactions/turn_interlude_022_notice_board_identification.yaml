  resolved_world_reaction_ids: []
  summary: 'Bez testu; portier to nie przeciwnik, a Lucan i tak czyta z ciemnej strony
    dziedzinca.

    Ojciec przyjmuje arytmetyke bez sporu - material za tydzien, praca POTEM, wiec

    pietnascie dni, nie osiem. Nie ma z tym problemu, bo termin, ktory sam sobie

    uzasadni, jest dla niego terminem. clock_father_arranges_academy_showing przestawiony

    8 -> 15.

    Zapowiedz na tablicy przy bramie okazuje sie tym, czego Lucan szukal, i daje wiecej

    niz nazwisko - daje DATE i DWIE strony sporu.

    Dysputa otwarta o granicach ozywionego konstruktu, za szesnascie dni. Referuje
    NERIS

    ALDHEN - stanowisko szerokiej definicji, autorka odbitki, ktora ojciec trzymal
    bez

    okladki. Oponuje IVAR KOLM - stanowisko waskie, czyli ten, kto bedzie dowodzil,
    ze

    cos takiego jak Spidey jest nieumarlym i niczym wiecej.

    Nazwiska Aldhen Lucan nie kojarzy w ogole - musiala trafic tu po jego wylocie
    albo z

    czesci instytucji, ktorej nigdy nie dotknal. Kolma kojarzy mgliscie jako kogos,
    kto

    juz wtedy tu byl, starszego i osadzonego, ale nigdy go nie uczyl.

    KLUCZOWA ZBIEZNOSC - szesnascie dni dysputy i pietnascie dni ojca to jedno okno.
    Ojciec

    nie bedzie organizowal zadnego wlasnego pokazu; wepchnie okazy syna do TEJ dysputy,
    bo

    to jest naturalne miejsce dla serii. To zmienia charakter rzeczy: nie prywatny
    pokaz

    dla zyczliwych, a publiczny spor z wyznaczonym oponentem, ktorego zadaniem jest

    wykazac, ze to nieumarly.

    Spotkania dzis nie ma i nie bedzie - Aldhen nie ma w budynku. Lucan ma za to nazwisko,

    tekst i miejsce pracy, czyli wszystko, czego potrzebuje, zeby podejsc do niej
    samemu,

    jutro, bez posrednictwa ojca i bez papieru.

    '
  new_decision: 'Nazwisko jest - Neris Aldhen, szeroka definicja, dysputa za szesnascie
    dni, oponent

    Ivar Kolm. To samo okno co pietnascie dni ojca i pietnascie dni do przesluchania
    w

    gildii; wszystko trzy zbiega sie w jednym tygodniu, dokladnie tak, jak Lucan chcial
    -

    tylko ze to bedzie publiczny spor, nie zyczliwy pokaz. Lucan wraca na gore pogadac
    z

    ojcem o Kolmie i o tym, w co go wlasnie wpisano, czyta odbitke Aldhen w nocy,
    zeby

    wiedziec czym ona argumentuje, czy wychodzi tak jak wszedl i rusza do baszty po
    urobek,

    zeby zaczac od cial na male okazy?

    '
  operations:
  - *id002
