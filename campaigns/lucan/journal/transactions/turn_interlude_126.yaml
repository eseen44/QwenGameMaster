  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut,
    zero energii. 1. AUTORYZACJI NIE MA I NIE BEDZIE - ale nie z powodu skrupulu.
    Seraphine nie ma czego podpisac: nie istnieje forma, w ktorej kontrolerka gildii
    zezwala na przekazywanie czegokolwiek organizacji przestepczej, a proba uzyskania
    takiej zgody wyprodukowalaby dokument, ktory jest cala sprawa. Klamstwo i zatajenie
    sa dla niej narzedziami, nie przeszkodami (karta, portrayal) - problemem jest
    slad, nie moralnosc. 2. STAWIA JEDNO ROZROZNIENIE I JEST ONO CALA ODPOWIEDZIA.
    Nie liczy sie, czy informacja jest tajna. Liczy sie, ILE OSOB MOGLO JA MIEC. Cokolwiek
    Lucan przekaze, co wiedziala tylko gildia, wskazuje na nia, bo ona jest tym kanalem
    - a ona wyjsc nie moze. Cokolwiek Lucan zobaczyl sam, jest jego. 3. CO ZOSTAJE
    PO TEJ STRONIE LINII: rytm instytucji. Kiedy Straz przetasowuje obsady, kiedy
    urzednik zaczyna uzgadniac akta, kiedy jest inspekcja - to sa rzeczy, ktore syndykat
    i tak pozna, tylko pozniej. Pryncypal kupil WYPRZEDZENIE, nie sekret (event_turn_interlude_113),
    wiec kalendarz spelnia produkt bez oddawania czegokolwiek, czego nie da sie oddac.
    4. I NAZYWA WLASNA BEZUZYTECZNOSC W TYM TYGODNIU, CO JEST BEZPOSREDNIM SKUTKIEM
    POPRZEDNIEJ TURY. Sama nie ma teraz zadnego wyprzedzenia - nie ma jej na rozdzielniku
    Cortha i dowiedziala sie o tym kwadrans temu. Jest w tej chwili najgorszym zrodlem
    w budynku i mowi to bez ironii. Jesli rozdzielnik zacznie do niej chodzic po jutrzejszej
    reklamacji, sytuacja sie zmieni; dzis nie. 5. WARUNEK, KTORY STAWIA, JEST JEJ
    WLASNA DOKTRYNA: nie chce wiedziec, kiedy Lucan tego uzyje. Nie zabrania. Chce
    miec liste rzeczy, ktorych nie zna, i ta ma na niej zostac. 6. NIE ROZWIJA TEGO
    DALEJ I MOWI DLACZEGO - jest po godzinie rozmowy, ma jeszcze dzien pracy i rano
    staje przed sluzbami. Odsyla Lucana. 7. WYJSCIE. Lucan opuszcza gildie i idzie
    w strone Akademii - okolo dwudziestu minut na piechote (retcon_000042: przejscie
    przez to miasto liczy sie w minutach). Cel deklarowany: nekromanci amatorzy oraz
    npc_neris_aldhen, ktorej Lucan nie zna z twarzy i nie kojarzy nazwiska - wie o
    niej tylko z tablicy przy bramie i z odbitki ze stosow ojca (npc_neris_aldhen.lucan_recognition:
    none). 8. UWAGI PORZADKOWE. Zdanie "na zewnatrz jest 16:30 i targ sie zwija, slonce
    nisko" z event_turn_interlude_113 jest niebyle - po retcon_000043 wyjscie od syndykatu
    bylo 13:30. Oraz: lead_necromancy_interest_register ma logged_event_id wskazujacy
    na superseded event_turn_interlude_122, wiec rejestr NIE zostal Seraphine ujawniony
    nawet jako kategoria i jej odmowa przyjecia tej pozycji nie miala miejsca. 9.
    STAN. 15:10 dnia trzeciego przy wyjsciu z gildii, potem droga. Energia 7.8 z 15,
    integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu
    w kieszeni, Spidey przy zebrach nieodkryty. USTALONE: autoryzacji nie ma i nie
    bedzie; linia podzialu to liczba osob, ktore mogly miec informacje, nie jej tajnosc;
    kalendarz instytucji wolno oddawac; Seraphine nie chce wiedziec, kiedy Lucan tego
    uzyje; w tym tygodniu sama nie ma wyprzedzenia.'
  new_decision: Lucan idzie do Akademii. Brama ma teraz portiernie z ksiega odwiedzin,
    ktorej za jego czasow nie bylo, a on jest czlonkiem na urlopie dziekanskim - wejscie
    jako czlonek albo jako gosc zostawia dwa rozne slady.
