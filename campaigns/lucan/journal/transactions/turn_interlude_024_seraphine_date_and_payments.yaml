  summary: 'Bez testu - Seraphine nie potrzebuje przekonywania, zeby odpowiedziec
    na tanie pytania.

    Pracuje po nocy i nie jest zdziwiona, ze Lucan przyszedl.

    TERMIN - dostaje go. To jest pierwszy raz, kiedy Lucan zna jakakolwiek date:

    przesluchanie przed kierownictwem za jakies dwa tygodnie, dzien w te czy w te,

    jeszcze nie oglaszane oficjalnie. clock_guild_leadership_hearing przestaje byc

    wiedza wylacznie graczа - lucan_knows_the_date staje sie true.

    ZAPLATA - nagroda za Akt 2 nie zostala zamieciona i to jest jej robota; dopilnowala,

    zeby w rejestrze stalo "oczekuje przegladu", a nie "zamkniete". Cena tego jest
    jednak

    taka, ze rozliczenie idzie TA SAMA sesja co przesluchanie. Czyli nagroda Lucana
    jest

    teraz zakladnikiem tego, jak wypadnie na przesluchaniu.

    DLACZEGO HARMONOGRAM "SIE USTALA" - Seraphine mowi to sama, bo to i tak wyjdzie:

    sluzby miejskie zadaja przekazania cial, akt i dowodow z operacji cmentarnej,
    gildia

    sie opiera, a dopoki nie jest jasne, kto trzyma material, nikt nie chce wyznaczac

    daty. To jest ta os sporu, na ktorej lezy caly Akt 3 - kontrola nad dowodem.

    I dopiero potem robi to, po co w ogole z nim rozmawia. Odklada piorо, patrzy na
    niego

    i przypomina uklad wlasnymi slowami: oslania go warunkowo, w zamian za to, ze

    dowiaduje sie o ryzykach ZANIM staja sie kryzysem publicznym. Za dwa tygodnie
    ma

    wejsc na sesje i bronic czlowieka, ktorego akt nie zna do konca. Pyta wiec: czego

    jeszcze nie wiem.

    A Lucan ma na tej liscie cztery rzeczy naraz - konsekrowany relikwiarz skradziony

    Kosciolowi, szescdziesiat kilo cmentarnego zlota bez legalnej drogi zbytu, publiczna

    dysputa na Akademii, na ktorej ma wystawic ozywiony okaz, i ojca, ktory od dzisiaj

    zna metode.

    '
  new_decision: 'Seraphine dala termin i pilnowala jego nagrody, a teraz siedzi z
    odlozonym piorem i

    pyta, czego jeszcze nie wie - powolujac sie na uklad, ktory realnie dotrzymuje.
    Lucan

    ma cztery rzeczy do ewentualnego wylozenia (relikwiarz, zloto, dysputa, ojciec)
    i moze

    wybrac, ile z tego oddac, w jakiej kolejnosci i za co. Moze tez zamiast tego dopytac

    o to, co ona wlasnie sama otworzyla - gdzie dokladnie sa ciala i akta, i kto je
    teraz

    trzyma. Co Lucan mowi?

    '
  operations:
  - *id002
