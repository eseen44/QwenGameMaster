  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - wejscie i pierwsza wymiana zdan. Piec minut, zero energii.
    Interludium buduje gracz (retcon_000033): zagrywka gracza laduje tak, jak zadeklarowana
    - haczyk z karty ojca (likely_hook) dziala natychmiast i bez oporu.

    1. HACZYK DZIALA OD PROGU. Slowo "konsultacja" trafia dokladnie w to, czym profesor
    Veyr jest: czlowiekiem, ktory nie ma kalibracji spolecznej, ale ma nienasycona
    uwage na otwarty problem. Nie pyta, dlaczego syn wchodzi bez pukania, nie pyta,
    ktora godzina, nie odnotowuje, ze od poprzedniej wizyty minely dwa dni ani ze
    wczesniej minely dwa lata (false_beliefs: nie orientuje sie, ile czasu minelo).
    Odklada stosy.

    2. CIEPLO BEZ OBECNOSCI, DOKLADNIE JAK W KARCIE (portrayal.tone). Pyta, czy Lucan
    jadl, i pyta serio - a potem nie czeka na odpowiedz, bo pytanie o konsultacje
    jest ciekawsze niz odpowiedz o jedzeniu. To nie jest zlosliwosc ani teatr; to
    jest ten sam mechanizm, ktory w domu wygladal jak nieobecnosc.

    3. WLASNA AGENDA WCHODZI MU W ZDANIE. Grzebal w stosach za odbitka z nazwiskiem
    osoby walczacej o szeroka definicje (agenda.next_action) i mowi o tym sam, jako
    o wlasnym klopocie - nie wie, ze osoba stoi trzy kroki od niego. Zegar clock_father_arranges_academy_showing
    stoi nadal na 2/15; termin nie zostal wyznaczony w tej turze.

    4. NERIS TRZYMA SIE INSTRUKTAZU. Nie przedstawia sie, nie wchodzi w rozmowe, zostaje
    przy drzwiach. Instruktaz przyjela w turze 143 i wykonuje go doslownie.

    5. WORLD MOVE - UWAGA OJCA LADUJE NA PAPIERZE, NIE NA OSOBIE. Nie widzi obcej
    kobiety w laboratorium; widzi DWIE ODBITKI pod jej pacha, bo papier jest jedyna
    kategoria obiektow, ktora sledzi bez wysilku. Pyta o nie - do Lucana, nie do niej,
    bo osoba przy nich jest dla niego elementem tla. Nie jest to przenikliwosc: to
    jest ta sama slepota, tylko obrocona nieszczesliwa strona. Jesli odbitki trafia
    mu do rak, nazwisko referentki szerokiej definicji rozstrzygnie sie samo, w ciagu
    sekund, bez udzialu Lucana.

    6. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    celi w piwnicy gildii, syndykatu, tego, ze okaz dla Akademii ma byc wabikiem.
    NOWE: nie wie, kim jest osoba, ktora syn przyprowadzil, ani ze trzyma w rekach
    koniec wlasnych dwudniowych poszukiwan.

    7. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, skrzydlo laboratoryjne.
    Energia bez zmian, integralnosc 19 z 19, bez warunkow. Kartka z szescioma problemami
    wciaz w kieszeni, nie wyjeta. USTALONE: haczyk zadzialal i ojciec jest dostepny;
    Neris nieprzedstawiona i cicha; ojciec sam wywolal temat szukanej odbitki; jego
    uwaga stoi na odbitkach w jej rekach.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: inside_his_fathers_laboratory_the_hook_landed_and_the_professor_dropped_the_stacks_neris_silent_at_the_door_the_fathers_attention_now_on_the_two_offprints_under_her_arm_sheet_of_six_problems_still_in_lucans_pocket
  - op: advance_time
    seconds: 300
  - *id002
  new_decision: Uwaga ojca stoi na odbitkach w rekach Neris. Lucan moze pozwolic mu
    je wziac, przekierowac go kartka z szescioma problemami albo przedstawic ja samemu,
    na wlasnych warunkach.
