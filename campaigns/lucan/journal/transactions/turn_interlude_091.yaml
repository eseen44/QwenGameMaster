  summary: 'Bez testu. Trzy i pol godziny: zamkniecie warsztatu, marsz przez nocne
    miasto i pierwsza godzina nad klatwami w celi. Konczy sie po trzeciej nad ranem
    dnia trzeciego. 1. ROZKAZ NA LAKI PRZECHODZI LEPIEJ, NIZ MA PRAWO. "Koniki polne
    i szarancze" jako GATUNEK nie przechodzi przez pasmo, tak jak nie przeszlo w 015
    ani w 078 - ale ksztalt rozkazu przechodzi czysto: duze, skaczace rzeczy z trawy.
    I tu biologia pracuje za Lucana: w lace pod koniec sierpnia wszystko, co duze
    i skacze, jest prostoskrzydle, a KAZDY prostoskrzydly ma uszy. Rozkaz zdegradowany
    trafia w cel przez przypadek materialu. 2. I JEST TO DOKLADNE ODWROCENIE WCZORAJSZEJ
    LEKCJI. Do ciem sieciarze byli zlym narzedziem - lampa bila czterech lowcow, bo
    cma sama leci do swiatla, a skrzydla niszcza sie od ugryzienia. Do prostoskrzydlych
    sa narzedziem WLASCIWYM: konik polny nie leci do lampy, trzeba go zlapac w trawie,
    a jego cialo zniesie szczekoczuly. Ucho siedzi w przedniej nodze albo na pierwszym
    segmencie odwloka - nigdy w skrzydle - wiec poszarpany okaz nadal jest dawca.
    Rozny biom, rozne narzedzie; Lucan pierwszy raz dobiera metode do materialu, a
    nie odwrotnie. 3. TKACZ ZOSTAJE W BASZCIE - I JEGO ROBOTA ZOSTAJE Z NIM. Wroci
    nad ranem na pusty warsztat. Ucho, drugi gruczol i trzecia porcja tlumiaca lezą
    rozlozone na stole, do ktorego Lucan wlasnie odwrocil sie plecami. Nic sie na
    Tkaczu nie wydarzy, dopoki Lucan nie wroci do baszty. 4. KSIAZKI ROZDZIELONE WEDLUG
    TEGO, CO KTORA ROBI ZNALAZCY. W dziurze za sciana zostaja atlasy anatomiczne,
    brulion balwierza i tom z wypalona sygnatura Akademii - trzy rzeczy, ktore w celi
    czlonka gildii sa nie do wytlumaczenia. Z Lucanem ida "Uprzejmosci" (przebrane
    za podrecznik dworskich grzecznosci), odpis formul prawnych i dwie akademickie
    odbitki - czyli komplet, ktory u czlowieka przed przesluchaniem wyglada nie tylko
    niewinnie, ale WLASCIWIE. Przykrywka w celi robi sie spojna po raz pierwszy: nudne
    ksiazki, makulatura ze skrzyni, oskarzony czytajacy o procedurze. 5. CMY I ZAWISAK
    WYPUSZCZONE NA LAKI ZA GARBARNIA, BEZ ROZKAZU. Laka rozwiazuje ich jedyna slabosc
    sama - nektar jest tam, gdzie one, wiec cukrowa smycz przestaje istniec i dojrzewanie
    nic nie kosztuje. Cena tez jest tam, gdzie one: LAKA NOCA NALEZY DO NIETOPERZY.
    I tu wraca dzisiejszy pomiar w najlepszy mozliwy sposob - cma ma uszy WLASNIE
    po to. Wypuszczone okazy nie sa bezbronne, bo natura dala im dokladnie ten narzad,
    ktory Lucan probowal dzis przeszczepic komu innemu. 6. Z JEDNYM WYJATKIEM, KTORY
    TRZEBA NAZWAC. Zawisak jest zakotwiczony, wiec jego strata nie jest strata robaka
    - propaguje przez kotwice na Lucana. Nosi tez jedyna fiolke przewodzaca w calej
    kampanii. Lucan wlasnie wypuscil swoja najdrozsza inwestycje na otwarta lake w
    kraju nietoperzy, bez rozkazu i bez nadzoru. To decyzja, nie przeoczenie - ale
    jest to jedyna rzecz tej nocy, ktora moze go zabolec osobiscie. 7. ZUK W KIESZENI
    - PIERWSZY ODCZYT Z PRZESZCZEPIONEGO UCHA. Kotwica przy odleglosci kieszeni daje
    lacze w najlepszej mozliwej formie: kierunek i natezenie czytaja sie czysto. A
    pasmo okazuje sie mniej bezuzyteczne, niz wygladalo przy stole. Noc nad ulica
    NALEZY DO NIETOPERZY - jest ich pelno i zuk slyszy je wszystkie. Slyszy tez SZCZURY,
    ktore piszcza wysoko i ktorych czlowiek nie slyszy w ogole. To jest realna zdobycz:
    zuk z uchem cmy nie jest podsluchem, jest WYKRYWACZEM NIETOPERZY I SZCZUROW -
    czyli przyrzadem, ktory w piwnicy, w kanale i w spichlerzu pokazuje, gdzie jest
    zywe zarcie dla calej reszty sieci. Zza oswietlonego okna dostaje to, co zapowiedziane:
    ktos mowi, ilu ich jest, w jakim rytmie. Bez slow. 8. WIJE ODNALEZIONE BEZ WSPOLRZEDNYCH
    - KRZYWA STRATY JAKO DALMIERZ. Obie zyja, obie syte. Rura nadal nie niesie polozenia,
    ale Lucan zmierzyl dzis rano wlasnymi nogami, ze sygnal wyostrza sie przy zblizaniu
    - i uzywa tego jak dalmierza. W marszu do gildii spy_centipede_01 ROSNIE: jest
    gdzies pod dzielnica gildii, a kanaly siegaja pod sama piwnice. spy_centipede_02
    zostaje matowy z tylu, po stronie muru i garbarni. Pozyczony zmysl z tej blizszej
    jest surowy, ale jedna rzecz wychodzi z niego wyraznie i jest niepokojaca: cioswany
    kamien i powietrze STOJACE, bez ciagu i bez wody. To nie jest kanal. To czyjas
    piwnica, do ktorej wij wszedl otworem od spodu. Ktora - nie wiadomo. 9. DWA PAJAKI
    DOJECHALY, ZADEN NIE POSTAWIONY. Pudelko w kieszeni, mieszczanin wraca po nocy
    do wlasnej kwatery, nikt nie patrzy. Cela jest jego, wiec tam moze zrobic, co
    chce - ale gabinet Seraphine i pokoj narad o trzeciej nad ranem wymagaja wejscia
    do cudzych pomieszczen, a to jest osobna decyzja, nie ciag dalszy marszu. 10.
    "UPRZEJMOSCI" - CO TO NAPRAWDE JEST. Nie zbior klatw z rozdzialem o dostarczaniu.
    To ksiazka O DOSTARCZANIU, w ktorej klatwy sa przy okazji. Kazdy rozdzial to okazja
    towarzyska - powitanie, toast, kondolencje, pozegnanie, przedstawienie mlodszego
    starszemu - a procedura jest NIESIONA przez sama uprzejmosc: nosnikiem jest forma,
    ktora cel przyjmuje dobrowolnie i ktorej nie moze odrzucic bez obrazy. To uderza
    dokladnie w to, co w klatwach jest trudne (dostarczenie rozstrzyga sie osobno
    od odpornosci), i jest poziom wyzej niz "Klatwy dla poczatkujacych" z jego polki.
    11. CENA TEJ KSIAZKI JEST TAKA SAMA JAK JEJ SILA. Zeby dzialac, Lucan musi byc
    OBECNY, poprawny i rozpoznany - czyli dokladnie w tych sytuacjach, ktorych przez
    dwa lata unikal i ktore nadchodza potrojnie za dwa tygodnie: przesluchanie, seminarium,
    rodzina. Drugie czytanie tej samej ksiazki jest defensywne - opisane formy to
    takze lista tego, na co patrzec, gdyby ktos probowal zrobic to JEMU. Pierwsza
    godzina daje strukture i teze. Nic jeszcze nie jest opanowane. 12. STAN. Energia
    nietknieta, 14,5 z 15. Jest po trzeciej nad ranem dnia trzeciego. Boros i Mara
    sa dzisiaj.'
  new_decision: Po trzeciej nad ranem, cela w piwnicy gildii, dwa pajaki w pudelku
    na pryczy, klatwy otwarte na kolanach. Lucan moze isc spac przed spotkaniem z
    Borosem i Mara, moze czytac dalej, moze postawic pajaka u siebie w celi, a moze
    wykorzystac martwa godzine na wejscie do pokoju narad albo do gabinetu Seraphine,
    kiedy w gildii nie ma nikogo.
  operations:
  - *id002
