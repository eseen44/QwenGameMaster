outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'DOWOZ PODNIESIONY DO SUFITU, NIE DO ZYCZENIA. Gracz poprosil o dwa razy
    wiecej; cala wolna nadwyzka w rejestrze to 2,3 na dobe (Wij 01 i 02 po 0,5, General
    0,3, Szczur 01 i 02 po 0,5). Wiecej znaczyloby siegnac wezlom do WLASNEGO rozwoju,
    a to jest osobna decyzja i nie zostala podjeta - wiec narrator jej nie podejmuje
    za gracza i nazywa sufit wprost (retcon_000193). Naprawa Varkhena 1,6 -> 2,3 na
    dobe, czyli okolo 24 doby do pelna zamiast pierwotnych 70. MASA LUPU POPRAWIONA
    W TEJ SAMEJ TURZE: osiem workow z jedenastu grobow to okolo 55 kg, w tym 9-10
    kg metalu. Dawne "szesnascie kilo" liczylo kruszec jako cala mase i dawalo 2 kg
    na worek, czyli sakiewke. Kotwica: 60 kg z Aktu 2 przyszlo w TRZECH torbach (t_101).
    KONSEKWENCJA, KTOREJ NARRATOR NIE WYMYSLIL, TYLKO WYWAZYL: 55 kg to trzy kursy
    po rampie dla trzech ludzi, z czego Lucan niesie najmniej. To jest to samo ograniczenie,
    ktore stoi w character.yaml (direct_physical E, physical_force 16) i ktore Mara
    nazwala rano. SWIATLO: wyjscie wypada okolo dziewietnastej trzydziesci, czyli
    ostatni kwadrans, w ktorym woz z gruzem jest wozem z gruzem. Mara dostaje swoj
    kurs przy swietle, Boros swoj sklad w miejscu - obie propozycje z t_297 daly sie
    pogodzic i narrator nie robil z nich dylematu, ktorym nie byly. ODPOCZYNEK: bez
    mechaniki, bo zaden plik nie daje Lucanowi zmeczenia jako warunku. To jest OPIS,
    nie koszt - i jedyna rzecz, ktora sie realnie zmienia, to ze on pierwszy raz od
    dwoch dob przestaje cos robic. NIEUSTALONE: czy woz jedzie dzis do miasta, kto
    z nim jedzie i kiedy schodza nizej.'
  prose: 'Najpierw linia.


    Lucan dokłada do niej wszystko, co w sieci leży odłogiem: oba wije, Generała i
    dwa szczury

    z kanału pod garbarnią. Więcej nie ma — reszta węzłów zjada swoje na własny rozwój,
    a tego

    nie rusza. Z dwóch i trzech dziesiątych wychodzących dochodzi półtorej.


    Varkhen nie odzywa się tym razem wcale i to jest jego sposób na powiedzenie, że
    zauważył.


    Dwadzieścia cztery doby. Nie siedemdziesiąt.


    Potem worki.


    Jest ich osiem i są znacznie cięższe, niż wyglądają, bo w środku jest ceramika
    i kamień,

    a nie sama blacha. Razem wychodzi z tego jakieś pięćdziesiąt pięć kilo — z czego
    srebra

    i brązu może dziesiąta część. Reszta to naczynia, paciorki, kość i płótno, w które
    to

    pozawijali.


    Trzy kursy po rampie. Boros bierze po dwa naraz i robi to bez słowa. Mara po jednym

    i szybciej. Lucan po jednym i wolniej, i w trzecim kursie musi się zatrzymać w
    połowie

    podjazdu, oprzeć worek o ścianę i postać.


    Nikt tego nie komentuje. Mara na drugim kursie zabiera mu jeden z rąk, nie pytając,

    i idzie dalej tak, jakby zawsze niosła dwa.


    Na górze jest jeszcze jasno. Ledwo.


    Układają to na wozie tak, jak układa się coś, czego nie ma być widać: worki na
    dno, deski

    na wierzch, a na deski ten sam gruz, który wozili przez cały dzień. Kto zajrzy
    pod płachtę,

    zobaczy tynk i pół cegły. Kto zajrzy głębiej, będzie musiał zdjąć gruz i deski,
    a żeby to

    zrobić, będzie musiał najpierw mieć powód.


    Mara obchodzi wóz dookoła, ogląda go z trzech stron i kiwa głową.


    — Teraz to jest wóz z gruzem — mówi. — O tej godzinie jeszcze przechodzi.


    Potem siadają.


    Boros wyciąga chleb i coś, co kiedyś było serem, i dzieli to na trzy części bez
    pytania,

    kto ile chce. Mara siada tyłem do bramy, ale twarzą do drogi. Konia nikt nie wyprzęga.


    Lucan siedzi na skrzyni przy tylnym kole i przez pierwszy kwadrans nie robi nic.


    To jest nowe. Nie spał od dwóch dób, a od świtu dnia czwartego nie miał ani jednej
    godziny,

    w której nie liczyłby czegoś, nie nosił czegoś albo nie rozmawiał z kimś, kto
    czegoś od niego

    chciał. Siedzi więc i patrzy, jak nad cmentarzem robi się z niebieskiego szare,
    i przez

    moment nie ma w tym żadnego zadania.


    — Za godzinę będzie ciemno — mówi Boros z drugiej strony wozu. Nie jako nacisk.
    Jako pora dnia.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
  consequence_source_refs:
  - retcon_000193
