  scene_update: null
  new_decision: 'Cmentarz, przy wozie u wylotu rampy, 20:27, dzien piaty. Zmierzch,
    do ciemnosci okolo godziny. DOWOZ DO VARKHENA NA SUFICIE WOLNEJ NADWYZKI: 2,3
    na dobe wychodzace z pieciu wezlow (Wij 01, Wij 02, General, Szczur 01, Szczur
    02), okolo 1,5 dochodzace. Naprawa 2,3 na dobe, okolo 24 doby do pelna. Wiecej
    wymagaloby siegniecia wezlom do wlasnego rozwoju - OSOBNA DECYZJA, nie podjeta.
    LUP NA WOZIE I SCHOWANY: osiem workow, okolo 55 kg, w tym 9-10 kg metalu. Worki
    na dnie, deski na wierzchu, gruz na deskach. Kto zajrzy pod plachte, zobaczy tynk
    i pol cegly. EKIPA ODPOCZELA. Zadnej mechaniki z tego nie wynika - zaden plik
    nie daje Lucanowi zmeczenia jako warunku - poza tym, ze pierwszy raz od dwoch
    dob nic nie robi. MARA POTWIERDZILA, ze o tej godzinie woz jeszcze przechodzi
    jako woz z gruzem. BOROS PODAL PORE DNIA, nie nacisk: za godzine bedzie ciemno.
    OTWARTE: czy woz jedzie dzis i kto z nim; czy schodza nizej po ciemku; czy zostaja
    na noc. Rezerwa 14,6/15. Sklad w podziemiach juz nie istnieje - wszystko jest
    na wozie.'
