  perspective: pc_lucan
  location_id: loc_lumaria_magical_academy
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Lucan przechodzi miasto i dociera pod Akademie juz po ciemku. Zmiany po
    dwoch latach

    sa konkretne i wszystkie w jedna strone.

    PIERWSZA - jest portiernia. Za jego studiow wchodzilo sie z ulicy i nikt nie pytal;

    teraz przy bramie stoi budka, w budce siedzi stary portier, a na pulpicie lezy

    ksiega odwiedzin. Portier byl tu wczesniej, Lucan pamieta twarz. Portier mruzy
    oczy

    i widac, ze cos mu sie kojarzy, ale nie umie tego jeszcze ulozyc.

    DRUGA - przybudowka studencka, w ktorej Lucan mieszkal jako niemal-zebrak wsrod

    bogatszych, jest przebudowana i nie jest juz mieszkalna. Skrzydlo obok stoi w

    rusztowaniu.

    TRZECIA, najwazniejsza - na tablicy obwieszczen przy bramie wisi zapowiedz otwartej

    dysputy o KLASYFIKACJI OZYWIONYCH KONSTRUKTOW: gdzie konczy sie golem i chowaniec,

    a gdzie zaczyna nieumarly. Akademia sama zajmuje pozycje na dokladnie tej granicy,

    na ktorej Lucan chce postawic obrone Spideya - i robi to publicznie, wiec robi
    to

    zawczasu i celowo.

    CZWARTA - w skrzydle laboratoryjnym, w tym samym miejscu co dwa lata temu, swieci

    sie dokladnie jedno okno. Po ciemku, na noc, w budynku ktory poza tym jest wygaszony.

    Zgodnie z profilem czlowieka, ktory 99% zycia spedza w laboratorium, to jest bardzo

    prawdopodobnie ojciec - ale to jest wnioskowanie z nawyku, nie potwierdzenie.

    Haczyk jest w ksiedze. Lucan nie jest studentem - jego edukacje przerwano - wiec

    wejscie oznacza wpisanie sie jako gosc: nazwisko, do kogo, kiedy. Trzy dni przed

    spodziewanym wezwaniem gildii to nazwisko Veyr w ksiedze Akademii, z data. Ma
    tez

    drugie wyjscie - item_locks_manual, item_unnoticed_manual i Misnotice - ale wejscie

    na teren instytucji bez wpisu jest tym samym rodzajem ryzyka, tylko przesunietym.

    '
  new_decision: 'Ciemno, brama, portier ktory prawie go rozpoznaje, jedno swiecace
    okno w skrzydle

    laboratoryjnym i ksiega odwiedzin na pulpicie. Lucan wpisuje sie jawnie i pyta
    o

    profesora Veyra, zagaduje najpierw portiera zeby zobaczyc co ten pamieta, czyta

    dokladnie obwieszczenie o dyspucie, wchodzi bez wpisu na wlasnych warunkach -
    czy

    odwraca sie i wraca do baszty przed pornocnym urobkiem sieciarzy?

    '
