  new_decision: 'Dolna hala, przy pierwszej oproznionej niszy, 23:50, dzien piaty.
    Rezerwa 14,9/15 bez zmian - komenda w siec i przetarcie nic nie kosztuja. MATERIAL
    NAZWANY: SREBRO. Odczyt Borosa po zdjeciu nalotu, zwykla kompetencja handlarza
    (t_101), nie magia. SZTUKA JEST GLADKA - bez rytu, bez znaku wytworcy, bez ornamentu.
    To PIERWSZA kategoria Borosa: anonimowy kruszec, idzie do tygla i przestaje istniec.
    Obawa z t_305 o trzecia kategorie sie NIE potwierdzila. DYLEMAT, KTORY ZOSTAJE:
    osiem gladkich sztuk osobno to waga srebra; osiem sztuk W KOMPLECIE warte jest
    wielokrotnie wiecej i wlasnie dlatego zapamietywalne. Decyzja gracza, zadnego
    terminu. CO TO JEST: smukly pret, jeden koniec splaszczony i lekko wygiety, na
    trzonku plytki rowek po owinieciu (skora albo nic, dawno zeszla). NARZEDZIE, nie
    ozdoba i nie bron. DO CZEGO - NIEUSTALONE; Lucan nie rozpoznaje. Varkhen lezy
    w loc_varkhen_chamber na pojedynczej linii od Lucana i jest JEDYNYM zrodlem z
    tamtej epoki w zasiegu. MELDUNEK SPIDEYA (ksztalty, low_bandwidth, bez slow):
    NISZE PO OBU SCIANACH, regularne, tej samej wielkosci, w tych samych odstepach,
    WSZYSTKIE ZAMKNIETE az do konca jego drogi. HALA MA KONIEC: cos pionowego w poprzek,
    na cala szerokosc, i to NIE JEST KAMIEN - echo wraca martwe zamiast dzwonic. POWIETRZE
    IDZIE Z CIENKIEJ LINII przy dolnej krawedzi tej rzeczy; Spidey przeszedl wzdluz
    niej calej i linia jest dla niego ZA WASKA. Stamtad wrocil. NIGDZIE NIC ZYWEGO
    - trzecie potwierdzenie obserwacji z t_294 (brak pajeczyn i owadow), ktorej nadal
    NIKT NIE TLUMACZY i narrator tez nie. CZEGO NARRATOR NIE SKLEIL: ze to brama,
    o ktorej Varkhen mowil w t_296 (brama plus trzecia pieczec). To jest JEGO PAMIEC,
    a Spidey podal pionowa przeszkode, ktora nie dzwoni. SPIDEY SIEDZI LUCANOWI NA
    RAMIENIU i sie czysci - jego sygnal, ze skonczyl. MARA POWTORZYLA PYTANIE O LICZBE,
    Lucan odpowiedzial bez liczby: wiecej, niz zdazymy wyniesc, a waskim gardlem sa
    schody. Zgodne z geometry_is_approximate i z t_298. OTWARTE: czy ida wzdluz wytartego
    pasa do tej pionowej rzeczy, czy oprozniaja kolejne nisze tutaj, czy pytaja Varkhena
    o srebrny pret przez lacze, czy wynosza pierwszy worek na gore.'
