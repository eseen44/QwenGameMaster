  arrangement: improved
  perspective: pc_lucan
  summary: 'POWTORKA CALEJ TURY 307, CZAS ZERO. t_307 dostal superseded_by ze scope
    whole: heredoc zapisujacy outcome nie wykonal sie, a narrator sprawdzil rozmiar
    pliku zamiast tresci, wiec turn commit zapisal outcome t_306 drugi raz. Zegar,
    900 s i wszystkie pliki stanu z t_307 ZOSTAJA POPRAWNE - zmienia sie wylacznie
    to, co lezy w dzienniku. PRZETARCIE ODPOWIADA PRZEZ WLASCIWY KANAL. retcon_000197
    wiaze Stone Sense, nie oko i dlon handlarza; Boros sortuje kruszec zawodowo od
    t_101 i po zdjeciu nalotu nazywa material natychmiast: SREBRO. Zadnej magii, zadnego
    rzutu, zwykla kompetencja NPC. CO PRZETARCIE ROZSTRZYGA POZA MATERIALEM, i to
    jest wazniejsze: sztuka jest GLADKA. Bez rytu, bez znaku wytworcy, bez ornamentu.
    To ustawia ja w PIERWSZEJ kategorii Borosa z t_101 (anonimowy kruszec, idzie do
    tygla i przestaje istniec), a nie w trzeciej, ktorej sam sie obawial w t_305.
    DYLEMAT ZOSTAJE I JEST PRAWDZIWY: osiem gladkich sztuk osobno to metal bez historii,
    osiem sztuk W KOMPLECIE to rzecz warta wielokrotnie wiecej i jednoczesnie zapamietywalna.
    Wybor jest gracza; narrator go nie podejmuje i nie dopisuje terminu. KSZTALT WIDOCZNY
    PO OCZYSZCZENIU, FUNKCJA NIE: smukly pret, jeden koniec splaszczony i lekko wygiety,
    na trzonku plytki rowek po owinieciu, ktorego juz nie ma. To NARZEDZIE, nie ozdoba
    i nie bron. CZYM DOKLADNIE - NIEUSTALONE. Lucan nie dostaje darmowego rozpoznania
    tylko dlatego, ze jest nekromanta. SPIDEY WRACA PO SWOJEMU. traits#tells mowia
    wprost "poganiany nie przyspiesza" i "nie chodzi dwa razy ta sama droga", wiec
    komenda nie skraca drogi, a powrot idzie DRUGA sciana. Skutek jest informacyjny,
    nie ozdobny: przeszedl obie sciany i moze podac obie. Kanal gestnieje, kiedy sie
    zbliza (spy-series#link, potwierdzone w t_301). MELDUNEK W KSZTALTACH, NIE W SLOWACH.
    low_bandwidth zostaje, a development_direction mowi, ze dialog przyjdzie dopiero
    z wiekiem, wiec Spidey NIE mowi i narrator nie daje mu kwestii. CO PODAL: nisze
    po OBU scianach, regularne, tej samej wielkosci, WSZYSTKIE ZAMKNIETE az do konca
    jego drogi; hala ma koniec - cos pionowego przez cala szerokosc, i to NIE jest
    kamien, bo echo wraca martwe zamiast dzwonic; powietrze idzie z cienkiej linii
    przy dolnej krawedzi, wzdluz ktorej przeszedl i ktora jest dla niego ZA WASKA;
    nigdzie nic zywego, zadnych pajeczyn ani owadow - trzecie potwierdzenie obserwacji
    z t_294, ktorej nikt nadal nie tlumaczy. CZEGO NARRATOR NIE SKLEIL: ze to brama
    Varkhena z t_296. Varkhen podal brame i trzecia pieczec Z PAMIECI; Spidey podal
    pionowa przeszkode, ktora nie dzwoni. Zestawienie lezy obok siebie niedomkniete
    (retcon_000136). NAJTANSZA WERSJA, NIE NAJEFEKTOWNIEJSZA: wszystkie nisze zamkniete.
    Zaden plik nie mowi o wczesniejszych zlodziejach i narrator ich nie dopisuje (retcon_000058).
    ODPOWIEDZ DLA MARY JEST UCZCIWA I NIELICZBOWA: geometry_is_approximate zostaje,
    wiec Lucan nie podaje liczby nisz. Podaje ograniczenie, ktore i tak rozstrzyga
    - schody, nie liczba plyt (to samo wiazanie co w t_298: 55 kg to trzy kursy).
    KOSZT: zero. Komenda w siec jest darmowa, przetarcie tez.'
  prose: 'Boros nie pyta drugi raz. Wyjmuje sztukę, którą ważył, siada na piętach
    przy lampie i trze

    ją kawałkiem sukna — krótko, w jednym miejscu, wielkości paznokcia.


    Ciemność schodzi od razu.


    Pod spodem jest biel. Nie połysk, bo połysku nie da mu suknem, ale ta szczególna,
    chłodna

    biel, którą ma jeden metal i tylko jeden.


    — Srebro — mówi Boros.


    I zaraz potem to, co jest ważniejsze, bo obraca rzecz w palcach i szuka jeszcze
    przez

    chwilę, zanim powie:


    — Gładkie. Bez znaku.


    Lucan rozumie, co właśnie usłyszał, bo Boros dzielił już przy nim towar na kategorie

    i zrobił to dawno, na własnym stole. Anonimowy kruszec idzie do tygla i przestaje
    istnieć.

    Rzecz ryta trzeba stopić, żeby przestała. A to jest pierwsza kategoria: osiem
    sztuk, żaden

    znak, żadnej historii do wytłumaczenia.


    Tyle że komplet ma swoją własną arytmetykę i obaj ją znają. Osiem gładkich sztuk
    osobno to

    waga srebra. Osiem sztuk razem, w kolejności, jest warte wielokrotnie więcej —
    i dokładnie

    dlatego ktoś je zapamięta.


    Przy okazji przetarcia widać wreszcie, co to w ogóle jest. Smukły pręt. Jeden
    koniec

    spłaszczony i lekko wygięty, tak jak się wygina coś, czym się pracuje pod kątem.
    Na trzonku

    płytki rowek po owinięciu, którego już nie ma — skóra albo nić, zeszła dawno.


    To jest narzędzie. Do czego — Lucan patrzy na nie dłużej, niż wypada, i nie ma
    odpowiedzi.


    A potem kanał gęstnieje.


    Spidey nie przyspieszył, bo Spidey nigdy nie przyspiesza, kiedy się go wzywa.
    Wraca drugą

    ścianą, bo tą pierwszą już szedł, i właśnie dlatego to, co przynosi, jest warte
    dwa razy

    tyle, ile Lucan zamawiał.


    Przychodzi kształtami, nie słowami.


    Nisze są po obu stronach. Regularne, tej samej wielkości, w tych samych odstępach,
    i idą tak

    daleko, jak on doszedł. Wszystkie zamknięte. Ani jedna otwarta.


    Hala ma koniec. Coś stoi w poprzek, pionowo, na całą szerokość — i to nie jest
    kamień.

    Kamień odpowiada dźwiękiem, który wraca. To wraca martwe.


    Powietrze idzie z cienkiej linii przy dolnej krawędzi tej rzeczy. Spidey przeszedł
    wzdłuż

    niej całej, od brzegu do brzegu, i linia jest dla niego za wąska. Stąd wrócił.


    I jeszcze jedno, po raz trzeci od wczoraj: nigdzie nic żywego. Żadnej pajęczyny,
    żadnego

    owada, żadnego ruchu. Suche, puste, stare.


    Potem siada Lucanowi na ramieniu i zaczyna się czyścić. Dokładnie, bez pośpiechu,
    odnóże

    po odnóżu — to jest jego sposób na powiedzenie, że skończył, i on wie, że Lucan
    to wie.


    — To ile ich jest — mówi Mara. Tym razem jak pytanie.


    — Więcej, niż zdążymy wynieść — mówi Lucan. — Wąskim gardłem są schody, nie płyty.

    '
