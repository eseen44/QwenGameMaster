  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Seraphine dostaje fakt, ktory unieważnia polowe jej wieczornej
    rady, i przyjmuje

    to bez proznosci - stwierdza tylko, ze powinna byla to wiedziec trzy godziny temu.

    CO SIE ZMIENIA NA LEPSZE. Lucan nie jest nieafiliowanym nekromanta. Jest CZLONKIEM
    Akademii

    na urlopie dziekanskim, z katedra i formalnym umocowaniem, ktore nigdy nie zniklo
    - bo

    nieplatnej synekury trzymanej przez szlachcica nikt nie audytuje. Ma wiec trzy
    plaszcze

    naraz: cechowy, rodowy i akademicki. To go przenosi z kategorii "okaz, ktorego
    nie chroni

    nikt" do kategorii, o ktorej sama mowila wczesniej - czlowiek, o ktorego trzy
    instytucje

    moga sie pokloncic, czyli STAWKA, nie oskarzony. Odwoluje wiec swoja rade o niewidzialnosci

    i mowi to wprost: plan ojca nie jest juz "nikt wystawia trupa". Jest "czlonek
    prezentuje

    badanie czlonka" - a to jest legalna forma, w ktorej cala rzecz w ogole moze istniec.

    CO SIE ZMIENIA NA GORSZE, i tu Seraphine jest szybka. Trzy plaszcze to trzy smycze.
    Kazda

    instytucja, ktora moze cie chronic, moze cie tez wymienic - a Akademia dostaje
    przy tym

    narzedzie, ktorego wczesniej nie miala: WLASNA procedure dyscyplinarna. Nie potrzebuje

    magistratu. Wobec czlonka na urlopie ma prawo zazadac, zeby sie wytlumaczyl. Czyli

    seminarium przestaje byc naciskiem spolecznym i staje sie WYKONALNE. Plaszcz,
    ktory chroni

    go przed Kosciolem, jest tym samym plaszczem, ktory daje Akademii tytul do wezwania.

    DRUGI KOSZT - kamuflaz dziala dokladnie tak dlugo, jak nikt nie patrzy. Nieplatna
    synekura

    jest niewidzialna, poki jej wlasciciel jest nudny. W momencie, w ktorym Lucan
    staje sie

    interesujacy, ktos siega po akta - a w aktach jest urlop dziekanski, jego przyczyna
    i

    podciecie edukacji przez wlasna rodzine. Uzycie plaszcza jest tym, co go odslania.

    TRZECI, praktyczny - powrot z urlopu dziekanskiego po dwoch latach nie dzieje
    sie sam.

    Ktos musi to podpisac albo przynajmniej nie zablokowac, a najbardziej naturalna
    osoba do

    tego jest jego wlasny ojciec, ktory wlasnie zaczyna organizowac pokaz i bylby
    zachwycony,

    moglby cokolwiek podpisac.

    Przy okazji wychodzi rzecz o ojcu, ktora nie kolidowala z niczym: cieply, gubiacy
    watek i

    nieobecny czlowiek jest jednoczesnie koszmarem alumnow - nie ze zlosliwosci, tylko
    dlatego,

    ze nie ma zadnej kalibracji spolecznej i bedzie ryl w odpowiedzi tak dlugo, az
    cos z niej

    zostanie.

    '
  new_decision: 'Trzy plaszcze zamiast zadnego, plan ojca nagle legalny, a cena jest
    ta, ze Akademia zyskuje

    tytul do wezwania i ze plaszcz odslania sie w chwili uzycia. Powrot z urlopu wymaga

    czyjegos podpisu, najpewniej ojca. Seraphine wie juz prawie wszystko poza jedna
    rzecza -

    ze ojciec zna metode. Noc jest gleboka. Lucan domyka to ostatnie, ustala z nia
    teraz

    kanoniczna wersje, decyduje czy reaktywowac urlop przed dysputa, czy konczy i
    idzie do

    baszty po urobek?

    '
  operations:
  - *id002
