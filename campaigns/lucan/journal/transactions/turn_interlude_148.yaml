outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Piec minut, zero energii. Zagrywka gracza laduje
    w calosci (retcon_000033): pytanie odwrocone od Neris, odbitka zdjeta ze stolu
    do reki Lucana, srebro rozstrzygniete darmowo. Komplikacja nie jest oporem narratora
    - wynika DOSLOWNIE ze slowa, ktore gracz wybral.

    1. KANAL UWAGI PRZEJETY NATYCHMIAST I BEZ OPORU. Kartka dziesiec centymetrow od
    twarzy plus nowy problem plus zadanie - profesor Veyr ma JEDEN kanal naraz (portrayal)
    i wlasnie zostal na niego wpuszczony obiekt o wyzszym priorytecie. Pytanie "kto
    pisze rozsadnie o granicy konstruktu" NIE zostalo skonsumowane jak "dla kogo"
    w t_146 - zostalo PRZYSYPANE. Moze wrocic; nic go metodologicznie nie zastapilo.

    2. ODBITKA JEST TERAZ W RECE LUCANA, NIE NA STOLE. To drugi, cichy zysk tej samej
    zagrywki: nazwisko Neris przestalo lezec trzydziesci centymetrow od reki ojca.
    Lucan trzyma je sam, krzywa do gory, naglowek do dolu, i to on decyduje, kiedy
    ta kartka wroci na blat.

    3. "JAKIS PROFESOR" PRZECHODZI, BO OJCIEC NIE SCIGA NAZWISK. Nie pyta kto. Karta
    jest jednoznaczna: gubi nazwiska i twarze, pamieta papier i problemy. Zapytal
    o srebro, nie o zrodlo.

    4. I SAM SOBIE ODPOWIEDZIAL SWOJA WLASNA KRZYWA. Srebro jest dobrym substratem
    run i beznadziejnym wyborem przy optimum, ktore wlasnie narysowal - punkt lezy
    grubo ponizej. Nie zabronil; policzyl. Zamiast tego jest ROZBAWIONY: wniosek brzmi
    "twoj profesor nie liczyl", a nic go nie cieszy bardziej niz cudzy niepoliczony
    sad. Darmowe rozstrzygniecie dla Lucana: srebro wypada, nie z zakazu, tylko z
    rachunku.

    5. WORLD MOVE - POLECENIE PRZYPISOW LADUJE NA NERIS I JEST PULAPKA Z WLASNEGO
    SLOWA GRACZA. Ojciec nie robi przypisow sam; ma doktorantke z notatnikiem, wiec
    zadanie idzie do niej w pol sekundy. Ale przypis do krzywej wymaga podania, CZYJE
    to twierdzenie i skad - czyli jest to to samo pytanie o literature, tylko w formie
    pisemnej. Lucan przysypal pytanie zadaniem, ktore nim JEST.

    6. WORLD MOVE B - NERIS PYTA O ATRYBUCJE, ZA POZNO I ZA OSTRO. Nie punktuje i
    nie robi przeciw-odczytu; robi swoja robote (portrayal: mysli tekstem, "kto to
    potem powtorzy") i pyta wprost, do czego ma odeslac i kto to twierdzi. Pytanie
    jest niewinne i dokladnie dlatego niewygodne: jesli odpowiedz brzmi "profesor
    Veyr", to nazwisko ojca staje w przypisie pod krzywa kosztu niewykrywalnosci;
    jesli brzmi cokolwiek innego, Lucan musi to nazwisko wymyslic przy dwoch osobach
    naraz.

    7. CENA, KTORA ROSNIE W CISZY. Referentka szerokiej definicji siedzi szesnascie
    dni przed otwarta dysputa i zapisuje WLASNA REKA przypisy do krzywej opisujacej
    koszt niewykrywalnosci masowo produkowanych okazow. Nie protestuje - instruktaz
    brzmial nie wchodzic w dyskusje. Dokument powstaje jej charakterem pisma.

    8. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem,
    ani kim naprawde jest kobieta, ktorej dyktuje. NOWE: nie wie, ze kartka, ktora
    mu wetknieto pod nos, to odwrocie tekstu tej kobiety.

    9. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:33. Energia
    bez zmian, integralnosc 19 z 19, bez warunkow. USTALONE: pytanie o literature
    odwrocone od Neris i tylko odroczone; odbitka z jej nazwiskiem w rece Lucana;
    srebro odrzucone wlasna krzywa ojca; przypisy zlecone Neris; Neris pyta o atrybucje
    krzywej.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: in_his_fathers_laboratory_holding_the_offprint_himself_curve_side_up_after_shoving_it_in_his_fathers_face_the_literature_question_deflected_off_neris_but_only_deferred_silver_ruled_out_by_the_fathers_own_cost_curve_footnote_task_handed_to_neris_who_is_asking_whose_claim_the_curve_is
  - op: advance_time
    seconds: 300
  - *id002
  new_decision: Neris pyta na glos, czyje twierdzenie ma odeslac w przypisie do krzywej
