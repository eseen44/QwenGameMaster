  summary: "Bez testu - interludium, roll_policy disabled. Cztery minuty, zero energii.\n\
    PLAN TRANSPORTU LADUJE BEZ OPORU. Seraphine podaje wlasna liste - i przy drugiej\n\
    pozycji zatrzymuje sie, bo pyta o czlowieka, ktory stoi trzy kroki od niej.\n\n\
    1. TRANSPORT NOCA - DEKLARACJA GRACZA LADUJE W CALOSCI (retcon_000033).\nNarrator\
    \ NIE produkuje przeszkody i nie ma z czego jej zrobic:\n- Varkhen JEST mobilny.\
    \ Zostal przeniesiony z osuwiska do piwnicy gildii przez Seraphine\n  (fact_seraphine_moved_varkhen_to_guild_basement),\
    \ a w tej chwili STOI w rogu gabinetu\n  na gornym pietrze (retcon_000134). Chodzi.\
    \ Integralnosc 9,2/65 opisuje uszkodzenie\n  i wyczerpanie, nie unieruchomienie\
    \ - conditions nie zawieraja immobilised.\n- Zaden plik nie stawia w Lumarii godziny\
    \ policyjnej ani nocnych kontroli jako reguly\n  i narrator zadnej nie dorabia\
    \ (retcon_000015/000058).\n- Skala miasta z retcon_000042: przejscie przez Lumarie\
    \ okolo 20 minut.\nPRZYJETE JAKO PLAN, NIE JAKO WYKONANIE - Lucan sam wraca do\
    \ rozmowy, wiec nikt nigdzie\njeszcze nie idzie. Zapisane w planning jako sposob\
    \ transportu.\n\n2. DEKLARACJA WARUNKOWA O NOCNYM STRAZNIKU - ZAPISANA JAKO INTENCJA,\
    \ NIE JAKO CZYN.\nNawias by tego nie wykonal i tekst poza nawiasem tez nie, bo\
    \ warunek nie zaszedl.\nNarrator odnotowuje i NIE inscenizuje straznika, zeby\
    \ ta deklaracje przetestowac -\nto bylby dokladnie ten tryb awarii, przed ktorym\
    \ stoi retcon_000055 (nie dramatyzuj\ntrywialow) i retcon_000033 (nie produkuj\
    \ oporu, zeby scena nie byla za latwa).\nODNOTOWANE JAKO PRAWDA STANU BEZ OCENY:\
    \ Lucan zadeklarowal gotowosc do trwalego\nzniszczenia przypadkowego czlowieka\
    \ za sam fakt legitymowania. Seraphine to slyszy.\nNIE MORALIZUJE (do_not_play\
    \ - to, ze Lucan nie postawi zycia za idee, jest dla niej\noczywiste i policzone),\
    \ ale ma z t_044 wlasny warunek o uprzedzaniu przed trwala zmiana\nczyjegos stanu\
    \ i mowi jedno zdanie: wlasnie zostala uprzedzona i tyle jej potrzeba.\n\n3. CZEGO\
    \ ONA JESZCZE CHCE - LUCAN SAM POPROSIL O LISTE, WIEC LISTA JEST DOZWOLONA.\n\
    retcon_000040 zabrania NPC sortowania cudzej listy na kolumny z wlasnej inicjatywy;\n\
    tutaj gracz pyta wprost, wiec wyliczenie nie jest awaria. SA DWIE POZYCJE, OBIE\
    \ Z t_122\ni OBIE NIEZAMKNIETE DO DZIS:\n(a) KOLEJNOSC. Dostala liste siedmiu\
    \ dzwigni, zauwazyla na glos, ze ANI JEDNA nie jest\nobrona, i zazadala, zeby\
    \ Lucan powiedzial, KTORE TRZY rusza najpierw. Dostala JEDNA\n(prawnik, t_225).\
    \ Pozycje druga i trzecia nadal nie padly i ona to liczy.\n(b) VARKHEN: czego\
    \ on CHCE, nie co mu wolno.\nZAMKNIETE I NIE PODNOSZONE (retcon_000121): pioro\
    \ nad Ruskiem - wziela na siebie\ni zrobila sama w t_123/125. Pozycja piata (urzednik\
    \ magistratu) - wziela na siebie w t_188.\n\n4. I TU JEST WLASCIWY RUCH TEJ TURY.\
    \ Zaczyna zadawac pytanie (b) LUCANOWI - tak, jak\nzadawala je od dwoch tygodni\
    \ - i urywa w polowie zdania.\nPOWOD JEST W retcon_000134: Varkhen stoi w tym\
    \ pokoju od poczatku sceny i przez cala\nrozmowe nie zostal zapytany o nic. Ona\
    \ pyta o niego czlowieka obok niego.\nODWRACA SIE I ZADAJE PYTANIE JEMU. To nie\
    \ jest gest ani skrucha - to jest korekta\nprocedury zbierania informacji, czyli\
    \ dokladnie to, co ona robi zawodowo.\n\n5. ODPOWIEDZ VARKHENA - ZGODNA Z KARTA,\
    \ BEZ DOPISYWANIA MU ZYCIA WEWNETRZNEGO.\nportrayal.principles: honor, przysiega,\
    \ obowiazek, wzajemnosc. agenda: recover_enough_\nto_act, restore_and_secure_three_seals,\
    \ keep_the_lower_gate_closed, judge_lucan_by_deeds.\nspeech_traits: proste bezposrednie\
    \ linie, slownik przysiegi i czynu, NIE UDAJE, ZE WIE,\nKIEDY NIE WIE.\nCO MOWI:\
    \ chce domknac to, po co go tam postawiono - trzy pieczecie i dolna brama.\nPrzysiega\
    \ jest niedokonczona i to jest cala tresc tego, czego chce.\nCZEGO NIE MOWI, BO\
    \ NIE WIE: co potem. Pytany o to, co bedzie, gdy pieczecie beda cale,\nodpowiada,\
    \ ze nie wie, i nie udaje, ze wie. NARRATOR NIE DOPISUJE MU ANI TESKNOTY\nZA SPOCZYNKIEM,\
    \ ANI PLANU NA WOLNOSC, ANI ZADANIA WOBEC LUCANA - zaden plik tego nie ma\ni to\
    \ jest przestrzen, ktora ma wypelnic gra, nie narrator (retcon_000058).\nJEDNA\
    \ RZECZ, KTORA DODAJE Z WLASNEJ INICJATYWY I KTORA JEST W JEGO KARCIE: uklad przyjal\n\
    DOBROWOLNIE, bo byl uczciwy, i mierzy ludzi czynami. To jest odpowiedz na \"co\
    \ mu wolno\"\npodana jako \"co wybral\".\n\n6. CZEGO NARRATOR TU NIE ZROBIL. Nie\
    \ stworzyl nocnego straznika ani zadnej sytuacji\ntestujacej deklaracje Lucana.\
    \ Nie wymyslil godziny policyjnej. Nie orzekl, ze Varkhen\nnie da rady przejsc\
    \ przez miasto. Nie podal, ile trwa pomiar pieczeci. Nie stworzyl\nzegara ani\
    \ terminu (retcon_000055). Nie odwrocil niczego z t_228 i t_229 - uklad ze\nStraza\
    \ stoi, karta kontraktowa lezy z dwoma pustymi polami. Nie pozwolil Seraphine\
    \ uzyc\nani jednego faktu spoza jej karty (retcon_000136).\n\n7. STAN. Czwarty\
    \ dzien interludium, gabinet Seraphine, gorne pietro gildii.\nObecni: Lucan, npc_seraphine_vale,\
    \ npc_varkhen_mind (rog pokoju). Spidey i Tkacz przy\nLucanie, zuk w kieszeni.\
    \ Na blacie niedokonczona karta kontraktowa - puste ZAKRES i DATA.\nVarkhen 9,2/65.\
    \ Lucan 19/19, energia bez wydatku - czytac z pliku.\n"
  new_decision: 'Plan transportu przyjety: noca, ulica, plaszcz na zbroje. Seraphine
    podaje dwie otwarte pozycje ze swojej listy - ktore DWIE z siedmiu dzwigni Lucan
    rusza po prawniku, oraz czego chce Varkhen. Drugie pytanie zadaje juz jemu, nie
    Lucanowi, i dostaje odpowiedz: chce domknac trzy pieczecie i dolna brame, a co
    potem - nie wie i nie udaje, ze wie. Zostaje pozycja druga i trzecia z siedmiu.'
