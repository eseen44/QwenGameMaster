outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - ruch po znanym terenie i dopisek na kartce, interludium buduje
    gracz. Dziesiec minut, zero energii.

    1. PROBLEMY 5 I 6 DOPISANE - I TO JEST ZMIANA REJESTRU NA JEDNEJ KARTCE. Cztery
    pierwsze sa nauka otwarta: pytania bez zamawiajacego. Piaty i szosty maja SPECYFIKACJE:
    trwala niewykrywalnosc i odpornosc chityny na magie BEZ zaklocenia lacza z wlascicielem
    (zuk); kamuflaz ciem w swietle dziennym; ochrona latajacych konstruktow przed
    nietoperzami. To nie sa przynety - to zamowienie na R&D sieci, wsuniete miedzy
    przynety, z ojcem jako darmowym konsultantem. Nietoperze sa zreszta problemem
    realnym i nienazwanym dotad w plikach: nocna cma jest dla nietoperza pokarmem,
    a siec Lucana lata noca.

    2. NERIS CZYTA I WIDZI SZEW - BO CZYTANIE REJESTROW TO JEJ NAJLEPSZE NARZEDZIE,
    wlasnie nim rozebrala Kolma (t_140). Roznice nazywa na glos, bez oskarzenia, jako
    obserwacje tekstowa: pierwsze cztery to pytania, piaty i szosty to WYMAGANIA -
    pytan nie pisze sie ze specyfikacja brzegowa. Wyciaga z tego wniosek prawidlowy
    i minimalny: pajak na jej parapecie nie jest jedynym okazem ani ostatnim, sa albo
    planowane zuki i cmy, i komus zalezy, zeby ich NIE BYLO WIDAC. Zapisuje to w glowie
    do kategorii "zwloki, o ktore mialam zapytac" (jej wlasne slowa z karty: discretion_trust)
    i NIE pyta teraz - bo ma za szesnascie dni dysputa i wlasnie dostala od tego czlowieka
    wiecej niz ktokolwiek inny w tej instytucji.

    3. INSTRUKTAZ PRZYJETY W CALOSCI I BEZ URAZY. Nie przedstawiac sie - kiwa glowa;
    bycie studentka to koszt zerowy, a ona i tak nie umie sie przedstawiac (the_social_gap).
    Nie wchodzic w dyskusje - to bierze najpowazniej, bo widziala czaszke ze szklem
    i wie, jak wyglada uwaga tego czlowieka, kiedy juz na czyms spocznie. "Nie chcesz
    byc z nim w pokoju, jak sie nudzi" przyjmuje doslownie: przynety maja byc karmione
    PRZED znudzeniem, nie po.

    4. WYJSCIE RAZEM, O ZMIERZCHU, WIDZIALNE. Spidey ZOSTAJE na posterunku w jej pokojach
    - to byl sens posterunku i nikt go nie odwolal. Schodza rusztowaniem/ korytarzem
    skrzydla bez portierni, przez dziedziniec, do skrzydla laboratoryjnego. Obserwator
    skrzydla jest zywy i nieuchwycony; jesli patrzyl, ma teraz obraz: referentka szerokiej
    definicji wychodzi po zmroku z obcym mezczyzna i idzie prosto do laboratorium
    profesora Veyra, szesnascie dni przed dysputa. Ta informacja jest od tej chwili
    NA RYNKU i nie da sie jej cofnac. Zadnego kontaktu, zadnego zatrzymania - tylko
    widok.

    5. DRZWI LABORATORIUM. Swiatlo w srodku pali sie tak, jak pali sie u czlowieka,
    ktory nie wie, ktora jest godzina. Zza drzwi slychac przesuwanie papieru - stosy.
    Agenda ojca: znalezc odbitke z nazwiskiem osoby walczacej o szeroka definicje.
    Ta osoba stoi na jego progu z dwiema odbitkami pod pacha i nie wie o tym; Lucan
    wie i nie powiedzial. Kartka z szescioma problemami w kieszeni.

    6. STAN. Zmierzch dnia trzeciego, prog laboratorium profesora Veyra, skrzydlo
    laboratoryjne. Energia 10.85+ z 15 (regeneracja biegnie), integralnosc 19 z 19.
    USTALONE: problemy 5-6 na kartce i Neris widziala zmiane rejestru, wyciagnela
    wniosek o kolejnych okazach i odlozyla pytanie na pozniej; instruktaz przyjety;
    wspolne wyjscie bylo widzialne dla zywego obserwatora; Spidey zostal na posterunku
    w jej pokojach; scena konczy sie na progu laboratorium.'
  new_decision: Drzwi laboratorium profesora Veyra. W srodku szelest przekladanych
    stosow. Neris obok, poinstruowana, z wlasnymi odbitkami pod pacha. Lucan decyduje,
    jak wchodzi i czym otwiera - kartka problemow, okazem rozmowy, czy czyms innym.
