  prose: 'Droga na poludnie o tej porze nalezy do nikogo. Varkhen szedl pol kroku
    z tylu

    i przez cala te droge nie przerwal ani razu - ani przy sieci, ani przy energii

    cmentarza, ani przy zdaniu, ze Lucan nie ma dzis ani politycznej mozliwosci, ani

    umiejetnosci, zeby zrobic z niego uzytek. Sluchal tak, jak stoi: bez ruchu i bez

    znaku, czy cokolwiek z tego do niego dochodzi.


    Odezwal sie dopiero po posadzie zarzadcy, i nie o niej.


    - Czyjej ziemi? - zapytal.


    Wie o Lucanie akurat tyle, zeby to pytanie bylo niewygodne, bo Lucan sam mu kiedys

    powiedzial, ze od dwoch lat ucieka przed rodzina i przed tym, czego sie po nim

    spodziewaja. Odpowiedzi nie dostal i nie dopytal drugi raz.


    Potem szli juz bez slowa, az mur cmentarza wyszedl z ciemnosci. Varkhen zatrzymal

    sie i patrzyl na niego dluzej, niz patrzy na cokolwiek - pierwszy raz, odkad go

    stamtad wyniesiono.


    - To miejsce jest obserwowane - powiedzial. - Mowilem.

    '
  summary: 'Bez testu - interludium, roll_policy disabled. Trzydziesci piec minut
    marszu poza

    mury (system/pacing.md: podroz poza mury ma wlasna stawke; connection_cemetery_city

    ma travel_time needs_review, wiec liczba jest ustalona tu i zapisana). Zero energii.

    loc_lumaria_adventurers_guild -> loc_cemetery, zone_south_gate.


    1. OFERTA ZOSTALA ZLOZONA, NIC NIE ZOSTALO WYKONANE. "Odepne cie od sieci i od
    siebie"

    jest warunkowe ("jak zostaniesz na cmentarzu") i podane do rozwazenia - wszystkie

    cztery lacza upkeep z sustained-links.yaml pozostaja aktywne, integrity Varkhena
    bez

    zmian. Twierdzenie, ze energia cmentarza go utrzyma, jest KWESTIA LUCANA, nie

    ustalona mechanika: serce cmentarza jest zrodlem energii w plikach

    (pc-lucan#expansion_source_event_id: milestone_043a), ale nikt nigdy nie mierzyl,

    czy zasili Varkhena. Do plikow nie wchodzi jako mechanika (retcon_000120).


    2. VARKHEN ODPOWIEDZIAL NA JEDNA RZECZ, NIE NA LISTE. Wybral oferte i zadal pytanie

    konkretne, mieszczace sie w jego rejestrze - "czyjej ziemi?" - oparte na wlasnej

    wiedzy (fact_varkhen_knows_lucan_family_evasion). Nie skomentowal ani sieci, ani

    polityki: instytucje i magia po jego czasach to jego blind_spot i nie udaje, ze

    rozumie. NIE dopisano mu wdziecznosci, ulgi, podejrzenia ani planu.


    3. DRUGA KWESTIA JEST REAKCJA NA MIEJSCE, NIE NA WYPOWIEDZ, i jest cytatem z niego

    samego: w t_053 odradzil powrot na cmentarz, bo miejsce jest obserwowane i zwiazane

    z jego przysiega. To jest JEGO twierdzenie z dnia pierwszego, nienzweryfikowane
    zadnym

    innym plikiem. NARRATOR NIE POSTAWIL TAM ZADNEGO OBSERWATORA - pustka kupiona
    od

    syndykatu dotyczy dopiero prob gildii i wymaga sygnalu Lucana, ktorego nie bylo

    (planning/act-03-defence/cemetery_syndicate_arrangement.yaml), a straznika przy
    drodze

    nie stawia zaden plik (retcon_000033, retcon_000058).


    4. NIEUSTALONE: czyja ziemia, czy Varkhen zostanie na cmentarzu, kto miejsce obserwuje

    i czy nadal.

    '
