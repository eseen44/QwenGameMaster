  declared_action: 'Lucan wreszcie wyklada sprawe Akademii, ale przekuwa ja na jezyk
    bezpieczenstwa miasta.

    Akademia wie o pajakach, bo sama tworzy podobne stworzenia, i sama boi sie proby
    kontroli

    nad nimi, bo tym samym zajmuja sie u siebie; na dniach bedzie publiczna dyskusja.
    Osoby

    zwiazane z Kosciolem na uczelni usiluja doprowadzic do ograniczenia tych badan.
    Zla

    wiadomosc jest jednak inna - jedyna rzecza, ktora potrafi doprowadzic akademika
    do

    podpalenia polowy miasta, jest proba zabrania mu dorobku. Lucan zapowiada, ze
    sprobuje

    skontaktowac sie z frakcja pro-trupia, bo boi sie realnych zamieszek z udzialem
    duzej

    grupy niezrownowazonych, ale teoretycznie bardzo poteznych magow.

    '
