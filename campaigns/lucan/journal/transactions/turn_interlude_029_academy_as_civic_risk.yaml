  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Lucan trafil w jej mandat - bezpieczenstwo miasta, oslona grupy,
    powstrzymanie

    eskalacji nekromantycznej - i Seraphine natychmiast przestaje rozmawiac o jego
    sprawie,

    a zaczyna o miejskiej.

    PRZYJMUJE FRAMING I NAZYWA JEGO ZALETE: jesli to przestanie byc "Lucan nekromanta",
    a

    stanie sie "Akademia kontra Kosciol o licencjonowanie badan", to Lucan robi sie

    przypisem w czyjejs wojnie. To najlepszy mozliwy uklad dla niego i ona mowi to
    wprost.

    KORYGUJE JEDNA RZECZ, zawodowo, jako antymag. Magowie nie sa blokiem. Sa pojedynczo

    grozni i instytucjonalnie tchorzliwi; Akademia nie podpala miasta, Akademia blokuje

    precedens, wstrzymuje ekspertyzy i wygrywa proceduralnie. Ale zaraz odwraca to
    na gorsze:

    wystarczy dwa albo trzy pojedyncze incydenty ludzi "teoretycznie bardzo poteznych",
    zeby

    zrobila sie panika - a panika nie jest zamieszkami, panika jest PRETEKSTEM. I
    pretekstu

    nie potrzebuje Akademia. Potrzebuje go Inkwizycja.

    I DAJE MU NAJWAZNIEJSZA RZECZ TEJ ROZMOWY - powaznej wady w planie kontaktu z
    frakcja

    pro-trupia. Z zewnatrz nekromanta dolaczajacy do strony szerokiej definicji jest

    NAJLEPSZYM PREZENTEM dla strony waskiej. Argument oponenta pisze sie sam: patrzcie,
    kto

    przyszedl ich poprzec. Lucan widoczny w tym sporze nie wzmacnia Aldhen - jest
    jej

    kontrprzykladem i zywym dowodem, ze szeroka definicja produkuje dokladnie takich
    ludzi.

    Wniosek operacyjny, ktory Seraphine formuluje za niego: jego wartosc dla tej frakcji
    jest

    realna, ale musi byc NIEWIDZIALNA. Zrodlo, nie sojusznik. Karmi argument, nie
    wystepuje

    w nim.

    To zderza sie frontalnie z planem ojca, ktory chce wystawic okazy pod nazwiskiem
    syna -

    o czym Seraphine nadal nie wie.

    PYTA o dwie konkretne rzeczy, ktore sa jej robota: kto na uczelni jest zwiazany
    z

    Kosciolem, z nazwiskami, oraz czy Lucan orientuje sie, czy to ten sam interes
    co kaplan,

    ktory znal wlasciwe wejscie do komory Varkhena i przyszedl tam z Orenem. Nie twierdzi,
    ze

    to jedno; zadaje pytanie i chce, zeby ktos je sprawdzil.

    I stawia jeden warunek, jedyny w tej rozmowie: chce wiedziec ZANIM Lucan skontaktuje
    sie

    z ktorakolwiek strona sporu, a nie w dniu dysputy.

    '
  new_decision: 'Seraphine kupila framing miejski, skorygowala prognoze - nie zamieszki,
    a pretekst dla

    Inkwizycji - i pokazala, ze widoczny udzial Lucana w sporze uzbraja strone przeciwna.

    Chce nazwisk kosciolowych ludzi na uczelni i chce byc uprzedzona przed kazdym
    kontaktem.

    Wciaz nie wie, ze ojciec zna metode ani ze ma wystawic okazy pod nazwiskiem Veyr
    - a

    wlasnie ta jedna rzecz jest teraz nie do pogodzenia z jej rada. Lucan mowi jej
    o

    okazach i o ojcu, obiecuje uprzedzanie i wychodzi, przekierowuje na kaplana i
    Varkhena,

    czy konczy noc i idzie do baszty?

    '
  operations:
  - *id002
