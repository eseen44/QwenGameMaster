  - *id002
  summary: 'Bez testu - godzina, zero energii. Lucan zamienia oferte Mary na dokument.
    Deklaracja

    gracza laduje w calosci. Tura zawiera TAKZE zamkniecie pytania o Seraphine z nawiasu
    -

    patrz punkt 1.


    1. OBOWIAZEK WOBEC SERAPHINE SIE NIE ODPALIL - I ARGUMENT GRACZA JEST TWARDY,
    NIE

    UZNANIOWY. Zarzut: Mara ORAZ Boros widzieli w sarkofagu, ze Lucan cos robil z
    nieumarlym,

    i widzieli, ze przewodzil energie z nekromantycznej maszyny. Technikaliow nie
    znaja, ale

    nie ma czlowieka, ktory z tych dwoch zeznan nie wyciagnie, ze Lucan operuje energia

    smierci/zycia. Sprawdzone w plikach i ZGADZA SIE: mara-teln.yaml trzyma

    fact_mara_witnessed_varkhen_assault oraz fact_mara_saw_varkhen_weaken_during_lucans_contact,

    a secrets.yaml ma secret_lucan_practices_necromancy z suspected_by: [npc_mara_teln]
    JUZ OD

    milestone_045 - czyli sprzed t_184. Seraphine nie dostaje wiec zadnej nowej informacji

    o Lucanie i obligation_conditional_risk_disclosure_to_seraphine NIE MA CO ZGLASZAC.

    Narrator postawil to pytanie w t_184 zbyt szeroko. Jedyna rzecz, ktora dzis realnie

    powstala, jest INNEJ NATURY i zostaje odnotowana bez terminu: Mara nosi teraz
    WERSJE,

    ktora Lucan sam wybral (cover_lucan_never_tried_on_the_living, retcon_000120),
    wiec ryzyko

    nie brzmi "swiadek wie za duzo", tylko "swiadek powtarza historie, ktora da sie
    obalic".

    Zaden plik nie stawia temu terminu i nie robimy z tego zegara.


    2. LUCAN ROBI Z TEGO DOKUMENT I TO JEST JEGO NAJMOCNIEJSZY RUCH TEGO RANKA. Zamiast

    eksperymentowac na wlasnym ciele - dziewiec dni patrzenia, jak gnije mu reka,
    z uwaga

    o zapachu na przesluchaniu - bierze od Mary DYKTANDO. Koszt zerowy, ryzyko zerowe,

    material niepowtarzalny.


    3. CO TEN ZAPIS NAPRAWDE JEST WART - I DLACZEGO NIE DUBLUJE ATLASOW. Balwierz
    widzi rane

    DWA RAZY: jak przynosza i jak wynosza. Atlas balwierza jest wiec zbiorem stanow.
    Mara

    widziala CZTERY rany przez DZIEWIEC DNI z rzedu, w lesie, bez wyboru - jej material
    to

    KOLEJNOSC I CZAS, nie stany. Co po czym nastepuje, po ilu dniach, i ktory dzien
    jest tym,

    po ktorym juz nie ma powrotu. To trafia dokladnie w mechanizm samoleczenia tak,
    jak Lucan

    sam go opisal: wie GDZIE nacisnac, brakowalo mu KIEDY.


    4. CZEGO NARRATOR TU NIE WYMYSLA. Nie spisuje za gracza listy konkretnych obserwacji

    medycznych ani nie orzeka, czyje to byly rany i czy ci ludzie przezyli - zaden
    plik tego

    nie mowi (retcon_000058). Zapis istnieje jako przedmiot i jako zasob; jego zawartosc

    wypelnia sie deklaracjami gracza wtedy, kiedy jej uzyje.


    5. DZWIGNIA, KTORA Z TEGO POWSTALA - DO DECYZJI GRACZA, NIE NALICZONA Z URZEDU.

    ability_basic_self_repair ma mastery 24, najnizsza w calym repertuarze Lucana,
    i to ona

    ustawia jego sufit metamagii na tier 3 (min. ekspertyza 24) zamiast wyzej. Nowy,
    nazwany

    material wiedzowy jest kanonicznie tym, co takie rzeczy podnosi. NIE PODNOSZE
    tego sam

    i nie dopisuje liczby - jesli gracz chce, zeby ta godzina cos ruszyla w mastery,
    deklaruje

    to i przeliczam.


    6. MARA DYKTUJE I TO NIE JEST DLA NIEJ NEUTRALNA GODZINA. Wybrala miejsce sama
    - z ulicy,

    ale nie do pokoju dyzurnego; nikt jej tam nie zapraszal, a ona nie prosila. Mowi
    plasko,

    bez ozdobnikow, tak jak sklada meldunek - i jest to jedyny rejestr, w ktorym da
    sie

    podyktowac dziewiec dni patrzenia na cztery rany ludzi, z ktorymi sie wtedy szlo.
    Nie mowi,

    czyje to byly rany. Lucan nie pyta. Jedno zdanie, bez watku.


    7. STAN. Czwarty dzien interludium, 11:05, zaulki przy gildii. Energia 10,35/15
    plus

    regeneracja, integralnosc 19/19, bez warunkow. Zegary bez ruchu poza uplywem czasu.
    Zaden

    termin nie powstal. Nowy przedmiot w rekach. Poranek stracil godzine i nadal ma
    targ

    po introligatora - do zamkniecia dzis, bo sekwencja z t_174 zaczyna sie wlasnie
    od targu.'
  new_decision: Zapis jest zrobiony, Mara skonczyla dyktowac i nie zaproponowala niczego
    wiecej. Jest 11:05 i targ dzialal od switu. Lucan idzie po introligatora sam,
    bierze Mare ze soba, czy najpierw odnosi zapis do pokoju dyzurnego?
