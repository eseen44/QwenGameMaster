outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'TRZY ANCHORY DO NISZY, PO JEDNYM NA KANAL. Wykonane jak zadeklarowano
    (interludium, napiecie 0, rzuty disabled). Czwarty anchor, spy_hawk_moth_01, zostal
    w baszcie przy murze i do niszy nie wchodzi - jego pozycji nie ruszono. TEMPO
    ZASILANIA NIEZMIERZONE I CELOWO NIEPODANE: kanaly "zyja ledwo" (t_256), wiec w
    osiem minut nie ma czego zmierzyc; pomiarem jest zostawienie ich tam. Do state/growth-banks.yaml
    NIE wpisano ani jednej liczby - nic nie zmierzono, a reconcile_growth --check
    porownuje deklarowana nadwyzke ze suma stawek wezlow. Sufity z growth_intake_cap
    (Spidey 6,0, Tkacz 3,0, zuk 1,5 na dobe) obowiazuja bez zmian; rozkaz "nadmiary
    w Lucana, potem w siec" pokrywa sie z distribution_priority rank 1 i niczego w
    nim nie zmienia. NOWA OBSERWACJA: to, co wchodzi kanalami, nie ma wlasciciela
    ani sygnatury - wynika wprost z t_256 ("smierc bez wlasciciela, rowna, sprasowana,
    bez ani jednej warstwy"), wiec karmienie tym nie niesie niczyjego sladu. Zadnego
    skazenia, kary ani zegara narrator nie dodal: zaden plik ich nie stawia. MROZNY
    DOTYK ROZCIAGNIETY W CZASIE - KOSZT Z SILNIKA: gm amplify (bone_chill, base_tier
    1, target_tier 2, os duration, ekspertyza 28) = 4 jednostki jednorazowo, wymagana
    ekspertyza 20, instability 25, ryzyko strong_magical_trace. Pobrane operacja consume:
    14,8 -> 10,8. Wariant ciagly (tier 1 przez 30 interwalow) kosztowalby 30 jednostek
    na trzy minuty i jest niewykonalny - to jest numeryczna tresc limitu sustained_output_is_exhausting
    z abilities#ability_bone_chill. Izolacja dziala: ciagniecie ciepla ustaje, dlon
    zostaje bezczula. Bone Chill pozostaje nekromancja dzialajaca na temperature,
    nie magia zimna (retcon_000157). VARKHEN: reka opuszczona, jedna kwestia wprost,
    zero urazy i zero nalegania - voice_contract#evasion i #emotion. Oferta z t_257
    wygasla naturalnie; nie zapisano mu z tego zadnego zobowiazania ani zawodu. GESTY
    ANCHOROW wymagane przez planning/anchored-companions.yaml#responsiveness_now_not_only_later:
    Spidey wybiera stanowisko sam i bierze kanal przy otworze; Tkacz przytakuje za
    szybko i nie patrzy na pozostale okazy; zuk ustawia sie raz i przestaje sie ruszac
    (jego traits: lenistwo zrobione doktryna, "nauczy sie jesc bez poruszania sie").
    NAPRAWA ROZJAZDU BEZ RETCONU: spy_beetle_01 mial position.location_id loc_lumaria_adventurers_guild
    przy formation "back_in_lucans_pocket_after_four_turns" i dobowym laczu ladowania
    z reki - pole lokacji nie zostalo odswiezone przy wyjsciu Lucana z gildii w t_250.
    Ustawione na loc_cemetery_underworks; to dociagniecie pola do prozy, nie zmiana
    kanonu. NIEUSTALONE: tempo doplywu, skad kanaly biora, co sie stanie, gdy okaz
    dojdzie do sufitu wchlaniania, i czy ktokolwiek to zauwazy. POLA RUSZONE: rezerwa
    Lucana, pozycje pieciu instancji.'
  prose: 'Nisza ma trzy zbiegi, więc pytanie, co z nimi zrobić, odpowiada się samo.


    Spidey nie czekał, aż ktoś wskaże mu miejsce. Wszedł pierwszy i zajął kanał najbliżej

    otworu - wyjście za plecami, jak zawsze. Tkacz weszła zaraz po nim, przytaknęła
    w tym

    swoim za szybkim rytmie, jeszcze zanim zdanie się skończyło, i wzięła to, co zostało,

    nie patrząc ani na pająka, ani na żuka. Żuk dał się wyjąć z kieszeni jak kamień
    i jak

    kamień się ustawił: raz, w ostatnim rowku, i przestał robić cokolwiek. Jeżeli

    którekolwiek z nich dostało kiedyś zadanie skrojone dokładnie pod siebie, to on.


    - Uważajcie na siebie. Nie żryjcie bez przerwy. Nadmiar do mnie, potem w sieć.


    Przyjęły to bez targowania. A kiedy pierwsza nić weszła z kamienia w pająka, widać

    było, jakie to cienkie. Nie posiłek. Nitka. Tamta rzecz nie nabrała tego przez
    noc

    ani przez rok - coś dowoziło tu taką strużkę przez czas, którego nie chce się

    wymawiać. Żeby wiedzieć ile, trzeba ich tam zostawić i wrócić.


    Jedno jest nowe i nie do przeoczenia: to, co wchodzi, nie ma właściciela. Żadnego

    śladu, żadnego "po kim", niczego do strawienia. Czyste - w sposób, w jaki nic,
    co

    Lucan dotąd podawał swoim, czyste nie było.


    Potem rzecz w dłoni. Wzorzec daje się rozciągnąć płasko, zamiast pchnąć twardo:

    cienka warstwa mrozu rozpięta między skórą a kamieniem i trzymana. Ciągnięcie
    ustaje

    w pół oddechu. Dłoń zostaje martwa i zimna, pod palcami nie ma już czego czuć,
    ale

    ciepło przestaje uciekać. Kosztuje to od razu i czuć to od razu - a rozciągnięty

    wzorzec świeci na wszystkie strony głośniej niż zwykły dotyk.


    Varkhen stał z wyciągniętą ręką dłużej, niż było trzeba.


    - Sam podtrzymam - powiedział Lucan.


    - Jak chcesz.


    Opuścił rękę i poszedł przodem.


    W górę wąskim przekopem na poziom starych krypt, potem tunelem przy murze: sucho,

    ciasno, ślady kół w pyle sprzed lat. Hala wozów wita ich tym samym przeciągiem
    od

    rampy, co zawsze - brama nie jest zamykana od lat i dalej nie jest. Za nimi, dwa

    poziomy niżej, w kamiennej dziurze siedzą przy trzech rowkach trzy małe kształty

    i nikt poza nimi dwoma o tym nie wie.

    '
