  summary: 'Bez testu - interludium, roll_policy disabled, cele bez arkuszy. Minuta
    na przejscie sali

    i schody. KOSZT: 1,0 jednostki - dziesiec aplikacji po 0,1

    (effects/minor-bad-luck.yaml#resource_cost). ENERGIA 3,72 -> 2,72 przed regeneracja.

    Pech uzyty pierwszy raz w tej kampanii tak, jak opisuje go kalibracja: NIE taktycznie.


    0. NAWIAS ROZSTRZYGNIETY JAKO AKT WEWNETRZNY, ZERO SEKUND (retcon_000032 doprecyzowany

    przez retcon_000060). casting_profile ability_minor_bad_luck: subtle true, quick
    true,

    bez widocznego gestu; capability delivery range_m 10 pokrywa sale. Rzucone z wlasnego

    ciala, wiec bez strat sieciowych. Warunek "natychmiastowy i niezauwazalny z zewnatrz"

    spelniony - czas tury bierze sie WYLACZNIE z przejscia i schodow.


    1. NARRATOR NIE INSCENIZUJE DZIESIECIU KATASTROF PUNKT PO PUNKCIE - TO STOI W
    PLIKU.

    curses.md#do-czego-naprawde-sluzy-pech: "Wybiera moment, uderza raz i niesie konsekwencje

    postrzegania". Deklaracja gracza laduje w calosci co do liczby i kosztu, ale rozstrzyga

    sie JAKO JEDEN MOMENT: sala idzie zle naraz. Skala z pliku to nie "peki jeden
    szew",

    tylko "cały pokoj idzie zle naraz - ludzie padaja, rzeczy sie rozsypuja, swiatlo
    gasnie,

    liczenie zaczyna sie od nowa". Dokladnie to.


    2. ZESZYT DOSTAJE SWOJE, BO GRACZ WSKAZAL GO JAWNIE. Jeden z dziesieciu celow
    jest

    imienny i narrator go nie rozmywa. Rejestr urzedniczki jest tym przedmiotem w
    sali,

    ktory ma najwiecej wiarygodnych trybow awarii naraz - i ktorys z nich wchodzi.

    effect#limitations: affected_arrangement_not_guaranteed_to_match_casters_preference,

    wiec narrator wybiera tryb, nie gracz; ale cel byl wskazany i cel obrywa.


    3. CZEGO TO NIE JEST - GRANICA OSTRA (curses.md, sekcja o klatwach wobec urzednikow).

    NIE jest sprawa karna: prawo Solmary nie ma kategorii dla czegos, czego nikt nie
    traktuje

    powaznie, a prog realnej sprawy to skutek TRWALY (kalectwo, utrata zmyslu, smierc).

    Zadnego takiego skutku nie ma. NIE jest tez zagrozeniem instytucjonalnym Lucana
    -

    to bierze sie z nieumarlych, nie z cantripow, i narrator nie doklei powagi jednego

    do drugiego. magical_trace: faint; nikt magicznie pismienny nie stoi w tej sali.


    4. CO ZOSTAJE, CZYLI LADUNEK WLASCIWY - I TO JEST SPOLECZNE, NIE MAGICZNE.

    "Nikt nie nazywa tego magia i nikt nie oskarza Lucana. Ludzie zapamietuja cos
    gorszego

    i trwalszego: ze PRZY TYM CZLOWIEKU RZECZY SIE PSUJA." Urzedniczka nie podejrzewa
    czaru

    - nie ma czym. Zapamietuje sekwencje: mlody Veyr podchodzi do okienka, pyta o
    rzeczy,

    ktorych w taryfie nie ma, mowi "takie zycie", odchodzi - i sala staje na glowie
    w tej

    samej chwili. To wchodzi do jej karty jako suspected, nie confirmed, i NIE jako

    podejrzenie o magie, tylko jako odruch: przy tym czlowieku ma sie na bacznosci.

    NARRATOR MA TO PROWADZIC DALEJ W KOLEJNYCH SCENACH - plik zada tego wprost.


    5. REALNA CENA, TA ZE SERAPHINE, ODNOTOWANA BEZ DRAMATYZOWANIA (t_037,

    "every signature has a room"). Podrazniony urzad nie produkuje bledu do wykorzystania,

    tylko PAPIER. Jeden rozsypany rejestr w gildii, w ktorej Lucan jest czlonkiem,
    to jeszcze

    nie urzad i jeszcze nie papier - to strata popoludnia jednej osoby. Narrator odnotowuje

    mechanizm, zeby przy nastepnym razie bylo wiadomo, skad rachunek, a NIE stawia
    z tego

    zegara, terminu ani sledztwa (retcon_000055).


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie wyprodukowal swiadka, ktory "zauwazyl, ze
    to zaczelo

    sie przy nim" i poszedl to komus powiedziec. Nie zszedl nikt z gory. Nie ustanowil,

    ze Seraphine o tym uslyszy, ani ze ktokolwiek to gdzies zapisze. Nie zrobil z
    rozsypanego

    rejestru dowodu, straty dokumentu sprawy ani opoznienia czegokolwiek w watku cmentarnym.

    Nie ruszyl zadnego zegara poza uplywem czasu.


    7. STAN. Czwarty dzien interludium, gorne pietro gildii, przed pokojami biurowymi.

    Seraphine u siebie (seraphine-vale.yaml#current_zone_id: zone_guild_upper_offices),

    wrocila ze spotkania ze Straza okolo godziny 15:30-16:00. Spidey i Tkacz przy
    Lucanie,

    zuk w kieszeni. Integralnosc 19/19, energia po odjeciu 1,0 i po regeneracji -
    czytac

    z pliku. Godzine czytac ze state/time.yaml.

    '
  new_decision: Lucan stoi na gornym pietrze. Drzwi Seraphine sa nastepne w korytarzu
    - z czym do niej wchodzi.
