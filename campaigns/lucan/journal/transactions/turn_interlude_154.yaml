  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cztery minuty, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Harmonogram sprawdzony w plikach, NIE improwizowany: zadnego

    opoznienia nigdzie nie ma.

    1. ODPOWIEDZ NA PYTANIE O TERMIN - BEZ OPOZNIEN, I JEST TO WERYFIKACJA, NIE DECYZJA

    NARRATORA. Jedyny zapis kanonu to "najblizsza stala dostawa zywego towaru Akademii

    za okolo 7 dni" z event_turn_interlude_021, czyli z dnia pierwszego interludium

    (state/objectives.yaml#material_dates.fresh_supply oraz

    planning/act-03-defence.yaml#decoy_construct.material_timetable). Dzis jest wieczor

    dnia trzeciego, wiec zostaly okolo CZTERY DNI. Rachunek gracza ("piec dni") byl

    poprawny co do rzedu. Nie istnieje zaden wpis o poslizgu, przesunieciu ani brakach
    -

    nie dokladac go (retcon_000015).

    2. ZOBOWIAZANIE PADLO NA GLOS I OJCIEC ZAKOTWICZYL JE NA KONKRETNYM OKAZIE. Lucan

    powiedzial "moj pajak". Ojciec slyszy przez to jedyny pajak, jaki widzial i trzymal
    -

    tego z t_018, z brakujacym odnozem, ktorego robote ocenil jako cierpliwa i porzadna.

    Mowi o nim po tej cesze, bo cechy pamieta lepiej niz cokolwiek innego. NARRATOR
    NIE

    ROZSTRZYGA, czy Lucan da Spideya, czy wabika - to decyzja gracza i pozostaje otwarta.

    Rozstrzygniete jest tylko to, ze ojciec ma w glowie obiekt Z KIKUTEM i ze jest

    jedynym czlowiekiem w miescie, ktory ogladal ten warsztat z bliska.

    3. CENA TEJ KOTWICY, NAZWANA I NIEROZSTRZYGNIETA. Cala konstrukcja wabika stoi
    na

    tym, ze Spidey zostaje caly (objective_build_decoy_construct_for_academy). Wabik
    jest

    materialowo INNY - species_maturation_canon: swiezy okaz realnie jest blizszy

    konstruktowi, bo nie zdazyl sie wyrobic. Podmiana jest wiec mozliwa i sensowna,
    ale

    jedynym czlowiekiem, ktory ma podstawe porownawcza, jest ten, ktoremu Lucan wlasnie

    obiecal obiekt. Do rozstrzygniecia przez gracza, nie dzis.

    4. REJESTR ZAOPATRZENIA WYCHODZI Z SZAFY - I TYM RAZEM NA WLASNA PROSBE LUCANA.
    W

    t_150 ksiega zostala w szafie jako skutek wlasnego ruchu gracza (zmiana osi z

    materialu na wykrywalnosc). Pytanie o termin sprowadza ja na blat, otwarta, przy

    Neris. Ojciec podaje date dostawy z tabeli, nie z pamieci.

    5. DROGA DO MATERIALU JEST LEGALNA I JUZ PRZYGOTOWANA - TO JEST ZYSK, NIE PULAPKA.

    Zeby pobrac ze stalej dostawy, trzeba miec na co pobierac. Lucan MA zarejestrowana

    jednostke badawcza gildii (t_071, druk podpisany dzisiejsza data, zaden okaz nie

    wymieniony, przedmiot przypisuje sie pozniej). Ojciec proponuje wpisac te jednostke

    do rejestru zaopatrzenia Akademii - trzeci raz tego wieczoru otwiera cudzy dostep
    do

    zasobu instytucji i po raz trzeci nie rozumie tego jako przysluge.

    6. ALE WPIS JEST WPISEM. Jednostka badawcza Lucana dostanie datowana linijke w

    rejestrze Akademii, na swiezy material biologiczny, jedenascie-dwanascie dni przed

    clock_guild_leadership_hearing i clock_father_arranges_academy_showing. To dokladnie

    ten typ ograniczenia, na ktorym stoi ta kampania - instytucjonalny i informacyjny,
    nie

    zasobowy (retcon_000015). Nie jest to zarzut ani ryzyko dowodowe; jest to slad,
    ktory

    bedzie istnial i ktory ktos moze przeczytac. Decyzja gracza.

    7. WORLD MOVE - NERIS PATRZY W OTWARTY REJESTR I ZADAJE PYTANIE, KTOREGO NIE ZADALA

    DWA RAZY WCZESNIEJ. Jej wlasna kategoria "zwloki, o ktore mialam zapytac" (t_145)

    dostala cene w t_149 i nazwe rejestru; teraz dostaje sam rejestr, otwarty, metr
    od

    niej. Nie pyta o zwloki - pyta o rzecz, ktora jest jej wlasnym nawykiem

    (portrayal.seen_from_the_gatehouse.guest_book_habit: sama wpisuje swoich gosci
    do

    ksiegi odwiedzin, czego nikt inny na tej uczelni nie robi): czy ten rejestr jest

    JAWNY. To nie jest przenikliwosc ani przeciw-odczyt. To jest pytanie osoby, ktorej

    stosunek do ksiag polega na tym, ze sie je uczciwie wypelnia.

    8. CZEGO NERIS NIE POWIEDZIALA. Jako jedyna w tym pokoju widziala ten okaz JEDZACY

    (t_132) i WYBIERAJACY wlasne stanowisko (t_133) - czyli dwa fakty, ktore sa

    jednoczesnie najlepszym argumentem dla szerokiej definicji i dowodem, ze jej wlasne

    kryterium jest merytorycznie falszywe. Uslyszala wlasnie, ze ten sam okaz stanie
    na

    stole procedury. Nie powiedziala nic. Nadal nie zapytala.

    9. CZEGO NIE PADLO. Trzecia substancja (lichen_speculans) nadal nie. Pytanie ojca
    "do

    ktorego stopnia kupujemy" nadal nietkniete, trzeci raz. Nie padlo slowo wabik,
    nie

    padlo imie Spideya, nikt nie ustalil, KTO przeprowadza procedure i przed kim.

    10. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:57. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. W kieszeni szkielko z Sordina, w rece

    odbitka Neris. USTALONE: brak opoznien, dostawa za ok. cztery dni; obiekt obiecany
    i

    zakotwiczony przez ojca na pajaku z kikutem; rejestr zaopatrzenia otwarty na blacie

    przy Neris; ojciec proponuje wpisac jednostke badawcza Lucana do rejestru Akademii;

    Neris pyta, czy rejestr jest jawny.

    '
