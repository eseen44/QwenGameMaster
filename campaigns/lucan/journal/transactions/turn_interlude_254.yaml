  prose: 'O rozdzce Varkhen nie powiedzial nic, i nie bylo w tym zadnej wymowy - po
    prostu

    nie ma w nim miejsca, w ktorym cudza zazdrosc o cudzy sprzet cokolwiek zaczepia.

    Poszedl za Lucanem i stanal dwa kroki od niego, bo nikt mu nie kazal inaczej.


    Polnocny fundament z bliska wyglada tak, jak opisywal go grabarz: kamienie sa

    przesuniete. Tyle ze pyl na szczelinie lezy rownym nalotem, nie swiezy, i nikt

    ich nie ruszal od dawna - co zgadza sie z tym, co powiedzial kamien przy bramie.

    Za nimi jest pustka. Mala, na wyciagniecie reki, nie korytarz.


    A w pustce siedzi to, czego dwa skany z daleka nie umialy nazwac, i z metra

    przestaje byc niewyrazne w jeden konkretny sposob: nie jest cialem. Nie ma warstw,

    nie ma splotu, nie ma rozkladu w zadnej fazie. Jest jednym punktem, gestym, zimnym

    i zupelnie nieruchomym, i lezy tam dokladnie tak, jak lezy rzecz odlozona.


    Zeby wiedziec wiecej, trzeba ruszyc kamienie.

    '
  summary: 'Interludium, roll_policy disabled - bez rzutu, automatic_with_cost. Dziesiec
    minut,

    0,1 jednostki (drugi zadeklarowany skan tej nocy). Trasa przez podziemia kaplicy

    ZADEKLAROWANA, ale NIEROZEGRANA - tura konczy sie przy polnocnym fundamencie,
    bo

    badanie samo otworzylo punkt decyzji.


    1. BLIZSZE BADANIE ZAWEZILO, NIE ROZWIAZALO - i tak mowia limity w plikach:

    ability_grave_sense#limits "detects_patterns_not_complete_explanations", geo#weaknesses

    "combined_noise". Co doszlo: kamienie faktycznie przesuniete (potwierdza

    fact_teren_knew_north_foundation_signs), ale pyl NIE jest swiezy, wiec od czasu
    obserwacji

    grabarza nikt ich nie ruszal; za nimi mala pustka; sygnal to POJEDYNCZY, gesty,

    nieruchomy punkt BEZ cech ciala. CZYM JEST - NIEROZSTRZYGNIETE, i narrator tego
    nie

    rozstrzygnal ani na korzysc, ani na niekorzysc gracza. Nie ma tam potwora, straznika

    ani pulapki; nie ma tez obietnicy, ze jest tam material.


    2. WSKAZANIE, CO DALEJ, JEST UCZCIWE, NIE PRZESZKODA: skan nie zastepuje otwarcia.

    Ruszenie kamieni jest zwykla czynnoscia fizyczna, ktorej nikt tu nie broni - teren
    jest

    pusty, napiecie 0, zaden plik nie stawia przy fundamencie ani warty, ani zamka

    (retcon_000033, retcon_000055).


    3. MEDIUM DLA KLATW - INTENCJA ZAPISANA, NIC NIE WYTWORZONE. Przedmiot jako kanal

    dostarczenia jest juz kanonem (system/curses.md, retcon_000132: "przez przedmiot",

    zbior kanalow otwarty, narratorowi nie wolno odmawiac kanalu spoza ksiazki), wiec
    droga

    nie wymaga zgody swiata - wymaga materialu i pracy. Idzie do planning/lucan-leads.yaml

    jako lead_curse_medium_from_material.


    4. VARKHEN NIE ZAREAGOWAL NA ROZDZKE i to jest zgodne z kontraktem, nie przeoczenie:

    aluzji i podtekstu nie zauwaza, a instytucje i magia po jego czasach to jego blind_spot.

    Poszedl i stanal, bo nikt mu nie kazal inaczej (voice_contract#body). Nie zapytano
    go

    o polnocny fundament i sam sie nie odezwal; jego karta nie ma o tym miejscu ani
    slowa.

    '
