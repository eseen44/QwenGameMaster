  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dwadziescia piec
    minut, zero energii. Lucan podal liste tak, jak zazadala - po jednej linii. Seraphine
    posortowala ja na oczach Lucana i nazwala kazda pozycje. 1. UWAGA, KTORA STAWIA
    PRZED SORTOWANIEM I KTORA JEST NAJTRAFNIEJSZA RZECZA WIECZORU: na tej liscie jest
    siedem pozycji i ANI JEDNA nie jest obrona. Wszystkie sa dzwigniami. Lucan przyszedl
    zapytac, jak przezyc przesluchanie, i przyniosl wylacznie sposoby na ruszanie
    innych ludzi. 2. PIORO RUSKA - OTWIERA NATYCHMIAST I BEZ PYTANIA O ZGODE, I TO
    JEST JEDYNA POZYCJA, PRZY KTOREJ WSTAJE. Nie chodzi o legalnosc: nosnikiem jest
    przedmiot, efekt nie zostawia sladu, nie ma dowodu ani progu karnego (retcon_000028,
    event_turn_interlude_095). Chodzi o to, co ten przedmiot robi Z POSTEPOWANIEM.
    Halven Rusk jest wlasnie sprawdzany na kompetencje, a jego jedyna dzwignia to
    raporty i zastrzezenia proceduralne. Lucan uczynil go NIEZDOLNYM do napisania
    raportu i Rusk obwinia o to siebie. Wniosek Seraphine: wynik tego sledztwa nie
    jest ustalany - jest PRODUKOWANY, przez Lucana, w budynku, w ktorym za dwa tygodnie
    stanie przed czesciowo tymi samymi ludzmi. Jesli Rusk zostanie odsuniety za raporty,
    ktorych nie mogl napisac, a kiedykolwiek wyjdzie dlaczego, otwiera sie wszystko
    naraz i z Lucanem jako przyczyna. 3. I ROBI DRUGA UWAGE, CZYSTO PRAKTYCZNA, KTOREJ
    LUCAN NIE UWZGLEDNIL. "Zabrac albo odczarowac" brzmi prosto, dopoki sie nie pamieta,
    JAK to pioro tam trafilo: Lucan wrecil je Ruskowi osobiscie, jako podarunek, z
    reki do reki, po tym jak mu wspolczul (event_turn_interlude_095). Podarunku nie
    da sie po cichu odzyskac. Odebranie go jest ZDARZENIEM - Rusk zapamieta dzien,
    w ktorym czlowiek od nekromancji przyszedl i zabral mu prezent akurat wtedy, gdy
    zaczal znowu moc pisac. Seraphine nie rozstrzyga tego za Lucana. Zada, zeby przestalo
    dzialac PRZED posiedzeniem, i chce znac sposob, zanim go uzyje. 4. STARUSZEK SIE
    NUDZI - NIE TRAKTUJE TEGO JAK NITKI, TYLKO JAK OGIEN, I JEST TO POZYCJA ROWNIEZ
    JEJ. To ONA wyprowadzila Varkhena z osuwiska i ONA trzyma go w piwnicy tego budynku;
    sama kiedys przyznala, ze fizycznie sprawny Varkhen moze byc dla niej za grozny
    na zwykle srodki zatrzymania (event_turn_interlude_044). Znudzony, rozumny, bardzo
    stary nieumarly piec metrow pod sala, w ktorej za dwa tygodnie beda przesluchiwac
    jego wlasciciela. Reakcja jest krotka i pozbawiona ironii: NUDA to nie jest stan,
    to jest zegar. Chce wiedziec, czego on chce - nie co mu wolno. 5. KAPLAN - OTWIERA,
    I JEST TO JEDYNA POZYCJA, KTORA PRZYJMUJE Z CZYMS W RODZAJU ULGI. Pyta o niego
    od tygodni: kaplan znal wlasciwe wejscie, kontrolowal pieczecie i przy ostatniej
    wizycie przyszedl z Orenem, a ona sama chciala wiedziec, czy to ten sam interes,
    co ludzie Kosciola na uczelni (fact_seraphine_wants_names_of_church_linked_academics).
    "Bede mial" wystarcza jej za teraz; chce byc uprzedzona PRZED spotkaniem, nie
    po. 6. PRAWNIK - OTWIERA KATEGORIE, ODMAWIA NAZWISKA, I OD RAZU WYCIAGA WNIOSEK,
    KTORY JEST WLASCIWA TRESCIA TEJ POZYCJI. Prawnik z obiegu przestepczego obsluguje
    obrone KARNA, a obrona karna i klasyfikacyjna sobie PRZECZA (act-03-defence.yaml#two_contradictory_defences).
    Skoro Lucan ma juz tego prawnika, to polowa wyboru zostala zrobiona przypadkiem,
    przy okazji sprzedazy zlota. Zada, zeby wybor zostal zrobiony swiadomie i przed
    posiedzeniem. 7. URZEDNIK MAGISTRATU PRZY GARBARNI - OTWIERA FAKT, ZAMYKA NAZWISKO,
    I ROBI TO OSTRO. Rano staje przed sluzbami miejskimi; nazwisko czlowieka z ich
    wlasnej kancelarii jest dokladnie ta wiedza, ktora zamienia ja ze swiadka w strone.
    Ale MUSI wiedziec, ze ktos tam kopie, bo to ONA powiedziala Lucanowi, ze sprawa
    garbarnika jest formalnie otwarta (fact_seraphine_told_lucan_the_tannery_case_is_open)
    - czyli trop wyszedl od niej i wroci do niej, jesli ktos pociagnie za sznurek.
    8. REJESTR ZAINTERESOWANYCH NEKROMANCJA - ODMAWIA CALKOWICIE I NAZYWA, CZYM TO
    JEST Z DRUGIEJ STRONY: to nie jest lista kontaktow, to jest gotowa LISTA DONOSU.
    W rekach Inkwizycji albo Kosciola ten sam papier jest wyrokiem dla kazdego nazwiska
    na nim. Jej zdanie: dopoki taki spis istnieje w jednym kawalku, jest grozniejszy
    dla ludzi na nim niz dla Lucana - a Lucanowi wystarcza, ze WIE, kogo tam wpisal,
    bez trzymania calosci w jednym miejscu. Posiadania nie tyka, tak samo jak nie
    tknela glejtu. 9. PRZEDMIOT KOSCIOLA - ZOSTAJE ZAMKNIETY, BO JUZ RAZ TO USTALILI.
    Wie, ze relikwia istnieje i ze ktos sie po nia zglosi; nie zna szczegolow, nie
    chce ich i nazwala to terminem, nie aktywem (fact_seraphine_knows_a_powerful_relic_is_claimed).
    Bez zmian. 10. DYSPUTA - OTWIERA, I TU DOWIADUJE SIE RZECZY NOWEJ. Zna spor, zna
    stawki, zna obie frakcje. NIE wiedziala, ze Lucan zamierza go WYGRAC - dotad rozmawiali
    o dyspucie jak o zagrozeniu, ktorego trzeba nie dopuscic do szybkiego rozstrzygniecia
    (fact_seraphine_knows_no_academy_faction_is_safe). "Do wygrania" to inna rzecz
    niz "do przetrwania". Odnotowuje jednym zdaniem, ze wojna religijna nie jest cena
    dodatkowa ryzykowanej strategii, tylko jej OPISEM. 11. ZAKON MIECZOWY - ODPOWIADA
    JAKO OFICER I ODPOWIEDZ JEST JEDNOCZESNIE TAK I DROGO. Gildia kontraktuje zakony
    rutynowo i ona wie, do kogo isc. CENA JEST PAPIEREM: karta, komandor z nazwiska,
    zakres, data - czyli operacja cmentarna zostaje UDOKUMENTOWANA dokladnie w tygodniach,
    w ktorych Lucan idzie na przesluchanie, a jego nazwisko wchodzi do akt jako powod
    zamowienia. Dodaje wlasny warunek: zamawia gildia albo nikt, bo zlecenie przyniesione
    cudza reka jest dla zakonu zatrute, a jesli papier ma powstac, to ona woli byc
    ta osoba, ktora go pisze. 12. WORLD MOVE - PRZESTAJE PRZYJMOWAC I ZACZYNA ODDAWAC.
    Konczy sortowanie i mowi, ze na dzis wystarczy, bo rano staje przed sluzbami i
    musi spac z lista rzeczy, ktorych NIE zna. Ale zanim wypusci Lucana, zada jednej
    rzeczy w druga strone: kolejnosci. Ma przed soba siedem dzwigni i dwa tygodnie
    i chce uslyszec od niego, ktora trzy rusza NAJPIERW - bo wszystkie naraz to nie
    jest plan, tylko lista zyczen, a ona widziala juz ludzi, ktorzy przegrali posiedzenie
    na tym, ze mieli za duzo racji. 13. STAN. 19:15 dnia trzeciego, gorne biura, drzwi
    na zasuwie, skorupy sprzatniete. Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow.
    4 000 srebra w zlocie i przepustka syndykatu w kieszeni, Spidey przy zebrach nieodkryty.
    SERAPHINE OTWARLA: pioro nad Ruskiem, kaplana, kategorie prawnika, fakt kopania
    pod garbarnia, dysputa jako cel do wygrania, nude Varkhena. ODMOWILA: rejestru,
    nazwiska urzednika, nazwiska prawnika, szczegolow relikwii.'
  new_decision: 'Seraphine zada trzech rzeczy przed koncem rozmowy: sposobu na wygaszenie
    piora przed posiedzeniem, odpowiedzi czego chce Varkhen, i wskazania KTORE TRZY
    z siedmiu dzwigni Lucan rusza najpierw. Co odpowiada.'
