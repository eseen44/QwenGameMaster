  summary: 'Rzut roll_turn_interlude_095: naturalna 5, po karze za pierwszy w zyciu
    przebieg minus 5 przy progu 20. Nie krytyk, ale spudlowane o dwadziescia piec.
    Pierwsze uzycie Uprzejmosci w historii tej kampanii jest porazka i porazka DROGA.
    1. DOSTARCZENIE ZADZIALALO. KSIAZKA JEST DOBRA. Rozdzial mowil, ze nosnikiem jest
    forma, ktorej cel nie moze odrzucic bez obrazy - i to sie sprawdza co do slowa.
    Rusk, czlowiek zyjacy hierarchia i procedura, nie potrafi odmowic rytualnego przedstawienia
    od czlonka gildii, nawet od tego czlonka gildii. Odklada pioro i odpowiada uklonem,
    bo forma jest silniejsza niz jego wlasna niechec. Ucalowanie dloni jest juz czysta
    groteska i wlasnie dlatego przechodzi - Rusk przez dwie sekundy nie ma pojecia,
    co z tym zrobic, a ten paraliz JEST oknem kontaktu. Dostarczenie w obu procedurach:
    pelny sukces. To nie ta czesc zawiodla. 2. ZAWIODL KANAL, I ZAWIODL DOKLADNIE
    TAM, GDZIE OSTRZEGALA TURA 092. Wzorzec przyswojony z ksiazki nie jest wzorcem
    odtworzonym - trzeba go raz przepuscic wlasnym kanalem, zeby stal sie powtarzalny.
    Lucan probuje przepuscic DWA, jeden po drugim, w tym samym kontakcie, majac za
    soba zero przebiegow. Nie zamknal pierwszego, zanim otworzyl drugi. Kanal nie
    oddaje dwoch procedur, tylko jedna smuge. 3. I SMUGA WYCHODZI TYM, CO LUCAN UMIE
    NAPRAWDE. Nieuformowany ladunek nie znika - szuka najglebiej wyjezdzonej sciezki,
    jaka ma w kanale, a u Lucana ta sciezka nie jest ani swiadem, ani cisnieniem krwi.
    Jest CHLODEM. W dlon Ruska wchodzi krotki, wyrazny, calkowicie nieprzypadkowy
    impuls zimna. Nie rani, nie odmraza, nie zostawia sladu - po kalibracji z 25.08.2026
    zaden prog karny nie zostal przekroczony i zadna klatwa nie zadziala nawet w polowie.
    Swiad nie powstal. Zapasc nie powstala. Poszla energia i nie kupila nic. 4. NAJGORSZA
    MOZLIWA OSOBA NA NAJGORSZY MOZLIWY OBJAW. Halven Rusk ma w karcie potwierdzony
    fakt fact_rusk_knows_lucan_uses_cold z milestone_016: Lucan uzywa skutecznej magii
    zimna. Ze wszystkich rzeczy, ktore mogly wyjsc z zepsutej procedury, wyszla jedyna,
    ktora ten konkretny czlowiek rozpoznaje bez wahania i bez wiedzy magicznej. Nie
    musi umiec czytac kanalu. Musi tylko pamietac garbarnie. 5. NOWA ZASADA, KTORA
    LUCAN WLASNIE ZMIERZYL WLASNYM KOSZTEM. Procedury z Uprzejmosci wymagaja SEPARACJI:
    jedna na kontakt, domknieta, zanim zacznie sie nastepna. Lancuch czterech uprzejmosci
    w jednej rozmowie nie jest planem, tylko czterema szansami na smuge - dopoki kazda
    procedura nie ma za soba pierwszego udanego przebiegu z osobna. 6. RUSK ROBI DOKLADNIE
    TO, CO MA W KARCIE. Cofa reke. Nie krzyczy, nie wzywa strazy, nie oskarza o nekromancje
    - bo nie ma podstaw i nie jest odwazny. Jest urazonym urzednikiem bez wlasnej
    sily sprawczej, ktorego jedyna dzwignia to routine_reports_and_procedural_objections.
    Wiec siega po to, co ma: po pioro. 7. CENA. 1,5 jednostki za nic. Energia 12 z
    15. Integralnosc 19 z 19, bez warunkow. Rusk bez zadnego warunku, bez obrazen,
    bez klatwy - tylko z pamiecia zimna w dloni i z piorem w reku.'
  new_decision: Rusk cofnal reke, patrzy Lucanowi prosto w twarz i siega po pioro
    - to samo pioro, ktore Lucan zamierzal wychwalic, przekląc usypianiem i podarowac
    mu jako narzedzie jego wladzy. Kondolencje nie zostaly zlozone. Nikt jeszcze nic
    nie powiedzial.
