    POKOJU I JEST UCZESTNICZKA SCENY (scene.yaml#participants, seraphine-vale.yaml#current_zone_id)
    - to ona ustawila kolejnosc, w ktorej pomiar trzeciej pieczeci jest krokiem pierwszym
    (t_234). Spidey i webber_anchored ida z Lucanem, ukryci. Wejscie na gore to oczywisty
    ruch potrzebny do zadania pytania, nie osobna deklaracja. Pytanie jest adresowane
    DO VARKHENA (rozstrzygniete przez gracza poza gra).'
  actor_id: pc_lucan
  scope: execution
  stakes: '"Co potem" Varkhena jest w plikach polem pustym z jawnym zakazem dopisywania
    mu tesknoty za spoczynkiem, planu na wolnosc i zadania wobec Lucana (varkhen.yaml#fact_varkhen_stated_what_he_wants).
    Pytanie padlo raz, w t_230, zadane przez Seraphine, i odpowiedz brzmiala "nie
    wiem". Teraz zadaje je Lucan.'
