  - campaigns/lucan/locations/lumaria-guild/location.yaml#zones
  prose: 'Na gorze pusto jak zawsze po zmroku - jedno swiatlo, to u Seraphine, i drzwi

    uchylone, bo w tym pokoju stoi rzecz, ktorej ona nie zostawia za zamknietymi.

    Varkhen stal w rogu dokladnie tak, jak go zostawiono cztery godziny wczesniej:

    twarza do drzwi, plaszcz na zbroi, nic w rekach. Miedzy pytaniem a odpowiedzia

    bylo dlugie nic i nie bylo w nim wahania.


    - Po tym wszystkim - powtorzyl. - Nie wiem.


    Potem powiedzial jeszcze trzy zdania, czyli u niego mowe koncowa.


    - Postawiono mnie przy bramie. Dano mi slowo. W slowie nie bylo konca.


    Patrzyl przy tym na drzwi. Seraphine odlozyla pioro, zanim sie odezwala,

    i nie podniosla glosu.


    - Pytalam go o to samo - powiedziala. - Dostalam krocej.

    '
  summary: 'Bez testu - interludium, roll_policy disabled. Trzy minuty, zero energii.
    Lucan

    wszedl na gore (zone_guild_main_hall -> zone_guild_upper_offices, ruch oczywisty
    dla

    zadeklarowanego pytania, system/narrator.md#decyzje-gracza); Spidey i webber_anchored

    z nim, ukryci.


    1. PYTANIE PADLO DO VARKHENA - adresat rozstrzygniety przez gracza poza gra, nie

    zgadniety. Odpowiedz WYPELNIA pole, ktore karta trzymala puste od t_230

    (fact_varkhen_stated_what_he_wants: "na pytanie, co potem, odpowiedzial, ze nie
    wie").

    Nowy fakt: fact_varkhen_has_no_after_because_the_oath_had_no_end. Tresc pochodzi

    wylacznie z tego, co juz jest w karcie - przysiega niedokonczona, brama, slowo
    -

    i NIE dopisuje mu tesknoty za spoczynkiem, planu na wolnosc ani zadania wobec
    Lucana,

    bo to sa trzy rzeczy, ktorych karta zabrania wprost. "Co potem" pozostaje puste
    jako

    PLAN; nieustalone zostaje, czy Varkhen w ogole uwaza, ze cos po tym jest.


    2. SERAPHINE JEST W POKOJU I ZOSTALA POKAZANA - poprawka gracza przyjeta, zrodlo:

    scene.yaml#participants oraz seraphine-vale.yaml#current_zone_id. Jedna kwestia
    wprost,

    odpowiada na jedna rzecz (voice_contract#answer_length), gest z kontraktu (odklada

    pioro). Fakt, ktory wypowiada, jest jej wlasnym zdarzeniem: to ona zadala to pytanie

    w t_230. Nie dolozyla ani kolejnosci z t_234, ani terminu, ani zadnego swojego
    watku -

    retcon_000142.


    3. Wyjscie pod trzecia pieczec NADAL NIEWYKONANE i nadal jest to pytanie,

    ktore stoi; new_decision puste celowo. Zegary nietkniete, zaden nie ma tu triggera.

    '
