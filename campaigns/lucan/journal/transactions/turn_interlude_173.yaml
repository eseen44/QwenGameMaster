  summary: 'Bez testu - rozmowa na dziedzincu, piec minut, zero energii. Zagrywka
    gracza laduje w calosci

    (retcon_000033). Lucan nie targuje sie o dostep i zamiast tego zmienia ramke odczytu.


    1. "MIAL PEWNE SUKCESY" NIE JEST NOWYM FAKTEM - JEST ODCZYTANIEM ISTNIEJACEGO
    ZAPISU. t_085 p.4

    i inventory#marginalia mowia: "wiekszosc konczy sie nie". Wiekszosc, nie wszystkie.
    Mniejszosc

    wpisow nie konczy sie odmowa, wiec udane przywrocenia SA w tym tomie od poczatku
    i nikt ich

    dotad nie nazwal. Deklaracja gracza je nazywa, nie dopisuje.


    2. I TO PODNOSI WARTOSC TOMU DOKLADNIE TAM, GDZIE INVENTORY JA JUZ ULOKOWALO.

    inventory#defence_value stoi na tym, ze Akademia trzyma na wlasnej polce licencjonowany
    traktat

    o przywracaniu ruchu ciala, ktore stanelo - czyli sama opisuje granice zywe/martwe
    jako CIAGLOSC

    Z PROCEDURA. Marginalia z udanymi probami BEZ MAGII sa najmocniejsza mozliwa forma
    tego samego

    argumentu: nie teoria z polki, tylko czysta anatomia z wynikiem. Material, ktory
    Lucan nazwal

    wczoraj obciazeniem, jest jednoczesnie fundamentem jego obrony klasyfikacyjnej.


    3. NOWY KANON - DEKLARACJA GRACZA. Balwierz byl CZARNORYNKOWY i probowal ozywiac
    swiezych

    topielcow BEZ POMOCY MAGII, czysta anatomia. Spojne z provenance (kradziez podrecznika
    o

    przywracaniu ruchu i oddechu ma teraz motyw jawny) i z t_083 (latal ludzi po cichu,
    bez

    zglaszania ran). Lucan dodaje wlasna ocene: swiat takich ludzi potrzebuje.


    4. RAMKA, KTORA LUCAN PODAJE NERIS, JEST CALA STAWKA TEJ SPRAWY W JEDNYM ZDANIU.
    Ten sam

    czlowiek jest dla Lucana POTRZEBNYM RZEMIESLNIKIEM, a dla Kolma POTENCJALNYM LISZEM.
    Roznica

    nie siedzi w notatkach - siedzi w tym, kto je pierwszy oprawi w zdanie. To jest
    dokladnie

    doktryna, ktora oboje zbudowali w t_167 i t_168 (wezsze kompletne zdanie zamiast
    przemilczenia),

    tylko zastosowana do cudzego materialu zamiast do wlasnego tekstu.


    5. CO NERIS TERAZ WIE. Ze poprzedni wlasciciel byl czarnorynkowym balwierzem;
    ze probowal

    przywracac topielcow bez magii, sama anatomia; ze mial sukcesy; ze Lucan uwaza
    go za potrzebnego

    rzemieslnika, a Kolma uwaza za czlowieka, ktory zrobi z niego lisza; ze marginalia
    dostanie bez

    targu. NADAL NIE WIE, ze balwierz nie zyje, ze tom byl kradziony ani skad Lucan
    ma jego rzeczy -

    trzeci raz z rzedu nie zapytala. Nie dopisywac.


    6. WORLD MOVE A - JEJ WLASNA WADA DZIALA PRZECIW JEJ WYGODZIE I ZA JEJ TEKSTEM

    (portrayal.the_flaw). Przyznaje na glos rzecz niewygodna: ze material, ktory mial
    byc jej

    problemem, jest w istocie WYNIKIEM, a wynik jest cytowalny. Robi to zanim policzy,
    ile ja to

    kosztuje - a kosztuje sporo, bo cytowanie czarnorynkowego balwierza pod wlasnym
    nazwiskiem jest

    czyms innym niz cytowanie traktatu.


    7. WORLD MOVE B - DRUGIE PYTANIE O NIA SAMA W CIAGU JEDNEGO WIECZORU I ONA NADAL
    NIE MA NA TO

    PROTOKOLU (portrayal.the_social_gap, portrayal.the_body). "Trzymasz sie?" z t_169
    dalo sie

    zbyc szczeroscia. "Jesz cos czy idziesz spac?" jest alternatywa rozlaczna i wymaga
    odpowiedzi,

    ktorej ona nie umie udzielic, bo prawdziwa odpowiedz brzmi ani jedno, ani drugie.
    Nie robic

    z tego sceny wzruszenia - to ma byc odpowiedz, ktora zdradza rozklad dnia, nie
    wyznanie.


    8. STAN. Wieczor dnia trzeciego, dziedziniec Akademii, 19:37. Energia bez zmian,
    integralnosc

    19 z 19, bez warunkow. Brama trzydziesci krokow dalej. Tom nadal w baszcie; termin
    przyniesienia

    go NIE zostal ustalony - "nie dzis" to jedyne, co padlo.

    '
  new_decision: Neris przyjmuje ramke i sama odwraca material z obciazenia w zrodlo,
    ale na pytanie o jedzenie i sen odpowiada tak, ze odpowiedzia to nie jest. Brama
    jest trzydziesci krokow dalej. Lucan decyduje, czy wieczor konczy sie tutaj, czy
    robi cos z tym, ze ona nie jadla, czy przypina konkret do rzeczy nieustalonych
    - kiedy przynosi tom i czy balwierz ma w ogole wejsc do jej tekstu pod jakims
    nazwaniem.
