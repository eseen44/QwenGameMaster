  summary: 'Bez testu - interludium, roll_policy disabled, cel bez arkusza. Trzy minuty,
    zero energii.

    KONFABULACJA ODPALILA. Pierwsza w tej kampanii i jest oznaczona.


    1. PIERWSZA CZESC ODPOWIEDZI JEST PRAWDZIWA I NIC NIE KOSZTOWALA.

    Marn parska i mowi, ze nic nie wystawia. Podnosi drag. Papier przychodzi DO bramy,
    nie

    Z bramy - nikt przy zaporze niczego nie pisze. To jest prawda, on to wie z wlasnych
    rak

    i mowi to bez wahania.

    CZWARTE NIEZALEZNE POTWIERDZENIE TEGO SAMEGO (t_034 i t_036 Seraphine, t_206 i
    t_209 Dast,

    t_218 Marn od strony draga, teraz Marn wprost): dokument stalej trasy powstaje
    POWYZEJ

    poziomu, na ktorym jest okazywany. Seraphine nazwala to w t_036 - typ autoryzacji
    stoi

    ponad szeregowym konstablem. Zaden nowy fakt nie zostal dopisany do swiata.


    2. I TU KOMPLIMENT ROBI SWOJE. "Wyglada pan na waznego" pada na czlowieka, ktory
    piec minut

    temu siedzial na ziemi we wlasnym moczu i zostal z niej podniesiony przez obcego,
    i ktory

    nie ma w tej chwili ANI JEDNEGO hamulca (druga warstwa curse_loosened_tongue,
    t_218).

    Trzezwy i zahamowany powiedzialby "nie, panie, ja jestem nikt" i na tym koniec.
    Ten nie

    moze - potrzeba odzyskania twarzy spotyka sie z brakiem filtra.


    3. KONFABULACJA - OZNACZONA JAWNIE, ZGODNIE Z OBIETNICA Z t_216 i t_218.

    Marn zaczyna sugerowac, ze coś by sie dalo. Ze on tam dwadziescia lat stoi. Ze
    widzi,

    kto z czym przychodzi. Ze gdyby ktos naprawde chcial taki papier, to on by wiedzial,

    do kogo sie odezwac, i ze "da sie zalatwic".

    ZA TYM NIE STOI NIC. To jest DOKLADNIE skutek uboczny zmierzony w t_127: rozwiazany
    jezyk

    przy braku odpowiedzi nie mowi "nie wiem", tylko produkuje cos, co brzmi jak odpowiedz.

    Marn NIE ZNA nikogo, kto wystawia glejty. Nie ma zadnego kontaktu, zadnego kanalu
    i zadnej

    drogi. Punkt w what_is_not_known jego karty - kto podpisuje - POZOSTAJE NIEROZSTRZYGNIETY,

    bo padla odpowiedz, ale byla pusta.

    NARRATOR NIE PODAL ZADNEGO NAZWISKA I NIE PODA. Konfabulacja jest przechwalka
    o dostepie,

    a nie zmyslonym dossier - gdyby Marn wyprodukowal nazwisko, powstalby byt, ktorego
    nie ma

    w zadnym pliku, i to bylaby awaria retcon_000058 podana graczowi jako trop.

    NIE JEST TO KLAMSTWO W ROZUMIENIU POSTACI. On w to w tej chwili wierzy.


    4. DLACZEGO NARRATOR TO ODPALIL WLASNIE TU, A NIE WCZESNIEJ. Trigger z t_127 brzmi

    "przy braku odpowiedzi". W t_217 pytanie o swieto mialo odpowiedz prawdziwa i
    prosta

    (nie ma swieta) - nie odpalilo. W t_218 Marn mowil wylacznie o czynnosciach, ktore

    wykonuje wlasnymi rekami - nie odpalilo. TU pytanie po raz pierwszy siegnelo POZA
    jego

    wiedze, a jednoczesnie zostalo podane z komplementem, ktory dal mu powod, zeby
    nie

    przyznac sie do niewiedzy. Mechanika i psychologia trafily w ten sam punkt.


    5. CO GRACZ Z TEGO MA, MIMO ZE ODPOWIEDZ JEST PUSTA - I TO NIE JEST POCIECHA.

    (a) Potwierdzenie od czwartej strony, ze papier schodzi z gory. (b) POMIAR SAMEJ

    PROCEDURY: Lucan wlasnie zobaczyl na wlasne oczy, jak rozwiazany jezyk produkuje
    material

    nieprawdziwy, i zobaczyl to w sytuacji, w ktorej ma jak to sprawdzic - bo wie,
    ze Marn

    jest szeregowy. Kazda kolejna informacja z tego zrodla musi byc czytana przez
    ten filtr.

    To jest wiedza o NARZEDZIU, kupiona tanio i na nieszkodliwym przykladzie.

    (c) Oferta lezy na stole i jest fałszywa, ale Marn sie z niej teraz nie wycofa
    bez wstydu.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie podal nazwiska, urzedu, szczebla ani drogi.
    Nie

    ustanowil, ze Marn ma jakiegokolwiek kontakta. Nie zamienil przechwalki w prawdziwy
    trop

    ani w pulapke - nikt nie sledzi tej rozmowy i nikt sie o niej nie dowie. Nie stworzyl

    zegara ani terminu. Nie ustanowil, ze Marn zrozumial, po co Lucan pyta. Nikt z
    izby

    nie wyszedl. Zegary bez ruchu poza uplywem czasu.


    7. STAN. Czwarty dzien interludium, podworzec Pod Obrecza. Obecni: Lucan (imie
    nadal

    niepodane), npc_ossek_marn - o sciane, dwa stacki numb, rozwiazany jezyk w drugiej

    warstwie, wlasnie zlozyl obietnice bez pokrycia. Tkacz przy Lucanie, Spidey na
    belce.

    Integralnosc 19/19, energia bez wydatku w tej turze - czytac z pliku.

    Godzine czytac ze state/time.yaml po commicie.

    '
