outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'VARKHEN NIE ROZPOZNAJE PRZEDMIOTU I MOWI TO WPROST, tak samo jak przy
    naczyniu z polnocnego fundamentu (fact_varkhen_does_not_know_the_foundation_object):
    nie zna, nie nazywa po swojemu, nie zgaduje. Kontrakt glosu daje mu jednak jawna
    furtke - blind_spot pozwala PORÓWNAC rzecz do wlasnego doswiadczenia, z zastrzezeniem,
    ze porownanie zostaje przypuszczeniem. Korzysta z niej raz i oszczednie. CO DAJE
    Z WLASNEJ WARTY, A NIE ZE ZGADYWANIA - i to jest cala wartosc tej rozmowy: (a)
    TA HALA TO JEGO DROGA. Zgadza sie z t_296 ("schodami w dol, potem jeszcze nizej,
    i tam jest brama"). Chodzil tamtedy do dolnej bramy i wytarty pas na podlodze
    jest tym, czym jest. (b) NISZE BYLY TAM, ZANIM JEGO POSTAWIONO, i byly zamkniete.
    Nigdy zadnej nie otworzyl - jego rozkaz brzmial brama, nie groby. To PRZESUWA
    WARSTWE: ludzie ze srebrnymi narzedziami sa starsi niz czterystuletni straznik.
    (c) ZAPYTANY O KONIEC HALI mowi BRAMA - i natychmiast dokłada wlasne zastrzezenie,
    ktore dokłada zawsze: tak bylo, kiedy go stamtad wynoszono, za dzisiaj nie reczy.
    Identyfikacji pionowej rzeczy Spideya z brama NIE robi narrator - robi ja Varkhen,
    ze swojego posterunku i ze swoja granica. ROBOTA JEST ROBOTA I NIC SIE W NIEJ
    NIE DZIEJE. Trzy cykle po cztery nisze, dwanascie plyt. Zaden plik nie stawia
    w tej hali mechanizmu, straznika ani obserwatora, a Tkacz stoi na rampie z pelnym
    czuciem obszaru i milczy przez cala noc - milczenie posterunku JEST informacja,
    nie przeoczeniem narratora (retcon_000015, retcon_000033, retcon_000055). ARYTMETYKA
    PODANA JAWNIE, ZEBY DALA SIE ZAKWESTIONOWAC: technika jest znana po pierwszej
    plycie, a przeszukiwania cial ekipa NIE POWTARZA (wniosek z t_306), wiec nisza
    schodzi do okolo 420 s - 240 na plyte, 180 na pakowanie. Cztery to 1680 s. Kurs
    na gore i z powrotem przez komore Varkhena, zawal i rampe to okolo 1500 s. Cykl
    3180 s, trzy cykle 9540 s, czyli DWIE GODZINY CZTERDZIESCI. 23:50 -> 02:30, DZIEN
    SZOSTY. LUP WEDLE GRADIENTU, NIE WEDLE APETYTU - i NIE dwanascie kopii pierwszej
    niszy. Kazda ma cialo ulozone prosto i rzeczy OBOK, ale zawartosc sie rozni: kilka
    rzedow krotszych, dwie nisze po jednej sztuce, jedna prawie pusta. SKRZYNKA TRAFIA
    SIE TRZY RAZY NA DWANASCIE. Razem okolo 22 kg, prawie wszystko srebro. Kotwica
    skali: cala komora wyzej, jedenascie grobow, dala 9-10 kg metalu (t_298) - ta
    warstwa jest realnie bogatsza, i to jest wynik pracy gracza, nie prezent. CZEGO
    NARRATOR NIE ZROBIL: nie dopisal wczesniejszych zlodziei, nie otworzyl zadnej
    skrzynki, nie postawil zegara na godzine i nie zamienil nocnej pory w zagrozenie.
    Nikt ich nie zaczepil, bo nie ma kogo. KOSZT: zero energii. Pytanie przez linie
    standby jest adresem bez przeplywu (retcon_000179), a kopanie nie jest magia.'
  prose: 'Lucan sięga po linię, zanim jeszcze odłożą pierwszy worek.


    To jest kanał czuwania, adres bez przepływu, i Varkhen jest po drugiej stronie
    tak, jak bywa

    zawsze — natychmiast i bez zdziwienia, jakby leżał w sarkofagu wyłącznie po to,
    żeby ktoś

    kiedyś zapytał.


    Lucan opisuje mu pręt. Długość, spłaszczony i wygięty koniec, rowek po owinięciu
    na trzonku,

    osiem sztuk od największej do najmniejszej, srebro pod nalotem.


    Cisza po drugiej stronie trwa dłużej, niż trwa namysł nad prostą rzeczą.


    — Nie wiem, co to jest — mówi w końcu Varkhen.


    I nie próbuje tego nazwać po swojemu, dokładnie tak jak wtedy, przy zimnej rzeczy

    z fundamentu. Ale po chwili dodaje, i to już jest z jego własnej warty:


    — Nosiłem miecz. Widziałem, jak ludzie noszą narzędzia. Twoje brzmi jak narzędzie.
    To jest

    moje zdanie, nie wiedza.


    Potem słucha opisu hali — nisze po obu stronach, wytarty pas na podłodze, coś
    pionowego na

    końcu — i mówi rzecz, na którą Lucan nie był gotowy.


    — To moja droga.


    Chodził tamtędy. Do dolnej bramy, i z powrotem, i znowu, przez czas, którego nie
    umie podać

    w latach, bo nie liczył. Wytarty pas na środku podłogi jest tym, czym jest.


    — A nisze?


    — Były. — Cisza. — Przede mną. Zamknięte, wszystkie. Nie otwierałem żadnej. Postawiono
    mnie

    przy bramie, a nie przy grobach.


    Lucan siedzi z tym przez chwilę.


    Ludzie, którzy leżą w tych ścianach ze srebrem ułożonym obok, byli starzy już
    wtedy, kiedy

    stawiano tu strażnika, który stał czterysta lat. A strażnik przechodził obok nich
    i ani razu

    nie sprawdził, co w nich jest, bo miał rozkaz o czym innym.


    — To, co jest na końcu — mówi Lucan. — Pionowe, przez całą szerokość, i nie dzwoni.


    — Brama — mówi Varkhen. I zaraz potem, bo tak robi zawsze: — Tak było, kiedy mnie
    stamtąd

    wynoszono. Za dzisiaj nie ręczę.


    Lucan puszcza linię.


    A potem jest robota i robota nie ma w sobie nic.


    Płyta wychodzi w cztery minuty, kiedy się już wie, gdzie wsunąć płaskownik i w
    którym miejscu

    kamień zaczyna iść sam. Ciał nikt nie przeszukuje — sprawdzili to raz i wiedzą,
    jak jest.

    Rząd do worka, przełożony szmatą, płyta z powrotem oparta o ścianę. Następna.


    Czwarta, worek, czterdzieści stopni, komora, zawał, rampa. Tkacz siedzi przy rampie
    i przez

    całą noc milczy, a odezwałaby się, gdyby miała o czym.


    W dół, cztery następne, worek, na górę.


    I trzeci raz.


    O wpół do trzeciej Boros siada na płycie i przestaje udawać, że mu się chce. Mara
    liczy worki

    przy wozie, dwa razy, tak jak liczy się rzeczy, których ktoś wolałby nie liczyć
    trzeci raz.


    Dwanaście płyt. Dwanaście ciał ułożonych prosto, dwanaście razy to samo: rzeczy
    obok, nie na

    nich. Ale bogactwo różne — kilka rzędów krótszych, dwie nisze po jednej sztuce,
    w jednej

    leżało prawie nic. Skrzynka trafiła się trzy razy.


    Razem, wedle ręki Borosa: jakieś dwadzieścia dwa kilogramy, i prawie wszystko
    to srebro.


    Cała komora nad nimi, jedenaście grobów, dała dziewięć kilo metalu.


    — I to jest pierwszy rząd nisz przy schodach — mówi Mara. Do nikogo.

    '
