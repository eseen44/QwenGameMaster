  new_decision: 'Rampa polnocna przy wozie, 02:30, DZIEN SZOSTY. Rezerwa 14,9/15 -
    pytanie przez linie standby i kopanie nic nie kosztuja. VARKHEN NIE ZNA PRETA
    i nie nazwal go po swojemu. Dodal jedno PORÓWNANIE z wlasnym zastrzezeniem, ze
    jest przypuszczeniem: nosil miecz, widzial ludzi noszacych narzedzia, i to brzmi
    jak narzedzie. TRZY RZECZY Z JEGO WLASNEJ WARTY, KTORE SA NOWE: (1) TA HALA TO
    JEGO DROGA do dolnej bramy - wytarty pas na podlodze jest tym, czym jest. (2)
    NISZE BYLY TAM PRZED NIM i byly zamkniete. Nigdy zadnej nie otworzyl; postawiono
    go przy bramie, nie przy grobach. LUDZIE ZE SREBREM SA STARSI NIZ CZTERYSTULETNI
    STRAZNIK. (3) PIONOWA RZECZ NA KONCU HALI TO BRAMA - z jego wlasnym zastrzezeniem:
    tak bylo, kiedy go stamtad wynoszono, za dzisiaj nie reczy. Przy bramie stoi TRZECIA
    PIECZEC (t_296). ROBOTA: DWANASCIE PLYT w trzech kursach po cztery. Technika znana,
    cial nikt nie przeszukuje (wniosek z t_306). Arytmetyka: 420 s na nisze, 1680
    s na czworke, 1500 s na kurs na gore i z powrotem, cykl 3180 s, trzy cykle 9540
    s = 2 h 40. LUP: OKOLO 22 KG, prawie w calosci SREBRO. Zawartosc sie roznila -
    kilka rzedow krotszych, dwie nisze po jednej sztuce, jedna prawie pusta. SKRZYNKA
    TRAFILA SIE TRZY RAZY NA DWANASCIE, a z ta pierwsza daje to CZTERY SKRZYNKI. WSZYSTKIE
    ZAMKNIETE - nikt zadnej nie otwieral. SKALA DLA PORÓWNANIA: cala komora wyzej,
    jedenascie grobow, dala 9-10 kg metalu (t_298). NIC SIE NIE STALO PRZEZ CALA NOC.
    Tkacz siedziala przy rampie z pelnym czuciem obszaru i nie odezwala sie ani razu;
    jej milczenie jest informacja. Nikt ich nie zaczepil. WORKI SA PRZY WOZIE, NA
    GORZE. Skrytka w piwnicy za garbarnia ma juz 55 kg z komory (t_299); te 22 kg
    jeszcze tam nie pojechaly. MARA POSTAWILA ZDANIE, NA KTORE NIKT NIE ODPOWIEDZIAL:
    to jest pierwszy rzad nisz przy schodach. OTWARTE: czy jada z lupem, czy schodza
    po nastepne cztery, czy ida wzdluz wytartego pasa do bramy i trzeciej pieczeci,
    czy otwieraja ktoras ze skrzynek, czy pokazuja pret Varkhenowi fizycznie - lezy
    w swojej komorze NA ICH TRASIE, ale udaje sen przed Borosem i Mara (t_287).'
