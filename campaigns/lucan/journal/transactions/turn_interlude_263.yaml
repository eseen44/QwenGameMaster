outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'ODPIECIE OD SIECI WYKONANE CO DO JEDNOSTKI. Cztery lacza sieciarzy (home,
    tannery, dump, webber_anchored) wygaszone; zalozone link_lucan_single_line_to_varkhen:
    1,0 na wejsciu, 0,8 na wyjsciu, 0,8 integralnosci, efficiency 80 - czyli DOKLADNIE
    ta sama racja, ktora skladaly cztery lacza. retcon_000113 spelniony bez cichego
    podniesienia strugi. Koszt przeniesiony na Lucana: 1,0 na dobe z jego rezerwy,
    netto +18,0 -> +17,0; sieciarze oddaja swoje stawki z powrotem w siec. Odleglosc
    nie jest przeszkoda (sieciarze karmili go z drugiego konca miasta; retcon_000167).
    CONDITIONS: distributed_webber_upkeep zdjete, single_line_upkeep_from_lucan dodane.
    Flaga distributed_network_upkeep_active wymieniona na single_line_upkeep_from_lucan_active,
    dodana feigning_dormancy_in_sarcophagus - "udawaj, ze spisz" jest prosba, nie
    przysiega, i tak zostalo przez niego potraktowane. HIPOTEZA O LECZENIU PRZEZ TLO
    CMENTARZA ZAPISANA JAKO HIPOTEZA GRACZA, nie jako fakt: condition severely_depleted
    ma mechanics_ref condition_recovery_suppressed, wiec odbudowa jest tlumiona niezaleznie
    od zrodla, a czy tlo cmentarza to przebija - NIEZMIERZONE. Narrator ani tego nie
    przyznal, ani nie odebral; zadnej stawki do growth-banks nie wpisano. ZAPROSZENIE
    DO POWROTU: Varkhen przyjal je jako to, czym jest - otwarte, bez terminu. Narrator
    nie zapisal mu z tego ani zobowiazania, ani zawodu. RUCH: loc_varkhen_chamber
    -> loc_cemetery, zone_south_gate. Varkhen ZOSTAJE w komorze (zone_sarcophagus),
    wiec wypada z uczestnikow sceny. Wiadomosc gracza urywa sie w polowie zdania o
    Seraphinie - narrator NIE zgadl jego tresci i zatrzymal Lucana przy bramie. KUSTODIA
    gildii pozostaje formalna i nie zostala zamieniona w zegar.'
  prose: "- Zostań tu. W swoim.\n\nVarkhen przyjmuje to bez pytania dlaczego, a potem\
    \ zostaje mu jeszcze jedna rzecz\ndo przetrawienia, i widać, że ją przetrawia.\n\
    \n- Mam udawać, że śpię - powtarza. Nie jak zarzut. Jak coś, co trzeba obrócić\
    \ w rękach\n  i obejrzeć z drugiej strony. - Kiedy stałem na warcie, nie wolno\
    \ mi było spać.\n  Teraz mam udawać.\n\nIdzie do sarkofagu i kładzie się w nim\
    \ tak, jak się to robiło przez lata: najpierw\nusiadł na krawędzi, potem opuścił\
    \ się na plecy, potem poprawił ramiona. Nie wygląda\nto na kogoś, kto udaje. Wygląda\
    \ na kogoś, kto wraca.\n\nCztery nici gasną jedna po drugiej i to jest najdziwniejsza\
    \ część wieczoru, bo nie\nma przy tym nic do zobaczenia. Dom, garbarnia, wysypisko,\
    \ łąka - cztery cienkie\nstrużki, które szły do niego z drugiego końca miasta\
    \ od tygodni, przestają iść.\nZostaje jedna, gruba dokładnie tyle samo co tamte\
    \ cztery razem, i idzie wprost stąd.\n\n- Tyle samo dostaniesz - mówi Lucan. -\
    \ Tylko ode mnie.\n\n- Wiem - mówi Varkhen z wnętrza kamienia. - Czuję, skąd.\n\
    \nI na koniec, kiedy Lucan mówi to o powrocie do sieci i o tym, że to bez nacisku:\n\
    \n- Jak będę chciał, powiem.\n\nWyjście po linie jest gorsze niż zejście, ale\
    \ krótsze. Potem pole grobów w drugą\nstronę, mokra trawa, krzywe płyty, żadnego\
    \ światła poza tym, co daje niebo. Przy\npołudniowej bramie Lucan się zatrzymuje.\
    \ Za nią jest droga do miasta, a w mieście\ngildia i kobieta, która zaraz usłyszy\
    \ wersję tej nocy przyciętą do tego, co jej wolno\nwiedzieć.\n"
