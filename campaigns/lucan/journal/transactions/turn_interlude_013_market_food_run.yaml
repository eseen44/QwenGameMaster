  summary: 'Lucan schodzi z gildyjnych schodow i idzie na targ - kwadrans piechota,
    poznie

    popoludnie, wiec czesc straganow juz sie zwija. Kupuje jedzenie bez zadnych

    komplikacji: chleb, twardy ser, suszona kielbase, cebule i dzban taniego piwa,

    razem 2 srebra, i zjada polowe na miejscu stojac. Za rzedem zywnosci stoja klatki

    z drobnym zywym towarem (leady o czesciach dla Spideya i nowym stworzeniu do

    cwiczen wisza wlasnie tam), a przy rzedzie skrybow siedza pisarze pozwow pod

    tablica ogloszen.

    ZMIANA W SWIECIE - na wjazdach na targ stoi kontrola, ktorej wczesniej nie bylo:

    dwoch strazników i urzednik z tabliczka sprawdzaja kazdy woz i kazdy ciezszy

    ladunek wjezdzajacy i wyjezdzajacy. Na tablicy wisi swieze miejskie obwieszczenie:

    transport zwlok, szczatkow i "materialu niehigienicznego" wymaga teraz wpisu i

    zezwolenia, a przewoz bez wpisu podlega zatrzymaniu towaru. Straznicy sa

    znudzeni i nie szukaja Lucana - czlowieka z koszykiem jedzenia nikt nie zatrzymuje.

    Ale to uderza dokladnie w plan na jutro: 60 kg cmentarnego zlota to jest wlasnie

    "ciezszy ladunek", a kazda formalna trasa przez miasto zostawia teraz wpis w

    rejestrze. Dyskretny kupiec staje sie nie luksusem, a warunkiem koniecznym.

    Zaplecze straganow - waskie przejscia, gdzie taki kupiec sie znajduje - jest kilka

    krokow dalej i jeszcze jasno.

    '
  new_decision: 'Lucan jest najedzony, ma 35 srebra w kieszeni i moze godzine swiatla.
    Kontrola na

    wjazdach zmienila cene planu na jutro, ale nie zamknela go. Zaczyna wypytywac
    na

    zapleczu targu juz dzis, mimo ze mowil "jutro", zaglada do klatek albo do

    skrybow pod tablica - czy wraca do baszty i zostawia to na rano?

    '
