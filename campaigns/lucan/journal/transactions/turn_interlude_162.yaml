  summary: 'Bez testu - rozmowa, piec minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Najwiekszy pojedynczy przewrot informacyjny tego interludium,
    i

    przynosi go NPC, ktory nie ma pojecia, co robi.


    1. PRZEJECIE PRZYPISU I DZIEKANA - MITYGACJA REALNA, ALE NIEPELNA. Ojciec przyjmuje

    "przedstawie ci precyzyjny zapis do akceptacji" bez sporu, bo to deliverable z
    bramka

    zatwierdzenia, czyli dokladnie jego tryb (protokol uzgadniany PRZED, t_155). Znika

    powod, dla ktorego mial jutro dopytywac kogos z rady. NIE znika jednak jego

    agenda.next_action, ktora mowi, ze bedzie ustalal termin i MOWIL O TYM KOLEGOM
    -

    ryzyko spada z "zapyta jutro" do "moze wspomniec mimochodem". Zmniejszone, nie

    wyzerowane. Nie zerowac go po cichu.


    2. NOWY KANON SWIATA PODANY PRZEZ GRACZA - ROD NARZECZONEJ. Herb: czerwien i

    purpura, mniszek lekarski, z gry slow "zab lwa". Rodzina MILITARNA, kontrolujaca

    HANDEL BRONIA, powiazana z aktualnie panujacym monarcha regionu. Zgodne z

    player/background.yaml#background_arranged_marriage_rejected (zamozna, rudowlosa,

    przesladowala go przez polowe dziecinstwa) oraz z #background_main_family_line_

    opportunistic (glowna linia Veyr interesowala sie Lucanem dopiero, gdy dalo sie
    na

    nim zarobic - malzenstwo z domem handlujacym bronia przy tronie jest dokladnie
    takim

    zarobkiem). Imie NADAL nieustalone i nie wolno go wymyslac

    (background#unknown_not_to_invent_silently).


    3. TO JEST ODPOWIEDZ NA PYTANIE NERIS I ODPOWIEDZ JEST NAJGORSZA Z MOZLIWYCH -

    ALE NIE W TE STRONE, KTOREJ ONA SIE BALA. Pytala, czy rod narzeczonej jest jedna
    z

    grup, ktorym projekt ma ZAGROZIC sankcja. Nie jest. Jest grupa, ktorej projekt
    robi

    PREZENT. Mechanika jest wprost z t_160: sankcje maja byc dobrane tak, zeby lamanie

    tabu zagrazalo innym grupom interesow, wiec kazda z nich ma wlasny powod je

    egzekwowac. Tabu numer jeden brzmi "nigdy tlum". Kontrola tlumu nieumarlych to

    ARMIA, KTORA NIE POTRZEBUJE BRONI. Nie istnieje w tym miescie strona z wiekszym

    wlasnym interesem w twardym zakazie niz dom, ktory bronia handluje.


    4. I DLATEGO CENA JEST OSOBISTA, NIE PRAWNA. Projekt jest DOBRY - to sie nie zmienia.

    Zmienia sie to, jak zostanie odczytany. Bardzo glosna publikacja, pod ktora Lucan

    Veyr sie podpisze (t_160), pisze ustawe sluzaca domowi, ktorego oferte odrzucil
    i

    ktory za to podcial mu edukacje (background_family_retaliation_and_education_

    sabotaged). Nikt po tamtej stronie nie odczyta tego jako zbiegu okolicznosci.
    Zostanie

    to odczytane jako UWERTURA. Do rozstrzygniecia przez gracza, nie przez narratora,
    czy

    to problem, czy dzwignia.


    5. TRZECIA WARSTWA, KTORA WIDZI TYLKO LUCAN. Caly sens projektu z t_160 byl taki,
    zeby

    spor zostal w forach, bo poza forami oslona Seraphine nie dziala

    (act-03-defence#legalisation_horizon, #institutional_defence.conclusion). Dom

    powiazany z panujacym monarcha jest z definicji powyzej forow miejskich. Zaprojektowano

    wiec zdanie, ktorego najsilniejszym naturalnym egzekutorem jest strona, do ktorej

    zaden z plaszczy Lucana nie siega. NPC tego nie nazywaja.


    6. WORLD MOVE A - OJCIEC ODPOWIADA NA PYTANIE ZADANE NIE JEMU, Z OPOZNIENIEM I
    BEZ

    ZADNEJ SWIADOMOSCI CIEZARU. To jest jego karta w czystej postaci: gubi nazwy,
    ale

    pamieta OPISY i PAPIER, a herb jest opisem; gra slow jest ciekawostka jezykowa,
    czyli

    jego rejestrem. Nie zarejestrowal, ze pytanie padlo miedzy Lucanem a obca kobieta,
    ani

    ze cos wlasnie rozstrzygnal. Uruchomilo go WESTCHNIENIE syna - zarejestrowal dzwiek

    w pokoju, nie cierpienie.


    7. WORLD MOVE B - "TO MILA DZIEWCZYNA". Jedno zdanie, ktore robi wiecej niz cala

    reszta wieczoru. Kanon mowi, ze ta kobieta przesladowala Lucana przez polowe

    dziecinstwa (background_arranged_marriage_rejected) i ze jej wlasne stanowisko

    pozostaje CALKOWICIE NIEZNANE, bo do spotkania nigdy nie doszlo. Ojciec nie zaprzecza

    wiec kanonowi - ojciec DEMONSTRUJE go: portrayal.behavior mowi wprost, ze nigdy
    nie

    stanal w obronie Lucana, nie z kalkulacji, tylko dlatego, ze nie zauwazyl na czas.

    To nie jest nowa informacja o niej. To jest stara informacja o nim.


    8. WORLD MOVE C - NERIS CZYTA SPECYFIKACJE, NIE POLITYKE, I DLATEGO TRAFIA. Nie
    ma

    slownika politycznego (portrayal.voice.diction: zero slownika prawniczego i

    urzedowego) i nie udaje, ze ma. Ale umie czytac wymagania, i widzi, ze jedno z
    nich

    wlasnie przestalo sie zgadzac: sankcja miala grozic, a tej grupie nie grozi. Podaje

    to jako PYTANIE, nie jako wyrok, i wraca do tego, co jest jej: ze tego nie da
    sie

    obejsc przypisem.


    9. WORLD MOVE D - I CZYTA WESTCHNIENIE ZLE, PO SWOJEMU (portrayal.the_social_gap).

    Widzi czlowieka, ktory zlapal sie za skronie, i probuje zareagowac po ludzku o
    pol

    minuty za pozno i nie tam, gdzie trzeba. Nie jest to ani czulosc, ani chlod -
    jest to

    osoba, ktora cwiczyla mowe, nie rozmowe.


    10. CZEGO NADAL NIE PADLO. Imie narzeczonej i nazwa rodu - NIE WYMYSLAC. Trzecia

    substancja (lichen_speculans) niewymieniona w swiecie. Sygnatura podrecznika

    nieudzielona. Wpis do rejestru zaopatrzenia niezlozony. Ojciec nadal nie wie o

    nekromancji, sieci, Varkhenie, syndykacie ani o slowie wabik.


    11. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 18:40. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: Lucan przejmuje przypis i
    kontakt

    z dziekanem; rod narzeczonej to dom militarny kontrolujacy handel bronia, powiazany
    z

    panujacym monarcha, herb czerwien i purpura z mniszkiem lekarskim; klauzula "nigdy

    tlum" sluzy temu domowi wprost; ojciec uwaza narzeczona za mila dziewczyne.

    '
