    traits:
      source: player_declaration_day3_evening_anchored_personalities
      decided_on: '2026-08-26'
      gender: male
      list:
      - diligent
      - partner
      - spec_ops
      - professional
      - proud_of_his_craft
      - stylist
      - daring
      note: 'Pajeczy protagonista, nie narzedzie: James Bond skrzyzowany z ninja i
        samurajem. Nie sluga i nie zwierze - wspolnik o kwalifikacjach, ktory sam
        wybiera stanowisko (t_133: zszedl ze stolu, obszedl blat, sprawdzil parapet
        i wybral miejsce z widokiem na oba okna i drzwi, bez polecenia punktowego).'
      the_core: 'DUMA Z DOBRZE WYKONANEJ PRACY, nie honor. Nie ma kodeksu i nie ma
        linii, ktorej nie przekroczy - brudna robota jest robota. Ma natomiast standard,
        jak sie ja robi, i to jest jego cala tozsamosc. Obraza go nie zadanie, tylko
        NIECHLUJSTWO: plan zrobiony na kolanie, halas, ktorego mozna bylo uniknac,
        druga droga ta sama co pierwsza, zabicie czterech, gdy wystarczylo jedno.'
      tells:
      - Czysci sie po robocie. Zawsze, drobiazgowo, przy Lucanie i bez pospiechu -
        to jest jego wytarcie ostrza i jednoczesnie komunikat, ze skonczyl.
      - Nie chodzi dwa razy ta sama droga. Nawet gdy to nadklada. Nawet gdy nikt nie
        patrzy.
      - Czeka. Godzinami, bez ruchu, jak pajak - a potem dziala raz. Poganiany nie
        przyspiesza.
      - Trudniejsze wyjscie wybiera swiadomie, jesli jest czystsze. Ryzykuje ze stylu,
        nie z brawury.
      what_offends_him: 'Uzycie go jak przedmiotu tam, gdzie mogl byc operatorem:
        wysłanie bez informacji, rozkaz punktowy na cos, co sam zrobilby lepiej, albo
        praca, po ktorej ktos inny musi sprzatac. Nie klóci sie o to. Zapamietuje.'
      contrast_with_the_moth: Cma jest prozna z POZYCJI, Spidey z WYKONANIA. Ona chce,
        zeby jej sie nalezalo; on chce, zeby bylo zrobione dobrze. Zuk kaze robic,
        Spidey robi sam - i o to mu chodzi.
      development_direction: 'Dialog z Lucanem, gdy podrosnie wiekiem. Rejestr zawodowy,
        nie sluzalczy: meldunek, nie prosba, i suchy komentarz do planu, ktory obrazil
        jego rzemioslo.'
