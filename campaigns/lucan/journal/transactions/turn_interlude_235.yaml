  summary: 'Bez testu - interludium, roll_policy disabled. Siedem minut, zero energii.

    TRZY PYTANIA, TRZY ODPOWIEDZI Z JEJ WLASNEGO MATERIALU, I JEDNA RZECZ, KTORA

    ZATRZYMUJE WYJSCIE NA PROGU: plan mowil NOCA, a jest 18:01.


    0. NAPRAWA STANU PRZED TURA (ta sama pulapka co retcon_000134 i adnotacja

    participants_note w snapshocie poprzedniej sceny). scene close po t_234 otworzyl

    scene_act_03_interlude_day4_evening_departure_for_the_third_seal BEZ

    npc_seraphine_vale w participants, mimo ze pc-lucan.yaml#position trzyma go

    w zone_guild_upper_offices, w JEJ gabinecie. Gracz mowi do niej wprost

    ("bez twojego udzialu"), wiec ona jest w scenie - dopisana, nie wymyslona.

    Poprawione tez formation Spideya i Tkacza: pola pamietaly zone_guild_main_hall

    i "side lane" z tur sprzed sceny, a od t_233 oba sa przy Lucanie na gornym pietrze.


    1. MAGOWIE BOJOWI - CZEGO W PLIKACH NIE MA I CZEGO NARRATOR NIE DOPISUJE

    (retcon_000058: wskaz plik albo ekspozycji nie ma). ZADNA karta NPC ani plik frakcji

    nie stawia w gildii maga bojowego, instruktora ani szkoly. Istnieje EKIPA A-RANK

    wyslana zamknac podziemia garbarni (act-03-anticipated-shape#watek_garbarni_dwaj

    _wlasciciele, tannery-owner.yaml) - bez nazwisk, bez skladu, bez ani jednego

    rzemiosla przypisanego imiennie. Narrator nie produkuje obsady tej ekipy.

    ODWROTNEJ TEZY TEZ NIE STAWIA (retcon_000138, test czterech rejestrow): nie ma

    pliku, ktory mowi "gildia nie ma magow", nie ma tez nikogo, kto by tego zakazywal.

    Wiec nie pada ani "nie ma", ani "sa" - pada to, czym gildia JEST w plikach:

    organizacja, ktora NAJMUJE ekipy do zadan (faction#kind: licensed_adventurer

    _organization), a nie utrzymuje kadry do wypozyczania.


    2. CO ONA MA W TEJ SPRAWIE NAPRAWDE - I TO JEST JEJ WLASNA KARTA, NIE WYMYSL.

    role: guild_controller_antimage, guild_rank: A, appearance: lekki pancerz, rapier,

    KROTKA ROZDZKA, pieczecie ochronne. Do tego jeden twardy precedens, ktory Lucan

    sam wyprodukowal: fact_seraphine_watched_lucan_curse_a_guild_employee (t_038)
    -

    ZAREJESTROWALA samo rzucenie wzmocnionego znika z czterech krokow, bo brute-force

    daje silny slad. Ona jest w tym budynku czujnikiem. Do tego magic-practice#principles:

    w tym swiecie procedura przechodzi z czlowieka na czlowieka przez intuicje robocza

    i praktyke, wiec uczenie sie OD OSOBY jest normalnym mechanizmem, nie wyjatkiem.

    JEJ DECYZJA, NIE WYCENA (retcon_000135 a i b - poprzednie dwie tury tej postaci

    skonczyly sie decyzja, ta tez): magow bojowych nie obiecuje, bo nie ma czym.

    Oferuje to, co ma - pokazac, CO dokladnie zarejestrowala w t_038: nie zaklecie,

    a to, jak wyglada Lucan z drugiej strony pieczeci.

    JEDNA CENA, NAZWANA RAZ, przez nia i bez proszenia: antymagiczka pokazujaca

    nekromancie, co widzi, oddaje mu sposob ukrycia sie przed soba. Mowi to na glos

    i robi to mimo tego - portrayal.she_is_a_co_conspirator_not_a_lawful_paragon,

    klamstwo i zatajenie sa dla niej narzedziami, a ryzyko liczy sie w kosztach,

    nie w skrupulach. Drugiej ceny narrator NIE doklada.

    CZEGO NIE ROBI: nie podaje nazwiska nikogo z ekipy A-rank, nie umawia treningu

    za gracza, nie zapowiada, czego Lucan sie nauczy, i nie tworzy nowej zdolnosci.

    NIE ZASTEPUJE TEZ MARY - daily_training_with_mara stoi i jest o oddechu, upadaniu

    i wychodzeniu z linii (act-03-defence#physical_training_with_mara), a

    lucan-leads#lead_physical_technique_or_buff jest nadal open.


    3. RUSK - PRZYJETE BEZ POWTARZANIA CENY. Lucan odklada cene z t_234 punkt 7

    ("nie jest dla mnie problemem, ale nie odpowiadam za jego stan psychiczny"),

    a retcon_000135 punkt a zabrania narratorowi wyceniania tego drugi raz pod rzad
    -

    wiec ona tego NIE robi i nie wraca do sledztwa kompetencyjnego.

    ZAMIAST TEGO PODAJE FAKT, KTORY JEST JEJ WLASNY: pioro jest wygaszone. Zrobila
    to

    SAMA w t_123/125, przyjmujac cene swiadomie - Rusk odzyskal pioro i pisze dalej

    (fact_seraphine_knows_about_the_pen_on_rusk, resolution ZAMKNIETE).

    NARRATOR NIE ZADA OD LUCANA ANI WYGASZENIA, ANI SPOSOBU - to jest zamkniete

    i powtorzenie zadania byloby bledem (retcon_000121 wprost).


    4. SYNTEZA, KTORA JEST OBOWIAZKIEM NARRATORA (retcon_000135 punkt d) I ROBI JA
    ONA.

    Rusk piszacy dalej i urzednik rozsylajacy pisma o potwierdzenie dat maja JEDEN

    wspolny obiekt: obsade operacji w garbarni z nazwiskiem Lucana. To nie jest nowy

    fakt - to zestawienie dwoch, ktore leza w plikach osobno

    (malen-corth#fact_corth_has_the_tannery_roster, #fact_corth_sent_statement

    _requests_to_roster_names oraz act-03-defence#magistrate_records_channel).


    5. URZEDNIK - ODPOWIEDZ JEST NEGATYWEM I TO JEST CALA JEJ TRESC.

    Z siedmiu dzwigni wziela na siebie DWIE: pozycje 1 (pioro, wykonane) i pozycje
    5

    (urzednik magistratu kopiacy pod sprawa garbarni) - do SPRAWDZENIA

    (fact_seraphine_watch_meeting_today_day4). Sprawdzila w t_125, na glos, przy Lucanie,

    i NIE ZNALAZLA NICZEGO: ani jednego pisma, ani zawiadomienia, ani wezwania do

    potwierdzenia dat - mimo ze jest kontrolerka gildii, a garbarnia byla operacja
    gildii

    (fact_seraphine_is_not_on_corths_distribution_list). Kanal magistratu jest CALKOWICIE

    NIEZALEZNY OD NIEJ. Jej wlasny wniosek z t_126, ktory powtarza w jednym zdaniu:

    relacja z garbarni sklada sie BEZ GILDII, z ludzi gildii, imiennie, a ktokolwiek
    to

    czyta, ma wersje, w ktorej jej nie ma.

    NAZWISKA NIE PODAJE, BO GO NIE MA - odmowila przyjecia go w t_122 wraz z nazwiskiem

    prawnika i rejestrem zainteresowanych nekromancja (fact_seraphine_knows_lucans_seven

    _levers). To jej wlasna doktryna wiedzy, nie unik i nie luka narratora.


    6. CO SIE Z TYM URZEDNIKIEM DZIALO OD TAMTEJ PORY - NIEROZSTRZYGNIETE I NARRATOR

    TEGO NIE DOMYKA (retcon_000121: karta jest tak swieza, jak ostatni dopisek).

    malen-corth.yaml#lifecycle.last_confirmed_event_id: event_turn_interlude_102,
    czyli

    ponad sto trzydzieci tur temu. Ostatnia rzecz w plikach: w drodze do niego bylo

    zeznanie Mary z prawdziwymi datami i z Ruskiem wpisanym jako obecny (t_102).

    CZY DOTARLO, CZY COS DOPISAL, CZY WYSLAL COKOLWIEK DALEJ - zadnego zapisu nie
    ma

    i narrator zadnego nie tworzy. Nikt tam nie zajrzal od trzeciego dnia.

    Termin z act-03-defence#magistrate_records_channel liczy sie w DNIACH, nie tygodniach,

    a do progu przesluchania zostalo ok. 11,5 dnia.


    7. JEJ JEDNO PYTANIE, ZADANE RAZ (speech_traits: pyta raz i czeka, nie podklada

    odpowiedzi). Kontekst zmienila ONA, nie Lucan: w t_232 postanowila ogloszic kryzys

    nekromantyczny, a w t_228-232 wziela uklad ze Straza. Pyta wiec o rzecz, ktorej
    sama

    odmowila w t_122: czy chce teraz miec to nazwisko. To decyzja, nie targ - i decyzja

    gracza, nie jej.


    8. VARKHEN - WSTAJE I ODPOWIADA ZE SLOWNIKA PRZYSIEGI, BEZ INSCENIZACJI OPORU.

    Zapytany "idziemy", odpowiada czynem i jednym zdaniem o niedokonczonej przysiedze

    (agenda: restore_and_secure_three_seals, keep_the_lower_gate_closed;

    fact_varkhen_stated_what_he_wants). NARRATOR NIE DOPISUJE MU tesknoty za spoczynkiem,

    planu na potem, opinii o gildii ani zdania o papierach - "co potem" zostaje puste.

    Plaszcz ma na sobie od t_234.


    9. RZECZ, KTORA ZATRZYMUJE WYJSCIE NA PROGU - I JEST DEKLARACJA GRACZA, NIE OPOREM

    NARRATORA (retcon_000033: opor tylko z pliku albo z deklaracji gracza).

    fact_varkhen_transport_plan_night_street, plan Lucana z t_230, brzmi doslownie:
    NOCA,

    normalnie ulica, plaszcz narzucony na zbroje. Zegar po commicie stoi na 18:01:40

    dnia 19 sierpnia. Nie jest noc. Seraphine nazywa to jednym zdaniem, bo ekspozycja

    jest doslownie jej rejestrem - i na tym konczy, bez drugiej ceny.

    NARRATOR NIE TWORZY godziny policyjnej, nocnego straznika do przetestowania

    deklaracji z t_230, zegara pieczeci ani zadnego zdarzenia na ulicy

    (retcon_000055 i retcon_000033).


    10. CZEGO NARRATOR TU NIE ZROBIL. Nie obsadzil ekipy A-rank. Nie wymyslil maga

    bojowego, szkoly ani instruktora w gildii. Nie stworzyl nowej zdolnosci ani sciezki

    rozwoju. Nie zazadal od Lucana sposobu wygaszenia (zamkniete). Nie powtorzyl ceny

    Ruska z t_234. Nie podal nazwiska urzednika ustami Seraphine - ona go nie ma.

    Nie rozstrzygnal, co Corth zrobil od t_102. Nie wyprowadzil nikogo z budynku.

    Nie ruszyl zadnego zegara reka.


    11. STAN. Czwarty dzien interludium, 18:01:40, gabinet Seraphine, gorne pietro

    gildii. Obecni: Lucan (stoi, przy drzwiach), npc_seraphine_vale, npc_varkhen_mind

    (wstal, plaszcz na zbroi). Spidey i Tkacz przy Lucanie, zuk w kieszeni. Na biurku

    nadal sygnet z jeleniem; karta kontraktowa w szufladzie, ZAKRES i DATA puste.

    Lucan 19/19, energia bez wydatku - czytac z pliku. Nikt jeszcze nie wyszedl.

    '
  new_decision: 'Lucan stoi przy drzwiach gabinetu, Varkhen wstal. Do zmierzchu jest
    jeszcze kilka godzin, a wlasny plan Lucana brzmial: noca. Wychodzicie teraz, za
    dnia, i bierzecie na siebie to, ze dwumetrowy dragal w plaszczu przejdzie przez
    sale gildii i pol miasta przy swiadkach - czy Lucan czeka na ciemnosc, a jesli
    tak, to gdzie i czym te godziny zapelnia (pytanie Seraphine o nazwisko urzednika
    stoi otwarte, jej oferta pokazania odczytu z t_038 tez)?'
