            rezerwa nie stoi przy sufcie, nadwyzka idzie w nia. Po sufcie ten sam
            strumien schodzi drabina z growth-banks#distribution_priority - najpierw
            wlasny growth_bank Lucana, potem okazy ZAKOTWICZONE, na koncu pozostale.
            Varkhen zostaje poza rozdzialem, racjonowany osobno (retcon_000113). ZMIANA
            2026-09-11 (retcon_000167): 3,5 na dobe do zuka 01 JUZ NIE WYCHODZI -
            lacze link_lucan_hand_charges_beetle_01 wylaczone jako zbedne, bo nisza
            pod polnocnym fundamentem pokrywa caly sufit zuka. Netto przy pustej rezerwie:
            +18,0 na dobe.'
    conditions: []
    retired_conditions:
    - id: elevated_energy_signature_above_old_threshold
      retired_by: retcon_000019
      reason: Prog Lucana to 15, nie 12. Warunek naliczal podwyzszona detekowalnosc
        w calym normalnym zakresie pracy po incydencie cmentarnym, co przeczylo retconowi
