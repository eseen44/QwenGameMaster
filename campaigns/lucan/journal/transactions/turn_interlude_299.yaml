    od pasma i odleglosci, "slabo i tylko z bliska"). To, co Toby slyszal na zapleczu
    syndykatu, czeka, az Lucan stanie przy nim. JEDYNY PELNY MELDUNK: Tkacz, bo zostala
    przy rampie. Przez caly dzien do zjazdu nie podszedl nikt poza grabarzem w poludnie.
    Nikt nie krazyl, nikt nie stanal, nikt nie wszedl za nimi. RACHUNEK, KTORY LUCAN
