  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero wydane.

    Przejscie ze stolu wagowego do pokoju na zapleczu. Zmiana strefy, nie lokacji.


    1. POKOJ TO TA SAMA LOKACJA, INNA STREFA - SPRAWDZONE, NIE ZALOZONE. Sceny

    scene_act_03_interlude_day3_afternoon_syndicate_room nie ma w locations/index.yaml
    i nie

    ma dla niej wlasnego pliku; transakcja turn_interlude_104 wskazuje zone_market_back_alleys

    wewnatrz loc_lumaria_market. Pokoj syndykatu jest wiec za straganami, w tej samej
    strefie,

    ktora location.yaml opisuje jako "zaplecze i waskie przejscia za straganami; nieformalny

    obieg towaru i informacji". system/locations-and-maps.md nie jest tu potrzebny:
    Lucan byl

    tam trzy dni temu (t_104-113), wiec to nie jest pierwsze wejscie i mapa gracza
    sie nie

    zmienia. Sceny NIE zamykam - to trzecia tura tej rozmowy, nie osma.


    2. PRYNCYPAL ZGADZA SIE, BO SAM WLASNIE POWIEDZIAL, ZE TRZECIA SPRAWA NIE JEST
    PYTANIEM

    DO STOLU (t_196). Gracz zaproponowal dokladnie to, na co swiat czekal, wiec propozycja

    laduje bez oporu i bez targu. Zadnej ceny za wejscie nie ma, zadnego poreczenia
    nie

    potrzeba - w t_104 poreczenie bylo potrzebne, bo Lucan byl obcym z szescdziesiecioma

    kilogramami towaru; dzis jest czlowiekiem, ktoremu ten dom jest winien czterdziesci

    tysiecy srebra w dwoch ratach.

    DWAJ LUDZIE ZA PROGIEM SA - to fixtures/syndicate-doormen.yaml i t_104 - ale NIE
    MAJA

    CZEGO WZIAC. Cala procedura z t_104 polegala na tym, ze towar zmienia rece, zanim
    padnie

    liczba. Lucan wchodzi z ksiazkami pod pacha i pudelkiem w kieszeni, wiec procedura
    nie ma

    na czym zadzialac i narrator jej nie odgrywa drugi raz dla samego rytmu.


    3. OPIS KAMIENIA ZOSTAL PODANY I JEST DOKLADNIE TYM, O CO PRYNCYPAL PROSIL. W
    t_196

    powiedzial: kupuje po opisie, nie po przeznaczeniu, niech mu pan opisze tak, zebym
    poznal,

    jak zobacze. Dostal opis, ktory da sie sprawdzic okiem pod swiatlo: NIE bizuteria
    grobowa,

    charakter SOCZEWKI MINERALNEJ a nie kamienia ozdobnego, gatunek nieistotny, ZNAKOMITA

    PRZEJRZYSTOSC, najlepiej bez skazy. To jest specyfikacja zamowienia i tak zostaje

    zapisana - actionable, bez zadnego "ale".


    4. JEDNA UWAGA HANDLOWA, KTORA NIE JEST PRZESZKODA I NIE JEST WYMYSLONA. Lucan
    powiedzial

    "nie musi byc drogim kamieniem" - i to jest prawda o GATUNKU. Pryncypal odpowiada
    prawda

    o DRUGIM parametrze: w kazdym handlu kamieniem to nie rodzaj kosztuje, tylko czystosc,

    bo czystosc jest jedyna rzecza, ktorej nie da sie poprawic. Mowi to raz, jako
    fachowiec

    przy wadze, nie jako targ - ceny nadal nie podaje (agenda#set_the_number_himself,
    a opisu

    jeszcze nie skonfrontowal z tym, co ma). I NIE JEST TO REALNE OGRANICZENIE: Lucan
    ma 150

    srebra przy sobie, 3800 pierwszej raty w schowku i 40 000 do odebrania od tego
    wlasnie

    czlowieka. Narrator nie robi z tego ani zegara, ani kosztu.


    5. "PROWENIENCJA PRZESZKADZA W FUNKCJI" - GDZIE TO WOLNO ZAPISAC, A GDZIE NIE

    (retcon_000120). Zdanie pada DO PRYNCYPALA, w scenie. Jest wiec kwestia dialogowa,
    nie

    deklaracja do systemu. NIE zapisuje go do player/abilities.yaml, nie zapisuje
    do

    worlds/solmara/lore/ i NIE ustanawiam swiatowego faktu "kontakt z grobem psuje

    magazynowanie energii" - tym bardziej, ze samo magazynowanie energii w mineralach
    nadal

    NIE JEST kanonem (t_192, niezmienione). Wolno i zostaje zapisane: (a) jako specyfikacja

    zamowienia, bo skutek praktyczny jest jednoznaczny - bizuteria grobowa odpada;
    (b) jako

    to, co pryncypal USLYSZAL, na jego karcie.

    CO ON Z TEGO ODCZYTUJE, A CZEGO MU NIE WOLNO ODCZYTAC: jego wlasna agenda brzmi

    judge_lucan_by_what_he_declines_not_by_what_he_offers, a Lucan wlasnie ODMOWIL
    odkupienia

    wlasnego towaru i podal powod, ktory zaklada, ze kamien ma jakas funkcje. To jest
    rzecz,

    ktora ten czlowiek rejestruje - i na tym koniec. forbidden_without_source ma na
    jego karcie

    lucan_necromancy; nie wolno mu z tego zdania wyprowadzic nekromancji ani zadnej
    ramy dla

    niej, i nie wyprowadza.


    6. KESZ IDZIE Z NIMI. Nikt go nie odsyla i nikt go nie zaprasza osobno - to pokoj
    jego

    stalego klienta i on tam bywa. Jego wlasna otwarta kwestia z t_194 (czy pryncypal
    chce go

    widziec jako gwaranta proceduralnego naprzeciw Strazy i na przesluchaniu gildii)
    nadal nie

    zostala przez nikogo podniesiona.


    7. CZEGO NARRATOR TU NIE ROBI. Nie odgrywa drugi raz procedury odbierania towaru
    za

    progiem. Nie wymysla ceny wejscia, poreczyciela ani nowej osoby w pokoju - Ilvy
    Rennat

    do sceny nie dopisuje, bo zaden plik jej dzisiaj nigdzie nie stawia. Nie ustanawia

    mechaniki kamienia. Nie stawia terminu, nie tworzy zegara i nie zapowiada klopotu.

    Nie zamyka sceny i nie zmienia lokacji.


    8. STAN. Czwarty dzien interludium, 13:17, loc_lumaria_market, zone_market_back_alleys
    -

    pokoj syndykatu. Obecni: Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian
    poza

    regeneracja. Zegary bez ruchu poza uplywem czasu. Nic nie zaplacone, zadna cena
    nie padla,

    zaden termin nie powstal. Zamowienie na kamien ma teraz pelny opis i czeka na
    to, co

    pryncypal ma. Zamowienie na informacje o klatwach lezy w kanale. Trzecia sprawa
    -

    czlowiek o nieposzlakowanej opinii - jest tym, po co tu weszli, i jest nietknieta.

    '
