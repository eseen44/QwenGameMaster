  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'roll_turn_interlude_017_misnotice_past_porter - 77 naturalnie, 82 po modyfikatorach,

    prog 45, zdecydowane przejscie. Misnotice dziala dokladnie w swoim najlepszym

    scenariuszu - nieprzygotowany, zwyczajny cel, ciemno, nikt nie prowadzi aktywnych

    poszukiwan. Wzrok portiera zsuwa sie z Lucana i to polrozpoznanie, ktore juz w
    nim

    kielkowalo, gasnie; czlowiek, ktory za chwile ulozylby sobie te twarz, nie ulozy
    jej.

    Ksiega odwiedzin zostaje pusta. Nazwiska Veyr nie ma nigdzie w papierach Akademii
    z

    tego dnia. UWAGA na przyszlosc - limit ability_misnotice mowi

    repeated_pattern_can_be_recognized; ta sama sztuczka przy tej samej bramie bedzie

    z kazdym razem gorsza.

    Akademia w srodku jest pusta i cicha. Trasa trzyma sie pamieci - kilka drobiazgow

    sie zmienilo (nowe drzwi tam, gdzie byla wnęka, jeden korytarz przetynkowany),
    ale

    Lucan nie musi szukac drogi. Korki jego butow odbijaja sie echem po kamieniu i
    to

    jest jedyny dzwiek w calym budynku.

    W skrzydle laboratoryjnym pod jednymi drzwiami jest swiatlo. Lucan puka.

    POTWIERDZONE - otwiera ojciec. Wniosek z nawyku byl trafny: pracuje po nocy w
    tym

    samym laboratorium co dwa lata temu. Jest szczerze ucieszony, mowi cieple rzeczy,

    natychmiast gubi watek i zauwaza koszyk z jedwabnikami szybciej niz stan wlasnego

    syna. Nie wie nic o nekromancji, nie wie nic o bezdomnosci i najwyrazniej nie

    orientuje sie, ile czasu minelo. To nie jest wrogosc - to nieobecnosc.

    Kanal do Akademii jest otwarty i nie kosztowal ani jednego sladu na papierze.

    '
  new_decision: 'Ojciec trzyma koszyk jedwabnikow, mowi o czyms swoim i czeka - w
    swoim tempie - na

    cokolwiek, co Lucan powie. Drzwi sa otwarte, laboratorium puste, nikt na Akademii

    nie wie, ze Lucan tu jest. Co Lucan mowi ojcu? Prawdziwy problem badawczy

    (klasyfikacja Spideya jako konstruktu), wersje oczyszczona, sprawy rodzinne, czy

    najpierw pozwala mu wygadac sie o wlasnej pracy?

    '
