outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'DRUGA SESJA TRENINGU (pierwsza: event_turn_interlude_184). Godzina wzieta
    z fact_mara_knows_lucan_is_physically_weak_and_asked_for_training - "uzgodniona
    godzina dziennie rano od dnia czwartego" - i potwierdzona przez sama Mare w t_277.
    Miejsce: pokoj dyzurny na gorze i schody, bo tam ona po niego przychodzi (retcon_000038,
    fact_mara_believes_lucan_sleeps_in_the_upstairs_duty_room) i bo nie ma tam widzow.
    DO WIEDZY MARY WCHODZI jako KWESTIA LUCANA, nie fakt o swiecie (retcon_000120):
    nawykl do malej ilosci snu i dopala sie w sposob analogiczny do tego, co jej tlumaczyl
    w t_184, przyznajac, ze na dluzsza mete to pewnie niezdrowe. Czesc tego jest prawda
    (retcon_000112: dowoz z sieci pokrywa brak snu), czesc jest ta sama zmiekczona
    wersja co w t_184 - Mara nie ma czym tego rozroznic i nie probuje. KONSEKWENCJA,
    KTORA NIE JEST KARA: Mara przestaje pytac go o samopoczucie i przechodzi na to,
    co widzi, bo trener czyta zmeczenie, a Lucan przestal je pokazywac. Zadnego warunku,
    zegara ani obrazen z tego nie wynika - to zmiana METODY po jej stronie, oparta
    na jej kompetencji z karty (ranger, obserwatorka). Zadnego pliku nie stawia tu
    kosztu i narrator go nie dokłada (retcon_000015, retcon_000055). POSTEP: realny,
    maly i mierzony formą, nie liczba - forma sypie sie pod koniec godziny, czyli
    cialo w koncu podaje sygnal, ktorego dopalanie nie zaslania. progression.yaml
    dostaje brakujacy tor kondycji fizycznej, a krok daily_training_with_mara w objectives
    wychodzi ze stanu "mara_due_at_dawn_day4_arriving", ktory byl 94 tury do tylu.
    NIEUSTALONE: co Lucan robi z okienkiem do jedenastej i czy wyda wreszcie instrukcje.'
  prose: 'Idą na górę, bo tam jest miejsce i nie ma widzów.


    Mara nie zaczyna od ćwiczenia. Zaczyna od tego, że każe mu zacisnąć pięść, rozluźnić,

    zacisnąć jeszcze raz — i przez cały ten czas patrzy na jego przedramię.


    — Wczoraj przy tym samym drżałeś po sześciu — mówi. — Dziś nie drżysz wcale. —
    Puszcza

    jego rękę. — To nie jest komplement.


    Potem godzina wygląda tak, jak wygląda godzina z kimś, dla kogo ważniejsze jest,
    żeby

    człowiek doszedł, niż żeby uderzył. Schody: w górę, na dół, w górę, z workiem
    piasku,

    który leży pod ścianą dyżurki od zawsze i nikt już nie pamięta, po co. Wstawanie

    z podłogi — dwadzieścia razy, potem jeszcze dwadzieścia. Wisi na framudze, aż
    palce

    same się otworzą; za pierwszym razem trwa to zawstydzająco krótko. I oddech. Tego
    jest

    najwięcej i to jest najmniej efektowne.


    W połowie zaczyna się ta część, w której ona przestaje go pytać, jak się czuje.


    — Nie pytam już, bo twoja odpowiedź jest bezużyteczna — mówi całkiem spokojnie,
    bez

    urazy, poprawiając mu łokieć. — Trener czyta zmęczenie. Ty mi go nie pokazujesz,
    więc

    muszę patrzeć na inne rzeczy. — Stuka go dwa razy w bok, pod żebrem. — Tu przestałeś

    się prostować dziesięć powtórzeń temu. Mięsień nie pyta, czy jesteś zmęczony.
    Jego po

    prostu jeszcze tam nie ma.


    To jest cała lekcja i ona nie robi z niej przemowy. Wraca do liczenia.


    Pod koniec godziny ostatnie dziesięć wstawań wychodzi gorzej niż pierwsze dziesięć
    —

    i to jest, wbrew wszystkiemu, dobra wiadomość. Coś w tym ciele w końcu powiedziało

    prawdę.


    Mara podaje mu bukłak i siada na schodach, opierając łokcie o kolana.


    — Za tydzień codziennie takiego zauważysz przy chodzeniu — mówi. — Nie przy biciu.

    Przy chodzeniu. Pójdziesz cztery godziny i na końcu dalej będziesz myślał.


    Potem wstaje, otrzepuje spodnie i patrzy w dół, na salę.


    — Idę zjeść. O jedenastej pod bramą.

    '
