  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Ostrzezenie dziala i dziala lepiej niz cokolwiek, co Lucan
    mogl kupic. 1. STRACH BIJE PROZNOSC, ALE TYLKO DLATEGO, ZE POWOD JEST KONKRETNY.
    "Niebezpieczne" nic by Heskowi nie powiedzialo. "Moze byc powiazane z nekromancja"
    - powiedzialo. Straganiarz blednie, chowa brulion pod wage szybciej niz go wyciagal
    i sam z siebie obiecuje, ze nie piśnie ani slowa o gildii. Wczesniejszy koszt
    z tury 083 - ze bedzie sie chwalil udzialem w sledztwie - zostaje w duzej mierze
    odwrocony. To byla dobra zagrywka, nie tylko uprzejma. 2. CENA JEST INNA, NIZ
    BYLA, NIE ZNIKA. Slowo "nekromancja" jest teraz w USTACH HESKA, nie w domysle.
    Hesk nie bedzie o tym opowiadal na targu ze strachu - ale jesli kiedykolwiek ktos
    z urzedu, gildii albo Kosciola zapyta go WPROST, wysypie wszystko natychmiast
    i skwapliwie, razem z tym, ze czlowiek od gildii ostrzegl go o nekromancji. Nie
    z ulosci - z paniki i z checi bycia po dobrej stronie. To jest realny profil zwyklego
    czlowieka, nie kara za dobra gre. 3. UKLAD MOCNIEJSZY, NIE SLABSZY. Hesk teraz
    WIE, po co notuje, i chce, zeby Lucan wrocil. Prosi tylko, zeby przychodzil sam
    i nie w liberii. Nikt mu nie kazal tego mysli, sam na to wpadl i jest z siebie
    dumny. 4. SKRZYNIA IDZIE DO GILDII I OKAZUJE SIE PODWOJNIE UZYTECZNA. Mieszczanin
    niosacy przez miasto skrzynie ksiazek jest najnudniejszym mozliwym widokiem, wiec
    droga jest bez wydarzen. Wazniejsze: cela w piwnicy stala pusta i miala udawac
    pokoj badacza dopiero od jutra, gdy Boros zaplaci za lawe alchemiczna. Trzy czwarte
    skrzyni to makulatura - traktaty dewocyjne, almanachy, poradniki o humorach -
    czyli DOKLADNIE rekwizyt, ktorego ta przykrywka potrzebowala, i to za darmo. Przeszukanie
    celi znajdzie teraz pokoj czlowieka czytajacego nudne rzeczy. 5. STAN NA POLUDNIE.
    Lucan wraca do gildii, 24 srebra przy pasie, cztery nowe pozycje do nauki i przeczytania
    (Uprzejmosci, formuly prawne, dwie odbitki), atlasy anatomiczne, brulion balwierza
    i tom z bibliotecznej sygnatury - zaden nie tkniety. Skrzynia w celi, Spidey przy
    nim, spy_cellar_spider_06 dalej karmiony recznie.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.location_id
    value: loc_lumaria_guild_basement
