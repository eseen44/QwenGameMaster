    rozmawial z Lucanem o przysługach dla swojej CHOREJ MATKI - po tym, jak straz
    "rozwiaze problem jego zeznan". Zeznanie jest wiec DO PODWAZENIA. Zgodne z halvek#open_thread,
    ktore mowi, ze potwierdzil spotkania Orena z kims spoza zalogi i NIE PODAL WIECEJ.
