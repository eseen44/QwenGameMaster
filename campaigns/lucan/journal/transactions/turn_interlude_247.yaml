  prose: 'Nazwisko Kesz przyjal bez komentarza, a promocje zbyl jednym zdaniem, bo
    raz juz policzyl i drugi raz nie liczy. Reszte przyjmowal wolniej. Zeznanie nieprecyzyjne,
    zlozone przez czlowieka, ktory w tej samej chwili targowal sie o chora matke,
    jest do podwazenia i to jest dobra wiadomosc - jedyna dobra tego wieczoru. Zla
    przyszla zaraz po niej i Kesz zestawil ja sam, zanim Lucan zdazyl to zrobic za
    niego: rozpozna go w jednym pokoju, a on juz jeden taki pokoj obiecal. Przesluchanie
    kierownictwa gildii. W budynku gildii. Tym samym, w ktorym siedzi Halvek. Zgodzil
    sie na to w chwili, gdy nie wiedzial, ze pod rysopisem oddycha czlowiek, i powiedzial
    to na glos, bez pretensji, bo pretensji nie ma do kogo miec. A kozla ofiarnego
    skwitowal jednym zdaniem, ktore brzmialo gorzej niz wszystko inne: pokoj nie konkuruje
    z klientem w mundurze - sam mu to kiedys powiedziano - wiec jesli straz bedzie
    kogos potrzebowala, pokoj nie stanie miedzy nia a nim. Nie zerwal niczego i nie
    wycofal sie z niczego. Powiedzial tylko, ze do rana wie, czego chce, i ze od tej
    chwili nie jest juz w tej sprawie samym prawnikiem.'
  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii,
    zero srebra.

    ZAPLATA ODDANA W CALOSCI. Kesz dostal nazwisko, stan zeznania i model zagrozenia
    -

    i w trakcie tej samej minuty odkryl, ze sam sobie umowil pokoj z wlasnym swiadkiem.

    converging_target#consequence ZREALIZOWANE.


    1. PERSONALIA ODDANE. Swiadek: npc_halvek_wagonman, "Halvek". Gracz napisal "haven";

    narrator czyta to jako literowke, bo kanon zna wylacznie Halveka

    (milestone_041_corpse_wagon_takeover, t_048, halvek.yaml) i zadnego "Havena" w
    plikach

    nie ma. Gdyby gracz mial na mysli inna osobe albo zmiane imienia, jest to korekta
    kanonu

    do zadeklarowania - narrator jej nie zrobil za niego.


    2. "NA PROMOCJI" - SKWITOWANE, NIE PRZELICZONE PONOWNIE. Kesz odmowil w t_246
    rachunkiem

    i nie powtarza wyceny (retcon_000135: nie dwie tury wyceny pod rzad). Oferta zostaje

    otwarta ze strony Lucana; Kesz jej nie przyjal i nie zamknal.


    3. STAN ZEZNANIA - DEKLARACJA GRACZA, PRZYJETA, ZGODNA Z PLIKIEM. Halvek POWIEDZIAL

    npc_seraphine_vale, kogo widzial, ale NIEPRECYZYJNIE, bo w tej samej chwili targowal
    sie

    z Lucanem o przysługi dla CHOREJ MATKI - po tym, jak straz "rozwiaze problem jego

    zeznan". Zeznanie jest DO PODWAZENIA.

    NIE JEST TO SPRZECZNE Z NICZYM, tylko doprecyzowuje halvek#open_thread, ktore
    mowilo:

    "potwierdzil, ze Oren zmienial trasy po spotkaniach z kims SPOZA ZALOGI, i NIE
    PODAL

    WIECEJ" (t_048, urwane na "na razie nie podaje wiecej"). Chora matka i targ o
    przysługi

    to NOWY DETAL zadeklarowany przez gracza - retcon_000033, lada jak zadeklarowany.

    Narrator nie stawil temu oporu i nie wymyslil przeciwfaktu.

    CO ZOSTAJE NIEUSTALONE: co dokladnie Seraphine z tego zapisala i czy uznaje to
    za

    uzyteczne. Jej karty narrator NIE zmienil - to wymaga sceny albo jawnej deklaracji,

    a nie dopisku z drugiej reki.


    4. ROZPOZNANIE W JEDNYM POKOJU - I ZESTAWIENIE, KTORE JEST OBOWIAZKIEM NARRATORA.

    halvek#open_thread: "moze zamienic dopasowanie w rozpoznanie".

    rovan-kesz#oren_connection.confirmation_route: "Rozpoznanie przez niego zamienilo
    by

    dopasowanie w tozsamosc". A teraz drugi plik, ktory z tym koliduje i ktorego nikt
    dotad

    z tamtym nie zestawil: rovan-kesz#standing.scope_of_representation - Kesz zgodzil
    sie

    stac jako GWARANT PROCEDURY na PRZESLUCHANIU KIERONICTWA GILDII

    (fact_kesz_accepted_the_procedural_guarantor_role t_194,

    fact_kesz_became_lucans_lawyer_with_the_rooms_blessing t_199,

    fact_kesz_stands_inside_the_phase_two_trigger t_202). Halvek siedzi w

    loc_guild_holding_cells - W TYM SAMYM BUDYNKU.

    KESZ ZESTAWIL TO SAM, na glos, bez pretensji: zgodzil sie na ten pokoj w chwili,
    gdy nie

    wiedzial, ze pod rysopisem oddycha czlowiek. To jest retcon_000135 wykonane zgodnie

    z litera: "Zestawienie dwoch watkow o wspolnym obiekcie jest obowiazkiem narratora,
    nie

    gracza". Narrator nie czekal, az gracz to wskaze.

    CZEGO NARRATOR NIE ROZSTRZYGNAL: czy Halvek bedzie w tych celach w dniu przesluchania,

    czy ktokolwiek by ich ze soba zetknal i czy Kesz sie z przesluchania wycofa. Wszystkie

    trzy NIEUSTALONE.


    5. KOZIOL OFIARNY - PRZYJETY, Z ZIMNIEJSZYM WNIOSKIEM NIZ TEN, KTORY PODAL LUCAN.

    Teza Lucana ma pokrycie: lucan-leads#lead_city_watch_covers_cemetery_corpse_trade

    (declared_by player_as_world_canon) - straz miejska ma wlasny zysk w zamieszkach,
    bo

    ZAKRYWA afere z handlem zwlokami na cmentarzu. Instytucja zakrywajaca wlasny udzial

    potrzebuje kogos spoza siebie.

    DODATEK KESZA JEST JEGO WLASNA WIEDZA, NIE MADROSCIA Z URZEDU (retcon_000040):

    fact_kesz_priced_representation_before_guild_and_watch (t_193) - pokoj powiedzial
    w

    t_100, ze Z KLIENTEM W MUNDURZE SIE NIE KONKURUJE. Wniosek, ktory z tego wyciagnal

    o sobie: jesli straz bedzie potrzebowala kozla, pokoj NIE STANIE miedzy nia a
    nim.

    Ochrona, na ktora liczyl, ma wypisany warunek, ktorego on nie ustala.

    NIE JEST TO NOWY ZEGAR ANI SLEDZTWO (retcon_000055, retcon_000058): zadna lista,
    zaden

    swiadek i zaden termin nie powstaly. Jest to odczyt dwoch zdan, ktore juz leza
    w plikach.


    6. converging_target#consequence ZREALIZOWANE. Plik mowil: "Kesz przestaje byc

    uslugodawca i staje sie strona z wlasnym motywem. Zaden z nich nie dopowiedzial
    tego do

    konca na glos". PIERWSZA POLOWA WLASNIE ZASZLA - powiedzial, ze od tej chwili
    nie jest

    w tej sprawie samym prawnikiem. DRUGA POLOWA STOI: nadal nie padlo imie Orena,
    nie padlo

    "to ty jestes czlowiekiem z rysopisu", nie padlo zeznanie z t_048 jako zrodlo
    i nie

    padla rozbieznosc palec wskazujacy kontra lewy kciuk (retcon_000122 - narratorowi
    NIE

    WOLNO domknac tej identyfikacji za gracza). oren_connection.lucan_said_it_out_loud

    BEZ ZMIAN: said_obliquely_as_shared_interest_identity_still_unspoken.


    7. CZEGO KESZ NIE ZROBIL. Nie zerwal umowy, nie wycofal sie z przesluchania, nie
    zazadal

    pieniedzy, nie zagrozil i nie zaczal moralizowac (speech_traits). Nie oskarzyl
    Lucana

    o zastawienie na niego pulapki - bo w plikach jej nie ma: Lucan oddal mu te wiedze

    DOBROWOLNIE i to jest jedyny powod, dla ktorego Kesz ja ma.


    8. CZEGO NARRATOR NIE ZROBIL. Nie ruszyl Halveka: captured_alive, loc_guild_holding_cells,

    bez zmian. Nie zmienil karty npc_seraphine_vale. Nie ruszyl zegarow 3/15. Nie
    wypuscil

    niczego z forbidden_without_source [lucan_necromancy, spidey_existence,

    varkhen_existence, veyr_house_structure]. Nie powtorzyl pytania o kaplana. Nie
    wymyslil

    imienia matki Halveka, jej choroby ani miejsca pobytu.


    9. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, 19:31. Obecni: Lucan,

    npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen w gildii.
    Halvek

    bez zmian w celach gildii. Sygnet u Lucana; pieczec, klucze i papiery w zone_wall_void

    baszty. Lucan 19/19, energia bez wydatku - czytac z pliku. Wyjscie pod trzecia
    pieczec

    nadal zaplanowane na dzisiejsza noc.

    UWAGA PROWADZENIA: scena trwa od t_240, czyli osiem tur - gorna granica z SKILL-gramy.

    NASTEPNA TURA POWINNA ZAMKNAC SCENE (scene close) i rozmowe.

    '
  new_decision: 'Kesz ma wszystko, o co prosil, i jedna rzecz, ktorej nie chcial:
    wie, ze pokoj, w ktorym obiecal stac, jest w budynku, w ktorym siedzi jego swiadek.
    Powiedzial, ze do rana bedzie wiedzial, czego chce. Lucan ma teraz zdecydowac,
    czy wychodzi na noc pod trzecia pieczec (Varkhen czeka w gildii), czy zostawia
    Keszowi cos jeszcze, zanim ten zamknie pokoj.'
