outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: mixed
  perspective: pc_lucan
  location_id: loc_lumaria_adventurers_guild
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Lucan przechodzi miasto po ciemku - mniej ludzi, wiec i mniej
    oczu.

    Webber_anchored na dachu gildii rejestruje jego podejscie drgnieniem nici, zanim

    Lucan zdazy siegnac do drzwi.

    Gildia w nocy to nie ta sama instytucja co po poludniu. Okienko recepcji jest

    zamkniete deska, w glownej sali siedzi nocny urzednik, ktory nie jest ta sama
    osoba

    co dzienna recepcjonistka i nie ma jej uprawnien. Na dwoch stolach dopala sie

    wieczor kilku wracajacych z roboty.

    WLASCICIEL GARBARNI - kanalem oficjalnym nic dzis nie zalatwi, bo akta i sprawy

    ida przez dzien. Ale w glownej sali jest plotka, a plotka o kims takim krazy.
    Wersja,

    ktora Lucan slyszy od siedzacego przy piwie weterana, brzmi tak: sprawa stanela.

    Wlasciciel nie siedzi. Wyszedl - i nikt nie umie powiedziec, czy z braku dowodow,

    czy za pieniadze, bo w miescie, w ktorym w jednym miesiacu zdarzyly sie mutanty,

    trupy i cmentarz, mniejsze sprawy po prostu przestaja miec kto sie nimi zajac.

    UWAGA - to jest plotka, nie akta. Jesli jest prawdziwa, teren garbarni nadal nalezy

    do niego, klucz do jego prywatnego mieszkania nadal jest u Lucana, a Lucan nadal
    jest

    tym, kto napisal na niego skarge.

    SERAPHINE - jest w budynku. W jej pokoju na gorze swieci sie swiatlo, drzwi

    przymkniete. O tej porze nie ma tam nikogo poza nia, wiec rozmowa bylaby prywatna,

    bez swiadkow, bez wpisu.

    DATA - nocny urzednik nie zna zadnej i nie udaje, ze zna. Powie tylko, ze wezwania

    ida z gory i ze harmonogram sie "ustala". Jedyne dwie osoby, ktore moglyby dac

    Lucanowi realny termin, to ktos z kierownictwa albo Seraphine - a Seraphine jest

    za tymi przymknietymi drzwiami.

    '
  new_decision: 'Noc, pusta sala, deska na okienku, plotka o garbarniku bez potwierdzenia
    i swiatlo

    pod drzwiami Seraphine. Lucan wchodzi do niej i pyta wprost o raport, pyta ja

    najpierw o termin, probuje dostac jedno bez drugiego, dopytuje weterana o garbarnika

    zanim pojdzie na gore - czy odklada rozmowe i idzie do baszty po urobek, zeby
    noc nie

    poszla calkiem na gadanie?

    '
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.location_id
    value: loc_lumaria_adventurers_guild
  - op: set
    instance_id: pc_lucan
