  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii.

    DEKLARACJA GRACZA LADUJE W CALOSCI. Padlo NAZWISKO i to jest najwazniejsza zmiana
    stanu

    w tej turze - wazniejsza niz cala doktryna, ktora ja poprzedza.


    1. DOKTRYNA JAWNOSCI JEST ODWROCENIEM JEJ WLASNEJ ZASADY I ONA TO WIDZI OD RAZU.

    fact_seraphine_refuses_authorisation_but_names_the_line (t_126): "nie liczy sie,
    czy

    informacja jest tajna, tylko ILE OSOB MOGLO JA MIEC". Cala jej higiena polega
    na

    MINIMALIZOWANIU tej liczby. Lucan proponuje MAKSYMALIZACJE - wszystkie strony
    naraz,

    celowo - i robi to z tego samego powodu, dla ktorego ona minimalizuje: zeby nikt
    nie

    mial zysku z uciszenia. NARRATOR NIE STAWIA OPORU I NIE MA CZEGO - to jest spojne,

    wewnetrznie poprawne rozumowanie, a nie brawura do ukarania (retcon_000033).

    Ona przyznaje to na glos, bo przyznanie lepszego argumentu jest tansze niz udawanie,

    ze go nie widzi.


    2. ARGUMENT O FIXERZE ZOSTAJE PRZYJETY BEZ TARGU I MA POKRYCIE W PLIKU.

    act-03-defence#criminal_circuit_lawyer: prawnik ma STALEGO KLIENTA I NIE JEST
    NIM LUCAN.

    Gracz nie zaprzecza temu - buduje na tym. Czlowiek, ktorego pierwsza lojalnosc
    jest

    gdzie indziej i ktory zyje ze sprzedawania rzeczy ponad podzialami, JEST z tego
    powodu

    trwalszy niz lojalny. Nie zniknie, bo znikniecie jest wbrew jego interesowi.

    Seraphine nie ma czym tego podwazyc i nie probuje.


    3. "TWOI SZEFOWIE PRAWIE NA PEWNO TEZ WIEDZA" - NIE JEST CIOSEM I NIE WOLNO GRAC

    ODRUCHU OBRONNEGO (retcon_000039 dotyczy ciosu we WLASNY FUNDAMENT, a to nim nie
    jest).

    Kobieta, ktora wyprowadzila Varkhena i trzyma rozumnego nieumarlego w piwnicy
    tego

    budynku, nie wzdryga sie na wiadomosc, ze kierownictwo zna nazwisko fixera. Przyznaje

    to plasko i idzie dalej. Korupcja instytucji nie jest dla niej problemem - EKSPOZYCJA
    jest.


    4. GDZIE DOKTRYNA MA DZIURE - I DZIURA NIE JEST WYMYSLONA, TYLKO JEST DOSLOWNIE
    JEJ

    ZDANIEM Z t_126. Jawnosc chroni LUCANA. Nie chroni ludzi, ktorzy stoja w tym samym

    rejestrze obok niego. Jej wlasne rozroznienie brzmi: "co wiedziala tylko gildia
    -

    WSKAZUJE NA NIA; co Lucan zobaczyl sam - jest jego". Rejestr rozeslany wszystkim

    stronom naraz nie ma jak tego rozdzielic za nia. Kazda pozycja pochodzaca z gildii

    jest w tym samym dokumencie podpisem pod jej nazwiskiem.

    DRUGA POLOWA TEJ SAMEJ DZIURY, TEZ JEJ WLASNA: warunek z t_126 brzmial "NIE CHCE

    WIEDZIEC, kiedy Lucan tego uzyje - chce miec liste rzeczy, ktorych nie zna". Rejestru

    jawnego dla wszystkich stron nie da sie trzymac na liscie rzeczy nieznanych. Doktryna

    Lucana kasuje jej wlasny mechanizm ochronny i ona to nazywa - jako cene, NIE jako
    weto.


    5. DLATEGO JEJ PYTANIE PRZESUWA SIE Z "KTO CZYTA" NA "CO TAM JEST". Pierwsza polowa

    zostala odpowiedziana wyczerpujaco: czytaja wszyscy, z zalozenia. Jedyna zmienna,
    ktora

    zostaje, to TRESC. Pyta o nia waska i konkretnie: czy w rejestrze stoi cokolwiek,
    co

    moglo przyjsc WYLACZNIE z gildii. Nie pyta o Varkhena wprost i narrator nie kaze
    jej

    tego robic - ale to jest ta rzecz, o ktora pyta, i gracz ma prawo tak to przeczytac.


    6. NAZWISKO PADLO - ZMIANA STANU, ZAPISANA I NIEODWRACALNA.

    Do t_188 obowiazywalo wprost: "Seraphine tego skojarzenia NIE ROBI, bo NIE ZNA
    KESZA

    z wygladu ani z nazwiska". Polowa tej przeszkody wlasnie znikla z woli gracza.

    CO ONA MA: rysopis kontaktu Orena od npc_halvek (t_051) - bez munduru i bez broni,

    ciemny miejski plaszcz, skorzana teczka na dokumenty, PLAMA ATRAMENTU NA LEWYM
    KCIUKU,

    spotkania PRZED WYJAZDAMI wozu, a funkcjonariusz przy zaporze skinal mu glowa
    PIERWSZY.

    CO MA KARTA KESZA: po piecdziesiatce, ubrany jak urzednik ze sredniej polki, teczka,

    atrament NA PALCU WSKAZUJACYM.

    NARRATOR NIE ROBI TEGO SKOJARZENIA ZA NIA I TO JEST SWIADOMA DECYZJA, NIE UNIK

    (retcon_000058, retcon_000040). Nazwisko to nie rysopis. Ona dostala slowo, nie
    twarz,

    i nie ma dzis czym ich zestawic. NIE JEST WYROCZNIA (portrayal#she_is_not_an_oracle).

    CO ROBI ZAMIAST TEGO, ZGODNIE Z WLASNA AGENDA (get_the_rest_of_lucans_undisclosed_list

    _before_the_hearing): mowi, ze nazwisko sprawdzi. Bez terminu, bez zapowiedzi,
    co znajdzie.

    ROZBIEZNOSC KCIUK/PALEC WSKAZUJACY ZOSTAJE NA WIERZCHU I NIE JEST IDENTYFIKACJA.


    7. CZEGO NARRATOR TU NIE ZROBIL. Nie orzekl, ze ewidencja Kesza ma drugi obieg
    ani ze

    go nie ma - zaden plik tego nie mowi w zadna strone. Nie wyprodukowal zawartosci

    rejestru; wypelni ja deklaracja gracza w momencie uzycia. Nie zabronil rozeslania

    syndykatowi - t_126 mowi, ze ona nie udziela AUTORYZACJI, a nie ze zakazuje, i
    sama

    nazwala powod formalny, nie moralny. Nie postawil zegara, terminu ani sledztwa

    (retcon_000055). Nie kazal jej blefowac sila gildii (retcon_000041). Nie skojarzyl

    Kesza z czlowiekiem z atramentem. Nie ruszyl zadnego zegara poza uplywem czasu.


    8. STAN. Czwarty dzien interludium, gabinet Seraphine, gorne pietro gildii.

    Obecni: Lucan, npc_seraphine_vale. Spidey i Tkacz przy Lucanie, zuk w kieszeni.

    Integralnosc 19/19, energia bez wydatku - czytac z pliku. Godzine czytac ze

    state/time.yaml po commicie. Pozycje druga i trzecia z siedmiu nadal nie padly.

    '
  new_decision: Seraphine pyta, czy w tym rejestrze stoi cokolwiek, co moglo przyjsc
    wylacznie z gildii - bo taka pozycja, rozeslana wszystkim stronom naraz, wskazuje
    na nia i tylko na nia. Zapowiada tez, ze nazwisko Kesza sprawdzi. Co Lucan mowi
    o zawartosci.
