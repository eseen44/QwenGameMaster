  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero wydane.

    Najwazniejsza tura tej sceny. Pokoj mowi TAK i Kesz przestaje byc formalnie niczyim

    prawnikiem - ale zadna z tych rzeczy nie jest darmowa i obie maja zapisane granice.


    1. "NIEPOSZLAKOWANA OPINIA" BYLA ZAGRYWKA, NIE PROSBA - I CELUJE W ODPOWIEDZ,
    KTORA

    PRYNCYPAL SAM DAL W t_196. Powiedzial wtedy: jedyna opinia, jaka JA moge panu
    dostarczyc,

    nalezy do kogos, kto jest mi cos winien, a to jest dokladnie ta cecha, ktora ja
    uniewaznia.

    Lucan odpowiada, ze o to wlasnie chodzilo. Nie chce opinii nieposzlakowanej; chce
    TEJ.

    Pryncypal bierze to bez urazy, bo zart jest na jego wlasny towar, a nie na niego.


    2. UPRAWNIENIE, KTORE TA TURA REALNIE ODBLOKOWUJE, STOI W AGENDZIE KESZA OD POCZATKU:

    take_lucan_as_client_only_if_the_room_allows. Pokoj jest tutaj i wlasnie zostal
    zapytany.

    UWAGA NA GRANICE Z retcon_000124, ZEBY JEJ NIE ZLAMAC W DRUGA STRONE: Kesz NIE
    potrzebuje

    zgody na wlasny udzial i nikt go tu po nia nie odsylal - role gwaranta proceduralnego

    przyjal SAM w t_194. To, co nalezy do pryncypala, jest czyms innym i Kesz sam
    to nazwal

    w t_194: "nie jego jest ostatnie slowo, czy pryncypal ja chce", bo widoczna obecnosc

    Kesza JEST deklaracja zainteresowania syndykatu. Pytanie brzmi wiec nie "czy Kesz
    moze",

    tylko "czy pokoj chce byc widziany".


    3. POKOJ CHCE - I MA NA TO WLASNY, ZAPISANY POWOD, NIE ZYCZLIWOSC.

    fact_weigher_has_a_stake_in_lucan_surviving (t_109): powiedzial WPROST, ze jesli
    Kosciol

    przejdzie z papieru na rece, celem bedzie Lucan, a zapas kupiony pod jego termin
    umiera

    razem z nim; interes transakcyjny, nie zyczliwosc. Lucan wlasnie nazwal mu to
    jego wlasne

    zdanie z powrotem - "kolejny powod, zeby mial pan interes w mojej dlugotrwalej
    zdolnosci

    do oddychania" - i pryncypal to potwierdza plasko, bo nie ma czego prostowac.


    4. ALE STAWIA JEDEN WARUNEK I JEST TO DOSLOWNIE JEGO AGENDA, A NIE WYMYSLONA CENA.

    agenda: [set_the_number_himself, stay_unnamed, judge_lucan_by_what_he_declines_not_by_what_he_offers].

    Plan Lucana opiera sie na tym, ze WSZYSCY BEDA WIEDZIEC. Pryncypal rozdziela to
    na dwie

    rzeczy, ktore Lucan skleil w jedna: widoczny ma byc POKOJ, nie ON. Straz i gildia
    moga

    wiedziec, ze przy tej sprawie stoi syndykat - to jest wlasnie produkt. Nikt natomiast
    nie

    wymawia jego osoby, nie opisuje wagi, nie podaje stolu na targu i nie zaznacza,
    kto

    konkretnie za tym siedzi. name_status na jego karcie brzmi

    nie_podal_nazwiska_i_nikt_go_nie_przedstawil i to jest wybor, nie zaniedbanie

    (portrayal#method). Warunek nie blokuje niczego z planu Lucana - zaweza go o jedno
    slowo.


    5. HONORARIUM: ZERO, I NIE JEST TO UPRZEJMOSC NARRATORA. Pryncypal nie bierze
    pieniedzy

    za pilnowanie wlasnego zapasu. To wynika wprost z punktu 3: prawnik stojacy przy
    Lucanie

    chroni czterdziesci tysiecy srebra jeszcze niewyplaconych, kategorie towaru kupiona
    pod

    jego termin i szescdziesiat kilo, ktore juz przez ten dom przeszlo. NIE MA TU
    wydanego

    srebra po stronie Lucana i player/inventory.yaml nie jest ruszany.


    6. SPEKTAKL - JEDYNA RZECZ, KTOREJ NIE KUPUJE, I ODMAWIA JEJ ZGODNIE Z KARTA,
    NIE Z

    PRZEKORY. portrayal#appearance: rzemieslnik, nie zbir. Czlowiek, ktorego cala
    metoda

    polega na tym, zeby nikt nie pamietal, ze on tam byl, nie jest odbiorca dobrego
    spektaklu -

    spektakl sie ZAPAMIETUJE. Mowi to raz, krotko, bez moralizowania i BEZ odbierania
    Lucanowi

    zagrywki: teatr jest jego, nie ich. NIE jest to weto wobec planu i narrator nie
    zamienia

    tego w opor - punkty 3, 4 i 5 zostaja w mocy.


    7. LUCAN POWIEDZIAL NA GLOS COS, CO DO TEJ PORY STALO NA KARCIE KESZA JAKO NIEWYPOWIEDZIANE

    - I TRZEBA TO ZAPISAC PRECYZYJNIE, BO LATWO PRZESADZIC. oren_connection na karcie
    Kesza ma

    status strong_description_match_not_yet_confirmed_identity oraz pole

    lucan_said_it_out_loud: false. Zdanie Lucana brzmialo: jestem niewinny dokladnie
    tak samo

    jak rzeczony prawnik, ktory ma interes w tym, zeby nikt nie dokopal sie do JEGO
    albo JEGO

    KLIENTOW udzialu w procederze cmentarnym.

    CO TO ZNACZY: Lucan nazwal EKSPOZYCJE Kesza w sprawie cmentarza, w obecnosci pryncypala,

    jako wspolny interes - nie jako oskarzenie i nie jako szantaz.

    CZEGO NIE ZNACZY I CZEGO NARRATOR NIE DOPISUJE: nie padl Oren, nie padlo zeznanie
    Halveka

    z t_048, nie padlo dopasowanie rysopisu i nie padlo zdanie "to ty jestes czlowiekiem,

    po ktorego spotkaniach Oren zmienial trasy". Tozsamosc pozostaje NIEPOTWIERDZONA,
    a

    confirmation_route przez npc_halvek_wagonman w loc_guild_holding_cells jest nadal
    nietknieta.

    Pole zmienia sie z false na said_obliquely_as_shared_interest_identity_still_unspoken.

    KESZ TO PRZYJMUJE, BO ZNA TEN RUCH - to jest drugi raz. W t_105b Lucan oddal mu
    dzwignie

    JAKO PREZENT, nie jako szantaz, i dokladnie dlatego Kesz przesiadl sie po te sama
    strone

    stolu. Tu dzieje sie to samo w mniejszej skali, wiec reaguje jak czlowiek, ktory
    rozpoznaje

    wzor, a nie jak czlowiek przylapany (portrayal: states_his_position_before_he_has_to).


    8. is_lucans_lawyer ZMIENIA SIE NA true - I JEST TO PIERWSZA ZMIANA TEGO POLA
    W KAMPANII.

    Warunek z agendy spelniony (punkt 2), pokoj zgodzil sie (punkt 3), honorarium
    nie ma

    (punkt 5). ZAKRES JEST WASKI I ZOSTAJE TAKI, JAKI ZOSTAL PRZYJETY W t_194: GWARANT

    PROCEDURY, nie obronca. Lucan broni sie SAM. Zadanie Kesza brzmi - jego wlasna
    poprawka

    zawodowa z t_194 - nie "niech nazwia przepis", tylko "niech to WEJDZIE DO PROTOKOLU":

    swiadek milczacy przez cala rozprawe, ktory na koncu zapisuje, ze zadnego przepisu
    nie

    przywolano, jest wart wiecej niz obronca.


    9. KANAL WCZESNEGO OSTRZEGANIA - RUSZA SIE, ALE SIE NIE ZAMYKA, I MOWI TO SAM
    LUCAN.

    Gracz uzyl slowa CZESC i ma racje, wiec narrator nie robi z tego wiecej, niz jest.

    Produkt zamowiony w t_113 pryncypal opisal jednym zdaniem: ostrzezenie, ktore
    przychodzi

    tego samego dnia co klopot, nie jest ostrzezeniem, tylko wiadomoscia - kupuje
    WYPRZEDZENIE

    warte co najmniej dobe, typu "zamykajcie". t_194 juz to rozroznil i rozroznienie
    zostaje:

    prawnik noszacy tresc i terminy obu rozpraw daje pokojowi KALENDARZ WCZESNIEJ
    NIZ

    KTOKOLWIEK INNY, co jest realnym aktywem, ale nie jest sygnalem alarmowym. Status

    zobowiazania: promised_not_yet_named -> partially_named_lawyer_line_accepted_alarm_signal_still_missing.

    PUDELKO Z PAJAKIEM NADAL JEST W KIESZENI LUCANA I NADAL NIE ZOSTALO ZAOFEROWANE.

    spy_cellar_spider_06 zostal sciagniety z zaulkow gildii wlasnie na to (t_191)
    i narrator

    go za Lucana nie wyklada.


    10. KESZ WRACA DO SWOJEGO JEDNEGO PYTANIA - I MA DO TEGO PRAWO, BO NIGDY NIE DOSTAL

    ODPOWIEDZI. fact_kesz_asked_whether_seraphine_knows_he_will_be_there (t_194):
    zapytal,

    czy oficer gildii oslaniajacy Lucana wie, ze Kesz stanie na przesluchaniu; pytanie

    operacyjne, nie moralne; odpowiedzi nie zazadal i nie dostal. To NIE jest ta sama
    pulapka

    co retcon_000121 - tamta polegala na powtorzeniu zadania, ktore pozniejsza tura
    ZAMKNELA.

    Tego nie zamknela zadna. Teraz, kiedy udzial jest przesadzony, Kesz pyta drugi
    raz i znowu

    nie zada odpowiedzi na miejscu.


    11. CZEGO NARRATOR TU NIE ROBI. Nie kaze Keszowi prosic pryncypala o zgode na
    wlasny udzial

    (retcon_000124). Nie robi z pryncypala wyroczni - nie rozgryza planu Lucana, nie
    liczy za

    niego ryzyka i nie wypunktowuje mu, co moze pojsc zle (retcon_000040). Nie ujawnia
    Orena

    ani dopasowania rysopisu. Nie zamyka obligation_name_advance_warning_channel_for_syndicate.

    Nie stawia terminu ani nowego zegara - ani przesluchanie gildii, ani dysputa nie
    dostaja

    daty, bo zadna nie jest niczyja do dania. Nie zapowiada, ze cos pojdzie zle.


    12. STAN. Czwarty dzien interludium, 13:33, pokoj syndykatu na zapleczu targu.
    Obecni:

    Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary
    bez ruchu

    poza uplywem czasu. Nic nie zaplacone, honorarium zero z wyboru pryncypala, zadna
    cena za

    zadne zamowienie nadal nie padla, zaden termin nie powstal. Zuk lezy na stole
    brzuchem do

    gory. W kanale trzy zamowienia. Na stole propozycja handlowa, ktorej nikt nie
    nazwal umowa.

    Kesz jest od tej chwili prawnikiem Lucana w waskim zakresie gwaranta proceduralnego,
    za

    wiedza i zgoda pokoju, pod jednym warunkiem: syndykat widoczny, pryncypal nienazwany.

    '
