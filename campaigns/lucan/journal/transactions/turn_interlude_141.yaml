outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Dwie minuty, zero energii. Tura, w ktorej Lucan placi
    wlasnym ryzykiem za wiarygodnosc i dostaje za to zgode szybciej, niz sie spodziewal.

    1. UJAWNIENIE SYNDYKATU. Znosi syndicate_contact z forbidden_without_event na
    karcie npc_neris_aldhen. Lucan nie zostal do tego zmuszony - podal to sam, jako
    dowod tezy o polityce, i podal w wersji NIEKORZYSTNEJ dla siebie: gwarancja warta
    tyle, ile pokrywanie sie interesow; niemal na pewno nie powiedziano mu wszystkiego;
    nie zna nawet imienia pryncypala. Wszystkie trzy zastrzezenia sa kanonicznie prawdziwe
    - npc_syndicate_weigher ma name_status "nie_podal_nazwiska_i_nikt_go_nie_przedstawil"
    oraz agende stay_unnamed, a jego wlasny interes w przetrwaniu Lucana jest w karcie
    opisany jako transakcyjny, nie zyczliwy (fact_weigher_has_a_stake_in_lucan_surviving).
    Kontakt idzie przez npc_ilva_rennat, ktora jest frontem i miesniami, nie mocodawca.

    2. I DLATEGO ANALOGIA TRAFIA W NIA CELNIE. "Wlasciciel pracowni sie nie podpisuje"
    jest zdaniem z JEJ swiata przelozonym na polityke - w publikacji autorstwo jest
    warunkiem istnienia tekstu, w polityce jest kosztem. Ona przyjmuje to natychmiast,
    bo to jest argument, a nie wykret, i przyjmuje takze konsekwencje: nie da sie
    zweryfikowac niczego, co jej powiedziano, i nie bedzie sie dalo.

    3. ZMIANA RELACJI JEST TU, A NIE W ARGUMENTACJI. discretion_trust -20 -> -5 (event_turn_interlude_141).
    Powod scisly wg system/social-intrigue.md: ujawniono sekret i przekazano realna
    dzwignie, dobrowolnie i bez zadania. Czlowiek, ktory poprzednio podal nazwisko
    dopiero, gdy targ tego wymagal, tym razem oddal rzecz, ktora go obciaza, zanim
    ktokolwiek o nia poprosil. To nie jest sympatia - to jest pierwszy dowod, ze zastrzezenia
    dostaje sie od niego RAZEM z oferta.

    4. CENA TEGO RUCHU, KTORA ZOSTAJE NA STOLE. Neris jest teraz osoba, ktora WIE
    o kontakcie Lucana z syndykatem, i stanie z ta wiedza na otwartej dyspucie za
    szesnascie dni, przed publicznoscia zawierajaca ludzi Kosciola. Wiedza tego rodzaju
    nie znika i nie da sie jej cofnac; od tej chwili ona jest nie tylko referentka,
    ale i swiadkiem.

    5. OJCIEC PRZYJETY BEZ WAHANIA I Z NIEWLASCIWEGO POWODU. Ona nie potrzebuje potwierdzenia
    tozsamosci - nazwisko wpadlo jej dwa razy i uwierzyla mu w turze 138. Idzie dlatego,
    ze profesor Veyr jest CZLOWIEKIEM, KTOREGO NIE DA SIE ZWERYFIKOWAC Z KARTKI, a
    ona wlasnie stracila wszystkie inne metody weryfikacji. Zauwaza przy tym sama
    zarzut, ktory stawiala godzine wczesniej: potwierdzenie idzie od jednej z dwoch
    stron zapalnika, wiec potwierdza tozsamosc, a nie bezstronnosc.

    6. IRONIA NADAL ZAMKNIETA I ROSNIE. Ojciec od dwoch dni szuka w stosach odbitki
    z nazwiskiem osoby walczacej o szeroka definicje - czyli JEJ. Ona idzie do niego,
    nie wiedzac o tym; Lucan wie i nie powiedzial. Trzydziesci krokow.

    7. WORLD MOVE - ZGODA MA KOSZT WIDOCZNOSCI I ONA GO NIE WIDZI. Wstaje po plaszcz
    od razu, bo tak reaguje na kazde pytanie, ktore da sie rozstrzygnac pojsciem po
    zrodlo (portrayal.the_absorption). Nie liczy tego, ze skrzydlo jest obserwowane:
    pyl na poziomie rusztowania byl naruszony, ktos stal pod drzwiami i nie zapukal,
    a Geo potwierdzilo, ze obserwator jest ZYWY (event_turn_interlude_135). Wyjscie
    razem, o zmierzchu, ze skrzydla bez portierni do skrzydla laboratoryjnego, jest
    ruchem, ktory ten ktos zobaczy - i ktory laczy referentke szerokiej definicji
    z rodzina Veyrow na szesnascie dni przed dysputa. Lucan to wie. Ona nie.

    8. CZEGO ONA NADAL NIE WIE. Sieci sieciarzy, Varkhena, slowa vitae, planu pokazu
    ojca, celi w piwnicy gildii. NOWE: nie wie, ze ojciec szuka wlasnie jej odbitki.

    9. STAN. Zmierzch dnia trzeciego, pokoje Neris Aldhen, drzwi wciaz na zasuwie,
    Spidey na parapecie. Energia bez zmian, integralnosc 19 z 19, bez warunkow. 4
    000 srebra w zlocie i przepustka syndykatu pod plaszczem. USTALONE: Neris wie
    o kontakcie Lucana z syndykatem i o tym, ze pryncypal jest bezimienny; przyjela,
    ze nazwisk nie bedzie, bo w polityce sie ich nie podpisuje; zgodzila sie pojsc
    do profesora Veyra i wstala po plaszcz; nikt jeszcze nie wyszedl z pokoju.'
  new_decision: 'Neris stoi z plaszczem i czeka. Wyjscie razem o zmierzchu ze skrzydla
    bez portierni do laboratoryjnego zobaczy zywy obserwator, ktorego posterunek Spideya
    wykryje, ale nie zatrzyma - i polaczy referentke szerokiej definicji z rodzina
    Veyrow szesnascie dni przed dysputa. Lucan decyduje: ida razem i teraz, ida osobno
    albo inna droga, czy Lucan idzie sam po ojca i przyprowadza go tutaj. Osobno stoi
    tez pytanie, czy powiedziec jej, po czyja odbitke ojciec grzebie w stosach od
    dwoch dni.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
