    tak, jak Lucan go podal: za dnia, jawnie, jako ekipa budowlana, na miejscu o dwunastej.
    OTWARTE: (1) czy Lucan bierze te godzine, (2) INSTRUKCJE DLA MARY I BOROSA, ktore
    naleza do niego od t_269 i nadal nie padly - Mara nazwala to wprost. Mara ma z
