outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'CO MARA WIE I SKAD - ustalone przed jej pierwsza kwestia, nie wyprowadzone
    z audytu. Karta (lifecycle.last_confirmed_event_id: t_117) konczy sie 160 tur
    przed briefem, wiec traktowana jako NIEKOMPLETNA (retcon_000121). Zrodlem tresci
    jest t_269: Seraphine rozstrzygnela ekipe ("Boros i Mara. Nikt inny"), robota
    jest PODPISANA i idzie DNIEM, a audyt tej tury mowi wprost "INSTRUKCJE DLA MARY
    I BOROSA NALEZA DO LUCANA - nie padly". Stad rozstrzygniecie: Seraphine PRZYDZIELILA
    ich do roboty i podala wersje z papieru (naturalna niecka, obsuw, obadac-ustabilizowac-odciac,
    kilofy i ludzie gildii - wszystko z t_266/t_267), ale NIE powiedziala im, co tam
    naprawde lezy. Instrukcji nadal nie ma i Mara to nazywa. DO WIEDZY MARY WCHODZI
    (jako to, co uslyszala, nie jako fakt o swiecie - retcon_000120): Lucan nie spal
    i sam wiaze to z cmentarzem; plan wejscia za dnia jako ekipa budowlana, na miejscu
    o dwunastej. BOROS: karta ma current_location_id z t_115 i jest martwa jako adres.
    Rozstrzygniete narracyjnie i zgodnie z jego portrayal ("plan sprowadza do serii
    bardzo konkretnych czynnosci") - poszedl po woz i kilofy, bo przykrywka budowlana
    ich wymaga. Zadnego zegara ani terminu z tego nie robie. UWAGA MARY O BRAKU SNU:
    retcon_000112 mowi, ze efekty rozwoju Lucana moze zauwazyc DOKLADNIE JEDNA osoba
    w zasiegu i jest nia npc_mara. Podane zmyslami, bez diagnozy i bez nazwy mechanizmu
    (retcon_000156). ZACZEPKA DOBROWOLNA, BEZ ZEGARA I BEZ KARY (retcon_000164): grabarz
    i miejski klient zagadujacy murarzy. Pominiecie nie kosztuje nic. NIEUSTALONE:
    czy Lucan bierze te godzine treningu i czy wyda wreszcie instrukcje.'
  prose: '— Wczoraj późno — mówi Mara. — Weszła do świetlicy, powiedziała dwa zdania
    i wyszła.

    Że schodzimy we dwoje z Borosem, że jest podpisane i że idziemy dniem. Nie wyglądała,

    jakby chciała o tym rozmawiać.


    Liczy na palcach, krótko, nie po to, żeby było widać, tylko dlatego, że tak jej
    wygodniej.


    — Robota jest budowlana. Naturalna niecka pod cmentarzem, coś się obsuwa, mamy
    to obadać,

    ustabilizować i odciąć. Kilofy i ludzie z gildii. Papier mówi konserwacja. — Podnosi

    wzrok. — Tyle dostałam i tyle chcę mieć.


    To ostatnie zdanie pada bez nacisku. Po prostu kładzie je na stole, żeby leżało.


    — Boros poszedł na dół po sprzęt. Jak mamy wyglądać na murarzy, to musimy mieć
    wóz

    i kilofy, a nie trzy plecaki. Wróci z tym prosto pod bramę.


    Dopiero przy treningu reaguje czymś więcej niż odpowiedzią. Patrzy na niego dłużej
    —

    nie na twarz, na ręce i na to, jak stoi.


    — Nie spałeś, a wyglądasz jak ktoś, kto spał. — Wzrusza ramionami. — Widzę to
    nie

    pierwszy raz i nie pierwszy raz mi się nie zgadza. Ale to nie moja sprawa i nie
    pytam.


    Potem odkleja się od ściany.


    — Jest czas. Godzina, nie więcej, bo chcę jeszcze zjeść i obejrzeć sprzęt, który
    Boros

    wybierze, zanim go załadują. — I już w pół kroku, przez ramię: — Na dwunastą zdążymy

    spokojnie. Tylko wiedz, że ekipa budowlana na cmentarzu w południe to jest coś,
    co ludzie

    zagadują. Grabarz zapyta, kto płaci. A jak dobrze pójdzie, to ktoś z miasta zapyta,
    czy

    jak już skończymy, to nie poprawilibyśmy mu muru.

    '
  apply_required_costs: true
