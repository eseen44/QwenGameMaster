  new_decision: 'Dolna hala pod cmentarzem, 22:37, dzien piaty. Pierwsze wejscie kogokolwiek
    od stuleci. CZTERDZIESCI STOPNI w dol, liczone na glos przez Borosa co piaty,
    zeby bylo po czym wracac. CO WIDAC: lampa NIE SIEGA ani sufitu, ani przeciwleglej
    sciany. To nie jest pomieszczenie, tylko HALA. Podloga z plyt, wytartych posrodku
    w pas szerokosci dwoch ludzi, biegnacy od stopni w ciemnosc. Nisze sa i tu, ale
    GLEBSZE w murze, wieksze i rzadsze - miedzy dwiema mieci sie tyle, ile w komorze
    cztery. KAMIEN JEST JESZCZE STARSZY: bloki wieksze, obrobka inna, spoin prawie
    nie ma, bo kamienie sa DOPASOWANE. Trzecia warstwa wieku po cmentarzu i komorze
    - odczyt Lucana z practical_masonry, NIE data. PRZECIAG IDZIE OD LEWEJ, rowno,
    i w te sama strone biegnie wytarty pas na podlodze. To jest jedyny kierunek, jaki
    maja - i zgadza sie z tym, co podal Varkhen w t_296: nizej, potem brama, a przy
    bramie TRZECIA PIECZEC. NIEUSTALONE: co jest za brama; gdzie dokladnie wchodzi
    powietrze; jak daleko siega hala. ZASOBY: oleju na cala noc, jesli nie beda glupi
    (slowa Borosa). Tkacz zostala na gorze przy rampie z pelnym rewirem. Woz pusty.
    Rezerwa Lucana 14,6/15. ODPOWIEDZ POZA GRA: nadwyzka 28,3 to suma BRUTTO i nie
    odejmuje dowozu do Varkhena; netto dla reszty sieci 26,0. Przy sufcie przyjecia
    Lucana 7,5 nie zmienia to niczego.'
