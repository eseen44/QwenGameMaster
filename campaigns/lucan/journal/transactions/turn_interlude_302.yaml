outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'ZEJSCIE NA POZIOM NIZSZY. Wszystko, co ekipa tam zastaje, jest ROZWINIECIEM
    tego, co juz zostalo zmierzone, a nie nowa rzecza dolozona przy okazji: Spidey
    w t_301 podal, ze dzwiek wraca wolno, dlugo i NIE ZE WSZYSTKICH STRON - stad wysokosc
    i to, ze lampa nie siega sufitu ani przeciwleglej sciany. Geo w t_292 podalo,
    ze uklad umarlych ciagnie sie poza komore - stad nisze takze tutaj. Varkhen w
    t_296 podal, ze nizej jest brama i przy niej trzecia pieczec - i to jest jedyny
    kierunek, ktory dostaja. DWIE RZECZY, KTORYCH NARRATOR NIE ROZSTRZYGA I ZOSTAWIA
    OTWARTE: co jest za brama i gdzie dokladnie wchodzi powietrze. Przeciag daje KIERUNEK,
    nie adres. ROZNICA, KTORA LUCAN CZYTA Z RZEMIOSLA, a nie z przeczucia: kamien
    na tym poziomie jest jeszcze starszy niz w komorze grobowej - inny material, inna
    obrobka, inna skala blokow. Ma do tego progression_practical_masonry, tak jak
    w t_291. NIE JEST TO DATA i Lucan nie jest historykiem. ZADNEGO RZUTU, ZADNEGO
    ZEGARA, ZADNEJ ZACZEPKI. roll_policy disabled, a zaden plik nie stawia tu zagrozenia.
    Spidey nie zszedl wczesniej dlatego, ze policzyl wlasne nogi - nie dlatego, ze
    cos tam bylo, i narrator tej roznicy nie zaciera. OBSADA NA POWIERZCHNI: Tkacz
    zostaje przy rampie z rewirem. Woz stoi pusty - lup jest juz w kryjowce przy garbarni,
    wiec zostawienie go bez opieki nie jest ryzykiem, ktore ktokolwiek bierze. NOWA
    STREFA: zone_deep_hall w loc_cemetery_underworks, zadeklarowana bo scena jej wymagala.'
  prose: 'Wracają tą samą drogą i idą szybciej, bo drugi raz wszystko jest bliżej.


    Tkacz zostaje na górze i zostaje bez polecenia — po prostu nie schodzi. Wóz stoi
    pusty przy

    rampie i nikt się nim nie przejmuje, bo nie ma już w nim nic, co byłoby warte
    zabrania.


    Komorę Varkhena mijają drugi raz tego dnia. Leży tak samo. Tym razem nie patrzy
    nawet Lucan.


    Przejście, dwieście kroków korytarzem, przebicie, komora grobowa. Pięćset kroków
    między

    rzędami płyt, które teraz są już tylko drogą do przejścia. Próg.


    Schody.


    Boros schodzi pierwszy, bo przy ścianie idzie on, a schody są ścianą pod nogami.
    Idzie bokiem,

    z ręką na kamieniu, i liczy na głos co piąty stopień, żeby wracający mieli po
    czym iść.

    Dochodzi do czterdziestu i kończy.


    Na dole lampa przestaje wystarczać.


    To jest pierwsza rzecz, którą Lucan rozumie, zanim jeszcze cokolwiek zobaczy:
    światło idzie

    w górę i nie trafia na nic. Nie ma sufitu w zasięgu płomienia. Podnosi lampę wyżej,
    a potem

    jeszcze wyżej, i nadal jest tylko ciemność, która nie odbija.


    Przeciwległej ściany też nie widać. Jest gdzieś przed nimi, bo powietrze skądś
    idzie, ale

    światło kończy się wcześniej.


    Komora nad nimi była pomieszczeniem. To jest **hala**.


    Podłoga to płyty, a nie klepisko, i są wytarte tak samo jak schody — pośrodku,
    w pas

    szerokości dwóch ludzi, biegnący od stopni gdzieś w ciemność.


    Nisze są i tutaj, bo kamień zapowiedział to jeszcze zza zawału. Tylko że tu nie
    są rzędem

    na ścianie. Są **głębiej w murze** i większe, i między jedną a drugą jest tyle
    miejsca,

    ile w komorze mieściło cztery.


    Lucan przykłada dłoń do najbliższego bloku i stoi tak dłużej, niż musi.


    Bo ten kamień to znowu nie jest ten sam kamień. Komora nad nimi była starsza od
    cmentarza.

    To jest starsze od komory: bloki większe, obrobione inaczej — nie piłą i nie dłutem,
    którym

    robiono tamte, tylko czymś, co zostawiało szersze ślady i mniej ich zostawiało.
    Spoin

    prawie nie ma. Nie dlatego, że są cienkie. Dlatego, że kamienie są dopasowane.


    Przeciąg idzie od lewej i idzie równo.


    A gdzieś w tę samą stronę biegnie wytarty pas na podłodze.


    Mara staje przy Borosie, nie przy Lucanie, i patrzy w ciemność, w którą nie sięga
    żadne

    z ich świateł.


    — Ile mamy oleju? — pyta.


    — Na noc — mówi Boros. — Na całą, jak nie będziemy głupi.

    '
