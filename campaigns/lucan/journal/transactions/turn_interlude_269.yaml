outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'KOREKTA O OJCU PRZYJETA, BO SERAPHINE GO NIE ZNA (she_is_not_an_oracle)
    - narrator nie pozwolil jej recytowac profilu z karty, ktorej ona nie widziala.
    Zostawila sobie tylko wlasny rejestr: nie czlowiek, lecz POKOJ I BUDYNEK, nad
    ktorym gildia nie ma jurysdykcji. Nie postawila z tego warunku ani zakazu. EKIPA
    ROZSTRZYGNIETA BEZ DODAWANIA GLOW: ida Boros i Mara, bo obydwoje byli przy milestone_045
    i 046 - znaja Varkhena, jego uklad i to, co tam lezy (fact_boros_witnessed_varkhen_assault,
    fact_mara_witnessed_varkhen_assault, fact_*_knows_varkhen_compact). OBCA EKIPA
    ODPADA Z POWODU GEOMETRII, nie z ostroznosci narratora: droga do korka prowadzi
    przez komore, w ktorej Varkhen lezy w sarkofagu (t_263), wiec pierwszy dzien roboty
    konczy sie tym, ze obcy go widza. PORA DNIA ZMIENIONA PRZEZ PAPIER: skoro robota
    jest podpisana, nocne schodzenie jest tym, czego papier ma nie wymagac. To jej
    domena i tak to nazwala. CENA PAPIERU NAZWANA RAZ: pod tym, co ekipa przywiezie
    z dolu, ma sie zgadzac to, co ona podpisala - inaczej podpisala klamstwo i to
    ona przed tym stanie. Zadnego terminu, zegara ani wezwania nie dodano. INSTRUKCJE
    DLA MARY I BOROSA NALEZA DO LUCANA - nie padly w tej turze i narrator ich nie
    napisal. Tura rozmowna, bez kosztow i bez ruchu.'
  prose: '- Pochodzenia - mówi Seraphine, i zaraz potem robi rzecz, której nie robi
    często:

    przestaje. - Dobrze. Nie znam go. Ty znasz.


    Odsuwa arkusz na bok, żeby atrament schnął tam, gdzie schnie.


    - Zostaje mi z tego jedno i to nie jest o twoim ojcu. Rzecz będzie leżeć w pracowni

    w Akademii, a Akademia to budynek, w którym chodzą ludzie, i nie mam tam ani jednej

    pary oczu. Jak coś stamtąd wyjdzie, dowiem się z drugiej ręki i za późno. - Wzrusza

    ramionami, jednym, krótkim. - To nie jest zakaz. To jest to, czego nie zobaczę.


    Potem ekipa, i tu nie ma już żadnego wahania.


    - Boros i Mara. Nikt inny. - Liczy to na palcach, dosłownie, jakby chciała, żeby

    było widać, że liczy. - Obydwoje byli w komorze, kiedy go rozbijaliście, i obydwoje

    wiedzą, na co się zgodził. Każdy inny zejdzie tam po kilof, minie sarkofag i zobaczy

    w nim coś, co ma otwarte oczy. Wtedy mam na stole nie robotę, tylko sprawę.


    Stuka palcem w arkusz.


    - I nie nocą. Po to jest papier. Robota podpisana idzie w dzień, o zwykłej porze,

    z kilofami na wozie i z gębą znudzonego robotnika. Nocą chodzi się wtedy, kiedy
    się

    nie ma czego pokazać.


    Na koniec, ciszej, i to jedyny raz, kiedy mówi o sobie:


    - Pod tym jest mój podpis, nie twój. Cokolwiek wyjmiecie spod tego korka, ma się
    dać

    opisać zdaniem, które napisałam. Jak się nie da - powiedz mi to zanim tam zejdą,

    a nie po.

    '
  apply_required_costs: true
  resolved_world_reaction_ids: []
