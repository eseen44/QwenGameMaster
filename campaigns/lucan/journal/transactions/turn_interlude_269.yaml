    nocy, skoro i tak trzeba wydac instrukcje Marze i Borosowi.'
  actor_id: pc_lucan
  scope: execution
  stakes: 'SERAPHINE NIE ZNA KARTY OJCA i nie wolno jej recytowac jego profilu. Wolno
    jej przyjac korekte Lucana - to jego ojciec, a ona go nie zna (she_is_not_an_oracle)
    - i zostawic sobie tylko to, co jest jej wlasnym rejestrem: nie czlowiek, tylko
    POKOJ i BUDYNEK, nad ktorym gildia nie ma jurysdykcji. BOROS I MARA JUZ WIEDZA
    WSZYSTKO O VARKHENIE, ZE STANU: fact_boros_witnessed_varkhen_assault i fact_mara_witnessed_varkhen_assault
    (milestone_045), fact_boros_knows_varkhen_compact i fact_mara_knows_varkhen_compact
    (milestone_046). Wyslanie ICH nie dodaje ani jednej nowej glowy - i to jest powod,
    dla ktorego ta ekipa dziala, a obca nie. KOLIZJA, KTORA WYNIKA Z GEOMETRII, NIE
    Z PRZENIKLIWOSCI NARRATORA: droga do korka prowadzi PRZEZ KOMORE, w ktorej lezy
    Varkhen (zone_sarcophagus, t_263). Obca ekipa zobaczylaby go pierwszego dnia -
    a Seraphine ma nierozlupanie sie na Varkhenie jako drugi priorytet z karty. PAPIER
    ZMIENIA PORE DNIA: skoro robota jest podpisana, skradanie sie noca jest wlasnie
    tym, czego papier ma nie wymagac. To jej domena (jurysdykcja, procedura), nie
    wyreczanie gracza. INSTRUKCJE DLA MARY I BOROSA NALEZA DO LUCANA - narrator ich
    nie pisze i nie wklada Seraphinie w usta. ZERO ZEGARA: zaden plik nie stawia terminu;
    podpis rano jest jej wlasnym trybem pracy, nie odliczaniem.'
