  summary: 'Bez testu - interludium, roll_policy disabled. CZTERDZIESCI MINUT, zero
    energii.

    Czekanie jako czynnosc, nie jako przerwa. Dzban ma swoja fizjologie i to ona daje
    okno.


    1. POSTAWA JEST DOBRA I NIE WYMAGA NICZEGO WIECEJ. Sciana szynku od strony zapory,

    waski pas cienia, czlowiek siedzacy na ziemi z ksiazka na kolanach. W miescie,
    w ktorym

    ludzie czekaja na wozy, na zmiane i na kogos, kto wyjdzie, to jest najmniej widoczna

    rzecz, jaka mozna robic na ulicy. NARRATOR NIE ROBI Z TEGO PROBY ANI TESTU: napiecie
    0,

    rzutow nie ma, a zwykli przechodnie nie sa przeciwnikami w tescie (zasada gracza

    2026-08-19). Nikt nie podchodzi, nikt nie pyta, nikt nie zaglada w ksiazke.


    2. TYTUL NIEROZSTRZYGNIETY - CELOWO. Gracz zapytal w nawiasie, co Lucan ma przy
    sobie,

    i nie wskazal ksiazki. Narrator NIE wybiera za niego (system/player-agency.md).

    Mechanicznie ma to znaczenie: objective_develop_lucan#read_and_develop_skill_related_knowledge

    jest krokiem otwartym, a czterdziesci minut nieprzerwanej lektury to realna porcja
    czasu.

    TA TURA NIE ZALICZA ZADNEGO POSTEPU W TYM KROKU, bo nie wiadomo, co bylo czytane.

    Jesli gracz poda tytul, zalicza sie wstecz - to nie jest kara, tylko brak danych.

    CARRIED I NADAJACE SIE DO CZYTANIA (player/inventory.yaml, location: carried):

    "Uprzejmosci", atlasy anatomiczne balwierza, akademicki tom z sygnatura biblioteki,

    zapis obserwacji ran wg Mary Teln.


    3. TKACZ WYCHODZI, SPIDEY ZOSTAJE - I TO JEST WLASCIWY PODZIAL, NIE PRZYPADKOWY.

    Tkacz idzie pod sciane do Lucana; przestaje byc gorszym z dwoch sluchaczy w chwili,
    gdy

    przestaje sluchac. Spidey zostaje pod krokwia. Uwaga Lucana jest szeregowa (retcon_000100),

    wiec przez czterdziesci minut ma JEDEN wezel w izbie zamiast dwoch i nie musi
    sie

    przelaczac - czyta i trzyma jedno ucho na stole, bez sekundy zamentu za kazdym
    razem.

    Zaden okaz nie zostal zauwazony. Zaden nie kosztowal nic (routine_upkeep_cost
    0).


    4. CO IZBA ROBILA PRZEZ CZTERDZIESCI MINUT - I DLACZEGO NIC WIECEJ.

    Rozmowa przy zsunietych stolach nie zmienila tematu, bo nie miala powodu: pieniadze,

    upal, czyjas siostra, czyjs dlug. NARRATOR NIE PODLOZYL TAM ZADNEGO TEMATU DLA
    LUCANA -

    ani cmentarza, ani wozow, ani glejtu, ani zadania do gildii. Zaden plik nie stawia
    tych

    rzeczy w tej izbie, a to, ze ci ludzie MOGLIBY o nich gadac, nie jest zrodlem

    (retcon_000058). Dwoje spod okna wyszlo. Spiacy przy tylnych drzwiach spi dalej.

    Grupa przy stolach sie NIE ROZCHODZI i nic nie wskazuje, ze zaraz sie rozejdzie.


    5. OKNO PRZYCHODZI I JEST NAJZWYCZAJNIEJSZE Z MOZLIWYCH. Ossek Marn ma teraz za
    soba

    blisko cztery godziny przy dzbanku. Wstaje - nie zeby wyjsc, bo zostawia kubek
    i czapke

    na stole, a to jest jedyny komunikat, jakiego taki czlowiek potrzebuje, zeby stol
    wiedzial,

    ze wraca. Idzie na TYLY, przez uchylone drugie wyjscie za szynkwasem, na podworzec.

    ZRODLEM TEGO NIE JEST DRAMATURGIA, TYLKO FIZJOLOGIA I DEKLARACJA GRACZA: gracz
    zadeklarowal

    czekanie na to, az Marn wstanie, interludium laduje deklaracje gracza (retcon_000033),

    a czlowiek po czterech godzinach piwa wstaje. Narrator nie mogl tego zablokowac
    wymyslonym

    przeciwfaktem i nie probowal.

    IDZIE SAM. Nikt z grupy nie wstaje razem z nim.


    6. CO TO OTWIERA, A CZEGO NIE. Otwiera: Marn jest przez chwile jedna osoba, a
    nie osoba

    w osemce, i jest na podworcu - miejscu, ktorego Lucan nie widzial i ktore ma wlasne

    wyjscie (locations/pod-obrecza - podworzec jako strefa NIE ISTNIEJE jeszcze w
    pliku

    lokacji, bo nikt tam nie byl; jesli Lucan tam wejdzie, nalezy sie pierwszy opis).

    NIE OTWIERA: nie wiadomo, ile ta chwila trwa, i narrator NIE STAWIA ZEGARA ANI
    TERMINU -

    to nie jest odliczanie, to jest po prostu czlowiek, ktory za moment wroci do kubka.

    Nie ustanowiono, ze Marn jest pijany do stopnia, ktory cokolwiek zmienia mechanicznie.

    Nie ustanowiono, ze ktokolwiek patrzy w strone tylnych drzwi.


    7. CZEGO NARRATOR TU NIE ZROBIL. Nie stworzyl zagrozenia z czlowieka siedzacego
    pod

    sciana z ksiazka (retcon_000055). Nie kazal nikomu wyjsc na ulice i zapytac Lucana,
    kim

    jest. Nie dopisal Marnowi ani wiedzy, ani podejrzenia, ani skruchy - do_not_play
    na jego

    karcie obowiazuje az do sceny. Nie ruszyl zegarow poza uplywem czasu.


    8. STAN. Czwarty dzien interludium, ulica przed szynkiem Pod Obrecza, waski cien
    pod

    sciana. Lucan siedzi, ksiazka na kolanach, Tkacz przy nim. Spidey pod krokwia
    w izbie.

    Zuk w kieszeni, glejt w kieszeni. Integralnosc 19/19, energia bez wydatku - czytac
    z pliku.

    Marn wlasnie przeszedl przez tylne drzwi na podworzec, kubek i czapke zostawil
    na stole.

    Godzine czytac ze state/time.yaml po commicie.

    '
