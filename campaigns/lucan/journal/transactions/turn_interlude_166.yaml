  summary: 'Bez testu - rozmowa, szesc minut, zero energii. Zagrywka gracza laduje
    w calosci

    (retcon_000033). Najwieksze ujawnienie wobec Neris od poczatku znajomosci, i Lucan

    robi je DOBROWOLNIE, wbrew temu, o co go poprosila.


    1. FRAMEWORK ZAMIAST PRODUKCJI MASOWEJ - ODPOWIEDZ JEST PRAWDZIWA I ROZBRAJA

    NAJGROZNIEJSZY WNIOSEK NERIS BEZ KLAMSTWA. Jej odczyt z t_143 i t_165 brzmial:
    skala.

    Odpowiedz: skala jest METODA WYMUSZANIA REALNEGO KOSZTU na czlowieku, ktory kosztu
    nie

    widzi. Jest to zgodne z tym, co ojciec robil przez caly wieczor - dawal odpowiedzi

    materialowe zamiast wykrywalnosciowych (t_149 vs t_150), a srebro odrzucil dopiero

    wtedy, gdy stanela KRZYWA KOSZTU (t_148, t_150 pkt 7). Bez ramy masowej doradzalby

    rozwiazania spoza kartki. Wlokna ze smoczego serca sa nowym kanonem gracza jako

    ULUBIONY nadmiarowy material profesora - zaden plik temu nie przeczy.


    2. POWOD UKRYWANIA - TRYWIALNY, PRAWDZIWY I DLATEGO NIE DO PODWAZENIA. Ludzie

    rozdeptuja pajaki i cmy odruchowo. To nie jest zaslona; to jest realna przyczyna

    strat, potwierdzona w tej samej rozmowie trzema zjedzonymi okazami (t_164). Odpowiedz

    na "przed kim ukrywasz" brzmi "przed butem", i to zdejmuje z pytania cala grozę.


    3. CMENTARZ - LUCAN MOWI JEJ TO, O CO PROSILA, ZEBY NIE WIEDZIEC. To jest ruch

    gracza, nie potkniecie. Trzeba nazwac jego cene wprost, bo ona ja nazwala minute

    wczesniej: chciala moc za szesnascie dni odpowiedziec prawde i nadal nic nie wiedziec.

    Ta mozliwosc wlasnie przestala istniec. Od teraz na sali bedzie musiala WYBRAC
    miedzy

    prawda a bezpieczenstwem - i to jest jedyna rzecz tego wieczoru, ktora jej odebrano,

    a nie dano.


    4. CO DOKLADNIE DOSTALA. (a) Cala praca i dysputa z Kolmem sa PREREQUISITE do
    roboty

    na cmentarzu. (b) Zainteresowanych jest wiecej stron, w tym GILDIA jako pracodawca

    Lucana. (c) Pod cmentarzem grupa nekromantow amatorsko wysysala energie z DUCHA

    PRADAWNEJ NEKROPOLII. (d) Przywrocenie rownowagi to duzo pracy i realne ryzyko
    dla

    mieszkancow. NOWY KANON gracza: duch pradawnej nekropolii jako podmiot, z ktorego

    wysysano energie - spojne z jezykiem transmitera/serca cmentarza

    (milestone_043a_logistics_collector_overload).


    5. CZEGO NADAL NIE POWIEDZIAL, I TO JEST WAZNE. Varkhen, wlasna nekromancja, siec,

    przysiega, pieczecie, cela w piwnicy. Ujawnil ROLE (czlowiek od naprawy, zatrudniony

    przez gildie), nie NATURE. Flagi forbidden_without_event dla spidey_network,

    varkhen_identity, webber_network i guild_basement_cell NIENARUSZONE.


    6. I TO JEST NAJMOCNIEJSZA RAMA PRAWNA, JAKA DOTAD PADLA - MA POKRYCIE W KANONIE.

    necromancy-law#information_rule mowi wprost: uratowanie miasta moze wplywac na
    decyzje

    o oslonie, karze albo wykorzystaniu Lucana. Nie legalizuje niczego wstecznie,
    ale

    przesuwa go z kategorii "oskarzony" do kategorii "jedyny, kto to potrafi naprawic".

    Zombie wypelzajace z wygodki to argument, ktorego zadna ze stron nie moze

    zignorowac, bo secular_authority_position patrzy wlasnie na public_danger.


    7. WORLD MOVE A - I TU JEST DZIURA W JEGO WLASNYM PROJEKCIE, KTORA NERIS ZNAJDUJE

    NATYCHMIAST, BO TO JEST DZIURA REDAKCYJNA, A NIE POLITYCZNA. Granica z t_160 zakazuje

    OSTRO kontroli nad wiekszymi nieumarlymi i nigdy nie dopuszcza tlumu. Naprawa

    cmentarza jest z definicji praca przy wiekszych nieumarlych i przy ich liczbie.

    Zaprojektowany tekst kryminalizuje robote, ktora Lucan wlasnie opisal jako powod

    istnienia tego tekstu. Brakuje klauzuli dla tych, ktorzy maja sprzatac. To jej
    domena

    (mysli tekstem) i nie wymaga slownika politycznego, wiec wolno jej to zobaczyc.


    8. WORLD MOVE B - REAKCJA NA ODEBRANA NIEWIEDZE. Zgodnie z retcon_000039 nie kwituje

    ciosu we wlasny fundament spokojnie i nie przelicza planu. Zgodnie z portrayal.the_flaw

    przyznaje jednocześnie, ze to zmienia jej stanowisko na lepsze - bo tekst, ktory
    ma

    cel ochronny, pisze sie inaczej niz tekst, ktory jest alibi. Obie rzeczy naraz,
    zle

    poskladane, bo tak mowi (portrayal.voice.rhythm).


    9. WORLD MOVE C - OJCIEC REAGUJE WYLACZNIE NA SMOCZE SERCE. Uslyszal swoje imie
    w

    kontekscie materialu i odpowiedzial na jedyna czesc, ktora go dotyczy, ignorujac

    cmentarz, gildie i nekromantow calkowicie (portrayal.traits: gubi watek, de facto

    nieobecny nawet bedac obok; polityka go nie interesuje). Broni wlokna rzeczowo.
    To

    nie jest wygoda narratora - to ta sama gluchota, ktora przez caly wieczor chroni

    Lucana i ktora kiedys go nie ochroni.


    10. EKSPOZYCJA DO ZAPAMIETANIA, NIE DO ODPALENIA. Slowa "gildia", "nekromanci"
    i

    "cmentarz" padly przy ojcu, ktory zamierza rozmawiac z kolegami (agenda.next_action).

    Nie laczy tego z synem, bo nie szuka przestepstwa - ale zdania sa wypowiedziane.

    Ryzyko jest niskie i realne jednoczesnie.


    11. CZEGO NADAL NIE PADLO. Sygnatura - dziewiate pytanie bez odpowiedzi, teraz
    juz

    ODMOWA de facto. Odpowiedz na pytanie redakcyjne o trzy substancje. Wpis do rejestru

    zaopatrzenia niezlozony. Imie narzeczonej i nazwa rodu - NIE WYMYSLAC.


    12. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 19:00. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. USTALONE: niewykrywalnosc to prywatny

    research, rama masowa jest narzedziem kosztowym; powod ukrywania to but przechodnia;

    Neris zna operacyjny cel calej sprawy - naprawe cmentarza po amatorskich nekromantach

    wysysajacych ducha nekropolii - oraz udzial gildii; swiadoma niewiedza Neris

    zniszczona przez Lucana dobrowolnie; projekt granicy nie ma klauzuli dla sprzatajacych.

    '
