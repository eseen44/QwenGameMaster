  summary: 'Bez testu i bez kosztu - Spidey slucha przez wiez kotwicy, utrzymanie
    zerowe. Schodzi

    po rekawie na blat, powoli, i machna odnozem.

    Seraphine nie drgnela. Tydzien temu stala nad unieruchomionym starozytnym nieumarlym;

    pajak na biurku nie jest dla niej wstrzasem. Ona juz wiedziala, ze siec istnieje

    (fact_seraphine_knows_spider_network_exists) - czego NIE wiedziala, to jak to
    wyglada z

    bliska, jak male to jest i jak blisko Lucan to trzyma. Teraz wie, ze rzecz siedziala
    w

    jej pokoju przez cala rozmowe.

    Ale reaguje nie na pajaka. Reaguje na MACHNIECIE.

    Mowi Lucanowi plasko, ze nigdy wiecej ma tego nie robic przy nikim. Powod jest
    prawny,

    nie estetyczny: konstrukt WYKONUJE, a sluga SLUCHA. Mechanizm nie odpowiada na
    prosbe.

    Przyjazne machniecie na zyczenie jest demonstracja posluszenstwa, a posluszenstwo
    jest

    cala sprawa - to jest roznica miedzy "posiada dziwactwo" i "kontroluje nieumarlych",

    czyli dokladnie ta rzecz, ktora chcialaby ukryc na temat Varkhena.

    Zorientowala sie tez, po co Lucan zaczal od tego. Czlowiek, ktory na pytanie "czego

    jeszcze nie wiem" odpowiada zartem z pajakiem, ma na liscie rzeczy gorsze niz
    pajak.

    Powiedziala to na glos i czeka dalej.

    A Lucan sam widzi, w co wlasnie wdepnal - bo Seraphine NIE WIE o dyspucie. Jej
    regula

    "nigdy przy nikim" zderza sie frontalnie z planem wystawienia ozywionego okazu
    na

    publicznym sporze, gdzie po drugiej stronie stoi Kolm, ktorego zadaniem jest nazwac
    to

    nieumarlym. Jesli wabik na dyspucie kiedykolwiek zareaguje na polecenie, spor
    jest

    skonczony w jednym zdaniu.

    '
  new_decision: 'Spidey siedzi na blacie, Seraphine wie juz wiecej niz przed minuta
    i wprost powiedziala,

    ze pajak nie moze przy nikim slychac polecen. Nie wie natomiast nic o dyspucie
    za

    szesnascie dni, a to jest teraz najwazniejsza rzecz na liscie Lucana - bo jego
    wlasny

    plan lamie regule, ktora ona wlasnie ustanowila. Lucan mowi jej o dyspucie i o
    ojcu,

    wykłada relikwiarz i zloto zamiast tego, oddaje wszystko naraz, czy pyta ja najpierw,

    jak brzmi roznica miedzy konstruktem a sluga w papierach, ktore ona bedzie musiala

    czytac?

    '
  operations:
  - *id002
