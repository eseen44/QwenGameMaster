  summary: 'Bez testu - interludium, roll_policy disabled. Cztery minuty, zero energii,
    zero wydane.

    Dast tlumaczy z wnetrza wlasnej zalosci rzecz, ktorej Seraphine nie mogla zmierzyc
    inaczej

    niz przez czekanie.


    1. PYTANIE BYLO DOBRZE USTAWIONE I DLATEGO DZIALA. Lucan nie zapytal, KTO podpisuje
    -

    zapytal, czemu w ogole trzeba to robic trzy razy. Dla Dasta to nie jest wscibstwo,
    tylko

    zaproszenie do dalszego narzekania, a narzekanie jest jedyna rzecza, ktorej dzis
    chcial

    (portrayal#what_he_wants_from_a_conversation). Granica z what_he_refuses NIE zostala

    dotknieta: nazwisko nie padlo i Lucan o nie nie prosil.


    2. CO ODPOWIADA - I JEST TO POTWIERDZENIE POMIARU Z t_034, NIE NOWY FAKT.

    (a) Ma racje, ze jedno wystarcza. Normalnie pismo idzie, ktos wydaje, koniec.
    Wlasnie

    dlatego to go wkurza.

    (b) TO NIE SA ODPISY TEGO SAMEGO PISMA. Za kazdym razem schodzi NOWE - nowa data,
    nowa

    pieczec, ta sama tresc. To jest procedura utrzymywania zadania przy zyciu, a nie

    powtarzanie sie urzedu. Dast opisuje to jako marnowanie jego reki.

    (c) I RZECZ NAJWAZNIEJSZA, KTORA MOWI JAKO NARZEKANIE: normalnie takie cos UMIERA.
    Pismo,

    na ktore nikt nie odpisuje, lezy tydzien i przestaje istniec. TO NIE UMIERA.

    DOKLADNIE TO POWIEDZIALA SERAPHINE W t_034: "prosba jednego czlowieka umarlaby
    na biurku

    po dwoch dniach - wiec za zadaniem stoi FOTEL, NIE CZLOWIEK", a rzecza do obserwowania

    jest "kto podpisze nastepne zadanie, na jakim szczeblu i jak szybko wroci, kiedy
    ona

    przewlecze je jeszcze raz". Lucan wlasnie dostal odczyt CZESTOTLIWOSCI i TRWALOSCI

    z drugiej strony biurka, od czlowieka, ktory nie ma pojecia, co mierzy.


    3. CZEGO DAST NIE PODAL I NIE PODA. Nazwiska podpisujacego. Szczebla. Urzedu ponad
    wlasnym

    pietrem. Nie wie, czego dotyczy sprawa cmentarna, nie wie, kto po stronie gildii
    sie opiera,

    i NIE ZROBIL zadnego polaczenia z "baba z gildii" z t_207. Wzruszyl ramionami
    w gore -

    "z gory przychodzi" - i to jest cala jego wiedza o kierunku.

    NARRATOR NIE ROZSTRZYGA, czy nie wie, czy nie mowi (retcon_000058: bez pliku nie
    ma

    ekspozycji; retcon_000040: NPC nie jest wyrocznia).


    4. PRZEDMIOT, KTORY LEZY NA BLACIE. Swiezo przepisany na czysto arkusz - ten sam,
    ktory

    Dast klepal dlonia w t_206 - lezy na biurku, osypany piaskiem i JUZ PRZYBITY,
    bo pieczec

    jest jego czescia roboty ("ja odpisuje i przybijam", t_206). Czeka na goncа.

    NARRATOR STAWIA GO W POLU WIDZENIA I NIC WIECEJ. Nie rozstrzyga, czy Lucan cokolwiek

    z niego odczytal, nie podaje tresci, nie podaje urzedu i NIE ORZEKA, CZY PIECZEC
    JEST TA

    SAMA CO NA GLEJCIE. To ostatnie jest wprost ZADANIEM SERAPHINE z t_036 ("weryfikacja
    przez

    porownanie pieczeci i klasy podpisu z tygodniem formalnych zadan") i pozostaje

    nierozstrzygniete. Zaden ruch gracza w te strone nie zostal zadeklarowany, wiec
    zaden

    nie zostal wykonany.


    5. FAKT MATERIALNY, KTORY OBOWIAZUJE I NIE JEST NOWY: item_watch_transport_permit
    ma

    w player/inventory.yaml location CARRIED. Lucan stoi na komendzie strazy miejskiej

    z kradzionym glejtem tej samej sluzby w kieszeni, pod falszywym imieniem.

    NARRATOR NIE ROBI Z TEGO ZAGROZENIA, ZEGARA ANI SCENY (retcon_000055). Nikt go
    nie

    przeszukuje, nikt nie ma powodu, nic tego nie testuje. Odnotowane, bo jest prawda
    stanu

    i wchodzi w kazda kolejna decyzje gracza.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie stworzyl podejrzenia u Dasta - pytanie o
    cudze

    narzekanie nie jest wscibstwem i nie ma w plikach nic, co kazaloby mu sie spiac.
    Nie

    wprowadzil nikogo do izby, nie postawil terminu, nie ruszyl zegarow, nie ujawnil
    zadnej

    listy i nie nazwal zadnego urzedu.


    7. STAN. Czwarty dzien interludium, 14:58, izba od ulicy w komendzie strazy miejskiej.

    Obecni: Lucan (jako Marc), Verek Dast. Integralnosc 19/19, energia bez wydatku
    w tej turze.

    Zapadnia pamieci NADAL UZBROJONA na npc_verek_dast, czeka na dotyk przy pozegnaniu.

    Skrzynka szkla przy nodze, zuk w kieszeni, glejt w kieszeni. W ksiedze nadal nic.

    '
