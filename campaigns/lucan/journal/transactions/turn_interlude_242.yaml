  prose: 'Kesz wysluchal wszystkiego i powiedzial, ze skarga zlozona przez gildie
    jest najlepsza rzecza, jaka Lucan zrobil w tej sprawie, i to bez wiedzy, ze ja
    robi - bo zostala zlozona ZANIM byla potrzebna, a takie pisma sa jedyne, ktorych
    nikt nie czyta jako zagrywki. Argument o papierach uznal za dobry i natychmiast
    pokazal jego drugi koniec: papiery, ktorych wlasciciel nie moze przyznac, nie
    sa papierami bez wlasciciela - one opisuja laboratoria, a laboratoria maja druga
    zainteresowana strone i nie jest nia garbarz. Potem rozdzielil dwa klucze, bo
    Lucan zlepil je w jeden: gildia trzyma TEREN i klasyfikacje zagrozenia, ale majatek
    zamrozilo MIASTO - i zeby kupic zaklad, trzeba obu, a nie jednego. O pieczeci
    powiedzial to, co powiedzial o sobie, zanim musial: nie chce byc czlowiekiem,
    ktory wie, gdzie ona jest. Wycenil natomiast obie drogi. Z pieczecia Lucan nie
    kupuje garbarni - staje sie jej dokumentacja, a dokument z data z tamtego okresu
    wchodzi prosto w rozliczenie, ktore ktos wlasnie prowadzi. Bez niej kupuje wolno
    i nikt tego potem nie rozplecie.'
  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero srebra.

    TRZY DZWIGNIE POLOZONE PRZEZ GRACZA, WSZYSTKIE PRZYJETE. Jedno pytanie z t_241

    zamkniete, jeden szew rozdzielony, jedna granica postawiona przez Kesza o sobie
    samym.


    1. PYTANIE "KTORY WLASCICIEL" - ZAMKNIETE. OBECNY (npc_tannery_owner). Zlecenie
    na

    eksploracje przyjete od niego, nigdy nieoplacone, a Lucan ZLOZYL NA TO FORMALNA
    SKARGE

    PRZEZ GILDIE. TO NIE JEST NOWA DEKLARACJA GRACZA, TO JEST KANON, ktorego narrator
    nie

    mial w aktywnym kontekscie w t_240 i t_241: inventory#item_tannery_owner_cache.two_open_debts

    mowi wprost "to WLASCICIEL wisi Lucanowi pieniadze za eksploracje i Lucan zlozyl
    na to

    formalne roszczenie przez gildie". Skutek: POZYCJA WIERZYCIELA, ktora Kesz wycenil

    w t_240 jako mozliwa, JUZ ISTNIEJE I JEST ZLOZONA - Lucan nie musi jej zakladac

    i nie ponosi kosztu z tannery-owner#the_claim_cuts_both_ways po raz drugi, bo
    pismo

    jest sprzed sprawy. Kesz nazwal to najlepsza rzecza w tej teczce: zlozone ZANIM
    bylo

    potrzebne, wiec nikt nie czyta go jako zagrywki.

    UWAGA DLUGU TECHNICZNEGO: inventory kieruje do objectives#tannery_owner_release_tripwire,

    ktory w state/objectives.yaml NIE ISTNIEJE - sierocy ref, raportowany przez preflight,

    nieblokujacy. Sama skarga jest kanonem niezaleznie od niego.


    2. NIEROSZCZALNOSC PAPIEROW - ARGUMENT PRZYJETY, BO JEST ODCZYTEM Z PLIKU. Wersja
    Lucana:

    znalazl je w smieciach, eksplorujac ruiny i laboratoria biomutantow. Argument:
    wlasciciel

    nie moze przyznac tych papierow, bo przyznalby, ze wiedzial o laboratoriach oznaczonych

    jako zagrozenie dla miasta. POKRYCIE W PLIKACH, nie retoryka:

    tannery-owner#why_he_was_detained (Lucan przekazal Seraphine dowody, ze wlasciciel

    WCZESNIEJ ZNAL SKALE ZAGROZENIA i probowal zlecic zniszczenie sladow),

    tannery-owner#what_he_refuses (odmawia powiedzenia, PO CO chcial papiery poprzednika,

    a zlecenie bylo sformulowane tak, zeby nie musiec tego mowic),

    inventory#item_tannery_owner_cache.why_it_matters_now (papiery dokumentuja nielegalna

    hodowle okazow pod garbarnia - komora, sluza, harmonogram karmienia).

    NARRATOR NIE STAWIL TEMU OPORU (retcon_000033) i nie wymyslil przeciwfaktu.

    DRUGI KONIEC, KTORY KESZ POKAZAL - I TO NIE JEST NOWY HAK (retcon_000058): nie
    powstala

    zadna lista, zaden swiadek i zaden zegar. Jest to sama tresc papierow, ktora juz
    jest

    w pliku: dokumentuja LABORATORIA. Papier, ktorego wlasciciel nie moze przyznac,
    nie

    staje sie przez to papierem bez zainteresowanych - druga zainteresowana strona
    wynika

    z KATEGORII dokumentu, nie z niczyjego spisu. Kesz nie nazwal zadnej instytucji
    po

    imieniu i narrator jej nie podlozyl.


    3. SZEW ROZDZIELONY: DWA KLUCZE, DWIE INSTYTUCJE. Gracz zadeklarowal, ze majatkiem

    zarzadza obecnie GILDIA. Pliki mowia co innego i mowia to dwa razy:

    tannery-owner#earlier_detention_history - "miasto ZAMROZILO CZESC MAJATKU", a
    gildia

    ZABEZPIECZYLA PODZIEMIA ekipa A-rank; inventory#forgery_intent.dlaczego_to_teraz_ciekawsze_niz_bylo

    - "miasto ROZLICZA jego majatek". Potwierdza to audyt t_234: garbarnia ewakuowana,

    ekipa A-rank do zamkniecia podziemi, miasto zamrozilo czesc majatku, npc_halven_rusk

    o wlos nie zginal pod szczuroogrem (milestone_020/021).

    ROZSTRZYGNIECIE NARRATORA - NAJMNIEJSZA MOZLIWA KOREKTA, ODDANA USTAMI POSTACI,
    KTOREJ

    JEST TO ZAWODOWYM OBOWIAZKIEM (retcon_000138 - cztery rejestry to nie jedna sciana):

    deklaracja gracza NIE zostala odrzucona ani przyjeta w calosci. GILDIA trzyma
    TEREN

    i klasyfikacje zagrozenia (to jest w plikach i to jest ta czesc, ktora gracz nazwal

    poprawnie); MIASTO trzyma zamrozony MAJATEK (to jest w plikach dwukrotnie). Zeby
    kupic

    zaklad, potrzebne sa OBA klucze. tannery-owner#current_situation zostawia otwarte,
    czy

    majatek NADAL jest zamrozony i czy brygadzista nadal prowadzi zaklad - to zostaje

    NIEUSTALONE i nikt tego w tej turze nie ustalil.

    JESLI GRACZ ZADEKLARUJE WPROST, ze gildia przejela takze zarzad majatkiem, jest
    to

    korekta kanonu do zapisania retconem - narrator NIE robi tego za niego i nie udaje,

    ze pliki tego nie mowia.


    4. PIECZEC - KESZ POSTAWIL GRANICE O SOBIE, NIE O SWIECIE. Lucan ujawnil, ze ma
    srebrna

    pieczec zakladu, ktora "zaginela" po katastrofie. Kesz powiedzial, zanim musial

    (speech_traits: states_his_position_before_he_has_to), ze nie chce byc czlowiekiem,

    ktory wie, gdzie ta pieczec jest. TO JEST JEGO WLASNA EKSPOZYCJA

    (portrayal#what_he_can_lose po stronie zawodowej, standing.consequence: nic powiedziane

    przy nim nie jest objete tajemnica zawodowa - on sam to Lucanowi powiedzial w
    t_104),

    NIE jest to sciana swiata ani odmowa prowadzenia sprawy. Sprawy nie odrzucil.

    WYCENIL DWIE DROGI, nie zabramkowal zadnej (speech_traits: wycenia, nie bramkuje):

    (a) Z PIECZECIA Lucan nie kupuje garbarni, tylko staje sie jej dokumentacja -
    a dokument

    opieczetowany z data z tamtego okresu wchodzi prosto w rozliczenie, ktore ktos
    wlasnie

    prowadzi. TO JEST DOSLOWNIE ZAPISANE W PLIKU:

    inventory#forgery_intent.dlaczego_to_teraz_ciekawsze_niz_bylo - "albo bardzo mocny,
    albo

    natychmiast podejrzany - zaleznie od tego, czy pasuje do audytu, ktory wlasnie
    ktos

    prowadzi. Narzedzie zyskalo ostrosc w obie strony". Narrator tego nie wymyslil.

    (b) BEZ PIECZECI kupuje wolno i nikt tego potem nie rozplecie.

    NIEUSTALONE BEZ ZMIAN: czy Lucan umie podrobic reke i jezyk dokumentu, czy tylko
    odcisk

    (inventory#forgery_intent.nieustalone). Zadna pieczec nie zostala uzyta i zadna
    nie

    opuscila zone_wall_void.


    5. CO JEST TERAZ WERSJA, A NIE PRAWDA. "Znalazlem je formalnie w smieciach" jest

    COVER STORY - dokladnie jedna z dwoch wersji, ktore

    inventory#item_three_arrow_deer_signet.if_it_surfaces.co_z_tego_wynika wprost
    Lucanowi

    przyznaje ("ma WOLNY WYBOR WERSJI: ze przedmiot jest z gildii, albo ze go znalazl").

    Prawda z plikow bez zmian i NIE NADPISANA (retcon_000120): papiery pochodza ze
    SKRYTKI

    i z MIESZKANIA obecnego wlasciciela, otwartych jego wlasnymi kluczami

    (tannery-owner#the_vault, #the_lodging). Wersja idzie do state/secrets.yaml#cover_stories

    z truth_status, do knowledge Kesza jako to, co uslyszal - i NIGDZIE indziej.


    6. CZEGO NARRATOR NIE ZROBIL. Nie wymyslil kwoty honorarium ani wartosci zakladu.

    Nie nazwal drugiej zainteresowanej strony po imieniu i nie zbudowal jej sledztwa

    (retcon_000058). Nie postawil zegara (retcon_000055). Nie wycenial trzeci raz
    pod rzad

    tego, co juz wycenione (retcon_000135) - ta tura zamyka jedno pytanie i rozdziela
    szew.

    Nie wypuscil niczego z forbidden_without_source [lucan_necromancy, spidey_existence,

    varkhen_existence, veyr_house_structure]; Spidey i Tkaczka caly czas ukryci.

    Nie podnosil kaplana ani kalendarza przesluchania (retcon_000142).


    7. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, 19:03. Obecni: Lucan,

    npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen w gildii.

    Sygnet u Lucana; pieczec, klucze i papiery NADAL w zone_wall_void baszty przy
    murze

    (trzy kwadranse marszu, t_086). Lucan 19/19, energia bez wydatku - czytac z pliku.

    Wyjscie pod trzecia pieczec nadal zaplanowane na dzisiejsza noc.

    '
  new_decision: 'Kesz czeka, ktory klucz ruszaja pierwszy: GILDIA, gdzie Lucan ma
    zlozona skarge i gdzie za trzy tygodnie stanie przed kierownictwem tej samej instytucji,
    czy MIASTO, gdzie zamrozony majatek i rejestr wlasnosci trzyma urzednik akt, ktorego
    nazwiska Lucan wciaz nie podal. Osobno czeka na jedno slowo o pieczeci - ma o
    niej nie wiedziec, czy ma wiedziec. I nadal bez odpowiedzi: czyja twarz kupuje
    zaklad.'
