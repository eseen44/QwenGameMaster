outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut,
    zero energii. 1. SPOTKANIE Z KAPLANEM PRZYJETE - I KESZ ODDAJE PILKE Z POWROTEM
    JEDNYM PYTANIEM PRAWNIKA. Nie pyta, po co Lucan chce tego czlowieka. Pyta, KIM
    Lucan ma tam siedziec, bo od tego zalezy wszystko, co potem da sie z tej rozmowy
    zrobic: czlonek Akademii na urlopie dziekanskim ma katedre i afiliacje (objective_prepare_institutional_defense#reactivate_the_dormant_academy_post),
    czlonek gildii ma jurysdykcje i sprawozdawczosc, a Veyr ma nazwisko, ktore w Lumarii
    otwiera i zamyka rownie szybko. Kazda z tych trzech osob prowadzi inna rozmowe
    i zostawia inny slad. Kesz przysle wiadomosc; odpowiedz ma miec przed spotkaniem,
    nie na nim. 2. NIE DODAJE - I OBAJ TO WIEDZA - ZE SAM MA W TYM INTERES. Kwadrans
    temu wyszlo na jaw, ze sciezka do tego kaplana biegnie przez pokoje, w ktorych
    Kesz bywal. Organizuje wiec spotkanie, ktore obsluguje dwie sprawy naraz, i zaden
    z nich tego nie nazywa. 3. PRYNCYPAL PRZYJMUJE OBIETNICE KANALU BEZ NACISKU I
    WYCENIA JA JEDNYM ZDANIEM. Nie zada terminu i nie targuje sie o nazwisko. Mowi
    tylko, na czym polega produkt: ostrzezenie, ktore przychodzi tego samego dnia
    co klopot, nie jest ostrzezeniem, tylko wiadomoscia. Kupuje WYPRZEDZENIE, i jesli
    Lucan przyniesie mu sygnal wart mniej niz doba, przyniesie mu nic. 4. RACHUNEK
    STANU NA WYJSCIU: pierwsza rata w kieszeni, dwie do odebrania, kanal ostrzegawczy
    obiecany i niezdefiniowany, spotkanie z kaplanem przyjete i nieumowione, droga
    po zakon mieczowy nierozstrzygnieta (gildia z papierem albo komendant Veyr bez
    sladu). 5. NA ZEWNATRZ JEST 16:30 I TARG SIE ZWIJA. Zaplecze pachnie ryba i mokrym
    drewnem, straganiarze skladaja kozly, slonce nisko. Mara stoi tam, gdzie stala,
    z lukiem na plecach i nozem z powrotem u pasa. 6. WORLD MOVE - MARA ODZYWA SIE
    PIERWSZY RAZ OD TRZECH GODZIN I ROBI TO W TRZECH RUCHACH. Najpierw oddaje zart
    sucho i bez wysilku - dlugi, owszem, i jeszcze nie jest wieczor. Potem mowi rzecz,
    ktora jest u niej forma lojalnosci, a nie unikiem: o Kosciol nie zapyta, bo woli
    nie musiec pozniej odpowiadac, czy wiedziala. To jest ta sama dyscyplina, ktora
    trzy godziny temu kazala jej milczec przy obcych, i ta sama, ktora kazala jej
    napisac urzednikowi prawde zamiast uzgadniac wersje. 7. A POTEM ZADAJE JEDYNE
    PYTANIE, KTORE FAKTYCZNIE JEST JEJ - I JEST OPERACYJNE, NIE MORALNE: co ma powiedziec
    Borosowi. Boros wypuscil szescdziesiat kilo z wlasnej piwnicy i nie bylo go w
    pokoju, kiedy to sprzedano; jego udzial idzie osobno, ze strony syndykatu, wiec
    dowie sie o zamknieciu sprawy albo od Lucana, albo od kogos obcego z pieniedzmi
    w rece. Mara nie sugeruje odpowiedzi. Pyta, bo to ona bedzie go widziala pierwsza.
    8. STAN. 16:30 dnia trzeciego. Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow.
    Przepustka nietknieta, Spidey nieodkryty, trening z Mara od jutra rana.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Co Lucan mowi Marze na ulicy - ile z ostatnich trzech godzin idzie
    do Borosa i czyimi ustami. W tle wisza dwie odpowiedzi, ktore ktos od niego odbierze:
    kim siada przy kaplanie (Akademia, gildia, Veyr) i jaki kanal ostrzegawczy dostanie
    syndykat.'
