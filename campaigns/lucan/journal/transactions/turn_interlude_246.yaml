  prose: 'Kesz nie zasmial sie z inhumacji i nie skrzywil - po prostu jej nie podjal.
    Powiedzial najpierw to, co u niego przychodzi zawsze pierwsze: ze Lucan wypowiedzial
    to na glos w pokoju, o ktorym on sam w dniu poznania uprzedzil, ze nie ma w nim
    zadnej tajemnicy, i ze on tego nie uslyszal - ostatni raz, kiedy moze tak powiedziec.
    Potem wybral z podanego menu, bo o to byl pytany. Nie zniknieciе. Personalia i
    to, czy tamten juz mowil. Uzasadnil rachunkiem, nie sumieniem: swiadek zywy i
    nieprzeczytany jest cichy, a swiadek martwy w celi gildii przestaje byc rysopisem
    i staje sie sprawa, ktora prowadzi wlasna kontrolerka Lucana, w swoim budynku,
    bez potrzeby dowodzenia czegokolwiek. Po Lucanie drugie nazwisko, ktore komukolwiek
    przyjdzie do glowy, jest nazwiskiem jego prawnika. Na pytanie, czy bawi sie sam,
    odpowiedzial, ze tym koncem rzemiosla nie zajmuje sie osobiscie i ze nie odpowiada
    za pokoj - moze tylko zaniesc pytanie, a pytanie o trupa w budynku gildii kosztuje
    wiecej, niz Lucan dzis dla nich zarabia. I dopisal jedna uwage, ktorej Lucan nie
    zamawial: czlowiek, ktory w jednym zdaniu mowi, ze manipuluje, a nie grozi, i
    w nastepnym proponuje pochowac kogos za zycia, nie opisuje metody - opisuje nastroj.'
  summary: 'Bez testu - interludium, roll_policy disabled. Piec minut, zero energii,
    zero srebra.

    MENU PODANE, KESZ WYBRAL. Zniecie odrzucone rachunkiem, nie moralnoscia. Nic nie

    wykonane: Halvek zostaje w celach gildii, nikt do niego nie idzie.


    1. NAJPIERW JEGO POZYCJA, JAK ZAWSZE ZANIM MUSIAL (speech_traits:

    states_his_position_before_he_has_to). Lucan zlozyl oferte usuniecia swiadka NA
    GLOS,

    w pokoju, o ktorym Kesz UPRZEDZIL GO SAM W t_104: standing.consequence - "nic

    powiedzianego przy nim teraz nie jest objete tajemnica zawodowa wobec Lucana".
    Kesz

    powiedzial wiec, ze tego nie uslyszal, i nazwal to ostatnim razem, kiedy moze
    tak

    powiedziec. NIE MORALIZOWAL (speech_traits zabraniaja wprost) i NIE ODRZUCIL SPRAWY.

    Zart o inhumacji przyjal nie-reakcja: zero ozdobnikow to jego rejestr.


    2. WYBRAL Z MENU, BO O TO BYL PYTANY (retcon_000135: brudny wybor - postac ma
    wybrac

    jedna opcje i nazwac ja po imieniu, nie wymyslac trzeciej czystej drogi i nie
    zamieniac

    odpowiedzi na liste warunkow). WYBOR: PERSONALIA plus odpowiedz, czy tamten juz
    mowil.

    NIE zniknięcie.

    UZASADNIENIE JEST RACHUNKIEM I MA POKRYCIE W CZTERECH REJESTRACH (retcon_000138):

    (a) KTO EGZEKWUJE: npc_halvek_wagonman siedzi w loc_guild_holding_cells, czyli

    w budynku gildii - na terenie npc_seraphine_vale, ktorej urzedem jest kontrola.

    (b) STANDARD DOWODOWY: trup w celi nie wymaga zadnego. Rysopis wymaga drugiej
    polowy;

    zwloki nie wymagaja niczego.

    (c) CENA Z ADRESEM: po Lucanie drugim nazwiskiem, ktore komukolwiek przychodzi
    do glowy,

    jest jego prawnik - a Kesz jest nim formalnie od t_199 i od t_241 takze w sprawie

    majatkowej.

    (d) TANSZA WERSJA TEGO SAMEGO ISTNIEJE I JEST W PLIKACH: swiadek zywy i nieprzeczytany

    jest cichy. halvek.yaml#prisoner_sourced_gate_guard_description pokazuje ten mechanizm

    na dzialajacym przykladzie - rysopis straznika od bramy podany w t_048/t_052 lezal

    BEZUZYTECZNIE do t_207, dopoki nazwisko nie przyszlo z innego zrodla (npc_ossek_marn
    od

    npc_verek_dast). Nie trzeba usuwac czlowieka, zeby uniewaznic rysopis; wystarczy,
    zeby

    nikt nie przyniosl drugiej polowy.

    Narrator NIE wymyslil zadnego z tych czterech elementow.


    3. "BAWISZ SIE SAM CZY POTRZEBUJESZ KONSULTACJI" - ODPOWIEDZ WPROST. Kesz powiedzial,

    ze tym koncem rzemiosla nie zajmuje sie osobiscie, i ze ZA POKOJ NIE ODPOWIADA
    - moze

    tylko zaniesc pytanie. NARRATOR NIE ZADEKLAROWAL ODPOWIEDZI PRYNCYPALA i nie wolno
    mu

    tego robic; Kesz podal wlasne OCZEKIWANIE, nie decyzje pokoju: pytanie o trupa
    w budynku

    gildii kosztuje wiecej, niz Lucan dzis dla nich zarabia. Ma to pokrycie w interesie,

    ktory juz jest w plikach - fact_weigher_has_a_stake_in_lucan_surviving (t_109:
    40 000

    srebra niewyplaconych, kategoria towaru kupiona pod termin Lucana, szescdziesiat
    kilo,

    ktore przez ten dom przeszlo) oraz syndicate-weigher#seraphines_reading_of_the_motive

    (syndykat kupuje przyszlosc terenu, a ta kalkulacja zaklada, ze po wszystkim NADAL

    ISTNIEJE miasto). standing.room_condition nienaruszone - pryncypal nadal nienazwany.


    4. UWAGA, KTOREJ LUCAN NIE ZAMAWIAL, I TO JEST JEDYNA RZECZ, KTORA KESZ DODAL
    Z SIEBIE.

    agenda#assess_whether_lucan_is_a_liability - to jest dokladnie ten moment i ta
    ocena.

    Lucan w jednym zdaniu powiedzial, ze MANIPULUJE, A NIE GROZI, bo to lepsze na
    dluzsza

    mete i bo swiadomosc nie pomaga - a w nastepnym zaproponowal pochowanie czlowieka
    za

    zycia. Kesz nazwal te niespojnosc: to nie jest opis metody, to opis nastroju.

    NIE JEST TO MORALIZOWANIE ANI MADROSC Z URZEDU (retcon_000040 - NPC nie jest madrzejszy

    od gracza z urzedu): jest to audyt zdania, ktore padlo trzydziesci sekund wczesniej,

    wykonany przez czlowieka, ktorego zawodem jest sprawdzanie, czy wersja klienta
    trzyma

    sie kupy. Kesz NIE wyciagnal z tego wniosku o Lucanie na glos i nie zmienil decyzji

    o prowadzeniu sprawy.


    5. DEKLARACJA METODY LUCANA - ZAPISANA, NIE OCENIONA. "Manipuluje zamiast grozic",

    "chujowy szlachcic, ale szlachcic, nie rzeznik", "urokiem tej metody jest to,
    ze

    swiadomosc nie pomaga". Jest to WYPOWIEDZ POSTACI DO POSTACI (retcon_000120) -
    idzie

    do knowledge Kesza jako to, co uslyszal, i NIE do player/abilities.yaml,

    player/character.yaml ani zadnego pliku opisujacego, jak Lucan naprawde dziala.

    Zapowiedz kolejnych takich prezentow rowniez: to intencja, nie wykonanie.


    6. CZEGO NARRATOR NIE ZROBIL. Nie rozstrzygnal, czy Halvek juz mowil i komu -

    NIEUSTALONE, last_confirmed_event_id nadal milestone_041, i to jest wciaz pytanie

    otwarte, teraz z obu stron. Nie odpowiedzial za pryncypala. Nie ruszyl Halveka,
    nie

    wyslal do niego nikogo, nie zmienil jego stanu ani lokacji. Nie domknal

    oren_connection - lucan_said_it_out_loud BEZ ZMIAN

    (said_obliquely_as_shared_interest_identity_still_unspoken); nie padlo imie Orena,

    zeznanie Halveka jako zrodlo ani rozbieznosc rysopisu (retcon_000122). Nie zbudowal

    zegara (retcon_000055), nie wymyslil sledztwa ani listy (retcon_000058), nie ruszyl

    zadnego z dwoch zegarow 3/15. Nie wypuscil niczego z forbidden_without_source

    [lucan_necromancy, spidey_existence, varkhen_existence, veyr_house_structure].

    Nie powtorzyl pytania o kaplana (retcon_000121, retcon_000142).


    7. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, drzwi uchylone, 19:26.

    Obecni: Lucan, npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen

    w gildii. npc_halvek_wagonman bez zmian: captured_alive, loc_guild_holding_cells.

    Sygnet u Lucana; pieczec, klucze i papiery w zone_wall_void baszty. Lucan 19/19,

    energia bez wydatku - czytac z pliku. Wyjscie pod trzecia pieczec nadal zaplanowane

    na dzisiejsza noc.

    UWAGA PROWADZENIA: scena scene_act_03_interlude_day4_evening_lawyers_back_room
    trwa

    od t_240, czyli siedem tur. SKILL-gramy kaze zamykac scene i rozmowe RAZEM najpozniej

    co 6-8 tur. Nastepna tura albo dwie sa dobrym miejscem na scene close.

    '
  new_decision: 'Kesz wybral: personalia i odpowiedz, czy tamten juz mowil - nie zniknięcie,
    i uzasadnil to rachunkiem, nie sumieniem. Czeka wiec na te dwie rzeczy i na jedno
    rozstrzygniecie: czy Lucan pytal go o opinie, czy oglaszal decyzje. Bez odpowiedzi
    nadal: co Lucan zrobi z kaplanem, nazwisko urzednika akt, termin papierow, udzial
    pokoju.'
