outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu (interludium, retcon_000022). Lucan zabiera ze schowka w murze
    30 srebra i zostawia piecdziesiatke; na targ wchodzi ze 64 przy pasie. Poranne
    przeszukanie rzedu skrybow, straganu ze starzyzna i zaplecza daje piec rzeczy,
    z ktorych DWIE sa wazniejsze niz cokolwiek, po co przyszedl. 1. TARG NIE MA KSIEGARNI
    - MA TRZY KANALY. Skrybowie nie trzymaja zapasu, trzymaja KATALOG TEGO, CO UMIEJA
    PRZEPISAC, i kolejke; przepisanie zachowuje wartosc instruktazowa (lore_magic_intuitive_and_procedural),
    wiec kazdy tytul jest osiagalny, tylko z terminem i z ZAPISEM ZAMOWIENIA. Stragan
    ze starzyzna sprzedaje ksiazki na wage i losowo - stad klasa "Necronomiconu dla
    biedoty". Zaplecze za straganami ma to, czego nie wystawia sie publicznie, i nie
    ma katalogu wcale. 2. KLATWY SA W NADMIARZE, BO SA LEGALNE. Klatwa jest w Lumarii
    sztuka obrzydliwa, ale dozwolona, wiec handel jest jawny. Znalezisko konkretne:
    "Uprzejmosci" - oprawiony zbior praktyka, napisany jako ksiega dworskich grzecznosci,
    w ktorym kazdy rozdzial o powitaniu, toascie i kondolencjach jest w rzeczywistosci
    procedura klatwy. Poziom wyzszy niz "Klatwy dla poczatkujacych", ktore Lucan juz
    ma. 12 srebra u skryby z odpisu, na miejscu. 3. POBOZNA POSTAWA JEST TOWAREM DEWOCYJNYM,
    NIE MAGIA. Aury "gleboko szlachetnego" nie ma w zadnym katalogu, bo to nie czar
    - ale przy straganach koscielnych leza tanie podreczniki postaw modlitewnych i
    zachowania przed obliczem, sprzedawane pielgrzymom. Ucza dokladnie tego, czego
    Lucan chcial: jak trzymac cialo i twarz, zeby czytano z nich pobozna powage. 2
    srebra, legalne, nudne, bez zapisu. Reszta tego kierunku - realny autorytet, nie
    poza - jest u ludzi, ktorzy szkola dzieci rodow, nie w ksiazkach. 4. SKRYBOWIE
    NIE SPRZEDAJA PRAWA, SPRZEDAJA FORMY - I TO JEST LEPSZE. Kodeksu nie ma w obiegu,
    siedzi w rejestrze magistratu i w Akademii. Za to ludzie, ktorzy pisza petycje
    na zycie, maja wlasne bruliony sformulowan, ktore PRZECHODZA na przesluchaniu,
    i odpisy odmow, ktore nie przeszly. Cztery srebra za odpis. Dla obrony przed kierownictwem
    gildii jest to warte wiecej niz traktat. 5. ZNALEZISKO PIERWSZE, NIEZAMOWIONE
    - ODBITKI AKADEMII NA STRAGANIE ZE STARZYZNA. Nadbitki i odpisy krazace po Lumarii
    traktuje sie jak makulature. Sa tam prace obu stron nadchodzacej dysputy: npc_ivar_kolm
    i npc_neris_aldhen, po 3 srebra sztuka. Lucan moze przeczytac wlasnego oponenta,
    jego definicje i jego ulubione argumenty, szesnascie dni przed tym, jak zostana
    skierowane w jego okazy - a Kolm nie wie nawet, ze bedzie mial kogo atakowac.
    6. ZNALEZISKO DRUGIE, NIEZAMOWIONE - LISTA ZYCZEN HANDLARZA STARZYZNA. Handlarz
    prowadzi spis tytulow, o ktore ludzie pytali i ktorych nie mial, zeby wiedziec,
    co odlozyc. Ten spis jest mapa amatorow w miescie: kto w Lumarii szuka tekstow
    okoloniekromantycznych, pod jakim opisem i jak czesto. Handlarz nie uwaza tego
    za tajemnice, uwaza to za ksiegowosc. 7. CZEGO NIE MA WCALE. Srodkow przeciw wykryciu
    nie ma w jawnym obiegu - to material Kosciola i Akademii, a jesli cokolwiek chodzi
    po targu, chodzi zapleczem. Rozszerzenia Geo poza cmentarz nie ma w zadnej ksiazce,
    bo to nie jest wiedza ksiazkowa; kamien czytaja zawodowo kamieniarze i STUDNIARZE,
    a studniarz w miescie z kanalami pod gildia jest tropem sam w sobie. Jedwabiu
    w skali ludzkiej tez nie ma w ksiazkach - to problem materialu, nie magii. 8.
    NIC NIE KUPIONE. Lucan przeszedl targ, obejrzal i wycenil. Zadna moneta jeszcze
    nie wyszla z sakiewki.'
