  summary: Seraphine przedstawia realne opcje Gildii dla współpracujących zatrzymanych.
    Gildia może utrzymać ich jako współpracujących świadków własnego postępowania
    i nie przekazywać straży bez osobnej decyzji kierownictwa; może też rozdzielić
    ich od siebie, zabezpieczyć przed kontaktem z dawną siatką i w raporcie wyraźnie
    odróżnić wiedzę oraz stopień udziału. W zamian za sprawdzalną pomoc może rekomendować
    złagodzenie odpowiedzialności i późniejszą pracę pod nadzorem, ale nie może obiecać
    immunitetu, uniewinnienia ani wolności przed przesłuchaniem. Odpowiedzi Lucana
    i Seraphine przekonują zatrzymanych, że przeżycie jest rzeczywiście elementem
    oferty, nie ukrytą groźbą.
  operations:
  - *id002
  new_decision: 'Ramy oferty są jasne: bezpieczeństwo w pieczy Gildii, rozdzielenie
    od siatki i rekomendacja łagodniejszego traktowania w zamian za sprawdzalną współpracę;
    bez gwarancji uniewinnienia. Halvek jest gotów podać opis spotkań Orena, jeśli
    Lucan wskaże, jakiej klasy informacji potrzebuje.'
