outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu. Slad autorstwa zaczyna istniec, a Lucan po raz pierwszy przyznaje
    przy Seraphine, ze cos od pajakow ODBIERA. 1. JEDNOSTKA ZAREJESTROWANA. Lucan
    podpisuje druk gildii: jego jednostka badawcza istnieje i pracuje, data dzisiejsza,
    zaden okaz nie wymieniony. Papier jest teraz starszy niz cokolwiek, co ktokolwiek
    zobaczy, a przypisanie przedmiotu zostaje na pozniej - dokladnie tak, jak wymaga
    plan wabika. Koszt: kolejna linijka z nazwiskiem Lucana w aktach gildii, przyjeta
    swiadomie. 2. ODPOWIEDZ NA PYTANIE O PAJAKA - CZESCIOWE UJAWNIENIE, NIE ZAPRZECZENIE.
    Lucan mowi, ze prostej odpowiedzi nie ma: pajaki to nie sokoly i na razie nadaja
    sie raczej do wykrywania zrodel ciepla niz do czytania listow. Seraphine czyta
    to poprawnie i mowi glosno - czyli oko, tylko slabe. Wie teraz, ze kanal ISTNIEJE
    i ze ma niska rozdzielczosc; nie wie, jak dziala ani czy dotyczy tez czegos wiekszego
    niz pajaki. 3. WYCENIA TO I BIERZE MIMO WSZYSTKO, ZE SWIADOMOSCIA WLASNEJ NIEKONSEKWENCJI.
    Cieplo w gabinecie to nie tresc pism, ale to KTO i KIEDY u niej byl, a akurat
    tego kontrolerka nie chce nikomu logowac. Zaraz jednak sama wskazuje, ze przed
    chwila zgodzila sie postawic w rogu siedmiostopowego swiadka z dzialajacym mozgiem
    i pamiecia, wiec pajak jest przy tym drobiazgiem. Zgoda zostaje w mocy. 4. AMBICJA
    POWIEDZIANA WPROST. Lucan przyznaje, ze chcialby kiedys doprowadzic pajaki do
    poziomu pelnych szpiegow. Seraphine nie robi z tego afery, ale zapisuje to sobie
    i mowi mu jedno zdanie ostrzezenia: takie zdanie, zacytowane na przesluchaniu,
    jest gorsze niz jakikolwiek pajak, ktorego mu pokaza. Ma tego nie mowic nikomu
    poza nia. 5. PUSTY POKOJ W PIWNICY. Po przeprowadzce Varkhena pomieszczenie czasowego
    zatrzymania stoi puste - zamykane, pod kontrola gildii, a rejestr wejsc prowadzi
    Seraphine. Wskazuje je jako mozliwy warsztat i od razu nazywa wade: pokoj na gorze
    jest przykrywka, ktora ma wytrzymac przeszukanie, a przeszukanie budynku, ktore
    znajdzie stol do szycia pajakow w piwnicy, jest gorsze niz brak przykrywki w ogole.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 120
  - *id002
  new_decision: 'Slad autorstwa istnieje, Varkhen stoi, alarm uzgodniony. Zostaje
    warsztat: pusta cela w piwnicy gildii (wygodna, ale pod tym samym dachem co przykrywka),
    basznia z nocnym urobkiem sieciarzy, albo miejsce, ktorego Lucan jeszcze nie nazwal.
    Do tego pajak alarmowy dla Seraphine jest pierwsza rzecza do uszycia albo nie
    - Lucan tego nie rozstrzygnal.'
