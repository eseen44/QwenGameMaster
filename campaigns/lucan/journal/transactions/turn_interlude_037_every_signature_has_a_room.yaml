  summary: 'Bez testu. Argument Lucana Seraphine przyjmuje - i to nie jest uprzejmosc,
    bo mechanizm

    jest poprawny. Ale zwrot do Spideya kosztuje wiecej niz caly argument zarobil.

    1. ARGUMENT: PRZYJETY, POTEM ZAWEZONY. Zgadza sie, ze decyzja ma podpis, podpis
    ma pokoj,

    a pokoj to ludzie - i ze Lucan naprawde ma dar do wkurzania ludzi, bo widziala
    to na

    Orenie i na Rusku. Ale wskazuje luke, ktora nie jest w mechanizmie, a w WYBORZE
    SKUTKU:

    prowokowany czlowiek robi glupote, tylko nie TWOJA glupote. Glupota dostepna czlowiekowi,

    ktory prowadzi urzad i poczul sie zagrozony, nie brzmi "popelnia blad, ktory da
    sie

    okrasc". Brzmi "zamyka teczke i zamyka czlowieka, ktory mnie zdenerwowal" - a
    takie ruchy

    robi sie personelem, nie osobiscie. Drugi wniosek, gorszy: podrazniony urzad nie
    produkuje

    rabowalnego bledu, produkuje PAPIER. A papier jest dokladnie tym, co Lucana zabija
    -

    seminarium, rejestr, akta.

    2. ODDAJE MU JEDNO MIEJSCE, GDZIE TEN DAR NAPRAWDE PLACI. Prowokacja dziala, kiedy

    prowokowany MUSI zareagowac publicznie, w wyznaczonym terminie i przy widowni,
    ktora widzi

    reakcje. Urzad zezwolen nie ma zadnego z tych trzech warunkow - moze milczec dowolnie

    dlugo i nie ma przed kim. Publiczna dyskusja na Akademii, o ktorej Lucan sam jej
    mowil, ma

    wszystkie trzy. To jest pokoj z lista ludzi i z zegarem, wiec tam dar dziala;
    w komendzie

    nie.

    3. I TU LUCAN LAMIE JEJ WLASNA REGULE, PRZY NIEJ. Pyta "prawda, Spidey?" na glos,
    a pod

    plaszczem przesuwa sie ciezar - krotki, wyrazny ruch w odpowiedzi na wlasne imie.
    Seraphine

    nie robi sceny; twardnieje. To ONA ustalila, ze okaz nie moze przy nikim reagowac
    na

    polecenie, bo konstrukt wykonuje, a slugi sluchaja, i ze roznica miedzy "ma dziwactwo"
    i

    "kontroluje nieumarlych" to jedno posluszne drgniecie. Mowi mu, ze wlasnie dostal
    to za

    darmo, bo trafil na najbezpieczniejsza widownie, jaka bedzie mial w zyciu, i ze
    drugi raz

    taniej nie bedzie.

    4. WIDOWNIA JEDNAK BYLA. Nocny urzednik stoi kilka krokow dalej z kluczami i patrzy
    na

    czlowieka, ktory pyta o zdanie wlasny plaszcz. Nie reaguje, nie zapisuje, nie
    ma powodu -

    po prostu zapamietuje dziwnosc, tak jak zapamietuje sie twarze. Seraphine wskazuje
    go

    ruchem brody i mowi, ze to jest wlasnie ten rodzaj swiadka, ktory nie zeznaje,
    dopoki ktos

    go nie zapyta.

    '
  new_decision: 'Seraphine przyjela mechanizm prowokacji i przyznala Lucanowi dar,
    ale zaweza go: urzad

    zezwolen moze milczec dowolnie dlugo i nie ma przed kim, wiec tam prowokacja produkuje

    papier i personel, nie rabowalny blad. Wskazala jedyny znany jej pokoj, gdzie
    ten dar

    placi - publiczna dyskusja na Akademii, bo tam ktos MUSI zareagowac publicznie
    i w

    terminie. Osobno: zwrot do Spideya na glos wywolal ruch pod plaszczem, czyli dokladnie
    to,

    czego jej wlasna regula zabrania, a przy drzwiach stal nocny urzednik z kluczami
    i to

    widzial. Sala jest zamykana, drzwi na gore otwarte, a Seraphine wciaz nie ma odpowiedzi
    na

    pytanie, co ma powiedziec rano sluzbom, jesli zapytaja ja wprost. Lucan idzie
    z nia na gore

    i ustala wersje, zalatwia najpierw urzednika przy drzwiach, konczy noc i idzie
    do baszty po

    urobek, czy robi cos innego?

    '
  operations:
  - *id002
