  prose: 'Kesz przyznal mu racje bez opierania sie: wpis o herbie, ktorego nie umie
    odczytac, jest wpisem o niczym - do dnia, w ktorym ktos inny ten herb odczyta,
    a wtedy wpis nagle dostaje date. Papiery kazal trzymac tam, gdzie leza. Powiedzial,
    ze dokument, o ktorym nie da sie powiedziec, skad jest, jest wart zero na papierze
    i wszystko poza papierem, wiec sluzy do USTALENIA nazwiska, nigdy do zlozenia.
    Nowa sprawe wzial. Nie targowal sie o pieniadze - powiedzial, ze pieniadze sa
    najmniejsza czescia tego rachunku, i podal warunek, ktory nie jest o pieniadzach:
    pokoj sie dowie, ze prowadzi dla Lucana sprawe majatkowa, bo staly klient nie
    dowiaduje sie takich rzeczy od kogos trzeciego. Potem zrobil to, co robi prawnik:
    rozdzielil dwoch wlascicieli i kazal Lucanowi powiedziec, ktory z nich jest jego
    dluznikiem, bo od tego zalezy cala droga. I odnotowal, czego nie uslyszal - nazwiska
    urzednika - bez pytania o nie drugi raz.'
  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero srebra.

    KESZ BIERZE SPRAWE. Jeden warunek, jedna instrukcja o papierach, jedno rozdzielenie

    dwoch wlascicieli, dwa pytania nadal bez odpowiedzi.


    1. EWIDENCJA - PUNKT LUCANA PRZYJETY, BEZ TARGU I BEZ ODWROTU. Lucan powiedzial,
    ze

    dobrze, ze Kesz zapisal pytanie, skoro nie wie, czyj to herb. Kesz zgodzil sie
    wprost:

    wpis o nieodczytanym herbie jest wpisem o niczym. DODAL WARUNEK, KTORY NIE JEST
    NOWYM

    ZEGAREM (retcon_000055) I NIE JEST NOWA EKSPOZYCJA (retcon_000058), tylko tym
    samym

    ryzykiem, ktore lead_signet_heraldry_research zapowiadal od poczatku: wpis nabiera

    znaczenia dopiero, jesli herb odczyta ktos inny - wtedy ma date. Zadnego terminu,
    zadnego

    licznika, zadnej nowej strony nie doszlo.

    KOREKTA retcon_000159 ZASTOSOWANA: Kesz mowi o ewidencji jako o wlasnej praktyce

    zawodowej i NIE cytuje doktryny Lucana z t_226 - to padlo u Seraphine, Kesza tam
    nie bylo.


    2. DOKUMENTY - LUCAN POTWIERDZIL ICH ISTNIENIE, NIE POCHODZENIE. Powiedzial "mam
    jakies

    dokumenty do tego" i tyle; faktycznie chodzi o item_tannery_owner_cache (akty
    wlasnosci,

    weksle, srebrna pieczec, dwa dalsze sygnety) w zone_wall_void Opuszczonej baszty
    przy

    murze, trzy kwadranse marszu (t_086). NIE POWIEDZIAL, SKAD JE MA, i Kesz NIE ZAPYTAL
    -

    fact_kesz_understood_the_category_without_asking (t_105b), t_200, t_240.

    INSTRUKCJA KESZA, wyprowadzona z tego samego rozumowania co tannery-owner#the_claim_cuts_both_ways:

    dokument, o ktorego pochodzeniu nie da sie zlozyc zdania, jest wart ZERO na papierze

    i wszystko POZA papierem. Sluzy do USTALENIA nazwiska z herbu przez porownanie
    odcisku

    - nigdy do zlozenia w postepowaniu. Papiery zostaja tam, gdzie leza.

    UWAGA DLA PRZYSZLYCH TUR: to jest DRUGA droga do tego samego porownania. Pierwsza
    to

    Seraphine z papierami garbarnika u siebie (zapowiedz t_234, wynik NIEROZSTRZYGNIETY).

    Rod NADAL NIEUSTALONY, heraldry_recognition zostaje attempted_and_failed.


    3. NOWA SPRAWA PRZYJETA, I TO JEST GLOWNA ZMIANA STANU. Lucan zlecil przejecie
    garbarni

    jako sprawe "troche kryminalna, troche prawna" i JAWNIE zadeklarowal, ze nie oczekuje

    pracy darmo. Kesz WZIAL. Decyduje sam i wolno mu - retcon_000124 uniewaznil wobec
    Lucana

    standing.declaration z t_104, wiec NIE odsyla do pryncypala po zgode.

    standing.fee ZERO dotyczylo i dotyczy WYLACZNIE dwoch pomieszczen (przesluchanie

    kierownictwa gildii, rozmowa ze Straza) i placi za nie pryncypal

    (fact_weigher_has_a_stake_in_lucan_surviving). Sprawa majatkowa jest POZA tym
    - pierwsza,

    ktora Lucan finansuje sam. Kwoty NIE USTALONO i narrator jej nie wymyslil; Kesz
    powiedzial

    tylko, ze pieniadze sa najmniejsza czescia tego rachunku.

    WARUNEK, KTORY POSTAWIL ZAMIAST CENY - to jego protect_the_room_first i jego

    standing.room_condition, nie uprzejmosc i nie nowa scianka: POKOJ SIE DOWIE, ze
    Kesz

    prowadzi dla Lucana sprawe majatkowa. Uzasadnienie zawodowe podane wprost: staly
    klient

    nie dowiaduje sie takich rzeczy od kogos trzeciego. NIE zazadal zgody pokoju i
    nie

    uzaleznil od niej przyjecia sprawy - informuje, nie pyta.

    CZEGO TO NIE ZNACZY: pryncypal NADAL NIENAZWANY po stronie Lucana, a pytanie "czyja
    twarz

    kupuje" z t_240 NIE zostalo tym zalatwione - poinformowanie pokoju to nie to samo,
    co

    wpuszczenie pokoju do transakcji.


    4. DWAJ WLASCICIELE ROZDZIELENI - PRZEZ KESZA, JAKO CZYNNOSC ZAWODOWA, NIE JAKO
    OPOR.

    Lucan opisal sprawe jako "dlug poprzedniego wlasciciela, ktory zniknal i ma otwarty
    proces

    o stwarzanie zagrozenia w miescie". W garbarni sa DWAJ wlasciciele i ta roznica
    jest cala

    trescia watku (planning/act-03-anticipated-shape.yaml#watek_garbarni_dwaj_wlasciciele,

    inventory#item_three_arrow_deer_signet.provenance - sygnet jest LACZNIKIEM miedzy
    nimi).

    Kesz rozdzielil ich i poprosil o jedno slowo potwierdzenia, bo od tego zalezy
    cala droga.

    STAN FAKTYCZNY Z PLIKOW, KTORY SIE NIE ZMIENIA: dluznikiem Lucana jest npc_tannery_owner,

    czyli WLASCICIEL OBECNY - to on zatrudnil Lucana przez gildie, obiecal pieniadze
    osobno

    poza premia i nie zaplacil (tannery-owner#the_unpaid_job). To takze on ma otwarte

    postepowanie i czesc majatku zamrozona przez miasto (tannery-owner#current_situation),

    i to on WYSZEDL z aresztu przy zachodniej straznicy w t_032, a miejsce pobytu
    ma

    nieustalone - loc_lumaria to miasto jako calosc. POPRZEDNI wlasciciel to osoba,
    ktorej

    papierow obecny szukal i po ktorej zostal sygnet; jego los, rod i nazwisko sa

    NIEUSTALONE i tannery-owner#do_not_invent zabrania ich wymyslania.

    NARRATOR NIE ROZSTRZYGNAL TEGO ZA GRACZA i nie potraktowal jego zdania jako korekty

    kanonu - poprosil o jedno slowo w scenie, ustami postaci, ktorej to jest zawodowym

    obowiazkiem (retcon_000135: zestawienie dwoch watkow o wspolnym obiekcie).


    5. PIERWSZY KROK ZAPROPONOWANY, NIE WYKONANY. Kesz nazwal czynnosc, ktora moze
    zrobic

    bez nazwiska urzednika: OBEJRZEC, NA JAKIM ETAPIE STOI AKTA SPRAWY GARBARNI w
    magistracie.

    Otwarte postepowanie znaczy, ze akta ISTNIEJA - to nie jest zadna nowa encja.
    Czytanie

    stanu sprawy to nie to samo, co ruszanie rejestru wlasnosci, i tylko to drugie
    wymaga

    urzednika akt. CENA NAZWANA PLASKO, JAKO FAKT, NIE JAKO GROZBA (retcon_000055:
    bez

    dramatyzowania): ktos zauwazy, ze prawnik pyta o garbarnie. NIE JEST TO WYKONANE
    - decyzja

    nalezy do gracza.


    6. DWA PYTANIA Z t_240 NADAL BEZ ODPOWIEDZI. Lucan nie podal nazwiska urzednika
    akt

    (ma je od t_238 - Malen Corth, od Ruska pod rozwiazaniem jezyka, t_096/097) i
    nie

    odpowiedzial, czyja twarz kupuje zaklad. Kesz odnotowal brak nazwiska JEDEN RAZ
    i NIE

    PYTAL DRUGI (retcon_000121: nie pytac trzeci raz o rzecz, o ktora sie juz pytalo);

    postawil natomiast granice zawodowa: bez nazwiska nie rusza rejestru.


    7. CZEGO NARRATOR NIE ZROBIL. Nie wymyslil kwoty honorarium. Nie wymyslil mechanizmu

    prawnego dajacego Lucanowi darmowe zwyciestwo ani sciany (retcon_000138 - kazde
    "nie"

    ma rejestr, adres, egzekutora i cene). Nie ruszyl zadnego zegara. Nie wypuscil
    niczego

    z forbidden_without_source [lucan_necromancy, spidey_existence, varkhen_existence,

    veyr_house_structure] - Spidey i Tkaczka caly czas ukryci. Nie podnosil kaplana,

    kalendarza przesluchania ani zadnego starego pytania NPC (retcon_000142). Nie
    wycenial

    po raz drugi tego, co wycenil w t_240 (retcon_000135: nie dwie tury wyceny pod
    rzad) -

    ta tura przyjmuje sprawe i rusza dalej.


    8. STAN. Czwarty dzien interludium, pokoj na zapleczu targu miejskiego, 18:55.

    Obecni: Lucan, npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen

    w gildii. Sygnet u Lucana. spy_cellar_spider_06 "Toby" w skrzynce w tej samej
    alejce

    od t_202. Lucan 19/19, energia bez wydatku - czytac z pliku. Zero srebra wydane.

    Wyjscie pod trzecia pieczec nadal zaplanowane na dzisiejsza noc.

    '
  new_decision: 'Kesz czeka na trzy rzeczy, w tej kolejnosci: KTORY WLASCICIEL jest
    dluznikiem Lucana (obecny czy zniknjety poprzednik - jedno slowo), CZY MA JUTRO
    OBEJRZEC ETAP AKT sprawy garbarni w magistracie wiedzac, ze ktos zauwazy pytanie,
    i NAZWISKO urzednika akt, bez ktorego rejestru nie ruszy. Osobno nadal otwarte:
    czyja twarz kupuje zaklad i czy Lucan sklada roszczenie wierzyciela.'
