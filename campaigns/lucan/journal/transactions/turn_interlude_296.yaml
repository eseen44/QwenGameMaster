  new_decision: 'Komora grobowa, przy przejsciu, 17:57, dzien piaty. SKLAD GOTOWY:
    osiem grobow otwartych, okolo szesnastu kilogramow metalu zlozone przy wejsciu.
    Zadnej rzeczy magicznej nie bylo - Geo przy kazdym otwarciu dawalo plaskie tlo.
    TO, CO ODKOPALI, JEST DROGA VARKHENA. Osuwisko z connection_varkhen_collapse to
    ta sama droga, ktora chodzil do dolnej bramy i ktora go stad wyniesiono (t_259).
    Schody sa jego. CO PODAL VARKHEN: (1) drogi nie umie podac w krokach, bo chodzil,
    a nie mierzyl - schodami w dol, potem jeszcze nizej, i tam jest brama, a przy
    bramie TRZECIA PIECZEC; (2) zna JEDNO pietro ponizej, o innych nie wie i nie zgaduje;
    (3) za jego czasow nic na tej drodze nie probowalo zabic, ALE wyniesiono go stamtad
    jako cialo, droga sie zasypala i mineły wieki - to pamiec, nie gwarancja; (4)
    brama byla zamknieta, jego rozkaz brzmial trzymac zamknieta, a co za nia lezy,
    pilnowal Z ROZKAZU, NIE Z WIEDZY. NAPRAWA: integrity 9,4/65, tlo cmentarza 0,8
    na dobe - OKOLO SIEDEMDZIESIECIU DOB do pelna. Varkhen powiedzial wprost, ze podlaczony
    bylby szybszy, i NIE POPROSIL. Racjonowanie jest decyzja Lucana (retcon_000113),
    wiec to zostaje otwarte po stronie gracza. OCENA LUCANA, NIE FAKT: ze Seraphine
    wybaczy wszystko pod ziemia, jesli zejscie bedzie drozne. t_269 mowi tylko, ze
    pod tym, co ekipa przywiezie, ma sie zgadzac to, co podpisala. Narrator tego nie
    potwierdza ani nie zaprzecza. OTWARTE: czy schodza teraz; czy Lucan podlacza Varkhena;
    czy wywoza sklad na gore najpierw. Rezerwa 14,6/15, do zmierzchu okolo dwoch godzin.'
