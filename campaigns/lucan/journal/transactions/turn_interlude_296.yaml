outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: "TO, CO WLASNIE ODKOPALI, JEST DROGA VARKHENA - i nie jest to zwrot akcji,\
    \ tylko odczytanie pliku. t_259: \"droga, ktora chodzil do dolnej bramy, to osuwisko,\
    \ ktorym go stad wyniesiono (connection_varkhen_collapse)\". Ekipa przebila sie\
    \ dzis dokladnie przez nie. Narrator ZESTAWIL DWA ISTNIEJACE FAKTY, nie wymyslil\
    \ trzeciego. ODPOWIEDZI VARKHENA - kazda ma zrodlo i kazda ma granice, ktorej\
    \ on sam pilnuje: (1) DROGA: zna ja, ale nie w miarach - jego rejestr to warta\
    \ i czyn, nie kroki\n  (voice_contract#register). Schody, ktore Lucan znalazl,\
    \ sa jego schodami.\n(2) PIETRA: podaje tylko to, co przechodzil. Ponizej komory\
    \ jest poziom z dolna brama.\n  Czy sa inne: NIE WIE i mowi to wprost (voice_contract#evasion\
    \ - kiedy nie wie, mowi nie wiem\n  i czeka). fact_varkhen_does_not_know_the_foundation_object\
    \ i t_259 juz raz pokazaly, ze nie\n  udaje wiedzy.\n(3) CZY COS ZABIJE: w jego\
    \ czasach na tej drodze nic nie probowalo - i natychmiast dokłada\n  warunek,\
    \ ktorego narrator NIE musial mu podpowiadac, bo stoi w t_259 i t_262: byl stad\n\
    \  wyniesiony jako CIALO, droga sie zasypala i mineły wieki. To jest pamiec, nie\
    \ gwarancja.\n  Dolna brama byla zamknieta i jego rozkaz brzmial: trzymac ja zamknieta.\
    \ Co jest za nia,\n  pilnowal Z ROZKAZU, NIE Z WIEDZY (t_259).\n(4) NAPRAWA: integrity\
    \ 9,4/65, tlo cmentarza daje 0,8 na dobe - czyli okolo 70 DOB do pelna.\n  Varkhen\
    \ nie podaje liczby, bo nie liczy w dobach; podaje to, co czuje, a liczbe wylicza\n\
    \  narrator z pliku dla gracza. Odpowiada wprost, ze podlaczenie byloby szybsze,\
    \ i NIE prosi -\n  retcon_000113 mowi, ze racjonowanie jest DECYZJA LUCANA, wiec\
    \ pilka zostaje po stronie gracza.\nDECYZJE LUCANA PRZYJETE BEZ OPORU (retcon_000033).\
    \ Jego ocena, ze Seraphine wybaczy wszystko pod ziemia, jesli zejscie bedzie drozne,\
    \ jest JEGO OCENA i tak zapisana - t_269 mowi tylko tyle, ze pod tym, co ekipa\
    \ przywiezie, ma sie zgadzac to, co podpisala. Narrator nie potwierdza tej oceny\
    \ i nie buduje z niej sledztwa (retcon_000055). SKLAD: okolo szesnastu kilogramow\
    \ z osmiu grobow, zlozone przy przejsciu. Skala trzymana z t_295 - okolo 2,5 kg\
    \ na trzy groby, wiec osiem daje mniej wiecej tyle. Zadnej rzeczy MAGICZNEJ nie\
    \ bylo; Geo prowadzone przy otwieraniu nie zlapalo nic poza plaskim tlem."
  prose: '— Murarka była po to, żeby dostać papier — mówi Lucan, kiedy Boros pyta,
    jak długo mają

    jeszcze udawać. — Papier mamy. Jesteśmy w środku. Reszta mnie nie obchodzi.


    Boros przyjmuje to bez jednego pytania, bo z jego punktu widzenia nic się nie
    zmieniło.


    — Bierzemy wszystko — dodaje Lucan. — Antyki wyrzucimy, jak znajdziemy coś lepszego
    albo

    jak skończą się worki. I powiem od razu: jak trafi się jakiekolwiek magiczne świństwo,

    to jest warte więcej niż złoto.


    — Ile mamy czasu? — pyta Mara.


    — Cały dzień. I całą noc.


    Przez następne dwie godziny nikt nie mówi nic ciekawego, bo nie ma o czym.


    Osiem płyt schodzi po kolei — te z najgrubszym licowaniem, wybierane z rzędu jak
    owoce

    z gałęzi. Boros podważa, Mara pakuje, Lucan trzyma rękę na murze przy każdym otwarciu

    i za każdym razem kamień mówi to samo, czyli nic. Metal idzie w płótno, płótno
    w worek,

    worek pod ścianę przy przejściu. Rośnie z tego kupka, którą Boros w pewnym momencie

    szacuje ręką i kwituje krótko:


    — Piętnaście, szesnaście kilo. Jak na osiem dziur, uczciwie.


    Magicznego świństwa nie ma. Ani jednego.


    W połowie tej roboty Lucan siada na płycie, opiera plecy o ścianę i sięga po linię,
    która

    nie niesie nic, i właśnie dlatego zawsze jest wolna.


    Varkhen odpowiada od razu. Leży dwieście kroków stąd i nie zmienia pozycji, bo
    nikt go

    o to nie prosił.


    — *Znalazłem schody.*


    — To moje schody.


    Przez moment nie ma nic więcej i to nie jest wykręt. On po prostu odpowiedział
    na pytanie,

    które padło.


    — *Jak głęboko do pieczęci?*


    — Nie umiem w krokach. Chodziłem tam, nie mierzyłem. — Pauza. — Schodzisz nimi,
    potem idzie

    się jeszcze w dół, i tam jest brama. Trzecia pieczęć jest przy bramie.


    — *Ile jeszcze pięter?*


    — Jedno, którym chodziłem. O innych nie wiem i nie będę zgadywał.


    — *Coś tam może chcieć mnie zabić?*


    Tu Varkhen myśli dłużej niż przy wszystkim innym, a potem mówi rzecz, którą mógłby

    przemilczeć.


    — Za moich czasów nic na tej drodze nie próbowało. — Pauza. — Ale mnie stamtąd
    wynieśli

    jako ciało, droga się zasypała i minęły wieki. Mówię ci, co pamiętam. To nie jest
    to samo,

    co mówić ci, co tam jest.


    I zaraz potem, bez pytania, bo to jedyna rzecz, którą wie na pewno:


    — Brama była zamknięta. Mój rozkaz brzmiał: ma być zamknięta. Co jest za nią,
    pilnowałem

    z rozkazu, nie z wiedzy.


    — *Naprawisz się sam?*


    — Naprawiam się. — Bez skargi i bez nacisku. — Powoli. Cmentarz daje tyle, ile
    daje,

    a mnie ubyło dużo. Podłączony byłbym szybszy.


    Nic więcej nie dodaje. Nie prosi, nie wraca do tematu i nie pyta, czy Lucan to
    zrobi.


    Lucan puszcza linię i przez chwilę siedzi jeszcze na płycie, licząc w głowie coś,
    czego

    Varkhen policzyć nie umie: dziewięć i cztery dziesiąte z sześćdziesięciu pięciu,
    po

    osiem dziesiątych na dobę.


    Siedemdziesiąt dni.


    Przy ścianie Boros zawiązuje siódmy worek.

    '
