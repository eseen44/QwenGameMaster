  summary: "Bez testu - interludium, roll_policy disabled, cel bez arkusza. Minuta.\n\
    KOSZT: 0,14 jednostki - 0,1 zlozone przy Spideyu, reszta oddana sieci.\nPierwszy\
    \ czar rzucony z cudzej pozycji w tej kampanii.\n\n1. ZASADA JEST NOWA, ARYTMETYKA\
    \ STARA. retcon_000131 przesuwa punkt odniesienia z ciala\nLucana na wezel, w\
    \ ktorym siedzi jego uwaga. Wszystkie liczby, ktore z tego wynikaja,\nbyly juz\
    \ w plikach i nic nie zostalo dorobione:\n- range_m 8 od Spideya, a Spidey jest\
    \ od Marna o kilka krokow. Warunek spelniony.\n- line_of_effect na Spideyu: widzi\
    \ go, nic miedzy nimi nie stoi. Spelniony.\n- koszt bazowy 0,1 (effects/numb.yaml#resource_cost),\
    \ sprawnosc lacza Lucan<->Spidey\n  70 procent na krotkim dystansie, jeden przeskok,\
    \ bez sieciarza posrodku.\n  0,1 / 0,7 = 0,1428..., naliczone 0,14. Reszta nie\
    \ \"przepada\" w sensie fabularnym -\n  jest strata przesylowa, dokladnie ta z\
    \ network_cost_model.\n- magical_trace: faint, POWSTAJE NA PODWORCU, nie pod frontowa\
    \ sciana. Na podworcu nie\n  ma nikogo, kto mialby czym go wyczuc. Przy Lucanie\
    \ nie powstaje nic, bo cantrip za\n  0,1 nie jest \"duzym przesylem\" (retcon_000131\
    \ punkt 3).\n- uwaga szeregowa (retcon_000100) obowiazuje: przez ten czas Lucan\
    \ JEST w Spideyu.\n  Ksiazka lezy mu na kolanach otwarta i nieczytana.\n\n2. CO\
    \ ROBI JEDEN STACK - I TO JEST DOKLADNIE TYLE, ILE MOWI PLIK. effect_numb, jeden\n\
    stack: mobility -5, coordination -7, prog 1 = IMPAIRED. NIE \"immobilized\" -\
    \ to jest prog 4\ni wymaga czterech stackow. Narrator nie awansuje jednego stacka\
    \ na obezwladnienie.\nALE SYTUACJA DOKLADA RESZTE I NIE JEST TO NARRATORSKA HOJNOSC:\
    \ cel ma cztery godziny piwa,\nstoi na nierownym klepisku przy stosie drewna,\
    \ ma zajete rece i jest w polowie czynnosci,\nktorej sie nie przerywa z gracja.\
    \ Impaired na takim czlowieku znaczy, ze noga ucieka.\nKOLANA IDA. Marn siada\
    \ ciezko, bokiem, ramieniem w stos drewna, ktory sie osypuje.\nSika przy tym dalej,\
    \ bo tego akurat nic nie zatrzymalo. Klnie - krotko, z zaskoczeniem,\nnie ze strachem.\n\
    PRECYZJA CELOWANIA W KOLANA JEST W KANONIE, nie dodana: minor_hex ma limit\n\"\
    does_not_selectively_disable_one_limb\" WLASNIE jako przeciwstawienie do numb\n\
    (abilities.yaml#ability_minor_hex.limits: less_precise_than_numb).\n\n3. CZEGO\
    \ MARN NIE WIE - I PLIK MOWI TO WPROST. effect_numb#visibility:\nmundane_target_usually_identifies_curse:\
    \ false. On nie szuka przyczyny magicznej, bo nie\nma powodu jej szukac i nie\
    \ ma czym. Ma za to gotowe wytlumaczenie, ktore sam sobie poda\ni ktore jest calkowicie\
    \ rozsadne: cztery godziny przy dzbanku. NARRATOR NIE ROZSTRZYGA,\nczy sie zawstydzi,\
    \ rozzlosci czy rozesmieje - to sie rozstrzygnie w scenie, jesli scena\nbedzie.\
    \ do_not_play na jego karcie obowiazuje: nie jest ani swiadkiem do zlamania, ani\n\
    czlowiekiem spisku.\n\n4. CZY KTOS SLYSZAL. Osypujace sie drewno robi halas. W\
    \ izbie pije sie od poludnia\ni jest glosno, tylne drzwi sa uchylone, nie otwarte.\
    \ NIKT NIE WYSZEDL i narrator NIE\nSTAWIA NA TO ZEGARA ANI ODLICZANIA - nie jest\
    \ ustalone, ze ktos przyjdzie, i nie jest\nustalone, ze nie przyjdzie. Jest ustalone\
    \ tylko to, ze przez te minute nikt nie wyszedl.\nZaden zegar kampanii nie drgnal\
    \ poza uplywem czasu.\n\n5. CO TA TURA OTWIERA. Na podworcu siedzi na ziemi czlowiek,\
    \ ktorego Lucan szukal od\nt_052, sam, mokry, z osypanym drewnem i z noga, ktora\
    \ go nie sluchа. Nie jest ranny.\nNie jest w niebezpieczenstwie. Jest w sytuacji,\
    \ w ktorej pomoc obcego czlowieka jest\nnajzwyczajniejsza rzecza pod sloncem -\
    \ i w ktorej sam z siebie nikogo nie zawola.\nNARRATOR NIE MOWI, ZE O TO CHODZILO,\
    \ i nie wykonuje za gracza zadnego nastepnego ruchu.\n\n6. CZEGO NARRATOR TU NIE\
    \ ZROBIL. Nie dodal zadnego kosztu poza 0,14 (retcon_000015).\nNie zrobil z rzucania\
    \ przez wezel niczego droższego, wolniejszego ani mniej pewnego, niz\nwynika z\
    \ zasady, ktora ustanowil gracz - nie jest rola narratora obudowywac cudza korekte\n\
    kanonu zastrzezeniami wymyslonymi po fakcie. Nie zauwazyl Spideya nikim. Nie stworzyl\n\
    swiadka, sladu ani podejrzenia.\n\n7. STAN. Czwarty dzien interludium, Lucan pod\
    \ frontowa sciana szynku, \"Uprzejmosci\"\notwarte i nieczytane, Tkacz przy nodze.\
    \ Spidey na podworcu, kilka krokow od celu.\nIntegralnosc 19/19. Energia po odjeciu\
    \ 0,14 i po regeneracji - czytac z pliku.\nOssek Marn na ziemi przy rozsypanym\
    \ stosie drewna, condition_numb_impaired jeden stack.\nGodzine czytac ze state/time.yaml\
    \ po commicie.\n"
