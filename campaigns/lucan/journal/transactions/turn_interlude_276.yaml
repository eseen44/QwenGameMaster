          podniosl rezerwe z 12 na 15. 15 jest nowa baza I NOWYM PROGIEM, nie stanem
          przeciazenia; dawna dwunastka nie ma zadnych skutkow ubocznych - patrz retcon_000004
          i retcon_000019.
        campaign_calibration: true
        decision_status: approved
        runtime:
          regeneration_elapsed_seconds: 3460
        regeneration:
          interval_seconds: 3600
          units: 0.75
          requires:
          - living
          note: 'PODNIESIONE Z 0,25 NA 0,75 PRZEZ retcon_000141. Rozklad: 0,25 na
            godzine to wlasna regeneracja Lucana (6,0 na dobe, retcon_000045), a 0,50
            na godzine to DOWOZONA NADWYZKA SIECI (12,0 na dobe po stratach propagacji),
            ktora wedle retcon_000109 i retcon_000115 nalezala mu sie od 31.08.2026
            i nie byla naliczana przez nic w silniku - w state/sustained-links.yaml
            nie istnialo ani jedno lacze skierowane DO pc_lucan. Formy lacza tu nie
            uzyto swiadomie: process_sustained_links wymaga zrodla bedacego istniejaca
            instancja i DEBETUJE jej pule, a foragingowa ekonomia wezlow nie jest
            w runtime symulowana w ogole - prowadzi ja recznie state/growth-banks.yaml.
            Strumien jest wiec zapisany tam, gdzie silnik go widzi. LUCAN MA PRIORYTET
            NAD WSZYSTKIMI WEZLAMI (deklaracja gracza 03.09.2026, to jego siec): dopoki
            rezerwa nie stoi przy sufcie, nadwyzka idzie w nia. Po sufcie ten sam
            strumien schodzi drabina z growth-banks#distribution_priority - najpierw
            wlasny growth_bank Lucana, potem okazy ZAKOTWICZONE, na koncu pozostale.
            Varkhen zostaje poza rozdzialem, racjonowany osobno (retcon_000113). ZMIANA
            2026-09-11 (retcon_000167): 3,5 na dobe do zuka 01 JUZ NIE WYCHODZI -
            lacze link_lucan_hand_charges_beetle_01 wylaczone jako zbedne, bo nisza
            pod polnocnym fundamentem pokrywa caly sufit zuka. Netto przy pustej rezerwie:
            +18,0 na dobe.'
