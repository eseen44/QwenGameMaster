outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: unchanged
  perspective: pc_lucan
  summary: 'ROZSTRZYGNIETO ZGODNIE Z DEKLARACJA, bez oporu i bez przeciwfaktow (retcon_000033).
    (1) Kot i kos wygaszeni, oba ciala na kupie za murem - tam, gdzie w t_274 poszedl
    golab. Zdejmuje to z blatu jedyny material ssaczy, wiec ruling_mammal_upkeep_numbers
    traci dzisiejszego adresata i zostaje otwarty na przyszlosc; intent_take_the_fur_problem_and_the_vessel_to_the_father
    traci konkretny przedmiot pytania, samo pytanie o futro u nieumarlego ssaka zostaje.
    ZADNEJ decyzji o naczyniu ani o ojcu ta tura nie podejmuje - gracz jej nie zadeklarowal.
    (2) Rozkaz dla trzech szczurow: wylacznie kanaly pod garbarnia. Byly tam juz od
    t_273 (retcon_000171), wiec jest to ZAWEZENIE swobody, nie przemieszczenie - stawki
    w growth-banks bez zmian, bo daily-balance liczy zer, a nie zasieg. (3) "Odeslanie
    wszystkich na posterunki" wychodzi w wiekszosci na potwierdzenie stanu - network_roster
    z briefu pokazuje kazdy okaz na swoim miejscu. Dwa wyjatki podane graczowi jawnie:
    spy_hawk_moth_01 ma rozkaz zeru z t_274, ale nie poleci przed zmierzchem (proza
    t_274, w dzien jest wielkosci dloni), a spy_cellar_spider_05 stoi w wejsciu baszty
    z basis "czeka na rotacje" - jedyne wolne stanowisko w sieci. (4) Przemieszczenie:
    baszta - gildia, 45 minut zmierzone w t_086, plus ok. 5 minut przy kupie i rozkazach.
    Spidey i Tkacz ida luzem, dystans wg deklaracji gracza; trasa wysoka Spideya wynika
    z jego karty (t_133 - sam wybiera stanowisko, nie chodzi dwa razy ta sama droga),
    posterunek dachowy Tkaczki z locations/lumaria-guild#zone_guild_rooftop i jej
    growth basis "poluje luzem przy Lucanie w gildii". (5) ODCZYT SIECI podany graczowi
    z plikow, nie z pamieci: rezerwa 15/15 przy sufcie, nadwyzka sieci 22,3 na dobe,
    wszystkie lacza podtrzymujace NIEAKTYWNE (sustained-links), wiec deficytu nie
    ma. Bank Lucana 0,0 i taki zostaje - retcon_000151 mowi, ze rosnie WYLACZNIE z
    wysysania zywych, a nadmiar przy pelnej rezerwie wyparowuje. Zaden okaz nie jest
    blisko pierwszego szczebla (prog 10); najwyzej stoi zawisak z 3,75, ktory po t_274
    ma rate_per_day 0,0 i przestal rosnac. NIEUSTALONE: po co Lucan przyszedl do gildii.
    Zaleglosc rejestru wzrostu (growth_settle, okno 0,53 doby od t_235) rozliczana
    osobno, poza fikcja.'
  prose: 'Kot przestaje siedzieć.


    Nie pada i nie przewraca się - po prostu przestaje trzymać pion, jakby ktoś wyjął

    z niego jedną deskę. Ogon rozplata się z łap, bok osuwa na blat, a łeb zostaje
    jeszcze

    przez pół uderzenia serca w tej samej pozycji, bo kark był akurat oparty. To nie
    jest

    śmierć. Śmierć ten kot ma za sobą od wczorajszego wieczoru i nikt w tej izbie
    nie wie,

    z czyjej ręki. To jest wyłącznie koniec tego, że coś w nim stało.


    Kos jest krótszy. Skrzydło zatrzymuje się w połowie ruchu i opada.


    Za próg idą razem, po jednym w każdej ręce, i lądują na kupie przy murze, na gołębiu

    z wczoraj. Z góry kot wygląda dokładnie tak, jak wygląda kot, którego ktoś wyrzucił.


    Rozkaz dla szczurów idzie w dół i jest krótki, bo nie ma w nim nic do zrozumienia:

    kanały pod garbarnią i nigdzie indziej. Trzy odpowiedzi wracają jedna po drugiej,
    jak

    trzy kamyki wrzucone do tej samej studni. Trzeci wraca wolniej, bo trzeci wszystko

    robi wolniej.


    Reszta rozkazu nie ma komu iść. Żuki stukają po śmietnikach tam, gdzie je postawiono,

    pająki siedzą w niszach, wije mapują kanały od piętnastu dni bez ani jednej przerwy,

    osa żeruje na łąkach. Sieć jest już rozstawiona i nowy rozkaz odbija się od niej
    jak

    pukanie do otwartych drzwi. Dwie rzeczy wystają. Zawisak siedzi przy koszu i nie
    ruszy

    się stąd przed zmierzchem, bo w dzień jest zjawiskiem wielkości dłoni. A w wejściu

    baszty siedzi pająk, któremu nikt nigdy nie powiedział, na co ma czekać.


    Potem trzy kwadranse pod murem.


    Ranek piątego dnia jest jasny i już ciepły, a miasto o tej porze pachnie dymem
    z pieca

    chlebowego i tym, czego nikt nie wyniósł na noc. Spidey idzie górą. Nie pytany
    i nie

    kierowany - wybiera mur, potem rynnę, potem krawędź dachu, i ani razu nie schodzi
    na

    ulicę tam, gdzie ulica jest prosta. Pięćdziesiąt kroków w tym mieście znaczy dokładnie

    tyle, co pozwala zakręt, więc przez połowę drogi Lucan go po prostu nie widzi
    i wie

    o nim tylko tyle, ile idzie linią. Tkacz trzyma się niżej, rynsztokiem, i trzyma
    się

    bliżej, niż jej kazano - za to między nią a Spideyem jest przez całą drogę dokładnie

    tyle dystansu, ile da się zmieścić w wąskiej uliczce.


    Po drodze Lucan sprawdza, co ma. To nie jest liczenie, to jest to samo, co przeciągnięcie

    dłonią po rzędzie słoików: pełny brzmi inaczej niż pusty. Własna rezerwa stoi
    przy

    suficie i stoi tam od wczorajszego wieczoru, a sieć dowozi więcej, niż jest gdzie

    włożyć - to, co nad tym, nie idzie nigdzie i nie robi nic. Niżej wszystko jest
    młode.

    Dwadzieścia kilka zbiorników, które zbierają od kilku dni i wszystkie będą zbierać

    jeszcze długo, zanim którykolwiek będzie czymś więcej niż tym, czym został zrobiony.

    Najbliżej był zawisak - i przestał się ruszać z miejsca dokładnie wtedy, kiedy
    zszedł

    z kosza na własny nektar. Utrzymuje się sam. Wyłącznie sam.


    Gildia o wpół do ósmej wygląda jak każdy budynek, w którym pracuje się od świtu.

    Okienko recepcji jest odbite z deski i otwarte, w sali głównej stoi czterech ludzi

    z wczorajszym błotem na butach, a ktoś na górze przesuwa po podłodze coś ciężkiego.

    Nikt nie podnosi głowy, kiedy Lucan wchodzi, bo Lucan tu mieszka.


    Tkacz wchodzi po ścianie na dach, zanim drzwi zdążą się zamknąć. Spidey zostaje

    na zewnątrz i przez chwilę nie ma go nigdzie.

    '
