outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu. Seraphine odwraca sposob przenosin Varkhena i przyjmuje ostrzejsza
    wersje prosby o pokoj, ale nazywa jej wade. 1. VARKHEN IDZIE SAM, NIE W SKRZYNI.
    Seraphine odrzuca wariant transportowy wlasnym argumentem z tego samego wieczoru:
    skrzynia tej wagi wymaga dwoch tragarzy, a tragarz jest swiadkiem, ktory nie zeznaje,
    dopoki ktos go nie zapyta. Zamiast tego Varkhen ma wejsc na gore o wlasnych silach
    tylnymi schodami, raz, przy pustym korytarzu, i od tej chwili nie ruszyc sie nigdy
    wiecej. Rozkaz musi wydac Lucan - ona nie ma czym go wydac, wiez jest jego. Przyznaje
    tez, czego NIE poradzi: dopoki uklad jest dobrowolny, panuje nad sytuacja papierami;
    w chwili gdy przestanie byc dobrowolny, ona nie jest strona, ktora go zatrzyma.
    Chce miec sposob, zeby dosiegnac Lucana szybko. 2. POKOJ JAKO PRZYKRYWKA - PRZYJETE,
    Z JEDNYM WARUNKIEM. Lozko dyzurne spelnia oba kryteria, o ktore Lucan prosi: wlascicielem
    jest Gildia (nudny), pokoj nie ma zwiazku z zadnym otwartym postepowaniem, a przeszukanie
    go niczego nie da. Seraphine przydziela pokoj na korytarzu, ktory sam podlega,
    wpisuje Lucana na caly okres interludium zamiast noc po nocy i bierze na siebie
    rote sprzatania. Wada, ktora nazywa wprost: przykrywka, w ktorej nikt nigdy nie
    spi, przestaje byc przykrywka przy drugim sprawdzeniu. Ktos musi ten pokoj czasem
    zuzywac - albo Lucan, albo nikt, i wtedy pusty pokoj sam jest zeznaniem. 3. MA
    JESZCZE JEDNA RZECZ DO ZAOFEROWANIA. Na zdanie Lucana, ze skoro nic wiecej nie
    moze pomoc, to idzie szyc, odpowiada, ze moze - i wskazuje slad autorstwa. Papier
    o jednostce badawczej i przynaleznosci okazu da sie zaczac dzis, na wlasnych drukach
    gildii, i musi byc STARSZY niz cokolwiek, co ktokolwiek zobaczy. Kwerenda o obsadzie
    polnocno-zachodniej zapory ma dac odpowiedz w dzien albo dwa. 4. LUCAN WYCHODZI.
    Zostaje z tym, ze jedyny pokoj, ktory wlasnie sobie zalatwil, jest z zalozenia
    pokojem do przeszukania - czyli ostatnim miejscem w miescie, w ktorym mozna szyc
    drugiego pajaka.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 120
  - *id002
  new_decision: 'Seraphine czeka na rozkaz dla Varkhena (wejscie po tylnych schodach
    przed koncem jej dyzuru) i na decyzje, czy zaczyna dzis papier o autorstwie. Lucan
    ma pokoj-przykrywke w Gildii, ale nie ma warsztatu: musi wskazac miejsce, w ktorym
    faktycznie usiadzie do drugiego pajaka, i material, z ktorego go zacznie.'
