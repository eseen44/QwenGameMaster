  summary: 'Bez testu - zamkniecie rozmowy, piec minut, zero energii. Zagrywka gracza
    laduje w calosci

    (retcon_000033). Ostatnia tura sceny na dziedzincu Akademii.


    1. OBIE RZECZY NIEUSTALONE DOSTAJA KSZTALT, I ZADNA NIE JEST TERMINEM NARZUCONYM
    PRZEZ SWIAT.

    "Nie dzis" zamienia sie w KOLEJNOSC: targ jutro rano, potem introligatornia, potem
    Neris.

    Neris przestaje wiec czekac na nieokreslone i zaczyna czekac na konkretny etap.
    Zadnego zegara

    to nie uruchamia - nikt nikogo nie sciga, sam Lucan wyznaczyl tempo.


    2. PLAN TARGOWY JEST ZADANIEM INTERLUDIUM, NIE FAKTEM. Lucan idzie sprawdzic,
    czy ktos przepisze

    i oprawi tom i NA KIEDY - czyli wykonawca, cena i termin sa nieznane i maja byc
    ustalone

    w fikcji, nie zalozone. Nie przesadzac z gory, ze rzemieslnik sie znajdzie ani
    ze odmowi.


    3. UWAGA DLA CIAGLOSCI - TARG TO TO SAMO MIEJSCE, CO WATEK HESKA. objective_interlude_investigations

    trzyma krok follow_book_market_livery_courier_to_high_houses, a t_083 podal, ze
    chlopiec w liverii

    zjawia sie u Heska za osiem dni od tamtej tury. Poranna wizyta na targu jest wiec
    OKAZJA do

    zahaczenia o ten watek, ale gracz jej nie zadeklarowal. Nie doklejac Heska do
    wyjscia po

    introligatora bez decyzji gracza.


    4. KOLEJKA PO INTROLIGATORNI - ZART, KTORY NERIS BIERZE O TAKT ZA POZNO. Powiedziane
    z usmiechem;

    ona czyta ludzi zle (portrayal.the_social_gap), wiec najpierw przyjmuje to jako
    informacje

    porzadkowa, a dopiero potem slyszy, ze byla to zaczepka. Nie robic z niej osoby
    bez poczucia

    humoru - robic osobe, ktora reaguje z opoznieniem i sama to wie.


    5. ONA NIE IDZIE SPAC I POWIEDZIALA TO WPROST TURE WCZESNIEJ. Wraca do skrzydla
    pod rusztowaniem

    poprawiac czesc trzecia przed pierwszym swiatlem (t_173). Lucan wychodzi brama.
    Rozejscie jest

    zwyczajne, bez sceny.


    6. CO ZOSTAJE OTWARTE PO TEJ SCENIE. Czy balwierz wchodzi do tekstu Neris i pod
    jakim nazwaniem

    (nierozstrzygniete, obiecana rozmowa PO tym, jak przeczyta). Wykonawca kopii i
    termin. Wizyta

    u dziekana wciaz niewykonana. Sygnatura - Neris nadal jej nie ma, choc teraz przestala
    byc

    problemem, bo tom sam do niej przyjdzie.


    7. STAN. Wieczor dnia trzeciego, brama Akademii, 19:42. Energia 11,6/15, integralnosc
    19 z 19,

    bez warunkow. Zegary bez ruchu. Zadeklarowany przez gracza w nawiasie kolejny
    ruch - marsz do

    baszty i przeglad sluzb - jest INTENCJA zapisana w planning/lucan-leads.yaml,
    a nie czynnoscia

    wykonana: to widoczne przemieszczenie i wymaga deklaracji poza nawiasem (retcon_000060).

    '
  new_decision: Scena na dziedzincu domknieta. Lucan wychodzi brama Akademii o 19:42
    z zapowiedziana na jutro rano wizyta na targu i z zadeklarowanym w nawiasie zamiarem
    przejscia do baszty przy murze, zeby zrobic przeglad sluzb. Nastepna scena zaczyna
    sie od tego marszu - trzy kwadranse - i od tego, co Lucan zastanie na miejscu.
