outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  location_id: loc_lumaria_magical_academy
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Lucan uzyl przeciw ojcu jego wlasnego argumentu i to zadzialalo
    od razu -

    na "kilka zajmie mi wiecej niz trzy dni" ojciec nie protestuje, bo sam powiedzial,
    ze

    jeden okaz to anekdota. Seria wymaga czasu, wiec czas sie znajdzie. Zegar pokazu

    przestawiony z trzech dni na osiem (clock_father_arranges_academy_showing threshold

    3 -> 8), co miesci sie w tygodniu-dwoch, o ktore Lucanowi chodzilo.

    MATERIAL - odpowiedz jest podzielona na trzy i tylko jedna czesc jest dobra.

    Zbiory Akademii sa dostepne od zaraz, ale okazy w nich sa UTRWALONE - spirytus,

    suszenie, preparaty. Do przeszczepu nie nadaja sie wcale, bo utrwalona tkanka
    nie

    przewodzi; sa natomiast swietne jako referencja i jako czesci "mechaniczne" do

    obudowy wabika.

    Swiezy material idzie stala dostawa zywego towaru - najblizsza za jakies siedem
    dni.

    To dokladnie okno konferencyjne, wiec noga Spideya i wabik lapia sie w ten sam
    termin.

    Trzecia czesc Lucan ma juz za darmo - nocny urobek sieciarzy. Pajaki piwniczne,
    osy,

    chrzaszcze, stonogi. Za male na odnoze dla Spideya, ale w zupelnosci wystarczajace

    jako ciala dla malych okazow serii.

    ODBITKA - ojciec ja znalazl, pod czyms zielonym, dokladnie tam gdzie mowil. Tekst

    jest caly. Okladki nie ma - zostala kiedys wydarta i uzyta jako zakladka do czegos

    innego, wiec nazwiska autora nie ma nigdzie na tym, co ojciec trzyma w rece. Sam

    autor tez mu z glowy nie wraca. Wie natomiast, gdzie ta osoba pracuje - i wie,
    ze

    dzis jej tu nie ma. Poza jednym oknem w skrzydle laboratoryjnym caly budynek jest

    wygaszony; Akademia jest pusta.

    Czyli spotkanie "teraz" nie istnieje. Najwczesniej jutro - i tu sa dwie drogi.
    Ojciec

    moze zaprowadzic albo napisac slowo, co jest szybkie i sprawia, ze sprawa od razu

    staje sie oficjalna i akademicka. Albo Lucan zna tekst i miejsce pracy, wiec moze

    podejsc sam, na wlasnych warunkach, tak jak wszedl - bez sladu.

    '
  new_decision: 'Termin odzyskany, material rozpisany, odbitka w rece, nazwiska brak.
    Autor bedzie

    tu jutro. Lucan bierze odbitke i czyta ja dzis w nocy, prosi ojca o slowo albo

    wprowadzenie na jutro, planuje podejsc do autora sam i bez sladu, czy zamyka wieczor

    i wraca do baszty po urobek, zeby zaczac od cial na male okazy?

    '
  operations:
  - *id002
