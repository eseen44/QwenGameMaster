  - *id002
  summary: 'Bez testu - trzy i pol godziny, piec jednostek energii. Pierwsza godzina
    cwiczen z Mara

    Teln i pierwsza kalibracja wzmocnienia miesni. Deklaracje gracza laduja w calosci.


    1. POKOJ: PAPIERY ZOSTAJA, CZUJNIK WRACA. Rzeczy przywiezione z baszty leza teraz

    w pokoju dyzurnym, nie na Lucanie: atlasy anatomiczne balwierza, jego brulion
    podreczny,

    odpis brulionu formul prawnych i dwie akademickie odbitki (Kolm, Aldhen). Tom
    biblioteczny

    z sygnatura tez tam zostaje - i tak ma wrocic przez bibliotekarza (obligation_return_

    borrowed_academy_volume). "Uprzejmosci" zostaja przy nim, bo nikt tego nie zadeklarowal

    inaczej; ksiazka jest w Lumarii legalna. spy_cellar_spider_04 wraca z zaulkow
    na swoj

    stary posterunek czujnika przeszukania w tym pokoju - to ten sam okaz, ktory t_180
    stamtad

    zdjal. CENA JEST ZNANA I MALA: posterunek z zadaniem i dostepnym zerem wychodzi
    na 0,0 na

    dobe (retcon_000105), wiec generowana nadwyzka sieci spada 17,5 -> 16,5. Odwolanie
    bylo

    darmowe i natychmiastowe - pajak byl po drugiej stronie sciany.


    2. WZMOCNIENIE MIESNI DZIALA DOKLADNIE TAK, JAK GRACZ ZALOZYL - I PLIK TO POTWIERDZA

    BEZ DOPISYWANIA NICZEGO. ability_vital_overdrive ma w abilities.yaml demonstrated_effects:

    temporary_physical_force_increase oraz temporary_speed_increase, klase pierwszego
    poziomu,

    koszt 1 i czas trwania one_brief_burst. Nogi daja wiec jednorazowy sus, rece jednorazowy

    przyrost sily. Trzy rzuty w tej sesji: dwa w nogi, jeden w rece.


    3. GDZIE PADA CIALO - TO TEZ NIE JEST WYMYSLONE. Limit no_durability_bonus stoi
    w pliku

    wprost: czar podnosi site i szybkosc, NIE podnosi wytrzymalosci tkanki. Sciegno,
    wiezadlo

    i przyczep dostaja obciazenie z miesnia, ktory nagle pracuje ponad wlasna klase,
    i nie

    dostaja nic w zamian. Drugi limit, repeated_use_accumulates_bodily_strain, mowi
    to samo

    o powtarzaniu. Zaden plik nie podaje LICZBY - ile susow do zerwania, jaki prog
    - i narrator

    jej nie wymysla. To jest kierunek do zadeklarowania przez gracza, jesli ma byc
    mierzalny.


    4. SAMOLECZENIE: NAZWA GRACZA JEST NIETRAFNA I TO MA SKUTKI PRAKTYCZNE. ability_basic_

    self_repair nazywa sie "Podstawy samoleczenia energia zycia" i ma w limitach not_

    regeneration. To NIE jest auto-regeneracja - to rzut, ktory kosztuje 1 jednostke
    i zalatwia

    jedno lekkie uszkodzenie albo jeden krok umiarkowanego, jest bolesny, wymaga zgromadzonej

    energii i cannot_restore_missing_tissue. Nie ma wersji pasywnej, nie tyka w tle
    i nie chroni

    przed niczym z gory. Roznica jest istotna dla planowania: kazde powtorzenie petli

    wzmocnienie -> naciagniecie -> zalatanie kosztuje 1+1 jednostki, nie 1.


    5. RACHUNEK SESJI. 3 x vital_overdrive + 2 x basic_self_repair = 5 jednostek.
    Rezerwa

    14,35 -> 9,35, plus regeneracja w trakcie. Jedno naciagniecie zostaje niezalatane
    -

    prawy bark, po rzucie w rece - i jest o jeden rzut od zniknięcia; nie niesie ze
    soba

    zadnego modyfikatora i nie jest warunkiem w state. To jest CALE realne ograniczenie
    tego

    treningu i jest zasobowe, nie fabularne: nie ma nikogo, kto by przeszkadzal, ani
    terminu,

    ktory by gonil. Uboczny skutek: bilans rezerwy Lucana nie dobija dzis sufitu ok.
    10:30,

    jak zakladal wpis w growth-banks.yaml - naliczanie w jego wlasny rozwoj przesuwa
    sie

    o mniej wiecej dobe.


    6. MARA JEST TRENEREM, ZANIM JEST CZYMKOLWIEK INNYM. Karta: quiet, observant,

    dry_humor_when_safe, zwiadowczyni i strzelczyni. Ma to w agendzie jako train_lucan_each_

    morning i przyszla, bo obiecala. Jej zawodowa uwaga do tego, co zobaczyla, jest
    oczywista

    i nie jest oporem narratora: czar daje site bez wytrzymalosci, wiec Lucan skacze
    dalej,

    niz uniesie jego wlasne sciegno, i lata to potem magia. Trener widzi w tym droge
    do

    kalectwa i mowi to raz, bez ciagniecia tematu.


    7. JEJ WLASNY RUCH - I MA PODSTAWE W PLIKU, NIE W POMYSLE NARRATORA. mara-teln.yaml

    trzyma suspicion_lucan_controls_varkhen i suspicion_lucan_has_remote_necromantic_support,

    obie na confidence: medium, oraz fakt fact_mara_saw_varkhen_weaken_during_lucans_contact
    -

    widziala, jak Varkhen slabnie przy bezposrednim kontakcie magicznym Lucana i nie
    zna

    mechanizmu. Dzis pierwszy raz od tamtego dnia widzi, jak Lucan robi magie na zywym
    ciele,

    z bliska i przez trzy godziny. Pyta wiec o jedna rzecz, waska: czy to jest to
    samo, co

    wtedy w sarkofagu. Nie oskarza i nie eskaluje - na ulicy po pokoju powroznika
    sama

    powiedziala, ze o Kosciol NIE zapyta, bo woli nie musiec pozniej odpowiadac, czy
    wiedziala

    (t_113). Tu pyta, bo to dotyczy ciala, ktore ma trenowac. Odpowiedz Lucana nalezy
    do gracza.


    8. STAN. Czwarty dzien interludium, 10:00, glowna sala gildii. Energia po sesji
    9,35

    plus regeneracja, integralnosc 19/19, bez warunkow. Zegary bez ruchu poza uplywem
    czasu.

    Zaden termin nie powstal. Poranek zachowal obie swoje rzeczy: targ po introligatora

    i rozmowa, ktora Mara wlasnie zaczela.'
  new_decision: Mara stoi w drzwiach gildii, ociera rece i pyta o Varkhena - waska,
    konkretna wersja pytania, ktore nosi od sarkofagu. Co Lucan jej odpowiada, i czy
    poranek idzie dalej na targ po introligatora?
