  - *id002
  summary: 'Bez testu - piec minut rozmowy, zero energii. Odpowiedz gracza laduje
    w calosci i USTANAWIA

    KANON MECHANIZMU, ktorego dotad nie bylo nigdzie zapisanego. Mara dostaje odpowiedz,
    ktorej

    sama zazadala.


    1. NOWY KANON - JAK TO DZIALA (player_declaration 2026-09-01, przyjete bez zmian).

    Lucan kieruje SILA ZYCIOWA, nie "leczy" w sensie kaplanskim. Trzy poziomy precyzji
    podane

    przez gracza: (a) WLASNA - dokladnie; (b) CUDZA - z trudnoscia; (c) na ZYWYCH
    nie probowal

    wcale. Osobna kategoria to NIE-MARTWI: tam sila juz sie ciala nie trzyma, cialo
    jedzie na

    oparach, a sama sila przestala byc jego i SZUKA KOGOS, KTO MOZE JA PRZYJAC. To
    jest pierwsze

    spojne wyjasnienie mechanizmu ability_direct_drain i tlumaczy wstecz

    fact_mara_saw_varkhen_weaken_during_lucans_contact: Varkhen nie byl "wysysany"
    wbrew sobie

    jak zywy czlowiek - jego sila byla juz luzna, a Lucan byl jedynym w zasiegu, kto
    mogl ja

    przyjac. Nie dopisywac z tego, ze dziala to na kazdym nieumarlym z automatu ani
    ze Varkhen

    nie moze tego zauwazyc; gracz powiedzial tyle, ile powiedzial.


    2. GOJENIE - MECHANIZM, TEZ Z DEKLARACJI GRACZA. Nikt w tym swiecie nie wie dokladnie,
    jak

    dziala cialo i czym jest gojenie. Lucan nie zastepuje wiec procesu - WYMUSZA go:
    kaze

    kawalkowi siebie goic sie tu i teraz, choćby nie wiem co. Dzwignia jest WIEDZOWA,
    nie

    energetyczna: dobra anatomia i szkolne badanie samego procesu mowia mu, GDZIE
    nacisnac,

    zeby cialo zrobilo to, czego on chce. To domyka nazwe z abilities.yaml - "Podstawy

    samoleczenia energia zycia" z limitem not_regeneration - i wyjasnia, dlaczego
    jest bolesne

    i dlaczego cannot_restore_missing_tissue: mozna przyspieszyc proces, ktory cialo
    i tak umie,

    nie mozna kazac mu zrobic czegos, czego nie umie wcale.


    3. TO JEST DOKLADNIE TA RZECZ, KTORA U MARY BUDUJE ZAUFANIE - I PLIK TO MOWI WPROST.

    rel_mara_to_lucan ma w constraints "concern_about_unexplained_magic", a jej najnizsza
    os to

    discretion_trust: 40. Cala dotychczasowa historia tej osi to trzy wpisy i wszystkie
    trzy sa

    tym samym ruchem: Lucan powiedzial jej cos SAM, zanim musial (t_011 relikwiarz,
    t_102 kazal

    napisac prawde, t_103 uprzedzil o zmianie stawki poreczenia). Dzis zrobil to czwarty
    raz,

    na pytanie, ktore mogl zbyc. discretion_trust 40 -> 45, personal_regard 35 ->
    40.

    Magia przestala byc "unexplained" - to zdejmuje polowe tego constraintu.


    4. CZEGO MARA NIE ROBI I DLACZEGO. Nie sklada zadnej obietnicy. Jej karta ma

    forbidden_without_source: [varkhen_future_offer, inquisition_conversation, voluntary_agreement]
    -

    a "obiecuje, ze nikomu nie powiem" jest voluntary_agreement i wymagaloby osobnego
    zrodla.

    Nie grozi tez niczym: leverage.held_by_subject = knowledge_of_varkhen_assault_and_visible_weakening

    MIALA JUZ WCZESNIEJ, od milestone_045. Dzis ta sama dzwignia stala sie OSTRZEJSZA
    (wie nie

    tylko CO widziala, ale CZEMU tak wygladalo), i to jest jedyna realna zmiana po
    jej stronie.

    Nie robic z tego zegara ani zagrozenia - zaden plik nie stawia tu terminu (retcon_000055).


    5. CO ONA DAJE W ZAMIAN - I JEST TO JEJ WLASNA DOMENA, NIE UPRZEJMOSC NARRATORA.

    Lucan powiedzial "nikt nie wie, jak dziala gojenie". Zwiadowczyni, ktora opatrywala
    rany

    w polu, wie o gojeniu rzeczy, ktorych nie ma w atlasie balwierza - nie teorie,
    tylko co po

    czym nastepuje i kiedy jest za pozno. To jest material do jego wlasnego badania
    i jest

    darmowy. Nie rozstrzygam, ile dokladnie ma do powiedzenia; to jest do wyciagniecia

    deklaracja gracza, nie ekspozycja narratora (retcon_000058).


    6. OTWARTE PYTANIE, KTORE POWSTALO SAMO I NIE JEST TERMINEM.

    obligation_conditional_risk_disclosure_to_seraphine mowi: ujawnic Seraphine nowe
    ryzyko

    materialne, ktorego potrzebuje do zapewniania oslony. Mara wiedziala juz wczesniej,
    wiec

    NIE POWSTAL nowy swiadek - powstal swiadek, ktory rozumie, co widzial. Czy to
    jest "nowe

    ryzyko materialne", rozstrzyga gracz. Narrator tego nie odpala sam i nie robi
    z tego zegara.


    7. STAN. Czwarty dzien interludium, 10:05, przed drzwiami gildii. Energia 10,35/15
    plus

    regeneracja, integralnosc 19/19, bez warunkow. Zegary bez ruchu poza uplywem czasu.
    Zaden

    termin nie powstal. Poranek nadal ma targ po introligatora, a Mara nadal stoi
    obok.'
  new_decision: Mara przyjela odpowiedz i nie obiecala niczego - ale ma wlasna, polowa
    wiedze o gojeniu i wlasnie dala do zrozumienia, ze moze ja oddac. Lucan wyciaga
    to z niej teraz, idzie na targ po introligatora, czy robi obie rzeczy po drodze?
