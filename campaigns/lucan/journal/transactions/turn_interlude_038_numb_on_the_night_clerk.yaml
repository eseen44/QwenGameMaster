  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez rzutu - zwykly czlowiek bez karty, wiec rozstrzygniecie narracyjne.
    Znik DZIALA, ale

    robi to, co znik robi, a nie to, o co Lucan poprosil, i placi za to trzykrotnie.

    1. SKUTEK FIZYCZNY. Urzednik nie krzyczy i nie pada teatralnie. Klucze wysuwaja
    mu sie z

    palcow, kolana ida do przodu i osuwa sie na najblizszy stol - zywy, oddychajacy,

    bezwladny. Nie zamknie sali, nie zgasi reszty lamp, nie zapisze konca dyzuru.
    Rano

    wstanie z migrena, ktora Lucan zaplanowal.

    2. CZEGO ZNIK NIE ROBI - i to jest cala wada planu. Numb tlumi mieszniowo-nerwowo,
    NIE

    kasuje pamieci; do mieszania w decyzjach jest Confusion, ktory wymaga ciaglego
    kontaktu

    wzrokowego, jest widoczny i kosztuje 3. Urzednik nie obudzi sie wiec z pytaniem
    "jak sie

    tu znalazlem". Obudzi sie z ostatnim obrazem, jaki mial przed oczami: Veyr przy
    stole w

    glownej sali, o ktorym plotka mowi cmentarz, pytajacy o zdanie wlasny plaszcz.
    Luka jest

    w czasie, nie w rozpoznaniu.

    3. KOSZT MECHANICZNY I SLAD. Overcharged numb to 1,5 energii (13,5 -> 12,0) i
    slad SILNY -

    z profilu tej zdolnosci: wariant wzmocniony jest wolny, glosny i nieekonomiczny.
    Rzucony

    cztery kroki od antymagicznej kontrolerki gildii w pieczeciach ochronnych. Zeszlo
    mu przy

    tym ponizej progu 12, wiec warunek elevated_energy_signature_above_old_threshold
    gasnie -

    jedyna dobra wiadomosc tej minuty, kupiona najglosniejszym mozliwym sposobem.

    4. SERAPHINE. Nie sieganie po rapier, nie krzyk. Zatrzymuje sie w pol kroku, patrzy
    na

    osuniete cialo, potem na Lucana, i mowi mu, co on wlasnie zrobil z jej wieczorem.
    Byl

    swiadek, ktory nie zeznaje, dopoki ktos go nie zapyta - a ona wlasnie tak go nazwala,

    minute temu, po to zeby Lucan wiedzial, ze nie musi z nim nic robic. Teraz nie
    ma swiadka,

    jest INCYDENT: pracownik gildii znaleziony bezwladny na stanowisku, z dziura w
    koncu

    dyzuru, w budynku, w noc, ktora ma date i liste obecnych. Swiadka trzeba zapytac.
    Incydent

    zglasza sie sam. A sprawdzanie takich rzeczy w tym budynku to jej wlasna kompetencja
    -

    czyli albo bedzie to prowadzic, albo bedzie musiala zakopac cos, na co patrzyla.

    Drugi raz w ciagu kwadransu przeszla z "wie" na "widziala i przemilczala", i tym
    razem

    bez zadnego zysku dla siebie.

    5. NA "SPIDEY BEDZIE SLAWNY" nie odpowiada zartem. Mowi, ze wlasnie o tym mowi
    caly wieczor

    - slawa okazu jest planem OJCA i planem Akademii, nie Lucana, i ze wybor jest
    miedzy tym,

    zeby byla ona projektowana, a tym, zeby byla przypadkowa.

    Pytanie o rano zostaje bez odpowiedzi, ale zmienilo tresc: nie chodzi juz o glejt.

    '
  new_decision: 'Urzednik lezy bezwladny na stole, klucze na podlodze, sala niezamknieta,
    reszta lamp pali

    sie dalej. Zyje i obudzi sie z migrena, ale znik nie kasuje pamieci - ostatnie,
    co widzial,

    to Lucan przy stole. Energia 13,5 -> 12,0, slad silny, rzucony przy antymagicznej

    kontrolerce gildii; warunek podwyzszonej sygnatury zgasl. Seraphine nie krzyczy
    - nazywa

    koszt: byl swiadek, ktory milczy, dopoki go nie zapytaja, a jest incydent, ktory
    zglasza

    sie sam, i sprawdzanie takich rzeczy w gildii to jej kompetencja. Pytanie o rano
    wciaz

    otwarte, tylko dotyczy teraz czegos innego. Lucan idzie z nia na gore ustalic
    fakty, robi

    cos z lezacym urzednikiem (przeniesienie, upozorowanie, dokonczenie zamykania
    sali za

    niego), wychodzi z budynku zanim ktokolwiek go tu zobaczy, czy cos innego?

    '
