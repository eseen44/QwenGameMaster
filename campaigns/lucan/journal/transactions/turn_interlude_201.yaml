  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero wydane.

    Talerzyki wypelnione. Kanal przestaje byc urzadzeniem i staje sie harmonogramem.


    1. CZTERY FAZY, TAK JAK JE PODAL GRACZ, BEZ NICZEGO DODANEGO.

    (1) STAN OBECNY - obowiazuje od teraz, wiec pajak startuje na pierwszym talerzyku.

    (2) WSZYSTKIE STRONY SWIADOME - koniec przesluchan, powiadomieni rycerze w lsniacych

    zbrojach, Akademia, Kosciol i tak dalej.

    (3) KORDON dookola cmentarza.

    (4) WEJSCIE grupy badawczo-uderzeniowej na cmentarz.

    Miedzy (2) a scisla kontrola okolicy Lucan zaklada DZIEN, DWA.


    2. TO JEST SZACUNEK LUCANA, A NIE ZEGAR - I NARRATOR GO ZEGAREM NIE ROBI. "Dzien,
    dwa"

    padlo jako jego wlasne oszacowanie podane kontrahentowi. Nie tworze z tego wpisu
    w

    state/clocks.yaml, nie wiaze tego z zadna data i nie zapowiadam, ze cokolwiek
    nastapi

    w tym oknie. Zaden plik nie stawia terminu ani przesluchaniu gildii, ani dyspucie
    -

    clock_guild_leadership_hearing i clock_father_arranges_academy_showing stoja na
    3/15

    i nie sa tu ruszane. Fazy sa WYZWALANE RECZNIE przez Lucana, nie przez uplyw czasu:

    urzadzeniem jest pajak, a wyzwalaczem palec Lucana.


    3. NIC ZAKAZANEGO NIE PADLO I TO JEST WAZNE, BO LATWO BYLOBY TU PRZECIEC.

    Wszystkie cztery fazy opisuja REAKCJE INSTYTUCJI, a nie przyczyne. Lucan ani razu
    nie

    mowi, co jest pod cmentarzem, dlaczego mialby tam wejsc oddzial ani czego szuka.
    To jest

    ta sama dyscyplina co w t_110 (nazwal ISTNIENIE wiekszego problemu z cmentarzem,
    nie jego

    tresc) i w t_194 (rama dla kaplana brzmi "to, co jest pod cmentarzem" i Kesz niesie
    ja,

    nie znajac zawartosci). forbidden_without_source obu obecnych - varkhen_existence,

    seals_and_lower_gate u pryncypala, spidey_existence i lucan_necromancy u obu -
    pozostaje

    NIENARUSZONE i narrator niczego z tego nie odslania.

    Dla pryncypala nie jest to zreszta nowa kategoria, tylko harmonogram do kategorii,
    ktora

    juz ma: fact_weigher_knows_a_bigger_cemetery_problem_exists (t_110).


    4. KTORY TALERZYK JEST NAPRAWDE TOWAREM - I PRYNCYPAL LICZY TO NA GLOS, BO TO
    JEST

    DOSLOWNIE JEGO FACH. Nie poprawia Lucana i niczego nie przestawia; potwierdza
    konstrukcje

    i wskazuje, gdzie w niej siedzi to, za co zaplacil. Kordon (3) i wejscie (4) sa
    dla niego

    BEZUZYTECZNE jako ostrzezenia - kiedy wokol cmentarza stoi kordon, nie ma juz
    czego

    wywozic i nie ma tam po co jechac. Doba, o ktora prosil w t_113, mieszka wylacznie
    w

    TALERZYKU DRUGIM, bo po nim ma - wedlug szacunku Lucana - dzien albo dwa, zanim

    ktokolwiek zacznie kontrolowac okolice. Trzeci i czwarty sa dla niego potwierdzeniem,

    ze mial racje, ze sie wyniosl; drugi jest produktem.

    TO NIE JEST NPC MADRZEJSZY OD GRACZA (retcon_000040) - gracz zaprojektowal to
    dokladnie

    tak i wprost powiedzial, ze od drugiego liczy sie dzien, dwa. Pryncypal jedynie
    nazywa

    to, co juz stoi w konstrukcji, i robi to, bo cala jego robota polega na wiedzeniu,
    kiedy

    zamknac.


    5. KESZ WLASNIE DOSTAL KALENDARZ, O KTORY POPROSIL 96 TUR TEMU, I MOWI TO.

    fact_kesz_knows_about_the_two_week_deadline (t_105b): Lucan zapowiedzial przy
    nim, ze

    w ciagu dwoch tygodni wywola i rozwiaze w miescie wojne domowa, a Kesz "przyjal
    to jako

    date w kalendarzu i chce wiedziec, po ktorej stronie ma stac jego pokoj". Do dzis
    mial

    sama date bez etapow. Teraz ma etapy. Nie komentuje ich tresci i nie pyta, co
    jest pod

    cmentarzem - konsekwentnie, bo w t_194 sam uznal wlasna niewiedze za zalete, skoro
    nie da

    sie go zmusic do rozwiniecia czegos, czego nie wie.


    6. CZY TO RUSZA WARUNEK SERAPHINE - NIE. obligation_warn_seraphine_before_contacting_

    dispute_sides to JEJ warunek, nie obietnica Lucana (retcon_000124), i dotyczy
    KONTAKTU

    ze strona sporu. Faza druga opisuje przyszle powiadomienie Akademii i Kosciola,
    ale

    powiadomienie nie zostalo wykonane - to jest tresc talerzyka, nie zdarzenie. Nic
    tu nie

    zostaje wyzwolone i narrator nie dopisuje nowego naruszenia.


    7. HIGIENA PLIKOW, ZGLASZANA JAWNIE. state/obligations.yaml jest w active_refs
    i laduje

    sie przy KAZDYM otwarciu sceny, a przez ostatnie tury urosl z 4,8 KB do 6,9 KB,
    bo

    narrator dopisywal do niego uzasadnienia. To jest dokladnie to, przed czym ostrzega

    playbook (raz juz spuchl do 22,8 KB). Tresc czterech faz i rozumowanie o tym,
    ktory

    talerzyk jest towarem, ida do planning/act-03-defence.yaml; w obligations zostaje

    struktura i krotki key_constraint.


    8. CZEGO NARRATOR TU NIE ROBI. Nie tworzy zegara z "dnia, dwoch". Nie nadaje daty

    przesluchaniom ani dyspucie. Nie odslania niczego o zawartosci cmentarza. Nie
    kaze

    pryncypalowi pytac, po co ten kordon. Nie dopisuje mu planu ewakuacji, listy rzeczy
    do

    wywiezienia ani zadnej innej ekspozycji, ktorej nie ma w pliku (retcon_000058).
    Nie

    zapowiada, ze cos pojdzie zle. Nie podaje ceny za kamien, metal ani namiary.


    9. STAN. Czwarty dzien interludium, 13:47, pokoj syndykatu na zapleczu targu.
    Obecni:

    Lucan, pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary
    bez

    ruchu poza uplywem czasu. Toby stoi w skrzynce na dolnej polce, na PIERWSZYM talerzyku.

    Zuk nadal lezy na stole brzuchem do gory - nikt go nie schowal. Trzy zamowienia
    w kanale

    bez ceny, propozycja na zbitki bez umowy, Kesz jest prawnikiem Lucana bez honorarium.

    Sprawy, po ktore Lucan tu przyszedl, sa zalatwione.

    '
