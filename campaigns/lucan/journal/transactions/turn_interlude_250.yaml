  prose: "- Nie jestem poeta - powiedzial Varkhen. Powaznie.\n\nNad herbem Seraphine\
    \ nie zastanawiala sie dlugo, bo mial nad nim czas lezec u niej\nna biurku przez\
    \ pol dnia.\n\n- Porownalam - powiedziala. - Jelenia z trzema strzalami nie ma\
    \ w niczym, co mam.\n  Moje papiery sa o garbarni.\n\nKesz powiedzial to zreszta\
    \ precyzyjniej, niz Lucan mu to teraz przypisal: nie o\njakiekolwiek dokumenty\
    \ chodzilo, tylko o ODCISK w aktach wlasnosci. A odcisk lezy\nw baszcie przy murze,\
    \ gdzie lezy od Aktu pierwszego - srebrna pieczec poprzedniego\nwlasciciela, stare\
    \ listy, umowy dostaw.\n\nNa \"idziemy\" Varkhen nie odpowiedzial wcale. Kiwnal\
    \ raz i ruszyl. Seraphine wyprzedzila\ngo przy drzwiach i otworzyla je sama, bo\
    \ do klamki w tym pokoju nikogo nie prosi.\nNa dole nocny urzednik podniosl glowe\
    \ znad ksiegi dokladnie na tyle, na ile podnosi\nsie ja przy czlowieku, ktory\
    \ tu mieszka - i opuscil, zanim dwumetrowy plaszcz doszedl\ndo progu. Potem byl\
    \ juz tylko zaulek, chlod od rynsztoka i miasto, ktore skonczylo\nliczyc utarg.\n"
  summary: 'Bez testu - interludium, roll_policy disabled. Szesc minut, zero energii,
    zero srebra.

    WYSZLI. Lucan, Varkhen, Spidey i webber_anchored w zone_guild_surrounding_lanes.


    1. ROZSTRZYGNIETA ZAPOWIEDZ Z t_234. Seraphine miala porownac sygnet z papierami

    garbarnika, ktore trzyma u siebie; pole bylo otwarte od czterech dni

    (inventory#item_three_arrow_deer_signet.current_placement: "NIEROZSTRZYGNIETE,
    czy cos

    w nich znalazla"). Wynik: NIC. To NIE jest przeszkoda dorobiona do sceny - jej
    papiery

    dotycza zakladu, a herb jest sprawa rodu, i zaden plik nigdy nie twierdzil, ze
    rod

    w nich stoi. heraldry_recognition zostaje attempted_and_failed.


    2. DROGA DO HERBU BYLA JUZ W PLIKACH I ZOSTALA GRACZOWI POKAZANA, nie wymyslona.

    Kesz w t_240 podal metode doslownie: herb czyta sie przez ODCISK w aktach wlasnosci,

    "a odciski i akty Lucan ma". item_tannery_owner_cache (location: wall_hideout)
    zawiera

    pieczec POPRZEDNIEGO wlasciciela, stare listy i umowy dostaw. Narrator sprostowal

    tylko nieprecyzyjne powtorzenie gracza ("jakies dokumenty z garbarni"), bo to
    wiedza

    Lucana o wlasnym schowku, a nie nowa informacja swiata.


    3. NIKT NIE POSTAWIL OPORU I NIE BYLO PO CO. Transport nocny ulica uzgodniono
    przy

    Seraphine w t_230, kustodia Varkhena jest formalna, a pomiar trzeciej pieczeci
    jest

    krokiem pierwszym JEJ kolejnosci z t_234. Nocny urzednik jest z pliku lokacji,
    nie

    z wyobrazni, i nie jest zdarzeniem (retcon_000055). Seraphine nie zadeklarowala,
    czy

    idzie - NIE ZAPYTANO JEJ I SAMA SIE NIE ZGLOSILA; zostaje w gabinecie.


    4. Marsz na cmentarz NIE zostal rozegrany - podroz poza mury ma wlasna stawke

    (system/pacing.md) i wlasna deklaracje.

    '
