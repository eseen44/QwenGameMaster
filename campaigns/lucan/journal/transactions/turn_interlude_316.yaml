outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'TRZY KANALY, TRZY ODPOWIEDZI, I DOPIERO RAZEM ODPOWIADAJA NA PYTANIE "co
    znaczy brudna". KAMIEN (Stone Sense): NIC. Wokol kregu kamien jest zdrowy, bez
    peknięcia i bez pustki za nim. Pieczec NIE JEST uszkodzona konstrukcyjnie. Negatyw
    jest tu informacja: "brudna" nie dotyczy kamienia. SYGNATURA (Grave Sense): OSAD
    JEST SMIERCIA I MA WLASCICIELA. To jest rozstrzygajace, bo odroznia go od wszystkiego,
    co Lucan mierzyl w tej izbie wczesniej. inventory#item_north_ foundation_vessel
    mowi wprost, ze do naczynia wchodzila smierc BEZ WLASCICIELA, rowna i bez warstw,
    i ze wlasnie dlatego grave sense jej nie klasyfikowal. Tutaj klasyfikuje. SONDA
    (ability_necromantic_probe, precedens t_256 - ZERO energii, bez dotykania): sygnatura
    osadu ZGADZA SIE z probka ducha cmentarza pobrana w milestone_044b. Nie identycznie:
    probka byla zywa i glodna, a to jest to samo, tylko ROZPLASZCZONE I STARE - slad,
    nie obecnosc. effect#limitations interpretation_is_partial i not_ritual_identification
    zostaja: sonda mowi CZYJE, a nie CO to robi ani jak. ODPOWIEDZ NA PYTANIE GRACZA,
    ZLOZONA Z TYCH TRZECH: "brudna" znaczy, ze duch cmentarza opiera sie o te pieczec
    od bardzo dawna i zostawil na niej osad. Pieczec trzyma - ale trzyma PRZEZ COS,
    co na nia stale napiera. To nie jest ubytek materialu; to jest obciazenie. OTRZEPANIE
    DZIALA I NIC NIE ZMIENIA - i to jest wlasciwa pointa tury. Osad schodzi, ale NIE
    jak kurz: jako smuga, tlusto, zimno w opuszkach. Zimno LAGODNE, nie to z t_255
    ("zimna tak, ze parzy") - naczynie bylo zbiornikiem, a to jest slad po czyms.
    Pod spodem kamien jest czysty, a krag nietkniety. VARKHEN MOWI TO SAMO CO PRZED
    WYTARCIEM. Osad byl ZAPISEM, nie rzecza; starcie zapisu nie rusza tego, co go
    zostawia. LIMIT SONDY BYL W GRZE I NIE ODPALIL: effect ma reciprocal_contact_possible,
    a ability dodaje powerful_targets_can_notice_or_pull_back. Duch cmentarza JEST
    celem tej klasy - ale Lucan sonduje SLAD, nie jego, a milestone_044b konczy sie
    tym, ze energia cofnela sie pod ziemie i nieumarli znieruchomieli. Narrator NIE
    dopisuje reakcji, ktorej zaden plik nie stawia (retcon_000015, retcon_000033,
    retcon_000055). Zapisane, ze limit byl zywy i nic z niego nie wyszlo TYM RAZEM
    - to nie jest obietnica na przyszlosc. CZEGO TO NADAL NIE LACZY: osad NIE zgadza
    sie z tym, co wnosza trzy kanaly w niszy piec krokow dalej. Pytanie z t_256 -
    czy kanaly maja cokolwiek wspolnego z pieczeciami - zostaje otwarte, a ta tura
    je nawet WZMACNIA: to sa dwie rozne smierci w jednym pokoju. KOSZT: 0,1 za Geo.
    Sonda zero, wedle precedensu t_256. Otrzepanie zero.'
  prose: 'Lucan kładzie dłoń na kamieniu obok kręgu i robi to, po co tu przyszedł.


    Najpierw kamień.


    I kamień nie mówi nic — w tym sensie, w jakim nie mówienie jest odpowiedzią. Mur
    wokół

    kręgu jest zdrowy. Żadnego pęknięcia, żadnej pustki za nim, żadnej szczeliny,
    którą coś

    mogłoby przechodzić. Cokolwiek jest z tą pieczęcią nie tak, nie dzieje się w kamieniu.


    Potem sygnatura.


    I tu jest pierwsza rzecz, która coś znaczy.


    Osad jest śmiercią. Nie brudem, nie sadzą, nie nalotem, który zostaje po wilgoci
    — śmiercią,

    i to taką, która ma **czyją**. Lucan mierzył w tej izbie cztery dni temu coś dokładnie

    odwrotnego: do naczynia w niszy wchodziła śmierć bez właściciela, równa, bez jednej
    warstwy,

    i właśnie dlatego jego czucie nie umiało jej nazwać.


    To nazywa od razu.


    Więc sięga głębiej, bez dotykania, tak jak robił to przy tamtej rzeczy.


    I sonda podaje mu to, czego się nie spodziewał, choć miał wszystko, żeby się spodziewać:

    ta sygnatura zgadza się z próbką, którą pobrał w nocy, kiedy Seraphine zabiła
    Orena.

    To jest duch cmentarza.


    Nie ten sam co wtedy — wtedy był żywy i głodny, a to jest to samo rozpłaszczone
    i stare.

    Ślad, nie obecność. Coś, co opierało się o ten kamień tak długo, że zostawiło
    na nim siebie.


    Lucan zdejmuje dłoń i sięga po szmatę.


    Osad schodzi. Nie jak kurz — jak smuga. Tłusto, wąsko, i zimno w opuszkach, chociaż
    to zimno

    jest łagodne i nie ma w sobie nic z tamtego, od którego bielała mu dłoń przy naczyniu.

    Wyciera krąg do końca, aż kamień pod spodem jest czysty, a sam krąg gładki i bez
    skazy.


    Odsuwa się i patrzy na czystą pieczęć.


    — No i? — pyta.


    Varkhen kładzie dłoń nad nią, tak jak przedtem, i tak jak przedtem jej nie dotyka.


    — Brudna.


    Opuszcza rękę.


    — Tyle samo co przed chwilą.


    I to jest odpowiedź na pytanie, które Lucan zadał, tylko przyszła od drugiej strony,
    niż

    miała przyjść. Osad był zapisem, a nie rzeczą. Starł zapis. To, co go zostawiało,
    leży

    po drugiej stronie kamienia i ma się dokładnie tak samo.


    Pięć kroków dalej, w północnej ścianie, trzy kanały nadal wnoszą do niszy śmierć,
    która

    nie ma niczyjej.


    Dwie różne śmierci w jednym pokoju, po dwóch ścianach, i nadal nic ich ze sobą
    nie łączy.

    '
