  new_decision: 'Przy drugiej pieczeci, zone_relay_chamber, 04:26, dzien szosty. Rezerwa
    14,9/15 - Geo 0,1; sonda zero wedle precedensu t_256, otrzepanie zero. CO PODAL
    KAMIEN: NIC, i to jest informacja. Mur wokol kregu zdrowy, BEZ peknięcia i BEZ
    pustki za nim. Pieczec nie jest uszkodzona konstrukcyjnie - "brudna" nie dotyczy
    kamienia. CO PODALA SYGNATURA: OSAD JEST SMIERCIA I MA WLASCICIELA. Odroznia go
    to od wszystkiego, co Lucan mierzyl w tej izbie wczesniej: do naczynia w niszy
    wchodzila smierc BEZ wlasciciela, rowna i bez warstw, i dlatego grave sense jej
    nie klasyfikowal. Te klasyfikuje od razu. CO PODALA SONDA: sygnatura osadu ZGADZA
    SIE Z PROBKA DUCHA CMENTARZA pobrana w milestone_044b - ale nie identycznie. Probka
    byla zywa i glodna; to jest to samo ROZPLASZCZONE I STARE. SLAD, NIE OBECNOSC.
    interpretation_is_partial i not_ritual_identification zostaja: sonda mowi CZYJE,
    a nie co to robi ani jak. CO ZNACZY "BRUDNA" - ODPOWIEDZ ZLOZONA Z TRZECH KANALOW:
    duch cmentarza opiera sie o te pieczec OD BARDZO DAWNA i zostawil na niej siebie.
    Pieczec TRZYMA, ale trzyma PRZEZ COS, co na nia stale napiera. To OBCIAZENIE,
    nie ubytek materialu. OTRZEPANIE ZADZIALALO I NIC NIE ZMIENILO. Osad schodzi jak
    SMUGA, nie jak kurz - tlusto, zimno w opuszkach, ale zimno LAGODNE (nie to z t_255,
    od ktorego bielala dlon). Pod spodem kamien czysty, krag gladki i bez skazy. VARKHEN
    PO WYTARCIU MOWI TO SAMO: brudna, tyle samo co przed chwila. Osad byl ZAPISEM,
    nie rzecza. LIMIT SONDY BYL W GRZE I NIE ODPALIL: reciprocal_contact_possible
    oraz powerful_targets_can_notice_or_pull_back. Duch jest celem tej klasy, ale
    Lucan sondowal SLAD, nie jego, a milestone_044b konczy sie cofnieciem energii
    pod ziemie. Narrator nie dopisal reakcji, ktorej zaden plik nie stawia. TYM RAZEM
    nic z tego nie wyszlo - to nie jest obietnica na przyszlosc. CZEGO TO NADAL NIE
    LACZY - i tura to nawet WZMACNIA: osad NIE zgadza sie z tym, co wnosza trzy kanaly
    piec krokow dalej. Dwie rozne smierci w jednym pokoju, po dwoch scianach. Pytanie
    z t_256 zostaje otwarte. OTWARTE: czy Lucan dotyka kregu gola dlonia, czy probuje
    czyscic dalej albo pobrac probke osadu, czy pyta Varkhena o ducha, czy idzie do
    niszy, czy wraca na gore. Lampa pali sie od okolo 1 h 50 z trzech.'
