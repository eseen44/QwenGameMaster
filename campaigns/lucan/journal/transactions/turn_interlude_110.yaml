outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. LUCAN DEKLARUJE PRZED SYNDYKATEM WOJNE Z KOSCIOLEM. To samo zdanie,
    potwierdzone wprost, z sucha dopiska o ojcu, ktory nigdy nie lubial klerykalow.
    Nikt w pokoju nie reaguje teatralnie; reaguja wszyscy inaczej. 2. PRYNCYPAL NIE
    ODRADZA I NIE MORALIZUJE - PRZELICZA. Wojna z Kosciolem jest zla dla interesow
    ogolnie, ale Kosciol jest zarazem jedyna instytucja, ktora stoi miedzy nim a kategoria
    towaru, w ktora wlasnie mial wlozyc pieniadze. Dwa ryzyka po przeciwnych stronach
    tej samej szali - i dlatego nie odpowiada dzis, tylko notuje, ze inwentarz na
    ten tydzien bedzie mniejszy i ostrozniejszy, niz byl piec minut temu. 3. KESZ
    REAGUJE OSOBISCIE I TO JEST NAJWIEKSZA RZECZ TEJ TURY. Kosciol w Lumarii to nie
    jest dla niego abstrakcja - lokalny KAPLAN jest umoczony w sprawe cmentarza (znal
    wlasciwe wejscie, ogladal pieczecie i przy ostatniej wizycie przyszedl Z ORENEM,
    faction_lumaria_church.knowledge). A Kesz jest czlowiekiem spoza zalogi, po spotkaniach
    z ktorym Oren zmienial trasy. WNIOSEK, KTORY OBAJ WYCIAGAJA W TEJ SAMEJ SEKUNDZIE
    I ZADEN NIE MOWI GO DO KONCA: jesli Lucan idzie na Kosciol lokalnie, pierwszy
    czlowiek, ktorego dotknie, to ten kaplan - a sciezka do kaplana biegnie przez
    te same pokoje, w ktorych bywal Kesz. Wojna Lucana i ekspozycja Kesza celuja w
    te sama osobe. Kesz przestaje byc uslugodawca i staje sie strona z wlasnym motywem.
    4. UWAGA O OJCU LADUJE INACZEJ, NIZ LUCAN ZAKLADAL. Ci ludzie odrobili prace domowa:
    wiedza, ze ojciec Lucana byl dwa razy potepiony przez Inkwizycje i przezyl to.
    Nie znaja i nie interesuje ich strukturalny uklad rodu; interesuje ich precedens
    operacyjny - czlowiek, na ktorego Kosciol wydal dwa wyroki, nadal pracuje. To
    jest dla nich argument ZA Lucanem, nie przeciw. 5. ODMOWA PRZEJECIA LINII PRZYJETA
    BEZ NACISKU I ODWROCONA. Pryncypal nie proponowal jej Lucanowi - odnotowal pustke.
    Nazywa teraz to, co z tego wynika: pusta linia sciaga kogos w ciagu tygodni, nie
    lat, a KTOKOLWIEK ja wezmie, bedzie potrzebowal cmentarza. Wiec cmentarz ma juz
    przyszlego wlasciciela problemu, niezaleznie od tego, czy Lucan go chce. 6. WORLD
    MOVE - ZAPOWIEDZ WIEKSZEGO PROBLEMU JEST TU WARTA WIECEJ NIZ ZLOTO NA PODLODZE.
    Lucan nazwal istnienie problemu, nie tresc. Dla ludzi, ktorych fach polega na
    wiedzeniu wczesniej, to jest najdrozszy mozliwy rodzaj zdania. Pryncypal odklada
    szufelke drugi raz i pyta o jedno: czy ten problem jest taki, ze cmentarz przestanie
    byc uzyteczny, czy taki, ze cmentarz przestanie byc BEZPIECZNY - bo pierwsze kosztuje
    pieniadze, a drugie kosztuje ludzi, i on musi wiedziec, ktory zapas przesunac.
    7. CZEGO POKOJ NADAL NIE WIE. Varkhen, pieczecie, dolne wrota, przysiega, Spidey.
    Lucan otworzyl temat, ktorego dna nie moze pokazac bez rozbicia wlasnej doktryny
    o zwierzetach. 8. STAN. 15:55 dnia trzeciego. Energia 7.8 z 15, integralnosc 19
    z 19, bez warunkow. Kwota za zloto nadal nienazwana, liczenie stoi drugi raz,
    Mara milczy od poczatku rozmowy, Ilva nie wtracila sie ani razu od chwili, w ktorej
    pryncypal zaczal pytac sam.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Pryncypał pyta o jedno: czy problem z cmentarzem oznacza, że przestanie
    on być UŻYTECZNY, czy że przestanie być BEZPIECZNY - bo pierwsze kosztuje pieniądze,
    a drugie ludzi, i od tego zależy, który zapas przesuwa.'
