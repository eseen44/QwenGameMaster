  summary: 'Bez testu - interludium, roll_policy disabled. Dwadziescia minut, zero
    energii, zero wydane.

    Deklaracja gracza laduje: Lucan szuka i znajduje, GDZIE sa kamienie. Zadnego nie
    kupil,

    bo gracz tego nie zadeklarowal.


    1. OTWARTE RZEDY NIE MAJA CZEGO SPRZEDAC I TO WYNIKA Z PLIKU LOKACJI, NIE Z OPORU
    NARRATORA.

    locations/lumaria-market/location.yaml wymienia cztery strefy: glowny rzad (zywnosc,
    tkaniny,

    drobne narzedzia), rzad zwierzecy, rzad skrybow i tablica ogloszen, zaplecze.
    Zlotnika w tym

    spisie nie ma. Na wierzchu chodzi wiec to, co chodzi na targu spozywczo-tkackim:
    pasta

    szklana w cynie, rzeczne granaty wielkosci ziarna grochu, paciorki dewocyjne i
    turkus

    z poludniowych karawan, po kilka srebra sztuka. Do wprawienia w cokolwiek nadaja
    sie

    fizycznie; jako "kamien szlachetny" - nie.


    2. KAMIENIE SA W DWOCH MIEJSCACH I OBA SA W ZASIEGU RECI, BEZ ZADNEJ BRAMKI.

    (a) ZAPLECZE ZA STRAGANAMI (zone_market_back_alleys) - nieformalny obieg towaru,
    bez

    katalogu i bez zapisu (lead_anti_detection_only_through_back_alleys, lead_scribe_catalogue).

    Kamienie wylamane z opraw ida tedy stale i nikt nie pyta, skad. Dziesiatki srebra,
    nie setki.

    (b) STOL WAGOWY, KILKADZIESIAT KROKOW STAD - i to jest odpowiedz, ktora sama sie
    prosi.

    Pryncypal syndykatu siedzi na targu przy wadze uchylnej z probierzem i kamieniem
    probierczym

    (npc_syndicate_weigher#portrayal). Trzy dni temu przyjal od Lucana szescdziesiat
    kilo

    towaru opisanego w inventory.yaml jako mostly_gold_and_silver_mortuary_jewelry
    i posortowal

    go odruchowo, odkladajac robote konsekracyjna bez pytania. Bizuteria grobowa ma
    kamienie.

    IRONIA JEST CALKOWICIE MECHANICZNA, NIE NARRATORSKA: Lucan sprzedal wlasny zapas
    kamieni

    trzy dni temu czlowiekowi, do ktorego wlasnie idzie z pudelkiem w kieszeni.


    3. CO KANON MOWI O MINERALE JAKO MAGAZYNIE ENERGII - I CZEGO NIE MOWI. Sprawdzone

    wyszukiwaniem po calym repo: ZADEN plik nie opisuje kamienia szlachetnego jako
    zbiornika

    energii nekrotycznej, ale tez ZADEN tego nie zabrania. Nie ma tu zasady do zlamania.

    Co jest w plikach i jest sasiednie:

    (a) concha_surda (worlds/solmara/lore/concealment-materials.yaml) - MINERAL, ktorego
    muszla

    "rosnie spirala zwracajaca podpis wlasnej masy mineralnej", mielona z olowiem
    daje zaprawe,

    a odlana jako plyta czyni okaz niewidocznym DLA OKA I DLA ZMYSLOW MAGICZNYCH.
    Czyli w

    Solmarze mineral bezspornie WCHODZI W INTERAKCJE Z POLEM - to jest najmocniejszy
    istniejacy

    precedens dla pomyslu gracza.

    (b) Tam samo: "Srebro: swietne pod ryt, beznadziejne przy optimum". Wybor materialu
    ma w tym

    swiecie konsekwencje arkaniczne, nie tylko estetyczne.

    (c) Death_Anchor dziala jak ANTENA - daje zasieg i przepustowosc, NIE magazyn

    (companions/spidey.yaml#anchor_note, retcon_000049). Kotwica nie jest wiec precedensem

    dla baterii; to inna funkcja.

    (d) Zbiorniki w tej kampanii sa dotad WYLACZNIE cielesne: necrotic_reservoir kazdej
    slugi,

    lucan_necrotic_energy u Lucana. Zaden nie siedzi w przedmiocie.

    WNIOSEK DLA GRY: kamien jako bateria to DODANIE DO KANONU, nie odczytanie go.
    Mechanike

    zmienia deklaracja gracza do systemu (retcon_000120) - narrator jej nie wymysla
    i nie

    wycenia sam. Jesli gracz poda, jak to dziala, wpis idzie do

    worlds/solmara/lore/ (material) plus planning/specimen-upgrades.yaml (krok buildu).


    4. SKAD SIE WZIAL KROK "POWIEKSZ ZBIORNIK" - BO GRACZ PYTA, KTO TAK ZDECYDOWAL.

    Z niego samego. planning/specimen-upgrades.yaml ma w naglowku

    source: player_declaration_day3_evening_specimen_builds, decided_on 2026-08-26,

    status accepted_by_player_not_yet_executed. Krok enlarge_reservoir_to_tank

    (necrotic_reservoir 3 -> 12) jest czescia buildu build_beetle_tank_and_battery,
    ktorego

    wlasny opis brzmi "Maly tank, ruchoma bateria, punkt kontaktowy spajajacy siec".

    RACJONALU, O KTORY GRACZ PYTA, W PLIKU NIE MA - jest CEL (bateria) i jest LICZBA
    (3 -> 12),

    ale nie ma ani jednego zdania o tym, z czego ta pojemnosc jest zrobiona ani dlaczego
    ma

    rosnac wlasnie cialo okazu. Narrator w t_191 podal ten krok jako "okolo godziny
    przy stole,

    nic nie trzeba kupowac" i to jest zgodne z retcon_000024, ale bylo podane tak,
    jakby sposob

    byl przesadzony. NIE JEST. Kamien wprawiony w pancerz realizuje ten sam zapisany
    cel innym

    srodkiem i nie jest sprzeczny z niczym w pliku.


    5. JEDNA KOLIZJA MATERIALNA, ZGLOSZONA NEUTRALNIE. Ten sam build ma krok

    fit_concha_surda_plate - plyta odlewana na GRZBIET zuka, 6 h za pierwsza sztuke.

    Kamien wprawiony w pancerz i plyta zakrywajaca pancerz konkuruja o to samo miejsce.

    Narrator NIE rozstrzyga, czy to naprawde konflikt - to zalezy od tego, jak gracz
    opisze

    osadzenie. Zglaszam, bo oba kroki sa w jednym pliku i oba sa jego.


    6. CZEGO NARRATOR TU NIE ROBI. Nie orzeka, ze kamien nie zadziala. Nie wycenia
    kamienia,

    ktorego gracz nie kupil. Nie stawia terminu, nie robi zegara, nie wymysla handlarza
    kamieni

    spoza pliku lokacji i nie dopisuje nikomu podejrzen z powodu pytania o kamien
    - pytanie o

    kamien na targu jest pytaniem o kamien na targu (retcon_000055).


    7. STAN. Czwarty dzien interludium, glowny rzad targu. Energia i integralnosc
    bez zmian

    poza regeneracja. Zegary bez ruchu poza uplywem czasu. Nic nie kupione, nic nie
    wydane.

    W kieszeni nadal pudelko z pajakiem, w rekach atlasy, tom z sygnatura i dyktando
    Mary,

    pod straganem oplacona skrzynka szkla. Stol wagowy nadal kilkadziesiat krokow
    stad.

    '
  operations:
  - *id002
  new_decision: 'Kamienie sa dwa kroki dalej i zadna z drog nie jest zamknieta: zaplecze
    za straganami (bez zapisu, dziesiatki srebra) albo stol wagowy, gdzie leza kamienie
    z bizuterii grobowej, ktora Lucan sam tam zaniosl trzy dni temu. Do rozstrzygniecia
    zostaje najpierw rzecz systemowa, nie targowa: JAK kamien ma dzialac jako bateria
    - czy to zbiornik osobny od cielesnego, czy zamiennik, ile trzyma, czy da sie
    go ladowac z sieci i co sie dzieje, gdy peknie. Bez tej deklaracji narrator nie
    ma czego wpisac do plikow. A niezaleznie od tego pod stolem wagowym czekaja te
    same trzy rzeczy co poprzednio: nazwisko do kanalu ostrzegawczego, Kesz bez tajemnicy
    zawodowej i jego pytanie, kim Lucan siada u kaplana.'
