  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa. Piec minut, zero energii. Przykrywka podana i przyjeta
    bez sekundy wahania; imie pada i nic nie robi, bo ojciec nigdy nie mial nazwiska,
    tylko papier.

    1. IMIE PRZECHODZI CZYSTO I JEST TO KANONICZNE, NIE LASKAWE. Ojciec szuka odbitki,
    bo PAMIETA PAPIER - zoltawy grzbiet, skladane po lewej - a nie nazwisko; sam powiedzial
    "musze wiedziec kto". Karta potwierdza: gubi nazwiska i twarze. "Neris" nie jest
    dla niego zadnym haslem, dopoki nie stoi w naglowku, na ktory patrzy. Zapalnik
    nie zostal rozbrojony - po prostu nie zostal dotkniety.

    2. DOKTORANTKA PRZYJETA BEZ WERYFIKACJI, BO NIE MA CZYM ZWERYFIKOWAC. Nie orientuje
    sie, ile czasu minelo od przerwania edukacji syna (false_beliefs), a Lucan ma
    katedre i afiliacje, wiec doktorantka jest instytucjonalnie mozliwa. Dla ojca
    to nie jest tozsamosc - to jest FUNKCJA, i funkcja jest jedynym radarem spolecznym,
    jaki ten czlowiek ma. Osoba z funkcja natychmiast przestaje byc tlem i zaczyna
    byc uzywana.

    3. CENA PRZYKRYWKI, KTORA ZOSTAJE NA STOLE. Lucan wlasnie przypial referentke
    szerokiej definicji do siebie jako PODWLADNA, na glos, w budynku, w ktorym za
    szesnascie dni ma ona wystapic jako strona niezalezna. Kazdy, kto to powtorzy,
    ma gotowy zarzut o zaleznosc. Neris przyjmuje to bez mrugniecia - instruktaz brzmial
    "uchodzic za studentke" - ale przyjmuje to jako kolejna rzecz do przemyslenia
    pozniej.

    4. NOTATNIK JEST PRAWDZIWY I ZARAZ ZACZNIE SIE ZAPELNIAC. Ojciec nie widzi w niej
    swiadka; widzi rece do pisania i zaczyna dyktowac.

    5. ODBITKI ODLOZONE, NIE ODDANE. "Wazne" przyjmuje bez sporu i zsuwa je na rog
    stolu, naglowkiem w dol, jedna z narysowana krzywa na odwrocie. Makulature dla
    Neris wyszarpuje z najblizszego stosu. Nazwisko nadal nieprzeczytane i nadal na
    wyciagniecie reki.

    6. WORLD MOVE - PYTA JA O TO, CZEGO SZUKA. Dostal osobe z funkcja, wiec jej uzywa:
    doktorantka czyta biezaca literature, wiec doktorantka mu powie, kto pisze rozsadnie
    o granicy konstruktu. Zadaje pytanie wprost do niej. Nie jest to przenikliwosc
    - to jest odruch czlowieka, ktory kazda para rak przypisuje zadanie. Ale odpowiedziec
    musi ona, na glos, o wlasnym tekscie, lezacym metr od niej naglowkiem w dol, po
    tym jak Lucan kazal jej sie nie przedstawiac.

    7. CZEGO OJCIEC NADAL NIE WIE. Nekromancji Lucana, sieci sieciarzy, Varkhena,
    syndykatu, celi w piwnicy gildii, tego, ze okaz dla Akademii ma byc wabikiem.
    NOWE FALSE BELIEF: uwaza Neris za doktorantke swojego syna.

    8. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra. Energia bez zmian,
    integralnosc 19 z 19, bez warunkow. USTALONE: przykrywka doktorantki dziala; imie
    Neris padlo i nic nie uruchomilo; odbitki odlozone naglowkiem w dol na rogu stolu;
    ojciec pyta Neris wprost, kto pisze rozsadnie o granicy konstruktu.'
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: in_his_fathers_laboratory_neris_passed_off_as_his_doctoral_student_and_accepted_as_such_offprints_set_aside_face_down_on_the_table_corner_father_now_asking_her_directly_who_writes_sensibly_about_the_construct_boundary
