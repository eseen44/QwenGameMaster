outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dwadziescia minut,
    zero energii. 1. FORK DWOCH SPRZECZNYCH OBRON ZOSTAJE ROZBROJONY, A NIE ROZSTRZYGNIETY
    - I MA POKRYCIE W KANONIE. Doktryna Lucana: nie ma sprawy, bo nie jest nekromanta,
    tylko akademikiem budujacym golemy z ciala; a gdyby ktos jednak uznal to za sily
    nieczyste, NIE MA KATEGORII PRAWNYCH DOTYCZACYCH ZWIERZAT. Stad tez plynie jego
    wlasne ograniczenie: nie tyka ludzkich zwlok. Pliki to potwierdzaja - necromancy-law.yaml
    ma animal_and_vermin_modification jako legally_ambiguous_gray_zone, a construct_boundary
    notuje, ze Akademia klasyfikuje po mechanizmie i ciaglosci zycia, bo ZBYT SZEROKA
    definicja zabija golemy, homunkulusy, protezy magiczne i biokonstrukty. Obrona
    klasyfikacyjna i karna przestaja sobie przeczyc, bo obie mowia to samo zdanie:
    przedmiotu sprawy nie ma. lead_two_contradictory_defences zamkniety. 2. KESZ PRZYZNAJE
    MU RACJE I NATYCHMIAST PRZESUWA WLASNA UZYTECZNOSC. Nie broni swojego pytania.
    Mowi, ze jesli tak, to Lucan nie potrzebuje go do tego, do czego mysli, ze potrzebuje
    - bo forum swieckie i tak nie bedzie pytac "czy to nekromancja", tylko o pozwolenie,
    o szkode i o to, czy ktos ucierpial (secular_authority_position). To jest robota
    latwa. Wskazuje jednoczesnie JEDYNA szczeline, ktora zostaje: Kosciol nie uznaje
    szarej strefy zwierzecej DOKTRYNALNIE (animal_gray_zone_recognized_doctrinally:
    false), wiec doktryna Lucana jest szczelna wobec sadu i bezwartosciowa wobec kaplana.
    3. I MOWI RZECZ, KTORA JEST JEGO WLASNA WERSJA OSTRZEZENIA SERAPHINE, PODANA Z
    DRUGIEJ STRONY BARYKADY. Kiedy sciezka formalna cichnie, srodek zaradczy nie znika
    - zmienia rece z papieru na ludzi. Kesz zna to zawodowo, bo JEGO KLIENCI SA TYMI
    RECAMI. Prawdziwa wartosc Kesza dla Lucana nie lezy wiec na forum, tylko po tym,
    jak forum przestanie miec znaczenie. 4. LUCAN SPRZEDAJE PRYNCYPALOWI WIEDZE WYPRZEDZAJACA,
    NIE TOWAR - I TO JEST NAJWIEKSZA RZECZ, JAKA POWIEDZIAL W TYM POKOJU. Rownolegle
    do sledztwa gildii ta sama kwestia lezy u akademikow: otwarta dysputa za ok. 16
    dni, npc_neris_aldhen (szeroka definicja) kontra npc_ivar_kolm (waska). Lucan
    wie, jak to sie skonczy, bo TO ON DOSTARCZA OKAZY, na ktorych dysputa bedzie orzekac
    (objective_build_decoy_construct_for_academy, clock_father_arranges_academy_showing).
    Mechanizm zmiany tego porzadku prawnego jest w plikach i Lucan go zna: nikt nie
    oglosi legalnosci - uznaje sie rzecz za szara strefe i PRZESTAJE SIE ROZPATRYWAC
    SKARGI, dokladnie jak przeszla ludzka transmutacja (de_facto_liberalisation_mechanism).
    5. CO TO ZNACZY DLA CZLOWIEKA PRZY WADZE. Nie oferuje mu sie kruszcu ani uslugi,
    tylko TERMIN, na ktorym cala kategoria towaru przestaje byc scigalna. Ktos, kto
    wie o tym wczesniej, kupuje tanio to, co za dwa tygodnie przestanie byc kontrabanda.
    Wagowy przestaje przesypywac. Szufelka zostaje w kruszcu. 6. WORLD MOVE - PRYNCYPAL
    ZADAJE PYTANIE PRYNCYPALA. Nie pyta, czy Lucan mowi prawde, i nie pyta o dowod;
    pyta o DATE i o INWENTARZ: co ma zaczac kupowac TERAZ, zeby WTEDY juz to miec.
    To jest dokladnie ten dostep, po ktory Lucan przyszedl - z ta roznica, ze nie
    zostal mu udzielony, tylko zostal mu POWIERZONY, a to jest zobowiazanie w druga
    strone. 7. ILVA SLUCHA I PIERWSZY RAZ NIE WTRACA SIE ANI SLOWEM. Jej robota -
    przesiew nowego - skonczyla sie w chwili, w ktorej pryncypal sam zaczal pytac.
    8. CZEGO POKOJ NADAL NIE WIE. Nie padlo slowo o Spideyu, o Varkhenie, o nazwisku
    Veyr ani o tym, ze Lucan utrzymuje bardzo starego nieumarlego - a to jest jedyny
    fakt, ktory rozbija cala doktryne o zwierzetach w jedno popoludnie. 9. STAN. 15:25
    dnia trzeciego. Energia 7.8 z 15, integralnosc 19 z 19, bez warunkow. Liczenie
    wstrzymane w polowie, kwota nadal nienazwana, przepustka pod plaszczem, dostawa
    materialow umowiona na czwartek, konsekrowany stosik nadal nietkniety.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: Pryncypał nie pyta o dowód - pyta o datę i o to, co ma zacząć kupować
    już teraz, żeby wtedy to mieć. Konsekrowany stosik nadal leży osobno i nikt go
    nie ruszył.
