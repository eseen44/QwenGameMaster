outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez rzutu - silnik uznal to za automatyczne: dostep swobodny, nikt nie
    przeszkadza, brak presji czasu. Kwatera urzadzona z odzysku, przykrywka alchemiczna
    zaczeta, ale niepelna. 1. ZLOTO JEST U BOROSA. Lucan precyzuje, ze do celi nie
    wnosi nic - caly jego dobytek ma przy sobie albo w baszcie i nie jest go duzo.
    Szescdziesiat kilo cmentarnego lupu trzyma Boros Keld, na razie. Seraphine przyjmuje
    to z widoczna ulga: nie jest to schowek pod jej rejestrem, wiec jej podpis nie
    stoi pod skladem. 2. CO DALO SIE ZNALEZC. Piwnica gildii poszukiwaczy nie jest
    pusta - jest zaniedbana. Z celi zostaje kamienna lawa i uchwyt na lampe. Z korytarza
    i schowka pod schodami Lucan sciaga: kozly i blat z rozebranego stolu, zydel bez
    oparcia, dwa koce z rotacji pokojow dyzurnych, blaszany kubel, lampe oliwna z
    zapasem oliwy oraz polke ze skrzyn po ekspedycjach. Nikt tego nie pilnuje i nikt
    za tym nie zatesknil. 3. STANOWISKO ALCHEMICZNE - SZKIELET TAK, REKWIZYTY NIE.
    Stol, lampa i polka daja wiarygodny KSZTALT warsztatu. Tego, co ma go nazwac,
    w piwnicy nie ma: retorty, palnika, mozdzierza i kilku sloikow z nudnymi, legalnymi
    odczynnikami. To zakup na targu, a gotowki Lucan przy sobie nie ma - pieniadze
    sa u Borosa i beda za dwa dni. Zapasy ze schowka w murze miejskim sie do tego
    NIE nadaja: preparat konserwujacy, sol rytualna i proszek osuszajacy to dokladnie
    ten inwentarz, ktory przykrywka ma tlumaczyc, a nie stanowic. 4. SERAPHINE AKCEPTUJE
    PRZYKRYWKE I DOKLADA TEN SAM WARUNEK CO WYZEJ. Alchemia jest nudna i o to chodzi.
    Ale stanowisko bez sadzy, bez plam i bez zuzycia jest tak samo martwe jak lozko,
    w ktorym nikt nie spal - przykrywke trzeba uzywac, zeby dzialala.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - op: advance_time
    seconds: 600
  - *id002
  new_decision: 'Cela jest urzadzona, alchemiczny szkielet stoi, ale brakuje mu rekwizytow
    do czasu spotkania z Borosem za dwa dni. Nadal nie ruszony: pajak alarmowy dla
    Seraphine, nocny urobek sieciarzy w baszcie i zaopatrzony schowek w murze miejskim
    jako warsztat. Lucan nie zdecydowal, czy wychodzi jeszcze tej nocy, czy konczy
    dzien.'
