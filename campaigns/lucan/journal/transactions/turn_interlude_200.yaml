  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero wydane.

    Kanal ostrzegawczy zamowiony w t_113 zostaje DOSTARCZONY. Pajak zmienia rece.


    0. KOREKTA GRACZA PRZYJETA PRZED NAPISANIEM SCENY I ZMIENIA JEJ CALY REJESTR.

    Narrator szykowal sie zagrac wylozenie Tobiego jako odsloniecie nekromancji przed
    dwoma

    swiadkami. To bylo bledne z dwoch powodow, oba wskazane przez gracza i oba stoja
    w plikach.

    (a) NIKT NIE POWIEDZIAL, ZE PAJAK JEST MARTWY. Na stole lezy pajak, ktory macha
    lapka na

    polecenie. worlds/solmara/lore/necromancy-law.yaml#animal_gray_zone ma to jako
    przyklad

    DOSLOWNIE: small_living_spider_modified_and_bonded_with_death_magic ->

    difficult_to_classify_and_prove, powody: skala robactwa, niejasny stan zycia,
    nakladanie

    sie z modyfikacja magiczna i praktyka chowancow. Slowo "nieumarly" nie padlo ani
    razu

    i narrator go nie dopisuje. NPC wie tyle, ile zdobyl zdarzeniem (retcon_000058):
    zdobyl

    pajaka reagujacego na polecenia.

    (b) TO SA DWAJ LUDZIE Z TEJ BRANZY I ICH NIECIEKAWOSC JEST W KARTACH, NIE WYGODNA.

    Pryncypal: portrayal#tell - sortuje grobowy towar odruchowo i bezblednie, w tym
    odklada

    na bok robote konsekracyjna BEZ PYTANIA, robil to juz wczesniej; w t_196 powiedzial
    wprost

    "powodu nie kupuje i nie pytam o niego"; w t_109 przyjal liste zaczynajaca sie
    od zakazanych

    podrecznikow. Kesz: fact_kesz_understood_the_category_without_asking (t_105b)
    - NIE zapytal,

    o jakie kategorie towaru chodzi, zapytal o ilosc, czestotliwosc i stan, bo obslugiwal

    logistyke dostarczajaca Orenowi to samo. Zaden z nich nie pyta i zaden nie jest
    zaskoczony.

    Narrator NIE robi z tego progu, sceny odslony ani nowego ryzyka.


    1. ODPOWIEDZ O SERAPHINE - KESZ DOSTAJE JA ZA DRUGIM PYTANIEM I NIE JEST TO ODPOWIEDZ,

    KTORA MU SIE PODOBA. Seraphine nie wie i ma sie dowiedziec dopiero po tym, jak
    zezna przed

    Straza to, co musi; powod Lucana jest sekwencyjny, nie osobisty - nie chce, zeby
    powiedziala

    za duzo i za szybko. Kesz przyjmuje bez sporu, bo jest juz w srodku, ale nazywa
    to, co

    wlasnie stracil: w t_194 powiedzial, ze wolalby nie dowiedziec sie tego RAZEM
    z nia, a ta

    odpowiedz znaczy dokladnie, ze dowie sie razem z nia albo po niej. Nazywa i nie
    targuje sie.

    UWAGA NARRATORSKA: nie ustalam, czy zeznanie Seraphine przed Straza juz sie odbylo.
    t_193

    mowil, ze jest NA SPOTKANIU ze Straza (t_188-190, ok. 11:39), ale zaden plik nie
    orzeka, ze

    to spotkanie bylo tym zeznaniem. Zostaje to, co powiedzial gracz - sekwencja -
    bez zegara

    i bez daty. Nie dopisuje terminu.


    2. LUCAN ODMAWIA POZNANIA NAZWISKA - I TO JEST, WEDLUG KARTY PRYNCYPALA, NAJMOCNIEJSZA

    RZECZ, JAKA MOGL ZROBIC. Jego agenda ma trzy pozycje i dwie z nich wlasnie zostaly
    trafione

    naraz: stay_unnamed oraz judge_lucan_by_what_he_declines_not_by_what_he_offers.
    Pryncypal

    postawil w t_199 jeden warunek; Lucan nie tylko go przyjal, ale przebil - nie
    chce wiedziec,

    i podaje powod, ktory jest handlowy, a nie grzecznosciowy: ciezko robi sie interesy

    z martwymi ludzmi. Czlowiek, ktory ocenia ludzi po tym, czego ODMAWIAJA, wlasnie
    dostal

    odmowe dokladnie tej rzeczy, ktorej sam pilnuje od poczatku znajomosci.

    Do tego Lucan zaweza wlasny interes: nie obchodzi go syndykat jako taki, obchodzi
    go, zeby

    szantazowani nie wiedzieli, i obchodzi go prawnik. To jest zgodne z t_194, gdzie
    sam

    powiedzial, ze wobec Strazy i gildii tez potrzebuje dyskrecji.


    3. TOBY - PAJAK ZMIENIA RECE I MA IMIE. To spy_cellar_spider_06, sciagniety z
    zaulkow wokol

    gildii w t_191 wlasnie na to i od tamtej pory jadacy w pudelku w kieszeni. Wybor
    byl

    wymuszony i zapisany: spy_cellar_spider_03 to uzgodniony kanal alarmowy Seraphine
    (t_070,

    retcon_000116), spy_cellar_spider_04 siedzi na czujniku przeszukania przy papierach
    z baszty

    (t_183), spy_cellar_spider_01 jest destroyed_drained_by_lucan. Szosty byl jedynym
    wolnym.

    TERRARIUM PRZYZNANE I PROSBA JEST DOKLADNIE TRAFIONA, CO WIDAC W FLAGACH TEGO
    OKAZU:

    destroyed_by_a_broom oraz silhouette_ignored_by_everyone. Ten pajak ginie od miotly
    i nikt

    go nie zauwaza - wiec kat, w ktorym nikt go nie rozdepcze, nie jest sentymentem,
    tylko

    jedynym sposobem, zeby kanal przezyl pierwsze sprzatanie. Pryncypal zgadza sie
    bez dyskusji,

    bo to kosztuje go skrzynke i miejsce na polce.


    4. PROTOKOL TALERZYKOW JEST DOKLADNIE TYM, CO PLIKI SIECI SAME REKOMENDUJA - I
    TO NIE JEST

    uprzejmosc narratora, tylko cytat. companions/webber-network.yaml#network_cost_model.

    attention_is_serial konczy sie trzema wnioskami projektowymi, a drugi brzmi doslownie:

    "alarm czytany OKIEM albo kurier fizyczny nie zuzywa uwagi w ogole". Lucan wlasnie

    zaproponowal alarm czytany okiem. Konsekwencje, wszystkie korzystne i wszystkie
    z plikow:

    (a) UWAGA: koszt staly ZERO. Przeglad jednego wezla to ok. 15 s i uwaga jest seryjna

    (retcon_000100), ale Toby nie jest przegladany - Lucan dotyka go tylko wtedy,
    gdy chce

    odpalic faze. Miedzy fazami nie kosztuje nic.

    (b) PASMO: jeden bit na faze. spy_cellar_spider_06 ma flage not_anchored_by_choice,
    a

    kotwica wedlug retcon_000049 (companions/spidey.yaml#anchor_note) NIE jest warunkiem

    sterowania - dziala jak antena, daje zasieg i przepustowosc. Brak kotwicy znaczy
    wiec

    strate na odleglosc (range: remote_with_distance_loss), a nie brak sterowania.
    Sygnal

    "przejdz na nastepny talerzyk" jest najtansza mozliwa trescia i degradacja wiernosci

    praktycznie go nie dotyczy - w przeciwienstwie do obserwacji, ktora traci jakosc

    (fidelity_by_member degraded_by_distance). Protokol jest dobrany pod ograniczenie,
    ktore

    faktycznie istnieje.

    (c) ZADNEGO TWARDEGO ZASIEGU NIE USTANAWIAM. Pliki mowia "strata na odleglosc",
    nie

    "granica"; narrator granicy nie wymysla.

    ENERGIA: zero. Utrzymanie wezla to routine_upkeep_cost 0, wezel odrabia wlasny
    ubytek

    polowaniem, a Toby ma autonomous_hunting.


    5. TO NIE JEST PODSLUCH I NARRATOR MOWI TO WPROST, BO JEST TO NA KORZYSC OFERTY.

    spy_cellar_spider_06 ma near_blind_vibration_and_air_sensing_only, a w abilities

    ability_eavesdropping_through_threads ma current: false, status: future_aspiration.

    Pajak zostawiony w pokoju syndykatu NIE jest wtyka - jest dzwonkiem. Gdyby ktos
    kiedys

    zapytal, czy Lucan wstawil im szpiega, odpowiedz z plikow brzmi: nie tym okazem
    i nie dzis.


    6. CZY TO ZAMYKA obligation_name_advance_warning_channel_for_syndicate - TAK,
    CO DO

    MECHANIZMU. W t_113 pryncypal opisal produkt jednym zdaniem: ostrzezenie przychodzace
    tego

    samego dnia co klopot nie jest ostrzezeniem, tylko wiadomoscia; kupuje WYPRZEDZENIE
    warte

    co najmniej dobe, typu "zamykajcie". Dostal wlasnie urzadzenie, ktore to robi:
    zdalne,

    natychmiastowe, czytane okiem, wielofazowe i niezalezne od tego, czy ktokolwiek
    zdazy

    dobiec z wiadomoscia. t_194 i t_199 rozrozniali kalendarz od alarmu i to rozroznienie

    wlasnie przestalo byc problemem - kalendarz niesie Kesz, alarm niesie Toby.

    CZEGO TO NIE ZAMYKA, I PRYNCYPAL NAZYWA TO SAM: doba przewagi nie mieszka juz
    w kanale,

    tylko w Lucanie. Mechanizm dostarczy sygnal w sekunde; czy sygnal przyjdzie dobe
    wczesniej,

    zalezy wylacznie od tego, kiedy Lucan go odpali. To NIE jest zastrzezenie wymyslone
    przeciw

    graczowi - to przeniesienie ciezaru z rzeczy na czlowieka i pryncypal podaje to
    jako

    domkniecie transakcji, nie jako brak. Status zobowiazania:

    partially_named_lawyer_line_accepted_alarm_signal_still_missing ->

    channel_delivered_advance_now_depends_on_lucans_timing_not_the_mechanism.

    LICZBA FAZ NIE ZOSTAJE USTALONA W TEJ TURZE. Lucan powiedzial "trzy albo cztery"
    i tresc

    faz nie padla. To jest do ustalenia i jest decyzja gracza - narrator nie wypelnia
    talerzykow

    za niego.


    7. KESZ MA JEDNA UWAGE I DOTYCZY JEGO, NIE LUCANA. Jest prawnikiem Lucana od okolo
    dziesieciu

    minut (t_199) i dopiero potem zobaczyl demonstracje. Zauwaza kolejnosc i mowi,
    ze doradzilby

    dokladnie taka - najpierw umowa, potem pokaz. Nie orzeka, co z tego wynika, i
    narrator tez

    nie: worlds/solmara/lore/legal-order.yaml NIE zawiera zadnego zapisu o tajemnicy
    zawodowej

    ani o przywileju, wiec zadnej takiej reguly nie ustanawiam. Kesz zreszta sam mowi,
    ze zna

    urzednikow magistratu, a nie statuty korporacji, i nie wie, jak wewnetrzne przesluchanie

    gildii traktuje takie rzeczy.


    8. CZEGO NARRATOR TU NIE ROBI. Nie nazywa Tobiego nieumarlym i nie pozwala tego
    zrobic

    zadnemu NPC. Nie kaze nikomu pytac, czym jest pajak. Nie tworzy z demonstracji
    dowodu,

    swiadka, ryzyka ani zegara - nikt tu nie zostal "swiadkiem czegos", bo nikt nie
    nazwal

    rzeczy. Nie ustanawia granicy zasiegu sieci. Nie wypelnia faz protokolu. Nie ustala,
    czy

    Seraphine juz zeznawala, i nie stawia temu terminu. Nie podaje ceny za trzy wczesniejsze

    zamowienia - pryncypal nadal nie ma czego zwazyc.


    9. STAN. Czwarty dzien interludium, 13:41, pokoj syndykatu na zapleczu targu.
    Obecni: Lucan,

    pryncypal, Kesz. Energia i integralnosc bez zmian poza regeneracja. Zegary bez
    ruchu poza

    uplywem czasu. Nic nie zaplacone, honorarium Kesza zero, ceny za kamien, metal
    i namiary

    nadal nie padly. Zuk lezy na stole brzuchem do gory. Toby ZOSTAJE w pokoju syndykatu
    -

    Lucan wyszedl z pudelkiem pustym. Kanal ostrzegawczy dostarczony, tresc faz nieustalona.

    '
