  resolved_world_reaction_ids: []
  summary: 'Bez testu - ojciec nie stawia oporu, przeciwnie. Slowo "kilka" i slowo
    "konferencja"

    robia na nim wiecej niz cokolwiek, co Lucan powiedzial dotad. Jeden okaz to anekdota,

    seria to material - i mowi to z prawdziwa radoscia, jakby syn wreszcie zaczal
    myslec

    porzadnie. Idzie grzebac w stosach za odbitka, mowiac do polek.

    Plan wabika jest dobry i dziala tam, gdzie mial dzialac. Nowy pajak bez Death_Anchor

    nie jest wieziou - jesli ktos go rozbierze, Lucan nie poczuje nic i nie straci

    Spideya. Sekcja na okazie bez kotwicy jest utrata materialu, nie utrata towarzysza.

    Cialo tez nie jest problemem - nocny urobek sieciarzy czeka w baszcie, a ojciec

    odhaczyl zbiory Akademii jako droge do wiekszego pajeczaka.

    DWA REALNE OGRANICZENIA, ktore Lucan zna od razu.

    Pierwsze - energia. Kazdy trwaly krok obudowania to 8 jednostek dla nowego sluzacego

    (permanent_growth_steps 0, regula 8 x 1.5^n), a Lucan ma 13.5/15. To znaczy jeden

    porzadnie obudowany wabik, nie kilka. "Kilka" da sie zrobic tylko jako prostych,

    nieprzekonujacych pajakow - a slabo obudowany wabik przegrywa argument zamiast
    go

    wygrywac.

    Drugie - i tu ojciec sam, w polowie zdania i bez cienia niepokoju, wyklada wade
    planu:

    im mniej biologiczny bedzie okaz, tym slabszy jest argument o odzywianiu, bo to

    wlasnie metabolizm mial dowodzic ciaglego procesu. A jesli okaz zostanie biologiczny

    dosc, zeby argument dzialal, to sekcja pokaze DOKLADNIE to samo co u Spideya -
    vitae

    w martwej tkance. Wabik chroni Spideya. Nie chroni metody.

    KOSZT, ktory juz sie naliczyl - Lucan powiedzial "kilka" i "konferencja" na glos

    czlowiekowi, ktory uwaza, ze dobra praca ma byc widziana. Ojciec potraktowal to
    jako

    zgode i zaczal to organizowac we wlasnym tempie. Sprawa przestala byc prywatna
    i

    przestala byc na zegarze Lucana - powstal clock_father_arranges_academy_showing,

    trzy dni.

    '
  new_decision: 'Ojciec grzebie w papierach, plan wabika jest przyjety, ale zegar
    rusza i koliduje z

    reszta kalendarza - wezwanie od kierownictwa gildii bez daty, spotkanie z Borosem
    i

    Mara za dwa dni, a teraz trzy dni do tego, jak ojciec sam ustali termin pokazu.

    Lucan czeka, az ojciec znajdzie odbitke i nazwisko, ustala z nim wprost warunki
    i

    termin, zeby przejac kontrole nad zegarem, wychodzi i wraca nad ranem do baszty
    po

    urobek na cialo wabika - czy robi jeszcze cos tu, na noc, w pustym laboratorium
    z

    dostepem do zbiorow?

    '
  operations:
  - *id002
