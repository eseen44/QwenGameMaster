  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu. Trzy kwadranse marszu z celi do baszty wystarczaja na pelny
    przeglad, i to wlasnie tyle, ile on musi zajac - bo uwaga idzie po jednym. 1.
    PRZEGLAD KOMPLETNY, DWADZIESCIA JEDEN ZYWYCH WEZLOW. Spidey (12/12 zbiornika,
    27/33 integralnosci, ubytek tylnej odnozy) plus czterech sieciarzy na posterunkach
    plus szesnascie okazow serii. Zaden nie zgasl. Doliczajac Varkhena Lucan trzyma
    dwadziescia dwie wiezi jednoczesnie i utrzymanie ich nie kosztuje NIC. 2. POMIAR
    PIERWSZY - UWAGA JEST SERYJNA, NIE ROWNOLEGLA. Lacze przenosi tyle, ile przenosi,
    ale ODBIORNIK jest jeden: Lucan skupia sie na jednym wezle naraz. Dwadziescia
    jeden pingow po kilkanascie sekund kazdy to caly spacer. Przy stu okazach ten
    sam przeglad jest niewykonalny w ciagu dnia. To nie limit magii, to limit UWAGI
    - i jest to pierwsza granica skalowania, ktora Lucan zmierzyl wlasnym czasem,
    nie oszacowal. 3. POMIAR DRUGI - CO LACZE NAPRAWDE MOWI. Seria daje minimal_status:
    zyje, glodny. Nic wiecej. Sieciarze daja to samo plus thread_break_signal - czyli
    "ktos przeszedl przez siec", bez kierunku i bez opisu. Dwie stonogi w kanalach
    to dwa zywe punkty BEZ WSPOLRZEDNYCH: obie syte (biom idealny), obie nie wiadomo
    gdzie. Kanaly siegaja pod piwnice gildii, wiec moga byc trzy metry od jego pryczy
    albo pod polowa dzielnicy. 4. POMIAR TRZECI - KRZYWA STRATY, ODCZUTA NA WLASNEJ
    SKORZE. W miare marszu w strone muru klaster przy baszcie WYOSTRZA sie, a sygnaly
    od strony gildii matowieja. Osiem zukow, spy_cellar_spider_02 przy webber_home
    i trzy pajaki czekajace na rotacje robia sie wyrazne; im blizej baszty, tym bardziej
    to jest siec lokalna, a nie miejska. Lucan po raz pierwszy ma czucie tej krzywej,
    a nie liczbe z pliku. 5. SPIDEY NIE JEST WEZLEM, JEST DRUGIM OBSERWATOREM. Jego
    kanal to inny rzad wielkosci: impulsy afektywne, kierunek i pilnosc, pozyczony
    zmysl przy skupieniu, migawka wzrokowa. Reszta sieci mowi "jestem"; Spidey mowi,
    CO widzi. Roznica nie bierze sie z zakotwiczenia (retcon_000016), a z dojrzalosci,
    modyfikacji i rangi. To jest dowod kierunkowy: pasmo kupuje sie wiekiem i praca,
    nie liczba cial. 6. VARKHEN - JEDYNY, KTORY REALNIE ZUZYWA. 17/72 rezerwy, 8/65
    integralnosci, w gabinecie Seraphine w gornych biurach gildii. Cztery lacza sieciarzy
    wpuszczaja mu 0,2 na dobe przy 0,25 na wejsciu (80 procent) - przy dziurze tej
    glebokosci to kroplowka, ktora liczy sie w miesiacach, nie dniach. Wiez formalnej
    kontroli nadal niewymuszona. 7. TOM AKADEMICKI IDZIE DO BASZTY, NIE DO AKADEMII.
    Postanowienie zapisane: oddac po przyswojeniu wiedzy, nie przed. Atlasy, brulion
    balwierza i tom lada w schowku w murze, obok warsztatu i stolu. Cela zostaje z
    makulatura. 8. BRAK ZMIAN W ROZKAZACH. Skan jest odczytem, nie rozkazem. Osiem
    zukow nadal bez zadania, stonogi nadal bez rozkazu, trzy pajaki nadal czekaja
    na rotacje sieciarzy.'
