  prose: 'Kesz nie obrazil sie o dziewice orleanska i nie tlumaczyl sie z ostroznosci
    - powiedzial tylko, ze nie jest delikatny, jest drogi do zastapienia. Oferte zrozumial
    od razu i nie zapytal, o kogo chodzi; zapytal o rzecz, ktora go faktycznie boli.
    O rysopisie wiedzial od dnia, w ktorym Lucan sam mu go wymienil jako jedna z nitek
    trzymanych na wozach. Nie wiedzial, ze pod tym rysopisem oddycha czlowiek. Powiedzial
    to na glos i dodal, ile ta roznica jest warta: rysopis w czyjejs pamieci to plotka,
    rysopis obok twarzy to akta. Zaplate przyjal jednym slowem i od razu ja przeliczyl
    - to nie jest zadatek, tylko spis z inwentarza, bo Lucan mial to przez caly czas,
    kiedy Kesz decydowal, czy sie w to pakowac. Drugi raz zreszta; poprzednim razem
    tez dostal prezent, ktory byl jednoczesnie pomiarem. Zaraz potem odwrocil oferte:
    miejsce go nie ratuje, bo do cel gildii nie wchodzi sie z teczka. Chce wiedziec,
    czy tamten juz powiedzial - i komu. I odnotowal bez zlosci, ze o kaplana pytal,
    a dostal zaplate.'
  summary: 'Bez testu - interludium, roll_policy disabled. Cztery minuty, zero energii,
    zero srebra.

    OFERTA ZLOZONA I PRZYJETA, INFORMACJA JESZCZE NIEPRZEKAZANA. Najwazniejszy ruch
    tej

    sceny nalezy do gracza i narrator go nie wykonal za niego.


    1. CZYM JEST TA OFERTA W PLIKACH. npc_halvek_wagonman: lifecycle captured_alive,

    current_location_id loc_guild_holding_cells. halvek.yaml#open_thread

    (halvek_can_identify_orens_outside_contact): potwierdzil w t_048, ze Oren zmienial
    trasy

    po spotkaniach z kims SPOZA ZALOGI, nie podal wiecej, rysopis npc_rovan_kesza
    pasuje,

    a on "moze zamienic dopasowanie w rozpoznanie". Odpowiada temu

    rovan-kesz.yaml#oren_connection.confirmation_route.


    2. CO KESZ WIEDZIAL, A CZEGO NIE - I DLACZEGO TO JEST DOKLADNIE TA ROZNICA.

    fact_kesz_knows_lucan_broke_the_body_line_and_holds_the_leverage (t_105b): Lucan
    sam mu

    wymienil, ze gildia zna punkty kontrolne, ma blankiet autoryzacji trasy, MA RYSOPIS

    i dosc nitek, by spowolnic biznes ze straza i magistratem. Kesz wiedzial wiec
    o RYSOPISIE

    od pierwszej powaznej rozmowy. NIE WIEDZIAL, ze za rysopisem stoi ZYWY, dostepny

    czlowiek w celach gildii. Narrator NIE dolozyl mu tu zadnej nowej wiedzy poza
    ta jedna

    rzecza, ktora Lucan wlasnie zaoferowal.


    3. PRZYJAL - I NAZWAL, CZYM TO NAPRAWDE JEST. speech_traits: podaje wlasna pozycje,

    zanim ktos go o nia zapyta; wycenia, nie bramkuje; zero moralizowania. Kpine przyjal
    bez

    urazy i bez tlumaczenia sie (portrayal: unsentimental). Zaplate wzial, ale od
    razu

    przeliczyl: to nie jest zadatek, to jest SPIS Z INWENTARZA - Lucan mial te wiedze
    przez

    caly czas, kiedy Kesz wazyl, czy sie w to pakowac.

    PRECEDENS, KTORY KESZ SAM ROZPOZNAJE, JEST W JEGO KARCIE: t_105b - Lucan oddal
    mu

    dzwignie "jako prezent, nie jako szantaz". To jest drugi raz ten sam ruch i Kesz
    to

    widzi. Nie nazwal tego szantazem i narrator tez nie - bo w plikach nim nie jest.


    4. ODWROCIL OFERTE - I TO JEST WLASCIWY POSTEP TEJ TURY. Miejsce go nie ratuje:
    do

    loc_guild_holding_cells prawnik obiegu przestepczego nie wchodzi z teczka, a jest
    to

    budynek gildii, czyli teren npc_seraphine_vale. Pyta wiec o rzecz operacyjnie
    wazniejsza:

    CZY TAMTEN JUZ POWIEDZIAL I KOMU. Rysopis w czyjejs pamieci to plotka; rysopis
    obok

    twarzy w protokole to akta.

    MA TO POKRYCIE W MECHANICE, KTORA JUZ RAZ ZADZIALALA W TEJ KAMPANII, i narrator
    jej nie

    wymyslil: halvek.yaml#prisoner_sourced_gate_guard_description - zatrzymani podali
    RYSOPIS

    straznika od bramy (wiek, posterunek, bez nazwiska) w t_048/t_052, i ten rysopis
    LEZAL

    BEZUZYTECZNIE, dopoki nazwisko nie przyszlo z innego zrodla w t_207 (npc_ossek_marn,

    od npc_verek_dast). Rysopis bez nazwiska nie robi nic - dopoki ktos nie przyniesie

    drugiej polowy.

    STAN FAKTYCZNY POZOSTAJE NIEROZSTRZYGNIETY: czy Halvek powiedzial cokolwiek wiecej
    po

    t_048 - NIEUSTALONE, jego last_confirmed_event_id to milestone_041. Narrator tego
    NIE

    rozstrzygnal i nie wolno mu tego domknac za gracza w zadna strone.


    5. CZEGO NARRATOR NIE DOPOWIEDZIAL - I TO JEST SWIADOME, TRZECI RAZ.

    oren_connection.lucan_said_it_out_loud ZOSTAJE

    said_obliquely_as_shared_interest_identity_still_unspoken. Lucan powiedzial "twoj

    problem", NIE "ty jestes czlowiekiem z rysopisu"; Kesz zrozumial i tez tego nie

    wypowiedzial. Nie padlo: imie Orena, zeznanie Halveka jako zrodlo, dopasowanie
    rysopisu

    ani rozbieznosc palec wskazujacy kontra lewy kciuk (retcon_000122 - narratorowi
    NIE

    WOLNO domknac tej identyfikacji za gracza).

    converging_target#consequence: "Kesz przestaje byc uslugodawca i staje sie strona

    z wlasnym motywem" - TO SIE WLASNIE ZACZELO, uruchomione RUCHEM GRACZA, nie narratora.

    Nadal jednak "zaden z nich nie dopowiedzial tego do konca na glos" i to zdanie

    obowiazuje dalej.


    6. INFORMACJA NIE ZOSTALA PRZEKAZANA. Lucan ZAPYTAL, czy Kesz jej chce. Kesz powiedzial

    tak. Samo powiedzenie, GDZIE tamten siedzi, jest nastepnym ruchem gracza i narrator
    go

    za niego nie wykonal (system/player-agency.md - narrator nie dopisuje Lucanowi

    wypowiedzi zmieniajacej relacje).


    7. PYTANIE O KAPLANA ZOSTAJE BEZ ODPOWIEDZI. Kesz zapytal w t_244, co Lucan zamierza

    z kaplanem zrobic, i dostal zaplate zamiast odpowiedzi. Odnotowal to RAZ, plasko,
    bez

    zlosci i bez powtarzania pytania (retcon_000142, retcon_000121). Nadal bez odpowiedzi

    takze: nazwisko urzednika akt, termin papierow, udzial pokoju.


    8. CZEGO NARRATOR NIE ZROBIL. Nie rozstrzygnal, czy Halvek juz mowil i komu. Nie

    wypuscil niczego z forbidden_without_source [lucan_necromancy, spidey_existence,

    varkhen_existence, veyr_house_structure] - Spidey i Tkaczka caly czas ukryci.
    Nie

    zbudowal zegara (retcon_000055) i nie wymyslil sledztwa (retcon_000058). Nie ruszyl

    zadnego z dwoch zegarow 3/15. Nie kazal Keszowi moralizowac ani obrazac sie na
    kpine -

    speech_traits zabraniaja jednego i drugiego.


    9. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, drzwi otwarte, 19:21.

    Obecni: Lucan, npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen

    w gildii. Sygnet u Lucana; pieczec, klucze i papiery w zone_wall_void baszty.
    Lucan

    19/19, energia bez wydatku - czytac z pliku. Wyjscie pod trzecia pieczec nadal

    zaplanowane na dzisiejsza noc.

    '
  new_decision: 'Kesz powiedzial tak i od razu przestawil pytanie: nie CHCE wiedziec,
    gdzie tamten siedzi, tylko CZY JUZ POWIEDZIAL I KOMU. Lucan ma teraz zdecydowac,
