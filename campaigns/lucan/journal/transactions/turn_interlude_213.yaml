      tells:
      - Czysci sie po robocie. Zawsze, drobiazgowo, przy Lucanie i bez pospiechu -
        to jest jego wytarcie ostrza i jednoczesnie komunikat, ze skonczyl.
      - Nie chodzi dwa razy ta sama droga. Nawet gdy to nadklada. Nawet gdy nikt nie
