  summary: 'Bez testu - interludium, roll_policy disabled. Dwie minuty, zero energii.

    Spidey wychodzi za nim. Klatwa nie wychodzi - i to jest odleglosc, nie opor.


    1. LEKTURA ZALICZONA WSTECZ. Gracz podal tytul w nawiasie: "Uprzejmosci"

    (item_courtesies_curse_book). Czterdziesci minut z t_212 wchodzi jako pierwsza
    sesja

    w objective_develop_lucan#read_and_develop_skill_related_knowledge, stan przestaje
    byc

    "planned". To POWTORKA - ksiazka byla przeczytana w t_092, teoria wchlonieta,
    praktyka

    w toku - i narrator NIE dopisuje z niej zadnej nowej mechaniki ani zadnego nowego

    rozdzialu. CZYTANIE DEFENSYWNE ("lista tego, na co patrzec, gdyby ktos probowal
    zrobic

    to JEMU", price_of_the_method) jest OSOBNYM katem lektury i wymaga deklaracji
    gracza;

    ta tura go nie zalicza, bo nie zostal zadeklarowany. Zero sekund - nawias.


    2. SPIDEY WYCHODZI ZA MARNEM I TO JEST CALA WYKONALNA CZESC DEKLARACJI. Z krokwi
    wzdluz

    belki, nad szynkwasem, przez uchylone tylne drzwi. Nikt nie patrzy w gore w izbie,
    w

    ktorej pije sie od poludnia. Dwie minuty.


    3. PODWORZEC - PIERWSZA OBSERWACJA, zone_obrecza_back_yard, znowu NIE OCZAMI LUCANA.

    Waski prostokat miedzy tylna sciana szynku a murem zapory. Beczki pod sciana,
    stos drewna,

    koryto na pomyje, sznur z mokrymi scierkami. W rogu furtka na boczna uliczke,
    uchylona,

    na skobel bez klodki. Zapora zamyka podworzec od polnocnego zachodu i to jest
    sciana,

    nie przejscie.

    MARN STOI TYLEM DO DRZWI, PRZY STOSIE DREWNA, i robi to, po co wyszedl. Sam.


    4. CZEGO NIE DA SIE STAD ZROBIC - I ZRODLO STOI W PLIKU, NIE W GLOWIE NARRATORA.

    capability_lucan_numb: range_m 8, requirements [line_of_effect,

    target_anatomy_or_animating_structure]. Lucan siedzi pod FRONTOWA sciana. Miedzy
    nim

    a Marnem jest cale wnetrze szynku i kamienna sciana; w linii prostej to okolo
    pietnastu

    do osiemnastu metrow, a linii efektu nie ma zadnej.

    POZYCZONY ZMYSL TEGO NIE ZAMYKA. ability_borrowed_sense ma limity

    [linked_servant_required, low_bandwidth, switching_causes_brief_disorientation]
    - to jest

    KANAL PERCEPCJI, a nie kanal rzucania. W calym kanonie jest DOKLADNIE JEDNA rzecz,
    ktora

    wolno poslac siecia zamiast linia: capability_oren_control, requirements

    [undead_target, line_or_prepared_network] - rozkaz nekromanty do NIEUMARLEGO.
    Klatwa

    neuromiesniowa na zywego czlowieka nie jest tym i zaden plik nie mowi, ze jest.

    TO NIE JEST NARRATOR STAWIAJACY OPOR (retcon_000033). Gdyby zrodla nie bylo, klatwa
    by

    poszla. Zrodlo jest, ma numer i da sie je wskazac palcem - to jest dokladnie test

    wymagany przez retcon_000058, tylko odwrocony: narrator ma go stosowac takze wtedy,
    gdy

    odmawia, a nie tylko wtedy, gdy dodaje.

    BRAKUJACA DZWIGNIA JEST JEDNA I JEST TANIA: osiem metrow z linia efektu. Zamyka
    ja RUCH

    LUCANA, nie zaden nowy czar, nie zadne ulepszenie i zaden zakup.


    5. DWIE DROGI NA PODWORZEC I OBIE ISTNIEJA NAPRAWDE. (a) Boczna uliczka wzdluz
    sciany

    szynku do uchylonej furtki na skobel - nikt po drodze, mniej niz minuta, i Lucan
    wchodzi

    Marnowi za plecy. (b) Przez izbe szynkowa i tylne drzwi - jedenascioro ludzi widzi,
    jak

    przechodzi, w tym osmioro z jego oddzialu. Narrator nie zamyka zadnej z nich i
    nie

    podpowiada, ktora jest lepsza.

    CO SIE STANIE, GDY ODLEGLOSC ZOSTANIE ZAMKNIETA - PODANE Z GORY, ZEBY WYBOR BYL
    SWIADOMY:

    numb w trybie zwyklym to subtelny, szybki cantrip za 0,1 energii ze sladem faint.
    Marn

    nie ma arkusza, nie jest przygotowany, nie jest magicznie pismienny i ma w sobie
    cztery

    godziny piwa - zwykly czlowiek bez arkusza nie jest przeciwnikiem w tescie (zasada
    gracza

    2026-08-19), a rzutow i tak nie ma. Kolana pojda. Rzecz rozstrzygnie sie narracyjnie

    i bez kosztu wartego nazwania.


    6. CZEGO NARRATOR TU NIE ZROBIL. Nie postawil zegara na to, jak dlugo Marn tam
    stoi -

    nie wiadomo i nie musi byc wiadomo. Nie kazal nikomu wyjsc za nim na podworzec.
    Nie

    zauwazyl Spideya nikim. Nie dopisal Marnowi ani podejrzenia, ani wiedzy

    (ossek-marn.yaml#do_not_play). Nie zrobil z furtki pulapki ani z bocznej uliczki

    zagrozenia (retcon_000055).


    7. STAN. Czwarty dzien interludium, ulica przed szynkiem, Lucan nadal pod sciana

    z "Uprzejmosciami" na kolanach, Tkacz przy nim. Spidey na podworcu. Integralnosc
    19/19,

    energia bez wydatku w tej turze. Marn tylem, przy stosie drewna, kubek i czapka
    zostaly

    w izbie. Godzine czytac ze state/time.yaml po commicie.

    '
