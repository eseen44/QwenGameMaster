outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut na
    zapleczu targu, zero energii. 1. KWOTY LADUJA I SA LEPSZE, NIZ KTOKOLWIEK Z NICH
    ZAKLADAL. Pierwsza rata to DWANASCIE TYSIECY SREBRA do reki, reszta z 52 000 w
    dwoch ratach, a udzialy Mary i Borosa - pelna stawka ze strony syndykatu plus
    dodatkowy procent schodzacy z Lucana - wychodza na 18-20 tysiecy na glowe. Mara
    przelicza to w glowie i nie kryje wyniku: szli na cene paserska, czyli dziesiec
    do pietnastu na osobe (objective_liquidate_cemetery_loot.expected_share_silver),
    a wyszlo wyzej i bez przetopu, ktory zostawialby ryta trzecia w worku. Kwituje
    to po swojemu, jednym zdaniem, ktore u niej znaczy uznanie. 2. I ZARAZ POTEM PROSTUJE,
    BEZ URAZY I BEZ OWIJANIA: nie pytala o pieniadze. Pieniadze sa policzone, jej
    dzialka idzie ich strona i nie potrzebuje do tego niczyjej relacji. Pytala o RESZTE.
    3. BO BOROS NIE BYL POZA TYM POKOJEM PRZYPADKIEM - NIE WSZEDL CELOWO. Jego wlasny
    warunek od poczatku brzmial: nie znalezc sie w ksiedze kupca (npc_boros_keld.agenda#stay_out_of_the_buyers_ledger).
    Oddal szescdziesiat kilo z wlasnej piwnicy i zostal na zewnatrz, zeby jego twarz
    nie trafila do zapisu, ktory syndykat prowadzi jako wlasne ubezpieczenie. To nie
    byla nieobecnosc - to byla oplata, ktora zaplacil, zeby Lucan mogl tam siedziec.
    4. WNIOSEK, KTORY MARA NAZYWA WPROST: dokladnie dlatego wszystkiego poza kwota
    Boros nie ma jak uslyszec inaczej niz od Lucana. Wojny z Kosciolem, pustki obiecanej
    wokol cmentarza na czas prob gildii, zakonu mieczowego sciaganego do roboty, o
    ktorej gildia nie wie, i tego, ze prawnik z pakietu przestal byc uslugodawca.
    Ona tego nie poniesie. Nie dlatego, ze nie chce - dlatego, ze nie jest jej to
    do przekazania. 5. RZECZ PRAKTYCZNA I CALKOWICIE W JEJ STYLU: dwunastu tysiecy
    nie liczy sie na zapleczu targu o zmierzchu, przy skladanych kozlach i ludziach,
    ktorzy caly dzien patrza, komu ciazy plaszcz. Nie robi z tego problemu - po prostu
    prowadzi go dalej niz miejsce, w ktorym stoja. 6. WORLD MOVE - BOROS JEST BLISKO
    I MARA IDZIE PO NIEGO. Zostal przy targu, tak jak sie umowil, i czeka na to, po
    co ich tam wyslano: na liczby. Mara mowi, ze go przyprowadzi albo zaprowadzi Lucana
    do niego, jak Lucan woli - ale robi to teraz, bo dzien sie konczy, a rano ona
    ma z Lucanem godzine cwiczen i wolalaby zaczac dzien czwarty bez zaleglosci z
    trzeciego. 7. STAN. 16:35 dnia trzeciego. Energia 7.8 z 15, integralnosc 19 z
    19, bez warunkow. Dwanascie tysiecy przy sobie, przepustka nietknieta, Spidey
    nieodkryty. Kanal ostrzegawczy dla syndykatu nadal nienazwany, odpowiedz dla Kesza
    - kim Lucan siada przy kaplanie - nadal nieudzielona.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Boros za chwile stanie naprzeciwko. Ile z ostatnich trzech godzin
    dostaje: sama kwota i podzial dwunastu tysiecy, czy takze Kosciol, cmentarz, zakon
    i Kesz. I gdzie ta rozmowa ma sie odbyc, skoro nie na zapleczu targu.'
