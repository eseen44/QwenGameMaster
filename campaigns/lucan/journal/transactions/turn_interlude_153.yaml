  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  summary: 'Bez testu - rozmowa, cztery minuty, zero energii. Nawias z czynem rozstrzygniety
    jako

    deklaracja (retcon_000032): szkielko ze zdrapka Sordiny zabrane ze stolu. Zagrywka

    merytoryczna gracza laduje w calosci (retcon_000033) i jest POPRAWNA - obala jednak

    zarzut, ktorego ojciec nie postawil. Arrangement complicated nie z powodu oporu

    narratora, tylko dlatego, ze wlasna interwencja Lucana produkuje sciezke ratunku,

    ktora wymaga jego okazu.

    1. PROBKA W KIESZENI. Szkielko z sinozielona zdrapka pleeni gluszacej schodzi
    ze stolu

    do Lucana. Nikt tego nie komentuje - ojciec przyniosl ja, zeby pokazac, i juz
    o niej

    zapomnial. Sordina jest zywym organizmem, wiec zdrapka jest materialem gotowym,
    nie

    obietnica; koszt materialowy zero, nakladana raz (worlds/solmara/lore/concealment-materials.yaml).

    2. LUCAN MA RACJE I OJCIEC PRZYZNAJE TO W PIERWSZYM ZDANIU. Krytyka poznania jest

    symetryczna: jesli granica nalezy do patrzacego, to podkopuje rowniez kryterium
    Kolma,

    bo tez wymaga obserwatora orzekajacego, ze tkanka jest martwa, a energia jest
    energia

    smierci. Ojciec nie ma z tym problemu i nie broni sie - to jest metodolog, nie

    polemista. Mowi wprost, ze owszem, truizm.

    3. ALE ZARZUT BYL INNY I LUCAN GO MINAL. Ojciec nie twierdzil, ze krytyka poznania

    obala dowod Neris. Twierdzil, ze ONA NAPISALA JEDNO, A POWIEDZIALA DRUGIE - w
    czesci

    trzeciej kryterium obiektywne, a przy tym stole dziesiec minut temu, ze granica
    moze

    byc cecha patrzacego. To nie jest zarzut do TRESCI, to zarzut do AUTORKI: dwa

    niezgodne twierdzenia jednego podpisu. Ten zarzut przezywa cala symetrie sceptycyzmu

    bez zadrapania, bo nie dotyczy prawdziwosci zadnego z twierdzen.

    4. NERIS PRZYZNAJE RACJE LUCANOWI NA GLOS, ZANIM POLICZY, CO JEJ TO DAJE

    (portrayal.the_flaw) - i natychmiast mowi, ze to najgorsza rzecz, jaka mogl

    powiedziec. Jej problemem nigdy nie byla prawdziwosc. Jej problemem jest CYTOWANIE

    (portrayal.voice.diction: "kto to potem powtorzy"). Truizm wypowiedziany przez

    REFERENTKE stanowiska nie jest truizmem - jest wycofaniem. Kolm nie musi tego

    obalac; musi to przeczytac na glos.

    5. OJCIEC DOKLADA POLOWE INSTYTUCJONALNA NIE WIEDZAC, ZE COKOLWIEK DOKLADA. Wzrusza

    ramionami i mowi to, co powiedzial juz w t_150 na osi wykrywalnosci: i tak to
    zmierza

    ludzie, ktorzy przyjezdzaja to mierzyc. Dla niego to uwaga porzadkowa o tym, ze
    w tym

    budynku nikt tego nie mierzy. Faktycznie nazywa cala asymetrie: kryterium Kolma

    (martwa tkanka i energia smierci, worlds/solmara/lore/necromancy-law.yaml#construct_boundary)

    ma za soba PRZYRZAD - stopien trzeci, pole czynne albo przyrzad swiecony. Kryterium

    Neris (mechanizm animacji, ciaglosc zycia, brak zwiazanej osoby lub duszy) nie
    ma

    zadnego, bo braku duszy nie da sie zmierzyc. Symetryczny sceptycyzm nie daje remisu
    -

    oddaje wygrana temu, kto przynosi odczyt i trzyma forum

    (planning/act-03-defence.yaml: "brak definicji jest oslona TEGO, KTO TRZYMA FORUM").

    Polityka ojca nie interesuje, wiec podaje to jako fakt techniczny i idzie dalej.

    6. NERIS ODBIJA ZARZUT, NIE ZGODE (constraint retcon_000039) - I ODBIJA GO W LUCANA,

    NIE W OJCA. Polzdanie, ucieta w polowie: nie prosila. Drugi raz w ciagu trzech
    minut

    jej pozycja zostala przestawiona bez pytania - najpierw przypieta jako podwladna

    (t_147), potem ujawniona jako autorka (t_152), teraz obroniona bez konsultacji.
    Nie

    konczy zdania, bo profesor Veyr juz mowi dalej i ona nie jest zdolna nie sluchac

    pytania o wlasny tekst.

    7. WORLD MOVE - OJCIEC PRZESTAJE ODPOWIADAC I ZACZYNA PROJEKTOWAC EKSPERYMENT.
    To

    jego ustalony tryb (concealment-materials.yaml, step 3: "przestaje odpowiadac
    na

    pytanie Lucana i zaczyna projektowac wlasny eksperyment") i ten sam ruch, ktory
    zrobil

    caly wieczor: zamienia obiekt na procedure. Wniosek: niech pani nie pisze KRYTERIUM,

    bo kryterium zawsze ktos obali. Niech pani napisze PROCEDURE - co po kolei zrobic
    z

    obiektem, zeby dostac odpowiedz, i kto to ma zrobic. Procedury krytyka poznania
    nie

    rusza, bo procedura nie twierdzi, czym rzecz jest, tylko co z nia zrobic.

    8. I TO JEST CENA WLASNEJ INTERWENCJI LUCANA, NIE KARA ZA NIA. Procedura potrzebuje

    OBIEKTU, na ktorym sie ja przeprowadza. W tym budynku jest dokladnie jeden taki
    obiekt

    i jest wlasnoscia Lucana. Ojciec nie stawia zadania i o nic nie prosi - jeszcze
    nie

    doszedl do tego kroku - ale kierunek jest jednoznaczny i zbiega sie z

    clock_father_arranges_academy_showing oraz z dysputa za szesnascie dni. Ratujac
    czesc

    trzecia Lucan zbudowal jej ratunek, ktory wymaga jego okazu na stole, publicznie.

    9. CZEGO NIE PADLO. Trzecia substancja (lichen_speculans) nadal nie. Pytanie ojca
    "do

    ktorego stopnia kupujemy" nadal nietkniete, drugi raz przysypane. Nikt nie wymienil

    Spideya ani slowa wabik. Ojciec nadal nie wie o nekromancji, sieci, Varkhenie,

    syndykacie, celi w piwnicy gildii ani o tym, ze okaz dla Akademii ma byc wabikiem.

    10. STAN. Zmierzch dnia trzeciego, laboratorium profesora Veyra, 17:53. Energia
    bez

    zmian, integralnosc 19 z 19, bez warunkow. Odbitka Neris nadal w rece Lucana,
    szkielko

    z Sordina teraz tez u niego. USTALONE: symetria sceptycyzmu przyznana przez ojca;

    rzeczywisty zarzut to niespojnosc autorki, nie tresc; problem Neris jest cytacyjny,
    nie

    prawdziwosciowy; asymetria nazwana - kryterium Kolma ma przyrzad, jej nie ma;

    Neris ma Lucanowi za zle, ze odpowiedzial za nia; ojciec zaproponowal zamiane

    kryterium na procedure i zaczyna projektowac eksperyment.

    '
