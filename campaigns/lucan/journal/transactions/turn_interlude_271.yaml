  arrangement: improved
  perspective: pc_lucan
  summary: 'OBA WSZCZEPY ZAWISAKA WYKONANE W CZTERY GODZINY, dokladnie wedlug godzin
    z planning/specimen-upgrades.yaml#build_moth_glutton (implant_sordina 2 h, implant_lichen_speculans
    2 h). Koszt czasowy, nie energetyczny (retcon_000024). Nadane flagi: sound_dampening_symbiont,
    symbiotic_parasite_load, substrate_matching_lichen, passive_concealment_when_still.
    KOSZT BIEZACY ZAPISANY, NIE PRZEMILCZANY: energy_model tego builda stawia symbiont_upkeep
    2 na dobe z necrotic_reservoir o pojemnosci 3, ktora sie NIE zmienia. Wpisane
    jako osobna pozycja oznaczona DOKUMENTACJA_NIE_MECHANIKA, bo silnik czyta wylacznie
    regeneration/decay/hunting_recovery, a decay zawisaka jest zniesione fiolka z
    t_090 i tego sie nie rusza. Rejestru wzrostu nie dotykano - utrzymanie nie jest
    generowana nadwyzka, wiec 18,3 stoi. ROZKAZ ANTYNIETOPERZOWY wydany zawisakowi
    i cmie 01. Ma pokrycie w materiale: narzad tympanalny cmy jest nastrojony na pasmo
    NIETOPERZA (companions/spidey.yaml#moth_tympanal_hearing_organ), wiec okaz juz
    to slyszy i rozkaz tylko mowi, co z tym zrobic. Adresuje udokumentowana przyczyne
    strat - cmy 02-04 maja w plikach formation eaten_in_the_upper_meadow_by_bats_or_birds.
    CZYTANIE POD ZADEKLAROWANYM KATEM zaliczone do objective_develop_lucan#read_and_develop_skill_related_knowledge.
    Wynik jest ZASADA PROJEKTOWA I TROPEM, nie nowa mechanika ani czarem: marginalia
    balwierza dotycza tego, co cialo toleruje stracic i w jakiej kolejnosci, bo czlowiek
    amputowal. Zapisane jako lead_hollow_out_what_does_not_carry_function w planning/lucan-leads.yaml.
    LUP NIEROWNY, ZGODNIE Z WIERNOSCIA ROZKAZU - "przyniescie to, co juz nie ucieka"
    (webber-network#additional_order_4). Czesc jest materialem, czesc smieciem. Zaden
    patrol, swiadek ani zagrozenie nie zostaly dodane; zaden plik ich nie stawia.'
  prose: 'Sordina wchodzi łatwiej, niż powinna, bo zawisak ma tułów zbudowany jak
    skrzynia na

    narzędzia i miejsce w nim jest. Dwie godziny przy lampie, pęseta, igła, i pasożyt

    siada tam, gdzie ma siedzieć; po godzinie przestaje być widoczny jako osobna rzecz.

    Porost idzie gorzej i dłużej, bo trzeba go rozłożyć pod chitynę równo, a on ma
    własne

    zdanie o tym, gdzie chce rosnąć. Kiedy Lucan kończy, zawisak siedzi na blacie
    i jest

    o dwa tony ciemniejszy niż blat, a po chwili o pół tonu jaśniejszy - dokładnie
    tak

    bardzo, jak bardzo blat jest jasny.


    Pracuje przy tym cicho. Nie ciszej niż przedtem - inaczej. Dźwięk nie zostaje
    stłumiony,

    tylko nie powstaje.


    Rozkaz o nietoperzach idzie krótko, bo to jedyny rozkaz, który ćma rozumie od
    razu:

    ona już to słyszy. Ucho nastrojone jest na pasmo nietoperza od urodzenia i to
    jest

    cała ironia trzech grobów nad garbarnią - słyszały, że nadchodzi, i nie wiedziały,
    że

    mają coś z tym zrobić. Teraz wiedzą: składać skrzydła, spadać w trawę, siedzieć.

    Ćma 01 przyjmuje to z drugiego końca miasta jak zmianę pozycji, nie jak wiadomość.


    Potem atlasy.


    To nie jest lektura ładna. Drukarz był tani, rysunki są sztywne, a balwierz poprawiał

    go własną ręką na marginesie przez pół życia - i te poprawki są warte całej reszty,

    bo człowiek, który amputuje, myśli wyłącznie o tym, co ciało toleruje stracić
    i w

    jakiej kolejności. Nie ma tam ani słowa o utrzymywaniu przy życiu. Jest kolejność.

    Jest to, co puchnie, co gnije pierwsze, co trzyma kształt, a co jest tylko wypełniaczem.


    I jest ta jedna rzecz, na którą Lucan liczył, wypisana cudzą ręką w innym celu:
    jelito

    i żołądek to u każdego stworzenia największy kawał miejsca, który nie robi nic
    poza

    trawieniem. U czegoś, co nie je, to jest ładownia.


    Kwadrans po piątej, przy świecy, blat pod ścianą wygląda jak targ o najgorszej
    porze.

    Cztery sieciarze przyszli pierwsi i przynieśli to, co sieciarz uważa za oczywiste:

    trzy szczury, z czego dwa wieczorne i jeden z zeszłego tygodnia, oraz kota. Kot
    jest

    młody, cały i martwy od kilku godzin - ktoś w mieście będzie go jutro wołał.

    Pająki dołożyły gołębia bez głowy, dwa duże biegaczowate i coś, co było kosem.

    Ćma przyniosła ćmę, co jest zabawne przez pierwsze dwie sekundy.


    Reszta to cena rozkazu, który przeszedł tak, jak przeszedł. Na blacie leży też
    suszona

    żaba sprzed sezonu, kawałek skórzanego pasa, dwa kamienie i coś, co kiedyś było

    kiełbasą. Wszystko to spełnia polecenie co do joty: już nie ucieka.

    '
