  summary: 'Bez testu - interludium, roll_policy disabled. Cztery minuty, zero energii.

    Pryncypal podaje pierwsza liczbe od poczatku znajomosci - i nie bierze za nia
    pieniedzy.


    1. LICZBA WRESZCIE PADA, BO DOPIERO TERAZ MA CO ZWAZYC. Przez cala rozmowe odmawial

    wyceny nie z przekory, tylko dlatego, ze nie mial specyfikacji (agenda#set_the_number_himself).

    Ma ja od t_197 i t_198. Wycenia w swoim rejestrze - ZA ROBOTE, NIE ZA TOWAR, dokladnie

    tak, jak zapowiedzial w t_198 ("kamien z mialu kosztuje tyle, co worek mialu,
    ale przebranie

    worka kosztuje dniowke").

    SZKIELKA, PIERWSZA PARTIA PROBEK: 15 SREBRA. Trzy worki odpadu jubilerskiego i
    trzy

    dniowki przebierania. Kamien w tej cenie jest gratis; placi sie za oczy i za czas.

    WIEDZMA, SAME NAMIARY: 10 SREBRA. Nie za wiedze - za poslanie i za to, ze po drodze
    ktos

    musi zapytac czlowieka, ktory nie lubi pytan.

    RAZEM 25 SREBRA. Skala jest zgodna z reszta kampanii: komplet szkla alchemicznego
    drugiego

    gatunku kosztowal 70, cala robota Sedda (odpis na trzy rece plus oprawa imitujaca)
    95,

    obiad dla Heska 4. Dniowka rzemieslnicza w okolicach kilku srebra.

    METAL - CENY BRAK I PRYNCYPAL MOWI DLACZEGO: nie ma czego wycenic, bo nie ma nazwy

    materialu (t_198). Zamowienie lezy w kanale bez liczby.


    2. NIE BIERZE GOTOWKI - I JEST TO NAJBARDZIEJ JEGO DECYZJA W CALEJ TEJ SCENIE.

    player/inventory.yaml: syndicate_payout_outstanding_silver 40000, dwie raty do
    odebrania.

    Czlowiek, ktory liczy zawodowo, nie wyciaga reki po dwadziescia piec srebra od
    kogos,

    komu sam winien jest czterdziesci tysiecy. Sciaga to z drugiej raty.

    SKUTEK MECHANICZNY: ZADNE SREBRO NIE ZMIENIA WLASCICIELA W TEJ TURZE. carried_silver

    zostaje 150, syndicate_payout_outstanding_silver zostaje 40000 - potracenie nastapi
    przy

    wyplacie, wiec dzis nie jest ksiegowane. player/inventory.yaml NIE jest ruszany.

    To jest tez zgodne z zasada gracza z 2026-08-24: nie dokladac kosztow, ktorych
    kanon

    nie ma. Nikt tu niczego nie wydal.


    3. ZASTRZEZENIE LUCANA - PIERWSZY POWOD, JAKI TEN CZLOWIEK DZIS DOSTAL, I NIE
    PROSIL O NIEGO.

    "Nic jej nie zrobie, szukam uslugodawcy" pada NIEPYTANE. Pryncypal cala rozmowe
    trzymal

    zasade z t_196: powodu nie kupuje i nie pyta o niego. Nie zmienia jej i teraz
    - ale

    odnotowuje, ze akurat TO zdanie ma wartosc uzytkowa, i mowi dlaczego: nie dla
    niego, tylko

    DLA CZLOWIEKA NA KONCU LANCUCHA. Zamowienie na namiary do kogos, kto robi rzeczy
    tego

    rodzaju, jest wedlug jego wlasnych slow z t_196 "nazwanym zyczeniem konkretnego
    czlowieka",

    a ludzie, o ktorych sie w ten sposob pyta, sa ostrozni co do tego, kto o nich
    pyta.

    Zdanie Lucana idzie wiec dalej razem z zamowieniem. NARRATOR NIE ROZSTRZYGA, czy
    jest

    prawdziwe, i nie zapowiada, ze zostanie sprawdzone.


    4. ZUK SCHOWANY. spy_beetle_01 wraca do kieszeni po czterech turach na stole.
    Flaga

    armoured_survives_handling_and_pockets i transportable_as_an_inert_object bez
    zmian.

    Toby ZOSTAJE - w skrzynce na dolnej polce, na pierwszym talerzyku.


    5. CZEGO NARRATOR TU NIE ROBI. Nie wydaje za Lucana ani jednego srebra

    (system/player-agency.md - narrator nie dopisuje wydania zasobu). Nie wycenia
    metalu,

    ktorego nazwy nikt nie zna. Nie stawia terminu dostawy ani probek, ani namiarow
    - zaden

    plik go nie daje i pryncypal go nie podal. Nie tworzy zegara. Nie zapowiada, ze
    pytanie

    o wiedzme gdzies zadzwoni, i nie dopisuje nikomu podejrzen (retcon_000055, retcon_000058).

    Nie kaze pryncypalowi zegnac sie cieplo ani zimno - to zwykle zamkniecie interesu.


    6. STAN NA WYJSCIU. Czwarty dzien interludium, 14:08, pokoj syndykatu na zapleczu
    targu.

    Energia 11,1/15, integralnosc 19/19, bez warunkow. carried_silver 150, nietkniete.

    BILANS TEJ SCENY: Kesz jest prawnikiem Lucana (gwarant proceduralny wobec gildii
    i Strazy,

    bez honorarium, warunek pokoju: syndykat widoczny, pryncypal nienazwany). Kanal
    ostrzegawczy

    dostarczony - Toby na pierwszym z czterech talerzykow. Trzy zamowienia w kanale:
    szkielka

    15, namiary 10, metal bez ceny. Oferta na zbitki lezy bez umowy, ale pryncypal
    juz zaczyna

    sprawdzac. Zamowienie u Sedda zlozone (95 srebra, 9 dni od wydania tomu, wzor
    nieprzekazany).

    Skrzynka szkla alchemicznego NADAL OPLACONA I NIEODEBRANA POD STRAGANEM (t_191)
    - to jest

    jedyna rzecz, ktora Lucan zostawil na targu niedokonczona.

    '
