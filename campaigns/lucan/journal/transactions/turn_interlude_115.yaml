outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dwadziescia piec
    minut za zagrodami dla zwierzat, zero energii. 1. NA ZART O EMERYTURZE ODPOWIADA
    MARA I ODPOWIEDZ JEST TWARDSZA, NIZ ZART ZASLUGIWAL. Ona nie moze wyjsc. Poreczenie
    za Lucana poszlo na JEJ nazwisko i nie ma daty konca (rel_mara_to_lucan.obligations)
    - reczyla za przyszlego klienta aparatu, nie za jedna transakcje. Zloto nie wykupuje
    takiego podpisu. Mowi to bez wyrzutu, jako fakt, ktory Lucan powinien juz znac.
    2. NA TO SAMO ODPOWIADA BOROS I ODPOWIEDZ JEST SUCHA. Osiemnascie tysiecy to dom,
    kilka lat spokoju i nuda. Emerytura lezy pod cmentarzem - skarbiec, ktory Varkhen
    przyrzekl grupie przy ukladzie o trzech pieczeciach (fact_boros_knows_varkhen_compact).
    Zaden z nich nie odchodzi, bo obaj wiedza, co jest jeszcze do wziecia i komu to
    obiecano. 3. LICZBY PRZYJETE OD RAZU I BEZ TARGU. Dwanascie tysiecy pierwszej
    raty, 52 000 za calosc w trzech ratach, ich dzialki pelna stawka ze strony syndykatu
    plus procent schodzacy z Lucana - osiemnascie do dwudziestu na glowe. Boros sortowal
    ten lup dwa dni i wie lepiej niz ktokolwiek, ile to jest ponad przetop. 4. JEDYNA
    RZECZ, PRZY KTOREJ SIE ZATRZYMUJE, JEST DOKLADNIE TA, KTOREJ MOZNA BYLO SIE PO
    NIM SPODZIEWAC: ryta trzecia poszla razem z reszta. Pierscienie zaloby z nazwiskami
    i datami, medaliony rodowe - to on je wydzielil i nazwal ryzykiem. Nie kwestionuje
    sprzedazy; pyta o jedno, po zolniersku: te przedmioty istnieja nadal i sa u kogos,
    kto prowadzi zapis. Zna cene wlasnej ostroznosci - dlatego nie wszedl do pokoju
    - i chce wiedziec, czy Lucan te cene rozumie. 5. CALA RESZTA IDZIE MU BEZ MRUGNIECIA
    I TO JEST NAJWIEKSZA RZECZ TEJ ROZMOWY. Kosciol, pustka obiecana wokol cmentarza
    na czas prob gildii, zakon mieczowy sciagany do roboty, o ktorej gildia nie wie,
    i prawnik, ktory stal sie strona. Boros nie moralizuje i nie pyta, czy Lucan oszalal.
    Pyta o obsade: kto stoi na ostrym koncu, kiedy z papieru zejdzie na rece. Jest
    frontlinerem i to jest u niego forma zgody. 6. WORLD MOVE - BOROS NAZYWA WLASNY
    WARUNEK NA DALSZA CZESC I JEST TO PIERWSZA RZECZ, O KTORA POPROSIL OD CZASU CMENTARZA.
    Skoro syndykat obiecal pustke wokol cmentarza NA CZAS PROB GILDII, to znaczy,
    ze ktos juz zaklada, ze grupa tam wroci - a wrocic maja we trojke do trzech pieczeci,
    ktore obiecali starcowi. Chce, zeby zanim to sie stanie, ustalili miedzy soba
    jedna rzecz: co dokladnie gildia ma wiedziec o tym, po co tam ida. Bo Mara pisze
    urzednikowi prawde, Lucan idzie na przesluchanie za dwa tygodnie, a Boros nie
    ma zamiaru byc jedynym, ktory na miejscu improwizuje. 7. STAN. 16:55 dnia trzeciego,
    targ prawie pusty, zwierzeta w zagrodach za plecami. Energia 7.8 z 15, integralnosc
    19 z 19, bez warunkow. Dwanascie tysiecy nadal nierozdzielone. Przepustka nietknieta,
    Spidey nieodkryty. Otwarte i nieudzielone: kanal ostrzegawczy dla syndykatu, odpowiedz
    dla Kesza kim Lucan siada przy kaplanie, droga po zakon mieczowy.'
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  new_decision: 'Boros czeka na dwie odpowiedzi: co z rytą trzecią, ktora istnieje
    nadal u ludzi prowadzacych zapis, i jedna wspolna wersja tego, po co grupa wraca
    na cmentarz - zanim ktokolwiek postawi tam stope. Do tego dwanascie tysiecy lezy
    nierozdzielone, a dzien sie konczy.'
