  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu. Dwadziescia minut, zero energii - rozkaz istniejacym slugom
    nic nie kosztuje. 1. ROZKAZ PRZECHODZI, BO JEST KSZTALTEM, A NIE ADRESEM. Zasada
    z tury 090 dziala tak samo w druga strone: swiezy, niezakotwiczony okaz z minimal_status
    nie przyjmuje "gabinet Seraphine, drugie drzwi na prawo", ale przyjmuje "do mnie,
    w gore". Wewnatrz jednego budynku to wystarcza - jest blisko, jest jeden kierunek
    i jest cel, ktory sam siedzi na koncu trasy. Oba pajaki wychodza z pudelka i ida.
    Zajmuje im to kilkanascie minut, bo ida NOGAMI, klatka schodowa dla sluzby i przy
    listwie. 2. I TU JEST PIERWSZY REALNY KOSZT TEJ METODY, KTORY NIE JEST ANI ENERGIA,
    ANI CZASEM. Dwa pajaki przechodza przez korytarz gildii w bialy dzien. Nikt ich
    nie zauwaza - bo nikt nie patrzy na listwe przypodlogowa - ale to jest przypadek,
    nie plan. Pudelko w kieszeni bylo zerowym ryzykiem; wlasny marsz nie jest. Roznica
    nie lezy w slugach, tylko w tym, ze Lucan wybral wygode zamiast noszenia. 3. POMIAR
    DNIA - CO WIDZI ZWYKLY, UWAZNY CZLOWIEK. Seraphine oglada oba z bliska, przy oknie,
    i odpowiada rzeczowo, bo o to zostala zapytana. Odpowiedz rozdziela sie na dwie
    i tylko jedna jest zla. RZUT OKA: nic. Pajak jak pajak. Rozklad jest stlumiony,
    ciala cale, nogi na miejscu, nic nie smierdzi i nic nie wyglada zle. W szufladzie,
    w kacie, pod biurkiem - niewidoczne, i to jest odpowiedz na jej wlasne pytanie
    o szuflade. TRZYDZIESCI SEKUND UWAGI: wszystko. Bo zywy pajak jest wiazka odruchow,
    a sluga jest wiazka rozkazow. Ten nie ucieka od cienia dloni. Nie zamiera, kiedy
    blat drgnie. Nie czysci sobie odnozy. Nie testuje podloza przed krokiem i nie
    zbacza z linii prostej dla niczego. Idzie tam, gdzie kazano, i kiedy dojdzie,
    PRZESTAJE - a zywy pajak nigdy nie przestaje calkowicie. 4. WNIOSEK OPERACYJNY,
    KTORY WYCHODZI Z TEGO SAM. Sluga jest doskonala w zamknieciu i zla w ruchu na
    widoku. Szuflada, skrzynia, szpara za listwa, przestrzen nad framuga - tam nie
    ma czego zobaczyc, bo nie ma na co patrzec. Otwarta podloga w oswietlonym pokoju
    przy kims, kto nie ma nic do roboty, jest jedynym miejscem, gdzie sie sypie. Seraphine
    dodaje jedyna czesc, ktorej Lucan nie mial: ludzie nie patrza na pajaki, ale ludzie
    zabijaja pajaki - i but sprzataczki nie potrzebuje zadnej wiedzy o nekromancji.
    5. DRUGI PAJAK - LUCAN ODDAJE JEJ WYBOR I ONA GO NIE BIERZE. Mowi, ze drugiego
    chcial jako czujnika przeszukania we wlasnym pokoju, ale jesli woli go gdzie indziej,
    prosze. Seraphine nie chce go nigdzie indziej. Jej logika jest ta sama co zawsze
    i nie ma w niej nic o magii: pokoj na gorze jest ZAREJESTROWANY NA LUCANA, wiec
    cokolwiek tam lezy, lezy na jego nazwisko. Kazde inne pomieszczenie w tym budynku
    ma innego wlasciciela wpisu. Zgadza sie wiec na dwa czujniki - jej szuflada i
    jego pokoj - i na nic poza tym, bo dalej zaczynaja sie cudze pokoje. 6. CZEGO
    LUCAN NIE POWIEDZIAL, DRUGI RAZ. Pokoj narad nie padl. Pytanie "gdzie jeszcze"
    zostalo zamkniete odpowiedzia, ktora jest PRAWDZIWA i JEDNOCZESNIE nie jest pelna
    - drugi pajak faktycznie idzie do jego pokoju, a plan sali narad po prostu przestal
    byc wymieniany. Seraphine uznaje temat za zamkniety. Lucan wie, ze nie jest. 7.
    STAN. 11:00 dnia trzeciego. Energia 8 z 15, integralnosc 19 z 19, bez warunkow.
    Oba pajaki na gorze, zaden jeszcze nie postawiony. Boros i Mara nadal dzisiaj.'
  new_decision: Dwa pajaki stoja na blacie, Seraphine zgodzila sie na szuflade i na
    pokoj Lucana, i wlasnie powiedziala mu, ze najwiekszym zagrozeniem dla nich jest
    but sprzataczki. Nic nie jest jeszcze postawione, a poludnie sie zbliza.
