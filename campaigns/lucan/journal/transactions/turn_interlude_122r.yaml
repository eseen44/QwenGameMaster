outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: complicated
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'POWTORKA SCENY po retcon_000041 (poprzednia wersja: superseded event_turn_interlude_122).
    Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut, zero energii.
    Varkhen obecny w gornych biurach (retcon_000037). 1. SERAPHINE NIE SORTUJE LISTY
    NA KOLUMNY I NIE ROBI PRZECIW-ODCZYTOW. Jest 18:50, o brzasku staje przed sluzbami
    miejskimi i triazuje wylacznie pod ten jeden pokoj: dzieli dziewiec pozycji na
    te, ktore moga wyjsc jutro przy JEJ nazwisku, i cala reszte, ktorej dzisiaj nie
    tknie. 2. PRZED SWITEM ISTNIEJA DLA NIEJ TRZY: urzednik magistratu przy garbarni,
    sprawa garbarnika (formalnie otwarta, i to ONA powiedziala o tym Lucanowi), oraz
    pioro Ruska - bo Rusk jest administracja miejska i jest wlasnie sprawdzany na
    kompetencje. Wszystkie trzy sa z tego samego budynku, do ktorego ona wchodzi za
    dziesiec godzin. 3. RESZTE ODKLADA WPROST I BEZ CEREGIELI: kaplan, prawnik, dysputa,
    zakon, rejestr, relikwia, nuda Varkhena - nie dzisiaj, bo nie umie tego wniesc
    do tamtego pokoju i nie zamierza probowac po nocy. Nie komentuje ich wartosci.
    4. CZEGO CHCE WIEDZIEC - PYTA, NIE ORZEKA. Przy urzedniku: czy pisze do osob czy
    do instytucji, i od kiedy. Przy garbarni: czy ktos kopie tam TERAZ, bo trop wyszedl
    od niej i wroci do niej. Przy piorze: czym to jest w sensie nosnika, czy zostawia
    slad i czy da sie to wygasic bez wiedzy Ruska - procedury nie chce znac. 5. NIE
    ZAUWAZA ZBIEGU MIEDZY URZEDNIKIEM I RUSKIEM (adresat listow jest tym samym czlowiekiem,
    ktoremu Lucan odebral zdolnosc pisania). Jest zmeczona i liczy pod jutro, nie
    pod cala sprawe. Jesli to ma wyjsc, wyjdzie od Lucana. 6. VARKHEN WTRACA SIE RAZ,
    KROTKO, WLASNYM REJESTREM - o piorze, jako o rzeczy zrobionej czlowiekowi za plecami,
    i nazywa to bez ogrodek. Nie doradza. 7. WORLD MOVE - ZADANIE W DRUGA STRONE,
    WASKIE I WYKONALNE. Nie zada kolejnosci siedmiu dzwigni i nie przekwalifikowuje
    przesluchania. Zada rozroznienia przy tych trzech pozycjach: ktora ma UMIEC SKLAMAC,
    a ktorej ma NIE ZNAC - bo to nie to samo ryzyko i przed switem musi wiedziec,
    ktora jest ktora. 8. STAN. 19:00 dnia trzeciego, gorne biura. Energia 7.8 z 15,
    integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka syndykatu
    w kieszeni, Spidey przy zebrach nieodkryty. Varkhen: integralnosc 8.4 z 65. NIEUSTALONE
    (wypadlo z kanonu wraz z 122-124): reakcja na doktryne prawna, kaplan jako swiadek,
    prawnik jako strona, odczyt dysputy, zakon, prosba Varkhena o naprawe.'
  new_decision: 'Seraphine chce przy trzech pozycjach dotyczacych jutra rozroznienia:
    ktora ma umiec sklamac, a ktorej ma nie znac.'
