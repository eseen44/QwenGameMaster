outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  apply_required_costs: true
  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Pietnascie minut,
    zero energii. 1. SPROSTOWANIE ZOSTAJE PRZYJETE OD RAZU I JEST DLA SERAPHINE GORSZE,
    NIE LEPSZE. Rozumiala dotad, ze to Lucan wygrywa dysputę, czyli ze zapalnik jest
    w jego reku i da sie go nie odpalac. Lucan prostuje: strona szerokiej definicji
    ma wlasna referentke (npc_neris_aldhen), ktora przygotowuje sie miesiacami, a
    skoro Lucanowi wystarczyl JEDEN dzien, zeby obalic tezy magow Kosciola, ona rozniesie
    ich calkowicie - i nie da sie jej przekonac, zeby przegrala. Wniosek Seraphine,
    wypowiedziany bez ozdob: zapalnik pali sie sam, bez udzialu Lucana, i konczy sie
    za szesnascie dni niezaleznie od tego, co ktokolwiek w tym pokoju postanowi. 2.
    TO PRZESTAWIA CALE PRZYGOTOWANIE Z DYSPUTY NA DZIEN PO NIEJ. Skoro wyniku nie
    da sie zmienic, przygotowanie do dysputy jest bezwartosciowe, a przygotowanie
    na to, co sie po niej dzieje, jest jedyna rzecza wartą czasu. A po niej sciezka
    formalna cichnie i srodek zaradczy zmienia rece z papieru na ludzi (necromancy-law.yaml#de_facto_liberalisation_mechanism,
    ostrzezenia Seraphine i Kesza zgodne co do slowa). 3. I DAJE TO ODPOWIEDZ NA PYTANIE
    O ZAKON Z ZUPELNIE INNEJ STRONY, NIZ SZUKALI. Kontrakt z zakonem przestaje byc
    opcjonalnym wsparciem operacji cmentarnej. Jesli po dyspucie w miescie pojawia
    sie ludzie zamiast pism, to jedyna instytucja w Lumarii, ktorej fachem jest stawanie
    miedzy tymi ludzmi a kims takim jak Lucan, jest wlasnie zakon mieczowy - a zakon
    zwiazany kontraktem z gildia nie jest ta sama rzecza, co zakon wolny. Cena papieru
    zostaje bez zmian, ale przestaje byc najwyzszym kosztem na stole. 4. JEDNA RZECZ
    SERAPHINE ZAPISUJE NA POTEM I MOWI, ZE NIE DZISIAJ: skoro Neris Aldhen broni szerokiej
    definicji, to okaz taki jak Spidey jest dla niej ARGUMENTEM, a nie dowodem rzeczowym
    - czyli jest ona jedyna osoba w tym miescie, ktorej interes pokrywa sie z interesem
    Lucana bez transakcji. I jednoczesnie osoba, ktora ma wlasny powod, zeby okaz
    zostal pokazany, zbadany i OPISANY. 5. VARKHEN ODPOWIADA NA PIERWSZE PYTANIE I
    ODPOWIADA PROSTO, BO TAK MYSLI. Czlowiek zwiazany przysiega strzezenia wrot nie
    chowa sie przed innymi ludzmi zwiazanymi ta sama przysiega. Zgadza sie byc widziany.
    Ale doklada rzecz, ktora jest jednoczesnie honorem i taktyka: zakon osadzi go
    po tym, CZYM jest, nie po tym, co przysiagl - i to jest ich prawo oraz ich obowiazek.
    Wiec ma byc pokazany KOMANDOROWI, zanim padnie kontrakt, a nie odkryty przez ich
    zolnierzy na cmentarzu w trakcie roboty. Roznica miedzy jednym a drugim to dla
    niego roznica miedzy ukladem a zasadzka. 6. NA DRUGIE PYTANIE ODPOWIADA JESZCZE
    PROSCIEJ I JEST TO NAJWIEKSZA RZECZ TEJ TURY. Nie nudzi sie z braku rozrywki.
    Nudzi sie, bo jest BEZUZYTECZNY: integralnosc 8.4 z 65, severely_depleted, bodily_integrity_compromised.
    Chce ODZYSKAC ZDOLNOSC DZIALANIA (npc_varkhen_mind.agenda#recover_enough_to_act)
    - nie dla siebie, tylko dlatego, ze trzy pieczecie czekaja, a on w tym stanie
    nie doniesie do nich wlasnego ciala. Prosi wprost o to, o co dotad nie prosil
    ani razu: o naprawe. Zna cene tego, o co prosi, i mowi, ze zna. 7. ZBIEG, KTORY
    OBAJ WIDZA W TEJ SAMEJ SEKUNDZIE. Lucan ma za okolo siedem dni dostac swiezy material
    z Akademii na wabiki pokazowe. Ten sam stol, te same rece, ten sam material. Roznica
    jest tylko taka, ze wabiki maja byc oddane, a Varkhen nie. 8. WORLD MOVE - SERAPHINE
    KONCZY WIECZOR I ROBI TO JAKO OFICER, NIE JAKO WSPOLNIK. Rano staje przed sluzbami
    miejskimi, a przedtem, przed swiatlem, pod drzwiami dyzurki stanie Mara na godzine
    cwiczen - czyli przykrywka dostaje pierwsza probe za niecale dziesiec godzin.
    Wyprasza Lucana slowami, ktore u niej znacza koniec rozmowy, i zostawia mu trzy
    rzeczy do rozstrzygniecia przed swtem: czy Varkhen idzie na stol przed komandorem
    czy po nim, co Lucan robi z dyzurka o brzasku, i kanal ostrzegawczy dla syndykatu,
    ktory jest jedyna pozycja z calego wieczoru, gdzie ktos czeka na odpowiedz Lucana,
    a nie odwrotnie. 9. STAN. 19:50 dnia trzeciego, gorne biura. Lucan: energia 7.8
    z 15, integralnosc 19 z 19, bez warunkow, 4 000 srebra w zlocie i przepustka syndykatu
    w kieszeni, Spidey przy zebrach nieodkryty. Varkhen: integralnosc 8.4 z 65, zdeklarowana
    prosba o naprawe. USTALONE: wynik dysputy jest poza kontrola Lucana, przygotowanie
    przenosi sie na dzien po niej; zakon staje sie konieczny, nie opcjonalny; Varkhen
    zgadza sie na pokazanie komandorowi PRZED kontraktem.'
  new_decision: 'Wieczor konczy sie w gornych biurach. Przed switem Lucan ma rozstrzygnac:
    naprawa Varkhena i kolejnosc wobec komandora zakonu, przykrywka dyzurki na przyjscie
    Mary o brzasku, oraz kanal ostrzegawczy dla syndykatu.'
