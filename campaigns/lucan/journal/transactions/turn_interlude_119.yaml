  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu - interludium buduje gracz (retcon_000033). Dziesiec minut,
    zero energii. 1. ODPOWIEDZ NA PYTANIE O SKLAD POKOJU JEST KONKRETNA I NIE ZOSTALA
    ZATRZYMANA JAKO TOWAR. Seraphine tlumaczy to jak oficer, ktory sam siedzial po
    obu stronach stolu. To NIE jest jedno cialo. Kierownictwo gildii to PRAKTYCY -
    ludzie po kilkunastu latach w polu, ktorzy teraz podpisuja. Nie czytaja raportu,
    czytaja KSZTALT OPERACJI: odleglosci, kolejnosc, czas, rany, kto gdzie stal. Zlapia
    klamstwo taktyczne w pol zdania, bo sami to robili - i nie obchodzi ich doktryna,
    tylko czy robota zostala zrobiona i ile bedzie kosztowac gildie. Sledztwo wewnetrzne,
    to samo, ktore idzie po Rusku, to URZEDNICY. Nie wiedza, jak pachnie woz ze zwlokami,
    ale przeczytali wszystko dwa razy i wylapia date, ktora nie pasuje do podpisu.
    2. I TU JEST WLASCIWA PULAPKA, KTORA ONA NAZYWA WPROST. Praktyka i urzednika NIE
    DA SIE oklamac tym samym klamstwem. Praktyka przekonuje wiarygodny przebieg, urzednika
    - zgodny papier. Wersja szyta pod jednego czyta sie u drugiego jak obraza. To
    jest dokladnie to, o czym mowila wczesniej pod haslem JEDNEJ wersji na wszystkie
    fora (act-03-defence.yaml#seminar_problem.tactic_one_version) - z ta roznica,
    ze teraz Lucan wie, ze rozjazd nie czeka na drugie forum. Siedzi w JEDNEJ sali.
    3. TRZECIA STRONA W TLE. Sluzby miejskie od tygodni zadaja przekazania cial, akt
    i dowodow z operacji cmentarnej, gildia sie opiera i wlasnie dlatego data nie
    zostala ogloszona (fact_seraphine_knows_custody_fight_over_bodies). Seraphine
    nie wie, czy beda w sali - wie, ze protokol z tej sesji stanie sie kartą przetargową
    w tym sporze, wiec kazde zdanie Lucana ma dwoch odbiorcow, nawet jesli drugi nie
    siedzi przy stole. 4. O RUSKU MOWI JEDNO ZDANIE I NIE ROZWIJA GO: to wewnetrzne
    sprawdzenie kompetencji ruszylo po zeznaniach Lucana, Mary i Borosa (fact_seraphine_knows_rusk_inquiry_origin).
    Ludzie, ktorzy je prowadza, znaja to nazwisko z akt, zanim Lucan wejdzie. 5. PROSBA
    O RZUT ZOSTAJE SPELNIONA BEZ JEDNEGO PYTANIA I TO JEST INFORMACJA O NIEJ, NIE
    O DRZWIACH. Nie pyta po co. Nie prosi o uzasadnienie. Wybiera przedmiot - wlasny
    gliniany kubek ze swojego blatu, nie mienie gildii, nic z rejestru - i rzuca nim
    w futryne mocno, z nadgarstka, tak jak sie rzuca, kiedy sie naprawde jest wsciekłym.
    Rozprysk idzie po progu i w korytarz. 6. I ROBI TO LEPIEJ, NIZ ZOSTALA POPROSZONA,
    BO KLAMSTWO JEST DLA NIEJ NARZEDZIEM, NIE PRZESZKODA. Sam trzask to za malo -
    awantura sklada sie z halasu I GLOSU. Wiec zaraz po rzucie mowi cos krotkiego
    tonem, ktory niesie przez schody, i dopiero potem siada. Kto to uslyszal, ten
    juz wie, co sie dzieje za tymi drzwiami: przyszedl z kwiatami, cos poleclalo.
    Zadna instytucja nie wchodzi w taka sale. 7. CENA, KTORA ONA SAMA NAZYWA, SPOKOJNIE
    I BEZ WYRZUTU: ten dzwiek nie kosztuje Lucana nic, kosztuje JA. Za dwa tygodnie
    ktos przy stole zapyta, czyim glosem mowi kontrolerka, ktora osłania podopiecznego
    - a od dzisiaj do tego pytania dochodzi wersja o kwiatach i potluczonym kubku.
    Jest najslabsza strona przy tym stole i sama to kiedys powiedziala (event_turn_interlude_033).
    Zaplacila z gory, tak jak on zaplacil kwiatami. 8. WORLD MOVE - NIKT NIE PRZYSZEDL
    I TO BYLO CALE ZALOZENIE. W korytarzu na dole ktos przystanal i poszedl dalej.
    Gorne biura pozostaja puste. Za to Seraphine odstawia to, co robila, calkowicie
    - akta sluzb ida na rog blatu grzbietem dloni - i wystawia rachunek jednym zdaniem:
    skoro Lucan kupil sobie pokoj, w ktorym nikt nie sluchа, to niech powie, co za
    ten pokoj mial byc kupione. Pyta juz nie o dzien. Pyta o RESZTE LISTY - to samo,
    po co czeka od dni (npc_seraphine_vale.agenda), tylko teraz ma podstawe. 9. STAN.
    18:20 dnia trzeciego, gorne biura, skorupy pod drzwiami, kwiaty na blacie. Energia
    7.8 z 15, integralnosc 19 z 19, bez warunkow. 4 000 srebra w zlocie i przepustka
    syndykatu w kieszeni, Spidey przy zebrach nieodkryty. NOWE: Lucan zna sklad pokoju
    (praktycy plus urzednicy plus sluzby jako cichy odbiorca protokolu) i wie, ze
    potrzebuje jednej wersji, ktora wytrzyma oba czytania naraz.'
  new_decision: Seraphine zaplacila kubkiem i wlasna reputacja za pokoj, w ktorym
    nikt nie slucha, i pyta wprost, co Lucan w tym pokoju zamierzal powiedziec. Co
    jej mowi - i czy mowi to w calosci.
