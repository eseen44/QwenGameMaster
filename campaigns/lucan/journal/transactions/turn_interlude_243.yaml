  prose: 'Pieczec zniknela z rozmowy tak, jak Kesz chcial: bez zapisywania i bez wracania.
    Rozdzial drog przyjal od razu i powiedzial, dlaczego jest dobry - dwa klucze,
    dwie sprawy, zadnego wspolnego papieru, wiec jak jedna sie zapali, druga sie nie
    zapali razem z nia. Pomysl rzucenia gildii starego wlasciciela nazwal najlepsza
    rzecza tego wieczoru i natychmiast pokazal, ile ona kosztuje: Lucan zamyka jedno
    postepowanie precedensem, ktory jest DOKLADNIE ta kategoria, o ktora za trzy tygodnie
    bedzie sie bil na dyspucie - ktos juz to robil w Lumarii, pod warsztatem, i miasto
    tego nie zobaczylo. Zamkniecie sprawy i uzbrojenie przeciwnika to w tym wypadku
    jedno pismo. Oferty do pryncypala nie odradzil, tylko poprawil jej adres: pokoju
    nie trzeba przekonywac do uczciwego interesu, bo pokoj juz kupuje grunt pod przyszlosc.
    Powiedzial Lucanowi, zeby sam nazwal, ile pokoj ma z tego dostac, zanim pokoj
    nazwie to za niego. Od rana idzie do miasta, bo tam moze zaczac bez nazwiska -
    wierzyciel z zlozonym pismem moze wniesc o zajecie. Rejestru nadal nie tyka.'
  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii,
    zero srebra.

    STRATEGIA PRZYJETA W CALOSCI, JEDEN KOSZT DOLOZONY Z PLIKU, JEDEN ADRES OFERTY

    POPRAWIONY. Pierwszy krok w miescie umowiony i wykonalny bez nazwiska urzednika.


    1. PIECZEC ZAMKNIETA PO WOLI KESZA. "Zakladam, ze nie wiesz" - przyjete, nie zapisane,

    nie wracamy. Fakt w karcie Kesza (fact_kesz_knows_lucan_holds_the_owners_silver_seal)

    ZOSTAJE, bo zdarzenie zaszlo i on to uslyszal - ale jego pozycja jest teraz

    "wie, ze istnieje, nie wie, gdzie jest i nie chce wiedziec". Pieczec nie opuscila

    zone_wall_void i nie zostala uzyta.


    2. POPRZEDNI WLASCICIEL NIE JEST STRONA. Gracz zadeklarowal, ze poprzedni wlasciciel

    nie ma praw do terenu, bo wszystko zostalo nabyte na nowo przez obecnego. NIE
    STOI TO

    W SPRZECZNOSCI Z NICZYM: tannery-owner#do_not_invent zakazuje wymyslania jego
    nazwiska,

    rodu i zwiazku z obecnym, a nie ustalania jego statusu prawnego, ktory nigdzie
    nie byl

    zapisany. Skutek prawny, ktory Kesz z tego wyciagnal: stary wlasciciel jest wiec

    BEZWARTOSCIOWY dla samego nabycia i wartosciowy WYLACZNIE jako osobny towar -
    czyli

    dokladnie tak, jak gracz go zaplanowal.


    3. GAMBIT "RZUCIC GILDII STAREGO WLASCICIELA" - PRZYJETY, Z JEDNYM KOSZTEM Z PLIKU.

    Zamiar: dac gildii udokumentowanego sprawce, zeby domknela wlasne postepowanie

    (clock_guild_leadership_hearing 3/15). Kesz nazwal to najlepszym pomyslem wieczoru

    i NIE stawil mu oporu (retcon_000033).

    KOSZT, KTORY DOLOZYL, JEST CYTATEM Z PLIKU, NIE WYMYSLONYM HAKIEM (retcon_000058
    -

    zadna lista, zaden swiadek, zaden zegar nie powstal):

    inventory#item_tannery_owner_cache.why_it_matters_now mowi wprost, ze te papiery
    to

    "DOKLADNIE ta kategoria prawna, o ktora toczy sie otwarta dysputa

    (necromancy-law#construct_boundary)" i ze katedra npc_ivar_kolm to BIOMUTANTY,
    a Lucan

    trzyma "gotowy precedens z Lumarii: ktos juz to robil, miasto tego nie zobaczylo,

    a zaklad dzialal dalej".

    CZYLI: to samo pismo, ktore zamyka postepowanie gildii, uzbraja druga strone dysputy,

    do ktorej Lucan staje za okolo 16 dni (clock_father_arranges_academy_showing 3/15).

    Kesz nie odradzil i nie zazadal decyzji teraz - postawil to jako jedna cene, jednym

    zdaniem (narrator.md#brudny-wybor: cene nazywa sie raz).

    NIEROZSTRZYGNIETE: czy stary wlasciciel zyje (tannery-owner#do_not_invent, los

    nieustalony) - a to zmienia, czy gildia dostaje sprawce, czy tylko akta.


    4. ROZDZIAL DROG PRZYJETY I UZASADNIONY ZAWODOWO. Miasto - zajecie majatku i oplata.

    Gildia - zamkniecie sprawy. Kesz nazwal zaleta, ktorej gracz nie musial nazywac:
    dwie

    sprawy bez wspolnego papieru nie zapalaja sie razem. Cel idealny gracza (wygrac
    aukcje

    komornicza ALBO doprowadzic do zajecia majatku PRZED zamknieciem sprawy gildii)
    przyjety

    jako cel, NIE jako obietnica - czy garbarnia w ogole idzie pod mlotek i na jakich

    warunkach zostaje NIEROZSTRZYGNIETE (lead_tannery_acquisition_via_bailiff_auction).


    5. PIERWSZY KROK, WYKONALNY BEZ NAZWISKA - I TO JEST REALNY POSTEP, NIE SCIANA

    (retcon_000138). Kesz idzie od rana DO MIASTA. Uzasadnienie: Lucan jest wierzycielem

    ze ZLOZONYM pismem (inventory#two_open_debts - "zlozyl na to formalne roszczenie
    przez

    gildie"), a wierzyciel moze WNIESC o zajecie majatku dluznika. Do tego nie potrzeba

    urzednika akt; urzednik jest potrzebny do RUSZENIA REJESTRU WLASNOSCI i tego Kesz
    nie

    tyka. NAZWISKA NIE ZAZADAL PO RAZ TRZECI (retcon_000121) - powiedzial tylko, gdzie
    sie

    droga konczy bez niego. Cena z t_241 bez zmian i nie powtorzona: ktos zauwazy,
    ze

    prawnik pyta o garbarnie.


    6. OFERTA DO PRYNCYPALA - PRZYJETA DO PRZEKAZANIA, ADRES POPRAWIONY. Lucan oferuje

    syndykatowi POCZATEK UCZCIWEJ PRZEDSIEBIORCZOSCI wymagajacej logistyki, pomocy
    prawnej

    i mniej prawnej, z pieczatka gildii pod statusem prawnym jako wisienka.

    DOTYKA obligation_define_syndicate_exchange_beyond_gold, ktorego status to

    "first_substantive_offer_made_not_yet_accepted" - oferta z t_198 (staly popyt
    na odpad

    jubilerski, potencjalnie Akademia jako odbiorca, UMOWY NIE MA). To jest wiec DRUGA,

    szersza oferta, nie pierwsza, i tez bez umowy.

    POPRAWKA KESZA JEST ODCZYTEM Z PLIKU, NIE JEGO MADROSCIA Z URZEDU (retcon_000040
    -

    NPC nie jest madrzejszy od gracza z urzedu): syndicate-weigher.yaml#seraphines_reading_of_the_motive

    mowi, ze syndykat KUPUJE PRZYSZLOSC TERENU - pryncypal sam powiedzial, ze pusta
    linia

    sciagnie kogos w ciagu tygodni i ze ktokolwiek ja wezmie, bedzie potrzebowal cmentarza.

    Kesz zna wiec pokoj z tej strony i mowi: pokoju nie trzeba przekonywac do gruntu,
    bo

    pokoj grunt juz kupuje. Rada, ktora z tego wyprowadzil: Lucan ma SAM nazwac, ile
    pokoj

    z tego dostaje, zanim pokoj nazwie to za niego.

    standing.room_condition NIENARUSZONE - pryncypal nadal nienazwany, a "Don" to
    slowo

    Lucana, ktorego Kesz nie powtarza. Pytanie "czyja twarz kupuje zaklad" NADAL OTWARTE

    i oferta go nie zalatwia.


    7. PROBLEM HARMONOGRAMU, KTORY WYNIKA Z DEKLARACJI, A NIE Z WYMYSLU NARRATORA.
    Lucan

    powiedzial, ze przyniesie papiery. Papiery leza w zone_wall_void Opuszczonej baszty

    przy murze - trzy kwadranse marszu w jedna strone (t_086). Na te noc ma juz zaplanowane

    wyjscie pod trzecia pieczec z Varkhenem (t_230, t_237). Kesz zapytal o TERMIN,
    bo tego

    wymaga jego wlasny kalendarz, nie po to, zeby dolozyc presje.


    8. CZEGO NARRATOR NIE ZROBIL. Nie wymyslil, czy stary wlasciciel zyje. Nie wymyslil

    wartosci zakladu, kwoty honorarium ani udzialu pokoju. Nie nazwal drugiej strony

    dysputy po imieniu poza tym, co jest w pliku (npc_ivar_kolm, biomutanty). Nie
    ruszyl

    zadnego zegara. Nie wypuscil niczego z forbidden_without_source [lucan_necromancy,

    spidey_existence, varkhen_existence, veyr_house_structure]. Nie podnosil kaplana
    ani

    kalendarza przesluchania z wlasnej inicjatywy (retcon_000142) - Kesz ma to na
    agendzie

    i jesli zechce, zapyta sam w scenie.


    9. STAN. Czwarty dzien interludium, pokoj na zapleczu targu, 19:11. Obecni: Lucan,

    npc_rovan_kesz, companion_spidey i webber_anchored (ukryci). Varkhen w gildii.
    Sygnet

    u Lucana; pieczec, klucze i papiery w zone_wall_void baszty. Lucan 19/19, energia
    bez

    wydatku - czytac z pliku. Wyjscie pod trzecia pieczec nadal zaplanowane na dzisiejsza
    noc.

    '
  new_decision: 'Kesz idzie od rana do miasta i pyta o dwie rzeczy praktyczne: KIEDY
    dostanie papiery (leza trzy kwadranse marszu stad, a noc jest juz zajeta) i ILE
    POKOJ MA Z TEGO DOSTAC, bo lepiej, zeby Lucan nazwal to pierwszy. Nierozstrzygniete
    nadal: nazwisko urzednika akt, czyja twarz kupuje zaklad, oraz czy Lucan godzi
    sie zaplacic za zamkniecie sprawy gildii precedensem, ktory uzbroi przeciwnika
    na dyspucie.'
