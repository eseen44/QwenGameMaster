            instancja i DEBETUJE jej pule, a foragingowa ekonomia wezlow nie jest
            w runtime symulowana w ogole - prowadzi ja recznie state/growth-banks.yaml.
            Strumien jest wiec zapisany tam, gdzie silnik go widzi. LUCAN MA PRIORYTET
            NAD WSZYSTKIMI WEZLAMI (deklaracja gracza 03.09.2026, to jego siec): dopoki
            rezerwa nie stoi przy sufcie, nadwyzka idzie w nia. Po sufcie ten sam
            strumien schodzi drabina z growth-banks#distribution_priority - najpierw
            wlasny growth_bank Lucana, potem okazy ZAKOTWICZONE, na koncu pozostale.
            Varkhen zostaje poza rozdzialem, racjonowany osobno (retcon_000113). Osobne,
            niezmienione: 3,5 na dobe wychodzace do zuka 01 (link_lucan_hand_charges_beetle_01).
            Netto przy pustej rezerwie: +14,5 na dobe.'
    conditions: []
    retired_conditions:
