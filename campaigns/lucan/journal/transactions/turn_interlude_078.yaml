  resolved_world_reaction_ids: []
  operations:
  - *id002
  summary: 'Bez testu. Godzina pracy zamienia stol z okazami w rozproszona siec siedemnastu
    slug. Seria rosnie z 5 do 17. 1. OSY ODPUSZCZONE. Pozostale zostaja martwe - decyzja
    gracza, nie ograniczenie swiata. spy_wasp_01 zostaje jedynym skrzydlatym egzemplarzem.
    2. NOWE ZLECENIE DLA SIECIARZY - MOTYLE I CMY, I TO JEST DOBRY RUCH. Cma to skrzydla
    BEZ brzeczenia, a do tego leci do swiatla, czyli sama wchodzi noca do zamieszkanych
    pokoi. Lepszy szpieg od osy na kazdej osi poza dniem. Rozkaz przechodzi czysciej
    niz 015, bo czworka jest starsza i madrzejsza, ale nadal bez kategoryzacji - w
    urobku wyladuja tez muchy i cokolwiek miekkiego i skrzydlatego. Zastrzezenie do
    MOTYLA, nie do cmy: motyl lata dniem, jest kolorowy i nie wchodzi do budynkow,
    wiec jest gorszy od tego, co Lucan wlasnie zamowil w drugiej polowie zdania. 3.
    SIEDEM ZUKOW WSTAJE I ROZCHODZI SIE. spy_beetle_02 do 08, wszystkie przyjmuja
    sie bez oporu - chityna znosi doba zwloki lepiej niz cokolwiek innego w urobku.
    Rozchodza sie same po ulicach i smietnikach wokol baszty, BEZ ROZKAZU, celowo.
    Zjedza rozklad, ktory tam jest, nie musza polowac, nie maja smyczy i nikt ich
    nie szuka. Z osmioma zukami Lucan ma pierwsza rzecz, ktora naprawde skaluje sie
    za darmo. 4. DOJRZEWANIE JAKO STRATEGIA - I JEST TO WLASCIWY LEWAREK. Brak rozkazu
    jest tu zamierzony: wiek daje sad i temperament darmowo, a to jedyna rzecz w tej
    kampanii, ktorej nie da sie kupic za energie. Cena to czas i to, ze za kilka tygodni
    bedzie mial kilkanascie dojrzalych slug z wlasnym zdaniem, rozsypanych po dzielnicy,
    bez zakotwiczenia. 5. SZESC PAJAKOW, PIEC PRZYDZIALOW. Wszystkie wstaja. spy_cellar_spider_02
    paruje sie z webber_home na miejscu. 03, 04 i 05 sa przypisane do webber_tannery,
    webber_dump i webber_anchored, ale nie ida tam same - sieciarze i tak wracaja
    do baszty na nocne doladowanie, wiec zabiora je przy najblizszej rotacji (alternatywa:
    Spidey i jego linked_logistics, jesli Lucan bedzie chcial szybciej). 06 zostaje
    przy Spideyu. spy_cellar_spider_01, ten pierwszy z tury 076, ZOSTAL NIEPRZYDZIELONY
    - w urobku bylo szesc pajakow, a rozdzial obejmuje piec. 6. PROGRAM RECZNEGO KARMIENIA.
    Spidey ma spasc 06 najszybciej jak mozna, bezpiecznie, bez dzieci i kotow, karmiac
    recznie. Mechanika: zbiornik 3 zapelnia sie od razu, nadwyzka idzie do rezerwy
    przeznaczonej na tego sluge (growth_bank). Samo karmienie NIE powoduje ewolucji
    - trwaly krok trzeba potem zadeklarowac i zaplacic, 8 za pierwszy. Realnym ogranicznikiem
    tempa jest wielkosc bezpiecznej zdobyczy: po wykluczeniu kotow zostaja glownie
    szczury, i tak objete stalym rozkazem z tury 055. 7. NIKT NIE ZAKOTWICZONY, NIKT
    NIE ZMODYFIKOWANY. Skutek dwustronny - brak pozyczonego zmyslu i ubozszy kanal,
    ale sekcja na dowolnym z siedemnastu nie ujawnia Death_Anchor, a strata sztuki
    nie boli.'
  new_decision: '21:56, siedemnascie slug w polu albo na blacie, resztka urobku bez
    wartosci, noc jeszcze dluga. Do rozstrzygniecia - co Lucan robi z pozostala noca:
    bierze sie w koncu za wabika dla Akademii, robi pajaka alarmowego dla Seraphine
    z nieprzydzielonego spy_cellar_spider_01, czy idzie spac do celi w gildii.'
