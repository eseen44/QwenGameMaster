  turn_id: turn_interlude_078
  declared_action: Lucan zostawia pozostale osy nietkniete jako zbyt widoczne i zmienia
    stale zlecenie sieciarzom - nastepnym razem maja przynosic motyle i cmy. Potem
    ozywia wszystkie pozostale zuki i kaze im rozejsc sie po okolicy bez rozkazu,
    zeby dojrzewaly. Wraca do pajakow piwnicznych, ozywia je wszystkie i przypisuje
    po jednym do kazdego sieciarza jako partnera, bez zadnych modyfikacji. Ostatniego
    zostawia przy Spideyu z zadaniem dla Spideya - spasc go najszybciej jak mozna,
    bezpiecznie, bez dzieci i kotow, karmiac go recznie. Nikogo nie zakotwicza.
  actor_id: pc_lucan
  scope: execution
  stakes: Ile cial jeszcze przyjmuje ozywienie; czy zmieniony rozkaz przechodzi przez
    pasmo lacza sieciarzy; jak pajaki docieraja do posterunkow oddalonych od baszty;
    co realnie daje reczne karmienie okazu bez zakotwiczenia.
  time_class: significant
  condition_ids: []
  modifiers: []
