outcome:
  schema_version: 1
  intent_achieved: true
  arrangement: improved
  perspective: pc_lucan
  summary: 'POSZERZENIE PRZYJETE BEZ OPORU, bo gracz podal powod, ktorego narrator
    nie ma czym podwazyc: pelne worki nie przejda bokiem, a odwrot tym bardziej. Strop
    trzyma wedle Geo z t_288, wiec poszerzanie nie jest ryzykiem i nie robie z niego
    takiego. MARA DOSTAJE ZADANIE W SWOJEJ DOMENIE i odpowiada z niej: zamiast mechanizmow,
    ktorych w komorze grobowej nie ma, czyta PODLOGE. To jest jej rzemioslo z karty
    (zwiadowczyni, obserwatorka) i daje wynik lepszy niz pytanie o pulapki: kurz lezy
    grubo i ROWNO, ulozony wylacznie przez przeciag, bez jednego sladu stopy. Nikt
    tedy nie chodzi. NISZE SA ZAMKNIETE PLYTAMI. To jest odpowiedz na pytanie gracza
    i jednoczesnie postawienie sprawy: cokolwiek tu lezy, lezy ZA plyta, wiec wziecie
    tego znaczy otwieranie grobow. Narrator tego nie ocenia i nie dolicza do tego
    zadnej kary - stawia fakt. GRADIENT, KTORY MARA NAZYWA: plyty przy wejsciu sa
    proste i bez znakow, dalej w glab robia sie wieksze i lepiej ciete. Wiaze sie
    to z tym, co Boros wie z t_101: roznica miedzy anonimowym kruszcem a rzecza ryta
    i identyfikowalna jest calym problemem przy sprzedazy. SKAN Z WNETRZA, kanal czysty,
    bo Spidey poszedl w glab przed skanem - procedura stala z t_289 zadzialala bez
    przypominania, tak jak zapisano. KAMIEN: komora jest dluga, a za jej dalszym koncem
    NIE MA SCIANY - jest dalszy ciag. Za plecami nisz jest lita skala, wiec sciany
    niczego nie kryja. SYGNATURY: umarli leza W NISZACH, w rzedach, plasko i staro
    - i UKLAD NIE KONCZY SIE Z KOMORA. Ciagnie sie poza jej daleki koniec. To NIE
    jest jedno pomieszczenie, tylko poczatek czegos wiekszego. Zaden zegar z tego
    nie rusza (retcon_000055) i nic nie goni. SPIDEY wraca z tym, co uznal za dosc:
    ruchu nie ma, a komora ma dalszy ciag. Dalej nie poszedl i to jego wlasna decyzja
    - karta mowi, ze sam wybiera stanowisko (t_133). KOSZT: 0,1 jednostki, 14,8 ->
    14,7. NIEUSTALONE: co jest za plytami; jak daleko ciagnie sie uklad; gdzie jest
    drugie wejscie.'
  prose: '— Poszerz to jeszcze — mówi Lucan. — Tyle, żeby przeszedł pełny worek. I
    żeby dało się

    wyjść biegiem.


    Boros patrzy na dziurę, potem na worki, potem bierze drąg.


    — Trzeba było od razu tak powiedzieć — mówi bez cienia pretensji i zabiera się
    do roboty.


    Idzie szybciej niż przedtem, bo teraz odłupuje się już tylko krawędzie, a nie
    cały stożek.

    Po niecałej godzinie przejście jest takie, że człowiek z ładunkiem na plecach
    przechodzi

    przodem i nie musi się zastanawiać.


    W tym czasie Spidey odchodzi w głąb — najpierw wzdłuż prawej ściany, potem przestaje
    być

    widoczny w świetle i przestaje być czymkolwiek poza wiedzą, że gdzieś tam jest.


    Mara idzie dwadzieścia kroków do przodu z lampą przy ziemi, nie przy twarzy, i
    wraca po

    chwili.


    — Pułapek nie ma — mówi. — I nie będzie, bo tu nie ma czego pilnować mechanizmem.
    To nie

    skarbiec, to grobowiec. — Kuca i pokazuje palcem podłogę. — Ale patrz na to.


    Kurz leży grubo. Leży też **równo**: usypany w długie, miękkie fale, wszystkie
    ułożone

    w tę samą stronę, tam, gdzie od lat idzie powietrze. Jest gładki jak śnieg na
    polu.


    — Nikt tędy nie chodzi — mówi Mara. — Od bardzo dawna. Gdyby ktoś przeszedł raz
    w ciągu

    roku, jeszcze by to było widać.


    Potem wstaje i pokazuje lampą półki.


    — Groby są zamknięte. Każdy. — Światło idzie po rzędzie płyt wpasowanych w kamień,
    jedna

    przy drugiej, bez jednej szpary. — Tu przy wejściu proste, bez znaków. Ale im
    dalej patrzę,

    tym są większe i tym lepiej cięte.


    Boros podnosi głowę znad drąga i po raz pierwszy od trzech godzin odzywa się o
    czymś innym

    niż robota.


    — Rżnięte czy gładkie?


    — Stąd nie widzę.


    — To zobaczymy. — Wraca do krawędzi. — Bo gładkie się sprzedaje, a rżnięte trzeba
    topić.


    Lucan czeka, aż Spidey będzie dość daleko, i dopiero wtedy przykłada dłoń do starego
    muru.


    Kamień idzie długo. Komora ciągnie się o wiele dalej, niż sięgały dzisiaj oczy
    — a tam,

    gdzie powinna się skończyć, nie ma ściany. Jest dalszy ciąg. Za plecami półek
    jest za to

    lita skała: nisze są wykute w calcu i niczego nie ukrywają poza tym, co w nich
    położono.


    Druga połowa protokołu przychodzi czysto, bo tym razem nikt jej nie zagłusza.


    Umarli są w niszach. Rząd po rzędzie, poziom nad poziomem, płasko i staro, tak
    samo jak

    słychać ich było zza gruzu.


    I układ nie kończy się z tą komorą. Idzie dalej — za daleki koniec, w to, czego
    kamień

    nie nazywa, i tam też są, i tam też leżą równo.


    Spidey wraca kwadrans później i to, co przynosi, mieści się w dwóch rzeczach.
    Nic się

    nie rusza. I to nie jest ostatnie pomieszczenie.

    '
