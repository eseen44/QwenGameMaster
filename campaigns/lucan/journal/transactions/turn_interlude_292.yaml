  new_decision: 'Komora grobowa, 16:17, dzien piaty. PRZEJSCIE POSZERZONE: czlowiek
    z ladunkiem przechodzi przodem i da sie wyjsc biegiem - powod podany przez gracza,
    nie dorobiony przez narratora. CO USTALONO W TEJ TURZE: (1) pulapek nie ma i nie
    bedzie, bo to grobowiec, nie skarbiec; (2) KURZ LEZY ROWNO, usypany wylacznie
    przez przeciag, BEZ JEDNEGO SLADU STOPY - nikt tedy nie chodzi i nie chodzil od
    lat; (3) WSZYSTKIE NISZE SA ZAMKNIETE PLYTAMI, przy wejsciu prostymi i bez znakow,
    dalej wiekszymi i lepiej cietymi; (4) za plecami nisz jest lita skala, wiec sciany
    niczego nie kryja; (5) komora ciagnie sie duzo dalej, a tam, gdzie powinna sie
    konczyc, NIE MA SCIANY; (6) uklad umarlych NIE KONCZY SIE Z TA KOMORA - idzie
    poza jej daleki koniec. To nie jest jedno pomieszczenie. SPIDEY wrocil z dwoma
    rzeczami: nic sie nie rusza i to nie jest ostatnie pomieszczenie. BOROS POSTAWIL
    WLASNE PYTANIE, ktore jest o pieniadze i o ryzyko naraz: plyty gladkie czy rznieta
    - bo gladkie sie sprzedaje, a rznieta trzeba topic (wie to z t_101, gdzie sam
    przeliczyl 60 kg lupu). OTWARTE: czy otwieraja plyty; czy ida w glab; czy szukaja
    drugiego wejscia. Rezerwa 14,7/15. Wciaz nikt nie zajrzal do zadnej niszy.'
