  summary: 'Bez testu - interludium, roll_policy disabled. Osiem minut, zero energii.

    Pytanie Kesza z t_113 zostaje odpowiedziane po 80 turach. Dwa z trzech zadan Lucana

    ladują, trzecie wraca z nazwiskiem tego, kto o nim decyduje - i to nie jest Kesz.


    0. KARTA KESZA BYLA STARA, SPRAWDZONA PRZED PIERWSZA KWESTIA (retcon_000121).

    lifecycle.last_confirmed_event_id: event_turn_interlude_113, czyli 80 tur temu.
    Recall na

    "Kesz" i "kaplan" nie zwraca NICZEGO po t_113 - zadna pozniejsza tura go nie dotknela,

    wiec pytanie z t_113 jest nadal realnie otwarte, a nie zamkniete po cichu jak
    zadanie

    Seraphine w retcon_000121. Karta uzupelniona po tej scenie.


    1. TRZY ELEMENTY NARAZ - PRZYJETE, ALE NIE JAKO OSTROZNOSC. Kesz mowi wprost,
    ze pytal

    o JEDEN, bo w takim pokoju druga strona musi wiedziec, z kim rozmawia, zeby wiedziec,

    czym moze grozic. Trzy naraz to nie jest wymijajaca odpowiedz - to jest odpowiedz
    maksymalna:

    trzy instytucje, do ktorych kaplan moze pojsc na skarge, i jednoczesnie trzy,
    ktore trzeba

    ruszyc, zanim ktokolwiek Lucana dotknie. Kesz nie odradza. Nazywa cene i zapisuje.

    ELEMENT, KTORY WEDLUG NIEGO REALNIE ZMIENIA POKOJ, TO VEYR - i ma na to pokrycie
    z wlasnej

    karty (knowledge#known_about_lucans_father, t_109/110): syndykat wie, ze ojciec
    Lucana byl

    DWA RAZY POTEPIONY PRZEZ INKWIZYCJE i przezyl to. Dla ludzi Kesza to precedens
    operacyjny.

    Dla czlowieka w stule to rodzina, ktora dwa razy wygrala z jego strona.


    2. ALE TO JEST TEZ JEGO WLASNE RYZYKO I MOWI TO, ZANIM MUSI (portrayal:

    states_his_position_before_he_has_to). Spotkanie organizuje ON. Jesli Lucan wchodzi
    tam

    jako Veyr, ktory zapowiedzial wojne z Kosciolem (fact_kesz_knows_lucan_declared_war_on_the_

    church, t_110), to Kesz jest czlowiekiem, ktory go przyprowadzil. Nie wycofuje
    sie - stawia

    to na stole jako pozycje, ktora bedzie musial komus wytlumaczyc.

    CZEGO NARRATOR TU NIE ROBI: nie domyka watku lead_priest_is_the_converging_target.

    Kesz NIE WIE, ze Lucan ma go jako kandydata na czlowieka z atramentem

    (oren_connection.lucan_said_it_out_loud: false), a rozbieznosc kciuk/palec wskazujacy
    z

    retcon_000122 zostaje nierozstrzygnieta. Kesz gra swoje ryzyko, nie cudza teorie
    o sobie.


    3. SPOTKANIE Z KAPLANEM - POTWIERDZONE, WIADOMOSC IDZIE DZIS. Termin NIE POWSTAJE:

    t_113 mowi, ze Kesz organizuje i przysle wiadomosc, a data nie jest jego do dania.

    Zaden plik nie stawia temu zegara i narrator zadnego nie zaklada.


    4. STRAZ - JEGO FORUM, ALE JEST KOLIZJA I JEST W PLIKU. Kesz zna urzednikow magistratu

    i obieg karny; to jest dokladnie jego teren. Problem nie jest kompetencyjny, tylko

    klientowski i pochodzi z t_100: o strazy ta sama organizacja powiedziala, ze

    Z KLIENTEM W MUNDURZE SIE NIE KONKURUJE. Prawnik pokoju stojacy obok Lucana naprzeciw

    Strazy to pokoj konkurujacy z wlasnym klientem. Kesz tego nie odmawia - przenosi
    decyzje

    tam, gdzie ona nalezy.


    5. GILDIA - NIE JEGO FORUM I MOWI TO SAM. Przesluchanie kierownictwa gildii nie
    jest sadem,

    tylko wewnetrznym postepowaniem prywatnej korporacji. Kesz zna urzednikow magistratu,

    nie Akademie i nie statuty gildii (portrayal#group_role). Jego zawodowa uwaga,
    podana bez

    moralizowania: wprowadzenie prawnika obiegu przestepczego na wewnetrzne przesluchanie
    mowi

    kierownictwu cos o Lucanie, zanim Lucan otworzy usta. Nie zabrania. Wycenia.


    6. I TAK CZY INACZEJ NIE ON O TYM DECYDUJE - TO STOI W KARCIE OD POCZATKU.

    standing.is_lucans_lawyer: false, agenda: take_lucan_as_client_only_if_the_room_allows,

    a przy pierwszym kontakcie (t_104) powiedzial wprost, ze jest prawnikiem POKOJU
    i to pokoj

    decyduje, czego moze sie o Lucanie dowiedziec. Odpowiedz brzmi wiec: pytanie idzie
    do stolu

    wagowego, kilkadziesiat krokow dalej, gdzie Lucan i tak zmierza. Nic tu nie jest
    odmowa;

    wszystko jest przekazaniem decyzji do wlasciwej osoby.


    7. RZECZ, KTORA WLASNIE ZOSTALA URUCHOMIONA I NIE JEST WYMYSLONA PRZEZ NARRATORA.

    obligation_warn_seraphine_before_contacting_dispute_sides ma status active i brzmi:

    "Uprzedzic Seraphine przed istotnym kontaktem z ktorakolwiek strona sporu"

    (event_turn_interlude_029). Kaplan jest strona koscielna sporu Akademia-Kosciol.
    Wyslanie

    przez Kesza wiadomosci do kaplana jest tym kontaktem. Seraphine jest w tej chwili
    NA

    SPOTKANIU ZE STRAZA (t_188-190), wiec uprzedzic jej teraz fizycznie nie sposob.

    Zobowiazanie NIE jest zlamane - jest OTWARTE i ma teraz konkretna tresc do przekazania.

    Zaden plik nie stawia temu terminu i narrator go nie stawia.


    8. CZEGO NARRATOR TU NIE ROBI. Nie wskrzesza forka dwoch sprzecznych obron - jest

    UCHYLONY (act-03-defence.yaml#institutional_defence.two_contradictory_defences,
    superseded

    przez t_108 i t_123: jedna obrona z dwoma znanymi dziurami, Kosciol i Varkhen).
    Nie robi

    z Kesza wyroczni madrzejszej od gracza (narrator.md#kazdy_npc). Nie stawia terminu,
    nie

    tworzy zegara, nie zapowiada, ze cos pojdzie zle, i nie orzeka za pryncypala.


    9. STAN. Czwarty dzien interludium, targ. Energia i integralnosc bez zmian poza
    regeneracja.

    Zegary bez ruchu poza uplywem czasu. Odpowiedz o trzech elementach zlozona, wiadomosc
    do

    kaplana idzie dzis, reprezentacja wobec gildii i Strazy NIEROZSTRZYGNIETA i przeniesiona

    do stolu wagowego. Nic nie zaplacone, zadna umowa nie zawarta.

    '
  operations:
  - op: set
    instance_id: pc_lucan
    path: position.formation
    value: at_the_market_answered_keszs_t113_question_with_all_three_hats_at_once_academy_on_deans_leave_guild_member_and_veyr_word_goes_to_the_priest_today_representation_before_guild_and_watch_bounced_to_the_weighers_table_and_the_seraphine_warning_obligation_is_now_live_with_content
  - *id002
  new_decision: 'Kesz zapisuje trzy elementy i wysyla wiadomosc do kaplana jeszcze
    dzis, ale reprezentacji sam nie obiecuje - decyduje pokoj, a pokoj siedzi kilkadziesiat
    krokow dalej przy wadze. Lucan wchodzi tam wiec z czterema rzeczami naraz: pajakiem
    jako SPOSOBEM ostrzegania i wciaz bez NAZWISKA, ktore obiecal w t_109; prosba
    o wypozyczenie im wlasnego prawnika przeciw Strazy, z ktora ich organizacja nie
    konkuruje; nierozstrzygnietym pytaniem, co oferuje syndykatowi poza zlotem; oraz
    - jesli zechce - kamieniami z bizuterii grobowej, ktora sam im sprzedal trzy dni
    temu. Poza pokojem wisi swiezo uruchomione zobowiazanie: Seraphine ma zostac uprzedzona
    o kontakcie ze strona koscielna, a wraca dopiero ze spotkania ze Straza.'
