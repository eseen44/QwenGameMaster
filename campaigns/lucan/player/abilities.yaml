cover_account_given_to_others:
  source_event_id: event_turn_interlude_184
  corrected_by: retcon_000120
  status: NOT_MECHANICAL_CANON
  warning: >-
    TO NIE JEST OPIS TEGO, JAK DZIALA MAGIA LUCANA. To jest WERSJA, ktora Lucan podal
    Marze Teln w t_184 - czesciowo prawdziwa, czesciowo swiadomie zmiekczona, po to zeby
    humanizowac alternatywe. Alternatywa brzmi: niesmiertelny szkielet, ktory widzi swiat
    jak cytryne do wycisniecia i kontrolowania przez wiecznosc. Narrator w t_184 przepisal
    te kwestie do plikow JAKO MECHANIKE - blad, patrz retcon_000120. Prawdziwy mechanizm
    NIE JEST zadeklarowany i nie wolno go domniemywac z tego, co Lucan komukolwiek mowi.
  known_false_element: >-
    "Na zywych nie probowalem" jest KLAMSTWEM ZAMIERZONYM, podanym Marze po to, zeby je
    powtarzala dalej. Traktowac jako zasiane, nie jako fakt o Lucanie.
  applies_to: [ability_direct_drain, ability_basic_self_repair, ability_vital_overdrive]
  directing_life_force_as_told: >-
    Lucan KIERUJE sila zyciowa, nie leczy w sensie kaplanskim. Precyzja zalezy od wlasciciela sily:
    wlasna - dokladnie; cudza - z trudnoscia; na ZYWYCH nie probowal ani razu. Osobna kategoria to
    NIE-MARTWI: tam sila juz sie ciala nie trzyma, cialo jedzie na oparach, a sama sila przestala byc
    jego i szuka kogos, kto moze ja przyjac. To wyjasnia wstecz
    fact_mara_saw_varkhen_weaken_during_lucans_contact - i wlasnie dlatego jest wygodna:
    przesuwa akcent z "Lucan wzial" na "to juz nie bylo jego". Czy tak jest naprawde,
    zaden plik nie rozstrzyga.
  how_healing_works_as_told: >-
    Nikt w tym swiecie nie wie dokladnie, czym jest gojenie. Lucan procesu NIE zastepuje - WYMUSZA go:
    kaze kawalkowi wlasnego ciala goic sie tu i teraz, choćby nie wiem co. Dzwignia jest WIEDZOWA,
    nie energetyczna - dobra anatomia i szkolne badanie samego procesu mowia mu, GDZIE nacisnac.
    Domyka to limity z ability_basic_self_repair: bolesne (cialo jest przymuszane), not_regeneration
    (nie ma wersji pasywnej) i cannot_restore_missing_tissue (mozna przyspieszyc proces, ktory cialo
    umie; nie mozna kazac mu zrobic czegos, czego nie umie wcale).
