  - id: ability_borrowed_sense
    capability_ref: capability_lucan_borrowed_sense
    name: Borrowed Sense
    mastery: 31
    limits: [linked_servant_required, low_bandwidth, switching_causes_brief_disorientation]
    casting_from_the_node:
      source: retcon_000131
      text: >-
        RZUCANIE Z POZYCJI SLUGI. Wezel, w ktorym siedzi uwaga Lucana, jest punktem, z ktorego
        liczy sie zasieg (range_m), line_of_effect oraz wymog widzenia/wiedzy o celu. Widocznosc
        i slad magiczny powstaja PRZY SLUDZE, nie przy Lucanie; przy Lucanie moze powstac
        wylacznie slad DUZEGO przesylu energii siecia, a cantrip nim nie jest.
      energy: >-
        Energia idzie siecia i placi standardowa strate propagacji - Lucan<->Spidey 70 procent
        na krotkim dystansie z narastajaca strata na odleglosc, sieciarz 80 procent, straty
        mnoza sie na kazdym przeskoku (webber-network.yaml#network_cost_model). Zeby zlozyc
        X jednostek przy sludze, Lucan wydaje X / sprawnosc lancucha.
      does_not_change: >-
        Nie znosi zadnego innego wymogu konkretnej zdolnosci - kontakt wzrokowy, koncentracja
        i wlasna widocznosc czaru nadal obowiazuja, tylko sprawdzane sa na sludze. NIE dotyczy
        dostarczania DOTYKIEM: dotyk to dlon Lucana i cala metoda z "Uprzejmosci" zostaje przy
        jego ciele. Nie znosi retcon_000100 - uwaga jest szeregowa, wiec rzucanie z wezla
        znaczy, ze Lucan jest w tym wezle. Nie tworzy nowej zdolnosci i nie podnosi mastery.
      precedent: campaigns/lucan/migration/mechanics/capabilities/oren-control.yaml
    source_refs: [source_luka_b_fragment#line:3869-4004, source_luka_b_fragment#line:5062-5072, retcon_000131]
