theoretical_repertoire:
  source_event_id: event_turn_interlude_092
  source_item: item_courtesies_curse_book
  status: eleven_procedures_known_in_theory_three_mastered_and_repeatable_see_mastery_fields
  definition: 'Lucan potrafi kazda procedure nazwac, rozlozyc na kolejnosc krokow, wskazac
    wizualizacje i opisac przeplyw energii - czyli ma pelna wiedze magiczna w rozumieniu
    system/magic.md. Brakuje JEDNEGO UDANEGO PRZEBIEGU wlasnym kanalem, zeby wzorzec byl
    powtarzalny. Nauka z ksiazki nie jest dla niego waskim gardlem; jest akademikiem.'
  delivery: 'KANAL NIE JEST ZROSNIETY Z KLATWA (retcon_000132). Pole delivery na karcie
    procedury nizej jest ZAPISEM PIERWSZEGO PRZEBIEGU, NIE WYMOGIEM. Kazda z tych klatw
    moze pojsc kazdym kanalem - dotykiem, rozdzialem towarzyskim, na dystans jak numb,
    przez przedmiot, z opoznieniem albo bez, z pozycji slugi (retcon_000131). Metamagia
    jest DODATKOWA: modyfikuje koszt, sile, widocznosc, rzuty obronne, zasieg i skale,
    ale zaden czar jej nie wymusza.
    CO KUPUJE ROZDZIAL TOWARZYSKI: obnizenie kosztu (dotyk to os range na zerze, warta
    okolo jednego poziomu), ZNIESIENIE RZUTU NA ODPARCIE (rytual spoleczny to automatyzm,
    a nie swiadomy akt - nie ma czym rzucac) oraz, w polaczeniu z OPOZNIENIEM, ZNIESIENIE
    RZUTU NA WYKRYCIE (opoznienie zrywa lancuch przyczynowo-skutkowy). Bez opoznienia rzut
    obronny nadal odpada, ale dopuszczalny jest rzut na rozpoznanie-skojarzenie.
    ZBIOR KANALOW JEST OTWARTY: liczy sie AKT PRZYJECIA CZEGOS, CO NALEZY DO RZUCAJACEGO -
    powitanie, toast, podziekowanie, kondolencje, podarunek, ale takze rzeczy spoza ksiazki,
    np. wysluchanie z emocja czyjegos koncertu. Narratorowi nie wolno odmawiac kanalu
    dlatego, ze nie ma go w spisie tresci.
    NIEZMIENIONE: jedna procedura na kontakt (t_095), odpornosc celu na sam EFEKT, kara
    2^luka, cena zasiegu zdjetego z zera. Pelny opis: system/curses.md.'
  procedures:
  - {id: curse_focal_cramp, tier: 1, class: physical, note: Zaciska jedna grupe miesniowa - dlon na broni, przepona, kark.}
  - {id: curse_laryngospasm, tier: 1-2, class: physical, note: Cel nie moze mowic ani krzyknac - brak alarmu i brak swiadka, ktory zawola.}
  - {id: curse_orthostatic_collapse, tier: 1, class: physical, note: Omdlenie przy wstawaniu, opoznione, czyta sie jako choroba.}
  - {id: curse_sensitisation, tier: 2, class: biological, note: Nastepny kontakt z pospolita substancja daje gwaltowna reakcje alergiczna. Moze zabic. Zaprzeczalne.}
  - {id: curse_histamine_blistering, tier: 1-2, class: biological, note: Babel i palenie pod ubraniem - czysty bol bez dowodu poza wysypka.}
  - {id: curse_unscratchable_itch, tier: 1, class: biological, note: Kilka dni bez snu, tortura bez sladu.}
  - {id: curse_hormone_dump, tier: 2, class: biological, note: Panika bez powodu - podane przed przesluchaniem robi z kompetentnego czlowieka niewiarygodnego. Calkowicie niewidzialne.}
  - {id: curse_induced_sleep, tier: '1-2', class: mental, mastery: mastered_repeatable, first_successful_run: event_turn_interlude_097, first_target: npc_halven_rusk_via_pen, measured_cost_units: 3, note: 'Narastajace cisnienie senne przechodzace w sen prawdziwy; cel obwinia wino. Przebieg 097 poszedl rozdzialem PODARUNEK - najdrozsza procedura w zbiorze, dziala bez obecnosci Lucana.'}
  - {id: curse_memory_trap, tier: 2, class: mental, mastery: mastered_repeatable, first_successful_run: event_turn_interlude_129, first_target: npc_academy_porter, measured_cost_units: 1, delivery: pozegnanie_klasa_opozniona, note: 'Wspomnienie twarzy sie nie konsoliduje - godzine pozniej cel nie potrafi Lucana opisac. NIE zabiera samej rozmowy ani wnioskow celu, tylko rysopis. Najcenniejsza procedura w jego sytuacji.'}
  - {id: curse_loosened_tongue, tier: 2, class: mental, mastery: mastered_repeatable, first_successful_run: event_turn_interlude_096, first_target: npc_halven_rusk, measured_cost_units: 1, second_use: event_turn_interlude_127, note: 'Obnizenie hamowania; badany pamieta mila rozmowe, nie przesluchanie. Dostarczane rozdzialem POWITANIE. Skutek uboczny zmierzony w 127: rozwiazany jezyk nie zataja TAKZE tego, co cel normalnie zatrzymalby dla siebie, i przy braku odpowiedzi konfabuluje.'}
  - {id: curse_sustained_dread, tier: 1-2, class: mental, note: Trzyma lek albo zal swiezym przez dni i degraduje osad.}
  practice_gate:
    physical_and_biological: 'Do wycwiczenia na kregowcu. Szczury sa darmowe i objete stalym
      rozkazem polowania od event_turn_interlude_055 - material treningowy przychodzi sam.'
    mental: 'NIE MA WERSJI SZCZURZEJ. Nie istnieje szczur, ktory nie potrafi opisac twarzy.
      Pierwsza proba zapadni pamieci, rozwiazania jezyka i usypiania odbedzie sie na
      czlowieku i bedzie jednoczesnie pierwszym uzyciem. Procedura, ktora zadziala w polowie,
      zostawia czlowieka pamietajacego Lucana POLOWICZNIE - gorzej, niz gdyby nie rzucil.'
