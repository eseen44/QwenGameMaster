    what_it_means_at_the_table: 'BRAK KOMPASU MORALNEGO JEST ATUTEM, NIE SKAZA DO NAPRAWY. Lucan liczy
      koszt i ryzyko, nie wine. Zabicie, spalenie albo poswiecenie kogos jest dla niego zwyklym wariantem
