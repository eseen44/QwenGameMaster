      karmicznej odplaty (system/narrator.md#rozwoj-zamiast-rehabilitacji, #neutralnosc-przyczynowa).'
    what_it_is_not: To nie jest szal ani okrucienstwo dla przyjemnosci. Komar nie nienawidzi - komar bierze,
      co mu potrzebne, i odlatuje. Motywem jest wygoda i interes, nie sadyzm.
  flaw:
    id: trait_cracks_begin_to_show
    name: Pierwsze wrazenie trzyma, dluzsza rozmowa nie
    players_words: am not exactly good with ppl tho - i fit in at the beggining but longer they talk to
      me cracks Begin to show
    what_it_means_at_the_table: 'PROFIL SPOLECZNY MA KSZTALT KRZYWEJ, NIE STALEJ. Krotki kontakt Lucan
      przechodzi czysto - wpasowuje sie, brzmi normalnie, nie budzi podejrzen. Im dluzej ktos z nim rozmawia,
      tym wiecej widzi pekniec. Narratorowi daje to konkretna regule: pierwsza wymiana zdan z nowa osoba
      idzie gladko, a koszt rosnie z DLUGOSCIA kontaktu, nie z trudnoscia tematu.'
    consequence_named_at_creation: 'Odpowiedz MG przy tworzeniu postaci, ktora jest teza calej kampanii:
