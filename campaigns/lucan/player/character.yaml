facts_confirmed:
  - Lucan jest żywy, przytomny i nie odniósł w komorze Varkhena jawnej rany fizycznej.
  - Jego przewaga wynika z wiedzy, przygotowania, sług, osłabień i wykorzystywania słabości, nie z siły fizycznej.
  - Doktorat i badania Lucana dotyczyły anatomii, biologii oraz chemii. Ten warsztat tłumaczy szybki rozwój materialnej i eksperymentalnej części nekromancji, ale nie daje automatycznej wiedzy o duszach, rytuałach ani pradawnych nieumarłych.
  - Praca z ojcem wyrobiła w Lucanie wysoką tolerancję na chaos, mało tabu badawczych i umiejętność zarządzania ciągłym kryzysem; najlepiej działa, gdy może przekształcać katastrofę w serię problemów roboczych.
  - Bez przygotowania pozostaje fizycznie w zakresie zwykłego, niezbyt silnego człowieka.
  - Bezpośrednio przed granicą kanonu przejął kontrolę nad Varkhenem przy pomocy Mary i Borosa.
  - Przeciążenie kolektora (milestone_043a_logistics_collector_overload, przesył energii z serca cmentarza) trwale poszerzyło rezerwę z 12 do 15. 15 jest nową bazą i nowym progiem komfortowym, nie stanem przeciążenia. Dawna dwunastka NIE POZOSTAWIA żadnego skutku ubocznego - nie ma podwyższonej detekowalności powyżej 12 (retcon_000004 i retcon_000019).
