facts_confirmed:
  - Lucan jest żywy, przytomny i nie odniósł w komorze Varkhena jawnej rany fizycznej.
  - Jego przewaga wynika z wiedzy, przygotowania, sług, osłabień i wykorzystywania słabości, nie z siły fizycznej.
  - Bez przygotowania pozostaje fizycznie w zakresie zwykłego, niezbyt silnego człowieka.
  - Bezpośrednio przed granicą kanonu przejął kontrolę nad Varkhenem przy pomocy Mary i Borosa.
  - Przeciążenie kolektora (milestone_043a_logistics_collector_overload, przesył energii z serca cmentarza) trwale poszerzyło rezerwę z 12 do 15. 15 jest nową bazą i nowym progiem komfortowym, nie stanem przeciążenia - Lucan przy 13,6/15 ma zapas i może jeszcze wchłaniać. Jedyny utrzymujący się skutek: energia powyżej dawnego progu 12 jest mniej subtelna i łatwiejsza do wykrycia (retcon_000004).
