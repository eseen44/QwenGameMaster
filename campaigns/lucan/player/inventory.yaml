  - id: item_tannery_owner_cache
    name: Papiery, klucze i srebrna pieczęć właściciela garbarni
    location: wall_hideout
    operational_relevance: reassessed_2026_08_27_was_wrongly_marked_low
    reassessment_note: 'Wpis mowil "low_but_possible_evidence_or_disguise". Sprawdzenie
      zrodla Aktu 1 pokazuje, ze to najbardziej OBCIAZAJACY i jednoczesnie najbardziej
      UZYTECZNY plik papierow, jaki Lucan ma - i ze dotyka wprost przedmiotu nadchodzacej
      disputy. Nie jest to zloto ani narzedzie; jest to precedens plus dwa dlugi.'
    contents:
      - 'Srebrna pieczec OBECNEGO wlasciciela - zabrana z jego biurka. Lucan sam nazwal ja
         "dowodem zbrodni" i dlatego jej nie NOSIL przy sobie - ale jej nie zniszczyl i nie
         oddal. ZAMIAR JEST FALSZERSKI (doprecyzowanie gracza 2026-08-27): trzyma ja z
         nadzieja na podrabianie dokumentow. Patrz #forgery_intent nizej.'
      - 'Pek kluczy zakladu i podziemi, w tym klucz "III", oraz maly, zbyt porzadny kluczyk
         z kieszeni plaszcza wlasciciela - do czego pasuje, NIEUSTALONE do dzis.'
      - 'Rejestr rachunkowy z wpisami pod symbolem POPRZEDNIEGO wlasciciela: "transport nocny",
         "dolny sklad", "bez ksiegowania miejskiego".'
      - 'Pieczec poprzedniego wlasciciela, stare listy, umowy dostaw, szkice kanalow.'
      - 'Metalowa tabliczka "KOMORA III - DOSTEP TECHNICZNY" i notatki o Komorze III, w tym
         zdanie: "Okazy niestabilne. Karmic wylacznie po zamknieciu sluzy."'
      - 'Dwa stare flakony, nieotwierane: jeden z zaschnietym osadem i znakiem starego
         laboratorium alchemicznego, drugi ciemny, bez etykiety.'
    why_it_matters_now: |
      PAPIERY DOKUMENTUJA NIELEGALNA HODOWLE OKAZOW prowadzona pod garbarnia przez
      poprzedniego wlasciciela - z komora techniczna, sluza i harmonogramem karmienia.
      To jest DOKLADNIE ta kategoria prawna, o ktora toczy sie otwarta dysputa
      (necromancy-law#construct_boundary), a katedra npc_ivar_kolm to BIOMUTANTY.
      Lucan trzyma wiec w murze gotowy precedens z Lumarii: ktos juz to robil, miasto
      tego nie zobaczylo, a zaklad dzialal dalej. Nie jest to samo w sobie zagrozenie
      ani wybawienie - jest to material, ktory istnieje i o ktorym nikt poza Lucanem nie wie.
    two_open_debts:
      - 'WOBEC OBECNEGO WLASCICIELA: kazal przynosic wszystko z nazwiskiem poprzednika
         NAJPIERW SOBIE, zanim zobaczy to miasto. Lucan tego nie zrobil - wzial papiery
         i swiadomie postanowil nie wracac ani nie spotykac pracodawcy. Do tego obrabowal
         mu MIESZKANIE i SKRYTKE (jego wlasnymi kluczami), zabral pieczec i ZATRZYMAL
         KLUCZE. Ten czlowiek zna Lucana z nazwiska i z twarzy ("Veyr. Znowu ty."), podal
         mu reke i PRZEZYL. Pelna karta: entities/npcs/tannery-owner.yaml.'
      - 'ODWROTNIE TEZ: to WLASCICIEL wisi Lucanowi pieniadze za eksploracje i Lucan
         zlozyl na to formalne roszczenie przez gildie - patrz
         objectives#tannery_owner_release_tripwire. Dlug idzie w dwie strony.'
      - 'WOBEC POPRZEDNIEGO WLASCICIELA: nigdy nienazwany, los nieustalony. Jesli zyje,
         Lucan trzyma jedyny znany zbior dowodow przeciw niemu.'
    forgery_intent:
      declared_by: player
      source_event_id: player_ruling_2026_08_27
      text: |
        LUCAN ZACHOWAL PIECZEC I SYGNET Z ZAMIAREM UZYCIA ICH DO FALSZERSTW. Nie jest to
        wiec balast po Akcie 1 ani pamiatka - jest to narzedzie odlozone na pozniej.
      co_to_realnie_daje: |
        Srebrna pieczec zakladu uwierzytelnia dokumenty handlowe: umowy dostaw, kwity,
        zlecenia, zamowienia. Sygnet szlachecki uwierzytelnia pisma OSOBISTE i listy
        polecajace. Sa to dwa rozne rejestry i nie zastepuja sie.
      dlaczego_to_teraz_ciekawsze_niz_bylo: |
        Wlasciciel SIEDZI, a miasto ROZLICZA jego majatek (npcs/tannery-owner.yaml).
        Dokument opieczetowany jego pieczecia z data z tego okresu jest wiec albo bardzo
        mocny, albo natychmiast podejrzany - zaleznie od tego, czy pasuje do audytu,
        ktory wlasnie ktos prowadzi. Narzedzie zyskalo ostrosc w obie strony.
      nieustalone: 'Czy Lucan umie podrobic rekе i jezyk dokumentu, czy tylko odcisk.
        Sama pieczec daje piecz, nie autora. Rozstrzygnac, gdy padnie deklaracja uzycia.'
    location_note: 'container_wall_hideout = zone_wall_void w loc_city_wall_hideout.
      SZEW ROZSTRZYGNIETY przez gracza 2026-08-27: rzeczy faktycznie lezaly najpierw w
      piwnicy pod garbarnia, ale WSZYSTKO zostalo przeniesione do baszty w ramach
      przeprowadzki. Powod byl operacyjny, nie porzadkowy: piwnice uznano za NARUSZONA
      i ZNANA BOROSOWI - a wiec i gildii - czyli niedosc bezpieczna. Zrodlo potwierdza
      sam ruch: "Przenosze tu moje prawie meble. Wszystkie zdobycze, pieczec, plaszcz,
      kolejne ubrania, ktore zabralismy z mieszkania wlasciciela... zabrac sie ostatecznie
      z piwnicy". Zaden szew, decyzja.'
    source_refs: [source_luka_b_fragment#line:3541-3657,
      'migration/sources/normalized/historical-full-run.utf8.txt#line:2352',
      'migration/sources/normalized/historical-full-run.utf8.txt#line:2536-2612',
      'migration/sources/normalized/historical-full-run.utf8.txt#line:4146',
      'migration/sources/normalized/historical-full-run.utf8.txt#line:4233-4275']
