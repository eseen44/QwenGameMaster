      text: |
        DWIE RZECZY NARAZ, I TO JEST CALA WARTOSC TEGO PRZEDMIOTU: (a) jest SLADEM PO
        POPRZEDNIM WLASCICIELU garbarni, (b) jest jednoczesnie czyms, co Lucan ZABRAL ZE
