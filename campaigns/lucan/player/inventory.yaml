    - 'SPRZEDAZ LUPU CMENTARNEGO (event_turn_interlude_111): syndykat placi 52 000 srebra za calosc, ryta trzecia i robota konsekracyjna wlacznie, przy wartosci brutto ok. 100 000. Wyplata w TRZECH RATACH - pierwsza 12 000 wydana w pokoju, w zlotej monecie, zeby dalo sie ja wyniesc. Pozostale 40 000 do odebrania. Udzialy Borosa i Mary ida OSOBNO, ze strony syndykatu, pelna stawka; dodatkowy procent schodzi z Lucana zgodnie z jego wlasna propozycja.'
    - 'PODZIAL PIERWSZEJ RATY (event_turn_interlude_116): 12 000 podzielone po rowno na trzy - 4 000 dla Lucana, 4 000 dla npc_boros_keld, 4 000 dla npc_mara_teln, w zlotej monecie. Boros i Mara zakladaja, ze idzie to NA POCZET ich osobnych dzialek ze strony syndykatu, dopoki Lucan nie powie inaczej. Do odebrania pozostaje 40 000 w dwoch ratach.'
    - 'carried_silver obnizone o 2 (event_turn_interlude_013_market_food_run) - jedzenie kupione na targu.'
    - 'carried_silver obnizone o 1 (event_turn_interlude_015_silkworms_and_specimen_order) - koszyk zywych jedwabnikow na wage.'
    - 'carried_silver obnizone o 18 (event_turn_interlude_083) - skrzynia ksiag po
      zmarlym balwierzu kupiona na wage 15, obiad dla npc_hesk_dorn 3.'
    - 'SPRZEDAZ LUPU CMENTARNEGO (event_turn_interlude_111): syndykat placi 52 000 srebra za calosc, ryta trzecia i robota konsekracyjna wlacznie, przy wartosci brutto ok. 100 000. Wyplata w TRZECH RATACH - pierwsza 12 000 wydana w pokoju, w zlotej monecie, zeby dalo sie ja wyniesc. Pozostale 40 000 do odebrania. Udzialy Borosa i Mary ida OSOBNO, ze strony syndykatu, pelna stawka; dodatkowy procent schodzi z Lucana zgodnie z jego wlasna propozycja.'
    - 'carried_silver obnizone o 22 (event_turn_interlude_082) - "Uprzejmosci" 12,
      odpis brulionu formul prawnych 4, dwie akademickie odbitki po 3.'
    - 'carried_silver podniesione o 30, leftover_market_savings_silver wyzerowane
      (event_turn_interlude_081) - Lucan zabral ze schowka w murze reszte z targu po Akcie 1
      i zostawil hidden_silver: 50 nietkniete, zgodnie z wlasna decyzja.'
    - 'carried_silver podniesione o 15 (event_turn_interlude_012_reception_desk) - standardowe stypendium polowe za dni pracy przy operacji cmentarnej. Pelna nagroda/uznanie za Akt 2 NIE jest w tym - czeka na przeglad kierownictwa gildii, zlanie sie z nadchodzacym przesluchaniem instytucjonalnym (objective_claim_act_02_rewards).'
