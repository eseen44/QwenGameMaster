    if_it_surfaces:
      text: |
        W MOMENCIE, W KTORYM TEN SYGNET WYPLYNIE, WLASCICIEL WIE, ZE OKRADLA GO GILDIA
        ALBO LUCAN. Nie jest to nowa wiedza - podejrzewa to i tak - ale podejrzenie i
