        text: |
          NIE MA TU ZADNEJ EKSPOZYCJI I NIE BUDOWAC JEJ PONOWNIE. Wlasciciele posesji
          WIEDZA, ze rzeczy znikly, i wiedza, ze ktos je zabral. NIE WIEDZA: kto, ani co
          dokladnie. Nikt nie prowadzi spisu, ktory dalby sie porownac z czymkolwiek -
          poprzedni zapis narratora zakladal istnienie dwoch list (rzeczy przekazanych
          i audytu majatku) i ich zestawienie. Takich list w kanonie NIE MA.
        co_z_tego_wynika: |
          Lucan stojac przed nimi ma WOLNY WYBOR WERSJI: ze przedmiot jest z gildii, albo
          ze go znalazl. Zadna z tych wersji nie jest do podwazenia, bo nie ma z czym jej
          skonfrontowac. Ambiwalencja nie jest krucha - jest domyslna.
        jedyny_realny_koszt: |
          SERAPHINE moze sie POIRYTOWAC, ze Lucan zainteresowal sie tym pierscieniem
          dopiero teraz - to ona dostala od niego dokumenty z garbarni
          (fact_seraphine_received_tannery_evidence). Jest to irytacja o TIMING, nie
          podejrzenie o kradziez, i tyle wolno z tego zrobic.
