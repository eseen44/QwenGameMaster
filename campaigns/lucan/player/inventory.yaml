      the_shield: 'AMBIWALENCJA JEST OSLONA: Lucan DOKUMENTY oficjalnie PRZEKAZAL GILDII
        (tak brzmi jego wlasne roszczenie), wiec trop wskazuje na PARE "gildia albo Lucan",
