  - id: item_library_marked_volume
    name: Akademicki podrecznik przywracania ruchu i oddechu (sygnatura biblioteki Akademii)
    location: wall_hideout
    type: stolen_institutional_property
    identification: examined_event_turn_interlude_085
    subject: 'Przywracanie ruchu i oddechu cialu, ktore przestalo - utopieni, porazeni,
      zaczadzeni, pozornie zmarli. Rzecz licencjonowana i recenzowana.'
    provenance: Skradziony przez balwierza; przywrocenie utopionego to jedyny cud, ktory
      balwierz moze zrobic publicznie i za ktory moze policzyc.
    previous_owner: 'CZARNORYNKOWY BALWIERZ (deklaracja gracza, event_turn_interlude_173).
      Probowal przywracac swiezych topielcow BEZ POMOCY MAGII - czysta anatomia - i MIAL PEWNE
      SUKCESY. To ostatnie nie jest nowym faktem, tylko nazwaniem istniejacego zapisu: marginalia
      mowia "wiekszosc konczy sie nie", czyli mniejszosc konczy sie inaczej. Kradziez tego
      konkretnego podrecznika ma wiec jawny motyw. Ocena Lucana podana Neris w t_173: swiat
      takich ludzi potrzebuje; dla niego to potrzebny rzemieslnik, dla npc_ivar_kolm ten sam
      czlowiek jest potencjalnym liszem. Roznica nie siedzi w notatkach, tylko w tym, kto je
      pierwszy oprawi w zdanie.'
    defence_value: 'MOCNIEJSZY FUNDAMENT NIZ ARGUMENT O ODZYWIANIU (rozebrany w
      retcon_000023). Instytucja, ktora bedzie Lucana sadzic, trzyma we wlasnej bibliotece
      licencjonowany traktat o przywracaniu ruchu ciala, ktore stanelo - granica zywe/martwe
      jest u nich samych opisana jako CIAGLOSC z procedura. Jezyk i precedens z ich wlasnej
      polki, nie uniewinnienie.'
    marginalia: 'Ta sama reka co w atlasach - proby balwierza: kto, kiedy, jak dlugo pod
      woda, czy wrocil. Wiekszosc konczy sie nie. Sekwencja prob i granica, po ktorej
      przestawal. POSZERZONE deklaracja gracza w event_turn_interlude_172: notatek jest DUZO
      i sa WIDOWISKOWE, nie tylko rzeczowe - balwierz lubil makabreski i preparowanie, wiec
      rejestr prob idzie w parze z temperatura zapisu. To one, a nie stan fizyczny, sa
      dewastacja tomu w rozumieniu biblioteki (patrz condition). Reka jedna, ta sama co
      w atlasach - drugiej kanon nie ustanawia.'
    condition: 'ZDEWASTOWANY W ROZUMIENIU BIBLIOTEKI - ustanowione w event_turn_interlude_171,
      doprecyzowane przez gracza 2026-08-30. NIE chodzi o zniszczenie fizyczne (przetarcia,
      zalanie, brak kart). Chodzi o to, ze egzemplarz jest GESTO ZAPISANY ODRECZNYMI NOTATKAMI
      Z BRUDNEJ PRAKTYKI. W podreczniku, po ktory moze siegnac student, to samo w sobie
      dyskwalifikuje tom z polki - i to jest wlasciwy powod, dla ktorego zwrot idzie przez
      czlowieka, a nie przez ciche odlozenie. Wczesniejsze zdarzenia opisywaly TRESC tomu
      i wypalona w okladce sygnature (t_083 p.3, t_085 p.2 i 4), ale nie kwalifikowaly stanu.'
    what_the_margins_are_not: 'ROZGRANICZENIE (uwaga gracza 2026-08-30, sprawdzone w t_083/t_085).
      Material o cichym lataniu ludzi - kto, kiedy, CO ZSZYTE, ile zaplacono - siedzi w BRULIONIE
      balwierza (item osobny) i w ATLASACH anatomicznych, a nie w tym tomie. Zadna z tych dwoch
      rzeczy nie ma znaku wlasnosci ani nie figuruje w rejestrze ubytkow i zostaje u Lucana.
      Marginalia TEGO tomu to proby przywracania topielcow: kto, kiedy, jak dlugo pod woda, czy
      wrocil, wiekszosc konczy sie nie. Jedna reka, ta sama co w atlasach - drugiej reki kanon nie
      ustanawia. Nie mieszac tych trzech przedmiotow.'
    borrowing_record: 'NIE JEST WYPOZYCZONY NA LUCANA (event_turn_interlude_171). Spojne z provenance:
      skradziony przez balwierza, do Lucana trafil ze skrzyni po zmarlym. Nie ma karty wypozyczenia,
      ktora dalo by sie po cichu zamknac, wiec zwrot wymaga czlowieka, nie polki.'
    not_a_threat:
      established: retcon_000055 (reklamacja gracza 2026-08-27)
      text: 'BRAKUJACA KSIAZKA BIBLIOTECZNA NIE JEST WEKTOREM ZAGROZENIA I NIE WOLNO JEJ TAK
        ROZGRYWAC. Rzecz jest zwyklym, licencjonowanym podrecznikiem medycznym, a Lucan ma
        doktorat tej Akademii, dawny dorobek badawczy oraz formalnie zachowane stanowisko
        i pokoj. Najgorszy realny skutek to KARA
        BIBLIOTECZNA albo nota w aktach - nie sprawa, nie dowod rzeczowy, nie dzwignia.
        Rejestr ubytkow owszem istnieje i owszem ma date; to nadal jest ksiegowosc biblioteki,
        nie material na przesluchanie. Nie budowac z tego terminow, wyborow moralnych ani
        nocnych wypraw. Poprzednia wersja tego pola nazywala to problemem - to byla
        dramatyzacja trywialu, ten sam tryb awarii co retcon_000015/23/29/31/33/54.'
    disposition: keep_then_return_after_study
    return_window:
      source_event_id: retcon_000059
      corrected_by: retcon_000059
      declared_by: player
      plan: 'Najpierw powiedziec Neris, ze ksiazke trzeba zwrocic, i opisac jej historie.
        W nocy przekartkowac tom, zeby niczego nie stracic, a potem go oddac. Te czynnosci
        sa dopiero planem, nie zostaly wykonane. Gracz nie spodziewa sie duzej wartosci tomu.'
      where_it_is: 'container_wall_hideout = zone_wall_void w loc_city_wall_hideout
        (Opuszczona baszta przy murze), obok stolu warsztatowego. NIE ma tam trasy kanalem;
        wlaz istnieje jako droga dla stonog, nie jako droga Lucana.'
      distance: 'Trzy kwadranse marszu cela gildii <-> baszta (event_turn_interlude_086,
        zmierzone w fikcji). To sprawa wieczoru, nie calej nocy.'
      route: 'USTALONA W event_turn_interlude_171: jawny zwrot przez bibliotekarza, spotkanie umawia
        Neris. Bibliotekarz nie ma karty NPC - zwykly urzednik, sprawa rutynowa, patrz not_a_threat.
        Zdewastowany tom oddany z wyjasnieniem to sprawa introligatorska albo oplata, nie zdarzenie.'
      marginalia_note: 'Marginalia balwierza (proby na topielcach) nie sa tresci licencjonowana,
        wiec przepisanie ich recznie zajmuje wiecej niz przepisanie traktatu. To jedyny realny
        koszt czasu i NIE jest to zagrozenie - patrz not_a_threat.'
