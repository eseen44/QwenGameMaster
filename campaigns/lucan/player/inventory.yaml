    provenance: |
      ZE SKRYTKI OBECNEGO WLASCICIELA GARBARNI (Akt 1) - drewniany futeral pod zelaznymi
      drzwiczkami w podlodze tylnego magazynku, otwartymi jego wlasnym pekiem kluczy.
      Opisana w zrodle jako "bogato zdobiona, zdecydowanie droga i KOMPLETNIE NIEPASUJACA
      DO GARBARZA". Pod nia lezal dokument z herbem, ktory "wymienia jego nazwisko ORAZ
      WCZESNIEJSZEGO POSIADACZA SZABLI" - czyli szabla juz raz zmienila rece w sposob
      wymagajacy dokumentu. Lucan wtedy sam skomentowal: "mozliwe, ze te szable sam
      wczesniej komus zajebal".
    why_it_was_disfigured: |
      Oszpecenie NIE bylo kaprysem estetycznym - bylo zerwaniem tego wlasnie tropu.
      Zdjecie herbu i ozdob zamienia rozpoznawalny lup z czyjegos rodu w anonimowe
      narzedzie pracy. Nosi ja jednak PRZY SOBIE, co znaczy, ze jedyny przedmiot wprost
      wiazacy go z wlamaniem do skrytki chodzi z nim po miescie.
    hook_two_owners: 'Wczesniejszy posiadacz szabli jest kandydatem numer jeden na
      powiazanie obecnego wlasciciela z poprzednim - patrz
      planning/act-03-anticipated-shape.yaml#watek_garbarni_dwaj_wlasciciele.'
    source_refs: [source_luka_b_fragment#line:3541-3657, source_luka_b_fragment#line:4702-4780]
