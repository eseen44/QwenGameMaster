    - 'SPRZEDAZ LUPU CMENTARNEGO (event_turn_interlude_111): syndykat placi 52 000 srebra za calosc, ryta trzecia i robota konsekracyjna wlacznie, przy wartosci brutto ok. 100 000. Wyplata w TRZECH RATACH - pierwsza 12 000 wydana w pokoju, w zlotej monecie, zeby dalo sie ja wyniesc. Pozostale 40 000 do odebrania. Udzialy Borosa i Mary ida OSOBNO, ze strony syndykatu, pelna stawka; dodatkowy procent schodzi z Lucana zgodnie z jego wlasna propozycja.'
