  - id: item_courtesies_curse_book
    name: Uprzejmosci
    location: carried
    type: training_manual
    inherently_magical: false
    instructional_function: reproducible_curse_procedures_disguised_as_court_etiquette
    level: Wyzszy niz item_beginner_curses_book - zbior praktyka, nie podrecznik dla poczatkujacych.
    read_status: read_event_turn_interlude_092_theory_absorbed_practice_pending
    thesis: 'To ksiazka O DOSTARCZANIU, w ktorej klatwy sa przy okazji. Kazdy rozdzial to
      okazja towarzyska - powitanie, toast, kondolencje, pozegnanie, przedstawienie
      mlodszego starszemu - a procedura jest NIESIONA przez sama uprzejmosc: nosnikiem
      jest forma, ktora cel przyjmuje dobrowolnie i ktorej nie moze odrzucic bez obrazy.
      Uderza w to, co w klatwach jest trudne (dostarczenie rozstrzyga sie osobno od
      odpornosci, system/curses.md).'
    price_of_the_method: 'Zeby dzialac, Lucan musi byc OBECNY, poprawny i rozpoznany -
      czyli w tych sytuacjach, ktorych unikal przez dwa lata i ktore nadchodza potrojnie:
      przesluchanie, seminarium, rodzina. Czytanie defensywne daje liste tego, na co
      patrzec, gdyby ktos probowal zrobic to JEMU.'
    contents:
      source_event_id: event_turn_interlude_091
      calibration: 'Poprawione poza gra 25.08.2026. Ksiazka NIE jest zbiorem subtelnych
        cantripow. Rozdzialy to okazje towarzyskie, bo tym jest DOSTARCZENIE, ale ladunki
        sa realne: klatwy poziomu 1-2 wg system/metamagic.md, przez dotyk taniejace o okolo
        jeden poziom (system/curses.md#dotyk-jako-kanal-dostarczenia). Ksiazka daje WEKTOR;
        celowanie wnosi sam Lucan - anatomia, fizjologia i chemia zycia sa jego osia
        precision kupiona wiedza, nie energia.'
      delivery_chapters:
      - 'POWITANIE - usciska dloni albo pocalunek w dlon. Nie trzeba sie znac. Najkrotszy
        kontakt, najszybsza procedura.'
      - 'TOAST - nosnikiem naczynie, nie skora. Klasa opozniona, kontakt i objaw rozjezdzaja
        sie w czasie.'
      - 'KONDOLENCJE - dlon na przedramieniu, jedyny dotyk, ktorego nikt nie odmawia, a cel
        jest juz rozproszony.'
      - 'PRZEDSTAWIENIE I UKLON - kontakt minimalny, pierwszenstwo jako nosnik.'
      - 'POZEGNANIE - dotyk rozstania, klasa opozniona: efekt zaczyna sie, gdy rzucajacego
        juz nie ma w pomieszczeniu.'
      - 'PODARUNEK - przedmiot jako nosnik przedluzajacy dotyk w czasie, dziala bez obecnosci
        Lucana. Najdrozsza i najwolniejsza procedura w zbiorze.'
      payloads_physical_combat:
      - 'SKURCZ OGNISKOWY (tier 1 dotykiem). Zaciska jedna grupe miesniowa - dlon na rekojesci,
        przepone, kark. Przeciwnik nie puszcza broni, bo NIE MOZE jej puscic, albo nie moze
        nabrac powietrza. Rozstrzyga starcie bez zadnego widocznego czaru.'
      - 'SKURCZ KRTANI (tier 1-2). Cel nie moze mowic ani krzyknac. Wartosc nie jest bojowa,
        tylko operacyjna: nie ma alarmu, nie ma swiadka, ktory zawola.'
      - 'ZAPASC ORTOSTATYCZNA (tier 1, opozniona). Spadek cisnienia przy wstawaniu - cel mdleje,
        kiedy sie podnosi. Czyta sie jako choroba, nie jako atak.'
      payloads_biological_torture:
      - 'UCZULENIE (tier 2, persistence). Zamienia nastepny kontakt celu z pospolita
        substancja - kurz, welna, ryba, wino - w gwaltowna reakcje alergiczna. Zaprzeczalne
        doskonale, bo alergie istnieja. Moze zabic i to tez jest czescia narzedzia.'
      - 'WYRZUT HISTAMINY W SKORZE (tier 1-2). Babel, palenie i obrzek pod ubraniem. Czysty
        bol bez dowodu poza wysypka.'
      - 'SWIAD NIE DO ZDRAPANIA (tier 1, duration). Kilka dni bez snu. Tortura, ktora nie
        zostawia niczego do pokazania.'
      - 'WYRZUT HORMONOW (tier 2). Serce wali, pot, drzenie, panika bez powodu. Podane przed
        przesluchaniem robi z kompetentnego czlowieka kogos, kto wyglada na winnego i
        niewiarygodnego. Najgrozniejsza rzecz w tej ksiazce, bo jest calkowicie niewidzialna.'
      payloads_mental_interrogation_and_erasure:
      - 'USYPIANIE (tier 1-2 dotykiem). Nie "czar snu", tylko narastajace cisnienie senne
        przechodzace w sen prawdziwy. Cel budzi sie i obwinia wino albo dlugi dzien.'
      - 'ZAPADNIA PAMIECI (tier 2). Rodzina misnotice, ale mocniejsza: wspomnienie twarzy nie
        konsoliduje sie, wiec godzine pozniej cel nie potrafi Lucana OPISAC. To jest wprost
        narzedzie do usuwania wlasnej obecnosci i w obecnej sytuacji Lucana najcenniejsza
        procedura w calym zbiorze.'
      - 'ROZWIAZANIE JEZYKA (tier 2). Obnizenie hamowania, jak po alkoholu - cel mowi. Metoda
        przesluchania, po ktorej badany pamieta mila rozmowe, nie przesluchanie.'
      - 'PODTRZYMANY LEK ALBO ZAL (tier 1-2, duration). Utrzymuje stan emocjonalny swiezym
        przez dni i degraduje osad. Wolne, tanie i trudne do powiazania z kimkolwiek.'
      cost_note: 'Wg system/metamagic.md i precedensu Mroznego Dotyku: tier 1 to okolo 1
        jednostki, tier 2 okolo 2, a dotyk zbija to o mniej wiecej jeden poziom. Przy rezerwie
        15 oznacza to rzad wielkosci kilkunastu klatw poziomu 2 na dobe, o ile Lucan ma kogo
        dotknac. Wąskim gardlem jest OKAZJA, nie energia.'
      defensive_reading: 'Te same rozdzialy od drugiej strony to lista tego, na co patrzec,
        gdyby ktos probowal zrobic to Lucanowi: kto podaje reke pierwszy, kto nalega na toast,
        czyje kondolencje trwaja o dwie sekundy za dlugo.'
      learning_cost: 'Godzina lektury dala STRUKTURE i teze, zero opanowanych procedur. Kazda
        procedura jest osobnym punktem cwiczen (progression_curses_and_misdirection, E_to_low_D).'
    location_note: 'Idzie z Lucanem do celi - przebrana za podrecznik dworskich
      grzecznosci, wiec jest jedna z niewielu ksiazek, ktore w kwaterze czlonka gildii
      wygladaja wlasciwie (event_turn_interlude_091).'
    cost_silver: 12
    disguise: Kazdy rozdzial o powitaniu, toascie i kondolencjach jest procedura klatwy;
      z zewnatrz ksiega dworskich grzecznosci. Klatwy sa w Lumarii legalna sztuka, wiec
      przebranie nie jest konieczne prawnie - jest wygodne spolecznie.
    study_status: not_yet_studied
    source_refs: [event_turn_interlude_081, event_turn_interlude_082]
