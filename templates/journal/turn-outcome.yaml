# AUDYT: DECYZJE I ŹRÓDŁA, nie esej i nie samo-raport. Progi sprawdza `turn commit`:
#   - najwyżej 3x długość `prose`, najwyżej 4 000 znaków (2 000 bez prozy autorskiej);
#   - żadnej sekcji `STAN` (stan jest w plikach stanu, a brief go wypisuje);
#   - żadnej sekcji `CZEGO NARRATOR NIE ZROBIŁ` (to sprawdza 11 bramek w preflight).
# Co tu należy: co rozstrzygnięto i z jakiego pliku, które fakty weszły do czyjej wiedzy,
# jakie pola stanu ruszono i dlaczego, co zostało NIEUSTALONE. Źródła konsekwencji mają
# własne, walidowane pole `consequence_source_refs` - nie powtarzaj ich prozą.
summary: Krótki faktyczny opis rezultatu.
# PROZA TURY. Do 2026-09-09 tego pola nie było w szablonie i nikt go nie sprawdzał, a to
# ona - nie `summary` - jest tym, co `gm recent` podaje przy otwarciu następnej sesji jako
# jedyną próbkę języka. Wychodziło z tego streszczenie protokołu zapisane zdaniami: w turach
# 236-248 zero kwestii wprost i 20 konstrukcji „powiedział, że...".
# KONTRAKT (system/npc-voice.md, sprawdza `turn commit`):
#   - narracja, nie protokół: żadnego rachunku zasobów, powołań na pliki, „zmierzone";
#   - kwestia, która rozstrzyga scenę, PADA W DIALOGU, nie w parafrazie narratora;
#   - najwyżej jedna wycena decyzji (`retcon_000162`); literalna cena przy zakupie,
#     honorarium albo kwocie jest w porządku i nie jest liczona;
#   - „nie X, tylko Y" najwyżej raz i nie u dwóch postaci w tej samej scenie.
prose: |
  Scena o długości odpowiedniej do działania: przestrzeń, percepcja, reakcja świata.
  Ważne kwestie padają wprost. Opis i dobrowolna zaczepka są dozwolone, ale nie
  obowiązkowe. Bez instrukcji narratora, ID, bilansu zasobów i decyzji za Lucana.
apply_required_costs: true
resolved_world_reaction_ids: []
# Przy napięciu 0 wymagane dla worsened/complicated/mixed: istniejący plik,
# event/retcon albo player_declaration:...
consequence_source_refs: []
operations: []
# Przy przejsciu miedzy lokacjami ustaw scene_update.location_ref i pelna liste
# scene_update.participants. To zapis obecnosci, nie polecenie ruchu: pozycje cial
# zmieniaj osobno operacjami set na position. Nie przenos automatycznie calej druzyny.
scene_update: null
# NOWY PUNKT DECYZJI JEST OPCJONALNY. `commit` przepisuje to pole do
# `scene.immediate_questions`, a puste pole ZOSTAWIA poprzednie pytanie w mocy - i to jest
# poprawne zachowanie w spokojnej turze. Do 2026-09-09 szablon zadal tego pola zawsze, więc
# każda tura musiała wyprodukować nowy ostry dylemat; najtańszym sposobem produkcji dylematu
# jest kazać NPC wygłosić diagnozę, która go otwiera. Stąd „każda kwestia kończy się
# kontrtezą". Wypełniaj, gdy sytuacja FAKTYCZNIE się zmieniła; w interludium przy napięciu 0
# pomijaj bez wyrzutów sumienia (`retcon_000142`).
new_decision: null
