<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title desc">
  <title id="title">Mapa MG — demonstracyjna piwnica</title>
  <desc id="desc">Pełny rzut piwnicy, w tym sekretne przejście za wschodnią ścianą.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d8d1c5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="880" height="440" fill="#f4efe5"/>
  <text x="60" y="30" font-family="sans-serif" font-size="18" font-weight="700">Demonstracyjna piwnica — pełny widok MG</text>
  <rect x="80" y="60" width="480" height="320" fill="url(#grid)" stroke="#332f2a" stroke-width="8"/>
  <rect x="120" y="260" width="80" height="60" fill="#9a6f42" stroke="#49331f" stroke-width="3"/>
  <line x1="120" y1="290" x2="200" y2="290" stroke="#49331f" stroke-width="2"/>
  <text x="125" y="250" font-family="sans-serif" font-size="14">F1 skrzynie</text>
  <circle cx="420" cy="220" r="24" fill="#77716a" stroke="#332f2a" stroke-width="3"/>
  <text x="392" y="190" font-family="sans-serif" font-size="14">F2 filar</text>
  <rect x="280" y="52" width="80" height="16" fill="#6e4728" stroke="#332f2a" stroke-width="2"/>
  <text x="276" y="90" font-family="sans-serif" font-size="14">F3 drzwi</text>
  <rect x="280" y="360" width="80" height="20" fill="#aaa39a" stroke="#332f2a" stroke-width="2"/>
  <path d="M290 365 h60 M300 371 h50 M310 377 h40" stroke="#5b5752" stroke-width="2"/>
  <text x="278" y="405" font-family="sans-serif" font-size="14">C1 wejście / schody</text>
  <path d="M560 180 h60 v60 h-60" fill="#d9bdd8" stroke="#7c2f75" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="560" y1="180" x2="560" y2="240" stroke="#bd2020" stroke-width="6" stroke-dasharray="6 5"/>
  <text x="575" y="170" font-family="sans-serif" font-size="13" fill="#7c2f75">S1 sekretne przejście</text>
  <text x="635" y="220" font-family="sans-serif" font-size="12" fill="#7c2f75">do nieznanej lokacji</text>
  <text x="92" y="82" font-family="sans-serif" font-size="12" fill="#5a554f">Z1</text>
  <text x="680" y="280" font-family="sans-serif" font-size="15" font-weight="700">Legenda</text>
  <text x="680" y="305" font-family="sans-serif" font-size="13">Z1 — główna sala</text>
  <text x="680" y="327" font-family="sans-serif" font-size="13">F1/F2/F3 — elementy</text>
  <text x="680" y="349" font-family="sans-serif" font-size="13">C1 — schody</text>
  <text x="680" y="371" font-family="sans-serif" font-size="13" fill="#7c2f75">S1 — sekretne przejście</text>
  <path d="M835 75 v-35 M835 40 l-8 14 M835 40 l8 14" stroke="#222" stroke-width="3" fill="none"/>
  <text x="827" y="95" font-family="sans-serif" font-size="14">N</text>
  <line x1="80" y1="420" x2="160" y2="420" stroke="#222" stroke-width="5"/>
  <line x1="80" y1="414" x2="80" y2="426" stroke="#222" stroke-width="2"/>
  <line x1="160" y1="414" x2="160" y2="426" stroke="#222" stroke-width="2"/>
  <text x="101" y="411" font-family="sans-serif" font-size="13">2 m</text>
