schema_version: 1
id: lore_magic_intuitive_and_procedural
object_type: world_lore
status: approved_current_user_decision
name: Intuicyjna natura magii i proceduralna wiedza
principles:
  energy_direction: intuitive_for_a_capable_practitioner
  possible_procedures_for_one_effect: unbounded
  equal_effect_does_not_imply_equal_efficiency: true
  optimization_dimensions: [energy, time, stability, geometry, trace, safety, repeatability]
  formal_spell: reproducible_optimized_pattern
magic_books:
  inherently_magical: false
  function: preserve_and_communicate_working_intuitions_visualizations_and_procedures
  scientific_explanation_required: false
  copying_preserves_instructional_value: true
  reader_still_requires: [compatible_energy_channel, practice, comprehension_or_working_visualization]
implications:
  - Intuitive experimentation can discover effects before theory explains them.
  - False or metaphorical explanations may still encode reproducible procedures.
  - Academies gain power by cataloguing, comparing and optimizing patterns.
  - Amateur manuals can mix fiction, errors and genuinely usable fragments.
curses_and_magical_traces:
  status: approved_current_user_decision
  source: 'Korekta gracza 2026-08-20 (przed rollbackiem tur 039-041). Narrator budowal napiecie
    na "sladach" po klatwach i po zniku tak, jakby rzucenie czaru bylo zdarzeniem
    kryminalistycznym. W tym swiecie nie jest.'
  rules:
  - 'Lumaria to miasto, w ktorym wszyscy caly czas rzucaja czary. Samo uzycie magii nie jest
    zdarzeniem i nie zwraca uwagi.'
  - 'KLATWY NIE SA NEKROMANCJA. Sa uwazane za obrzydliwe, ale sa LEGALNE jako sztuka. Najwyzej
    stanowia dowod uzycia mocy na cywilu - to zupelnie inna, lzejsza kategoria niz praktyka
    nekromancji.'
  - 'Klatwy NIE zostawiaja zadnego trwalego sladu. Ktos moze wyczuc rzucanie W TRAKCIE, a ktos
    sprawny moze rozpoznac osobe POD ich wplywem - ale nastepnego dnia na miejscu nie ma
    niczego, co mowiloby o ich uzyciu.'
  narrator_constraints:
  - 'Nie budowac watkow sledczych na "sladzie po czarze pozostawionym na miejscu". Slad istnieje
    tylko w chwili rzucania (swiadek magicznie pismienny) albo w osobie bedacej pod wplywem.'
  - 'Nie mieszac klatw z nekromancja w ocenie prawnej ani w reakcjach NPC.'
  - 'To NIE uniewaznia casting_profile poszczegolnych zdolnosci (np. strong trace przy
    wzmocnieniu) jako sygnalu dla obecnego, magicznie pismiennego swiadka - uniewaznia
    natomiast slad odtwarzalny po fakcie.'
source_refs: [source_user_decisions_current#calibration:intuitive-procedural-magic-and-nonmagical-books, source_user_decisions_current#canon:curses_are_legal_art_and_leave_no_lasting_trace]
